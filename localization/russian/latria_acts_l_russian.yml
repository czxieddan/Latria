 latria_solo_relief_night_tt: "Вы надеетесь провести ночь наедине с собой."
 latria_act.0201.t: "Внутренние покои"
 latria_act.0201.desc: "Я жду, пока внешняя комната опустеет и даже последняя проходящая лампа удалится, прежде чем сам опускаю засов. Когда голоса исчезают, лишь фитиль иногда трещит.\n\nОдежда лежит на стуле. Я приглушаю лампу, пока у постели не остаётся одна свеча, и долго лежу в постели, где нет второго человека. Ночь не коротка. Иные желания приходят ясно и уходят медленно, как вода, омывающая один и тот же камень, отступающая и тихо возвращающаяся.\n\nКогда дыхание наконец выравнивается, в окне уже день. Я слушаю собственное сердце, потом пустую комнату и лишь затем вспоминаю, что надо разгладить постель и придать ночи вид, будто ничего не было."
 latria_act.0201.a: "Одеться и открыть засов."
 latria_act.0301.t: "Предел тела"
 latria_act.0301.desc.illness: "Ночь ещё не совсем прошла, а недомогание приходит раньше утра.\n\nЯ хочу сесть. Вместо этого жар поднимается ко лбу. Руки и ноги словно заменили чужими: я пробую дважды, и они всё равно не слушаются. Постель тяжела и горяча, даже в дыхании есть сухая сладость. Я хочу позвать того, кто снаружи, но звук доходит только до губ.\n\nСвет медленно собирается у окна. Я смотрю, как он переходит раму, надеясь, что жар скоро уйдёт, и подозревая, что он не будет так послушен."
 latria_act.0301.desc.stress: "Тело остановилось, и я вынул руки из-под покрывала, но мысли не остановились.\n\nЯ лежу без сна и несколько раз возвращаюсь к ночи. Где сбилось дыхание, какую фразу не следовало произносить и где я загнал себя слишком далеко: всё остаётся ясным. За пологом тихо, и тишина только делает мысли громче. Даже далёкий оклик сторожа словно считает их.\n\nЯ поворачиваюсь и поворачиваюсь снова. Близко к рассвету подушка уже несколько раз меняла направление, а я всё ещё не сплю."
 latria_act.0301.desc.health: "Я хочу встать за чашей воды. Едва нога касается пола, комната темнеет.\n\nЯ хватаюсь за край постели и прижимаю лоб к собственной руке. Сердце бьётся быстро и пусто, будто я долго бежал, хотя только приподнялся с подушки. Чаша всего в нескольких шагах, и всё в комнате осталось на месте. Кажется, тело дошло до конца.\n\nПроходит время, прежде чем темнота отступает. В конце я не иду за водой. Я только снова ложусь."
 latria_act.0301.a: "Лечь и ни о чём не думать."
 latria_act.0311.t: "Долгое истощение"
 latria_act.0311.desc.illness: "Это не обрушилось на меня за одну ночь.\n\nТе чрезмерные ночи лежали порознь, и я всё верил, что один сон и одна горячая еда их оплатят. Сегодня утром жар расходится от груди к пальцам, и я понимаю, что они давно соединились. Вода не снимает сухости. Покрывала не греют. Даже ветер у окна словно проходит сквозь кости.\n\nЯ лежу, слушая проходящих снаружи людей, и даже силу для зова приходится беречь. Болезнь не ворвалась. Она постепенно поселилась во мне."
 latria_act.0311.desc.stress: "Усталость не в членах. Она лежит на сне и не пускает меня внутрь.\n\nЯ закрываю глаза, и дневные лица, ночное дыхание и мгновения, о которых я не успел пожалеть, теснятся вместе. Тело слишком истощено, чтобы поднять руку, а ум остаётся зажжённым достаточно ярко, чтобы утомлять. Я считаю свои вдохи и стражи за окном. Ничто не может затемнить эти образы.\n\nПетух пропел, и настал день. Я только перекладываюсь с одной стороны подушки на другую и не засыпаю."
 latria_act.0311.desc.infertile: "Сперва не пришёл один знак. Я не принял его близко к сердцу, но потом таких дней стало много.\n\nЯ считал дни, которые должны были наступить, и не хотел о них говорить, боясь, что сказанное сделает их настоящими. Сегодня лекарь наконец кладёт передо мной то, вокруг чего я всё ходил: моё тело больше не может понести ребёнка. Его голос негромок, но ничто другое в комнате не может его покрыть.\n\nПосле его ухода я кладу руку на живот. Проходит много времени, прежде чем я позволяю этим словам по-настоящему лечь."
 latria_act.0311.desc.health: "Раньше я мог бы назвать эту слабость следствием слишком позднего сна и пережить её чашей горячего вина и половиной дня покоя.\n\nТеперь даже чтобы сесть, нужно остановиться на краю постели. Пояс кажется тяжелее прежнего, и чаша тоже. Расстояние от окна до двери кажется длиннее, чем оно есть. Только увидев свой цвет в зеркале, я верю, что этот долг не оплатить ночью или двумя покоя. Человек в стекле смотрит на меня так, будто узнал это раньше меня.\n\nЯ снова ложусь. На этот раз тело решает раньше меня."
 latria_act.0311.a: "Отложить дневные дела и соблюдать постельный покой."
 latria_act_exhausted_health: "Изнеможение"
 latria_act_exhausted_health_desc: "Тело ещё не восстановилось."
 latria_act_depleted_health: "Подорванное здоровье"
 latria_act_depleted_health_desc: "Долгое перенапряжение повредило телу."

