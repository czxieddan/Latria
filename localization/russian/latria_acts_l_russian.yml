 death_latria_intercourse_strain: "умирает во время плотских утех"
 death_latria_manual_strain: "умирает от любовных ласк"

 latria_act.0101.t: "За дверью"
 latria_act.0101.desc: "Когда дверь закрывается, в коридоре ещё тихо разговаривают. Шаги удаляются, и полоска света в щели сужается вместе с ними. Только тогда я оборачиваюсь и вижу, что [latria_partner.GetShortUIName] уже сидит на краю постели: одежда всё ещё лежит на руке, словно о ней забыли, войдя.\n\nЛампа приглушена. Никто из нас не берёт то, что лежит на стуле, но постель скоро теплеет. Ночь тянется так медленно, что я слышу каждый тихий треск фитиля. Когда я снова смотрю в окно, уже светло, и внешняя половина постели остыла.\n\nСлуга стучит дважды и останавливается, словно не уверен, можно ли уже нас беспокоить. Только тогда я вспоминаю, сколько дел уже ждёт меня днём."
 latria_act.0101.desc.adultery: "Я долго слушаю у двери. Голоса в коридоре редеют, и даже слуга уходит с пустой лампой, прежде чем я приоткрываю щель и пропускаю [latria_partner.GetShortUIName] боком. Засов издаёт лишь тихий звук. Сегодня ночью он будто длится долго.\n\nМы говорим тихо. Не раз снаружи проходят шаги, и мы замираем, затаив даже дыхание, пока они не удалятся. Свет лампы падает на занавеси и на наши глаза всякий раз, когда они обращаются к щели.\n\nПеред уходом [latria_partner.GetSheHe] оглядывается на меня с порога. Повторять незачем. Никто больше не должен узнать об этой ночи."
 latria_act.0101.desc.dead: "Сперва мне кажется, что [latria_partner.GetShortUIName] просто крепко [Select_CString(latria_partner.IsFemale, 'уснула', 'уснул')]. Я произношу [latria_partner.GetHerHis] имя у самого уха, потом подношу лампу к [latria_partner.GetHerHis] лицу. Пламя вздрагивает и всё ещё показывает мне глаза, которые не отвечают.\n\nЯ кладу ладонь на [latria_partner.GetHerHis] грудь. Тишина под ней пугает меня. Постель хранит тепло минуты назад, подушка — свою вмятину, но дыхания уже нет. Я держу [latria_partner.GetHerHis] руку, пока она холодеет, словно это ещё может вернуть [Select_CString(latria_partner.IsFemale, 'её', 'его')] к жизни.\n\nНаконец я резко открываю дверь и зову лекаря. Мой голос ударяется о коридор и возвращается, уже не похожий на мой."
 latria_act.0101.desc.adultery_dead: "Я [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал')], худшим в эту ночь будет, если кто-нибудь откроет дверь и увидит двоих, которых не должны были увидеть вместе.\n\nВместо этого [latria_partner.GetShortUIName] падает [Select_CString(latria_partner.IsFemale, 'первой', 'первым')]. Я зову [Select_CString(latria_partner.IsFemale, 'её', 'его')], трясу [Select_CString(latria_partner.IsFemale, 'её', 'его')] и подношу лампу к [latria_partner.GetHerHis] лицу. Глаза не открываются. У губ не шевелится дыхание. Рука, ещё тёплая минуту назад, мало-помалу холодеет в моей.\n\nСнаружи слышны шаги. Я смотрю на смятую постель, ещё не надетую одежду и на человека, который уже не проснётся. Когда дверь откроется, у меня не найдётся даже одной готовой фразы."
 latria_act.0101.desc.actor_dissatisfied: "Ночь ещё глубока, когда я сажусь и снова натягиваю рукав на руку.\n\n[latria_partner.GetShortUIName] поворачивается под покрывалом, словно хочет ещё что-то сказать, и легко касается моего запястья. Я чувствую только, какими долгими и пустыми были эти часы. Даже желания протянуть руку больше нет. В лампе трещит искра, но в комнате не становится теплее.\n\nЯ беру одежду со стула, не оглядываясь. Иные встречи тем сильнее заставляют желать коридора, чем дольше их не заканчивают."
 latria_act.0101.desc.partner_dissatisfied: "Приходя, [latria_partner.GetShortUIName] [Select_CString(latria_partner.IsFemale, 'остановилась', 'остановился')] в дверях, сперва [Select_CString(latria_partner.IsFemale, 'посмотрела', 'посмотрел')] на лампу, потом на меня, словно [Select_CString(latria_partner.IsFemale, 'не хотела', 'не хотел')] сразу начинать эту ночь.\n\nУходит гораздо быстрее. Пояс ещё не завязан, а [latria_partner.GetSheHe] уже покидает постель, избегая и моего взгляда, и моих рук. Я называю [latria_partner.GetHerHis] имя. В ответ слышу одно короткое слово и не получаю прощания. Когда дверь закрывается, поднятый ею сквозняк наклоняет пламя.\n\nКомната ещё хранит [latria_partner.GetHerHis] присутствие. Край постели уже остыл, словно там никто не сидел."
 latria_act.0101.desc.manual: "До постели дело не доходит.\n\n[latria_partner.GetShortUIName] садится рядом и начинает говорить о незаконченных дневных делах, но обрывает фразу на середине. Поцелуи легки, а ласки остаются на рукаве или в волосах. За окном проходит оклик сторожа. Никто из нас его не считает.\n\nНаконец кончается масло в лампе. Мы ещё немного сидим в темноте, слушая, как дыхание становится ровным, и потом поправляем рукава. Для этой ночи довольно и того."
 latria_act.0101.a: "Открыть дверь и вернуться к дню."
 latria_act.0102.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы')] напомнить [latria_actor.GetShortUIName], как уже поздно и что завтра будут ждать люди. Слова доходят до губ и не идут дальше.\n\nКогда дверь закрыта, шаги и голоса отступают. Свет лампы греет занавеси, и никто из нас не спешит подняться. Я слушаю, как [latria_actor.GetHerHis] дыхание переходит от смятения к покою, и [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] забываю час. Когда я снова смотрю к окну, уже светло. Слуги снаружи, вероятно, ждут давно.\n\nТолько тогда я отпускаю [latria_actor.GetHerHis] руку. Некоторые ночи не следует торопить к концу."
 latria_act.0102.desc.adultery: "Когда [latria_actor.GetShortUIName] собирается уйти, я подхожу к двери и прикладываю ухо к дереву.\n\nКоридор некоторое время пуст. Потом кто-то проходит с лампой. Её свет медленно пересекает щель и медленно уходит. Мы молчим и не даём даже одежде издать звук. Когда тишина возвращается, [latria_actor.GetSheHe] наконец поправляет одежду.\n\nЯ открываю дверь лишь настолько, чтобы [latria_actor.GetSheHe] [Select_CString(latria_actor.IsFemale, 'могла', 'мог')] пройти боком. По крайней мере сегодня ночью тайна всё ещё принадлежит нам двоим."
 latria_act.0102.desc.partner_dissatisfied: "Пока дверь не закрылась, я ещё [Select_CString(ROOT.Char.IsFemale, 'представляла', 'представлял')], какой может быть ночь. Я даже заранее [Select_CString(ROOT.Char.IsFemale, 'подняла', 'поднял')] фитиль лампы.\n\nКогда мы и вправду остаёмся одни, ожидание остывает. [latria_actor.GetHerHis|U] руки, дыхание и вся близость, которая должна была меня удержать, словно доходят сквозь что-то. Я отвечаю, но глаза всё возвращаются к двери, а мысли — к коридору за ней.\n\nВ конце я поднимаюсь [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым')] и поправляю рукав. Эта ночь не стоила времени, проведённого в ожидании."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] поднимается, не дав мне снова зажечь лампу. У окна остаётся лишь немного бледного света.\n\nЯ ещё лежу и ищу фразу, которая не дала бы ночи оборваться так резко. [latria_actor.GetSheHe|U] отворачивается, произносит две небрежные фразы и уже завязывает пояс, не принимая одежду, которую я протягиваю. Я ещё говорю, когда [latria_actor.GetSheHe] идёт к двери.\n\nВ открытую дверь входит холодный воздух. Иные разочарования не нуждаются в объяснении."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] не ведёт меня к постели, а садится рядом и отодвигает подушку между нами.\n\nНеоконченные дневные дела внезапно кажутся способными подождать. Мы меняемся поцелуями и несколькими фразами, которые незачем заканчивать. Руки задерживаются на рукаве или в волосах и не идут глубже. За окном всё ещё темно, и оклик сторожа ещё далеко.\n\nПри расставании [latria_actor.GetSheHe] разглаживает складку на моей одежде, которую я [Select_CString(ROOT.Char.IsFemale, 'сама смяла', 'сам смял')]. Ночь короткая, но не оставляет чувства, будто чего-то недостаёт."

 latria_scheme.0010.t: "Плотские утехи"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "Мой [spouse|E]"
 latria_scheme.0010.t.concubine: "Моя [concubine|E]"
 latria_scheme.0010.t.soulmate: "Моя [soulmate|E]"
 latria_scheme.0010.t.lover: "Мой [lover|E]"
 latria_scheme.0010.t.adultery: "Связь на стороне"
 latria_scheme.0010.desc: "Свечи ещё горят, но [target.GetShortUIName] больше мне не отвечает.\n\nЯ произношу [target.GetHerHis] имя и прикладываю ухо к [target.GetHerHis] губам. Там ничего нет. Кожа под пальцами холоднее, чем мгновение назад, хотя наше тепло ещё держится в постели. Рука выскальзывает из моей и не возвращается.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался')] убрать кубки, одежду и всякий след этой ночи до рассвета. Теперь рядом лежит человек, который больше не шевельнётся. Окно бледнеет, и я не знаю, что следует скрыть первым."
 latria_scheme.0010.a: "Натянуть на [Select_CString(target.IsFemale, 'неё', 'него')] покрывало и открыть дверь."
 latria_scheme.0020.t: "Ночь ожидания"
 latria_scheme.0020.desc: "Масло в лампе убыло, а шагов [target.GetFirstName] у двери всё нет.\n\nЯ дважды согреваю вино и снова складываю одежду на стуле. Иногда кто-то проходит по коридору. Когда шаги приближаются, я задерживаю дыхание. Когда они удаляются, я опять [Select_CString(ROOT.Char.IsFemale, 'одна', 'один')]. Каждый раз мне кажется, что это [target.GetSheHe].\n\nНаконец свеча вспыхивает в последний раз, и воск падает в поддон. Только тогда я признаю: ночь кончилась. Вино, слова и заготовленная отговорка не понадобятся."
 latria_scheme.0020.a: "Погасить свет. Ждать незачем."
 latria_scheme.0030.t: "Слишком поздняя весть"
 latria_scheme.0030.desc: "Я ещё взвешиваю, какая боковая дверь укромнее и какое приглашение вызовет меньше подозрений, когда весть кладут на стол.\n\n[target.GetFirstName] уже [Select_CString(target.IsFemale, 'покинула', 'покинул')] этот мир. Слов на бумаге немного. Я читаю их долго. Неотправленные письма, заученные коридоры, отговорка для одной этой ночи — всё разом стало ненужным.\n\nЯ выливаю ещё тёплое вино. Иные приготовления могут дождаться лучшей ночи. Ни одно не обгонит смерть, которая уже случилась."
 latria_scheme.0030.a: "Сжечь неотправленное письмо."
 latria_scheme.0040.t: "Оборванная нить"
 latria_scheme.0040.desc: "Я посылаю человека найти [target.GetFirstName] и жду от полудня до зажжения ламп. Возвращается лишь неясный ответ: встретиться уже нельзя.\n\nМожет быть, дверь стерегут внимательнее. Может быть, чей-то взгляд стал осторожнее. А может быть, [target.GetSheHe] просто больше не хочет подходить к лампе, которую я [Select_CString(ROOT.Char.IsFemale, 'оставила', 'оставил')] гореть для [Select_CString(target.IsFemale, 'неё', 'него')]. Я спрашиваю дважды. Посланный не знает ничего больше.\n\nПричина уже не важна. Нить порвалась между пальцами. Я комкаю бумажку с записанным часом, пока пот не смазывает знаки."
 latria_scheme.0040.a: "На этом всё кончается."

