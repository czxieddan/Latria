 latria_act.0301.t: "Предел тела"
 latria_act.0301.desc.illness: "После этой ночи ваш лоб горит, а руки и ноги отказываются слушаться."
 latria_act.0301.desc.stress: "Даже когда вы останавливаетесь, мысли остаются напряжёнными."
 latria_act.0301.desc.health: "Вы опираетесь на край постели. Тело достигло своего предела."
