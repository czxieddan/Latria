 latria_wedding_night.t: "Брачная ночь"
 latria_wedding_night.desc: "Гости, проводившие новобрачных в покои, наконец разошлись. Смех остаётся в коридоре, но дверь закрыта и оставляет снаружи дневные любезности, благословения и будто бесконечное вино.\n\nСвет лампы греет занавеси. Постель только что постлана, одежда только что сменена, и даже то, как они смотрят друг на друга, ещё немного непривычно. [latria_actor.GetShortUIName] и [latria_partner.GetShortUIName] некоторое время сидят лицом к лицу. Никто не спешит заговорить первым. Они только слушают, как люди за дверью постепенно удаляются.\n\nПосле этой ночи они уже не будут только той новобрачной парой, о которой говорили гости."
 latria_serene_mind: "Свежесть и безмятежность"
 latria_serene_mind_desc: "Близость, принёсшая глубокое удовлетворение, бодрит тело и разум."
