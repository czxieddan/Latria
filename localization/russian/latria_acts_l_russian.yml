 latria_act.0311.t: "Долгое истощение"
 latria_act.0311.desc.illness: "Долгое потакание желаниям наконец сломило вас, и болезнь охватывает тело."
 latria_act.0311.desc.stress: "Накопившаяся усталость не даёт вам уснуть."
 latria_act.0311.desc.infertile: "Ваше тело больше не способно дать жизнь ребёнку."
 latria_act.0311.desc.health: "Даже встать стало трудно. Тело достигло своего предела."
