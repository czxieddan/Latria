 latria_act.0101.t: "За дверью"
 latria_act.0101.desc: "Дверь закрывается, шаги в коридоре затихают. [latria_partner.GetShortUIName] и я остаёмся вместе до рассвета.\n\nЛишь стук слуги напоминает мне о дневных делах."
 latria_act.0101.desc.adultery: "Я жду, пока коридор опустеет, прежде чем впустить персонажа [latria_partner.GetShortUIName].\n\nПеред расставанием мы договариваемся об одном: никто не должен узнать об этой ночи."
 latria_act.0101.desc.dead: "Я повторяю имя [latria_partner.GetShortUINamePossessive], потом ещё раз. Ни ответа, ни дыхания.\n\nЯ распахиваю дверь и кричу, чтобы кто-нибудь привёл врача."
 latria_act.0101.desc.adultery_dead: "Мне казалось, что худшее — быть застигнутыми, но [latria_partner.GetShortUIName] падает без чувств и больше не приходит в себя.\n\nСнаружи приближаются шаги. Как мне это объяснить?"
 latria_act.0101.desc.actor_dissatisfied: "Я встаю ещё затемно. [latria_partner.GetShortUIName] словно хочет что-то сказать, но с меня довольно этой неудачной встречи."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] уходит куда поспешнее, чем приходит. [latria_partner.GetSheHe|U] избегает моего взгляда и не прощается."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] и я находим тихое место, довольствуясь поцелуями и ласками. Никто из нас не следит за временем."
 latria_act.0101.a: "Уйти"
 latria_act.0102.desc: "Я не прошу персонажа [latria_actor.GetShortUIName] уйти. За закрытой дверью эта ночь принадлежит нам.\n\nК рассвету слуги уже давно ждут снаружи."
 latria_act.0102.desc.adultery: "Прежде чем [latria_actor.GetShortUIName] уйдёт, я прислушиваюсь у двери.\n\nКоридор пуст. По крайней мере этой ночью наша тайна остаётся при нас."
 latria_act.0102.desc.partner_dissatisfied: "Мне так хотелось уединиться с персонажем [latria_actor.GetShortUIName], но теперь я хочу лишь уйти. Эта ночь едва ли стоила ожидания."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] нетерпеливо встаёт. Я пытаюсь заговорить, но [latria_actor.GetSheHe] бросает лишь несколько резких слов и направляется к двери."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] садится рядом со мной. На время мы забываем о делах, не прося друг у друга ничего, кроме поцелуев и ласк.\n\nМы расстаёмся ещё затемно."

