l_russian:
 latria_sexual_frustration_flavor.1401.t: "Отложенная печать"
 latria_sexual_frustration_flavor.1401.desc.female: "Я сижу у постели в ночной рубашке и складываю письмо снова и снова. На нём нет имени, и я всё ещё не решаюсь скрепить его печатью."
 latria_sexual_frustration_flavor.1401.desc.male: "Я сижу на краю постели в ночной рубашке, держа печатку. Если записать эти слова, больше нельзя будет притворяться, что таких мыслей никогда не было."
 latria_sexual_frustration_flavor.1401.desc: "Я поднимаю печатку и вновь кладу её, так и не коснувшись листа."
 latria_sexual_frustration_flavor.1401.a: "Дописать письмо до конца и поставить печать."
 latria_sexual_frustration_flavor.1401.b: "Убрать печатку, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1402.t: "Последний пир"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Пир подходит к концу, а гости всё ещё открыто говорят о любовниках, помолвках и прежних утехах. Я больше не могу воспринимать их слова как праздную болтовню."
 latria_sexual_frustration_flavor.1402.desc.strict: "Кто-то называет аристократа, впавшего в немилость из-за неосмотрительного романа, и за столом становится тихо. Я знаю, что такой же приговор могут обратить против меня."
 latria_sexual_frustration_flavor.1402.desc: "На столах беспорядок, гости уходят, но мысль во мне звучит всё громче."
 latria_sexual_frustration_flavor.1402.a: "Удержать последних гостей за столом и вновь и вновь говорить о своих тревогах."
 latria_sexual_frustration_flavor.1402.b: "Подавить мысль, поблагодарить хозяев и уйти."

 latria_sexual_frustration_flavor.1403.t: "Исповедь без свидетелей"
 latria_sexual_frustration_flavor.1403.desc.favors: "У алтаря пусто. Я помню, что моя вера допускает плотские утехи, но всё ещё не знаю, как унять этот порыв."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Я стою на коленях перед алтарём в одиночестве, одежда в порядке, но молитва каждый раз обрывается на одних словах. Если никто меня не слышит, нарушен ли мой обет?"
 latria_sexual_frustration_flavor.1403.desc: "Святилище опустело. Я ещё не ухожу."
 latria_sexual_frustration_flavor.1403.a: "Больше не давать обетов воздержания и признать свой выбор."
 latria_sexual_frustration_flavor.1403.b: "Сдержать желание и стоять на коленях до утренней молитвы."

 latria_sexual_frustration_flavor.1404.t: "Назвать тоску"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Я стою без одежды перед зеркалом в покоях и не отвожу взгляд от своего отражения. Надоело называть желание мимолётной слабостью."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Я сижу у постели без одежды, в одиночестве, сцепив руки. Если мне удастся сдержать обет, то не потому, что эта тоска исчезла."
 latria_sexual_frustration_flavor.1404.desc: "Глубокая ночь. Наконец я перестаю скрывать от себя своё желание."
 latria_sexual_frustration_flavor.1404.a: "Признать свою тоску и перестать бороться с ней этой ночью."
 latria_sexual_frustration_flavor.1404.b: "Снова одеться и подавить мысль."

 latria_sexual_frustration_flavor.1405.t: "Страница в летописи"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Летописец ждёт, пока я решу, что заслуживает памяти. Стоя за его спиной в парадном одеянии, я понимаю, что молчание не избавит от этого мучения."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Писец сидит за столом и спрашивает, стоит ли внести в летопись эту часть пути. Я смотрю на неотправленное письмо и знаю, что эти слова отправятся со мной дальше."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Я надеваю облачение и встаю перед писцом. И обет, и желание правдивы; я не позволю другому решать, что из этого достойно памяти."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Писец ждёт, чтобы записать мои слова. В парадной одежде, перед слугами, я говорю о том, что так долго таится внутри."
 latria_sexual_frustration_flavor.1405.desc: "Я решаю больше не держать это при себе."
 latria_sexual_frustration_flavor.1405.a: "Пусть списки расходятся, чтобы все могли прочитать."
 latria_sexual_frustration_flavor.1405.b: "Пусть писец запишет лишь мои обязанности, а остальное придётся проглотить."

 latria_sexual_frustration_flavor.1406.t: "Когда гости уходят"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Последние гости всё ещё говорят о любовниках и помолвках. Едва я начинаю свою старую историю, кто-то за столом усмехается."
 latria_sexual_frustration_flavor.1406.desc.strict: "До стола доходит весть об аристократе, впавшем в немилость из-за неосмотрительного романа. Я ещё не успеваю прикусить язык, а соседи уже шепчутся и кто-то смеётся."
 latria_sexual_frustration_flavor.1406.desc: "Гости уходят, но я всё не замолкаю. Соседи обмениваются взглядами, и кто-то за столом усмехается."
 latria_sexual_frustration_flavor.1406.a: "Продолжать рассказ и отвечать перед всем столом каждому насмешнику."
 latria_sexual_frustration_flavor.1406.b: "Промолчать, поклониться собравшимся и попрощаться."

 latria_sexual_frustration_flavor.1407.t: "Молитва после свечи"
 latria_sexual_frustration_flavor.1407.desc.favors: "Сидя у постели в ночной рубашке, я вспоминаю, что моя вера не отвергает радостей плоти. В одиночестве я всё ещё не знаю, как успокоиться."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Я запахиваю ночную рубашку и повторяю обет целомудрия. Свеча догорает, но внутренняя тоска не угасает."
 latria_sexual_frustration_flavor.1407.desc: "В покоях осталась лишь одна угасающая свеча, а я всё бодрствую."
 latria_sexual_frustration_flavor.1407.a: "Отложить обет целомудрия и предаться мыслям об этой привязанности."
 latria_sexual_frustration_flavor.1407.b: "Унять мысли и читать молитвы до рассвета."

 latria_sexual_frustration_flavor.1408.t: "Молчание перед зеркалом"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Без одежды, в одиночестве перед зеркалом, я больше не могу называть эту тоску мимолётной мыслью. Да и притворяться иначе не хочу."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Я сижу у постели без одежды и сцепляю руки. Целомудрие остаётся моим выбором, но ещё никогда он не давался так трудно."
 latria_sexual_frustration_flavor.1408.desc: "В тишине я смотрю на своё отражение и перестаю избегать того, что таится в сердце."
 latria_sexual_frustration_flavor.1408.a: "Признать это желание и перестать бежать от него этой ночью."
 latria_sexual_frustration_flavor.1408.b: "Одеться, сесть за стол и подавить мысль."

 latria_sexual_frustration_flavor.1409.t: "Потеря самообладания при дворе"
 latria_sexual_frustration_flavor.1409.desc: "Во время перерыва в совете я раздеваюсь в соседней комнате. Прежде чем я успеваю надеть одеяние, дверь в зал совета открывается. Вельможи замолкают, писец опускает глаза; мой голос срывается, пока слуга стоит рядом с одеянием."
 latria_sexual_frustration_flavor.1409.a: "Стоять перед ними, не пытаясь скрыть свою оплошность."
 latria_sexual_frustration_flavor.1409.b: "Отпустить вельмож и одеться, прежде чем продолжать совет."

 latria_sexual_frustration_flavor.1410.t: "Ночь за дверью"
 latria_sexual_frustration_flavor.1410.desc.female: "Я сижу у двери в ночной рубашке и слышу, как снаружи затихают шаги. В поздний час безответное чувство вновь возвращается ко мне."
 latria_sexual_frustration_flavor.1410.desc.male: "Я опираюсь на постель в ночной рубашке, книга всё ещё не раскрыта. В коридоре тихо, но сон не приходит."
 latria_sexual_frustration_flavor.1410.desc: "Ночь долгая. За дверью ничто не шелохнётся, и мысли не успокаиваются."
 latria_sexual_frustration_flavor.1410.a: "Отложить книгу и написать длинное письмо."
 latria_sexual_frustration_flavor.1410.b: "Подавить тоску, погасить лампу и лечь."

 latria_sexual_frustration_flavor.1401.c: "Обратить в стихи приглашение, которое я не могу отправить."
 latria_sexual_frustration_flavor.1402.c: "Заплатить музыкантам, чтобы они сыграли для оставшихся гостей."
 latria_sexual_frustration_flavor.1402.d: "Попросить гостей остаться и поговорить о прежних странствиях."
 latria_sexual_frustration_flavor.1403.c: "Раскрыть писание и искать ответ в каждом отрывке."
 latria_sexual_frustration_flavor.1404.c: "Отречься от обета целомудрия и впредь следовать своим желаниям."
 latria_sexual_frustration_flavor.1404.d: "Надеть ночную рубашку и сидеть, пока мысли не улягутся."
 latria_sexual_frustration_flavor.1405.c: "Переделать рассказ в личное письмо и запереть его в шкатулке."
 latria_sexual_frustration_flavor.1405.d: "Дать обет целомудрия перед этими свидетелями."
 latria_sexual_frustration_flavor.1406.c: "Прочитать новое стихотворение для уходящих гостей."
 latria_sexual_frustration_flavor.1407.c: "Закрыть молитвенник и не спеша обдумать свои чувства."
 latria_sexual_frustration_flavor.1408.c: "Перечислить утренние обязанности и привести все бумаги в порядок."
 latria_sexual_frustration_flavor.1409.c: "Одеться, вернуться за стол и завершить все придворные дела."
 latria_sexual_frustration_flavor.1409.d: "Одеться, пошутить и вновь предложить вельможам сесть."
 latria_sexual_frustration_flavor.1410.c: "Надеть одеяние, заварить чай и сидеть, пока не удастся уснуть."
