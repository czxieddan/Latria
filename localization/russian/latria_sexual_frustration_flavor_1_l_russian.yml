l_russian:
 latria_sexual_frustration_flavor.1001.t: "Долгая ночь за занавесью"
 latria_sexual_frustration_flavor.1001.desc.female: "Я сижу у окна в ночной рубашке, держа на коленях нераспечатанное письмо. Написавший его давно уехал, а я всё думаю о том, что осталось несказанным."
 latria_sexual_frustration_flavor.1001.desc.male: "Я сижу у окна в ночной рубашке, держа на коленях нераспечатанное письмо. Знакомый почерк на конверте напоминает о желании, так и не нашедшем ответа."
 latria_sexual_frustration_flavor.1001.desc: "Час поздний, и прежние мысли возвращаются вновь."
 latria_sexual_frustration_flavor.1001.a: "Дочитать письмо и подумать о его авторе."
 latria_sexual_frustration_flavor.1001.b: "Запереть письмо и подавить эту мысль."
 latria_sexual_frustration_flavor.1001.c: "Взять чистый лист и сложить из этого стихи."

 latria_sexual_frustration_flavor.1002.t: "Пряности на пиру"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Зал полон ароматов пряностей и песен, и никого из гостей не тревожат блуждающие взгляды. Но я всматриваюсь в каждое лицо, словно кто-то ещё может появиться."
 latria_sexual_frustration_flavor.1002.desc.strict: "Пряности оживляют пир, но каждый смешок напоминает мне, как пристально обычай следит за своевольным желанием. Я едва не забываю о кубке в руке."
 latria_sexual_frustration_flavor.1002.desc: "Пир шумен. Мои мысли всё равно блуждают."
 latria_sexual_frustration_flavor.1002.a: "Вставить в разговор несколько нежных слов."
 latria_sexual_frustration_flavor.1002.b: "Опустить взгляд, поблагодарить хозяина и уйти."
 latria_sexual_frustration_flavor.1002.c: "Перед уходом попросить музыкантов сыграть ещё одну мелодию."
 latria_sexual_frustration_flavor.1002.d: "Собрать гостей за одним столом и провести вечер в беседе."

 latria_sexual_frustration_flavor.1003.t: "Проповедь в саду"
 latria_sexual_frustration_flavor.1003.desc.favors: "Проповедник говорит, что плотские утехи не обязательно оскорбляют нашу веру. Эти слова должны утешать меня, но внутреннее беспокойство не унимается."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Проповедник говорит о целомудрии и воздержании. Я слышу каждое слово, но не могу сосредоточиться на писании."
 latria_sexual_frustration_flavor.1003.desc: "Я выслушиваю проповедь до конца. Ветер переворачивает страницу, а мысли так и не успокаиваются."
 latria_sexual_frustration_flavor.1003.a: "Закрыть книгу и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1003.b: "Отбросить эти мысли и присоединиться к чтению."
 latria_sexual_frustration_flavor.1003.c: "Попросить проповедника объяснить каждый отрывок."

 latria_sexual_frustration_flavor.1004.t: "Беспокойный сокол"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Сокол бьёт крыльями на моей перчатке, следя за далёкими голубями. Мне хорошо знаком этот порыв, но я не нахожу места, где успокоить собственные мысли."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Сокол беспокойно топчется на моей перчатке. Я сосредотачиваюсь на поводьях и зове, но мысли в голове куда труднее укротить."
 latria_sexual_frustration_flavor.1004.desc: "Охотники ждут, когда я подзову сокола, но я не могу сосредоточиться на охоте."
 latria_sexual_frustration_flavor.1004.a: "Пусть спутники подождут, пока я предаюсь своим мыслям."
 latria_sexual_frustration_flavor.1004.b: "Собраться с мыслями и привести охотничьи снасти в порядок."
 latria_sexual_frustration_flavor.1004.c: "Медленно пригладить перья и снова попробовать подать зов."

 latria_sexual_frustration_flavor.1005.t: "Между заседаниями совета"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Вельможи разошлись, оставив на столе карты и печати. Я сижу в одиночестве во главе стола; рядом с неоконченными бумагами лежит старое письмо."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Спутники договорились о следующем броде, но карта всё ещё лежит на столе. Я придвигаю старое письмо к лампе и теряю строку в списке припасов."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Собрание окончено, на столе остались счета и писание. Я достаю из книги старое письмо, и беспокойные мысли возвращаются."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Совет окончен, но бумаги и печати остались. Я разглаживаю рукав; старое письмо рядом удерживает моё внимание крепче любой петиции."
 latria_sexual_frustration_flavor.1005.desc: "Дела ждут, но старое письмо всё отвлекает моё внимание."
 latria_sexual_frustration_flavor.1005.a: "Отложить дела и перечитать старое письмо."
 latria_sexual_frustration_flavor.1005.b: "Убрать письмо и вернуться к обязанностям."
 latria_sexual_frustration_flavor.1005.c: "Распределить оставшуюся работу и позволить себе короткий отдых."
 latria_sexual_frustration_flavor.1005.d: "Разобрать все дела и завершить каждое."

 latria_sexual_frustration_flavor.1006.t: "Старое письмо при свечах"
 latria_sexual_frustration_flavor.1006.desc.female: "Я сижу под лампой в ночной рубашке, касаясь пальцами сгибов старого письма. В нём нет обещания, лишь привязанность, которая ещё не угасла."
 latria_sexual_frustration_flavor.1006.desc.male: "Я сижу у постели в ночной рубашке. Знакомый почерк старого письма напоминает о чувстве, так и не нашедшем взаимности."
 latria_sexual_frustration_flavor.1006.desc: "Ночь тиха, но слова старого письма всё ещё стоят перед глазами."
 latria_sexual_frustration_flavor.1006.a: "Дочитать письмо до конца."
 latria_sexual_frustration_flavor.1006.b: "Убрать письмо, погасить свечу и лечь спать."

 latria_sexual_frustration_flavor.1007.t: "Прежде чем закончится пир"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Кто-то вспоминает прежнего любовника, и никто за столом не обижается. Я поднимаю кубок вместе со всеми, но взгляд всё возвращается к пустому месту."
 latria_sexual_frustration_flavor.1007.desc.strict: "Неосмотрительный роман приводят в назидание, и разговор обращается к репутации и обычаю. Я разглаживаю рукав и молчу."
 latria_sexual_frustration_flavor.1007.desc: "Музыка продолжается, хотя мои мысли давно покинули этот стол."
 latria_sexual_frustration_flavor.1007.a: "Пусть услышат о моей тоске с самого начала."
 latria_sexual_frustration_flavor.1007.b: "Проглотить слова, поблагодарить хозяина и уйти."
 latria_sexual_frustration_flavor.1007.c: "Лучше расспросить соседа о путешествиях."

 latria_sexual_frustration_flavor.1008.t: "Молитва перед святыней"
 latria_sexual_frustration_flavor.1008.desc.favors: "Свеча перед святыней догорает. Моя вера не презирает радостей плоти, но я не могу унять внутренний порыв."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Я повторяю обет целомудрия перед святыней, но привычная молитва не раз прерывается на губах."
 latria_sexual_frustration_flavor.1008.desc: "Молитва окончена. Я остаюсь рядом со свечой."
 latria_sexual_frustration_flavor.1008.a: "Отложить обет воздержания и признать свою тоску."
 latria_sexual_frustration_flavor.1008.b: "Унять мысли и продолжить молитву."
 latria_sexual_frustration_flavor.1008.c: "Прочитать отрывок и обдумать его перед уходом."
 latria_sexual_frustration_flavor.1008.d: "Поддерживать огонь свечи и читать до рассвета."

 latria_sexual_frustration_flavor.1009.t: "Непрочитанная петиция"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Петиции покрывают длинный стол, и вельможи ждут моего слова. Я дважды читаю одну строку, но мысли блуждают где-то ещё."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Совет ещё не окончен, но я не могу понять ни слова в лежащих передо мной бумагах. Я закрываю книгу учёта и пытаюсь вернуться мыслями к делу."
 latria_sexual_frustration_flavor.1009.a: "Распустить совет и остаться со своими мыслями."
 latria_sexual_frustration_flavor.1009.b: "Собраться с мыслями и заняться каждой петицией."
 latria_sexual_frustration_flavor.1009.c: "Упорядочить решения, затем огласить каждое."

 latria_sexual_frustration_flavor.1010.t: "Возвращение орла"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Сокол кружит над лесом. Глядя, как он не хочет возвращаться, я вспоминаю, до чего утомительно отвергать каждое желание."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Ястреб всё ещё кружит вдали. Я затягиваю перчатку и заставляю себя слушать лишь зов охотников."
 latria_sexual_frustration_flavor.1010.desc: "Охотники ждут, чтобы свернуть лагерь, а я всё смотрю в небо над деревьями."
 latria_sexual_frustration_flavor.1010.a: "Пусть охотники ждут, пока мои мысли следуют за орлом."
 latria_sexual_frustration_flavor.1010.b: "Подать сигнал к возвращению и проверить охотничьи снасти."
 latria_sexual_frustration_flavor.1010.c: "Пройти вдоль леса, прежде чем вернуться к спутникам."

 nick_latria_the_unquiet: "Беспокойный"
 latria_flavor_focus: "Собранная воля"
 latria_flavor_focus_desc: "Этот персонаж сосредоточился на писании и повседневных обязанностях."
 latria_flavor_remorse: "Неотступное раскаяние"
 latria_flavor_remorse_desc: "Краткое утешение оставило нечистую совесть."
 latria_flavor_sullied: "Запятнанная репутация"
 latria_flavor_sullied_desc: "Слухи повредили положению и дружеским связям этого персонажа."
 latria_flavor_broken_sleep: "Недосып"
 latria_flavor_broken_sleep_desc: "Из-за недостатка сна этот персонаж рассеян и быстро устаёт."
 latria_flavor_vagabond_focus: "Сосредоточенность путника"
 latria_flavor_vagabond_focus_desc: "Дорожные хлопоты ненадолго успокаивают беспокойные мысли."
 latria_flavor_public_disgrace: "Публичный позор"
 latria_flavor_public_disgrace_desc: "Слухи о публичной оплошности повредили положению и дружеским связям этого персонажа."
 latria_flavor_hunting_focus: "Внимание к охоте"
 latria_flavor_hunting_focus_desc: "Этот персонаж сосредоточился на выслеживании добычи, соколиной охоте и верховой езде."
 latria_flavor_warm_company: "Приятная компания"
 latria_flavor_warm_company_desc: "Хорошая беседа побуждает этого персонажа чаще искать общества."
 latria_flavor_neglected_duties: "Заброшенные обязанности"
 latria_flavor_neglected_duties_desc: "Личные заботы отвлекли этого персонажа от обязанностей."
 latria_flavor_diligent_work: "Дела в порядке"
 latria_flavor_diligent_work_desc: "Этот персонаж направил беспокойные мысли на тщательное планирование и труд."
