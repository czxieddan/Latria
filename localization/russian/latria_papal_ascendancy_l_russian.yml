l_russian:
 h_latria_holy_see: "Святой престол"
 h_latria_holy_see_adj: "Католическ"
 nick_latria_vicar_of_christ: "Наместник Христа"

 latria_papal_ascendancy.0001.t: "Престол над всеми коронами"
 latria_papal_ascendancy.0001.desc: "Перед собравшимися прелатами я поднимаю руку над сломанными знамёнами тех, кто пришёл меня низложить. Бог сохранил своего наместника не ради торга с князьями. По Его воле Святой престол обретёт безраздельную власть и принесёт спасение в каждую державу."
 latria_papal_ascendancy.0001.a: "Пусть мир преклонится перед Святым престолом"

 latria_papal_ascendancy.0002.t: "Воля наместника"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] сокрушает войско, выступившее против Святого престола. Перед духовенством и побеждёнными князьями [latria_papal_victor.GetSheHe] провозглашает, что Бог даровал [latria_papal_victor.GetHerHim] безраздельную власть и поручил спасение мира."
 latria_papal_ascendancy.0002.a: "Начинается новый порядок"

 trait_latria_army_of_god: "Воинство Божье"
 trait_latria_army_of_god_desc: "Этот персонаж командует войском, посвящённым безраздельной власти Святого престола."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] командует войском, посвящённым безраздельной власти Святого престола."

 latria_papal_redemption_or_ruin: "Спасение или погибель"
 latria_papal_redemption_or_ruin_desc: "Потребовать от персонажа [recipient.GetShortUINameNoTooltip] подчинения Святому престолу и перехода в [rite|E] [actor.GetShortUINamePossessiveNoTooltip]. Отказ приведёт к войне."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] требует вашего подчинения Святому престолу и перехода в [actor.GetHerHis] [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "Малая [old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "Мало-[old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "Раскрыть тайну"
 latria_reveal_papal_secret_decision_desc: "Я объявлю свою тайну перед духовенством и князьями. Пусть каждый правитель услышит её из моих уст, а те, кто отрицает мой сан, берутся за оружие."
 latria_reveal_papal_secret_decision_tooltip: "Публично раскрыть свою связь на стороне и встретить войну за низложение."
 latria_reveal_papal_secret_decision_confirm: "Открыть её всем"
 latria_can_reveal_papal_secret_trigger: "У вас есть тайная связь на стороне, которую можно раскрыть"
 NOT_ANY_OF_MY_SECRETS: "Ни один из ваших секретов:"

 latria_papal_redemption_war: "Папская война за спасение"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Папское спасение"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective] война за спасение против державы [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective] война за спасение"
 latria_papal_redemption_war_victory_desc: "Обороняющаяся сторона понижается в ранге, становится вассалом Папы и принимает папское [rite|E]."
 latria_papal_redemption_war_white_peace_desc: "Требование о подчинении отозвано."
 latria_papal_redemption_war_defeat_desc: "Требование Папы о подчинении отвергнуто."

 latria_decision_immediate_effect_loc: "#high #bold Когда вы раскроете тайну:#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X Начнётся $latria_papal_scandal_depose_war$:#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "Независимые [rulers|E], следующие вашему [rite|E], и [vassals|E], не поддерживающие вас всецело, могут присоединиться к коалиции за ваше низложение."
 latria_decision_paramour_defense_tt: "Если ваш любовный партнёр — [ruler|E], он может присоединиться к обороняющейся стороне."
 latria_decision_allies_call_tt: "Ваши [allies|E] могут ответить на призыв и присоединиться к обороняющейся стороне."
 latria_decision_forced_defenders_tt: "Ваши марионеточные [rulers|E] и независимые правители, следующие вашему [rite|E] и имеющие [piety_level|E] «$piety_level_0$», могут присоединиться к обороняющейся стороне."
 latria_decision_disgraced_defenders_tt: "Персонажи, следующие вашему [rite|E], имеющие [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] или [GetTrait('fornicator').GetName(GetNullCharacter)] и располагающие войсками, могут присоединиться к обороняющейся стороне."
 latria_decision_hook_defenders_tt: "Ваши [hooks|E] могут быть использованы, чтобы привлечь к защите персонажей, следующих вашему [rite|E]."

 latria_decision_if_win_effect_loc: "\n#high #bold Если вы одержите победу в войне:#!#!\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "Атакующие [rulers|E], потерпев поражение, выплачивают репарации в виде [gold|E] и [prestige|E] согласно своему [title_tier|E]."
 latria_papal_scandal_reparations_first: "Атакующие [rulers|E], потерпев поражение, выплачивают вам [gold|E] и [prestige|E] согласно своему [title_tier|E]."
 latria_papal_scandal_reparations_third: "Атакующие [rulers|E], потерпев поражение, выплачивают персонажу [CHARACTER.GetShortUIName] [gold|E] и [prestige|E] согласно своему [title_tier|E]."
 latria_papal_scandal_ally_share_tt: "Участвующие в обороне [allies|E] делят между собой [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%] общей суммы репараций в виде [gold|E] и [prestige|E]."
 latria_papal_redemption_unlocked_tt: "Становится доступно [interaction|E] «$latria_papal_redemption_or_ruin$»."

 latria_decision_if_lose_effect_loc: "\n#high #bold Если вы потерпите поражение в войне:#!#!"
 latria_decision_defeat_imprison_tt: "Предводитель коалиции бросит вас в свой [dungeon|E]."
 latria_decision_if_white_peace_effect_loc: "\n#high #bold Если война закончится возвращением к статус-кво:#!#!"

 latria_papal_scandal_depose_war: "Война за низложение Папы"
 latria_papal_scandal_event_troops: "Папские подкрепления"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "Низложить Папу"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "Война за низложение: [DEFENDER.GetShortUINameNotMe]"
 latria_papal_scandal_depose_war_victory_desc_defender: "Вы теряете сан [head_of_faith|E]."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U] теряет [defender.GetHerHis] сан [head_of_faith|E]."
 latria_papal_scandal_depose_war_white_peace_desc: "Обе стороны заключают мир и сохраняют свои [titles|E]."
 latria_papal_scandal_depose_war_defeat_desc_defender: "Вы разбиваете коалицию и сохраняете сан [head_of_faith|E]."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U] разбивает коалицию и сохраняет сан [head_of_faith|E]."

 latria_papal_ascendancy.0010.t: "Призыв защитить Святой престол"
 latria_papal_ascendancy.0010.desc: "Ваш [ally|E], [latria_pope.GetShortUIName], противостоит коалиции, желающей низложить [Select_CString(latria_pope.IsFemale, 'её', 'его')] из-за связи на стороне. Ссылаясь на ваш союз, [latria_pope.GetSheHe] просит вас выступить против коалиции."
 latria_papal_ascendancy.0010.a: "Соблюсти священный союз и выступить в поход"
 latria_papal_ascendancy.0010.b: "Мы не можем воевать ради такого позора"
 latria_honored_papal_alliance_opinion: "Защита Святого престола"
 latria_refused_papal_alliance_opinion: "Нарушение союза с Папой"
 latria_ally_share_received_msg_title: "Благодарность Святого престола"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName] отправляет вам долю репараций побеждённых правителей."
 latria_ally_joined_defense_msg_title: "Союзник присоединяется к защите"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName] соблюдает ваш союз и вступает в войну против коалиции на вашей стороне."
 latria_ally_refused_defense_msg_title: "Союзник отклоняет призыв"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName] отклоняет ваш призыв защитить Святой престол."

 latria_papal_scandal_war.0001.t: "Призыв низложить Папу"
 latria_papal_scandal_war.0001.desc: "Правители берутся за оружие, чтобы низложить персонажа [latria_scandal_target.GetShortUIName], после того как [latria_scandal_target.GetHerHis] связь на стороне стала достоянием гласности. Их посланники прибывают ко мне ко двору с просьбой выступить вместе с коалицией."
 latria_papal_scandal_war.0001.a: "Взяться за оружие вместе с коалицией"
 latria_papal_scandal_war.0001.b: "Остаться в стороне от этой войны"
