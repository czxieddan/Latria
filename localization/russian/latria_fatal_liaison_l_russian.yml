l_russian:
 latria_fatal_liaison.1001.t: "Приглашение"
 latria_fatal_liaison.1001.desc: "Свечи зажжены раньше обычного, а вино отстоялось и потеряло холод. Я не написала ничего, что можно было бы прочесть вслух при дворе. Я отправляю только час и место.\n\n[target.GetFirstName] прочтёт это как обычное приглашение, потому что оно и есть обычное. Если [target.GetSheHe] придёт, то придёт ради одной ночи и ничего сверх неё. Всё, что будет после закрытой двери, — моя забота."
 latria_fatal_liaison.1001.a: "Позвать в опочивальню."
 latria_fatal_liaison.1001.b: "Позвать на вино в переднюю."
 latria_fatal_liaison.1001.c: "Отложить письмо. Будет другая ночь."
 latria_fatal_liaison.1001.d: "Сжечь письмо."
 latria_fatal_liaison_wait_tt: "Письмо не отправлено, и месяц проходит."

 latria_fatal_liaison.1101.t: "Как провести эту ночь"
 latria_fatal_liaison.1101.desc: "Жаровня растоплена с утра, а ставни с рассветной стороны закрыты. Слугам велено самим поднять вино и не стучать до света. Всё, что нужно этой ночи, уже в комнате.\n\nОстаётся только час. Держать [target.GetFirstName] без сна, пока свечи не станут огарками, или дать [target.GetHerHim] уснуть до худшего. Тело, которому не дали отдыха, выносит меньше, чем то, которому дали.\n\nРешаю сейчас, и один раз."
 latria_fatal_liaison.1101.a: "Не давать уснуть до последней свечи."
 latria_fatal_liaison.1101.b: "Дать уснуть до рассвета."
 latria_fatal_liaison.1101.c: "Пусть ночь идёт как идёт."

 latria_fatal_liaison.1102.t: "На лестнице"
 latria_fatal_liaison.1102.desc: "Я пропускаю [target.GetFirstName] вперёд и иду на несколько ступеней ниже. На середине [target.GetSheHe] останавливается, ладонью плашмя к стене, и стоит так, пока не вернётся дыхание. Потом улыбается, будто ничего не было.\n\nТакую задержку доводилось видеть у гостей, которые не дождались весны. Не говорю об этом. Только считаю, сколько это длится."
 latria_fatal_liaison.1102.a: "Считать секунды, пока [target.GetSheHe] не двинется дальше."
 latria_fatal_liaison.1102.b: "Спросить, был ли [target.GetSheHe] у лекаря."
 latria_fatal_liaison.1102.c: "Ничего не говорить и дать [target.GetHerHim] идти дальше."

 latria_fatal_liaison.1201.t: "Утро, и дыхание"
 latria_fatal_liaison.1201.desc: "Окно сереет прежде, чем я понимаю, чего не случилось. [target.GetFirstName] спит, и одеяло поднимается и опускается с размеренностью, которой не было в моих расчётах.\n\nЯ лежу неподвижно и слушаю. Ещё дважды, потом в третий раз. Ночь, которую я устроила, прошла, и мы оба ещё дышим.\n\nОстаётся лишь, чтобы меня нашли рядом с [target.GetHerHim] не спящей, и сказать, что спала хорошо."
 latria_fatal_liaison.1201.a: "Встать прежде, чем [target.GetSheHe] проснётся."

 latria_fatal_liaison.1211.t: "Тяжёлое утро"
 latria_fatal_liaison.1211.desc: "Я просыпаюсь с болью в каждом суставе и какое-то время не двигаюсь. [owner.GetFirstName] уже не спит, лежит рядом и смотрит в потолок; [owner.GetSheHe] не сразу замечает, что мои глаза открыты.\n\nМожет быть, ночь была длиннее, чем помнится. Может быть, я уже не в том возрасте. Я медленно сажусь и собираю одежду.\n\nУ двери я оборачиваюсь один раз и не могу сказать зачем."
 latria_fatal_liaison.1211.a: "Закрыть за собой дверь."

 latria_fatal_liaison_bedchamber_modifier: "У ложа"
 latria_fatal_liaison_antechamber_modifier: "В передней"
 latria_fatal_liaison_demanding_night_modifier: "Ночь без меры"
 latria_fatal_liaison_measured_night_modifier: "Ночь по мерке"
 latria_fatal_liaison_weakness_modifier: "Известная слабость"
 latria_fatal_liaison_whisper_modifier: "Тихий вопрос"
