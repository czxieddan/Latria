l_russian:
 latria_flavor_distracted: "Погружённость в свои мысли"
 latria_flavor_distracted_desc: "Личные мысли постоянно отвлекают этого персонажа от учёбы и повседневных дел."
 latria_flavor_composure: "Самообладание"
