 latria_flavor_observance: "Соблюдение обрядов"
 latria_flavor_observance_desc: "Усердные молитвы и чтение священных текстов снискали этому персонажу уважение единоверцев."
 latria_flavor_reliable: "Надёжность"
 latria_flavor_reliable_desc: "Этот персонаж не позволяет личным заботам мешать долгу и тщательно ведёт свои дела."
