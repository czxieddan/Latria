 latria_charming_abduction.1001.t: "Обещание у изголовья"
 latria_charming_abduction.1001.desc: "Вода в купальне остывает, но аромат всё ещё держится в спальне. Я кладу одеяние у постели и обращаюсь к незапечатанному письму на столе. Не хватает лишь строки, из-за которой [target.GetFirstName] не сможет уснуть.\n\nМои люди знают боковую дверь и каждый поворот коридора. Если [target.GetSheHe] отпустит [target.GetHerHis] слуг ради обещанной нежной ночи, тяжёлые занавеси многое скроют. Что до утех, которые [target.GetSheHe] воображает и которых [target.GetHerHim] предстоит ждать в моей постели... сначала [target.GetSheHe] должен переступить порог."
 latria_charming_abduction.1001.a: "Сказать [target.GetHerHim], что я буду ждать у постели."
 latria_charming_abduction.1001.b: "Пригласить [Select_CString(target.IsFemale, 'её', 'его')] выпить во внешних покоях. Тёплое вино, приглушённый свет."
 latria_charming_abduction.1001.c: "Запечатать письмо. Найдётся ночь получше."
 latria_charming_abduction.1001.d: "Бросить письмо в огонь. На этом всё."
 latria_charming_abduction_wait_tt: "Продолжить приготовления и дождаться следующей возможности действовать."

 latria_charming_abduction.1101.t: "След аромата"
 latria_charming_abduction.1101.desc: "С ответом персоны по имени [target.GetFirstNamePossessive] приходит шёлковая лента, завязанная так свободно, что хватило бы лёгкого движения, чтобы развязать её. Слова по-прежнему благопристойны, но последние строки теснятся: [target.GetSheHe] торопится закончить, не желая откладывать перо.\n\nЯ наматываю ленту на палец. Какой аромат придать следующему письму? И какие мысли принесёт он в [target.GetHerHis] постель?"
 latria_charming_abduction.1101.a: "Капнуть духов на строку, где я упоминаю ночь."
 latria_charming_abduction.1101.b: "Назначить час. Оставить письмо без подписи."
 latria_charming_abduction.1101.c: "Положить ответ под подсвечник. Пусть подождёт."

 latria_charming_abduction.1102.t: "Ещё одна пара глаз"
 latria_charming_abduction.1102.desc: "Сведения о вечерних привычках персоны по имени [target.GetFirstNamePossessive] оказываются полезнее, чем [target.GetHerHis] любовные письма. Один слуга всегда остаётся после заката: подливает вино, убирает одежду и не уходит, пока не погаснет последняя свеча.\n\nОдин верный слуга способен разрушить тщательно устроенное свидание. Нужно найти этим зорким глазам другое занятие."
 latria_charming_abduction.1102.a: "Кошель серебра купит слуге вечер развлечений."
 latria_charming_abduction.1102.b: "Добавить строку: приходи без свиты, и тебя ждёт сюрприз."
 latria_charming_abduction.1102.c: "Пока отозвать приглашение. Эта дверь подождёт ещё ночь."

 latria_charming_abduction.2001.t: "Когда опускается засов"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] входит в спальню, всё ещё устремляя [target.GetHerHis] взгляд на свечи у постели. Я протягиваю руку, позволяя [target.GetHerHim] думать, что ещё шаг — и до меня можно будет дотронуться.\n\nЩёлкает засов. [target.GetSheHe|U] оборачивается, и тени за занавесями поднимаются на ноги. Мои люди хватают [target.GetHerHis] руки; верёвка выскальзывает из рукава, даже не задев подсвечник.\n\nЯ тянусь за одеждой на стуле. Сегодня эту подушку никто не разделит."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] принимает налитое мной вино и чуть поворачивается, открывая путь во внутренние покои. [target.GetSheHe|U] ждёт, что я возьму [target.GetHerHis] руку и отведу [Select_CString(target.IsFemale, 'её', 'его')] в более уединённое место.\n\nВместо этого я ставлю кубок. Боковая дверь открывается, и мои люди врываются внутрь. Прежде чем [target.GetSheHe] успевает позвать на помощь, засов уже опущен, а верёвки затянуты.\n\nВино на столе едва тронуто."
 latria_charming_abduction.2001.secret: "\n\nВ коридоре тихо. К тому времени, когда при дворе заметят [target.GetHerHis] отсутствие, даже воск свечей успеет остыть."
 latria_charming_abduction.2001.exposed: "\n\nЗа окном раздаётся крик. Похоже, кто-то расскажет другую половину истории этого вечера ещё до рассвета."
 latria_charming_abduction.2001.a: "Принести [target.GetHerHis] плащ. Нам пора уходить."

 latria_charming_abduction.2002.t: "Незавершённый вечер"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] останавливается в дверях. Ни свечи, ни постель, ни моё тщательно выверенное молчание не побуждают [Select_CString(target.IsFemale, 'её', 'его')] сделать ещё шаг.\n\n\"Уже поздно.\" [target.GetHerHis|U] взгляд скользит мимо моего плеча к неподвижным занавесям.\n\nМоя протянутая рука касается лишь ночного воздуха."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] не прикасается к вину. Мгновение [target.GetSheHe] стоит у стола, словно оценивая мою улыбку, а затем отступает к открытой двери.\n\n\"Пусть оставят свет. Мои люди ждут.\"\n\nШаги за боковой дверью звучат невыносимо громко."
 latria_charming_abduction.2002.secret: "\n\nЯ опускаю руку, прежде чем спрятавшиеся люди успевают выйти. Завтра кто-нибудь посмеётся над моими отвергнутыми ухаживаниями. Никто не узнает, что ждало за той дверью."
 latria_charming_abduction.2002.exposed: "\n\nПетля верёвки оказывается на виду. [target.GetFirstNameNoTooltip] отшатывается и выкрикивает моё имя, пока [target.GetSheHe] пятится к [target.GetHerHis] стражникам. Теперь никто не примет это за безобидный флирт."
 latria_charming_abduction.2002.a: "Погасить свечи. Приглашений больше не будет."
 latria_charming_abduction.2002.b: "Написать новое письмо и ждать другого случая."
 latria_charming_abduction_retry_tt: "Подготовить эти происки заново, убрав модификатор подхода этой попытки и сохранив прежние приготовления к приглашению."

 latria_charming_abduction.2101.t: "Нежная ловушка"
 latria_charming_abduction.2101.bedchamber: "По дороге на встречу с персоной по имени [owner.GetFirstName] я всё ещё думаю, как лучше поцеловать [owner.GetHerHis] руку. В спальне сумрачно — как раз настолько, чтобы забыть заглянуть за занавеси.\n\nЛишь когда мои руки заламывают за спину, становится понятно, почему [owner.GetSheHe] держится на расстоянии. Здесь меня ждёт не нежность, а только верёвка."
 latria_charming_abduction.2101.antechamber: "Я оказываюсь в плену у [owner.GetFirstNamePossessive] ещё до первого глотка вина.\n\n[owner.GetSheHe|U] ставит свой кубок, словно подавая условленный знак. Мгновение спустя из боковой двери врываются люди и хватают меня за руки. Я всё смотрю на [Select_CString(owner.IsFemale, 'неё', 'него')], ожидая объяснения. [owner.GetSheHe|U] лишь велит принести мой плащ."
 latria_charming_abduction.2101.a: "Отвернуться. Я не стану смотреть на [Select_CString(owner.IsFemale, 'неё', 'него')]."

 latria_charming_abduction.2102.t: "За светом свечей"
 latria_charming_abduction.2102.secret: "Приглашение персоны по имени [owner.GetFirstNamePossessive] полно нежности, но при встрече [owner.GetSheHe] будто чем-то отвлекается. Шаги в коридоре, шорох ткани за дверью. При упоминании моих стражников [owner.GetHerHis] улыбка застывает.\n\nЯ нахожу предлог уйти. Лишь среди своих людей я замечаю, как вспотели ладони. Возможно, это было просто неловкое свидание. Возможно, лучше никогда не знать, что скрывалось за той дверью."
 latria_charming_abduction.2102.exposed: "Мелькнувшая верёвка сразу приводит меня в чувство.\n\nШёпот персоны по имени [owner.GetFirstNamePossessive], приглушённые свечи, расстояние, которое [owner.GetSheHe] сохраняет между нами: всё это должно было удержать меня в комнате. Я пячусь в коридор и зову стражу, глядя, как люди за дверью прячутся в тени.\n\nРади этой улыбки я едва не отсылаю всех прочь."
 latria_charming_abduction.2102.a: "Отныне кто-нибудь будет ждать за дверью."

