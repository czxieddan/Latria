l_russian:
 latria_sexual_frustration_flavor.1011.t: "Вторая стража"
 latria_sexual_frustration_flavor.1011.desc: "Я просыпаюсь во вторую стражу; лампа всё ещё горит, масла на дне, на блюдце засох бурый круг. Ночная рубашка скрутилась на поясе. В комнате так холодно, что слышно, как ставня дважды стукнет и затихнет.\n\nТри дня назад, в дверях залы, рука легла мне на запястье — и ничего не было сказано. Длину этого прикосновения я перебираю в памяти чаще, чем счета. Кожа там теперь обыкновенная. Прижимаю к ней большой палец и чувствую только собственный пульс.\n\nВ чаше у постели вода, совсем тёплая. Выпиваю половину и ставлю чашу на место. Ставня стучит снова. Лежу с открытыми глазами и считаю балки, пока не придёт серость."
 latria_sexual_frustration_flavor.1011.a: "Встать, подрезать фитиль и отпустить мысль, куда ей хочется."
 latria_sexual_frustration_flavor.1011.b: "Выпить воду, повернуться к стене и оставить это."
 latria_sexual_frustration_flavor.1011.c: "Взять из ларца книгу и читать, пока не придёт серость."

 latria_sexual_frustration_flavor.1012.t: "Груша и маленький нож"
 latria_sexual_frustration_flavor.1012.desc: "Я сижу через три стола от возвышения, там, где свечи оплывают, а вино наливают жидкое. Напротив, за двумя купцами и писцом, кто-то чистит грушу маленьким ножом и не ест её. Кожура сходит одной длинной спиралью.\n\nНа прошлом пиру колено напротив моего оставалось прижатым ко мне, пока играли одну песню. Не могу поверить, что это случайность, и не могу поверить, что нет.\n\nМузыканты переходят на что-то медленнее. Нож останавливается. Груша лежит на блюде разрезанная, бурея на срезе. Слуга склоняется над моим плечом с кувшином, а я подставляю чашу, не отводя взгляда."
 latria_sexual_frustration_flavor.1012.a: "Сказать вслух — и пусть стол думает что хочет."
 latria_sexual_frustration_flavor.1012.b: "Уйти пораньше, поклонившись, и проглотить остальное."
 latria_sexual_frustration_flavor.1012.c: "Обернуться к соседу и отдать это музыке."

 latria_sexual_frustration_flavor.1013.t: "Что оставил сон"
 latria_sexual_frustration_flavor.1013.desc: "Я просыпаюсь — простыня сползла к бедру, окно бледное, и на миг комната кажется чужой. Здесь кто-то был. На краю постели лежала тяжесть, и голос у самого уха произносил моё имя, будто спрашивал.\n\nЛица не помню. Помню тепло спины у своей груди, ладонь на животе, который поднимался и опускался, и то, что спешить мне было совсем некуда.\n\nПростыня подо мной сырая. Сажусь и ставлю ноги на холодные доски. За окном в сторону рынка едет телега. Тянусь к одежде и понимаю, что прислушиваюсь к двери."
 latria_sexual_frustration_flavor.1013.a: "Отдать это телу и сохранить тепло сна."
 latria_sexual_frustration_flavor.1013.b: "Встать, одеться и разгладить ночь."
 latria_sexual_frustration_flavor.1013.c: "Сидеть, обняв колени, и ждать, пока окно не побелеет."

 latria_sexual_frustration_flavor.1014.t: "Лампада"
 latria_sexual_frustration_flavor.1014.desc: "В третьем часу я на коленях; псалтырь открыт на той же странице, которую читаю в четвёртый раз. Лампада бросает на плиты маленький красный круг. Колени ноют. Холод поднимается сквозь шерсть.\n\nГде-то в крытой галерее закрывается дверь. Голос капеллана за спиной всё звучит, терпеливый, и я не слышу ни слова. Думаю о губах у своего горла прошлым летом — и о том, как голова отвернулась, а всё остальное осталось как было.\n\nЛента псалтыри соскользнула на пол. Не поднимаю. Палец держит место, красный круг лампады дрожит от дыхания. Камень под коленями холоден."
 latria_sexual_frustration_flavor.1014.a: "Признать слабость и принять епитимью завтра."
 latria_sexual_frustration_flavor.1014.b: "Простоять на коленях ещё час и начать псалом заново."
 latria_sexual_frustration_flavor.1014.c: "Попросить капеллана остаться и дочитать страницу."

 latria_sexual_frustration_flavor.1015.t: "Одеяло в ногах постели"
 latria_sexual_frustration_flavor.1015.desc: "Огонь прогорел до золы, а сна всё нет; одеяло сброшено в ноги. Тело тёплое, тяжёлое, полное собой: кожа у горла и вдоль бёдер натянута и горит, и влага во мне такая, что к погоде она не имеет отношения.\n\nКладу руку низко на живот и не двигаю её. Сегодня желание не о лице. Это только пульс между ног, настойчивый, в такт последним щелчкам огня.\n\nДумаю о губах, о руке, о тяжести кого-то надо мной — и бёдра сами сдвигаются. Одеяло лежит комом на досках. Утыкаюсь лицом в подушку и дышу, пока боль не отпустит, а она не отпускает."
 latria_sexual_frustration_flavor.1015.desc.lustful: "Жар поднимается под простынёй, и я перестаю притворяться, что это погода. Я влажная, просто влажная, от себя, и пальцы знают дорогу без указаний.\n\nЯ отпускаю их. Сегодня в этом нет лица — только рука, что прижала меня к тюфяку, и колено, раздвинувшее мои, и я помню точную силу этого. Бёдра поднимаются навстречу пустоте. Звук, который я издаю в пустой комнате, мне незнаком.\n\nПосле я лежу с раскрытыми ладонями, грудь ходит вверх и вниз, и последнее ещё движется в бёдрах. Полено оседает в очаге. Подтягиваю простыню к поясу, и жар в лице остаётся."
 latria_sexual_frustration_flavor.1015.desc.chaste: "Просыпаюсь уже в жару, бёдра влажные, отдёргиваю руку и сжимаю её на краю простыни, будто, держась за ткань, можно удержать ночь на месте.\n\nЧитаю утреннюю молитву по порядку и теряю нить на третьей строке. Считаю балки и теряю счёт. Тело не слушается. Оно хранит то, в чём при свете дня нет признания, и продолжает просить.\n\nОкно из серого становится белым. Колокол к утренней службе ещё не звонил. Подтягиваю одеяло к подбородку, закрываю глаза и жду, пока жар выйдет из меня. Он выходит медленно."
 latria_sexual_frustration_flavor.1015.a: "Пусть рука делает что хочет — и пусть жар послужит."
 latria_sexual_frustration_flavor.1015.b: "Вцепиться в одеяло и износить жар."
 latria_sexual_frustration_flavor.1015.c: "Встать, выпить воды и сесть у окна."

 latria_sexual_frustration_flavor.1016.t: "Долгая дорога назад"
 latria_sexual_frustration_flavor.1016.desc: "Еду в конце вереницы, где кони пошли шагом; свет сквозь листья зелёный и жидкий. Плащ тяжёл от сырости. Где-то впереди рога всё ещё гонят по дальнему склону.\n\nНа прошлой охоте у ручья наши кони пошли рядом, и остальные уехали вперёд. Рукав был мокр до локтя. На мои слова ответили смехом, и этот смех остался со мной на всю дорогу домой, а дорога домой длилась два дня.\n\nКобыла опускает голову к воде. Вода разбивает её отражение. Сижу и даю ей пить, смотрю, как части сходятся снова, и рога начинают опять, дальше."
 latria_sexual_frustration_flavor.1016.a: "Отстать на длину и пустить мысль ехать домой со мной."
 latria_sexual_frustration_flavor.1016.b: "Послать коня и держать ум на склоне."
 latria_sexual_frustration_flavor.1016.c: "Идти по следам копыт и сломанным веткам — искать."

 latria_sexual_frustration_flavor.1017.t: "Печать и счётная книга"
 latria_sexual_frustration_flavor.1017.desc: "Совет разошёлся, свечи обгорели до огарков. Счётная книга открыта на шерстяных статьях, печать всё ещё в руке, воск размяк от хвата.\n\nВозвращаюсь я не к счетам. Возвращаюсь к тому, как один человек всю сессию стоит у окна, ничего не говоря, с пальцем на щеколде, и как от этого комната кажется меньше.\n\nПрижимаю печать к распоряжению и поднимаю. Воск принимает оттиск чисто. За окном двор пуст, щеколда не шевелится. Читаю одну и ту же строку дважды и закрываю книгу."
 latria_sexual_frustration_flavor.1017.a: "Послать за этим человеком завтра и сказать прямо."
 latria_sexual_frustration_flavor.1017.b: "Отдать печать писцу и идти спать."
 latria_sexual_frustration_flavor.1017.c: "Снова открыть книгу и докончить страницу."

 latria_sexual_frustration_flavor.1018.t: "Луна над доской"
 latria_sexual_frustration_flavor.1018.desc: "Вдоль дорожки зажжены фонари, над западной стеной луна, тонкая и белая, как ошмёток кожуры. Вино в кувшине согрелось. Напротив, за доской, учёный держит белый камень двумя пальцами и не ставит его.\n\nВесной на гулянье сидели так близко, что рукава касались, и прочли четыре строки о лампе, а на последней посмотрели на меня. Последнюю строку я помню до сих пор.\n\nКамень наконец ложится — не в тот угол, — и смех, и чаша снова полна. Пью. Свет фонаря движется по доске. О стихотворении не говорит никто."
 latria_sexual_frustration_flavor.1018.a: "Взять лампу и четыре строки и добавить ещё четыре."
 latria_sexual_frustration_flavor.1018.b: "Поднять чашу в благодарность и перевести речь на урожай."
 latria_sexual_frustration_flavor.1018.c: "Поставить камень и попросить наставления."

 latria_sexual_frustration_flavor.1019.t: "Сказанное огню"
 latria_sexual_frustration_flavor.1019.desc: "Огонь низок, на другом стуле мой поверенный, ладони обхватили чашу, ждёт — как всегда ждёт.\n\nИ я говорю. Не всё, но очертания: дверной проём, руку на запястье, ночи после. Вслух это становится меньше и хуже. Поверенный не отводит глаз и не заполняет молчание.\n\nЧаша в руках остыла. Есть полено, которое надо подбросить, и я не подбрасываю. Сидим в остатках тепла, комната медленно темнеет, а чаша всё ещё у меня в руках."
 latria_sexual_frustration_flavor.1019.a: "Продолжать — и сказать остальное."
 latria_sexual_frustration_flavor.1019.b: "Остановиться здесь и оставить остальное при себе."
 latria_sexual_frustration_flavor.1019.c: "Посидеть ещё и ничего не сказать."

 latria_sexual_frustration_flavor.1020.t: "Сказанное под сводами"
 latria_sexual_frustration_flavor.1020.desc: "Своды берут мой голос и возвращают вдвойне. В нефе десяток людей, и каждый слышит, как я говорю то, чего не говорю при свете дня.\n\nГлаза — на плите перед оградой. На ней выщерблина в форме зуба. Когда я заканчиваю, кто-то за спиной переносит вес с ноги на ногу, а женщина у дверей натягивает покрывало и не опускает его.\n\nКадило качается. Дым идёт вверх плашмя вдоль камня. Остаюсь на месте, ладони раскрыты на коленях, пока пономарь не касается плеча."
 latria_sexual_frustration_flavor.1020.a: "Поднять голову и договорить пропущенное."
 latria_sexual_frustration_flavor.1020.b: "Держать голову опущенной и дочитать покаянные псалмы до конца."
 latria_sexual_frustration_flavor.1020.c: "Дождаться, пока неф опустеет, и попросить капеллана остаться."

 latria_sexual_frustration_flavor.1021.t: "После дождя"
 latria_sexual_frustration_flavor.1021.desc: "Дождь задержал нас в верхней комнате за второй стражей, и никто не предложил спуститься.\n\nЯ помню порядок вещей. Мокрый плащ на досках. Губы у ключицы, потом ниже, неспешно, а мои пальцы находят завязки на затылке. Лампа притушена, но не погашена. Потом губы возвращаются к поцелую, и на них вкус вина, бёдра скользят вдоль моих, и навстречу ладони, которая там устраивается, поднимаются бёдра.\n\nПосле дождь не кончается. Волосы прилипли к щеке. На плече след, к которому при свете дня я не приглядывался."
 latria_sexual_frustration_flavor.1021.desc.female: "Дождь задержал нас в верхней комнате за второй стражей, и никто не предложил спуститься.\n\nЯ помню порядок вещей. Мокрый плащ на досках. Губы у ключицы, потом ниже, неспешно, а мои пальцы разбирают завязки на затылке. Лампа притушена, но не погашена. Ладонь накрывает мою грудь, я уже влажная, и навстречу руке, устроившейся между бёдер, поднимаются бёдра.\n\nПосле дождь не кончается. Волосы прилипли к щеке. На плече след, к которому при свете дня я не приглядывалась."
 latria_sexual_frustration_flavor.1021.desc.male: "Дождь задержал нас в верхней комнате за второй стражей, и никто не предложил спуститься.\n\nЯ помню порядок вещей. Мокрый плащ на досках. Губы у груди, потом ниже, неспешно, а мои руки находят завязки на поясе. Лампа дважды мигает и держится. Этот человек опускается надо мной, я держу чужие бёдра, твёрдые и ноющие, и ритм задаёт не я. Волосы на концах мокрые.\n\nПосле дождь идёт дальше, шумит в жёлобе над окном. На плече след, к которому при свете дня я не приглядывался."
 latria_sexual_frustration_flavor.1021.a: "Встретить завтра как обычно и ничего не скрывать."
 latria_sexual_frustration_flavor.1021.b: "Избегать с этих пор и убрать ночь подальше."
 latria_sexual_frustration_flavor.1021.c: "Лежать, слушать дождь и помнить о следе."

 latria_sexual_frustration_flavor.1022.t: "Тропа за грядками трав"
 latria_sexual_frustration_flavor.1022.desc: "Иду тропой за грядками, потому что после темноты дворовые там не ходят — единственное такое место. Гравий холоден сквозь туфли. Розмарин, а под ним кислый запах перестоявшей мяты.\n\nВ конце, где стена поворачивает, стоит скамья. Весной мы сидели на ней; я начал говорить глупость, и меня простили, не дав договорить. Щеколда на калитке всё ещё опущена.\n\nЛуна за башней. Стою у скамьи, рука на спинке, там, где краска стёрлась до древесины. Мотылёк бьётся о фонарь у двери. Мята чуть шевелится. Я не сажусь."
 latria_sexual_frustration_flavor.1022.a: "Сесть на скамью и дать пульсу пройти."
 latria_sexual_frustration_flavor.1022.b: "Вернуться в дом и задвинуть засов."
 latria_sexual_frustration_flavor.1022.c: "Пройти тропу раз, потом другой."

 latria_sexual_frustration_flavor.1023.t: "Третья чаша"
 latria_sexual_frustration_flavor.1023.desc: "К третьей чаше зала стала громкой и тёплой, псы ушли под скамьи. Кто-то завёл песню с неверным числом куплетов, и никто не поправляет.\n\nПока рассказывают историю, рука лежит на моём рукаве и остаётся на нём всю историю, а с концом истории исчезает. Я смеюсь там, где надо. Вино сегодня очень хорошее.\n\nМузыканты берут что-то медленное. Смотрю вдоль стола, где убирают деревянные блюда. Рукав ещё тёплый там, где была рука. Поворачиваю чашу за край и позволяю слуге налить снова."
 latria_sexual_frustration_flavor.1023.a: "Поднять чашу и посмотреть через стол."
 latria_sexual_frustration_flavor.1023.b: "Сослаться на вино и уйти наверх спать."
 latria_sexual_frustration_flavor.1023.c: "Говорить с соседом и дослушать мелодию."

 latria_sexual_frustration_flavor.1024.t: "Розовая вода и садовая стена"
 latria_sexual_frustration_flavor.1024.desc: "Розовую воду вылили на фрукты, и весь стол пахнет ею. Под стеной соловей всё поёт и поёт, скверно, и ни у кого не хватает духу его остановить.\n\nДважды спрашивали меня про этот договор, и дважды ответ пришёлся не на ту половину вопроса. Во второй раз улыбка ушла в чашу. Шафран с большого пальца сошёл на край. В стекле лампы между нами трещина.\n\nСоловей замолкает. В тишине слышно, как вода идёт в жёлобе за стеной. Беру чашу, уже опустошённую, и держу её, пока кто-нибудь не заметит и не нальёт снова."
 latria_sexual_frustration_flavor.1024.a: "Пойти за их примером и перенести договор на завтра."
 latria_sexual_frustration_flavor.1024.b: "Попросить позволения уйти и выйти в сад."
 latria_sexual_frustration_flavor.1024.c: "Попросить договорить вторую половину стихотворения."

 latria_sexual_frustration_flavor.1025.t: "Ястреб на рукавице"
 latria_sexual_frustration_flavor.1025.desc: "Ястреб сидит на рукавице лучше, чем весной, без колпачка, вес улёгся. Кони привязаны позади, в берёзах, загонщики ушли вперёд со своим шумом.\n\nОднажды на краю вересковой пустоши мы пускали её вместе, и я не мог отвести глаз от рук, что бросали её, — от того, как они раскрывались в последний миг. С тех пор я думаю об этих руках в неподходящие часы.\n\nЯстреб переступает, я удерживаю её двумя пальцами за опутенки. Ветер идёт вверх по склону, холодный и чистый. Глаза — на деревьях, где скрылись загонщики, а мысли не о деревьях."
 latria_sexual_frustration_flavor.1025.a: "Передать ястреба другому и уйти одному."
 latria_sexual_frustration_flavor.1025.b: "Спустить её с рукавицы и дать лететь."
 latria_sexual_frustration_flavor.1025.c: "Пустить её снова, пока рука не заноет."

 latria_sexual_frustration_flavor.1026.t: "Страница, которую перевернули"
 latria_sexual_frustration_flavor.1026.desc: "Урок окончен, книга всё ещё раскрыта между нами на странице, которую капеллан перевернул сухим пальцем. Дождь по ставням. Свеча догорела и погнулась.\n\nДовод остался позади. Палец, чернила вдоль него, рукав, засученный до локтя, — вот что было перед глазами. Стыд приходит после, всегда, и не приносит пользы.\n\nКапеллан закрывает книгу и спрашивает, понял ли я. Отвечаю, что понял. Дождь всё идёт по ставням. Держу ладонь плашмя на переплёте, чтобы она ни к чему не потянулась."
 latria_sexual_frustration_flavor.1026.a: "Отнести вопрос капеллану завтра."
 latria_sexual_frustration_flavor.1026.b: "Попросить повторить — и на этот раз слушать."
 latria_sexual_frustration_flavor.1026.c: "Прочесть страницу ещё раз, только буквы."

 latria_sexual_frustration_flavor.1027.t: "Что оставил день"
 latria_sexual_frustration_flavor.1027.desc: "Последний проситель ушёл, в палате пахнет мокрой шерстью и салом, которым натирают скамьи. Печать тёплая от руки. Дневные дела сделаны, а я всё ещё сижу здесь.\n\nУ окна, между двумя говорящими, был миг, когда взгляд, который я с тех пор несу, как камешек в башмаке. Ничего не сказано. Ничего и не требовалось.\n\nПисец приходит за печатью. Отдаю ему, пальцы спокойны. Он уходит. Дверь закрывается не до конца. Сижу и слушаю, как укладывается щеколда, и дождь снова начинается по свинцовым листам."
 latria_sexual_frustration_flavor.1027.a: "Выслать палату завтра и сказать одну вещь."
 latria_sexual_frustration_flavor.1027.b: "Закрыть окно и докончить бумаги."
 latria_sexual_frustration_flavor.1027.c: "Разобрать остаток, лист за листом."

 latria_sexual_frustration_flavor.1028.t: "Лента в ларце"
 latria_sexual_frustration_flavor.1028.desc: "На полке ларец, в нём лента, не моя, зелёная, на сгибе совсем тонкая. Достаю, кладу обратно, достаю снова.\n\nНа ярмарке лента потерялась; её нашли в грязи и вернули с поклоном, который был не нужен. Руки были холодные. Прозвучало «благодарю» — и больше ничего, и всю дорогу домой злость на себя за это «ничего».\n\nЛампа притушена. Лента лежит поперёк ладони, и зелень в этом свете почти серая. Складываю её раз, потом другой, и сгибы не совпадают."
 latria_sexual_frustration_flavor.1028.a: "Завязать ленту вокруг запястья и спать."
 latria_sexual_frustration_flavor.1028.b: "Запереть ларец на дне сундука."
 latria_sexual_frustration_flavor.1028.c: "Взять бумагу и записать ночь."

 latria_sexual_frustration_flavor.1029.t: "Огонь между стражами"
 latria_sexual_frustration_flavor.1029.desc: "Огонь свёлся к красному глазу, лагерь спит, кроме нас двоих и караульных. Плащ на коленях. Меч там, где до него можно дотянуться, — по привычке.\n\nОдиннадцать ночей у одного огня, и я знаю звук чужого дыхания. Сегодня этот человек тоже не спит. Никто из нас не говорит о завтрашней дороге — и о постоялом дворе в последнем городе, где была одна комната и мы её взяли.\n\nВетер прижимает пламя. Полено оседает. Кладу другое, искры идут вверх, и искры — единственное, что движется во всём лесу."
 latria_sexual_frustration_flavor.1029.a: "Сидеть у огня и ждать света."
 latria_sexual_frustration_flavor.1029.b: "Подбрасывать в огонь, держать стражу и не смотреть."
 latria_sexual_frustration_flavor.1029.c: "Смениться стражей и дойти до края леса."

 latria_sexual_frustration_flavor.1030.t: "Верёвка колокола"
 latria_sexual_frustration_flavor.1030.desc: "Верёвка колокола шершава в руках, колокол уже звонил, церковь пуста. Проводник ждёт у дверей с ключами, терпеливый, как камень.\n\nДумаю о теле как о том, что должно быть сохранено, и мысль не держится. Соскальзывает. Под шерстью мне тепло и живо, и во мне пульс, у которого нет ничего общего с молитвой.\n\nОтпускаю верёвку. Она чуть качается и замирает. Проводник поднимает ключи. Иду за ним по нефу, и тень уходит вперёд по плитам, длинная и тонкая, и вон из дверей."
 latria_sexual_frustration_flavor.1030.a: "Отдать ночь телу, а счёты свести завтра."
 latria_sexual_frustration_flavor.1030.b: "Встать на колени и дочитать вечернюю службу."
 latria_sexual_frustration_flavor.1030.c: "Задержать проводника и услышать ещё один отрывок."

 latria_sexual_frustration_flavor.1031.t: "Лента на досках"
 latria_sexual_frustration_flavor.1031.desc: "Огонь прогорел до красной черты, а дров принести я не велел. Платье расстгнуто у горла, и в комнате довольно тепло, чтобы оставить так. Два дня назад, на привале, рука задержалась у меня на пояснице дольше, чем требовала посадка в седло.\n\nПомню тяжесть этой ладони, дыхание у уха, когда конь переступил, низкое слово, которое было не совсем словом. Моя рука идёт туда, где была ладонь. Кожа там тёплая от огня, и когда я нажимаю, тепло только моё.\n\nЛента соскользнула со столбика кровати на доски. Смотрю, как она лежит в красном свете. Огонь оседает. Я не поднимаю её."
 latria_sexual_frustration_flavor.1031.a: "Поднять ленту и отпустить мысль, куда ей хочется."
 latria_sexual_frustration_flavor.1031.b: "Завязать ленту, прикрыть огонь и спать."
 latria_sexual_frustration_flavor.1031.c: "Расставить доску и сыграть конец партии одному."

 latria_sexual_frustration_flavor.1032.t: "Тяжесть ладони"
 latria_sexual_frustration_flavor.1032.desc: "Камень холоден сквозь колени, и я на коленях так долго, что холод стал собеседником. Под шерстью телу слишком жарко, и не разобрать, жаровни ли это или что-то другое. На прошлой неделе рука легла мне на голову в благословении и осталась дольше слов.\n\nМолитвы выходят правильно. Ответы правильные. Вместо них поднимается тяжесть той ладони, масло на пальцах, миг, когда никто из нас не двинулся и в дверях кашлянул пономарь. Прижимаю лоб к костяшкам пальцев. Мрамор не отдаёт ничего.\n\nСвеча у бокового алтаря гнётся и снова выпрямляется. Остаюсь, где есть. Холод идёт вверх сквозь колени, и я позволяю ему."
 latria_sexual_frustration_flavor.1032.a: "Встать, найти священника и сказать, что во мне."
 latria_sexual_frustration_flavor.1032.b: "Держать бдение до колокола."
 latria_sexual_frustration_flavor.1032.c: "Ходить по галерее, пока ноги не станут такими же холодными, как колени."

 latria_sexual_frustration_flavor.1033.t: "Второй плащ"
 latria_sexual_frustration_flavor.1033.desc: "Огонь между нами, псы затихли. Не спросив, мне накинули на плечи второй плащ, и шерсть пахнет чужим потом и дымом. Колено — у моего. Никто из нас не убрал его.\n\nНазову три причины встать: стражу, полог шатра, который не закрывается, холод, что придёт до рассвета. Вместо этого поворачиваю лицо к пламени и оставляю плечо там, где оно успокоилось. Наше дыхание выходит и редеет в воздухе между нами. Под плащом рука находит шов собственного рукава и держит его.\n\nВетка падает в огонь. Этот человек не двигается. Я не двигаюсь. Искры идут вверх и вон."
 latria_sexual_frustration_flavor.1033.a: "Остаться под плащом, пока огонь не станет золой."
 latria_sexual_frustration_flavor.1033.b: "Поблагодарить за шерсть и уйти в свой шатёр."
 latria_sexual_frustration_flavor.1033.c: "Спрашивать о псах, пока не сменится стража."

 latria_sexual_frustration_flavor.1034.t: "Третий пункт"
 latria_sexual_frustration_flavor.1034.desc: "Договор переписан дважды, и во втором списке ошибка в третьем пункте. Читаю в четвёртый раз, и ошибка всё ещё там. Ворот расстёгнут: жаровня нагнала в комнату жару, и смотреть тут некому.\n\nВозвращаюсь я к приёмной: губы посла на внутренней стороне моего запястья, потом выше, и я позволяю продолжать, пока за дверью приходят и уходят шаги нотария. Ничего, что можно записать, сказано не было. Сказано было ещё меньше.\n\nСвеча выела из воска полумесяц. Беру перо, кладу его и снова читаю третий пункт. Слова не изменились."
 latria_sexual_frustration_flavor.1034.a: "Послать за послом и прямо сказать, о чём я думаю."
 latria_sexual_frustration_flavor.1034.b: "Переписать пункт снова и идти на исповедь с первым светом."
 latria_sexual_frustration_flavor.1034.c: "Читать псалтырь, пока свеча не погаснет."

 latria_sexual_frustration_flavor.1035.t: "Два поворота"
 latria_sexual_frustration_flavor.1035.desc: "В зале шумно, вино ударило в голову — не сильно, ровно настолько. Платье сползло с плеча, и это осталось так. В последнем танце рука легла мне на талию и осталась на два поворота, а в зале было слишком тесно, чтобы отступить.\n\nЧетыре точки этих пальцев всё ещё различимы сквозь шёлк. Моя рука идёт к плечу, к тёплому месту, где сползла ткань. Музыка теперь позади игроков. Я всё равно держу такт.\n\nЛампа надо мной коптит. Кто-то за дальним столом смеётся над чем-то, чего до меня не дошло. Плечо открыто, и пусть будет так."
 latria_sexual_frustration_flavor.1035.a: "Потребовать ещё одну мелодию и станцевать её."
 latria_sexual_frustration_flavor.1035.b: "Поправить платье и взять холодного воздуха у окна."
 latria_sexual_frustration_flavor.1035.c: "Сесть у огня со старым псом, пока зал не опустеет."

 latria_sexual_frustration_flavor.1036.t: "Река фонарей"
 latria_sexual_frustration_flavor.1036.desc: "Сад увешан фонарями, и вся река внизу несёт ещё больше — медленный дрейф огней прочь, в темноту. Я держу шёлковый фонарь, который кто-то сунул мне у ворот; сбоку на нём чернилами выведена загадка, и я не читаю её дважды. Толпа движется, и рука незнакомого человека задевает мою — раз, — и пропадает в давке.\n\nЛица я не вижу. Вижу плечо, взмах рукава, а потом только фонари, уходящие вниз по реке. Моя рука смыкается на пустоте. Загадка спрашивает, что человек несёт с собой и что становится тем тяжелее, чем дальше несёт, — и оказывается, я знаю ответ и не хочу его.\n\nКого-то сегодня нет здесь, хотя должен бы быть. Я ставлю фонарь на воду вместе с прочими и смотрю, как он находит течение. Огни гаснут один за другим за излучиной. Я стою у перил, пока не исчезнет последний."
 latria_sexual_frustration_flavor.1036.a: "Послать за собственным фонарём и написать на нём имя."
 latria_sexual_frustration_flavor.1036.b: "Поблагодарить толпу и уйти домой тихой тропой."
 latria_sexual_frustration_flavor.1036.c: "Прочесть загадку до конца и поворочать её в голове."

 latria_sexual_frustration_flavor.1037.t: "Тепло и без стыда"
 latria_sexual_frustration_flavor.1037.desc: "Обряд окончен, храм пустеет, но я ещё стою на коленях в после-тепле. Наша вера не учит, что тело — это долг. Нынче вечером слова говорили именно это, и кожа моя сохранила их тепло, и я не жалею об этом.\n\nПриходит прикосновение — рука на затылке несколько дней назад, — и там, где старый голос назвал бы это пятном, теперь лишь благословение. Я позволяю памяти остаться. Она не жжёт. Она сидит во мне, как свет лампы, и дыхание идёт медленно и ровно.\n\nПоследнюю свечу уносят мимо меня. Я поднимаюсь с твёрдыми коленями и прохладным лицом. Я не стыжусь того, что я есть, и храм не требует от меня стыда."
 latria_sexual_frustration_flavor.1037.a: "Произнести благословение вслух и оставить тепло."
 latria_sexual_frustration_flavor.1037.b: "Поклониться алтарю и унести покой с собой."
 latria_sexual_frustration_flavor.1037.c: "Посидеть ещё и изучить слова, что освободили меня."

 latria_sexual_frustration_flavor.1038.t: "Желание в пламени"
 latria_sexual_frustration_flavor.1038.desc: "Костёр сложен высоко во дворе на поворот года, и весь дом разом прыгнул через него, шафран в воздухе и шербет, остывающий в чашах. Я загадываю желание над пламенем и не произношу его. По ту сторону огня кто-то смотрит, как я загадываю, и не отводит взгляда.\n\nТеперь пир уносит меня внутрь на вине и шуме. Ворот расстёгнут, в комнате тепло. Я всё ещё чувствую жар огня на голенях и тяжесть того взгляда, задержанного на вдох дольше, чем у чужого человека должно быть. Я поворачиваю чашу и не пью.\n\nОгонь теперь — красное свечение в дверном проёме. Я ставлю шербет. Желание всё ещё моё, и я его не трачу."
 latria_sexual_frustration_flavor.1038.a: "Найти того, кто был по ту сторону огня, и сказать прямо."
 latria_sexual_frustration_flavor.1038.b: "Пожелать им хорошего года и откланяться."
 latria_sexual_frustration_flavor.1038.c: "Выйти к прогоревшему костру и пройтись по холодному саду."

 latria_sexual_frustration_flavor.1039.t: "Долгий взгляд"
 latria_sexual_frustration_flavor.1039.desc: "Наадам — три дня пыли и шума, и кумыс ударил мне в голову сильнее, чем следовало. Борцы всё ещё в вытоптанной траве, кряхтят, сбивают пыль с бёдер. Ветер идёт с открытой степи, и между мной и небом нет ничего.\n\nВо втором заезде один человек верхом ловит мой взгляд и держит его на удар дольше, проезжая мимо, — и я его с тех пор не отпускаю. Я смотрю следующий заезд и не вижу в нём ничего. Под кафтаном рука находит шов и держит. Трава шипит, ложится и поднимается.\n\nПыль оседает над полем. Кумыс тёплый в бурдюке у бедра. Я не иду к шатру, ещё нет."
 latria_sexual_frustration_flavor.1039.a: "Уехать верхом после скачек и отдать это ветру."
 latria_sexual_frustration_flavor.1039.b: "Поблагодарить борцов и уйти на ночь."
 latria_sexual_frustration_flavor.1039.c: "Сесть с всадниками и перекидываться речами, пока не уйдёт свет."

 latria_sexual_frustration_flavor.1040.t: "Прегрешение"
 latria_sexual_frustration_flavor.1040.desc: "Обряд называет это желание грехом, и я стою на коленях на холодном камне, чтобы от него избавиться. Холод поднимается через колени и делает своё дело, а желание не уходит. Оно сидит под молитвами, как камень под стоячей водой, и каждое слово, что я говорю, — прегрешением по нему.\n\nРот, к которому я всё возвращаюсь, не принадлежит никому, кого я могу назвать, — только тепло, близость, рука, что была, а потом не была. Я прижимаю лоб к костяшкам пальцев и пытаюсь сложить исповедь. Слова не идут. Горло смыкается на них, и храм не даёт ничего в ответ.\n\nБрат где-то шевелится за ширмой и затихает. Я остаюсь на камне. Колокол к службе близок, а я не исповедаюсь и не поднимаюсь."
 latria_sexual_frustration_flavor.1040.a: "Уйти в свою келью и покончить с желанием."
 latria_sexual_frustration_flavor.1040.b: "Держать бдение и отдаться камню."
 latria_sexual_frustration_flavor.1040.c: "Лежать в темноте и позволить утешению найти меня."
