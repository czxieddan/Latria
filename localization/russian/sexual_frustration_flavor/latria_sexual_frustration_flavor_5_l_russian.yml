 latria_sexual_frustration_flavor.1401.t: "Отложенная печать"
 latria_sexual_frustration_flavor.1401.desc.female: "В ночной рубашке я сижу у постели и складываю письмо снова и снова. Подписи нет, обращение зачёркнуто, но глубоких сгибов уже не скрыть. На углу стола приготовлен тёплый воск. Осталось приложить печать, и мысли этой ночи окажутся в чужих руках.\n\nЯ разворачиваю лист и останавливаюсь на строке о встрече. Час, место, даже нужная дверь указаны ясно. Днём я ещё могла назвать это случайными заметками. Теперь посланник ждёт в коридоре, а подходящего предлога больше не находится.\n\nЗа дверью тихо шуршит ткань. Я беру печатку, другой рукой всё ещё прижимая край письма, и никого не зову."
 latria_sexual_frustration_flavor.1401.desc.male: "В ночной рубашке я сижу на краю постели с печаткой в руке. Письмо на столе дописано до последней строки. Чернила высохли, только место для подписи пустует. Слуга приготовил воск и прикрыл окно. Уходя, он не спросил, почему я ещё не отдыхаю.\n\nЯ знаю каждую фразу и понимаю, как её прочтут. Если добавить имя и печать, приглашение уже не назовёшь мимолётной шуткой. Слова, столько раз переделанные в мыслях, на бумаге не оставляют мне ни единого укрытия.\n\nЯ уже давно сжимаю печатку. Поворачиваю её как следует и смотрю на свет в дверной щели, всё ещё не зовя посланника."
 latria_sexual_frustration_flavor.1401.desc: "Я поднимаю печатку и снова кладу её, не решаясь запечатать письмо. Край ровно сложен, воск готов, других дел за столом нет. И всё же я ещё раз разглаживаю угол листа, словно какой-то сгиб заслуживает новой отсрочки.\n\nФраза уже написана. Утром посыльный спросит лишь, куда идти, но не решит за меня, стоит ли вообще отправлять письмо. Я дважды читаю адрес и думаю о возможном ответе, а затем о том, что ответа может не быть.\n\nВоск в ложечке начинает застывать. Я подвигаю её к огню, а свободная рука опять прижимает письмо к столу."
 latria_sexual_frustration_flavor.1401.a: "Дописать письмо до конца и поставить печать."
 latria_sexual_frustration_flavor.1401.b: "Убрать печатку, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1402.t: "Последний пир"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Пир заканчивается, но гости всё ещё говорят о любовниках, обручениях и былых удовольствиях. Кто-то застёгивает плащ и оборачивается, чтобы добавить конец истории; слушатели смеются и просят слугу подлить вина. Здесь никому не приходится ради таких слов понижать голос.\n\nЯ уже поднимаюсь, но знакомое название места заставляет вновь сесть. С ним связана и моя история, только её никогда не рассказывали так легко. Я пробую вставить слово. Сосед по столу ставит кубок и ждёт продолжения; всё накопившееся вдруг теснится у меня на губах.\n\nМузыканты убирают инструменты. Хозяин смотрит на дверь зала, а моё верхнее платье всё ещё лежит на спинке стула."
 latria_sexual_frustration_flavor.1402.desc.strict: "На пиру кто-то упоминает знатного человека, потерявшего положение из-за тайной связи. Кувшин, ходивший по рукам, останавливается. Один гость спрашивает о его семье, другой тихо говорит, что и намеченный брак, вероятно, расстроится. Я сижу в конце стола и слушаю, как чужую жизнь решают пункт за пунктом.\n\nМоё имя не звучало. Но когда сосед спрашивает, почему я так мало говорю, не получается даже привычно улыбнуться. Несколько признаний, для которых требовалась смелость вина, теперь, однажды начавшись, могут уже не поддаться возвращению.\n\nСлуга подходит за пустой тарелкой. Я убираю руку с его пути, но продолжаю держать кубок, так и не допивая последний глоток."
 latria_sexual_frustration_flavor.1402.desc: "Лишь глядя, как слуги уносят посуду, я замечаю, что пир подошёл к концу. Несколько гостей прощаются у двери, хозяин спрашивает о лошадях и повозках, а мой кубок ещё почти полон. Для нужных слов так и не нашлось подходящего промежутка.\n\nСосед поправляет плащ и спрашивает, выйдем ли мы вместе. Я соглашаюсь, а затем опять завожу речь о прошлом. Начало истории уже прозвучало, но я снова возвращаюсь к нему, словно точная фраза не даст вечеру закончиться вот так.\n\nРука соседа замирает на застёжке. Я отодвигаю кубок и слышу, насколько отчётливее стало эхо в зале."
 latria_sexual_frustration_flavor.1402.a: "Удержать последних гостей за столом и вновь и вновь говорить о своих тревогах."
 latria_sexual_frustration_flavor.1402.b: "Подавить мысль, поблагодарить хозяев и уйти."

 latria_sexual_frustration_flavor.1403.t: "Исповедь без свидетелей"
 latria_sexual_frustration_flavor.1403.desc.favors: "Я остаюсь у алтаря в одиночестве и слышу, как последний служитель тихо прикрывает дверь. Священная книга ещё открыта на подставке; лента отмечает страницу о плотских удовольствиях. Мне знакомы эти наставления. Вера не требует считать моё желание грехом.\n\nИ всё же без свидетелей я не знаю, с чего начать. Вопросы, приготовленные днём, слишком выверены: они обходят именно того человека, которого мне всё время хочется увидеть. Я повторяю одну фразу, останавливаюсь, затем тихо произношу имя, прежде скрытое за обращением.\n\nВ святилище нет ответа. Я убираю руку с книги и остаюсь на коленях, глядя на тускнеющую полоску света под дверью."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Я стою на коленях перед алтарём в одиночестве. Одежда аккуратна, а молитва раз за разом обрывается на одном месте. Последний служитель спросил, оставить ли лампу. Моим ответом был кивок, и теперь здесь лишь один огонь и недочитанная священная книга.\n\nЯ помню все заповеди и давно знаю, как каяться. Но всякий раз, когда нужно отречься от желания, вспоминаю неуничтоженное письмо. Его место мне прекрасно известно: перед уходом из комнаты оно нарочно спрятано между страницами, которые никто не станет листать.\n\nНикто не торопит, и от этого следующую фразу закончить ещё труднее. За дверью слышны шаги смены караула. Я склоняю голову и опять читаю с начала."
 latria_sexual_frustration_flavor.1403.desc: "Я жду, пока в святилище стихнут все шаги, но не ухожу от алтаря. Скамьи выровнены, лента священной книги свисает с подставки, у входа осталась пустая чашка, забытая служителем. Пока здесь были другие, казалось, что мои слова невозможно произнести.\n\nТеперь вокруг никого. Я пробую рассказать с самого начала о том, что меня тревожит. На середине слышу, как снова прячусь за знакомыми фразами. Останавливаюсь, смотрю на дверь и повторяю тихо. На этот раз имя не пропущено.\n\nСвет падает перед коленями. Я не поднимаюсь сразу, слушая, как произнесённое медленно затихает в пустом зале."
 latria_sexual_frustration_flavor.1403.a: "Больше не давать обетов воздержания и признать свой выбор."
 latria_sexual_frustration_flavor.1403.b: "Сдержать желание и стоять на коленях до утренней молитвы."

 latria_sexual_frustration_flavor.1404.t: "Назвать тоску"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Я стою без одежды перед бронзовым зеркалом спальни. Верхнее платье лежит на спинке стула, слуги ушли, засов закрыт моей рукой. Отражение не отводит глаз. И я наконец перестаю спешно искать мелкое занятие, чтобы отвлечься.\n\nВ последнее время желание увидеть этого человека получает у меня разные имена: усталость, тоска, бессонница после пира. Каждое новое объяснение добавляет строку к письму на столе, но оно так и не отправлено. Я знаю, чего жду, и мне надоело по утрам вычёркивать уже написанное.\n\nНа столе лежит чистая бумага. Глядя на неё, я впервые всерьёз думаю, нужны ли в начале все эти учтивые приветствия."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Без одежды я сижу на краю постели, крепко сцепив руки. Платье лежит рядом, молитвенник ещё не убран. Знакомый отрывок должен был предшествовать отдыху, но я надолго застываю на одной строке и даже раз сбиваюсь со счёта ночных сигналов за окном.\n\nЕсли я всё ещё храню клятву, это не потому, что больше не желаю чьей-то близости. Едва возникает имя, становится ясно: словами об отсутствии соблазна больше не отделаться. Я нахожу страницу с обетом и читаю медленнее обычного, пытаясь понять, действительно ли каждая фраза остаётся моим выбором.\n\nСтраница замирает между пальцами. За дверью уже тихо. Я не закрываю книгу и не спешу дочитывать оставшиеся слова."
 latria_sexual_frustration_flavor.1404.desc: "Ночь уже глубока. Я сижу в спальне и наконец признаю, что всё ещё хочу увидеть этого человека. Письмо на столе несколько раз исправлялось, и всякий раз исчезала самая важная фраза. Оставались погода, поездки и ничего не значащие приветствия.\n\nЯ раскладываю листы по порядку и смотрю на почти одинаковые начала. Они вполне благопристойны, но получатель никогда не узнает, почему я так долго не гашу лампу. Ещё одно письмо сегодня ничего не изменит, если в нём будет заменено лишь обращение.\n\nЯ кладу перо возле чистого листа. За окном опять раздаётся ночной сигнал. На этот раз он не становится предлогом отправить себя спать."
 latria_sexual_frustration_flavor.1404.a: "Признать свою тоску и перестать бороться с ней этой ночью."
 latria_sexual_frustration_flavor.1404.b: "Снова одеться и подавить мысль."

 latria_sexual_frustration_flavor.1405.t: "Страница в летописи"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Летописец склонился над столом, ожидая, что я сочту достойным памяти. Я стою за ним в церемониальном одеянии. Чернила недавнего рассказа о пожалованиях и сборах ещё не высохли. На завтрашнем распорядке я останавливаюсь и вместо него упоминаю долгие ночи, которых никто не записывает.\n\nЕго перо не сразу следует за словами. Слуга у двери переступает с ноги на ногу; я знаю, что все слышали. Мне казалось, достаточно днём по-прежнему принимать двор, и эти мучения останутся в спальне. Но на вопрос летописца, записывать ли всё как сказано, уже не получается привычно ответить отказом.\n\nРазложена новая страница. Перо висит над пустым местом, и все ждут, когда я продолжу начатую фразу."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Переписчик сидит за столом и спрашивает, нужно ли внести в летопись и этот отрезок пути. Я перечисляю переправы, ночлеги и несколько задержек. Он всё записывает и поднимает глаза в ожидании следующего названия. Рядом с моей рукой из поклажи выглядывает неотправленное письмо.\n\nНе каждая остановка случилась из-за дождя или сломанной оси. Был и крюк ради новой встречи с одним человеком, о подлинной причине которого спутники так и не узнали. Теперь, читая аккуратно записанные названия, я чувствую: пропущено именно то, от чего труднее всего было уйти на этой дороге.\n\nПереписчик обмакивает перо. Я достаю письмо, не разворачиваю его и сначала разглаживаю угол рядом с картой."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Я привожу облачение в порядок и подхожу к писцу. Он собирался записывать пожертвования и ремонт, но, услышав смену темы, берёт новый лист. Рядом всё ещё открыта священная книга, на том самом месте, которое я днём объясняю другим.\n\nИ клятва, и желание правдивы. Я не хочу изображать себя человеком, никогда не знавшим сомнений. Понимаю и то, что после записи эти слова уже не останутся только моим воспоминанием. Писец спрашивает, сохранить ли имя, очень тихо, словно боится, что за дверью догадаются.\n\nЯ смотрю на пустую строку. Чётки всё ещё обвивают запястье. Я не начинаю перебирать их, чтобы уклониться от вопроса."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Писец ждёт моих слов. На мне церемониальное одеяние, рядом лежит печать, которой пользовались на совете. Закончив государственные дела, я вдруг упоминаю личную историю, долго лежавшую на сердце. Слуги у двери не уходят. В комнате резко становится тихо.\n\nСначала я рассказываю о старом письме, затем о нескольких несостоявшихся встречах. Писец пишет медленнее и поднимает глаза на неясных местах. Мне хотелось, чтобы он сам подобрал благопристойные выражения. Но, слыша свои слова повторёнными, я уже не хочу, чтобы их превратили в другую историю.\n\nОн протягивает переписанные полстраницы. Я беру бумагу, останавливая взгляд на первом обращении, которое ничего не скрывает."
 latria_sexual_frustration_flavor.1405.desc: "Я подхожу к столу писца с решением объяснить то, что долго скрывалось. Он отодвигает официальные бумаги, расстилает чистый лист и спрашивает, откуда начинать. Я называю дату и тут же умолкаю: на самом деле всё началось не тогда.\n\nЯ возвращаюсь к письму, короткой встрече и нескольким бессонным ночам после неё. Перо движется тихо, но теперь другой человек сможет прочитать эти слова от начала до конца. Писец не судит, лишь ждёт при неясностях, оставляя немного пустого места.\n\nГотовый лист лежит между нами. Показывать ли его кому-то третьему — об этом он всё ещё ждёт моего распоряжения."
 latria_sexual_frustration_flavor.1405.a: "Пусть списки расходятся, чтобы все могли прочитать."
 latria_sexual_frustration_flavor.1405.b: "Пусть писец запишет лишь мои обязанности, а остальное придётся проглотить."

 latria_sexual_frustration_flavor.1406.t: "Когда гости уходят"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Последние гости всё ещё обсуждают любовников и обручения. Едва я упоминаю собственное прошлое, сбоку раздаётся тихий смех. Гость держит кубок, не видит в этом никакой невежливости и с улыбкой просит рассказать, что было дальше.\n\nЭта история так долго жила во мне, что её внезапное превращение в развлечение за вином лишает меня слов. Сосед добавляет догадку, другой гость шутит над фразой из письма. Я хочу поправить, но речь становится всё торопливее. На язык просятся даже подробности, которых я не собираюсь касаться.\n\nСлуга приходит за последним кувшином. Я придерживаю край кубка и слышу, как кто-то придвигает стул, ожидая второй половины рассказа."
 latria_sexual_frustration_flavor.1406.desc.strict: "Когда до стола доходит весть о знатном человеке, потерявшем положение из-за тайной связи, моя история ещё не закончена. Сосед вдруг тихо спрашивает о чём-то, другой гость смотрит на меня и коротко смеётся. Тот, кто недавно кивал, теперь занят только своей салфеткой.\n\nЯ знаю, что пора остановиться, но не хочу позволять этой тишине закончить рассказ за меня. Чем настойчивее хочется объяснить, что я не имею отношения к скандалу, тем больше объяснений требуют прежние слова. У двери уже прощаются гости. Никто из оставшихся не просит продолжать.\n\nЯ ставлю кубок чуть слишком резко. Взгляды никуда не уходят. Нужно решить, к кому будет обращена следующая фраза."
 latria_sexual_frustration_flavor.1406.desc: "Гости собираются расходиться, а я всё никак не заканчиваю. При упоминании старого письма соседи переглядываются, и сбоку слышится негромкий смешок. Я умолкаю, только теперь замечая, что люди напротив давно отложили приборы и слушают лишь меня.\n\nМне хочется объяснить, почему та фраза важна, но выходит повторный рассказ. Кто-то вежливо кивает, кто-то смотрит к двери, кто-то прячет улыбку за кубком. Я вижу всё и лишь сильнее спешу, словно осталась одна последняя фраза, после которой меня поймут.\n\nХозяин уже встал. Стулья передо мной ещё не отодвинуты, а из-за спины доносятся прощальные любезности."
 latria_sexual_frustration_flavor.1406.a: "Продолжать рассказ и отвечать перед всем столом каждому насмешнику."
 latria_sexual_frustration_flavor.1406.b: "Промолчать, поклониться собравшимся и попрощаться."

 latria_sexual_frustration_flavor.1407.t: "Молитва после свечи"
 latria_sexual_frustration_flavor.1407.desc.favors: "В ночной рубашке я сижу у постели и открываю молитвенник на странице о плотских удовольствиях. Наставления, обычные при дневном свете, сейчас приходится перечитывать несколько раз. Дверь заперта, люди снаружи разошлись, в лампе остаётся последнее масло.\n\nВера не требует отрицать собственное желание, но я всё ещё не знаю, как быть с чувством, на которое нет ответа. Я пробую произнести для себя нужные слова. Без поклонов и приветствий оставшиеся фразы настолько коротки, что я надолго останавливаюсь.\n\nПламя уменьшается. Я отмечаю страницу лентой, не закрывая сразу книгу и не продолжая искать другой ответ."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Я запахиваю ворот ночной рубашки и тихо повторяю обет целомудрия. Фитиль стал коротким; слова молитвенника всё труднее различить во тьме. Я продолжаю читать, при каждой ошибке возвращаясь к началу, словно точного произношения хватит, чтобы ночь прошла благополучно.\n\nНо на середине возвращаются слова, сказанные тем человеком днём. Клятва не забыта. Не забыто и то, почему тогда так не хотелось прощаться. Когда эти две вещи оказываются рядом, привычных ответов вдруг становится недостаточно.\n\nЛампа готова погаснуть. Я протягиваю руку, защищая огонь. Следующая фраза перед глазами. Я долго смотрю на неё, всё ещё не произнося ни звука."
 latria_sexual_frustration_flavor.1407.desc: "В комнате осталась одна угасающая лампа, а мои глаза всё ещё не закрываются. Молитвенник лежит на коленях; одна и та же страница прочитана несколько раз. За окном проходит ночной страж. Шаги исчезают за поворотом, но я продолжаю ждать следующего.\n\nЯ подвигаю книгу к свету, отыскивая место остановки. В строке нет трудных слов. Я знаю причину: каждый конец напоминает о вопросе, который следовало прояснить днём. Теперь ответить некому, а я всё ещё подбираю ответ за другого человека.\n\nОстаток масла блестит на дне. Я вкладываю ленту, оставляю ладонь на обложке и не задуваю лампу."
 latria_sexual_frustration_flavor.1407.a: "Отложить обет целомудрия и предаться мыслям об этой привязанности."
 latria_sexual_frustration_flavor.1407.b: "Унять мысли и читать молитвы до рассвета."

 latria_sexual_frustration_flavor.1408.t: "Молчание перед зеркалом"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Я стою без одежды перед зеркалом в одиночестве. У постели лежит платье, снятое днём, на столе — наполовину написанное приглашение. Прежде у этого зеркала всегда находилось время поправить наряд и обдумать слова для встречи. Но при самой встрече речь всё равно шла лишь об обыденном.\n\nЭтих возвращений уже довольно. Не хочется больше называть давнее желание случайной мыслью и каждый раз ждать, пока другой человек заговорит первым. Возле зеркала прижат незаконченный лист. В конце ещё достаточно места для одной ясной фразы.\n\nЯ поворачиваюсь к столу и смотрю на засохшие чернила на кончике пера. Снаружи никто не торопит. На этот раз и служебные дела не ответят вместо меня."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Я сижу без одежды на краю постели, крепко сжав руки. Возле зеркала аккуратно сложено платье, сверху лежит молитвенник. Положенная глава уже прочитана, а привычное спокойствие не наступает. Чем тише комната, тем труднее обойти это чувство.\n\nЦеломудрие остаётся моим выбором. Но я больше не хочу говорить о стойкости так легко, словно чтение священной книги означает отсутствие всех иных мыслей. Я расставляю в уме завтрашние дела, дохожу до часа встречи с тем человеком, останавливаюсь и меняю порядок заново.\n\nОтражение тоже продолжает сидеть. Я разжимаю руки и смотрю на перо у стола, желая честно записать эту нерешительность."
 latria_sexual_frustration_flavor.1408.desc: "В тишине я смотрю на своё отражение. На столе всё ещё лежит незаконченный лист. Дневная улыбка, за которой можно спрятаться, теперь не нужна. Я вновь сажусь на край постели и вспоминаю нашу короткую встречу с самого начала.\n\nНи одну фразу нельзя назвать обещанием. Никто не просил меня продолжать ждать. В смыслах, добавленных позже, сколько было от другого человека, а сколько от меня? Я наконец соглашаюсь разобрать их по одному. Понимание не заставляет желание немедленно исчезнуть.\n\nЯ немного подвигаю бумагу под лампу. Хотя бы ещё не написанная строка должна ясно сказать то, что исходит от меня."
 latria_sexual_frustration_flavor.1408.a: "Признать это желание и перестать бежать от него этой ночью."
 latria_sexual_frustration_flavor.1408.b: "Одеться, сесть за стол и подавить мысль."

 latria_sexual_frustration_flavor.1409.t: "Потеря самообладания при дворе"
 latria_sexual_frustration_flavor.1409.desc: "Во время перерыва в придворном собрании я снимаю одежду в боковой комнате, надеясь успокоить мысли минутой одиночества. Верхнее платье ещё у слуги, когда дверь в зал совета уже распахивается. Я поднимаю голову. Разговоры за длинным столом смолкли; несколько подданных застыли, не завершив поворота.\n\nПисец опускает взгляд и придвигает недописанный лист к себе. Люди у двери хотят отступить, но боятся загородить путь слуге с одеждой. Никто не двигается первым. Мне следовало сразу заговорить, однако голос сдавлен, а приготовленные распоряжения не складываются в предложения.\n\nНаконец слуга подносит платье. На столе по-прежнему разложены нерешённые дела. Все ждут, когда я определю, что будет дальше."
 latria_sexual_frustration_flavor.1409.a: "Стоять перед ними, не пытаясь скрыть свою оплошность."
 latria_sexual_frustration_flavor.1409.b: "Отпустить вельмож и одеться, прежде чем продолжать совет."

 latria_sexual_frustration_flavor.1410.t: "Ночь за дверью"
 latria_sexual_frustration_flavor.1410.desc.female: "В ночной рубашке я сижу у двери и слушаю, как шаги снаружи постепенно удаляются. Кто-то возвращает ключ в коридоре и тихо желает доброй ночи. Я могла бы окликнуть одного из них и попросить утром отнести письмо. Голоса стихли, а я так и не заговорила.\n\nСнова возвращается чувство, оставшееся без ответа. Черновик на столе полон ненужных слов, только желаемый ответ в нём не обозначен. Я кладу бумагу на колени, читаю с первой строки и наконец вычёркиваю обычное приветствие, в которое сама не верю.\n\nЗа дверью совсем тихо. Я переношу перо на пустое место. Оно ещё не коснулось листа, а я уже знаю, что это письмо займёт больше времени, чем прежние."
 latria_sexual_frustration_flavor.1410.desc.male: "В ночной рубашке я опираюсь на изголовье, так и не перевернув ни страницы лежащей рядом книги. За дверью становится тихо, свет падает на тот же отрывок, а я всё думаю о разговоре, который днём оборвался слишком рано. На прощание я сказал, что продолжим в другой раз. В ответ прозвучала лишь положенная учтивость.\n\nСлишком часто я говорил о другом разе. Всякий раз верю, что при следующей встрече смогу всё объяснить. Потом в одиночестве остаётся лишь гадать, был ли иной смысл в вежливом ответе. Я передвигаю закладку на страницу и сразу замечаю, что не помню даже предыдущей.\n\nНа столе ещё есть перо и бумага. Я закрываю книгу, оставляю её на коленях и смотрю на потемневшую щель под дверью."
 latria_sexual_frustration_flavor.1410.desc: "Долгая ночь ещё не кончилась. Я сижу за закрытой дверью и слушаю последние удаляющиеся шаги. Письмо на столе не дописано, книга у постели раскрыта. Оба занятия, которыми хотелось скоротать время, остановились на полпути.\n\nЯ читаю себе уже написанные строки. Фразы просты, но везде оставляют выход. Даже в конце непонятно, какого ответа я жду от того человека. Если продолжать так и отправить письмо завтра, прибавится лишь ещё один повод ждать.\n\nЯ достаю чистый лист и прижимаю его книгой. Лампа ещё достаточно ярка, чтобы увидеть, где должна начаться первая строка."
 latria_sexual_frustration_flavor.1410.a: "Отложить книгу и написать длинное письмо."
 latria_sexual_frustration_flavor.1410.b: "Подавить тоску, погасить лампу и лечь."

 latria_sexual_frustration_flavor.1401.c: "Обратить в стихи приглашение, которое я не могу отправить."
 latria_sexual_frustration_flavor.1402.c: "Заплатить музыкантам, чтобы они сыграли для оставшихся гостей."
 latria_sexual_frustration_flavor.1402.d: "Попросить гостей остаться и поговорить о прежних странствиях."
 latria_sexual_frustration_flavor.1403.c: "Раскрыть писание и искать ответ в каждом отрывке."
 latria_sexual_frustration_flavor.1404.c: "Отречься от обета целомудрия и впредь следовать своим желаниям."
 latria_sexual_frustration_flavor.1404.d: "Надеть ночную рубашку и сидеть, пока мысли не улягутся."
 latria_sexual_frustration_flavor.1405.c: "Переделать рассказ в личное письмо и запереть его в шкатулке."
 latria_sexual_frustration_flavor.1405.d: "Дать обет целомудрия перед этими свидетелями."
 latria_sexual_frustration_flavor.1406.c: "Прочитать новое стихотворение для уходящих гостей."
 latria_sexual_frustration_flavor.1407.c: "Закрыть молитвенник и не спеша обдумать свои чувства."
 latria_sexual_frustration_flavor.1408.c: "Перечислить утренние обязанности и привести все бумаги в порядок."
 latria_sexual_frustration_flavor.1409.c: "Одеться, вернуться за стол и завершить все придворные дела."
 latria_sexual_frustration_flavor.1409.d: "Одеться, пошутить и вновь предложить вельможам сесть."
 latria_sexual_frustration_flavor.1410.c: "Надеть одеяние, заварить чай и сидеть, пока не удастся уснуть."
