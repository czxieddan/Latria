l_russian:
 latria_collapse_no_relief_tt: "Подавленное желание не ослабло."

 latria_sexual_frustration_flavor.1501.t: "Лампа ещё горит"
 latria_sexual_frustration_flavor.1501.desc.dead: "Кинжал выскальзывает из моей руки, и от звука удара о пол шаги за дверью замирают. Дверь распахивается; кто-то приседает рядом, зовёт меня по имени, а затем оборачивается и велит позвать на помощь. Лампа всё ещё на прежнем месте, но лица перед собой я не могу разглядеть.\n\nХочется дать понять, что я всё слышу; губы шевелятся, но ни звука не выходит. Я больше не могу вспомнить целиком ни одной фразы из тех, что без конца вертелись у меня в голове, пока рядом никого не было. Кто-то берёт меня за руку и спрашивает, могу ли я открыть глаза; мне остаётся лишь смотреть на дверь за стоящей рядом фигурой.\n\nВ комнату врывается топот новых шагов. Я пытаюсь повернуть голову на звук, но фигуры у двери уже расплываются, а потом перестаю различать даже свет лампы."
 latria_sexual_frustration_flavor.1501.desc.survived: "Когда я прихожу в себя, ночную одежду уже сменили, а раны тщательно перевязали. Увидев, что я открываю глаза, кто-то у постели тут же окликает человека из прислуги, уже собравшегося уходить. Мне говорят, что шум привлёк внимание и дверь открыли вовремя; кинжал уже унесли.\n\nЯ пытаюсь приподняться, но боль останавливает меня прежде, чем удаётся оторваться от подушки. Рядом поправляют одеяло и спрашивают, хочу ли я воды; я киваю, но взгляд снова обращается к неотправленному письму на столе. Листы по-прежнему лежат стопкой, и на верхнем видно многократно исправленное обращение.\n\nК губам подносят чашку, и я делаю лишь один глоток. У постели продолжают дежурить и лишь после того, как я устраиваюсь поудобнее, осторожно ставят чашку на стол."
 latria_sexual_frustration_flavor.1501.desc.severe: "Когда сознание возвращается, первым делом я слышу приглушённый разговор у постели. Кто-то спрашивает, могут ли зажить такие раны; после недолгого колебания в ответ лишь просят принести ещё чистой ткани. Я пытаюсь повернуться и увидеть, кто рядом, но от малейшего движения становится так больно, что невозможно говорить.\n\nКинжала под рукой больше нет; даже маленький столик у постели отодвинули подальше. Я прошу помочь мне сесть, но рядом лишь поправляют подушку повыше и советуют пока полежать. Свет за окном уже переменился, но я всё думаю о бессонных ночах и о письме с ответом, которого так и нет.\n\nКто-то протягивает руку, чтобы поправить постель. Я хочу попросить двигаться помедленнее, но ещё не договорив, уже сжимаю простыню под собой."
 latria_sexual_frustration_flavor.1501.a.dead: "Всё… темнеет…"
 latria_sexual_frustration_flavor.1501.a.survived: "Больно…"
 latria_sexual_frustration_flavor.1501.a.severe: "Не трогайте меня… больно…"

 latria_sexual_frustration_flavor.1502.t: "Пустой кубок"
 latria_sexual_frustration_flavor.1502.desc.dead: "Чашка уже пуста; я лежу, привалившись к краю постели, и слышу, как открывается дверь. Сначала меня зовут по имени, а затем, заметив вещи на столе, оборачиваются и кричат о помощи, даже не успев закрыть дверь. По коридору кто-то бежит, и ворвавшийся в комнату сквозняк шевелит недописанное письмо.\n\nЯ ещё помню последнюю фразу, оставшуюся недописанной, и перо рядом с листом. Кто-то поддерживает меня за плечи, спрашивает, что было в чашке, и просит продержаться ещё немного. Я смотрю на стол, желая дописать то, что осталось несказанным, но рука не достаёт даже до уголка листа, свисающего перед глазами.\n\nРядом всё ещё зовут меня, но голос понемногу отдаляется. Я больше не различаю букв на письме и не могу произнести в ответ ни звука."
 latria_sexual_frustration_flavor.1502.desc.survived: "Выпитый яд не лишил меня жизни. Когда я прихожу в себя, в комнате уже стоит таз с чистой водой. У постели давно кто-то дежурит; заметив мои открытые глаза, встаёт и зовёт остальных, а затем оборачивается и спрашивает, узнаю ли я комнату.\n\nЧашку со стола убрали, а недописанное письмо прижали книгой. Я хочу дотянуться до письма, но даже придвинуться к краю постели оказывается тяжело. У постели мне подают воду, ждут, пока я допью, а затем спрашивают, кому передать письмо; я смотрю на выглядывающую из-под книги половину строки и молчу.\n\nЗа окном уже начинают ходить люди. Я вспоминаю, чем обычно занимаюсь в этот час, но могу лишь опираться на подушку и слушать, как прислуга за дверью отсылает желающих меня видеть."
 latria_sexual_frustration_flavor.1502.desc.severe: "Яд не отнял у меня жизнь, но подняться без посторонней помощи, как прежде, по-прежнему не получается. Мне приносят завтрак и кладут у постели чистую одежду; протянув руку, я обнаруживаю, что даже привычную миску не могу держать ровно.\n\nКто-то из прислуги поправляет мне рукава и кормит понемногу. Я хочу спросить, давно ли лежу здесь, но уже на полуслове приходится прерваться и отдохнуть. На столе накопилось несколько новых писем; когда мне предлагают прочесть их вслух, я прежде прошу поискать среди них знакомое имя.\n\nПисьма просматривают одно за другим, а затем лишь слегка качают головой. Я смотрю на стопку писем и поднимаю руку, чтобы отодвинуть миску, но даже для этого приходится ждать, пока ко мне наклонятся."
 latria_sexual_frustration_flavor.1502.a.dead: "Я… не могу говорить…"
 latria_sexual_frustration_flavor.1502.a.survived: "Так дурно… воды…"
 latria_sexual_frustration_flavor.1502.a.severe: "Я даже руку поднять не могу…"

 latria_sexual_frustration_flavor.1503.t: "На берегу реки"
 latria_sexual_frustration_flavor.1503.desc.dead: "Берега уже не видно; до меня доносятся лишь чьи-то далёкие крики. Ещё мгновение назад удавалось разобрать своё имя, но теперь слышны лишь обрывки звуков. Я пытаюсь посмотреть в ту сторону, но колеблющийся перед глазами свет не даёт разглядеть деревья на берегу.\n\nКажется, при моём уходе лампа ещё горела, а книга лежала раскрытой на столе. Одна и та же страница долго лежала передо мной, но перед уходом лента закладки так и осталась не на месте. Кто-нибудь придёт прибраться и спросит, где я; передо мной встаёт знакомое лицо, и хочется сказать, что я здесь.\n\nДо меня доносится ещё один крик, но ответить не получается. Свет перед глазами меркнет, и даже та комната с горящей лампой всё хуже вспоминается."
 latria_sexual_frustration_flavor.1503.desc.survived: "Меня вытаскивают из реки; очнувшись, я лежу на берегу, съёжившись, а кто-то укутывает меня плащом. Человек рядом замечает, что я открываю глаза, торопливо машет вдаль, а затем приседает и спрашивает, хорошо ли я слышу. С одежды всё ещё стекает речная вода, а мне слишком холодно, чтобы ответить.\n\nМне говорят, что за носилками уже послали, и советуют пока не вставать. Я смотрю на тропинку к жилью и вспоминаю слова, которые без конца обдумывались по дороге сюда, в одиночестве. На вопрос, кого известить, я произношу имя, а потом тихо повторяю его, боясь, что меня не расслышали.\n\nПлащ снова плотнее запахивают вокруг меня. Кто-то обещает передать мои слова; рядом остаются, поддерживая меня за плечо, и вместе со мной ждут шагов на тропинке."
 latria_sexual_frustration_flavor.1503.desc.severe: "О том, как меня выносили на берег, осталось лишь воспоминание о голосе, торопившем всех скорее возвращаться. Когда я вновь прихожу в себя, мокрую одежду уже сменили, а у постели стоят несколько человек. Я хочу спросить, сколько времени длилось беспамятство, но приступ кашля не даёт даже закончить обращение.\n\nУ постели вполголоса говорят о болезни лёгких и просят прикрыть окно. Ткань на лбу меняют уже не впервые, но я всё никак не пойму, день сейчас или ночь. В минуты ясности я всё смотрю на дверь, ожидая знакомого человека; но там лишь кто-то из прислуги с водой, тихо спрашивающий, что мне нужно.\n\nЯ качаю головой и пытаюсь устроиться сидя, опершись на подушку. Едва ко мне протягивают руку, чтобы помочь, кашель снова обрывает ещё не произнесённые слова."
 latria_sexual_frustration_flavor.1503.a.dead: "Так холодно…"
 latria_sexual_frustration_flavor.1503.a.survived: "Я ещё… живу?"
 latria_sexual_frustration_flavor.1503.a.severe: "Я… не могу отдышаться…"

 latria_sexual_frustration_flavor.1504.t: "Под обрывом"
 latria_sexual_frustration_flavor.1504.desc.dead: "Я лежу под обрывом и слышу, как меня ищут, перекликаясь на горной тропе. Один голос зовёт меня по имени, другой торопит остальных искать ниже, а рядом скатываются мелкие камни. Я хочу поднять руку, чтобы меня заметили, но она остаётся лежать вдоль тела, не сдвинув даже края одежды.\n\nСилуэт горы закрывает большую часть неба, и я не помню, сколько времени прошло с моего ухода. При выходе меня спрашивают, когда я вернусь; я называю час не задумываясь, но теперь не могу вспомнить свой ответ. Шаги всё ближе; я открываю рот, но по-прежнему не могу издать ни звука.\n\nНаконец кто-то останавливается рядом, наклоняется и зовёт меня. Я не различаю лица перед собой и даже оставшегося над головой клочка неба."
 latria_sexual_frustration_flavor.1504.desc.survived: "Я прихожу в себя под обрывом; рядом кто-то сидит на корточках и зовёт меня. Заметив мою реакцию, человек рядом оборачивается и машет остальным, чтобы спускались по тропе. Я уже хочу спросить, где нахожусь, но узнаю скалу над головой и больше не решаюсь смотреть вверх.\n\nРаны после падения не дают подняться; даже слегка пошевелившись, приходится останавливаться, чтобы перевести дух. Мне велят дождаться носилок, поднимают лежащую рядом верхнюю одежду и укрывают ею меня. Я смотрю на застёжку и вспоминаю, как перед уходом поправляю её перед зеркалом, всё думая о приглашении, оставшемся без ответа.\n\nШаги раздаются уже рядом, и несколько человек тихо обсуждают, как меня поднять. Я хочу повернуться, чтобы помочь, но вскрикиваю прежде, чем успеваю пошевелиться."
 latria_sexual_frustration_flavor.1504.desc.severe: "Я прихожу в себя под обрывом, вокруг стоят пришедшие на помощь, но никто не начинает говорить. Я узнаю знакомое лицо и спрашиваю, не пора ли возвращаться. Меня укрывают верхней одеждой, смотрят на тропу и торопят тех, кто несёт носилки.\n\nЯ пытаюсь подняться, но меня тут же придерживают и просят не двигаться. Я опускаю взгляд на ноги; рядом нерешительно говорят, что впредь ходить как раньше, возможно, уже не получится. Лежащий рядом башмак всё ещё в грязи; глядя на него, я вспоминаю ночи в коридоре в ожидании ответного письма.\n\nКто-то спрашивает, нужно ли мне что-нибудь ещё. Я хочу попросить поднять башмак, но вместо этого спрашиваю, нет ли в моём жилище вестей; какое-то время никто не отвечает."
 latria_sexual_frustration_flavor.1504.a.dead: "Я ничего не слышу…"
 latria_sexual_frustration_flavor.1504.a.survived: "Не могу пошевелиться… больно…"
 latria_sexual_frustration_flavor.1504.a.severe: "Мои ноги…"

 latria_sexual_frustration_flavor.1505.t: "Взломанная дверь"
 latria_sexual_frustration_flavor.1505.desc.dead: "Когда дверь спальни с треском распахивается, я слышу, как кто-то настойчиво зовёт меня по имени. Свет из коридора падает в комнату; у двери толпятся несколько человек, но кто-то впереди торопит остальных бежать за помощью. Письмо всё ещё у постели; я хочу указать на него, но уже не могу даже перевести взгляд в ту сторону.\n\nКто-то подходит ближе, и голос настолько знаком, что хочется отозваться. Я ясно понимаю эти слова, но ничего не могу произнести и лишь вижу, как без конца шевелятся губы передо мной. За дверью о чём-то спрашивают, но склонившийся рядом человек не оборачивается, всё ещё ожидая хоть какого-нибудь отклика.\n\nЯ хочу ещё раз разглядеть это лицо, но перед глазами становится всё темнее. Свет в дверях исчезает, а затем до меня перестают доноситься и голоса."
 latria_sexual_frustration_flavor.1505.desc.survived: "Дверь спальни взломали, и меня успели спасти. Лёжа в постели, я вижу покосившийся засов; кто-то из прислуги приносит стул, чтобы дежурить снаружи. Мне поправляют подушку и спрашивают, могу ли я говорить; в ответ удаётся лишь что-то прохрипеть.\n\nВерёвки больше нет, да и письмо у постели переложили на другое место. Я пытаюсь повернуться, чтобы поискать письмо, но боль в ранах останавливает меня на полпути. У постели следят за моим взглядом и кладут письмо так, чтобы оно было мне видно; от недописанного имени в конце я всё ещё не могу отвести глаз.\n\nЯ поднимаю руку, прося пока не задавать вопросов. В ответ мне кивают, ставят воду поближе и ждут, пока я немного приду в себя, прежде чем поправить одеяло."
 latria_sexual_frustration_flavor.1505.desc.severe: "У постели кто-то зовёт меня по имени; я знаю, что от меня ждут ответа, но не понимаю, что нужно сказать. Вся обстановка спальни кажется знакомой, но стул у окна будто переставили. Я смотрю на него, пока кто-то не поправляет мне рукав.\n\nМеня моют, переодевают, а затем приносят еду. Я смотрю на приближающуюся ложку и вспоминаю, что нужно открыть рот, лишь когда мне об этом напоминают. Кто-то упоминает письмо, и ещё кто-то бросает взгляд на ларец у постели. Я тоже смотрю туда, но едва собираюсь спросить, как забываю, о чём был вопрос.\n\nКрышка ларца уже закрыта. У постели снова зовут меня по имени; на этот раз я поворачиваю голову и вижу, как руки передо мной замирают."
 latria_sexual_frustration_flavor.1505.a.dead: "Я…"
 latria_sexual_frustration_flavor.1505.a.survived: "Дайте мне… отдышаться…"
 latria_sexual_frustration_flavor.1505.a.severe: "Кто-то… зовёт меня?"
