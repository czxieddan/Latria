l_russian:
 latria_collapse_no_relief_tt: "Подавленное желание не ослабло."

 latria_sexual_frustration_flavor.1501.t: "Лампа ещё горит"
 latria_sexual_frustration_flavor.1501.desc.dead: "Я больше не различаю шагов снаружи. Кинжал выскальзывает из руки. Кто-то открывает дверь и вновь и вновь зовёт меня по имени. Я пытаюсь ответить, но всё меркнет, пока не исчезает даже свет лампы."
 latria_sexual_frustration_flavor.1501.desc.survived: "Кинжал не оборвал мою жизнь. Кто-то услышал шум и ворвался, чтобы спасти меня. Я лежу в постели в ночной одежде, раны перевязаны, а та же неутолённая тоска всё ещё тревожит меня."
 latria_sexual_frustration_flavor.1501.desc.severe: "Когда сознание возвращается, кинжала уже нет. Кто-то сидит у постели и тихо говорит о тяжести моих ран. Я не могу даже сесть, но мучение, приведшее меня сюда, не ослабло."
 latria_sexual_frustration_flavor.1501.a.dead: "Всё… темнеет…"
 latria_sexual_frustration_flavor.1501.a.survived: "Больно…"
 latria_sexual_frustration_flavor.1501.a.severe: "Не трогайте меня… больно…"

 latria_sexual_frustration_flavor.1502.t: "Пустой кубок"
 latria_sexual_frustration_flavor.1502.desc.dead: "Кубок пуст. У постели я слышу, как кто-то входит и спешно зовёт на помощь. Моё письмо ещё не закончено, но я больше не могу держать перо. Голоса затихают, пока я не перестаю слышать совсем."
 latria_sexual_frustration_flavor.1502.desc.survived: "Выпитый яд не убил меня. После того как меня нашли и оказали помощь, я всё ещё лежу в спальне, слишком больной, чтобы встать. Кубок унесли, но желания, толкнувшие меня к нему, остались."
 latria_sexual_frustration_flavor.1502.desc.severe: "Яд сохранил мне жизнь, но оставил тело немощным. Я лежу в постели, пока другие приносят воду и поправляют одежду. Постоянная слабость не дала передышки от желаний."
 latria_sexual_frustration_flavor.1502.a.dead: "Я… не могу говорить…"
 latria_sexual_frustration_flavor.1502.a.survived: "Так дурно… воды…"
 latria_sexual_frustration_flavor.1502.a.severe: "Я даже руку поднять не могу…"

 latria_sexual_frustration_flavor.1503.t: "На берегу реки"
 latria_sexual_frustration_flavor.1503.desc.dead: "Берега больше не видно. Вдалеке будто кто-то кричит, но звук становится неразборчивым. Я вспоминаю лампу, оставленную гореть в комнате. Даже эта последняя мысль ускользает."
 latria_sexual_frustration_flavor.1503.desc.survived: "Меня вытащили из реки. Когда я просыпаюсь, меня заворачивают в плащ. Я дрожу на берегу и жду, пока меня отвезут домой, всё ещё мучительно ощущая тоску, приведшую меня сюда."
 latria_sexual_frustration_flavor.1503.desc.severe: "Река не отняла мою жизнь. Когда меня выносят на берег, я уже в жару и кашляю так сильно, что не могу говорить. Они шепчутся о болезни лёгких. В минуты ясности те же желания возвращаются."
 latria_sexual_frustration_flavor.1503.a.dead: "Так холодно…"
 latria_sexual_frustration_flavor.1503.a.survived: "Я ещё… живу?"
 latria_sexual_frustration_flavor.1503.a.severe: "Я… не могу отдышаться…"

 latria_sexual_frustration_flavor.1504.t: "Под обрывом"
 latria_sexual_frustration_flavor.1504.desc.dead: "Я лежу под обрывом и слышу, как ищущие меня люди перекликаются на горной тропе. Голоса приближаются, но я не могу ответить. Горы расплываются перед глазами, пока я не перестаю различать небо."
 latria_sexual_frustration_flavor.1504.desc.survived: "Я просыпаюсь под обрывом: кто-то сидит рядом на корточках и зовёт меня по имени. Падение тяжело ранило меня, но жизнь сохранилась. Пока я жду носилок, те же желания вновь заполняют мысли."
 latria_sexual_frustration_flavor.1504.desc.severe: "Прыжок не отнял мою жизнь. Нашедшие меня люди собираются рядом, не желая смотреть мне в глаза. Когда я пытаюсь встать, выясняется, что ходить как прежде уже не получится. Мучение остаётся."
 latria_sexual_frustration_flavor.1504.a.dead: "Я ничего не слышу…"
 latria_sexual_frustration_flavor.1504.a.survived: "Не могу пошевелиться… больно…"
 latria_sexual_frustration_flavor.1504.a.severe: "Мои ноги…"

 latria_sexual_frustration_flavor.1505.t: "Взломанная дверь"
 latria_sexual_frustration_flavor.1505.desc.dead: "Я слышу, как взламывают дверь спальни, а затем кто-то встревоженно зовёт меня по имени. Я пытаюсь сказать, что письмо у постели, но слов нет. Свет в дверях тускнеет, и больше я ничего не слышу."
 latria_sexual_frustration_flavor.1505.desc.survived: "Кто-то взломал дверь спальни и вовремя спас меня. Теперь я лежу в постели, и раны затрудняют каждое движение. Верёвки больше нет, но мучение, толкнувшее меня к ней, не ушло."
 latria_sexual_frustration_flavor.1505.desc.severe: "Я слышу, как кто-то снова и снова зовёт меня по имени, но не знаю, как ответить. Другим приходится мыть и кормить меня. Я смотрю на знакомую обстановку спальни и не могу понять, что делать дальше. Письмо у постели убрали в сундук."
 latria_sexual_frustration_flavor.1505.a.dead: "Я…"
 latria_sexual_frustration_flavor.1505.a.survived: "Дайте мне… отдышаться…"
 latria_sexual_frustration_flavor.1505.a.severe: "Кто-то… зовёт меня?"
