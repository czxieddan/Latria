 latria_sexual_frustration_flavor.1211.t: "Лампа, оставленная гореть"
 latria_sexual_frustration_flavor.1211.desc: "В доме стало так тихо, что слышно лампу. Никого не звал. Всё равно выставлены две чаши, и вторая стоит пустой. Хлеб всё ещё под тканью, там, где остался с полудня.\n\nСо мной остаётся плечо у моего в дверном проёме, его тяжесть, то, как никто из нас не двигался, пока длился вдох. Кожа это сохранила. Оно возвращается в этот час — под рубашкой, сзади под коленями и ниже, — и ладонь ложится на живот плашмя, чтобы унять, и не унимает.\n\nФитиль наклоняется. Поворачиваю пустую чашу ручкой к стулу."
 latria_sexual_frustration_flavor.1211.a: "Погасить лампу и дать своей руке закончить."
 latria_sexual_frustration_flavor.1211.b: "Подрезать фитиль, выпить холодный чай и спать."
 latria_sexual_frustration_flavor.1211.c: "Читать, пока слова не перестанут кружить."

 latria_sexual_frustration_flavor.1212.t: "Совет ждёт"
 latria_sexual_frustration_flavor.1212.desc: "Прошения читают вслух, и я не слышу ни одного. Управитель стоит у края стола, руки сцеплены за спиной, а я со второй страницы слежу за линией горла. Дождь перестал, в комнате слишком тепло. Огонь за спиной тикает и оседает.\n\nТянутся через стол переставить свечу, и рукав задевает моё запястье. Никто из нас ничего не говорит. В комнате пахнет горячим воском и мокрой шерстью. Могу закрыть заседание. Слово уже во рту, и я его там держу, а ждут, глядя на печать.\n\nПисец спрашивает, решено ли. Не решено ничего."
 latria_sexual_frustration_flavor.1212.a: "Закрыть заседание и задержать под выдуманным поручением."
 latria_sexual_frustration_flavor.1212.b: "Вынести решения по прошениям и держать глаза на странице."
 latria_sexual_frustration_flavor.1212.c: "Отнести бумаги к столу с картой и работать всю ночь."

 latria_sexual_frustration_flavor.1213.t: "Для чего нужна темнота"
 latria_sexual_frustration_flavor.1213.desc: "Дверь заперта. Одежды на мне нет, простыня на полу, там, куда её сбросили. В комнате пахнет свечой и моей кожей.\n\nТело весь день громкое, а теперь ещё громче. Колени расходятся, рука идёт вниз по животу, ниже, и я не притворяюсь, будто делаю что-то другое. Приходит: губы у ключицы, запястья прижаты — и это нравится, — и я иду за этим, пока бёдра не поднимутся с тюфяка, а дыхание не разобьётся в темноте.\n\nПосле комната — та же комната. Лежу, рука поперёк глаз. Свеча выгорела в лужицу, сна не было."
 latria_sexual_frustration_flavor.1213.a: "Дать руке закончить и спать после."
 latria_sexual_frustration_flavor.1213.b: "Поднять простыню с пола и лежать тихо до рассвета."
 latria_sexual_frustration_flavor.1213.c: "Одеться, сойти вниз и ходить по стенам, пока небо не посереет."
 latria_sexual_frustration_flavor.1213.d: "Отдаваться этому снова и снова, пока свеча не умрёт."

 latria_sexual_frustration_flavor.1214.t: "Час перед заутреней"
 latria_sexual_frustration_flavor.1214.desc: "В церкви никого, только я и лампы, которые велено подрезать. Холод идёт вверх сквозь плиты, и святые смотрят мимо меня на дверь. Под рясой тело тёплое, бодрое и совершенно равнодушное к часу.\n\nСлова для этого мне известны. Я произносил их над другими в деревянном ящике у дверей тем голосом, каким говорю об их грехах. Над собой они не делают ничего. Желание сидит за рёбрами, как проглоченный уголь. Прижимаю ладонь плашмя к алтарному камню, пока не станет больно.\n\nКолокол скоро зазвонит. Рука всё ещё на камне, и камень больше не холоден."
 latria_sexual_frustration_flavor.1214.a: "Взять желание в свои руки и просить прощения после."
 latria_sexual_frustration_flavor.1214.b: "Простоять службу на коленях и дать часам его износить."
 latria_sexual_frustration_flavor.1214.c: "Открыть книгу и читать псалмы, пока слова не удержат."

 latria_sexual_frustration_flavor.1215.t: "Колено под столом"
 latria_sexual_frustration_flavor.1215.desc: "В зале громко. Чей-то пёс под скамьями, вино обошло круг дважды. Сосед не убирает колено от моего со времён оленины, и скамья нагрелась там, где мы сходимся. Камыш пахнет раздавленным вином.\n\nКаждый раз, когда стол трясёт от смеха, нажим смещается и возвращается. За доводом о границе я больше не слежу. Кладу руку на скамью рядом с чужой и оставляю. Смотрят на руку, потом на дальнюю стену, а колено остаётся. Моё колено онемело, и я его не сдвинул.\n\nЧаша опрокидывается. Вино бежит к краю и капает на камыш. Никто не двинулся."
 latria_sexual_frustration_flavor.1215.a: "Сказать прямо, здесь, и пусть зала слышит."
 latria_sexual_frustration_flavor.1215.b: "Поблагодарить стол, встать и взять воздуха снаружи."
 latria_sexual_frustration_flavor.1215.c: "Обернуться и говорить о чём угодно другом, пока огонь не упадёт."

 latria_sexual_frustration_flavor.1216.t: "Рукава в саду"
 latria_sexual_frustration_flavor.1216.desc: "Пионы отцвели, и садовник перестал притворяться, что работает. Идём вокруг пруда длинной дорогой, потому что короткая кончается у калитки. День стал цвета жидкого чая.\n\nЧужой рукав всё находит тыльную сторону моей руки. У меня в доме такое касание было бы уже принятым решением, и сватов отправили бы прежде, чем чай остынет. Здесь это только рукав, и читать его — мне. Я замедляюсь. Замедляются и они. Вода держит оба наших отражения, и первым не двигается никто.\n\nУ калитки останавливаются и один раз оглядываются. Под башмаком лепестки."
 latria_sexual_frustration_flavor.1216.a: "Спросить прямо — и отвечать за это перед своим домом."
 latria_sexual_frustration_flavor.1216.b: "Поклониться, держать руки в рукавах и уйти внутрь."
 latria_sexual_frustration_flavor.1216.c: "Обойти пруд ещё раз одному, пока не зажгут лампы."

 latria_sexual_frustration_flavor.1217.t: "Долгая дорога назад"
 latria_sexual_frustration_flavor.1217.desc: "Мы в седле задолго до света, и последние три мили я знаю только о всаднике впереди. Как этот человек сидит. Как оглядывается на броду. Бёдра стёрты, рот сух, и ни то ни другое не причина, по которой я всё смотрю.\n\nОлени ушли, загонщики рассыпались, и задержки никто не заметит. Руки на поводьях холодные, а всё остальное во мне вовсе не холодно. Скачу и сокращаю расстояние до ничего. Лес тикает водой.\n\nНа звук оборачиваются и ждут. Лес полон мокрых листьев, кони отдуваются."
 latria_sexual_frustration_flavor.1217.a: "Увести в деревья и вернуться поздно."
 latria_sexual_frustration_flavor.1217.b: "Ехать к домику и опустить мысль в холодную воду."
 latria_sexual_frustration_flavor.1217.c: "Сойти и читать следы, пока руки не перестанут дрожать."

 latria_sexual_frustration_flavor.1218.t: "Комната с взятыми книгами"
 latria_sexual_frustration_flavor.1218.desc: "Учёный, пускающий меня спать в своей кладовой, оставил мне лампу и книгу, которую я плохо читаю. Дождь по ставням, запах мокрой соломы. Тело беспокойно с последнего города, и узкая постель делает хуже. Лампа коптит, когда сквозняк её находит.\n\nЗаходят поправить фитиль и стоят, пальцы на полке, и от них пахнет чернилами. Прошу остаться и объяснить страницу. Остаются. Плечо у моего, пока показывают пальцем, и никто из нас его не убирает, а грамматику я перестал слышать.\n\nДождь слабеет. Палец всё на той же строке."
 latria_sexual_frustration_flavor.1218.a: "Петь, скверно, пока у желания не появится куда идти."
 latria_sexual_frustration_flavor.1218.b: "Поблагодарить, погасить лампу и лечь спиной к двери."
 latria_sexual_frustration_flavor.1218.c: "Попросить учить дальше и держать руки на странице."
 latria_sexual_frustration_flavor.1218.d: "Переписать отрывок трижды, пока рука не устанет хотеть."

 latria_sexual_frustration_flavor.1219.t: "Комната за залой"
 latria_sexual_frustration_flavor.1219.desc: "Пир вылился во двор, и нас двоих занесло в маленькую комнату за залой, где держат запасные скамьи. Спина к двери, ладонь плашмя на моей груди, и надо мной смеются, ждут.\n\nСправляюсь с пряжкой пояса, потом со шнуровкой, и снова смех, и помощь. Губы у горла, бедро между моих, и притворяться поздно. На скамье мы не спешим, волосы распускаются, дыхание рвётся, пока не пройдёт дрожь — и я вслед.\n\nПосле запястье всё ещё в чужой руке. В зале снова заиграла музыка."
 latria_sexual_frustration_flavor.1219.a: "Сказать правду и не отпускать руку."
 latria_sexual_frustration_flavor.1219.b: "Поправить одежду, поблагодарить и вернуться в залу."
 latria_sexual_frustration_flavor.1219.c: "Сидеть на скамье, пока музыка не кончится."

 latria_sexual_frustration_flavor.1220.t: "Бдение, которое я выдержал"
 latria_sexual_frustration_flavor.1220.desc: "Я сказал остальным, что останусь на бдение, и мне оставили церковь, одну свечу и запах прошлой недели ладана. Полночь пришла и ушла. Колени ноют, тело не желает молчать. Плиты вынули тепло из моих ступней.\n\nСтоит закрыть глаза — и на пояснице рука, с танца двух зим назад, и приходится открывать снова. Свеча бросает тень на стену. Мог бы прекратить это в один миг, и никто никогда не узнал бы, и в этом вся беда.\n\nИз дверей тянет. Тень движется по стене."
 latria_sexual_frustration_flavor.1220.a: "Взять это в свои руки здесь и быть честным перед святыми."
 latria_sexual_frustration_flavor.1220.b: "Остаться на коленях, пока окно не посереет."
 latria_sexual_frustration_flavor.1220.c: "Читать службу вслух, пока голос не станет единственным в комнате."

 latria_sexual_frustration_flavor.1221.t: "Перчатка посла"
 latria_sexual_frustration_flavor.1221.desc: "Посол третий день в моей зале, и каждый из них сосчитан. Перчатку снимают, чтобы переворачивать страницы договора, палец за пальцем, и пункт о реке ускользнул дважды. Огонь прогорел, а за дровами не послали.\n\nСоветники смотрят, как я не слушаю. В городе есть место, где имени не спрашивают, и мысль о нём сидит у меня в груди со второго утра, тяжёлая, тёплая и совершенно недостойная. Та дверь не открывалась для меня год.\n\nПерчатку протягивают, чтобы я посмотрел на печать. Беру. Она ещё тёплая."
 latria_sexual_frustration_flavor.1221.a: "Подписать, отпустить и сойти сегодня в город."
 latria_sexual_frustration_flavor.1221.b: "Прочесть пункт снова и держать руки на столе."
 latria_sexual_frustration_flavor.1221.c: "Разбирать условия одно за другим, пока свечи не оплывут."
 latria_sexual_frustration_flavor.1221.d: "Узнать, какая дверь в городе тихая."

 latria_sexual_frustration_flavor.1222.t: "Слишком долгое рукопожатие"
 latria_sexual_frustration_flavor.1222.desc: "Танцы дошли до медленного такта, и весь вечер меня передают из рук в руки. Последняя рука не отпускает, когда музыка стихает. В зале жарко от свечей и от чужого вина. Камыш истоптан, свечи оплывают.\n\nБольшой палец на моих костяшках. Зала смотрит и притворяется, что нет, уши горячие, и руки я не забираю. Кто-то смеётся у музыкантов. Хватка сжимается один раз, нарочно, и всё тело отвечает прежде, чем лицо успевает устроиться. Рука в чужой не тверда. Музыка начинается снова за спиной.\n\nОтпускают. Отпечаток пальцев остаётся на руке."
 latria_sexual_frustration_flavor.1222.a: "Сказать, чего хочу, там, где слышит вся зала."
 latria_sexual_frustration_flavor.1222.b: "Поблагодарить за танец и отступить в толпу."
 latria_sexual_frustration_flavor.1222.c: "Попросить проводить до дверей и говорить о лошадях."

 latria_sexual_frustration_flavor.1223.t: "Брод"
 latria_sexual_frustration_flavor.1223.desc: "Останавливаемся у брода напоить коней, и день так жарок, что половина отряда лезет в воду. Стою на плоском камне без рубахи, выжимаю её, и замечаю того, кто всё ещё в седле и смотрит. Вода громкая на камнях. Кони пьют и переступают.\n\nВзгляд не отводят, когда я его ловлю. Вода бежит по рёбрам и с запястья. С этим днём и целым лесом вокруг можно сделать многое, и тело уже решило, и от этого трудно думать о лошадях.\n\nСпешиваются. Поводья всё ещё в руке."
 latria_sexual_frustration_flavor.1223.a: "Бросить рубаху и идти на глазах у всякого, кому угодно смотреть."
 latria_sexual_frustration_flavor.1223.b: "Надеть рубаху и ехать вперёд к домику."
 latria_sexual_frustration_flavor.1223.c: "Достать сокола и занять руки, пока отряд не будет готов."

 latria_sexual_frustration_flavor.1224.t: "Два всадника и трава"
 latria_sexual_frustration_flavor.1224.desc: "Трава высока настолько, чтобы спрятать коня, и небо делает то, что делает перед дождём. Едем рядом с тех пор, как стадо повернуло, и последний фурлонг чужая нога — у моей, и никто из нас этого не поправил. Ветер пахнет раздавленными стеблями. Кони мокры до колен.\n\nЗдесь нет стены, за которой спрятаться, и нет священника в дне пути. Желание от этого никогда не становилось проще. Оно только стало больше, как больше эта земля, и я перестал притворяться, что не знаю, куда это идёт.\n\nНа гребне осаживают и смотрят через плечо. Падают первые капли."
 latria_sexual_frustration_flavor.1224.a: "Взять за руку и свести вниз, в высокую траву."
 latria_sexual_frustration_flavor.1224.b: "Кивнуть, повернуть коня и обогнать их до повозок."
 latria_sexual_frustration_flavor.1224.c: "Поставить мишень у дальнего столба и стрелять, пока руки не задрожат."

 latria_sexual_frustration_flavor.1225.t: "Что я сказал в исповедальне"
 latria_sexual_frustration_flavor.1225.desc: "Я стоял на коленях в деревянном ящике и сказал это вслух, что было хуже, чем не сказать ничего. Священник по ту сторону решётки не ахнул и не выбранил. Задал вопрос о моём доме и ждал, и я услышал, как собственный голос даёт ответ. Церковь пахнет холодным камнем.\n\nИдя назад через церковь, я всё ещё в жару лицом. Это не стыд — или не только он. Сказав, я снова чувствую всё это, при свете дня, перед алтарём, и у тела совсем нет манер. Ворот слишком тесен.\n\nЭтот человек всё ещё в ящике. Занавес шевелится, когда я прохожу."
 latria_sexual_frustration_flavor.1225.a: "Вернуться к ящику и попросить выслушать остальное."
 latria_sexual_frustration_flavor.1225.b: "Встать на колени у ограды и принять епитимью и слова, которые дадут."
 latria_sexual_frustration_flavor.1225.c: "Сесть в боковом проходе и слушать наставление, пока не успокоюсь."

 latria_sexual_frustration_flavor.1226.t: "Пробуждение в четвёртом часу"
 latria_sexual_frustration_flavor.1226.desc: "Выхожу из сна с колотящимся сердцем, влажными бёдрами и простыней, сброшенной в ноги. Во сне был конный двор и рука на шее, и я знаю, чья рука. В комнате холодно, подушка мокрая там, где был рот.\n\nКомната серая. В ней никого. Телу нет дела до серости и до часа. Оно хочет, чтобы сон был закончен, и очень ясно знает, как. Кладу руку поперёк глаз и лежу с поднятыми коленями. Пол холоден до боли.\n\nПтица под кровлей начинает. Рука уже движется."
 latria_sexual_frustration_flavor.1226.a: "Закончить, и пусть в доме думают, что я сплю."
 latria_sexual_frustration_flavor.1226.b: "Встать, одеться и идти в конюшню работать до боли."
 latria_sexual_frustration_flavor.1226.c: "Читать письмо на столе, пока свет не станет настоящим."

 latria_sexual_frustration_flavor.1227.t: "Спор"
 latria_sexual_frustration_flavor.1227.desc: "Кто-то поспорил на коня, что я не назову при целом столе имени того, кого хочу. Вино хорошее, огонь жаркий, спор глупый, и все ждут. Пёс под скамьёй перестал грызть и слушает. Спор заключён при человеке епископа.\n\nИмя во рту, как камень. Через стол тот самый человек смотрит в деревянное блюдо и не на меня, а затылок у меня мокрый. Скажу — и к воскресенью это будет в каждой зале. Кто-то подбросил дров.\n\nУправитель снова наливает. Стол затих."
 latria_sexual_frustration_flavor.1227.a: "Назвать имя — и пусть зала делает с ним что хочет."
 latria_sexual_frustration_flavor.1227.b: "Рассмеяться, заплатить проигрыш и потребовать ещё вина."
 latria_sexual_frustration_flavor.1227.c: "Расставить доску и обыграть того, кто спорил."
 latria_sexual_frustration_flavor.1227.d: "Сложить стих, где имя есть и которого нет."

 latria_sexual_frustration_flavor.1228.t: "Условия"
 latria_sexual_frustration_flavor.1228.desc: "Брак обсуждают под деревьями, тем голосом, каким говорят об имуществе. Тот, кого это касается, стоит у стены со сложенными руками, пока писец читает вслух оценку. Пчела работает в лаванде между нами, и никто её не отгоняет. Голос писца на числах становится плоским.\n\nМне поручено решить вопрос приданого. Одну и ту же строку читаю в четвёртый раз. То, чего я хочу, неприлично и на бумаге его нет, и оно весь день стоит у стены в зелёном плаще. У зелёного плаща надорван обшлаг.\n\nПисец ждёт с поднятым пером. Лист падает на стол."
 latria_sexual_frustration_flavor.1228.a: "Быстро решить условия и отослать писца и семью."
 latria_sexual_frustration_flavor.1228.b: "Прочесть каждую строку дважды и ничего не выдать."
 latria_sexual_frustration_flavor.1228.c: "Забрать бумаги внутрь и решить на свежую голову."
 latria_sexual_frustration_flavor.1228.d: "Привести в порядок счета поместья и дать числам удержать меня."

 latria_sexual_frustration_flavor.1229.t: "Рука писца"
 latria_sexual_frustration_flavor.1229.desc: "Переписывание идёт медленно, в скриптории холодно, и одно и то же слово написано неверно трижды. Ум не на странице. Он на губах того, кто принёс хлеб в полдень. Через два стола кто-то дышит заложенным носом. Хлеб был ещё тёплым, когда его принесли.\n\nЯ дал обет и держу его, и от этого держания знаю своё тело так, что молитвой это не вымаливается. Рука дрожит над пергаментом. Есть способ закончить это, длящийся примерно столько же, сколько короткая молитва, и я его хочу.\n\nЧернила сохнут на неверной букве."
 latria_sexual_frustration_flavor.1229.a: "Отложить обет на один день и честно сказать почему."
 latria_sexual_frustration_flavor.1229.b: "Держаться обета и дать желанию прогореть."
 latria_sexual_frustration_flavor.1229.c: "Взять отрывок снова и переписывать, пока рука не станет твёрдой."

 latria_sexual_frustration_flavor.1230.t: "Сумерки в саду"
 latria_sexual_frustration_flavor.1230.desc: "Выхожу из дома в ночной рубашке, потому что в комнате было хуже. Сад синий, мотыльки у лаванды. Кто-то в людской играет на струнном, скверно, всё те же четыре ноты, снова и снова. Трава мокрая сквозь туфли, подол тяжёлый.\n\nВсё ещё чувствую, где вечером у калитки рука лежала на моей талии, легко, пока длилась учтивость. Это не выцвело. Всю ночь оно только громче, музыка не помогает, и собственной кожи как будто мало. От калитки до сих пор не сдвинулся с места. Скамья холодна сквозь лён.\n\nСажусь на каменную скамью. Мотыльки всё у лаванды."
 latria_sexual_frustration_flavor.1230.a: "Уйти внутрь и дать музыке прикрыть то, что я делаю."
 latria_sexual_frustration_flavor.1230.b: "Остаться на скамье, пока холод не пройдёт сквозь рубашку."
 latria_sexual_frustration_flavor.1230.c: "Дышать, считать четыре ноты и дать саду быть достаточным."

 latria_sexual_frustration_flavor.1231.t: "Разбуженный до колокола"
 latria_sexual_frustration_flavor.1231.desc: "Просыпаюсь до колокола, простыня сброшен на пол, кожа вдоль поясницы влажная. Рубашка скрутилась вокруг бёдер. Сон был, и сон всё ещё на мне — тепло, которое осело низко и не поднимается.\n\nТо же лицо, к которому всю неделю я старался не обращаться мыслью. Во сне никакой осторожности не было. Рука на талии, губы, чью форму можно ощутить, и тело отвечает прежде, чем что-либо решено. Сейчас сна нет, а оно не прекратилось.\n\nЛежу с подтянутыми коленями, ладонь плашмя на животе, и тепло только собирается под ней. Колокол не звонил. Дыхание частое и мелкое, и замедлить его я не двинулся."
 latria_sexual_frustration_flavor.1231.a: "Погасить лампу и дать своей руке закончить."
 latria_sexual_frustration_flavor.1231.b: "Расправить платье, перевернуться и лежать тихо до колокола."
 latria_sexual_frustration_flavor.1231.c: "Читать, пока тепло не ослабит хватку."

 latria_sexual_frustration_flavor.1232.t: "Поездка в стороне"
 latria_sexual_frustration_flavor.1232.desc: "Мы в седле задолго до света, и глаза я держу на всаднике впереди. Как этот человек сидит. Как оглядывается на броду и придерживает коня, чтобы я поехал рядом. Бёдра стёрты до крови, рот сух, и ни то ни другое не причина, по которой я смотрю.\n\nОлени ушли, загонщики рассыпались по мокрому лесу. Задержки никто не заметит. Скачу, пока расстояние не кончится, и колено находит чужое, и кожа скрипит, и повода не отводит никто.\n\nНа звук оборачиваются и ждут. Лес громок от капающей воды. Руки на поводьях холодные, а всё остальное вовсе не холодно, и конь стоит и отдувается подо мной."
 latria_sexual_frustration_flavor.1232.a: "Закрыть последнее расстояние и отдать это лесу."
 latria_sexual_frustration_flavor.1232.b: "Осадить, ехать дальше одному и совладать с собой."
 latria_sexual_frustration_flavor.1232.c: "Сойти и идти по мокрой тропе, пока голова не прочистится."

 latria_sexual_frustration_flavor.1233.t: "Час, который держат святые"
 latria_sexual_frustration_flavor.1233.desc: "В церкви никого, только я и лампы, которые велено подрезать. Холод идёт вверх сквозь плиты, но под рясой тело тёплое, бодрое и служба его не занимает. Святые смотрят мимо меня на затворённую дверь.\n\nМне известны слова, назначенные это остудить. Я произносил их над другими в темноте ящика у дверей тем голосом, который держу для их грехов. Над своими они не делают ничего. Желание сидит за рёбрами, как проглоченный уголь, а рука сама легла плашмя на алтарный камень.\n\nНажимаю, пока холодный край не заболит в ладони. Колокол скоро зазвонит. Рука всё ещё на камне, и камень взял у меня тепло и больше не холоден."
 latria_sexual_frustration_flavor.1233.a: "Взять желание в свои руки и просить прощения после."
 latria_sexual_frustration_flavor.1233.b: "Простоять службу на коленях и дать часам его износить."
 latria_sexual_frustration_flavor.1233.c: "Опустить лоб на холодный камень и дать ему меня укрепить."

 latria_sexual_frustration_flavor.1234.t: "Рука, задержанная слишком долго"
 latria_sexual_frustration_flavor.1234.desc: "Совет разошёлся, в кабинете тихо. Весь последний час я знаю только одно: когда мой посол тянется через стол передать мне договор, чужая рука легла на мою и осталась на вдох дольше, чем требовала печать. В комнате было полно людей. Я позволил ей остаться.\n\nВозвращаюсь к тяжести этой руки, к теплу ладони, которой не было причин задерживаться. Свеча догорела, пока я трижды читал один и тот же пункт. Тело решило, что это стоит больше договора, и моего мнения на этот счёт не спрашивает.\n\nПерстень оставил след на тыльной стороне моей руки. Я его не стёр. Воск собирается лужицей, дверь закрыта, и я читаю пункт в четвёртый раз."
 latria_sexual_frustration_flavor.1234.a: "Послать снова и прямо сказать, что сделала со мной эта рука."
 latria_sexual_frustration_flavor.1234.b: "Держать ночную стражу одному и дать бдению меня остудить."
 latria_sexual_frustration_flavor.1234.c: "Расставить доску и играть с собой, пока образ не выцветет."

 latria_sexual_frustration_flavor.1235.t: "Когда музыка поворачивает"
 latria_sexual_frustration_flavor.1235.desc: "В зале громко, вино обошло круг дважды. Когда музыканты берут, я позволяю себя втянуть в танец, и партнёр — тот, на кого я весь вечер не смотрел. Рука устраивается у меня на спине, и сквозь тонкую ткань чувствуется каждый палец.\n\nПоворачиваемся, и снова, и комната расплывается в дыме свечей и цвете. Держат чуть ближе, чем просит фигура, и я не поправляю. Пульс в ушах, громче барабана. Желание поднялось ниоткуда и заявило на меня права перед всей залой, а я улыбаюсь, будто ничего не происходит.\n\nМузыка замедляется к концу. Рука не сдвинулась с моей спины, и я не отступил."
 latria_sexual_frustration_flavor.1235.a: "Попросить музыкантов ещё об одном танце и держать ближе."
 latria_sexual_frustration_flavor.1235.b: "Поблагодарить, поклониться и уйти прежде, чем фигура повернёт снова."
 latria_sexual_frustration_flavor.1235.c: "Остаться в обществе и говорить о чём угодно, кроме этого."
