 latria_sexual_frustration_flavor.1411.t: "Никого у двери"
 latria_sexual_frustration_flavor.1411.desc: "Лампа догорела до огарка, а сна всё нет; рубашка задрана выше бёдер, рука там, куда, как я никому не говорил, она уходит. Я перестал называть это беспокойством. Три ночи я довожу себя до края и оставляю там, слушая шаги в проходе, которых не бывает. Простыня сырая: слишком долго я лежу не двигаясь.\n\nДумаю о том, как этот человек склоняется над моим стулом на пиру, так близко, что вместе с ним из комнаты уходит тепло. Дыхание короткое. Прижимаю ладонь плашмя и не двигаюсь, и желание не отпускает — только собирается ниже и тяжелее.\n\nГде-то внизу закрывается дверь. Рука снова движется, и на этот раз я её не останавливаю."
 latria_sexual_frustration_flavor.1411.a: "Закончить начатое рукой и признать желание."
 latria_sexual_frustration_flavor.1411.b: "Убрать руку и лежать тихо, пока лампа не умрёт."
 latria_sexual_frustration_flavor.1411.c: "Надеть халат и сидеть с тишиной, пока она не ослабнет."

 latria_sexual_frustration_flavor.1412.t: "Больше, чем хотел"
 latria_sexual_frustration_flavor.1412.desc: "В зале громко от последнего вина, и я уже сказал слишком много. Сосед спросил, где я выучил такую историю, и я рассказал, а потом рассказал и остальное — то, чего никогда не говорил вслух при свете дня.\n\nКто-то смеётся и требует ещё. Слышу, как собственный голос идёт дальше, быстрее, добавляя подробность, которую я всегда опускаю: час, дверь, то, как я ждал. От вина лицо горячее. Где-то за спиной ставят чашу. Не могу заставить себя остановиться там, где остановился бы осторожный человек.\n\nСтул соседа отодвигается со скрежетом. Музыка кончилась, и по домам ещё никто не ушёл, в зале пахнет салом и пролитым вином, а чашу, которую я собирался поставить, я всё ещё держу."
 latria_sexual_frustration_flavor.1412.a: "Сказать остальное — и пусть слышит весь стол."
 latria_sexual_frustration_flavor.1412.b: "Поклониться обществу, оставить остальное за зубами и уйти."
 latria_sexual_frustration_flavor.1412.c: "Перевести речь на старых друзей и дать вину сделать остальное."

 latria_sexual_frustration_flavor.1413.t: "Всё те же три строки"
 latria_sexual_frustration_flavor.1413.desc: "Стою на коленях у алтаря, рубашка под коленями, камень холоден сквозь ткань. Плиты вынули тепло из голеней. Прислужник ушёл. Служба прочтена вся, а рот всё возвращается к одним и тем же трём строкам — тем, что о плоти, — будто слова это дверь, мимо которой я всё хожу.\n\nДнём я могу назвать это испытанием и покончить с этим. Здесь, при оплывающих свечах и без свидетелей, я могу только измерить, насколько я хочу уйти из храма и дойти до определённого дома прежде, чем сменится стража. У желания есть вес. Колени ноют от того, что несут его.\n\nБлижняя свеча гнётся и выпрямляется. Кладу руку на холодный камень и не встаю."
 latria_sexual_frustration_flavor.1413.a: "Оставить службу недочтённой и идти, куда хочу."
 latria_sexual_frustration_flavor.1413.b: "Держать бдение и держаться слов до рассвета."
 latria_sexual_frustration_flavor.1413.c: "Читать отрывок медленно и дать смыслу вернуться."

 latria_sexual_frustration_flavor.1414.t: "Езда не помогает"
 latria_sexual_frustration_flavor.1414.desc: "Мы в седле задолго до света, и олени всё ещё впереди. Руки на поводьях тверды. В этом и беда. Всё остальное во мне не твердо, и уже много дней, а езда только расшатала это.\n\nВсё вижу того человека на прошлой охоте: смех, волосы мокрые от ручья, — и не могу убрать образ. Псы берут. Отдаю коню голову, и земля идёт быстро, и на несколько саженей я не думаю ни о чём.\n\nПотом лес смыкается, шаг падает, и всё возвращается. Сижу в седле, бёдра горят, ремень рога протёр метку на бедре, и я не поднимаю рог."
 latria_sexual_frustration_flavor.1414.a: "Отколоться от вереницы и скакать, пока мысль не выйдет."
 latria_sexual_frustration_flavor.1414.b: "Держать вереницу, взять рог и держать порядок охоты."
 latria_sexual_frustration_flavor.1414.c: "Читать землю, на которую указывает псарь, и идти по следам."

 latria_sexual_frustration_flavor.1415.t: "Дверь заперта"
 latria_sexual_frustration_flavor.1415.desc: "Лампа притушена, дверь заперта, и тот, кого я хочу год, здесь, в моей комнате, без одежды, с ладонью плашмя на моей груди. Ладонь тёплая сквозь ткань.\n\nПритягиваю на постель, и тяжесть настоящая, и жар кожи, и тихий звук у уха. Верёвки кровати скрипят под нами. Я так часто это воображал, что сама явь почти разбирает меня прежде, чем что-либо случилось. Бёдра поднимаются. Губы находят моё горло, и счёт собственному дыханию я теряю.\n\nПосле лампа всё ещё горит, длинная нить воска стекла по подставке. Волосы разметались по моей руке, и о утре не сказано ни слова."
 latria_sexual_frustration_flavor.1415.a: "Оставить здесь — и пусть двор говорит, если должен."
 latria_sexual_frustration_flavor.1415.b: "Отправить в собственную комнату и лечь одному."
 latria_sexual_frustration_flavor.1415.c: "Дотянуться до книги и читать, пока руки не успокоятся."

 latria_sexual_frustration_flavor.1416.t: "Запястье через стол"
 latria_sexual_frustration_flavor.1416.desc: "Совет затянулся, и я не подписал ничего. Печать лежит холодная у чернил. Огонь отпустили погаснуть, и за дровами никто не послал. Писец читает следующую строку, и я слышу форму слов без смысла, потому что у того, кто через стол, рукав засучен, и я смотрю на запястье.\n\nПоверенный ловит мой взгляд. Заставляю себя попросить прочесть пункт снова. Читают снова. Не понимаю ничего. Под столом колено начало двигаться, и я прижимаю его рукой.\n\nКогда лорды встают, я остаюсь сидеть, пока комната не опустеет. Поверенный ждёт у дверей с бумагами, ничего не говоря, и я благодарен и не могу смотреть."
 latria_sexual_frustration_flavor.1416.a: "Распустить совет и взять день себе."
 latria_sexual_frustration_flavor.1416.b: "Остаться на месте, взять бумаги и признаться поверенному."
 latria_sexual_frustration_flavor.1416.c: "Позвать писца и уладить каждый пункт, прежде чем встать."

 latria_sexual_frustration_flavor.1417.t: "Один и тот же вопрос дважды"
 latria_sexual_frustration_flavor.1417.desc: "Храм пуст, наставник всё ещё здесь, разбирает свитки, и я не ушёл, потому что не могу заставить себя уйти. Я задал вопрос об обряде, потом другой, и оба были одним и тем же вопросом в разной одежде.\n\nНаставник отвечает терпеливо. Свитки пахнут пылью и кедровым маслом. Смотрю, как руки движутся среди них, и думаю о ночном часе, о том, как далеко идти до одной двери, и о том, не спится ли кому-то. Лампа между нами — единственное, что держит меня на месте.\n\nНаставник кладёт передо мной свиток и ждёт. Колени застыли на холодной ступени. Кладу руку на свиток и читаю первое слово, а второго нет."
 latria_sexual_frustration_flavor.1417.a: "Поблагодарить наставника, выйти и идти к той двери."
 latria_sexual_frustration_flavor.1417.b: "Попросить пройти обряд ещё раз, медленно."
 latria_sexual_frustration_flavor.1417.c: "Развернуть свиток и слушать, что говорит наставник."

 latria_sexual_frustration_flavor.1418.t: "Имя в саду"
 latria_sexual_frustration_flavor.1418.desc: "В саду полно людей, и я выпил ровно столько, чтобы быть честным. Чашу дважды наполняли без моей просьбы. Я сказал это вслух. Не всё, а ту часть, в которой есть имя, и имя было не чужое.\n\nСмех обошёл круг, кто-то повторил, и кто-то ещё посмотрел на меня с новым интересом. На гравии видно, где круг сдвинулся. Надо было дать этому пройти как вину. Вместо этого сказано больше, и круг затих так, как круг затихает, когда решил запомнить.\n\nСлуга идёт по дорожке с подносом. Беру чашу, которую не хочу, и держу у рта, чтобы не заполнить молчание."
 latria_sexual_frustration_flavor.1418.a: "Назвать имя снова, ясно, при всех."
 latria_sexual_frustration_flavor.1418.b: "Поклониться, откланяться и покинуть сад."
 latria_sexual_frustration_flavor.1418.c: "Отвести в сторону ближайшего гостя и говорить о другом."

 latria_sexual_frustration_flavor.1419.t: "С самого коридора"
 latria_sexual_frustration_flavor.1419.desc: "Дверь заперта, покрывала откинуты, и притворяться, что я слишком устал, больше не буду. Тело такое с самого дня, с руки на моём плече в коридоре, и оно не успокоилось.\n\nКладу пальцы к себе, и дыхание выходит так, что этого не хотелось бы услышать. Думаю о коридоре, о льне того рукава, о точной силе пальцев. Спина выгибается над постелью. Приходится закрыть рот другой рукой.\n\nЭто длится долго и оставляет меня дрожащим. Лампа всё ещё горит. Лежу, рука поперёк глаз, простыни скручены до пояса, всё ещё пахнущие дневным жаром, и желание не ушло — только притихло."
 latria_sexual_frustration_flavor.1419.a: "Дать этому идти и перестать притворяться усталостью."
 latria_sexual_frustration_flavor.1419.b: "Сжать руки, дышать медленно и ждать, пока дрожь пройдёт."
 latria_sexual_frustration_flavor.1419.c: "Прочесть страницу при лампе, пока тело не затихнет."

 latria_sexual_frustration_flavor.1420.t: "Два дня в седле"
 latria_sexual_frustration_flavor.1420.desc: "Два дня в седле, и степи конца нет. Седло протёрло ссадину под коленом. Конь знает шаг лучше меня. Я не спал как следует с тех пор, как мы ушли из лагеря, и не земля, на которой я лежу, не даёт сна.\n\nДумаю о том, как этот человек у огня заплетает косу, как прикусывает конец нити. Ветер холоден, руки в трещинах, и мысль всё равно возвращается и оседает низко, настойчивая, как второй пульс.\n\nВыходим на подъём, и трава идёт вниз к реке, бледная полоса без звука. Мог бы вернуться один. Конь переступает подо мной, ждёт, а я сижу с распущенными поводьями и не поворачиваю."
 latria_sexual_frustration_flavor.1420.a: "Повернуть к лагерю и взять то, что предлагает ночь."
 latria_sexual_frustration_flavor.1420.b: "Ехать с остальными и держать шаг."
 latria_sexual_frustration_flavor.1420.c: "Спустить сокола и идти за его полётом к воде."

 latria_sexual_frustration_flavor.1421.t: "За пределами осторожности"
 latria_sexual_frustration_flavor.1421.desc: "Пир зашёл за ту черту, где хоть кто-то осторожен. Я весь вечер смотрю на того человека и ни разу не отвёл глаз — и только что сказал это комнате, голосом, который было слышно.\n\nЧаша опрокидывается. Музыканты не начали снова. Кто-то смеётся, кто-то зовёт их, а я на ногах, и слова всё идут. Я назвал час, который хочу, и место, и комната это слышала. Нет такого завтра, в котором это только шутка.\n\nСосед тянет меня за рукав. Сажусь, потому что ноги стали ненадёжны, воск стёк по столу к моему рукаву, чаша снова вложена мне в руку, а я всё ещё смотрю через стол."
 latria_sexual_frustration_flavor.1421.a: "Назвать час и место снова, чтобы никто не ослышался."
 latria_sexual_frustration_flavor.1421.b: "Сесть, пить и дать шуму смыкнуться над сказанным."
 latria_sexual_frustration_flavor.1421.c: "Обернуться к соседу и спросить о собственном доме."
 latria_sexual_frustration_flavor.1421.d: "Вложить всё это в стих для стола."

 latria_sexual_frustration_flavor.1422.t: "Три ночи бдения"
 latria_sexual_frustration_flavor.1422.desc: "Три ночи подряд я держу бдение, и от поста голова стала лёгкой. Холод забрался в мелкие кости ступней. Слова службы во рту, а человек в уме, и они спутались так, что не разделить.\n\nЗнаю, чего требует обет. Я дал его охотно и до этой ночи не давал неохотно. Руки холодны, и желудок забыл, что такое хлеб. Камень под коленями протёрся до гладкого места, и я в него вкладываюсь, будто стою здесь годами, — что, в том смысле, который важен, правда.\n\nГде-то в темноте кашляет брат, и кто-то переступает на скамье за столбом. Склоняю голову ниже, и молитва идёт дальше без моего голоса."
 latria_sexual_frustration_flavor.1422.a: "Прервать пост, оставить бдение и признать, чего хочу."
 latria_sexual_frustration_flavor.1422.b: "Держать пост и обет до конца ночи."
 latria_sexual_frustration_flavor.1422.c: "Обратиться к отрывку о душе и прочесть его."

 latria_sexual_frustration_flavor.1423.t: "Неверная цифра"
 latria_sexual_frustration_flavor.1423.desc: "Счета не сходятся, и один и тот же столбец прочтён четырежды. Свеча новая, воск не стёк. Через палату кто-то диктует писцу, и голос этот я узнал бы в толпе, а ум совсем ушёл из столбца.\n\nКладу палец на страницу, чтобы держать место. Не держит. Перо писца всё движется. Чувствую собственный пульс в горле, что нелепо, и в комнате холодно, а мне не холодно.\n\nКогда диктовка кончается, поднимаю глаза слишком быстро. Писец ждёт. Прошу цифру снова и записываю неверную, и чернила на ней сохнут, и я не поправляю, пока палата не опустеет."
 latria_sexual_frustration_flavor.1423.a: "Оставить счета и идти туда, куда идёт голос."
 latria_sexual_frustration_flavor.1423.b: "Держаться столбца, пока каждая цифра не станет верной."
 latria_sexual_frustration_flavor.1423.c: "Послать за счётной книгой и проверить каждую запись с первой."

 latria_sexual_frustration_flavor.1424.t: "Нетронутое вино"
 latria_sexual_frustration_flavor.1424.desc: "Дверь на засове, вино нетронуто, и тот, кого я хочу, здесь, в распахнутом халате, с руками на моём лице. Руки сначала холодные, а потом нет.\n\nПритягиваю к себе, и всё это теплее и неуклюжее всего, что я воображал. Колено находит постель, и рама один раз стучит о стену. Рука идёт к пояснице и ниже, и звук, который издают, не тихий, и мне всё равно, кто услышит. Меня трясёт от того, как долго я ждал.\n\nПотом лампа догорела, и вино в чаше согрелось. Голова на моём плече, рука под ней затекла, и я слушаю дыхание."
 latria_sexual_frustration_flavor.1424.a: "Прямо сказать, чего мне стоило это год ожидания."
 latria_sexual_frustration_flavor.1424.b: "Отстраниться, поправить халат и держать руки при себе."
 latria_sexual_frustration_flavor.1424.c: "Лежать тихо и читать при притушенной лампе, пока не придёт сон."

 latria_sexual_frustration_flavor.1425.t: "Старательные руки"
 latria_sexual_frustration_flavor.1425.desc: "Три дня в лесу, охота хороша, и ничто из этого не коснулось того, что во мне. Я старателен. Встаю раньше остальных, слежу, чтобы сбруя высохла, беру линию, которую мне назначает псарь. Руки делают то, что им велено.\n\nОстальное во мне в другом месте. Помню один особенный день, дверной проём, человека и то, как моё имя было сказано — так, что забыть не удаётся, и память приходит, когда я стою в стременах, и снова, когда я обделываю добычу, с запахом шкуры на руках.\n\nОгонь низок, угли тикают, остывая. Руки ноют от дня, и я лежу на спине с открытыми глазами, слушаю, как переступают кони."
 latria_sexual_frustration_flavor.1425.a: "Оставить линию и увести рыжего в темноту."
 latria_sexual_frustration_flavor.1425.b: "Дышать, подтянуть подпругу и закончить дневную работу."
 latria_sexual_frustration_flavor.1425.c: "Проследить, чтобы сбруя высохла и счёт был сведён, прежде чем спать."

 latria_sexual_frustration_flavor.1426.t: "Полторы страницы"
 latria_sexual_frustration_flavor.1426.desc: "В кабинете тихо, наставник разложил текст, и я прочёл полторы страницы, не взяв ни слова. Большой палец оставил метку на полях. Лампа хорошая. Ночь длинная. Никто меня не ждёт.\n\nВсё думаю о часе, когда двор спит и коридор пуст. Наставник поворачивает страницу и спрашивает, слежу ли я за доводом. Отвечаю, что слежу. Я не слежу с первой строки о природе души, и это жаль, потому что эта строка нужнее всего.\n\nНаставник ждёт, перо в руке, а у кресла есть соединение, которое жалуется, когда я двигаюсь. Смотрю на страницу, и моя рука плашмя на дереве, очень тихая, будто принадлежит кому-то более спокойному."
 latria_sexual_frustration_flavor.1426.a: "Закрыть книгу и выйти, пока коридор пуст."
 latria_sexual_frustration_flavor.1426.b: "Остаться на месте и прочесть страницу снова с начала."
 latria_sexual_frustration_flavor.1426.c: "Попросить наставника пройти довод ещё раз."

 latria_sexual_frustration_flavor.1427.t: "Щедрый на вино"
 latria_sexual_frustration_flavor.1427.desc: "Я был щедр на вино, и общество было щедро в ответ, и где-то между этим я сказал столу, чего хочу. Не прямо. Достаточно прямо. Здесь есть человек, чьё имя я назвал и чьего лица не смотрел, называя.\n\nКто-то перестал смеяться, и пёс под скамьёй грызёт что-то. Чаша пуста, слуга наполняет, и я позволяю. В комнате тишина людей, решающих, что делать с тем, что им передали.\n\nМесто сестры сегодня пусто, и её чаша всё там, где её поставил слуга, — милость, которой я не заслуживаю. Кладу обе руки на стол, дерево прохладное, и музыка начинается снова на дальней стороне залы."
 latria_sexual_frustration_flavor.1427.a: "Сказать ещё раз, с именем, и пусть семья слышит."
 latria_sexual_frustration_flavor.1427.b: "Поблагодарить общество, взять плащ и уйти."
 latria_sexual_frustration_flavor.1427.c: "Наполнить чаши и перевести речь на урожай."
 latria_sexual_frustration_flavor.1427.d: "Перекидываться шутками с самым громким гостем, пока комната не пойдёт дальше."

 latria_sexual_frustration_flavor.1428.t: "Иконы смотрят"
 latria_sexual_frustration_flavor.1428.desc: "В храме холодно, иконы все смотрят, и я не двигался час. Колени онемели. Желание нет. Оно сидит во мне, как уголь, который не закрыть. Дым свечи идёт прямо вверх, без сквозняка.\n\nЯ молился об избавлении и молился о силе, и здесь мне хватает честности знать, какое из двух прошений я хочу услышанным. Лицо того человека встаёт между мной и золотом. Я его не отгоняю. Лампа пахнет маслом, мрамор холоден, и телу не интересно ни то ни другое.\n\nШаги священника проходят за спиной. Держу голову опущенной и руки вместе, колени оставляют на камне два сырых отпечатка, а ум — у дверного проёма на другом конце города."
 latria_sexual_frustration_flavor.1428.a: "Встать, пересечь город и оставить иконам их стражу."
 latria_sexual_frustration_flavor.1428.b: "Держать обет и остаться на мраморе до конца службы."
 latria_sexual_frustration_flavor.1428.c: "Открыть книгу на псалмах и читать, пока слова не удержат."

 latria_sexual_frustration_flavor.1429.t: "Стена в середине лета"
 latria_sexual_frustration_flavor.1429.desc: "Сад в этот час не принадлежит никому, и я в нём, потому что постель была хуже. Ночь тёплая. Гравий держит дневной жар. Где-то идёт фонтан, единственный голос в саду, и запах трав так силён, что его можно попробовать.\n\nДве ночи я не спал. Иду по дорожке, гравий громок, и каждый поворот приводит к той же стене — той, у которой я стоял с этим человеком в середине лета, ничего не говоря, и оба знали.\n\nРука на камне. Он всё ещё тёплый. Мотылёк всё возвращается к лампе за спиной. Стою там, лоб близко к стене, дыхание идёт скверно, а фонтан всё идёт."
 latria_sexual_frustration_flavor.1429.a: "Выйти из калитки и сказать это ночи."
 latria_sexual_frustration_flavor.1429.b: "Держать обет, снять руку со стены и уйти внутрь."
 latria_sexual_frustration_flavor.1429.c: "Ходить по дорожке, пока небо не посереет и ноги не устанут."

 latria_sexual_frustration_flavor.1430.t: "Струны холодны"
 latria_sexual_frustration_flavor.1430.desc: "Я достал инструмент, потому что дом спит, а лежать дальше было нельзя. Струны холодны, плектр стёрт с одной стороны. Играю то, что играю всегда, и этого мало, и неделю уже мало.\n\nПальцы знают узор, а всё остальное во мне совсем в другом месте — в комнате с ещё закрытыми ставнями, в тот день, к которому я всё возвращаюсь. Ноты уходят в темноту, и никто их не слышит.\n\nОстанавливаюсь, ладонь плашмя на струнах, чтобы убить звук. Тишина после хуже. Сижу, инструмент поперёк колен, струны обмякли от холода, голова откинута к спинке, и окно сереет по краю."
 latria_sexual_frustration_flavor.1430.a: "Играть до конца, скверно, пока не услышит весь дом."
 latria_sexual_frustration_flavor.1430.b: "Положить инструмент и пересидеть остаток ночи."
 latria_sexual_frustration_flavor.1430.c: "Расставить доску и играть за обе стороны, пока не придёт свет."

 latria_sexual_frustration_flavor.1431.t: "Шов в темноте"
 latria_sexual_frustration_flavor.1431.desc: "Свеча оплыла час назад, и покрывало я не подтянул. Рубашка скрутилась вокруг пояса. Пальцы нашли её шов, а потом ушли под неё, медленно, как я сам себя научил, когда коридоры тихи. Глаза закрыты, и передо мной прошлая неделя: управитель, моя чаша, рукав, что задел запястье и остался на вдох дольше.\n\nДыхание ловится и держится. Двигаю рукой, и желание затягивается туже, ниже, — узел, который тянут с двух концов. Думаю о губах у своего уха, о словах, которые не были закончены. Лён тёплый и сырой под ладонью.\n\nВ проходе скрипит половица. Рука замирает, потом начинает снова, и я позволяю, и темнота ещё на миг хранит мой секрет."
 latria_sexual_frustration_flavor.1431.a: "Закончить в темноте и признать голод своим."
 latria_sexual_frustration_flavor.1431.b: "Убрать руку и лежать натянутым, пока фитиль не утонет."
 latria_sexual_frustration_flavor.1431.c: "Закотаться в покрывало и ждать, пока боль ослабнет."

 latria_sexual_frustration_flavor.1432.t: "Недочтённая вечерня"
 latria_sexual_frustration_flavor.1432.desc: "Часовня опустела, и я на коленях в ночной рубашке на холодном камне, молитвы стали жидкими и блуждающими. Рука священника с прошлой исповеди опустилась на мою склонённую голову и осталась, и с тех пор я не могу снять её тяжесть. Ладони прижимают бёдра сквозь тонкую ткань, и это не молитва.\n\nПереступаю на коленях. Камень — удар сквозь лён. Думаю о той руке, о её тепле, о том, как я на долю подался ей навстречу, прежде чем себя поймал. Дыхание рвётся в сводчатой тишине, и я нажимаю сильнее, ищу и не нахожу избавления, о котором пришёл просить.\n\nВерёвка колокола висит надо мной неподвижно. Поднимаю лицо к тёмному алтарю и оставляю руки там, где они есть."
 latria_sexual_frustration_flavor.1432.a: "Отдать телу то, в чём молитва отказала."
 latria_sexual_frustration_flavor.1432.b: "Сжать руки и держать бдение до рассвета."
 latria_sexual_frustration_flavor.1432.c: "Открыть книгу и читать, пока слова не остудат меня."

 latria_sexual_frustration_flavor.1433.t: "Ложе из папоротника"
 latria_sexual_frustration_flavor.1433.desc: "Охота рассыпалась в сумерках, и я один в зелёной тьме, а конь щиплет траву рядом. Сползаю по мшистому стволу, и одежда для верховой езды сырая от пота. Память, что травит меня, — о руках псаря, что подхватили меня за талию, чтобы перенести через ручей: грудь жёстко у моей спины, дыхание у шеи. Рука скользнула за ремень.\n\nНажимаю, и кора кусает плечо. Думаю о руках, о том, как не отпустили сразу. Дыхание дымится на холодном воздухе. Желание свертывается туже с каждым медленным движением, и лес держит свою тишину вокруг, листья где-то невидимо капают.\n\nХрустит ветка. Рука застывает. Конь поднимает голову, а я остаюсь у дерева, и пульс громок в ушах."
 latria_sexual_frustration_flavor.1433.a: "Снять остроту здесь, у дерева."
 latria_sexual_frustration_flavor.1433.b: "Убрать руку и дышать медленно, пока не пройдёт."
 latria_sexual_frustration_flavor.1433.c: "Встать и вести коня назад через деревья."

 latria_sexual_frustration_flavor.1434.t: "Неотправленная записка"
 latria_sexual_frustration_flavor.1434.desc: "Огонь в кабинете низок, и письмо лежит недописанным под рукой — то, которое я не отправлю. Читаю последнюю строку, которую записал, честную, слишком честную, и другая рука подобралась к шнуровке чулок. Думаю о посланнике: слишком близко над этим же столом, взгляд на моём лице вместо карты — и улыбка.\n\nРаспускаю шнуровку. Дыхание укорачивается. Возвращаю наклон головы, приглашение в нём, на которое я был слишком осторожен, чтобы ответить, и рука движется сама, перо сухое в другой. Огонь тикает. Желание собирается и не поддаётся доводам, чтобы стать тем, что можно убрать в папку.\n\nСвеча клонится от сквозняка. Закрываю глаза и даю мысли закончить то, что начал посланник."
 latria_sexual_frustration_flavor.1434.a: "Записать правду и унять боль, которую она зажгла."
 latria_sexual_frustration_flavor.1434.b: "Завязать шнуровку и отступить с холодным словом."
 latria_sexual_frustration_flavor.1434.c: "Взять карту и взвесить дело холодно."

 latria_sexual_frustration_flavor.1435.t: "После последней чаши"
 latria_sexual_frustration_flavor.1435.desc: "Пир поредел до нескольких оплывающих свечей, а гость напротив не ушёл. Под столом моё колено уперлось в чужое, и никто из нас его не убрал. Вино гудит во мне. Думаю, как над моей шуткой смеялись — и как близко это было, так близко, что я мог бы повернуть рот на малое расстояние до чужого.\n\nСвободная рука вцепляется в скамью. Я хочу закрыть этот промежуток сильнее, чем хотел чего-либо за целую эпоху, и желание — яркая проволока, натянутая от горла до живота. Смотрят на меня поверх края чаши. Последний слуга ушёл. В зале пахнет выгоревшим салом и тем, как мы двое дышим.\n\nКолено нажимает в ответ, один раз. Рука уходит со скамьи и находит край чужого рукава, и никто из нас не говорит."
 latria_sexual_frustration_flavor.1435.a: "Пусть музыка прикроет то, что я сделаю дальше."
 latria_sexual_frustration_flavor.1435.b: "Склонить голову и переучить желание в молитву."
 latria_sexual_frustration_flavor.1435.c: "Предложить игру и дать доске остудить кровь."

 latria_sexual_frustration_flavor.1436.t: "Монгольская ночь"
 latria_sexual_frustration_flavor.1436.desc: "Юрта тепла от кизячного огня, и ветер треплет войлок над головой. Я вернулась с большой охоты, кровь всё ещё поднята во мне, и теперь лежу под мехами, сбросив одежду, и тело моё едва управляемо. Я думаю о том, кто ехал рядом со мной весь день, — коса, качающаяся за спиной, — о том, как этот человек смеялся над добычей.\n\nОгонь красит стены в красное. Рука моя нашла путь вниз по животу, и я не зову её назад. Дым сладок, меха тяжелы, и у желания жар, до которого пламени не достать. Я возвращаю посадку его плеч в седле, блеск зубов.\n\nВетер стихает на вдох. Рука моя движется, и я даю ночи взять то, что зажёг день."
 latria_sexual_frustration_flavor.1436.a: "Дать охоте второй исход, здесь, под мехами."
 latria_sexual_frustration_flavor.1436.b: "Закутаться в меха и укротить тело одной волей."
 latria_sexual_frustration_flavor.1436.c: "Ступить на холод и идти, пока кровь не остынет."

 latria_sexual_frustration_flavor.1437.t: "Крыша в лунном свете"
 latria_sexual_frustration_flavor.1437.desc: "Крыша тепла под моей спиной, и жасмин переливается через парапет, тяжёлый от запаха. Внизу песнь наложницы прядёт нить сквозь тьму, и ночь так тепла, что ночная рубаха — скорее украшение, чем покров. Я сложила касиду своего желания и задала ей форму уст того человека.\n\nРука моя покоится на бедре, и сдержанность, что я держу весь вечер, истёрлась в одну нить. Луна очень ярка. Песня вьётся и вьётся. Я возвращаю взгляд, что этот человек бросил на меня над вином, приглашение, на которое я ещё не ответила, и дыхание моё не замедлится.\n\nПоследняя нота тает. Рука моя распускает узел рубахи, и ночь достаточно тепла, чтобы позволить это."
 latria_sexual_frustration_flavor.1437.a: "Ответить на касиду руками и дать крыше утаить это."
 latria_sexual_frustration_flavor.1437.b: "Затянуть рубаху и держаться края, что я держала."
 latria_sexual_frustration_flavor.1437.c: "Взять книгу стихов и дать чужим словам остудить мои."

 latria_sexual_frustration_flavor.1438.t: "Обряд союза"
 latria_sexual_frustration_flavor.1438.desc: "Святлейший обряд моей веры повелевает союз тела, и я пришла к алтарю, чтобы его соблюсти. Свечи стоят высоки. Ночная рубаха тонка против холода камня, и слова обряда распустили меня стежок за стежком, пока желание не стало больше не изъяном, а таинством, возложенным на алтарный покров.\n\nЯ стою на коленях, и руки мои не тверды. Обряд называет это томление святым, и тело моё отвечает на наречение жаром, который не вымолить. Я возвращаю руки, что встретятся с моими здесь, обет, что делает эту плоть храмом.\n\nКолокол к обряду вот-вот прозвучит. Я поднимаюсь навстречу ему, и я уже распущена."
 latria_sexual_frustration_flavor.1438.a: "Соблюсти обряд и дать союзу стать таинством."
 latria_sexual_frustration_flavor.1438.b: "Держать бдение одной и привязать томление к алтарю."
 latria_sexual_frustration_flavor.1438.c: "Читать обряд медленно и дать его смыслу сделать меня целой."

 latria_sexual_frustration_flavor.1439.t: "Андалусский сад"
 latria_sexual_frustration_flavor.1439.desc: "Полночь в саду, и фонтан держит свой малый звук. Я читала таук аль-хаму, голубиную поэзию любви, и стихи оставили меня пустой от желания. За стеной — сосед, который мне заказан, и ныне стена кажется тонкой и глупой вещью.\n\nАпельсиновые деревья держат последнее дневное тепло. Рука моя пришла к горлу, и желание очень близко к краю, за вдох от того, чтобы перелиться. Я возвращаю лицо соседа в свете лампы, игру взгляда и отказа, что мы вели через воду.\n\nФонтан спотыкается, потом возобновляется. Рука моя дрожит и не падает, и ночь держит дыхание вместе со мной."
 latria_sexual_frustration_flavor.1439.a: "Дать желанию перелиться и ответить на игру соседа."
 latria_sexual_frustration_flavor.1439.b: "Отступить за учтивым словом и оставить стену целой."
 latria_sexual_frustration_flavor.1439.c: "Сесть с другом у фонтана и дать беседе остудить стих."

 latria_sexual_frustration_flavor.1440.t: "Пост святого"
 latria_sexual_frustration_flavor.1440.desc: "Я держу пост святого, и тело стало тюрьмой, по которой я мечусь. Обет, что я принесла, истёрт, как старое сукно, и на холодном камне пола храма я чувствую самый край его нарушения. Пульс мой бежит быстрее молитв.\n\nНочная рубаха тонка, и камень высасывает жар из моих колен. Я прижимаю ладони плашмя к плитам, и бег крови не унять холодом. Я возвращаю прикосновение, в котором себе отказала, тепло, от которого присягнула поститься, и дыхание моё мелко.\n\nСвеча у моей головы горит прямо. Я держусь за край, и пост и пульс всё ещё воюют во тьме."
 latria_sexual_frustration_flavor.1440.a: "Разбить молчание и признаться, как истёрся обет."
 latria_sexual_frustration_flavor.1440.b: "Прижаться к холодному камню и держать пост всю ночь."
 latria_sexual_frustration_flavor.1440.c: "Раскрыть богослужебные книги и дать более мудрому голосу вернуть меня."
