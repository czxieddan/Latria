l_russian:
 latria_sexual_frustration_flavor.1201.t: "Час без посетителя"
 latria_sexual_frustration_flavor.1201.desc.female: "Я жду у окна в ночной рубашке, пока чай не остывает. Никто не обещал встречи, но в мыслях я всё оставляю для неё место."
 latria_sexual_frustration_flavor.1201.desc.male: "Я жду у окна в ночной рубашке. Лишь ночная стража пересекает двор. Никто не придёт, но я ещё не хочу гасить свечу."
 latria_sexual_frustration_flavor.1201.desc: "Фитиль догорает. За окном ничто не шелохнётся."
 latria_sexual_frustration_flavor.1201.a: "Записать слова, которые хотелось сказать."
 latria_sexual_frustration_flavor.1201.b: "Погасить свечу, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1202.t: "Шёпот у купальни"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Из купальни доносится смех, и никого не заботит, кто с кем пришёл. Это обычное зрелище, но я вспоминаю, как давно не чувствуется такая беззаботность."
 latria_sexual_frustration_flavor.1202.desc.strict: "У купальни несколько аристократов обсуждают, кому следует сторониться друг друга. Звучит моё имя, и разговор затихает."
 latria_sexual_frustration_flavor.1202.desc: "В купальне плещется вода. Голоса снаружи отвлекают меня сильнее."
 latria_sexual_frustration_flavor.1202.a: "Рассказать им о желанной встрече, всё продолжая и продолжая рассказ."
 latria_sexual_frustration_flavor.1202.b: "Отбросить мысль, поблагодарить их и уйти."

 latria_sexual_frustration_flavor.1203.t: "Молчание после молитвы"
 latria_sexual_frustration_flavor.1203.desc.favors: "Жрец говорит, что желание само по себе не греховно. Мне хочется ему верить, но пустота в сердце остаётся."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Жрец говорит о добродетели целомудрия, затем замолкает. Я остаюсь на коленях: молитва привычна, а мысли далеко."
 latria_sexual_frustration_flavor.1203.desc: "Молитва окончена. Храмовые колокола ещё звенят в ушах."
 latria_sexual_frustration_flavor.1203.a: "Пока отложить учение о воздержании."
 latria_sexual_frustration_flavor.1203.b: "Подавить мысль и начать молитву заново."

 latria_sexual_frustration_flavor.1204.t: "Беспокойство после охоты"
 latria_sexual_frustration_flavor.1204.desc.lustful: "В одиночестве, без одежды, я всё ещё слышу в покоях отзвук тетивы. Тело устало, но мысли следуют за каждой тенью в охотничьих угодьях."
 latria_sexual_frustration_flavor.1204.desc.chaste: "В одиночестве, без одежды, я пытаюсь вернуть мысли к молитве и долгу. Стоит закрыть глаза, и тоска возвращается."
 latria_sexual_frustration_flavor.1204.desc: "Охотничьи угодья опустели, но моё беспокойство не утихает."
 latria_sexual_frustration_flavor.1204.a: "Вспомнить тот силуэт в охотничьих угодьях."
 latria_sexual_frustration_flavor.1204.b: "Одеться, вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1205.t: "Закрытый кабинет"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Я приказываю всем выйти из кабинета, где остаются карты, печати и неоконченные бумаги. Старое письмо уже вынуто из ящика, но я не решаюсь перечитать его."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Маршрут и дежурства записаны на столе. Спутники ждут снаружи; каждому отведено время на отдых, но при мысли о собственном досуге вспоминается старое письмо."
 latria_sexual_frustration_flavor.1205.desc.clergy: "В кабинете я сижу в одиночестве, не закрыв ни счета, ни писание. Между страниц лежит старое письмо. Я вновь и вновь тянусь к нему и отдёргиваю руку."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Слуги ждут за дверью кабинета. Я запрещаю меня беспокоить. Печати и бумаги лежат передо мной, но старое письмо всё ещё не возвращается в ящик."
 latria_sexual_frustration_flavor.1205.desc: "Я закрываю дверь кабинета, оставляя на столе старое письмо и неоконченные дела."
 latria_sexual_frustration_flavor.1205.a: "Оставить дела до завтра и перечитать письмо."
 latria_sexual_frustration_flavor.1205.b: "Подавить прежнюю тоску и заняться обязанностями."

 latria_sexual_frustration_flavor.1206.t: "Слухи на пиру"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Кто-то на пиру говорит о любовнике так же непринуждённо, как о погоде. Я собираюсь отшутиться, но замечаю, как давно не участвую в подобных беседах."
 latria_sexual_frustration_flavor.1206.desc.strict: "Несколько аристократов обсуждают придворного, впавшего в немилость из-за неподобающего поведения, и один упоминает моё имя. Я разглаживаю рукав и не вступаю в разговор."
 latria_sexual_frustration_flavor.1206.desc: "Над собравшимися разносится музыка. Их разговор отвлекает меня сильнее."
 latria_sexual_frustration_flavor.1206.a: "Рассказать старую историю целиком, повторяя даже слова, сказанные наедине."
 latria_sexual_frustration_flavor.1206.b: "Промолчать, поклониться соседям по столу и уйти."

 latria_sexual_frustration_flavor.1207.t: "Пустое место после молитвы"
 latria_sexual_frustration_flavor.1207.desc.favors: "После службы жрец оставляет книгу на скамье и уходит. Моя вера не осуждает желание, но я не могу успокоить мысли."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Жрец ушёл, но я остаюсь на коленях. Учение о целомудрии ясно; тоска во мне не угасла."
 latria_sexual_frustration_flavor.1207.desc: "В тихом храме остаёмся только я и свеча."
 latria_sexual_frustration_flavor.1207.a: "Покинуть храм и предаться мыслям об этой привязанности."
 latria_sexual_frustration_flavor.1207.b: "Сдержать желание и перечитать заповеди."

 latria_sexual_frustration_flavor.1208.t: "Погоня сквозь лес"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Добыча ускользает между деревьями, и остальные бросаются в погоню. Я скачу за ними, но другое желание всё ещё удерживает мои мысли."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Я натягиваю поводья и напоминаю себе, что цель поездки — лишь охота. Лай гончих удаляется, а мысли остаются."
 latria_sexual_frustration_flavor.1208.desc: "Отряд останавливается среди деревьев, ожидая моего приказа продолжить погоню."
 latria_sexual_frustration_flavor.1208.a: "Пусть остальные скачут вперёд, пока мои мысли блуждают."
 latria_sexual_frustration_flavor.1208.b: "Собраться с мыслями и вести охоту дальше."

 latria_sexual_frustration_flavor.1209.t: "Угли у окна"
 latria_sexual_frustration_flavor.1209.desc.female: "Я сижу у окна в ночной рубашке, пока огонь в очаге угасает. Слова, не сказанные днём, теперь возвращаются ко мне."
 latria_sexual_frustration_flavor.1209.desc.male: "Я прислоняюсь к окну в ночной рубашке и смотрю, как ночная стража пересекает двор. Безответное чувство не выходит из мыслей."
 latria_sexual_frustration_flavor.1209.desc: "За окном всё тихо. Огонь угасает, но спать не хочется."
 latria_sexual_frustration_flavor.1209.a: "Изложить мысли на бумаге."
 latria_sexual_frustration_flavor.1209.b: "Подбросить дров, отбросить тоску и лечь."

 latria_sexual_frustration_flavor.1210.t: "В дверь не стучат"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Слуги убрали корону. Я сижу у постели в ночной рубашке, и бремя империи не даёт забыть о том, что я никак не решаюсь произнести."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Спутники разошлись спать на постоялом дворе. Я сижу в ночной рубашке рядом с неотправленным письмом; завтра мы едем дальше, но эта забота отправится со мной."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Я вешаю облачение у постели и сижу в одиночестве в ночной рубашке. Обет всё ещё звучит в ушах, но мысли не успокаиваются."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Парадная одежда убрана. Я сижу у постели в ночной рубашке; стражники снаружи не слышат вздоха, и власть не может уладить это личное дело."
 latria_sexual_frustration_flavor.1210.desc: "Час поздний, и эта забота по-прежнему со мной наедине."
 latria_sexual_frustration_flavor.1210.a: "Позвать доверенного знакомого, несмотря на поздний час, и поговорить подольше."
 latria_sexual_frustration_flavor.1210.b: "Подавить тоску, погасить свечу и лечь."

 latria_sexual_frustration_flavor.1202.c: "Сменить тему и расспросить спутников об их делах."
 latria_sexual_frustration_flavor.1202.d: "Пригласить всех на чай и беседовать до усталости."
 latria_sexual_frustration_flavor.1203.c: "Попросить жреца остаться и изучить со мной учение."
 latria_sexual_frustration_flavor.1204.c: "Надеть ночную рубашку и неспешно обдумать события дня."
 latria_sexual_frustration_flavor.1205.c: "Распределить дежурства и позволить себе немного отдыха."
 latria_sexual_frustration_flavor.1205.d: "Перечислить завтрашние обязанности одну за другой."
 latria_sexual_frustration_flavor.1206.c: "Перевести разговор на новое стихотворение."
 latria_sexual_frustration_flavor.1207.c: "Сесть перед писанием и дочитать эту главу."
 latria_sexual_frustration_flavor.1208.c: "Дать лошадям отдохнуть и неспешно изучить следы."
 latria_sexual_frustration_flavor.1209.c: "Подбросить дров, заварить чай и почитать старую книгу."
 latria_sexual_frustration_flavor.1209.d: "Обратить несказанные слова в стихотворение."
 latria_sexual_frustration_flavor.1210.c: "Распланировать завтрашний день и упорядочить все дела."
