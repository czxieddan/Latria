 latria_sexual_frustration_flavor.1201.t: "Час без посетителя"
 latria_sexual_frustration_flavor.1201.desc.female: "Я уже долго жду у окна в ночной рубашке. Чай на столе из горячего становится тёплым, затем покрывается тонкой плёнкой. Об этой встрече никто не договаривался, но я оставила для неё свет и пустую чашку, даже поправила стул у окна.\n\nПо двору лишь однажды проходит ночной сторож. Свет фонаря скользит по верху стены и исчезает. Я поворачиваю чашку; чай уже не годится для питья. Вспоминаются слова при последнем прощании: «Если будет время». В эту пустую оговорку может вместиться любая ночь — и ни одна не обязана ей соответствовать.\n\nФитиль становится короче. Я всё ещё сижу; рубашка сползает с одного плеча, но я её не поправляю."
 latria_sexual_frustration_flavor.1201.desc.male: "Я уже долго жду у окна в ночной рубашке. Во дворе слышны только шаги ночной стражи, то ближе, то дальше. Никто не придёт, а я всё оставляю огонь гореть, словно этим можно закончить приглашение, которое так и не прозвучало.\n\nЧай остыл. Я делаю глоток, морщусь от горечи, но всё же допиваю. На дне остаётся несколько листьев. Я смотрю на них, будто они могут подсказать, с кем сейчас человек, о котором я думаю. За окном ветер пригибает ветви и отпускает.\n\nЯ кладу руку на оконную раму. Дерево холодное; прохлада поднимается от ладони, но внутренний жар остаётся."
 latria_sexual_frustration_flavor.1201.desc: "Фитиль становится короче, а за окном по-прежнему ни звука.\n\nЯ поправляю фитиль: пламя на миг разгорается и вскоре снова опадает. На столе бумага, перо и чашка чая, который уже нельзя пить. Я успеваю коснуться каждого предмета, но ничто не меняет эту ночь.\n\nВ конце концов я просто сижу и слушаю, как моё дыхание заполняет тишину."
 latria_sexual_frustration_flavor.1201.a: "Записать слова, которые хотелось сказать."
 latria_sexual_frustration_flavor.1201.b: "Погасить свечу, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1202.t: "Шёпот у купальни"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Разговоры и смех возле купальни не стихают оттого, что кто-то приходит вместе с кем-то. Из щели в двери валит пар с запахом мыльных стручков и горячих камней. Мимо меня проходит человек с влажными распущенными волосами и свободно завязанным поясом; никто не задерживает на нём взгляда.\n\nОбычное зрелище, которому мне бы не придавать значения. Но я стою перед порогом и вдруг вспоминаю, как давно не доводилось столь непринуждённо быть рядом с кем-то. За дверью кто-то со смехом зовёт другого по имени, голос звучит мягко, словно после воды. Мои пальцы замирают на косяке.\n\nВетер несёт пар мне в лицо. Я не вхожу и не ухожу."
 latria_sexual_frustration_flavor.1202.desc.strict: "Перед купальней несколько знатных людей обсуждают, кому следует избегать друг друга. Я слышу своё имя, и разговор тут же обрывается. За дверью всё ещё плещется вода, а снаружи так тихо, что слышен шорох одежды.\n\nКто-то кивает мне, слишком поспешно. Другой принимается поправлять и без того аккуратный рукав. Я понимаю, о чём они только что говорили. Уши горят, и вовсе не от банного пара.\n\nЯ некоторое время стою на месте. Вода за дверью плещется с ровными промежутками, словно отсчитывая это молчание."
 latria_sexual_frustration_flavor.1202.desc: "В купальне непрерывно шумит вода, но голоса у входа отвлекают меня сильнее.\n\nМне нужно было всего лишь умыться. У самой двери я слышу негромкий разговор, прерываемый смехом на середине фразы. Смех тихий, но от него я останавливаюсь. Не знаю, что их развеселило, знаю лишь, что не следует стоять здесь и слушать.\n\nИ всё же я дослушиваю фразу до конца. После неё лицо горит сильнее, чем согретое полотенце в руке."
 latria_sexual_frustration_flavor.1202.a: "Рассказать им о желанной встрече, всё продолжая и продолжая рассказ."
 latria_sexual_frustration_flavor.1202.b: "Отбросить мысль, поблагодарить их и уйти."

 latria_sexual_frustration_flavor.1203.t: "Молчание после молитвы"
 latria_sexual_frustration_flavor.1203.desc.favors: "Жрец говорит, что человеческое желание не греховно от рождения. Под балками ещё отдаётся звон колокола, а он уже закрывает писание, оставляя мне время заговорить.\n\nМне хочется ему верить. Но пустота внутри не становится меньше. Я остаюсь на коленях и смотрю на свои руки. Днём эти руки раздавали людям хлеб; ночью им хочется лишь удержать человека, которого здесь нет. Вера позволяет это, но от её позволения чужая рука не появится в моей.\n\nЖрец ждёт вопроса. Мне нечего произнести; я лишь убираю волосы со лба."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Жрец говорит о добродетели воздержания, затем умолкает. Его молчание тяжелее наставлений. Я остаюсь на коленях; подушка под ними уже согрелась. Слова молитвы знакомы, а мысли где-то далеко, на дороге за пределами храма.\n\nЯ знаю, что следует ответить. Но из горла выходит лишь выдох, превращаясь в едва слышное «да». Жрец смотрит на меня и больше ничего не спрашивает. От этого взгляда моё согласие кажется ещё менее убедительным.\n\nКолокол умолкает. В храме лишь изредка потрескивают фитили."
 latria_sexual_frustration_flavor.1203.desc: "Молитва окончена, а колокольный звон ещё отдаётся в храме.\n\nВсе уже встают. Я остаюсь на коленях, словно пропуская последнюю строку. Но ни одна строка не пропущена — просто и после них волнение остаётся. Оно не уходит вместе с молитвой и не следует за людьми.\n\nЯ прижимаю ладони к каменным плитам. Камень холодный, но прохлада доходит лишь до запястий и дальше не поднимается."
 latria_sexual_frustration_flavor.1203.a: "Пока отложить учение о воздержании."
 latria_sexual_frustration_flavor.1203.b: "Подавить мысль и начать молитву заново."

 latria_sexual_frustration_flavor.1204.t: "Беспокойство после охоты"
 latria_sexual_frustration_flavor.1204.desc.lustful: "В спальне никого, кроме меня. Я ещё без одежды, а в ушах по-прежнему звучит отголосок тетивы. Охотничья одежда брошена на стул, грязь на сапогах не успела высохнуть. Ноги и плечи устали, но мысли заняты совсем другим.\n\nДнём в лесу один человек проехал мимо меня верхом. Мы лишь разъехались, даже рукава не соприкоснулись. Но я снова и снова вижу ту короткую встречу: руку на поводьях, лёгкую улыбку при повороте головы и взгляд, который после больше не возвращается ко мне. Сейчас здесь нет ни лошадей, ни того человека — лишь моё отражение в медном зеркале.\n\nЯ сажусь на край кровати. Циновка касается кожи, и только тогда я вспоминаю, что пора накинуть одежду."
 latria_sexual_frustration_flavor.1204.desc.chaste: "В спальне никого, кроме меня. Я ещё без одежды и пытаюсь вернуться мыслями к молитве и долгу. Охотничье платье сложено в стороне; даже умывание ещё впереди. Стоит закрыть глаза, как желание возвращается, яснее любого звериного следа в лесу.\n\nЯ повторяю про себя слова обета. На середине перед глазами встаёт человек, обернувшийся в лесу, и обет обрывается. Я открываю глаза и смотрю на свои руки. Они всё ещё дрожат — от усталости после охоты или от чего-то другого.\n\nЗа дверью слуга спрашивает, принести ли горячей воды. Я отвечаю; голос оказывается хриплее, чем мне думалось."
 latria_sexual_frustration_flavor.1204.desc: "Охотничьи угодья опустели, а моё беспокойство всё не утихает.\n\nВернувшись в комнату, я откладываю лук, откладываю перчатки, но тот дневной взгляд отложить не могу. Здесь пахнет грязью и потом. Некоторое время я стою неподвижно, прежде чем замечаю: всё время смотрю на дверь, словно ожидая, что кто-то войдёт следом.\n\nНикто не входит. Ведь дверь закрыта моей рукой."
 latria_sexual_frustration_flavor.1204.a: "Вспомнить тот силуэт в охотничьих угодьях."
 latria_sexual_frustration_flavor.1204.b: "Одеться, вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1205.t: "Закрытый кабинет"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Я велю всем выйти из кабинета, оставив карты, печати и незаконченные бумаги. Когда дверь закрывается, слышно лишь моё дыхание. Я достаю из ящика старое письмо; его уголки уже истрепались.\n\nВ нём нет государственных дел. Есть встреча, которая так и не состоялась, и слова, после которых мне казалось, что впереди ещё много времени. С тех пор прошло немало дней, а письмо осталось. Я кладу на него печать, затем убираю. Печать холодная, бумага же словно ещё хранит тепло.\n\nЗа дверью тихо спрашивают, подавать ли еду. Я не отвечаю."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Маршрут и порядок дежурств уже записаны, спутники ждут за дверью. Я отвожу каждому часы отдыха, но на собственной очереди перо замирает. Из ящика выступает угол старого письма, словно нарочно не желая скрываться под дорожными записями.\n\nЯ вытаскиваю его. Достаточно прочесть обращение, чтобы понять: сейчас не время для этого. Снаружи стучат и спрашивают, едем ли мы к следующей стоянке. Я отвечаю: «Едем», — а глаза остаются на второй строке.\n\nВо второй строке лишь название одного места. Наш путь туда не лежит."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Я сижу в кабинете в одиночестве. Счётная книга открыта, писание тоже ещё не убрано. Между страниц лежит старое письмо; я уже несколько раз тянусь к нему и отдёргиваю руку.\n\nОно пришло не сегодня. Письмо так давно спрятано в книге, что я каждый раз задерживаюсь на этой странице. Сегодня я наконец вытаскиваю его. На бумаге нет непозволительных слов, но при чтении дыхание всё равно сбивается.\n\nПо галерее кто-то проходит, негромко постукивают чётки. Я прижимаю письмо страницами книги, но даже так продолжаю ощущать его край."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Слуги стоят за дверью кабинета; я велю не беспокоить меня. Передо мной печати и бумаги, а старое письмо всё ещё лежит в открытом ящике.\n\nСледовало бы утвердить доклад о мостах. Перо зависает над бумагой, чернила падают на неё тёмной точкой. Я смотрю на пятно и вдруг вспоминаю строку из письма, не имеющую никакого отношения к мостам. Всего несколько слов, а я помню даже, где именно они написаны.\n\nЗа дверью кто-то переступает с ноги на ногу. Я отодвигаю доклад и тянусь к ящику."
 latria_sexual_frustration_flavor.1205.desc: "Я закрываю дверь кабинета. Старое письмо и незаконченные дела остаются на столе.\n\nЗасов опускается с тихим стуком. После него в комнате лишь шелестит бумага. Я раскладываю дела слева, письмо справа. Некоторое время смотрю на них, затем передвигаю письмо на середину.\n\nФитиль потрескивает. Я не тянусь подрезать его."
 latria_sexual_frustration_flavor.1205.a: "Оставить дела до завтра и перечитать письмо."
 latria_sexual_frustration_flavor.1205.b: "Подавить прежнюю тоску и заняться обязанностями."

 latria_sexual_frustration_flavor.1206.t: "Слухи на пиру"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Кто-то на пиру говорит о любовнике с такой лёгкостью, словно обсуждает погоду. Вино проходит по кругу, в рассказе успевают смениться два имени, а гости всё смеются. Никто не понижает голоса.\n\nЯ собираюсь лишь улыбнуться и пропустить это мимо. Но улыбка ещё не сходит с лица, когда становится ясно, как давно у меня не было подобных разговоров: даже прежде чем поставить кубок, я смотрю, как это делают другие. Сосед спрашивает, нет ли и у меня истории для них. Мои пальцы замирают на краю кубка.\n\nСквозь гул гостей доносится музыка. Я слышу её, но не узнаю мелодию."
 latria_sexual_frustration_flavor.1206.desc.strict: "Несколько знатных гостей обсуждают придворного, впавшего в немилость из-за неподобающего поведения, затем кто-то произносит моё имя. Разговор не обрывается совсем, лишь переходит с громких слов на шёпот. Я опускаю глаза, поправляю рукав и не вмешиваюсь.\n\nИх история может оказаться выдумкой. Правда это или нет, уже неважно. У меня действительно есть то, о чём нельзя говорить за этим столом, а их взгляды словно уже проникли туда. Я допиваю вино; его жар ощущается не в горле, а на лице.\n\nКто-то поднимает кубок, пытаясь сменить тему. Когда кубки звенят, моя рука всё равно вздрагивает."
 latria_sexual_frustration_flavor.1206.desc: "Сквозь гул гостей доносится музыка, но разговоры за столом отвлекают меня сильнее.\n\nЯ остаюсь на месте и слушаю, как беседы вокруг меня меняют направление, чтобы в конце концов сойтись на постельных пологах и тайных письмах. Кто-то смеётся, кто-то кашляет, кто-то косится на меня. Не знаю, случаен ли этот взгляд.\n\nЯ поворачиваю пустой кубок. Его основание едва слышно скребёт по столу."
 latria_sexual_frustration_flavor.1206.a: "Рассказать старую историю целиком, повторяя даже слова, сказанные наедине."
 latria_sexual_frustration_flavor.1206.b: "Промолчать, поклониться соседям по столу и уйти."

 latria_sexual_frustration_flavor.1207.t: "Пустое место после молитвы"
 latria_sexual_frustration_flavor.1207.desc.favors: "После службы жрец оставляет писание на сиденье и уходит. На подушке ещё видна вмятина. Наша вера не считает желание грехом — это написано на только что прочитанной мной странице, чёткими чернильными буквами.\n\nИ всё же я не знаю, как успокоиться. Позволение веры — одно, а ночь, когда рядом нет ничьих рук, кроме собственных, — другое. Я некоторое время стою возле пустого сиденья, не садясь и не закрывая книгу.\n\nВетер сдвигает храмовую дверь, оставляя узкую щель. Свет из неё падает прямо на ту строку."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Жрец уходит, но я остаюсь на коленях. Учение о целомудрии ясно и недвусмысленно; каждое правило я могу повторить наизусть. Желание не уходит вместе с ним. Оно остаётся со мной, ощутимое даже в коленях и ладонях.\n\nЯ смотрю на опустевшее сиденье и вдруг завидую доске, которой не нужно ни о чём думать. Я так не могу. Прислоняюсь к ней виском, но чувствую всё тот же собственный жар.\n\nСвеча становится короче. Я всё ещё на коленях."
 latria_sexual_frustration_flavor.1207.desc: "В храме остаёмся лишь я и негаснущие свечи.\n\nШаги остальных уже затихли вдали. Можно уйти прямо сейчас, закрыть дверь и перевернуть эту страницу. Но я не ухожу. Делаю несколько шагов между пустыми сиденьями и возвращаюсь на прежнюю подушку.\n\nПламя спокойно. Я же слышу, как кровь стучит в ушах."
 latria_sexual_frustration_flavor.1207.a: "Покинуть храм и предаться мыслям об этой привязанности."
 latria_sexual_frustration_flavor.1207.b: "Сдержать желание и перечитать заповеди."

 latria_sexual_frustration_flavor.1208.t: "Погоня сквозь лес"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Зверь мелькает между деревьями, и все бросаются в погоню. Я тоже пускаю лошадь следом; ветки хлещут по рукавам, в лицо бьёт запах конского пота. Лишь через несколько сотен шагов я замечаю, что преследую вовсе не зверя.\n\nВпереди чья-то спина. Всего лишь человек, приехавший со мной на охоту. Но каждый его наклон и подъём приковывает мой взгляд, и я даже пропускаю развилку. Лай гончих уходит налево, а моя лошадь продолжает прямо.\n\nЯ натягиваю поводья. Впереди не оборачиваются. А моё дыхание уже сбивается так, словно одной охотой этого не объяснить."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Я натягиваю поводья и напоминаю себе, что здесь только ради охоты. Лай гончих удаляется, отпечатки копыт ясно видны во влажной грязи, но мне приходится смотреть дважды, чтобы понять, куда они сворачивают.\n\nМысли не желают следовать за отпечатками. Они остаются с руками, которые недавно помогли мне подтянуть подпругу. Уверенные руки закончили дело и отстранились без единого слова. Я же превращаю в памяти это короткое движение во что-то совсем другое.\n\nЛошадь фыркает. Лишь теперь я замечаю, как долго стою на месте."
 latria_sexual_frustration_flavor.1208.desc: "Отряд останавливается среди деревьев и ждёт, решу ли я продолжить преследование.\n\nВсе лица обращены ко мне. Со сбруи ещё капает вода, кто-то вытирает лоб. Я смотрю на следы на земле. Они ясны, в отличие от моего ответа. Половиной мыслей я всё ещё на другом конце леса, возле человека, не имеющего отношения к добыче.\n\nМежду деревьями проходит ветер. Я держу поводья и не сразу заговариваю."
 latria_sexual_frustration_flavor.1208.a: "Пусть остальные скачут вперёд, пока мои мысли блуждают."
 latria_sexual_frustration_flavor.1208.b: "Собраться с мыслями и вести охоту дальше."

 latria_sexual_frustration_flavor.1209.t: "Угли у окна"
 latria_sexual_frustration_flavor.1209.desc.female: "Я сижу у окна в ночной рубашке; в очаге осталась лишь тонкая полоска углей. Слова, которые я не произнесла днём, снова готовы сорваться с языка и снова отступают. Фраза короткая; долгим было лишь моё молчание до этого часа.\n\nУгли изредка вспыхивают, освещая руки на коленях. Пальцы невольно мнут край рубашки, собирая ткань в складки. Я вспоминаю, как сегодня рядом прошёл тот человек и от его рукава пахнуло ветром. Всего лишь ветер, а я до сих пор помню, откуда он дул.\n\nСнаружи раздаётся оклик ночной стражи. Я не отвечаю и не хочу спать."
 latria_sexual_frustration_flavor.1209.desc.male: "Я стою у окна в ночной рубашке, прислонившись к раме, и смотрю на огни ночной стражи во дворе. Фонари проходят один за другим, словно деля ночь на короткие отрезки. Безответное чувство не желает делиться: оно целиком остаётся у меня в груди.\n\nЯ прижимаю лоб к оконной решётке. От дерева пахнет старым лаком. Вспоминается, как тот человек во время разговора смотрел в сторону, будто стоило взглянуть на меня — и слова получили бы другой смысл. Тогда я тоже отвёл глаза. После этого мы оба умолкли.\n\nВ очаге трещит уголь и слегка осыпается."
 latria_sexual_frustration_flavor.1209.desc: "За окном тихо, огонь темнеет, а мне совсем не хочется спать.\n\nЯ подбрасываю небольшое полено. Пламя не разгорается, лишь поднимается немного дыма. Его запах остаётся на ночной рубашке. Я возвращаюсь к окну и снова повторяю про себя фразу, которая не нашла выхода днём. Слушателя по-прежнему нет.\n\nНочь лежит над двором. Я смотрю в неё; она не отвечает взглядом."
 latria_sexual_frustration_flavor.1209.a: "Изложить мысли на бумаге."
 latria_sexual_frustration_flavor.1209.b: "Подбросить дров, отбросить тоску и лечь."

 latria_sexual_frustration_flavor.1210.t: "В дверь не стучат"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Слуги уже убрали парадную корону, а я сижу у постели в ночной рубашке. Границы империи, податные книги и завтрашние посетители так и не вытеснили мою личную заботу. Она словно занимает другой край кровати, хотя там никого нет.\n\nЯ смотрю на пустую половину. Подушка ровная, край одеяла тоже. В самой этой аккуратности чудится упрёк. Я кладу туда руку. Ткань холодная, но даже ощутив холод, я не отдёргиваю пальцы.\n\nВ галерее гаснет одна лампа. В эту дверь никто не стучит."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Спутники уже легли на постоялом дворе, а я в ночной рубашке остаюсь над неотправленным письмом. Завтра снова в путь, лошади уже накормлены. Но эту заботу не оставить здесь: она попадёт в дорожную суму и доберётся со мной до следующей переправы.\n\nЯ поворачиваю письмо под лампой. Обращение выведено слишком тяжело, чтобы лист казался обычной весточкой, которую легко отправить с дороги. Внизу кто-то расплачивается; некоторое время звенят медяки. Когда звук стихает, в комнате становится ещё тише.\n\nЯ прячу письмо между одеждой. Даже убрав его, точно знаю, между какими слоями оно лежит."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Я вешаю облачение у постели и сажусь в маленькой комнате в ночной рубашке. В ушах ещё звучит обет, произнесённый мной совсем недавно. Но покоя нет, и чётки надолго замирают в пальцах на одной бусине.\n\nМне хочется посвятить эту ночь тому, чему полагается. Но каждый раз, когда наступает тишина, передо мной возникает лицо, которому не место в молитве. Я сжимаю чётки, бусины впиваются в ладонь. Даже когда становится больно, лицо не исчезает.\n\nДверь прикрыта неплотно. Сквозь щель проникает ветер, и пламя наклоняется."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Парадную одежду уже убрали, а я остаюсь у постели в ночной рубашке. Стражники за дверью не слышат моего вздоха; власть тоже не даёт мне покоя в этом деле. Я пытаюсь мысленно перебрать завтрашних посетителей и останавливаюсь на третьем.\n\nЭтот третий человек не имеет отношения к завтрашнему приёму. Но дальше него мои мысли не идут. Прикроватная лампа отбрасывает на стену мою тень; она сидит прямее меня.\n\nЯ убавляю фитиль. Тень становится ниже, а я всё ещё сижу."
 latria_sexual_frustration_flavor.1210.desc: "Ночь уже глубока, а я по-прежнему остаюсь наедине с этой заботой.\n\nДверь закрыта, лампа горит, в постели место только для меня. Всё это не меняется. Меняется лишь то, что я больше не притворяюсь, будто вот-вот засну. Я кладу верхнюю одежду на спинку стула и снова беру, словно в любой миг меня могут позвать.\n\nНикто не зовёт. Я снова опускаю одежду на спинку стула."
 latria_sexual_frustration_flavor.1210.a: "Позвать доверенного знакомого, несмотря на поздний час, и поговорить подольше."
 latria_sexual_frustration_flavor.1210.b: "Подавить тоску, погасить свечу и лечь."

 latria_sexual_frustration_flavor.1202.c: "Сменить тему и расспросить спутников об их делах."
 latria_sexual_frustration_flavor.1202.d: "Пригласить всех на чай и беседовать до усталости."
 latria_sexual_frustration_flavor.1203.c: "Попросить жреца остаться и изучить со мной учение."
 latria_sexual_frustration_flavor.1204.c: "Надеть ночную рубашку и неспешно обдумать события дня."
 latria_sexual_frustration_flavor.1205.c: "Распределить дежурства и позволить себе немного отдыха."
 latria_sexual_frustration_flavor.1205.d: "Перечислить завтрашние обязанности одну за другой."
 latria_sexual_frustration_flavor.1206.c: "Перевести разговор на новое стихотворение."
 latria_sexual_frustration_flavor.1207.c: "Сесть перед писанием и дочитать эту главу."
 latria_sexual_frustration_flavor.1208.c: "Дать лошадям отдохнуть и неспешно изучить следы."
 latria_sexual_frustration_flavor.1209.c: "Подбросить дров, заварить чай и почитать старую книгу."
 latria_sexual_frustration_flavor.1209.d: "Обратить несказанные слова в стихотворение."
 latria_sexual_frustration_flavor.1210.c: "Распланировать завтрашний день и упорядочить все дела."
