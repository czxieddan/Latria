 latria_flavor_warm_company: "Приятная компания"
 latria_flavor_warm_company_desc: "Хорошая беседа побуждает этого персонажа чаще искать общества."
 latria_flavor_neglected_duties: "Заброшенные обязанности"
 latria_flavor_neglected_duties_desc: "Личные заботы отвлекли этого персонажа от обязанностей."
 latria_flavor_diligent_work: "Дела в порядке"
 latria_flavor_diligent_work_desc: "Этот персонаж направил беспокойные мысли на тщательное планирование и труд."
