l_russian:
 latria_sexual_frustration_flavor.1001.t: "Долгая ночь за занавесью"
 latria_sexual_frustration_flavor.1001.desc.female: "Я сижу у окна в ночной рубашке; на коленях лежит нераспечатанное письмо. Лунный свет проникает сквозь щель в занавеси и освещает следы пальцев на сгибах бумаги. Человек, написавший его, давно уехал, а я всё достаю письмо со дна ларца, убираю и достаю вновь.\n\nЯ вспоминаю нашу последнюю встречу. Слова оборвались на полуслове, словно за ними должно было последовать что-то ещё, но рукав уже скользнул прочь. Тогда я лишь кивнула и даже не попросила остаться. Теперь, глубокой ночью, та недосказанная фраза звучит яснее всего письма.\n\nВетер шевелит занавесь, и бумага тихо шелестит. Я прижимаю пальцы к восковой печати, но так и не решаюсь ни вскрыть письмо, ни убрать его в ларец."
 latria_sexual_frustration_flavor.1001.desc.male: "Я сижу у окна в ночной рубашке; на коленях лежит нераспечатанное письмо. Лунный свет проникает сквозь щель в занавеси и освещает знакомый почерк на сложенном листе. Человек, написавший его, давно уехал, а письмо всё это время лежало у меня под счётными книгами.\n\nЯ вспоминаю взгляд перед отъездом, словно от меня ещё ждали ответа. Тогда я был занят другим и лишь предложил поговорить в другой раз. Другой раз так и не настал: человек уехал, а тот взгляд остался со мной.\n\nСнаружи раздаётся очередной оклик ночной стражи. Я переворачиваю письмо, потом снова возвращаю его лицевой стороной вверх. Восковая печать по-прежнему цела."
 latria_sexual_frustration_flavor.1001.desc: "Глубокой ночью ко мне вновь возвращаются мысли о том, что осталось между нами недосказанным.\n\nЯ беру письмо, смотрю на печать и снова кладу его на колени. В комнате никого больше нет; даже потрескивание фитиля слышно отчётливо. Я пытаюсь подумать о завтрашних делах, но мысли всё время возвращаются к одному и тому же.\n\nЗанавесь чуть шевелится. Письмо здесь, а того, кто его написал, рядом нет."
 latria_sexual_frustration_flavor.1001.a: "Дочитать письмо и подумать о его авторе."
 latria_sexual_frustration_flavor.1001.b: "Запереть письмо и подавить эту мысль."
 latria_sexual_frustration_flavor.1001.c: "Взять чистый лист и сложить из этого стихи."

 latria_sexual_frustration_flavor.1002.t: "Пряности на пиру"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Аромат пряностей на пиру заглушает запах вина. Музыканты начинают уже третью мелодию, а кое-кто из гостей по-прежнему беседует, тесно придвинувшись друг к другу. Здесь такую близость не считают неприличной: гости смеются и вновь пускают кубки по кругу.\n\nЯ же ловлю каждый взгляд. Кто-то приветствует меня поднятым кубком, я отвечаю, но глазами всё ещё ищу лицо, которого нет среди собравшихся. Сосед за столом шутит, а мой смех запаздывает.\n\nКогда слуга подливает вина, я едва вспоминаю о кубке в руке. От блюда поднимается тёплый дух пряностей, но пустоту внутри он не заполняет."
 latria_sexual_frustration_flavor.1002.desc.strict: "Пряности придают пиру ещё больше оживления, но каждый всплеск смеха напоминает мне, как строго обычай судит всякую вольность. Сосед за столом наклоняется ко мне для разговора, и я невольно выпрямляю кубок, словно так легче сохранить подобающий вид.\n\nКто-то заводит речь о давней истории и обрывает её на середине. За столом тут же переходят к владениям и урожаю. Я киваю вместе со всеми, но всё ещё вслушиваюсь в ту недоговорённую фразу.\n\nКогда слуга подливает вина, я едва вспоминаю о кубке в руке. Лишь когда вино доходит до края, я ставлю его на стол."
 latria_sexual_frustration_flavor.1002.desc: "Пир шумит, а мои мысли снова и снова ускользают к одному и тому же.\n\nМузыка, кубки, разговоры — всё рядом, но ни одной фразы я не слышу целиком. Сосед за столом спрашивает, подлить ли мне вина. Я что-то отвечаю, даже не понимая, на что соглашаюсь.\n\nЛишь с началом новой мелодии я замечаю, что всё это время смотрю на двери зала. Они уже дважды открывались, но всякий раз входил кто-то другой."
 latria_sexual_frustration_flavor.1002.a: "Вставить в разговор несколько нежных слов."
 latria_sexual_frustration_flavor.1002.b: "Опустить взгляд, поблагодарить хозяина и уйти."
 latria_sexual_frustration_flavor.1002.c: "Перед уходом попросить музыкантов сыграть ещё одну мелодию."
 latria_sexual_frustration_flavor.1002.d: "Собрать гостей за одним столом и провести вечер в беседе."

 latria_sexual_frustration_flavor.1003.t: "Проповедь в саду"
 latria_sexual_frustration_flavor.1003.desc.favors: "Проповедник сидит на каменной скамье в саду и говорит, что плотские утехи не противоречат нашей вере. Ветер приподнимает угол страницы; он придерживает его пальцем и неспешно продолжает.\n\nЭти слова должны бы меня успокоить. Но за ними вспоминается другое: шутка перед отъездом и взгляд, на который тогда не нашлось ответа. Слова писания проходят мимо, а та фраза остаётся со мной.\n\nПроповедник спрашивает, всё ли мне понятно. Я киваю, но уже не могу найти в книге страницу, на которой мы остановились."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Проповедник говорит о воздержании и целомудрии; каждое слово слышно отчётливо. В саду тихо, и даже шелест листьев словно отмечает паузы в его речи. Я сижу прямо, положив руки на колени, но мыслями далеко от книги.\n\nВспоминается, как тревожно мне спалось прошлой ночью. Никто не приходил, никто ничего не говорил — просто прежнее желание вернулось само. Я не отвожу глаз от писания, но буквы никак не складываются в слова.\n\nПроповедник переворачивает страницу. Я тоже опускаю голову, всё ещё не зная, на каком месте он только что остановился."
 latria_sexual_frustration_flavor.1003.desc: "Я дослушиваю проповедь в саду. Ветер перебирает страницы, а мысли так и не успокаиваются.\n\nПроповедник уже встаёт, чтобы приветствовать других. Я остаюсь на скамье, придерживая страницу пальцем, но смотрю в конец каменной дорожки. Там никого нет, и всё же я продолжаю смотреть.\n\nКогда я наконец прихожу в себя, ветер успевает перевернуть ещё несколько страниц."
 latria_sexual_frustration_flavor.1003.a: "Закрыть книгу и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1003.b: "Отбросить эти мысли и присоединиться к чтению."
 latria_sexual_frustration_flavor.1003.c: "Попросить проповедника объяснить каждый отрывок."

 latria_sexual_frustration_flavor.1004.t: "Беспокойный сокол"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Сокол бьётся на моей руке, следя за далёкой стаей голубей. Ремешки на лапах не дают ему покоя, и каждый взмах крыльев обдаёт меня ветром. Я удерживаю птицу, но она по-прежнему смотрит на открытое место впереди.\n\nМне знакомо это нетерпение. Охотники ждут моего слова у опушки, лошади тоже начинают переступать с ноги на ногу. Я же думаю о другом — так упорно, что даже забываю о свистке в руке. У этой мысли нет ясных очертаний, но она не отступает.\n\nСокол вновь взмахивает крыльями. Только теперь я замечаю, как сильно сжимаю перчатку."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Сокол беспокойно топчется на моей руке. Я заставляю себя прислушиваться к звону сбруи и свисткам, смотреть лишь на край леса. Охотники уже разошлись по местам и ждут моего сигнала.\n\nНо мысли укротить труднее, чем птицу. Я считаю вдохи, удары копыт, листья на ветвях — и в конце концов снова думаю об одном человеке. На этой охоте его нет. Я знаю это и всё равно продолжаю думать.\n\nСокол склоняет голову и смотрит на меня, словно ждёт понятного ему приказа. Пока я не могу его отдать."
 latria_sexual_frustration_flavor.1004.desc: "Охотники ждут, когда я подзову сокола, но мне никак не удаётся сосредоточиться.\n\nСтоит лесному ветру стихнуть, и каждый взмах крыльев на моей руке ощущается особенно отчётливо. Я поднимаю руку и снова опускаю. Собираюсь подать зов, но так и не издаю ни звука.\n\nКто-то вдали окликает меня по имени. Я отзываюсь, всё ещё глядя на поляну."
 latria_sexual_frustration_flavor.1004.a: "Пусть спутники подождут, пока я предаюсь своим мыслям."
 latria_sexual_frustration_flavor.1004.b: "Собраться с мыслями и привести охотничьи снасти в порядок."
 latria_sexual_frustration_flavor.1004.c: "Медленно пригладить перья и снова попробовать подать зов."

 latria_sexual_frustration_flavor.1005.t: "Между заседаниями совета"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Вельможи уходят, а слуги ещё собирают карты и печати. Во главе длинного стола остаюсь только я; рядом с незаконченными бумагами лежит старое письмо. Запах краски для печатей ещё не выветрился.\n\nТолько что спор шёл о границах и податях. Я то киваю, то возражаю — со стороны, должно быть, кажется, что ни одно слово не проходит мимо. На самом деле некоторое время я вижу лишь угол письма, выступающий из-под бумаг.\n\nСлуга спрашивает, убрать ли всё со стола. Я кладу руку на стопку листов и не сразу отвечаю."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Спутники уже договорились, у какой переправы мы окажемся дальше, но карта всё ещё лежит на столе. Я придвигаю старое письмо к лампе и снова не могу вчитаться в перечень переходов.\n\nСнаружи кто-то укладывает сбрую; металлические пряжки стукаются друг о друга. Я трижды просматриваю участок пути, который предстоит подтвердить, но запоминаю лишь старое название в письме. Завтрашняя дорога туда не ведёт.\n\nСпутник ждёт меня у двери. Я прикрываю письмо, но пальцы остаются на нём."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Собрание окончено, но счётные книги и писание ещё раскрыты на столе. Я вытаскиваю из книги старое письмо, и тот неугомонный голос внутри возвращается.\n\nЗа день мне удаётся разобрать пожертвования, починки и предстоящие праздники. Но стоит остаться наедине с собой, и все эти подсчёты отступают. На бумаге остался след от тяжёлой книги, края истрепались, а я всё равно сразу узнаю знакомую строку.\n\nПо галерее кто-то проходит. Я вновь прячу письмо в книгу — на ту же самую страницу."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Совет окончен, а бумаги и воск для печатей всё ещё громоздятся на столе. Я разглаживаю рукав, но старое письмо под рукой занимает меня куда больше донесений.\n\nВ оставленной писцом выписке всё изложено ясно. Я беру её, но ещё до конца первого имени взгляд соскальзывает на письмо. Ему не место на этом столе. Однако утром именно по моей воле оно оказалось среди бумаг.\n\nЗа дверью всё ещё ждут следующего распоряжения. Я велю пока подождать."
 latria_sexual_frustration_flavor.1005.desc: "Дел под рукой немало, но старое письмо никак не даёт мне сосредоточиться.\n\nЯ складываю бумаги по размеру, снова перемешиваю и складываю ещё раз. Письмо неизменно остаётся наверху. Масла в лампе становится меньше, а на бумагах так и не появляется ни одной моей пометки.\n\nЗа дверью кто-то негромко кашляет. Только тогда я убираю руку с письма."
 latria_sexual_frustration_flavor.1005.a: "Отложить дела и перечитать старое письмо."
 latria_sexual_frustration_flavor.1005.b: "Убрать письмо и вернуться к обязанностям."
 latria_sexual_frustration_flavor.1005.c: "Распределить оставшуюся работу и позволить себе короткий отдых."
 latria_sexual_frustration_flavor.1005.d: "Разобрать все дела и завершить каждое."

 latria_sexual_frustration_flavor.1006.t: "Старое письмо при свечах"
 latria_sexual_frustration_flavor.1006.desc.female: "Я сижу под лампой в ночной рубашке, положив пальцы на сгиб старого письма. В нём нет обещаний, только несколько обычных приветствий, а внизу оставлено много пустого места, словно писавший внезапно остановился.\n\nЯ долго смотрю на эту пустоту. Когда письмо пришло, я не придала ей значения, но сегодня ночью незаполненное место кажется весомее написанных слов. Фитиль потрескивает, и тень вздрагивает на бумаге.\n\nЗавязки ночной рубашки ослабли, но я не поправляю их. Письмо всё ещё раскрыто, и до конца ночи далеко."
 latria_sexual_frustration_flavor.1006.desc.male: "Я сижу у постели в ночной рубашке. Почерк в старом письме напоминает о чувстве, которое так и не получило ответа. Бумага размякла, на сгибах почти рвётся, но я всё равно расправляю её.\n\nВ письме говорится о погоде в пути и каком-то пустяке. Мне же помнится день, когда его доставили: я стоял в галерее, хотел выбежать следом, но кто-то окликнул меня. Позже я убрал письмо в ларец. Тот, кто его написал, больше не вернулся.\n\nФитиль становится короче. Я поворачиваю лист к свету другой стороной; слова всё те же."
 latria_sexual_frustration_flavor.1006.desc: "Ночь тиха, но строки старого письма долго не уходят из памяти.\n\nМне хочется лишь взглянуть на него перед сном. Но стоит зажечь лампу, и эти несколько строк уже не отпускают меня. На середине я начинаю читать заново, словно между словами скрыто то, чего прежде не удавалось понять.\n\nПостель уже приготовлена. Я всё ещё сижу над письмом, и на краю бумаги появляются новые следы от моих пальцев."
 latria_sexual_frustration_flavor.1006.a: "Дочитать письмо до конца."
 latria_sexual_frustration_flavor.1006.b: "Убрать письмо, погасить свечу и лечь спать."

 latria_sexual_frustration_flavor.1007.t: "Прежде чем закончится пир"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Среди шуток кто-то вспоминает прежнего любовника, и никто за столом не видит в этом неприличия. Кубки звенят, затем стихает и смех — словно речь шла о чём-то обыденном, вроде погоды.\n\nЯ поднимаю кубок вместе со всеми, но взгляд раз за разом возвращается к пустому месту. Посуду оттуда уже убрали, осталась лишь примятая скатерть. Я знаю, кого жду, и знаю, что сегодня этого человека здесь не будет.\n\nСосед за столом спрашивает, на что я смотрю. Я качаю головой, так и забывая отпить вина."
 latria_sexual_frustration_flavor.1007.desc.strict: "Историю о тайной связи рассказывают в назидание, и гости тут же заводят речь о чести и приличиях. Рассказчик понижает голос, но сидящие рядом всё равно слышат, поэтому даже смеются с оглядкой.\n\nЯ опускаю глаза, поправляю рукав и не вмешиваюсь. История чужая, а звучит так, словно обращена ко мне. Под краем стола я поворачиваю ножку кубка между пальцами, раз за разом.\n\nРазговор быстро переходит на другое. Рукав уже расправлен, но мои мысли остаются на прежнем месте."
 latria_sexual_frustration_flavor.1007.desc: "Музыка ещё звучит, хотя мыслями я давно далеко от пиршественного стола.\n\nГости пускают вино по последнему кругу. Я смотрю, как они говорят, но слышу лишь слова, которым никак не находится выхода у меня внутри. Кто-то пьёт в мою честь. Я поднимаю кубок, и вино в нём колышется.\n\nМелодия близится к концу. Я всё ещё сижу за столом, словно никак не могу решить, остаюсь ли я участником этого пира."
 latria_sexual_frustration_flavor.1007.a: "Пусть услышат о моей тоске с самого начала."
 latria_sexual_frustration_flavor.1007.b: "Проглотить слова, поблагодарить хозяина и уйти."
 latria_sexual_frustration_flavor.1007.c: "Лучше расспросить соседа о путешествиях."

 latria_sexual_frustration_flavor.1008.t: "Молитва перед святыней"
 latria_sexual_frustration_flavor.1008.desc.favors: "Свеча перед святыней догорает. Я вспоминаю, что моя вера не отвергает плотских утех. Эти слова звучали много раз, но лишь теперь мне словно впервые приходится искать им место в собственной жизни.\n\nНа медной подставке застыл слой натёкшего воска. На середине молитвы губы всё ещё произносят привычные слова, а я думаю о чьей-то руке, о шорохе одежды при приближении знакомого человека. Священное изображение неподвижно; вздрагивает лишь пламя.\n\nЯ пытаюсь вернуть мысли к молитве. На полпути усилие ослабевает, и я снова отпускаю их."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Я беззвучно повторяю перед святыней обет целомудрия, но знакомая молитва то и дело обрывается. Первая строка ещё звучит целиком, во второй уже выпадают слова, оставляя как раз достаточно места для посторонней мысли.\n\nЭта мысль не требует внимания громко. Она лишь напоминает: когда я вернусь сегодня в покои, постель снова будет пуста, а рядом с моей рукой не окажется другой. Я убираю со лба волосы и начинаю с первой строки.\n\nФитиль потрескивает. Вместе с ним прерывается и мой голос."
 latria_sexual_frustration_flavor.1008.desc: "Молитва окончена, но я остаюсь возле свечи.\n\nВсё, что полагалось произнести, уже сказано. Колени слегка затекли, однако я не встаю. Пламя опускается, потом с трудом выравнивается, словно тоже ждёт завершения, которое никак не приходит.\n\nЯ смотрю на этот огонёк и знаю, что тревожащие меня мысли никуда не ушли. Они лишь ненадолго уступили место молитве."
 latria_sexual_frustration_flavor.1008.a: "Отложить обет воздержания и признать свою тоску."
 latria_sexual_frustration_flavor.1008.b: "Унять мысли и продолжить молитву."
 latria_sexual_frustration_flavor.1008.c: "Прочитать отрывок и обдумать его перед уходом."
 latria_sexual_frustration_flavor.1008.d: "Поддерживать огонь свечи и читать до рассвета."

 latria_sexual_frustration_flavor.1009.t: "Непрочитанная петиция"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Донесения разложены на длинном столе, вельможи ждут моего слова. Я дважды читаю одну строку, но второе число всё равно не удерживается в памяти. Перо поворачивается в пальцах, и на чистое место падает капля чернил.\n\nВ их взглядах почтение уже уступает место сомнению. Кто-то негромко кашляет, кто-то наливает воды, но заговорить первым не решается никто. Я знаю, что пора вынести решение, а в голове мелькает та половина строки, что осталась вчера ночью недописанной.\n\nПисец пододвигает следующее донесение поближе. Моя рука всё ещё лежит на первом."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Совет ещё не окончен, но я не могу вчитаться ни в одно слово на лежащих передо мной бумагах. Закрываю папку, снова открываю — на полях всё те же вчерашние пометки.\n\nСоветники говорят о цене зерна и речном русле. Я различаю несколько слов, затем отвлекаюсь и незаметно прихожу мыслями к одному имени. В этих бумагах его нет. И всё же я продолжаю искать его на листе.\n\nКто-то спрашивает, не объявить ли перерыв. Я поднимаю голову и только теперь замечаю, что в комнате уже некоторое время тихо."
 latria_sexual_frustration_flavor.1009.a: "Распустить совет и остаться со своими мыслями."
 latria_sexual_frustration_flavor.1009.b: "Собраться с мыслями и заняться каждой петицией."
 latria_sexual_frustration_flavor.1009.c: "Упорядочить решения, затем огласить каждое."

 latria_sexual_frustration_flavor.1010.t: "Возвращение орла"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Ловчая птица кружит над лесом. Её тень раз за разом скользит по моей перчатке, но сама она не садится. Я поднимаю руку, а птица лишь делает ещё один круг, забираясь выше.\n\nЯ смотрю на неё и вдруг чувствую, до чего мне надоело подавлять каждый свой порыв. Охотники тихо переговариваются у лошадей, полагая, что я жду перемены ветра. На самом деле я жду, когда удастся назвать это беспокойство чем-нибудь другим. Но другого названия не находится.\n\nПтица издаёт короткий пронзительный крик, словно больше не желает слушаться зова."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Ловчая птица всё ещё кружит вдали. Я сжимаю перчатку и заставляю себя слушать только команды охотников, следить лишь за опушкой и направлением ветра. Ремешок в ладони становится влажным.\n\nМне уже много раз приходилось сдерживать себя. Сегодня это особенно трудно. С каждой минутой ожидания в голову приходит ещё одна недозволенная фраза; я повторяю её про себя и тут же обрываю. Лошадь ломает копытом сухую ветку, и от этого слабого треска я вздрагиваю.\n\nПтица всё ещё не возвращается. Рука уже ноет."
 latria_sexual_frustration_flavor.1010.desc: "Охотники ждут, когда можно будет возвращаться, а я всё смотрю в небо над лесом.\n\nРог висит у седла. Я касаюсь его, но не беру в руки. Чёрная точка в небе описывает круг за кругом. Никто меня не торопит, но ждут все.\n\nНаконец я опускаю голову и понимаю, что даже не замечаю, в какую сторону летит птица."
 latria_sexual_frustration_flavor.1010.a: "Пусть охотники ждут, пока мои мысли следуют за орлом."
 latria_sexual_frustration_flavor.1010.b: "Подать сигнал к возвращению и проверить охотничьи снасти."
 latria_sexual_frustration_flavor.1010.c: "Пройти вдоль леса, прежде чем вернуться к спутникам."

 nick_latria_the_unquiet: "Беспокойный"
