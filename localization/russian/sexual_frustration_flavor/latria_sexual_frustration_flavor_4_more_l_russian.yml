 latria_sexual_frustration_flavor.1311.t: "До того, как проснётся двор"
 latria_sexual_frustration_flavor.1311.desc: "Просыпаюсь раньше двора, рубашка задрана выше бёдер, рука уже прижата между ними. Не убираю её. Сон всё ещё на мне — тяжесть того, кого в этой комнате не было, — и тело намерено закончить начатое сном.\n\nГлаза закрыты, и это продолжается, дыхание укорачивается, основание ладони держит медленный ритм, который я к этому времени знаю. За зубами имя. Не говорю его — не теперь, когда половицы коридора скрипят под шагами слуги.\n\nКогда всё обрывается, лежу тихо, пальцы мокрые, простыня под бедром сырая. Шаги проходят мимо дверей и дальше. Опускаю рубашку, и ткань липнет."
 latria_sexual_frustration_flavor.1311.a: "Дать закончиться, потом одеться на день."
 latria_sexual_frustration_flavor.1311.b: "Убрать руку и лежать тихо до колокола."
 latria_sexual_frustration_flavor.1311.c: "Встать, умыться и посидеть с болью."

 latria_sexual_frustration_flavor.1312.t: "Привой на груше"
 latria_sexual_frustration_flavor.1312.desc: "Сад ещё мокр от ночного дождя, и тот, кого я всю неделю избегаю, показывает мне новый привой на груше. Пальцы смыкаются на моих, чтобы провести их вдоль среза. Когда показ окончен, никто из нас не отпускает.\n\nЧувствую пульс в большом пальце у моего запястья. За изгородью двое моих дворовых спорят о седле. Чуть поворот головы — с моей стороны и с той, — и мы делали бы то, что никто не назвал бы садоводством.\n\nГоворят, что привой примется к осени. Рука всё ещё на моей. Ветка капает мне на рукав, и я не стираю."
 latria_sexual_frustration_flavor.1312.a: "Сказать прямо, чего хочу, здесь, под деревом."
 latria_sexual_frustration_flavor.1312.b: "Поблагодарить за урок и отступить."
 latria_sexual_frustration_flavor.1312.c: "Остаться и сказать вместо этого одну правдивую вещь."

 latria_sexual_frustration_flavor.1313.t: "Через стол"
 latria_sexual_frustration_flavor.1313.desc: "Чаши обошли круг дважды, и в зале так громко, что никто не слушает кого-то одного. Час я смотрю на одного и того же гостя через стол — на линию горла, когда этот человек смеётся.\n\nМог бы сказать. Не всё, а столько, чтобы стало ясно: я не о погоде. Сосед услышит. И управитель с конца стола, который повторяет двору всё, что ему скажут, — тоже.\n\nПоворачивают чашу за ножку и смотрят на меня поверх неё. Открываю рот. Музыканты начинают снова, и всё, что я мог сказать, уходит под барабан."
 latria_sexual_frustration_flavor.1313.a: "Сказать достаточно громко, чтобы услышали."
 latria_sexual_frustration_flavor.1313.b: "Придержать язык и дать вину сделать своё."
 latria_sexual_frustration_flavor.1313.c: "Обернуться к соседу и обратить это в игру."

 latria_sexual_frustration_flavor.1314.t: "Первое слово"
 latria_sexual_frustration_flavor.1314.desc: "Я на коленях на холодном камне так долго, что плиты отпечатались на голенях, и слова перестали быть словами. Ум всё возвращается к губам, которые в этом здании помнить не полагается, — к тому, как они раскрывались, к звуку, что из них вышел.\n\nНаставник ждёт у пюпитра с терпением того, кто слышал все исповеди на свете. Мог бы рассказать. Рассказ был бы дверью, которую не закрыть снова, а тело хочет, чтобы дверь осталась открытой — сегодня, с ещё горящей лампой.\n\nЯ дохожу до первого слова. Свеча между нами клонится от сквозняка, и я смотрю, как воск стекает по железу и застывает там."
 latria_sexual_frustration_flavor.1314.a: "Рассказать — и пусть храм судит меня."
 latria_sexual_frustration_flavor.1314.b: "Оставить исповедь при себе и понести епитимью."
 latria_sexual_frustration_flavor.1314.c: "Попросить книгу и читать, пока дрожь не кончится."
 latria_sexual_frustration_flavor.1314.d: "Держать бдение до утра."

 latria_sexual_frustration_flavor.1315.t: "Ольховые заросли"
 latria_sexual_frustration_flavor.1315.desc: "Охота рассыпалась, и я пошёл за кабаном, которого никогда не было. Тот, с кем я хотел остаться один, находит меня в ольховых зарослях с расстёгнутыми штанами и рукой на себе — и не отворачивается.\n\nОпускаются на колени в мокрые листья. Одна рука у меня в чужих волосах, другая уперта в ствол, и рога трубят где-то к востоку, так близко, что не следовало бы. Никто из нас не останавливается. Губы берут меня, и приходится прикусить щеку изнутри, чтобы молчать.\n\nПосле колени у меня в грязи, к бедру прилип лист. Вытирают губы тыльной стороной запястья и говорят, что кабан ушёл на север."
 latria_sexual_frustration_flavor.1315.a: "Пусть охота идёт без меня."
 latria_sexual_frustration_flavor.1315.b: "Снова в седло — и заслужить своё место."
 latria_sexual_frustration_flavor.1315.c: "Читать землю и идти по следам."

 latria_sexual_frustration_flavor.1316.t: "Кривая печать"
 latria_sexual_frustration_flavor.1316.desc: "Совет час бьётся над одним прошением, и я не подписал ничего. Под столом руки у меня на коленях, и я думаю о последней ночи похода, о шатре и о том, как в него входят без стука и не выходят до смены стражи.\n\nКанцлер спрашивает, согласен ли я. Отвечаю, что согласен, и не имею понятия, с чем. Печать тёплая от перстня. Прижимаю её к воску, и оттиск выходит кривым, буквы сдвоены с одного края.\n\nВереницей уходят со своими бумагами. Остаюсь в кресле, перед мной кривая печать, и в комнате всё ещё пахнет чужими свечами."
 latria_sexual_frustration_flavor.1316.a: "Послать за тем, о ком думаю, вместе с печатью."
 latria_sexual_frustration_flavor.1316.b: "Положить печать и вернуться к прошениям."
 latria_sexual_frustration_flavor.1316.c: "Позвать совет обратно и закончить работу."

 latria_sexual_frustration_flavor.1317.t: "Строка на полях"
 latria_sexual_frustration_flavor.1317.desc: "Экзаменационная палата подметена и тиха, и я один с толкованиями. Знаки не стоят на месте. Одну и ту же строку о воздержании читаю в четвёртый раз, и каждый раз она о паре рук, которые я отпустил слишком поздно, в коридоре, с приближающейся лампой.\n\nСвоей рукой, на полях, я записал строку стиха, которая вовсе не толкование. Если экзаменатор её увидит, то поймёт, для чего она и для кого. Мог бы сжечь страницу. Жаровня в трёх шагах, и угли ещё красные.\n\nПереписываю строку снова, аккуратнее, и к последнему движению кисть дрожит."
 latria_sexual_frustration_flavor.1317.a: "Переписать стих и дать его прочесть."
 latria_sexual_frustration_flavor.1317.b: "Закрыть книгу и спать на циновке."
 latria_sexual_frustration_flavor.1317.c: "Вернуться к толкованиям и начать снова."
 latria_sexual_frustration_flavor.1317.d: "Положить стих на напев, который поют при дворе."

 latria_sexual_frustration_flavor.1318.t: "Две чаши во дворе"
 latria_sexual_frustration_flavor.1318.desc: "Пир вылился во двор, и старейший друг — за мной, с двумя чашами. Я не говорил никому — ни священнику, ни слуге, ни тому, кого это касается. Сегодня вино сделало молчание тяжёлым, как тяжёла полная чаша.\n\nМог бы вложить это в чужие руки и дать нести часть. Смеяться не станут. И не забудут тоже, и каждый раз, глядя на меня через залу, между нами будет это — вещь с именем.\n\nПодают чашу и ждут, а фонтан за спиной всё идёт. Выпиваю до дна, и лёд трескается и оседает."
 latria_sexual_frustration_flavor.1318.a: "Сказать вслух и дать им это сохранить."
 latria_sexual_frustration_flavor.1318.b: "Поклясться отказаться — и всерьёз, на эту ночь."
 latria_sexual_frustration_flavor.1318.c: "Читать им, пока двор не опустеет."

 latria_sexual_frustration_flavor.1319.t: "Садовая стена"
 latria_sexual_frustration_flavor.1319.desc: "Спина у садовой стены, юбки задраны выше бёдер, и моя рука между ног, где это мог бы увидеть всякий, кто идёт по дорожке. Уже влажно. С самого коридора.\n\nВхожу двумя пальцами, и запястье перехватывают и держат там, крепче, лоб у моего плеча. Дыхание рвётся. По ту сторону стены садовник всё ещё работает, лопата звенит по камням.\n\nДрожь, и ногти смыкаются на моей руке. Когда можно стоять, юбки расправляют, и один раз, тихо, произносят моё имя — как вопрос, на который уже ответили."
 latria_sexual_frustration_flavor.1319.a: "Остаться, пока не будет сил идти."
 latria_sexual_frustration_flavor.1319.b: "Забрать руку и пожелать доброго вечера."
 latria_sexual_frustration_flavor.1319.c: "Обойти стену длинной дорогой одному."

 latria_sexual_frustration_flavor.1320.t: "Перечень"
 latria_sexual_frustration_flavor.1320.desc: "Я пришёл в храм, чтобы от этого избавиться, а вместо этого стою на коленях и составляю перечень: запах определённой шеи, звук, который издаёт определённый человек, точный вес тела у моего в дверном проёме, одна ладонь плашмя на косяке.\n\nНаставник не спит и читает. Мог бы попросить епитимью — и получил бы, и исполнил бы, и к третьей ночи снова был бы на этом камне с тем же перечнем, только длиннее.\n\nВместо этого прошу книгу. Дают, не говоря ни слова, отметив своё место большим пальцем, и я держу её раскрытой и не читаю ни строки."
 latria_sexual_frustration_flavor.1320.a: "Назвать всё — и пусть храм ответит."
 latria_sexual_frustration_flavor.1320.b: "Попросить епитимью и сохранить перечень."
 latria_sexual_frustration_flavor.1320.c: "Слушать то, что готовы мне сказать."

 latria_sexual_frustration_flavor.1321.t: "Три недели в пути"
 latria_sexual_frustration_flavor.1321.desc: "Три недели в пути, и с последнего города я не оставался наедине ни с кем. Конь расседлан, огонь низок, остальные спят в плащах на расстоянии руки, так близко, что слышно, как один скрипит зубами.\n\nЛежу, рука под рубашкой, зубы на собственном суставе, слушаю, как переступают кони и как сапоги часового идут по листьям. Это длится долго, и, когда всё кончается, я не удовлетворён, только устал, и желание всё ещё там, под усталостью.\n\nЧасовой возвращается мимо огня и не смотрит на меня. Подтягиваю плащ и смотрю, как угли сереют."
 latria_sexual_frustration_flavor.1321.a: "Взять то, что позволяет ночь, и спать."
 latria_sexual_frustration_flavor.1321.b: "Встать и встать на свою очередь в стражу."
 latria_sexual_frustration_flavor.1321.c: "Учиться одному, пока руки не задрожат."

 latria_sexual_frustration_flavor.1322.t: "Чаша посла"
 latria_sexual_frustration_flavor.1322.desc: "Стол посольства накрыт на двенадцать, и я сижу рядом с их послом, у чьего народа есть обычай о гостеприимстве, о котором я думаю с тех пор, как нас представили, — через рыбу, через второй налив.\n\nЧашу мне наполняют сами, что их управителю не нравится. Скажи я здесь не то — и с ближайшим кораблём это уйдёт в донесении, моим именем, чужой рукой. Скажи я то — и тоже уйдёт в донесении, и будет прочитано вслух в комнате, в которую я никогда не войду.\n\nЗадают вопрос о наших брачных обычаях. Отвечаю скверно. Свеча догорела до гнезда, и никто из нас не велел принести другую."
 latria_sexual_frustration_flavor.1322.a: "Ответить так, как позволяет их обычай."
 latria_sexual_frustration_flavor.1322.b: "Пожелать доброй ночи и уйти."
 latria_sexual_frustration_flavor.1322.c: "Перевести речь на договор и держать её там."

 latria_sexual_frustration_flavor.1323.t: "Хор на хорах"
 latria_sexual_frustration_flavor.1323.desc: "Хор репетирует на хорах, и я должен слышать созвучие, а не губы священника, который ведёт, — то, как этот человек лепит третью строку.\n\nЯ привык приходить рано и уходить поздно. Пение делает с теснотой в груди то, чего не делает молитва, и я знаю, вместо чего оно стоит. Наставник заметил час, который я держу, и молчит — это хуже выговора, потому что значит: ждут.\n\nПоследняя нота умирает в сводах. Остаюсь на скамье, ладони плашмя на коленях, пока пономарь не придёт с ключами."
 latria_sexual_frustration_flavor.1323.a: "Петь с ними и дать звуку это унести."
 latria_sexual_frustration_flavor.1323.b: "Держать устав и уйти до последнего стиха."
 latria_sexual_frustration_flavor.1323.c: "Разбирать напев с наставником."

 latria_sexual_frustration_flavor.1324.t: "Утренний колокол"
 latria_sexual_frustration_flavor.1324.desc: "Просыпаюсь, запутавшись в простынях, со всем этим всё ещё на мне, рубашка задрана под мышки, и рука между ног прежде, чем я толком проснулся. Сон уходит, и я гонюсь за ним, бёдра поднимаются, и мне всё равно, кто в соседней комнате и который час по колоколу.\n\nВсё приходит порывом, от которого дрожит бедро. Лежу, пальцы всё ещё во мне, дыхание громкое в тишине, и простыня подо мной промокла насквозь, уже холодная там, где её достаёт воздух.\n\nКолокол к утренней службе начинает. Высвобождаю мокрую простыню и кладу в таз, и вода мутнеет."
 latria_sexual_frustration_flavor.1324.a: "Закончить, умыться и ответить колоколу."
 latria_sexual_frustration_flavor.1324.b: "Стащить простыню и идти не умывшись."
 latria_sexual_frustration_flavor.1324.c: "Сесть за доску, пока руки не станут твёрдыми."

 latria_sexual_frustration_flavor.1325.t: "Дверь"
 latria_sexual_frustration_flavor.1325.desc: "В углу идёт игра, и я проиграл три партии, потому что всё смотрю на дверь. Тот, кого я жду, опаздывает, и вся зала знает, кто я, и с кем я в браке, и кто из них за мной следит.\n\nМог бы встать на скамью и сказать. Комната затихла бы, как комнаты затихают, и к утру это было бы в каждой зале отсюда до побережья — с моим именем и с именем моей семьи после него, и эти два имени больше не разделить.\n\nДверь открывается. Это слуга с вином. Подставляю чашу, и рука тверда, что хуже."
 latria_sexual_frustration_flavor.1325.a: "Встать и сказать на всю залу."
 latria_sexual_frustration_flavor.1325.b: "Остаться сидеть и дать игре идти."
 latria_sexual_frustration_flavor.1325.c: "Найти друга и сесть рядом."

 latria_sexual_frustration_flavor.1326.t: "Счета"
 latria_sexual_frustration_flavor.1326.desc: "Управитель разложил счета, карту и список моих обязательств, и я не прочёл ничего. Думаю о двери в городе, через который проезжал весной, и о том, как дважды, в темноте за ней, прозвучало моё имя, прежде чем поднялась щеколда.\n\nДела много, и делать его — мне. Обмакиваю перо, пишу первую цифру, и она неверна, и я зачёркиваю её так сильно, что перо расщепляется, и чернила идут через столбец.\n\nПодрезаю перо и начинаю снова. За окном гарнизон на ученье, и крик держит такт."
 latria_sexual_frustration_flavor.1326.a: "Оставить счета и послать за тем городом."
 latria_sexual_frustration_flavor.1326.b: "Положить перо и взять счётную книгу."
 latria_sexual_frustration_flavor.1326.c: "Разбирать список, пока свечи не оплывут."

 latria_sexual_frustration_flavor.1327.t: "Подъём"
 latria_sexual_frustration_flavor.1327.desc: "Едем с рассвета, и трава пуста во все стороны: ни дерева, ни всадника, ничего до края неба. Тело жалуется со второго дня в седле, и сама езда его не уняла — только сделала хуже.\n\nОсаживаю на вершине подъёма, опускаю руку в штаны и заканчиваю в несколько резких движений, с ветром в лицо и без единого человека в виду, а конь всё это время переступает подо мной.\n\nЗавязываю шнур узлом и еду вниз к ним. Двоюродный спрашивает, чему я улыбаюсь, и я отвечаю, что конь хороший."
 latria_sexual_frustration_flavor.1327.a: "Взять миг, который даёт степь."
 latria_sexual_frustration_flavor.1327.b: "Ехать дальше и выкинуть это из ума."
 latria_sexual_frustration_flavor.1327.c: "Пустить сокола, пока руки не устанут."

 latria_sexual_frustration_flavor.1328.t: "Бдение"
 latria_sexual_frustration_flavor.1328.desc: "Я в храме с самой службы и всё ещё здесь. Лампу наполняли дважды, и масло пахнет дешёвым отжимом. Колени прошли от боли к какому-то онемению, а желание никуда не ушло: оно устроилось и устроилось удобно.\n\nБдение должно опустошать человека. Вместо этого оно дало желанию место, как тёмная комната даёт форму всему, что в ней стоит. Мог бы уйти. Дверь не заперта, и город недалеко.\n\nНачинаю псалом сначала. Голос выходит твёрдым, и я его за это немного ненавижу."
 latria_sexual_frustration_flavor.1328.a: "Прервать бдение и выйти в город."
 latria_sexual_frustration_flavor.1328.b: "Держать бдение, пока небо не посереет."
 latria_sexual_frustration_flavor.1328.c: "Прочесть псалтырь до конца."

 latria_sexual_frustration_flavor.1329.t: "Четыре строки"
 latria_sexual_frustration_flavor.1329.desc: "Я в ночной рубашке у окна, и на подоконнике письмо, написанное и не отправленное. Четыре строки. Последняя говорит, чего я хочу, словами, которых я не употребляю при свете дня, и чернила высохли, и печать цела.\n\nМог бы отдать его слуге у дверей. Мог бы и сжечь — три других уже сожжены, и пепел всё ещё в жаровне. Телу сжигание неинтересно. Оно хочет ответа, который приходит после того, как отдал.\n\nСвеча — огарок, воск стёк через край. Читаю последнюю строку снова, и бумага дрожит в руке."
 latria_sexual_frustration_flavor.1329.a: "Отдать письмо слуге."
 latria_sexual_frustration_flavor.1329.b: "Положить его в жаровню и лечь спать."
 latria_sexual_frustration_flavor.1329.c: "Сидеть у окна, пока огарок не погаснет."

 latria_sexual_frustration_flavor.1330.t: "Пункт о границе"
 latria_sexual_frustration_flavor.1330.desc: "Кабинет наставника пахнет пылью и холодными чернилами, и из договора я не взял ни слова. Объясняют пункт о границе, а я смотрю на руки, на чернила сбоку пальца, на то, как прижимают страницу.\n\nЭтот человек годится мне в родители и вдвое осторожнее, и ничего в этом нет, и не должно быть. Желание не спрашивает позволения. Оно сидит во мне, пока страница поворачивается и ноготь находит следующий пункт.\n\nСпрашивают, понял ли я. Отвечаю: да. Смотрят на миг дольше, чем требует вопрос, и возвращаются к странице."
 latria_sexual_frustration_flavor.1330.a: "Написать вместо этого стих о границе."
 latria_sexual_frustration_flavor.1330.b: "Попросить принять исповедь."
 latria_sexual_frustration_flavor.1330.c: "Назвать пункт в ответ, слово в слово."

 latria_sexual_frustration_flavor.1331.t: "Медленный час"
 latria_sexual_frustration_flavor.1331.desc: "Дом спит, а я нет — уже час. Рубашка задрана выше бёдер, и пальцы нашли мою влагу без моего решения. Держу их там и впускаю мысль, что кружит с самого коридора, — о том, кто наклонился поправить мне ворот и не отступил после.\n\nНажимаю и веду кругом, как меня научило тело, медленно, потом не медленно, другая рука плашмя на спинке, чтобы она не стучала о стену. Внизу дверь для слуг и лестница, которая жалуется. Я не останавливаюсь. Дыхание рвётся, и я утыкаюсь лицом в подушку, чтобы проглотить звук.\n\nВсё обрывается, и я лежу, пальцы всё ещё у себя, пульс идёт под ними. Лестница жалуется ещё раз и успокаивается. Опускаю рубашку, ткань сырая и липнет."
 latria_sexual_frustration_flavor.1331.a: "Дать закончиться, потом одеться до колокола."
 latria_sexual_frustration_flavor.1331.b: "Убрать руку и лежать тихо."
 latria_sexual_frustration_flavor.1331.c: "Умыться и сидеть с болью, пока она не притупится."

 latria_sexual_frustration_flavor.1332.t: "Холодный неф"
 latria_sexual_frustration_flavor.1332.desc: "Я пришёл в храм, чтобы опустошить себя, и стоял на коленях на холодном камне, пока желание только не осело глубже. Теперь у него есть лицо — тот человек, которому я исповедовался на пиру, то, как этот человек слушает, склонив голову, как движется большой палец по чаше. Рука у меня под рясой, и в темноте бокового прохода её не видно.\n\nГлаза — на алтарной лампаде, пальцы работают, медленно, челюсть сжата. Где-то за преградой открывается дверь, и прислужники входят на ночную службу, ноги по плитам. Надо бы остановиться. Рука не останавливается. Прижимаю лоб к сложенным рукам и дышу сквозь зубы.\n\nПроходит и оставляет меня пустым и дрожащим. Прислужники начинают псалом. Остаюсь на коленях, пока ноги не онемеют, и лампада — единственное, на что можно смотреть."
 latria_sexual_frustration_flavor.1332.a: "Назвать это на исповеди и понести епитимью."
 latria_sexual_frustration_flavor.1332.b: "Держать бдение, пока небо не посереет."
 latria_sexual_frustration_flavor.1332.c: "Прочесть псалтырь до конца."

 latria_sexual_frustration_flavor.1333.t: "Зелёная низина"
 latria_sexual_frustration_flavor.1333.desc: "Я увёл того, кого хотел, с охоты в низину, где свет идёт зелёным сквозь листья. Штаны расстёгнуты, чужая рука на мне, моя — под юбками, и никто из нас не притворяется, что дело в оленях. Уже влажно. С тех пор, как я перехватил запястье у брода.\n\nВхожу пальцами, и в ответ — вздох, и рот закрывает мой рот, крепко, свободная рука сжимается в кулак на моём вороте. Рога трубят по деревьям, охота поворачивает где-то близко. Мы не останавливаются. Движутся навстречу моей руке, и дыхание идёт короткими толчками у моей щеки.\n\nДрожь — и покой, запястье в хватке. Рога тают к востоку. Юбки расправляют дрожащими руками, и из волос падает лист."
 latria_sexual_frustration_flavor.1333.a: "Пусть охота идёт без нас."
 latria_sexual_frustration_flavor.1333.b: "Снова в седло — и заслужить своё место."
 latria_sexual_frustration_flavor.1333.c: "Вернуться длинной дорогой и остудить себя."

 latria_sexual_frustration_flavor.1334.t: "Поля договора"
 latria_sexual_frustration_flavor.1334.desc: "В кабинете холодно, договор раскрыт, и один и тот же пункт прочтён трижды. Посол, который его привёз, уехал, а память нет: тот час в коридоре, когда этот человек был у стены, моя рука под туникой, губы открыты на моём плече, и оба мы слушаем, не идёт ли кто.\n\nРука ушла к коленям под столом. Заставляю себя убрать её и прижать плашмя к странице. Чернила под ладонью сухи. Напиши я на полях то, что думаю, писец переписал бы набело и к утру пустил бы по рукам.\n\nОбмакиваю перо и снова пишу пункт, правильно, и к последнему слову рука не тверда. Свеча мигает, и я подрезаю фитиль."
 latria_sexual_frustration_flavor.1334.a: "Прямо сказать, чего я хочу."
 latria_sexual_frustration_flavor.1334.b: "Пожелать доброго и отступить."
 latria_sexual_frustration_flavor.1334.c: "Расставить доску и играть, пока руки не успокоятся."

 latria_sexual_frustration_flavor.1335.t: "За ковром"
 latria_sexual_frustration_flavor.1335.desc: "Пир громок, музыканты между мелодиями, и тот, за кем я следил весь вечер, оказался за ковром, куда свет не доходит. Моя рука под платьем, спина у стены, и свои губы прикушены, чтобы молчать. Другая рука — на чужом рту, не сильно, ровно настолько.\n\nЗала в трёх футах по ту сторону ткани. Чаша разбивается, кто-то смеётся. Движутся навстречу моим пальцам, глаза закрываются, и я чувствую, как дрожь проходит сквозь это тело, дыхание горячее и частое у моей ладони.\n\nОседают немного, и я держу. За ковром музыканты начинают снова. Платье расправляют, и первыми уходят, а я жду, прежде чем идти следом."
 latria_sexual_frustration_flavor.1335.a: "Вернуться тихо и сесть на место."
 latria_sexual_frustration_flavor.1335.b: "Остаться за тканью ещё на миг."
 latria_sexual_frustration_flavor.1335.c: "Найти друга и сесть рядом."
