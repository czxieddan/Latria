l_russian:
 latria_sexual_frustration_flavor.1301.t: "Неотправленное приглашение"
 latria_sexual_frustration_flavor.1301.desc.female: "Я сижу за столом в ночной рубашке; на листе выведено лишь одно имя. Чернила ещё не высохли, а служанка уже спрашивает с порога, отнести ли письмо. Я складываю бумагу, но не запечатываю и не отвечаю.\n\nДнём я не осмеливалась написать это имя. Теперь, ночью, бумага словно жжёт руки. Следом должно идти приглашение; я уже решила, куда и в какой час, но перо останавливается после обращения. Служанка спрашивает снова, ещё тише.\n\nЯ смотрю на имя. Оно весит больше, чем всё неоконченное письмо."
 latria_sexual_frustration_flavor.1301.desc.male: "Я сижу за столом в ночной рубашке; на листе выведено лишь одно имя. За дверью ждёт слуга, готовый передать весть. Его тень шевелится в щели и снова замирает.\n\nЯ щедро обмакиваю перо и держу его над бумагой. То, что нужно написать, вполне ясно: сегодня ночью, у боковой двери, чтобы никто третий не узнал. Но стоит словам попасть на лист, как они перестанут быть лишь моими мыслями. Фитиль потрескивает, и рядом с именем падает чернильная капля.\n\nСлуга тихонько кашляет. Я всё ещё не запечатываю письмо."
 latria_sexual_frustration_flavor.1301.desc: "Незапечатанное письмо уже долго лежит под лампой.\n\nНа бумаге только обращение. Пустого места после него хватило бы на множество фраз, но я не добавляю ни одной. Воск уже размягчился от тепла, ложечка для него лежит под рукой. Я её не беру.\n\nМасла становится меньше. Чернила в имени всё ещё влажные."
 latria_sexual_frustration_flavor.1301.a: "Дописать письмо и отдать его слуге."
 latria_sexual_frustration_flavor.1301.b: "Убрать письмо, подавить тоску и отправиться спать."

 latria_sexual_frustration_flavor.1302.t: "Суд двора"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Придворный поэт шутит о прежней любви, и даже самые суровые вельможи не хмурятся. Он рассказывает о случившемся за постельным пологом, словно об охотничьей забаве. Гости поднимают кубки, свет колышется кругом на поверхности вина.\n\nЯ улыбаюсь и тоже поднимаю кубок, но вино горчит во рту. История не обо мне, а звучит так, словно мои ночи тоже вынесли на всеобщее обозрение. Сосед трогает мой рукав и спрашивает, почему я молчу. Лишь теперь я замечаю, что мой смех запоздал.\n\nПоэт начинает следующую строку. Мой кубок всё ещё поднят."
 latria_sexual_frustration_flavor.1302.desc.strict: "Один из вельмож лишился доброго имени из-за тайной связи, и теперь все обсуждают его семью. Слова произносят медленно, словно вынося приговор. Кто-то качает головой, кто-то заново обдумывает браки своих детей.\n\nЯ слушаю их суд и вспоминаю, что меня взвешивают на тех же весах. На другой чаше лежат неотправленное письмо и несколько ночей тревожного сна. Пока никто их не видел. Но невидимыми они не становятся легче.\n\nКто-то спрашивает моё мнение. Я опускаю кубок, и его основание стукает о стол."
 latria_sexual_frustration_flavor.1302.desc: "Разговор за столом переходит к доброму имени и желаниям.\n\nВначале это лишь шутка. Но когда в ней называют определённую дверь и определённый час, мне уже не смешно. Я остаюсь на месте и смотрю, как мои руки сжимаются под скатертью.\n\nМузыканты продолжают играть, совсем тихо, словно боятся заглушить эти слова."
 latria_sexual_frustration_flavor.1302.a: "Говорить о своей тоске, вновь и вновь возвращая к ней разговор."
 latria_sexual_frustration_flavor.1302.b: "Промолчать, поблагодарить хозяев и уйти."

 latria_sexual_frustration_flavor.1303.t: "Полуночный колокол"
 latria_sexual_frustration_flavor.1303.desc.favors: "После звона колокола жрец остаётся у двери. Он говорит, что желание можно направить ко благу; его негромкий голос отчётливо слышен в ночи. Свечи в храме вытягивают его тень до моих колен.\n\nНо я уже не знаю, хочется ли мне ждать этого блага. Само ожидание стало ещё одним сводом запретов. Руки горят под рукавами, и никакие строки писания не могут унять этот жар. Жрец смотрит на меня, словно замечая вопрос, который так и не прозвучал до конца.\n\nОтзвук колокола ещё держится под балками. Я стою на коленях; они уже затекли."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Колокол звучит снова и снова, и с той же настойчивостью ложатся мне на сердце слова обета, которые читает жрец. Колени затекли, холод каменных плит давно уступил теплу моего тела. Ответа всё ещё нет.\n\nКаждая строка обета мне знакома. Знать её — ещё не значит принимать. На слове «отречься» язык на мгновение замирает, прежде чем я всё же произношу его. Жрец не поправляет меня, но эту заминку я прекрасно слышу и без него.\n\nПоследний удар колокола стихает. В храме так тихо, что слышно, как падает воск."
 latria_sexual_frustration_flavor.1303.desc: "Полуночная молитва не приносит покоя, а колокол всё ещё отдаётся под сводами.\n\nЯ повторяю слова до самой последней строки. Когда она заканчивается, я остаюсь на коленях, и моя забота тоже остаётся на прежнем месте. Колокольный звон ничего в ней не меняет.\n\nЖрец закрывает книгу. Шорох сомкнувшихся страниц звучит ближе колокола."
 latria_sexual_frustration_flavor.1303.a: "Оставить заповеди воздержания в храме."
 latria_sexual_frustration_flavor.1303.b: "Подавить мысль и повторить молитву ещё раз."

 latria_sexual_frustration_flavor.1304.t: "Конец терпению"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Я хожу по комнате в ночной рубашке. На принесённой слугой шахматной доске не сдвинута ни одна фигура. Окно чуть приоткрыто; ночной воздух проникает внутрь, но не унимает моего жара.\n\nЯ стою то у кровати, то у стола, то у двери. За ней не слышно шагов. Ожидание становится ещё одной мукой: я знаю, что никто не придёт, но каждый удар ночного барабана принимаю за стук. В ларце стукаются фигуры — это их задевает мой рукав.\n\nЯ возвращаюсь к доске и кладу палец на пешку, но так и не делаю хода."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Я заново затягиваю пояс ночной рубашки, стараясь придать каждому движению спокойствие. Пояс ощутимо врезается в талию. Чем тщательнее я сдерживаюсь, тем труднее делать вид, будто желания нет.\n\nШахматная доска на столе словно предлагает разумное занятие. Я сажусь, беру фигуру и ставлю обратно. Но пальцам всё ещё не даёт покоя другой порыв. Я прижимаю руку под столом, удерживаю её, а дыхание всё равно сбивается.\n\nВ комнате тихо. Так тихо, что я словно слышу ругательство, которого не произношу вслух."
 latria_sexual_frustration_flavor.1304.desc: "В комнате тихо, но я больше не могу сидеть спокойно.\n\nЯ встаю налить воды и не пью её. Иду подрезать фитиль, обрезаю слишком коротко, и пламя оседает. Каждое дело я только начинаю; ни одно не возвращает меня на стул.\n\nВ конце концов я стою посреди комнаты и не знаю, куда деть руки."
 latria_sexual_frustration_flavor.1304.a: "Отложить шахматы и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1304.b: "Вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1305.t: "Комната после заката"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Двор разошёлся, а я остаюсь в спальне в парадном одеянии. Донесения разобраны, краска на печатях высохла, шаги советников затихли вдали. Но моя забота не ушла вместе с ними.\n\nЯ расстёгиваю застёжку у ворота и останавливаюсь на полпути. Постель приготовлена слишком аккуратно, словно в неё нельзя ложиться. Некоторое время я стою перед зеркалом, вижу себя в парадной одежде и то выражение в глазах, которого нет ни в одном донесении.\n\nСлуги за дверью спрашивают, помочь ли снять корону. Я велю им пока не входить."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Спутники уже легли на постоялом дворе, а я остаюсь в комнате в одиночестве. Поклажа собрана, завтрашний маршрут записан на дощечке за дверью. Моему смятению нет места: оно не занимает дорожную суму, зато заполняет всю комнату.\n\nЯ сижу на краю кровати, ещё в сапогах. Внизу кто-то пьяно запевает, пока товарищ не обрывает песню. До меня доносится смех, словно из другой ночи, в которую мне не попасть.\n\nЯ сворачиваю карту и снова раскрываю. Дороги остаются прежними."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Я остаюсь в маленькой комнате в одиночестве, всё ещё в облачении. Свеча у постели уже потускнела. Обет никуда не делся: каждое слово осталось там, где звучало днём. Утешение не пришло.\n\nЯ снимаю чётки с запястья. Бусины одна за другой скользят между пальцами, но постепенно за ними уже не следуют молитвы. Вспоминается человек в галерее и то, как при нашей встрече именно мой взгляд первым скользнул в сторону. От этого человек не исчез.\n\nВорот облачения трёт шею. Я не снимаю его."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Я возвращаюсь в пустую спальню в парадной одежде. Стражники кланяются за дверью; один раз звякают пластины доспехов, затем щёлкает засов. Внутри некому разделить со мной эту заботу.\n\nКорона ещё на голове. Я снимаю её и кладу у подушки, словно рядом могла бы лежать другая голова. Человек в зеркале выглядит так, будто завтра вполне сможет явиться ко двору. Только мне известно, какой предстоит эта ночь.\n\nЯ сажусь у постели. Одна перчатка ещё остаётся на руке."
 latria_sexual_frustration_flavor.1305.desc: "В комнате никого больше нет, но мне всё не хочется ложиться.\n\nЛампа ещё горит, обувь на ногах, верхняя одежда в порядке. Я принимаю это за доказательство, что ещё можно выйти к людям. На самом деле никто меня не ждёт. Мне просто не хочется оставаться перед этой приготовленной постелью.\n\nВетер проникает в оконную щель, и пламя слегка наклоняется."
 latria_sexual_frustration_flavor.1305.a: "Позвать доверенного знакомого, несмотря на поздний час, и поговорить подольше."
 latria_sexual_frustration_flavor.1305.b: "Подавить тоску, снять одеяние и отправиться спать."

 latria_sexual_frustration_flavor.1306.t: "Гонец в полночь"
 latria_sexual_frustration_flavor.1306.desc.female: "Я сижу у постели в ночной рубашке и слышу два лёгких стука в дверь. Это не условленный знак, а обычный стук служанки, которая что-то принесла. Она входит, кладёт чистый лист и удаляется, не глядя на постель.\n\nЧистая бумага шумнее исписанного письма. Я знаю, от кого жду вестей, и знаю, что этой ночью их не будет. Подношу лист к лампе. Свет проявляет тонкие волокна, похожие на ещё не написанную строку.\n\nМои пальцы долго лежат на бумаге, оставляя небольшое влажное пятно."
 latria_sexual_frustration_flavor.1306.desc.male: "Я открываю дверь в ночной рубашке. В коридоре уже никого нет. У порога лежит записка без подписи: наверное, кто-то оставил её мимоходом, а может, она выпала ещё днём. Поднимаю её, всё ещё не в силах уснуть.\n\nВ записке нет нужных мне слов. В ней говорится о завтрашнем часе и сумме, которую следует выплатить. И всё же я читаю каждую строку, а затем переворачиваю лист. Оборот пуст. Словно именно эта пустая сторона ждёт, что я что-нибудь напишу.\n\nСвет в коридоре гаснет. Я всё ещё стою у неплотно прикрытой двери."
 latria_sexual_frustration_flavor.1306.desc: "Шаги за дверью удаляются. Бумага на столе по-прежнему ждёт пера.\n\nЯ берусь за него трижды. В первый раз пишу одно слово и зачёркиваю. Во второй оставляю на бумаге лишь каплю чернил. В третий откладываю перо и смотрю, как эта капля медленно сохнет.\n\nПоловина ночи уже прошла. Лист всё ещё почти пуст."
 latria_sexual_frustration_flavor.1306.a: "Записать слова, которые так долго откладываются."
 latria_sexual_frustration_flavor.1306.b: "Убрать лист, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1307.t: "Молчание за столом"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Поэт читает о давней любви, и все слушают с удовольствием. Кто-то отбивает ладонью ритм по столу, кто-то заранее подхватывает конец строки. Кубки поворачиваются в руках. Никто не считает нужным избегать этой темы при ком-либо из гостей.\n\nЯ поднимаю кубок вместе с остальными, но вспоминаю прошлое, о котором здесь никто не говорит. Оно не так красиво, как стихи, и не собирает столько слушателей. В нём лишь закрытая дверь и моё одинокое бдение до рассвета после неё. Когда поэт доходит до строки об объятиях, из моего кубка проливается капля вина.\n\nНикто её не замечает. Только я."
 latria_sexual_frustration_flavor.1307.desc.strict: "За столом заходит речь о знатном человеке, впавшем в немилость из-за тайной связи. Смех стихает так дружно, словно кто-то прижал дрожащую струну. Я отворачиваюсь к окну, чтобы никто не прочёл выражения моего лица.\n\nЗа окном не на что смотреть, кроме огня ночного дозора. И всё же я не отвожу глаз. За спиной кто-то тихо произносит: «Сам виноват». Возможно, это сказано не обо мне, но слова ложатся мне на спину, словно относятся к тому, на чём меня ещё не поймали.\n\nЯ крепче сжимаю кубок. Костяшки пальцев белеют."
 latria_sexual_frustration_flavor.1307.desc: "Кубки всё ещё ходят по кругу, а разговор застывает на теме, на которой ему меньше всего следовало задерживаться.\n\nМгновение назад речь шла об урожае. В следующее кто-то упоминает чужую постель. После этого никто не возвращает разговор в прежнее русло. Я сижу в образовавшейся тишине и слышу, как биение моего сердца заглушает музыку.\n\nКто-то кашляет, пытаясь заполнить паузу. Не получается."
 latria_sexual_frustration_flavor.1307.a: "Развязать язык вином и рассказывать личные истории одну за другой."
 latria_sexual_frustration_flavor.1307.b: "Промолчать, поклониться собравшимся и уйти."

 latria_sexual_frustration_flavor.1308.t: "Молитва во время бдения"
 latria_sexual_frustration_flavor.1308.desc.favors: "Колокол ночного бдения уже прозвучал, а я всё ещё молюсь в святилище. Вероучение не отвергает плотских удовольствий; я могу показать нужное место в тексте. Но это не объяснит мне, что делать с телом, которое сейчас стоит здесь на коленях.\n\nСкамьи пусты. Свеча отбрасывает мою тень на спинку; та колышется с каждым вдохом, словно ещё один человек, не желающий бодрствовать. Я вспоминаю приглашение, которое днём едва не сорвалось с губ, и то, как вместо него прозвучали другие слова. Тело вслед за словами не изменилось.\n\nЗвон удаляется. Я всё ещё на коленях, лоб покрыт испариной."
 latria_sexual_frustration_flavor.1308.desc.condemns: "В святилище я раз за разом читаю молитву о целомудрии. В первый раз она звучит целиком, во второй начинают выпадать слова, в третий я просто останавливаюсь на одной и той же фразе и больше не могу продолжить.\n\nКолокольный звон затихает, а мысль не отступает. Она не уходит вместе с ним. Я прижимаю ладони к каменным плитам в поисках прохлады, но вскоре согреваю и их. Когда камень теплеет, я ещё яснее понимаю, с чем борюсь.\n\nНа пустых скамьях никого нет. Я всё равно говорю очень тихо."
 latria_sexual_frustration_flavor.1308.desc: "Свет свечей падает на пустые скамьи. Я по-прежнему не встаю.\n\nНа этом бдение должно было закончиться. Но мне кажется, стоит подняться, и жар, сдерживаемый коленопреклонённой позой, снова поднимется по ногам. Поэтому я продолжаю стоять на коленях, оттягивая этот миг.\n\nПоследняя свеча трещит. Чёрный дым поднимается и рассеивается под балками."
 latria_sexual_frustration_flavor.1308.a: "Отложить молитву о воздержании и уйти по зову сердца."
 latria_sexual_frustration_flavor.1308.b: "Сдержать желание и закончить бдение."

 latria_sexual_frustration_flavor.1309.t: "Взгляд в зеркало"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Я некоторое время стою без одежды перед бронзовым зеркалом в спальне. Отражение не отводит глаз, и я не пытаюсь прикрыться. Свет падает сбоку, отчётливо очерчивая тени на ключицах и талии.\n\nМне надоело называть это желание минутной слабостью. Оно не минутное. Оно со мной с самого вечера, за ужином, после ухода остальных, и теперь здесь только я и зеркало. Я подношу руку к плечу; отражённая рука делает то же самое. Прикосновение лёгкое, но его достаточно, чтобы дыхание изменилось.\n\nЗа дверью не слышно шагов. Мне незачем притворяться."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Я сижу без одежды на краю постели и про себя повторяю клятву. Каждое слово помнится так ясно, что стоит пропустить одно, как я тут же это слышу. Но желание не исчезает. Оно здесь, в этом теле, не скрытом одеждой. Нельзя сказать, что оно где-то ещё.\n\nЯ смотрю в зеркало и отвожу взгляд. Это не помогает: бронзовая гладь всё равно хранит моё отражение. Я сцепляю руки так крепко, что белеют костяшки, словно этим можно удержать клятву.\n\nСлова снова обрываются. На этот раз я не сразу продолжаю."
 latria_sexual_frustration_flavor.1309.desc: "В комнате никого больше нет, но молчание отражения не даёт мне уклониться от встречи с собой.\n\nОдежда на стуле. Я перед зеркалом. Между нами всего несколько шагов, но проходит много времени, прежде чем я признаю, почему не прикрываюсь. Пламя спокойно. Мой взгляд — нет.\n\nЯ сажусь на край постели. Циновка прохладная, но ненадолго."
 latria_sexual_frustration_flavor.1309.a: "Признать свои чувства и предаться им в мыслях."
 latria_sexual_frustration_flavor.1309.b: "Одеться, вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1310.t: "Без сна в своих покоях"
 latria_sexual_frustration_flavor.1310.desc.clergy: "После ночных молитв я возвращаюсь в свою комнатку. На мне всё ещё облачение, свеча у постели уже тускнеет, а ложиться не хочется. Стоит лечь, и рука будет знать, куда потянуться. А я пока не решаюсь позволить ей это знание.\n\nУ подушки лежат чётки, словно свидетель. Я наполовину развязываю пояс облачения, затем завязываю снова. Ворот всё ещё трётся о кожу, поддерживая бодрствование, которое не желает уступать сну.\n\nВ комнатке только я. От этого ничто не становится проще."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Спутники уже отдыхают на постоялом дворе, а я в одиночестве укладываю вещи в своей комнате. Завтрашний путь ясен: переправа, сухопутная дорога, ещё одна переправа. Но куда стремится сердце, непонятно; этого места нет ни на одной карте.\n\nЯ снимаю сапоги, но не ложусь. За окном лошадь медленно жуёт сено. Этот звук должен убаюкивать. Я слушаю его и вспоминаю, как днём кто-то взглянул на меня у переправы. Взгляд был так краток, что его почти можно не считать. Я считаю.\n\nПламя масляной лампы вздрагивает. Я не подливаю масла."
 latria_sexual_frustration_flavor.1310.desc: "Ночь уже глубока, дверь закрыта, но сон всё не приходит.\n\nПостель хороша, подушка тоже. Я сижу у края и вновь думаю о человеке, к которому днём так и не удалось приблизиться. Лишь когда ладони начинают гореть, я замечаю развязанные тесёмки ночной рубашки. Не помню даже, когда это произошло.\n\nЯ смотрю на тесёмку. Она свисает у ноги, словно решение, которого ещё нет."
 latria_sexual_frustration_flavor.1310.a: "Написать старому знакомому и прямо рассказать о своих тревогах."
 latria_sexual_frustration_flavor.1310.b: "Подавить мысль, погасить свечу и лечь."

 latria_sexual_frustration_flavor.1301.c: "Взять чистый лист и обратить приглашение в стихи."
 latria_sexual_frustration_flavor.1302.c: "Вернуть разговор к семьям и владениям."
 latria_sexual_frustration_flavor.1302.d: "Рассказать дорожную историю, чтобы все снова подняли кубки."
 latria_sexual_frustration_flavor.1303.c: "Остаться до рассвета и изучать писание строка за строкой."
 latria_sexual_frustration_flavor.1304.c: "Расставить фигуры и обдумать шахматную задачу."
 latria_sexual_frustration_flavor.1304.d: "Начать с первого хода и неспешно сыграть целую партию."
 latria_sexual_frustration_flavor.1305.c: "Распланировать утренние дела, прежде чем погасить свечу."
 latria_sexual_frustration_flavor.1307.c: "Прочитать новое стихотворение и отвлечь их внимание."
 latria_sexual_frustration_flavor.1308.c: "Закрыть молитвенник и обдумать всё в тишине."
 latria_sexual_frustration_flavor.1308.d: "Бодрствовать до утренней молитвы и приготовить книги для всех."
 latria_sexual_frustration_flavor.1309.c: "Записать свои тревоги и разобрать их строка за строкой."
 latria_sexual_frustration_flavor.1310.c: "Заварить чай и не спеша убрать вещи и книги."
