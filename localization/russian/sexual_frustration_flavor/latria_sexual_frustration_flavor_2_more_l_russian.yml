 latria_sexual_frustration_flavor.1111.t: "Вторая стража"
 latria_sexual_frustration_flavor.1111.desc: "Просыпаюсь во вторую стражу, простыня намотана на одну голень. Лампа догорела до пламени с большой палец. Рука уже низко на животе, тёплая от моего же тела, и я её убираю.\n\nБыл один миг в сумерках. Через меня потянулись за солью, предплечье задело тыльную сторону запястья, и никто из нас не двигался, пока длился вдох. Этот вдох я перебираю чаще, чем весь разговор.\n\nПрижимаю ладонь плашмя к тюфяку у бедра. Лён там всё ещё прохладный. Оставляю прохладным."
 latria_sexual_frustration_flavor.1111.a: "Пусть рука идёт, куда хочет."
 latria_sexual_frustration_flavor.1111.b: "Перевернуться и ждать сна."
 latria_sexual_frustration_flavor.1111.c: "Лежать тихо и слушать, как укладывается дом."

 latria_sexual_frustration_flavor.1112.t: "Чаша между нами"
 latria_sexual_frustration_flavor.1112.desc: "Чаша идёт по скамье из рук в руки, и, когда доходит до меня, край ещё мокр от чужих губ. Пью там, где мокро. Через стол кто-то смотрит, как я это делаю, и не отводит глаз, и не улыбается.\n\nКакое-то время речь о лошадях: цена гнедой кобылы, кузнец на перекрёстке. Под столом колено упирается в моё, без нажима, только касание, а я продолжаю говорить о лошадях.\n\nСлуга подливает. Колено убирают, чтобы поздороваться с дядей. Держу чашу двумя руками, вино согрелось, и место рядом со мной пустует до конца еды."
 latria_sexual_frustration_flavor.1112.a: "Сказать прямо то, что говорило колено."
 latria_sexual_frustration_flavor.1112.b: "Поблагодарить общество и уйти рано."
 latria_sexual_frustration_flavor.1112.c: "Остаться и говорить о лошадях, пока зал не опустеет."

 latria_sexual_frustration_flavor.1113.t: "Слишком долгий танец"
 latria_sexual_frustration_flavor.1113.desc: "Музыка поворачивает, и меня передают от партнёра к партнёру. Третий держит мою руку на такт дольше фигуры, большой палец прижат к внутренней стороне запястья, где пульс, и улыбается, будто это случайность. Следующий шаг я пропускаю и прикрываю поворотом.\n\nНа дальнем конце зала кто-то смеётся. Не оборачиваюсь посмотреть. Лицо горячее, и при свечах это видно, а свечи — единственный честный свет в комнате.\n\nТанец кончается. Стою у столба, рука всё ещё полузакрыта, и форма того большого пальца отпечатана на коже, а музыканты начинают снова."
 latria_sexual_frustration_flavor.1113.a: "Выпить за того партнёра, громко, на весь зал."
 latria_sexual_frustration_flavor.1113.b: "Поклониться обществу и уйти с паркета."
 latria_sexual_frustration_flavor.1113.c: "Найти самый тихий угол и дышать медленно."

 latria_sexual_frustration_flavor.1114.t: "Долгая дорога назад"
 latria_sexual_frustration_flavor.1114.desc: "Дождь по листьям, а олень ушёл час назад. Еду сзади, голоса загонщиков впереди редеют. Бёдра ноют от седла так, что до вечера тело не забудется, а мокрая шерсть плаща холодна у ворота.\n\nУ ручья всадник придерживает мой повод, и рука остаётся на ремне и после того, как конь успокоился. С конца косы стекает вода. О дожде не говорит никто.\n\nЕдем дальше. Мокрая кожа скрипит на каждом шагу, и я считаю скрипы вместо мыслей, и счёт теряется где-то за третьим полем."
 latria_sexual_frustration_flavor.1114.a: "Пусть охота идёт, пока не уйдёт свет."
 latria_sexual_frustration_flavor.1114.b: "Держать глаза на тропе, а руки на поводьях."
 latria_sexual_frustration_flavor.1114.c: "Читать землю, сломанные стебли, след копыта."
 latria_sexual_frustration_flavor.1114.d: "Пустить сокола снова, и снова."

 latria_sexual_frustration_flavor.1115.t: "На коленях в третьем часу"
 latria_sexual_frustration_flavor.1115.desc: "Стою на коленях, пока они не заноют о камень, и эта боль — единственное, что удаётся удержать вниманием. Масло в лампе прогоркло. Тело этим утром не желает молчать. Оно хочет — и хочет в сторону того, кто чинит стропила и посвистывает за работой.\n\nЧитаю службу. Начинаю её заново, потому что ум соскользнул на четвёртой строке. Кто-то кашляет за спиной, и я не оборачиваюсь.\n\nКамень холоден сквозь рясу. Остаюсь внизу, когда остальные встают, холод доходит до голеней — и этого мало."
 latria_sexual_frustration_flavor.1115.a: "Назвать это на исповеди и после понести епитимью."
 latria_sexual_frustration_flavor.1115.b: "Держать бдение до колокола."
 latria_sexual_frustration_flavor.1115.c: "Взять толкование и прочесть до конца главы."

 latria_sexual_frustration_flavor.1116.t: "О чём капеллан не спросил"
 latria_sexual_frustration_flavor.1116.desc: "Капеллан идёт со мной по галерее и ни о чём не спрашивает — это хуже, чем спрашивать. Я говорю о грехе уныния, а в ответ — об урожае, о запоздалом дожде, о цене ржи.\n\nОбшлаг обтрёпан. Смотрю, как при жесте шевелятся свободные нити, думаю о запястье внутри рукава, потом снова об унынии — и урожай теряется совсем. Этот человек останавливается, чтобы я догнал.\n\nУ дверей — благословение. Держу руку на миг дольше, чем нужно для благословения. Мне позволяют, а потом — вниз по ступеням, через две."
 latria_sexual_frustration_flavor.1116.a: "Рассказать всё до конца."
 latria_sexual_frustration_flavor.1116.b: "Попросить епитимью и понести её."
 latria_sexual_frustration_flavor.1116.c: "Выслушать про урожай."

 latria_sexual_frustration_flavor.1117.t: "Прошение после совета"
 latria_sexual_frustration_flavor.1117.desc: "Совет пустеет. Канцлер остаётся протолкнуть ещё одно прошение, и я слышу очертания губ вокруг слов, а не слова. Печать тёплая от моей руки, воск не застыл.\n\nС пира наедине ни с кем не доводилось быть. Корона — тяжесть на затылке, а затылку нужна другая тяжесть: рука вместо золота.\n\nПрошение удовлетворено. Поклон. Держу глаза на карте, пока дверь не закроется, а потом на двери, и свеча у карты догорает, пока я сижу."
 latria_sexual_frustration_flavor.1117.a: "Послать за кем-нибудь, когда свечи погаснут."
 latria_sexual_frustration_flavor.1117.b: "Держаться дела, пока прошение не запечатано."
 latria_sexual_frustration_flavor.1117.c: "Прочесть следующие три прошения самому."

 latria_sexual_frustration_flavor.1118.t: "Сливовое вино на террасе"
 latria_sexual_frustration_flavor.1118.desc: "Сливовое вино, третья чаша, и рукава всё касаются друг друга. У моего народа говорят строками стихов, и каждая строка — шаг ближе, а у перил стоит слуга и притворяется, что не слушает.\n\nРукав у меня на запястье раскрывается. Другой рукав не отступает. Где-то внизу под террасой флейта начинает, обрывается и начинает снова — всё те же три фразы.\n\nСтавлю чашу на балюстраду, недопитую, и вино держит последний свет. Простую вещь не сказал никто. Лепесток переворачивается на плите. Слуга у перил по-прежнему не слушает."
 latria_sexual_frustration_flavor.1118.a: "Ответить строкой, которую нельзя не понять."
 latria_sexual_frustration_flavor.1118.b: "Поправить рукав и говорить о погоде."
 latria_sexual_frustration_flavor.1118.c: "Ходить по террасе одному, пока не зажгут лампы."

 latria_sexual_frustration_flavor.1119.t: "Лампа, оставленная гореть"
 latria_sexual_frustration_flavor.1119.desc: "Лампа оставлена гореть, простыня спущена к поясу. Рука идёт по тёплой коже живота, ниже, и на этот раз я её не останавливаю. Я уже влажная — от мысли о губах у горла в сумерках, — и пальцы скользят легко.\n\nДумаю о тяжести тела надо мной, о точном весе его, и бёдра поднимаются навстречу пустоте. Нажимаю и веду кругом, дыхание рвётся в тихой комнате. Основание ладони трётся там, где нужно.\n\nВсё приходит долгой дрожью, от которой бедро ещё вздрагивает. После лежу, рука поперёк глаз, лампа всё горит, простыня подо мной сырая."
 latria_sexual_frustration_flavor.1119.a: "Дать этому закончиться и лежать в сырой темноте."
 latria_sexual_frustration_flavor.1119.b: "Убрать руку и считать балки."
 latria_sexual_frustration_flavor.1119.c: "Подрезать фитиль и лежать в темноте."

 latria_sexual_frustration_flavor.1120.t: "Комната гостя"
 latria_sexual_frustration_flavor.1120.desc: "Стук после того, как зала погасла; открываю дверь в ночной рубашке, ни для кого не одевшись. Вижу взгляд, который проходит по телу, и не тянусь за накидкой.\n\nМы не притворяемся. Губы находят моё горло, руки — на поясе, и, когда меня поднимают на стол, чаша опрокидывается и катится. Темп медленный, а терпения во мне нет. Слышу собственный голос, что меня удивляет, и смех у шеи, а темп не меняется.\n\nПосле вино капает с края стола на пол, по капле. Никто из нас не двигается вытереть."
 latria_sexual_frustration_flavor.1120.a: "Оставить дверь незапертой и рубашку на себе."
 latria_sexual_frustration_flavor.1120.b: "Поблагодарить ласково и закрыть дверь."
 latria_sexual_frustration_flavor.1120.c: "Сесть на край стола и говорить до рассвета."

 latria_sexual_frustration_flavor.1121.t: "За расписной ширмой"
 latria_sexual_frustration_flavor.1121.desc: "Пир перешёл границы приличий. В углу залы раздвинута ширма, и шум за ней — не шум еды. Рука смыкается на моём запястье, и я позволяю себя увести, а расписные цапли проходят так близко, что до них можно коснуться.\n\nРук больше, чем у одного человека. Считать перестаю. Камыш на полу истоптан, чаша катится к моему колену, и поднять её некому.\n\nПотом сижу у стены, волосы распущены, губы припухли, на плечах чужой плащ. Музыка не прекращалась."
 latria_sexual_frustration_flavor.1121.a: "Уйти за ширму — и пусть зала слышит."
 latria_sexual_frustration_flavor.1121.b: "Отказаться и сохранить чашу и место."
 latria_sexual_frustration_flavor.1121.c: "Расставить доску и играть, пока руки не станут твёрдыми."

 latria_sexual_frustration_flavor.1122.t: "Четыре слова стиха"
 latria_sexual_frustration_flavor.1122.desc: "Дощечка для письма на коленях, тростниковое перо высохло. Написано четыре слова стиха об изгибе плеча, и ни одно из четырёх не то. Пятое ещё хуже.\n\nВ комнате холодно. Собственное дыхание в ней громкое. Отодвигаю дощечку и прижимаю тыльную сторону руки к губам, и желание никуда не идёт — только меняет форму и оседает ниже.\n\nСнова беру перо. Строка остаётся недописанной, чернила сохнут в расщепе тростника, и плечо в строке всё ещё только плечо."
 latria_sexual_frustration_flavor.1122.a: "Написать плечо — и остальное."
 latria_sexual_frustration_flavor.1122.b: "Закрыть дощечку и сидеть с неподвижными руками."
 latria_sexual_frustration_flavor.1122.c: "Читать что-нибудь скучное, пока комната не станет только комнатой."
 latria_sexual_frustration_flavor.1122.d: "Прочесть недописанную строку за ужином."

 latria_sexual_frustration_flavor.1123.t: "Вес сокола"
 latria_sexual_frustration_flavor.1123.desc: "Сокол в колпачке сидит на рукавице, и его вес — единственная честная вещь этим утром. Ждём в мокрой траве цаплю. Плечо горит, кожа промокла на большом пальце.\n\nКогда мы присели, рука прижимается к моей и остаётся. Птица переступает. Глаза — на камышах. Пульс у меня в ушах, громче болота, и я уверен, что его слышно.\n\nЦапля так и не приходит. Идём назад, сокол едет на моём кулаке, трава промочила сапоги до щиколоток, и о руке не говорит никто."
 latria_sexual_frustration_flavor.1123.a: "Снова выехать и охотиться до темноты."
 latria_sexual_frustration_flavor.1123.b: "Не двигаться и дать болоту затихнуть."
 latria_sexual_frustration_flavor.1123.c: "Спустить сокола и смотреть только на сокола."

 latria_sexual_frustration_flavor.1124.t: "Ящик для милостыни"
 latria_sexual_frustration_flavor.1124.desc: "Считаю монеты в ящик для милостыни, и счёт — способ не думать. Медь, больше всё, и два серебряных пенса от торговца шерстью. Рука жертвователя в ящике рядом с моей, пальцы среди монет, а священник смотрит на нас обоих с третьей ступени.\n\nНа исповеди этого не было. Не знаю, как это назвать. Лицо спокойное. Спокойному лицу я учился перед зеркалом.\n\nРука убирается. Закрываю крышку, маленький латунный замок щёлкает, и ключ в моей руке не твёрд, а священник всё ещё на ступени."
 latria_sexual_frustration_flavor.1124.a: "Заплатить за свечу и дать священнику увидеть моё лицо."
 latria_sexual_frustration_flavor.1124.b: "Держать бдение, пока свечи не оплывут."
 latria_sexual_frustration_flavor.1124.c: "Прочесть псалтырь ещё раз до конца."

 latria_sexual_frustration_flavor.1125.t: "Условия, принятые в полночь"
 latria_sexual_frustration_flavor.1125.desc: "Договор у нас с полудня. Свечи — огарки, огонь отпустили погаснуть. Другой представитель читает последний пункт вслух, и я соглашаюсь, не слыша, — из-за того, как движется челюсть вокруг языка, который не мой.\n\nЭто не первая ночь. Я знаю точное расстояние, на котором от меня нет никакой пользы, и со второй свечи мы внутри него.\n\nЯ подписываю. Подписывают и с другой стороны. Воск ещё мягок, когда в него уходит мой перстень, рука тверда, писец уносит лист — и это вся моя победа."
 latria_sexual_frustration_flavor.1125.a: "Послать записку, когда палата опустеет."
 latria_sexual_frustration_flavor.1125.b: "Держаться пункта, слово за словом."
 latria_sexual_frustration_flavor.1125.c: "Забрать договор и прочесть каждую строку."

 latria_sexual_frustration_flavor.1126.t: "Трава, ветер и распахнутый ворот"
 latria_sexual_frustration_flavor.1126.desc: "Кони отпущены пастись, мы сидим на войлоке, сёдла не сняты. У народа моего спутника говорят, что всадник должен уметь спать в седле. Я и на земле не могу сидеть спокойно.\n\nРечь о реке, которой я никогда не видел, — о реке с тремя бродами. Рубаха расстгнута у горла. Ветер ведёт траву длинными взмахами, а я смотрю на горло вместо реки.\n\nКонь фыркает. Отвожу глаза первым, уши на ветру горячие, и разговор о реке идёт дальше без меня."
 latria_sexual_frustration_flavor.1126.a: "Сказать вслух, на этом языке, скверно."
 latria_sexual_frustration_flavor.1126.b: "Придержать язык и смотреть на коней."
 latria_sexual_frustration_flavor.1126.c: "Гнать, пока ветер не выдует это из меня."

 latria_sexual_frustration_flavor.1127.t: "Вмятина на подушке"
 latria_sexual_frustration_flavor.1127.desc.female: "Постель слишком тёплая, покрывало сброшено на пол. Рубашка задрана до бедра. Кладу туда руку, и тело отвечает прежде, чем я что-либо решила, — быстрым жаром внизу, настойчивее меня.\n\nДумаю о том, как моё имя произноют в коридоре, задержав второй слог, и дверь за этим человеком остаётся не вполне закрытой. Пальцы движутся, и дыхание срывается на том задержанном слоге.\n\nОстанавливаюсь до конца. Лежу с неподвижной рукой, сердце идёт, а на подушке рядом нет вмятины."
 latria_sexual_frustration_flavor.1127.desc.male: "Покрывало на полу, рубашка задрана до бедра. Рука идёт вниз, и я уже твёрдый — ни от чего, от коридора, от имени и от двери, оставленной приоткрытой.\n\nДумаю о губах, и бёдра сдвигаются сами. Дыхание короткое. Мог бы закончить в один миг и не заканчиваю, и это «не» — своя работа.\n\nУбираю руку и лежу плашмя. В комнате очень тихо, боль не уходит, подушка рядом прохладная, и я её не касаюсь."
 latria_sexual_frustration_flavor.1127.desc: "Постель слишком тёплая, лампа погашена. Покрывало сброшено, рука уходит сама, и тело отвечает сразу, настойчивее меня, прежде чем я решаю это позволить.\n\nДумаю о коридоре, об имени, произнесённом дважды, о рукаве, отодвинутом у запястья. В тот час коридор тёмный. Дыхание укорачивается, и мысль я отпускаю до конца — и не дальше.\n\nУбираю руку и лежу тихо. На подушке рядом нет вмятины, а покрывало остаётся на полу до утра."
 latria_sexual_frustration_flavor.1127.a: "Оставить руку там, где она есть."
 latria_sexual_frustration_flavor.1127.b: "Сложить руки и спать на боку."
 latria_sexual_frustration_flavor.1127.c: "Встать и сидеть у ставни, пока не станет светло."

 latria_sexual_frustration_flavor.1128.t: "Тост"
 latria_sexual_frustration_flavor.1128.desc: "Встаю сказать тост, и зала — размытое пятно лиц. Одно лицо не размыто. Говорю о верности, пока длится чаша, а глаза всё возвращаются к одному месту над третьим столом.\n\nКто-то кашляет за главным столом. Сплетня будет в кухнях прежде, чем уберут блюда, и, оказывается, мне это безразлично сильнее, чем должно, — а это само по себе в ответе.\n\nСажусь. Рука берёт чашу за ножку и держит слишком крепко, а через залу лицо всё ещё повёрнуто ко мне."
 latria_sexual_frustration_flavor.1128.a: "Назвать вслух, на кого смотрю, и выпить в честь этого человека."
 latria_sexual_frustration_flavor.1128.b: "Говорить только о верности — и не лгать."
 latria_sexual_frustration_flavor.1128.c: "Отнести чашу на дальний конец и сесть со старым другом."

 latria_sexual_frustration_flavor.1129.t: "Толкование на третью главу"
 latria_sexual_frustration_flavor.1129.desc: "Капеллан читает толкование вслух, а я веду строку пальцем по странице. Читает голос. Палец перестал двигаться тремя строками ниже того места, где голос, — на той же странице, что и час назад.\n\nСтраница поворачивается, и палец мешает. Читающий ждёт. Я его не убираю. Свеча между нами наклоняется и выпрямляется, и где-то в доме закрывают дверь.\n\nЧтение идёт дальше. Довод в третьей главе потерян совсем, в комнате пахнет воском и чернилами, а палец всё там же."
 latria_sexual_frustration_flavor.1129.a: "Признаться в блуждании ума и понести епитимью."
 latria_sexual_frustration_flavor.1129.b: "Попросить более строгий устав и держаться его."
 latria_sexual_frustration_flavor.1129.c: "Вести строку снова, с начала страницы."

 latria_sexual_frustration_flavor.1130.t: "Что я рассказал другу"
 latria_sexual_frustration_flavor.1130.desc: "Рассказываю другу всё: коридор, запястье, чашу, — а друг слушает, подперев подбородок рукой, и ни разу не смотрит на дверь. Вино между нами не тронуто. Сказать вслух — облегчение, и ничего не меняет.\n\nПотом рука смыкается на моём плече, по-дружески, и остаётся. Смотрю на карту. Поход подождёт сезон; река не сдвинулась.\n\nДруг уходит. Сижу перед походными фишками, деревянными, пахнущими ларцом, двигаю одну — и возвращаю туда, где она была."
 latria_sexual_frustration_flavor.1130.a: "Рассказать остальное и ничего не просить."
 latria_sexual_frustration_flavor.1130.b: "Не говорить больше и поправить фишки."
 latria_sexual_frustration_flavor.1130.c: "Взвесить поход — и не ошибиться."

 latria_sexual_frustration_flavor.1131.t: "Тепло, которое остаётся"
 latria_sexual_frustration_flavor.1131.desc: "Сон оставляет меня в тепле, и просыпаюсь я с рубашкой, задранной до пояса. Причина — моя рука. Лежу тихо и даю комнате вернуться: холодный пол, гаснущая лампа, — а жар не уходит вместе со сном.\n\nЭто было дитё управителя — или кто-то с теми же губами. Запястье прижато к постели, и спешки нет никакой; помню точную тяжесть, помню, как тюфяк принял нас обоих. Наяву такого взгляда на себе я не видел ни разу.\n\nОпускаю рубашку на бёдра. Ткань сырая там, где на ней лежали. Поворачиваю лицо к стене, а тепло остаётся под одеялом, терпеливое, ждёт, когда я ему уступлю."
 latria_sexual_frustration_flavor.1131.a: "Пусть рука вернётся, куда хочет."
 latria_sexual_frustration_flavor.1131.b: "Расправить рубашку и ждать рассвета."
 latria_sexual_frustration_flavor.1131.c: "Думать о шутках за ужином и дать дыханию замедлиться."

 latria_sexual_frustration_flavor.1132.t: "Третья свеча"
 latria_sexual_frustration_flavor.1132.desc: "Стою на коленях, пока не заноют, и боли не хватает, чтобы прочистить голову. Храм пуст за третьей свечой. В темноте за глазами всё возвращается одно и то же тело, и оно не божеское.\n\nРуки паломника, несколько недель назад, складывающие попону мне на плечи у дороги. Касание костяшек у горла. Сто раз я вымаливал у памяти этот образ, и каждую ночь он возвращается яснее — тепло чужой ладони там, где расходится ворот.\n\nПрижимаю лоб к сложенным рукам. Камень холоден. Дыхание — нет. Остаюсь на коленях, пока последняя свеча укорачивается, и прошу не прощения, только чтобы дрожь в бёдрах унялась прежде, чем я встану."
 latria_sexual_frustration_flavor.1132.a: "Назвать мысль и дать ей прогореть."
 latria_sexual_frustration_flavor.1132.b: "Встать и держать бдение, пока тело не израсходуется."
 latria_sexual_frustration_flavor.1132.c: "Держаться за тепло тех рук как за утешение."

 latria_sexual_frustration_flavor.1133.t: "Под выступом скалы"
 latria_sexual_frustration_flavor.1133.desc: "Снова дождь, охота рассыпалась. Прячусь под каменным выступом с псарем, оба промокли насквозь, и холод делает каждое место, где мы касаемся, маленьким огнём. Чужая рука — от плеча до запястья, и я перестал притворяться, что не замечаю.\n\nГоворят что-то о грозе. Отвечаю о грозе. Рука находит поясницу, чтобы удержать меня на мокром камне, и остаётся там, растёпленная сквозь мокрую шерсть, и дыхание идёт мелко так, что холодом этого не оправдать.\n\nДождь не редеет. Большой палец один раз ведёт вдоль хребта. Глаза — на серой завесе воды, и я не отступаю, а выступ слишком узок для чего-либо, кроме этого."
 latria_sexual_frustration_flavor.1133.a: "Остаться под дождём ещё немного."
 latria_sexual_frustration_flavor.1133.b: "Отодвинуться и смотреть, как падает вода."
 latria_sexual_frustration_flavor.1133.c: "Переждать грозу и вернуться одному."

 latria_sexual_frustration_flavor.1134.t: "Шнуровка, которую я не распустил"
 latria_sexual_frustration_flavor.1134.desc: "Совет кончился, кабинет мой. Наливаю вина, которого не хочу, и память приходит всё равно, без зова: губы посла на пиру по договору, капля, слизанная с большого пальца, пока писцы спорят о границах.\n\nСтавлю чашу. Рука идёт к шнуровке у горла и останавливается. В памяти пальцы быстры и уверены, и я не возражаю — я опираюсь на стол, чтобы не соскользнуть с него, а вся зала за этим человеком расплывается в дыму свечей.\n\nСвеча мигает. Завязываю шнуровку, которую не распускал. Вино стоит нетронутым, в комнате очень тихо, и пульс в ушах громкий, как стук в дверь, которую я не открыл."
 latria_sexual_frustration_flavor.1134.a: "Прямо признать, чьи губы я вспоминаю."
 latria_sexual_frustration_flavor.1134.b: "Погасить свечу и лечь одному."
 latria_sexual_frustration_flavor.1134.c: "Расставить шахматы и собраться."

 latria_sexual_frustration_flavor.1135.t: "Медленный такт"
 latria_sexual_frustration_flavor.1135.desc: "Музыканты берут медленную мелодию, и рука смыкается на моей прежде, чем я успеваю отказаться. Вместе поворачиваемся у возвышения, близко, ближе, чем просит фигура, и от того, кто держит меня, пахнет вином, дымом и чем-то более тёплым под этим.\n\nНа повороте бедро входит между моих и остаётся на полтакта дольше. Для залы лицо спокойное. Под музыку слышно собственное дыхание, и другой слышит его тоже — губы изгибаются и не раскрываются.\n\nТанец кончается. Расходимся не сразу. Большой палец ведёт по шву ладони, медленно, нарочно, — вопрос без слов. Музыканты начинают снова, ответа нет, и рука всё ещё в чужой."
 latria_sexual_frustration_flavor.1135.a: "Пойти за мелодией и станцевать следующий такт."
 latria_sexual_frustration_flavor.1135.b: "Убрать руку и шагнуть в толпу."
 latria_sexual_frustration_flavor.1135.c: "Остаться в тепле и дослушать мелодию."

 latria_sexual_frustration_flavor.1136.t: "Беседка в сумерках"
 latria_sexual_frustration_flavor.1136.desc: "Беседка пахнет удовым деревом и апельсиновой коркой, а слуги оставили шербет потеть в серебряной чаше. Между нами вполголоса течёт касыда, каждая строка — ступень, и на последнюю не поднимается никто из нас.\n\nСумерки окрашивают воду в фонтане в цвет чая. Тот, кого я хочу, поднимает чашу и не пьёт, только смотрит на меня поверх края, и эти глаза — весь исход поэмы.\n\nЯ беру чашу из руки этого человека, пью там, где были его губы, и ставлю её. Удист ждёт. Последней строки не сказал никто."
 latria_sexual_frustration_flavor.1136.a: "Позвать уда и пусть песня скажет это."
 latria_sexual_frustration_flavor.1136.b: "Поблагодарить общество и откланяться."
 latria_sexual_frustration_flavor.1136.c: "Остаться и пусть тишина будет доброй компанией."

 latria_sexual_frustration_flavor.1137.t: "За резной решёткой"
 latria_sexual_frustration_flavor.1137.desc: "Шёпот фонтана наполняет двор, и с моих губ сходит мувашшах о бровях возлюбленного — как они выгибаются, как они падают. Возлюбленный — так близко, что может поправить мой размер.\n\nЗа резной решёткой свет проходит мелкими звёздами. Плечо этого человека — у моего, тёплое через два слоя шёлка, и поэма совсем оставила свой предмет.\n\nЯ оставляю последнюю строку незаконченной. Решётка прячет нас от двора и не показывает никому, а вода всё падает."
 latria_sexual_frustration_flavor.1137.a: "Договорить стих шёпотом, предназначенным одному."
 latria_sexual_frustration_flavor.1137.b: "Выпрямиться и заговорить о починке фонтана."
 latria_sexual_frustration_flavor.1137.c: "Пройти аркаду в одиночестве, пока не зажгут лампы."

 latria_sexual_frustration_flavor.1138.t: "Праздник зелёных ветвей"
 latria_sexual_frustration_flavor.1138.desc: "Моя вера называет тело даром, и раз в год мы увешиваем храм зелёными ветвями и говорим это всерьёз. Праздник — сегодня. Я помню прошлогодний: рука в моей под ветвями, благовония, благословение, произнесённое над нами, как шатёр.\n\nТот, кого я хочу, стоит по ту сторону храма с зелёной ветвью в кулаке, а жрец уже зажигает первую лампу. Кровь моя не тиха, и вера не просит её тишины.\n\nЯ держусь за память о прошлогодних ветвях, пока руки не станут твёрдыми, и запах зелени повсюду."
 latria_sexual_frustration_flavor.1138.a: "Ступить вперёд и пусть благословение падёт на нас обоих."
 latria_sexual_frustration_flavor.1138.b: "Держать ночное бдение, пока ветви не завянут."
 latria_sexual_frustration_flavor.1138.c: "Прочесть обряд союза до конца."

 latria_sexual_frustration_flavor.1139.t: "День на ипподроме"
 latria_sexual_frustration_flavor.1139.desc: "Пыль висит над ипподромом, и партии ревут за свои цвета. Иконы несут мимо моей ложи на шестах, и фимиам прорезает сквозь запах лошадей и горячего песка.\n\nВозничий берёт поворот низко, поднимает взгляд на трибуны и находит меня. Взгляд держится на удар дольше скачки и обещает больше, чем скачка могла бы когда-либо. Моя рука сжимается на поручне.\n\nПыль оседает. Партии охрипли. Я всё ещё смотрю на дорожку, где скрылась колесница, а фимиам догорел до золы."
 latria_sexual_frustration_flavor.1139.a: "Сказать вслух, чей взгляд я держу."
 latria_sexual_frustration_flavor.1139.b: "Откинуться назад и пусть скачка будет только скачкой."
 latria_sexual_frustration_flavor.1139.c: "Пусть тёплого шума толпы будет довольно."

 latria_sexual_frustration_flavor.1140.t: "Поучение пустынного отца"
 latria_sexual_frustration_flavor.1140.desc: "Пустынный отец учит, что тело — враг, и я ношу власяницу под одеждой, чтобы доказать, что услышала его. Волос колет у ворота с каждым вдохом. Голос его сух, как вади, и вдвое терпеливее.\n\nОн называет молитву огнём, что остужает кровь. Моя не остывает. За сомкнутыми веками я вижу не врага, а того, кого хочу, и власяница пилит мне горло.\n\nЯ склоняю голову и снова беру молитву с начала, и слова не гасят то, что горит."
 latria_sexual_frustration_flavor.1140.a: "Подняться и пусть старый закон назовёт то, что я чувствую."
 latria_sexual_frustration_flavor.1140.b: "Стоять на коленях и дать власянице сделать своё."
 latria_sexual_frustration_flavor.1140.c: "Следовать поучению отца строка за строкой."
