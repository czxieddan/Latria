l_russian:
 latria_sexual_frustration_flavor.1101.t: "Без сна под пологом"
 latria_sexual_frustration_flavor.1101.desc.female: "Я просыпаюсь в постели; ночная рубашка упала к её изножью. В покоях больше никого нет, и тишина лишь обостряет неутолённую тоску."
 latria_sexual_frustration_flavor.1101.desc.male: "Я просыпаюсь в постели; ночная рубашка упала к её изножью. За окном всё безмолвно, но сон не может удержать мои мысли."
 latria_sexual_frustration_flavor.1101.desc: "Полог опущен. Ночь долгая, и мысли не желают успокаиваться."
 latria_sexual_frustration_flavor.1101.a: "Закрыть глаза и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1101.b: "Отбросить эту мысль, задёрнуть полог и снова лечь спать."

 latria_sexual_frustration_flavor.1102.t: "Взгляды между танцами"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Проходит несколько танцев, лица вокруг меня сменяются. Никого не смущает тесный поворот, но я помню тот короткий обмен взглядами."
 latria_sexual_frustration_flavor.1102.desc.strict: "Чем ближе танец, тем больше смех напоминает шёпот. Я смотрю на музыкантов, чтобы никто не угадал моих мыслей."
 latria_sexual_frustration_flavor.1102.desc: "Музыка ускоряется, но танец не уносит мои мысли."
 latria_sexual_frustration_flavor.1102.a: "Пригласить на ещё один танец и придвинуться ближе."
 latria_sexual_frustration_flavor.1102.b: "Поблагодарить за танец поклоном и отойти к краю зала."

 latria_sexual_frustration_flavor.1103.t: "У двери наставника"
 latria_sexual_frustration_flavor.1103.desc.favors: "Мой духовный наставник говорит, что отречение от желаний — не единственный путь к благочестию. Мне хочется расспросить ещё, но шаги за дверью уже стихли у порога."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Мой духовный наставник напоминает, что целомудрие важно и вдали от чужих глаз. Я опускаю голову в надежде, что вопросов больше не будет."
 latria_sexual_frustration_flavor.1103.desc: "В комнате сумрачно. Я обдумываю, как заговорить с духовным наставником."
 latria_sexual_frustration_flavor.1103.a: "Признать свою тоску и перестать её скрывать."
 latria_sexual_frustration_flavor.1103.b: "Спросить лишь о нынешних обязанностях, а остальное проглотить."

 latria_sexual_frustration_flavor.1104.t: "Орёл не возвращается"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Орёл кружит над полем и не возвращается на перчатку. Я завидую его свободе следовать желанию без всяких объяснений."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Орёл продолжает кружить. Слуги спрашивают, не хочу ли я выпустить ещё одну стрелу. Я прошу их подождать, словно терпение может всё уладить."
 latria_sexual_frustration_flavor.1104.desc: "Орёл не возвращается, и охотники ждут моего слова."
 latria_sexual_frustration_flavor.1104.a: "Пусть орёл кружит, пока мои мысли блуждают."
 latria_sexual_frustration_flavor.1104.b: "Собраться с мыслями и подозвать орла в лагерь."

 latria_sexual_frustration_flavor.1105.t: "Свечи и корона"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Слуга уносит корону из моих покоев, оставляя у свечей неоконченные указы. Я запахиваю ночную рубашку и достаю из бумаг неотправленное письмо."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Я надеваю ночную рубашку в комнате постоялого двора. Спутники уже разошлись, но неотправленное письмо рядом с поклажей не даёт мне уснуть."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Я складываю облачение и сажусь у постели в ночной рубашке. Под писанием лежит неотправленное письмо; я вновь достаю его."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Слуги убирают парадную одежду. Я сижу под лампой в ночной рубашке и разворачиваю неотправленное письмо, прежде чем заняться неоконченными бумагами."
 latria_sexual_frustration_flavor.1105.desc: "Свечи догорают. Неотправленное письмо всё ещё под рукой."
 latria_sexual_frustration_flavor.1105.a: "Отдать письмо гонцу."
 latria_sexual_frustration_flavor.1105.b: "Уничтожить его, отбросить мысль и погасить свечу перед сном."

 latria_sexual_frustration_flavor.1106.t: "Беспокойство при свечах"
 latria_sexual_frustration_flavor.1106.desc.female: "Я сижу у постели в ночной рубашке, пока свет свечи движется по окну. Час поздний, но неутолённая тоска меня не покидает."
 latria_sexual_frustration_flavor.1106.desc.male: "Я сижу у постели в ночной одежде. Ночная стража уже дважды пересекла двор, а мои мысли всё не успокаиваются."
 latria_sexual_frustration_flavor.1106.desc: "Свеча догорает, но под пологом сон не приходит."
 latria_sexual_frustration_flavor.1106.a: "Позволить мыслям задержаться на этой привязанности."
 latria_sexual_frustration_flavor.1106.b: "Больше не думать об этом; погасить свечу и лечь спать."


 latria_sexual_frustration_flavor.1107.t: "Танец в ответ"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Меня приглашают на ещё один танец, и все считают это обычной любезностью. Я же помню мысль, мелькнувшую, когда чужая рука задержалась в моей."
 latria_sexual_frustration_flavor.1107.desc.strict: "Меня приглашают на ещё один танец, и несколько лиц поворачивается к нам. Я ещё не успеваю ответить, а кто-то уже склоняется к соседу с шёпотом."
 latria_sexual_frustration_flavor.1107.desc: "Музыканты начинают новый танец, но я не встаю."
 latria_sexual_frustration_flavor.1107.a: "Принять приглашение и придвинуться ближе."
 latria_sexual_frustration_flavor.1107.b: "Отклонить приглашение с поклоном и пожелать приятного танца."

 latria_sexual_frustration_flavor.1108.t: "Молитва перед сном"
 latria_sexual_frustration_flavor.1108.desc.favors: "Я молюсь у постели в ночной рубашке. Моя вера допускает радости плоти, но внутренний порыв не ослабевает."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Я стою на коленях у постели в ночной рубашке и повторяю обет целомудрия. С каждой строкой всё труднее не замечать внутренний голос."
 latria_sexual_frustration_flavor.1108.desc: "Свеча у постели мерцает. Молитва продолжается."
 latria_sexual_frustration_flavor.1108.a: "Отложить обет целомудрия и признать свою тоску."
 latria_sexual_frustration_flavor.1108.b: "Унять мысли и продолжить молитву."

 latria_sexual_frustration_flavor.1109.t: "Неоконченный совет"
 latria_sexual_frustration_flavor.1109.desc: "Советники предложили несколько путей, но я всё не могу выбрать. Мысли уходят от дела, и даже моё молчание затягивается."
 latria_sexual_frustration_flavor.1109.a: "Завершить совет и остаться со своими мыслями."
 latria_sexual_frustration_flavor.1109.b: "Подавить мысль и попросить писца продолжить."
 latria_sexual_frustration_flavor.1110.t: "Комната после полуночи"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Я возвращаюсь в свою комнатку в ночной рубашке. Ночная молитва окончена, свеча догорает, но неотправленное письмо всё ещё раскрыто на столе."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "На постоялом дворе горит лишь несколько ламп. Я сижу у постели в ночной рубашке и всё думаю о письме, которое так и не отправилось."
 latria_sexual_frustration_flavor.1110.desc: "Звуки за дверью стихают. Я всё сижу у постели и жду."
 latria_sexual_frustration_flavor.1110.a: "Дописать письмо и отправить его на рассвете."
 latria_sexual_frustration_flavor.1110.b: "Запереть дверь, отбросить мысль и лечь спать."

 latria_sexual_frustration_flavor.1101.c: "Надеть одеяние, сесть спокойно и выровнять дыхание."
 latria_sexual_frustration_flavor.1102.c: "Поговорить с музыкантами об их мелодиях."
 latria_sexual_frustration_flavor.1103.c: "Спросить, как мне жить с этими чувствами."
 latria_sexual_frustration_flavor.1103.d: "Начать с неотправленного письма и ничего не скрывать."
 latria_sexual_frustration_flavor.1104.c: "Попросить остальных подождать, пока я терпеливо занимаюсь орлом."
 latria_sexual_frustration_flavor.1105.c: "Убрать письмо в шкатулку и распланировать завтрашние дела."
 latria_sexual_frustration_flavor.1107.c: "Предложить сесть и поговорить о другом."
 latria_sexual_frustration_flavor.1107.d: "Пригласить весь стол присоединиться к весёлому общему танцу."
 latria_sexual_frustration_flavor.1108.c: "Не спеша закончить молитву, не борясь с каждой мыслью."
 latria_sexual_frustration_flavor.1109.c: "Сделать короткий перерыв и упорядочить оставшиеся дела."
 latria_sexual_frustration_flavor.1109.d: "Упорядочить срочные решения и принять их здесь."
 latria_sexual_frustration_flavor.1110.c: "Надеть одеяние и пойти за чашкой тёплого бульона."
