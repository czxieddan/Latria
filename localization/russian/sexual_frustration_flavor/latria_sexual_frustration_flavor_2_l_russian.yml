l_russian:
 latria_sexual_frustration_flavor.1101.t: "Без сна под пологом"
 latria_sexual_frustration_flavor.1101.desc.female: "Я просыпаюсь после короткой дремоты. Ночная рубашка сползла к изножью, плечи и колени оказались снаружи полога. В постели больше никого нет. Одеяло я сбила сама, и на подушке лишь одна вмятина.\n\nЯ подтягиваю рубашку; ткань скользит по коже, но прежнее волнение не уходит. За окном стража уже дважды возвестила смену часа. Хочу повернуться на бок и снова уснуть, но стоит закрыть глаза, как вспоминается шея того человека, когда днём он отвернулся. Крючок полога тихо звякает, словно кто-то приподнимает край. Но никого нет.\n\nЯ ложусь на спину и не знаю, куда деть руки. До утра ещё далеко, а сон уже рассеялся."
 latria_sexual_frustration_flavor.1101.desc.male: "Я просыпаюсь после короткой дремоты; ночная рубашка сползла к изножью. За пологом темно, лишь издалека доносится один удар ночного барабана. Одеяло скомкано — это я сбил его, ворочаясь во сне.\n\nЯ сажусь, потом снова ложусь. Но и лёжа ощущаю внизу живота то же упрямое тепло. Считаю вдохи; на седьмом вновь вспоминаю, как близко был ко мне один человек во время разговора. Между нами ничего не произошло, но эту близость я помню слишком хорошо.\n\nВетер приподнимает край полога и снова роняет его. Другая сторона постели всё ещё холодна."
 latria_sexual_frustration_flavor.1101.desc: "Полог опущен наполовину. Долгая ночь ещё не кончилась, а мысли по-прежнему путаются.\n\nЯ подтягиваю одеяло к груди и снова отбрасываю. У подушки нет ни письма, ни другого человека — только моя рука. Ладонь горячая; я прижимаю её к циновке, надеясь немного остудить.\n\nСнова раздаётся оклик ночной стражи. Я всё ещё не сплю."
 latria_sexual_frustration_flavor.1101.a: "Закрыть глаза и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1101.b: "Отбросить эту мысль, задёрнуть полог и снова лечь спать."

 latria_sexual_frustration_flavor.1102.t: "Взгляды между танцами"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Музыканты сменяют уже третью мелодию, танцующие вокруг меня тоже успевают смениться несколько раз. Никто не косится на слишком тесный поворот; музыканты даже замедляют ритм, чтобы дать людям договорить.\n\nНо я помню тот миг. Чужая рука задерживается на моём запястье чуть дольше, чем требует учтивость, взгляд тоже не сразу отводят. С концом мелодии рука отпускает меня, оставляя лёгкое тепло от пальцев. Я возвращаюсь на своё место. Кубок полон, но я не пью.\n\nУже начинается следующий танец. Я смотрю на освободившийся участок пола, и ноги сами просятся туда."
 latria_sexual_frustration_flavor.1102.desc.strict: "Чем теснее танец, тем больше окружающий смех похож на шёпот. Я смотрю на музыкантов, но чужая рука всё ещё ведёт мою. Рукава задевают друг друга, и этот шорох слышится яснее барабанного ритма.\n\nУ стола кто-то склоняется к соседу. Не разобрать, обо мне говорят или о чём-то другом. Как только музыка стихает, я отступаю на полшага — слишком поспешно, едва не наступив себе на ногу. В ответ на меня лишь смотрят, ничего не спрашивая.\n\nДаже когда я сажусь, запястье ещё хранит тепло. Я прикрываю его другой рукой, словно так никто ничего не заметит."
 latria_sexual_frustration_flavor.1102.desc: "Музыка ускоряется, но танец не уносит моих мыслей.\n\nЯ делаю два поворота, ни разу не сбиваясь с шага, а мысленно всё отмечаю, как чужое дыхание то приближается, то отдаляется. На самой высокой ноте мелодия на мгновение замирает. В эту паузу никто из нас не говорит ни слова.\n\nСмычок вновь касается струн. Я всё ещё стою на месте, не зная, где для меня должен закончиться этот танец."
 latria_sexual_frustration_flavor.1102.a: "Пригласить на ещё один танец и придвинуться ближе."
 latria_sexual_frustration_flavor.1102.b: "Поблагодарить за танец поклоном и отойти к краю зала."

 latria_sexual_frustration_flavor.1103.t: "У двери наставника"
 latria_sexual_frustration_flavor.1103.desc.favors: "Мой духовный наставник говорит, что подавление желаний — не единственный путь благочестия. Свет лампы отбрасывает на стену две наши тени. Он говорит медленно, словно оставляя промежутки для моего ответа.\n\nМне хочется спросить: если ночью просыпаешься в одиночестве и не знаешь, куда деть руки, есть ли место на этом пути и для такого человека? Слова уже готовы сорваться, но за дверью внезапно останавливаются шаги. Мы оба ненадолго умолкаем. Шаги удаляются.\n\nНаставник смотрит на меня, ожидая продолжения. Я проглатываю вопрос, оставляя от него лишь недоговорённое начало."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Мой духовный наставник напоминает, что целомудрие важно и вдали от чужих глаз. Он не повышает голоса, но комната словно сразу становится теснее. Я опускаю голову и тихо отвечаю, сжимая пальцы под рукавами.\n\nОн спрашивает, что привело меня сегодня вечером. Я смотрю на лампу, на дверь, на носки собственных туфель — куда угодно, только не ему в глаза. Правда уместилась бы в нескольких словах, но я боюсь, что за ними последуют новые вопросы.\n\nЗа дверью кто-то кашляет. Я вздыхаю с облегчением и тут же стыжусь этого вздоха."
 latria_sexual_frustration_flavor.1103.desc: "В комнате тускло горит лампа. Я подбираю слова, чтобы заговорить с духовным наставником.\n\nСледовало бы спросить об обязанностях. О другом спрашивать не следовало бы. Ещё у двери мне удаётся перебрать оба разговора, но стоит войти, и в голове не остаётся ни одной фразы. Наставник наливает мне воды; она ещё тёплая.\n\nЯ держу чашу в руках, касаюсь губами края, но слова так и не выходят."
 latria_sexual_frustration_flavor.1103.a: "Признать свою тоску и перестать её скрывать."
 latria_sexual_frustration_flavor.1103.b: "Спросить лишь о нынешних обязанностях, а остальное проглотить."

 latria_sexual_frustration_flavor.1104.t: "Орёл не возвращается"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Орёл кружит над охотничьими угодьями и никак не садится обратно на перчатку. Я дважды поднимаю руку, но оба раза он лишь наклоняет крыло и взмывает выше. Из леса тянет ветром с запахом травы и конского пота.\n\nЯ почти завидую ему. Он может не объясняться, не возвращаться и не выдавать нетерпение за выдержку перед всеми. Слуга спрашивает, убрать ли луки. Я качаю головой, продолжая следить за чёрной точкой. Постепенно она напоминает уже не орла, а другого, кто тоже не желает возвращаться.\n\nРука уже ноет. Я всё равно не опускаю её."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Орёл не спускается, и слуги уже несколько раз спрашивают, не пора ли убрать луки. Я лишь прошу ещё немного подождать, словно за это время смятение внутри уляжется само.\n\nОхотники уже спешились и передают друг другу бурдюк в тени деревьев. Они меня не торопят, но время от времени звенит сбруя, словно делая это за них. Я смотрю в небо и считаю про себя, пока счёт снова не сменяется одним и тем же именем.\n\nОрёл кричит, но всё ещё не садится. Я медленно перекладываю перчатку на другую руку."
 latria_sexual_frustration_flavor.1104.desc: "Орёл всё не возвращается, и охотники ждут моего слова.\n\nОт свистка на ладони остаётся след. Я подношу его к губам, затем опускаю. Круги в небе становятся всё меньше, но никто не знает, вернётся ли птица в следующее мгновение.\n\nКто-то тихо спрашивает, едем ли мы. Я отзываюсь, даже не понимая, означает мой ответ отъезд или ещё немного ожидания."
 latria_sexual_frustration_flavor.1104.a: "Пусть орёл кружит, пока мои мысли блуждают."
 latria_sexual_frustration_flavor.1104.b: "Собраться с мыслями и подозвать орла в лагерь."

 latria_sexual_frustration_flavor.1105.t: "Свечи и корона"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Слуга выносит парадную корону из спальни, а у подсвечника остаются несколько неутверждённых указов. Я запахиваю ночную рубашку и сажусь. Следовало бы начать с верхнего листа, но рука уже вытягивает из бумаг неотправленное письмо.\n\nВ письме только обращение; дальше пусто. За день три попытки написать его оборвались на одном и том же месте. Корона поблёскивает в ларце, словно ещё ждёт, когда я вернусь к императорским делам. Я разглаживаю лист, но и на ровной бумаге следующая фраза не находится.\n\nКапля воска падает на медное блюдце с едва слышным звуком."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Я запахиваю ночную рубашку в комнате постоялого двора. Спутники уже легли, за стеной кто-то храпит. Лампа освещает неотправленное письмо возле дорожной сумы; уголки бумаги загнулись.\n\nЗавтра нужно в путь. Припасы, лошади, переправа — всё устроено, кроме судьбы этого письма. Я разворачиваю его, и написанное кажется ещё менее пригодным для отправки, чем утром. Одна фраза слишком прямая; я задерживаю на ней согнутый палец.\n\nВнизу кто-то закрывает дверь. Я прижимаю письмо к суме, но тут же ослабляю нажим."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Я складываю облачение и возвращаюсь на край постели в ночной рубашке. Неотправленное письмо лежит под писанием; уголок выступает наружу, словно сам хочет привлечь внимание.\n\nЯ вытаскиваю его. Книга закрывается с глухим стуком. В письме нет слов, нарушающих обеты, но каждая фраза обращается к одному человеку. На третьей строке мне уже ясно: не следует читать его в такой час.\n\nПламя свечи вздрагивает. Я не убираю письмо обратно."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Слуги убирают парадную одежду, а я сажусь под лампой в ночной рубашке. На столе ещё ждут решения бумаги, но первым я разворачиваю лежащее рядом неотправленное письмо.\n\nСнаружи сменяется стража; ровные шаги проходят мимо. В комнате слышен лишь шелест бумаги. На пустом месте письма я вывожу одно слово, смотрю на него и замазываю чернилами. Теперь пятно бросается в глаза ещё сильнее.\n\nЯ кладу перо. Бумаги остаются там же, и ни на одной ещё нет печати."
 latria_sexual_frustration_flavor.1105.desc: "Огонь догорает, а неотправленное письмо всё ещё лежит под рукой.\n\nЯ знаю, что сегодня ночью адресат его не прочтёт. И всё же снова вывожу обращение, медленнее, чем днём. Чернила высыхают, оставляя на бумаге лишь бледный след.\n\nФитиль потрескивает. Я поднимаю голову и только теперь замечаю, как долго здесь сижу."
 latria_sexual_frustration_flavor.1105.a: "Отдать письмо гонцу."
 latria_sexual_frustration_flavor.1105.b: "Уничтожить его, отбросить мысль и погасить свечу перед сном."

 latria_sexual_frustration_flavor.1106.t: "Беспокойство при свечах"
 latria_sexual_frustration_flavor.1106.desc.female: "Я сижу у постели в ночной рубашке. Свеча отбрасывает мою тень на бумагу, затягивающую окно; тень чуть движется в такт дыханию и кажется спокойнее меня самой. Ночь уже глубока, но безответное желание остаётся в груди: не подаёт голоса и не уходит.\n\nЯ откидываю волосы за плечо, затем возвращаю обратно. Когда пальцы касаются шеи сбоку, я на миг замираю. Здесь никого нет, но даже эта заминка заставляет меня краснеть. Вспоминается дневная фраза, сказанная то ли в шутку, то ли всерьёз. Тогда я рассмеялась, но после всё время возвращалась к ней мыслями.\n\nНа свече нарастает ещё один слой воска. Я всё ещё сижу, и полог так и не опущен."
 latria_sexual_frustration_flavor.1106.desc.male: "Я сижу у постели в ночной рубашке. Ночной сторож уже дважды прошёл под окном. В первый раз я ещё надеялся заснуть, ко второму уже оставил эту надежду.\n\nВ руках нет ни письма, ни вина. Я просто прижимаю ладони к коленям, держу, пока они не согреются, затем переворачиваю. Голос того человека на самом деле не звучит в комнате, но я могу повторить все паузы в его словах. На третий раз мне самому становится неловко.\n\nЯ дую на свечу, но не гашу её. Пламя склоняется и снова выпрямляется."
 latria_sexual_frustration_flavor.1106.desc: "Свеча становится короче, а под пологом всё ещё нет сна.\n\nЯ ложусь и слышу, как сердце стучит громче обычного. Поворачиваюсь на бок — стук остаётся. Всё в комнате на своих местах: чаша, туфли, сложенная верхняя одежда. Ничто не может унять это волнение.\n\nЯ снова сажусь. Огонь ещё горит, но немалая часть ночи уже прошла."
 latria_sexual_frustration_flavor.1106.a: "Позволить мыслям задержаться на этой привязанности."
 latria_sexual_frustration_flavor.1106.b: "Больше не думать об этом; погасить свечу и лечь спать."


 latria_sexual_frustration_flavor.1107.t: "Танец в ответ"
 latria_sexual_frustration_flavor.1107.desc.accepted: "После танца меня приглашают на следующий, и окружающие принимают это за обычную любезность. Музыкант уже положил смычок на струны и ждёт моего кивка.\n\nМне же помнится недавнее прикосновение. Чужая рука на миг задержалась у моей талии — достаточно коротко, чтобы объяснить это движением танца, и слишком долго, чтобы такое объяснение меня убедило. Я поднимаю глаза и встречаю ответный взгляд с лёгкой улыбкой. Вслух ничего не произносится.\n\nЗа столом громко звенят кубки. И всё же я слышу собственное согласие, которое так и не решаюсь высказать."
 latria_sexual_frustration_flavor.1107.desc.strict: "После танца меня приглашают на следующий, и несколько взглядов тут же обращаются к нам. Я ещё не отвечаю, а кто-то уже склоняется к соседу за столом и шепчет. Слов не разобрать, но оба не сводят с нас глаз.\n\nПротянутая ко мне рука остаётся на месте; жест учтивый, без настойчивости. Моя же рука горит под рукавом. Если принять приглашение, после этого танца будет ещё труднее делать вид, что ничего не происходит. Если отказаться, отказ тоже запомнят.\n\nМузыкант кашляет. Смычок по-прежнему лежит на струнах."
 latria_sexual_frustration_flavor.1107.desc: "Музыканты начинают новую мелодию, а я всё не встаю.\n\nПервые доли уже прошли. Протянутая ко мне рука не опускается; меня не торопят, просто ждут рядом. Я смотрю на неё, затем на собственные пальцы, лежащие на краю стола.\n\nПозади кто-то отодвигает стул. От этого звука я вздрагиваю и моргаю, но так и остаюсь сидеть."
 latria_sexual_frustration_flavor.1107.a: "Принять приглашение и придвинуться ближе."
 latria_sexual_frustration_flavor.1107.b: "Отклонить приглашение с поклоном и пожелать приятного танца."

 latria_sexual_frustration_flavor.1108.t: "Молитва перед сном"
 latria_sexual_frustration_flavor.1108.desc.favors: "Я молюсь у постели в ночной рубашке. Мне хорошо знакомы слова о том, что наша вера допускает плотские утехи, но сейчас они не помогают. Они лишь говорят, что не обязательно считать это грехом, не объясняя, куда мне деть своё желание.\n\nКолени упираются в край постели. Я произношу молитву, а в памяти вновь и вновь возникает слишком близкий обмен взглядами днём. Сам по себе этот взгляд ничего не значил. Но я делю его на множество мгновений и снова перебираю каждое.\n\nДойдя до конца, я не останавливаюсь. Следующие фразы уже мои собственные, и никакого порядка в них нет."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Я стою на коленях у постели в ночной рубашке и повторяю обет целомудрия. С каждой строкой яснее звучит внутренний голос: и сегодня рядом никого не будет, постель останется холодной, а в темноте мне не к кому будет протянуть руку.\n\nЯ прислоняюсь виском к деревянному краю кровати. Дерево холодное, и так немного легче. Но стоит отстраниться от этой прохлады, как прежнее волнение возвращается. Я начинаю с первой строки, понизив голос, словно за стеной могут услышать.\n\nВ соседней комнате никого нет. Я всё равно говорю тихо."
 latria_sexual_frustration_flavor.1108.desc: "Свеча у постели слегка колышется, а моя молитва всё не заканчивается.\n\nЗнакомый отрывок уже произнесён. За ним должна наступить тишина, но я не хочу её впускать. Стоит ей появиться, и её заполнит совсем другая мысль. Я прибавляю ещё несколько фраз, прекрасно понимая, что это уже не молитва.\n\nПламя склоняется к пологу. Я остаюсь на коленях, и полы рубашки уже измялись."
 latria_sexual_frustration_flavor.1108.a: "Отложить обет целомудрия и признать свою тоску."
 latria_sexual_frustration_flavor.1108.b: "Унять мысли и продолжить молитву."

 latria_sexual_frustration_flavor.1109.t: "Неоконченный совет"
 latria_sexual_frustration_flavor.1109.desc: "Советники изложили три способа решить дело, но я всё не выношу решения. Первый надёжнее, второй дешевле, третий ближе к прежнему обычаю. Я слышу каждый и киваю, однако после так и не могу назвать выбранный.\n\nПеро писца замирает над листом. Кто-то пододвигает чашу воды к моей руке. Я смотрю на своё отражение и вдруг отвлекаюсь на человека, не имеющего отношения к запасам провианта. Сейчас его нет в этой комнате, но я всё ещё помню паузы в его речи.\n\nМолчание становится мучительно долгим. Я прочищаю горло, но за этим не следует ни одной фразы."
 latria_sexual_frustration_flavor.1109.a: "Завершить совет и остаться со своими мыслями."
 latria_sexual_frustration_flavor.1109.b: "Подавить мысль и попросить писца продолжить."
 latria_sexual_frustration_flavor.1110.t: "Комната после полуночи"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Я возвращаюсь в свою маленькую комнату в ночной рубашке. Ночная молитва окончена, большинство ламп в галерее уже погасло. Но неотправленное письмо всё ещё раскрыто на столе, прижимая собой чётки.\n\nСледовало бы убрать чётки в ларец, а вместе с ними и письмо. Но стоит положить руку на бумагу, как я останавливаюсь. Каждую фразу я уже знаю наизусть и всё равно хочу ещё раз увидеть, как моей рукой выведено то имя. В одном месте чернила расплылись, словно рука при письме дрогнула.\n\nВ комнате тихо. Я стою у стола; завязки ночной рубашки затянуты неплотно."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "На постоялом дворе горит лишь несколько ламп. Я сижу на краю кровати в ночной рубашке. Дорожная сума уже завязана, только неотправленное письмо ещё выглядывает наружу.\n\nЗа стеной кто-то переворачивается, и кровать скрипит. Я жду, пока звук стихнет, прежде чем вытащить письмо. Края бумаги покрыты дорожной пылью. Я дую на них; пыль остаётся, а слова словно проступают яснее. Одной фразе не следовало появляться на бумаге, но она как раз посередине.\n\nЯ складываю письмо, однако новый сгиб не совпадает со старым."
 latria_sexual_frustration_flavor.1110.desc: "Звуки за дверью постепенно удаляются, а я продолжаю ждать у постели.\n\nНикто не обещал прийти ко мне сегодня ночью. И всё же я оставляю лампу гореть, а верхнюю одежду кладу так, чтобы можно было дотянуться рукой. Каждый раз, когда мимо проходят, я поднимаю голову. Все шаги удаляются.\n\nМасла в лампе становится меньше. Другая сторона постели по-прежнему пуста, но я ещё не ложусь."
 latria_sexual_frustration_flavor.1110.a: "Дописать письмо и отправить его на рассвете."
 latria_sexual_frustration_flavor.1110.b: "Запереть дверь, отбросить мысль и лечь спать."

 latria_sexual_frustration_flavor.1101.c: "Надеть одеяние, сесть спокойно и выровнять дыхание."
 latria_sexual_frustration_flavor.1102.c: "Поговорить с музыкантами об их мелодиях."
 latria_sexual_frustration_flavor.1103.c: "Спросить, как мне жить с этими чувствами."
 latria_sexual_frustration_flavor.1103.d: "Начать с неотправленного письма и ничего не скрывать."
 latria_sexual_frustration_flavor.1104.c: "Попросить остальных подождать, пока я терпеливо занимаюсь орлом."
 latria_sexual_frustration_flavor.1105.c: "Убрать письмо в шкатулку и распланировать завтрашние дела."
 latria_sexual_frustration_flavor.1107.c: "Предложить сесть и поговорить о другом."
 latria_sexual_frustration_flavor.1107.d: "Пригласить весь стол присоединиться к весёлому общему танцу."
 latria_sexual_frustration_flavor.1108.c: "Не спеша закончить молитву, не борясь с каждой мыслью."
 latria_sexual_frustration_flavor.1109.c: "Сделать короткий перерыв и упорядочить оставшиеся дела."
 latria_sexual_frustration_flavor.1109.d: "Упорядочить срочные решения и принять их здесь."
 latria_sexual_frustration_flavor.1110.c: "Надеть одеяние и пойти за чашкой тёплого бульона."
