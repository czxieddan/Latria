l_russian:
 latria_sexual_frustration_flavor.1301.t: "Неотправленное приглашение"
 latria_sexual_frustration_flavor.1301.desc.female: "Я сижу за столом в ночной рубашке; на листе написано лишь одно имя. Горничная спрашивает, нести ли письмо. Я складываю его и не отвечаю."
 latria_sexual_frustration_flavor.1301.desc.male: "Я сижу за столом в ночной рубашке; на листе написано лишь одно имя. Слуга ждёт снаружи, чтобы отнести письмо, но я не решаюсь его запечатать."
 latria_sexual_frustration_flavor.1301.desc: "Незапечатанное письмо уже давно ждёт под свечой."
 latria_sexual_frustration_flavor.1301.a: "Дописать письмо и отдать его слуге."
 latria_sexual_frustration_flavor.1301.b: "Убрать письмо, подавить тоску и отправиться спать."

 latria_sexual_frustration_flavor.1302.t: "Суд двора"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Придворный поэт шутит о прежних привязанностях, и даже самые суровые вельможи не хмурятся. Я поднимаю кубок вместе с ними, но облегчения не нахожу."
 latria_sexual_frustration_flavor.1302.desc.strict: "Аристократ опозорился из-за неосмотрительного романа, и при дворе обсуждают всю его семью. Я слушаю их приговор, зная, что могу оказаться на тех же весах."
 latria_sexual_frustration_flavor.1302.desc: "Разговор обращается к репутации и желанию."
 latria_sexual_frustration_flavor.1302.a: "Говорить о своей тоске, вновь и вновь возвращая к ней разговор."
 latria_sexual_frustration_flavor.1302.b: "Промолчать, поблагодарить хозяев и уйти."

 latria_sexual_frustration_flavor.1303.t: "Полуночный колокол"
 latria_sexual_frustration_flavor.1303.desc.favors: "После звона колокола жрец остаётся у двери. Он говорит, что желание можно обратить во благо, но я не знаю, могу ли ждать ещё."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Колокол звонит вновь и вновь, как и обет жреца звучит в моём сердце. Колени болят от стояния на них, но ответа всё нет."
 latria_sexual_frustration_flavor.1303.desc: "Полуночная молитва не принесла покоя, хотя колокола продолжают звонить."
 latria_sexual_frustration_flavor.1303.a: "Оставить заповеди воздержания в храме."
 latria_sexual_frustration_flavor.1303.b: "Подавить мысль и повторить молитву ещё раз."

 latria_sexual_frustration_flavor.1304.t: "Конец терпению"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Я хожу по покоям в ночной рубашке. Шахматы, принесённые слугой, остаются нетронутыми; ожидание само стало мучением."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Я перевязываю пояс ночной рубашки, стараясь придать каждому движению спокойствие. Чем больше стараний, тем труднее не замечать свою тоску."
 latria_sexual_frustration_flavor.1304.desc: "В комнате тихо. Я больше не могу усидеть на месте."
 latria_sexual_frustration_flavor.1304.a: "Отложить шахматы и подумать о предмете моей тоски."
 latria_sexual_frustration_flavor.1304.b: "Вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1305.t: "Комната после заката"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Двор разошёлся, но я остаюсь в покоях в парадном одеянии. Петиции разобраны; тревожные мысли не ушли вместе с вельможами."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Спутники разошлись спать на постоялом дворе, но я остаюсь в комнате в одиночестве. Снаряжение собрано, завтрашний маршрут намечен, а мысли не успокаиваются."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Я остаюсь в своей комнатке в одиночестве, всё ещё в облачении. Свеча у постели погасла. Обет остаётся, но утешение не приходит."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Я возвращаюсь в пустые покои в парадной одежде. Стражники кланяются снаружи, но внутри некому разделить эту ношу."
 latria_sexual_frustration_flavor.1305.desc: "Покои пусты, но я ещё не хочу ложиться."
 latria_sexual_frustration_flavor.1305.a: "Позвать доверенного знакомого, несмотря на поздний час, и поговорить подольше."
 latria_sexual_frustration_flavor.1305.b: "Подавить тоску, снять одеяние и отправиться спать."

 latria_sexual_frustration_flavor.1306.t: "Гонец в полночь"
 latria_sexual_frustration_flavor.1306.desc.female: "Я сижу у постели в ночной рубашке и слышу два тихих стука. Горничная приносит лишь чистый лист, но я знаю, чьего послания жду."
 latria_sexual_frustration_flavor.1306.desc.male: "Я открываю дверь покоев в ночной рубашке, но коридор уже пуст. Записка без подписи на пороге лишает меня сна."
 latria_sexual_frustration_flavor.1306.desc: "Шаги за дверью затихают. Лист на столе остаётся чистым."
 latria_sexual_frustration_flavor.1306.a: "Записать слова, которые так долго откладываются."
 latria_sexual_frustration_flavor.1306.b: "Убрать лист, подавить тоску и лечь."

 latria_sexual_frustration_flavor.1307.t: "Молчание за столом"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Поэт читает о старом романе, и собравшиеся слушают с удовольствием. Я поднимаю кубок вместе с ними, думая об истории, которую никто не рассказал."
 latria_sexual_frustration_flavor.1307.desc.strict: "За столом обсуждают аристократа, впавшего в немилость из-за неосмотрительного романа, и смех затихает. Я отворачиваюсь к окну, скрывая выражение лица."
 latria_sexual_frustration_flavor.1307.desc: "Кубки передают по кругу, но разговор задерживается на теме, которую лучше оставить в покое."
 latria_sexual_frustration_flavor.1307.a: "Развязать язык вином и рассказывать личные истории одну за другой."
 latria_sexual_frustration_flavor.1307.b: "Промолчать, поклониться собравшимся и уйти."

 latria_sexual_frustration_flavor.1308.t: "Молитва во время бдения"
 latria_sexual_frustration_flavor.1308.desc.favors: "Колокол отмечает ночную стражу, а я остаюсь молиться в святилище. Моя вера не осуждает плотские утехи, но я не знаю, как справиться с этой долгой тоской."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Я повторяю молитву о целомудрии в святилище. Звон колокола затихает, но мысль во мне остаётся."
 latria_sexual_frustration_flavor.1308.desc: "Свет свечи падает на пустые скамьи. Я всё ещё не встаю."
 latria_sexual_frustration_flavor.1308.a: "Отложить молитву о воздержании и уйти по зову сердца."
 latria_sexual_frustration_flavor.1308.b: "Сдержать желание и закончить бдение."

 latria_sexual_frustration_flavor.1309.t: "Взгляд в зеркало"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Без одежды, в одиночестве, я на мгновение останавливаюсь перед зеркалом в покоях. Выражение лица не изменилось, но я больше не стану называть желание мимолётной слабостью."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Без одежды у постели я повторяю обет. Я помню каждое слово, но внутренняя тоска не исчезает."
 latria_sexual_frustration_flavor.1309.desc: "В комнате больше никого. Молчание в зеркале не оставляет возможности отвести взгляд."
 latria_sexual_frustration_flavor.1309.a: "Признать свои чувства и предаться им в мыслях."
 latria_sexual_frustration_flavor.1309.b: "Одеться, вернуться к столу и подавить мысль."

 latria_sexual_frustration_flavor.1310.t: "Без сна в своих покоях"
 latria_sexual_frustration_flavor.1310.desc.clergy: "После ночной молитвы я возвращаюсь в свою комнатку. Облачение ещё на мне, свеча у постели погасла, но я не хочу ложиться."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Спутники разошлись спать на постоялом дворе. В комнате я в одиночестве убираю снаряжение. Завтрашний путь ясен, а путь сквозь мои мысли — нет."
 latria_sexual_frustration_flavor.1310.desc: "Час поздний. Дверь закрыта, но я не могу уснуть."
 latria_sexual_frustration_flavor.1310.a: "Написать старому знакомому и прямо рассказать о своих тревогах."
 latria_sexual_frustration_flavor.1310.b: "Подавить мысль, погасить свечу и лечь."

 latria_sexual_frustration_flavor.1301.c: "Взять чистый лист и обратить приглашение в стихи."
 latria_sexual_frustration_flavor.1302.c: "Вернуть разговор к семьям и владениям."
 latria_sexual_frustration_flavor.1302.d: "Рассказать дорожную историю, чтобы все снова подняли кубки."
 latria_sexual_frustration_flavor.1303.c: "Остаться до рассвета и изучать писание строка за строкой."
 latria_sexual_frustration_flavor.1304.c: "Расставить фигуры и обдумать шахматную задачу."
 latria_sexual_frustration_flavor.1304.d: "Начать с первого хода и неспешно сыграть целую партию."
 latria_sexual_frustration_flavor.1305.c: "Распланировать утренние дела, прежде чем погасить свечу."
 latria_sexual_frustration_flavor.1307.c: "Прочитать новое стихотворение и отвлечь их внимание."
 latria_sexual_frustration_flavor.1308.c: "Закрыть молитвенник и обдумать всё в тишине."
 latria_sexual_frustration_flavor.1308.d: "Бодрствовать до утренней молитвы и приготовить книги для всех."
 latria_sexual_frustration_flavor.1309.c: "Записать свои тревоги и разобрать их строка за строкой."
 latria_sexual_frustration_flavor.1310.c: "Заварить чай и не спеша убрать вещи и книги."
