l_russian:
 dlc_latria: "Latria"
 dlc_latria_desc: "Обычай больше не решает, кого вам желать. Чем глубже скрыто влечение, тем жарче оно горит. Одинокая лампа, неотправленное письмо — и долгая ночь без сна. Мимолётное наслаждение порой успокаивает сердце, а порой оставляет рану на долгие годы. В Latria плоть и дух могут обрести спасение или прийти к погибели."
