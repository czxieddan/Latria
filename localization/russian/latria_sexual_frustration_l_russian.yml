 game_concept_latria_sexual_repression_level_desc: "Когда [latria_sexual_repression|E] достигает [latria_sexual_repression_threshold|E], повышается [latria_sexual_repression_level|E]. Каждый уровень накладывает на персонажа соответствующий модификатор."
