l_russian:
 latria_sexual_frustration_1: "Беспокойное желание"
 latria_sexual_frustration_1_desc: "Неудовлетворённое желание начинает тревожить этого персонажа."
 latria_sexual_frustration_2: "Неотступное желание"
 latria_sexual_frustration_2_desc: "Желание возвращается вновь и вновь, мешая сохранять самообладание."
 latria_sexual_frustration_3: "Сдерживаемое желание"
 latria_sexual_frustration_3_desc: "Давно сдерживаемое плотское желание тяготит тело и разум."
 latria_sexual_frustration_4: "Мучительное желание"
 latria_sexual_frustration_4_desc: "Тяжесть воздержания теперь ощущается каждый час бодрствования."
 latria_sexual_frustration_5: "Невыносимое желание"
 latria_sexual_frustration_5_desc: "Желание стало невыносимой ношей."

 latria_sexual_frustration_0: "Спокойное желание"
 latria_sexual_frustration_hud_title: "[SelectLocalization( Or( Not( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').IsSet ), EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)0' ) ), 'latria_sexual_frustration_0', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)1' ), 'latria_sexual_frustration_1', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)2' ), 'latria_sexual_frustration_2', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)3' ), 'latria_sexual_frustration_3', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)4' ), 'latria_sexual_frustration_4', 'latria_sexual_frustration_5' ) ) ) ) )] [GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue|0]/5"
 latria_sexual_frustration_hud_subheading: "[latria_sexual_repression_level|E] — [GetPlayer.GetSexuality]"
 latria_sexual_frustration_level_effects: "#S Эффекты:#!\n[StaticModifier.GetDescWithEffects]"
 latria_sexual_frustration_no_level_effects: "#S Эффекты:#!\nСейчас на этого персонажа не действует модификатор подавленного желания."
 latria_daily_sexual_frustration_gain_display: "#P [GetPlayer.MakeScope.ScriptValue('latria_daily_sexual_frustration_gain')|+=3]#!/день"
 latria_sexual_frustration_track_title: "Подавленное желание [GetPlayer.MakeScope.Var('latria_sexual_frustration').GetValue|0]/300"
 latria_sexual_frustration_requires_0: "Требуется подавленное желание не ниже #V 0#!"
 latria_sexual_frustration_requires_20: "Требуется подавленное желание не ниже #V 20#!"
 latria_sexual_frustration_requires_50: "Требуется подавленное желание не ниже #V 50#!"
 latria_sexual_frustration_requires_100: "Требуется подавленное желание не ниже #V 100#!"
 latria_sexual_frustration_requires_180: "Требуется подавленное желание не ниже #V 180#!"
 latria_sexual_frustration_requires_300: "Требуется подавленное желание не ниже #V 300#!"

 game_concept_latria_sexual_repression: "Подавленное желание"
 game_concept_latria_sexual_repression_desc: "Подавленное желание отражает неудовлетворённое плотское влечение персонажа. Оно растёт со временем и убывает, когда персонаж находит удовлетворение."
 game_concept_latria_sexual_repression_level: "Уровень подавленного желания"
 game_concept_latria_sexual_repression_level_desc: "[latria_sexual_repression|E] повышает свой уровень при значениях #V 20#!, #V 50#!, #V 100#!, #V 180#! и #V 300#!. Каждый уровень накладывает на персонажа соответствующий модификатор."

 latria_daily_sexual_frustration_gain_base: "Базовый прирост"
 latria_daily_sexual_frustration_gain_prime_age: "Расцвет сил"
 latria_daily_sexual_frustration_gain_senior_age: "Старость"
 latria_daily_sexual_frustration_gain_lustful: "[GetTrait('lustful').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_chaste: "[GetTrait('chaste').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_temperate: "[GetTrait('temperate').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_gluttonous: "[GetTrait('gluttonous').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_impatient: "[GetTrait('impatient').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_too_early: "Слишком рано"
 latria_daily_sexual_frustration_gain_no_longer: "Желание больше не подавляется"

 latria_act.0401.t: "Беспокойная ночь"
 latria_act.0401.desc: "Сон приходит медленно. Когда в покоях стихает всё, возвращается желание, которое я отгоняю."
 latria_act.0401.a: "Поворочаться под одеялом"
 latria_act.0402.t: "Ни минуты покоя"
 latria_act.0402.desc: "Стоит отвлечься на миг, и та же неудовлетворённая тоска возвращается."
 latria_act.0402.a: "Унять мысли"
 latria_act.0403.t: "Отвергнутое желание"
 latria_act.0403.desc: "Воздержание больше не кажется терпением. Оно теснит любую спокойную мысль."
 latria_act.0403.a: "Терпеть"
 latria_act.0404.t: "На грани срыва"
 latria_act.0404.desc: "Ни сон, ни молитва, ни труд не приносят мне покоя. Мучение следует за мной повсюду."
 latria_act.0404.a: "Сдержать себя"
 latria_act.0405.t: "Невыносимая ноша"
 latria_act.0405.desc: "Неутолённое желание поглотило все прочие мысли. Ещё одна ночь прошла без сна, даже привычные дела даются с трудом. Конца этому не видно."
 latria_act.0405.a: "Глубоко вдохнуть"
 latria_sexual_frustration_collapse_warning_tt: "Я долго не выдержу…"
 latria_act.0405.b: "Вытерпеть"
