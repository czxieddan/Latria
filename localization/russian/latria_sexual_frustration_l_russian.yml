 latria_act.0401.t: "Беспокойная ночь"
 latria_act.0401.desc: "В покоях тихо, и бодрствую только я. Желание, которое я в стороне держу, возвращается само, без зова; тепло ложится мне на спину. Свеча догорает; под пологом постели стоит спёртый воздух.\n\nЯ считаю вдохи, сбиваюсь со счёта и начинаю снова. Дневные мелкие дела всплывают одно за другим, а под ними всё та же неутолённая тоска.\n\nЧем тише в покоях, тем яснее она. Эта ночь и меня застанет без сна — слушать, как к утру затихнет постель."
 latria_act.0401.a: "Поворочаться под одеялом"
 latria_act.0402.t: "Ни минуты покоя"
 latria_act.0402.desc: "На середине утренней молитвы та же тоска проскальзывает между слов. Я останавливаюсь и считаю вдохи заново; когда они выравниваются, она всё ещё здесь.\n\nПение разносится по нефу. Губы следуют за ним, но строки не держатся; по обе стороны головы склонены. Тоска давит на грудь и с каждым мигом тяжелеет.\n\nКогда догорает фимиам, я закрываю книгу, зная, что она вернётся с ночью."
 latria_act.0402.a: "Унять мысли"
 latria_act.0403.t: "Отвергнутое желание"
 latria_act.0403.desc: "Воздержание больше не кажется терпением. Оно поднимается в груди и отодвигает любую спокойную мысль.\n\nРабота за работой проходит через руки, а мысли возвращаются на то же место. Пламя дрогнет — и жар поднимается снова. Я откладываю работу и жду, пока он спадёт; с каждым разом он держится дольше.\n\nТаких ночей мне больше не вынести."
 latria_act.0403.a: "Терпеть"
 latria_act.0404.t: "На грани срыва"
 latria_act.0404.desc: "Сон не идёт; молитва его не удерживает; дневной труд не вытесняет. Ночью оно громче всего, днём караулит за каждой паузой.\n\nК вечеру я жду стука в дверь — хоть слова приветствия. Дверь отворяется; входит лишь слуга с водой, ставит чашу и удаляется.\n\nКогда дверь затворяется, в покоях тише, чем прежде."
 latria_act.0404.a: "Сдержать себя"
 latria_act.0405.t: "Невыносимая ноша"
 latria_act.0405.desc: "Я больше не хочу сдерживаться. Днём жар не отходит от груди, и даже привычная мелкая работа не слушается рук.\n\nНочью сон не идёт; я лежу с открытыми глазами и слушаю, как свеча догорает. Жар давит на грудь и не уходит.\n\nКонца этой муке не видно."
 latria_act.0405.a: "Глубоко вдохнуть"
 latria_sexual_frustration_collapse_warning_tt: "Я долго не выдержу…"
 latria_act.0405.b: "Вытерпеть"
