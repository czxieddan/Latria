l_japanese:
 latria_sexual_frustration_1: "落ち着かぬ欲望"
 latria_sexual_frustration_1_desc: "満たされぬ欲望が、この人物の心を乱し始めている。"
 latria_sexual_frustration_2: "募る欲望"
 latria_sexual_frustration_2_desc: "繰り返し湧き上がる欲望に、平静を保てなくなっている。"
 latria_sexual_frustration_3: "鬱積する欲望"
 latria_sexual_frustration_3_desc: "長く抑え込んできた肉欲が、心身の重荷となっている。"
 latria_sexual_frustration_4: "苛む欲望"
 latria_sexual_frustration_4_desc: "自制の苦しみが、目覚めている間ずっとつきまとっている。"
 latria_sexual_frustration_5: "耐え難い欲望"
 latria_sexual_frustration_5_desc: "欲望はもはや耐え難い重荷となっている。"

 latria_sexual_frustration_0: "穏やかな欲望"
 latria_sexual_frustration_hud_title: "[SelectLocalization( Or( Not( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').IsSet ), EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)0' ) ), 'latria_sexual_frustration_0', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)1' ), 'latria_sexual_frustration_1', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)2' ), 'latria_sexual_frustration_2', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)3' ), 'latria_sexual_frustration_3', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)4' ), 'latria_sexual_frustration_4', 'latria_sexual_frustration_5' ) ) ) ) )] [GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue|0]/5"
 latria_sexual_frustration_hud_subheading: "[GetPlayer.GetSexuality]の[latria_sexual_repression_level|E]"
 latria_sexual_frustration_level_effects: "#S 効果：#!\n[StaticModifier.GetDescWithEffects]"
 latria_sexual_frustration_no_level_effects: "#S 効果：#!\n現在、この人物に性欲の抑圧による補正はない。"
 latria_daily_sexual_frustration_gain_display: "#P [GetPlayer.MakeScope.ScriptValue('latria_daily_sexual_frustration_gain')|+=3]#!/日"
 latria_sexual_frustration_track_title: "性欲の抑圧 [GetPlayer.MakeScope.Var('latria_sexual_frustration').GetValue|0]/300"
 latria_sexual_frustration_requires_0: "性欲の抑圧が#V 0#!以上必要"
 latria_sexual_frustration_requires_20: "性欲の抑圧が#V 20#!以上必要"
 latria_sexual_frustration_requires_50: "性欲の抑圧が#V 50#!以上必要"
 latria_sexual_frustration_requires_100: "性欲の抑圧が#V 100#!以上必要"
 latria_sexual_frustration_requires_180: "性欲の抑圧が#V 180#!以上必要"
 latria_sexual_frustration_requires_300: "性欲の抑圧が#V 300#!以上必要"

 game_concept_latria_sexual_repression: "性欲の抑圧"
 game_concept_latria_sexual_repression_desc: "性欲の抑圧は、その人物の満たされていない性欲を示す。時間と共に高まり、肉欲が満たされると低下する。"
 game_concept_latria_sexual_repression_level: "性欲の抑圧レベル"
 game_concept_latria_sexual_repression_level_desc: "[latria_sexual_repression|E]が#V 20#!、#V 50#!、#V 100#!、#V 180#!、#V 300#!に達すると、性欲の抑圧レベルが上がる。各レベルに応じた人物補正が適用される。"

 latria_daily_sexual_frustration_gain_base: "基本増加量"
 latria_daily_sexual_frustration_gain_prime_age: "壮年期"
 latria_daily_sexual_frustration_gain_senior_age: "老年期"
 latria_daily_sexual_frustration_gain_lustful: "[GetTrait('lustful').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_chaste: "[GetTrait('chaste').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_temperate: "[GetTrait('temperate').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_gluttonous: "[GetTrait('gluttonous').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_impatient: "[GetTrait('impatient').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_too_early: "時期尚早"
 latria_daily_sexual_frustration_gain_no_longer: "抑圧なし"

 latria_act.0401.t: "眠れぬ夜"
 latria_act.0401.desc: "なかなか寝つけない。部屋が静まると、脇に追いやった欲望が戻ってくる。"
 latria_act.0401.a: "寝返りを打つ"
 latria_act.0402.t: "安らぎはなく"
 latria_act.0402.desc: "少しでも気が緩めば、同じ満たされぬ思いが頭を占める。"
 latria_act.0402.a: "心を落ち着ける"
 latria_act.0403.t: "抑え込んだ欲望"
 latria_act.0403.desc: "自制はもう忍耐とは思えない。心静かに考えることさえ難しくなった。"
 latria_act.0403.a: "耐える"
 latria_act.0404.t: "限界の間際"
 latria_act.0404.desc: "眠っても、祈っても、働いても安らげない。この苦しみはどこへでもついてくる。"
 latria_act.0404.a: "気を確かに持つ"
 latria_act.0405.t: "耐え切れぬ重荷"
 latria_act.0405.desc: "満たされぬ欲望が、ほかの思いをすべて呑み込んでしまった。また一晩眠れず、いつもの務めすら苦しい。終わりが見えない。"
 latria_act.0405.a: "深く息を吸う"
 latria_sexual_frustration_collapse_warning_tt: "もう長くは持ちこたえられない…"
 latria_act.0405.b: "堪え忍ぶ"
