l_japanese:
 latria_sexual_frustration_flavor.1301.t: "送らぬ招待状"
 latria_sexual_frustration_flavor.1301.desc.female: "寝衣で机に向かい、紙には名前を一つだけ書いた。侍女が届けるかと尋ねる。私は手紙を折り畳み、答えなかった。"
 latria_sexual_frustration_flavor.1301.desc.male: "寝衣で机に向かい、紙には名前を一つだけ書いた。従者が届けようと外で待っているが、どうしても封ができない。"
 latria_sexual_frustration_flavor.1301.desc: "封のない手紙が、長らく蝋燭の下で待っている。"
 latria_sexual_frustration_flavor.1301.a: "手紙を書き終え、従者に渡そう。"
 latria_sexual_frustration_flavor.1301.b: "手紙をしまい、思いを抑えて休もう。"

 latria_sexual_frustration_flavor.1302.t: "宮廷の裁き"
 latria_sexual_frustration_flavor.1302.desc.accepted: "宮廷詩人が昔の恋を冗談にしても、最も厳格な貴族さえ眉をひそめない。私も皆と杯を上げたが、気は晴れなかった。"
 latria_sexual_frustration_flavor.1302.desc.strict: "軽率な恋である貴族が面目を失い、宮廷は一族全体を噂している。私も同じように量られるのだと思い、その裁きに耳を傾けた。"
 latria_sexual_frustration_flavor.1302.desc: "話題は名誉と欲望に移った。"
 latria_sexual_frustration_flavor.1302.a: "自らの恋慕を語り、何度でも話をそこへ戻そう。"
 latria_sexual_frustration_flavor.1302.b: "口をつぐみ、主催者に礼を述べて帰ろう。"

 latria_sexual_frustration_flavor.1303.t: "真夜中の鐘"
 latria_sexual_frustration_flavor.1303.desc.favors: "鐘が鳴り終わっても、祭司は戸口に残っている。欲望を善に向けることもできると言うが、これ以上待てるかはわからない。"
 latria_sexual_frustration_flavor.1303.desc.condemns: "鐘が何度も鳴り響き、祭司の誓いも心の中で繰り返される。跪いた膝は痛むが、答えは来ない。"
 latria_sexual_frustration_flavor.1303.desc: "真夜中の祈りは安らぎをもたらさず、鐘はなおも響いている。"
 latria_sexual_frustration_flavor.1303.a: "禁欲の戒めは神殿に置いていこう。"
 latria_sexual_frustration_flavor.1303.b: "思いを抑え、もう一度祈りを唱えよう。"

 latria_sexual_frustration_flavor.1304.t: "忍耐の終わり"
 latria_sexual_frustration_flavor.1304.desc.lustful: "寝衣のまま部屋を歩き回る。従者が持ってきたチェス盤には手もつけていない。待つこと自体が苦しみになった。"
 latria_sexual_frustration_flavor.1304.desc.chaste: "寝衣の帯を結び直し、どの動きも平静に見えるよう努める。慎重になるほど、この思いを無視できなくなる。"
 latria_sexual_frustration_flavor.1304.desc: "部屋は静かだ。私はもうじっと座っていられない。"
 latria_sexual_frustration_flavor.1304.a: "チェス盤を脇に置き、恋しい相手を思おう。"
 latria_sexual_frustration_flavor.1304.b: "机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1305.t: "日暮れ後の部屋"
 latria_sexual_frustration_flavor.1305.desc.emperor: "廷臣たちは下がったが、私は礼服のまま部屋にいる。請願には答えたが、気にかかる思いは諸侯と共に去らなかった。"
 latria_sexual_frustration_flavor.1305.desc.adventurer: "仲間たちは宿で休んだが、私は部屋に独り残っている。荷は詰め、明日の道も決まった。それでも心は落ち着かない。"
 latria_sexual_frustration_flavor.1305.desc.clergy: "祭服を着たまま、小部屋に独り残る。寝台脇の蝋燭は消えた。誓いは変わらないが、慰めは訪れない。"
 latria_sexual_frustration_flavor.1305.desc.ruler: "礼服のまま空の部屋に戻る。外で衛兵が礼をするが、中にはこの重荷を分かち合える者がいない。"
 latria_sexual_frustration_flavor.1305.desc: "部屋には誰もいないが、まだ横になりたくない。"
 latria_sexual_frustration_flavor.1305.a: "夜は遅いが、信頼する知人を呼んでじっくり話そう。"
 latria_sexual_frustration_flavor.1305.b: "思いを抑え、礼服を脱いで休もう。"

 latria_sexual_frustration_flavor.1306.t: "真夜中の使者"
 latria_sexual_frustration_flavor.1306.desc.female: "寝衣で寝台の脇に座っていると、扉を静かに二度叩く音がした。侍女が持ってきたのは白紙だけだが、誰からの便りを待っているのか、私はわかっている。"
 latria_sexual_frustration_flavor.1306.desc.male: "寝衣のまま扉を開けたが、廊下にはもう誰もいない。敷居の上の署名のない書きつけを見て、眠れなくなった。"
 latria_sexual_frustration_flavor.1306.desc: "扉の外の足音が遠ざかる。机の上の紙は白いままだ。"
 latria_sexual_frustration_flavor.1306.a: "ずっとためらっていた言葉を書こう。"
 latria_sexual_frustration_flavor.1306.b: "紙をしまい、思いを抑えて横になろう。"

 latria_sexual_frustration_flavor.1307.t: "宴席の沈黙"
 latria_sexual_frustration_flavor.1307.desc.accepted: "詩人が昔の恋を詠み、皆は喜んで聞いている。私も杯を上げながら、誰も語らない物語を思い出していた。"
 latria_sexual_frustration_flavor.1307.desc.strict: "軽率な恋で寵を失った貴族の話になり、卓から笑い声が消えた。私は表情を隠そうと窓を向いた。"
 latria_sexual_frustration_flavor.1307.desc: "杯は回り続けるが、話は触れぬ方がよい題から離れない。"
 latria_sexual_frustration_flavor.1307.a: "酒に任せ、私事を次々と語ろう。"
 latria_sexual_frustration_flavor.1307.b: "口をつぐみ、皆に一礼して帰ろう。"

 latria_sexual_frustration_flavor.1308.t: "夜通しの祈り"
 latria_sexual_frustration_flavor.1308.desc.favors: "夜警を告げる鐘が鳴り、私はまだ聖所で祈っている。信仰は肉体の快楽を咎めないが、この消えない思いにどう向き合えばよいかわからない。"
 latria_sexual_frustration_flavor.1308.desc.condemns: "聖所で貞潔の祈りを繰り返す。鐘の音は消えても、内なる思いは消えない。"
 latria_sexual_frustration_flavor.1308.desc: "空の長椅子に燭光が落ちる。私はまだ立ち上がっていない。"
 latria_sexual_frustration_flavor.1308.a: "禁欲の祈りを脇に置き、心のままに外へ出よう。"
 latria_sexual_frustration_flavor.1308.b: "欲望を抑え、徹夜の祈りを終えよう。"

 latria_sexual_frustration_flavor.1309.t: "鏡の中の姿"
 latria_sexual_frustration_flavor.1309.desc.lustful: "衣を脱ぎ、寝室の鏡の前に独り立った。表情は変わらないが、もう欲望を一時の弱さと呼ぶつもりはない。"
 latria_sexual_frustration_flavor.1309.desc.chaste: "衣を脱いだまま寝台の脇で誓いを繰り返す。言葉は一つ残らず覚えているのに、内なる思いは消えない。"
 latria_sexual_frustration_flavor.1309.desc: "部屋にはほかに誰もいない。鏡の中の沈黙に、目を背ける先もない。"
 latria_sexual_frustration_flavor.1309.a: "自分の思いを認め、それに浸ろう。"
 latria_sexual_frustration_flavor.1309.b: "衣を着て机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1310.t: "自室で眠れず"
 latria_sexual_frustration_flavor.1310.desc.clergy: "夜の祈りを終え、小部屋に戻った。祭服は着たままで、寝台脇の蝋燭は消えている。それでも横になる気になれない。"
 latria_sexual_frustration_flavor.1310.desc.adventurer: "仲間たちは宿で休んだ。部屋に独り、道具を片づける。明日の道ははっきりしているが、心の道筋は見えない。"
 latria_sexual_frustration_flavor.1310.desc: "夜は更けた。扉は閉まっているが、眠れない。"
 latria_sexual_frustration_flavor.1310.a: "旧知の相手に手紙を書き、悩みを率直に伝えよう。"
 latria_sexual_frustration_flavor.1310.b: "思いを抑え、蝋燭を消して横になろう。"

 latria_sexual_frustration_flavor.1301.c: "新しい紙を取り、招待の言葉を詩にしよう。"
 latria_sexual_frustration_flavor.1302.c: "一族と所領の話に戻そう。"
 latria_sexual_frustration_flavor.1302.d: "旅の話をして、また皆で杯を上げよう。"
 latria_sexual_frustration_flavor.1303.c: "夜明けまで残り、一節ずつ聖典を学ぼう。"
 latria_sexual_frustration_flavor.1304.c: "駒を並べ、チェスの問題を考えよう。"
 latria_sexual_frustration_flavor.1304.d: "初手から始め、ゆっくり一局指そう。"
 latria_sexual_frustration_flavor.1305.c: "朝の仕事を整理してから蝋燭を消そう。"
 latria_sexual_frustration_flavor.1307.c: "新しい詩を詠み、皆の気をほかへ向けよう。"
 latria_sexual_frustration_flavor.1308.c: "祈祷書を閉じ、静かに思いを整理しよう。"
 latria_sexual_frustration_flavor.1308.d: "朝の祈りまで起きて、皆の本を用意しよう。"
 latria_sexual_frustration_flavor.1309.c: "悩みを書き出し、一行ずつ考えよう。"
 latria_sexual_frustration_flavor.1310.c: "茶を淹れ、身の回りの品と本をゆっくり片づけよう。"
