l_japanese:
 latria_sexual_frustration_flavor.1101.t: "天蓋の下の目覚め"
 latria_sexual_frustration_flavor.1101.desc.female: "寝台で目を覚ますと、寝衣は足元に落ちていた。部屋には誰もいない。静けさの中で、満たされぬ思いがいっそう強くなる。"
 latria_sexual_frustration_flavor.1101.desc.male: "寝台で目を覚ますと、寝衣は足元に落ちていた。窓の向こうは静まり返っているが、眠気に思いを委ねられない。"
 latria_sexual_frustration_flavor.1101.desc: "天蓋は低く垂れている。夜は長く、心は落ち着かない。"
 latria_sexual_frustration_flavor.1101.a: "目を閉じ、恋しい相手を思おう。"
 latria_sexual_frustration_flavor.1101.b: "思いを脇に置き、帳を引いて眠り直そう。"

 latria_sexual_frustration_flavor.1102.t: "踊りの合間の視線"
 latria_sexual_frustration_flavor.1102.desc.accepted: "何曲か踊るうち、周りの顔ぶれも変わった。近づきすぎる足運びを気にする者はいないが、私はあの束の間に合った目を覚えている。"
 latria_sexual_frustration_flavor.1102.desc.strict: "踊りの距離が近づくほど、笑い声が囁きに聞こえる。思いを悟られぬよう、楽師たちに目を向けた。"
 latria_sexual_frustration_flavor.1102.desc: "曲の調子が速まっても、踊りは私の思いを忘れさせてくれない。"
 latria_sexual_frustration_flavor.1102.a: "もう一曲誘い、少し近づこう。"
 latria_sexual_frustration_flavor.1102.b: "相手に一礼して感謝し、広間の端へ下がろう。"

 latria_sexual_frustration_flavor.1103.t: "導き手の戸口で"
 latria_sexual_frustration_flavor.1103.desc.favors: "精神の導き手は、欲望を拒むことだけが信心への道ではないと言う。もっと尋ねたいが、扉の外で足音が止まった。"
 latria_sexual_frustration_flavor.1103.desc.condemns: "精神の導き手は、人目のない所でも貞潔は大切なのだと諭す。これ以上尋ねられないよう願い、私は頭を垂れた。"
 latria_sexual_frustration_flavor.1103.desc: "部屋は薄暗い。導き手にどう切り出そうか、思案する。"
 latria_sexual_frustration_flavor.1103.a: "この思いを認め、もう隠さずにいよう。"
 latria_sexual_frustration_flavor.1103.b: "今の務めだけを尋ね、ほかは呑み込もう。"

 latria_sexual_frustration_flavor.1104.t: "戻らぬ鷲"
 latria_sexual_frustration_flavor.1104.desc.lustful: "鷲が野の上を巡り、手袋に戻ってこない。誰に説明することもなく、望むままに飛べるその自由が羨ましい。"
 latria_sexual_frustration_flavor.1104.desc.chaste: "鷲は旋回を続ける。従者がもう一矢放つつもりかと尋ねた。私は待つよう答える。忍耐ですべて片づくかのように。"
 latria_sexual_frustration_flavor.1104.desc: "鷲は戻らず、猟師たちは私の言葉を待っている。"
 latria_sexual_frustration_flavor.1104.a: "鷲を巡らせたまま、思いにふけろう。"
 latria_sexual_frustration_flavor.1104.b: "気を取り直し、鷲を野営地へ呼び戻そう。"

 latria_sexual_frustration_flavor.1105.t: "蝋燭と王冠"
 latria_sexual_frustration_flavor.1105.desc.emperor: "従者が部屋から王冠を運び出し、蝋燭の傍らには未処理の布告が残った。私は寝衣を引き寄せ、書類の間から送っていない手紙を取り出す。"
 latria_sexual_frustration_flavor.1105.desc.adventurer: "宿の部屋で寝衣を着る。仲間たちは休んだが、荷の脇の送っていない手紙が気にかかり、眠れない。"
 latria_sexual_frustration_flavor.1105.desc.clergy: "祭服を畳み、寝衣で寝台の脇に座る。聖典の下には送っていない手紙がある。私はまたそれを引き出した。"
 latria_sexual_frustration_flavor.1105.desc.ruler: "従者が礼服を片づけた。私は灯りの下で寝衣のまま、未処理の書類より先に、送っていない手紙を広げた。"
 latria_sexual_frustration_flavor.1105.desc: "蝋燭が短くなる。送っていない手紙は手の届く所にある。"
 latria_sexual_frustration_flavor.1105.a: "手紙を使者に渡そう。"
 latria_sexual_frustration_flavor.1105.b: "手紙を処分し、思いを断って蝋燭を消そう。"

 latria_sexual_frustration_flavor.1106.t: "燭光の下の不安"
 latria_sexual_frustration_flavor.1106.desc.female: "寝衣のまま寝台の脇に座り、窓に揺れる燭光を見る。夜は更けたのに、満たされぬ思いは消えない。"
 latria_sexual_frustration_flavor.1106.desc.male: "寝衣のまま寝台の脇に座る。夜警はもう二度も中庭を横切ったが、まだ心は落ち着かない。"
 latria_sexual_frustration_flavor.1106.desc: "蝋燭は短くなるが、天蓋の下に眠りは訪れない。"
 latria_sexual_frustration_flavor.1106.a: "あの愛情に思いを馳せよう。"
 latria_sexual_frustration_flavor.1106.b: "もう考えるのはやめ、蝋燭を消して眠ろう。"


 latria_sexual_frustration_flavor.1107.t: "返礼の踊り"
 latria_sexual_frustration_flavor.1107.desc.accepted: "相手がもう一曲誘い、皆は礼儀だと受け取った。私は触れた手が離れなかった時に、頭をよぎった思いを覚えている。"
 latria_sexual_frustration_flavor.1107.desc.strict: "相手がもう一曲誘うと、幾人かがこちらを向いた。私が答えるより先に、誰かが隣の客に身を寄せて囁いた。"
 latria_sexual_frustration_flavor.1107.desc: "楽師が次の曲を奏で始めたが、私は立ち上がらない。"
 latria_sexual_frustration_flavor.1107.a: "誘いを受け、もっと近づこう。"
 latria_sexual_frustration_flavor.1107.b: "一礼して辞退し、相手が踊りを楽しめるよう願おう。"

 latria_sexual_frustration_flavor.1108.t: "就寝前の祈り"
 latria_sexual_frustration_flavor.1108.desc.favors: "寝衣のまま寝台の傍らで祈る。信仰は肉体の快楽を認めているのに、内なる切望は鎮まらない。"
 latria_sexual_frustration_flavor.1108.desc.condemns: "寝衣のまま寝台の傍らに跪き、貞潔の誓いを繰り返す。一節唱えるたび、内なる声を無視できなくなる。"
 latria_sexual_frustration_flavor.1108.desc: "寝台脇の蝋燭が揺らめく。祈りは続く。"
 latria_sexual_frustration_flavor.1108.a: "貞潔の誓いを脇に置き、思いを認めよう。"
 latria_sexual_frustration_flavor.1108.b: "思いを抑え、祈り続けよう。"

 latria_sexual_frustration_flavor.1109.t: "終わらぬ評議会"
 latria_sexual_frustration_flavor.1109.desc: "評議員たちがいくつも方策を示したが、私はまだ選べずにいる。目前の議題から心が離れ、沈黙さえ長引いている。"
 latria_sexual_frustration_flavor.1109.a: "評議会を終え、独りで考えさせてもらおう。"
 latria_sexual_frustration_flavor.1109.b: "思いを抑え、書記官に続けるよう命じよう。"
 latria_sexual_frustration_flavor.1110.t: "真夜中過ぎの部屋"
 latria_sexual_frustration_flavor.1110.desc.clergy: "寝衣で自分の小部屋に戻る。夜の祈りは終わり、蝋燭も短くなったが、卓上には送っていない手紙が広げたままだ。"
 latria_sexual_frustration_flavor.1110.desc.adventurer: "宿にはわずかな灯りが残るだけだ。私は寝衣で寝台の端に座り、送らなかった手紙のことをまだ考えている。"
 latria_sexual_frustration_flavor.1110.desc: "扉の向こうの音が遠ざかる。私はまだ寝台の脇で待っている。"
 latria_sexual_frustration_flavor.1110.a: "手紙を書き終え、夜明けに送らせよう。"
 latria_sexual_frustration_flavor.1110.b: "閂をかけ、思いを脇に置いて休もう。"

 latria_sexual_frustration_flavor.1101.c: "上着を着て静かに座り、息を整えよう。"
 latria_sexual_frustration_flavor.1102.c: "楽師たちに曲の話をしよう。"
 latria_sexual_frustration_flavor.1103.c: "この思いとどう折り合えばよいか尋ねよう。"
 latria_sexual_frustration_flavor.1103.d: "送らなかった手紙から話し始め、何も隠すまい。"
 latria_sexual_frustration_flavor.1104.c: "皆に待ってもらい、辛抱強く鷲と向き合おう。"
 latria_sexual_frustration_flavor.1105.c: "手紙を箱にしまい、明日の仕事を決めよう。"
 latria_sexual_frustration_flavor.1107.c: "相手に座ってもらい、別の話をしよう。"
 latria_sexual_frustration_flavor.1107.d: "卓の皆を誘い、賑やかな輪舞に加わろう。"
 latria_sexual_frustration_flavor.1108.c: "いちいち思いと争わず、ゆっくり祈りを終えよう。"
 latria_sexual_frustration_flavor.1109.c: "少し休憩し、残りの議題を整理しよう。"
 latria_sexual_frustration_flavor.1109.d: "急ぎの裁定を整理し、ここで片づけよう。"
 latria_sexual_frustration_flavor.1110.c: "上着を着て、温かい汁物をもらいに行こう。"
