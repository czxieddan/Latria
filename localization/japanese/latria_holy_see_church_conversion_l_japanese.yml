 latria_holy_see_church_conversion.0001.desc: "[latria_vicar.GetShortUINameNoTooltip]は封印された勅書を手に祭壇の前で待っている。教会には誰もおらず、蝋燭の灯が[latria_vicar.GetHerHis]影を石に落とす。勅書が求めるのは一つだけ——この領地を教会の下に。\n\n[latria_vicar.GetSheHe]は黙ってそれを差し出した。"
 latria_holy_see_church_conversion.0001.a: "ひれ伏して受ける"
 latria_holy_see_church_conversion.0001.b: "受けて、抗議する"

