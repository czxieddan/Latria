l_japanese:
 latria_collapse_no_relief_tt: "性欲の抑圧は和らいでいない。"

 latria_sexual_frustration_flavor.1501.t: "まだ灯る明かり"
 latria_sexual_frustration_flavor.1501.desc.dead: "もう外の足音を聞き分けられない。短剣が手から滑り落ちる。誰かが扉を開け、何度も私の名を呼ぶ。答えようとするが、目の前は暗くなり、やがて灯りも見えなくなった。"
 latria_sexual_frustration_flavor.1501.desc.survived: "短剣は私の命を絶たなかった。物音を聞いた誰かが駆け込み、助けてくれたのだ。私は寝衣のまま、傷の手当てを受けて床に横たわる。同じ満たされぬ思いが、まだ私を苦しめている。"
 latria_sexual_frustration_flavor.1501.desc.severe: "意識が戻ると、短剣はなくなっていた。誰かが寝台の脇に座り、私の傷の重さについて声を潜めている。起き上がることさえできないのに、私をここまで追い詰めた苦しみは和らいでいない。"
 latria_sexual_frustration_flavor.1501.a.dead: "何もかも…暗くなっていく…"
 latria_sexual_frustration_flavor.1501.a.survived: "痛い…"
 latria_sexual_frustration_flavor.1501.a.severe: "触らないでくれ…痛い…"

 latria_sexual_frustration_flavor.1502.t: "空の杯"
 latria_sexual_frustration_flavor.1502.desc.dead: "杯は空になった。寝台の脇で、誰かが入ってきて必死に助けを呼ぶ声を聞く。手紙はまだ書き終えていないのに、もうペンを持てない。声が遠のき、やがて何も聞こえなくなった。"
 latria_sexual_frustration_flavor.1502.desc.survived: "飲んだ毒では死ねなかった。発見され、治療を受けた今も、具合が悪く起き上がれずに寝室にいる。杯は片づけられたが、あれに手を伸ばさせた欲望は消えない。"
 latria_sexual_frustration_flavor.1502.desc.severe: "毒は命を奪わず、身体を衰弱させた。私は床に伏し、ほかの者が水を運び、衣を整えてくれる。残った病弱さも、欲望を忘れさせてはくれない。"
 latria_sexual_frustration_flavor.1502.a.dead: "声が…出ない…"
 latria_sexual_frustration_flavor.1502.a.survived: "苦しい…水を…"
 latria_sexual_frustration_flavor.1502.a.severe: "手を上げることすらできない…"

 latria_sexual_frustration_flavor.1503.t: "川岸で"
 latria_sexual_frustration_flavor.1503.desc.dead: "もう岸は見えない。遠くで誰かが叫んでいるようだが、声は曖昧になっていく。部屋に灯したままの明かりを思い出した。その最後の思いさえ薄れていった。"
 latria_sexual_frustration_flavor.1503.desc.survived: "誰かが私を川から引き上げた。目を覚ますと、外套をかけられている。私は岸辺で震えながら迎えを待ち、自らをここへ向かわせた思いを、なおも痛いほど感じていた。"
 latria_sexual_frustration_flavor.1503.desc.severe: "川は私の命を奪わなかった。岸へ運ばれた時には熱が出ており、激しい咳で話せなかった。人々は肺の病について囁いている。意識がはっきりするたび、同じ欲望が戻ってくる。"
 latria_sexual_frustration_flavor.1503.a.dead: "寒い…"
 latria_sexual_frustration_flavor.1503.a.survived: "まだ…生きているのか？"
 latria_sexual_frustration_flavor.1503.a.severe: "息が…できない…"

 latria_sexual_frustration_flavor.1504.t: "崖の下で"
 latria_sexual_frustration_flavor.1504.desc.dead: "崖の下に横たわり、山道を捜す者たちの呼び声を聞く。声は近づくが、答えられない。山の姿がぼやけ、やがて空さえ見分けられなくなった。"
 latria_sexual_frustration_flavor.1504.desc.survived: "崖の下で目覚めると、誰かが傍らにかがんで私の名を呼んでいた。落下で重い傷を負ったが、生きている。担架を待つ間、同じ欲望がまた頭を占めた。"
 latria_sexual_frustration_flavor.1504.desc.severe: "飛び降りても死ねなかった。私を見つけた者たちは寄り集まり、目を合わせようとしない。立とうとして、もう以前のようには歩けないことに気づく。苦しみは残ったままだ。"
 latria_sexual_frustration_flavor.1504.a.dead: "何も聞こえない…"
 latria_sexual_frustration_flavor.1504.a.survived: "動けない…痛い…"
 latria_sexual_frustration_flavor.1504.a.severe: "私の脚が…"

 latria_sexual_frustration_flavor.1505.t: "押し破られた扉"
 latria_sexual_frustration_flavor.1505.desc.dead: "寝室の扉が破られる音がし、誰かが慌てて私の名を呼ぶ。手紙は寝台の脇にあると伝えたいが、言葉が出ない。戸口の光が暗くなり、それきり何も聞こえなくなった。"
 latria_sexual_frustration_flavor.1505.desc.survived: "誰かが寝室の扉を破り、間一髪で助けてくれた。今は床に伏し、傷のために身動きも難しい。縄は消えたが、あれに手を伸ばさせた苦しみは去らない。"
 latria_sexual_frustration_flavor.1505.desc.severe: "誰かが何度も私の名を呼ぶが、どう答えたらよいかわからない。身体を洗うのも食事も、人の手を借りねばならない。見慣れた寝室の調度を眺めても、次に何をするべきか思いつかない。寝台の脇の手紙は箱にしまわれた。"
 latria_sexual_frustration_flavor.1505.a.dead: "私は…"
 latria_sexual_frustration_flavor.1505.a.survived: "少し…息をつかせてくれ…"
 latria_sexual_frustration_flavor.1505.a.severe: "誰か…私を呼んでいるのか？"
