l_japanese:
 latria_collapse_no_relief_tt: "性欲の抑圧は和らいでいない。"

 latria_sexual_frustration_flavor.1501.t: "まだ灯る明かり"
 latria_sexual_frustration_flavor.1501.desc.dead: "短剣が手から滑り落ち、床を打つ音に扉の外の足音が止まった。扉が開き、誰かが傍らにしゃがんで私の名を呼ぶと、振り返って助けを呼ぶように言った。灯りは元の場所にあるのに、来た人の顔がよく見えない。\n\n聞こえていると皆に伝えたくて唇を動かしたが、声は出なかった。一人で何度も思い返していた言葉が、今は一文さえ最後まで思い出せない。誰かが私の手を握り、目を開けられるかと尋ねる。私はその人の背後の扉を見つめることしかできない。\n\nさらに多くの足音が部屋へ駆け込んでくる。音の方へ顔を向けようとしたが、扉のそばの人影はもうぼやけ、やがて灯りさえ見分けられなくなった。"
 latria_sexual_frustration_flavor.1501.desc.survived: "目を覚ますと寝衣は着替えさせられ、傷も丁寧に手当てされていた。枕元の人は私が目を開けたのを見ると、立ち去ろうとしていた従者をすぐに呼び止めた。物音に気づいた誰かが間に合うように扉を開けたと聞いた。短剣はもう片づけられている。\n\n身を起こそうとしたが、枕から離れるより先に痛みで動けなくなった。その人が掛け物の端を整え、水が欲しいかと尋ねた。私はうなずきながら、また机の上の出していない手紙に目を向けた。数枚の紙はまだそこに重なり、一番上には何度も書き直した呼びかけが見えていた。\n\n杯が唇に添えられ、私は一口だけ飲んだ。枕元で見守る人は離れず、私が落ち着いて横になるのを待ってから、そっと杯を置いた。"
 latria_sexual_frustration_flavor.1501.desc.severe: "意識を取り戻すと、まず枕元で声をひそめて話すのが聞こえた。こんな傷が治るのかと誰かが尋ねると、答える人は少しためらい、きれいな布をもっと持ってくるように言った。誰なのか見ようと体を向けかけたが、少し動いただけで声も出ないほど痛んだ。\n\n短剣はもう手の届く所になく、寝台脇の小さな机まで遠ざけられていた。起こしてほしいと頼んだが、傍らの人は枕を高くしただけで、今は横になっているようにと勧めた。窓の外の空の色は変わっていたが、私はまだ寝返りばかり打った夜や、届かないままの返事を思い出していた。\n\n寝具を整えようと手が伸びてきた。ゆっくりしてほしいと頼もうとしたが、言い終わる前に敷布を握りしめていた。"
 latria_sexual_frustration_flavor.1501.a.dead: "何もかも…暗くなっていく…"
 latria_sexual_frustration_flavor.1501.a.survived: "痛い…"
 latria_sexual_frustration_flavor.1501.a.severe: "触らないでくれ…痛い…"

 latria_sexual_frustration_flavor.1502.t: "空の杯"
 latria_sexual_frustration_flavor.1502.desc.dead: "杯は空になっていた。寝台の脇に伏せたまま、私は扉の開く音を聞いた。入ってきた人はまず私の名を呼び、机の上の物を見ると振り返って声を上げた。扉を閉める余裕もないようだった。廊下で誰かが走り出し、部屋へ入ってくる風が書きかけの手紙を揺らした。\n\n最後の一文は半分しか書いていなかった。筆が紙の脇に置いてあることも、まだ覚えている。誰かが私の肩を支え、何を飲んだのかと尋ね、もう少し持ちこたえるようにと言った。机の方を見て、伝えきれなかった言葉を書き足したいと思ったが、目の前に垂れた紙の端にさえ手が届かなかった。\n\nその人はまだ私を呼んでいるが、声は次第に遠のいていく。手紙の文字はもう読めず、一声も答えることができなかった。"
 latria_sexual_frustration_flavor.1502.desc.survived: "飲んだ毒は私の命を奪わなかった。目を覚ますと、部屋にはきれいな水を張った鉢が置かれていた。寝台のそばには長く付き添っていた人が座っていた。私が目を開けると立って周りに声をかけ、また振り返って、この部屋がわかるかと尋ねた。\n\n机の杯は片づけられ、書きかけの手紙は本の下に挟まれていた。手を伸ばして取ろうとして、寝台の端へ少し寄るだけでもひどく骨が折れることに気づいた。付き添いの人が水を差し出し、飲み終えるのを待って、手紙を誰に渡せばよいかと尋ねた。私はのぞいている半行の文字を見つめ、何も答えなかった。\n\n窓の外では、もう人が動き始めていた。いつもなら今ごろしているはずのことを思い出す。けれど枕に身を預け、従者が扉の外で面会に来た人を帰す声を聞くことしかできない。"
 latria_sexual_frustration_flavor.1502.desc.severe: "毒に命を奪われはしなかったが、以前のように一人で起き上がることは、いまだにできない。誰かが朝食を運び、着替えを寝台のそばに置いた。手を伸ばして初めて、いつも使う椀さえ今はしっかり持てないとわかった。\n\n従者が袖口を整え、一口ずつ食べ物を運んでくれる。どれだけ寝ていたのか尋ねようとしたが、途中で言葉を止めて休まなければならなかった。机には新しい手紙がいくつかたまっていた。読み上げようかと従者に聞かれ、私はまず、あの見慣れた名前がないか探してほしいと頼んだ。\n\n従者は一通ずつ確かめ、そっと首を横に振った。手紙の束を眺めながら、椀を少し遠ざけようと手を上げたが、それにも誰かがかがんでくれるのを待たねばならなかった。"
 latria_sexual_frustration_flavor.1502.a.dead: "声が…出ない…"
 latria_sexual_frustration_flavor.1502.a.survived: "苦しい…水を…"
 latria_sexual_frustration_flavor.1502.a.severe: "手を上げることすらできない…"

 latria_sexual_frustration_flavor.1503.t: "川岸で"
 latria_sexual_frustration_flavor.1503.desc.dead: "川岸はもう見えず、遠くで誰かが叫ぶ声だけが聞こえる。さっきまでは私の名を呼んでいるとはっきりわかったのに、今は途切れ途切れの音しか届かない。そちらを見ようとしても、目の前で揺れる光に遮られ、岸辺の木々が見分けられない。\n\n住まいを出たとき、灯りはまだ消していなかった気がする。机の本も開いたままだった。同じ頁をずっと見ていたのに、出る前に栞の紐をきちんと挟みもしなかった。誰かが片づけに入り、私がどこへ行ったのか尋ねるだろう。見慣れた顔が浮かび、その人にここにいると伝えたくなった。\n\nまた呼び声が届いたが、私は答えられなかった。目の前の光が暗くなり、灯りをつけたままのあの部屋も、次第にはっきりと思い浮かべられなくなった。"
 latria_sexual_frustration_flavor.1503.desc.survived: "川から助け上げられ、目を覚ますと私は岸辺にうずくまり、誰かが外套で包んでくれていた。傍らの人は私が目を開けたのを見ると、急いで遠くへ手を振り、しゃがんで声がよく聞こえるかと尋ねた。衣の裾からはまだ川の水が滴り、寒さで返事ができなかった。\n\n担架を取りに人をやったから、急に立ち上がらないようにと声がした。住まいへ戻る小道を見つめ、一人でここへ来る間も何度も考えていたあの言葉を思い出した。誰に知らせればいいのかと傍らの人に聞かれ、私は一つの名前を口にした。聞こえなかったかもしれないと、もう一度小さく繰り返した。\n\n外套がもう一度、隙間なく巻き直された。誰かが伝言を届けると約束し、残った人は私の肩を支えながら、小道の足音を一緒に待ってくれた。"
 latria_sexual_frustration_flavor.1503.desc.severe: "岸へ運び上げられたときのことは、早く戻ろうと急かす声しか覚えていない。次に目を覚ますと、濡れた服は着替えさせられ、寝台の周りに何人か立っていた。どれだけ意識を失っていたのか尋ねようとしたが、咳が込み上げ、呼びかけすら最後まで言えなかった。\n\n枕元では肺の病について声をひそめて話し、窓を閉めるよう誰かに頼んでいた。額の布は何度か取り替えられたが、昼なのか夜なのか、どうしてもわからなかった。時折意識がはっきりすると、見知った人が入ってこないかと扉を見てしまう。けれどそこには水を運ぶ従者がいるだけで、何が必要かと静かに尋ねてくる。\n\n私は首を横に振り、枕に寄りかかって体を落ち着かせようとした。枕元の人が支えようと手を伸ばした途端、まだ口にしていない言葉が、また咳に遮られた。"
 latria_sexual_frustration_flavor.1503.a.dead: "寒い…"
 latria_sexual_frustration_flavor.1503.a.survived: "まだ…生きているのか？"
 latria_sexual_frustration_flavor.1503.a.severe: "息が…できない…"

 latria_sexual_frustration_flavor.1504.t: "崖の下で"
 latria_sexual_frustration_flavor.1504.desc.dead: "崖下に横たわり、山道を捜し歩く人々の呼び声を聞いていた。誰かが私の名を呼び、別の人がもっと下を捜すよう仲間を促している。近くを小石が転がり落ちた。見つけてもらおうと手を上げたかったが、手は体の脇にあるままで、衣の端さえ動かなかった。\n\n山影が空の大半を遮り、住まいを出てからどれほど経ったのか思い出せなかった。出がけにいつ戻るのかと聞かれ、何気なく時刻を答えた。今は自分が何と言ったのか思い出せない。足音が近づき、私は口を開いたが、やはり声は出なかった。\n\nようやく誰かが近くで足を止め、身をかがめて私を呼んだ。その人の顔は見えず、頭上にわずかに残った空の色さえ、もう見分けられなかった。"
 latria_sexual_frustration_flavor.1504.desc.survived: "崖下で目を覚ますと、誰かが傍らにしゃがんで私を呼んでいた。私が反応すると、その人は振り返って手を振り、仲間に山道を下りてくるよう合図した。ここはどこかと尋ねかけて、頭上の崖に見覚えがあると気づいた。それきり、もう見上げる勇気が出なかった。\n\n転落で負った傷のため起き上がれず、少し動くだけでも手を止めて息を整えねばならなかった。その人は担架を待つように言い、傍らに落ちた上着を拾って私に掛けてくれた。留め具を見つめ、出る前に鏡の前で整えたことを思い出した。あのときも、返事のない誘いの手紙が気にかかっていた。\n\n足音がすぐそばまで来て、何人かが私をどう持ち上げるか小声で相談していた。手助けになればと体を向けようとしたが、動くより先に叫び声が出た。"
 latria_sexual_frustration_flavor.1504.desc.severe: "崖下で目を覚ますと助けに来た人々が周りにいたが、誰も口を開こうとしなかった。その中の一人に見覚えがあり、そろそろ戻るのかと尋ねた。その人は私に上着をきちんと掛け、山道へ目をやると、担架を運ぶ人を急かした。\n\n起き上がろうとするとすぐ誰かに支えられ、動かないようにと言われた。脚へ目を落とすと、傍らの人がためらいがちに、これからは以前のように歩けないかもしれないと言った。傍らに落ちた靴にはまだ泥がついていた。それを見つめ、廊下で返事を待った幾晩ものことを思い出した。\n\nほかに何か必要かと尋ねられた。靴を拾ってほしいと言うつもりが、先に住まいに何か知らせが来ていないかと尋ねていた。しばらく誰も答えなかった。"
 latria_sexual_frustration_flavor.1504.a.dead: "何も聞こえない…"
 latria_sexual_frustration_flavor.1504.a.survived: "動けない…痛い…"
 latria_sexual_frustration_flavor.1504.a.severe: "私の脚が…"

 latria_sexual_frustration_flavor.1505.t: "押し破られた扉"
 latria_sexual_frustration_flavor.1505.desc.dead: "寝室の扉が破られたとき、誰かが切羽詰まった声で私の名を呼ぶのが聞こえた。廊下の明かりが部屋へ差し込み、何人かが扉のそばに集まったが、先頭の人に助けを呼びに行くよう急かされた。手紙はまだ寝台の脇にあった。来た人に知らせたかったが、もうそちらへ目を向けることさえできなかった。\n\n誰かが近づいてきた。その声はとても聞き慣れていて、一言答えたくなった。言葉の意味はわかるのに、どうしても声が出ず、その人の口が動き続けるのを見ているだけだった。扉の外で誰かが何かを尋ねたが、その人は振り返らず、近くに身をかがめたまま、私のわずかな反応を待っていた。\n\nもう一度その顔をはっきり見たかったが、目の前は暗くなるばかりだった。戸口の光が消え、やがて呼び声も聞こえなくなった。"
 latria_sexual_frustration_flavor.1505.desc.survived: "寝室の扉が破られ、私は間一髪で助けられた。寝台に横たわる私には、曲がった閂が見える。従者は椅子を運んできて扉の外に控えていた。誰かが枕を整え、話せるかと尋ねた。私はかすれた声で一言答えるだけだった。\n\n縄はもうなく、寝台脇の手紙も別の場所へ移されていた。体を返して探そうとしたが、傷の痛みで途中で止まった。世話をする人は私の視線を追い、手紙を取って見える場所へ置いた。末尾の書きかけの名前からは、まだ目を離せなかった。\n\n私は手を上げ、今は尋ねないでほしいと示した。その人はうなずいて水を近くに置き、私が少し落ち着くのを待ってから掛け物を整えた。"
 latria_sexual_frustration_flavor.1505.desc.severe: "枕元で誰かが私の名を呼んでいる。返事を待っているのはわかるが、何と言えばいいのかわからない。寝室の調度はどれも見覚えがあるのに、窓辺の椅子だけは場所が変わったように思えた。誰かが私の袖を直してくれるまで、私は椅子をじっと見ていた。\n\n誰かが体を洗って着替えさせ、食事も運んできた。近づいてくる匙を見つめ、傍らから声をかけられてようやく口を開けることを思い出した。誰かがあの手紙のことを口にすると、別の人が寝台脇の箱へちらりと目をやった。私もそちらを見たが、尋ねようとした途端、何を聞きたかったのか忘れてしまった。\n\n箱の蓋はもう閉じていた。枕元の人がまた私の名を呼んだ。今度は顔を向けると、目の前の人が手を止めるのが見えた。"
 latria_sexual_frustration_flavor.1505.a.dead: "私は…"
 latria_sexual_frustration_flavor.1505.a.survived: "少し…息をつかせてくれ…"
 latria_sexual_frustration_flavor.1505.a.severe: "誰か…私を呼んでいるのか？"
