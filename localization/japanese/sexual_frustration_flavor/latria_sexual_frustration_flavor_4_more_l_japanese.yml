l_japanese:
 latria_sexual_frustration_flavor.1311.t: "家人が起きる前"
 latria_sexual_frustration_flavor.1311.desc: "家人より先に、寝衣を腿の上までたくし上げ、手を脚の間に押し当てたまま目覚める。退けない。夢がまだ私に載っている。この部屋にいなかった誰かの重み。身体は、夢が始めたことを終えるつもりでいる。\n\n目を閉じたまま、続けさせる。息が短くなり、手の付け根が、今では覚えた遅い拍を刻む。歯の裏に名がある。言わない。廊下の板が従者の足で軋むのに、言うわけにはいかない。\n\n砕けたとき、指を濡らしたまま、腰の下の敷布を湿らせて、静かに横たわる。足音は扉を過ぎて遠ざかる。寝衣を下ろすと、布が張りつく。"
 latria_sexual_frustration_flavor.1311.a: "終えさせて、それから一日の着替えをしよう。"
 latria_sexual_frustration_flavor.1311.b: "手を退け、鐘まで静かに横たわろう。"
 latria_sexual_frustration_flavor.1311.c: "起きて洗い、しばらく疼きと座っていよう。"

 latria_sexual_frustration_flavor.1312.t: "梨の木の接ぎ木"
 latria_sexual_frustration_flavor.1312.desc: "庭は昨夜の雨でまだ濡れていて、一週間避けてきたその人が、梨の木の新しい接ぎ木を見せてくれる。相手の指が私の指を覆い、切り口に沿って動かす。見本が終わっても、どちらも手を離さない。\n\n手首に当たる親指の脈が分かる。生垣の陰では、家人が二人、鞍について言い争っている。私が少し顔を向け、相手がそれに応じれば、私たちは園芸と間違えようのないことを始めるだろう。\n\n秋までには接ぎが合うと相手は言う。手はまだ私の手にある。枝が一滴、袖に落ちる。拭わない。"
 latria_sexual_frustration_flavor.1312.a: "この木の下で、望みをはっきり言おう。"
 latria_sexual_frustration_flavor.1312.b: "教えの礼を述べ、身を退こう。"
 latria_sexual_frustration_flavor.1312.c: "留まり、かわりに一つの本当の話をしよう。"

 latria_sexual_frustration_flavor.1313.t: "卓を隔てて"
 latria_sexual_frustration_flavor.1313.desc: "杯は二度回り、広間は誰か一人に耳を傾けるほど静かではない。一時間、卓を隔てた同じ客を見ている。笑うときの喉の線。\n\n言うことはできる。すべてではなく、私が天候の話をしているのではないと分かるだけで足りる。隣の客に聞こえる。卓の端の執事にも聞こえる。その人は、聞かされたことをすべて家人に繰り返す。\n\n相手は杯の脚を回して、その上から私を見る。口を開く。楽師がまた始まり、言えたかもしれないことは太鼓の下に消える。"
 latria_sexual_frustration_flavor.1313.a: "聞こえるだけの声で言おう。"
 latria_sexual_frustration_flavor.1313.b: "口を閉じ、酒に任せよう。"
 latria_sexual_frustration_flavor.1313.c: "隣の客に向き直り、遊びにしよう。"

 latria_sexual_frustration_flavor.1314.t: "最初の一言"
 latria_sexual_frustration_flavor.1314.desc: "石畳が脛に跡を刻むほど長く冷たい石に跪き、言葉はもう言葉ではなくなった。心が戻るのは、この建物の中で思い出すべきでない口のことだ。開き方、そこから漏れた音。\n\n案内役は説教台で待つ。世のあらゆる告解を聞いてきた者の辛抱深さで。話すことはできる。話せば、二度と閉じられない扉になり、身体はその扉を、今夜、灯の燃えたまま開けておくことを望んでいる。\n\n最初の一言までたどり着く。二人の間の蝋燭が隙間風に傾き、蝋が鉄を伝って流れ、そこで固まるのを見ている。"
 latria_sexual_frustration_flavor.1314.a: "話し、裁きは寺院に委ねよう。"
 latria_sexual_frustration_flavor.1314.b: "告解は胸に留め、贖罪を受けよう。"
 latria_sexual_frustration_flavor.1314.c: "本を求め、震えが止まるまで読もう。"
 latria_sexual_frustration_flavor.1314.d: "朝まで徹夜の祈りを続けよう。"

 latria_sexual_frustration_flavor.1315.t: "ハンノキの藪"
 latria_sexual_frustration_flavor.1315.desc: "狩りは散り、私は存在しなかった猪を追って藪へ入った。二人きりになりたかったその人が、膝下を寛げ、手を自分に当てている私を見つけ、目を逸らさない。\n\n相手は濡れた落葉の中に跪く。私は片手を相手の髪に、もう一方を幹に突っ張り、角笛は東のどこかで鳴っている。やめるべき近さで。どちらもやめない。相手が私を口に含み、私は声を殺すために頬の内側を噛まねばならない。\n\nあとには膝が泥だらけで、腿に葉が一枚張りついている。相手は手の甲で口を拭い、猪は北へ行ったと言う。"
 latria_sexual_frustration_flavor.1315.a: "狩りは私を欠いて続けさせよう。"
 latria_sexual_frustration_flavor.1315.b: "鞍に戻り、自分の席を稼ごう。"
 latria_sexual_frustration_flavor.1315.c: "地面を読み、足跡を追おう。"

 latria_sexual_frustration_flavor.1316.t: "歪んだ印"
 latria_sexual_frustration_flavor.1316.desc: "評議会は一時間同じ請願にかかり、私は何も署名していない。卓の下で両手を膝に置き、戦役の最後の夜を、天幕を、ノックもせずに入ってきて夜番が替わるまで去らなかったあの人のことを考えている。\n\n宰相が同意かと尋ねる。同意すると答え、何に同意したのかまるで分からない。印章は指輪で温かい。蝋に押しつけると、印は歪んで出て、縁の一角で文字が二重になる。\n\n参議たちは書類を抱えて退出する。私は椅子に残り、歪んだ印を前に、部屋には他人の蝋燭の匂いがまだする。"
 latria_sexual_frustration_flavor.1316.a: "思っている相手を呼ぼう。印ごと持って。"
 latria_sexual_frustration_flavor.1316.b: "印章を置き、請願に戻ろう。"
 latria_sexual_frustration_flavor.1316.c: "評議会を呼び戻し、仕事を終えよう。"

 latria_sexual_frustration_flavor.1317.t: "余白の一行"
 latria_sexual_frustration_flavor.1317.desc: "試験場は掃き清められ、静かで、私は注解と二人きりだ。文字が落ち着かない。抑制についての同じ一行を四度読み、そのたび、それは廊下で、灯が近づく中で、手放すのが遅すぎた一組の手のことになる。\n\n自分の筆で、余白に、注解でも何でもない詩の一行を書いた。試験官がこれを見れば、何のための、誰のためのものか分かる。頁を焼くこともできる。火鉢は三歩先で、炭はまだ赤い。\n\nその行を、もっと注意深く写し直す。最後の一画で筆が震えている。"
 latria_sexual_frustration_flavor.1317.a: "詩を清書し、読まれるに任せよう。"
 latria_sexual_frustration_flavor.1317.b: "本を閉じ、敷物の上で眠ろう。"
 latria_sexual_frustration_flavor.1317.c: "注解に戻り、やり直そう。"
 latria_sexual_frustration_flavor.1317.d: "宮廷人が歌う節に、その詩を載せよう。"

 latria_sexual_frustration_flavor.1318.t: "中庭の二つの杯"
 latria_sexual_frustration_flavor.1318.desc: "宴は中庭へ流れ、最も古い友が杯を二つ持って追ってきた。誰にも言っていない。司祭にも、従者にも、当の相手にも。今夜、酒は言わずにいることを重くした。満ちた杯が重いのと同じ重さで。\n\nその手に預けて、いくらか担ってもらうこともできる。友は笑わない。忘れもしないだろう。そして広間で私を見るたび、二人の間にはこれがある。名のあるものが。\n\n友は杯を渡して待つ。背後で泉が流れ続けている。飲み干すと、氷が割れて、落ち着く。"
 latria_sexual_frustration_flavor.1318.a: "声に出して言い、預けよう。"
 latria_sexual_frustration_flavor.1318.b: "断つと誓い、今夜だけは本気にしよう。"
 latria_sexual_frustration_flavor.1318.c: "中庭が空になるまで、読み聞かせよう。"

 latria_sexual_frustration_flavor.1319.t: "庭の壁"
 latria_sexual_frustration_flavor.1319.desc: "相手は庭の壁に背を預け、裾を腰の上まで押し上げられていて、私の手は、小道を歩く誰にでも見える場所で、その脚の間にある。もう濡れている。廊下のときからだ。\n\n指二本を中へ入れると、相手は私の手首を掴み、そこへ強く押しつけ、額を私の肩に当てる。息が乱れる。壁の向こうでは庭師がまだ働いていて、鍬の刃が石に鳴る。\n\n相手は震え、爪が私の腕に食い込む。立てるようになると、裾を撫で下ろし、私の名を一度、静かに呼ぶ。すでに答えた問いのように。"
 latria_sexual_frustration_flavor.1319.a: "歩けるようになるまで、共にいよう。"
 latria_sexual_frustration_flavor.1319.b: "手を引き、よい夜をと告げよう。"
 latria_sexual_frustration_flavor.1319.c: "独りで壁の遠回りを歩こう。"

 latria_sexual_frustration_flavor.1320.t: "目録"
 latria_sexual_frustration_flavor.1320.desc: "それを捨てに寺院へ来たのに、私は跪いて目録を作っている。特定の首の匂い、あの人が立てる音、戸口で私の身体に重なった身体の正確な重み、枠に平らに当てられた手。\n\n案内役は起きて読んでいる。贖罪を求めれば与えられ、私はそれを実行し、三夜目には同じ石の上で、もっと長い同じ一覧とともに戻っているだろう。\n\nかわりに本を求める。相手は無言で一冊を渡し、親指で自分の頁を挟み、私はそれを開いたまま、一行も読まない。"
 latria_sexual_frustration_flavor.1320.a: "すべてを名指し、答えは寺院に委ねよう。"
 latria_sexual_frustration_flavor.1320.b: "贖罪を求め、一覧は手元に置こう。"
 latria_sexual_frustration_flavor.1320.c: "相手が話してくれることを聞こう。"

 latria_sexual_frustration_flavor.1321.t: "路上の三週間"
 latria_sexual_frustration_flavor.1321.desc: "三週間、路上にある。前の町から、誰とも二人きりになっていない。馬は鞍を外され、火は弱く、皆は外套にくるまって、腕一本の距離で眠っている。歯を食いしばる音が聞こえるほど近い。\n\nシャツの中に手を入れ、自分の指の骨を噛みながら、馬が動く音と、見張りの靴が落葉を踏む音を聞いている。長い時間がかかり、終わっても満足ではなく、ただ疲れ、その疲れの下に渇望がまだある。\n\n見張りが火のそばを戻っていき、私を見ない。外套を引き上げ、炭が灰色になるのを見ている。"
 latria_sexual_frustration_flavor.1321.a: "夜が許すものを取り、眠ろう。"
 latria_sexual_frustration_flavor.1321.b: "起きて、見張りの番を務めよう。"
 latria_sexual_frustration_flavor.1321.c: "腕が震えるまで、独りで素振りしよう。"

 latria_sexual_frustration_flavor.1322.t: "使節の杯"
 latria_sexual_frustration_flavor.1322.desc: "使節団の卓は十二人分に整えられ、私は相手の使節の隣に座っている。その国の者には、もてなしについて慣わしがあり、紹介のときから、魚の皿の間も、二度目の注ぎの間も、それを考えている。\n\n相手が自分で私の杯を満たす。相手の執事はそれを快く思わない。ここで間違ったことを言えば、次の船で、私の名で、私のものではない筆跡の書簡に載る。正しいことを言っても、やはり書簡に載り、私が決して入ることのない部屋で読み上げられる。\n\n相手が我々の婚姻の習俗について尋ねる。私は下手に答える。蝋燭は受け皿まで燃え尽き、どちらも新しいものを呼ばない。"
 latria_sexual_frustration_flavor.1322.a: "相手の慣わしが許す形で答えよう。"
 latria_sexual_frustration_flavor.1322.b: "よい夜をと告げて、下がろう。"
 latria_sexual_frustration_flavor.1322.c: "話を条約に移し、そこに留めよう。"

 latria_sexual_frustration_flavor.1323.t: "回廊の聖歌隊"
 latria_sexual_frustration_flavor.1323.desc: "聖歌隊が回廊で稽古をしていて、私は和音を聞いているべきなのに、それを導く司祭の口、第三行を形づくる様子を聞いている。\n\n早く来て遅く帰るようになった。聖歌は、祈りでは解けない胸の締めつけに何かをする。その代わりになっているのが何かは、分かっている。案内役は私が守る時刻に気づいていて、何も言わない。叱責より悪い。待っているということだからだ。\n\n最後の音が穹窿の上で消える。私は聖具係が鍵を持って来るまで、膝に手を平らに置いて席に残る。"
 latria_sexual_frustration_flavor.1323.a: "共に歌い、音に運ばせよう。"
 latria_sexual_frustration_flavor.1323.b: "戒律を守り、最後の節の前に退こう。"
 latria_sexual_frustration_flavor.1323.c: "かわりに、案内役と曲の仕組みを学ぼう。"

 latria_sexual_frustration_flavor.1324.t: "朝の鐘"
 latria_sexual_frustration_flavor.1324.desc: "敷布に絡みついたまま、そのすべてがまだ私に載っていて、寝衣は腕の下まで上がり、十分に目覚める前から手が脚の間にある。夢が去っていく。私はそれを追い、腰を上げ、隣の部屋に誰がいるかも、鐘が何時かも気にしない。\n\n勢いよく来て、腿を震わせて残る。指を中に入れたまま横たわり、静けさの中で息が大きく、敷布は私の下でぐっしょりと濡れ、空気の触れる場所はもう冷たい。\n\n朝課の鐘が始まる。濡れた敷布を引き剥がして桶に入れると、水が濁る。"
 latria_sexual_frustration_flavor.1324.a: "終えて、洗い、鐘に応じよう。"
 latria_sexual_frustration_flavor.1324.b: "敷布を剥ぎ、洗わずに去ろう。"
 latria_sexual_frustration_flavor.1324.c: "手が定まるまで、盤の前に座ろう。"

 latria_sexual_frustration_flavor.1325.t: "扉"
 latria_sexual_frustration_flavor.1325.desc: "隅で勝負が行われていて、私は扉ばかり見て三回続けて負けた。待っている相手は遅い。この広間の誰もが、私が誰か、私が誰と婚礼を交わしたか、そしてそのどちらが見ているかを知っている。\n\n腰掛けの上に立って、言うこともできる。部屋は、部屋がそうなるように静まり、朝までには、ここから海までどの広間にも、私の名が付き、そのあとに家の名が続いて、二つの名は二度と離れずに行き渡るだろう。\n\n扉が開く。酒を運ぶ従者だ。杯を差し出すと、手が定まっている。そのほうが悪い。"
 latria_sexual_frustration_flavor.1325.a: "立ち、広間の皆に言おう。"
 latria_sexual_frustration_flavor.1325.b: "座ったまま、勝負を続けさせよう。"
 latria_sexual_frustration_flavor.1325.c: "友を探して、そのそばに座ろう。"

 latria_sexual_frustration_flavor.1326.t: "勘定"
 latria_sexual_frustration_flavor.1326.desc: "執事が勘定、地図、そして私の務めの一覧を並べ、私はそのどれも読んでいない。春に通った町の、ある扉のことを考えている。その暗がりの向こうで、誰かが私の名を二度呼び、掛け金が上がった、そのことを。\n\n為すべきことは多く、為すのは私だ。筆を浸し、最初の数字を書く。誤っている。あまり強く打ち消すので先が裂け、墨が欄を横切る。\n\n筆を整え、やり直す。窓の外では守備隊が訓練中で、号令が拍を刻んでいる。"
 latria_sexual_frustration_flavor.1326.a: "勘定を置き、あの町へ使いを出そう。"
 latria_sexual_frustration_flavor.1326.b: "筆を置き、帳簿を取り上げよう。"
 latria_sexual_frustration_flavor.1326.c: "蝋燭が揺れるまで、一覧を片づけよう。"

 latria_sexual_frustration_flavor.1327.t: "高み"
 latria_sexual_frustration_flavor.1327.desc: "夜明けから馬を走らせ、草は四方に空で、木もなく、乗り手もなく、空の縁まで何もない。身体は鞍の二日目から訴え、走ること自体はそれを静めず、ただ悪くした。\n\n高みの頂で馬を止め、膝下に手を入れ、数回の激しい手で終える。風が顔を打ち、見渡す限り誰もおらず、その間ずっと馬は私の下で動いている。\n\n紐を結び、皆のところへ下りる。従兄弟がなぜ笑っているのかと尋ねるので、良い馬だと答える。"
 latria_sexual_frustration_flavor.1327.a: "草原が与えるひとときを取ろう。"
 latria_sexual_frustration_flavor.1327.b: "進み、心から追い出そう。"
 latria_sexual_frustration_flavor.1327.c: "腕が疲れるまで隼を放とう。"

 latria_sexual_frustration_flavor.1328.t: "徹夜の祈り"
 latria_sexual_frustration_flavor.1328.desc: "課のあとから寺院におり、まだここにいる。灯は二度満たされ、油は粗末な搾りの匂いがする。膝は痛みから一種の痺れに移り、渇望はどこへも行かず、落ち着いて居心地よくしている。\n\n徹夜の祈りは人を空にするためのものだ。かわりに渇望に場所を与えた。暗い部屋が、そこに立つものに形を与えるように。行くことはできる。扉に鍵はなく、町は遠くない。\n\n詩篇を初めから唱え直す。声は定まって出て、それを少し憎む。"
 latria_sexual_frustration_flavor.1328.a: "祈りを断ち、町へ出よう。"
 latria_sexual_frustration_flavor.1328.b: "空が灰色になるまで祈りを続けよう。"
 latria_sexual_frustration_flavor.1328.c: "祈祷書を終いまで読もう。"

 latria_sexual_frustration_flavor.1329.t: "四行"
 latria_sexual_frustration_flavor.1329.desc: "寝衣のまま窓辺にいて、窓敷居には、書いて出していない手紙がある。四行。最後の一行は、昼には使わぬ言葉で私の望みを言っている。墨は乾き、封は切られていない。\n\n扉の従者に渡すこともできる。焼くこともできる。すでに三通焼き、灰はまだ火鉢にある。身体は焼くことに興味がない。渡したあとに来る答えを欲している。\n\n蝋燭は燃え尽きかけ、蝋が縁を越えて流れている。最後の一行をまた読み、紙が手の中で震える。"
 latria_sexual_frustration_flavor.1329.a: "手紙を従者に渡そう。"
 latria_sexual_frustration_flavor.1329.b: "火鉢に入れ、寝よう。"
 latria_sexual_frustration_flavor.1329.c: "燃え残りが消えるまで、窓辺に座っていよう。"

 latria_sexual_frustration_flavor.1330.t: "国境の条項"
 latria_sexual_frustration_flavor.1330.desc: "師の書斎は埃と冷たい墨の匂いがし、私は条約の一言も頭に入れていない。相手は国境の条項を説明し、私はその手、指の側面の墨、頁を押さえる具合を見ている。\n\n相手は私の親ほどの年に達し、その倍は注意深く、そこに何もなく、ある必要もない。渇望は許可を求めない。相手が頁をめくり、爪で次の条項を探すあいだ、私の中に座っている。\n\n理解したかと尋ねられ、はいと答える。相手は問いが要するよりひととき長く私を見て、それから頁に戻る。"
 latria_sexual_frustration_flavor.1330.a: "かわりに国境についての詩を書こう。"
 latria_sexual_frustration_flavor.1330.b: "告解を聞いてくれるよう頼もう。"
 latria_sexual_frustration_flavor.1330.c: "条項を一言一句、相手に返して言おう。"

 latria_sexual_frustration_flavor.1331.t: "遅い一時間"
 latria_sexual_frustration_flavor.1331.desc: "家は眠っていて、私は眠っていない。もう一時間になる。寝衣は腰の上まで上がり、指は、決めもしないうちに自分の濡れた場所を探し当てている。そこに留め、廊下からこの方ずっと回っている思いを来させる。襟を直そうと身を寄せ、あとになっても退かなかったあの人。\n\n身体が教えたとおりに、押して、回す。遅く、それから遅くなく。壁に当たらぬよう、もう一方の手を寝台の頭板に平らに置く。下に使用人の扉があり、軋む階段がある。やめない。息が乱れ、音を呑むために顔を枕に押しつける。\n\n砕けて、指を自分に当てたまま横たわり、その下で脈が続く。階段がもう一度軋んで、落ち着く。寝衣を下ろすと、布は湿って張りつく。"
 latria_sexual_frustration_flavor.1331.a: "終えさせて、鐘の前に着替えよう。"
 latria_sexual_frustration_flavor.1331.b: "手を退け、静かに横たわろう。"
 latria_sexual_frustration_flavor.1331.c: "洗い、疼きが鈍るまで座っていよう。"

 latria_sexual_frustration_flavor.1332.t: "冷たい身廊"
 latria_sexual_frustration_flavor.1332.desc: "自分を空にするために寺院へ来て、渇望がただ深く落ち着くまで冷たい石に跪いた。今やそれには顔がある。宴で告解したあの人、首を傾けて聞いていた様子、杯の上で親指が動いた様子。手は法衣の下にあり、側廊の暗がりでは誰にも見えない。\n\n祭壇の灯に目を据え、指に任せる。遅く、顎は固く。屏風の向こうで扉が開き、侍僧が夜課のために入り、石畳に足音を立てる。やめるべきだ。手はやめない。額を組んだ手に押しつけ、歯の間から息をする。\n\n過ぎ去り、私を空洞にして震わせて残す。侍僧が詩篇を始める。脚が痺れ、灯だけが見られるようになるまで、跪いたままでいる。"
 latria_sexual_frustration_flavor.1332.a: "告解で名を挙げ、贖罪を受けよう。"
 latria_sexual_frustration_flavor.1332.b: "空が灰色になるまで祈りを続けよう。"
 latria_sexual_frustration_flavor.1332.c: "祈祷書を終いまで読もう。"

 latria_sexual_frustration_flavor.1333.t: "緑の窪地"
 latria_sexual_frustration_flavor.1333.desc: "望んだ相手を狩りから連れ出し、葉を通して光が緑に差す窪地へ入った。私の膝下は寛げられ、相手の手が私に、私の手は相手の裾の下にあり、どちらも鹿のせいにするふりをしない。もう濡れている。渡しで手首を掴んでからずっと。\n\n指を中へ入れると、相手は息を呑み、自分の口で私の口を強く覆い、空いた手を私の襟に握る。角笛が木々の間を鳴り、狩りはどこか近くで向きを変える。やめない。相手は私の手に身を揺すり、息が頬に短く散る。\n\n相手は震えて静まり、私の手首を握る。角笛は東へ薄れる。震える手で裾を整え、髪から葉が一枚落ちる。"
 latria_sexual_frustration_flavor.1333.a: "狩りは私たちを欠いて続けさせよう。"
 latria_sexual_frustration_flavor.1333.b: "鞍に戻り、自分の席を稼ごう。"
 latria_sexual_frustration_flavor.1333.c: "遠回りして戻り、自分を冷まそう。"

 latria_sexual_frustration_flavor.1334.t: "条約の余白"
 latria_sexual_frustration_flavor.1334.desc: "書斎は冷たく、条約は開かれてあり、同じ条項を三度読んだ。それをもたらした使節は去ったが、記憶は去らない。廊下で、相手を壁に押しつけ、手を上衣の下へ差し入れ、相手の口が私の肩で開き、二人で足音を窺っていた、あの時間。\n\n卓の下で、手が膝へ滑り出している。退けて、頁に平らに押しつける。掌の下で墨は乾いている。余白に思っていることを書けば、書記が清書して、朝までに回し始めるだろう。\n\n筆を浸し、条項を正しくまた書く。最後の一字までに手は定まらない。蝋燭が揺らぐので、芯を整える。"
 latria_sexual_frustration_flavor.1334.a: "相手に何を望むか、はっきり言おう。"
 latria_sexual_frustration_flavor.1334.b: "達者でと告げ、身を退こう。"
 latria_sexual_frustration_flavor.1334.c: "盤を出して、手が静まるまで指そう。"

 latria_sexual_frustration_flavor.1335.t: "壁掛の陰"
 latria_sexual_frustration_flavor.1335.desc: "宴は賑やかで、楽師は曲の間で、私は一晩中見ていた相手を、光の届かぬ壁掛の陰へ連れ込んだ。手は相手の衣の下へ上がり、相手は壁に背を預け、声を殺すために自分の唇を噛んでいる。もう一方の手が相手の口を覆う。強くはなく、ただ足りるだけ。\n\n布の向こう、三フィートの先に広間がある。杯が割れ、誰かが笑う。相手は私の指に身を揺すり、目を閉じ、震えが通り抜けるのを感じる。息が掌に熱く速く当たる。\n\n相手は少し崩れ、私は支える。壁掛の向こうで楽師がまた始める。相手は衣を整えて先に抜け出し、私はしばらく待ってから後を追う。"
 latria_sexual_frustration_flavor.1335.a: "滑り込んで、席に戻ろう。"
 latria_sexual_frustration_flavor.1335.b: "もうひととき、布の陰に留まろう。"
 latria_sexual_frustration_flavor.1335.c: "友を探して、そのそばに座ろう。"
