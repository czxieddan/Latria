l_japanese:
 latria_sexual_frustration_flavor.1401.t: "封じられた印章"
 latria_sexual_frustration_flavor.1401.desc.female: "寝衣をまとい、寝台のそばで手紙を何度も折り直している。署名はなく、呼びかけも消してあるが、折り目だけは隠しようもないほど深い。机の隅には温めた封蝋がある。印章さえ押せば、今夜のこの思いは別の人の手に渡る。\n\n手紙を開き、会う約束の一行で読むのをやめる。時刻も場所も、どの門を通るかまで明記してある。昼間なら何気なく書き留めた雑談だと言えた。だが今は使者が廊下で待っている。もうふさわしい言い訳が見つからない。\n\n戸の外で衣擦れがした。印章を取り上げるが、もう片方の手は手紙の口を押さえたままだ。誰も中へ呼ばない。"
 latria_sexual_frustration_flavor.1401.desc.male: "寝衣で寝台の端に座り、印章を握っている。机の手紙は最後の行まで書かれ、墨も乾いているが、署名の場所だけが空いている。従者は封蝋を用意し、窓も閉めてくれた。なぜまだ休まないのかとは尋ねずに去っていった。\n\nそこにある言葉はすべて知っている。受け取る人がどう読むかも分かっている。名前を添えて印を押せば、もうこの誘いを一時の冗談とは言えない。心の中で何度も直した文章は、紙に載ると逃げ道を一つも残してくれなかった。\n\n長いこと印章を握っていた。向きを正し、戸の隙間の明かりを見る。それでもまだ使者を呼んではいない。"
 latria_sexual_frustration_flavor.1401.desc: "印章を取り上げては置き、いつまでも封をしない。手紙の口はきちんと折られ、封蝋も用意されている。机でほかにすることは何もない。それでも紙の角をもう一度なでる。まだ折り目に手間をかける必要があるかのように。\n\nあの言葉はもう書いてある。朝の使者は宛先を尋ねるだけで、送るべきかどうかを代わりに決めてはくれない。住所を二度読み、返事が来るかもしれないと思う。同時に、何の答えも来ないかもしれないとも思う。\n\n匙の中の蝋が固まり始めた。火に近づけると、空いている手がまた手紙を机に押さえつけた。"
 latria_sexual_frustration_flavor.1401.a: "手紙を書き上げ、印を押す。"
 latria_sexual_frustration_flavor.1401.b: "印章をしまい、思いを抑えて横になる。"

 latria_sexual_frustration_flavor.1402.t: "最後の宴"
 latria_sexual_frustration_flavor.1402.desc.accepted: "宴も終わりに近いのに、皆はまだ情人や婚約、昔の歓びを語っている。外套を留めながら振り向き、話の結末を付け足す者がいる。聞いていた者たちは笑い、従者に酒を足すよう頼む。ここでは、そうした話に声を潜める必要はない。\n\n立ち上がっていた私は、聞き覚えのある地名にまた腰を下ろした。私にもその土地の思い出がある。ただ、これほど軽やかに語ったことはない。ひと言差し挟むと、隣の客は杯を置いて続きを待った。胸にためていた言葉が、急に口元まで押し寄せる。\n\n楽師は弦楽器を片づけている。主人が広間の戸へ目をやるが、私はまだ椅子の背の上着を取っていない。"
 latria_sexual_frustration_flavor.1402.desc.strict: "宴の席で、密かな情事のために失脚した貴族の話が出た。回されていた酒壺が止まる。ある者はその家系を尋ね、別の者は婚約も破談になるだろうと小声で言う。末席で私は、他人の暮らしを一つずつ裁定する声を聞いている。\n\n私の名は出ていない。それでも隣の客に、なぜそんなに静かなのかと問われると、いつもの笑みさえ返せなかった。酒の力を借りて明かすつもりだった思いも、今ここで話し始めたら、二度と取り戻せなくなりそうだった。\n\n従者が空の皿を取りに来た。手をよけたが、杯は握ったままで、最後のひと口をいつまでも飲み干せない。"
 latria_sexual_frustration_flavor.1402.desc: "従者が杯や皿を片づけるのを見て、ようやく宴の終わりに気づいた。戸口では何人かが別れを告げ、主人は馬車の支度を尋ねている。私の酒はまだ半分以上残っている。話したかったことを口にする間は、とうとう見つからなかった。\n\n隣の客が外套を整えながら、一緒に出るかと尋ねた。うなずいた後で、私はまた昔の話を持ち出した。すでに語ったはずの冒頭から繰り返す。このひと言を正しく言えさえすれば、今夜がこのまま終わらずに済むかのように。\n\n相手の手が留め具の上で止まった。私は杯を押しやった。広間の響きが、先ほどよりずっとはっきり聞こえた。"
 latria_sexual_frustration_flavor.1402.a: "残った客を引き留め、悩みを繰り返し語る。"
 latria_sexual_frustration_flavor.1402.b: "思いを抑え、主催者に礼を述べて辞去する。"

 latria_sexual_frustration_flavor.1403.t: "立会人のいない告白"
 latria_sexual_frustration_flavor.1403.desc.favors: "一人で祭壇の前に残り、最後の侍者が静かに戸を閉める音を聞いた。聖典はまだ台の上に開かれ、肉体の歓びを説く頁に栞紐が挟まれている。これらの教えは読んだことがある。この渇望を罪と見なせと、信仰が求めているわけではない。\n\nそれでも、誰もいなくなると何から話せばよいのか分からなかった。昼間に用意した問いは整いすぎていて、会いたいと願い続けている人のことを巧みに避けていた。その一文を唱え直してから口をつぐむ。そして、呼び名の陰に隠していた本当の名を、小さく口にした。\n\n聖堂に答えはない。聖典から手を離し、そのまま跪いて、戸の下で薄れていく光を見ていた。"
 latria_sexual_frustration_flavor.1403.desc.condemns: "一人で祭壇に跪く。襟元は整っているのに、祈りは何度も同じところで途切れる。最後に出ていく侍者が灯りを残すかと尋ね、私はうなずいた。今は一つの灯と、読み終えていない聖典だけが残っている。\n\n戒律はすべて覚えている。悔い改め方さえ、とうに身についている。それなのに欲を捨てるくだりに至るたび、破棄していない手紙を思い出す。しまった場所を忘れたわけではない。部屋を出る前に、誰も開かない本の頁へ、わざわざ隠してきたのだ。\n\n急かす者がいない分、次の一句はいっそう唱えにくい。戸の外に交代の足音が聞こえた。私は頭を垂れ、また初めから読み直した。"
 latria_sexual_frustration_flavor.1403.desc: "聖堂の足音がすべて消えるのを待っても、祭壇を離れなかった。長椅子は整えられ、台の脇には聖典の栞紐が垂れている。戸口には侍者が片づけ忘れた空の杯が一つある。人がいた間は、どうしても言葉が出ない気がしていた。\n\n今は誰もいない。私はあの思いを初めから話してみた。途中まで来て、自分がまた聞き慣れた言い回しで隠していることに気づく。いったんやめ、戸に目を向け、それから小声で言い直した。今度はその人の名を省かなかった。\n\n光が膝の前に落ちている。すぐには立ち上がらず、空の聖堂であの言葉がゆっくり静まるのを聞いていた。"
 latria_sexual_frustration_flavor.1403.a: "これ以上禁欲を誓わず、自分の選択を認める。"
 latria_sexual_frustration_flavor.1403.b: "欲望を抑え、朝の祈りまでひざまずいている。"

 latria_sexual_frustration_flavor.1404.t: "欲望を言葉に"
 latria_sexual_frustration_flavor.1404.desc.lustful: "衣服を脱ぎ、寝室の銅鏡の前に一人で立っている。上着は椅子の背にあり、従者はもう去った。閂は自分の手で下ろした。鏡の中の人は目をそらさない。私もようやく、気を紛らわす小さな用事を慌てて探すのをやめた。\n\nこのところ、あの人に会いたい気持ちを疲れと呼び、憂鬱と呼び、宴の後の不眠と呼んできた。言い換えるたびに机の手紙は一行増えたが、ずっと送られずにいる。自分が何を待っているかは分かっている。朝になると書いた言葉を消すことにも、もう飽きた。\n\n机に新しい紙が一枚ある。そこを見つめ、書き出しにあれほどの儀礼的な挨拶が必要なのか、初めて真剣に考えた。"
 latria_sexual_frustration_flavor.1404.desc.chaste: "衣服を脱いだまま寝台の端に座り、両手を固く組む。衣服はすぐそばにあり、祈祷書も出したままだ。慣れた一節を読んで休むつもりだったのに、同じ行で長く止まり、外の時を告げる声まで一度数え違えた。\n\n今も誓いを守っているのは、誰かと親しくなりたい気持ちが消えたからではない。その人の名が浮かんだ途端、雑念などないと言って済ませることはもうできないと分かった。誓詞の頁を開き、いつもよりゆっくり読む。一句ごとに、それが本当に自分の選択なのかを確かめたかった。\n\n頁が指の間で止まった。戸の外はすでに静かだ。本を閉じることも、まだ読んでいない言葉を急いで唱え終えることもしなかった。"
 latria_sexual_frustration_flavor.1404.desc: "夜はもう深い。寝室に座り、私はまだあの人に会いたいのだと、ようやく認めた。机の手紙は何度も直してある。そのたび最も大事な一句を消し、天気や旅程、どうでもよい挨拶だけを残してきた。\n\n何枚かの紙を順に広げ、ほとんど同じ書き出しを見る。どれも体裁は整っている。だが受け取る人には、なぜ私がいつまでも灯りを消せないのか伝わらない。今夜また一通書くとしても、呼びかけだけ変えて進展があったことにはできない。\n\n白紙の脇に筆を置いた。外でまた時を告げる声がした。今度はそれを口実に、自分を寝かせようとはしなかった。"
 latria_sexual_frustration_flavor.1404.a: "渇望を認め、今夜は抗うのをやめる。"
 latria_sexual_frustration_flavor.1404.b: "再び衣服を着て、思いを抑える。"

 latria_sexual_frustration_flavor.1405.t: "年代記の一頁"
 latria_sexual_frustration_flavor.1405.desc.emperor: "編年史家が机に身をかがめ、何を書き残すべきか私が決めるのを待っている。私は礼服でその背後に立っている。つい先ほどまで口述していたのは恩賞と徴発の話で、墨も乾いていない。明日の儀式の段取りに差しかかったところで口を止め、誰も記さない長い夜のことを話し始めた。\n\n筆はすぐには追いつかなかった。戸口の近侍が立ち姿を変えた。皆に聞こえたことは分かっている。昼間にいつもどおり廷臣と会っていれば、この苦しみを寝室にしまっておけると思っていた。だが、そのまま記すのかと編年史家に尋ねられると、不要だとはもう軽く言えなかった。\n\n新しい頁が広げられた。筆先が空白の上で止まり、皆が先ほどの言葉の続きを待っている。"
 latria_sexual_frustration_flavor.1405.desc.adventurer: "筆記者が机に座り、この旅も年代記に入れるかと尋ねる。渡し場や宿、何度かの足止めについて話すと、順に記し、次の地名を待って顔を上げた。荷物の中から、送らなかった手紙が手元にのぞいている。\n\n雨や折れた車軸のせいではない滞在もあった。ある人にもう一度会いたくて遠回りしたのに、本当の理由は仲間にずっと話さなかった。今、整然と記された道程の地名を読むと、抜け落ちていることこそ、この旅で最も振り払えなかったものだと思える。\n\n筆記者が墨をつけた。私は手紙を取り出した。開く前に、まず地図のそばで紙の角を伸ばした。"
 latria_sexual_frustration_flavor.1405.desc.clergy: "法衣を整えて書記の前に立つ。寄進や修繕を記す用意をしていた書記は、話題が変わると別の紙を取った。机の脇では聖典が開いたままだ。ちょうど昼間、人々に説いた一節が見える。\n\n誓いも欲も本物だ。一度も迷ったことのない人間として自分を語りたくはない。だが書き残せば、もう自分だけの回想ではなくなることも分かっている。書記は、あの人の名を残すかと尋ねた。戸の外に事情を悟らせまいとするような、小さな声だった。\n\n空いた一行を見る。祈りの珠はまだ手首に巻かれている。それを繰って問いから逃げることはしなかった。"
 latria_sexual_frustration_flavor.1405.desc.ruler: "書記が私の口述を待っている。礼服を着た私の脇には、評議で使った印璽がまだ置かれている。公務の話を終えた後、私は胸の底に押し込めてきた私事に触れた。戸口の従者は退出せず、部屋は急に静まった。\n\nまず古い手紙を語り、それから実現しなかった何度かの逢瀬を語った。書記の筆は先ほどより遅く、曖昧なところに来ると顔を上げる。初めは体裁のよい言葉を選んでもらうつもりだった。だが自分の言葉を読み返されると、別の話に変えてほしくなくなった。\n\n書記が書き写した半頁を差し出した。紙を受け取り、初めて何も隠さずに書かれた呼び名で視線を止めた。"
 latria_sexual_frustration_flavor.1405.desc: "長く隠していた思いを明かそうと決め、書記の机へ向かった。書記は公文書をよけ、新しい紙を広げ、どこから記すのかと尋ねた。私はある日付を告げてから口を止めた。それは、この話が本当に始まった時ではなかった。\n\n手紙と、短い会見と、その後の幾夜かの不眠から語り直した。筆は紙の上を静かに進む。それでも、これらの言葉はもう他人が初めから終わりまで読めるものになっていた。書記は評さず、曖昧な箇所では少し待ち、空白を残した。\n\n書き終えた紙が二人の間にある。第三者に見せてよいのか、書記はまだ私の指示を待っている。"
 latria_sexual_frustration_flavor.1405.a: "写本を広め、誰にでも読ませる。"
 latria_sexual_frustration_flavor.1405.b: "書記には公務だけを記させ、残りは飲み込む。"

 latria_sexual_frustration_flavor.1406.t: "客たちが去るころ"
 latria_sexual_frustration_flavor.1406.desc.accepted: "最後まで残った客たちは、まだ情人や婚約について話している。私が昔のことを持ち出した途端、席の端で小さな笑いが起きた。その人は杯を掲げ、失礼だとは思ってもいない様子で、その後も話せと笑って促した。\n\n長く胸に抱えていた記憶を、急に酒の肴として扱われ、私はひとまず言葉を失った。隣の客が推測を足し、別の者が手紙の文句をからかった。訂正したくて口を開くと、言えば言うほど声が急ぎ、話すつもりのなかった細部まで舌先に上った。\n\n従者が最後の酒壺を片づけに来た。私は杯の縁を押さえた。続きを待つ客が椅子を寄せる音が聞こえた。"
 latria_sexual_frustration_flavor.1406.desc.strict: "密かな情事で貴族が失脚したという知らせが席に届いた時、私はまだ自分の話を終えていなかった。隣の客が突然小声で何か尋ね、別の者が私を見てから短く笑った。先ほどまでうなずいていた者は、今は手元の布を整えることにかかりきりだ。\n\nやめるべきだとは分かっている。だが、この沈黙に自分の話を締めくくらせたくなかった。あの醜聞とは無関係だと説明しようとするほど、先ほどの言葉にも説明が必要に思えてくる。戸口ではもう帰りの挨拶が始まっていたが、残る客は誰も続きを促さなかった。\n\n杯を少し強く置いた。いくつもの視線がまだ向けられている。次の言葉を誰に向けるのか、決めなくてはならない。"
 latria_sexual_frustration_flavor.1406.desc: "客は帰ろうとしているのに、私はいつまでも話をやめられない。古い手紙に触れた時、隣の客たちが目配せをし、席の端で小さな笑いが起きた。口を止めて初めて、目の前の何人かはとうに食器を置き、私一人の話を聞いていたのだと気づいた。\n\nあの一句がなぜ大切なのか説明するつもりが、出てきたのは二度目の繰り返しだった。礼儀正しくうなずく者、戸口を見る者、杯の陰に笑みを隠す者。その反応がすべて見え、かえって気が急いた。あとひと言あれば伝わるような気がした。\n\n主人はもう立ち上がっている。目の前の椅子はまだ動かず、背後から散会の挨拶が聞こえてきた。"
 latria_sexual_frustration_flavor.1406.a: "昔の話を続け、嘲る者には皆の前で言い返す。"
 latria_sexual_frustration_flavor.1406.b: "口をつぐみ、皆に一礼して別れを告げる。"

 latria_sexual_frustration_flavor.1407.t: "消えかけの灯と祈り"
 latria_sexual_frustration_flavor.1407.desc.favors: "寝衣で寝台のそばに座り、祈祷書の肉体の歓びを説く頁を開いた。昼間なら普通に読める教えを、今は何度も読み返している。戸は閂を下ろし、外の人々も去り、灯油もあとわずかだ。\n\n信仰は自分の渇望を否定するよう求めていない。それでも、答えのないこの思いにどう向き合えばよいのか分からない。言いたいことを自分に向かって唱えてみる。挨拶や前置きを取り去ると、残った文はあまりに短く、長いこと口が止まった。\n\n炎が小さくなった。その頁に栞紐を挟む。すぐに本を閉じることも、別の答えをさらに探すこともしなかった。"
 latria_sexual_frustration_flavor.1407.desc.condemns: "寝衣の襟を合わせ、貞潔の誓いを低く繰り返す。灯芯は短くなり、祈祷書の字は闇の中で次第に見分けづらくなっている。それでも読み続け、間違えると初めに戻る。正確に唱えれば今夜を無事に越せるかのように。\n\nだが半ばまで来ると、あの人が昼間に話した言葉がまた戻ってきた。誓いを忘れたわけではない。同時に、あの時なぜ別れを惜しんだのかも忘れていない。二つを並べると、慣れた答えがどれも急に足りなくなった。\n\n灯が消えかけた時、手を伸ばして炎を守った。次の一句は目の前にある。長く見つめても、まだ声にはならなかった。"
 latria_sexual_frustration_flavor.1407.desc: "部屋には消えかけの灯が一つあるだけで、私はまだ目を閉じていない。膝に祈祷書を置き、同じ頁を何度も読んでいる。窓の外を夜警が通り、角で足音が聞こえなくなった。それでも次の一歩を待ってしまう。\n\n本を少し火に近づけ、先ほど止まった箇所を探す。その行に難しい字はない。読めなくなる理由は分かっている。行末に来るたび、昼間にはっきりさせるべきだった問いを思い出すのだ。今は誰も答えられないのに、私はまだ相手の返事を代わりに考えている。\n\n底に残ったわずかな油が光る。栞紐を挟み、表紙に手を置いたまま、灯を吹き消さなかった。"
 latria_sexual_frustration_flavor.1407.a: "貞節の誓いを脇に置き、あの愛情に思いを寄せる。"
 latria_sexual_frustration_flavor.1407.b: "思いを抑え、夜明けまで祈りを唱える。"

 latria_sexual_frustration_flavor.1408.t: "鏡の前の沈黙"
 latria_sexual_frustration_flavor.1408.desc.lustful: "衣服を脱ぎ、一人で鏡の前に立っている。寝台の脇には昼間に着替えた衣服があり、机の誘いの手紙は半頁まで書かれている。以前は鏡の前で身なりを整え、あの人に会った時の言葉を考えていた。だが実際に会うと、ありふれた話しかしなかった。\n\nこんな繰り返しはもう十分だ。長く続く渇望を、ふと思い出しただけのことにしたくない。会うたびに相手が先に口を開くのを待つのもやめたい。鏡の脇には書きかけの手紙が押さえてあり、末尾には率直な一句を足すだけの余白がある。\n\n机へ向き直り、筆先の乾いた墨を見る。外から急かす声はない。今度は公務も代わりに答えてはくれない。"
 latria_sexual_frustration_flavor.1408.desc.chaste: "衣服を脱いだまま寝台の端に座り、両手を握り合わせる。鏡の脇には衣服がきちんと畳まれ、一番上に祈祷書がある。読むべき章は読み終えたのに、いつもの安らぎは訪れない。部屋が静まるほど、あの思いを無視しにくくなる。\n\n貞潔は今も自分の選択だ。だが、聖典さえ読み終えればほかのことなど考えたこともないと言うように、守り通すことをたやすく語りたくはない。明日の用事を心の中で並べ、あの人に会う時刻まで来ると、止まってまた並べ直した。\n\n鏡の中の人もまだ座っている。固く握っていた手をほどき、机の筆を見る。このためらいをありのままに記したかった。"
 latria_sexual_frustration_flavor.1408.desc: "静寂の中で鏡の自分を見る。机にはまだ書き終えていない手紙が広がっている。昼間の取り繕う笑顔は、今は浮かべなくてよい。寝台の端に戻り、あの短い会見を初めから思い返した。\n\n約束と呼べる言葉は一つもなく、待ち続けてくれと頼まれたわけでもない。後から付け加えた意味のうち、どれが相手のもので、どれが自分のものだったのか。ようやく一つずつ見分ける気になった。分かったからといって、渇望がすぐに消えたわけではない。\n\n紙を少し灯の下へ動かした。まだ書いていない一行くらいは、自分の言葉ではっきりさせるべきだ。"
 latria_sexual_frustration_flavor.1408.a: "この欲望を認め、今夜は逃げるのをやめる。"
 latria_sexual_frustration_flavor.1408.b: "衣服を着て机に向かい、思いを抑える。"

 latria_sexual_frustration_flavor.1409.t: "宮廷での失態"
 latria_sexual_frustration_flavor.1409.desc: "朝の謁見の合間、隣室で衣服を脱ぎ、束の間一人になって気を落ち着けようとした。上着はまだ従者の手にあるのに、先に評議の間へ通じる戸が開いた。音に顔を上げると、長机の会話は途絶え、何人かの臣下が振り向いた姿勢のまま固まっていた。\n\n書記は目を伏せ、書きかけの紙を手元へ引いた。戸口の者たちは退こうとして、衣服を持つ従者の邪魔になるのを恐れ、誰も先に動かなかった。すぐに何か命じるべきだった。だが声はこわばり、用意していた指示もひとまとまりの文にならない。\n\nようやく従者が上着を差し出した。机には未決の案件がまだ広がっている。皆はこの後どうするのか、私が決めるのを待っていた。"
 latria_sexual_frustration_flavor.1409.a: "皆の前に立ち、失態を隠そうとはしない。"
 latria_sexual_frustration_flavor.1409.b: "諸侯を下がらせ、身なりを整えてから再開する。"

 latria_sexual_frustration_flavor.1410.t: "扉の向こうの夜"
 latria_sexual_frustration_flavor.1410.desc.female: "寝衣で戸のそばに座り、外の足音が次第に遠ざかるのを聞いていた。廊下で誰かが鍵を返し、小声でおやすみを告げた。そのうちの一人を呼び止め、朝に手紙を運んでほしいと頼むこともできた。声が消えても、私はまだ口を開いていなかった。\n\n答えのない思いがまた浮かぶ。机の下書きにはどうでもよい話が多すぎて、どんな返事を望むのかだけが書かれていない。紙を膝に乗せ、一行目から読み始める。そして、自分でも信じていないあのありきたりな挨拶を、ようやく消した。\n\n戸の外はすっかり静まった。筆を空白に移す。まだ下ろしていないのに、この手紙はいつもより長くかかると、もう心の中では分かっていた。"
 latria_sexual_frustration_flavor.1410.desc.male: "寝衣で寝台の頭にもたれ、手元の本は一頁もめくっていない。戸の外が静まり、灯は同じ文章を照らしているが、私は昼間の早すぎる別れを考え続けていた。別れ際、また後日話そうと言った。相手も礼儀どおりに答えただけだった。\n\n後日という言葉を使いすぎた。そのたびに次こそは話せると思い、一人になると、あの丁寧な返事に別の意味があったかを推し量るしかない。栞を一頁先へ動かしてから、前の頁に何が書かれていたかすら覚えていないことに気づいた。\n\n机にはまだ紙と筆がある。本を閉じたが、膝の上に置いたまま、もう暗くなった戸の下の隙間を見ていた。"
 latria_sexual_frustration_flavor.1410.desc: "長い夜はまだ終わらない。閉めた部屋の戸の内に座り、遠くの最後の足音が去るのを聞いている。机の手紙は書きかけで、寝台のそばの本も開いたままだ。暇をつぶそうとした二つのことが、どちらも途中で止まっている。\n\n書いた数行を自分に読んで聞かせる。難しい文ではない。ただ、どこにも逃げ道が残っていて、最後まで読んでも、あの人にどう答えてほしいのか分からない。このまま書いて明日送れば、待つことがもう一つ増えるだけだ。\n\n新しい紙を取り出し、本の下に挟んだ。灯りはまだ十分に明るい。一行目をどこに置くか、はっきり見える。"
 latria_sexual_frustration_flavor.1410.a: "本を脇に置き、長い手紙を書く。"
 latria_sexual_frustration_flavor.1410.b: "渇望を抑え、灯を消して横になる。"

 latria_sexual_frustration_flavor.1401.c: "送れない誘いを詩にする。"
 latria_sexual_frustration_flavor.1402.c: "楽師に報酬を払い、残った客のために奏でてもらう。"
 latria_sexual_frustration_flavor.1402.d: "客を引き留め、昔の旅の話をしてもらう。"
 latria_sexual_frustration_flavor.1403.c: "経典を開き、一節ずつ答えを探す。"
 latria_sexual_frustration_flavor.1404.c: "貞節の誓いを捨て、これからは欲望に従う。"
 latria_sexual_frustration_flavor.1404.d: "寝間着を着て、心が落ち着くまで座る。"
 latria_sexual_frustration_flavor.1405.c: "告白を私信に書き直し、文箱に封じる。"
 latria_sexual_frustration_flavor.1405.d: "皆を立会人として貞節を誓う。"
 latria_sexual_frustration_flavor.1406.c: "帰る客たちに新しい詩を朗読する。"
 latria_sexual_frustration_flavor.1407.c: "祈祷書を閉じ、自分の気持ちをゆっくり考える。"
 latria_sexual_frustration_flavor.1408.c: "朝の務めを書き出し、書類を一枚ずつ整える。"
 latria_sexual_frustration_flavor.1409.c: "衣服を着て卓に戻り、宮廷の案件を一つずつ片付ける。"
 latria_sexual_frustration_flavor.1409.d: "衣服を着て冗談を言い、諸侯に再び着席を勧める。"
 latria_sexual_frustration_flavor.1410.c: "外衣を羽織って茶を淹れ、眠れるまで座る。"
