l_japanese:
 latria_sexual_frustration_flavor.1401.t: "封じられた印章"
 latria_sexual_frustration_flavor.1401.desc.female: "寝間着のまま寝台のそばで手紙を何度も折り直す。宛名はなく、まだ押す勇気の出ない印章だけがある。"
 latria_sexual_frustration_flavor.1401.desc.male: "寝間着のまま寝台の縁に腰掛け、印章を握る。あの言葉を書けば、そんなことは考えなかったというふりはもうできない。"
 latria_sexual_frustration_flavor.1401.desc: "印章を持ち上げては下ろし、いつまでも紙に押せずにいる。"
 latria_sexual_frustration_flavor.1401.a: "手紙を書き上げ、印を押す。"
 latria_sexual_frustration_flavor.1401.b: "印章をしまい、思いを抑えて横になる。"

 latria_sexual_frustration_flavor.1402.t: "最後の宴"
 latria_sexual_frustration_flavor.1402.desc.accepted: "宴が終わる前、客たちは恋人や婚約、かつての快楽を隠しもせず話している。もはや他愛のない雑談として聞き流せない自分に気づく。"
 latria_sexual_frustration_flavor.1402.desc.strict: "誰かが軽率な恋愛で寵愛を失った貴族の名を出すと、食卓は静まり返った。同じ裁きが私にも向けられかねない。"
 latria_sexual_frustration_flavor.1402.desc: "食卓は乱れ、客たちは帰り始めたが、胸の内の思いはますます強くなる。"
 latria_sexual_frustration_flavor.1402.a: "残った客を引き留め、悩みを繰り返し語る。"
 latria_sexual_frustration_flavor.1402.b: "思いを抑え、主催者に礼を述べて辞去する。"

 latria_sexual_frustration_flavor.1403.t: "立会人のいない告白"
 latria_sexual_frustration_flavor.1403.desc.favors: "祭壇の前には誰もいない。私の宗派は肉体の快楽を許している。それでも、この切迫した思いをどう鎮めればよいのかわからない。"
 latria_sexual_frustration_flavor.1403.desc.condemns: "一人で祭壇の前にひざまずく。衣服は整っているのに、祈りはいつも同じ言葉で途切れる。誰にも聞かれなければ、誓いを破ったことにはならないのか？"
 latria_sexual_frustration_flavor.1403.desc: "聖所にはもう誰もいない。私はまだ立ち去れずにいる。"
 latria_sexual_frustration_flavor.1403.a: "これ以上禁欲を誓わず、自分の選択を認める。"
 latria_sexual_frustration_flavor.1403.b: "欲望を抑え、朝の祈りまでひざまずいている。"

 latria_sexual_frustration_flavor.1404.t: "欲望を言葉に"
 latria_sexual_frustration_flavor.1404.desc.lustful: "衣服を脱ぎ、一人で寝室の鏡の前に立つ。映る自分から目を背けない。欲望を一時の弱さと呼ぶことにはもう疲れた。"
 latria_sexual_frustration_flavor.1404.desc.chaste: "衣服を脱ぎ、一人で寝台の縁に座り、両手を握り合わせる。誓いを守るにしても、この渇望が消えたからではない。"
 latria_sexual_frustration_flavor.1404.desc: "夜は更けた。ようやく自分に欲望を隠すのをやめる。"
 latria_sexual_frustration_flavor.1404.a: "渇望を認め、今夜は抗うのをやめる。"
 latria_sexual_frustration_flavor.1404.b: "再び衣服を着て、思いを抑える。"

 latria_sexual_frustration_flavor.1405.t: "年代記の一頁"
 latria_sexual_frustration_flavor.1405.desc.emperor: "年代記編者は、何を後世に残すか私が決めるのを待っている。礼服を着てその背後に立つと、黙っていてもこの苦しみは消えないのだとわかる。"
 latria_sexual_frustration_flavor.1405.desc.adventurer: "卓についた書記が、旅のこの一幕も年代記に残すのかと尋ねる。送らなかった手紙を見つめる。この言葉はこれからも私についてくる。"
 latria_sexual_frustration_flavor.1405.desc.clergy: "法衣を整え、書記の前に立つ。誓いも欲望も本物だ。どちらを記憶に残すべきか、他人に決めさせはしない。"
 latria_sexual_frustration_flavor.1405.desc.ruler: "書記官が私の言葉を記そうと待っている。礼服姿で従者たちの前に立ち、胸に秘めてきたことを語る。"
 latria_sexual_frustration_flavor.1405.desc: "もうこのことを胸にしまっておくのはやめる。"
 latria_sexual_frustration_flavor.1405.a: "写本を広め、誰にでも読ませる。"
 latria_sexual_frustration_flavor.1405.b: "書記には公務だけを記させ、残りは飲み込む。"

 latria_sexual_frustration_flavor.1406.t: "客たちが去るころ"
 latria_sexual_frustration_flavor.1406.desc.accepted: "最後の客たちは、まだ恋人や婚約の話をしている。私が昔の話を切り出すと、食卓の誰かがくすりと笑った。"
 latria_sexual_frustration_flavor.1406.desc.strict: "軽率な恋愛で寵愛を失った貴族の噂が食卓に届く。私が口をつぐむ前に、隣の者たちがささやき始め、誰かが笑った。"
 latria_sexual_frustration_flavor.1406.desc: "客たちは帰り始めたが、私はまだ話し続けている。隣の者たちが目配せし、食卓の誰かがくすりと笑った。"
 latria_sexual_frustration_flavor.1406.a: "昔の話を続け、嘲る者には皆の前で言い返す。"
 latria_sexual_frustration_flavor.1406.b: "口をつぐみ、皆に一礼して別れを告げる。"

 latria_sexual_frustration_flavor.1407.t: "消えかけの灯と祈り"
 latria_sexual_frustration_flavor.1407.desc.favors: "寝間着のまま寝台のそばで、私の宗派は肉体の快楽を否定しないのだと思い返す。それでも、一人では心をどう鎮めればよいのかわからない。"
 latria_sexual_frustration_flavor.1407.desc.condemns: "寝間着の襟を寄せ、貞節の誓いを繰り返す。ろうそくは燃え尽きかけているが、胸の渇望は消えない。"
 latria_sexual_frustration_flavor.1407.desc: "部屋には消えかけのろうそくが一本残るだけだ。私はまだ眠れずにいる。"
 latria_sexual_frustration_flavor.1407.a: "貞節の誓いを脇に置き、あの愛情に思いを寄せる。"
 latria_sexual_frustration_flavor.1407.b: "思いを抑え、夜明けまで祈りを唱える。"

 latria_sexual_frustration_flavor.1408.t: "鏡の前の沈黙"
 latria_sexual_frustration_flavor.1408.desc.lustful: "衣服を脱ぎ、一人で鏡の前に立つ。この渇望を、もう一時の思いとは呼べない。そう装いたくもない。"
 latria_sexual_frustration_flavor.1408.desc.chaste: "衣服を脱ぎ、寝台の縁で両手を握り合わせる。貞節は今も私の選択だが、これほど難しく感じたことはない。"
 latria_sexual_frustration_flavor.1408.desc: "静けさの中で鏡に映る自分を見つめ、胸の思いから目を背けるのをやめる。"
 latria_sexual_frustration_flavor.1408.a: "この欲望を認め、今夜は逃げるのをやめる。"
 latria_sexual_frustration_flavor.1408.b: "衣服を着て机に向かい、思いを抑える。"

 latria_sexual_frustration_flavor.1409.t: "宮廷での失態"
 latria_sexual_frustration_flavor.1409.desc: "評議会の休憩中、隣室で衣服を脱ぐ。外衣を羽織るより先に議場への扉が開いた。諸侯は黙り込み、書記官は目を伏せる。従者が外衣を手に立ち尽くすなか、私も声が詰まる。"
 latria_sexual_frustration_flavor.1409.a: "皆の前に立ち、失態を隠そうとはしない。"
 latria_sexual_frustration_flavor.1409.b: "諸侯を下がらせ、身なりを整えてから再開する。"

 latria_sexual_frustration_flavor.1410.t: "扉の向こうの夜"
 latria_sexual_frustration_flavor.1410.desc.female: "寝間着のまま扉のそばに座り、外の足音が遠ざかるのを聞く。夜が更けると、応えてもらえなかった思いがまた胸に戻ってくる。"
 latria_sexual_frustration_flavor.1410.desc.male: "寝間着のまま寝台にもたれ、本を開かずにいる。廊下は静まったが、眠りは訪れない。"
 latria_sexual_frustration_flavor.1410.desc: "夜は長い。扉の向こうは静まり返り、私の心は落ち着かない。"
 latria_sexual_frustration_flavor.1410.a: "本を脇に置き、長い手紙を書く。"
 latria_sexual_frustration_flavor.1410.b: "渇望を抑え、灯を消して横になる。"

 latria_sexual_frustration_flavor.1401.c: "送れない誘いを詩にする。"
 latria_sexual_frustration_flavor.1402.c: "楽師に報酬を払い、残った客のために奏でてもらう。"
 latria_sexual_frustration_flavor.1402.d: "客を引き留め、昔の旅の話をしてもらう。"
 latria_sexual_frustration_flavor.1403.c: "経典を開き、一節ずつ答えを探す。"
 latria_sexual_frustration_flavor.1404.c: "貞節の誓いを捨て、これからは欲望に従う。"
 latria_sexual_frustration_flavor.1404.d: "寝間着を着て、心が落ち着くまで座る。"
 latria_sexual_frustration_flavor.1405.c: "告白を私信に書き直し、文箱に封じる。"
 latria_sexual_frustration_flavor.1405.d: "皆を立会人として貞節を誓う。"
 latria_sexual_frustration_flavor.1406.c: "帰る客たちに新しい詩を朗読する。"
 latria_sexual_frustration_flavor.1407.c: "祈祷書を閉じ、自分の気持ちをゆっくり考える。"
 latria_sexual_frustration_flavor.1408.c: "朝の務めを書き出し、書類を一枚ずつ整える。"
 latria_sexual_frustration_flavor.1409.c: "衣服を着て卓に戻り、宮廷の案件を一つずつ片付ける。"
 latria_sexual_frustration_flavor.1409.d: "衣服を着て冗談を言い、諸侯に再び着席を勧める。"
 latria_sexual_frustration_flavor.1410.c: "外衣を羽織って茶を淹れ、眠れるまで座る。"
