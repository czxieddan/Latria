l_japanese:
 latria_sexual_frustration_flavor.1111.t: "第二の夜番"
 latria_sexual_frustration_flavor.1111.desc: "二番目の夜番に目を覚ますと、敷布が片方の脹脛に巻きついている。灯は親指ほどの炎に燃え尽きかけている。手はもう腹の低いところにあり、自分の身体の温もりで温かい。私はそれを退ける。\n\n夕暮れにひとときがあった。誰かが塩を取ろうと私の前を身を傾けて越し、前腕が私の手首の甲を掠め、どちらも一息の間動かなかった。あの一息を、私は会話全体よりも何度も思い返している。\n\n腰の横、寝台に手のひらを平らに押しつける。そこの亜麻はまだ冷たい。冷たいままにしておく。"
 latria_sexual_frustration_flavor.1111.a: "手の望むままにさせよう。"
 latria_sexual_frustration_flavor.1111.b: "寝返りを打ち、眠りを待とう。"
 latria_sexual_frustration_flavor.1111.c: "静かに横たわり、家が落ち着く音を聞こう。"

 latria_sexual_frustration_flavor.1112.t: "二人の間の杯"
 latria_sexual_frustration_flavor.1112.desc: "杯は卓に沿って手から手へ渡り、私のところに来ると、縁はまだ他の誰かの口で濡れている。私はその濡れた場所で飲む。卓の向こうで、誰かがそれを見ている。目を逸らさず、笑いもしない。\n\nしばらく馬の話をした。栗毛の牝馬の値段、辻の蹄鉄師。卓の下で、膝が私の膝に落ち着く。重みはなく、ただ触れているだけ。私は馬の話を続ける。\n\n従者が杯を満たす。膝は叔父に挨拶するために引いていく。私は杯を両手で握る。酒はぬるい。食事の残りの間、隣の腰掛けは空いたままだ。"
 latria_sexual_frustration_flavor.1112.a: "膝が語っていたことを、はっきり言おう。"
 latria_sexual_frustration_flavor.1112.b: "同席の礼を述べ、早めに下がろう。"
 latria_sexual_frustration_flavor.1112.c: "残って、広間が空になるまで馬の話をしよう。"

 latria_sexual_frustration_flavor.1113.t: "長すぎる舞踏"
 latria_sexual_frustration_flavor.1113.desc: "曲が変わり、私は相手から相手へと手渡される。三人目が、型を一拍過ぎて私の手を握り、脈のある手首の内側に親指を押し当て、事故のように微笑む。次の踏み足を外し、旋回でそれを覆う。\n\n広間の奥で誰かが笑う。誰かと確かめるために振り向かない。顔が熱い。蝋燭の光にそれが映っていると分かっている。この部屋で蝋燭だけが正直な光だ。\n\n組が終わる。私は柱のそばに立ち、手をまだ半ば握ったまま、あの親指の形が皮膚に残っている。楽師がまた始める。"
 latria_sexual_frustration_flavor.1113.a: "広間の皆の前で、あの相手に声高に杯を献じよう。"
 latria_sexual_frustration_flavor.1113.b: "同席の皆に礼をし、舞踏の床を去ろう。"
 latria_sexual_frustration_flavor.1113.c: "最も静かな隅を探し、ゆっくり息をしよう。"

 latria_sexual_frustration_flavor.1114.t: "長い帰り道"
 latria_sexual_frustration_flavor.1114.desc: "葉に雨。鹿は一時間前に姿を消した。私は列の後ろで、追い立て役の話し声が前方で薄れていくのを聞きながら進む。鞍のせいで腿が痛み、夕方まで自分の身体を忘れさせてくれない。外套の濡れた毛織りは襟もとで冷たい。\n\n小川のほとりで、乗り手が私の手綱を支え、馬が落ち着いたあとも、手は革に留まっている。三つ編みの先から水が滴る。どちらも雨のことは口にしない。\n\n私たちは進む。濡れた革が一歩ごとに軋み、私は考えるかわりにその軋みを数え、三つ目の畑を過ぎたあたりで数を失う。"
 latria_sexual_frustration_flavor.1114.a: "光が消えるまで狩りを続けさせよう。"
 latria_sexual_frustration_flavor.1114.b: "目を道筋に、手を手綱に留めよう。"
 latria_sexual_frustration_flavor.1114.c: "地面を、折れた茎を、蹄の跡を読もう。"
 latria_sexual_frustration_flavor.1114.d: "隼を放とう。何度でも。"

 latria_sexual_frustration_flavor.1115.t: "第三の時の跪坐"
 latria_sexual_frustration_flavor.1115.desc: "石の上で膝が痛むまで跪き、その痛みだけが私の注意を保つ。灯の油は饐えている。今朝の身体は静かにならない。求め、しかも求める先は、梁を繕いながら仕事の合間に口笛を吹くあの人だ。\n\n私は日課を唱える。四行目で心が滑ったので、初めから唱え直す。背後で誰かが咳をする。振り向かない。\n\n石は法衣を通して冷たい。皆が立ったあとも私は下りず、冷たさは脛に届く。それでも足りない。"
 latria_sexual_frustration_flavor.1115.a: "告解で名を挙げ、その後に贖罪をしよう。"
 latria_sexual_frustration_flavor.1115.b: "鐘が鳴るまで徹夜の祈りを続けよう。"
 latria_sexual_frustration_flavor.1115.c: "注解を取り、章の終いまで読もう。"

 latria_sexual_frustration_flavor.1116.t: "従軍司祭が問わなかったこと"
 latria_sexual_frustration_flavor.1116.desc: "従軍司祭は回廊を私の隣に歩き、何も問わない。問われるより悪い。私は怠惰の罪について話し、相手は収穫のこと、遅れて来た雨のこと、ライ麦の値段を答える。\n\n袖口は擦り切れている。身振りで緩い糸が動くのを眺め、袖の中の手首を思い、それからまた怠惰を思い、収穫の話はまるで頭から消える。相手は私が追いつくように歩みを止める。\n\n扉のところで祝福を受ける。私は祝福のあと、その手をひととき長く握る。相手はそれを許し、それから階段を二段ずつ下りていく。"
 latria_sexual_frustration_flavor.1116.a: "すべてを話そう。"
 latria_sexual_frustration_flavor.1116.b: "贖罪を課してもらい、それを守ろう。"
 latria_sexual_frustration_flavor.1116.c: "収穫の話を最後まで聞こう。"

 latria_sexual_frustration_flavor.1117.t: "評議会のあとの請願"
 latria_sexual_frustration_flavor.1117.desc: "評議会は散った。宰相がもう一件の請願を押し通そうと残っている。私は言葉よりも、言葉を形にする口の動きを聞いている。印章は自分の手で温まり、蝋はまだ固まっていない。\n\n宴のあとは誰とも二人きりになっていない。冠はうなじにのしかかる重みで、うなじは別の重みを欲しがっている。黄金ではなく、そこに置かれる手。\n\n私は請願を許す。相手は辞儀をする。扉が閉まるまで地図に目を据え、それから扉に目を据える。地図のそばの蝋燭は、私が座っている間に燃え尽きる。"
 latria_sexual_frustration_flavor.1117.a: "蝋燭が消えたあと、誰かを呼ぼう。"
 latria_sexual_frustration_flavor.1117.b: "請願に封印がなされるまで仕事を続けよう。"
 latria_sexual_frustration_flavor.1117.c: "次の三件の請願を自分で読もう。"

 latria_sexual_frustration_flavor.1118.t: "露台の梅酒"
 latria_sexual_frustration_flavor.1118.desc: "梅酒、三杯目、袖が触れ合うばかり。私の国では詩の一行で語り、一行ごとに一歩近づく。従者が欄干のそばで、聞かぬふりをして立っている。\n\n私は手首で袖を開いて垂らす。相手の袖は退かない。露台の下のどこかで、笛が始まり、止まり、また始まる。同じ三つの節を繰り返す。\n\n杯を欄干に置く。半分残したままで、酒が最後の光を留めている。どちらも、はっきりしたことは言っていない。石畳の上で花びらが一枚裏返る。欄干の従者はまだ聞いていない。"
 latria_sexual_frustration_flavor.1118.a: "取り違えようのない一行で答えよう。"
 latria_sexual_frustration_flavor.1118.b: "袖を整え、天候の話をしよう。"
 latria_sexual_frustration_flavor.1118.c: "灯がともるまで、独りで露台を歩こう。"

 latria_sexual_frustration_flavor.1119.t: "消し忘れた灯"
 latria_sexual_frustration_flavor.1119.desc: "灯を消さずに残し、敷布は腰まで下ろしている。手が腹の温かな皮膚を撫で、下へ進む。今度は止めない。夕暮れに喉へ当てられた口のことを思って、私はもう濡れていて、指は滑らかに動く。\n\n私の上に覆いかぶさる身体の重み、その正確な重みを思うと、腰が空を突くように上がる。押して、回して、静かな部屋で息が乱れる。手の付け根が、欲しい場所を押し回す。\n\n長い震えが来て、腿が震えたまま残る。あとには腕を目の上に置き、灯はまだ燃え、敷布は私の下で湿っている。"
 latria_sexual_frustration_flavor.1119.a: "果てまで行かせ、濡れた闇に横たわろう。"
 latria_sexual_frustration_flavor.1119.b: "手を退け、梁を数えよう。"
 latria_sexual_frustration_flavor.1119.c: "灯芯を整え、闇に横たわろう。"

 latria_sexual_frustration_flavor.1120.t: "客間の夜"
 latria_sexual_frustration_flavor.1120.desc: "広間が暗くなったころに扉を叩く音がし、開けると、私は寝衣のままで、誰のために着替えてもいない。私の身体を一巡する眼差しを見て、私は肩掛けに手を伸ばさない。\n\n私たちはふりをしない。口が私の喉を探し当て、私の手は帯にあり、卓に抱え上げられた拍子に杯が倒れて転がる。歩みは遅く、私は気長ではない。自分の声が聞こえてきて、自分でも驚く。首筋に当たる笑い。歩みは変わらない。\n\nあとには、卓の縁から床へ、酒が一滴ずつ滴る。どちらも拭こうと動かない。"
 latria_sexual_frustration_flavor.1120.a: "扉に閂をせず、寝衣のままでいよう。"
 latria_sexual_frustration_flavor.1120.b: "穏やかに礼を述べ、扉を閉めよう。"
 latria_sexual_frustration_flavor.1120.c: "卓の縁に座り、夜明けまで語らおう。"

 latria_sexual_frustration_flavor.1121.t: "絵屏の陰"
 latria_sexual_frustration_flavor.1121.desc: "宴は礼儀の境を越えている。広間の隅に屏風が引き回され、その陰の音は食事の音ではない。手が私の手首を掴み、私は引かれるに任せ、屏風に描かれた白鷺が触れそうな近さを通る。\n\n手は一人分より多い。数えるのをやめる。敷き藁は踏み平らされ、杯が私の膝に当たって転がるが、誰も拾わない。\n\nあとで私は壁にもたれて座っている。髪は解け、口は腫れ、見知らぬ誰かの外套が肩にかかっている。音楽は止んでいない。"
 latria_sexual_frustration_flavor.1121.a: "屏風の陰へ行き、広間に聞かせよう。"
 latria_sexual_frustration_flavor.1121.b: "断って、杯と席を保とう。"
 latria_sexual_frustration_flavor.1121.c: "盤を出して、手が定まるまで指そう。"

 latria_sexual_frustration_flavor.1122.t: "詩の四文字"
 latria_sexual_frustration_flavor.1122.desc: "書板を膝に載せ、葦の筆は乾いている。肩の曲線についての詩を四文字書き、その四つはどれも正しくない。五文字目はもっと悪い。\n\n部屋は冷たい。自分の呼吸がその中で大きく響く。書板を脇に置き、手の甲を口に押し当てる。渇望はどこへも行かず、形を変えて、もっと下に落ち着くだけだ。\n\nまた筆を取る。行は未完のままで、墨は葦の裂け目で乾いていく。その行の肩は、まだただの肩でしかない。"
 latria_sexual_frustration_flavor.1122.a: "肩を、そして残りを書こう。"
 latria_sexual_frustration_flavor.1122.b: "書板を閉じ、手を静かにして座ろう。"
 latria_sexual_frustration_flavor.1122.c: "部屋がただの部屋になるまで、退屈なものを読もう。"
 latria_sexual_frustration_flavor.1122.d: "夕餉の席で、未完の一行を詠もう。"

 latria_sexual_frustration_flavor.1123.t: "隼の重み"
 latria_sexual_frustration_flavor.1123.desc: "頭巾をかぶせた隼が私の手袋に据わり、その重みだけが今朝の正直なものだ。私たちは濡れた草の中で鷺を待つ。肩が焼けるように痛み、親指の革は水を吸って色が変わっている。\n\n身を低くすると、腕が私の腕に沿ってきて、そのまま留まる。鳥が足を動かす。私は葦から目を離さない。脈が耳で鳴り、沼よりも大きく、聞こえているに違いないと確信する。\n\n鷺は来なかった。隼を拳に乗せ、草に足首まで濡らして戻る。どちらも腕のことは言わない。"
 latria_sexual_frustration_flavor.1123.a: "また馬を出し、暗くなるまで狩ろう。"
 latria_sexual_frustration_flavor.1123.b: "動かず、沼が静まるに任せよう。"
 latria_sexual_frustration_flavor.1123.c: "隼を放し、隼だけを見ていよう。"

 latria_sexual_frustration_flavor.1124.t: "施しの箱"
 latria_sexual_frustration_flavor.1124.desc: "施しの箱に硬貨を数えて入れる。数えるのは、考えないためのやり方だ。多くは銅貨で、羊毛商の銀貨が二枚。寄進者の手が私の手の隣に箱へ入れられ、二人の指が硬貨の間にあり、司祭は三段目から二人を見ている。\n\nこれは告解していない。何と呼べばいいのかも分からない。私の顔は平静だ。平静である練習を、鏡の前でしてきた。\n\n手が引く。蓋を閉じると小さな真鍮の錠が鳴る。鍵を持つ自分の手は定まらず、司祭はまだ段にいる。"
 latria_sexual_frustration_flavor.1124.a: "蝋燭の代を払い、司祭に顔を見せよう。"
 latria_sexual_frustration_flavor.1124.b: "蝋燭が揺れて消えるまで徹夜の祈りを続けよう。"
 latria_sexual_frustration_flavor.1124.c: "祈祷書をもう一度通しで読もう。"

 latria_sexual_frustration_flavor.1125.t: "真夜中に結ばれた条件"
 latria_sexual_frustration_flavor.1125.desc: "正午から条約にかかりきりだ。蝋燭は燃え尽きかけ、火は消されたまま。相手が最後の条項を声に出して読み、私はそれを聞かぬまま同意する。私のものではない言語を口が動かす、その動かし方のせいで。\n\nこれが初めての夜ではない。自分が役に立たなくなる正確な距離を私は知っていて、二番目の蝋燭のころから、その内側にいる。\n\n私は署名する。相手も署名する。指輪を蝋に押しつけると、蝋はまだ柔らかく、私の手は定まっていて、書記が頁を運び去る。それが私の勝利のすべてだ。"
 latria_sexual_frustration_flavor.1125.a: "部屋が空いたら、一筆を届けよう。"
 latria_sexual_frustration_flavor.1125.b: "一言一句、条項を守ろう。"
 latria_sexual_frustration_flavor.1125.c: "条約を持ち帰り、一行残らず読もう。"

 latria_sexual_frustration_flavor.1126.t: "草と風と開いた襟"
 latria_sexual_frustration_flavor.1126.desc: "馬は放して草を食ませ、鞍を置いたまま、私たちはフェルトの上に座る。連れの国の者は、乗り手は鞍で眠れるほどであるべきだと言う。私は地面に座ってさえ、じっとしていられない。\n\n見たことのない川の話をしている。三つの渡しがある川だ。シャツは喉で開いている。風が草を長い筋になって撫で、私は川ではなく喉を見ている。\n\n馬が鼻を鳴らす。私が先に目を逸らすと、風の中で耳が熱い。川の話は、私を欠いたまま続いていく。"
 latria_sexual_frustration_flavor.1126.a: "この国の言葉で、下手でも、声に出して言おう。"
 latria_sexual_frustration_flavor.1126.b: "口を閉じ、馬を見よう。"
 latria_sexual_frustration_flavor.1126.c: "風がそれを奪うまで、激しく馬を走らせよう。"

 latria_sexual_frustration_flavor.1127.t: "枕の窪み"
 latria_sexual_frustration_flavor.1127.desc.female: "寝台は熱すぎ、掛布は床へ蹴り落とした。寝衣は腰までたくし上がっている。そこに手を置くと、何を決める前から身体が答える。下腹部に走る速い熱で、私よりもしつこい。\n\nあの人が廊下で私の名を呼んだ様子を思う。二つ目の音が引き延ばされ、背後の扉は完全には閉まっていなかった。指が動き、息がその引き延ばされた音で止まる。\n\n果てる前に手を止める。手を静かに、心臓を鳴らしたまま横たわる。隣の枕には窪みがない。"
 latria_sexual_frustration_flavor.1127.desc.male: "掛布は床に落ち、寝衣は腰までたくし上がっている。手を下ろすと、もう硬くなっている。理由などない。廊下と、名と、細く開いたままの扉、それだけで。\n\n口のことを思うと、腰がひとりでに揺れる。息が短くなる。一瞬で終えることもできる。終えない。終えないことは、それ自体が一つの仕事だ。\n\n手を退け、平らに横たわる。部屋はひどく静かで、疼きは引かず、隣の枕は冷たく、私はそれに触れない。"
 latria_sexual_frustration_flavor.1127.desc: "寝台は熱すぎ、灯は消えている。掛布は蹴り落とし、手が迷い出る。許そうと決める前から、身体はすぐに答える。私よりもしつこく。\n\n廊下のこと、二度呼ばれた名のこと、手首で捲られた袖のことを思う。その時刻の廊下は暗い。息が短くなり、思いを終いまで走らせ、それ以上は進ませない。\n\n手を退け、静かに横たわる。隣の枕には窪みがない。掛布は朝まで床にあるままだ。"
 latria_sexual_frustration_flavor.1127.a: "手を、ある場所に留めよう。"
 latria_sexual_frustration_flavor.1127.b: "手を組み、横向きに眠ろう。"
 latria_sexual_frustration_flavor.1127.c: "起きて、明るくなるまで鎧戸のそばに座ろう。"

 latria_sexual_frustration_flavor.1128.t: "乾杯の辞"
 latria_sexual_frustration_flavor.1128.desc: "乾杯の辞を述べるために立ち上がると、広間は顔の霞だ。一つの顔だけが霞んでいない。杯一杯分の長さ、忠誠について話し、その間も目は同じ場所、三番目の卓の上に戻り続ける。\n\n上座で誰かが咳をする。皿が片づけられる前に、噂は厨房に届くだろう。気にするべきより自分が気にしないことが、それ自体、答責を要することだ。\n\n座る。手が杯の脚を取り、強く握りすぎる。広間の向こうで、その顔はまだこちらを向いている。"
 latria_sexual_frustration_flavor.1128.a: "見ていた相手の名を挙げ、その人に杯を献じよう。"
 latria_sexual_frustration_flavor.1128.b: "忠誠だけを語り、それを本心にしよう。"
 latria_sexual_frustration_flavor.1128.c: "杯を持って端へ行き、旧友と座ろう。"

 latria_sexual_frustration_flavor.1129.t: "第三章の注解"
 latria_sexual_frustration_flavor.1129.desc: "従軍司祭が注解を声に出して読み、私は頁の上で指で一行を追う。読んでいるのは声だ。指は動かなくなり、声の三行下、一時間前と同じ頁にある。\n\n頁がめくられ、指が邪魔になる。読む人が待つ。指を動かさない。二人の間の蝋燭が傾いて、また立つ。家のどこかで扉が閉まる。\n\n朗読は続く。第三章の論旨はまるで分からなくなり、部屋は蝋と墨の匂いがし、指はまだ元の場所にある。"
 latria_sexual_frustration_flavor.1129.a: "心が逸れたことを告白し、贖罪を受けよう。"
 latria_sexual_frustration_flavor.1129.b: "より厳しい戒律を求め、それを守ろう。"
 latria_sexual_frustration_flavor.1129.c: "頁の初めから、また一行を追おう。"

 latria_sexual_frustration_flavor.1130.t: "友に話したこと"
 latria_sexual_frustration_flavor.1130.desc: "友にすべてを話す。廊下のこと、手首のこと、杯のこと。友は片手を顎に当てて聞き、一度も扉を見ない。二人の間の酒は手つかずだ。口に出すと楽になり、何も変わらない。\n\nそのうち手が私の肩に置かれ、親しげに、そのまま留まる。私は地図を見る。戦役は一季待てる。川は動いていない。\n\n友は帰る。私は戦役の駒を前に座る。木の駒は箱の匂いがする。一つ動かし、それから元の場所へ戻す。"
 latria_sexual_frustration_flavor.1130.a: "残りも話し、何も求めまい。"
 latria_sexual_frustration_flavor.1130.b: "もう言うまい。駒を揃えよう。"
 latria_sexual_frustration_flavor.1130.c: "かわりに戦役を秤にかけ、正しく量ろう。"

 latria_sexual_frustration_flavor.1131.t: "残る温もり"
 latria_sexual_frustration_flavor.1131.desc: "夢が私を温かくして、目が覚めると寝衣は腰までたくし上がっている。原因は自分の手だ。私は静かに横たわり、部屋が戻ってくるのに任せる。冷たい床、消えかけの灯。熱は夢と一緒に去らない。\n\nあれは家の執事の子、あるいはあの口を持つ誰かだった。相手は私の手首を寝台に押さえつけ、急いでいなかった。相手の正確な重み、寝台が二人を受け止めた具合を覚えている。目覚めているときに、あの眼差しで私を見たことは一度もない。\n\n寝衣を腰まで下ろす。横になっていた場所の布は湿っている。顔を壁に向けると、温もりは毛布の下に残り、辛抱強く、私が折れるのを待っている。"
 latria_sexual_frustration_flavor.1131.a: "手を、望む場所へ戻そう。"
 latria_sexual_frustration_flavor.1131.b: "寝衣を整え、夜明けを待とう。"
 latria_sexual_frustration_flavor.1131.c: "夕餉の冗談を思い、息を緩めよう。"

 latria_sexual_frustration_flavor.1132.t: "三本目の蝋燭"
 latria_sexual_frustration_flavor.1132.desc: "膝が痛むまで跪き、その痛みは頭を晴らすには足りない。三本目の蝋燭を過ぎて、寺院は空だ。目の裏の闇に、同じ身体が戻ってくる。神のものではない。\n\n巡礼者の手。数週間前、道端で私の肩に毛布を掛けてくれた。喉を掠めた指の骨。その像を祈りで追い払おうと百度試み、毎晩もっと鮮明になって戻る。襟が開いた場所に置かれた、見知らぬ手のひらの温もり。\n\n額を組んだ手に押しつける。石は冷たい。私の息は冷たくない。最後の蝋燭が短くなるまで跪き、赦しは乞わない。ただ、立つ前に腿の震えが止むようにと願う。"
 latria_sexual_frustration_flavor.1132.a: "その思いを名指し、燃え抜けるに任せよう。"
 latria_sexual_frustration_flavor.1132.b: "立ち、身体が尽きるまで徹夜の祈りを続けよう。"
 latria_sexual_frustration_flavor.1132.c: "あの手の温もりを、慰めとして握っていよう。"

 latria_sexual_frustration_flavor.1133.t: "岩棚の下"
 latria_sexual_frustration_flavor.1133.desc: "また雨で、狩りは散り散りになった。私は岩棚の下で犬奉行と雨宿りをする。二人ともずぶ濡れで、冷たさが触れ合う場所を小さな火に変える。その人の腕が肩から手首まで私の腕に沿い、気づかぬふりをやめた。\n\n相手が嵐について何か言い、私も嵐について答える。濡れた石の上で私を支えようと、手が腰のくぼみを探し当て、そこに留まる。濡れた毛織りを透かして温かく広がり、私の息は浅くなる。寒さでは弁解できない浅さだ。\n\n雨は細くならない。親指が一度、背骨に沿って動く。私は灰色の水の帳に目を据え、退かない。岩棚は、これ以外のことをするには狭すぎる。"
 latria_sexual_frustration_flavor.1133.a: "もうしばらく雨の中にいよう。"
 latria_sexual_frustration_flavor.1133.b: "身をずらし、水の落ちるのを見よう。"
 latria_sexual_frustration_flavor.1133.c: "嵐をやり過ごし、それから独りで戻ろう。"

 latria_sexual_frustration_flavor.1134.t: "解かぬままの紐"
 latria_sexual_frustration_flavor.1134.desc: "評議会は終わり、書斎は私のものだ。欲しくもない酒を注ぐと、招かれぬまま記憶が来る。条約の宴で使節が口を寄せたこと、書記たちが国境を論じるあいだ、親指の雫を舐め取った様子。\n\n杯を置く。手が喉の紐へ行き、止まる。記憶の中で相手の指は速く確かで、私は拒んでいない。卓に身を預けて、滑り落ちないようにしている。相手の背後で、広間全体が蝋燭の煙に霞んでいる。\n\n蝋燭が揺らぐ。解かぬままの紐を結び直す。酒は手つかずで、部屋はひどく静かで、脈が耳で鳴る。開かぬ扉を叩く誰かのように。"
 latria_sexual_frustration_flavor.1134.a: "誰の口を思っているのか、はっきり認めよう。"
 latria_sexual_frustration_flavor.1134.b: "蝋燭を消し、独りで寝よう。"
 latria_sexual_frustration_flavor.1134.c: "盤を出して指し、自分をまとめよう。"

 latria_sexual_frustration_flavor.1135.t: "遅い拍子"
 latria_sexual_frustration_flavor.1135.desc: "楽師が遅い曲を始め、断る前に手が私の手を取る。上座の近くで二人で回る。近く、型が求めるより近く。私を支えるその人は、酒と薪の煙と、その下に何かもっと温かなものの匂いがする。\n\n旋回の拍子で、腿が私の腿の間に滑り込み、半拍長く留まる。広間のために顔は平静に保つ。音楽の下で自分の呼吸が聞こえ、相手にも聞こえていると分かる。口が弧を描き、開かないからだ。\n\n組が終わる。すぐには離れない。親指が手のひらの縫い目を、遅く、意図してなぞる。言葉のない問いだ。楽師がまた始め、私は答えておらず、手はまだ相手の手の中にある。"
 latria_sexual_frustration_flavor.1135.a: "曲に従い、次の拍子を踊ろう。"
 latria_sexual_frustration_flavor.1135.b: "手を引き、人混みへ退こう。"
 latria_sexual_frustration_flavor.1135.c: "温もりに留まり、曲を最後まで聞こう。"
