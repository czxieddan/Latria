l_japanese:
 latria_sexual_frustration_flavor.1411.t: "扉に誰も"
 latria_sexual_frustration_flavor.1411.desc: "灯は燃え尽きかけ、私はまだ目覚めている。寝衣は腰の上まで押し上げられ、手は、どこへ行くかを誰にも告げていない場所にある。これを落ち着かなさと呼ぶのをやめた。三夜、縁まで自分を運んで、そこに置いてきた。廊下に、決して来ない足音を聞きながら。じっと横たわりすぎた場所で敷布が湿っている。\n\n宴で、あの人が私の椅子に身を寄せた様子を思う。背を戻したとき、部屋の温もりまで一緒に去るほど近く。息が短くなる。掌を平らに押し当て、動かずにおり、渇望は和らがず、ただもっと低く重く集まる。\n\n下のどこかで扉が閉まる。手がまた動き、今度は止めない。"
 latria_sexual_frustration_flavor.1411.a: "手が始めたことを終え、望みを認めよう。"
 latria_sexual_frustration_flavor.1411.b: "手を退け、灯が消えるまで静かに横たわろう。"
 latria_sexual_frustration_flavor.1411.c: "上掛けを羽織り、静けさが緩むまで座っていよう。"

 latria_sexual_frustration_flavor.1412.t: "言い過ぎ"
 latria_sexual_frustration_flavor.1412.desc: "広間は酒の残りで賑やかで、私はもう言いすぎている。隣の客が、そんな話をどこで仕入れたのかと尋ね、私は話し、それから残りも話した。昼には口にしたことのない部分まで。\n\n誰かが笑って、もっとと求める。自分の声が、もっと速く続いていくのが聞こえる。いつも省く細部、時刻、扉、待っていた様子まで足している。酒が顔を熱くしている。背後のどこかで杯が置かれる。注意深い者なら止まる場所で、自分を止められない。\n\n隣の客の椅子が引く音がする。音楽は終わり、まだ誰も帰らず、広間は獣脂と零れた酒の匂いがし、私は置くつもりだった杯をまだ握っている。"
 latria_sexual_frustration_flavor.1412.a: "残りも言い、卓の皆に聞かせよう。"
 latria_sexual_frustration_flavor.1412.b: "皆に辞儀をし、残りは歯の裏に留めて去ろう。"
 latria_sexual_frustration_flavor.1412.c: "話を旧友に移し、残りは酒に任せよう。"

 latria_sexual_frustration_flavor.1413.t: "同じ三行"
 latria_sexual_frustration_flavor.1413.desc: "膝の下に寝衣を敷いて祭壇に跪き、布を通して石が冷たい。石畳は脛から熱を奪った。係の者は去った。課をすべて唱え、口は同じ三行、肉についての三行に戻り続ける。まるでその言葉が、私が何度も通り過ぎる扉であるかのように。\n\n昼なら、これを試練と呼んで片づけられる。ここでは、蝋燭が揺れ、見る者もなく、ただ測るほかない。夜番が替わる前に寺院を出て、あの家へ着くことを、私のどこまでが望んでいるか。渇望には重さがある。膝はそれを運んで痛む。\n\n最も近い蝋燭が傾き、また立つ。冷たい石に手を置き、立たない。"
 latria_sexual_frustration_flavor.1413.a: "課を未完のまま、望む場所へ行こう。"
 latria_sexual_frustration_flavor.1413.b: "祈りを続け、夜明けまで言葉に留まろう。"
 latria_sexual_frustration_flavor.1413.c: "一節をゆっくり読み、意味が戻るに任せよう。"

 latria_sexual_frustration_flavor.1414.t: "走っても効かぬ"
 latria_sexual_frustration_flavor.1414.desc: "夜明け前から鞍にあり、鹿はまだ前方にいる。手綱を持つ手は定まっている。それが問題だ。私のほかのすべては定まらず、数日そうで、走ることはそれを緩めるだけだった。\n\n前の狩りで、あの人が笑い、髪を小川で濡らしていた姿が繰り返し浮かび、像をしまえない。犬が声を張る。馬に好きにさせ、地面が速く流れ、数馬身の間、私は何も考えていない。\n\nやがて森が閉じ、歩が落ち、すべてが戻る。腿を焼く鞍に座り、角笛の革紐が腰に跡を刻んで、私はそれを上げない。"
 latria_sexual_frustration_flavor.1414.a: "列を離れ、思いが抜けるまで走ろう。"
 latria_sexual_frustration_flavor.1414.b: "列に留まり、角笛を取って狩りの順を守ろう。"
 latria_sexual_frustration_flavor.1414.c: "狩人が指す地面を読み、足跡を追おう。"

 latria_sexual_frustration_flavor.1415.t: "閂を下ろした扉"
 latria_sexual_frustration_flavor.1415.desc: "灯は暗く、扉には閂があり、一年望んできたその人が、私の部屋に、衣を纏わず、手を私の胸に平らに当てて、ここにいる。布越しにその手は温かい。\n\n寝台へ引き寄せると、相手の重みは本物で、皮膚の熱、耳元の小さな音がある。寝台の縄が二人の下で軋む。あまりに何度も想像したので、何も起きる前から、事実のほうに私は崩れそうになる。腰が上がる。相手の口が喉を探し当て、私は自分の息を数えるのをやめる。\n\nあとには灯がまだ燃え、蝋が台を伝って一筋に流れ落ちている。相手の髪が私の腕に広がり、どちらも朝のことは口にしない。"
 latria_sexual_frustration_flavor.1415.a: "ここに留め、家人が噂するならさせよう。"
 latria_sexual_frustration_flavor.1415.b: "自室へ帰し、独りで横になろう。"
 latria_sexual_frustration_flavor.1415.c: "本を取り、手が静まるまで読もう。"

 latria_sexual_frustration_flavor.1416.t: "卓の向こうの手首"
 latria_sexual_frustration_flavor.1416.desc: "評議会は長引き、私は何も署名していない。印章は墨のそばで冷えている。火は消され、薪を呼ぶ者もいない。書記が次の一行を読み、私は意味を欠いた言葉の形だけを聞いている。卓の向こうの相手が袖を押し上げていて、私はその手首を見ているからだ。\n\n腹心の友が私と目を合わせる。私は条項をもう一度読ませる。もう一度読まれる。何も分からない。卓の下で膝が動き始め、手で押さえて静める。\n\n諸侯が立つと、私は部屋が空になるまで座っている。腹心の友が書類を持って扉のそばで待ち、何も言わず、私はありがたく、その顔を見られない。"
 latria_sexual_frustration_flavor.1416.a: "評議会を散会させ、午後を自分のために取ろう。"
 latria_sexual_frustration_flavor.1416.b: "席に留まり、書類を受け、腹心の友に白状しよう。"
 latria_sexual_frustration_flavor.1416.c: "書記を呼び戻し、立つ前にどの条項も定めよう。"

 latria_sexual_frustration_flavor.1417.t: "二度目の同じ問い"
 latria_sexual_frustration_flavor.1417.desc: "寺院は空で、案内役はまだ、巻物を整理している。私は、自分を帰すことができないので帰らない。儀礼について問い、それからまた問い、その二つは、衣を替えた同じ問いだった。\n\n案内役は辛抱強く答える。巻物は埃と杉油の匂いがする。その手を動かすのを見ながら、夜の時刻を、ある扉までどれほど歩くかを、誰か起きているだろうかを考える。二人の間の灯だけが、私を席に留めている。\n\n案内役が巻物を私の前に置き、待つ。冷たい段の上で膝が固くなった。巻に手を置き、最初の語を読み、二つ目を読まない。"
 latria_sexual_frustration_flavor.1417.a: "案内役に礼を言い、外へ出て、あの扉へ行こう。"
 latria_sexual_frustration_flavor.1417.b: "儀礼を、ゆっくりもう一度通して頼もう。"
 latria_sexual_frustration_flavor.1417.c: "巻を広げ、案内役の言葉を聞こう。"

 latria_sexual_frustration_flavor.1418.t: "庭の名"
 latria_sexual_frustration_flavor.1418.desc: "庭は人で満ち、私は正直でいるには足りるほど飲んだ。杯は頼まぬのに二度満たされた。それを声に出して言った。すべてではなく、名を含む部分を。その名は見知らぬ者のものではなかった。\n\n笑いが輪を回り、誰かが繰り返し、ほかの誰かが新しい関心で私を見る。砂利に、輪が動いた跡が残る。酒のせいとして流すべきだった。かわりに、もっと言ってしまった。輪は、覚えておこうと決めたときの輪の静けさで静まった。\n\n従者が盆を持って小道を来る。欲しくない杯を取り、沈黙を埋めぬように口に当てる。"
 latria_sexual_frustration_flavor.1418.a: "皆の前で、その名を、はっきりまた言おう。"
 latria_sexual_frustration_flavor.1418.b: "辞儀をし、暇を告げて庭を出よう。"
 latria_sexual_frustration_flavor.1418.c: "最も近い客を脇に引き、ほかの話をしよう。"

 latria_sexual_frustration_flavor.1419.t: "廊下からこの方"
 latria_sexual_frustration_flavor.1419.desc: "扉に閂を下ろし、掛布を捲り、もう疲れているふりをやめる。身体は午後の、廊下で腕に置かれた手のときからこの調子で、落ち着かない。\n\n指を自分に当てると、聞かれたくない形で息が吐き出される。廊下のこと、その袖の亜麻のこと、指の正確な圧のことを思う。背が寝台から反る。もう一方の手を口に当てねばならない。\n\n長い時間がかかり、震えを残す。灯はまだ点いている。腕を目の上に置き、敷布を腰までねじったまま横たわり、昼の熱の匂いがまだし、渇望は消えず、ただ静かになった。"
 latria_sexual_frustration_flavor.1419.a: "成るに任せ、疲れたふりをやめよう。"
 latria_sexual_frustration_flavor.1419.b: "手を握り、ゆっくり息をして、震えが過ぎるのを待とう。"
 latria_sexual_frustration_flavor.1419.c: "灯の下で一頁、身体が静まるまで読もう。"

 latria_sexual_frustration_flavor.1420.t: "鞍の二日"
 latria_sexual_frustration_flavor.1420.desc: "鞍の二日、草原は果てしなく続く。鞍が膝の下に擦過を拵えた。馬は私より拍を知っている。野営を出てから、まともに眠っていない。眠れぬのは、横になる地面のせいではない。\n\n火のそばで髪を編むあの人のこと、糸の先を噛んだ様子を思う。風は冷たく、手は裂け、それでも思いは戻って低く落ち着き、執拗に、第二の鼓動のように打つ。\n\n丘を越えると、草は川まで下り、音のない淡い一筋になる。独りで戻ることもできる。馬が私の下で動いて待つ。私は手綱を緩めたまま、戻らない。"
 latria_sexual_frustration_flavor.1420.a: "野営へ戻り、夜が与えるものを取ろう。"
 latria_sexual_frustration_flavor.1420.b: "皆と進み、拍を保とう。"
 latria_sexual_frustration_flavor.1420.c: "隼を放し、水までの飛びを追おう。"

 latria_sexual_frustration_flavor.1421.t: "用心の外"
 latria_sexual_frustration_flavor.1421.desc: "宴は、誰も用心しなくなる境を過ぎた。一晩、あの人を見ていて、一度も目を逸らさず、それを今、広間の皆に、通る声で言ってしまった。\n\n杯が倒れる。楽師はまだ始めていない。誰かが笑い、誰かが相手を呼ぶ。私は、言葉がまだ続くまま立ち上がっている。望む時刻と場所を名を挙げて言い、部屋はそれを聞いた。明日のどの形においても、これは冗談では済まない。\n\n隣の客が袖を引く。脚が定まらぬので座る。蝋が卓を伝って袖にまで流れている。杯がまた手に置かれ、私はまだ卓越しを見ている。"
 latria_sexual_frustration_flavor.1421.a: "誰も聞き違わぬよう、時刻と場所をまた言おう。"
 latria_sexual_frustration_flavor.1421.b: "座って飲み、騒ぎに覆わせよう。"
 latria_sexual_frustration_flavor.1421.c: "隣の客に向き直り、相手の家のことを尋ねよう。"
 latria_sexual_frustration_flavor.1421.d: "そのすべてを、卓のための詩にしよう。"

 latria_sexual_frustration_flavor.1422.t: "三夜の祈り"
 latria_sexual_frustration_flavor.1422.desc: "三夜続けて祈りを守り、断食が頭を軽くした。冷たさが足の小骨に入り込んでいる。課の言葉は口にあり、あの人は心にあり、その二つは、分かちがたく絡んでいる。\n\n誓いが求めるものは知っている。喜んで唱え、今夜まで不本意に唱えたことはない。手は冷たく、胃はパンの味を忘れている。膝の下の石は滑らかに磨れ、私はまるで何年もここに跪いてきたように収まる。意味のある点では、そうなのだ。\n\n暗がりのどこかで兄弟が咳をし、柱の陰の腰掛けで誰かが身を動かす。頭をさらに下げ、祈りは私の声を欠いて続いていく。"
 latria_sexual_frustration_flavor.1422.a: "断食を解き、祈りを離れ、望みを認めよう。"
 latria_sexual_frustration_flavor.1422.b: "断食を守り、夜の残り、誓いを保とう。"
 latria_sexual_frustration_flavor.1422.c: "魂についての段に戻り、通して読もう。"

 latria_sexual_frustration_flavor.1423.t: "誤った数字"
 latria_sexual_frustration_flavor.1423.desc: "勘定が合わず、同じ欄を四度読んだ。蝋燭は新しく、蝋は流れていない。部屋の向こうで、誰かが書記に口述し、その声は群衆の中でも分かる声で、私の心は欄をまるで離れている。\n\n頁に指を置いて位置を保つ。保てない。書記の筆は動き続ける。喉に自分の脈を感じる。馬鹿げている。部屋は冷たく、私は冷たくない。\n\n口述が止むと、私は早く顔を上げすぎる。書記が待っている。数字をまた尋ね、誤ったほうを書く。墨はその上で乾き、部屋が空になるまで直さない。"
 latria_sexual_frustration_flavor.1423.a: "勘定を置き、声の行く先へ行こう。"
 latria_sexual_frustration_flavor.1423.b: "どの数字も正しくなるまで、欄に留まろう。"
 latria_sexual_frustration_flavor.1423.c: "帳簿を運ばせ、最初の一行から確かめよう。"

 latria_sexual_frustration_flavor.1424.t: "手つかずの酒"
 latria_sexual_frustration_flavor.1424.desc: "扉は掛け金が下り、酒は手つかずで、望んできたその人が、衣を寛げ、手を私の顔に当てて、ここにいる。その手は初めは冷たく、それから冷たくない。\n\n引き寄せると、その全体は、私が想像した何よりも温かく、不器用だ。相手の膝が寝台を探し、枠が一度壁に当たる。手が相手の腰のくぼみへ、そして下へ。相手が立てる音は静かではなく、誰に聞かれても構わない。待った長さに、私は震えている。\n\nあとには灯が燃え尽き、杯の酒はぬるくなっている。相手の頭が私の肩にあり、その下で腕が痺れ、私は相手の呼吸を聞いている。"
 latria_sexual_frustration_flavor.1424.a: "一年の待ちが私から奪ったものを、はっきり話そう。"
 latria_sexual_frustration_flavor.1424.b: "身を退き、衣を整え、手を自分に留めよう。"
 latria_sexual_frustration_flavor.1424.c: "静かに横たわり、暗い灯の下で眠るまで読もう。"

 latria_sexual_frustration_flavor.1425.t: "勤勉な手"
 latria_sexual_frustration_flavor.1425.desc: "森に三日、狩りは上首尾で、そのどれもが私の中のそれに触れない。私は勤勉だ。皆より早く起き、道具を乾かし、狩人が与える列を受け持つ。手は命じられたことをする。\n\nほかの部分は別の場所にある。ある午後、戸口、忘れられぬ仕方で私の名を呼んだあの人を思い出す。記憶は、鐙に立っているときにも、獲物を捌いているときにも、手に獣皮の匂いを残したまま来る。\n\n火は弱く、炭は冷えながら爆ぜる。腕は一日の疲れで痛み、私は仰向けに目を開いて、馬が動く音を聞いている。"
 latria_sexual_frustration_flavor.1425.a: "列を離れ、鹿毛を暗がりへ連れ出そう。"
 latria_sexual_frustration_flavor.1425.b: "息をし、腹帯を締め、今日の仕事を終えよう。"
 latria_sexual_frustration_flavor.1425.c: "眠る前に、道具を乾かし、数を確かめよう。"

 latria_sexual_frustration_flavor.1426.t: "一頁半"
 latria_sexual_frustration_flavor.1426.desc: "書斎は静かで、案内役が本文を広げ、私は一頁半、一言も入らないまま読んだ。親指が余白に跡を残している。灯は良い。夜は長い。私が呼ばれる場所はどこにもない。\n\n家人が眠り、廊下が空になる時刻を考え続けている。案内役が頁をめくり、論旨を追えているかと尋ねる。追えていると答える。魂の本性についての最初の一行から追えておらず、それが惜しい。最も必要な一行なのに。\n\n案内役は筆を持って待ち、椅子は私が動くたびに関節が鳴る。頁を見て、自分の手は木の上に平らに、動かず、もっと落ち着いた誰かの手のようだ。"
 latria_sexual_frustration_flavor.1426.a: "本を閉じ、廊下が空のうちに出よう。"
 latria_sexual_frustration_flavor.1426.b: "席に留まり、頁を初めから読み直そう。"
 latria_sexual_frustration_flavor.1426.c: "案内役に、論旨をもう一度辿ってもらおう。"

 latria_sexual_frustration_flavor.1427.t: "酒を惜しまぬ"
 latria_sexual_frustration_flavor.1427.desc: "私は酒を惜しまず、相手方も惜しまず、そのどこかで、卓に望みを話した。はっきりとは言わない。はっきりするには足りた。名を口にし、口にしながら顔を見なかった相手がここにいる。\n\n誰かの笑いが止まり、犬が腰掛けの下で何かを噛んでいる。杯は空で、従者が満たし、私はさせる。部屋は、手渡されたものをどう扱うか決める人々の静けさで満ちている。\n\n今夜、姉の席は空で、その杯は従者が置いた場所にある。値打ちのない慈悲だ。両手を卓に置くと木は冷たく、広間の向こうで音楽がまた始まる。"
 latria_sexual_frustration_flavor.1427.a: "名を添えて、もう一度言い、家に聞かせよう。"
 latria_sexual_frustration_flavor.1427.b: "皆に礼を述べ、外套を取って去ろう。"
 latria_sexual_frustration_flavor.1427.c: "皆の杯を満たし、話を収穫に移そう。"
 latria_sexual_frustration_flavor.1427.d: "最も賑やかな客と冗談を競い、部屋を次へ進めよう。"

 latria_sexual_frustration_flavor.1428.t: "聖像が見ている"
 latria_sexual_frustration_flavor.1428.desc: "寺院は冷たく、聖像はすべて見ていて、私は一時間動いていない。膝は痺れた。欲は痺れない。覆われぬ炭のように、私の中に座っている。蝋燭の煙は、隙間風もなく真っ直ぐに上る。\n\n解放を祈り、力を祈り、ここでは、どちらの答えを望むか分かるほどには正直だ。あの人の顔が、私と黄金の間から浮かぶ。押し返さない。灯は油の匂いがし、大理石は冷たく、身体はどちらにも興味がない。\n\n司祭の足音が背後を通る。頭を下げ、手を組み、膝が石に二つの湿った跡を残し、心は街の向こうの戸口にある。"
 latria_sexual_frustration_flavor.1428.a: "立ち、街を横切り、見守りは聖像に委ねよう。"
 latria_sexual_frustration_flavor.1428.b: "誓いを守り、課が終わるまで大理石に留まろう。"
 latria_sexual_frustration_flavor.1428.c: "詩篇の頁を開き、言葉が保つまで読もう。"

 latria_sexual_frustration_flavor.1429.t: "夏至の壁"
 latria_sexual_frustration_flavor.1429.desc: "この時刻の庭は誰のものでもなく、寝台のほうが堪えがたかったので、私はここにいる。夜は暖かい。砂利の小道は昼の熱を保っている。どこかで泉が流れ、庭で唯一の声で、香草の匂いは味わえるほど強い。\n\n二夜、眠っていない。小道を歩くと砂利が鳴り、どの曲がり角も同じ壁へ戻る。夏至にあの人と並び、何も言わず、どちらも承知していた、あの壁だ。\n\n手は石にある。まだ温かい。蛾が背後の灯へ繰り返し戻る。額を壁に近づけ、息を乱して立ち、泉は流れ続ける。"
 latria_sexual_frustration_flavor.1429.a: "門を出て、夜に言おう。"
 latria_sexual_frustration_flavor.1429.b: "誓いを守り、手を壁から離して内へ入ろう。"
 latria_sexual_frustration_flavor.1429.c: "空が灰色になり、脚が疲れるまで小道を歩こう。"

 latria_sexual_frustration_flavor.1430.t: "弦は冷たい"
 latria_sexual_frustration_flavor.1430.desc: "家が眠り、もう横になっていられなかったので、楽器を取り出した。弦は冷たく、撥は片側が薄く削れている。いつも弾く曲を弾くが、足りない。一週間、足りていない。\n\n指は型を覚え、ほかの部分はまるで別の場所、鎧戸を閉じたままの部屋、何度も戻る午後にいる。音は闇へ出て、誰も聞かない。\n\n音を殺すために弦の上へ手を平らに置いて止める。あとの静けさのほうが悪い。楽器を膝に横たえて座り、弦は冷えで緩み、頭を椅子の背に預け、窓の縁が灰色になっていく。"
 latria_sexual_frustration_flavor.1430.a: "下手でも通して弾き、家全体に聞かせよう。"
 latria_sexual_frustration_flavor.1430.b: "楽器を置き、夜の残りを座って過ごそう。"
 latria_sexual_frustration_flavor.1430.c: "盤を出して、光が差すまで両側を指そう。"

 latria_sexual_frustration_flavor.1431.t: "闇の中の縫い目"
 latria_sexual_frustration_flavor.1431.desc: "蝋燭は一時間前に揺らいで、私は掛布を引き上げていない。寝衣は腰のあたりでたくし上がっている。指がその縫い目を探し当て、下へ進む。廊下が静かなときにと覚えた、遅い仕方で。目を閉じたまま、先週、私の酒を注いだ執事を思い出す。袖が手首を掠め、一息長く留まった、そのことを。\n\n息が止まって、保たれる。手を動かすと、渇望はもっと低く、両端を引かれる結び目のように締まる。耳元に寄せた相手の口を、言い終えなかった言葉を思う。掌の下で亜麻は温かく湿っている。\n\n廊下で板が軋む。手が止まり、また動き、私はさせる。闇がもうひととき、私の秘密を保つ。"
 latria_sexual_frustration_flavor.1431.a: "闇で終え、飢えを自分のものと認めよう。"
 latria_sexual_frustration_flavor.1431.b: "手を引き、芯が沈むまで身を固くして横たわろう。"
 latria_sexual_frustration_flavor.1431.c: "掛布を巻き、疼きが緩むのを待とう。"

 latria_sexual_frustration_flavor.1432.t: "未完の晩課"
 latria_sexual_frustration_flavor.1432.desc: "礼拝堂は空になり、私は寝衣のまま冷たい石に跪き、祈りは薄く、さまよっている。先の告解を聞いた司祭が、私の下げた頭に手を置き、そのままにされた。あれから、その重みを下ろせない。掌が薄い布越しに腿を押し、その押しは祈りではない。\n\n膝を移す。亜麻を通して石が衝撃になる。あの手のこと、その温かさ、我に返る前に少し身を預けてしまったことを思う。穹窿の静けさの中で息が乱れ、もっと強く押し、求めて、なお得られぬ。\n\n鐘の綱が頭上で静かに垂れている。暗い祭壇に顔を上げ、手をそこに置いたまま。"
 latria_sexual_frustration_flavor.1432.a: "祈りが拒んだものを、身体に与えよう。"
 latria_sexual_frustration_flavor.1432.b: "手を組み、夜明けまで祈りを守ろう。"
 latria_sexual_frustration_flavor.1432.c: "書を開き、言葉が私を冷ますまで読もう。"

 latria_sexual_frustration_flavor.1433.t: "シダの寝床"
 latria_sexual_frustration_flavor.1433.desc: "夕暮れに狩りは散り、私は緑の暗がりに独り、馬は近くで草を食んでいる。苔むした幹を背に滑り下ろすと、乗馬の着物は汗で湿っている。私を追う記憶は、小川を越えさせようと腰を掴んだ狩人のものだ。胸が背に硬く当たり、息が首にかかる。手は帯の中へ滑り込んでいる。\n\n押すと樹皮が肩に食い込む。腕のことを、すぐには離さなかった様子を思う。息が冷気に白く立つ。渇望は遅い一擦りごとに固く巻き、森は私を囲んで静まり、葉は見えぬどこかで滴る。\n\n小枝が折れる。手が凍る。馬が頭を上げ、私は樹に身を預けたまま、耳で高く打つ脈とともにいる。"
 latria_sexual_frustration_flavor.1433.a: "この樹にもたれて、先の鋭さを削ごう。"
 latria_sexual_frustration_flavor.1433.b: "手を引き、過ぎるまでゆっくり息をしよう。"
 latria_sexual_frustration_flavor.1433.c: "立ち、馬を引いて木立を戻ろう。"

 latria_sexual_frustration_flavor.1434.t: "出さぬ一筆"
 latria_sexual_frustration_flavor.1434.desc: "書斎の火は弱く、手紙は書きかけで、出さぬつもりの一通が、私の手の下にある。書き留めた最後の一行、正直な、あまりに正直な一行を読み、もう一方の手は脚の紐へ這い寄っている。同じ机で近すぎた距離に立ち、地図ではなく私の顔を読んで、微笑んだ使節を思う。\n\n紐を緩める。息が短くなる。首の傾げを、答えそこねた招きを思い出し、手は自分の意志で動き、もう一方の手には乾いた羽根筆がある。火が爆ぜる。渇望は集まり、しまい込める程度に理屈で下ろしてはくれない。\n\n隙間風に蝋燭が傾く。目を閉じ、使節が始めたことを、思いに終えさせる。"
 latria_sexual_frustration_flavor.1434.a: "真実を書き留め、灯した疼きを和らげよう。"
 latria_sexual_frustration_flavor.1434.b: "紐を結び、素っ気ない一言で退こう。"
 latria_sexual_frustration_flavor.1434.c: "地図を取り上げ、冷えて事を量ろう。"

 latria_sexual_frustration_flavor.1435.t: "最後の杯のあと"
 latria_sexual_frustration_flavor.1435.desc: "宴は、揺らぐ数本の蝋燭に痩せ、私の正面の客は帰らない。卓の下で、私の膝が相手の膝に落ち着き、どちらも動かさない。酒が私の中で鳴っている。私の冗談に笑い、身を寄せた様子を思う。口をその短い距離だけ相手の口へ返せるほど近く。\n\n空いた手が腰掛けを握る。この隔たりを、久しく何よりも望んでいる。渇望は、喉から腹まで張り詰めた明るい針金だ。相手は杯の縁越しに私を見る。最後の従者は去った。広間は燃え尽きた獣脂と、二人の呼吸の匂いがする。\n\n相手の膝が一度、押し返す。手が腰掛けを離れ、相手の袖の縁を探し当て、どちらも口をきかない。"
 latria_sexual_frustration_flavor.1435.a: "次にすることは、音楽に覆わせよう。"
 latria_sexual_frustration_flavor.1435.b: "頭を下げ、望みを祈りに仕込もう。"
 latria_sexual_frustration_flavor.1435.c: "勝負を提案し、盤に血を冷まそう。"
