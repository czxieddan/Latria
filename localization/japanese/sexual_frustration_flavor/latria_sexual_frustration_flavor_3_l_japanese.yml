l_japanese:
 latria_sexual_frustration_flavor.1201.t: "訪れる者のない時"
 latria_sexual_frustration_flavor.1201.desc.female: "寝衣のまま、窓辺で長いこと待っていた。卓上の茶は熱さを失い、やがて表面に薄い膜ができた。会う約束など一度もしていない。それなのに私は灯りを残し、空の杯を用意し、窓際の椅子までまっすぐに直していた。\n\n庭を通ったのは夜警が一度きりだった。灯籠の光が塀の上をかすめ、また消えた。杯を回してみても、茶はもう飲めそうにない。あの人が前に帰る時に言った「暇ができたら」を思い出した。その言葉ならどの夜も当てはまるし、どの夜も当てにできなかった。\n\n灯芯が短くなった。私はまだ座り、片側にずれた寝衣も引き上げずにいた。"
 latria_sexual_frustration_flavor.1201.desc.male: "寝衣のまま、窓辺で長いこと待っていた。庭から聞こえるのは夜警の足音だけで、一歩ずつ遠ざかり、また近づく。誰も来ないのに、私は灯りを残していた。そうすれば、口にできなかった誘いの続きを言える気がした。\n\n冷めた茶をひと口飲むと、苦さに顔をしかめた。それでも最後まで飲んだ。底に残った数枚の葉を見つめる。あの人が今夜どこか別の場所にいるのか、そこからわかるはずもないのに。窓の外では風が枝を押し下げ、また放していた。\n\n窓枠に手を置くと、木は冷たかった。手のひらから冷えていっても、心の高ぶりは消えなかった。"
 latria_sexual_frustration_flavor.1201.desc: "灯芯が短くなっても、窓の外には何の気配もなかった。\n\n私は一度、芯をかき立てた。炎は強くなったが、すぐにまた低く戻った。卓には紙と筆と、もう飲めない茶がある。どれにも手を伸ばしたが、今夜の過ごし方は少しも変わらなかった。\n\n結局、私はただ座っていた。静けさの中に、自分の呼吸だけが聞こえていた。"
 latria_sexual_frustration_flavor.1201.a: "伝えるつもりだった言葉を書こう。"
 latria_sexual_frustration_flavor.1201.b: "蝋燭を消し、思いを抑えて横になろう。"

 latria_sexual_frustration_flavor.1202.t: "浴場の外の囁き"
 latria_sexual_frustration_flavor.1202.desc.accepted: "浴場の外の談笑は、誰が誰と連れ立って来ても途切れなかった。戸の隙間から湯気があふれ、洗い草と熱い石の匂いを運んでくる。濡れた髪の人が、衣の帯を緩く結んだまま私のそばを通った。誰も目を留めなかった。\n\nありふれた光景として、気にせずにいられるはずだった。だが敷居の外に立つ私は、あれほど気楽に誰かのそばにいたことが、もう長くないと思い出した。中からは、湯上がりらしい声で誰かの名を呼ぶ笑い声がする。私の指は戸枠の上で止まった。\n\n風が湯気を顔まで運んできた。私は入ることも、その場を去ることもしなかった。"
 latria_sexual_frustration_flavor.1202.desc.strict: "浴場の外で、数人の貴族が誰と誰は会わない方がよいと話していた。私の名前が聞こえた途端、話が止まった。中ではまだ水音がしているのに、外は衣擦れが聞こえるほど静かになった。\n\n一人が私に会釈した。あまりに素早い仕草だった。別の一人は、整っている袖口をまた直し始めた。どんな話をしていたかは察しがつく。耳が熱かったが、浴場の湯気のせいではなかった。\n\n私はしばらくその場に立っていた。中から繰り返す水音が、この沈黙の長さを数えているようだった。"
 latria_sexual_frustration_flavor.1202.desc: "浴場の中では絶えず水音がしていたが、私が気を取られたのは戸口に漏れる人の声だった。\n\n顔を洗いに来ただけだった。ところが入口まで来ると、中で小声の会話が聞こえ、途中から笑いに変わった。大きな声ではない。それでも私は足を止めた。何がおかしいのかはわからない。ただ、ここで聞き耳を立てるべきではないことはわかっていた。\n\nそれでも、その一言を最後まで聞いてしまった。聞き終えると、顔は手に持った布より熱くなっていた。"
 latria_sexual_frustration_flavor.1202.a: "待ち望む逢瀬の話を、いつまでも語ろう。"
 latria_sexual_frustration_flavor.1202.b: "思いを脇に置き、礼を言って帰ろう。"

 latria_sexual_frustration_flavor.1203.t: "祈りの後の沈黙"
 latria_sexual_frustration_flavor.1203.desc.favors: "祭司は、人の欲望が生まれつき罪なのではないと話した。鐘の音がまだ梁に響くうちに聖典を閉じ、私の言葉を待つ間を残した。\n\nその教えを信じたかった。だが、胸の寂しさは少しも小さくならない。私は跪いたまま自分の手を見た。昼には人にパンを分けた手が、夜にはここにいない人を引き留めたいと願っている。信仰が許してくれても、この手を取る人がいるわけではなかった。\n\n祭司は質問を待っていた。私には何も聞けず、ただ額にかかった髪を払った。"
 latria_sexual_frustration_flavor.1203.desc.condemns: "祭司は禁欲の美徳を説いた後、黙った。その沈黙は教えの言葉より重かった。私は跪いたままで、膝の下の敷物は温まっていた。祈りは慣れたものなのに、心は遠く、殿堂の外のどこかの道に留まっていた。\n\n答えるべきだとはわかっていた。だが喉には息しかなく、吐き出すと、ごく小さな「はい」になった。祭司はこちらを一度見ただけで、それ以上は尋ねなかった。その眼差しに、今の返事がますます頼りなく感じられた。\n\n鐘が鳴りやんだ。殿堂には、時折はぜる灯芯の音だけが残った。"
 latria_sexual_frustration_flavor.1203.desc: "祈りは終わっても、殿堂にはまだ鐘の音が響いていた。\n\n皆はもう立ち上がった。私は一文唱え忘れたように跪いていた。本当は一文も抜けていない。ただ、唱え終えても気持ちの高ぶりが残っていた。祈りとともにも、皆とともにも去ってはくれなかった。\n\n私は手のひらを石板に当てた。石は冷たかったが、その冷たさは手首までで止まり、それ以上は届かなかった。"
 latria_sexual_frustration_flavor.1203.a: "ひとまず禁欲の教えから離れよう。"
 latria_sexual_frustration_flavor.1203.b: "思いを抑え、もう一度祈ろう。"

 latria_sexual_frustration_flavor.1204.t: "狩りの後も落ち着かず"
 latria_sexual_frustration_flavor.1204.desc.lustful: "狩りの衣を脱いだまま、独り寝室にいる。まだ耳には弓弦の響きが残っていた。衣は椅子へ投げ出し、靴の泥も乾いていない。脚も肩も疲れていたが、私の心はその疲れに向いていなかった。\n\n昼間、林の中で馬に乗った一人とすれ違った。ただすれ違っただけで、袖すら触れていない。それなのに私は、あの一瞬を何度も思い返していた。手綱を引く手、振り返った時のかすかな笑み、そして笑った後はもうこちらを見なかったこと。今この部屋に馬もその人もいない。銅鏡に映るのは自分だけだった。\n\n寝台の縁に座って初めて、まだ何も羽織っていないことを思い出した。"
 latria_sexual_frustration_flavor.1204.desc.chaste: "狩りの衣を脱いだまま寝室に独りで、祈りと務めに心を戻そうとしていた。衣は脇に畳んだが、顔を洗いに行くことさえ忘れていた。目を閉じるたびに浮かぶ思いは、林で見た獣の跡よりも鮮明だった。\n\n心の中で誓いの言葉をたどった。途中まで来ると、林の中であの人が振り返った姿が浮かび、言葉が途切れた。私は目を開け、自分の手を見た。まだ震えている。狩りの疲れのせいなのか、ほかに理由があるのかはわからなかった。\n\n扉の外で従者が湯は要るかと尋ねた。返事をすると、思っていたより声がかすれていた。"
 latria_sexual_frustration_flavor.1204.desc: "狩り場から人が去っても、私の心の落ち着かなさは消えなかった。\n\n部屋に戻り、弓を置き、手袋を置いた。だが、昼間のあの一瞥だけは手放せなかった。部屋には泥と汗の匂いがしていた。しばらく立ってから、誰かが続いて入るのを待つように、ずっと扉を見ていたことに気づいた。\n\n誰も入ってこなかった。その扉を閉じたのは、私自身だった。"
 latria_sexual_frustration_flavor.1204.a: "狩場で見たあの姿を思い出そう。"
 latria_sexual_frustration_flavor.1204.b: "衣を着て机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1205.t: "閉ざした書斎"
 latria_sexual_frustration_flavor.1205.desc.emperor: "人払いを命じた書斎には、地図と印章と未処理の書類が残った。扉が閉まると、私の呼吸しか聞こえなくなった。引き出しから取り出した古い手紙は、もう端が毛羽立っていた。\n\n国事に触れた手紙ではない。果たせなかった一度の逢瀬と、その時は先が長いと思って聞き流した一言が書かれている。あれから多くの日が過ぎ、手紙はまだある。私は印章をその上へ置き、またどけた。印章は冷たいのに、紙にはまだ温もりが残っている気がした。\n\n扉の外から、食事を運ぶかと控えめに尋ねられた。私は答えなかった。"
 latria_sexual_frustration_flavor.1205.desc.adventurer: "道順と当番はもう紙に書いてあり、仲間は戸の外で待っていた。全員の休む時刻を決めたのに、自分の番になると筆が止まった。引き出しの古い手紙が端を見せ、道順を書いた紙に隠されるのを拒んでいるようだった。\n\n取り出して冒頭の呼びかけを読むと、今読むべきでなかったとわかった。外から戸を叩く音がして、次の目的地へ行くのかと聞かれた。私は「行く」と答えたが、目は手紙の二行目に留まっていた。\n\n二行目には地名が一つあるだけだった。そこは、私たちが通る場所ではなかった。"
 latria_sexual_frustration_flavor.1205.desc.clergy: "独り書斎に座っていた。帳簿は開いたまま、聖典も片づけていない。頁に挟んだ古い手紙へ、私は何度も手を伸ばしては引っ込めていた。\n\n今日届いた手紙ではない。ずいぶん前から挟んであって、この頁を開くたびに手が止まるようになっていた。今日はついに抜き出した。紙の上に礼を外れた言葉はなかったが、読んでいると呼吸が乱れた。\n\n廊下を誰かが通り、祈りの珠が小さく触れ合った。私は手紙を本に戻して押さえたが、指にはまだその縁が感じられた。"
 latria_sexual_frustration_flavor.1205.desc.ruler: "書斎の外に従者を待たせ、邪魔をしないよう命じた。目の前には印章と書類が並んでいたが、引き出しから出した古い手紙を、私はいつまでもしまえずにいた。\n\n橋についての報告を裁可するはずだった。紙の上で筆先が止まり、墨が落ちて点になった。それを見ていると、手紙にあった、橋とは何の関係もない一文を思い出した。ほんの短い言葉なのに、何行目にあったかまで覚えていた。\n\n外で待つ者が足を踏み替えた。私は報告を脇へ押しやり、引き出しに手を伸ばした。"
 latria_sexual_frustration_flavor.1205.desc: "書斎の扉を閉めた。卓には古い手紙も、済んでいない仕事も残っていた。\n\n閂の下りる音は小さかった。それが収まると、部屋にあるのは紙ばかりのように思えた。私は仕事の書類を左へ、手紙を右へ置いた。しばらく眺めてから、手紙を真ん中へ移した。\n\n灯芯が一度はぜた。私はそれを切り整えようともしなかった。"
 latria_sexual_frustration_flavor.1205.a: "仕事は明日にして、手紙を読み返そう。"
 latria_sexual_frustration_flavor.1205.b: "昔の思いを抑え、務めに取りかかろう。"

 latria_sexual_frustration_flavor.1206.t: "宴席の噂"
 latria_sexual_frustration_flavor.1206.desc.accepted: "宴席で誰かが恋人の話をしていた。天気を話すような気軽な調子だった。酒がひと巡りするうち、話に出る名は二人分も替わったが、皆は笑い続けていた。声を落とす者もいなかった。\n\n私も笑って済ませるつもりだった。だが笑いながら、こんな話に加わらなくなって久しいことに気づいた。杯を置くにも、先に周りを見なければ落ち着かないほどだった。話せる恋の一つもないのかと隣の客に聞かれ、私の指は杯の縁で止まった。\n\n人々の向こうから音楽が流れてきた。聞こえてはいたが、何の曲かはわからなかった。"
 latria_sexual_frustration_flavor.1206.desc.strict: "数人の貴族が、不作法で寵を失った同僚について話していた。やがて一人が私の名を口にした。会話は完全には止まらず、大声が息のような小声に変わった。私はうつむいて袖口を直し、加わらなかった。\n\nその話は本当とは限らない。だが、真偽はもう問題ではなかった。私の胸にも席上には出せない思いがあり、彼らの目にはそれが見えている気がした。酒を飲み干すと、喉よりも顔に熱がこもった。\n\n誰かが杯を上げて話題を変えようとした。杯を合わせる音に、私の手はやはり震えた。"
 latria_sexual_frustration_flavor.1206.desc: "人々の向こうから音楽が聞こえていたが、私は席上の会話に気を取られていた。\n\n座ったまま、前後左右の話に耳を傾けていた。話題はあちこちへ移りながら、結局は寝室の内情や私的な手紙へ行き着く。笑う者、咳をする者、横目でこちらを見る者もいた。その一瞥が偶然かどうか、私にはわからなかった。\n\n空の杯を一周させた。底が卓を擦り、小さな音を立てた。"
 latria_sexual_frustration_flavor.1206.a: "昔の話をすべて語ろう。二人きりで交わした言葉さえも。"
 latria_sexual_frustration_flavor.1206.b: "口をつぐみ、同席の者たちに一礼して帰ろう。"

 latria_sexual_frustration_flavor.1207.t: "祈りの後の空席"
 latria_sexual_frustration_flavor.1207.desc.favors: "礼拝が終わると、祭司は聖典を席に置いて去った。空いた座には、座っていたくぼみがまだ残っていた。信仰は欲を罪とは見なさない。今読んだ頁には、その言葉がはっきりと書かれていた。\n\nそれでも私は、どうすれば心が静まるのかわからなかった。許されていることと、夜に独りで自分の思いに向き合うことは別だった。空席のそばにしばらく立ち、座ることも聖典を閉じることもしなかった。\n\n風に押され、殿堂の扉が少しだけ開いた。そこから差した光が、ちょうどあの一行を照らした。"
 latria_sexual_frustration_flavor.1207.desc.condemns: "祭司が去った後も、私はその場に跪いていた。貞潔の教えに曖昧な点はなく、どの条文もそらで言える。だが、心の渇望は祭司と一緒には去らなかった。膝をつき、手を置いている今も、はっきりと残っていた。\n\n空いた席を見つめるうち、何も考えずにいられる木の板が羨ましくなった。私にはできない。額の端を寄せてみても、感じるのは自分の熱ばかりだった。\n\n蝋燭がまた少し短くなった。私はまだ跪いていた。"
 latria_sexual_frustration_flavor.1207.desc: "殿堂に残ったのは私と、まだ消えていない蝋燭だけだった。\n\n皆の足音はもう遠い。今なら立ち去り、戸を閉め、この頁も終わりにできたはずだった。私はそうしなかった。空いた席の間を二歩ほど歩き、また元の敷物へ戻った。\n\n炎は静かだった。それなのに、耳の奥には自分の鼓動が響いていた。"
 latria_sexual_frustration_flavor.1207.a: "神殿を出て、あの愛情に思いを馳せよう。"
 latria_sexual_frustration_flavor.1207.b: "欲望を抑え、戒律を読み返そう。"

 latria_sexual_frustration_flavor.1208.t: "林の中の追跡"
 latria_sexual_frustration_flavor.1208.desc.lustful: "獲物が林を抜け、皆がその後を追った。私も馬を駆った。枝が袖を打ち、馬の汗の匂いが迫ってくる。しばらく走ってから、自分が追っているのは獣ではないと気づいた。\n\n前に一人の背中があった。一緒に狩りに来た者で、それ以上ではない。それでも、騎乗するその姿に目が吸い寄せられ、分かれ道さえ見落とした。猟犬の声は左へ進んでいくのに、私の馬はまだまっすぐ進んでいた。\n\n手綱を引いた。あの人は振り返らなかった。私だけが、狩りのためとは思えないほど息を乱していた。"
 latria_sexual_frustration_flavor.1208.desc.chaste: "手綱を引き、ここへ来たのは狩りのためだけだと自分に言い聞かせた。猟犬の声が遠ざかっていく。湿った泥に蹄の跡は明瞭だったが、私は二度見てようやく曲がった方向を読み取った。\n\n思いは足跡についていかなかった。さっき鞍帯を締めるのを手伝ってくれた人の手を、まだ考えていた。確かな手つきで締め終えると、その人は手を離し、何も言わなかった。私はそれだけのことに、別の意味を持たせていた。\n\n馬が鼻を鳴らした。そこで初めて、ずいぶん長く同じ所に留まっていたことに気づいた。"
 latria_sexual_frustration_flavor.1208.desc: "一行は林の中で止まり、追跡を続けるかどうか、私の判断を待っていた。\n\n皆の顔がこちらを向いている。馬具からはまだ水が滴り、額を拭う者もいた。地面の跡ははっきり見えているのに、私の返事は定まらなかった。心の半分はまだ林の向こうにいて、獲物とは関係のない人を思っていた。\n\n木々の間を風が抜けた。私は手綱を握ったまま、すぐには口を開かなかった。"
 latria_sexual_frustration_flavor.1208.a: "皆を先に行かせ、思いにふけろう。"
 latria_sexual_frustration_flavor.1208.b: "気を取り直し、狩りの一行を進めよう。"

 latria_sexual_frustration_flavor.1209.t: "窓辺の残り火"
 latria_sexual_frustration_flavor.1209.desc.female: "寝衣で窓辺に座る頃には、炉にわずかな熾火が残るだけだった。昼間言えなかった言葉を、私は口の中で繰り返し、またのみ込んだ。長い言葉ではない。ただ、ここまで言わずにいた時間が長かった。\n\n熾火が時折明るくなり、膝の上の手を照らした。指は知らぬ間に寝衣の縁を握り、皺をつけていた。今日あの人がそばを通った時、袖が起こした風を思い出す。ただの風なのに、どちらから吹いたかまで忘れられなかった。\n\n外で夜番が時を告げた。私は応じず、眠ろうとも思わなかった。"
 latria_sexual_frustration_flavor.1209.desc.male: "寝衣のまま窓枠にもたれ、庭を巡る夜警の灯りを見ていた。灯りが一つずつ過ぎると、夜も小さく区切られていくようだった。それでも、応えてもらえなかった思いは少しも途切れず、胸に残っていた。\n\n額を窓の格子に当てた。木には古い塗料の匂いがあった。話しながら別の方を見ていた、あの人を思い出す。こちらを見たら言葉の意味が変わってしまうのを、恐れているようだった。あの時は私も目を逸らした。その後、二人とも何も言わなかった。\n\n炉の炭が音を立て、少し崩れた。"
 latria_sexual_frustration_flavor.1209.desc: "窓の外は静かで、炉の火も暗くなっていた。それでも私は、まるで眠くなかった。\n\n小さな薪を一つ足しても、火は強まらず、煙が少し上がっただけだった。寝衣にその匂いが残った。窓辺へ戻って座り、昼間伝えられなかった一言をまた心の中で唱えた。唱え終えても、聞き手はいなかった。\n\n庭は夜の闇に覆われていた。私はその闇を見ていたが、そこから私を見る者はいなかった。"
 latria_sexual_frustration_flavor.1209.a: "思いを紙に書き留めよう。"
 latria_sexual_frustration_flavor.1209.b: "火を焚き、思いを脇に置いて横になろう。"

 latria_sexual_frustration_flavor.1210.t: "叩かれぬ扉"
 latria_sexual_frustration_flavor.1210.desc.emperor: "側仕えが儀礼用の冠をしまい、私は寝衣で寝台の脇に独り座っていた。帝国の境界も税の帳簿も、明日会う人々のことも、あの私的な悩みを追い払ってはくれなかった。誰もいない寝台の反対側にまで、その思いが居座っているようだった。\n\n私は空いた半分を見つめた。枕は平らで、掛け物の端も整っている。その整い方に責められている気がした。そちらへ片手を置くと、布は冷たかった。冷たさを感じた後も、私は手を戻さなかった。\n\n廊下の灯りが一つ消えた。この扉を叩く者はいなかった。"
 latria_sexual_frustration_flavor.1210.desc.adventurer: "仲間はもう宿で休み、私は寝衣のまま、送っていない手紙の前に座っていた。明日も出立する。馬には飼葉を与え終えている。だが、この悩みをここへ残していくことはできない。荷とともに、次の渡し場までついてくるだろう。\n\n灯りの下で手紙の向きを変えた。冒頭の呼びかけには力が入りすぎていて、旅の途中に気軽に送れる便りには見えなかった。階下で誰かが勘定を払い、銅貨がしばらく鳴った。音がやむと、部屋は一段と静かになった。\n\n手紙を衣類の間に挟んだ。隠してしまっても、どの重なりにあるかはわかっていた。"
 latria_sexual_frustration_flavor.1210.desc.clergy: "祭服を寝台の脇に掛け、寝衣で小部屋に独り座った。先ほど自分で唱えた誓いが、まだ耳に残っている。それでも心は静まらず、指の間の祈りの珠は、長いこと同じ一粒で止まっていた。\n\nこの夜を、本来捧げるべきものに捧げたかった。だが静かになるたび、祈りに現れるべきでない顔が目に浮かぶ。珠を強く握ると、手のひらに食い込んだ。痛くなっても、その顔は消えなかった。\n\n小部屋の閂はしっかり掛かっていなかった。隙間から風が入り、炎が一度傾いた。"
 latria_sexual_frustration_flavor.1210.desc.ruler: "礼服は片づけられ、私は寝衣で寝台の脇にいた。扉の外の衛兵にため息は聞こえず、地位がこの悩みを収めてくれることもなかった。明日の朝議を頭の中でたどってみたが、三人目まで来ると先へ進めなくなった。\n\nその三人目は、朝議とは関係のない人だった。それでも私の考えは、そこで止まったままだ。枕元の灯りが壁に影を映していた。影の方が私より背筋を伸ばして座っているように見えた。\n\n灯芯を下げた。影は低くなったが、私は座り続けていた。"
 latria_sexual_frustration_flavor.1210.desc: "夜が深まっても、私は独り、この悩みを抱えたままだった。\n\n戸は閉じ、灯りはつき、寝台で眠るのは私だけ。その三つは何も変わらない。変わったのは、すぐ眠れるふりをもうしなくなったことだった。上着を椅子の背に掛け、また取り上げる。今にも誰かに呼び出されるようなつもりでいた。\n\n誰も呼ばなかった。私は上着を、また椅子の背に戻した。"
 latria_sexual_frustration_flavor.1210.a: "遅くとも、信頼する知人を呼んでじっくり話そう。"
 latria_sexual_frustration_flavor.1210.b: "思いを抑え、蝋燭を消して横になろう。"

 latria_sexual_frustration_flavor.1202.c: "話題を変え、皆の近況を尋ねよう。"
 latria_sexual_frustration_flavor.1202.d: "皆を茶に誘い、疲れるまで語ろう。"
 latria_sexual_frustration_flavor.1203.c: "祭司に残ってもらい、共に教えを学ぼう。"
 latria_sexual_frustration_flavor.1204.c: "寝衣を着て、今日の思いをゆっくり整理しよう。"
 latria_sexual_frustration_flavor.1205.c: "見張りの当番を決め、自分も少し休もう。"
 latria_sexual_frustration_flavor.1205.d: "明日の務めを一つずつ書き出そう。"
 latria_sexual_frustration_flavor.1206.c: "新しい詩で話題を変えよう。"
 latria_sexual_frustration_flavor.1207.c: "聖典の前に座り、この章を読み終えよう。"
 latria_sexual_frustration_flavor.1208.c: "馬を休ませ、ゆっくり足跡を調べよう。"
 latria_sexual_frustration_flavor.1209.c: "火を焚き、茶を淹れ、古い本を読もう。"
 latria_sexual_frustration_flavor.1209.d: "言えなかった言葉を詩にしよう。"
 latria_sexual_frustration_flavor.1210.c: "明日の予定を立て、仕事を一つずつ整理しよう。"
