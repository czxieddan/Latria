l_japanese:
 latria_sexual_frustration_flavor.1201.t: "訪れる者のない時"
 latria_sexual_frustration_flavor.1201.desc.female: "寝衣で窓辺に座り、茶が冷めるまで待っていた。会う約束などなかったのに、私はいつも心の中でそのための時を空けている。"
 latria_sexual_frustration_flavor.1201.desc.male: "寝衣で窓辺に座り、待っている。中庭を横切るのは夜警だけだ。誰も来ないが、まだ蝋燭を消したくない。"
 latria_sexual_frustration_flavor.1201.desc: "芯が短くなった。窓の向こうは静まり返っている。"
 latria_sexual_frustration_flavor.1201.a: "伝えるつもりだった言葉を書こう。"
 latria_sexual_frustration_flavor.1201.b: "蝋燭を消し、思いを抑えて横になろう。"

 latria_sexual_frustration_flavor.1202.t: "浴場の外の囁き"
 latria_sexual_frustration_flavor.1202.desc.accepted: "浴場からは笑い声が聞こえ、誰が誰と来ても途切れることはない。ありふれた光景のはずが、あれほど気を許せたのはいつ以来かと思い出してしまう。"
 latria_sexual_frustration_flavor.1202.desc.strict: "浴場の外で、幾人かの貴族が誰と誰を会わせてはならないか話している。私の名が聞こえ、会話が途切れた。"
 latria_sexual_frustration_flavor.1202.desc: "浴場の中では水音が響く。それより外の声に気を取られる。"
 latria_sexual_frustration_flavor.1202.a: "待ち望む逢瀬の話を、いつまでも語ろう。"
 latria_sexual_frustration_flavor.1202.b: "思いを脇に置き、礼を言って帰ろう。"

 latria_sexual_frustration_flavor.1203.t: "祈りの後の沈黙"
 latria_sexual_frustration_flavor.1203.desc.favors: "祭司は、欲望そのものは罪ではないと言う。その言葉を信じたいが、心の空虚さは埋まらない。"
 latria_sexual_frustration_flavor.1203.desc.condemns: "祭司は貞潔の美徳を説き、口を閉ざした。私は跪いたまま、慣れた祈りを唱えているが、心は遠くにある。"
 latria_sexual_frustration_flavor.1203.desc: "祈りは終わった。神殿の鐘はまだ耳に響いている。"
 latria_sexual_frustration_flavor.1203.a: "ひとまず禁欲の教えから離れよう。"
 latria_sexual_frustration_flavor.1203.b: "思いを抑え、もう一度祈ろう。"

 latria_sexual_frustration_flavor.1204.t: "狩りの後も落ち着かず"
 latria_sexual_frustration_flavor.1204.desc.lustful: "衣を脱ぎ、部屋に独りいても、まだ弦の響きが聞こえる。身体は疲れているのに、心は狩場の人影を一つひとつ追っている。"
 latria_sexual_frustration_flavor.1204.desc.chaste: "衣を脱ぎ、部屋に独りで、祈りと務めに心を戻そうとする。目を閉じるたび、あの思いが戻ってくる。"
 latria_sexual_frustration_flavor.1204.desc: "狩場には誰もいなくなったが、心の落ち着かなさは消えない。"
 latria_sexual_frustration_flavor.1204.a: "狩場で見たあの姿を思い出そう。"
 latria_sexual_frustration_flavor.1204.b: "衣を着て机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1205.t: "閉ざした書斎"
 latria_sexual_frustration_flavor.1205.desc.emperor: "書斎から人を下がらせ、地図と印章と未処理の書類だけを残した。引き出しから古い手紙を出したものの、読み返す勇気がない。"
 latria_sexual_frustration_flavor.1205.desc.adventurer: "道順と見張りの当番が卓上に書かれ、仲間たちは外で待っている。皆の休む時は決めたが、自分の時間を考えると古い手紙が頭に浮かんだ。"
 latria_sexual_frustration_flavor.1205.desc.clergy: "独り書斎に座り、帳簿も聖典も開いたままだ。頁の間に古い手紙がある。何度も手を伸ばしては引っ込めている。"
 latria_sexual_frustration_flavor.1205.desc.ruler: "従者は書斎の扉の外で待っている。邪魔はするなと命じた。印章と書類は目の前にあるが、古い手紙をまだ引き出しに戻せない。"
 latria_sexual_frustration_flavor.1205.desc: "書斎の扉を閉める。古い手紙も、未処理の仕事も卓上に残っている。"
 latria_sexual_frustration_flavor.1205.a: "仕事は明日にして、手紙を読み返そう。"
 latria_sexual_frustration_flavor.1205.b: "昔の思いを抑え、務めに取りかかろう。"

 latria_sexual_frustration_flavor.1206.t: "宴席の噂"
 latria_sexual_frustration_flavor.1206.desc.accepted: "誰かが天気の話でもするように、宴席で恋人の話をしている。笑い流そうとして、こうした話に加わらなくなって久しいことに気づいた。"
 latria_sexual_frustration_flavor.1206.desc.strict: "幾人かの貴族が、不作法で寵を失った廷臣の話をし、一人が私の名を口にした。私は袖を整え、会話に加わらなかった。"
 latria_sexual_frustration_flavor.1206.desc: "音楽が皆の間を流れる。それより会話に気を取られる。"
 latria_sexual_frustration_flavor.1206.a: "昔の話をすべて語ろう。二人きりで交わした言葉さえも。"
 latria_sexual_frustration_flavor.1206.b: "口をつぐみ、同席の者たちに一礼して帰ろう。"

 latria_sexual_frustration_flavor.1207.t: "祈りの後の空席"
 latria_sexual_frustration_flavor.1207.desc.favors: "礼拝が終わると、祭司は長椅子に本を置いて去った。信仰は欲望を咎めないのに、私は心を鎮められない。"
 latria_sexual_frustration_flavor.1207.desc.condemns: "祭司は去ったが、私はまだ跪いている。貞潔についての教えは明らかだが、内なる思いは消えない。"
 latria_sexual_frustration_flavor.1207.desc: "静かな神殿には、私と蝋燭だけが残った。"
 latria_sexual_frustration_flavor.1207.a: "神殿を出て、あの愛情に思いを馳せよう。"
 latria_sexual_frustration_flavor.1207.b: "欲望を抑え、戒律を読み返そう。"

 latria_sexual_frustration_flavor.1208.t: "林の中の追跡"
 latria_sexual_frustration_flavor.1208.desc.lustful: "獲物が木々の間を抜け、皆が追いかけていく。私も馬で続いたが、心は別の思いに捉われている。"
 latria_sexual_frustration_flavor.1208.desc.chaste: "手綱を引き、狩りのためだけに来たのだと言い聞かせる。猟犬の声が遠のいても、思いは消えない。"
 latria_sexual_frustration_flavor.1208.desc: "一行は木々の間で足を止め、追跡を続ける私の指示を待っている。"
 latria_sexual_frustration_flavor.1208.a: "皆を先に行かせ、思いにふけろう。"
 latria_sexual_frustration_flavor.1208.b: "気を取り直し、狩りの一行を進めよう。"

 latria_sexual_frustration_flavor.1209.t: "窓辺の残り火"
 latria_sexual_frustration_flavor.1209.desc.female: "寝衣で窓辺に座るうち、炉の火は熾火となった。昼間言えなかった言葉が、今になって戻ってくる。"
 latria_sexual_frustration_flavor.1209.desc.male: "寝衣で窓にもたれ、中庭を横切る夜警を見る。応えられなかった愛情が頭を離れない。"
 latria_sexual_frustration_flavor.1209.desc: "窓の外は静まり返っている。火は弱まるが、眠くはない。"
 latria_sexual_frustration_flavor.1209.a: "思いを紙に書き留めよう。"
 latria_sexual_frustration_flavor.1209.b: "火を焚き、思いを脇に置いて横になろう。"

 latria_sexual_frustration_flavor.1210.t: "叩かれぬ扉"
 latria_sexual_frustration_flavor.1210.desc.emperor: "従者が王冠をしまった。私は寝衣で寝台の傍らにいる。帝国の重責も、口にできない思いを忘れさせてはくれない。"
 latria_sexual_frustration_flavor.1210.desc.adventurer: "仲間たちは宿で休んだ。私は寝衣で、送っていない手紙の脇に座っている。明日には旅立つが、この悩みもついてくるだろう。"
 latria_sexual_frustration_flavor.1210.desc.clergy: "祭服を寝台の脇に掛け、寝衣で独り座る。誓いはまだ耳に残るが、心は静まらない。"
 latria_sexual_frustration_flavor.1210.desc.ruler: "礼服は片づけられた。私は寝衣で寝台の脇にいる。外の衛兵にため息は聞こえず、地位もこの私事を解決してはくれない。"
 latria_sexual_frustration_flavor.1210.desc: "夜は更け、この悩みと二人きりだ。"
 latria_sexual_frustration_flavor.1210.a: "遅くとも、信頼する知人を呼んでじっくり話そう。"
 latria_sexual_frustration_flavor.1210.b: "思いを抑え、蝋燭を消して横になろう。"

 latria_sexual_frustration_flavor.1202.c: "話題を変え、皆の近況を尋ねよう。"
 latria_sexual_frustration_flavor.1202.d: "皆を茶に誘い、疲れるまで語ろう。"
 latria_sexual_frustration_flavor.1203.c: "祭司に残ってもらい、共に教えを学ぼう。"
 latria_sexual_frustration_flavor.1204.c: "寝衣を着て、今日の思いをゆっくり整理しよう。"
 latria_sexual_frustration_flavor.1205.c: "見張りの当番を決め、自分も少し休もう。"
 latria_sexual_frustration_flavor.1205.d: "明日の務めを一つずつ書き出そう。"
 latria_sexual_frustration_flavor.1206.c: "新しい詩で話題を変えよう。"
 latria_sexual_frustration_flavor.1207.c: "聖典の前に座り、この章を読み終えよう。"
 latria_sexual_frustration_flavor.1208.c: "馬を休ませ、ゆっくり足跡を調べよう。"
 latria_sexual_frustration_flavor.1209.c: "火を焚き、茶を淹れ、古い本を読もう。"
 latria_sexual_frustration_flavor.1209.d: "言えなかった言葉を詩にしよう。"
 latria_sexual_frustration_flavor.1210.c: "明日の予定を立て、仕事を一つずつ整理しよう。"
