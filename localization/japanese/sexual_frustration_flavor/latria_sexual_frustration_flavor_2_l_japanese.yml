l_japanese:
 latria_sexual_frustration_flavor.1101.t: "天蓋の下の目覚め"
 latria_sexual_frustration_flavor.1101.desc.female: "浅い眠りから覚めると、寝衣は寝台の足元へずれ、肩も膝も帳の外に出ていた。帳の中にいるのは私だけだ。乱れた掛け物は自分で蹴ったもので、枕のくぼみも一つしかない。\n\n寝衣を引き戻しても、気持ちの高ぶりは収まらなかった。窓の外では、もう二度も夜番が時を告げている。横を向いて眠ろうと目を閉じると、昼間あの人が振り返った時の姿が浮かんだ。帳の鉤が鳴り、誰かが端を上げたかと思った。誰もいなかった。\n\n私は仰向けになったが、手をどこに置けばいいかも落ち着かない。夜はまだ長いのに、眠気はすっかり消えていた。"
 latria_sexual_frustration_flavor.1101.desc.male: "浅い眠りから覚めると、寝衣は寝台の足元へずれていた。帳の外は暗く、遠くで夜番の太鼓が一度鳴った。掛け物は丸まっている。私が寝返りを繰り返したせいだった。\n\n起き上がり、また横になった。それでも、落ち着かない熱は消えない。呼吸を数え、七つ目まで来たところで、ある人が話しかけてきた時の近さを思い出した。その近さで、何かが起きたわけではない。なのに、私はあまりにはっきり覚えていた。\n\n風が帳の端を持ち上げ、また落とした。寝台の反対側は、冷たいままだった。"
 latria_sexual_frustration_flavor.1101.desc: "寝台の帳は半ば垂れ、長い夜はまだ終わらない。私の思いも乱れたままだ。\n\n掛け物を胸元まで引き上げ、また蹴りのけた。枕元に手紙はなく、誰もいない。ただ自分の手があるだけだ。熱い手のひらを敷物に押し当て、少し冷まそうとした。\n\n夜番がまた時を告げた。私はまだ目を覚ましていた。"
 latria_sexual_frustration_flavor.1101.a: "目を閉じ、恋しい相手を思おう。"
 latria_sexual_frustration_flavor.1101.b: "思いを脇に置き、帳を引いて眠り直そう。"

 latria_sexual_frustration_flavor.1102.t: "踊りの合間の視線"
 latria_sexual_frustration_flavor.1102.desc.accepted: "舞曲が三度替わり、席の顔ぶれも幾度か入れ替わった。踊る二人が近づきすぎても、咎める目を向ける者はいない。楽師は言葉を交わす間を作るように、拍子さえ緩めてくれた。\n\nだが私は、あの一瞬を覚えている。相手の手は礼儀としては少し長く私の手首に留まり、眼差しもすぐには逸れなかった。曲が終わって手は離れたが、指先にはかすかな温もりが残った。席へ戻っても、満ちた杯に口をつけなかった。\n\n次の曲がもう始まっていた。私は空いた床を見つめ、またそちらへ足を向けたくなっていた。"
 latria_sexual_frustration_flavor.1102.desc.strict: "踊りで近づくほど、周囲の笑い声がひそひそ話に聞こえた。私は楽師へ目を向けたが、手はまだ相手に導かれている。袖が触れ合う音が、太鼓よりもはっきり聞こえた。\n\n席の端で誰かが身を寄せて話していた。私のことなのか、別の話なのかはわからない。曲が止むと、すぐに半歩下がった。急ぎすぎて、自分の靴を踏みそうになった。相手はこちらを見たが、何も尋ねなかった。\n\n座ってからも、手首にはわずかな温もりが残っていた。私はもう片方の手でそこを覆った。そうすれば、誰にも見られずに済む気がした。"
 latria_sexual_frustration_flavor.1102.desc: "音楽は次第に速まったが、踊っても私の思いは晴れなかった。\n\n二度回っても足を間違えはしなかった。ただ、心の中では相手の息遣いが近づいたり遠ざかったりするのを数えていた。曲が盛り上がったところで、ふと途切れた。その間、互いに一言も口にしなかった。\n\n楽師が再び弦を鳴らした。私はその場に立ったまま、この踊りをどこで終えればよいのかわからずにいた。"
 latria_sexual_frustration_flavor.1102.a: "もう一曲誘い、少し近づこう。"
 latria_sexual_frustration_flavor.1102.b: "相手に一礼して感謝し、広間の端へ下がろう。"

 latria_sexual_frustration_flavor.1103.t: "導き手の戸口で"
 latria_sexual_frustration_flavor.1103.desc.favors: "精神の導き手は、欲を抑えることだけが敬虔な生き方ではないと言った。灯りが二人の影を壁に映している。ゆっくりとした語り口は、私が言葉を挟むのを待っているようだった。\n\n尋ねてみたかった。夜中に独り目を覚まし、手の置き場にも困るような時も、その道の上にいると言えるのか。言いかけたところで、扉の外の足音が止まった。私たちはともに黙り込んだ。足音はまた遠ざかった。\n\n導き手はこちらを見て、続きを待っていた。私は言葉をのみ込み、口にできたのは途切れた出だしだけだった。"
 latria_sexual_frustration_flavor.1103.desc.condemns: "精神の導き手は、貞潔が重んじられるのは人前だけではないと諭した。声を荒らげたわけでもないのに、急に部屋が狭くなった気がした。私はうつむいて答え、袖の中で指を握り込んだ。\n\n今夜はなぜ来たのかと聞かれた。灯りを見て、扉を見て、自分の靴先を見た。ただ、相手の目だけは見られなかった。本当のことを話すのに、長い言葉は要らない。だが話せば、もっと聞かれるのが怖かった。\n\n外で誰かが咳をした。私はほっと息をつき、その安堵を恥ずかしく思った。"
 latria_sexual_frustration_flavor.1103.desc: "薄暗い部屋で、私は精神の導き手にどう切り出せばよいか考えていた。\n\n務めについてなら尋ねるべきだ。もう一つのことは、聞くべきではない。戸口ではどちらの言い方も練習したのに、部屋へ入った途端、一つも思い出せなくなった。導き手が水を注いでくれた。まだ温かかった。\n\n私は杯を両手で持ち、縁に唇をつけた。言葉はまだ出てこなかった。"
 latria_sexual_frustration_flavor.1103.a: "この思いを認め、もう隠さずにいよう。"
 latria_sexual_frustration_flavor.1103.b: "今の務めだけを尋ね、ほかは呑み込もう。"

 latria_sexual_frustration_flavor.1104.t: "戻らぬ鷲"
 latria_sexual_frustration_flavor.1104.desc.lustful: "鷹は狩り場の空を巡り、いつまでも手袋へ戻ろうとしない。私は二度腕を上げたが、そのたび翼を傾け、さらに高く飛んでいった。林から吹く風には、草と馬の汗の匂いが混じっていた。\n\n羨ましくさえ思った。鷹は説明も振り返ることもせずに済む。人前で焦りを辛抱だと言い繕う必要もない。弓をしまうかと従者に聞かれ、私は首を振った。黒い点を追い続けるうち、それは鷹よりも、帰ってこない別の誰かに見えてきた。\n\n腕はもう疲れていた。それでも、私は下ろさなかった。"
 latria_sexual_frustration_flavor.1104.desc.chaste: "鷹は旋回を続け、従者は何度か弓をしまうか尋ねた。私はもう少し待とうとだけ答えた。待っていれば、心の乱れもひとりでに収まるかのように。\n\n猟師たちはすでに馬を下り、木陰で水袋を回している。私を急かしはしないが、何度も聞こえる馬具の音が、その代わりをしているようだった。空を見つめて黙って数を数えても、やがて同じ人の名に変わってしまった。\n\n鷹は一声鳴いたが、降りてこなかった。私はゆっくりと、手袋を反対の手にはめ直した。"
 latria_sexual_frustration_flavor.1104.desc: "鷹がいつまでも戻らず、猟師たちは私の言葉を待っている。\n\n握った笛の跡が手のひらについていた。私はそれを口元へ上げ、また下ろした。空を巡る輪は次第に小さくなっていたが、次の瞬間に戻ってくるかは誰にもわからなかった。\n\nそろそろ行くのかと、小声で尋ねられた。私は返事をしたが、行くと答えたのか、まだ待つと答えたのか、自分でもわからなかった。"
 latria_sexual_frustration_flavor.1104.a: "鷲を巡らせたまま、思いにふけろう。"
 latria_sexual_frustration_flavor.1104.b: "気を取り直し、鷲を野営地へ呼び戻そう。"

 latria_sexual_frustration_flavor.1105.t: "蝋燭と王冠"
 latria_sexual_frustration_flavor.1105.desc.emperor: "側仕えが儀礼用の冠を寝室から運び出した。燭台のそばには、まだ裁可していない勅書が数通ある。私は寝衣を整えて座り、いちばん上から読むつもりだった。だが手は、書類の間から送っていない手紙を抜き出していた。\n\n手紙には相手の名があるだけで、その先は空白だ。昼間に三度書き、三度とも同じ所で止まっていた。箱の中の冠がかすかな光を映し、皇帝の務めを果たすのを待っているようだった。紙を平らにしても、続く一文は浮かばなかった。\n\n蝋が銅の皿に落ち、ごく小さな音を立てた。"
 latria_sexual_frustration_flavor.1105.desc.adventurer: "宿の部屋で寝衣を整えると、仲間たちはもう休んでいた。隣からはまだいびきが聞こえる。荷のそばには送っていない手紙があり、灯りに照らされた端が反り返っていた。\n\n明日は道を急がねばならない。食糧も馬も渡し場も手配したが、この手紙だけは行き先が定まらない。広げてみると、朝よりも送れそうにない文面に思えた。一文だけ、あまりに率直に書きすぎている。私はその行に指を置き、しばらく止めた。\n\n階下で扉を閉める音がした。手紙を荷の上へ戻したが、きちんと押し込めなかった。"
 latria_sexual_frustration_flavor.1105.desc.clergy: "祭服を畳み、寝衣を羽織って寝台の脇へ戻った。送っていない手紙が聖典の下にあり、自分から見つけてもらいたがるように端をのぞかせていた。\n\n私は手紙を抜き出した。閉じた聖典が鈍い音を立てた。誓いに背く言葉は書いていない。それでも、どの一文も同じ人のことばかりだ。三行目まで読むと、こんな時刻に読むべきではないとわかった。\n\n蝋燭の火が一度揺れた。私は手紙を戻さなかった。"
 latria_sexual_frustration_flavor.1105.desc.ruler: "従者が礼服を片づけ、私は寝衣を羽織って灯りの下に座った。卓上には裁可の済まない書類が残っていたが、先に広げたのは手元の送っていない手紙だった。\n\n外では衛兵が交代し、揃った足音が通り過ぎた。部屋に残るのは紙の音だけだった。私は余白に一字書き、見直してから墨で塗り潰した。黒くした所は、かえって目立つようになった。\n\n筆を置いた。書類は元の場所にあり、一つも印を押していなかった。"
 latria_sexual_frustration_flavor.1105.desc: "灯りが尽きかけても、送っていない手紙はまだ私の手元にあった。\n\n今夜のうちに相手が読むことはない。それはわかっていた。それでも私はもう一度、昼間よりゆっくりと相手の名を書いた。墨が乾くと、紙には薄い跡だけが残った。\n\n灯芯がはぜた。顔を上げて初めて、自分がずいぶん長く座っていたことに気づいた。"
 latria_sexual_frustration_flavor.1105.a: "手紙を使者に渡そう。"
 latria_sexual_frustration_flavor.1105.b: "手紙を処分し、思いを断って蝋燭を消そう。"

 latria_sexual_frustration_flavor.1106.t: "燭光の下の不安"
 latria_sexual_frustration_flavor.1106.desc.female: "寝衣を羽織って寝台の脇に座ると、蝋燭が窓の紙に私の影を映した。呼吸に合わせてわずかに動く影は、私自身より落ち着いて見えた。夜は深いのに、応えてもらえない思いは胸に留まり、騒ぐことも消えることもなかった。\n\n髪を肩の後ろへ払い、また戻した。首の脇に指が触れた時、私はふと動きを止めた。誰もいないのに、そのためらいが気恥ずかしかった。昼間に聞いた、冗談とも本気ともつかない言葉を思い出す。あの時は笑って流したが、その後もずっと覚えていた。\n\n燭台には、また蝋が積もっていた。私はまだ座ったまま、寝台の帳も下ろしていなかった。"
 latria_sexual_frustration_flavor.1106.desc.male: "寝衣を羽織って寝台の脇に座っている。窓の外を夜警がもう二巡した。初めに通った時は、まだ眠れるつもりでいた。二度目が過ぎる頃には、諦めていた。\n\n手に手紙も酒もない。ただ、手のひらを膝に押し当て、温まると裏返していた。心にいる人の声が、本当に部屋で聞こえるわけではない。それでも、あの言葉の間の取り方までそらで繰り返せる。三度目には、自分でも呆れてしまった。\n\n蝋燭に息を吹きかけたが、消えなかった。炎は一度傾き、またまっすぐになった。"
 latria_sexual_frustration_flavor.1106.desc: "蝋燭は短くなっていくのに、帳の内にいても眠気が訪れない。\n\n横になると、いつもより大きく自分の鼓動が聞こえた。寝返りを打っても変わらなかった。杯も靴も畳んだ上着も、部屋の品はすべて元の場所にある。どれを見ても、この落ち着かない気持ちは消えてくれなかった。\n\n私はまた起き上がった。灯りはまだともっていたが、夜のずいぶん長い時間が過ぎていた。"
 latria_sexual_frustration_flavor.1106.a: "あの愛情に思いを馳せよう。"
 latria_sexual_frustration_flavor.1106.b: "もう考えるのはやめ、蝋燭を消して眠ろう。"


 latria_sexual_frustration_flavor.1107.t: "返礼の踊り"
 latria_sexual_frustration_flavor.1107.desc.accepted: "踊りの相手がもう一曲と誘ってくれた。周囲の者はごく普通の礼儀だと思っている。楽師はもう弦に弓を当て、私がうなずくのを待っていた。\n\n私はさっきの手を覚えていた。腰の脇に少し留まったその手は、踊りの動きだと言えるほどには短く、私がそう思い切るには長かった。相手の顔を見ると、向こうもこちらを見ていた。口元にはかすかな笑みがあったが、何も言葉にはしなかった。\n\n席で杯を合わせる音がした。大きな音だったが、心の中で答えた承諾の言葉は、それに紛れなかった。"
 latria_sexual_frustration_flavor.1107.desc.strict: "踊りの相手がもう一曲と誘うと、席からいくつもの目が向けられた。私が答える前に、誰かが隣の客へ身を寄せて囁いた。内容は聞こえないが、その二人は私たちから目を離さなかった。\n\n相手はまだ手を差し出している。礼儀正しく、無理に誘う様子もない。それでも私の手は、袖の中で熱くなっていた。この手を取れば、次の踊りでは先ほどより平静を装いにくい。取らなければ、その拒絶も人の記憶に残るだろう。\n\n楽師が咳払いをした。弓はまだ弦の上で止まっていた。"
 latria_sexual_frustration_flavor.1107.desc: "楽師が新しい舞曲を奏で始めた。それなのに、私はなかなか立ち上がれなかった。\n\n曲の最初の数拍は、もう過ぎていた。相手は手を引っ込めず、急かしもせず、ただそこに立っている。私は差し出された手を見て、それから卓の縁に置いた自分の指を見た。\n\n後ろで誰かが椅子を動かした。小さな音に驚いて瞬きをしたが、それでもまだ立ち上がらなかった。"
 latria_sexual_frustration_flavor.1107.a: "誘いを受け、もっと近づこう。"
 latria_sexual_frustration_flavor.1107.b: "一礼して辞退し、相手が踊りを楽しめるよう願おう。"

 latria_sexual_frustration_flavor.1108.t: "就寝前の祈り"
 latria_sexual_frustration_flavor.1108.desc.favors: "寝衣のまま寝台の脇で祈っている。信仰が肉体の快楽を許すという教えは、よく覚えていた。だが今は助けにならない。罪と見なす必要がないとは教えてくれても、この高ぶる思いをどうすればよいかまでは教えてくれなかった。\n\n膝を寝台の縁に当て、祈りの言葉を口にしながら、昼間あまりに近くで見つめ合った一瞬を思い返していた。見つめ合っただけで、何も起こらなかった。それでも私はその一瞬を細かく思い出し、何度もたどり直していた。\n\n祈りを終える箇所まで来ても、やめなかった。その先は自分でつけ足した言葉で、何のまとまりもなかった。"
 latria_sexual_frustration_flavor.1108.desc.condemns: "寝衣のまま寝台の脇に跪き、貞潔の誓いを繰り返す。一文唱えるたび、心の中の声がはっきりしてくる。今夜も独りで、寝具は冷たく、暗闇にいても自分の思いから逃れられない。\n\n私は額の端を寝台の板に当てた。木は冷たかった。そうしていれば少し楽になったが、離れるとまた元の落ち着かなさが戻ってきた。初めの一文からやり直し、隣の部屋に聞かれるのを恐れるように声を落とした。\n\n隣には誰もいない。それでも私は、小声のまま唱え続けた。"
 latria_sexual_frustration_flavor.1108.desc: "寝台の脇の蝋燭がかすかに揺れている。私の祈りは、いつまでも終わらなかった。\n\n慣れ親しんだ一節はもう唱え終えていた。その先は沈黙するところだが、黙りたくなかった。静かになれば、別のことを考えてしまう。私はさらにいくつか言葉をつけ足した。言い終えると、それが祈りではないのは自分でもわかっていた。\n\n炎が帳の方へ傾いた。私は跪いたままで、寝衣の襟元には皺が寄っていた。"
 latria_sexual_frustration_flavor.1108.a: "貞潔の誓いを脇に置き、思いを認めよう。"
 latria_sexual_frustration_flavor.1108.b: "思いを抑え、祈り続けよう。"

 latria_sexual_frustration_flavor.1109.t: "終わらぬ評議会"
 latria_sexual_frustration_flavor.1109.desc: "臣下はすでに三つの処置を示していた。それでも私は裁定を下せなかった。一つ目は最も確実で、二つ目は費用が少なく、三つ目は先例に最もよく合う。どれも聞き、うなずきもしたのに、選ぶ段になると言葉が出てこなかった。\n\n書記の筆が宙で止まっている。誰かが水の杯を私の手元へ寄せた。水面に映る自分を見ているうちに、ふと考えが糧秣とは無関係な人へ逸れた。その人は今、この部屋にはいない。それでも、話す時の間まで思い出せた。\n\n沈黙は居心地が悪くなるほど長引いていた。私は咳払いしたが、まだ一文も言えなかった。"
 latria_sexual_frustration_flavor.1109.a: "評議会を終え、独りで考えさせてもらおう。"
 latria_sexual_frustration_flavor.1109.b: "思いを抑え、書記官に続けるよう命じよう。"
 latria_sexual_frustration_flavor.1110.t: "真夜中過ぎの部屋"
 latria_sexual_frustration_flavor.1110.desc.clergy: "寝衣を羽織って自分の小部屋へ戻った。夜の祈りは終わり、廊下の灯りも大半が消えている。それでも、送っていない手紙は卓上に広がり、祈りの珠を押さえたままだった。\n\n珠を箱に戻し、手紙もしまうべきだった。だが紙に手を置いたところで、私は止まってしまった。文面はもう暗記している。それなのに、あの人の名前をどんなふうに書いたのか、また見たくなった。一箇所だけ墨がにじんでいる。書いた時、手が落ち着かなかったようだ。\n\n小部屋は静かだった。私は卓のそばに立ったまま、寝衣の紐もきちんと結んでいなかった。"
 latria_sexual_frustration_flavor.1110.desc.adventurer: "宿には灯りがわずかに残るだけだった。寝衣を着て寝台の縁に座る私のそばで、荷はもう縛ってある。ただ、送っていない手紙だけが外にのぞいていた。\n\n隣で誰かが寝返りを打ち、寝台の板が鳴った。音が収まるのを待って、私は手紙を取り出した。道中の埃が紙の端についていた。吹いても埃は取れず、書かれた言葉だけがはっきりするようだった。書くべきでなかった一文が、よりによって真ん中にあった。\n\n手紙を折り畳んだが、元の折り目にはうまく重ならなかった。"
 latria_sexual_frustration_flavor.1110.desc: "扉の外の物音が次第に遠ざかっても、私はまだ寝台の脇で待っていた。\n\n今夜会う約束をした相手などいない。それでも灯りを残し、手の届く所に上着を置いていた。足音が通るたびに顔を上げたが、どの足音も遠ざかっていった。\n\n灯油が少し減った。寝台の反対側は空いたままだが、私はまだ横になっていなかった。"
 latria_sexual_frustration_flavor.1110.a: "手紙を書き終え、夜明けに送らせよう。"
 latria_sexual_frustration_flavor.1110.b: "閂をかけ、思いを脇に置いて休もう。"

 latria_sexual_frustration_flavor.1101.c: "上着を着て静かに座り、息を整えよう。"
 latria_sexual_frustration_flavor.1102.c: "楽師たちに曲の話をしよう。"
 latria_sexual_frustration_flavor.1103.c: "この思いとどう折り合えばよいか尋ねよう。"
 latria_sexual_frustration_flavor.1103.d: "送らなかった手紙から話し始め、何も隠すまい。"
 latria_sexual_frustration_flavor.1104.c: "皆に待ってもらい、辛抱強く鷲と向き合おう。"
 latria_sexual_frustration_flavor.1105.c: "手紙を箱にしまい、明日の仕事を決めよう。"
 latria_sexual_frustration_flavor.1107.c: "相手に座ってもらい、別の話をしよう。"
 latria_sexual_frustration_flavor.1107.d: "卓の皆を誘い、賑やかな輪舞に加わろう。"
 latria_sexual_frustration_flavor.1108.c: "いちいち思いと争わず、ゆっくり祈りを終えよう。"
 latria_sexual_frustration_flavor.1109.c: "少し休憩し、残りの議題を整理しよう。"
 latria_sexual_frustration_flavor.1109.d: "急ぎの裁定を整理し、ここで片づけよう。"
 latria_sexual_frustration_flavor.1110.c: "上着を着て、温かい汁物をもらいに行こう。"
