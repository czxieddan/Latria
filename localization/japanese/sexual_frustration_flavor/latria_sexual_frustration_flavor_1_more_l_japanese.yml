l_japanese:
 latria_sexual_frustration_flavor.1011.t: "第二の夜番"
 latria_sexual_frustration_flavor.1011.desc: "二番目の夜番に目を覚ますと、灯はまだ燃えていた。油は少なく、皿には褐色の輪が乾いてこびりついている。寝衣は腰のあたりでねじれていた。冷え込みがひどく、鎧戸が二度鳴って、それから止まる音が聞こえる。\n\n三日前、広間の戸口で、誰かが私の手首に手を置いた。それきり何も言われなかった。その触れられた長さを、私は帳簿を読み返すより何度も思い返している。その皮膚はもうただの皮膚だ。親指を押し当てても、自分の脈しか感じない。\n\n枕元の杯にはぬるくなった水が入っている。半分飲んで、置いた。鎧戸がまた鳴る。私は目を開いたまま、梁を数え、空が灰色になるのを待つ。"
 latria_sexual_frustration_flavor.1011.a: "起きて灯芯を整え、思いの向くままにさせよう。"
 latria_sexual_frustration_flavor.1011.b: "水を飲み、壁に向き直って、思いを捨てよう。"
 latria_sexual_frustration_flavor.1011.c: "櫃から本を取り出し、空が灰色になるまで読もう。"

 latria_sexual_frustration_flavor.1012.t: "梨と小さな刃"
 latria_sexual_frustration_flavor.1012.desc: "上座から三つの卓を隔てた席に座っている。蝋燭は揺らぎ、酒は薄く注がれる。私の正面、商人二人と書記を挟んだ向こうで、誰かが小さな刃で梨を剥いている。食べはしない。皮は一本の長い螺旋になって垂れ下がる。\n\n前の宴では、その人が私の隣に座り、一曲の間ずっと、膝を私の膝に預けていた。偶然だったと自分に信じさせることもできず、偶然ではなかったと信じることもできない。\n\n楽師たちがもっと遅い曲に替える。刃が止まる。梨は皿の上で裂け口を開き、切り口から茶色く変わり始めている。従者が私の肩越しに酒注ぎを傾けるので、私は目を逸らさぬまま杯を差し出した。"
 latria_sexual_frustration_flavor.1012.a: "口に出して言おう。卓の者がどう取ろうと構わぬ。"
 latria_sexual_frustration_flavor.1012.b: "早めに退出し、残りは飲み込もう。"
 latria_sexual_frustration_flavor.1012.c: "隣の客に向き直り、音楽に流してしまおう。"

 latria_sexual_frustration_flavor.1013.t: "夢が残したもの"
 latria_sexual_frustration_flavor.1013.desc: "腰まで掛けた敷布のまま、窓の白む気配の中で目を覚ます。しばらく、この部屋は私の部屋ではなかった。誰かがここにいた。寝台の端に重みがあり、耳元で、まるで問いかけるように私の名を呼ぶ声があった。\n\n顔は覚えていない。胸に当たる背の温もり、上下する腹に平らに置いた自分の手、そして自分が少しも急いでいなかったことを覚えている。\n\n敷布は、私が横になっていた場所だけ湿っている。身を起こし、冷たい床板に足を下ろす。外では荷車が市場へ向かって通っていく。着替えに手を伸ばして、自分が扉の音を待っていることに気づく。"
 latria_sexual_frustration_flavor.1013.a: "身体のままにさせ、夢の温もりを残そう。"
 latria_sexual_frustration_flavor.1013.b: "起きて着替え、夜を平らにならそう。"
 latria_sexual_frustration_flavor.1013.c: "膝を抱えて座り、窓が白むのを待とう。"

 latria_sexual_frustration_flavor.1014.t: "徹夜の灯"
 latria_sexual_frustration_flavor.1014.desc: "第三の時に、四度読んだ同じ頁を開いたまま、私は跪いている。徹夜の灯が石畳に小さな赤い円を落としている。膝が痛む。毛織りの下から冷気が這い上がってくる。\n\n回廊のどこかで扉が閉まる。私の背後で従軍司祭の声が続いていく。忍耐強い声だ。その言葉は一つも耳に入らない。私は去年の夏、喉に当てられた口のことを考えている。顔を背けたのに、それでも成るに任せた、あのことを。\n\n祈祷書の栞が床に滑り落ちている。拾わない。親指が頁を押さえ、私が息をするたび、灯の赤い円が揺れる。膝の下の石は冷たい。"
 latria_sexual_frustration_flavor.1014.a: "弱さを認め、明日の贖罪を受けよう。"
 latria_sexual_frustration_flavor.1014.b: "もう一時間跪き、詩篇を初めから唱えよう。"
 latria_sexual_frustration_flavor.1014.c: "従軍司祭に残ってもらい、この頁を終えよう。"

 latria_sexual_frustration_flavor.1015.t: "寝台の裾の掛布"
 latria_sexual_frustration_flavor.1015.desc: "火は灰になり、私はまだ目覚めている。掛布は寝台の裾へ蹴りやられていた。身体は温かく重く、それ自体を意識している。喉の皮膚も、腿の内側も、張って熱を帯び、天候のせいではない形で私は濡れている。\n\n手を腹の低いところに置いたまま、動かさない。今夜の渇望に顔はない。ただ脚の間で脈打つものがある。執拗で、火の最後の爆ぜる音に合わせて拍を刻んでいる。\n\n口のこと、手のこと、誰かが上から覆いかぶさる重さのことを思うと、腰がひとりでに揺れる。掛布は床板の上に小山になっている。私は顔を枕に押しつけ、痛みが和らぐまで息をする。和らがない。"
 latria_sexual_frustration_flavor.1015.desc.lustful: "敷布の下から熱が立ち上り、私はもう天候のせいにするのをやめる。濡れている。誰のものでもない、私自身のもので濡れている。指は命じられてもいないのに道を知っている。\n\nその指に任せる。今夜のことに顔はない。私を寝台に押しつけた手と、私の膝を開いた膝があるばかりで、私はその力の加減まで正確に覚えている。腰は空を突くように持ち上がる。誰もいない部屋で漏らす音は、自分の知らない音だ。\n\nあとには手のひらを上に向けたまま横たわり、胸が上下し、腿の奥にまだ余韻が動いている。格子の中で薪が崩れる。敷布を腰まで引き上げても、顔の熱は残っている。"
 latria_sexual_frustration_flavor.1015.desc.chaste: "すでに温かな身体で、腿を湿らせて目を覚ます。手を引き戻し、敷布の裾を握る。布を握れば夜をその場所に留められるかのように。\n\n朝の祈りを順に唱えるが、三行目で筋を見失う。梁を数えても数を失う。身体は耳を貸さない。昼の光の下では認める気になれないものを、身体は保ったままで、そして求め続ける。\n\n窓が灰色から白へ変わる。朝課の鐘はまだ鳴らない。掛布を顎まで引き上げ、目を閉じて、熱が引くのを待つ。引き方は遅い。"
 latria_sexual_frustration_flavor.1015.a: "手のままにさせ、その熱を使おう。"
 latria_sexual_frustration_flavor.1015.b: "掛布を握りしめ、熱を使い切ろう。"
 latria_sexual_frustration_flavor.1015.c: "起きて水を飲み、窓辺に座ろう。"

 latria_sexual_frustration_flavor.1016.t: "長い帰り道"
 latria_sexual_frustration_flavor.1016.desc: "馬が歩を緩めた列の末尾で、私は馬を進めている。葉の間から差す光は緑に薄れている。外套は水を吸って重い。前方のどこかで、角笛がまだ遠い斜面を追っている。\n\n前の狩りのとき、小川のほとりで私はその人と並び、ほかの者たちには先へ行ってもらった。その人の袖は肘まで濡れていた。私の言った何かにその人は笑い、その笑いは家に着くまで離れなかった。家までは二日かかった。\n\n馬が水を飲もうと頭を下げる。水面がその姿を揺らして分ける。私は馬に飲ませながら、分かれた姿が元に戻るのを見ていると、角笛がまた始まる。もっと遠くで。"
 latria_sexual_frustration_flavor.1016.a: "半馬身下がって、この思いを家まで連れて行こう。"
 latria_sexual_frustration_flavor.1016.b: "踵を入れて、心を斜面に留めよう。"
 latria_sexual_frustration_flavor.1016.c: "蹄の跡と折れた小枝を追って、その人を探そう。"

 latria_sexual_frustration_flavor.1017.t: "印章と帳簿"
 latria_sexual_frustration_flavor.1017.desc: "評議会は散った。蝋燭は燃え尽きかけている。帳簿は羊毛の勘定の頁に開かれ、印章は握ったまま手にある。蝋は握力で柔らかくなっていた。\n\n私が何度も立ち返るのは勘定ではない。あの人が会の間ずっと窓辺に立っていた様子だ。何も言わず、指一本を掛け金に当てて。そのせいで部屋が狭く感じられたこと。\n\n私は命令書に印章を押し当て、持ち上げる。蝋は印をきれいに受けた。窓の外、中庭は空で、掛け金は動かない。帳簿の同じ一行を二度読み、それから本を閉じる。"
 latria_sexual_frustration_flavor.1017.a: "明日呼んで、はっきり言おう。"
 latria_sexual_frustration_flavor.1017.b: "印章を書記に渡し、寝よう。"
 latria_sexual_frustration_flavor.1017.c: "帳簿を開き直し、この頁を終えよう。"

 latria_sexual_frustration_flavor.1018.t: "盤を照らす月"
 latria_sexual_frustration_flavor.1018.desc: "回廊に灯籠がともり、月は西の壁の上に出ている。削りかけの爪のように薄く白い。銚子の酒はぬるくなっている。盤の向こうで、学者が白い石を二本の指に挟んだまま置こうとしない。\n\n春の観月の席で、その人は袖が触れるほど近くに座り、灯についての四行を詠み、最後の一行で私を見た。私はその最後の行を忘れていない。\n\n石はようやく、隅の悪い方へ置かれる。その人は笑って私の杯を満たす。私は飲む。盤の上で灯籠の光が動く。どちらも詩には触れない。"
 latria_sexual_frustration_flavor.1018.a: "灯とその四行を引き受け、さらに四行を足そう。"
 latria_sexual_frustration_flavor.1018.b: "杯を掲げて礼を述べ、話を収穫に移そう。"
 latria_sexual_frustration_flavor.1018.c: "石を一つ置いて、教えを乞おう。"

 latria_sexual_frustration_flavor.1019.t: "火に語る"
 latria_sexual_frustration_flavor.1019.desc: "火は弱く、腹心の友がもう一方の椅子に座っている。両手で杯を包み、いつもと同じ待ち方で待っている。\n\nだから私は言う。すべてではないが、その形を。戸口のこと、手首に置かれた手のこと、それからの夜のこと。口に出せば小さくなり、そして扱いにくくなる。腹心の友は目を逸らさず、沈黙を埋めもしない。\n\n手の中で杯は冷たくなっている。薪を足すべきなのに、足さない。残りわずかな熱の中で座り、部屋はゆっくり暗くなり、私はまだ杯を握っている。"
 latria_sexual_frustration_flavor.1019.a: "続けよう。残りも言おう。"
 latria_sexual_frustration_flavor.1019.b: "そこでやめ、残りは胸に留めよう。"
 latria_sexual_frustration_flavor.1019.c: "もうしばらく座って、何も言うまい。"

 latria_sexual_frustration_flavor.1020.t: "穹窿の下で"
 latria_sexual_frustration_flavor.1020.desc: "穹窿は私の声を吸い、二倍にして返す。身廊には十二人ほどがいて、その誰もが、昼には口にしないことを私が言うのを聞いている。\n\n私は欄干の前の石畳に目を据える。歯のような形に欠けた石がある。話し終えると、背後で誰かが重心を移し、扉の近くの女が面衣を引き寄せ、そのまま下ろさない。\n\n香炉が揺れる。煙は石に沿って平らに立ち上る。私は膝に開いた手を置いたまま、聖具係が肩に触れるまで動かない。"
 latria_sexual_frustration_flavor.1020.a: "顔を上げ、省いた残りを言おう。"
 latria_sexual_frustration_flavor.1020.b: "うつむいたまま、悔悟の詩篇を終いまで唱えよう。"
 latria_sexual_frustration_flavor.1020.c: "身廊が空になるのを待ち、従軍司祭に残るよう頼もう。"

 latria_sexual_frustration_flavor.1021.t: "雨の後で"
 latria_sexual_frustration_flavor.1021.desc: "雨が私たちを二番目の夜番の過ぎるまで階上の部屋に留め、どちらも下りようとは言わなかった。\n\n順序を覚えている。床板に投げ出された濡れた外套。鎖骨に、それからもっと下へ、急がぬ口。私の指はうなじの結び紐を探し当てていた。灯は消さずに小さくしてあった。その人が口づけるために顔を上げたとき、その口には酒の味が残っていて、私の腿は相手の腿に滑り、私はそこに落ち着いた手に会いに腰を上げた。\n\nあとには雨が続いた。髪が頬に張りついていた。肩に、昼にはまだ見ていない跡がある。"
 latria_sexual_frustration_flavor.1021.desc.female: "雨が私たちを二番目の夜番の過ぎるまで階上の部屋に留め、どちらも下りようとは言わなかった。\n\n順序を覚えている。床板に投げ出された濡れた外套。鎖骨に、そしてもっと下へ、急がぬ相手の口。私の指はうなじの結び紐を解いていた。灯は消さずに小さくしてあった。相手の手のひらが私の胸を覆い、私はもう濡れていて、腿の間に落ち着いた手に会いに腰を上げた。\n\nあとには雨が続いた。髪が頬に張りついていた。肩に、昼にはまだ見ていない跡がある。"
 latria_sexual_frustration_flavor.1021.desc.male: "雨が私たちを二番目の夜番の過ぎるまで階上の部屋に留め、どちらも下りようとは言わなかった。\n\n順序を覚えている。床板に投げ出された濡れた外套。胸に、そしてもっと下へ、急がぬ相手の口。私の手は相手の腰の紐を探し当てていた。灯は二度揺れて、消えずに残った。相手が覆いかぶさってきて、私はその腰を、硬く疼くままに掴んで支えた。拍子は相手自身が取った。相手の髪の先は濡れていた。\n\nあとには雨が続き、窓の上の樋を流れていた。肩に、昼にはまだ見ていない跡がある。"
 latria_sexual_frustration_flavor.1021.a: "明日もいつも通り会い、何も隠すまい。"
 latria_sexual_frustration_flavor.1021.b: "今後は避け、あの夜をしまおう。"
 latria_sexual_frustration_flavor.1021.c: "横になったまま雨に耳を澄まし、あの跡を胸に留めよう。"

 latria_sexual_frustration_flavor.1022.t: "薬草畑の裏の小道"
 latria_sexual_frustration_flavor.1022.desc: "家人が日暮れ後に通らぬ唯一の場所だから、私は薬草畑の裏の小道を行く。草履越しに砂利が冷たい。ローズマリーの香り、その下に、時期を過ぎたミントの酸えた匂い。\n\n小道の突き当たり、壁が折れるところに腰掛けがある。春にそこで座り、私は愚かなことを言い、言い終えぬうちに赦された。門の掛け金は下りたまま。\n\n月は塔の陰にある。私は腰掛けの背に手を置いて立つ。塗料が木目まで剥げた場所だ。扉の灯籠に蛾がまとわりついている。ミントが少し揺れる。私は座らない。"
 latria_sexual_frustration_flavor.1022.a: "腰掛けに座り、脈の高鳴りが過ぎるのを待とう。"
 latria_sexual_frustration_flavor.1022.b: "家に戻り、扉に閂を下ろそう。"
 latria_sexual_frustration_flavor.1022.c: "小道を一度、そしてもう一度歩こう。"

 latria_sexual_frustration_flavor.1023.t: "三杯目"
 latria_sexual_frustration_flavor.1023.desc: "三杯目には、広間は賑やかに暖まり、犬は卓の下に潜り込んでいる。誰かが節の数を間違えた歌を始め、誰も直そうとしない。\n\n話の間、手が私の袖に置かれ、話が終わるまでそこにあり、終わると同時に消える。私は笑うべき所で笑う。今夜の酒は格別だ。\n\n楽師が遅い曲を始める。卓の端、パン皿を片づけるあたりに目をやる。袖はまだ、手があった場所の温もりを残している。私は杯の縁を回し、従者にまた注がせる。"
 latria_sexual_frustration_flavor.1023.a: "杯を掲げ、卓越しにその人を見よう。"
 latria_sexual_frustration_flavor.1023.b: "酒のせいにし、階上へ寝に行こう。"
 latria_sexual_frustration_flavor.1023.c: "隣の客と話し、曲を最後まで聞こう。"

 latria_sexual_frustration_flavor.1024.t: "薔薇水と庭の壁"
 latria_sexual_frustration_flavor.1024.desc: "果物に薔薇水がかけられ、卓全体がその香りに満ちている。壁の下では、上手くもない夜鳴き鶯が延々と鳴き続け、誰も止める気になれない。\n\nその人が条約について二度尋ね、私は二度とも、その半分を違えて答えた。二度目に、その人は杯に笑いを落とした。親指についたサフランが縁に移っている。二人の間の灯は、硝子にひびが入っている。\n\n夜鳴き鶯が止む。静けさの中で、壁の裏の溝を流れる水音が聞こえる。私はもう空にした杯を取り上げ、誰かが気づいて注ぐまで持っている。"
 latria_sexual_frustration_flavor.1024.a: "その人に合わせ、条約を明日へ延ばそう。"
 latria_sexual_frustration_flavor.1024.b: "暇を乞うて、庭へ出よう。"
 latria_sexual_frustration_flavor.1024.c: "詩の残り半ばを、その人に詠ませよう。"

 latria_sexual_frustration_flavor.1025.t: "拳の上の鷹"
 latria_sexual_frustration_flavor.1025.desc: "鷹は春よりもしっかりと私の拳に据わり、頭巾は外され、重みは落ち着いている。馬は白樺の奥につながれ、追い立て役は音を立てて先へ行った。\n\n一度だけ、荒れ地の縁でその人と一緒にこの鷹を放った。放つ手から目が離せなかった。最後の瞬間に開く、あの手の開き方。あれから、不都合な時刻にあの手を思い出す。\n\n鷹が足を動かすので、革紐に二本の指を添えて支える。斜面を風が上ってくる。冷たく澄んでいる。私は追い立て役が入った林に目を据えているが、心は林にない。"
 latria_sexual_frustration_flavor.1025.a: "鷹を他の者に渡し、独りで歩き出そう。"
 latria_sexual_frustration_flavor.1025.b: "拳から放し、飛ばせてやろう。"
 latria_sexual_frustration_flavor.1025.c: "腕が痛むまで、もう一度飛ばそう。"

 latria_sexual_frustration_flavor.1026.t: "その人がめくった頁"
 latria_sexual_frustration_flavor.1026.desc: "授業は終わり、本は二人の間で開かれたまま、従軍司祭が乾いた指でめくった頁にある。鎧戸に雨。蝋燭は燃え尽きて曲がっている。\n\n論旨は追えなかった。私は指を見ていた。その側面の墨を見ていた。肘まで押し上げられた袖の具合を見ていた。羞恥はいつも後から来て、何の役にも立たない。\n\n従軍司祭が本を閉じ、理解したかと尋ねる。理解したと答える。鎧戸に雨が続く。私は手を伸ばさぬように、表紙の上に平らに手を置く。"
 latria_sexual_frustration_flavor.1026.a: "その問いを、明日司祭に持って行こう。"
 latria_sexual_frustration_flavor.1026.b: "もう一度言ってもらい、今度こそ聞こう。"
 latria_sexual_frustration_flavor.1026.c: "文字だけを追って、もう一度この頁を読もう。"

 latria_sexual_frustration_flavor.1027.t: "一日が残したもの"
 latria_sexual_frustration_flavor.1027.desc: "最後の請願者も去り、部屋は濡れた毛織りと、卓に塗り込む獣脂の匂いがする。印章は握っていた手で温かい。今日の政務は終わり、私はまだここに座っている。\n\n窓辺で、話者二人の合間に、一つの眼差しが交わされた。靴の中の小石のように、あれからずっと持ち歩いている。何も言われなかった。言う必要もなかった。\n\n書記が印章を取りに来る。渡すと、指は定まっていた。書記は出て行く。扉は完全には閉まらない。掛け金の収まる音を聞きながら座っていると、鉛屋根にまた雨が降りはじめる。"
 latria_sexual_frustration_flavor.1027.a: "明日は人を下がらせ、一つだけ言おう。"
 latria_sexual_frustration_flavor.1027.b: "窓を閉め、書類を終えよう。"
 latria_sexual_frustration_flavor.1027.c: "残りを一枚ずつ片づけよう。"

 latria_sexual_frustration_flavor.1028.t: "箱の中のリボン"
 latria_sexual_frustration_flavor.1028.desc: "棚の箱の中に、私のものではない緑のリボンがある。折り目のところが薄くなっている。出しては戻し、また出す。\n\n市で私はそのリボンを失くし、誰かが泥の中から拾って、要らぬ一礼とともに返してくれた。その人の手は冷たかった。私は礼を言い、それ以上は言わなかった。帰り道ずっと、言わなかったその一言に腹を立てていた。\n\n灯は暗い。リボンは手のひらに横たわり、この光の中では緑はほとんど灰色だ。一度折り、また折る。折り目が合わない。"
 latria_sexual_frustration_flavor.1028.a: "リボンを手首に結んで眠ろう。"
 latria_sexual_frustration_flavor.1028.b: "櫃の底の箱に鍵をかけよう。"
 latria_sexual_frustration_flavor.1028.c: "紙を取り、この夜を書き留めよう。"

 latria_sexual_frustration_flavor.1029.t: "夜番の間を繋ぐ火"
 latria_sexual_frustration_flavor.1029.desc: "火は赤い目ほどに小さくなり、野営地は眠っている。起きているのは私たち二人と見張りだけ。外套は膝にかけている。剣は手が届く場所にある。習慣だ。\n\n十一夜、同じ火を囲んできた。私はその人の呼吸の音を覚えてしまった。今夜はその人も起きている。明日の道のことも、前の町の宿で部屋が一つしかなく、それを取ったことも、どちらも言わない。\n\n風が炎を平らに倒す。薪が崩れる。もう一本足すと火の粉が上がり、その火の粉だけが、この森で動いているものだ。"
 latria_sexual_frustration_flavor.1029.a: "火のそばに座り、夜明けを待とう。"
 latria_sexual_frustration_flavor.1029.b: "火を足して見張りを続け、その人を見まい。"
 latria_sexual_frustration_flavor.1029.c: "夜番を代わり、森の縁まで歩こう。"

 latria_sexual_frustration_flavor.1030.t: "鐘の綱"
 latria_sexual_frustration_flavor.1030.desc: "鐘の綱は手にざらつき、鐘はもう撞かれ、教会は空だ。案内役が鍵を持って扉のそばで待っている。石のように辛抱強い。\n\n私は身体を守るべきものとして考えようとし、その考えを保てない。滑り落ちる。毛織りの下で私は温かく生きていて、祈りとは関わりのない脈が私の中にある。\n\n綱から手を離す。少し揺れて、静まる。案内役が鍵を持ち上げる。その後ろを身廊に沿って歩くと、影が先に石畳を渡り、長く細く、扉の外へ抜けていく。"
 latria_sexual_frustration_flavor.1030.a: "この夜を身体に与え、始末は明日にしよう。"
 latria_sexual_frustration_flavor.1030.b: "跪いて晩課を終えよう。"
 latria_sexual_frustration_flavor.1030.c: "案内役を残し、もう一節聞こう。"

 latria_sexual_frustration_flavor.1031.t: "床に落ちたリボン"
 latria_sexual_frustration_flavor.1031.desc: "火は赤い一筋に燃え尽き、薪を足せとは言っていない。寝衣は襟もとが緩み、部屋は十分暖かいので、そのままにしている。二日前、狩りの小休止の折、下馬に要するより長く、手が私の腰のくぼみに留まっていた。\n\nその手のひらの重み、馬が動いたときに耳元で揺れた息、言葉になりきらぬ低い声を覚えている。私は自分の手を、その手のひらが覆った場所へやる。そこの皮膚は火で温かい。押しても、その温もりは私だけのものだ。\n\nリボンが寝台の柱から床へ滑り落ちている。赤い光の中に横たわるのを見ている。火が落ち着く。拾わない。"
 latria_sexual_frustration_flavor.1031.a: "リボンを拾い、思いの向くままにさせよう。"
 latria_sexual_frustration_flavor.1031.b: "リボンを結び、火を伏せて眠ろう。"
 latria_sexual_frustration_flavor.1031.c: "盤を出して、独りで終盤を指そう。"

 latria_sexual_frustration_flavor.1032.t: "手のひらの重み"
 latria_sexual_frustration_flavor.1032.desc: "石は膝を通して冷たく、長く跪いたので、その冷たさはもう連れのようだ。毛織りの下で身体は熱すぎる。それが火鉢のせいか、ほかの何かのせいか、判じがたい。先週、祝福の折に手が私の頭に置かれ、言葉が終わってもなお留まっていた。\n\n祈りは正しく出てくる。応答も正しい。代わりに立ち上るのは、その手のひらの重み、指の油、どちらも動かず、聖具係が戸口で咳をした、あのひとときだ。私は額を拳に押しつける。大理石は何も返さない。\n\n側祭壇の蝋燭が傾き、また直立する。私はそこにいる。冷たさが膝から上ってくる。そのままにする。"
 latria_sexual_frustration_flavor.1032.a: "立ち、司祭を探して、胸にあったことを言おう。"
 latria_sexual_frustration_flavor.1032.b: "鐘が鳴るまで徹夜の祈りを続けよう。"
 latria_sexual_frustration_flavor.1032.c: "脚が膝ほど冷えるまで回廊を歩こう。"

 latria_sexual_frustration_flavor.1033.t: "二枚目の外套"
 latria_sexual_frustration_flavor.1033.desc: "火が二人の間で燃え、犬たちは静かになった。誰かが断りもなく、二枚目の外套を私の肩にかけた。毛織りは他人の汗と薪の煙の匂いがする。その人の膝が私の膝に当たっている。どちらも動かさない。\n\n立ち上がる理由なら三つ挙げられる。見張り、閉まらぬ天幕の垂れ、明け方に来る寒さ。かわりに私は炎へ顔を向け、肩を、落ち着いた場所に置かせておく。二人の息は吐き出され、間で薄くなる。外套の下で、手が自分の袖の縫い目を探し当て、握る。\n\n枝が一本、火に落ちる。その人は動かない。私も動かない。火の粉が上がって、散る。"
 latria_sexual_frustration_flavor.1033.a: "火が灰になるまで、外套の下にいよう。"
 latria_sexual_frustration_flavor.1033.b: "毛織りに礼を言い、天幕へ戻ろう。"
 latria_sexual_frustration_flavor.1033.c: "夜番が替わるまで、犬のことを尋ねよう。"

 latria_sexual_frustration_flavor.1034.t: "第三項"
 latria_sexual_frustration_flavor.1034.desc: "条約は二度写され、二枚目は第三項が誤っている。四度読んだが、誤りはそのまま残っている。襟は開いている。火鉢が部屋を熱くし、それを見る者はここにはいない。\n\n私が立ち返るのは控えの間だ。使節の口が私の手首の内側に、それからその上へ。公証人の足音が扉の外を行き来するあいだ、私はそのままでいさせた。書き取られ得ることは何も言わなかった。相手はもっと少なかった。\n\n蝋燭が蝋から三日月を食い取っている。筆を取り、置き、第三項をまた読む。言葉は変わっていない。"
 latria_sexual_frustration_flavor.1034.a: "使節を呼び、考えていたことをはっきり言おう。"
 latria_sexual_frustration_flavor.1034.b: "この項をまた写し、夜明けに告解へ行こう。"
 latria_sexual_frustration_flavor.1034.c: "蝋燭が消えるまで祈祷書を読もう。"

 latria_sexual_frustration_flavor.1035.t: "二度の旋回"
 latria_sexual_frustration_flavor.1035.desc: "広間は賑やかで、酒が頭に回っている。遠くはない。ただ、回るには足りる。寝衣は肩で緩み、直そうともしていない。最後の舞踏で、手が私の腰に落ち着き、二度の旋回の間そこにあり、部屋は混んでいて退くことができなかった。\n\n絹越しに、あの指の四つの先がまだ分かる。私は自分の手を肩へやり、布の滑った温かな場所へ。音楽はもう奏者の背後へ流れている。それでも私は拍を刻む。\n\n頭上の灯が煙る。遠い卓で、誰かが私の聞かなかったことに笑う。肩は露わなままで、そのままにしている。"
 latria_sexual_frustration_flavor.1035.a: "もう一曲所望して、踊り抜こう。"
 latria_sexual_frustration_flavor.1035.b: "寝衣を直して、窓辺で冷たい空気に当たろう。"
 latria_sexual_frustration_flavor.1035.c: "広間が空になるまで、火のそばで老犬と座っていよう。"

 latria_sexual_frustration_flavor.1036.t: "灯籠の川"
 latria_sexual_frustration_flavor.1036.desc: "庭には灯籠が張り巡らされ、眼下の川にもさらに多くが漂い、光が緩やかに暗がりへ流れていく。門で誰かに押しつけられた絹の灯籠を手にしている。側面に謎が記されているが、二度目は読んでいない。人混みが動いて、知らぬ者の手が一度だけ私の手に触れ、群れの中へ消えた。\n\n顔は見えなかった。肩と、袖の揺れ、そして川を下る灯籠だけが見えた。私は空を掴んで手を閉じる。謎は、運ぶほど重くなるものを人は何と抱えるかと問う。答えは分かっているが、知りたくない。\n\n今宵、いるべきあの人がいない。私は灯籠を残りの灯籠とともに水へ置き、流れに乗るのを見送る。灯りは曲がり角の向こうで一つ、また一つと消える。最後の一つが消えるまで、欄干のそばに留まる。"
 latria_sexual_frustration_flavor.1036.a: "自分の灯籠を所望し、名を記そう。"
 latria_sexual_frustration_flavor.1036.b: "人混みに礼を述べ、静かな道を帰ろう。"
 latria_sexual_frustration_flavor.1036.c: "謎を最後まで読み、心で反芻しよう。"

 latria_sexual_frustration_flavor.1037.t: "温かく、恥じず"
 latria_sexual_frustration_flavor.1037.desc: "儀礼は終わり、神殿は空きゆくが、私はしばらく後生の温もりに跪いている。我が信仰は、身体を負債とは説かない。今宵の言葉もそうであった。肌はその温もりを保ち、私はそれを悔いていない。\n\n一つの触れが甦る。幾日か前、首の後ろに置かれた手。かつてなら汚点と呼んだはずの場所に、今は祝福だけがある。私は記憶を留める。それは焼かず、灯明のように内に座し、私の息は緩く均される。\n\n最後の蝋燭が私の前を運ばれていく。私は膝を据えて立ち、顔を涼やかに保つ。私のあるじまいが何であれ、それを恥じてはおらず、神殿も恥じよとは求めない。"
 latria_sexual_frustration_flavor.1037.a: "祝福を声に出し、温もりを留めよう。"
 latria_sexual_frustration_flavor.1037.b: "祭壇に辞儀し、静けさを携え出よう。"
 latria_sexual_frustration_flavor.1037.c: "なお座し、私を解き放った言葉を味わおう。"

 latria_sexual_frustration_flavor.1038.t: "炎への願い"
 latria_sexual_frustration_flavor.1038.desc: "年の変わりに、中庭には高い篝火が組まれ、家中の者が一度ずつ跳び越えた。空中にサフランの香り、杯には冷やしたシャーベット。私は炎の上で願いをかけ、口には出さなかった。炎の向こうで、誰かがそれを見、目を逸らさなかった。\n\n今、宴は酒と喧噪に私を室内へ運んだ。襟は緩み、部屋は温かい。脛に炎の熱がまだ残り、あの視線の重みも、知らぬ者より一息長く留まったまま。私は杯を回し、飲まない。\n\n炎はもう戸口の向こうで赤い残り火だ。私はシャーベットを置く。願いはまだ私のもので、使い果してはいない。"
 latria_sexual_frustration_flavor.1038.a: "炎の向こうの人を探し、率直に語ろう。"
 latria_sexual_frustration_flavor.1038.b: "良い年を祈り、暇を告げよう。"
 latria_sexual_frustration_flavor.1038.c: "熾火のそばへ出て、冷えた庭を歩こう。"

 latria_sexual_frustration_flavor.1039.t: "長い一瞥"
 latria_sexual_frustration_flavor.1039.desc: "ナーダムは三日、埃と音に満ちる。馬乳酒が、思うより頭に回っている。草を均された野で、力士はまだ組み合い、唸り、腿の埃を払っている。開けた草原から風が来て、私と空の間に何もない。\n\n二番目の競走で、一人の乗り手が過ぐる際に、一拍長く私の視線を受け止めた。それ以来、手放せずにいる。次の組を見ながら、何も見えていない。外套の下で、手が縫い目を探し、握る。草は鳴り、伏し、また立つ。\n\n野に埃が積もる。腿に当たる皮袋の乳は温かい。天幕へは、まだ行かない。"
 latria_sexual_frustration_flavor.1039.a: "競走のあと馬を走らせ、風に託そう。"
 latria_sexual_frustration_flavor.1039.b: "力士に礼を述べ、夜の床に就こう。"
 latria_sexual_frustration_flavor.1039.c: "乗り手らと座し、光の消えるまで語ろう。"

 latria_sexual_frustration_flavor.1040.t: "侵犯"
 latria_sexual_frustration_flavor.1040.desc: "儀礼はこの渇望を罪と名づけ、私はそれを祓うため冷たい石に跪いた。冷たさは膝から上り、その働きをするが、渇望は去らない。静水の下の石のように祈りの下に座し、私の一言一句がその上への侵犯となる。\n\n繰り返し甦る口は、名も知らぬ誰かのものではなく、ただ温もり、近さ、在って、やがて消えた手。私は額を拳に押し当て、告解を形にしようとする。言葉は出ず、喉が閉ざされ、神殿は何も返さない。\n\n衝立の向こうで兄弟が身じろぎし、静まる。私は石に伏したまま。務めの鐘は近く、私は告げておらず、立ち上がらない。"
 latria_sexual_frustration_flavor.1040.a: "自室に下がり、渇望に始末をつけよう。"
 latria_sexual_frustration_flavor.1040.b: "徹夜の祈りを保ち、石に身を委ねよう。"
 latria_sexual_frustration_flavor.1040.c: "暗がりに横たわり、慰めが訪れるに任せよう。"
