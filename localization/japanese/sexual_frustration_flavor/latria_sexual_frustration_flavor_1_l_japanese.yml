l_japanese:
 latria_sexual_frustration_flavor.1001.t: "帳の陰の長い夜"
 latria_sexual_frustration_flavor.1001.desc.female: "寝衣を羽織って窓辺に座り、膝に未開封の手紙を載せている。帳の隙間から差し込む月明かりが、折り目についた指の跡を照らしていた。差出人はとうに去った。それでも私は箱の底から手紙を取り出しては戻し、また取り出してしまう。\n\n最後に会った時のことを思い出す。あの人は言いかけた言葉を途中で止め、まだ何か続けたそうにしながら、先に袖を引いてしまった。私はただうなずき、引き留める言葉を一つも口にできなかった。夜も更けた今、その言いかけた一言が、手紙のどの文句よりもはっきりと思い出される。\n\n風が帳を揺らし、手紙もかすかに音を立てた。私は封蝋に指を置いたまま、封を切ることも、箱に戻すこともできずにいる。"
 latria_sexual_frustration_flavor.1001.desc.male: "寝衣を羽織って窓辺に座り、膝に未開封の手紙を載せている。帳の隙間から差し込む月明かりに、封筒の見慣れた筆跡が浮かんでいた。差出人が去ってから久しいのに、私はずっとこの手紙を帳簿の下にしまい込んでいた。\n\n立ち去る前、あの人は返事を待つように私を見た。あの時はほかに用事を抱えていて、また日を改めて話そうとだけ答えた。その日が来た時には、もうあの人はいなかった。それなのに、あの眼差しだけが今も目の前に残っている。\n\n窓の外で夜番の時を告げる音がした。私は手紙を裏返し、また表に返す。封蝋はまだ欠けもせずに残っていた。"
 latria_sexual_frustration_flavor.1001.desc: "夜が更けると、片づかない思いがまた胸に浮かんでくる。\n\n私は手紙を取り上げ、封を眺めてから膝に戻した。部屋には誰もおらず、灯芯のはぜる音さえよく聞こえる。明日の用事に考えを向けようとしても、いつの間にか同じところへ戻ってしまう。\n\n帳が少し揺れた。手紙はここにある。あの人は、ここにいない。"
 latria_sexual_frustration_flavor.1001.a: "最後まで読み、差出人に思いを馳せよう。"
 latria_sexual_frustration_flavor.1001.b: "手紙に鍵をかけ、思いを抑えよう。"
 latria_sexual_frustration_flavor.1001.c: "新しい紙を取り、この思いを詩にしよう。"

 latria_sexual_frustration_flavor.1002.t: "宴の香辛料"
 latria_sexual_frustration_flavor.1002.desc.accepted: "宴席には酒の匂いを覆うほど香辛料が香り、楽師は三曲目を奏で始めた。客たちは相変わらず顔を寄せて話している。ここではそのくらい親しくしても無礼にはならず、皆は笑い合い、また杯を回していた。\n\n私は向けられる眼差しを一つずつ確かめてしまう。誰かが杯を掲げれば応じるが、目はここにいない顔を探し続けている。隣の客が冗談を言った時も、笑うのが少し遅れてしまった。\n\n従者が酒を注ぐまで、手に杯を持っていたことさえ忘れかけていた。香辛料の香る湯気が立ち上っても、胸にある寂しさは埋まらなかった。"
 latria_sexual_frustration_flavor.1002.desc.strict: "香辛料が宴を引き立てる。笑い声が上がるたび、私は少しの逸脱も見逃さぬ礼法を思い出していた。隣の客がこちらに身を傾けて話しかけると、思わず杯を持ち直した。そうすれば行儀よく見える気がした。\n\n誰かが昔話を始めたが、途中で言葉を切った。すぐに話題は領地や収穫へ移った。私も皆に合わせてうなずきながら、途切れた言葉の続きばかりを気にしていた。\n\n従者が酒を注ぐまで、手に杯を持っていたことさえ忘れかけていた。縁まで酒が満ちて、ようやく私は杯を卓上に戻した。"
 latria_sexual_frustration_flavor.1002.desc: "宴は賑やかなのに、私の心は同じことばかりに引き寄せられる。\n\n音楽も杯も語らう客もすぐ目の前にある。それなのに、どの言葉も最後まで耳に入らない。隣の客にまだ酒が要るかと聞かれ、返事はしたものの、自分が何と答えたかもわからなかった。\n\n曲が替わって初めて、ずっと広間の扉を見ていたことに気づいた。扉は二度開いたが、どちらも会いたい人ではなかった。"
 latria_sexual_frustration_flavor.1002.a: "私も親しげな言葉を添えよう。"
 latria_sexual_frustration_flavor.1002.b: "目を伏せ、主催者に礼を述べて帰ろう。"
 latria_sexual_frustration_flavor.1002.c: "帰る前に、もう一曲頼もう。"
 latria_sexual_frustration_flavor.1002.d: "客を一つの卓に集め、夜通し語らおう。"

 latria_sexual_frustration_flavor.1003.t: "庭園の説教"
 latria_sexual_frustration_flavor.1003.desc.favors: "庭の石の腰掛けに座った説教者が、肉体の快楽は私たちの信仰に背くものではないと語っていた。風に頁の隅をめくられても、指で押さえ、ゆっくりと話し続けている。\n\nその言葉に安堵してよいはずだった。ところが私が思い出したのは、あの人が去り際に口にした冗談と、その時に応えられなかった眼差しだった。聖典の言葉は耳を通り過ぎ、あの一言ばかりが頭に残った。\n\nわかったかと説教者に尋ねられ、私はうなずいた。だが、聞いていたはずの頁はもう見失っていた。"
 latria_sexual_frustration_flavor.1003.desc.condemns: "説教者が自制と貞潔を説く言葉は、一つひとつはっきり聞こえていた。庭は静かで、葉擦れの音さえ話の間を埋めているようだった。私は両手を膝に置き、姿勢を正していたが、心は聖典に向いていなかった。\n\n昨夜、眠りの浅かったひと時を思い出す。誰かが訪ねてきたわけでも、何か言われたわけでもない。ただ、あの落ち着かない思いがひとりでに戻ってきたのだ。聖典に目を据えても、文字を文として読み取れなかった。\n\n説教者が頁をめくった。私もそれに合わせてうつむいたが、今どこを読んでいたのか、やはりわからなかった。"
 latria_sexual_frustration_flavor.1003.desc: "庭で最後まで説教を聞いた。風が頁を揺らしても、私の思いはまだ定まらない。\n\n説教者はもう立ち上がり、ほかの人に声をかけに行っていた。私は座ったまま、指で頁を押さえ、石畳の小道の先を見ていた。そこには誰もいない。それでも、しばらく目を離せなかった。\n\n我に返った時には、風に何枚も頁をめくられていた。"
 latria_sexual_frustration_flavor.1003.a: "本を閉じ、恋しい相手のことを考えよう。"
 latria_sexual_frustration_flavor.1003.b: "思いを脇に置き、唱和に加わろう。"
 latria_sexual_frustration_flavor.1003.c: "一節ずつ説明してもらおう。"

 latria_sexual_frustration_flavor.1004.t: "落ち着かぬ隼"
 latria_sexual_frustration_flavor.1004.desc.lustful: "腕に止まった隼が羽ばたき、遠くの鳩の群れを追っている。足につながれた革紐を嫌がり、翼を広げるたびに風が起こる。私が押さえても、隼はあの開けた場所から目を離さなかった。\n\nその逸る気持ちを、私はよく知っている。林の端では猟師たちが私の指示を待ち、馬までじれて足踏みしている。それでも私は別のことを考え、手にした笛さえ忘れていた。はっきりした考えにもならない思いが、いつまでも止まらなかった。\n\n隼がまた羽ばたいた。その時になって、自分が手袋を強く握りすぎていることに気づいた。"
 latria_sexual_frustration_flavor.1004.desc.chaste: "腕の上で隼が落ち着かなく足を動かしている。私は努めて手綱の鳴る音と笛に耳を澄まし、林の方だけを見つめていた。猟師たちはすでに散らばり、私の合図を待っている。\n\nだが、心に浮かぶ思いは鳥よりも押さえにくい。呼吸を数え、蹄の音を数え、枝の葉まで数えてみても、いつしか同じ人のことを考えてしまう。あの人は狩り場にはいない。わかっていても、思い出さずにはいられなかった。\n\n隼が首をかしげて私を見た。自分にわかる指図を待っているようだったが、私はすぐに応えられなかった。"
 latria_sexual_frustration_flavor.1004.desc: "猟師たちは私が隼を呼び戻すのを待っている。それなのに、どうしても狩りに集中できない。\n\n林を渡る風がやむと、腕の上の羽ばたきがひときわはっきり感じられた。私は手を上げ、また下ろした。呼び声を出そうとしても、声にならなかった。\n\n遠くで誰かが私の名を呼んだ。返事はしたが、目はまだ開けた場所に向いたままだった。"
 latria_sexual_frustration_flavor.1004.a: "皆を待たせて、しばし思いに浸ろう。"
 latria_sexual_frustration_flavor.1004.b: "気を取り直し、狩猟道具を整えよう。"
 latria_sexual_frustration_flavor.1004.c: "ゆっくり羽を撫で、もう一度呼んでみよう。"

 latria_sexual_frustration_flavor.1005.t: "会議の合間"
 latria_sexual_frustration_flavor.1005.desc.emperor: "諸侯が席を立った後も、従者たちは地図と印章を片づけていた。長卓の端に私だけが残り、未処理の書類の傍らには古い手紙が一通挟まっている。印に使った墨の匂いもまだ残っていた。\n\n先ほどまで皆が争っていたのは、境界と税のことだった。私はうなずきもしたし、二度ほど異を唱えもした。傍目には、すべて聞いていたように見えたはずだ。実際には、書類の下からのぞく手紙の隅ばかりを見ていた時があった。\n\n卓上をすべて片づけてよいかと従者に聞かれた。私は紙の束に手を置き、すぐには返事をしなかった。"
 latria_sexual_frustration_flavor.1005.desc.adventurer: "仲間たちは次に向かう渡し場を決めたが、卓上の地図はまだ広げたままだった。私は古い手紙を灯りの下へ移した。また旅程の一覧が頭に入らなくなっている。\n\n外では誰かが馬具を整え、留め金が触れ合う音がしていた。私が確かめるべき道筋を三度読んでも、覚えているのは手紙に出てくる昔の地名ばかりだった。その場所を、明日通るわけではない。\n\n仲間が戸口で待っていた。私は手紙を覆い隠したが、指を離すことはできなかった。"
 latria_sexual_frustration_flavor.1005.desc.clergy: "話し合いは終わったが、帳簿と聖典はまだ卓上に広がっていた。頁の間から古い手紙を抜き出すと、静まろうとしない思いが私の中に戻ってきた。\n\n昼の間は、寄進も修繕も祭日の支度も、一つずつ段取りをつけていた。独りで座る今となっては、その数々の数字も頭から退いてしまう。聖典に挟まれて跡のついた手紙は、端も毛羽立っていたが、その一行はひと目でわかった。\n\n廊下を誰かが通った。私は手紙を聖典に戻した。挟んだのは、また同じ頁だった。"
 latria_sexual_frustration_flavor.1005.desc.ruler: "評議会は散会したが、書類と封蝋はまだ卓上に積まれていた。私は袖口を整えた。どの報告よりも、傍らの古い手紙の方が気にかかっていた。\n\n書記の残した要約はわかりやすく書かれている。それを取り上げても、最初の名前を読み終える前に目が手紙へ逸れた。この卓にあるはずのない手紙だ。今朝、自分で忍ばせておいたのだった。\n\n扉の外では、皆が次の指示を待っていた。私はもう少し待つように伝えた。"
 latria_sexual_frustration_flavor.1005.desc: "片づけるべき用事はいくつもある。それなのに、古い手紙が一通あるだけで、私はいつまでも集中できずにいた。\n\n書類を大きさに合わせて重ね、また崩し、もう一度重ね直した。手紙だけはずっといちばん上にある。灯油は減っていくのに、裁可の一字も書けていなかった。\n\n扉の外で誰かが小さく咳払いした。それでようやく、私は手紙から手を離した。"
 latria_sexual_frustration_flavor.1005.a: "仕事を脇に置き、手紙を読み返そう。"
 latria_sexual_frustration_flavor.1005.b: "手紙をしまい、務めに戻ろう。"
 latria_sexual_frustration_flavor.1005.c: "残りの仕事を整理し、少し休もう。"
 latria_sexual_frustration_flavor.1005.d: "仕事を仕分けし、すべて片づけよう。"

 latria_sexual_frustration_flavor.1006.t: "燭光に照らす古い手紙"
 latria_sexual_frustration_flavor.1006.desc.female: "寝衣を羽織って灯りの下に座り、古い手紙の折り目に指を置いている。約束の言葉はなく、何気ない挨拶が数行あるだけだった。ただ、末尾には大きな余白があり、そこで急に筆を止めたように見えた。\n\n私は長いこと、その余白を眺めていた。届いた頃には気にも留めなかったのに、今夜は書かれた言葉よりも、その空白が気にかかる。灯芯がはぜ、紙の上で影が跳ねた。\n\n寝衣の紐が緩んでいたが、結び直す気にはならなかった。手紙は開いたまま、夜はまだ長い。"
 latria_sexual_frustration_flavor.1006.desc.male: "寝衣を羽織って寝台の脇に座る。古い手紙の筆跡を見ると、応えられないままになった好意を思い出す。紙はすっかり柔らかくなり、折り目は今にも裂けそうだったが、私はそれでも広げた。\n\n書かれているのは道中の天気と、ちょっとした出来事だ。だが、私が覚えているのは、手紙が届いた日に廊下に立っていた自分だった。追いかけようとして、別の者に呼び止められた。その後、手紙は箱にしまい、あの人は二度と戻らなかった。\n\n灯芯が少し短くなった。私は紙の向きを変えてみたが、そこにある言葉は変わらなかった。"
 latria_sexual_frustration_flavor.1006.desc: "夜は静かだが、古い手紙の言葉がいつまでも目に残っている。\n\nひと目だけ見て眠るつもりだった。ところが灯りをともすと、その数行から離れられなくなった。私は途中まで読んでは、また初めから読み直す。あの頃には読み取れなかった意味が、どこかに隠れている気がした。\n\n寝台はもう整っている。それでも私は座ったまま、手紙の縁に新しい指の跡をつけていた。"
 latria_sexual_frustration_flavor.1006.a: "最後まで読もう。"
 latria_sexual_frustration_flavor.1006.b: "手紙をしまい、蝋燭を消して眠ろう。"

 latria_sexual_frustration_flavor.1007.t: "宴が終わる前に"
 latria_sexual_frustration_flavor.1007.desc.accepted: "談笑の中で昔の恋人の話が出ても、席の誰も無礼だとは思わなかった。ひと巡り杯を交わすと笑いも収まり、天気の話でもするように話は続いた。\n\n私も杯を上げたが、何度も空いた席に目を向けてしまった。そこの杯はすでに片づけられ、卓布の平らな跡だけが残っている。誰を待っているのかはわかっている。その人が今夜は来ないことも。\n\n何を見ているのかと隣の客に聞かれ、私は首を振った。酒を飲むのは忘れていた。"
 latria_sexual_frustration_flavor.1007.desc.strict: "席上ではある秘めた恋が戒めとして語られ、やがて皆は名誉と決まりについて話し始めた。声を落としても隣には聞こえるので、笑う時まで用心していた。\n\n私はうつむいて袖口を整え、口を挟まなかった。私の話ではない。それでも、自分に向けて言われているように聞こえた。卓の下で杯の脚を一周させ、また一周させた。\n\n話題はすぐに替わった。袖口はすっかり整っていたが、私の心はまだそこから動けなかった。"
 latria_sexual_frustration_flavor.1007.desc: "音楽はまだ続いているのに、私の心はとうに宴席を離れていた。\n\n客たちは最後の酒を回している。私は話す口元を眺めていたが、耳に入るのは、自分の中で行き場をなくした言葉ばかりだった。誰かに杯を向けられて持ち上げると、酒の表面が揺れた。\n\n曲は終わりに近づいていた。私はまだ座っていたが、この宴に留まるつもりなのか、自分でも決めかねていた。"
 latria_sexual_frustration_flavor.1007.a: "私の恋慕も、初めから聞かせてやろう。"
 latria_sexual_frustration_flavor.1007.b: "言葉を呑み込み、主催者に礼を述べて帰ろう。"
 latria_sexual_frustration_flavor.1007.c: "代わりに隣の客に旅の話を尋ねよう。"

 latria_sexual_frustration_flavor.1008.t: "聖龕の前の祈り"
 latria_sexual_frustration_flavor.1008.desc.favors: "聖龕の前の蝋燭が尽きかけている。私たちの信仰は肉体の快楽を憎まない。その教えは何度も聞いてきたが、今になって初めて、自分でそれをどう受け止めるか問われている気がした。\n\n銅の燭台には流れた蝋が重なり、すでに固まっている。祈りを半ばまで唱えても、口にする言葉とは裏腹に、私はある人の手や、近づく時の衣擦れを思い出していた。聖龕の像は動かず、炎だけが一度揺れた。\n\n思いを祈りに引き戻そうとした。だが途中で、またそれを手放してしまった。"
 latria_sexual_frustration_flavor.1008.desc.condemns: "聖龕の前で貞潔の誓いを繰り返す。慣れ親しんだ祈りなのに、私は何度も言葉を途切れさせてしまった。初めの一文は唱えられても、次からは言葉が抜け、その隙間に別の思いが入り込んでくる。\n\nその思いは静かなものだった。今夜戻っても、寝台は空いたままで、手を取ってくれる相手もいない。ただ、それを思い出させるだけだ。私は額にかかった髪を払い、最初から祈り直した。\n\n灯芯がはぜた。私の声も、それとともに止まった。"
 latria_sexual_frustration_flavor.1008.desc: "祈りは終えた。それでも私は、蝋燭のそばに留まっている。\n\n唱えるべき言葉はすべて唱えた。膝が少ししびれていたが、立ち上がらなかった。炎が低くなり、またどうにか持ち直す。その火も、訪れようとしない終わりを待っているようだった。\n\n小さな灯りを見つめながら、心にある思いをまだ手放していないことはわかっていた。祈りの間だけ、脇に置いていたのだ。"
 latria_sexual_frustration_flavor.1008.a: "禁欲の誓いを脇に置き、思いを認めよう。"
 latria_sexual_frustration_flavor.1008.b: "思いを抑え、祈り続けよう。"
 latria_sexual_frustration_flavor.1008.c: "一節読み、よく考えてから帰ろう。"
 latria_sexual_frustration_flavor.1008.d: "蝋燭を灯し、夜明けまで唱えよう。"

 latria_sexual_frustration_flavor.1009.t: "読めぬ請願"
 latria_sexual_frustration_flavor.1009.desc.emperor: "長卓に報告が広げられ、諸侯は私の言葉を待っている。同じ一行を二度読んだのに、二つ目の数がどうしても頭に残らなかった。指の間で筆を回すと、余白に墨が落ちた。\n\n皆の眼差しには、敬意に代わって戸惑いが浮かび始めていた。咳払いをする者、水を注ぎに行く者はいても、誰も先に口を開こうとしない。裁定を下すべきなのはわかっているのに、頭をよぎるのは昨夜書きかけた半行だった。\n\n書記が次の報告を少しこちらへ押し出した。私の手は、まだ最初の一通の上にあった。"
 latria_sexual_frustration_flavor.1009.desc.ruler: "評議会はまだ終わっていない。それなのに、卓上の書類が一字も頭に入らない。私は綴じた書類を閉じ、また開いた。頁の端には昨日つけた注記が残っていた。\n\n臣下は穀物の値と河川について話している。いくつかの言葉が耳に入っても、すぐに気が逸れ、やがてある人の名前に行き着いてしまう。この書類にその名はない。それでも私は紙の上に探していた。\n\n休会にするかと聞かれて顔を上げた。部屋は、すでにしばらく静まり返っていた。"
 latria_sexual_frustration_flavor.1009.a: "評議会を散会し、独りで考えさせてもらおう。"
 latria_sexual_frustration_flavor.1009.b: "気を取り直し、一つずつ請願に応じよう。"
 latria_sexual_frustration_flavor.1009.c: "裁定を整理し、順に言い渡そう。"

 latria_sexual_frustration_flavor.1010.t: "帰らぬ鷲"
 latria_sexual_frustration_flavor.1010.desc.lustful: "鷹が林の上を旋回し、その影が何度も私の手袋を横切る。なかなか降りてこない。腕を上げても、さらに高い所をひと巡りするばかりだった。\n\n戻ろうとしない姿を見ていると、どんなささやかな望みまで押し殺すのにも、自分はもう疲れているのだと思った。猟師たちは馬のそばで声を落として話し、私が風向きを待っていると思っている。本当は、この落ち着かなさに別の名をつけようとしていた。だが、できなかった。\n\n鷹が一声鳴いた。短く鋭いその声は、もう合図に従いたくないと言っているようだった。"
 latria_sexual_frustration_flavor.1010.desc.chaste: "鷹はまだ遠くで旋回している。私は手袋を握り締め、猟師の合図だけを聞き、林の縁と風向きだけを見るよう努めた。手の中の革紐が湿っていた。\n\nこんなふうに自分を抑えることは、何度もしてきた。だが今日は、とりわけ難しい。待つうちに、思うべきでない言葉が一つずつ増える。心の中で言いかけては、自分で打ち消した。馬が枯れ枝を踏み折り、その小さな音に驚いてしまった。\n\n鷹はまだ戻らない。私の手はもう疲れていた。"
 latria_sexual_frustration_flavor.1010.desc: "猟師たちは引き揚げるのを待っている。それでも私は、林の上の空を見続けていた。\n\n角笛は鞍のすぐ脇にある。私はそれに触れたが、取り上げなかった。空の黒い点がひと巡りし、またひと巡りする。誰も急かさないが、皆が待っていた。\n\nようやく目を下ろした時、鷹がどちらへ飛んだかさえ、きちんと見ていなかったことに気づいた。"
 latria_sexual_frustration_flavor.1010.a: "猟師たちを待たせ、鷲と共に思いを巡らせよう。"
 latria_sexual_frustration_flavor.1010.b: "帰還の合図を出し、狩猟道具を点検しよう。"
 latria_sexual_frustration_flavor.1010.c: "林沿いを歩いてから皆の所へ戻ろう。"

