l_japanese:
 latria_sexual_frustration_flavor.1301.t: "送らぬ招待状"
 latria_sexual_frustration_flavor.1301.desc.female: "寝衣で机に向かい、紙には名前を一つだけ書いていた。墨が乾かぬうちに、戸口の侍女が届けるかと尋ねた。私は紙を一度折ったが、封もせず、返事もしなかった。\n\n昼間には書く勇気の出ない名だった。夜に書いてみると、紙が手に熱く感じられた。続けて誘いの言葉を書くはずだった。場所も時刻も決めてあるのに、筆は呼びかけの後で止まった。侍女がもう一度、先ほどより小さな声で尋ねた。\n\n私はその名前を見つめた。書きかけの手紙のどの言葉よりも、その名だけが重かった。"
 latria_sexual_frustration_flavor.1301.desc.male: "寝衣で机に向かい、紙には名前を一つだけ書いていた。外では従者が伝言を待っている。戸の隙間の影が少し動き、また止まった。\n\n筆に十分な墨を含ませ、紙の上で止めた。書きたいことははっきりしていた。今夜、脇の門で、ほかの誰にも知られずに。だが紙に書けば、もう心の中だけのことではなくなる。灯芯がはぜ、名前の横に墨が落ちた。\n\n従者が控えめに咳をした。私はまだ、その手紙に封をしていなかった。"
 latria_sexual_frustration_flavor.1301.desc: "封をしていない手紙が、長いこと灯りの下に置かれていた。\n\n紙には呼びかけしかない。その後の大きな余白には何行でも書けそうなのに、私は一文も書かなかった。蝋はもう温めて柔らかくなり、封をする匙も手元にある。それにも手を伸ばさなかった。\n\n灯油が少し減った。名前の墨は、まだ湿っていた。"
 latria_sexual_frustration_flavor.1301.a: "手紙を書き終え、従者に渡そう。"
 latria_sexual_frustration_flavor.1301.b: "手紙をしまい、思いを抑えて休もう。"

 latria_sexual_frustration_flavor.1302.t: "宮廷の裁き"
 latria_sexual_frustration_flavor.1302.desc.accepted: "宮廷詩人が昔の恋を笑い話にすると、最も厳格な貴族さえ眉をひそめなかった。寝室での出来事も、狩り場の面白い話と同じ調子で語っている。皆が杯を上げ、酒の表面に光がひと巡りした。\n\n私も笑って杯を上げたが、口の中の酒は苦かった。話に出ているのは私ではない。それでも、自分の夜まで人前にさらされている気がした。隣の客が袖に触れ、なぜ話に加わらないのかと尋ねた。その時になって、自分の笑いが遅れていたことに気づいた。\n\n詩人はまた次の一節を始めた。私の杯は、まだ宙で止まっていた。"
 latria_sexual_frustration_flavor.1302.desc.strict: "秘めた恋で体面を失った貴族がいて、皆はその一族について噂していた。言葉はゆっくりと、判決を言い渡すように続いた。首を振る者もいれば、子の縁組を考え直す者もいた。\n\nその評を聞きながら、私も同じように量られるのだと思った。秤に載るのは、送っていない手紙と、よく眠れなかった幾晩かだ。まだ誰にも見られてはいない。だが見えないからといって、なくなるものでもなかった。\n\nどう思うかと聞かれた。私は杯を置き、底が卓に当たる音を聞いた。"
 latria_sexual_frustration_flavor.1302.desc: "席上の話題が、名誉と欲望へ移った。\n\n最初はただの冗談だった。だが、どの門で、何時に、と話が具体的になるにつれ、笑えなくなった。私は座ったまま、卓布の下で自分の手が強く握られていくのを見ていた。\n\n楽師はまだ奏でていた。こうした言葉を遮るのを恐れるように、その音は小さかった。"
 latria_sexual_frustration_flavor.1302.a: "自らの恋慕を語り、何度でも話をそこへ戻そう。"
 latria_sexual_frustration_flavor.1302.b: "口をつぐみ、主催者に礼を述べて帰ろう。"

 latria_sexual_frustration_flavor.1303.t: "真夜中の鐘"
 latria_sexual_frustration_flavor.1303.desc.favors: "鐘が鳴り終えても、祭司は戸口に留まっていた。欲は善いことへ導くこともできるという。大きな声ではないが、夜にはよく聞こえた。殿堂の蝋燭が、その影を私の膝の前まで伸ばしていた。\n\n私には、もうその「善いこと」を待ち続けたいのかさえわからなかった。待つこと自体が、もう一つの戒律になっていた。袖の中で手が熱く、どの聖典の言葉にも、この思いの置き場を見つけられない。祭司はこちらを見て、私が問いの続きを口にしていないことを察したようだった。\n\n鐘の余韻がまだ梁に残っていた。跪いた私の膝は、もうしびれていた。"
 latria_sexual_frustration_flavor.1303.desc.condemns: "鐘が繰り返し響くたび、祭司の唱える誓いも私の心に重なった。跪いた膝はしびれ、石板の冷たさも、とうに自分の熱で失われていた。答えはまだ見つからない。\n\n誓いの一文一文を、私は知っていた。だが、知っていることと従う気になれることは違う。「捨て去る」と唱えるところで舌が止まり、少し遅れてようやく言葉になった。祭司は直さなかったが、そのためらいは自分には十分聞こえた。\n\n最後の鐘が鳴り終わった。殿堂は蝋の落ちる音まで聞こえるほど静かだった。"
 latria_sexual_frustration_flavor.1303.desc: "真夜中の祈りを終えても、私の心は静まらなかった。鐘の音はまだ響いていた。\n\n最後の一文まで唱和した。それでも私は同じ場所に跪き、心の悩みも同じ所に残っていた。鐘の音を聞いたからといって、その形は変わらなかった。\n\n祭司が聖典を閉じた。頁の重なる音は、鐘よりも近くに聞こえた。"
 latria_sexual_frustration_flavor.1303.a: "禁欲の戒めは神殿に置いていこう。"
 latria_sexual_frustration_flavor.1303.b: "思いを抑え、もう一度祈りを唱えよう。"

 latria_sexual_frustration_flavor.1304.t: "忍耐の終わり"
 latria_sexual_frustration_flavor.1304.desc.lustful: "寝衣のまま部屋を行き来する。侍女が持ってきた盤は、まだ一手も進めていない。窓の隙間から夜気が入るが、心は少しも軽くならない。\n\n寝台の脇に立ち、机の脇に立ち、扉の脇にも立った。向こう側に足音はない。誰も来ないとわかっているのに、遠くで時を告げる音がするたび、扉を叩く音を待ってしまう。駒箱がかたかたと鳴り、袖が触れたのだと気づく前に、私はそちらへ顔を向けていた。\n\n盤の前に戻り、歩の一つに手を置く。まだ進めない。"
 latria_sexual_frustration_flavor.1304.desc.chaste: "寝衣の帯を結び直し、どの動きも落ち着いて見えるようにする。結び目は少しきつすぎた。こうした小さなことに気を配るほど、思いがないふりは難しくなる。\n\n盤はまだ机の上にある。座って一局に夜を費やせばよい。席に着き、駒を取って、また置いた。心はもう別のところにあった。卓の下で手を握るが、見せようとした平静は戻ってこない。\n\n部屋はよく静かだ。口に出さなかった言葉まで、聞こえそうになる。"
 latria_sexual_frustration_flavor.1304.desc: "部屋は静かだが、もう座っていられない。特に用もないまま椅子を立つ。\n\n水を注いで、飲まないまま置く。灯を整えようとして芯を切りすぎ、炎は低くなった。小さな用事を次々に始める。どれも、私を席に戻すほどには心を引きつけない。\n\nやがて部屋の真ん中に立つ。この手をどうすればよいのか、わからない。"
 latria_sexual_frustration_flavor.1304.a: "チェス盤を脇に置き、恋しい相手を思おう。"
 latria_sexual_frustration_flavor.1304.b: "机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1305.t: "日暮れ後の部屋"
 latria_sexual_frustration_flavor.1305.desc.emperor: "廷臣は下がったが、私は礼服のまま部屋に残っている。請願には答え、封の墨も乾き、諸侯の足音も遠ざかった。私事の悩みだけが、ここに残った。\n\n襟の留め具に手をかけたところで止める。寝台は乱すのが惜しいほど整っている。鏡の前にしばらく立ち、謁見の装いのまま、報告には出さなかった疲れを眺める。今夜、答えるべき請願はもうない。\n\n外で、冠を外すかと尋ねる声がした。入る前に待つよう告げる。"
 latria_sexual_frustration_flavor.1305.desc.adventurer: "仲間は宿に下がったが、私は部屋に独り残っている。荷はまとめ、明日の道筋は扉の裏の板に書いた。しまう物はもうないのに、片づけた部屋で落ち着けない。\n\n寝台の端に、靴を履いたまま腰かける。階下で酔った旅人が歌い始め、連れがそれを押しとどめた。笑い声が床を通して届く。今夜その輪に加わる自分は思い描けない。\n\n地図を巻き、また広げる。道は変わっていない。"
 latria_sexual_frustration_flavor.1305.desc.clergy: "祭服のまま、小部屋に独り残る。寝台脇の蝋燭は短くなった。昼に唱えた誓いは一言も違えず覚えているが、今夜は慰めにならない。\n\n腕から数珠を外し、指で繰る。やがて祈りの言葉はついてこなくなった。渡り廊下の屋根の下に立っていた人と、先に目を逸らしたのが私だったことを思い出す。その慎重な仕草のあとにも、思いは残った。\n\n祭服の襟が首に擦れる。着たままにする。"
 latria_sexual_frustration_flavor.1305.desc.ruler: "礼服のまま、誰もいない部屋に戻る。外で衛兵が礼をし、甲冑の音がして、扉に錠が下りた。中には、この重荷を分かち合える者がいない。\n\n冠はまだ被ったままだ。外して枕の脇に置き、鏡を見る。映っている者は明日も問題なく廷を開けそうに見える。その前にどれほど眠れないか、知っているのは私だけだ。\n\n寝台の脇に腰かける。手袋の片方を外し忘れていた。"
 latria_sexual_frustration_flavor.1305.desc: "部屋には誰もいないのに、横になるのを先延ばしにしている。片づけるべき務めが残っているわけではない。\n\n灯はまだ点いたままで、靴も履いたままで、上着もきちんと掛けてある。今からでも出て、誰かを迎えられるという印を、私は眺めている。待っている者はいない。整えた寝台へ向きたくないだけだ。\n\n窓から隙間風が入る。灯の炎が傾き、やがて元に戻るのを見ている。"
 latria_sexual_frustration_flavor.1305.a: "夜は遅いが、信頼する知人を呼んでじっくり話そう。"
 latria_sexual_frustration_flavor.1305.b: "思いを抑え、礼服を脱いで休もう。"

 latria_sexual_frustration_flavor.1306.t: "真夜中の使者"
 latria_sexual_frustration_flavor.1306.desc.female: "寝衣で寝台の脇に座っていると、扉が静かに二度叩かれた。合図ではなく、侍女が物を運ぶときの叩き方だ。侍女は入ってきて白紙を置き、寝台のほうを見ないまま下がった。\n\n言葉の詰まった手紙よりも、この白い紙のほうが目に障る。誰の便りを待っているのか、今夜は来ないことも、私は知っている。紙を灯のそばへ運ぶ。光は紙の繊維を浮かび上がらせ、私はそこに一行の書き出しを探している。\n\n指は長いこと紙の上にあった。離すと、小さな湿った跡が残った。"
 latria_sexual_frustration_flavor.1306.desc.male: "寝衣のまま扉を開けると、廊下にはもう誰もいない。敷居のそばに署名のない書きつけが落ちている。今しがた置かれたのか、昼のうちに落ちたのか。拾い上げても、眠気は戻らない。\n\n待っていた言葉はなかった。明日の約束と、支払いの期限が書いてある。それでも一行ずつ読み、裏返す。裏は白いままだ。その余白を見つめ、自分なら何を書くだろうと思う。\n\n廊下の灯が消えた。私はまだ扉のそばにいて、扉を閉めきっていない。"
 latria_sexual_frustration_flavor.1306.desc: "扉の外の足音が遠ざかるのを聞いている。机の紙は、まだ何も語っていない。\n\n筆を三度取った。一度目は一言書いて線を引いた。二度目は墨を一滴落としただけだ。三度目は筆を置き、その滴が乾いていくのを見ていた。\n\n夜は半ばを過ぎた。白い紙は、ほとんど変わっていない。"
 latria_sexual_frustration_flavor.1306.a: "ずっとためらっていた言葉を書こう。"
 latria_sexual_frustration_flavor.1306.b: "紙をしまい、思いを抑えて横になろう。"

 latria_sexual_frustration_flavor.1307.t: "宴席の沈黙"
 latria_sexual_frustration_flavor.1307.desc.accepted: "詩人が昔の恋を詠み、皆は嬉しそうに聞いている。卓を指で打つ者も、まだ詠まれていない一節の終わりを先に口にする者もいる。杯は手の中で巡り、誰も声を落とさない。\n\n私も杯を上げ、誰も口にしていない話を思い出していた。詩にすれば、この話はきっと面白くない。聞き手も、拍手もなかった。閉ざされた扉と、そのあと夜明けまで独りで座っていたことを覚えている。詩人が二人の抱擁に至ると、杯から酒が一滴こぼれた。\n\n誰もその滴に気づかない。私はまだそれを見ている。"
 latria_sexual_frustration_flavor.1307.desc.strict: "秘めた恋で寵を失った貴族の話になり、笑い声がぷつりと切れた。私は窓のほうへ顔を向けた。表情を見られたくない。\n\n外に見るものはほとんどなく、通り過ぎる夜回りの灯だけがある。私はそれを見ている。背後で、自業自得だという囁きが聞こえた。私に関わる話ではないのに、これまで隠してきたことを思わずには聞けない。\n\n杯を握り直す。指の関節が白くなっていた。"
 latria_sexual_frustration_flavor.1307.desc: "杯が卓を巡るのを眺めている。話は、誰も持ち出さなければよかった題から離れない。つい先ほどまで、麦の収穫の話をしていた。\n\nそこへ誰かが私事の恋を口にした。畑の話に戻る道は、もう見つからない。私は黙ってその間をやり過ごす。楽の音よりも、自分の心臓の音のほうがよく聞こえる。\n\n誰かが咳をし、明らかに沈黙を破ろうとしている。私は待つが、話は始まらない。"
 latria_sexual_frustration_flavor.1307.a: "酒に任せ、私事を次々と語ろう。"
 latria_sexual_frustration_flavor.1307.b: "口をつぐみ、皆に一礼して帰ろう。"

 latria_sexual_frustration_flavor.1308.t: "夜通しの祈り"
 latria_sexual_frustration_flavor.1308.desc.favors: "夜警を告げる鐘が鳴り、私はまだ聖所で祈っている。信仰は肉体の快楽を咎めない。そう書かれた箇所を、私は誰にでも示せる。それでも、私をここに留めている思いについては、その言葉は何も助けてくれなかった。\n\n長椅子は空だ。蝋燭の光が背もたれに私の影を落とし、そのわずかな揺れが祈りから気を逸らす。昼のうちに、言いかけてやめた誘いを思い出す。最後のところで、私は別のことを言った。口にしなかった言葉を、それからずっと考えている。\n\n鐘の音が遠ざかる。私はまだ膝をついたままで、問いは口に出ていない。"
 latria_sexual_frustration_flavor.1308.desc.condemns: "聖所で貞潔の祈りを繰り返す。一度は最後まで唱え、二度目は言葉を飛ばし、三度目は同じ一節で止まった。先へ進む気になれない。\n\n鐘の音は消えていくが、悩みはそれについていかない。冷たい石に両の手を当て、しばしの落ち着きを求める。やがてその部分も温まった。残るのは同じ思いと、終わらない祈りだけだ。\n\n空の長椅子に人はいない。それでも声は低いままにする。"
 latria_sexual_frustration_flavor.1308.desc: "空の長椅子に燭光が落ちる。夜通しの祈りは終わっているはずだが、私は膝をついたままだ。\n\n立ち上がるのが惜しい。ここにいる間は、この姿勢を保つという見慣れた務めを自分に与えていられる。出てしまえば、先延ばしにしてきた思いと向き合わなければならない。別の祈りの言葉も見つからないまま、私は居続ける。\n\n最後の蝋燭が揺れた。黒い煙が一本、梁の下へ昇って消えるのを見ている。"
 latria_sexual_frustration_flavor.1308.a: "禁欲の祈りを脇に置き、心のままに外へ出よう。"
 latria_sexual_frustration_flavor.1308.b: "欲望を抑え、徹夜の祈りを終えよう。"

 latria_sexual_frustration_flavor.1309.t: "鏡の中の姿"
 latria_sexual_frustration_flavor.1309.desc.lustful: "部屋の青銅の鏡の前に独り立つ。衣は脇に置いた。いつもなら何かで隠そうとするところ、今日は自分の目をそのまま見返した。灯は鏡の脇にあり、よく知った表情から気を逸らすものは何もない。\n\nこの思いを一時の弱さと呼ぶのは、もうやめにしたい。夕方から、夕食の間も、最後の客が帰るまで、ずっと付きまとっている。今は相手をする客も、思いを紛らす話もない。鏡の前に立ち、自分が何を望んでいるのかを、そのまま考えている。\n\n外に足音はない。ここには、偽る相手もいない。"
 latria_sexual_frustration_flavor.1309.desc.chaste: "寝台の端に衣を脱いだまま座り、声を落として誓いを繰り返す。一言でも抜かせばすぐ気づくほど、私はこの誓いを覚えている。どれほど丁寧に唱えても、思いは去らない。もう、自分とは違う誰かのものだとも言えない。\n\n鏡のほうを見て、目を逸らす。振り返ると、そこにはまだ私がいる。両の手を強く組み、たった今口にした約束にすがろうとする。馴染んだ言葉が、以前ほどすらすら出てこない。\n\nまた誓いの途中で止まった。今度は、すぐ次の一節を始めなかった。"
 latria_sexual_frustration_flavor.1309.desc: "部屋には私一人しかいない。物言わぬ鏡の前では、自分の思いから目を逸らすのが難しい。\n\n衣は椅子の上にあり、ここから数歩のところにある。なぜまだ着ないのかと自分に問うまで、私はそこに立ち尽くしている。気を紛らすものも、訪れて迷いを断ってくれる人もいない。灯は変わらず燃え、私は何度も目を逸らす。\n\n寝台の端に座る。敷き布は最初は冷たく、やがてその小さな刺激さえ消えた。"
 latria_sexual_frustration_flavor.1309.a: "自分の思いを認め、それに浸ろう。"
 latria_sexual_frustration_flavor.1309.b: "衣を着て机に戻り、思いを抑えよう。"

 latria_sexual_frustration_flavor.1310.t: "自室で眠れず"
 latria_sexual_frustration_flavor.1310.desc.clergy: "夜の祈りを終え、小部屋に戻る。祭服は着たままで、寝台脇の蝋燭は短い。それでも横になる気になれない。一日の勤めが終われば、ここまでついてきた思いと私の間に置けるものがなくなる。\n\n枕の脇に数珠が置いてある。見るたびに誓いを思い出す。祭服の紐を半分ほど緩め、また結び直す。襟は相変わらず首に擦れ、眠りを遠ざける。\n\n部屋にはほかに誰もいない。それでも、決めるのは楽にならない。"
 latria_sexual_frustration_flavor.1310.desc.adventurer: "仲間は宿に下がった。部屋に独り、道具を片づけ終える。明日の道ははっきりしている。渡し場、しばらくの街道、また渡し場。繰り返し戻ってくる思いについては、何の確かさもない。\n\n靴を脱ぐが、横にならない。外で馬がゆっくり飼い葉を嚼む。その規則正しい音は、眠りの助けになるはずだった。代わりに、今日の渡し場での一瞥を思い出す。すぐに忘れられる短さだったのに、それからずっと考えている。\n\n油の灯が揺れる。油を足さずに、点けたままにする。"
 latria_sexual_frustration_flavor.1310.desc: "夜は更け、扉は閉ざされているのに眠れない。外で何かが妨げているわけではない。\n\n寝台も枕も悪くない。私は寝台の脇に座り、昼のうちに近づけなかった人のことを、もう一度考える。ふと、寝衣の帯が緩んでいることに気づく。いつ解いたのか覚えていない。言えなかったことばかり考えていた。\n\n緩んだ帯を見下ろす。今夜は眠るのかどうか、まだ決めていない。"
 latria_sexual_frustration_flavor.1310.a: "旧知の相手に手紙を書き、悩みを率直に伝えよう。"
 latria_sexual_frustration_flavor.1310.b: "思いを抑え、蝋燭を消して横になろう。"

 latria_sexual_frustration_flavor.1301.c: "新しい紙を取り、招待の言葉を詩にしよう。"
 latria_sexual_frustration_flavor.1302.c: "一族と所領の話に戻そう。"
 latria_sexual_frustration_flavor.1302.d: "旅の話をして、また皆で杯を上げよう。"
 latria_sexual_frustration_flavor.1303.c: "夜明けまで残り、一節ずつ聖典を学ぼう。"
 latria_sexual_frustration_flavor.1304.c: "駒を並べ、チェスの問題を考えよう。"
 latria_sexual_frustration_flavor.1304.d: "初手から始め、ゆっくり一局指そう。"
 latria_sexual_frustration_flavor.1305.c: "朝の仕事を整理してから蝋燭を消そう。"
 latria_sexual_frustration_flavor.1307.c: "新しい詩を詠み、皆の気をほかへ向けよう。"
 latria_sexual_frustration_flavor.1308.c: "祈祷書を閉じ、静かに思いを整理しよう。"
 latria_sexual_frustration_flavor.1308.d: "朝の祈りまで起きて、皆の本を用意しよう。"
 latria_sexual_frustration_flavor.1309.c: "悩みを書き出し、一行ずつ考えよう。"
 latria_sexual_frustration_flavor.1310.c: "茶を淹れ、身の回りの品と本をゆっくり片づけよう。"
