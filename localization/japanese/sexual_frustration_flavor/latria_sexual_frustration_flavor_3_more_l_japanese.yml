l_japanese:
 latria_sexual_frustration_flavor.1211.t: "消し忘れた灯"
 latria_sexual_frustration_flavor.1211.desc: "家が静まり、灯の音まで聞こえる。誰も呼んでいない。それでも杯を二つ出し、二つ目は空のまま置いてある。昼に置いたままのパンは、布の下にある。\n\n私が保っているのは、戸口で私の肩に沿えられた肩の重み、どちらも一息の間動かなかった、その様子だ。皮膚がそれを覚えている。この時刻になると、寝衣の下、膝の裏、そしてもっと下で戻ってくる。静めようと腹に平らに置いた手は、静まらない。\n\n芯が傾く。私は空の杯を、柄が椅子を向くように回す。"
 latria_sexual_frustration_flavor.1211.a: "灯を消し、自分の手で終えよう。"
 latria_sexual_frustration_flavor.1211.b: "芯を整え、冷めた茶を飲んで眠ろう。"
 latria_sexual_frustration_flavor.1211.c: "言葉が回らなくなるまで読もう。"

 latria_sexual_frustration_flavor.1212.t: "評議会は待つ"
 latria_sexual_frustration_flavor.1212.desc: "請願が読み上げられ、そのどれも耳に入らない。執事が手を背に組んで卓の端に立ち、私は二頁目からその喉の線を目で追っている。雨は止み、部屋は暑すぎる。背後で火が爆ぜて、落ち着く。\n\n身を乗り出して蝋燭を動かす拍子に、袖が私の手首を掠める。どちらも何も言わない。部屋は熱い蝋と濡れた毛織りの匂いがする。会を閉じることはできる。その言葉はもう口の中にある。私はそれをそこに留め、相手は印章に目を据えて待っている。\n\n書記が、決めたかと尋ねる。私は何も決めていない。"
 latria_sexual_frustration_flavor.1212.a: "会を閉じ、口実の用でその人を引き留めよう。"
 latria_sexual_frustration_flavor.1212.b: "請願に裁可を下し、目を頁に留めよう。"
 latria_sexual_frustration_flavor.1212.c: "書類を地図卓へ運び、夜通し片づけよう。"

 latria_sexual_frustration_flavor.1213.t: "闇の用途"
 latria_sexual_frustration_flavor.1213.desc: "扉には閂がある。私は着物を着ておらず、敷布は蹴り落としたまま床にある。部屋は蝋燭と自分の皮膚の匂いがする。\n\n身体は一日中騒がしく、今はもっと騒がしい。膝を開き、手を腹の上から下へやったまま、ほかの何かのふりはしない。来るのは鎖骨に当てられた口、押さえつけられた手首、それが嫌でなかったこと。腰が寝台から浮き、闇の中で息がばらばらに散るまで、その後を追う。\n\nあとには、部屋は同じ部屋だ。腕を目の上に置いて横たわる。蝋燭は水たまりに燃え尽き、私は眠っていない。"
 latria_sexual_frustration_flavor.1213.a: "手に終えさせ、そのあと眠ろう。"
 latria_sexual_frustration_flavor.1213.b: "敷布を拾い、夜明けまで静かに横たわろう。"
 latria_sexual_frustration_flavor.1213.c: "着替え、下へ降り、空が灰色になるまで城壁を歩こう。"
 latria_sexual_frustration_flavor.1213.d: "蝋燭が消えるまで、何度も自分を明け渡そう。"

 latria_sexual_frustration_flavor.1214.t: "賛課の前の時"
 latria_sexual_frustration_flavor.1214.desc: "整えるべき灯を預かり、私は教会に独りだ。冷たさが石畳を上ってくる。聖人像は私を越えて扉を見ている。法衣の下で、身体は温かく目覚めていて、時刻などまるで気にしていない。\n\nこのための言葉は知っている。扉のそばの木の箱で、他人の罪に使う声で、人々の上で唱えてきた。自分の上に唱えても、何にもならない。渇望は呑み込んだ炭のように、肋骨の裏に座っている。掌を祭壇石に平らに押しつけ、痛むまで押す。\n\n鐘が間もなく鳴る。手はまだ石にあり、石はもう冷たくない。"
 latria_sexual_frustration_flavor.1214.a: "渇望を自分の手に委ね、あとで赦しを乞おう。"
 latria_sexual_frustration_flavor.1214.b: "課を跪いて終え、時刻に擦り切らせよう。"
 latria_sexual_frustration_flavor.1214.c: "書を開き、言葉が保つまで詩篇を読もう。"

 latria_sexual_frustration_flavor.1215.t: "卓の下の膝"
 latria_sexual_frustration_flavor.1215.desc: "広間は賑やかだ。誰かの犬が卓の下にいて、酒は二度回った。隣の客は鹿肉の皿からこの方、膝を私の膝から動かさず、触れ合う場所の腰掛けは温かくなっている。敷き藁は踏まれた酒の匂いがする。\n\n卓が笑いで揺れるたび、圧が移り、また戻る。国境をめぐる論争は追うのをやめた。手を、相手の手の隣の腰掛けに置いて、そのままにする。相手は手を見て、それから遠い壁を見て、膝は留まる。私の膝は痺れて、動かしていない。\n\n杯が倒れる。酒が縁まで走り、敷き藁に滴る。誰も動かない。"
 latria_sexual_frustration_flavor.1215.a: "ここで、はっきり言おう。広間に聞かせよう。"
 latria_sexual_frustration_flavor.1215.b: "卓の礼を述べ、立って外の空気に当たろう。"
 latria_sexual_frustration_flavor.1215.c: "相手に向き直り、火が弱くなるまでほかの話をしよう。"

 latria_sexual_frustration_flavor.1216.t: "庭の袖"
 latria_sexual_frustration_flavor.1216.desc: "芍薬は盛りを過ぎ、庭師は働くふりをやめている。私たちは池の周りを遠回りに歩く。近道は門で終わるからだ。午後の光は薄い茶の色になっている。\n\n相手の袖が、私の手の甲を繰り返し探し当てる。私の家なら、その程度の触れ合いはもう決まった話で、茶が冷める前に仲人が呼ばれる。ここではただの袖で、読まねばならないのは私のほうだ。私は歩を緩める。相手も緩める。水面が二人の姿を映し、どちらも先に動かない。\n\n門のところで相手は止まり、一度振り返る。私の靴の下に花びらがある。"
 latria_sexual_frustration_flavor.1216.a: "はっきり尋ね、家に対しては私が答えよう。"
 latria_sexual_frustration_flavor.1216.b: "辞儀をし、手を袖に収めて、中へ入ろう。"
 latria_sexual_frustration_flavor.1216.c: "灯がともるまで、独りで池をもう一周しよう。"

 latria_sexual_frustration_flavor.1217.t: "長い帰り道"
 latria_sexual_frustration_flavor.1217.desc: "夜明け前から鞍にあり、最後の三マイル、私は先を行く乗り手のことを意識し続けている。その座り方。渡しで振り返った、あの仕方。腿は擦れ、口は乾いているが、見てしまう理由はそれではない。\n\n鹿は去り、追い立て役は散った。遅れても誰も咎めない。手綱を持つ手は冷たく、ほかのどこも冷たくない。馬に踵を入れ、距離を無くす。森は水の音で満ちている。\n\n相手は音に振り向き、待つ。森は濡れた葉で満ち、馬は鼻を鳴らしている。"
 latria_sexual_frustration_flavor.1217.a: "木立へ連れ込み、帰りを遅らせよう。"
 latria_sexual_frustration_flavor.1217.b: "小屋まで馬を走らせ、この思いを冷水に浸そう。"
 latria_sexual_frustration_flavor.1217.c: "下馬し、手が震え止むまで足跡を読もう。"

 latria_sexual_frustration_flavor.1218.t: "借り物の本がある部屋"
 latria_sexual_frustration_flavor.1218.desc: "物置を貸して寝かせてくれる学者が、灯と、私にはよく読めない本を一冊残していった。鎧戸に雨、濡れた茅の匂い。身体は前の町から落ち着かず、狭い寝台がそれを悪くする。隙間風が当たると灯が煙る。\n\n芯を見に来て、相手は指を棚に置いて立つ。その指から墨の匂いがする。留まって、この頁を解いてくれと頼む。相手はそうする。指で示しながら、肩が私の肩に預けられ、どちらも動かさず、私はもう文法を聞いていない。\n\n雨が弱まる。相手の指はまだ同じ行にある。"
 latria_sexual_frustration_flavor.1218.a: "渇望の行き場ができるまで、下手な歌を歌おう。"
 latria_sexual_frustration_flavor.1218.b: "礼を述べ、灯を消し、扉に背を向けて横たわろう。"
 latria_sexual_frustration_flavor.1218.c: "教えを続けさせ、手を頁に置いておこう。"
 latria_sexual_frustration_flavor.1218.d: "手が欲を忘れるほど、この一節を三度写そう。"

 latria_sexual_frustration_flavor.1219.t: "広間の裏の部屋"
 latria_sexual_frustration_flavor.1219.desc: "宴は中庭へ流れ、私たち二人は、予備の腰掛けを置いた広間の裏の小部屋に行き着いた。相手は扉に背を向け、手を私の胸に平らに当て、私を笑いながら待っている。\n\n帯の留め金を外し、それから紐を解くと、相手はまた笑って手を貸す。口が私の喉にあり、腿が私の腿の間に入り、私はもうふりをしない。腰掛けの上で時間をかけ、相手の髪が解け、私の息が乱れ、相手が震えて、私もそれに続くまで。\n\nあとになっても、相手はまだ私の手首を握っている。広間では音楽がまた始まっている。"
 latria_sexual_frustration_flavor.1219.a: "本当のことを言い、その手を握っていよう。"
 latria_sexual_frustration_flavor.1219.b: "着物を整え、礼を述べて広間へ戻ろう。"
 latria_sexual_frustration_flavor.1219.c: "音楽が止むまで、腰掛けで共に座ろう。"

 latria_sexual_frustration_flavor.1220.t: "守った徹夜の祈り"
 latria_sexual_frustration_flavor.1220.desc: "徹夜の祈りを守ると皆に言い、ほかの者たちは私に教会を、蝋燭一本と先週の香の匂いを残していった。真夜中が来て、過ぎた。膝が痛み、身体は静かにならない。石畳は足の熱を奪っている。\n\n目を閉じるたび、腰のくぼみに手がある。二冬前の舞踏の手だ。また目を開けねばならない。蝋燭が私の影を壁に投げる。一瞬で終わらせることができ、誰も知らずに済む。それがこの始末の悪いところだ。\n\n扉から隙間風が入る。影が壁で動く。"
 latria_sexual_frustration_flavor.1220.a: "ここで自分の手に委ね、聖人に対して正直でいよう。"
 latria_sexual_frustration_flavor.1220.b: "窓が灰色になるまで跪いていよう。"
 latria_sexual_frustration_flavor.1220.c: "声が部屋の唯一のものになるまで、課を声に出して読もう。"

 latria_sexual_frustration_flavor.1221.t: "使節の手袋"
 latria_sexual_frustration_flavor.1221.desc: "使節は三日私の広間に滞在し、私はその三日を数えた。条約の頁をめくるために、指一本ずつ手袋を外す。そのせいで川の条項を二度見失った。火は燃え尽き、薪を取りにやる者もいない。\n\n参議たちは、私が聞いていないのを見ている。町には、誰も名を問わぬ場所がある。その思いが二番目の朝から胸に座っている。重く、温かく、ひどく威厳がない。あの扉を訪ねてから一年になる。\n\n相手が印を見よと手袋を差し出す。受け取る。まだ温かい。"
 latria_sexual_frustration_flavor.1221.a: "署名し、下がらせて、今夜町へ降りよう。"
 latria_sexual_frustration_flavor.1221.b: "条項を読み直し、手を卓に留めよう。"
 latria_sexual_frustration_flavor.1221.c: "蝋燭が揺れるまで、条件を一つずつ片づけよう。"
 latria_sexual_frustration_flavor.1221.d: "町でどの扉が静かなのか、確かめよう。"

 latria_sexual_frustration_flavor.1222.t: "長く握られた手"
 latria_sexual_frustration_flavor.1222.desc: "舞踏は遅い拍子に移り、私は一晩中、手から手へ渡されてきた。最後の相手は、音楽が止んでも手を離さない。広間は蝋燭と他人の酒の匂いで熱い。敷き藁は踏み平らされ、蝋燭は揺らぐ。\n\n親指が私の指の骨にある。広間は見ていて、見ぬふりをしている。耳が熱い。手を引かない。楽師の近くで誰かが笑う。相手の握りが一度、意図して強まり、私が顔を整える前に、身体全体が答える。相手の手の中で、私の手は定まらない。背後で音楽がまた始まる。\n\n相手は手を離す。指の跡が私の手に残る。"
 latria_sexual_frustration_flavor.1222.a: "広間の皆に聞こえる場所で、望みを言おう。"
 latria_sexual_frustration_flavor.1222.b: "舞踏の礼を述べ、人混みへ退こう。"
 latria_sexual_frustration_flavor.1222.c: "扉まで共に歩き、馬の話をしようと誘おう。"

 latria_sexual_frustration_flavor.1223.t: "渡し"
 latria_sexual_frustration_flavor.1223.desc: "馬に水を飲ませるため渡しで止まり、日が暑いので一行の半分は水に入る。私が平らな岩の上でシャツを脱ぎ、絞っていると、鞍に残ったまま見ている一人に気づく。石の間を水が音を立てて流れる。馬は飲み、足を動かす。\n\n目が合うと、相手は逸らさない。水が肋骨を伝い、手首から落ちる。午後は長く、森は広く、そこでできることは山ほどあり、身体はもう決めていて、馬のことを考えるのを難しくしている。\n\n相手が下馬する。手綱はまだその手にある。"
 latria_sexual_frustration_flavor.1223.a: "シャツを落とし、見る者あらば見よとばかりに相手の前へ行こう。"
 latria_sexual_frustration_flavor.1223.b: "シャツを着て、先に小屋へ馬を走らせよう。"
 latria_sexual_frustration_flavor.1223.c: "隼を出して、一行の支度ができるまで手を働かせよう。"

 latria_sexual_frustration_flavor.1224.t: "二人の乗り手と草"
 latria_sexual_frustration_flavor.1224.desc: "草は馬を隠すほど高く、空は雨の前の顔をしている。群れが向きを変えてから、私たちは並んで馬を進め、最後の一ハロン、相手の脚が私の脚に沿い、どちらも直さない。風は踏み潰された茎の匂いがする。馬は膝まで濡れている。\n\nここには隠れる壁もなく、一日走っても司祭はいない。それで渇望が単純になったためしはない。ただ大きくなった。土地が広いように。そして私は、これがどこへ向かうか知らないふりをやめた。\n\n相手は丘の頂で馬を止め、肩越しに私を見る。最初の雨粒が落ちてくる。"
 latria_sexual_frustration_flavor.1224.a: "手を取って、高い草の中へ連れ下りよう。"
 latria_sexual_frustration_flavor.1224.b: "うなずいて馬を返し、荷車まで競争しよう。"
 latria_sexual_frustration_flavor.1224.c: "遠い標的に的を置き、腕が震えるまで射よう。"

 latria_sexual_frustration_flavor.1225.t: "箱で言ったこと"
 latria_sexual_frustration_flavor.1225.desc: "木の箱の中で跪き、それを声に出して言った。言わぬより悪かった。格子を隔てた司祭は息を呑みも、叱りもしない。私の家について問い、待った。私は自分の声が答えるのを聞いた。教会は冷たい石の匂いがする。\n\n教会を戻りながら、顔がまだ熱い。羞恥ではない。それだけでもない。口に出したことで、昼の光の中、祭壇の前で、そのすべてをまた感じ取れる。身体には礼儀というものがない。襟がきつい。\n\n相手はまだ箱の中にいる。通り過ぎると帳が動く。"
 latria_sexual_frustration_flavor.1225.a: "箱へ戻り、残りを聞いてもらおう。"
 latria_sexual_frustration_flavor.1225.b: "欄干の前に跪き、課される贖罪と言葉を受けよう。"
 latria_sexual_frustration_flavor.1225.c: "側廊に座り、心が静まるまで相手の教えを聞こう。"

 latria_sexual_frustration_flavor.1226.t: "第四の時に目覚めて"
 latria_sexual_frustration_flavor.1226.desc: "心臓を鳴らし、腿を湿らせて、敷布を寝台の裾へ蹴り落としたまま、夢から出る。夢では厩の中庭で、首に手が置かれていた。それが誰の手かは分かっている。部屋は冷たく、枕は口があった場所で濡れている。\n\n部屋は灰色だ。誰もいない。身体は灰色も時刻も気にしない。夢の続きを欲しがり、その方法についても極めて明確だ。腕を目の上に置き、膝を立てたまま横たわる。床は痛むほど冷たい。\n\n軒の鳥が鳴きはじめる。手はもう動いている。"
 latria_sexual_frustration_flavor.1226.a: "終えて、家人には眠っていると思わせよう。"
 latria_sexual_frustration_flavor.1226.b: "起きて着替え、厩で痛むまで働こう。"
 latria_sexual_frustration_flavor.1226.c: "光が十分に差すまで、卓の手紙を読もう。"

 latria_sexual_frustration_flavor.1227.t: "賭け"
 latria_sexual_frustration_flavor.1227.desc: "誰かが、卓の皆の前で、私が望む相手の名を言えはしないと馬を賭けた。酒は良く、火は熱く、賭けは愚かで、皆が待っている。犬は腰掛けの下で聞くために止まった。賭けは司教の使いの前でなされた。\n\n名が石のように口にある。卓の向こうで、その相手はパン皿を見ていて、私を見ない。うなじが濡れている。言えば、日曜までにはどの広間にも知れ渡る。誰かが薪を足した。\n\n執事がまた杯を満たす。卓は静かになった。"
 latria_sexual_frustration_flavor.1227.a: "名を言い、広間の好きに取らせよう。"
 latria_sexual_frustration_flavor.1227.b: "笑って罰を払い、酒を所望しよう。"
 latria_sexual_frustration_flavor.1227.c: "盤を出して、賭けた男に勝とう。"
 latria_sexual_frustration_flavor.1227.d: "名を含み、しかも名を含まぬ詩にしよう。"

 latria_sexual_frustration_flavor.1228.t: "条件"
 latria_sexual_frustration_flavor.1228.desc: "木の下で、人が財産について使う声で、婚姻が論じられている。当の相手は壁のそばに立ち、手を組んで、書記が値打ちを読み上げるのを聞いている。二人の間のラベンダーを蜂が働き、誰も追い払わない。書記の声は数字の上で平板になる。\n\n私は持参金の件を片づけるよう頼まれている。同じ一行を四度読んだ。私が望むものは、まともではなく、紙にも載っていない。午後ずっと、緑の外套を着て壁のそばに立っている。緑の外套の袖口は破れている。\n\n書記は筆を上げて待つ。一枚の葉が卓に落ちてくる。"
 latria_sexual_frustration_flavor.1228.a: "条件を素早く定め、書記と家族を下がらせよう。"
 latria_sexual_frustration_flavor.1228.b: "一行ずつ二度読み、何も漏らすまい。"
 latria_sexual_frustration_flavor.1228.c: "書類を内へ運び、頭を澄ませて決めよう。"
 latria_sexual_frustration_flavor.1228.d: "領地の勘定を整え、数字に支えさせよう。"

 latria_sexual_frustration_flavor.1229.t: "書記の手"
 latria_sexual_frustration_flavor.1229.desc: "写筆は遅く、写場は冷たく、同じ語を三度誤った。心は頁にない。昼にパンを運んできたあの人の口にある。二つの机を隔てて、鼻の詰まった息が聞こえる。パンは来たときまだ温かかった。\n\n私は誓いを立て、それを守ってきた。守ることが、祈りでは抜けきらぬ形で、自分の身体を意識させている。羊皮紙の上で手が震える。短い祈りほどの長さで終わる方法があり、私はそれを欲している。\n\n墨は間違った文字の上で乾いていく。"
 latria_sexual_frustration_flavor.1229.a: "ひと午後に限って誓いを置き、理由を正直に認めよう。"
 latria_sexual_frustration_flavor.1229.b: "誓いを守り、渇望が燃え尽きるに任せよう。"
 latria_sexual_frustration_flavor.1229.c: "一節に戻り、手が定まるまで写そう。"

 latria_sexual_frustration_flavor.1230.t: "庭の夕暮れ"
 latria_sexual_frustration_flavor.1230.desc: "部屋のほうが堪えがたかったので、寝衣のまま外へ出た。庭は青く、蛾がラベンダーに集まっている。使用人の棟で誰かが、下手な弦楽器を、同じ四つの音を繰り返し奏でている。草は草履を通して濡れ、裾は重い。\n\n今宵、門のところで腰に置かれた手の感触がまだ残っている。軽く、礼の一巡ほどの長さ。消えていない。一晩中、むしろ大きくなっていった。音楽は役に立たず、自分の皮膚が小さすぎるように感じる。門からこの方、動いていない。亜麻を通して腰掛けが冷たい。\n\n石の腰掛けに座る。蛾はラベンダーにかじりついている。"
 latria_sexual_frustration_flavor.1230.a: "内へ戻り、音楽に覆わせよう。"
 latria_sexual_frustration_flavor.1230.b: "冷たさが寝衣を貫くまで、腰掛けにいよう。"
 latria_sexual_frustration_flavor.1230.c: "息をし、四つの音を数え、庭だけで足りよう。"

 latria_sexual_frustration_flavor.1231.t: "鐘の前に目覚めて"
 latria_sexual_frustration_flavor.1231.desc: "鐘の前に、敷布を床へ蹴り落とし、腰のくぼみに沿って皮膚を湿らせて目覚める。寝衣は腿に巻きついている。夢を見ていて、その夢がまだ私に載っている。低く落ち着いて、上がらない温もりだ。\n\n一週間、考えぬようにしてきた同じ顔だった。夢に用心はなかった。腰に置かれた手、形の分かる口、そして私の身体は、何を決める前から答えていた。今は目覚めていて、それでも止まらない。\n\n膝を立て、掌を腹に平らに当てて横たわるが、温もりはその下に集まるばかりだ。鐘はまだ鳴らない。息は速く浅く、緩めようと動かぬまま。"
 latria_sexual_frustration_flavor.1231.a: "灯を消し、自分の手で終えよう。"
 latria_sexual_frustration_flavor.1231.b: "寝衣を整え、寝返りを打って、鐘まで静かに横たわろう。"
 latria_sexual_frustration_flavor.1231.c: "温もりの握りが緩むまで読もう。"

 latria_sexual_frustration_flavor.1232.t: "離れて走る"
 latria_sexual_frustration_flavor.1232.desc: "夜明け前から鞍にあり、私は先を行く乗り手から目を離さない。その座り方。渡しで振り返り、私が並べるように歩を緩めた、あの仕方。腿は擦れて血が滲み、口は乾いているが、見てしまう理由はそれではない。\n\n鹿は去り、追い立て役は濡れた森へ散った。遅れても誰も言わない。距離が無くなるまで馬に踵を入れ、膝が相手の膝を探し当て、革が軋む。どちらも手綱を引いて離れない。\n\n相手は音に振り向き、待つ。森は滴る水で騒がしい。手綱を持つ手は冷たく、ほかのどこも冷たくない。馬は私の下で鼻を鳴らして立っている。"
 latria_sexual_frustration_flavor.1232.a: "残りの距離を消し、森に預けよう。"
 latria_sexual_frustration_flavor.1232.b: "手綱を引き、独りで進んで、自分を御そう。"
 latria_sexual_frustration_flavor.1232.c: "下馬し、頭が澄むまで濡れた道を歩こう。"

 latria_sexual_frustration_flavor.1233.t: "聖人の守る時"
 latria_sexual_frustration_flavor.1233.desc: "整えるべき灯を預かり、教会に独りだ。石畳から冷たさが上ってくるが、法衣の下で身体は温かく目覚め、課に興味がない。聖人像は私を越えて、閉じた扉を見ている。\n\nこれを冷ます言葉は知っている。扉のそばの箱の暗がりで、他人の罪に使う声で、人々の上で唱えてきた。自分の上では何の役にも立たない。渇望は呑み込んだ炭のように肋骨の裏にあり、命じもしないのに、手は祭壇石に平らに落ち着いている。\n\n掌が痛むまで冷たい縁を押し、鐘が間もなく鳴る。手はまだ石にあり、石は私の熱を奪って、もう冷たくない。"
 latria_sexual_frustration_flavor.1233.a: "渇望を自分の手に委ね、あとで赦しを乞おう。"
 latria_sexual_frustration_flavor.1233.b: "課を跪いて終え、時刻に擦り切らせよう。"
 latria_sexual_frustration_flavor.1233.c: "額を冷たい石に休め、据えてもらおう。"

 latria_sexual_frustration_flavor.1234.t: "長く重なった手"
 latria_sexual_frustration_flavor.1234.desc: "評議会は散り、書斎は静かだ。最後の一時間、私はただ一つのことを意識していた。使節が条約を渡そうと卓越しに身を寄せたとき、その手が私の手を覆い、印に必要な以上に一息長く留まった。部屋は人で満ちていた。私は留めさせた。\n\nその重みに立ち返る。留まる理由もない手のひらの温もり。同じ条項を三度読む間に、蝋燭は燃え尽きかけている。身体は、これが条約より価値あることだと決めていて、その件について私の意見を求めない。\n\n指輪が手の甲に跡を残した。消していない。蝋は溜まり、扉は閉じたままで、私は条項を四度読む。"
 latria_sexual_frustration_flavor.1234.a: "また呼んで、その手が私に何をしたか、はっきり言おう。"
 latria_sexual_frustration_flavor.1234.b: "独りで夜番を守り、祈りに冷まそう。"
 latria_sexual_frustration_flavor.1234.c: "盤を出して独りで指し、像が薄れるまで続けよう。"

 latria_sexual_frustration_flavor.1235.t: "曲が変わるとき"
 latria_sexual_frustration_flavor.1235.desc: "広間は賑やかで、酒は二度回った。楽師が始めると、私は舞踏に引かれるに任せる。相手は、一晩中見ないようにしてきたその人だ。手が背に落ち着き、薄い布越しに指一本一本が分かる。\n\n回り、また回り、部屋は蝋燭の煙と色に霞む。相手は型が求めるより少し近く私を支え、私は直さない。脈が耳で鳴り、太鼓より大きい。渇望がどこからともなく立ち上り、広間の皆の前で私に権利を主張し、私は何も起きていないかのように微笑んでいる。\n\n音楽が終わりへ向かって遅くなる。相手の手は背から動かず、私も退かない。"
 latria_sexual_frustration_flavor.1235.a: "楽師にもう一曲を頼み、もっと近く支えよう。"
 latria_sexual_frustration_flavor.1235.b: "礼を述べ、辞儀をして、型が再び回る前に退こう。"
 latria_sexual_frustration_flavor.1235.c: "相手のそばに留まり、このことでない話をしよう。"
