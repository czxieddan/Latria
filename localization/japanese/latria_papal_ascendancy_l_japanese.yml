l_japanese:
 h_latria_holy_see: "聖座"
 h_latria_holy_see_adj: "カトリック"
 nick_latria_vicar_of_christ: "キリストの代理人"

 latria_papal_ascendancy.0001.t: "すべての王冠に優る玉座"
 latria_papal_ascendancy.0001.desc: "集まった高位聖職者たちの前で、私は自らを追い落とそうとした者たちの折れた旗の上に手を掲げる。神がその代理人を守られたのは、諸侯と取引をさせるためではない。神の命により、聖座は分かつことのできぬ権威を振るい、あらゆる国に救済をもたらすのだ。"
 latria_papal_ascendancy.0001.a: "世界を聖座の前に跪かせよ"

 latria_papal_ascendancy.0002.t: "代理人に託された使命"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName]は聖座に敵対する軍勢を打ち破った。聖職者と敗れた諸侯の前で、[latria_papal_victor.GetSheHe]は神が絶対の権威と世界の救済を[latria_papal_victor.GetHerHim]に託されたと宣言する。"
 latria_papal_ascendancy.0002.a: "新たな秩序が始まる"

 trait_latria_army_of_god: "神の軍勢"
 trait_latria_army_of_god_desc: "この人物は、聖座の絶対的権威に身を捧げた軍勢を率いている。"
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]は、聖座の絶対的権威に身を捧げた軍勢を率いている。"

 latria_papal_redemption_or_ruin: "救済か破滅か"
 latria_papal_redemption_or_ruin_desc: "[recipient.GetShortUINameNoTooltip]に聖座への服従と、[actor.GetShortUINamePossessiveNoTooltip]の[rite|E]への改宗を要求する。拒めば戦争となる。"
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName]は聖座への服従と、[actor.GetHerHis]の[rite|E]への改宗を要求している。"
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "小[old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "小[old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "秘密を明かす"
 latria_reveal_papal_secret_decision_desc: "聖職者と諸侯の前で、自らの秘密を明かそう。すべての統治者に私の口から聞かせ、私の地位を認めぬ者には武器を取らせるがいい。"
 latria_reveal_papal_secret_decision_tooltip: "不義の関係を公に明かし、廃位戦争を迎える。"
 latria_reveal_papal_secret_decision_confirm: "皆の前で明かす"
 latria_can_reveal_papal_secret_trigger: "公にできる不義の関係の秘密がある"
 NOT_ANY_OF_MY_SECRETS: "あなたの秘密のいずれにも該当しない："

 latria_papal_redemption_war: "教皇救済戦争"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "教皇による救済"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective]による[DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]への救済戦争"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective]救済戦争"
 latria_papal_redemption_war_victory_desc: "防衛側は地位を下げられ、教皇の封臣となり、教皇の[rite|E]へ改宗する。"
 latria_papal_redemption_war_white_peace_desc: "服従の要求は撤回される。"
 latria_papal_redemption_war_defeat_desc: "教皇の服従の要求は退けられる。"

 latria_decision_immediate_effect_loc: "#high #bold 秘密を明かした時：#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X $latria_papal_scandal_depose_war$が始まる：#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "あなたの[rite|E]に属する独立した[rulers|E]と、あなたを全面的には支持しない[vassals|E]が、あなたの廃位を目指す連合に加わることがある。"
 latria_decision_paramour_defense_tt: "不義の相手が[ruler|E]であれば、防衛側に加わることがある。"
 latria_decision_allies_call_tt: "あなたの[allies|E]が招集に応じ、防衛側に加わることがある。"
 latria_decision_forced_defenders_tt: "あなたの傀儡である[rulers|E]や、あなたの[rite|E]に属し[piety_level|E]が$piety_level_0$の独立した統治者が、防衛側に加わることがある。"
 latria_decision_disgraced_defenders_tt: "あなたの[rite|E]に属し、[GetTrait('adulterer').GetName(GetNullCharacter)]または[GetTrait('fornicator').GetName(GetNullCharacter)]の[trait|E]を持ち、軍勢を率いる人物が、防衛側に加わることがある。"
 latria_decision_hook_defenders_tt: "[hooks|E]を使い、あなたの[rite|E]の人物を防衛側に加えられることがある。"

 latria_decision_if_win_effect_loc: "\n#high #bold あなたが戦争に勝った場合：#!#!\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "敗北した攻撃側の[rulers|E]は、[title_tier|E]に応じて[gold|E]と[prestige|E]を賠償として支払う。"
 latria_papal_scandal_reparations_first: "敗北した攻撃側の[rulers|E]は、[title_tier|E]に応じてあなたに[gold|E]と[prestige|E]を支払う。"
 latria_papal_scandal_reparations_third: "敗北した攻撃側の[rulers|E]は、[title_tier|E]に応じて[CHARACTER.GetShortUIName]に[gold|E]と[prestige|E]を支払う。"
 latria_papal_scandal_ally_share_tt: "参戦した防衛側の[allies|E]は、[gold|E]と[prestige|E]の賠償総額の[SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%]を分け合う。"
 latria_papal_redemption_unlocked_tt: "$latria_papal_redemption_or_ruin$の[interaction|E]をアンロックする。"

 latria_decision_if_lose_effect_loc: "\n#high #bold あなたが戦争に負けた場合：#!#!"
 latria_decision_defeat_imprison_tt: "連合の盟主があなたを[dungeon|E]に投獄する。"
 latria_decision_if_white_peace_effect_loc: "\n#high #bold 戦争が白紙和平で終わった場合：#!#!"

 latria_papal_scandal_depose_war: "教皇廃位戦争"
 latria_papal_scandal_event_troops: "教皇の援軍"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "教皇の廃位"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "[DEFENDER.GetShortUINameNotMe]廃位戦争"
 latria_papal_scandal_depose_war_victory_desc_defender: "あなたは[head_of_faith|E]の地位を失う。"
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U]は[defender.GetHerHis]の[head_of_faith|E]としての地位を失う。"
 latria_papal_scandal_depose_war_white_peace_desc: "双方は和平を結び、それぞれの[titles|E]を維持する。"
 latria_papal_scandal_depose_war_defeat_desc_defender: "あなたは連合を破り、[head_of_faith|E]の地位を守る。"
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U]は連合を破り、[head_of_faith|E]の地位を守る。"

 latria_papal_ascendancy.0010.t: "聖座防衛の要請"
 latria_papal_ascendancy.0010.desc: "あなたの[ally|E]である[latria_pope.GetShortUIName]は、不義の関係を理由に[latria_pope.GetHerHim]を廃位しようとする連合に直面している。[latria_pope.GetSheHe]は盟約に基づき、連合に対する出兵をあなたに求めている。"
 latria_papal_ascendancy.0010.a: "聖なる盟約を守り、出陣する"
 latria_papal_ascendancy.0010.b: "このような醜聞のためには戦えない"
 latria_honored_papal_alliance_opinion: "聖座を守った"
 latria_refused_papal_alliance_opinion: "教皇との盟約を破った"
 latria_ally_share_received_msg_title: "聖座からの感謝"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName]は、敗れた統治者たちからの賠償の一部をあなたに送った。"
 latria_ally_joined_defense_msg_title: "同盟者が防衛に参加"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName]は盟約を守り、連合に対するあなたの防衛に加わった。"
 latria_ally_refused_defense_msg_title: "同盟者が招集を拒否"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName]は聖座の防衛への招集を拒んだ。"

 latria_papal_scandal_war.0001.t: "教皇廃位の呼びかけ"
 latria_papal_scandal_war.0001.desc: "[latria_scandal_target.GetHerHis]の不義の関係が公になると、統治者たちは[latria_scandal_target.GetShortUIName]を廃位すべく武器を取った。その使者が私の宮廷を訪れ、連合と共に進軍するよう求めている。"
 latria_papal_scandal_war.0001.a: "武器を取り、連合に加わる"
 latria_papal_scandal_war.0001.b: "この戦争には加わらない"
