l_japanese:
 latria_sexual_frustration_flavor.1001.t: "帳の陰の長い夜"
 latria_sexual_frustration_flavor.1001.desc.female: "寝衣のまま窓辺に座り、膝の上の未開封の手紙を見つめる。差出人はとうに去ったのに、言えなかった言葉がいつまでも心に残っている。"
 latria_sexual_frustration_flavor.1001.desc.male: "寝衣のまま窓辺に座り、膝の上の未開封の手紙を見つめる。封筒の見慣れた筆跡に、応えられぬままの思いが蘇った。"
 latria_sexual_frustration_flavor.1001.desc: "夜が更け、昔の思いがまた戻ってくる。"
 latria_sexual_frustration_flavor.1001.a: "最後まで読み、差出人に思いを馳せよう。"
 latria_sexual_frustration_flavor.1001.b: "手紙に鍵をかけ、思いを抑えよう。"
 latria_sexual_frustration_flavor.1001.c: "新しい紙を取り、この思いを詩にしよう。"

 latria_sexual_frustration_flavor.1002.t: "宴の香辛料"
 latria_sexual_frustration_flavor.1002.desc.accepted: "広間は香辛料の香りと歌に満ち、目移りする視線を気に留める客もいない。それでも私は、誰かが現れるかのように一人ひとりの顔を追っている。"
 latria_sexual_frustration_flavor.1002.desc.strict: "香辛料が宴を引き立てるが、笑い声が上がるたび、道を外れた欲望を見張る慣習を思い出す。手の中の杯を忘れかけていた。"
 latria_sexual_frustration_flavor.1002.desc: "宴は騒がしい。それでも心はよそへ向かう。"
 latria_sexual_frustration_flavor.1002.a: "私も親しげな言葉を添えよう。"
 latria_sexual_frustration_flavor.1002.b: "目を伏せ、主催者に礼を述べて帰ろう。"
 latria_sexual_frustration_flavor.1002.c: "帰る前に、もう一曲頼もう。"
 latria_sexual_frustration_flavor.1002.d: "客を一つの卓に集め、夜通し語らおう。"

 latria_sexual_frustration_flavor.1003.t: "庭園の説教"
 latria_sexual_frustration_flavor.1003.desc.favors: "説教者は、肉体の快楽は必ずしも信仰に反しないと語る。慰められるはずの言葉なのに、心の落ち着かなさは収まらない。"
 latria_sexual_frustration_flavor.1003.desc.condemns: "説教者が貞潔と自制について語る。一言一句聞こえてはいるが、聖典に心を向け続けられない。"
 latria_sexual_frustration_flavor.1003.desc: "最後まで説教を聞いた。そよ風が頁をめくり、心はまだ落ち着かない。"
 latria_sexual_frustration_flavor.1003.a: "本を閉じ、恋しい相手のことを考えよう。"
 latria_sexual_frustration_flavor.1003.b: "思いを脇に置き、唱和に加わろう。"
 latria_sexual_frustration_flavor.1003.c: "一節ずつ説明してもらおう。"

 latria_sexual_frustration_flavor.1004.t: "落ち着かぬ隼"
 latria_sexual_frustration_flavor.1004.desc.lustful: "隼が手袋の上で羽ばたき、向こうの鳩を追っている。その逸る気持ちはよくわかるが、私の思いを休める場所は見つからない。"
 latria_sexual_frustration_flavor.1004.desc.chaste: "隼が手袋の上で落ち着かなく動き回る。手綱と呼び声に集中しても、心の中の思いは隼より手なずけにくい。"
 latria_sexual_frustration_flavor.1004.desc: "猟師たちは私が隼を呼び戻すのを待っているが、狩りに身が入らない。"
 latria_sexual_frustration_flavor.1004.a: "皆を待たせて、しばし思いに浸ろう。"
 latria_sexual_frustration_flavor.1004.b: "気を取り直し、狩猟道具を整えよう。"
 latria_sexual_frustration_flavor.1004.c: "ゆっくり羽を撫で、もう一度呼んでみよう。"

 latria_sexual_frustration_flavor.1005.t: "会議の合間"
 latria_sexual_frustration_flavor.1005.desc.emperor: "諸侯は散り、卓上には地図と印章が残った。私は上座に独り座り、未処理の書類の隣に古い手紙を置いている。"
 latria_sexual_frustration_flavor.1005.desc.adventurer: "仲間たちは次の渡し場を決めたが、卓上にはまだ地図が広がっている。古い手紙を灯りの下へ引き寄せると、物資の一覧のどこを読んでいたか忘れてしまった。"
 latria_sexual_frustration_flavor.1005.desc.clergy: "会議が終わり、帳簿と聖典が卓上に残った。頁の間から古い手紙を引き抜くと、落ち着かぬ思いが戻ってくる。"
 latria_sexual_frustration_flavor.1005.desc.ruler: "評議会は終わったが、書類と印章はそのままだ。袖を整える私の目は、どの請願よりも傍らの古い手紙に向いていた。"
 latria_sexual_frustration_flavor.1005.desc: "務めは残っているのに、古い手紙が気にかかる。"
 latria_sexual_frustration_flavor.1005.a: "仕事を脇に置き、手紙を読み返そう。"
 latria_sexual_frustration_flavor.1005.b: "手紙をしまい、務めに戻ろう。"
 latria_sexual_frustration_flavor.1005.c: "残りの仕事を整理し、少し休もう。"
 latria_sexual_frustration_flavor.1005.d: "仕事を仕分けし、すべて片づけよう。"

 latria_sexual_frustration_flavor.1006.t: "燭光に照らす古い手紙"
 latria_sexual_frustration_flavor.1006.desc.female: "寝衣のまま灯りの下に座り、古い手紙の折り目に指を置く。約束など書かれていない。ただ、消えない愛情だけがある。"
 latria_sexual_frustration_flavor.1006.desc.male: "寝衣のまま寝台の脇に座る。古い手紙の見慣れた筆跡に、ついに応えられなかった愛情を思い出す。"
 latria_sexual_frustration_flavor.1006.desc: "夜は静かだが、古い手紙の言葉が目から離れない。"
 latria_sexual_frustration_flavor.1006.a: "最後まで読もう。"
 latria_sexual_frustration_flavor.1006.b: "手紙をしまい、蝋燭を消して眠ろう。"

 latria_sexual_frustration_flavor.1007.t: "宴が終わる前に"
 latria_sexual_frustration_flavor.1007.desc.accepted: "誰かが昔の恋人の話をしても、卓の皆は気を悪くしない。私も共に杯を上げるが、目は何度も空席へ向いてしまう。"
 latria_sexual_frustration_flavor.1007.desc.strict: "軽率な恋の話が戒めとして語られ、皆の話題は名誉と慣習へ移った。私は袖を整え、口を閉ざした。"
 latria_sexual_frustration_flavor.1007.desc: "音楽は続いているが、私の思いはとうに宴席を離れていた。"
 latria_sexual_frustration_flavor.1007.a: "私の恋慕も、初めから聞かせてやろう。"
 latria_sexual_frustration_flavor.1007.b: "言葉を呑み込み、主催者に礼を述べて帰ろう。"
 latria_sexual_frustration_flavor.1007.c: "代わりに隣の客に旅の話を尋ねよう。"

 latria_sexual_frustration_flavor.1008.t: "聖龕の前の祈り"
 latria_sexual_frustration_flavor.1008.desc.favors: "聖龕の前の蝋燭が短くなった。私の信仰は肉体の快楽を蔑まないのに、内なる切望を鎮められない。"
 latria_sexual_frustration_flavor.1008.desc.condemns: "聖龕の前で貞潔の誓いを繰り返すが、慣れ親しんだ祈りが何度も途切れてしまう。"
 latria_sexual_frustration_flavor.1008.desc: "祈りは終わった。私はまだ蝋燭の傍らにいる。"
 latria_sexual_frustration_flavor.1008.a: "禁欲の誓いを脇に置き、思いを認めよう。"
 latria_sexual_frustration_flavor.1008.b: "思いを抑え、祈り続けよう。"
 latria_sexual_frustration_flavor.1008.c: "一節読み、よく考えてから帰ろう。"
 latria_sexual_frustration_flavor.1008.d: "蝋燭を灯し、夜明けまで唱えよう。"

 latria_sexual_frustration_flavor.1009.t: "読めぬ請願"
 latria_sexual_frustration_flavor.1009.desc.emperor: "長卓には請願が並び、諸侯は私の言葉を待っている。同じ一行を二度読んだのに、心はよそへ向かったままだ。"
 latria_sexual_frustration_flavor.1009.desc.ruler: "評議会はまだ終わっていないが、目の前の書類が頭に入らない。帳簿を閉じ、目前の議題へ心を戻そうとする。"
 latria_sexual_frustration_flavor.1009.a: "評議会を散会し、独りで考えさせてもらおう。"
 latria_sexual_frustration_flavor.1009.b: "気を取り直し、一つずつ請願に応じよう。"
 latria_sexual_frustration_flavor.1009.c: "裁定を整理し、順に言い渡そう。"

 latria_sexual_frustration_flavor.1010.t: "帰らぬ鷲"
 latria_sexual_frustration_flavor.1010.desc.lustful: "隼が林の上を巡っている。戻ろうとしないその姿を見て、何もかも望みを抑えてばかりいることに、私も疲れたのだと思う。"
 latria_sexual_frustration_flavor.1010.desc.chaste: "鷹はまだ遠くを巡っている。私は手袋を締め、猟師の呼び声だけに耳を傾けようとした。"
 latria_sexual_frustration_flavor.1010.desc: "猟師たちは撤収を待っているが、私は木々の上の空を見つめている。"
 latria_sexual_frustration_flavor.1010.a: "猟師たちを待たせ、鷲と共に思いを巡らせよう。"
 latria_sexual_frustration_flavor.1010.b: "帰還の合図を出し、狩猟道具を点検しよう。"
 latria_sexual_frustration_flavor.1010.c: "林沿いを歩いてから皆の所へ戻ろう。"

 nick_latria_the_unquiet: "心休まらぬ者"
 latria_flavor_focus: "定まった決意"
 latria_flavor_focus_desc: "この人物は聖典と日々の務めに心を向けている。"
 latria_flavor_remorse: "消えない後悔"
 latria_flavor_remorse_desc: "束の間の慰めの後に、良心の痛みが残った。"
 latria_flavor_sullied: "傷ついた評判"
 latria_flavor_sullied_desc: "噂がこの人物の立場と交友関係を損なった。"
 latria_flavor_broken_sleep: "睡眠不足"
 latria_flavor_broken_sleep_desc: "寝不足のため、この人物は気が散りやすく、疲れやすい。"
 latria_flavor_vagabond_focus: "旅人の集中"
 latria_flavor_vagabond_focus_desc: "旅路の働きが、落ち着かぬ思いをしばし鎮めている。"
 latria_flavor_public_disgrace: "公衆の面前での醜態"
 latria_flavor_public_disgrace_desc: "人前での失態の噂が、この人物の立場と交友関係を損なった。"
 latria_flavor_hunting_focus: "狩りへの集中"
 latria_flavor_hunting_focus_desc: "この人物は追跡、鷹狩り、乗馬に心を向けている。"
 latria_flavor_warm_company: "楽しい語らい"
 latria_flavor_warm_company_desc: "よい会話を楽しんだことで、この人物は人と会う気になっている。"
 latria_flavor_neglected_duties: "怠った務め"
 latria_flavor_neglected_duties_desc: "私事が気にかかり、この人物は務めを果たせずにいる。"
 latria_flavor_diligent_work: "片づいた仕事"
 latria_flavor_diligent_work_desc: "この人物は落ち着かぬ思いを、綿密な計画と働きに向けた。"
