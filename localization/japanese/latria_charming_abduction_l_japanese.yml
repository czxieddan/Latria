 latria_charming_abduction.1001.t: "枕辺の約束"
 latria_charming_abduction.1001.desc: "湯は冷めつつあるが、寝室にはまだ香りが残っている。私は上着を寝台の脇に置き、卓上の封をしていない手紙に向き直った。[target.GetFirstName]を眠れなくする一文を書き添えるだけでいい。\n\n私の手の者は脇戸も廊下の曲がり角も心得ている。[target.GetSheHe]が甘い夜を期待して[target.GetHerHis]の従者を下がらせれば、分厚い帳が多くを隠してくれる。私の寝台で[target.GetSheHe]が思い描く、[target.GetHerHim]を待つ快楽については……まず、[target.GetSheHe]には敷居をまたいでもらわなければ。"
 latria_charming_abduction.1001.a: "寝台の脇で待っていると[target.GetHerHim]に伝えよ。"
 latria_charming_abduction.1001.b: "[target.GetHerHim]を控えの間での酒に誘え。温かな酒と、暗い灯りを。"
 latria_charming_abduction.1001.c: "手紙に封をしよう。もっとよい夜が来る。"
 latria_charming_abduction.1001.d: "手紙を火にくべよ。これで終わりだ。"
 latria_charming_abduction_wait_tt: "準備を続け、次の実行の機会を待つ。"

 latria_charming_abduction.1101.t: "ほのかな香り"
 latria_charming_abduction.1101.desc: "[target.GetFirstNamePossessive]の返事と共に、絹の紐が届いた。少し引けばほどけそうなほど緩く結ばれている。文面は礼儀正しいが、末尾の数行は詰まっている。[target.GetSheHe]は書き終えたくとも、羽根ペンを置きたくなかったのだろう。\n\n私は紐を指に巻きつける。次の手紙にはどんな香りを添えようか。それを手に床に就いた[target.GetHerHis]の頭には、どんな思いが浮かぶだろう？"
 latria_charming_abduction.1101.a: "夜に触れた一節に香水を一滴垂らそう。"
 latria_charming_abduction.1101.b: "時刻だけを書き、署名はしない。"
 latria_charming_abduction.1101.c: "返事を燭台の下に置き、待たせておこう。"

 latria_charming_abduction.1102.t: "もう一組の目"
 latria_charming_abduction.1102.desc: "[target.GetFirstNamePossessive]の就寝時の習慣は、[target.GetHerHis]の恋文よりも役に立つ。日が暮れても従者が一人残り、酒を注ぎ、衣を片づけ、最後の蝋燭が消えるまで帰らないという。\n\n忠実な従者一人で、周到に手配した逢瀬が台無しになる。その目を別の用事に向けねばならない。"
 latria_charming_abduction.1102.a: "銀貨の袋で、その従者に一晩の楽しみを買ってやろう。"
 latria_charming_abduction.1102.b: "一文添えよう。独りで来れば、よいことがあると。"
 latria_charming_abduction.1102.c: "ひとまず招待を取り消そう。あの扉は別の夜まで待てる。"

 latria_charming_abduction.2001.t: "閂が下りる時"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName]は寝台脇の蝋燭に[target.GetHerHis]の目を向けたまま、寝室に入る。私は手を差し伸べ、もう一歩で触れられると[target.GetHerHim]に思わせた。\n\n閂が鳴る。[target.GetSheHe|U]が振り返ると、帳の裏の影が立ち上がった。私の手の者が[target.GetHerHis]の腕をつかみ、袖から縄を出す。燭台を揺らすことさえない。\n\n私は椅子の上の衣を取った。今夜、枕を並べる相手はいない。"
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName]は私が注いだ酒を受け取ると、少し身を引いて奥の間への道を空けた。[target.GetSheHe|U]は私が[target.GetHerHis]の手を取り、[target.GetHerHim]を人目のない場所へ誘うと思っている。\n\n私は杯を置いた。脇戸が開き、手の者がなだれ込む。[target.GetSheHe]が声を上げようとした時には、閂は下り、縄は締まっていた。\n\n卓上の酒はほとんど手つかずだ。"
 latria_charming_abduction.2001.secret: "\n\n廊下には物音一つない。宮廷が[target.GetHerHis]の不在に気づく頃には、蝋も冷えているだろう。"
 latria_charming_abduction.2001.exposed: "\n\n窓の外で叫び声が上がる。夜明け前には、今夜のもう半分の話を誰かが広めそうだ。"
 latria_charming_abduction.2001.a: "[target.GetHerHis]の外套を持ってこい。もう出発だ。"

 latria_charming_abduction.2002.t: "終わらぬ夜"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName]は戸口で足を止めた。蝋燭も寝台も、私が意図して置いた沈黙さえも、[target.GetHerHim]をあと一歩近づけることはできなかった。\n\n\"もう遅い。\"[target.GetHerHis|U]の目は私の肩越しに、動かない帳へと向けられる。\n\n差し伸べた手には夜気が触れるだけだ。"
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName]は酒に手をつけない。しばし卓の傍らに立ち、[target.GetSheHe]は私の笑顔を見定めるようにしてから、開いた扉へ下がった。\n\n\"灯りはそのままに。私の者たちが待っている。\"\n\n脇戸の裏の足音が、ひどく大きく聞こえた。"
 latria_charming_abduction.2002.secret: "\n\n隠れた手の者が出てくる前に、私は手を下ろした。明日には、袖にされた私を笑う者もいるだろう。扉の裏に何が待っていたかは誰も知らない。"
 latria_charming_abduction.2002.exposed: "\n\n縄の輪が覗く。[target.GetFirstNameNoTooltip]は身を引き、[target.GetSheHe]は[target.GetHerHis]の護衛の方へ下がりながら私の名を叫んだ。もう無害な戯れとは思ってもらえない。"
 latria_charming_abduction.2002.a: "蝋燭を消せ。もう招待は送らない。"
 latria_charming_abduction.2002.b: "新たな手紙を書き、次の機会を待とう。"
 latria_charming_abduction_retry_tt: "今回の手段による補正を取り除き、それ以前の招待の準備を保ったまま、この計画を再び準備する。"

 latria_charming_abduction.2101.t: "甘い罠"
 latria_charming_abduction.2101.bedchamber: "[owner.GetFirstName]に会いに来た時、私はまだ[owner.GetHerHis]の手にどう口づけしようかと考えていた。薄暗い寝室では、帳の裏に目を向けることさえ忘れてしまう。\n\n腕を背中へねじ上げられてようやく、なぜ[owner.GetSheHe]が手の届かない所にいたのかわかった。ここで私を待っていたのは優しさではなく、一本の縄だった。"
 latria_charming_abduction.2101.antechamber: "酒を一口飲む前に、私は[owner.GetFirstNamePossessive]の囚われ人となった。\n\n[owner.GetSheHe|U]は申し合わせた合図のように[owner.GetHerHis]の杯を置いた。たちまち脇戸から人がなだれ込み、私の腕をつかむ。私は説明を求めて[owner.GetHerHim]を見つめ続けた。[owner.GetSheHe|U]はただ、私の外套を取ってこいと命じただけだった。"
 latria_charming_abduction.2101.a: "顔を背ける。[owner.GetHerHim]など見たくない。"

 latria_charming_abduction.2102.t: "燭光の裏で"
 latria_charming_abduction.2102.secret: "[owner.GetFirstNamePossessive]の招待状は甘い言葉に満ちていたが、会ってみると[owner.GetSheHe]はどこか上の空だった。廊下の足音、扉の裏の衣擦れ。護衛の話をすると、[owner.GetHerHis]の笑顔がこわばった。\n\n私は口実をつけて立ち去った。自分の従者たちの所に戻って初めて、手のひらの汗に気づく。ただの気まずい逢瀬だったのかもしれない。あの扉の裏に何があったか、知らない方がよいのかもしれない。"
 latria_charming_abduction.2102.exposed: "目に入った縄が、私を一気に正気に戻した。\n\n[owner.GetFirstNamePossessive]の囁き、落とされた灯り、[owner.GetSheHe]が保っていた距離。すべて私を部屋に留めるためだった。私は廊下へ下がって護衛を呼び、扉の裏の人影が闇へ退くのを見た。\n\nあの笑顔のために、危うく皆を下がらせるところだった。"
 latria_charming_abduction.2102.a: "今後は必ず扉の外に一人置く。"

