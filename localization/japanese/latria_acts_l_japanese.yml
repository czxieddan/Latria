 latria_solo_relief_interaction: "独りで愛撫する"
 latria_solo_relief_interaction_desc: "独りで楽しむ肉体の快楽。"
 latria_solo_relief_send: "始める"
 latria_solo_relief_night_tt: "今夜は独りで過ごしたい。"
 latria_act.0201.t: "奥の間"
 latria_act.0201.desc: "外の間の人が散り、通り過ぎる最後の灯まで遠ざかるのを待ってから、自分で閂を下ろす。話し声が消えると、灯芯がときどき爆ぜるだけになる。\n\n衣は椅子にかけておく。灯を低くし、寝台のそばの一本だけを残して、もう一人のいない寝具の中に長く横たわる。夜は短くない。欲ははっきり来て、ゆっくり去る。同じ石を洗う潮が引き、また静かに戻るようだ。\n\n呼吸がようやく落ち着いたとき、窓の外は白んでいる。自分の鼓動を聞き、それから空の部屋を聞いてから、寝具を平らにし、何もなかったようにこの夜を片づけるべきだと気づく。"
 latria_act.0201.a: "衣を整え、扉を開ける。"
 latria_act.0301.t: "身体の限界"
 latria_act.0301.desc.illness: "夜はまだ完全には終わっていないのに、不快が朝より先に来る。\n\n身を起こそうとすると、熱が額へ上がる。手足は誰かのものに替わったようで、二度力を入れても従わない。寝具は重く熱く、息にさえ乾いた甘さがある。外の人を呼ぼうとしても、声は唇までしか届かない。\n\n光がゆっくり窓に集まり、窓枠を越える。それを見ながら、熱が早く去ることを願い、そう素直にはいかないだろうとも思う。"
 latria_act.0301.desc.stress: "体は止まり、手も寝具から抜いた。考えは止まらない。\n\n目を開けたまま、この夜を何度もたどる。どこで息が乱れ、どの一言を言うべきでなく、どこで自分を追い込みすぎたか。どれもはっきりしている。帳の外は静かで、静かなほど考えは大きくなる。遠くの夜回りさえ、それを数えているようだ。\n\n身を翻し、また戻る。夜明け近くには枕の向きを何度も変えているのに、まだ眠っていない。"
 latria_act.0301.desc.health: "水を一杯取りに起きようとする。足が床に触れた瞬間、部屋が暗む。\n\n寝台の縁をつかみ、額を自分の手に当てる。心臓は速く、空に打つ。長く走った後のようだが、枕から身を起こしただけだ。杯は数歩先にあり、部屋の物ももとの場所にある。体のほうが先に限界へ着いたようだ。\n\n暗さが退くまで、しばらくかかる。結局その水は取りに行かない。ただ再び横になる。"
 latria_act.0301.a: "横になり、何も考えない。"
 latria_act.0311.t: "積もる疲弊"
 latria_act.0311.desc.illness: "これは一夜で押し寄せたものではない。\n\n過ぎた夜々はばらばらにあり、一度眠り、温かい食事を一度取れば返せると思っていた。今朝、熱が胸から指先へ広がり、それらがずっと前からつながっていたと分かる。水を飲んでも渇き、掛け布をかけても冷える。窓の風さえ骨を通るようだ。\n\n外を人が通る音を聞きながら横たわり、人を呼ぶ力さえ惜しまなければならない。病は押し入ったのではない。体の中へ少しずつ住みついた。"
 latria_act.0311.desc.stress: "疲れは手足にはない。眠りの上に乗り、私を中へ入れない。\n\n目を閉じると、昼の顔、夜の息、後悔する暇のなかった瞬間が一緒に押し寄せる。手を上げることもできないほど体は乏しいのに、心はまだ明るく、明るすぎて疲れる。自分の呼吸も、窓の外の夜回りも数えた。どれもその光景を暗くできない。\n\n鶏が鳴き、夜も明けた。枕のこちらからあちらへ移るだけで、まだ目が覚めている。"
 latria_act.0311.desc.infertile: "最初は来ない知らせが一度だった。気にも留めなかったが、やがてそういう日が何度にもなった。\n\n来るべき日を心の中で数え、口に出せば本当になるのが怖くて言わなかった。今日、医師はその回り続けてきたことをようやく私の前に置く。この体はもう子を宿せない。声は高くないが、部屋のほかの音では覆えない。\n\n人が去ったあと、下腹へ手を置く。その言葉を本当に下ろすまで長くかかる。"
 latria_act.0311.desc.health: "以前なら、この脱力を遅く寝たせいだと言い、温かい酒を一杯と半日の静けさで済ませられた。\n\n今は身を起こすだけでも、寝台の縁で止まらなければならない。帯も杯も以前より重い。窓から戸口までが、実際より長い道に思える。鏡の中の顔色を見て、一夜や二夜の休みでは返せない欠乏だと信じる。鏡の中の人は、私より先にそれを知っていたように私を見る。\n\n再び横になる。今度は体が先に決めた。"
 latria_act.0311.a: "用事を置き、寝床で休む。"
