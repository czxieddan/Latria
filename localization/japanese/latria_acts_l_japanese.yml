 latria_act.0101.t: "扉の向こうで"
 latria_act.0101.desc: "扉が閉まるとき、廊下ではまだ低い話し声がしている。足音が遠ざかり、隙間の光もそれとともに細くなる。そのとき初めて振り返ると、[latria_partner.GetShortUIName]はすでに寝台の端に座り、衣はまだ腕にかかったまま、入ってから忘れたかのようだった。\n\n灯は低くしてある。椅子の上のものはどちらも取らないが、寝具はすぐに暖まる。夜はゆっくり過ぎ、灯芯の小さな音が一つずつ聞こえる。再び窓を見ると、空は白み、外側の半分の寝台は冷えていた。\n\n侍従が二度ノックして止まる。中をすでに妨げてよいか、確かでないようだ。そのとき初めて、昼に待っている用事の多さを思い出す。"
 latria_act.0101.desc.adultery: "私はしばらく扉に耳を当てている。廊下の声が絶え、灯を持つ者まで空の灯を提げて去ってから、わずかに開け、[latria_partner.GetShortUIName]を横向きに入れる。閂の音は小さい。今夜はそれが長く響くように思える。\n\n声は低く保つ。外を足音が通るたびに、二人は息まで脇へ置き、それが曲がるまで動かない。灯火は帳を照らし、視線が隙間へ向くたびに私たちの目も照らす。\n\n別れるとき、[latria_partner.GetSheHe]は敷居から私を振り返る。もう繰り返す必要はない。今夜のことは、三人目に知られてはならない。"
 latria_act.0101.desc.dead: "最初は[latria_partner.GetShortUIName]が深く眠っただけだと思う。耳のすぐそばで名を呼び、それから灯を顔のそばへ移す。炎が跳ねても、照らされるのは応えない目のままだ。\n\n胸に手を置く。掌の下の静けさが恐ろしい。寝具には先ほどまでの温もりが残り、枕にも窪みが残っている。息だけがない。冷えていく手をしばらく握る。まだ呼び戻せそうに思って。\n\nやがて勢いよく扉を開け、医師を呼ぶ。自分の声は廊下に当たって戻り、自分のものには聞こえない。"
 latria_act.0101.desc.adultery_dead: "今夜いちばん悪いのは、誰かが扉を開け、見られてはならない二人を見ることだと思っていた。\n\nそれより先に[latria_partner.GetShortUIName]が倒れる。呼び、揺すり、灯を顔のそばへ持っていく。目は開かない。唇にも息は戻らない。先ほどまで温かかった手は、私の掌の中で少しずつ冷える。\n\n外で足音がする。乱れた寝台、まだ着ていない衣、そして二度と目覚めない人を見る。あの扉が開いても、先に口へ出せる一言さえない。"
 latria_act.0101.desc.actor_dissatisfied: "夜はまだ深いのに、私は身を起こし、腕へ滑った袖を引き戻している。\n\n[latria_partner.GetShortUIName]は掛け布の下で身を翻し、まだ何か言い残しているように、私の手首へ軽く指を触れる。私には、この時間がどれほど長く、どれほど空しかったかしか感じられない。手を伸ばす気さえ失せる。灯芯が爆ぜても、部屋は暖かくならない。\n\n振り返らずに椅子から衣を取る。終わらせないほど、早く戸の外へ出たくなる逢瀬もある。"
 latria_act.0101.desc.partner_dissatisfied: "来るとき、[latria_partner.GetShortUIName]は戸口で足を止め、まず灯を見て、それから私を見た。この夜をすぐ始めたくないようだった。\n\n去り方はずっと速い。帯が結ばれないうちに寝台を離れ、私の目も手も避ける。名を呼ぶと、短い返事だけで、別れの言葉はない。扉が閉まるとき、その風が灯を斜めに揺らす。\n\n気配は部屋に残る。寝台の端はすでに冷えていて、誰も座らなかったかのようだ。"
 latria_act.0101.desc.manual: "寝台までは行かない。\n\n[latria_partner.GetShortUIName]は私のそばに座り、昼に残った用事を話し始めるが、文の途中でやめる。口づけは軽く、愛撫も袖や髪に留まり、それより深くは進まない。窓の外を夜回りの声が過ぎる。どちらも数えない。\n\nやがて灯油が尽きる。暗がりの中でもう少し座り、互いの呼吸が静まるのを聞いてから、それぞれ袖を直す。今夜は、これで足りる。"
 latria_act.0101.a: "扉を開け、昼へ戻る。"
 latria_act.0102.desc: "[latria_actor.GetShortUIName]に、夜が更けたこと、明日も人が待っていることを思い出させてもよかった。言葉は唇まで来て、そこから先へ出ない。\n\n扉が閉まると、足音も話し声も遠ざかる。灯火は帳を暖め、どちらも急いで起きようとしない。[latria_actor.GetHerHis]の呼吸が乱れたものから静かなものへ移るのを聞き、私自身も時辰を忘れる。再び窓を見ると、空は白んでいる。外の侍従は、おそらく長く待っている。\n\nそのとき初めて手を放す。終わらせるのを急がなくてよい夜もある。"
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName]が去ろうとするとき、私は扉へ行き、木に耳を当てる。\n\n廊下はしばらく空いている。それから誰かが灯を持って通る。その光は隙間をゆっくり横切り、ゆっくり離れる。私たちは話さず、衣さえ音を立てさせない。静けさが戻ってから、衣が整えられる。\n\n横向きに通れるだけ扉を開ける。少なくとも今夜、秘密はまだ二人のものだ。"
 latria_act.0102.desc.partner_dissatisfied: "扉が閉まる前、私はこの夜がどんなものになるのかをまだ考えていた。灯まであらかじめ暖かくしてあった。\n\n本当に二人だけになると、その期待は冷えていく。手も、息も、私を引き留めるはずだった親しさも、何かの向こうから届くようだ。私は応えながら、目は扉へ、考えは廊下へ戻る。\n\n最後に先に身を起こし、袖を整えるのは私だ。この夜は、待ち続けた時間に見合わなかった。"
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName]は、私に灯をつけ直させないまま起き上がる。窓辺には白い光が少し残るだけだ。\n\n私はまだ横たわり、夜がこんなに鋭く切れないための一言を探している。[latria_actor.GetSheHe]は顔を背け、気のない二言を返し、私が差し出す衣も取らず、すでに帯を結んでいる。言葉が終わらないうちに、扉への道は始まっている。\n\n扉とともに冷たい空気が入る。説明の要らない失望もある。"
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName]は私を寝台へ引かず、ただそばに座り、間にあった枕をどける。\n\n昼に残っていた用事が、急に待てるように思える。口づけと、最後まで言わなくてもよい言葉を交わす。手は袖や髪に留まり、それより深くは進まない。窓の外はまだ暗く、夜回りの声もまだ遠い。\n\n別れるとき、私が自分で乱した衣の皺を、指が直してくれる。夜は短いが、何かが足りないという感じは残さない。"

 latria_scheme.0010.t: "交わり"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "私の[spouse|E]"
 latria_scheme.0010.t.concubine: "私の[concubine|E]"
 latria_scheme.0010.t.soulmate: "私の[soulmate|E]"
 latria_scheme.0010.t.lover: "私の[lover|E]"
 latria_scheme.0010.t.adultery: "不義の逢瀬"
 latria_scheme.0010.desc: "蝋燭はまだ燃えているのに、[target.GetShortUIName]はもう私に応えない。\n\n名を呼び、それから耳を唇へ近づける。何もない。指先の肌は先ほどより冷たいのに、二人の温もりは寝具に残っている。手は掌から滑り、戻ってこない。\n\n夜明け前に杯も衣も、この夜の跡も片づけるつもりだった。今、そばにいるのは二度と動かない人だけだ。窓は白み始め、何から隠すべきか分からない。"
 latria_scheme.0010.a: "掛け布を[target.GetShortUIName]にかけてから戸を開ける。"
 latria_scheme.0020.t: "待ち続けた夜"
 latria_scheme.0020.desc: "灯油はだいぶ減ったのに、戸の外に[target.GetFirstName]の足音はない。\n\n酒を二度温め、椅子の衣をもう一度畳む。ときどき廊下が人の通る音を立てる。足音が近づけば息を止め、遠ざかればまた一人になる。そのたびに、待っている人だと思う。\n\nやがて蝋燭が自ら揺れ、蝋が皿に落ちる。そのとき初めて、この夜が終わったと認める。用意した酒も、言葉も、口実も、もう要らない。"
 latria_scheme.0020.a: "灯を消す。もう待つことはない。"
 latria_scheme.0030.t: "遅すぎた知らせ"
 latria_scheme.0030.desc: "どの脇戸がより人目につかず、どの誘いなら疑いを招きにくいかをまだ考えているとき、知らせが卓に置かれる。\n\n[target.GetFirstName]はもうこの世にいない。紙の字は少ない。私はそれを長く見る。出さなかった手紙、覚えた廊下、この一夜のためにとっておいた口実。どれも急に用のないものになる。\n\nまだ温かい酒を捨てる。より良い夜を待てる手配もある。すでに起きた死には、どれも追いつけない。"
 latria_scheme.0030.a: "出さなかった手紙を燃やす。"
 latria_scheme.0040.t: "切れた糸"
 latria_scheme.0040.desc: "人をやって[target.GetFirstName]を探させ、午後から灯の点くときまで待つ。戻ってきたのは曖昧な返事だけだ。もう会えない、と。\n\n扉の見張りが厳しくなったのかもしれない。誰かの目が急に鋭くなったのかもしれない。あるいは[target.GetSheHe]が、私がその人のために灯した明かりに、もう近づかないだけかもしれない。二度尋ねても、使いの者はそれ以上を知らない。\n\n理由はもう重要ではない。糸は指のあいだで切れた。刻限を記した紙片を、汗が字をぼかすまで掌で丸める。"
 latria_scheme.0040.a: "この件は、ここまでだ。"

