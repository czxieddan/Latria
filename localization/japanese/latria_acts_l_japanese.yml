 latria_act.0101.t: "扉の向こうで"
 latria_act.0101.desc: "扉が閉まり、廊下の足音が遠ざかる。[latria_partner.GetShortUIName]と私は夜明けまで共に過ごした。\n\n従者が扉を叩いて初めて、今日の務めを思い出す。"
 latria_act.0101.desc.adultery: "廊下に誰もいなくなるのを待ち、[latria_partner.GetShortUIName]を部屋に入れた。\n\n別れ際、私たちは一つだけ約束を交わす。今夜のことは誰にも話さない。"
 latria_act.0101.desc.dead: "[latria_partner.GetShortUINamePossessive]の名を呼び、もう一度呼ぶ。返事はなく、息もしていない。\n\n私は扉を開け放ち、医師を呼べと叫んだ。"
 latria_act.0101.desc.adultery_dead: "人に見つかる以上に悪いことはないと思っていた。[latria_partner.GetShortUIName]が倒れ、目を覚まさなくなるまでは。\n\n扉の外から足音が近づく。どう説明すればいい？"
 latria_act.0101.desc.actor_dissatisfied: "まだ暗いうちに起き上がる。[latria_partner.GetShortUIName]は何か言いたげだが、この期待外れの逢瀬はもう十分だ。"
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName]は来た時よりもずっと慌ただしく立ち去る。[latria_partner.GetSheHe|U]は私と目を合わせず、別れの言葉さえ残さなかった。"
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName]と私は静かな場所で寄り添い、口づけと愛撫だけで満ち足りていた。時刻を気にする者はいない。"
 latria_act.0101.a: "立ち去る"
 latria_act.0102.desc: "私は[latria_actor.GetShortUIName]に帰るよう促さなかった。扉が閉まれば、この夜は私たちのものだ。\n\n夜が明ける頃には、従者たちはずいぶん長く外で待っていた。"
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName]が帰る前に、私は扉に耳を寄せた。\n\n廊下には誰もいない。少なくとも今夜は、秘密は私たちだけのものだ。"
 latria_act.0102.desc.partner_dissatisfied: "[latria_actor.GetShortUIName]と二人きりになるのを楽しみにしていた。今はただ帰りたい。今夜にこれほど期待するのではなかった。"
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName]は苛立った様子で立ち上がる。私が話しかけても、[latria_actor.GetSheHe]はそっけなく二言三言返し、扉へ向かった。"
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName]が隣に座る。しばし務めを忘れ、口づけと愛撫だけを交わした。\n\n別れる時も、外はまだ暗かった。"

