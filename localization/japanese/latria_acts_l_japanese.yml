 latria_wedding_night.t: "初夜"
 latria_wedding_night.desc: "新夫婦を部屋まで送った客は、ようやく散った。笑い声は廊下に残っているが、扉は閉まり、昼の挨拶も、祝辞も、尽きないように見えた酒も外に残す。\n\n灯火は帳を暖める。寝台は新しく敷かれ、衣も新しく替えられ、互いに見る様子さえまだ少し他人のようだ。[latria_actor.GetShortUIName]と[latria_partner.GetShortUIName]はしばらく向かい合って座る。どちらも先に口を開こうとせず、扉の向こうの人がだんだん遠ざかるのを聞いているだけだ。\n\nこの夜のあと、二人は客の口に上る新人ではなくなる。"
