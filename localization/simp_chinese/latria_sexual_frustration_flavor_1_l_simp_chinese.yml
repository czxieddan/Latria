l_simp_chinese:
 latria_sexual_frustration_flavor.1001.t: "帘后的长夜"
 latria_sexual_frustration_flavor.1001.desc.female: "我披着寝衣坐在窗边，月色落在未拆的信上。写信的人早已离开，我的心思却仍停在那句未曾说出口的话上。"
 latria_sexual_frustration_flavor.1001.desc.male: "我披着寝衣坐在窗边，月色落在未拆的信上。信中熟悉的笔迹让我想起那份始终没有得到回应的渴望。"
 latria_sexual_frustration_flavor.1001.desc: "夜深以后，未竟的心事又一次浮上心头。"
 latria_sexual_frustration_flavor.1001.a: "把信读到最后"
 latria_sexual_frustration_flavor.1001.b: "锁起信笺，回到床上"

 latria_sexual_frustration_flavor.1002.t: "宴席间的辛香"
 latria_sexual_frustration_flavor.1002.desc.accepted: "宴席上的香料与歌声都不曾让宾客大惊小怪。我仍在笑谈间留意每一道目光，仿佛某人随时会从人群中走来。"
 latria_sexual_frustration_flavor.1002.desc.strict: "香料令宴席更加热闹，席间的笑声却使我想起礼法如何约束每一次逾矩。侍从添酒时，我几乎忘了手中杯盏。"
 latria_sexual_frustration_flavor.1002.desc: "宴席喧闹，心思却总被同一件事牵走。"
 latria_sexual_frustration_flavor.1002.a: "再留一会儿"
 latria_sexual_frustration_flavor.1002.b: "向主人告辞"

 latria_sexual_frustration_flavor.1003.t: "园中的讲道"
 latria_sexual_frustration_flavor.1003.desc.favors: "讲道者说，肉体欢愉也是造物的一部分。这样的言语本该使我宽心，心底那阵躁动却没有因此平息。"
 latria_sexual_frustration_flavor.1003.desc.condemns: "讲道者谈起克制与贞洁。每一句都听得清楚，我却无法把注意力留在经文上。"
 latria_sexual_frustration_flavor.1003.desc: "我在园中听完讲道，风吹过书页，念头仍未安定。"
 latria_sexual_frustration_flavor.1003.a: "留下听完讲道"
 latria_sexual_frustration_flavor.1003.b: "合上经书"

 latria_sexual_frustration_flavor.1004.t: "猎隼的躁动"
 latria_sexual_frustration_flavor.1004.desc.lustful: "猎隼在腕上扑动，目光追着远处的鸽群。我熟悉这份急切，却始终找不到能令心绪停歇的去处。"
 latria_sexual_frustration_flavor.1004.desc.chaste: "猎隼在腕上不安地踱步。我强迫自己专注于缰绳与哨音，心头的念头却比鸟儿更难驯服。"
 latria_sexual_frustration_flavor.1004.desc: "猎场空旷，猎隼不安，我也无法专心。"
 latria_sexual_frustration_flavor.1004.a: "放任思绪片刻"
 latria_sexual_frustration_flavor.1004.b: "重新整理猎具"

 latria_sexual_frustration_flavor.1005.t: "议事间隙"
 latria_sexual_frustration_flavor.1005.desc.emperor: "诸侯离席后，侍从仍在收拾地图与印玺。我身着礼服独坐在长桌尽头，连沉默都像是在等待臣下的答复。"
 latria_sexual_frustration_flavor.1005.desc.adventurer: "营帐外，马匹已经备好。同行者谈起下一个渡口，我却盯着火光，想起一段不该随行的旧情。"
 latria_sexual_frustration_flavor.1005.desc.clergy: "晚祷已经结束。我仍穿着礼服停在空荡的廊下，听见自己的脚步声，也听见心里不肯安静的声音。"
 latria_sexual_frustration_flavor.1005.desc.ruler: "议事散了，文书和封蜡还堆在桌上。我把礼服袖口抚平，发现自己又一次读不进手中的奏报。"
 latria_sexual_frustration_flavor.1005.desc: "手边事务不少，我却迟迟不能专心。"
 latria_sexual_frustration_flavor.1005.a: "召回已经散去的人"
 latria_sexual_frustration_flavor.1005.b: "继续处理政务"

 nick_latria_the_unquiet: "欲火难平者"
 latria_flavor_focus: "收束心神"
 latria_flavor_focus_desc: "以劳作和戒备压住杂念。"
 latria_flavor_remorse: "挥之不去的悔意"
 latria_flavor_remorse_desc: "一时的宽慰留下了长久的心绪不宁。"
 latria_flavor_sullied: "声名受损"
 latria_flavor_sullied_desc: "流言损害了此人的声望与人缘。"
 latria_flavor_broken_sleep: "彻夜难眠"
 latria_flavor_broken_sleep_desc: "长期压抑已侵入睡眠与日常判断。"
 latria_flavor_vagabond_focus: "行旅中的专注"
 latria_flavor_vagabond_focus_desc: "旅途劳作暂时压过了心头杂念。"

 latria_sexual_frustration_flavor.1006.t: "灯下的旧信"
 latria_sexual_frustration_flavor.1006.desc.female: "我披着寝衣坐在灯下，指尖停在旧信的折痕上。信中没有允诺，只有一段迟迟未散的心事。"
 latria_sexual_frustration_flavor.1006.desc.male: "我披着寝衣坐在床边，旧信上的字迹让我想起一段始终没有回应的情意。"
 latria_sexual_frustration_flavor.1006.desc: "夜色沉静，旧信上的字句却久久留在眼前。"
 latria_sexual_frustration_flavor.1006.a: "把信读到末尾"
 latria_sexual_frustration_flavor.1006.b: "收好信笺，吹灭灯火"

 latria_sexual_frustration_flavor.1007.t: "宴席散前"
 latria_sexual_frustration_flavor.1007.desc.accepted: "谈笑间有人提起旧日情人，席上无人觉得失礼。我跟着举杯，目光却几次落向空着的席位。"
 latria_sexual_frustration_flavor.1007.desc.strict: "席间把一桩私情说成警戒，众人随即谈起名誉与规矩。我低头理了理袖口，没有接话。"
 latria_sexual_frustration_flavor.1007.desc: "乐声未停，心思却早已离开席间。"
 latria_sexual_frustration_flavor.1007.a: "在席间多留片刻"
 latria_sexual_frustration_flavor.1007.b: "向主人辞别"

 latria_sexual_frustration_flavor.1008.t: "烛前的祷词"
 latria_sexual_frustration_flavor.1008.desc.favors: "圣龛前的烛火将尽。我想起信仰并不憎恶肉体欢愉，却仍难以安顿心底的迫切。"
 latria_sexual_frustration_flavor.1008.desc.condemns: "我在圣龛前默念贞洁的誓词，熟悉的祷文却几次断在唇边。"
 latria_sexual_frustration_flavor.1008.desc: "祷告已毕，我仍留在烛火旁。"
 latria_sexual_frustration_flavor.1008.a: "继续默祷"
 latria_sexual_frustration_flavor.1008.b: "离开圣龛"

 latria_sexual_frustration_flavor.1009.t: "未批的奏报"
 latria_sexual_frustration_flavor.1009.desc.emperor: "奏报摊在长桌上，诸侯都等着我发话。我把一行字读了两遍，心思却仍飘向另一处。"
 latria_sexual_frustration_flavor.1009.desc.ruler: "议事尚未结束，桌上的文书却一个字也读不进去。我合上卷宗，试图让心神归于正事。"
 latria_sexual_frustration_flavor.1009.a: "把奏报放到一旁"
 latria_sexual_frustration_flavor.1009.b: "重新召集议事"

 latria_sexual_frustration_flavor.1010.t: "归鹰迟迟"
 latria_sexual_frustration_flavor.1010.desc.lustful: "猎鹰盘旋在林地上空。我看着它迟迟不肯归来，想起自己也厌倦了凡事都要压下心意。"
 latria_sexual_frustration_flavor.1010.desc.chaste: "鹰隼仍在远处盘旋，我握紧手套，强迫自己只听猎人的号令。"
 latria_sexual_frustration_flavor.1010.desc: "猎人们等着收队，我却还在望着林间的天空。"
 latria_sexual_frustration_flavor.1010.a: "任由心思随鹰远去"
 latria_sexual_frustration_flavor.1010.b: "吹响收队的号角"

 latria_flavor_public_disgrace: "朝会失仪"
 latria_flavor_public_disgrace_desc: "当众失态的传闻损害了此人的威望与人缘。"
