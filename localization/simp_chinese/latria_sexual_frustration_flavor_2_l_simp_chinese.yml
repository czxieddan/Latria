l_simp_chinese:
 latria_sexual_frustration_flavor.1101.t: "帐中无眠"
 latria_sexual_frustration_flavor.1101.desc.female: "我从床榻上醒来，寝衣已落在床尾。帐中没有旁人，静寂反倒让那份未得回应的渴望更加清晰。"
 latria_sexual_frustration_flavor.1101.desc.male: "我从床榻上醒来，寝衣已落在床尾。窗外一片沉寂，我却无法让心思停在睡意上。"
 latria_sexual_frustration_flavor.1101.desc: "床帐半垂，长夜未尽，念头仍旧纷乱。"
 latria_sexual_frustration_flavor.1101.a: "任由夜色过去"
 latria_sexual_frustration_flavor.1101.b: "起身点亮灯烛"

 latria_sexual_frustration_flavor.1102.t: "舞步间的目光"
 latria_sexual_frustration_flavor.1102.desc.accepted: "舞曲换了几支，席间的人也换了几轮。无人因一段过近的舞步而侧目，我却仍记得那一瞬的相望。"
 latria_sexual_frustration_flavor.1102.desc.strict: "舞步越近，周遭的笑声便越像窃窃私语。我不愿让旁人猜出心思，只把目光移向乐师。"
 latria_sexual_frustration_flavor.1102.desc: "乐声渐急，心思却没有随舞步散去。"
 latria_sexual_frustration_flavor.1102.a: "再邀一曲"
 latria_sexual_frustration_flavor.1102.b: "退到席边"

 latria_sexual_frustration_flavor.1103.t: "告解室的门"
 latria_sexual_frustration_flavor.1103.desc.favors: "告解者说，压下欲念并非唯一的虔敬之路。我本想追问更多，门外的脚步声却已停在门边。"
 latria_sexual_frustration_flavor.1103.desc.condemns: "告解者提醒我，贞洁不是只在众人面前才有分量。我低头应下，心里却仍盼着他不要再问。"
 latria_sexual_frustration_flavor.1103.desc: "告解室里灯火昏暗，我斟酌着该说什么。"
 latria_sexual_frustration_flavor.1103.a: "说出心中所想"
 latria_sexual_frustration_flavor.1103.b: "只谈职责与祈祷"

 latria_sexual_frustration_flavor.1104.t: "鹰未归巢"
 latria_sexual_frustration_flavor.1104.desc.lustful: "鹰盘旋在猎场上空，迟迟不肯落回手套。我几乎羡慕它能随心而去，不必向任何人解释。"
 latria_sexual_frustration_flavor.1104.desc.chaste: "鹰盘旋不下，侍从几次询问是否要收弓。我只说再等片刻，仿佛耐心能替我解决一切。"
 latria_sexual_frustration_flavor.1104.desc: "鹰迟迟不归，猎人们都在等我发话。"
 latria_sexual_frustration_flavor.1104.a: "让猎鹰继续盘旋"
 latria_sexual_frustration_flavor.1104.b: "收起弓箭回营"

 latria_sexual_frustration_flavor.1105.t: "烛台与王冠"
 latria_sexual_frustration_flavor.1105.desc.emperor: "近侍替我卸下礼冠，烛台上还留着几封未批的诏书。帝国安稳与否都系于我手，我却在意起一件无关国事的旧事。"
 latria_sexual_frustration_flavor.1105.desc.adventurer: "营地只剩最后一盏灯。我的同伴已经睡下，行囊旁那封未寄出的信却让我久久没有合眼。"
 latria_sexual_frustration_flavor.1105.desc.clergy: "我把法衣叠好，放在祈祷凳旁。誓词仍记得清楚，心中那道声音却从未像今夜这样难以压住。"
 latria_sexual_frustration_flavor.1105.desc.ruler: "侍从替我收起礼服，桌上的政务仍未处理完。我只想知道，若卸下身份片刻，心绪是否会安宁。"
 latria_sexual_frustration_flavor.1105.desc: "灯火将尽，我仍被一件心事牵住。"
 latria_sexual_frustration_flavor.1105.a: "把那封信交给信使"
 latria_sexual_frustration_flavor.1105.b: "亲手销毁它"

 latria_sexual_frustration_flavor.1106.t: "灯下难眠"
 latria_sexual_frustration_flavor.1106.desc.female: "我披着寝衣坐在床边，烛火映着窗上的影子。夜已深，心底那份未得回应的渴望却仍没有退去。"
 latria_sexual_frustration_flavor.1106.desc.male: "我披着寝衣坐在床边，窗外的守夜人已经走过两轮。我仍无法让心思归于平静。"
 latria_sexual_frustration_flavor.1106.desc: "烛火渐短，床帐间仍没有睡意。"
 latria_sexual_frustration_flavor.1106.a: "不再压下这份渴望"
 latria_sexual_frustration_flavor.1106.b: "躺下，等候天明"


 latria_sexual_frustration_flavor.1107.t: "回敬的一支舞"
 latria_sexual_frustration_flavor.1107.desc.accepted: "舞伴邀我再跳一支，旁人只当作寻常礼节。我却记得那只手短暂停留时，心底掠过的念头。"
 latria_sexual_frustration_flavor.1107.desc.strict: "舞伴邀我再跳一支，席间几道目光随即转来。我礼貌地应下，心里却担心流言会比乐声传得更远。"
 latria_sexual_frustration_flavor.1107.desc: "乐师奏起新的舞曲，我迟迟没有起身。"
 latria_sexual_frustration_flavor.1107.a: "接受邀舞"
 latria_sexual_frustration_flavor.1107.b: "留在座位上"

 latria_sexual_frustration_flavor.1108.t: "睡前的祷告"
 latria_sexual_frustration_flavor.1108.desc.favors: "我穿着寝衣在床边祈祷。信仰容许肉体欢愉的教诲仍在耳畔，可这份迫切并未因此平息。"
 latria_sexual_frustration_flavor.1108.desc.condemns: "我穿着寝衣跪在床边，重复贞洁的誓词。每念一句，心底的声音便更难忽略。"
 latria_sexual_frustration_flavor.1108.desc: "床边的烛火轻晃，祷词迟迟没有结束。"
 latria_sexual_frustration_flavor.1108.a: "继续诵读祷文"
 latria_sexual_frustration_flavor.1108.b: "起身吹灭烛火"

 latria_sexual_frustration_flavor.1109.t: "未决的议事"
 latria_sexual_frustration_flavor.1109.desc: "臣下已经列出几种处置办法，我却迟迟没有作出裁决。心思一次次偏离政务，连自己的沉默也显得格外漫长。"
 latria_sexual_frustration_flavor.1109.a: "结束今日议事"
 latria_sexual_frustration_flavor.1109.b: "命书记官继续记录"
 latria_sexual_frustration_flavor.1110.t: "深夜的房间"
 latria_sexual_frustration_flavor.1110.desc.clergy: "我披着寝衣回到修院小室。夜祷已毕，烛火也将熄去，我仍没有躺下。"
 latria_sexual_frustration_flavor.1110.desc.adventurer: "客栈中只剩几盏灯。我穿着寝衣坐在床沿，仍无法把心思从那封未寄出的信上移开。"
 latria_sexual_frustration_flavor.1110.desc: "门外的声响渐渐远去，我仍在床边等候。"
 latria_sexual_frustration_flavor.1110.a: "打开房门"
 latria_sexual_frustration_flavor.1110.b: "关上房门，回到床边"
