l_simp_chinese:
 trait_latria_wanton_bloom: "花柳"
 trait_latria_wanton_bloom_desc: "眠花宿柳的账，还得又慢又狠。形销骨立，气血日薄，维纳斯一寸一寸地讨还。"
 trait_latria_wanton_bloom_character_desc: "眠花宿柳的账，落到了[ROOT.GetCharacter.GetFirstNameNoTooltip]头上，还得又慢又狠。形销骨立，气血日薄，维纳斯一寸一寸地讨还。"
 trait_track_latria_wanton_bloom: "花柳"
 trait_track_latria_wanton_bloom_desc: "每一个清晨都比前一夜更轻、更虚。"
 trait_latria_bone_fire: "骨蒸"
 trait_latria_bone_fire_desc: "一股干热自骨髓里透出，如骨被蒸。盗汗浸透床褥，咳声里带着血丝。"
 trait_latria_bone_fire_character_desc: "一股干热自[ROOT.GetCharacter.GetFirstNameNoTooltip]的骨髓里透出，如骨被蒸。盗汗浸透床褥，咳声里带着血丝。"
 trait_track_latria_bone_fire: "骨蒸"
 trait_track_latria_bone_fire_desc: "每一夜，骨髓都烧得更旺一分。"
 trait_latria_wanton_madness: "风流癫"
 trait_latria_wanton_madness_desc: "欢愉在维纳斯手里凝成了疯。神思游荡，手足震颤，纵有良医也唤不回那点清明。"
 trait_latria_wanton_madness_character_desc: "欢愉在[ROOT.GetCharacter.GetFirstNameNoTooltip]身上凝成了疯。神思游荡，手足震颤，纵有良医也唤不回那点清明。"
 trait_track_latria_wanton_madness: "风流癫"
 trait_track_latria_wanton_madness_desc: "理智随着每一个月缺又远了一分。"
 trait_latria_bayberry_pox: "杨梅疮"
 trait_latria_bayberry_pox_desc: "寻花问柳的人带回来的不只是回忆。莓红的痘花在皮肤上绽开，久久不褪。"
 trait_latria_bayberry_pox_character_desc: "寻花问柳的[ROOT.GetCharacter.GetFirstNameNoTooltip]带回来的不只是回忆。莓红的痘花在皮肤上绽开，久久不褪。"
 trait_track_latria_bayberry_pox: "杨梅疮"
 trait_track_latria_bayberry_pox_desc: "新鲜的莓红痘花爬满了皮肤。"
 trait_latria_hidden_rot: "阴疽"
 trait_latria_hidden_rot_desc: "起初只是血里的一缕热毒，如今已陷进深处。腐坏自内而啮，将身子从根到梢蛀空。"
 trait_latria_hidden_rot_character_desc: "起初只是[ROOT.GetCharacter.GetFirstNameNoTooltip]血里的一缕热毒，如今已陷进深处。腐坏自内而啮，将身子从根到梢蛀空。"
 trait_track_latria_hidden_rot: "阴疽"
 trait_track_latria_hidden_rot_desc: "腐坏在皮下无声地蔓延。"
 latria_sti.1.t: "花柳入骨"
 latria_sti.1.desc: "血里的热、肉里的损——眠花宿柳一夜的账，如今到期了。[ROOT.GetCharacter.GetFirstNameNoTooltip]短时内难望复原。"
 latria_sti.1.a: "原来这就是维纳斯的讨价。"
 latria_sti.2.t: "骨蒸骤起"
 latria_sti.2.desc: "一股干热自骨髓里往上爬，天未亮床褥已被汗浸透。[ROOT.GetCharacter.GetFirstNameNoTooltip]咳着，血丝点点沾上了衣襟。"
 latria_sti.2.a: "血肉自内而焚。"
 latria_sti.3.t: "风流癫降"
 latria_sti.3.desc: "那一夜的欢愉在脑海里凝成了疯。[ROOT.GetCharacter.GetFirstNameNoTooltip]对着幻影说话，抖个不停的双手怎么也按不住。"
 latria_sti.3.a: "清明已不知游荡去了何处。"
 latria_sti.4.t: "杨梅疮发"
 latria_sti.4.desc: "莓红的痘花已在[ROOT.GetCharacter.GetFirstNameNoTooltip]的皮肤上绽开，久久不褪。这是花柳巷里带回的赠礼，人尽可见。"
 latria_sti.4.a: "可别错当春天来了。"
 latria_sti.5.t: "阴疽蔓延"
 latria_sti.5.desc: "血里那缕热毒已陷进深处。[ROOT.GetCharacter.GetFirstNameNoTooltip]只觉腐坏自内而啮，将身子从根到梢蛀空。"
 latria_sti.5.a: "它在暗处啃噬。"