l_simp_chinese:
 latria_sexual_frustration_flavor.1301.t: "未寄出的邀约"
 latria_sexual_frustration_flavor.1301.desc.female: "我穿着寝衣坐在书案前，信纸上只写了一个名字。侍女问是否要送出，我把纸折好，仍没有回答。"
 latria_sexual_frustration_flavor.1301.desc.male: "我穿着寝衣坐在书案前，信纸上只写了一个名字。门外的侍从等着传话，我却迟迟没有封上信。"
 latria_sexual_frustration_flavor.1301.desc: "一封没有封口的信，留在灯下许久。"
 latria_sexual_frustration_flavor.1301.a: "把信写完，交给侍从。"
 latria_sexual_frustration_flavor.1301.b: "把纸投入火中，压下心事。"

 latria_sexual_frustration_flavor.1302.t: "宫廷判词"
 latria_sexual_frustration_flavor.1302.desc.accepted: "宫廷诗人拿旧情作笑谈，连最严肃的贵族也没有皱眉。我笑着举杯，心里却没有半分轻松。"
 latria_sexual_frustration_flavor.1302.desc.strict: "一位贵族因私情失了体面，众人都在议论他的家族。我听着他们的评断，想起自己也站在同一把秤上。"
 latria_sexual_frustration_flavor.1302.desc: "席间的谈话转到了名誉与欲念。"
 latria_sexual_frustration_flavor.1302.a: "当众说起我自己的渴望。"
 latria_sexual_frustration_flavor.1302.b: "把话咽回去，借故退席。"

 latria_sexual_frustration_flavor.1303.t: "午夜钟声"
 latria_sexual_frustration_flavor.1303.desc.favors: "钟声过后，祭司仍留在门边。他说欲念可以被引向善处，我却不知道自己是否还愿意等待。"
 latria_sexual_frustration_flavor.1303.desc.condemns: "钟声一遍遍回荡，祭司诵读的誓词也一遍遍落在我心上。我跪得膝头发麻，答案仍没有出现。"
 latria_sexual_frustration_flavor.1303.desc: "午夜的祷告没有带来平静，钟声却仍在回响。"
 latria_sexual_frustration_flavor.1303.a: "把戒欲的训词留在殿内。"
 latria_sexual_frustration_flavor.1303.b: "压下念头，再诵一遍祷词。"

 latria_sexual_frustration_flavor.1304.t: "耐心的尽头"
 latria_sexual_frustration_flavor.1304.desc.lustful: "我在寝衣里踱过房间，侍从送来的棋盘仍未动过一枚棋子。等待已经成了另一种折磨。"
 latria_sexual_frustration_flavor.1304.desc.chaste: "我把寝衣的系带重新系紧，试图让每个动作都显得平静。越是谨慎，心中的渴望便越难忽视。"
 latria_sexual_frustration_flavor.1304.desc: "屋里很静，我却再也无法安坐。"
 latria_sexual_frustration_flavor.1304.a: "放下棋盘，任自己想起心上人。"
 latria_sexual_frustration_flavor.1304.b: "坐回书案前，把念头压下。"

 latria_sexual_frustration_flavor.1305.t: "夜深的寝室"
 latria_sexual_frustration_flavor.1305.desc.emperor: "宫廷散去，我仍穿着礼服留在寝室里。奏报已经批完，心事却没有随着众臣离去。"
 latria_sexual_frustration_flavor.1305.desc.adventurer: "同伴们已在客栈歇息，我却独自留在房中。行装已经收好，明日的路程也已安排，心绪却无处安放。"
 latria_sexual_frustration_flavor.1305.desc.clergy: "我独自在小室里停留，法衣仍穿在身上，床边的烛火已经暗了。誓言仍在，慰藉却没有到来。"
 latria_sexual_frustration_flavor.1305.desc.ruler: "我穿着礼服回到空荡的寝室。守卫在门外行礼，门内却没有人能替我分担心事。"
 latria_sexual_frustration_flavor.1305.desc: "房中空无一人，我却迟迟不愿上床。"
 latria_sexual_frustration_flavor.1305.a: "派人寻来熟人，把心事说开。"
 latria_sexual_frustration_flavor.1305.b: "把话咽回去，独自等到天亮。"

 latria_sexual_frustration_flavor.1306.t: "午夜的信使"
 latria_sexual_frustration_flavor.1306.desc.female: "我披着寝衣坐在床边，听见门外有人轻叩两下。侍女送来的只有一封空白信纸，我却知道自己在等谁的消息。"
 latria_sexual_frustration_flavor.1306.desc.male: "我披着寝衣打开房门，走廊上已经空无一人。门槛旁的信笺没有署名，却让我无法再入睡。"
 latria_sexual_frustration_flavor.1306.desc: "门外的脚步声远去，桌上的信纸仍未落笔。"
 latria_sexual_frustration_flavor.1306.a: "写下那句迟疑已久的话。"
 latria_sexual_frustration_flavor.1306.b: "收起信纸，把心事压下。"

 latria_sexual_frustration_flavor.1307.t: "席间的沉默"
 latria_sexual_frustration_flavor.1307.desc.accepted: "诗人吟起一段旧情，众人听得兴致盎然。我举杯附和，心里却想起一段无人提及的往事。"
 latria_sexual_frustration_flavor.1307.desc.strict: "席间谈到一位因私情失宠的贵族，笑声很快停了。我把目光转向窗外，不愿让人看出自己的神色。"
 latria_sexual_frustration_flavor.1307.desc: "酒杯仍在传递，谈话却停在了最不该停留的话题上。"
 latria_sexual_frustration_flavor.1307.a: "借酒兴讲起我自己的情事。"
 latria_sexual_frustration_flavor.1307.b: "把话咽回去，起身告退。"

 latria_sexual_frustration_flavor.1308.t: "守夜祷词"
 latria_sexual_frustration_flavor.1308.desc.favors: "守夜的钟声响过，我仍在圣所里祈祷。教义并不排斥肉体欢愉，我却不知该如何面对这份长久未歇的渴望。"
 latria_sexual_frustration_flavor.1308.desc.condemns: "我在圣所中反复诵念贞洁的祷词。钟声渐远，心中的念头仍没有退去。"
 latria_sexual_frustration_flavor.1308.desc: "烛火映着空荡的长椅，我仍没有起身。"
 latria_sexual_frustration_flavor.1308.a: "暂放戒欲的祷词，循着自己的心意离开。"
 latria_sexual_frustration_flavor.1308.b: "把欲念压下，守完夜祷。"

 latria_sexual_frustration_flavor.1309.t: "镜前的目光"
 latria_sexual_frustration_flavor.1309.desc.lustful: "我未着衣物，独自在寝室的铜镜前站了片刻。镜中的神情没有改变，我却不想再把欲念称作一时软弱。"
 latria_sexual_frustration_flavor.1309.desc.chaste: "我未着衣物，坐在床沿默念誓词。每个字都记得清楚，心头的渴望却没有因此消失。"
 latria_sexual_frustration_flavor.1309.desc: "屋里没有旁人，镜中的沉默却令我无法回避自己。"
 latria_sexual_frustration_flavor.1309.a: "承认这份心意，容自己想下去。"
 latria_sexual_frustration_flavor.1309.b: "披衣回到书案前，把心事压下。"

 latria_sexual_frustration_flavor.1310.t: "夜深未眠"
 latria_sexual_frustration_flavor.1310.desc.clergy: "夜祷之后，我回到自己的小室。法衣尚未更换，床边烛火已暗，我仍不愿躺下。"
 latria_sexual_frustration_flavor.1310.desc.adventurer: "同伴已在客栈歇下，我独自在房中收好行装。明日的路程清楚，心里的去处却不明。"
 latria_sexual_frustration_flavor.1310.desc: "夜色已深，房门关上，我仍无法安睡。"
 latria_sexual_frustration_flavor.1310.a: "写信给一位旧识，把心事说清。"
 latria_sexual_frustration_flavor.1310.b: "把念头压下，独自守到天明。"

 latria_sexual_frustration_flavor.1301.c: "另取一纸，把邀约写成诗。"
 latria_sexual_frustration_flavor.1302.c: "把话题转回家族与封地。"
 latria_sexual_frustration_flavor.1302.d: "讲个旅途笑话，让众人重新举杯。"
 latria_sexual_frustration_flavor.1303.c: "留到天明，逐句研读经卷。"
 latria_sexual_frustration_flavor.1304.c: "摆开棋子，独自推演残局。"
 latria_sexual_frustration_flavor.1304.d: "从第一步开始，慢慢下完一局。"
 latria_sexual_frustration_flavor.1305.c: "拟好清晨的事务，再吹灭烛火。"
 latria_sexual_frustration_flavor.1307.c: "念一首新诗，把众人的目光引向别处。"
 latria_sexual_frustration_flavor.1308.c: "合起祷书，静坐梳理心绪。"
 latria_sexual_frustration_flavor.1308.d: "守到晨祷，替众人备好经卷。"
 latria_sexual_frustration_flavor.1309.c: "写下我不愿对人说的那句话。"
 latria_sexual_frustration_flavor.1310.c: "煮一壶茶，慢慢收拾手边物品与书卷。"
