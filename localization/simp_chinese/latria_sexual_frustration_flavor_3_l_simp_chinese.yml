l_simp_chinese:
 latria_sexual_frustration_flavor.1201.t: "无人赴约的时辰"
 latria_sexual_frustration_flavor.1201.desc.female: "我穿着寝衣在窗前等了许久，桌上的茶早已凉透。那场相会从未约定，我却总在心中替它留出位置。"
 latria_sexual_frustration_flavor.1201.desc.male: "我穿着寝衣在窗前等了许久，庭院里只有夜巡的脚步。没有人会来，我仍不愿立刻熄灯。"
 latria_sexual_frustration_flavor.1201.desc: "烛芯烧短了，窗外始终没有动静。"
 latria_sexual_frustration_flavor.1201.a: "等到烛火熄灭"
 latria_sexual_frustration_flavor.1201.b: "吹熄灯烛"

 latria_sexual_frustration_flavor.1202.t: "浴堂前的风声"
 latria_sexual_frustration_flavor.1202.desc.accepted: "浴堂外的谈笑声不曾因谁与谁同行而停下。这样的寻常景象本该使我不以为意，我却想起自己许久没有如此自在。"
 latria_sexual_frustration_flavor.1202.desc.strict: "浴堂门外，几名贵族正谈论谁该避开谁。我听见自己的名字，谈话随即停住。"
 latria_sexual_frustration_flavor.1202.desc: "浴堂里水声不断，门外的人声却更令我分神。"
 latria_sexual_frustration_flavor.1202.a: "留在众人中间"
 latria_sexual_frustration_flavor.1202.b: "从侧门离开"

 latria_sexual_frustration_flavor.1203.t: "祈祷后的沉默"
 latria_sexual_frustration_flavor.1203.desc.favors: "祭司说，人的欲望并非天生有罪。我想相信他的话，可心头的空缺并未因此缩小。"
 latria_sexual_frustration_flavor.1203.desc.condemns: "祭司谈起禁欲的美德，随后便沉默下来。我跪在原处，祷词熟悉，心绪却远远落在别处。"
 latria_sexual_frustration_flavor.1203.desc: "祷告结束了，殿中的钟声仍在回响。"
 latria_sexual_frustration_flavor.1203.a: "留在殿中片刻"
 latria_sexual_frustration_flavor.1203.b: "起身离开"

 latria_sexual_frustration_flavor.1204.t: "猎场空弦"
 latria_sexual_frustration_flavor.1204.desc.lustful: "我独自在寝室里，未着衣物，弓弦的回响却始终留在耳边。身体疲倦，心思仍追着猎场上的每一道影子。"
 latria_sexual_frustration_flavor.1204.desc.chaste: "我独自在寝室里，未着衣物，试图把心思放回祈祷与职责。每次闭眼，那份渴望便又浮上来。"
 latria_sexual_frustration_flavor.1204.desc: "猎场空了，心头的躁动却迟迟不散。"
 latria_sexual_frustration_flavor.1204.a: "不再抵挡这阵心绪"
 latria_sexual_frustration_flavor.1204.b: "披衣回到书桌前"

 latria_sexual_frustration_flavor.1205.t: "封锁的议事厅"
 latria_sexual_frustration_flavor.1205.desc.emperor: "我命人清空议事厅，只留下地图与我的礼服倒影。皇帝的每句话都要有人听见，连独处也像一场表演。"
 latria_sexual_frustration_flavor.1205.desc.adventurer: "队伍在山道旁扎营。我替众人安排守夜，却把最难捱的时辰留给了自己。"
 latria_sexual_frustration_flavor.1205.desc.clergy: "我独自留在礼拜堂，法衣整齐，烛台已经暗了。誓言仍在，慰藉却没有到来。"
 latria_sexual_frustration_flavor.1205.desc.ruler: "侍从守在门外，我命他们不许打扰。桌上的印玺与礼服都提醒我，统治者也没有可以卸下的心事。"
 latria_sexual_frustration_flavor.1205.desc: "我把门关上，却没有因此获得片刻安宁。"
 latria_sexual_frustration_flavor.1205.a: "把守门的人叫进来"
 latria_sexual_frustration_flavor.1205.b: "独自守到天明"

 latria_sexual_frustration_flavor.1206.t: "席边的流言"
 latria_sexual_frustration_flavor.1206.desc.accepted: "有人在宴席上谈起情人，语气轻松得像在谈天气。我本想一笑置之，却发现自己已很久没有这样的闲谈。"
 latria_sexual_frustration_flavor.1206.desc.strict: "几名贵族谈起一位因失仪而失宠的同僚，随后有人提到了我的名字。我低头理了理袖口，没有加入谈话。"
 latria_sexual_frustration_flavor.1206.desc: "乐声隔着人群传来，席间的交谈却更令我分神。"
 latria_sexual_frustration_flavor.1206.a: "走进人群"
 latria_sexual_frustration_flavor.1206.b: "沿侧廊离开"

 latria_sexual_frustration_flavor.1207.t: "祈祷后的空座"
 latria_sexual_frustration_flavor.1207.desc.favors: "礼拜结束后，祭司把经卷留在座上便离开了。信仰并不把欲念视作罪，我却仍不知如何平复心绪。"
 latria_sexual_frustration_flavor.1207.desc.condemns: "祭司离开后，我仍跪在原处。贞洁的教诲清晰无误，心中那份渴望却没有消退。"
 latria_sexual_frustration_flavor.1207.desc: "殿中只剩我与未熄的烛火。"
 latria_sexual_frustration_flavor.1207.a: "留在座上默祷"
 latria_sexual_frustration_flavor.1207.b: "合上经卷离开"

 latria_sexual_frustration_flavor.1208.t: "林间的追猎"
 latria_sexual_frustration_flavor.1208.desc.lustful: "猎物穿过林间，众人追了上去。我也策马跟随，心思却仍被另一份渴望牵住。"
 latria_sexual_frustration_flavor.1208.desc.chaste: "我勒住马缰，提醒自己此行只为狩猎。猎犬的吠声渐远，念头却迟迟没有散去。"
 latria_sexual_frustration_flavor.1208.desc: "队伍在林间停下，等我决定是否继续追踪。"
 latria_sexual_frustration_flavor.1208.a: "继续追进树林"
 latria_sexual_frustration_flavor.1208.b: "让猎犬收队"

 latria_sexual_frustration_flavor.1209.t: "窗边的余烬"
 latria_sexual_frustration_flavor.1209.desc.female: "我穿着寝衣坐在窗边，炉火只剩一线余烬。白日里未曾说出口的话，此刻又在心头翻涌。"
 latria_sexual_frustration_flavor.1209.desc.male: "我穿着寝衣倚着窗框，望着庭院里巡夜的灯火。那段未得回应的情意仍不肯退去。"
 latria_sexual_frustration_flavor.1209.desc: "窗外寂静，炉火渐暗，我却毫无睡意。"
 latria_sexual_frustration_flavor.1209.a: "把念头写在纸上"
 latria_sexual_frustration_flavor.1209.b: "添柴后回到床上"

 latria_sexual_frustration_flavor.1210.t: "无人叩门"
 latria_sexual_frustration_flavor.1210.desc.emperor: "我独自在内室卸下礼冠，门外的近侍仍在等候。帝国的重担没有让我忘记那件始终无法言明的私事。"
 latria_sexual_frustration_flavor.1210.desc.adventurer: "同伴已经在营地歇下，我守着一封未寄出的信。明日仍要启程，心事却无法留在此地。"
 latria_sexual_frustration_flavor.1210.desc.clergy: "我把法衣挂在床边，独自在小室里默祷。誓词仍在耳畔，心绪却没有因此平静。"
 latria_sexual_frustration_flavor.1210.desc.ruler: "我独自在寝室里解开礼服袖扣，门外的守卫没有听见我的叹息。权位并未替我安顿这份心事。"
 latria_sexual_frustration_flavor.1210.desc: "夜色已深，我仍独自守着这桩心事。"
 latria_sexual_frustration_flavor.1210.a: "叫来一位可信之人"
 latria_sexual_frustration_flavor.1210.b: "独自熬过长夜"
