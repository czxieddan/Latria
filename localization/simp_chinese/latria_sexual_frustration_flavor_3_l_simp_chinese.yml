l_simp_chinese:
 latria_sexual_frustration_flavor.1201.t: "无人赴约的时辰"
 latria_sexual_frustration_flavor.1201.desc.female: "我穿着寝衣在窗前等了许久，桌上的茶早已凉透。那场相会从未约定，我却总在心中替它留出位置。"
 latria_sexual_frustration_flavor.1201.desc.male: "我穿着寝衣在窗前等了许久，庭院里只有夜巡的脚步。没有人会来，我仍不愿立刻熄灯。"
 latria_sexual_frustration_flavor.1201.desc: "烛芯烧短了，窗外始终没有动静。"
 latria_sexual_frustration_flavor.1201.a: "把想说的话写下来。"
 latria_sexual_frustration_flavor.1201.b: "吹熄灯烛，压下这场空等。"

 latria_sexual_frustration_flavor.1202.t: "浴堂前的风声"
 latria_sexual_frustration_flavor.1202.desc.accepted: "浴堂外的谈笑声不曾因谁与谁同行而停下。这样的寻常景象本该使我不以为意，我却想起自己许久没有如此自在。"
 latria_sexual_frustration_flavor.1202.desc.strict: "浴堂门外，几名贵族正谈论谁该避开谁。我听见自己的名字，谈话随即停住。"
 latria_sexual_frustration_flavor.1202.desc: "浴堂里水声不断，门外的人声却更令我分神。"
 latria_sexual_frustration_flavor.1202.a: "向众人坦言，我也盼着一场相会。"
 latria_sexual_frustration_flavor.1202.b: "收起心思，从侧门离开。"

 latria_sexual_frustration_flavor.1203.t: "祈祷后的沉默"
 latria_sexual_frustration_flavor.1203.desc.favors: "祭司说，人的欲望并非天生有罪。我想相信他的话，可心头的空缺并未因此缩小。"
 latria_sexual_frustration_flavor.1203.desc.condemns: "祭司谈起禁欲的美德，随后便沉默下来。我跪在原处，祷词熟悉，心绪却远远落在别处。"
 latria_sexual_frustration_flavor.1203.desc: "祷告结束了，殿中的钟声仍在回响。"
 latria_sexual_frustration_flavor.1203.a: "暂且不再奉行戒欲的训诫。"
 latria_sexual_frustration_flavor.1203.b: "压下念头，重新诵读祷词。"

 latria_sexual_frustration_flavor.1204.t: "猎归未宁"
 latria_sexual_frustration_flavor.1204.desc.lustful: "我独自在寝室里，未着衣物，弓弦的回响却始终留在耳边。身体疲倦，心思仍追着猎场上的每一道影子。"
 latria_sexual_frustration_flavor.1204.desc.chaste: "我独自在寝室里，未着衣物，试图把心思放回祈祷与职责。每次闭眼，那份渴望便又浮上来。"
 latria_sexual_frustration_flavor.1204.desc: "猎场空了，心头的躁动却迟迟不散。"
 latria_sexual_frustration_flavor.1204.a: "容自己回想猎场上那道身影。"
 latria_sexual_frustration_flavor.1204.b: "披衣回到书桌前，把心事压下。"

 latria_sexual_frustration_flavor.1205.t: "紧闭的书房"
 latria_sexual_frustration_flavor.1205.desc.emperor: "我命人退出书房，留下地图、印玺与未完的文书。抽屉里的旧信被我翻了出来，却迟迟不敢再读。"
 latria_sexual_frustration_flavor.1205.desc.adventurer: "路程与轮值已经写在纸上，同伴们等在门外。我替所有人排好休息的时辰，轮到自己时，却又想起那封旧信。"
 latria_sexual_frustration_flavor.1205.desc.clergy: "我独自坐在书房，账簿未合，经卷也没有收起。书页间夹着一封旧信，我已经几次伸手又缩回。"
 latria_sexual_frustration_flavor.1205.desc.ruler: "侍从守在书房门外，我命他们不许打扰。印玺与文书摆在面前，抽屉里的旧信却迟迟没有收回。"
 latria_sexual_frustration_flavor.1205.desc: "我把书房门关上，旧信与未完的事务都还留在桌上。"
 latria_sexual_frustration_flavor.1205.a: "把事务留到明日，重读旧信。"
 latria_sexual_frustration_flavor.1205.b: "压下旧情，继续处理手边事务。"

 latria_sexual_frustration_flavor.1206.t: "席边的流言"
 latria_sexual_frustration_flavor.1206.desc.accepted: "有人在宴席上谈起情人，语气轻松得像在谈天气。我本想一笑置之，却发现自己已很久没有这样的闲谈。"
 latria_sexual_frustration_flavor.1206.desc.strict: "几名贵族谈起一位因失仪而失宠的同僚，随后有人提到了我的名字。我低头理了理袖口，没有加入谈话。"
 latria_sexual_frustration_flavor.1206.desc: "乐声隔着人群传来，席间的交谈却更令我分神。"
 latria_sexual_frustration_flavor.1206.a: "讲起自己的旧情，不再顾忌旁人。"
 latria_sexual_frustration_flavor.1206.b: "把话咽回去，沿侧廊离开。"

 latria_sexual_frustration_flavor.1207.t: "祈祷后的空座"
 latria_sexual_frustration_flavor.1207.desc.favors: "礼拜结束后，祭司把经卷留在座上便离开了。信仰并不把欲念视作罪，我却仍不知如何平复心绪。"
 latria_sexual_frustration_flavor.1207.desc.condemns: "祭司离开后，我仍跪在原处。贞洁的教诲清晰无误，心中那份渴望却没有消退。"
 latria_sexual_frustration_flavor.1207.desc: "殿中只剩我与未熄的烛火。"
 latria_sexual_frustration_flavor.1207.a: "离开殿堂，把心思还给那段情意。"
 latria_sexual_frustration_flavor.1207.b: "把欲念压下，重读戒律。"

 latria_sexual_frustration_flavor.1208.t: "林间的追猎"
 latria_sexual_frustration_flavor.1208.desc.lustful: "猎物穿过林间，众人追了上去。我也策马跟随，心思却仍被另一份渴望牵住。"
 latria_sexual_frustration_flavor.1208.desc.chaste: "我勒住马缰，提醒自己此行只为狩猎。猎犬的吠声渐远，念头却迟迟没有散去。"
 latria_sexual_frustration_flavor.1208.desc: "队伍在林间停下，等我决定是否继续追踪。"
 latria_sexual_frustration_flavor.1208.a: "让同伴先走，独自想一会儿心事。"
 latria_sexual_frustration_flavor.1208.b: "收回心思，继续率队追踪。"

 latria_sexual_frustration_flavor.1209.t: "窗边的余烬"
 latria_sexual_frustration_flavor.1209.desc.female: "我穿着寝衣坐在窗边，炉火只剩一线余烬。白日里未曾说出口的话，此刻又在心头翻涌。"
 latria_sexual_frustration_flavor.1209.desc.male: "我穿着寝衣倚着窗框，望着庭院里巡夜的灯火。那段未得回应的情意仍不肯退去。"
 latria_sexual_frustration_flavor.1209.desc: "窗外寂静，炉火渐暗，我却毫无睡意。"
 latria_sexual_frustration_flavor.1209.a: "把念头写在纸上。"
 latria_sexual_frustration_flavor.1209.b: "添柴后躺下，把心事压回去。"

 latria_sexual_frustration_flavor.1210.t: "无人叩门"
 latria_sexual_frustration_flavor.1210.desc.emperor: "近侍已替我收好礼冠，我披着寝衣独坐床边。帝国的重担没有让我忘记那件始终无法言明的私事。"
 latria_sexual_frustration_flavor.1210.desc.adventurer: "同伴已经在客栈歇下，我披着寝衣守着一封未寄出的信。明日仍要启程，心事却无法留在此地。"
 latria_sexual_frustration_flavor.1210.desc.clergy: "我把法衣挂在床边，披着寝衣独坐小室。誓词仍在耳畔，心绪却没有因此平静。"
 latria_sexual_frustration_flavor.1210.desc.ruler: "礼服已经收起，我披着寝衣留在床边。门外的守卫没有听见我的叹息，权位也未替我安顿这份心事。"
 latria_sexual_frustration_flavor.1210.desc: "夜色已深，我仍独自守着这桩心事。"
 latria_sexual_frustration_flavor.1210.a: "叫来可信之人，把心事说完。"
 latria_sexual_frustration_flavor.1210.b: "把话咽回去，独自熬过长夜。"

 latria_sexual_frustration_flavor.1202.c: "换个话题，问候同行者。"
 latria_sexual_frustration_flavor.1202.d: "邀众人一同饮茶，谈到兴尽。"
 latria_sexual_frustration_flavor.1203.c: "请祭司留下，一同研读教诲。"
 latria_sexual_frustration_flavor.1204.c: "披好寝衣，慢慢理清白日里的念头。"
 latria_sexual_frustration_flavor.1205.c: "排好轮值，给自己留一段歇息。"
 latria_sexual_frustration_flavor.1205.d: "将明日的事务逐项列好。"
 latria_sexual_frustration_flavor.1206.c: "借一首新诗，把席间话头带开。"
 latria_sexual_frustration_flavor.1207.c: "坐到经卷前，读完这一章。"
 latria_sexual_frustration_flavor.1208.c: "让马歇脚，慢慢辨清足迹。"
 latria_sexual_frustration_flavor.1209.c: "添柴煮茶，读一段旧书。"
 latria_sexual_frustration_flavor.1209.d: "把未说的话写成一首诗。"
 latria_sexual_frustration_flavor.1210.c: "拟好明日安排，逐件整顿手边事务。"
