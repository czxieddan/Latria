l_simp_chinese:
 latria_sexual_frustration_flavor.1211.t: "不肯熄的灯"
 latria_sexual_frustration_flavor.1211.desc: "屋里静得能听见灯芯响。我没有叫谁来，却还是摆了两只杯子，第二只空着。面包还搁在正午留下的那块布底下。\n\n我记着的是门洞里那一下，肩膀靠着肩膀，那个分量，两个人都没有动，有一口气那么长。皮肉记住了。这个时辰它又回来，寝衣底下，催得人没法安静，我把手掌按在小腹上，想把它压回去。膝弯后面，再往下，手掌按上去也压不住。\n\n灯芯歪了。我把空杯转过来，让杯柄朝着那把椅子。"
 latria_sexual_frustration_flavor.1211.a: "吹灯，自己把这一夜过完。"
 latria_sexual_frustration_flavor.1211.b: "剪短灯芯，把凉茶喝了，睡。"
 latria_sexual_frustration_flavor.1211.c: "读书，读到字句不再绕回去。"

 latria_sexual_frustration_flavor.1212.t: "议事未散"
 latria_sexual_frustration_flavor.1212.desc: "奏报一条条念下来，我一句也没听进去。总管站在案边，两手背在身后，从第二页起我就在看那道喉颈。火在我背后响了一下，又落回去。\n\n探身去挪蜡烛的那一下，袖子擦过我的手腕。谁都没有说话。屋里是热蜡和湿羊毛的味道。我可以散会。这两个字已经在我嘴里，我把它含着。\n\n书记问我是否已经定夺。我什么都没定。"
 latria_sexual_frustration_flavor.1212.a: "散会，编一桩差事留下那人。"
 latria_sexual_frustration_flavor.1212.b: "逐条裁断，眼睛只放在纸上。"
 latria_sexual_frustration_flavor.1212.c: "把文书搬到舆图案上，连夜看。"

 latria_sexual_frustration_flavor.1213.t: "夜色有什么用"
 latria_sexual_frustration_flavor.1213.desc: "门已闩上。我没有穿衣，被单被我一脚踢到地上。屋里有蜡烛的味道，也有我自己皮肉的味道。\n\n身子从白天就吵，这会儿更吵。我任两膝分开，手从小腹往下，再往下，我不必假装自己在做别的事。来的是锁骨上一张嘴，手腕被按住，而我欢喜那样，我跟着它，直到胯离开床褥，呼吸在黑里散开。\n\n事后房间还是这个房间。我用手臂盖着眼睛。蜡烛烧成一小滩，我没有睡。"
 latria_sexual_frustration_flavor.1213.a: "让手做完，然后睡。"
 latria_sexual_frustration_flavor.1213.b: "把被单捡回床上，一动不动躺到天亮。"
 latria_sexual_frustration_flavor.1213.c: "穿衣下楼，沿墙走到天色发白。"
 latria_sexual_frustration_flavor.1213.d: "再来一次，再一次，直到蜡烛烧尽。"

 latria_sexual_frustration_flavor.1214.t: "晨祷之前"
 latria_sexual_frustration_flavor.1214.desc: "教堂里只剩我一人，还有我该剪的几盏灯。寒气从石板里往上冒。法衣底下，我的身子是暖的，醒着的，对时辰毫无兴趣。圣像看着我，看的是门那边。\n\n这桩事的经文我会背。我在门边那只木箱里对别人念过。对自己念一点用也没有。那点欲念像一块咽下去的炭，坐在肋骨后面。我把手掌平贴在祭台的石头上，按到发疼。我念的正是替别人算罪时用的那种口气。\n\n钟就要响了。我的手还在石上，石头已经不凉。"
 latria_sexual_frustration_flavor.1214.a: "亲手了结这欲念，事后再求赦。"
 latria_sexual_frustration_flavor.1214.b: "跪完这一轮日课，让时辰把它磨掉。"
 latria_sexual_frustration_flavor.1214.c: "翻开书，把圣咏读到字句撑得住。"

 latria_sexual_frustration_flavor.1215.t: "案下的膝"
 latria_sexual_frustration_flavor.1215.desc: "厅里正闹。不知谁的猎犬钻在长凳底下，酒已经转过两圈。邻座自鹿肉上桌起，就没把膝头从我的膝头挪开。我们相触的那一处凳面已经暖了。灯草被踩碎，一股酒气。\n\n每回满桌笑倒，那处压力就挪一下，再回来。边境的争执我早不听了。我把手放在那只手旁的凳面上，放着不动。那人看那手，又看远处的墙，膝头没有走。我的膝已经麻了，我没有挪。\n\n一只杯子倒了。酒淌到边沿，滴下去。没有人动。"
 latria_sexual_frustration_flavor.1215.a: "就在这里说明白，让整个厅堂听见。"
 latria_sexual_frustration_flavor.1215.b: "谢过席上，起身到外面透气。"
 latria_sexual_frustration_flavor.1215.c: "转向那人，随便说些别的，说到炉火低下去。"

 latria_sexual_frustration_flavor.1216.t: "园中袖"
 latria_sexual_frustration_flavor.1216.desc: "牡丹过了最好的时候，花匠也懒得再装忙。我们绕着池子走远的那一圈，因为近的那条通到角门。天色淡得像一杯泡久的茶。\n\n袖子一再碰到我的手背。在我自己家里，这样碰一下就已经是定了的事。在这里只是一只袖子，读它的人是我。我放慢脚步，那脚步也慢下来。水里映着两个人，谁都没有先动。在我家里，这样碰一下，说亲的人不等茶凉就进了门。\n\n前面就是角门。那人在那儿停下，回头看了一眼。我鞋下有花瓣。"
 latria_sexual_frustration_flavor.1216.a: "当面问一句，回到家里我自己担着。"
 latria_sexual_frustration_flavor.1216.b: "拱手，把手收进袖里，进门去。"
 latria_sexual_frustration_flavor.1216.c: "独自再绕池子一圈，绕到掌灯。"

 latria_sexual_frustration_flavor.1217.t: "归途尚远"
 latria_sexual_frustration_flavor.1217.desc: "天没亮就上了鞍，这三里地我一直知道前面那个骑手。那人坐下的样子。浅滩上回头的那一眼。大腿磨得发疼，嘴里发干，可我盯着那背影的理由不是这些。\n\n鹿早没了，赶猎人散在四处，谁也不会多问一句耽搁。我握缰的手是冷的，别处一点也不冷。我夹一下马腹，把那段距离收拢到没有。林子里的水滴得一声一声。\n\n前面的人听见声音回头，等着。林子里全是湿叶子，马在喷气。"
 latria_sexual_frustration_flavor.1217.a: "把人带进树里，晚些回去。"
 latria_sexual_frustration_flavor.1217.b: "骑到猎屋去，把这念头浸进冷水。"
 latria_sexual_frustration_flavor.1217.c: "下马看蹄印，看到手不再抖。"

 latria_sexual_frustration_flavor.1218.t: "借来的书"
 latria_sexual_frustration_flavor.1218.desc: "让我睡在库房里的那位学者留给我一盏灯，和一本我读不太通的书。雨打着窗板。从上个镇子起我的身子就没安分过，这张窄床更糟。有一股湿茅草的味。风一进来，灯就冒烟。\n\n那人进来看灯芯，站在书架前，手指搭在架上，身上的墨味我闻得到。我请人留下，讲讲这一页。肩靠在我肩上的时候，谁都没有挪开。文法我一句也没听进去。\n\n雨小了。手指还停在同一行。"
 latria_sexual_frustration_flavor.1218.a: "唱歌，唱得难听，让这股劲有个去处。"
 latria_sexual_frustration_flavor.1218.b: "谢过，吹灯，背对着门躺下。"
 latria_sexual_frustration_flavor.1218.c: "请人讲下去，我的手放在书页上。"
 latria_sexual_frustration_flavor.1218.d: "把这一段抄三遍，抄到手酸得再想不到别的。"

 latria_sexual_frustration_flavor.1219.t: "厅后小屋"
 latria_sexual_frustration_flavor.1219.desc: "宴席散到院子里去了，我们两个却落到厅后那间堆备用长凳的小屋。那人背抵着门，手掌平贴在我胸口，笑着等我。\n\n我解腰带的扣，再解带子，那人笑我手笨，索性帮我。嘴在我喉上，腿挤进我腿间，我早不装了。我们在长凳上慢慢来，头发松下来，我的呼吸散掉，直到那身子抖起来，我跟上。\n\n事后那只手还攥着我的手腕。厅里又起了乐。"
 latria_sexual_frustration_flavor.1219.a: "把实情说出来，攥着那只手不放。"
 latria_sexual_frustration_flavor.1219.b: "整好衣裳，谢过，回厅里去。"
 latria_sexual_frustration_flavor.1219.c: "在长凳上坐到乐止。"

 latria_sexual_frustration_flavor.1220.t: "我守的夜"
 latria_sexual_frustration_flavor.1220.desc: "我说这一夜我来守，他们就把教堂留给我。子时过了又过。我膝头发疼，身子不肯安静。一炷蜡烛，还有上周的香。石板把我脚上的热气都吸走了。\n\n一闭眼，就是两年前那支舞上按在我腰后的那只手，我只好再睁开。烛火把影子投到墙上。要止住这个只消一会儿，谁也不会知道，麻烦正在这里。\n\n门口有风。影子在墙上动。"
 latria_sexual_frustration_flavor.1220.a: "就在这里亲手了结，对圣徒说实话。"
 latria_sexual_frustration_flavor.1220.b: "跪到窗纸发白。"
 latria_sexual_frustration_flavor.1220.c: "把日课念出声，念到屋里只剩我的声音。"

 latria_sexual_frustration_flavor.1221.t: "使者的手套"
 latria_sexual_frustration_flavor.1221.desc: "使者在厅里住了三日，我一日一日数着。脱手套翻条约纸页的那只手，一根手指一根手指地脱，关于河的那一条我已经看丢两回。火已经烧尽，没有人去添柴。\n\n臣属们看着我听不进去。城里有一处地方，谁也不问名字。这个念头从第二天早上起就压在我胸口，沉，暖，很不成体统。那一道门我一年没去过了。\n\n手套递过来，让我看那枚印。我接了。手套还是温的。"
 latria_sexual_frustration_flavor.1221.a: "签，遣散众人，今夜下城去。"
 latria_sexual_frustration_flavor.1221.b: "再读一遍那一条，手放在案上。"
 latria_sexual_frustration_flavor.1221.c: "一条条议下去，议到烛短。"
 latria_sexual_frustration_flavor.1221.d: "去打听城里哪一道门最清静。"

 latria_sexual_frustration_flavor.1222.t: "不肯放的手"
 latria_sexual_frustration_flavor.1222.desc: "舞曲转到慢拍，我从一双手被传到另一双手。最后这一双，乐停了也没放。烛火和别人的酒气把厅里熏得发热。灯草踩平了，烛泪在流。\n\n拇指压在我的指节上。满堂都在看，又都装作没看，我耳根发热，手没有抽回来。乐师那边有人笑。那只手紧了一下，是有意的，我的身子先于我脸上摆好的样子应了。我的手被握着，不稳。音乐在我背后又起。\n\n手松了。指印留在手背上。"
 latria_sexual_frustration_flavor.1222.a: "就在这里把我要的说出来，让满堂听。"
 latria_sexual_frustration_flavor.1222.b: "谢过这支舞，退回人群里。"
 latria_sexual_frustration_flavor.1222.c: "走到门边去，说些马的事。"

 latria_sexual_frustration_flavor.1223.t: "浅滩"
 latria_sexual_frustration_flavor.1223.desc: "我们在浅滩停下饮马，天热得半队人都下了水。我站在平石上拧衬衫，一抬头，看见还有一个留在鞍上，看着。水在石上响得厉害。马喝着水，倒蹄。\n\n我抬眼撞上那道目光，它没有转开。水顺着肋骨往下，从手腕滴走。这一个下午和这一整片林子够我做很多事，身子已经替我定了，定得我再想马的事都难。水冷到我的小腿。\n\n那人下马。缰绳还在手里。"
 latria_sexual_frustration_flavor.1223.a: "扔了衬衫，当着愿意看的人的面走过去。"
 latria_sexual_frustration_flavor.1223.b: "把衬衫穿回去，先骑去猎屋。"
 latria_sexual_frustration_flavor.1223.c: "放鹰出去，把两只手忙到队伍备好。"

 latria_sexual_frustration_flavor.1224.t: "草原上的两骑"
 latria_sexual_frustration_flavor.1224.desc: "草高得能藏住一匹马，天是雨前的样子。自兽群转向起我们并肩骑了许久，腿这一程一直贴着我的腿，谁都没有去纠正。风里有踩碎草茎的气味。马腿湿到膝。\n\n在这里没有墙可躲，也没有半日路程以内的祭司。这从未让那点欲念变简单，只让它变大，跟这片地一样大。我不再装作不知道这是要往哪里去。\n\n那人在坡顶勒住马，回头看我一眼。头几点雨落下来。"
 latria_sexual_frustration_flavor.1224.a: "牵住那只手，下到深草里去。"
 latria_sexual_frustration_flavor.1224.b: "点头，拨马，赛回车队。"
 latria_sexual_frustration_flavor.1224.c: "把靶立在远柱，射到两臂发抖。"

 latria_sexual_frustration_flavor.1225.t: "告解之后"
 latria_sexual_frustration_flavor.1225.desc: "我在木箱里跪下，把它说出了声，这比不说更难受。格子那一边的祭司没有惊呼，也没有训我。他问了一句关于我家中的话，然后等着。我听见自己的声音给了答话。教堂里是冷石头的味。\n\n走回中廊时我脸上还热。不全是羞，或者说不只是。说出口之后，大白天里，在祭台前面，我又把整件事从头觉了一遍，我的身子毫无规矩。领子太紧。\n\n箱里还有人。我经过时帘子动了一下。"
 latria_sexual_frustration_flavor.1225.a: "回到箱前，请人听完余下的。"
 latria_sexual_frustration_flavor.1225.b: "在栏杆前跪下，领补赎和该说的话。"
 latria_sexual_frustration_flavor.1225.c: "坐在侧廊听他讲道，听到自己静下来。"

 latria_sexual_frustration_flavor.1226.t: "四更醒来"
 latria_sexual_frustration_flavor.1226.desc: "我从梦里挣出来，心跳得急，腿间是湿的，被单踢到了床脚。梦里是马厩的院子，一只手按在我颈上，我知道那是谁的手。屋里冷，枕头上留着我嘴边的湿。\n\n屋里是灰的。屋里没有人。我的身子不管灰不灰，也不管时辰，它要这个梦做完，而且很清楚该怎么做。我把手臂搭在眼睛上，屈着膝躺着。地板冷得发疼。\n\n檐下的鸟叫了。我的手已经在动。"
 latria_sexual_frustration_flavor.1226.a: "做完它，让家里的人当我睡着。"
 latria_sexual_frustration_flavor.1226.b: "起身穿衣，去马厩做到浑身发酸。"
 latria_sexual_frustration_flavor.1226.c: "读桌上那封信，读到天色真正亮起来。"

 latria_sexual_frustration_flavor.1227.t: "赌"
 latria_sexual_frustration_flavor.1227.desc: "有人拿一匹马打赌，说我在这满席之前说不出我想要的那个人的名字。酒好，火旺，赌得无聊，一桌人都等着。那条狗也不叫了，在凳下听着。这赌是当着主教的人打的。\n\n名字像一块石头含在我嘴里。桌子对面那个人看着自己的碟子，不看我，我后颈上都是汗。若我说了，到礼拜日就传遍每一间厅堂。有人又添了柴。\n\n总管又替我满上。席上没有声音了。"
 latria_sexual_frustration_flavor.1227.a: "把名字说出来，任满堂去嚼。"
 latria_sexual_frustration_flavor.1227.b: "笑一笑，认输罚酒，再要酒来。"
 latria_sexual_frustration_flavor.1227.c: "摆上棋盘，赢下赌的那个。"
 latria_sexual_frustration_flavor.1227.d: "作一首诗，名字在里面，又不在里面。"

 latria_sexual_frustration_flavor.1228.t: "条件"
 latria_sexual_frustration_flavor.1228.desc: "婚事在树下谈，用的是谈产业的那种口气。被谈的那个人靠墙站着，两手交叠，听书记念出自己值多少。一只蜂在薰衣草里忙，没人去赶。书记念到数目，声音就平了。\n\n我该定嫁妆那一条。同一行我看了四遍。我要的不是体面东西，纸上也没有。那人穿着绿衣在墙边站了一下午。那件绿衣的袖口是破的。\n\n书记举笔等着。一片叶子落到案上。"
 latria_sexual_frustration_flavor.1228.a: "快些定完条件，把书记和亲族都遣走。"
 latria_sexual_frustration_flavor.1228.b: "每一行读两遍，什么都不露。"
 latria_sexual_frustration_flavor.1228.c: "把文书带进屋里，清醒着定。"
 latria_sexual_frustration_flavor.1228.d: "去把庄园的账理清，让数目撑住我。"

 latria_sexual_frustration_flavor.1229.t: "抄经的手"
 latria_sexual_frustration_flavor.1229.desc: "抄得慢，缮写室冷，同一个词我写错三次。我的心不在纸上，在正午送面包来的那一张嘴上。隔着两张案，有人用堵住的鼻子呼吸。送来的面包还是热的。\n\n我起过愿，也守着，守着却让我以一种难以祈祷过去的法子觉出自己的身子。手在羊皮纸上抖。有个法子能了结它，长得跟一段短祷差不多，我要它。\n\n墨正在错的那个字母上干。"
 latria_sexual_frustration_flavor.1229.a: "为一个下午放下愿，也老实说清为什么。"
 latria_sexual_frustration_flavor.1229.b: "守住愿，让这点欲念自己烧尽。"
 latria_sexual_frustration_flavor.1229.c: "重新拿起那一段，抄到手稳。"

 latria_sexual_frustration_flavor.1230.t: "园中黄昏"
 latria_sexual_frustration_flavor.1230.desc: "我穿着寝衣出来，因为屋里更坏。园子是蓝的，蛾子在薰衣草上。下房那边有人把一件弦乐器弹得不成样子，总是那四个音。还是那四个音，一遍又一遍。草里的湿气透了鞋，裙边也沉。\n\n傍晚在门口，一只手在我腰上停了一下，轻，一个礼数的长短。它没有散。整夜它越来越响，那音乐帮不上忙，我自己这张皮嫌小。从门口起我就没有动过。\n\n我在石凳上坐下。蛾子还在薰衣草上。"
 latria_sexual_frustration_flavor.1230.a: "回屋里去，让乐声盖住我做的事。"
 latria_sexual_frustration_flavor.1230.b: "留在凳上，坐到寒气透进寝衣。"
 latria_sexual_frustration_flavor.1230.c: "呼吸，数那四个音，让这园子就够了。"

 latria_sexual_frustration_flavor.1231.t: "钟声未响"
 latria_sexual_frustration_flavor.1231.desc: "我在钟响之前就醒了，被单踢到了地上，后腰那一片皮肉是潮的。寝衣缠在大腿上。方才在做梦，梦还压在身上，一股热沉到了低处，散不开。\n\n是那张我整整一周都在小心不去想的脸。梦里没有这份小心。一只手扣在我的腰上，一张我连轮廓都记得的嘴，我的身子抢在我拿定主意之前就应了。此刻我醒着，它却没停。\n\n我蜷起膝，手掌贴在小腹上，那股热倒往掌心里聚得更紧。钟还没响。我的呼吸又急又浅，我没有动，也没打算把它压下去。"
 latria_sexual_frustration_flavor.1231.a: "把灯吹了，用自己的手了结它。"
 latria_sexual_frustration_flavor.1231.b: "理好寝衣，翻个身，直躺到钟响。"
 latria_sexual_frustration_flavor.1231.c: "读下去，读到那股热松开手。"

 latria_sexual_frustration_flavor.1232.t: "落单的骑行"
 latria_sexual_frustration_flavor.1232.desc: "天没亮就上了鞍，我一直盯着前面那个骑手。那人坐下的样子。浅滩上回头那一眼，还放慢了让我能赶上来。大腿磨得生疼，嘴里发干，可我盯着那背影的理由不是这些。\n\n鹿早没了，赶猎人散进了湿林。没人会多问一句耽搁。我夹一下马腹，把那段距离收拢到没有，我的膝抵上了对方的膝，皮革吱呀作响，谁都没有把马勒开。\n\n前面的人听见动静回过头，等着。林子里水滴声很响。我握缰的手是冷的，别处一点也不冷，马在我身下喷着气站着。"
 latria_sexual_frustration_flavor.1232.a: "把最后那点距离也收拢，让林子替我们瞒下。"
 latria_sexual_frustration_flavor.1232.b: "勒住马，独自往前，把持住自己。"
 latria_sexual_frustration_flavor.1232.c: "下马，沿着湿径走，走到脑子清亮。"

 latria_sexual_frustration_flavor.1233.t: "圣徒守着的时辰"
 latria_sexual_frustration_flavor.1233.desc: "教堂里只剩我一人，还有我该剪的几盏灯。寒气从石板里往上冒，可法衣底下，我的身子是暖的、醒着的，对日课毫无兴趣。圣像越过我，望着那扇关上的门。\n\n该让这念头凉下去的话我会说。我在门边那只暗箱里对别人念过，用的是我替他们记认罪行的那种口气。落到我自己身上，一个字也不管用。那点欲念像一块咽下去的炭，坐在肋骨后面，我的手不知不觉就平贴上了祭台的石头。\n\n我按下去，直到那冰凉的边沿硌得掌心生疼。钟就要响了。我的手还在石上，石头已经从我身上取了热，不再凉了。"
 latria_sexual_frustration_flavor.1233.a: "亲手了结这欲念，事后再求赦。"
 latria_sexual_frustration_flavor.1233.b: "跪完这一轮日课，让时辰把它磨掉。"
 latria_sexual_frustration_flavor.1233.c: "把额头抵在冰凉的石上，让它替我定住。"

 latria_sexual_frustration_flavor.1234.t: "多握了一息的手"
 latria_sexual_frustration_flavor.1234.desc: "议事的人都散了，书房里静下来。前一个时辰我只留意着一桩：我的使臣探身过案，把盟约递来时，手覆在我手背上，多停了一息，早已过了盖印所需的工夫。满屋子都是人。我由它停着。\n\n我反复回到那一点分量上，一只没有理由停留的手掌的暖。蜡烛烧短了，同一条条款我读了三遍。我的身子认定这比盟约要紧，且没打算问我的意思。\n\n戒指在我手背上压出一道印。我没有把它揉掉。蜡油积成一小滩，门还关着，我把那条款读了第四遍。"
 latria_sexual_frustration_flavor.1234.a: "再唤那人来，把这只手做过什么说明白。"
 latria_sexual_frustration_flavor.1234.b: "独自守这一夜的更，让守候把它凉下去。"
 latria_sexual_frustration_flavor.1234.c: "摆开棋，自己跟自己对弈，直到那画面淡掉。"

 latria_sexual_frustration_flavor.1235.t: "乐声转处"
 latria_sexual_frustration_flavor.1235.desc: "厅里正闹，酒已经转过两圈。乐师一起奏，我便由人拉进了舞里，凑到的偏是我一整晚都刻意不去看的那一个。一只手落在我背上，隔着薄薄一层衣料，我连每一根指头都感觉得到。\n\n转了一圈，又一圈，满屋化成烛烟和颜色。那只手把我搂得比舞步该有的稍稍紧些，我没有纠正。脉搏在耳朵里跳，比鼓声还响。那点欲念不知从哪里冒出来，当着满堂的人向我索求，我却还笑着，像什么都没发生。\n\n曲子渐渐慢下去，要收尾了。手没有从我背上移开，我也没有退开。"
 latria_sexual_frustration_flavor.1235.a: "求乐师再奏一支，搂得更紧些。"
 latria_sexual_frustration_flavor.1235.b: "谢过，行礼，趁下一支曲子还没起就退开。"
 latria_sexual_frustration_flavor.1235.c: "留在身边，说些别的，什么都说，只不说这个。"

 latria_sexual_frustration_flavor.1236.t: "长火"
 latria_sexual_frustration_flavor.1236.desc: "火已经烧成一条长长的红炭，厅里正闹到没人打算走的份上。一位吟唱诗人还在唱某位祖先的旧事。兽皮，蜜酒，长凳上挤着人，坐得暖。\n\n我想要的那人坐在我旁边，一条手臂搭在凳背上，没有碰到我，而我为那条手臂已经听完了三段诗。门外的峡湾是黑的，冰正从水面上往下压。我的膝抵着对方的膝，谁都没有挪开。\n\n诗人停下来换气。我背后那条手臂动了动，没有落下来。"
 latria_sexual_frustration_flavor.1236.a: "点一段诗，我自己唱出答句。"
 latria_sexual_frustration_flavor.1236.b: "谢过长凳，起身走到门外的黑里。"
 latria_sexual_frustration_flavor.1236.c: "转向那人，说话说到炉火成炭。"

 latria_sexual_frustration_flavor.1237.t: "涨水"
 latria_sexual_frustration_flavor.1237.desc: "洪水漫过了田，空气稠得能喝。我在园里，一身亚麻，眼上描着眼粉，莲花编的环在热气里已经发软。伊西斯庙的凉石就在几步外，那面墙我已经走过两回。\n\n暖暗里有一只手递过来，掌心朝上，不慌不忙。蟋蟀叫得够响，屋里谁也听不见一句答话。我的身子已经答过了，低而固执，它不等我讲礼数。\n\n那只手我没有接。莲花上的水滴在我腕上。"
 latria_sexual_frustration_flavor.1237.a: "接住那只手，回到家里我自己担着。"
 latria_sexual_frustration_flavor.1237.b: "把手收进袖里，独自进门。"
 latria_sexual_frustration_flavor.1237.c: "沿着淹水的路走，走到掌灯。"

 latria_sexual_frustration_flavor.1238.t: "青枝之礼"
 latria_sexual_frustration_flavor.1238.desc: "礼已经做完，庙里还是一股新折枝条的气味。门口祝圣过泉水，我也和其余一切一同被算作圣洁，身子也在其中，我反复回到的正是这一点。每根柱子上都挂着青枝。\n\n舞一直跳到灯后，我跳了。那味道还在我嘴里：一只手腕在我手里，一个转身，鼓。我的身子认定那句祝词就是许可，正在替我陈情。\n\n柱子在滴水。门廊里还有人笑。"
 latria_sexual_frustration_flavor.1238.a: "把礼上的话当真，让我自己的手作答。"
 latria_sexual_frustration_flavor.1238.b: "跪下守夜，守到鼓声停。"
 latria_sexual_frustration_flavor.1238.c: "读这礼自己的经文，读到字句撑得住。"

 latria_sexual_frustration_flavor.1239.t: "草原上的黎明"
 latria_sexual_frustration_flavor.1239.desc: "太阳没出我们就出发，皮囊里装着马奶酒，天是那种只有在这里才有的蓝，四面都没有边。鹰停在我腕上，草里的虫声很响。从车队那里起就没说过一句话。\n\n一个人在坡顶勒住马，来到我旁边，没有再往前骑。对方的腿贴着我的腿，两匹马都在喷气，前面是开阔的地，没有墙，半日之内也没有祭司。这从来没让那点欲念变小过。\n\n鹰换了一下脚。那人等着。"
 latria_sexual_frustration_flavor.1239.a: "跟着那人拐出去，让草替我们瞒下。"
 latria_sexual_frustration_flavor.1239.b: "点头，往前骑，把这一日的差事摆在我们中间。"
 latria_sexual_frustration_flavor.1239.c: "坐在鞍上呼吸，直到手稳下来。"

 latria_sexual_frustration_flavor.1240.t: "鞭与冷水"
 latria_sexual_frustration_flavor.1240.desc: "鞭就搁在我放下的长凳上，冷水在盆里。我的信仰说得很明白，身子是件该打断去学会顺从的东西。那个断处我始终没找到。\n\n两样我都用过。水激得人一惊，肩背发疼，事后那点欲念还在肋骨后面，一点也不为所动。没人说出口的是这一句：它是抽不出去的。\n\n盆沿滴着水，落在石板上。我的手在凳上很稳。"
 latria_sexual_frustration_flavor.1240.a: "把鞭搁下，用自己的手了结这欲念。"
 latria_sexual_frustration_flavor.1240.b: "重新拿起鞭，顺从。"
 latria_sexual_frustration_flavor.1240.c: "跟着师长读下去，读到字句比它响。"
