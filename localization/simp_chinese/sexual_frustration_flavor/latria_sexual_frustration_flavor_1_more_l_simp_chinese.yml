l_simp_chinese:
 latria_sexual_frustration_flavor.1011.t: "二更"
 latria_sexual_frustration_flavor.1011.desc: "二更时我醒了，灯还亮着，油将尽，碟沿结了一圈褐色的痕。睡袍在腰间拧成一团。屋里冷得能听见窗板磕两下，又停住。\n\n三天前在厅堂门口，一只手握过我的手腕，什么话也没有说。那一下的长短，我回味的次数比查账还多。如今那块皮肤与别处无异，我用拇指按上去，只按到自己的脉。\n\n床边杯里的水温了。我喝掉一半，放回去。窗板又磕了一下。我睁着眼数梁上的纹路，数到天色发灰。"
 latria_sexual_frustration_flavor.1011.a: "起身剪灯，不去拦。"
 latria_sexual_frustration_flavor.1011.b: "把水喝完，转身向壁，压下去。"
 latria_sexual_frustration_flavor.1011.c: "从箱里取一本书，读到天亮。"

 latria_sexual_frustration_flavor.1012.t: "梨与那把小刀"
 latria_sexual_frustration_flavor.1012.desc: "我坐在离主位三张桌的地方，烛火摇晃，酒斟得薄。隔着两个商人和一个文书，有人正用小刀削梨，削了却不吃，皮一圈垂下来，没有断。\n\n上一次宴饮，那人坐在我旁边，一支曲子的工夫，膝头一直抵着我的膝。我至今没法让自己相信那是无意，也没法让自己相信不是。\n\n乐工换了慢调。刀停了。梨切开搁在盘里，口子渐渐发褐。仆役提着壶从我肩后倾身过来，我递出杯子，眼睛没有移开。"
 latria_sexual_frustration_flavor.1012.a: "当众说出来，随他们猜。"
 latria_sexual_frustration_flavor.1012.b: "早些告退，把话咽回去。"
 latria_sexual_frustration_flavor.1012.c: "转头与邻座说话。"

 latria_sexual_frustration_flavor.1013.t: "梦里留下的"
 latria_sexual_frustration_flavor.1013.desc: "我醒来时床单滑到胯下，窗纸发白，有一瞬这屋子不像我的屋子。有人来过。床沿沉过，有个声音贴着耳朵叫我的名字，像在问一句什么。\n\n脸我记不得了。记得的是一片背贴在我胸口，我的手平放在那一起一伏的小腹上，还有我并不着急，一点也不。\n\n我坐起来，脚踩上冷透的地板。外头有车往市集去。我去取衣裳，却发现自己还在听那扇门。"
 latria_sexual_frustration_flavor.1013.a: "由着身子去，留住那点暖。"
 latria_sexual_frustration_flavor.1013.b: "起身穿衣，把这一夜抹平。"
 latria_sexual_frustration_flavor.1013.c: "抱膝坐着，等窗纸全白。"

 latria_sexual_frustration_flavor.1014.t: "守夜的灯"
 latria_sexual_frustration_flavor.1014.desc: "三时我跪在祷台前，诗篇摊在同一页，已经读过四遍。守夜的灯在石地上投出一小圈红。膝头发酸，寒气从羊毛里往上钻。\n\n回廊外有一扇门合上了。神父的声音在身后不紧不慢，我一个字也没听进去。我在想去年夏天那两片嘴唇贴着我的喉，我把头偏开，也就随它去了。\n\n诗篇的绸带滑落在地。我没有去捡。拇指还压着那一页，灯的红圈随我的呼吸轻轻晃。膝下的石头是凉的。"
 latria_sexual_frustration_flavor.1014.a: "认下这软弱，明日去领该领的罚。"
 latria_sexual_frustration_flavor.1014.b: "再跪一个时辰，从头念那篇诗。"
 latria_sexual_frustration_flavor.1014.c: "请神父留下，把这一页讲完。"

 latria_sexual_frustration_flavor.1015.t: "踢到床脚的被子"
 latria_sexual_frustration_flavor.1015.desc: "火已烧成灰，我还醒着，被子踢到了床脚。身子又暖又沉，自己知道自己的每一处，喉间、腿侧，皮都紧着、热着，那处湿意与天气无关。\n\n我把手放在小腹上，不动。今夜想的不是哪一张脸，只是两腿之间那一下一下的跳，固执，和火里最后一声轻响应和。\n\n我想起一张嘴，一只手，一个人压在我身上的分量，胯便不由自主地送了送。被子堆在地板上。我把脸埋进枕里，一直呼吸到那阵酸胀退去，它没有退。"
 latria_sexual_frustration_flavor.1015.desc.lustful: "热气从被下漫上来，我不打算装作只是睡得不好。我已是湿的，湿得清楚，是我自己的，手指不用人吩咐就知道往哪里去。\n\n我由着它去。今夜没有脸，只有一只手把我按进褥里，一个膝顶开我的膝，那一下的力道我记得分明。我的腰自己抬起来迎，喉咙里发出的声音在空屋里听着陌生。\n\n过后我摊着手躺着，胸口起伏，腿间还留着余震。炉里一段柴塌下去。我把被拉到腰上，脸上那点热没有退。"
 latria_sexual_frustration_flavor.1015.desc.chaste: "我在自己身上醒来，脸先热起来。腿间是湿的，我缩回手，攥住被角，好像攥住布就能把这一夜攥回原处。\n\n我按次序默诵晨祷，数到第三句就断了。我数梁上的纹路，数着数着就乱了。身子不听。它收着我白天不肯认的东西，还一再地要。\n\n窗色由灰转白。晨祷的钟还没有敲。我把被拉到下巴，闭着眼，等那阵热自己冷掉。它冷得很慢。"
 latria_sexual_frustration_flavor.1015.a: "由这只手去，把热用尽。"
 latria_sexual_frustration_flavor.1015.b: "攥紧被子，把热熬干。"
 latria_sexual_frustration_flavor.1015.c: "起来喝水，坐到窗边。"

 latria_sexual_frustration_flavor.1016.t: "回去的那段长路"
 latria_sexual_frustration_flavor.1016.desc: "我落在队伍后头，马都慢下来，光从叶间漏下，绿而薄。斗篷吸饱了水，沉。前头远处的坡上，号角还在赶。\n\n上一次围猎，我在溪边与那人并辔，我们由着旁人先走。那人的袖子湿到肘弯，为我说的一句什么笑了，那笑一路跟我回了家，而回家的路有两日。\n\n我的马低头饮水，水面的影子被搅碎。我由它喝，看那影子一点点拼回来。号角又起，更远了。"
 latria_sexual_frustration_flavor.1016.a: "落后一程，让它跟我回家。"
 latria_sexual_frustration_flavor.1016.b: "打马赶上，把心思放在坡上。"
 latria_sexual_frustration_flavor.1016.c: "顺着蹄印和折枝追上去。"

 latria_sexual_frustration_flavor.1017.t: "印与账"
 latria_sexual_frustration_flavor.1017.desc: "议事的人散了，烛头只剩一截。羊毛账摊在面前，印玺还在我手里，被攥得温热，蜡都软了。\n\n我反复想的不是账。是那个人从头到尾立在窗边，一言不发，一根手指搭在窗闩上，为这个，屋子显得小了。\n\n我把印按下去，提起来，蜡上的纹路清清楚楚。窗外庭院空着，窗闩也静着。同一行账我读了两遍，然后把书合上。"
 latria_sexual_frustration_flavor.1017.a: "明日召那人来，把话说明。"
 latria_sexual_frustration_flavor.1017.b: "把印交给文书，去睡。"
 latria_sexual_frustration_flavor.1017.c: "重开账本，把这一页算完。"

 latria_sexual_frustration_flavor.1018.t: "月与棋"
 latria_sexual_frustration_flavor.1018.desc: "廊下的灯笼都点上了，月亮薄而白，像一片削下的果皮，悬在西墙上方。酒在壶里已经温了。棋盘对面，那位文官两指拈着一枚白子，迟迟不落。\n\n春日赏月时那人坐得近，衣袖相触，吟了四句关于灯的诗，念到最后一句时看了我一眼。那一句我至今没忘。\n\n白子终于落下，落错了角，那人笑起来，替我把杯添满。我喝了。灯光在棋盘上晃。谁也没有提那首诗。"
 latria_sexual_frustration_flavor.1018.a: "就着灯，把那四句诗续成八句。"
 latria_sexual_frustration_flavor.1018.b: "举杯谢过，把话头拨到年成上。"
 latria_sexual_frustration_flavor.1018.c: "落一子，请那人指教。"

 latria_sexual_frustration_flavor.1019.t: "说给炉火听"
 latria_sexual_frustration_flavor.1019.desc: "火很低，那位近友坐在另一张椅子里，两手捧着杯子，照老样子等着。\n\n于是我说了。没有全说，只说了个轮廓：那扇门，那只握在腕上的手，还有这些夜。说出口以后，它变小了，也更难看了。近友没有把眼睛移开，也没有替我填满那阵沉默。\n\n手里的杯早凉了。有一段柴该添，我没有添。我们坐在最后一点热气里，屋子慢慢暗下来，我还捧着那只杯。"
 latria_sexual_frustration_flavor.1019.a: "再往下说，把剩下的也说了。"
 latria_sexual_frustration_flavor.1019.b: "就此收住，把话留在肚里。"
 latria_sexual_frustration_flavor.1019.c: "再坐一会儿，什么也不说。"

 latria_sexual_frustration_flavor.1020.t: "在拱顶下说出口"
 latria_sexual_frustration_flavor.1020.desc: "拱顶把我的声音接过去，又还回来，成双。堂上有一二十人，人人都听得见我说出那件白天从不说的事。\n\n我盯着栏杆前那块地砖，缺了一角，形状像颗牙。说完了，身后有人挪了挪脚，门边一个妇人把面纱拉上，没有放下来。\n\n香炉摆着，烟贴着石头平平地升。我手摊在膝上，一直跪着，直到司事碰了碰我的肩。"
 latria_sexual_frustration_flavor.1020.a: "抬起头，把没说完的说完。"
 latria_sexual_frustration_flavor.1020.b: "低着头，把悔罪诗念到底。"
 latria_sexual_frustration_flavor.1020.c: "等堂上空了，请神父留下。"

 latria_sexual_frustration_flavor.1021.t: "雨夜之后"
 latria_sexual_frustration_flavor.1021.desc: "雨把我们留在楼上，过了二更，谁也没有提下楼。\n\n我记得次序。湿斗篷摊在地板上。一张嘴落在我的锁骨，再往下，不慌不忙，我的手指摸到颈后那一根系带。灯捻得很低，没有熄。那人再上来吻我，嘴里的酒我尝得出来，我的腿贴着那人的腿，滑得清楚，我抬起胯去接那只落下来的手。\n\n后来雨还在下。我的头发黏在颊上。肩上有一处痕，天亮以后我没有去看。"
 latria_sexual_frustration_flavor.1021.desc.female: "雨把我们留在楼上，过了二更，谁也没有提下楼。\n\n我记得次序。湿斗篷摊在地板上。那人的嘴落在我的锁骨，再往下，不慌不忙，我的手指去解那人颈后那根系带。灯捻得很低，没有熄。手掌覆到我胸前，我早已湿透，便抬起胯去接那只探到腿间的手。\n\n后来雨还在下。我的头发黏在颊上。肩上有一处痕，天亮以后我没有去看。"
 latria_sexual_frustration_flavor.1021.desc.male: "雨把我们留在楼上，过了二更，谁也没有提下楼。\n\n我记得次序。湿斗篷摊在地板上。那人的嘴落在我的胸口，再往下，不慌不忙，我的手摸到那人腰后那根系带。灯花爆了两下，又稳住。那人跨坐上来，我扶住腰，硬得发疼，低头吻我时自己定了快慢。发梢还是湿的。\n\n后来雨还在下，屋檐的水在窗上响。肩上有一处痕，天亮以后我没有去看。"
 latria_sexual_frustration_flavor.1021.a: "明日照旧见那人，什么也不瞒。"
 latria_sexual_frustration_flavor.1021.b: "从此避着那人，把这一夜收起来。"
 latria_sexual_frustration_flavor.1021.c: "躺着听雨，把肩上的痕记住。"

 latria_sexual_frustration_flavor.1022.t: "药草圃后的小径"
 latria_sexual_frustration_flavor.1022.desc: "我走药草圃后头那条小径，天黑以后家里没有别人走。碎石透过软鞋，凉。迷迭香的气味底下，压着薄荷长过了头的酸。\n\n小径尽头有张石凳，墙在那里拐弯。春天我们坐过，我说了句蠢话，话没说完就被原谅了。院门的闩还落着。\n\n月亮落在塔后。我立在石凳旁，手搭在靠背上，漆磨掉了，露出木纹。门口灯笼边有一只蛾子在撞。薄荷动了一下。我没有坐下。"
 latria_sexual_frustration_flavor.1022.a: "坐到石凳上，等这阵心跳过去。"
 latria_sexual_frustration_flavor.1022.b: "转身回屋，把门闩上。"
 latria_sexual_frustration_flavor.1022.c: "沿小径走一圈，再走一圈。"

 latria_sexual_frustration_flavor.1023.t: "第三杯"
 latria_sexual_frustration_flavor.1023.desc: "到第三杯，厅里又热又吵，狗钻在长凳底下。有人起了一支词，句数不对，也没有人纠正。\n\n说故事的时候，一只手搭在我袖上，故事说完了，手还在，故事一完就撤了。我在该笑的地方笑了。今晚的酒很好。\n\n乐工换了一支慢的。我看向长桌另一头，收盘的仆役正把木盘摞起来。袖子上那一处还热着。我捏着杯沿转了一圈，让仆役再斟满。"
 latria_sexual_frustration_flavor.1023.a: "举杯，隔着桌子看那人。"
 latria_sexual_frustration_flavor.1023.b: "托词醉了，上楼去睡。"
 latria_sexual_frustration_flavor.1023.c: "与邻座搭话，把这支曲听完。"

 latria_sexual_frustration_flavor.1024.t: "玫瑰水与园墙"
 latria_sexual_frustration_flavor.1024.desc: "玫瑰水浇在果子上，满桌都是那个香气。墙外一只夜莺叫个不停，调子跑得厉害，谁也不忍心叫它停。\n\n关于盟约的话那人问我两遍，两遍我都答错了半边。第二遍时那人对着杯子笑，拇指上的藏红花染到了杯沿。我们中间那盏灯的玻璃上有一道裂。\n\n夜莺停了。静下来，我听见墙后水渠里的水声。我端起那只早就空了的杯子，捧着，直到有人看见，替我添上。"
 latria_sexual_frustration_flavor.1024.a: "顺着那人的话，把盟约挪到明日。"
 latria_sexual_frustration_flavor.1024.b: "告个罪，到园里走走。"
 latria_sexual_frustration_flavor.1024.c: "请那人把那半首诗念完。"

 latria_sexual_frustration_flavor.1025.t: "拳上的隼"
 latria_sexual_frustration_flavor.1025.desc: "隼在我拳上比春天时稳，去了头罩，分量落定。马拴在后面桦树林里，赶猎的人带着响声先去了。\n\n我们曾一起在荒原边上放她，我眼睛离不开那双手张开的最后一瞬。从那以后，那些手总在不合宜的时辰到我心里来。\n\n隼动了动，我用两指压住脚带稳住她。风从坡上下来，冷而干净。我望着赶猎的人进去的那片林子，心不在林子里。"
 latria_sexual_frustration_flavor.1025.a: "把隼交给旁人，独自走开一段。"
 latria_sexual_frustration_flavor.1025.b: "抖臂放她飞。"
 latria_sexual_frustration_flavor.1025.c: "再放她一趟，直到手臂发酸。"

 latria_sexual_frustration_flavor.1026.t: "翻过的那一页"
 latria_sexual_frustration_flavor.1026.desc: "课讲完了，书还摊在中间，正翻在神父用一根干手指翻到的那页。雨打着窗板。烛烧到了底，弯下来。\n\n那番道理我没有听进去。我看着那根手指，指侧的墨，还有推到肘上的袖子。羞惭总是随后才来，来了也没有用。\n\n神父合上书，问我懂了没有。我说懂了。雨还在窗板上响。我把手平放在封面上，免得它去够什么。"
 latria_sexual_frustration_flavor.1026.a: "明日拿这个问题去问那人。"
 latria_sexual_frustration_flavor.1026.b: "请那人把话再说一遍，这回听清。"
 latria_sexual_frustration_flavor.1026.c: "再读一遍，只读字。"

 latria_sexual_frustration_flavor.1027.t: "白日留下的分量"
 latria_sexual_frustration_flavor.1027.desc: "最后一个陈情的人走了，屋里是湿羊毛和长凳上油的味道。印在我手里握得温热。一天的公事完了，我还坐在这里。\n\n窗边有一瞬，两个人说话的空当里，有人递来一个眼色，从那时起我就带着它，像鞋里的一粒石子。什么也没有说。也不必说。\n\n文书来取印。我递过去，手很稳。文书走了。门没有关严。我坐着听门闩落定，雨又打上铅皮屋顶。"
 latria_sexual_frustration_flavor.1027.a: "明日屏退左右，与那人说一句。"
 latria_sexual_frustration_flavor.1027.b: "把窗关上，看完剩下的公文。"
 latria_sexual_frustration_flavor.1027.c: "坐着不动，等雨停。"

 latria_sexual_frustration_flavor.1028.t: "匣里的绿缎带"
 latria_sexual_frustration_flavor.1028.desc: "架上的匣子里有一条缎带，不是我的，绿的，折痕处已经抽薄。我拿出来，放回去，又拿出来。\n\n那年集市上我把缎带丢了，有人从泥里捡起来还我，还替我打了个我并不需要的结。那双手很凉。我说了声谢，别的一个字也没有，回家的整路上我都在气自己。\n\n灯很低。缎带横在掌心，这个光里绿得近乎灰。我折一次，再折一次，折痕对不齐。"
 latria_sexual_frustration_flavor.1028.a: "把缎带系在腕上，睡去。"
 latria_sexual_frustration_flavor.1028.b: "把匣子锁到箱底。"
 latria_sexual_frustration_flavor.1028.c: "取纸笔，把这一夜写下来。"

 latria_sexual_frustration_flavor.1029.t: "两更之间的火"
 latria_sexual_frustration_flavor.1029.desc: "火只剩一只红眼，营里都睡了，除了我们两个和拴着的马。斗篷盖在膝上。剑在手边，是习惯。\n\n同一堆火守了十一夜，身边那几位的呼吸我都听熟了。今夜也都醒着。明天上路的事，谁都不提；也不提上一座镇上只剩一间客房，我们还是要了。\n\n风把火焰压平。一段柴塌下去。我又添了一根，火星升上去，满林子里只有火星在动。"
 latria_sexual_frustration_flavor.1029.a: "坐到火边，等天亮。"
 latria_sexual_frustration_flavor.1029.b: "添柴守夜，不再看那人。"
 latria_sexual_frustration_flavor.1029.c: "与那人换班，到林子边走走。"

 latria_sexual_frustration_flavor.1030.t: "钟绳"
 latria_sexual_frustration_flavor.1030.desc: "钟绳在我手里很粗。钟已经敲过，堂里空了。引路的人拿着钥匙等在门边，稳得像石头。\n\n我该把身子当作一件要收好的东西，这念头却握不住，一握就滑。羊毛底下我是暖的，活的，身体里有一处跳动，与祷告无关。\n\n我松开绳子。它晃了两下，静了。引路的人提起钥匙。我跟在后面走过中殿，影子先我一步铺在石地上，又长又薄，从门口出去了。"
 latria_sexual_frustration_flavor.1030.a: "把这一夜交给身子，明日再说。"
 latria_sexual_frustration_flavor.1030.b: "跪下，把晚祷念完。"
 latria_sexual_frustration_flavor.1030.c: "请引路的人留下，再讲一段。"

 latria_sexual_frustration_flavor.1031.t: "落在地板上的带子"
 latria_sexual_frustration_flavor.1031.desc: "火已经烧成一道红线，我没有叫人添柴。睡袍的领口松着，屋里够暖，我就由它敞着。两天前围猎歇脚的时候，有一只手在我腰后停住，比下马那点工夫要长。\n\n我记得那只手掌的分量，马身一晃时贴到我耳边的呼吸，还有一个低得不成字的声音。我自己的手按到那只手掌盖过的地方。那里的皮肤被火烤得温着，按下去，暖的也只是我自己。\n\n带子从床柱滑到地板上。我看着它在红光里躺着。火堆塌下去一块。我没有去捡。"
 latria_sexual_frustration_flavor.1031.a: "把带子捡起来，攥在手里。"
 latria_sexual_frustration_flavor.1031.b: "系好带子，压住火，睡。"
 latria_sexual_frustration_flavor.1031.c: "摆开棋，一个人把残局走完。"

 latria_sexual_frustration_flavor.1032.t: "一只手掌的分量"
 latria_sexual_frustration_flavor.1032.desc: "石头透过膝头往上冷，我跪得够久，冷也成了个作伴的。羊毛袍子底下身子太热，我分不清是火盆还是别的缘故。上周有只手按在我头上祝圣，落过了该收的那句话。\n\n经文我念得没错，应答也没错。浮上来的却是那只手掌的分量，指上的油，还有谁都没有动的那一刻，圣器看管人在门口咳了一声。我把额头抵在指节上。大理石什么也不还我。\n\n侧坛一支蜡烛弯了弯，又立直。我跪在原处不动。冷从膝头往上走，我随它走。"
 latria_sexual_frustration_flavor.1032.a: "起身去找那位教士，把心里的话说出来。"
 latria_sexual_frustration_flavor.1032.b: "守夜守到钟响。"
 latria_sexual_frustration_flavor.1032.c: "在回廊里走，走到腿和膝一样冷。"

 latria_sexual_frustration_flavor.1033.t: "第二件斗篷"
 latria_sexual_frustration_flavor.1033.desc: "火在我们中间，猎犬已经静了。有人没问一声就给我肩上加了第二件斗篷，毛毡上是别人的汗味和柴烟味。那人的膝抵着我的膝。谁也没有挪开。\n\n我能说出三个起身的理由：该换的岗、合不严的帐帘、天亮前要来的冷。我却把脸转向火，让肩膀留在它此刻靠着的地方。我们呼出的气在空中散开变薄。斗篷底下，我的手摸到自己的袖口缝线，攥住。\n\n一根枝子掉进火里。那人没有动。我没有动。火星升上去，散了。"
 latria_sexual_frustration_flavor.1033.a: "在这斗篷底下坐到火成灰。"
 latria_sexual_frustration_flavor.1033.b: "谢过那件毛毡，回自己的帐。"
 latria_sexual_frustration_flavor.1033.c: "问猎犬的事，问到换岗。"

 latria_sexual_frustration_flavor.1034.t: "第三条"
 latria_sexual_frustration_flavor.1034.desc: "条约抄了两份，第二份的第三条抄错了。我看了四遍。领子敞着，火盆把屋子烘得热，这里也没有人看见。\n\n我总回到那间前厅：使臣的嘴落在我的手腕内侧，随后往上一点，而书吏的脚步在门外来了又走，我没有拦。能落到纸上的话，我一句也没有说。那人说得更少。\n\n蜡烛在蜡上吃出一弯缺口。我拿起笔，又放下，把第三条再读一遍。字没有变。"
 latria_sexual_frustration_flavor.1034.a: "把那人叫来，把心里想的照实说。"
 latria_sexual_frustration_flavor.1034.b: "把这一条再抄一遍，天亮就去告解。"
 latria_sexual_frustration_flavor.1034.c: "读圣咏集，读到蜡烛灭。"

 latria_sexual_frustration_flavor.1035.t: "两支舞的工夫"
 latria_sexual_frustration_flavor.1035.desc: "厅里吵，酒上了头，不算多，只够那个数。睡袍肩头松脱了，我也没去理。上一支舞里有只手停在我腰上，停过两个转身，屋里挤，退也退不开。\n\n透过绸子，我此刻还能找到那四个指头的位置。我自己的手落到肩上，落到衣料滑开的那块暖处。乐声已经落在乐师后头了。我还是踩着拍子。\n\n头顶的灯冒烟。远处桌上有人笑。肩头露着，我就让它露着。"
 latria_sexual_frustration_flavor.1035.a: "再叫一支曲子，把它跳完。"
 latria_sexual_frustration_flavor.1035.b: "把睡袍理好，到窗边吹冷风。"
 latria_sexual_frustration_flavor.1035.c: "坐到火边，跟那条老猎犬待着，等厅里散空。"
