l_simp_chinese:
 latria_sexual_frustration_flavor.1101.t: "帐中无眠"
 latria_sexual_frustration_flavor.1101.desc.female: "我从浅睡里醒过来，寝衣已经滑到床尾，肩和膝都露在帐外。帐里没有第二个人。被子被我自己踢乱了，枕上只有一个坑。\n\n我把寝衣拉回来，布料蹭过皮肤，那点热意却没有跟着退下去。窗外的更声已经过了两轮。我想侧过身继续睡，闭上眼又看见白日里那人转身时的后颈。帐钩轻响了一下，像有人掀开一角。没有人。\n\n我在床上躺平，手不知道该放在哪里。夜还长，睡意却已经散了。"
 latria_sexual_frustration_flavor.1101.desc.male: "我从浅睡里醒过来，寝衣已经滑到床尾。帐外一片黑，只有更鼓远远响了一声。被子皱成一团，是我自己翻出来的。\n\n我坐起来，又躺下。躺下以后，那点不肯散的热意仍停在小腹。我数自己的呼吸，数到第七下，又想起一个人说话时靠近的距离。那距离里什么也没发生，可我记得太清楚。\n\n帐子被风掀起一角，又落回去。床的另一侧仍是凉的。"
 latria_sexual_frustration_flavor.1101.desc: "床帐半垂，长夜未尽，念头仍旧纷乱。\n\n我把被子拉到胸口，又踢开。枕边没有信，也没有人，只有自己的手。手心是热的，我把它按在席上，想让它凉一凉。\n\n更声又响了一轮。我还醒着。"
 latria_sexual_frustration_flavor.1101.a: "闭上眼，容我再想一想心上人。"
 latria_sexual_frustration_flavor.1101.b: "把念头压下，拉好床帐，重新安歇。"
 latria_sexual_frustration_flavor.1101.c: "披衣坐稳，慢慢平复呼吸。"

 latria_sexual_frustration_flavor.1102.t: "舞步间的目光"
 latria_sexual_frustration_flavor.1102.desc.accepted: "舞曲换了三支，席间的人也换了几轮。没有人因一段过近的舞步而侧目，乐师甚至把节奏放慢，好让人把话说明白。\n\n我却记得那一瞬。对方的手在我腕上停得比礼节长一点，眼睛也没有立刻避开。曲子结束时，那只手松开了，指尖却还留下一点热。我回到座上，杯盏是满的，我没喝。\n\n下一支曲子已经起了。我看着空出来的那块地板，脚还想往那边去。"
 latria_sexual_frustration_flavor.1102.desc.strict: "舞步越近，周遭的笑声便越像窃窃私语。我把目光移向乐师，手却还被对方带着。衣袖擦过衣袖，那点声音比鼓点更清楚。\n\n有人在席边俯身说话。我分不清他们在说我，还是在说别的。曲子一停，我立刻退了半步，退得太快，几乎踩到自己的鞋。对方看了我一眼，没有追问。\n\n我坐下以后，腕上那一点热还在。我用另一只手盖住它，像是这样就不会被人看见。"
 latria_sexual_frustration_flavor.1102.desc: "乐声渐急，心思却没有随舞步散去。\n\n我跟着转了两圈，脚下没有出错，心里却一直数着对方呼吸的远近。曲子在最高处顿了一下。那一下里，谁也没有说话。\n\n乐师重新拉响弦。我还站在原地，不知道该把这段舞结束在哪里。"
 latria_sexual_frustration_flavor.1102.a: "再邀一曲，任由彼此靠近。"
 latria_sexual_frustration_flavor.1102.b: "行礼谢过舞伴，退到席边。"
 latria_sexual_frustration_flavor.1102.c: "与乐师说说曲调。"

 latria_sexual_frustration_flavor.1103.t: "求教的门前"
 latria_sexual_frustration_flavor.1103.desc.favors: "引导者说，压下欲念并非唯一的虔敬之路。灯火把我们两个人的影子投在墙上，他的话很慢，像是留出空隙让我接。\n\n我本想追问：若是夜里独自醒来，手不知道往哪里放，算不算也在这条路上。话到嘴边，门外忽然有脚步停住。我们都静了一静。脚步又走了。\n\n引导者看着我，等后半句。我把那句话咽回去，只剩一个没说完的开头。"
 latria_sexual_frustration_flavor.1103.desc.condemns: "引导者提醒我，贞洁不是只在众人面前才有分量。他没有提高声音，屋里却像一下子窄了。我低头应了一声，手指在袖里攥着。\n\n他问我今夜为何来。我看着灯，看着门，看着自己的鞋尖，就是不看他的眼睛。真话说出来并不长，可我怕一说，他就再问下去。\n\n门外有人咳嗽。我松了口气，又觉得那口气松得可耻。"
 latria_sexual_frustration_flavor.1103.desc: "屋里灯火昏暗，我斟酌着该如何向引导者开口。\n\n该问的是职责，不该问的是另一件事。我在门口已经把两套说法都练过，进门以后却一句也想不起来。引导者替我倒了水，水还是热的。\n\n我捧着杯子，杯沿碰到嘴唇，话仍旧没有出来。"
 latria_sexual_frustration_flavor.1103.a: "承认自己的渴望，不再掩饰。"
 latria_sexual_frustration_flavor.1103.b: "只请教眼下的职责，把心事咽回去。"
 latria_sexual_frustration_flavor.1103.c: "请教如何与这份心意共处。"
 latria_sexual_frustration_flavor.1103.d: "从那封未寄出的信说起，一句也不隐瞒。"

 latria_sexual_frustration_flavor.1104.t: "鹰未归巢"
 latria_sexual_frustration_flavor.1104.desc.lustful: "鹰盘旋在猎场上空，迟迟不肯落回手套。我举了两次手臂，它都只是侧过翅膀，飞得更高。风从林子里出来，带着草和马汗的味道。\n\n我几乎羡慕它。它可以不解释，不回头，也不必在众人面前把一份急切说成耐心。侍从问要不要收弓。我摇头，眼睛仍追着那个黑点。追着追着，黑点就不像鹰了，像另一个不肯回来的人。\n\n我的手臂已经酸了。我还是没有放下。"
 latria_sexual_frustration_flavor.1104.desc.chaste: "鹰盘旋不下，侍从几次询问是否要收弓。我只说再等片刻，仿佛多等一会儿，心里那点乱就能自己过去。\n\n猎人们已经下马，在树荫里传递水囊。他们不催我，可马具的响声一阵阵传来，像在替他们催。我盯着天空，嘴里默数，数到后来又是同一个人的名字。\n\n鹰叫了一声，仍不落。我把手套换到另一只手上，换得很慢。"
 latria_sexual_frustration_flavor.1104.desc: "鹰迟迟不归，猎人们都在等我发话。\n\n号哨在我掌心捏出了印。我把它举到唇边，又放下。天上的圈子越转越小，谁也不知道它下一刻会不会回来。\n\n有人轻声问还走不走。我应了一声，自己也不知道应的是走，还是再等。"
 latria_sexual_frustration_flavor.1104.a: "让鹰继续盘旋，容我想一会儿心事。"
 latria_sexual_frustration_flavor.1104.b: "收回心思，唤鹰回营。"
 latria_sexual_frustration_flavor.1104.c: "让众人稍候，慢慢试着唤鹰。"

 latria_sexual_frustration_flavor.1105.t: "烛台与王冠"
 latria_sexual_frustration_flavor.1105.desc.emperor: "近侍把礼冠捧出寝室，烛台上还留着几封未批的诏书。我披好寝衣，坐下来，本该先看最上面那一份。手却从文书中抽出了那封未寄出的信。\n\n信上只有一个称呼，后面是空的。我白天写过三次，三次都停在同一处。礼冠在匣里映着一点光，像还在等我做皇帝该做的事。我把信纸按平，按平以后仍不知道下一句该写什么。\n\n蜡泪滴到铜盘里，发出很轻的一声。"
 latria_sexual_frustration_flavor.1105.desc.adventurer: "我在客栈房中披好寝衣，同伴们已经歇下。隔壁还有人打鼾。行囊旁那封未寄出的信被灯照着，边角卷起来。\n\n明日要赶路。干粮、马和渡口都安排好了，只有这封信没有去处。我把它展开，里面的句子比早上更不像能寄出去的话。有一句写得太直，我用指节在那一行上停了停。\n\n楼下有人关门。我把信按回行囊上，没有按实。"
 latria_sexual_frustration_flavor.1105.desc.clergy: "我把法衣叠好，披着寝衣坐回床边。那封未寄出的信压在经卷下面，边角露出来，像是自己要人看见。\n\n我把它抽出来。经卷合上时发出一声闷响。信里没有写违背誓词的话，可每一句都绕着同一个人。我读到第三行，就知道自己不该在这个时辰读它。\n\n烛火跳了一下。我没有把信放回去。"
 latria_sexual_frustration_flavor.1105.desc.ruler: "侍从收起礼服，我披着寝衣坐在灯下。桌上的文书尚未批完，手边那封未寄出的信却先被我展开了。\n\n外面的守卫换岗，脚步声整齐地过去。屋里只剩纸页的声音。我在信的空白处落下一个字，看了看，又用墨把它涂黑。涂黑的地方比原来更显眼。\n\n我把笔放下。文书还在原处，一个印也没盖。"
 latria_sexual_frustration_flavor.1105.desc: "灯火将尽，一封未寄出的信仍在手边。\n\n我已经知道收信的人不会在今夜读到它。即便如此，我还是把称呼又写了一遍，写得比白天更慢。墨干了，纸上只剩一道浅痕。\n\n灯芯爆响。我抬起头，才发觉自己坐了很久。"
 latria_sexual_frustration_flavor.1105.a: "把那封信交给信使。"
 latria_sexual_frustration_flavor.1105.b: "亲手销毁它，今夜不再想，熄灯歇息。"
 latria_sexual_frustration_flavor.1105.c: "把信收进匣中，拟好明日安排。"

 latria_sexual_frustration_flavor.1106.t: "灯下难眠"
 latria_sexual_frustration_flavor.1106.desc.female: "我披着寝衣坐在床边，烛火把我的影子投在窗纸上。影子随呼吸轻轻动，看起来比我自己安定。夜已经深了，那份没有回应的渴望却还停在胸口，不响，也不走。\n\n我把头发拨到肩后，又拨回来。手指碰到颈侧时，我停了一下。没有旁人，这个停顿仍让我脸上发热。我想起白日里一句半真半假的话，想起自己当时笑了，笑完以后却一直记着。\n\n烛泪堆高了一层。我还坐着，床帐也还没有放下。"
 latria_sexual_frustration_flavor.1106.desc.male: "我披着寝衣坐在床边，窗外的守夜人已经走过两轮。第一轮我还指望自己能睡着，第二轮过去时，我已经放弃了。\n\n手里没有信，也没有酒。我只是把掌心按在膝上，按热了，再翻过来。心里那个人的声音并不真的在屋里，可我能把那句话的停顿复述出来。复述到第三遍，我自己都觉得不像话。\n\n我吹了吹烛火，没有吹灭。火苗斜了一斜，又直起来。"
 latria_sexual_frustration_flavor.1106.desc: "烛火渐短，床帐间仍没有睡意。\n\n我躺下，听见自己的心跳比平时响。侧过身，心跳还在。屋里的东西都在原处：杯、鞋、叠好的外衣。没有一样能把这点热意带走。\n\n我重新坐起来。灯还亮着，夜却已经过了一大截。"
 latria_sexual_frustration_flavor.1106.a: "让思绪停在那段情意上。"
 latria_sexual_frustration_flavor.1106.b: "不再顺着渴望想下去，熄灯安歇。"

 latria_sexual_frustration_flavor.1107.t: "回敬的一支舞"
 latria_sexual_frustration_flavor.1107.desc.accepted: "舞伴邀我再跳一支，旁人只当作寻常礼节。乐师已经把弓搭在弦上，等我点头。\n\n我却记得刚才那只手。它在我腰侧停过一下，短得可以解释成舞步，长得又不够让我真的这样解释。我看着对方的脸，对方也看着我，嘴角有一点笑，没有说破。\n\n席上有人碰杯。声音很响，我仍听得见自己没说出口的那句答应。"
 latria_sexual_frustration_flavor.1107.desc.strict: "舞伴邀我再跳一支，席间几道目光随即转来。我还没有回答，已经有人俯身向邻座低语。低语的内容我听不见，可那两个人的眼睛没有离开我们。\n\n对方的手还伸着，姿势礼貌，并不勉强。我自己的手却在袖里发热。若是接过去，这一支舞会比上一支更难装作无事。若不接，拒绝本身也会被人记住。\n\n乐师咳了一声，弓还停在弦上。"
 latria_sexual_frustration_flavor.1107.desc: "乐师奏起新的舞曲，我迟迟没有起身。\n\n曲子的前几拍已经过去了。舞伴没有收回手，也没有催我，只是站在那里。我看着那只手，又看着自己放在桌沿的手指。\n\n有人在后面挪椅子。我被那点声音惊得眨了一下眼，仍旧没有站起来。"
 latria_sexual_frustration_flavor.1107.a: "接受邀舞，再靠近一步。"
 latria_sexual_frustration_flavor.1107.b: "行礼谢过邀舞，祝舞伴尽兴。"
 latria_sexual_frustration_flavor.1107.c: "请舞伴一同坐下，谈谈别的。"
 latria_sexual_frustration_flavor.1107.d: "邀请整桌宾客，换一支热闹的群舞。"

 latria_sexual_frustration_flavor.1108.t: "睡前的祷告"
 latria_sexual_frustration_flavor.1108.desc.favors: "我穿着寝衣在床边祈祷。信仰容许肉体欢愉的话我记得很熟，此刻却帮不上忙。它只告诉我这件事不必当成罪，没有告诉我这股热该放到哪里去。\n\n我的膝盖抵着床沿，祷词从嘴里出去，心里却在重播白日里一次过近的对视。对视本身什么也没有。我却把那一眼拆成许多小段，一段一段又看了一遍。\n\n念到该停的地方，我没有停。后头的句子是我自己添的，添得毫无章法。"
 latria_sexual_frustration_flavor.1108.desc.condemns: "我穿着寝衣跪在床边，重复贞洁的誓词。每念一句，心底的声音便更清楚：今夜仍是独自一人，被褥仍是凉的，手仍会在黑暗里找到自己。\n\n我把额角抵在床板上，木头是凉的。这样好受一点。可一离开那块凉，热意又回到原处。我从第一句重新开始，声音压得很低，像怕隔壁听见。\n\n隔壁并没有人。我仍旧把声音压着。"
 latria_sexual_frustration_flavor.1108.desc: "床边的烛火轻晃，祷词迟迟没有结束。\n\n我已经把熟悉的那一段念完了。后面该是沉默，我却不肯让沉默进来。沉默一来，另一件事就会占据它。我又添了几句，添完自己也知道不是祷词。\n\n烛火斜向床帐。我跪着，衣襟已经皱了。"
 latria_sexual_frustration_flavor.1108.a: "暂放贞洁誓词，承认自己的渴望。"
 latria_sexual_frustration_flavor.1108.b: "收束念头，继续诵读祷文。"
 latria_sexual_frustration_flavor.1108.c: "慢慢念完祷词，不再与念头争执。"

 latria_sexual_frustration_flavor.1109.t: "未决的议事"
 latria_sexual_frustration_flavor.1109.desc: "臣下已经列出三种处置办法，我却迟迟没有作出裁决。第一种最稳，第二种最省，第三种最合乎旧例。我都听见了，也都点了头，点完仍说不出选哪一个。\n\n书记官的笔停在半空。有人把水盏往我手边推了推。我看着水面上自己的倒影，忽然走神，走到一个与粮秣无关的人身上。那人此刻不在这间屋里。我仍能想起那人说话时的停顿。\n\n沉默长得让人难堪。我清了清嗓子，还是没有给出句子。"
 latria_sexual_frustration_flavor.1109.a: "结束议事，让我独自想一会儿。"
 latria_sexual_frustration_flavor.1109.b: "把心事压下，命书记官继续记录。"
 latria_sexual_frustration_flavor.1109.c: "暂歇片刻，排好余下的议程。"
 latria_sexual_frustration_flavor.1109.d: "将要紧的裁决逐项理清，当场办妥。"

 latria_sexual_frustration_flavor.1110.t: "深夜的房间"
 latria_sexual_frustration_flavor.1110.desc.clergy: "我披着寝衣回到自己的小室。夜祷已毕，廊下的灯也灭了大半。那封未寄出的信却还摊在桌上，压住一串念珠。\n\n我本该把念珠收回匣里，把信也收起来。手放到纸上，就停住了。信里的句子我已经背下来，背下来仍想再看一遍那个人的名字被我写成什么样。墨有一处洇开了，像是写的时候手不稳。\n\n小室里很静。我站在桌边，寝衣的带子没系紧。"
 latria_sexual_frustration_flavor.1110.desc.adventurer: "客栈中只剩几盏灯。我穿着寝衣坐在床沿，行囊已经捆好，只有那封未寄出的信还露在外面。\n\n隔壁有人翻身，床板响了一下。我等那声音过去，才把信抽出来。路上的尘土沾在纸边上。我吹了吹，尘土不去，句子倒像更清楚了。有一句我不该写，它偏偏写在最中间。\n\n我把信折上，折缝却对不齐原来的印。"
 latria_sexual_frustration_flavor.1110.desc: "门外的声响渐渐远去，我仍在床边等候。\n\n并没有人和我约定今夜。我还是把灯留着，把外衣放在手够得到的地方。每有脚步经过，我就抬一次头。脚步都走远了。\n\n灯油下去一截。床的另一侧仍是空的，我却还没有躺下。"
 latria_sexual_frustration_flavor.1110.a: "写完那封信，留待清晨送出。"
 latria_sexual_frustration_flavor.1110.b: "闩好房门，今夜不再想它，早些歇息。"
 latria_sexual_frustration_flavor.1110.c: "披上外衣，出去喝杯热汤。"
