l_simp_chinese:
 latria_sexual_frustration_flavor.1311.t: "家宅醒来之前"
 latria_sexual_frustration_flavor.1311.desc: "天还没亮我就醒了，睡裙卷到大腿以上，手已经按在两腿之间。我没有把手挪开。梦还压在身上，是那个不在这个房间里的人的重量，身子已经决定替我把梦做完。\n\n我闭着眼任它继续，呼吸渐渐变短，掌根按着早已学会的缓慢节奏。齿后压着一个名字。我没有出声，走廊的木板正在仆人脚下作响。\n\n它过去时我一动不动，手指湿着，髋下的被单也湿了。脚步走过门口，远了。我把睡裙拉下来，布贴住了。"
 latria_sexual_frustration_flavor.1311.a: "任它完事，然后起身穿衣。"
 latria_sexual_frustration_flavor.1311.b: "把手挪开，静躺到钟声。"
 latria_sexual_frustration_flavor.1311.c: "起身梳洗，带着那点酸胀坐一会儿。"

 latria_sexual_frustration_flavor.1312.t: "梨树上的接枝"
 latria_sexual_frustration_flavor.1312.desc: "园子还留着夜雨的湿，那个我躲了整周的人正指给我看梨树上新接的枝。那人的手指覆在我手背上，带着我的手沿切口摸过去。示范完了，谁也没有先松手。\n\n那人拇指抵着我的腕，脉搏在指下跳。树篱那边两个家仆在为一副马鞍争执。我只要偏一偏头，对方也偏一偏，我们做的事就再没法算作园艺。\n\n那人说这枝到秋天会活。手还在我手上。一枝树梢滴下水来，落在我的袖上，我没有擦。"
 latria_sexual_frustration_flavor.1312.a: "就在树下把想要的说清楚。"
 latria_sexual_frustration_flavor.1312.b: "谢过这一课，退开一步。"
 latria_sexual_frustration_flavor.1312.c: "留下，改说一件真话。"

 latria_sexual_frustration_flavor.1313.t: "桌子的那一头"
 latria_sexual_frustration_flavor.1313.desc: "酒已过了两轮，厅里吵得没人听得清某一句话。我盯着桌子那一头的同一个人看了半个时辰，看那人笑时喉间那道线。\n\n我可以说出来。不必全部，只要一点，对方就知道我说的不是天气。我的邻座会听见。末席那位管事也会，那人把听来的话一字不改地带回内宅。\n\n那人捏着杯脚转了转，从杯沿上方看我。我张开嘴。乐师又起了一段，我要说的话被鼓声压了下去。"
 latria_sexual_frustration_flavor.1313.a: "说得响一些，让人听见。"
 latria_sexual_frustration_flavor.1313.b: "咬住舌头，让酒去替我做。"
 latria_sexual_frustration_flavor.1313.c: "转向邻座，把它做成一场游戏。"

 latria_sexual_frustration_flavor.1314.t: "第一个字"
 latria_sexual_frustration_flavor.1314.desc: "我跪在这冷石上够久了，石板在小腿上压出印子，那些词已经不再是词。我的心一遍遍回到一张不该在这座建筑里记起的嘴，它张开的样子，从里面出来的那点声音。\n\n引导者在读经台上等着，那份耐心像听过世上所有告解的人。我可以告诉那人。说出口就是一扇我再关不上的门，而我的身子要那扇门今夜开着，灯还亮着。\n\n我只说出第一个字。我们之间的烛在穿堂风里歪了一下，我看着蜡油淌到铁盘上，在那里凝住。"
 latria_sexual_frustration_flavor.1314.a: "说出来，让庙来判我。"
 latria_sexual_frustration_flavor.1314.b: "把告解留着，领受罚祷。"
 latria_sexual_frustration_flavor.1314.c: "要一本书，读到抖停为止。"
 latria_sexual_frustration_flavor.1314.d: "守夜到天明。"

 latria_sexual_frustration_flavor.1315.t: "桤木丛"
 latria_sexual_frustration_flavor.1315.desc: "围猎散了，我追着一头并不存在的野猪进了桤木丛。那个我想与之独处的人找到我时，我的马裤敞着，手在自己身上，对方没有转开脸。\n\n那人在湿叶子里跪下来。我一只手在那人的发间，另一只手撑着树干，号角在东边某处响着，近得我们本不该如此。谁也没有停。对方把我含进嘴里，我只能咬住腮内提醒自己别出声。\n\n事后我两膝全是泥，腿上粘着一片叶子。那人用手背擦了擦嘴，说野猪往北去了。"
 latria_sexual_frustration_flavor.1315.a: "让围猎自己去，我不追了。"
 latria_sexual_frustration_flavor.1315.b: "上马归队，把自己该得的位置挣回来。"
 latria_sexual_frustration_flavor.1315.c: "辨地上的痕迹，跟着走。"

 latria_sexual_frustration_flavor.1316.t: "歪掉的印"
 latria_sexual_frustration_flavor.1316.desc: "议事会为同一份请愿争了一个时辰，我什么都没签。桌下我两手交叠在膝上，想的是征途最后一夜，那顶帐篷，那个不敲门就进来的人，直待到换岗才走。\n\n宰相问我是否同意。我说同意，却不知自己同意了什么。印从戒指上带着体温。我把它压进蜡里，印出来的纹是歪的，有一边的字重了一道。\n\n他们抱着文书鱼贯而出。我留在椅中，面前是那道歪印，屋里还是别人蜡烛的气味。"
 latria_sexual_frustration_flavor.1316.a: "连印一起，把念着的那个人召来。"
 latria_sexual_frustration_flavor.1316.b: "放下印，回去看请愿。"
 latria_sexual_frustration_flavor.1316.c: "把议事会叫回来，把事做完。"

 latria_sexual_frustration_flavor.1317.t: "页边的一行"
 latria_sexual_frustration_flavor.1317.desc: "考院已经扫过，静得只剩我这一人对着注疏。字不肯停住。同一句讲克制的话我读了四遍，每一遍读到的都是一双我放开得太晚的手，在走廊上，灯正过来。\n\n我用自己的手在页边写了一行诗，与注疏全无关系。考官若看见，会知道那是写给谁的，写给哪一个。我可以烧掉这页。炭盆就在三步之外，炭还红着。\n\n我又把那行抄了一遍，更工整些，最后一笔时笔在抖。"
 latria_sexual_frustration_flavor.1317.a: "把诗抄出去，由人去看。"
 latria_sexual_frustration_flavor.1317.b: "合上书，在席上睡。"
 latria_sexual_frustration_flavor.1317.c: "回到注疏，从头再来。"
 latria_sexual_frustration_flavor.1317.d: "给那行诗配上朝中唱的调子。"

 latria_sexual_frustration_flavor.1318.t: "院中两杯酒"
 latria_sexual_frustration_flavor.1318.desc: "宴席散到院子里，我那位最老的朋友端着两杯酒跟出来。我没有告诉过任何人，没告诉神父，没告诉仆人，也没告诉相关的那一个。今夜酒让这份不告诉变得很沉，像满杯那样沉。\n\n我可以把它放进那人手里，让那人替我担一些。那人不会笑。也不会忘，此后每回在大厅里抬眼，我们之间就横着这个，一样有名字的东西。\n\n那人递给我一杯，等着，喷泉在身后一直流。我一口喝干，冰裂了一声，又静下去。"
 latria_sexual_frustration_flavor.1318.a: "说出口，让那人替我收着。"
 latria_sexual_frustration_flavor.1318.b: "今夜起戒了它，说说就算数。"
 latria_sexual_frustration_flavor.1318.c: "念书给那人听，念到院中无人。"

 latria_sexual_frustration_flavor.1319.t: "园墙下"
 latria_sexual_frustration_flavor.1319.desc: "那人背抵园墙，衣裳推到髋上，我的手在两腿之间，路径上随便谁走过都看得见。早就湿了，从走廊那会儿就是。\n\n我两指探进去，一只手抓住我的手腕按在那里，更用力，额头抵在我肩上。呼吸乱了。墙那边还有个园丁在干活，锹刃磕在石头上一声一声。\n\n那人抖起来，指甲掐进我臂上。等站得住了，那人把衣裳抚平，低低叫了我的名字一次，像一个已经答过的问题。"
 latria_sexual_frustration_flavor.1319.a: "陪着站着，直到能走。"
 latria_sexual_frustration_flavor.1319.b: "把手收回来，道一声晚安。"
 latria_sexual_frustration_flavor.1319.c: "独自绕墙走远路回去。"

 latria_sexual_frustration_flavor.1320.t: "一份清单"
 latria_sexual_frustration_flavor.1320.desc: "我来庙里是为了摆脱它，结果跪在这里把它清点了一遍：某一段颈子的气味，某个人发出的声音，门洞里一具身子压在我身上的确切重量，一只手还平贴在门框上。\n\n引导者还醒着，在读书。我可以求那人罚我，那人会罚，我也会做，到第三夜我又会跪回这块石上，带着同一份清单，更长。\n\n我改口向那人要一本书。那人一言不发递给我，拇指还夹在自己那一页里，我捧着摊开，一行也没读。"
 latria_sexual_frustration_flavor.1320.a: "把它们一一点出来，让庙来答。"
 latria_sexual_frustration_flavor.1320.b: "求了罚祷，清单自己留着。"
 latria_sexual_frustration_flavor.1320.c: "听那人愿意说的那几句。"

 latria_sexual_frustration_flavor.1321.t: "路上三周"
 latria_sexual_frustration_flavor.1321.desc: "我们在路上三周了，出了上一座城，我还没和谁单独待过。马已卸鞍，火很低，男人们裹着斗篷睡在我一臂之外，近得能听见其中一个在磨牙。\n\n我手探进衣内，牙咬着自己的指节，听马在暗处换蹄，听哨兵的靴子踩过落叶。这费了很久，完了以后我并不满足，只是累，那点念想还在累底下。\n\n哨兵绕火回来，没有看我。我把斗篷拉上，看炭火慢慢发灰。"
 latria_sexual_frustration_flavor.1321.a: "夜里给多少就拿多少，然后睡。"
 latria_sexual_frustration_flavor.1321.b: "起身去换我该站的那班哨。"
 latria_sexual_frustration_flavor.1321.c: "独自操练到手臂发抖。"

 latria_sexual_frustration_flavor.1322.t: "使节的酒杯"
 latria_sexual_frustration_flavor.1322.desc: "使馆的桌子摆给十二人，我坐在他们使节旁边。使节族里待客有一条规矩，从引见起我就一直在想它，想到鱼上来，想到第二次斟酒。\n\n使节亲手替我添酒，管事的脸色不太好看。我在这里说错一句，下一班船就会把它写进公文，署我的名，用别人的笔迹。说对了也一样要进公文，还要在一间我永远不会进去的屋子里念出来。\n\n使节问起我们的婚俗。我答得很糟。烛烧到只剩烛芯，我们谁也没有叫人换一支。"
 latria_sexual_frustration_flavor.1322.a: "按对方族里的规矩答。"
 latria_sexual_frustration_flavor.1322.b: "道一句晚安，走。"
 latria_sexual_frustration_flavor.1322.c: "把话头拨回条约，按在那里。"

 latria_sexual_frustration_flavor.1323.t: "廊上的唱诗"
 latria_sexual_frustration_flavor.1323.desc: "唱诗班在楼上廊间练唱，我本该听那和声，眼睛却总落在领唱那位神父的嘴上，看那第三行怎么被含住。\n\n我如今到得早，走得晚。那吟唱替我胸口松开一点，祈祷做不到，而我知道它替的是什么。引导者留意到我待的时辰，什么也没说，这比责备更难受，因为那意味着在等。\n\n最后一个音在拱顶里散尽。我仍坐在长椅上，两手平放在膝头，直到司事带着钥匙过来。"
 latria_sexual_frustration_flavor.1323.a: "跟着唱，让声音替我把它带出去。"
 latria_sexual_frustration_flavor.1323.b: "守规矩，末一节之前就离席。"
 latria_sexual_frustration_flavor.1323.c: "同引导者去研那部乐谱。"

 latria_sexual_frustration_flavor.1324.t: "晨钟"
 latria_sexual_frustration_flavor.1324.desc: "我在被单里醒来，缠成一团，那一切还留在身上，睡裙卷到腋下，手已在两腿之间，人还没全醒。梦在散，我追着它，髋抬起来，全不管隔壁有谁，也不管钟到几点。\n\n它来时冲得我大腿发抖。我躺着，手指还在自己身体里，呼吸在静里响得清楚，身下的被单湿透了，空气碰到的地方已经凉了。\n\n晨祷的钟开始响。我把湿被单抽出来放进盆里，水立刻浑了。"
 latria_sexual_frustration_flavor.1324.a: "完了事，洗净，去应钟声。"
 latria_sexual_frustration_flavor.1324.b: "把被单拖下来，不洗就走。"
 latria_sexual_frustration_flavor.1324.c: "坐到棋盘前，等手稳下来。"

 latria_sexual_frustration_flavor.1325.t: "那扇门"
 latria_sexual_frustration_flavor.1325.desc: "角上有人开局，我连输三把，因为我一直看着那扇门。我等的人迟了，而这厅里人人都知道我是谁，知道我嫁娶的是谁，也知道他们哪一位在看着我。\n\n我可以站到长凳上说出来。厅会静下来，静成那种样子，到明早，从这儿到海边每一座厅里都会传，我的名字在前，家族的名字在后，这两个名字再分不开。\n\n门开了。是端酒来的仆人。我递出杯子，手很稳，这更糟。"
 latria_sexual_frustration_flavor.1325.a: "站起来，说给满厅的人听。"
 latria_sexual_frustration_flavor.1325.b: "坐着不动，让牌局继续。"
 latria_sexual_frustration_flavor.1325.c: "找那位朋友，坐过去。"

 latria_sexual_frustration_flavor.1326.t: "账册"
 latria_sexual_frustration_flavor.1326.desc: "管事把账册、地图和我该尽的义务都摊开了，我一样没读。我在想春天路过那座城的一扇门，和门后暗里有人念我名字的口气，念了两遍，门闩才动。\n\n要做的事很多，而只能我去做。我蘸了笔写下第一个数目，写错了，划掉时用力太猛，笔尖裂了，墨拖过一整栏。\n\n我修好笔重新开始。窗外守军在操练，口令一声一声替我看着时间。"
 latria_sexual_frustration_flavor.1326.a: "撂下账册，派人去那座城。"
 latria_sexual_frustration_flavor.1326.b: "放下笔，把账簿拿起来。"
 latria_sexual_frustration_flavor.1326.c: "照着单子做到烛尽。"

 latria_sexual_frustration_flavor.1327.t: "高坡"
 latria_sexual_frustration_flavor.1327.desc: "我们从天亮骑到现在，四面草野空无一物，没有树，没有骑手，一直空到天边。身上的不安静从第二天在鞍上就开始了，骑行本身一点也没让它平息，只让它更糟。\n\n其余人在四分之一里外赛马。我在坡顶勒住马，把手探进马裤，风扑在脸上，四下无人看见，几下就完了事，马在我身下一直换步。\n\n我系好裤带骑下去。族兄问我笑什么，我说这马好。"
 latria_sexual_frustration_flavor.1327.a: "草原给这一刻，我就拿这一刻。"
 latria_sexual_frustration_flavor.1327.b: "继续骑，把它丢在脑后。"
 latria_sexual_frustration_flavor.1327.c: "放鹰到手臂发酸。"

 latria_sexual_frustration_flavor.1328.t: "守夜"
 latria_sexual_frustration_flavor.1328.desc: "我从日课起就待在庙里，现在还在。灯添过两次油，油是廉价作坊里榨的，气味发闷。膝头从疼变成一种麻，那点念想没有走，它安顿下来，住得舒服。\n\n守夜本该把人清空。它做的是给那点念想腾出地方，像暗室给站在里面的东西一个形状。我可以走。门没有锁，城也不远。\n\n我又从头念那篇圣咏。声音出来是稳的，我因此有点恨它。"
 latria_sexual_frustration_flavor.1328.a: "中断守夜，进城去。"
 latria_sexual_frustration_flavor.1328.b: "守到天色发灰。"
 latria_sexual_frustration_flavor.1328.c: "把圣咏从头读到尾。"

 latria_sexual_frustration_flavor.1329.t: "四行"
 latria_sexual_frustration_flavor.1329.desc: "我穿着睡裙站在窗前，窗台上一封信写了没送。四行。最后一行用我白天不会用的字眼说了我要什么，墨已干，封蜡还没破。\n\n我可以把它交给门口的仆人。我也可以烧了它，我已经烧过三封，灰还在炭盆里。身子对烧不感兴趣。它要的是给出去之后那个回答。\n\n烛只剩一小截，蜡油淌出盘沿。我又读那最后一行，纸在手里抖。"
 latria_sexual_frustration_flavor.1329.a: "把信交给仆人。"
 latria_sexual_frustration_flavor.1329.b: "投进炭盆，去睡。"
 latria_sexual_frustration_flavor.1329.c: "坐在窗边，等那一小截烛灭。"

 latria_sexual_frustration_flavor.1330.t: "边界那一条"
 latria_sexual_frustration_flavor.1330.desc: "老师的书房里是灰尘和冷墨的味道，条约我一个字没听进去。我在看那双手，指侧那点墨，看那页怎么被按住。\n\n那人年纪够做我父亲，比父亲还谨慎，这里没有什么，也不需要有什么。那点念想不来问准许，它坐在我里面，看那人翻页，用指甲去找下一条。\n\n那人问我听懂了没有。我说懂了。看我的时间比问句需要的长了一点，然后回到那一页。"
 latria_sexual_frustration_flavor.1330.a: "改写一首关于边界的诗。"
 latria_sexual_frustration_flavor.1330.b: "求那人听我告解。"
 latria_sexual_frustration_flavor.1330.c: "把那一条一字不差地背回去。"

 latria_sexual_frustration_flavor.1331.t: "缓慢的时辰"
 latria_sexual_frustration_flavor.1331.desc: "宅子都睡了，我却醒着，醒了一个时辰。睡裙卷到胯上，手指不知何时已按在自己的湿处。我没挪开，任那个从走廊起就绕着我的念头浮上来，是那个俯身替我理正衣领、事后却没有退开的人。\n\n我按着记忆里身子教会我的样子揉弄，先慢，后不慢，另一只手压在床头板上，免得它磕着墙。楼下有扇仆役的门，一道会叫的楼梯。我没有停。呼吸乱了，我把脸埋进枕头，把那点声音咽下去。\n\n它过去时我还枕着，手指仍抵着自己，底下脉搏跳个不停。楼梯又叫了一声，静了。我把睡裙拉下来，布是湿的，贴住了。"
 latria_sexual_frustration_flavor.1331.a: "任它完事，趁钟响前穿衣。"
 latria_sexual_frustration_flavor.1331.b: "把手挪开，静躺着。"
 latria_sexual_frustration_flavor.1331.c: "梳洗，带着那点酸胀坐到它钝下去。"

 latria_sexual_frustration_flavor.1332.t: "冰冷的中殿"
 latria_sexual_frustration_flavor.1332.desc: "我到神庙来，是想把自己掏空，却在冷石上跪到那点渴望反倒沉得更深。它如今有了一张脸，是宴上听我告解的那个人，侧着头倾听的样子，拇指在杯上挪动的样子。我的手在袍下，侧廊的暗里没人看得见。\n\n我盯着祭坛的灯，任手指慢慢动作，牙关咬紧。屏后某处一扇门开了，辅祭进来做夜课，脚踩在石板地上。我该停下。手没有停。我把额头抵在交叠的手背上，从齿缝里出气。\n\n它过去了，只留我空落落地发抖。辅祭起了圣咏。我跪到两腿发麻，眼里只剩那盏灯还看得进去。"
 latria_sexual_frustration_flavor.1332.a: "到告解室说出那个名字，领受补赎。"
 latria_sexual_frustration_flavor.1332.b: "守夜到天色发灰。"
 latria_sexual_frustration_flavor.1332.c: "把圣咏集从头读到尾。"

 latria_sexual_frustration_flavor.1333.t: "青绿的洼地"
 latria_sexual_frustration_flavor.1333.desc: "我把那个想要的人从狩猎里引开，带进一处叶隙漏下绿光的洼地。我的马裤敞着，那人的手在我身上，我的手在那人衣下，谁也不再假装这跟鹿有关。早就湿了，自我在浅滩边扣住那只手腕起就湿了。\n\n我把手指探进去，那人倒抽一口气，用自己的嘴堵住我的，用力，另一只手攥紧我的衣领。号角在林间某处响起，狩猎在不远处转向。我们没有停。掌心下有身子在起伏，呼吸一阵阵短促地打在我颊上。\n\n那人颤了颤，不动了，攥着我的手腕。号角往东去远了。手抖着理好衣裳，一片叶子从发间落下。"
 latria_sexual_frustration_flavor.1333.a: "任狩猎撇下我们继续。"
 latria_sexual_frustration_flavor.1333.b: "回到鞍上，去挣回我的位置。"
 latria_sexual_frustration_flavor.1333.c: "绕远路回去，让自己凉下来。"

 latria_sexual_frustration_flavor.1334.t: "条约的页边"
 latria_sexual_frustration_flavor.1334.desc: "书房里冷，条约摊开着，同一条款我读了三遍。送来条约的使节走了，记忆却没走，走廊上那一个时辰，我把人抵在墙上，手探进那人上衣里，嘴张着贴在我肩上，两人都竖耳听着脚步。\n\n我的手不知不觉又滑到桌下的膝上。我逼自己挪开，把它平摊在纸页上。墨在掌心下已经干了。我若把此刻所想写进页边，文书明早就会誊清、传阅一遍。\n\n我蘸了笔，把条款重新写对，写到末一字时手已不稳。烛火跳了跳，我剪了烛芯。"
 latria_sexual_frustration_flavor.1334.a: "把想要那人的话说明白。"
 latria_sexual_frustration_flavor.1334.b: "祝那人安好，退开一步。"
 latria_sexual_frustration_flavor.1334.c: "摆开棋盘，下到两手都稳。"

 latria_sexual_frustration_flavor.1335.t: "挂毯之后"
 latria_sexual_frustration_flavor.1335.desc: "宴席正闹，乐师在两支曲子之间歇着，我把盯了整晚的那个人带到挂毯后头，灯照不到的地方。我的手已探进那人袍底，那人背抵着墙，咬着自己的唇不出声。我另一只手覆在那人嘴上，不用力，刚够。\n\n厅就在布帘三尺之外。一只杯子碎了，有人笑起来。掌心下的手指动了动，眼睛闭上，我感到那阵战栗穿过那具身子，气息又热又急地喷在我手上。\n\n那人稍稍一软，我扶住。挂毯那边乐声又起。那人理好袍子先溜了出去，我又等了一会儿才跟出去。"
 latria_sexual_frustration_flavor.1335.a: "溜回去，坐回我的位子。"
 latria_sexual_frustration_flavor.1335.b: "在布帘后多留一会儿。"
 latria_sexual_frustration_flavor.1335.c: "寻到我的朋友，坐过去。"
