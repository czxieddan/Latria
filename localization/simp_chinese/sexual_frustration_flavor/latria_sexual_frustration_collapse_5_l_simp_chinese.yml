l_simp_chinese:
 latria_collapse_no_relief_tt: "性压抑没有缓解。"

 latria_sexual_frustration_flavor.1501.t: "灯还亮着"
 latria_sexual_frustration_flavor.1501.desc.dead: "短刃从手中滑落，碰在地上的声音使门外的人停住了脚步。房门被推开，有人蹲到我身旁，喊着我的名字，又回头叫人去求援。灯还放在原处，我却看不清来人的面容。\n\n我想让众人知道自己听得见，嘴唇动了动，却没有发出声音。方才独处时反复想过的话，此刻一句也记不完整。有人握住我的手，问我能不能睁开眼睛，我只能望着来人身后那道门。\n\n更多脚步涌进屋里。我想循声转头，门边的人影却已经模糊，最后连灯火也辨认不出了。"
 latria_sexual_frustration_flavor.1501.desc.survived: "我醒来时，寝衣已经换过，伤处也被仔细包扎。床边的人见我睁眼，立即叫住正要离开的侍从。听说有人察觉动静，及时推门进来，短刃如今已经收走了。\n\n我试着撑起身子，还没离开枕头便疼得停住。那人替我掖好被角，问我要不要喝水，我点了头，却又望向案上没有寄出的信。几张纸仍叠在那里，最上面露着一个改过多次的称呼。\n\n水杯被递到唇边，我只饮了一口。守在床边的人没有离开，待我躺稳，才轻轻把杯子放下。"
 latria_sexual_frustration_flavor.1501.desc.severe: "我从昏迷中醒来，先听见床边压低的说话声。有人问这样的伤还能不能养好，回答的人迟疑了一会儿，才叫人另取干净的布来。我想转身看清是谁，刚动一下便疼得说不出话。\n\n短刃已经不在手边，连床旁的小桌也被搬远了。我叫人扶我坐起，身旁的人却只垫高枕头，劝我暂且躺着。窗外的天色已经变过，我仍想起那些辗转难眠的夜晚，想起一直没有等到的回信。\n\n一只手伸来整理被褥。我想请对方慢些，话还未说完，便攥住了身下的床单。"
 latria_sexual_frustration_flavor.1501.a.dead: "眼前……越来越暗……"
 latria_sexual_frustration_flavor.1501.a.survived: "好痛……"
 latria_sexual_frustration_flavor.1501.a.severe: "别碰我……好痛……"

 latria_sexual_frustration_flavor.1502.t: "空下的杯子"
 latria_sexual_frustration_flavor.1502.desc.dead: "杯子已经空了，我伏在床边，听见房门被人推开。来人先叫了我的名字，看见桌上的东西后便转身呼喊，连门也顾不上关。廊下有人跑起来，带进屋里的风吹动了那封未写完的信。\n\n我还记得最后一句只写了一半，笔就搁在纸旁。有人扶住我的肩，问我饮下了什么，又叫我再坚持片刻。我望向桌边，想把没说清的话补上，手却连垂在眼前的纸角也碰不到。\n\n那人仍在叫我，声音却渐渐远了。我看不清信上的字，也再没能应上一声。"
 latria_sexual_frustration_flavor.1502.desc.survived: "我饮下的毒药没能致命。醒来时，屋里多了一盆清水。床边坐着一个守了许久的人，见我睁眼便起身招呼旁人，又回过头来，问我还认不认得这间屋子。\n\n桌上的杯子已被收走，未写完的信压在书下。我想伸手去取，才发觉自己连挪近床沿都很费力。守候的人把水递过来，等我喝完，又问那封信该交给谁，我看着露出的半行字，没有答话。\n\n窗外已经有人开始走动。我想起往日此时该做的事，只能靠在枕上，听侍从在门外劝走求见的人。"
 latria_sexual_frustration_flavor.1502.desc.severe: "毒药没有夺去我的性命，我却迟迟不能像往常那样自行起身。有人端来早饭，又把换洗的衣物放在床边，等我伸手时才发觉，那只平日用惯的碗如今也端不稳了。\n\n侍从替我把袖口理好，将饭食一口口送来。我想问自己躺了多久，话说到一半便得停下歇息。案上积了几封新信，侍从问要不要念给我听，我先请人找找有没有那个熟悉的名字。\n\n侍从逐封看过，轻轻摇头。我望着那叠信，抬手想把碗推远一点，却还得等人俯下身来。"
 latria_sexual_frustration_flavor.1502.a.dead: "我……说不出话了……"
 latria_sexual_frustration_flavor.1502.a.survived: "难受……给我一点水……"
 latria_sexual_frustration_flavor.1502.a.severe: "连抬手的力气都没了……"

 latria_sexual_frustration_flavor.1503.t: "河岸边"
 latria_sexual_frustration_flavor.1503.desc.dead: "我已经望不见河岸，只听见远处有人呼喊。方才还能听清有人在叫我的名字，这时却只剩断续的声响。我想朝那个方向看去，眼前晃动的光亮让我认不出岸上的树。\n\n离开住处时，灯似乎还没有熄，桌上的书也摊着。我曾在同一页停了很久，出门前却没有放好书带。有人会进屋收拾，会问我去了哪里；我想起那张熟悉的面孔，想告诉对方我在这里。\n\n又一声呼喊传来，我没能应答。眼前的光暗了下去，那间没有熄灯的屋子也渐渐想不清了。"
 latria_sexual_frustration_flavor.1503.desc.survived: "我被从河里救上来，醒来时正蜷在岸边，有人拿斗篷裹住了我。身旁的人见我睁眼，连忙朝远处招手，又蹲下来问我能不能听清。河水还从衣角滴下，我冷得无法回答。\n\n有人说已经叫人去找担架，劝我别急着站起。我望向回住处的小路，想起独自走来时还在反复斟酌的那句话。旁边的人问要通知谁，我说出一个名字，又怕对方没有听见，低声重念了一遍。\n\n斗篷被重新拢紧。有人答应替我传话，留在身旁的人扶住我的肩，陪我等候路上的脚步。"
 latria_sexual_frustration_flavor.1503.desc.severe: "人们将我抬上河岸时，我只记得有人催促快些回去。再醒来，湿衣已经换掉，床前围着几个人。我想问一问自己昏睡了多久，一阵咳嗽却使我连开头的称呼也没说完。\n\n床边的人低声谈起肺病，又让人把窗掩好。额上的布换了几回，我始终分不清这是白日还是夜里。偶尔清醒，我仍会望向门口，等一个熟悉的人进来；门边却只是送水的侍从，轻声问我需要什么。\n\n我摇摇头，想靠着枕头坐稳。床边的人刚伸手来扶，咳嗽便又打断了尚未出口的话。"
 latria_sexual_frustration_flavor.1503.a.dead: "好冷……"
 latria_sexual_frustration_flavor.1503.a.survived: "我还……活着？"
 latria_sexual_frustration_flavor.1503.a.severe: "咳……喘不过气了……"

 latria_sexual_frustration_flavor.1504.t: "崖下"
 latria_sexual_frustration_flavor.1504.desc.dead: "我躺在崖下，听见搜寻的人沿着山路呼喊。有人喊我的名字，另一人催同伴往低处找，零碎的石子从附近滚过。我想抬起手让人看见，手却仍停在身旁，连衣角也没有带动。\n\n山影挡住了大半天色，我记不清离开住处已有多久。出门时有人问我何时回来，我随口说了一个时辰，如今却想不起自己答了什么。脚步越来越近，我张开口，仍没能发出声音。\n\n有人终于停在近处，俯身叫我。我看不清来人的面容，连头顶剩下的那片天色也辨认不出了。"
 latria_sexual_frustration_flavor.1504.desc.survived: "我在崖下醒来，有人正蹲在身旁呼唤我。见我有了回应，那人回头招手，让同伴沿着山路下来。我想问这里是什么地方，话到嘴边才认出上方的崖壁，随后便不敢再看。\n\n坠落留下的伤让我无法起身，稍稍挪动也得停下来喘息。那人让我等担架，捡起落在一旁的外衣盖住我。我望着衣扣，想起出门前还对着镜子整理过它，心里惦记的也是那封没有回音的邀约。\n\n脚步到了近处，几个人低声商量怎样抬我。我想配合着转身，还没动便先喊出了声。"
 latria_sexual_frustration_flavor.1504.desc.severe: "我在崖下醒来，救援的人围在身旁，谁也没有先开口。我认出其中一人，问是不是该回去了。那人把我的外衣盖好，又望向山路，催带担架的人再快些。\n\n我试着起身，便有人扶住我，劝我不要动。我低头看向双腿，身旁的人迟疑着说，往后恐怕不能像从前那样行走了。落在旁边的鞋还沾着泥，我望着它，想起那些在廊下等候回信的夜晚。\n\n有人问我还缺什么。我想请人把鞋拾来，开口却先问起住处有没有消息，一时无人回答。"
 latria_sexual_frustration_flavor.1504.a.dead: "我听不见了……"
 latria_sexual_frustration_flavor.1504.a.survived: "动不了……好痛……"
 latria_sexual_frustration_flavor.1504.a.severe: "我的腿……"

 latria_sexual_frustration_flavor.1505.t: "被推开的房门"
 latria_sexual_frustration_flavor.1505.desc.dead: "寝室的门被撞开时，我听见有人急切地叫着我的名字。廊下的光照进屋里，几个人挤在门边，又被前面的人催着去求援。信还放在床旁，我想提醒来人，目光却已经挪不过去了。\n\n有人靠近，声音熟悉得让我想答应一声。我明明听懂了那些话，却怎么也说不出口，只看见那人的嘴不停地动。门外又有人问了什么，对方没有回头，仍俯在近处，等我给一点回应。\n\n我想再看清那张脸，眼前却越来越暗。门口的光亮消失了，随后连呼唤也听不见了。"
 latria_sexual_frustration_flavor.1505.desc.survived: "寝室的门被人撞开，我被及时救了下来。我躺在床上，看见门闩已经歪了，侍从搬来一把椅子守在外面。有人替我整理枕头，问我能否说话，我只嘶哑地应了一声。\n\n绳索已经不见了，床旁那封信也换了地方。我想翻身找它，伤处却让我停在半途。照料我的人循着目光望过去，取来信放在我能看见的地方；末尾那个没有写全的名字，仍让我迟迟移不开眼。\n\n我抬手示意先别问。那人点点头，将水放近，等我慢慢缓过这一阵，才替我盖好被子。"
 latria_sexual_frustration_flavor.1505.desc.severe: "有人在床边叫我的名字，我知道对方在等我回答，却不明白自己该说什么。寝室里的摆设都像见过，窗边那张椅子却仿佛换了地方。我盯着它，直到有人把我的衣袖拉正。\n\n有人替我换洗，又端来饭食。我看着递近的勺子，等身旁的人开口提醒，才记起要张嘴。有人提到那封信，另一个人便朝床边的匣子看了一眼。我也望过去，刚想问，便忘了自己要问哪一句。\n\n匣盖已经合上。床边的人又叫我的名字，这次我转过头，看见面前的人停住了手里的动作。"
 latria_sexual_frustration_flavor.1505.a.dead: "我……"
 latria_sexual_frustration_flavor.1505.a.survived: "让我……喘口气……"
 latria_sexual_frustration_flavor.1505.a.severe: "有人……在叫我吗？"
