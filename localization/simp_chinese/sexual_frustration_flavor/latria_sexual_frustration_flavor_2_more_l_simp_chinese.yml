l_simp_chinese:
 latria_sexual_frustration_flavor.1111.t: "二更"
 latria_sexual_frustration_flavor.1111.desc: "二更时我醒过来，床单缠在小腿上。灯油烧得只剩拇指那么一截火。手已经放在小腹上，是自己的身体焐热的，我把它挪开。\n\n黄昏时有过一瞬。有人探身越过我去拿盐，一条小臂擦过我手腕的背面，那一口气的长度里我们谁都没有动。那口气我回味的次数比整场谈话都多。\n\n我把手掌平贴在髋边的褥子上。那里的麻布还是凉的。我就让它凉着。"
 latria_sexual_frustration_flavor.1111.a: "把手放回小腹上。"
 latria_sexual_frustration_flavor.1111.b: "翻个身，等睡意回来。"
 latria_sexual_frustration_flavor.1111.c: "躺着不动，等这阵过去。"

 latria_sexual_frustration_flavor.1112.t: "两人之间的杯子"
 latria_sexual_frustration_flavor.1112.desc: "酒杯顺着长凳一路传下来，到我手里时杯沿还湿着别人的唇印。我就着湿的地方喝。桌子对面有人看着我这么做，没有转开眼。\n\n我们说了会儿马。桌子底下，一只膝头靠过来，压得不重，只是挨着，我却仍旧在讲马。\n\n仆人来添酒。膝头挪开了，去招呼一位叔父。我两手捧着杯子，酒已经温了。"
 latria_sexual_frustration_flavor.1112.a: "把那只膝头的意思，说明白。"
 latria_sexual_frustration_flavor.1112.b: "谢过席上众人，早些回去。"
 latria_sexual_frustration_flavor.1112.c: "留下，把马一直说到席散。"

 latria_sexual_frustration_flavor.1113.t: "一支跳得太久的舞"
 latria_sexual_frustration_flavor.1113.desc: "乐声一转，我就被交到下一个舞伴手里。第三个握我的手多按了一拍，拇指压在我腕内侧跳着的地方，笑得像那只是失手。\n\n厅那头有人笑。我没有回头看是谁。我脸上发热，烛光里藏不住。\n\n这一节舞罢了。我靠在柱子边，手还半握着，那根拇指的形状留在皮肤上。乐师又起了头。"
 latria_sexual_frustration_flavor.1113.a: "举杯敬那位舞伴，敬得满堂都听见。"
 latria_sexual_frustration_flavor.1113.b: "向众人行礼，离开舞池。"
 latria_sexual_frustration_flavor.1113.c: "去最静的角落，慢慢喘一口气。"

 latria_sexual_frustration_flavor.1114.t: "回程很长"
 latria_sexual_frustration_flavor.1114.desc: "雨打在叶子上，鹿早跑了一个时辰。我落在后头，赶猎人说话的声音在前面散掉。马鞍把我的两条腿颠得发酸，这酸要一直提醒我有一具身体，直到入夜。\n\n溪边有人替我带住马缰，马已经站定了，那只手还搭在皮带上。水从一条辫子的末梢往下滴。我们都没有提雨。\n\n再往前骑。湿皮子每一步都吱一声，我就数那响声，什么也不想。"
 latria_sexual_frustration_flavor.1114.a: "让这一场猎跑到天黑。"
 latria_sexual_frustration_flavor.1114.b: "看着路，别抬头。"
 latria_sexual_frustration_flavor.1114.c: "低头看折断的草茎、一枚蹄印。"
 latria_sexual_frustration_flavor.1114.d: "再放一次鹰。"

 latria_sexual_frustration_flavor.1115.t: "第三时辰的跪"
 latria_sexual_frustration_flavor.1115.desc: "我跪到膝头在石地上发疼，那点疼是我唯一能抓住的东西。灯油发酸了。今早我的身体不肯安静，它要，而且是朝着那个修房梁的俗人去的。\n\n我念日课。念到第四行走了神，又从头起。\n\n石头上的冷透过僧衣。别人都起身了，我还跪着，这点冷不够。"
 latria_sexual_frustration_flavor.1115.a: "在告解里说出来，之后再补赎。"
 latria_sexual_frustration_flavor.1115.b: "守到钟响。"
 latria_sexual_frustration_flavor.1115.c: "拿起注疏，把这一章读完。"

 latria_sexual_frustration_flavor.1116.t: "神父没有问的那一句"
 latria_sexual_frustration_flavor.1116.desc: "我的神父与我并肩走回廊，什么也不问，这比问更难受。我说懒惰的罪，答我的是收成。\n\n袖口磨破了，打手势时线头一动一动。我看那只藏在袖子里的手腕，然后又想起懒惰，收成全丢了。\n\n到门口神父为我祝祷。我握着那只手，比祝祷所需多留了一瞬。神父让我留着。"
 latria_sexual_frustration_flavor.1116.a: "把整件事说给神父听。"
 latria_sexual_frustration_flavor.1116.b: "求一桩补赎，我照做。"
 latria_sexual_frustration_flavor.1116.c: "把收成的事听完。"

 latria_sexual_frustration_flavor.1117.t: "议事之后的请愿"
 latria_sexual_frustration_flavor.1117.desc: "议事的人散了。我的宰相留下，要再压一桩请愿，我听见的是那人说话时嘴的形状，不是那些字。印玺还留着我手心的热。\n\n自宴后我没有和谁独处过。冠冕压在颈后，而颈后想要另一种重量。\n\n我准了。宰相行礼。我一直看着地图，直到门合上，然后又看着那扇门。"
 latria_sexual_frustration_flavor.1117.a: "烛灭之后，召一个人来。"
 latria_sexual_frustration_flavor.1117.b: "只守着公务，等请愿用印。"
 latria_sexual_frustration_flavor.1117.c: "下三桩请愿我自己看。"

 latria_sexual_frustration_flavor.1118.t: "花树上的梅酒"
 latria_sexual_frustration_flavor.1118.desc: "梅酒，第三杯，衣袖总在一擦一擦。我们这一族说话以诗句为步，一句近一步，侍女倚在栏边装作没听见。\n\n我让袖口滑开，露出腕子。另一只袖子没有退。花树底下有笛声起了一下，停了，又起。\n\n我把杯子搁在栏石上，喝了一半，酒里还盛着最后一点天光。那句直白的话，我们谁都没有说。"
 latria_sexual_frustration_flavor.1118.a: "回一句，让人无从误解。"
 latria_sexual_frustration_flavor.1118.b: "理好衣袖，说天气。"
 latria_sexual_frustration_flavor.1118.c: "独自把栏走到掌灯。"

 latria_sexual_frustration_flavor.1119.t: "未熄的灯"
 latria_sexual_frustration_flavor.1119.desc: "灯我没有熄，被单落到腰下。手从小腹那片温热的皮肤往下滑，这一次我没有拦它。我早就湿了，为着黄昏时想到的一张嘴贴在我喉上，指头滑得毫无阻碍。\n\n我想一具身体压在我身上的分量，那确切的分量，胯便抬起来迎空。我压着、揉着，呼吸在安静的屋子里碎掉。掌根碾在我想要的地方。\n\n它来时是一阵长长的战栗，腿还在抖。之后我把手臂搭在眼睛上，灯还亮着，身下的被单是湿的。"
 latria_sexual_frustration_flavor.1119.a: "让它到尽头，就躺在湿冷的暗里。"
 latria_sexual_frustration_flavor.1119.b: "把手拿开，去数梁上的椽子。"
 latria_sexual_frustration_flavor.1119.c: "剪一剪灯芯，在暗里躺着。"

 latria_sexual_frustration_flavor.1120.t: "来客的房间"
 latria_sexual_frustration_flavor.1120.desc: "厅里灯尽之后有人敲门。我开门时只穿着寝衣，并没有为谁梳妆。那道目光在我身上走了一遍，我没有去拿外衣。\n\n我们都不装。一张嘴找到我的喉，我的手已经在对方腰带上。我被抱上桌子时杯子倒了，滚开去。对方慢，我不耐。我听见自己的声音，那让我吃惊，也听见贴在我颈边的笑，那节奏没有变。\n\n后来酒从桌沿一滴一滴落到地上。谁都没有去擦。"
 latria_sexual_frustration_flavor.1120.a: "门不上闩，寝衣也不换。"
 latria_sexual_frustration_flavor.1120.b: "好好谢过，把门关上。"
 latria_sexual_frustration_flavor.1120.c: "坐在桌沿，说话到天亮。"

 latria_sexual_frustration_flavor.1121.t: "彩绘屏风之后"
 latria_sexual_frustration_flavor.1121.desc: "宴席早已过了礼数。屏风在厅角拉起来，后面的声音不是用饭的声音。一只手扣住我的腕，我随它去了。\n\n手比一个人的多。我不数了。地上的灯心草踩平了，一只杯子滚到我膝边，没有人捡。\n\n后来我靠着墙坐，头发散着，嘴唇肿着，肩上搭着不知是谁的斗篷。乐声还没有停。"
 latria_sexual_frustration_flavor.1121.a: "到屏风后面去，让满堂都听见。"
 latria_sexual_frustration_flavor.1121.b: "拒绝，守住我的杯子和座位。"
 latria_sexual_frustration_flavor.1121.c: "摆开棋盘，下到我的手不抖。"

 latria_sexual_frustration_flavor.1122.t: "诗的第四个字"
 latria_sexual_frustration_flavor.1122.desc: "写板搁在膝上，苇笔已经干了。我写了一首咏肩线的诗，四个字，四个都不对。\n\n屋子冷。我自己的呼吸很响。我把板子放到一边，用手背抵住嘴，那点念头哪儿也没去，只是换了个形状。\n\n我又拿起笔。这一行仍旧空着，墨在笔头的裂口里干住。"
 latria_sexual_frustration_flavor.1122.a: "写那只肩，再写下去。"
 latria_sexual_frustration_flavor.1122.b: "合上写板，把手放稳。"
 latria_sexual_frustration_flavor.1122.c: "读些枯燥的东西，读到困。"
 latria_sexual_frustration_flavor.1122.d: "在晚饭时把那半句念出来。"

 latria_sexual_frustration_flavor.1123.t: "鹰的分量"
 latria_sexual_frustration_flavor.1123.desc: "戴了头罩的鹰立在我的皮手套上，它的分量是今早唯一诚实的东西。我们蹲在湿草里等苍鹭。肩在烧。\n\n一条手臂靠过来，就不走了。鹰换了一下脚。我盯着芦苇。我的脉搏在耳朵里响，比这片沼泽还响。\n\n苍鹭没有来。我们回去时鹰骑在我拳上，草把靴子泡到脚踝。"
 latria_sexual_frustration_flavor.1123.a: "再出去，猎到天黑。"
 latria_sexual_frustration_flavor.1123.b: "别动，等沼泽静下来。"
 latria_sexual_frustration_flavor.1123.c: "放鹰，只看鹰。"

 latria_sexual_frustration_flavor.1124.t: "施舍箱"
 latria_sexual_frustration_flavor.1124.desc: "我把铜钱一枚一枚数进施舍箱，数钱是不必想的办法。一位施主的手也在箱里，我们的指头同在铜钱中，神父看着我们两个。\n\n这一件我没有告解。我不知道该管它叫什么。我的脸是整好的，整脸我练过。\n\n那只手抽了出去。我合上盖子，黄铜小锁咔一声，我自己的手不稳。"
 latria_sexual_frustration_flavor.1124.a: "买一支蜡烛，让神父看清我的脸。"
 latria_sexual_frustration_flavor.1124.b: "守夜到烛残。"
 latria_sexual_frustration_flavor.1124.c: "把圣咏再读一遍。"

 latria_sexual_frustration_flavor.1125.t: "子夜议定的条款"
 latria_sexual_frustration_flavor.1125.desc: "从正午议到现在，蜡烛只剩一截。对面那位把最后一款念出来，我应了，其实没听见，只听见一副下颌绕着一门外语在动。\n\n这不是第一夜。我清楚在哪一步之外我就没用了。\n\n我签。那人签。我的戒指压进火漆时漆还软，我的手很稳，我的胜就在这一处。"
 latria_sexual_frustration_flavor.1125.a: "等厅里空了，递一张纸去。"
 latria_sexual_frustration_flavor.1125.b: "只咬住条款，一字一字。"
 latria_sexual_frustration_flavor.1125.c: "把条约带走，一行一行读。"

 latria_sexual_frustration_flavor.1126.t: "草、风、敞开的衣领"
 latria_sexual_frustration_flavor.1126.desc: "马放开了去吃草，我们坐在毡上，鞍还在。同伴的族人说，骑手该能在鞍上睡。我连坐在地上都坐不住。\n\n有人说起一条我没见过的河。一件衫子在喉口敞着。风把草压成长长的一道，我看那喉口，不看河。\n\n一匹马打了个响鼻。我先转开眼，耳朵在风里发烫。"
 latria_sexual_frustration_flavor.1126.a: "用他们的话，说得难听也说出口。"
 latria_sexual_frustration_flavor.1126.b: "闭嘴，只看马。"
 latria_sexual_frustration_flavor.1126.c: "骑到风把它刮干净。"

 latria_sexual_frustration_flavor.1127.t: "枕上的凹"
 latria_sexual_frustration_flavor.1127.desc.female: "床上太热，被子被我踢到地上。寝衣卷到髋上。我把手放下去，身子先于我作了答，低处一阵急热，比我更急。\n\n我想走廊里那人念我名字的样子，第二个音是拖着的。我的指头动起来，呼吸就卡在那拖着的音上。\n\n我在结束之前停手。手放着不动，心跳着，身边那只枕头没有凹。"
 latria_sexual_frustration_flavor.1127.desc.male: "被子在地上，寝衣卷到髋上。手往下一探，我已经硬了，什么也没有，只有一条走廊和一个名字。\n\n我想一张嘴，胯不由我地一动。呼吸变短。我一瞬就能了结，我没有。\n\n我抽回手，躺平。屋里很静，那点胀不肯退。"
 latria_sexual_frustration_flavor.1127.desc: "床上太热。我把被子踢开，手一滑就滑下去，身子即刻应了我，比我更急。\n\n我想一条走廊，一个被念了两遍的名字，一只收回的袖子。呼吸短了。\n\n我抽回手，静静躺着。身边那只枕头没有凹。"
 latria_sexual_frustration_flavor.1127.a: "让手留在原处。"
 latria_sexual_frustration_flavor.1127.b: "两手交叠，侧身睡。"
 latria_sexual_frustration_flavor.1127.c: "起身坐到窗下，坐到天亮。"

 latria_sexual_frustration_flavor.1128.t: "敬酒"
 latria_sexual_frustration_flavor.1128.desc: "我起身祝酒，满堂的脸都是一团。有一张脸不是。我说着忠顺，说了一杯的长度，眼睛一再回去。\n\n高席上有人咳了一声。盘子还没撤，话已经进了厨房。我发现自己该在意的，并没有那么在意。\n\n我坐下。手握住杯脚，握得太紧。厅那边，那张脸还朝着我。"
 latria_sexual_frustration_flavor.1128.a: "说出我一直在看的人，敬一杯。"
 latria_sexual_frustration_flavor.1128.b: "只说忠顺，且是真意。"
 latria_sexual_frustration_flavor.1128.c: "端着杯子去另一头，与旧友同坐。"

 latria_sexual_frustration_flavor.1129.t: "第三章的注疏"
 latria_sexual_frustration_flavor.1129.desc: "我的神父念注疏，我用指头跟着字行走，跟的是那个声音。我的指头停了。\n\n翻页时我的指头挡在那里。念的人等着。我没有挪。我们之间的烛歪了一下，又直起来。\n\n念下去。第三章那个论证我一句也没跟住，屋里是蜡和墨的味道。"
 latria_sexual_frustration_flavor.1129.a: "承认走神，领受补赎。"
 latria_sexual_frustration_flavor.1129.b: "求一条更严的规矩，我守。"
 latria_sexual_frustration_flavor.1129.c: "从页首重新跟着走一遍。"

 latria_sexual_frustration_flavor.1130.t: "我对朋友说的"
 latria_sexual_frustration_flavor.1130.desc: "我把整件事说给朋友听，走廊、手腕、那只杯子，朋友一手托着下巴听。说出来松了些，什么也没有变。\n\n然后一只手落在我肩上，是善意，且不走。我看着地图。这场战事可以等一季。\n\n朋友走了。我坐着，面前是行军的木牌，我挪动一枚，又挪回去。"
 latria_sexual_frustration_flavor.1130.a: "把余下的也说完，不求什么。"
 latria_sexual_frustration_flavor.1130.b: "不再说，把木牌摆正。"
 latria_sexual_frustration_flavor.1130.c: "去掂量这场战事。"

 latria_sexual_frustration_flavor.1131.t: "不散的余温"
 latria_sexual_frustration_flavor.1131.desc: "一个梦把我焐得发热，醒来时睡裙已卷到腰上。是我自己的手惹的祸。我躺着不动，让屋子重新回来：凉的地板，将熄的灯。热却不肯随梦散去。\n\n梦里是管家的女儿，也可能是某个长着那样嘴的人。手腕被按在床上，一点也不急，压下来的分量我记得，褥子同时承住我们两人的样子我也记得。醒着时，我从没被那样看过。\n\n我把睡裙拉下，盖过髋。布被我压得潮了。我把脸转向墙，暖意还留在毯子底下，耐着性子，等我自己松口。"
 latria_sexual_frustration_flavor.1131.a: "让手回到它想去的地方。"
 latria_sexual_frustration_flavor.1131.b: "把睡裙理平，等天亮。"
 latria_sexual_frustration_flavor.1131.c: "想着席间的说笑，把气息放缓。"

 latria_sexual_frustration_flavor.1132.t: "第三支烛"
 latria_sexual_frustration_flavor.1132.desc: "我跪到膝盖发疼，疼却不足以把脑子清干净。过了第三支烛，庙里就空了。闭眼的黑里，总有一具身子回来，那不是神的。\n\n是几周前一位香客的手，在路边把毯子搭上我的肩。指节擦过我喉头。这画面我祈祷着驱赶过上百回，它却一夜比一夜清楚，那陌生掌心的暖，正落在领口敞开的地方。\n\n我把额头抵在合拢的手上。石头是凉的。我的呼吸不是。最后一支烛变短时我还跪着，不求宽恕，只求这两条腿的抖，能在我起身前停下。"
 latria_sexual_frustration_flavor.1132.a: "把这念头说出来。"
 latria_sexual_frustration_flavor.1132.b: "起身守夜，把身子熬累。"
 latria_sexual_frustration_flavor.1132.c: "想着那双手的暖。"

 latria_sexual_frustration_flavor.1133.t: "岩檐下"
 latria_sexual_frustration_flavor.1133.desc: "又下雨了，打猎的人散在各处。我和猎犬总管挤在一处岩檐下，两人都湿透了，冷得我们每处相触的地方都像一小簇火。那人的手臂从肩到腕贴着我的，我不再假装没察觉。\n\n那人说了句关于暴雨的话，我答了一句关于暴雨的话。手在湿石上扶稳我，落到我后腰，隔着湿羊毛摊开，暖了一片，我的呼吸浅得没法拿冷来推脱。\n\n雨没有要停的意思。一根拇指在我脊背上动了一下。我盯着那灰白的雨帘，没有走开。"
 latria_sexual_frustration_flavor.1133.a: "在雨里再多留一会儿。"
 latria_sexual_frustration_flavor.1133.b: "挪开身，去看那落下的雨。"
 latria_sexual_frustration_flavor.1133.c: "等雨停，独自走回营去。"

 latria_sexual_frustration_flavor.1134.t: "我没解开的系带"
 latria_sexual_frustration_flavor.1134.desc: "御前会议散了，书房归我。我倒了杯不想喝的酒，那记忆还是来了，不请自来：缔约宴上使臣的嘴，舔去拇指上一滴酒的样子，书记们还在争边界。\n\n我放下杯子。手伸向喉前的系带，又停住。记忆里那双手又快又稳，我并没有推拒，我撑着桌子才没滑下去，那人身后整座大厅都化在烛烟里。\n\n烛火晃了晃。我把根本没松开的带子重新系好。酒没动，屋里静得很，我的脉搏在耳边响，像有人叩一扇我还没开的门。"
 latria_sexual_frustration_flavor.1134.a: "老实承认我想的是谁的嘴。"
 latria_sexual_frustration_flavor.1134.b: "吹熄蜡烛，独自就寝。"
 latria_sexual_frustration_flavor.1134.c: "摆一局棋。"

 latria_sexual_frustration_flavor.1135.t: "慢调"
 latria_sexual_frustration_flavor.1135.desc: "乐师起了支慢调，我还没来得及推辞，一只手就把我的握住了。我们在高台边转着，贴得比舞步该有的更近，搂着我的人身上是酒和柴烟的味道，底下还压着别的更暖的气息。\n\n转身时一条腿滑进我双腿之间，多留了半拍。我当着满堂的人维持着脸色。乐声底下，我听得见自己的呼吸，我知道对方也听得见，因为那嘴角弯了，却没开口。\n\n这一支罢了，我们没有立刻分开。一枚拇指描着我掌心的纹路，慢，是有意的。乐师又起调了，我还没有答，我的手仍在它手里。"
 latria_sexual_frustration_flavor.1135.a: "跟着调子，再跳下一支。"
 latria_sexual_frustration_flavor.1135.b: "抽回手，退回人群里。"
 latria_sexual_frustration_flavor.1135.c: "留在暖处，把这一支听完。"
