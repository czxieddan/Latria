l_simp_chinese:
 latria_sexual_frustration_flavor.1201.t: "无人赴约的时辰"
 latria_sexual_frustration_flavor.1201.desc.female: "我穿着寝衣在窗前等了许久。桌上的茶从热到温，再到结一层薄薄的皮。这场相会从未约定，我却替它留了灯，留了空杯，还把靠窗的椅子摆正。\n\n庭院里只有巡夜的人走过一次。灯笼的光从墙头掠过，又消失。我把杯子转了转，茶已经不能喝了。我想起那人上次离开时说的“若有空”，这句话空得可以装下任何一夜，也可以哪一夜都不算。\n\n烛芯烧短了。我还坐着，肩上的寝衣滑下一侧，我没有拉。"
 latria_sexual_frustration_flavor.1201.desc.male: "我穿着寝衣在窗前等了许久。庭院里只有夜巡的脚步，一下一下，远了又近。没有人会来，我仍把灯留着，像留着就能把一句没说出口的邀请补完。\n\n茶凉了，我喝了一口，苦得皱眉，还是喝完了。杯底剩几片叶子，我盯着它们看，仿佛能看出那人今夜在不在别处。窗外的风把树枝压低，又放开。\n\n我把手放在窗框上，木头是凉的。凉意顺着掌心上去，心里那点热却还在。"
 latria_sexual_frustration_flavor.1201.desc: "烛芯烧短了，窗外始终没有动静。\n\n我把灯芯挑高一次，火苗旺了一下，很快又矮回去。桌上有纸，有笔，有一杯不能再喝的茶。我哪样都碰过，哪样都没有把这一夜变成别的样子。\n\n最后我只是坐着，听自己的呼吸把安静填满。"
 latria_sexual_frustration_flavor.1201.a: "把想说的话写下来。"
 latria_sexual_frustration_flavor.1201.b: "吹熄灯烛，压下渴望后躺下。"

 latria_sexual_frustration_flavor.1202.t: "浴堂前的风声"
 latria_sexual_frustration_flavor.1202.desc.accepted: "浴堂外的谈笑声不曾因谁与谁同行而停下。水汽从门缝里涌出来，带着皂角和热石的味道。有人披着湿发从我身边过去，衣带松松地系着，谁也没有多看一眼。\n\n这样的寻常本该让我不以为意。我却站在门槛外，忽然想起自己已经很久没有那样自在地靠近过谁。门里有人笑着叫另一个人的名字，声音湿润，像刚从水里起来。我的手指在门框上停住。\n\n风把水汽吹到我脸上。我没有进去，也没有离开。"
 latria_sexual_frustration_flavor.1202.desc.strict: "浴堂门外，几名贵族正谈论谁该避开谁。我听见自己的名字，谈话随即停住。水声还在门里响，门外却静得能听见衣料摩擦。\n\n有人朝我点了点头，点得太快。另一个人去整理本来就整齐的袖口。我知道他们刚才说到哪一类事。我的耳朵发热，不是因为浴堂的蒸汽。\n\n我在原地站了一会儿。门里的水声一下一下，像在替这场沉默计数。"
 latria_sexual_frustration_flavor.1202.desc: "浴堂里水声不断，门外的人声却更令我分神。\n\n我本是来洗脸的。走到门口，听见里面有人低声说话，话说到一半又笑。那笑声并不响，却让我停下脚步。我不知道他们在笑什么，只知道自己不该站在这里听。\n\n我还是听完了那一句。听完以后，脸比手里的巾子更热。"
 latria_sexual_frustration_flavor.1202.a: "向众人细说我盼望的相会，说着说着便忘了收住话头。"
 latria_sexual_frustration_flavor.1202.b: "收起心思，谢过众人后告辞。"
 latria_sexual_frustration_flavor.1202.c: "换个话题，问候同行者。"
 latria_sexual_frustration_flavor.1202.d: "邀众人一同饮茶，谈到兴尽。"

 latria_sexual_frustration_flavor.1203.t: "祈祷后的沉默"
 latria_sexual_frustration_flavor.1203.desc.favors: "祭司说，人的欲望并非天生有罪。钟声还在梁上转，他已经把经卷合上，留给我一段空。\n\n我想相信他。可心头的空缺没有因此缩小。我跪在原处，看着自己的手。这双手白天替人分过饼，夜里却只想抓住一个不在这里的人。信仰允许这件事，允许并不等于手上有人。\n\n祭司等我提问。我问不出来，只把额前的头发抹开。"
 latria_sexual_frustration_flavor.1203.desc.condemns: "祭司谈起禁欲的美德，随后便沉默下来。那沉默比训词更重。我跪在原处，膝下的垫子已经暖了，祷词仍旧熟悉，心却远远落在殿外某条路上。\n\n我知道自己该应一声。喉咙里却只有一口气，出去以后变成很轻的“是”。祭司看了我一眼，没有再问。这一眼让我更觉得自己的“是”站不住。\n\n钟声停了。殿里只剩烛芯偶尔的爆响。"
 latria_sexual_frustration_flavor.1203.desc: "祷告结束了，殿中的钟声仍在回响。\n\n众人已经起身。我还跪着，像是少念了一句。其实一句也不少，只是念完以后，那点热意仍在。它不跟祷词走，也不跟众人走。\n\n我把掌心按在石板上。石头是凉的，凉意只到腕子，再往上就没了。"
 latria_sexual_frustration_flavor.1203.a: "暂且不再奉行戒欲的训诫。"
 latria_sexual_frustration_flavor.1203.b: "压下念头，重新诵读祷词。"
 latria_sexual_frustration_flavor.1203.c: "请祭司留下，一同研读教诲。"

 latria_sexual_frustration_flavor.1204.t: "猎归未宁"
 latria_sexual_frustration_flavor.1204.desc.lustful: "我独自在寝室里，未着衣物，弓弦的回响却还留在耳边。猎装扔在椅上，靴上的泥还没干。身体是累的，累在腿上、肩上，心思却不在那些地方。\n\n白日里有人在林间与我错马而过。只是错马，衣袖都没有碰上。我却把那一下看成了许多遍：对方勒缰的手，回头时嘴边的一点笑，还有笑完以后不再看我。此刻屋里没有马，也没有那个人，只有铜镜里的自己。\n\n我在床沿坐下。席子碰上皮肤，我才想起自己还没披衣。"
 latria_sexual_frustration_flavor.1204.desc.chaste: "我独自在寝室里，未着衣物，试图把心思放回祈祷与职责。猎装叠在一边，我甚至没有先去洗脸。每次闭眼，那份渴望就浮上来，浮得比林子里的兽踪还清楚。\n\n我把誓词在心里过了一遍。过到一半，林间那人回头的样子插进来，誓词便断了。我睁开眼，看着自己的手，手还在发抖，不知道是猎后的乏，还是别的。\n\n门外有侍从问要不要热水。我应了一声，声音比想的要哑。"
 latria_sexual_frustration_flavor.1204.desc: "猎场空了，心头的躁动却迟迟不散。\n\n我回到屋里，把弓放下，把手套放下，把白日里那一瞥却放不下。房间里有泥味和汗味。我站了一会儿，才发觉自己一直盯着门，像还在等谁跟着进来。\n\n没有人进来。门是我自己关上的。"
 latria_sexual_frustration_flavor.1204.a: "容自己回想猎场上那道身影。"
 latria_sexual_frustration_flavor.1204.b: "披衣回到书桌前，把心事压下。"
 latria_sexual_frustration_flavor.1204.c: "披好寝衣，慢慢理清白日里的念头。"

 latria_sexual_frustration_flavor.1205.t: "紧闭的书房"
 latria_sexual_frustration_flavor.1205.desc.emperor: "我命人退出书房，留下地图、印玺与未完的文书。门关上以后，屋里只剩我自己的呼吸。抽屉里的旧信被我翻出来，边角已经毛了。\n\n这封信不谈国事。它谈一次没有走成的相见，谈一句我当时觉得来日方长的话。来日已经过去许多，信还在。我把印玺压在信上，又拿开。印玺是冷的，信纸却像还热着。\n\n门外有人轻声问是否传膳。我没有答。"
 latria_sexual_frustration_flavor.1205.desc.adventurer: "路程与轮值已经写在纸上，同伴们等在门外。我替所有人排好休息的时辰，轮到自己时，笔停住了。抽屉里那封旧信露着一角，像故意不肯被路线盖住。\n\n我把它抽出来，看了开头的称呼，就知道自己不该在这个时候看。门外有人敲了敲，问下一站还走不走。我应了“走”，眼睛仍停在信的第二行。\n\n第二行只有一个地名。那个地方不在我们的路上。"
 latria_sexual_frustration_flavor.1205.desc.clergy: "我独自坐在书房，账簿未合，经卷也没有收起。书页间夹着一封旧信，我已经几次伸手又缩回。\n\n信不是今天来的。它在经卷里夹了很久，久到我每次翻到这一页都会停一下。今日我终于把它抽出来。纸上没有逾矩的字，可我读的时候，呼吸还是乱了。\n\n廊下有人走过，念珠碰出细响。我把信按回书里，按住以后仍能感到它的边。"
 latria_sexual_frustration_flavor.1205.desc.ruler: "侍从守在书房门外，我命他们不许打扰。印玺与文书摆在面前，抽屉里的旧信却迟迟没有收回。\n\n我本该批那份关于桥梁的禀帖。笔尖悬在纸上，墨滴下去，染出一个点。我看着那个点，忽然想起信里一句无关桥梁的话。那句话只有八个字，我却记得它写在哪一行。\n\n门外的人换了一下脚步。我把禀帖推开，手伸向抽屉。"
 latria_sexual_frustration_flavor.1205.desc: "我把书房门关上，旧信与未完的事务都还留在桌上。\n\n门闩落下的声音很轻。轻完以后，屋里就只剩纸。我把事务放在左边，把信放在右边。看了一会儿，又把信挪到中间。\n\n灯花爆了一下。我没有去剪它。"
 latria_sexual_frustration_flavor.1205.a: "把事务留到明日，重读旧信。"
 latria_sexual_frustration_flavor.1205.b: "压下旧情，继续处理手边事务。"
 latria_sexual_frustration_flavor.1205.c: "排好轮值，给自己留一段歇息。"
 latria_sexual_frustration_flavor.1205.d: "将明日的事务逐项列好。"

 latria_sexual_frustration_flavor.1206.t: "席边的流言"
 latria_sexual_frustration_flavor.1206.desc.accepted: "有人在宴席上谈起情人，语气轻松得像在谈天气。酒过一巡，那故事里的名字换了两个，众人仍笑。没有人把声音压低。\n\n我本想一笑置之。笑到一半，才发觉自己已经很久没有这样的闲谈，久到我连该把杯子放在哪里都要先看一眼旁人。邻座问我是否也有一段能说的。我的手指在杯沿上停住。\n\n乐声隔着人群传来。我听见了，却没有听清是哪一支曲子。"
 latria_sexual_frustration_flavor.1206.desc.strict: "几名贵族谈起一位因失仪而失宠的同僚，随后有人提到了我的名字。谈话并没有停干净，只是从大声变成了气音。我低头理了理袖口，没有加入。\n\n他们说的那件事未必是真的。真假已经不重要。重要的是我自己心里确实有一件不能拿上桌的事，而他们的眼睛像已经看见了。我把酒喝完，酒意却不在喉咙里，在脸上。\n\n有人举杯想把话题岔开。杯子碰响时，我的手还是一抖。"
 latria_sexual_frustration_flavor.1206.desc: "乐声隔着人群传来，席间的交谈却更令我分神。\n\n我坐在原处，听前后左右的话头绕来绕去，最后都绕到床帷和私信上。有人笑，有人咳，有人用眼角看我。我不知道那一眼是否无意。\n\n我把空杯转了一圈。杯底在桌上划出很轻的一声。"
 latria_sexual_frustration_flavor.1206.a: "把旧情从头细说，连私下说过的话也再讲一遍。"
 latria_sexual_frustration_flavor.1206.b: "把话咽回去，向同席诸人致意后告退。"
 latria_sexual_frustration_flavor.1206.c: "借一首新诗，把席间话头带开。"

 latria_sexual_frustration_flavor.1207.t: "祈祷后的空座"
 latria_sexual_frustration_flavor.1207.desc.favors: "礼拜结束后，祭司把经卷留在座上便离开了。空座上还留着他坐过的凹痕。信仰并不把欲念视作罪，这句话写在我刚读过的那一页，墨迹清楚。\n\n我却仍不知道如何平复。允许是一回事，夜里一个人面对自己的手是另一回事。我在空座旁站了一会儿，没有坐下，也没有把经卷合上。\n\n殿门被风带上一条缝。光从那里进来，正照在那一行字上。"
 latria_sexual_frustration_flavor.1207.desc.condemns: "祭司离开后，我仍跪在原处。贞洁的教诲清晰无误，每一条我都能背。心中那份渴望却没有跟着他离开，它留在膝盖和掌心之间，留得很具体。\n\n我看着空出来的座位，忽然嫉妒那块木板可以什么都不想。我不能。我把额角抵上去，抵到的仍是自己的热。\n\n烛火短了一截。我还跪着。"
 latria_sexual_frustration_flavor.1207.desc: "殿中只剩我与未熄的烛火。\n\n众人的脚步声已经远了。我本可以现在走，把门带上，把这一页翻过去。我没有。我在空座之间走了两步，又回到原来的垫子上。\n\n火苗安静。我却听见自己的血在耳朵里响。"
 latria_sexual_frustration_flavor.1207.a: "离开殿堂，把心思还给那段情意。"
 latria_sexual_frustration_flavor.1207.b: "把欲念压下，重读戒律。"
 latria_sexual_frustration_flavor.1207.c: "坐到经卷前，读完这一章。"

 latria_sexual_frustration_flavor.1208.t: "林间的追猎"
 latria_sexual_frustration_flavor.1208.desc.lustful: "猎物穿过林间，众人追了上去。我也策马跟随，枝条抽在袖上，马汗的味道扑面而来。跑出去半里，我才发觉自己追的不是那头兽。\n\n前面有一个人的背影。只是同猎的人，不是别的。可那背影一伏一仰，我的目光就钉在那里，钉得连岔路都错过了。猎犬的吠声往左边去，我的马还往前。\n\n我勒住缰。那人没有回头。我却已经喘得不像只是在打猎。"
 latria_sexual_frustration_flavor.1208.desc.chaste: "我勒住马缰，提醒自己此行只为狩猎。猎犬的吠声渐远，蹄印在湿泥里很清楚，我却看了两遍才看明白它们转向何处。\n\n念头不肯跟着蹄印走。它停在刚才谁帮我拉紧鞍带的那双手上。那双手很稳，稳完就松开了，什么也没说。我却把那一下握成了另一件事。\n\n马打了个响鼻。我这才发现自己在原地站了太久。"
 latria_sexual_frustration_flavor.1208.desc: "队伍在林间停下，等我决定是否继续追踪。\n\n众人的脸都朝着我。马具还在滴水，有人抹了一把额头。我看着地上的脚印，脚印很清楚，我的回答却不清楚。心里有一半还停在林子另一头，停在一个与猎物无关的人身上。\n\n风从树间过来。我握着缰，没有立刻开口。"
 latria_sexual_frustration_flavor.1208.a: "让同伴先走，独自想一会儿心事。"
 latria_sexual_frustration_flavor.1208.b: "收回心思，继续率队追踪。"
 latria_sexual_frustration_flavor.1208.c: "让马歇脚，慢慢辨清足迹。"

 latria_sexual_frustration_flavor.1209.t: "窗边的余烬"
 latria_sexual_frustration_flavor.1209.desc.female: "我穿着寝衣坐在窗边，炉火只剩一线余烬。白日里未曾说出口的话，此刻在嘴里转了一圈，又转回去。那句话并不长，长的是我把它忍到现在。\n\n余烬偶尔亮一下，照见我放在膝上的手。手指无意识地抓着寝衣的边，抓出了褶。我想起那人今天从我身边经过时，衣袖带起的风。只是风，我却一直记得风的方向。\n\n窗外有人打更。我没有应，也不想睡。"
 latria_sexual_frustration_flavor.1209.desc.male: "我穿着寝衣倚着窗框，望着庭院里巡夜的灯火。灯一盏盏过去，像把夜切成小段。那段未得回应的情意不肯被切碎，它整块地留在胸口。\n\n我把额头抵在窗格子上。木头有一股旧漆味。我想起那人说话时看向别处的样子，像是怕一看我，话就会变成别的。我当时也把目光让开了。让开以后，两个人都没再说。\n\n炉里的炭响了一声，塌下去一点。"
 latria_sexual_frustration_flavor.1209.desc: "窗外寂静，炉火渐暗，我却毫无睡意。\n\n我添了一小块柴，火没有旺起来，只冒了一点烟。烟味留在寝衣上。我坐回窗边，把白天没送出去的那句话又默念一遍。念完，还是没有听众。\n\n夜色压在院子里。我看着它，它不看我。"
 latria_sexual_frustration_flavor.1209.a: "把念头写在纸上。"
 latria_sexual_frustration_flavor.1209.b: "添好炉火，压下心事后躺下。"
 latria_sexual_frustration_flavor.1209.c: "添柴煮茶，读一段旧书。"
 latria_sexual_frustration_flavor.1209.d: "把未说的话写成一首诗。"

 latria_sexual_frustration_flavor.1210.t: "无人叩门"
 latria_sexual_frustration_flavor.1210.desc.emperor: "近侍已替我收好礼冠，我披着寝衣独坐床边。帝国的边界、税册和明日要见的人，都没有把那件私事挤走。它坐在床的另一头，虽然那里并没有人。\n\n我看着空着的那半边。枕是平的，被角也是平的。平整本身像一种责备。我把一只手放到那半边，布料是凉的，凉完我仍没有收回手。\n\n廊下的灯灭了一盏。没有人来叩这扇门。"
 latria_sexual_frustration_flavor.1210.desc.adventurer: "同伴已经在客栈歇下，我披着寝衣守着一封未寄出的信。明日仍要启程，马也已经喂过。心事却无法留在此地，它会跟进行囊，跟到下一个渡口。\n\n我把信在灯下转了个方向。称呼写得太重，重到不像路上随手能寄出的东西。楼下有人结账，铜钱响了一阵。那声音过去以后，房里更静。\n\n我把信夹进衣物中间。夹进去，仍知道它在哪一层。"
 latria_sexual_frustration_flavor.1210.desc.clergy: "我把法衣挂在床边，披着寝衣独坐小室。誓词还在耳畔，是我自己方才念过的。心绪没有因此平静，念珠在指间停了很久，停在同一颗上。\n\n我想把这一夜献给该献给的地方。可每静下来，眼前就是一张不该在祈祷里出现的脸。我把念珠握紧，珠子硌着手心。硌疼了，那张脸还在。\n\n小室的门没有闩严。风从缝里进来，灯火斜了一斜。"
 latria_sexual_frustration_flavor.1210.desc.ruler: "礼服已经收起，我披着寝衣留在床边。门外的守卫没有听见我的叹息，权位也未替我安顿这份心事。我试着把明日的朝会在心里过一遍，过到第三个人，就过不下去了。\n\n那第三个人与朝会无关。我仍把次序停在那里。床头的灯把我的影子投到墙上，影子比我坐得直。\n\n我把灯芯拨低。影子矮了，人还坐着。"
 latria_sexual_frustration_flavor.1210.desc: "夜色已深，我仍独自守着这桩心事。\n\n门是关的，灯是亮的，床只睡得下我。这三件事都没有变。变的是我已经不再假装自己马上能睡着。我把外衣放在椅背上，又拿起来，像随时会有人叫我出去。\n\n没有人叫。椅背上的衣服又被我放下。"
 latria_sexual_frustration_flavor.1210.a: "夜虽深了，仍叫来熟人，把心事细细谈开。"
 latria_sexual_frustration_flavor.1210.b: "把心事压下，熄灯躺下。"
 latria_sexual_frustration_flavor.1210.c: "拟好明日安排，逐件整顿手边事务。"
