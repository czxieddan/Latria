l_simp_chinese:
 latria_sexual_frustration_flavor.1401.t: "封存的印信"
 latria_sexual_frustration_flavor.1401.desc.female: "我披着寝衣，在床边把一封信反复折叠。纸上没有署名，称呼也被划去了，折痕却已经深得藏不住。桌角留着温好的封蜡，只差把印信按下去，今夜的心事就会交到另一个人手里。\n\n我把信展开，读到相约的那一行便停住。时辰、地点，连该走哪道门都写得清楚。白天我还能把这些说成随手记下的闲话；此刻信使就在廊外等候，我再也找不到一句合适的托词。\n\n门外传来衣料轻响。我拿起印信，另一只手仍压着信口，没有招呼人进来。"
 latria_sexual_frustration_flavor.1401.desc.male: "我披着寝衣坐在床沿，手里握着印信。案上那封信写到最后一行，墨迹已经干了，落款的位置还空着。侍从替我备好了封蜡，又把窗掩上，走时没有问我为何还不歇息。\n\n我认得信里的每一句话，也知道收信的人会怎样读它。若添上名字，盖下印记，我便不能再把这份邀约说成一时玩笑。那些在心里反复改过的句子，到了纸上竟没有一处容我躲闪。\n\n印信在掌中握了许久。我把它转正，望向门缝里的灯光，仍未叫来信使。"
 latria_sexual_frustration_flavor.1401.desc: "我将印信拿起又放下，迟迟没有落在纸上。信口叠得齐整，封蜡也已备好，案旁没有别的事需要我做。我仍把纸角抚了一遍，仿佛还有哪道折痕值得耽搁。\n\n那句话已经写出来了。清晨送信的人只会问往哪里去，不会替我判断该不该送。我把地址读了两遍，想起收到回信的可能，也想起对方不作回答的可能。\n\n蜡匙里的蜡开始凝住。我把它移近灯火，空着的手却又把信压回了案上。"
 latria_sexual_frustration_flavor.1401.a: "写完这封信，盖上印信。"
 latria_sexual_frustration_flavor.1401.b: "收好印信，压下心事后躺下。"

 latria_sexual_frustration_flavor.1402.t: "最后的盛宴"
 latria_sexual_frustration_flavor.1402.desc.accepted: "宴席将散，众人仍在谈论情人、婚约与旧日欢愉。有人一面扣好披风，一面回头补上故事的结尾，听的人笑着让侍从再添些酒。这里没有人需要为这些话压低声音。\n\n我本已起身，又在听见一个熟悉的地名时坐回去。那地方也有我的旧事，只是从来没有被说得这样轻快。我试着接一句，邻座便把杯子放下，等我继续；积在心里的话忽然都挤到了嘴边。\n\n乐师正在收弦。主人望了一眼厅门，我却还没有拿起椅背上的外衣。"
 latria_sexual_frustration_flavor.1402.desc.strict: "宴席上有人提起一位因私情失势的贵族。方才还在传递的酒壶停了下来，一人问起他的家族，另一人低声说那桩婚事恐怕也要作罢。我坐在末席，听着他们把一个人的日子逐项议定。\n\n我的名字并未被提起。可当邻座问我为何如此安静，我连寻常的笑都没能接上。几句本想借着酒意说出的心事，此刻若开了头，只怕便再也收不回来。\n\n侍从来取我面前的空盘。我让了让手，杯子却仍握着，迟迟没有饮尽最后一口。"
 latria_sexual_frustration_flavor.1402.desc: "我看着侍从收起杯盘，才发觉宴席已经到了散场的时候。几位宾客在门边道别，主人开始询问车马，我面前的酒却还剩着大半。那些想说的话，一直没有找到合适的空隙。\n\n邻座整理披风时问我是否一道出去。我应了一声，随后又提起一段旧事。故事的开头已经说过，我仍从那里讲起，像是只要把这句话说得准确，今夜便不至于这样结束。\n\n对方的手停在衣扣上。我把杯子推开，听见厅里的回声比方才清楚了许多。"
 latria_sexual_frustration_flavor.1402.a: "留住末席宾客，把自己的心事翻来覆去地说。"
 latria_sexual_frustration_flavor.1402.b: "压下心事，谢过主人后告辞。"

 latria_sexual_frustration_flavor.1403.t: "无证人的忏悔"
 latria_sexual_frustration_flavor.1403.desc.favors: "我独自留在圣坛前，听见最后一名侍者把门轻轻带上。经卷还摊在架上，谈及肉体欢愉的那一页夹着书带。我读过这些教诲，知道信仰并不要求我把这份渴望当作罪过。\n\n可一旦没有旁人在场，我便不知道该从哪里开口。白天准备好的问题显得太周全，恰好绕过了那个一直想见的人。我重念其中一句，又停下来，把原本藏在称呼后面的名字低声说出。\n\n殿里没有回答。我把手从经卷上移开，仍跪在原处，望着门底那道渐暗的光。"
 latria_sexual_frustration_flavor.1403.desc.condemns: "我独自跪在圣坛前，衣襟整齐，祷词却一次次断在同一个地方。最后离开的侍者问我要不要留灯，我点了头，于是现在只剩一盏灯和一卷没有翻完的经书。\n\n戒律我都记得，连应当怎样忏悔也早已学熟。可每当念到弃绝欲念，我便想起那封没有销毁的信。我并非忘了它放在哪里；离开房间前，我还特意把它藏到别人翻不到的书页里。\n\n无人催促，我反而更难把下一句念完。门外传来换班的脚步，我低下头，又从开篇读起。"
 latria_sexual_frustration_flavor.1403.desc: "我等殿里的脚步声散尽，仍没有离开圣坛。长椅已被摆正，经卷的书带垂在架边，侍者忘了取走的一只空杯还留在门口。方才有人在时，我总觉得自己的话说不出口。\n\n现在四下无人，我试着把那桩心事从头讲清。说到中途，才听出自己又在用熟悉的句子遮掩。我停下来，抬头看了一眼门，再低声重说了一遍，这次没有略去那个人的名字。\n\n灯光落在膝前。我没有立即起身，听着那句话在空殿里慢慢静下去。"
 latria_sexual_frustration_flavor.1403.a: "不再立戒欲之誓，承认自己的选择。"
 latria_sexual_frustration_flavor.1403.b: "压下欲念，跪到晨祷开始。"

 latria_sexual_frustration_flavor.1404.t: "说出欲念"
 latria_sexual_frustration_flavor.1404.desc.lustful: "我未着衣物，独自站在寝室的铜镜前。外衣搭在椅背上，侍从已经退去，门闩是我亲手落下的。镜中的人没有躲开目光，我也终于不再急着找一件小事来转移心思。\n\n这些日子，我把想见那个人的念头说成疲倦，说成烦闷，说成宴后难眠。每换一个说法，案上的信便多添一笔，却始终没有寄出。我知道自己在等什么，也厌倦了清晨起来又把写好的话删掉。\n\n桌上留着一张新纸。我望向它，第一次认真想过，开头是否还需要那些客套的问候。"
 latria_sexual_frustration_flavor.1404.desc.chaste: "我未着衣物，独自坐在床沿，双手紧扣。衣物就在一旁，祷书也没有收起。我本想念完熟悉的一段便歇息，却在同一行上停了许久，连窗外的更声都数错了一遍。\n\n若我仍守着誓言，并不是因为不再渴望亲近谁。那个人的名字刚一浮现，我便知道自己无法再用一句心无杂念敷衍过去。我翻到记着誓词的那页，读得比平日慢，想分清每一句究竟是不是自己的选择。\n\n书页在指间停住。门外已无声响，我没有合书，也没有把尚未读完的句子急着念完。"
 latria_sexual_frustration_flavor.1404.desc: "夜已经很深，我坐在寝室里，终于承认自己仍想见那个人。案上的信改过几次，每次都把最要紧的一句话删掉，只留下天气、行程和无关紧要的问候。\n\n我把几张纸依次摊开，看着那些几乎相同的开头。它们写得体面，收到的人却永远不会知道我为什么迟迟不肯熄灯。今夜再写一封，也不能只换一个称呼，便当作事情有了进展。\n\n我把笔搁在空纸旁。窗外又响了一次更声，这回我没有借它催自己睡去。"
 latria_sexual_frustration_flavor.1404.a: "承认自己的渴望，今夜不再与之相争。"
 latria_sexual_frustration_flavor.1404.b: "重新穿好衣物，把念头压下。"

 latria_sexual_frustration_flavor.1405.t: "编年史的一页"
 latria_sexual_frustration_flavor.1405.desc.emperor: "编年官伏在桌边，等我决定哪些事值得留下。我穿着礼服站在他身后，方才口述的仍是封赏与征调，墨迹还未干。讲到明日的仪程时，我停住了，转而提起那些无人记载的长夜。\n\n他的笔没有立刻跟上。近侍在门边换了个站姿，我知道他们都听见了。我曾以为只要日间照常接见群臣，这段煎熬便可以一直留在寝室里；可当编年官问我是否照录，我竟无法再顺口说不必。\n\n新的一页已经铺开。笔尖悬在空处，所有人都等着我把方才那句话接下去。"
 latria_sexual_frustration_flavor.1405.desc.adventurer: "抄写员坐在桌边，问我是否要把这段旅途也写进编年。我把渡口、宿处和几次耽搁都说了，他依次记下，又抬头等下一个地名。行囊里那封没有寄出的信，正露在我的手边。\n\n有些停留并不是因为雨水或坏掉的车轴。我绕过一段路，只为再见某个人，却始终没有把真正的缘由告诉同伴。如今路程写得整整齐齐，我读着那些地名，反而觉得漏下的才是这一路最难摆脱的事。\n\n抄写员蘸了墨。我抽出那封信，没有展开，先把纸角抚平在地图旁。"
 latria_sexual_frustration_flavor.1405.desc.clergy: "我把法衣穿戴整齐，走到书记面前。他原本准备记录捐输与修缮，听见我改了话题，便另取一张纸。桌边的经卷仍开着，正是我白日向旁人讲过的一段。\n\n誓词与欲念都是真的。我不愿把自己说成从未犹疑过的人，也知道一旦写下，这些话便不再只供我独自回想。书记问是否保留那个人的名字，问得很轻，像怕让门外的人听出端倪。\n\n我看着空下来的那一行。念珠还绕在腕上，我没有借着拨动它来避开这个问题。"
 latria_sexual_frustration_flavor.1405.desc.ruler: "书记官等着记录我的口述。我身穿礼服，身旁还放着议事时用过的印玺，却在讲完公务之后，提起一件始终压在心底的私事。门边的侍从没有退出去，屋里骤然静了。\n\n我先说起一封旧信，随后说到几次没有赴成的相会。书记写得比方才慢，遇到含混的地方便抬头看我。我原想让他替我选些体面的措辞，可听见自己的话被重复出来，又不愿它们被改成另一桩事。\n\n他把抄好的半页递过来。我接住纸，目光停在第一处没有遮掩的称呼上。"
 latria_sexual_frustration_flavor.1405.desc: "我来到书记的桌前，决定把藏了许久的心事说清。他把公文移开，另铺一页纸，问我从哪里记起。我给出一个日期，随即停住，因为那不是这件事真正开始的时候。\n\n我重新说起一封信、一场短暂的会面，还有后来几次失眠。笔在纸上走得很轻，这些话却已经能被别人从头读到尾。书记没有评断，只在我说得含混时等一等，留下一点空白。\n\n写完的纸放在我们之间。要不要让第三个人看见，他还在等我的吩咐。"
 latria_sexual_frustration_flavor.1405.a: "让抄本流传出去，人人都可以读到。"
 latria_sexual_frustration_flavor.1405.b: "请书记只记公务，把心事咽回去。"

 latria_sexual_frustration_flavor.1406.t: "宾客散尽"
 latria_sexual_frustration_flavor.1406.desc.accepted: "末席的宾客仍在谈论情人与婚约。我刚提起自己的旧事，席边便传来一声轻笑。那人举着杯子，并不觉得有何失礼，还笑着催我把后来怎样也讲出来。\n\n这段往事在我心里留了太久，忽然被人当作佐酒的趣谈，我竟一时接不下去。邻座替我补了一个猜想，另一个人又拿信中的话打趣。我想纠正，开口后却发现自己越说越急，连方才没打算提的细节也到了舌边。\n\n侍从来收最后一只酒壶。我按住杯沿，听见有人挪近椅子，等着下半段。"
 latria_sexual_frustration_flavor.1406.desc.strict: "一位贵族因私情失势的消息传到席间时，我还没有收住自己的话头。邻座忽然低声问了句什么，另一人看向我，随后笑了一声。方才还在点头的人，这时只顾整理手里的餐巾。\n\n我知道该停，却又不愿让这阵沉默替我把故事讲完。越想说明自己与那桩丑事毫无关联，之前说过的话便越显得需要解释。门口已经有宾客告辞，留下的人却没有一个催我继续。\n\n我把杯子放下，碰得略重。那几道目光仍在，我得决定下一句话究竟要对谁说。"
 latria_sexual_frustration_flavor.1406.desc: "宾客将散，我却迟迟没有收住话头。讲到一封旧信时，邻座交换了眼色，席边传来一声轻笑。我停下来，才发觉面前几人早已放下餐具，都在听我一人说话。\n\n我本想解释那句话为什么要紧，出口却成了第二遍复述。有人礼貌地点头，有人望向门口，也有人把笑意藏在杯后。这些反应我都看见了，心里反而更急，像是只差最后一句便能让他们听懂。\n\n主人已经站起身。我面前的椅子仍未挪动，散席的寒暄从身后传了过来。"
 latria_sexual_frustration_flavor.1406.a: "留下细说旧情，谁敢取笑，我便当众顶回去。"
 latria_sexual_frustration_flavor.1406.b: "把话收住，向众人行礼告辞。"

 latria_sexual_frustration_flavor.1407.t: "熄灯后的祷词"
 latria_sexual_frustration_flavor.1407.desc.favors: "我披着寝衣坐在床边，翻到祷书中谈论肉体欢愉的那一页。白日里读来很平常的教诲，此刻我却来回看了几遍。门已经闩好，外头的人散了，灯也只剩最后一点油。\n\n信仰没有要我否认自己的渴望，可我仍不知该怎样面对那段没有回应的情意。我试着把想说的话念给自己听，去掉致意和问候以后，剩下的句子短得让我停了很久。\n\n灯焰缩了一下。我用书带记好那页，没有立即合上书，也没有继续寻找另一段解答。"
 latria_sexual_frustration_flavor.1407.desc.condemns: "我把寝衣的衣襟拢好，低声重念贞洁誓词。灯芯已经烧短，祷书上的字在暗处渐渐难辨。我仍照着读，读错了一处便退回开头，像是只需念得准确，今夜就能顺利过去。\n\n可念到半途，那个人白日里说过的话又回来了。我并没有忘记誓言，只是也没有忘记当时自己为何迟迟不愿告别。两件事放在一处，往常熟悉的回答忽然都不够用了。\n\n灯将熄时，我伸手护住火焰。下一句就在眼前，我看了许久，仍未出声。"
 latria_sexual_frustration_flavor.1407.desc: "房中只剩一盏将熄的灯，我仍没有合眼。祷书放在膝上，同一页已经读了好几遍。窗外有守夜人经过，脚步到了转角便听不见，我却还在等下一声。\n\n我把书稍稍移近灯火，想找到方才停住的地方。那一行没有难懂的字，我知道自己为何总读不下去：每到末尾，便想起一个本该在白天说清的问题。如今无人能答，我仍反复替对方斟酌回答。\n\n最后一点油在盏底发亮。我把书带夹好，手还留在封面上，没有吹灯。"
 latria_sexual_frustration_flavor.1407.a: "暂放贞洁誓词，任自己想起那段情意。"
 latria_sexual_frustration_flavor.1407.b: "压住念头，将祷文诵到天明。"

 latria_sexual_frustration_flavor.1408.t: "镜前无言"
 latria_sexual_frustration_flavor.1408.desc.lustful: "我未着衣物，独自在镜前站立。床边留着白日换下的衣裳，桌上的邀请写了半页。先前我总在镜前整理仪容，想好见到那个人时该说什么，真正相见时却又只谈些寻常事。\n\n这样的来回已经够多了。我不想再把持续许久的渴望说成偶然想起，也不愿每次见面都等对方先开口。镜旁压着那封没写完的信，末尾的空处还足够添一句明白的话。\n\n我转向书案，望着笔尖上干掉的墨。外头无人催促，这一次也没有公务可以替我作答。"
 latria_sexual_frustration_flavor.1408.desc.chaste: "我未着衣物，坐在床沿握紧双手。镜旁的衣物叠得整齐，祷书就在最上面。我已经把该读的一章读完，却仍没有等到惯常的安定，房间越静，那段情意便越难略过。\n\n贞洁仍是我的选择。可我不愿再把坚持说得轻易，仿佛只要读完经卷便从未想过别的。我把明日要做的事在心里排过一遍，排到会与那个人相见的时辰，又停下来重排。\n\n镜中的人也一直坐着。我松开握紧的手，看向桌边的笔，想把这份犹疑如实记下。"
 latria_sexual_frustration_flavor.1408.desc: "我在寂静中看着镜中的自己，桌上还摊着没有写完的信。白日里用来遮掩的笑容，此刻已经不必再摆出来。我坐回床沿，把那次短暂的相见从头想了一遍。\n\n没有哪句话能算作允诺，也没有谁让我一直等下去。那些后来补出的意思，有多少出自对方，有多少是我自己添上去的，我终于肯逐一分清。想明白这一点，并没有让渴望立刻退去。\n\n我把纸往灯下移了移。尚未写出的那一行，至少应该由我自己说清楚。"
 latria_sexual_frustration_flavor.1408.a: "承认这份欲念，今夜不再逃避。"
 latria_sexual_frustration_flavor.1408.b: "披衣伏案，把心事压下。"

 latria_sexual_frustration_flavor.1409.t: "朝会失仪"
 latria_sexual_frustration_flavor.1409.desc: "朝会间隙，我在侧室褪去衣物，想借片刻独处让心绪安定。外袍还在侍从手里，通往议事厅的门却先被推开了。我循声抬头，长桌旁的谈话已经停住，几名臣下仍保持着方才转身的姿势。\n\n书记官垂下目光，将写到一半的纸往里收了收。门边的人想退，又怕挡住捧衣的侍从，谁也没有先动。我本该立即发话，出口的声音却发紧，预备好的吩咐一时连不成句。\n\n侍从终于把外袍递近。桌上还摊着未决的事务，众人仍等着我决定接下来怎么办。"
 latria_sexual_frustration_flavor.1409.a: "索性站在众人面前，不再掩饰失态。"
 latria_sexual_frustration_flavor.1409.b: "命众臣退下，整理衣冠后再议。"

 latria_sexual_frustration_flavor.1410.t: "门后的夜色"
 latria_sexual_frustration_flavor.1410.desc.female: "我披着寝衣坐在门边，听见外头的脚步声渐渐远去。有人在廊下交还钥匙，又低声道了晚安。我原本可以叫住其中一人，请他清晨替我带信，等到声音散尽，仍没有开口。\n\n那份无人回应的心意又回到眼前。案上的草稿写了太多无关紧要的话，唯独没有写清我盼望怎样的回答。我把纸拿到膝上，从第一行读起，终于划去那句连自己也不相信的寻常问候。\n\n门外彻底静了。我将笔移到空白处，还没落下，心里已经知道这封信会比以往写得更久。"
 latria_sexual_frustration_flavor.1410.desc.male: "我披着寝衣倚在床头，手边的书一页也没有翻过。门外安静下来，灯照着同一段文字，我却一直在想白日里那场过早结束的交谈。告别时我说来日再叙，对方也只照礼应了。\n\n我已经用过太多次来日。每次都以为下一回能把话讲清，等到独处，又只能猜那句客气的答复是否另有意思。我把书签往前移了一页，随即发现自己连上一页写了什么也不记得。\n\n桌边尚有纸笔。我把书合上，仍放在膝头，望着门下那道已经暗去的缝。"
 latria_sexual_frustration_flavor.1410.desc: "长夜未尽，我坐在关好的房门内，听着远处最后一阵脚步走开。桌上的信还没写完，床边的书也摊着，方才用来打发时间的两件事都停在半途。\n\n我把已经写下的几行读给自己听。句子并不难懂，只是处处留着余地，读到末尾，仍看不出我究竟希望那个人怎样回答。若继续照这样写，明日寄走以后，我只会再添一件等待的事。\n\n我取出一张新纸，压在书下。灯还够亮，足以让我看清第一行该落在哪里。"
 latria_sexual_frustration_flavor.1410.a: "把书搁下，给那人写一封长信。"
 latria_sexual_frustration_flavor.1410.b: "把心事压下，熄灯躺下。"

 latria_sexual_frustration_flavor.1401.c: "把难以寄出的邀约写成诗。"
 latria_sexual_frustration_flavor.1402.c: "赏乐师一笔钱，请他们为余下的宾客奏乐。"
 latria_sexual_frustration_flavor.1402.d: "请众人留下，把话题换成往日游历。"
 latria_sexual_frustration_flavor.1403.c: "摊开经卷，逐句寻求解答。"
 latria_sexual_frustration_flavor.1404.c: "舍弃贞洁誓言，今后随自己的欲念行事。"
 latria_sexual_frustration_flavor.1404.d: "披上寝衣，静坐到心绪安定。"
 latria_sexual_frustration_flavor.1405.c: "把口述改写成私札，封进书匣。"
 latria_sexual_frustration_flavor.1405.d: "立下贞洁誓言，请众人作证。"
 latria_sexual_frustration_flavor.1406.c: "为离席的宾客念一首新诗。"
 latria_sexual_frustration_flavor.1407.c: "把祷书合上，慢慢理清自己的心意。"
 latria_sexual_frustration_flavor.1408.c: "列出清晨待办，把桌上的文书一一理齐。"
 latria_sexual_frustration_flavor.1409.c: "披衣回到长桌前，逐项办完朝会事务。"
 latria_sexual_frustration_flavor.1409.d: "披衣说个笑话，再请众臣落座。"
 latria_sexual_frustration_flavor.1410.c: "披衣煮茶，坐到自己能安睡为止。"
