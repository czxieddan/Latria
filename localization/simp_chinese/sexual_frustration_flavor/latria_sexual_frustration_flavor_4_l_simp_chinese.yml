l_simp_chinese:
 latria_sexual_frustration_flavor.1301.t: "未寄出的邀约"
 latria_sexual_frustration_flavor.1301.desc.female: "我穿着寝衣坐在书案前，信纸上只写了一个名字。墨还没干，侍女就在门口问要不要送出。我把纸折了一折，没有封，也没有回答。\n\n这个名字我白天不敢写。夜里写出来，纸就像烫手。后面本该是一句邀约，邀到哪里、什么时辰，我都想好了，笔却停在称呼后面。侍女又问了一遍，声音更轻。\n\n我看着那个名字。它比整封没写完的信都重。"
 latria_sexual_frustration_flavor.1301.desc.male: "我穿着寝衣坐在书案前，信纸上只写了一个名字。门外的侍从等着传话，影子在门缝里动了一下，又不动了。\n\n我把笔蘸饱，悬在纸上。要写的那句并不含糊：今夜，侧门，不要让第三人知道。可它一落到纸上，就不再只是心里的事。灯花爆了一下，墨点掉在名字旁边。\n\n侍从轻轻咳了一声。我仍没有封上这封信。"
 latria_sexual_frustration_flavor.1301.desc: "一封没有封口的信，留在灯下许久。\n\n纸上只有称呼。后面的空白大得能放下许多句子，我一个也没写。蜡已经烤软了，封蜡的勺子就在手边，我没有拿。\n\n灯油下去一截。名字还是湿的。"
 latria_sexual_frustration_flavor.1301.a: "把信写完，交给侍从。"
 latria_sexual_frustration_flavor.1301.b: "收起信纸，压下心事后安歇。"
 latria_sexual_frustration_flavor.1301.c: "另取一纸，把邀约写成诗。"

 latria_sexual_frustration_flavor.1302.t: "宫廷判词"
 latria_sexual_frustration_flavor.1302.desc.accepted: "宫廷诗人拿旧情作笑谈，连最严肃的贵族也没有皱眉。他把一段床帷里的事说得像猎场上的趣闻，众人举杯，酒面晃出一圈光。\n\n我笑着跟着举杯，嘴里的酒却发苦。故事里的人不是我，听着却像有人把我的夜晚也翻出来晾着。邻座碰了碰我的袖子，问我为何不接话。我这才发觉自己笑晚了。\n\n诗人又起了一句。我的杯子还停在半空。"
 latria_sexual_frustration_flavor.1302.desc.strict: "一位贵族因私情失了体面，众人都在议论他的家族。话说得很慢，慢得像判词。有人摇头，有人把子女的婚事重新算了一遍。\n\n我听着他们的评断，想起自己也站在同一把秤上。秤的另一头是一封没寄出的信，和几夜没有睡实的觉。这些还没有被人看见。看不见，不代表秤上没有。\n\n有人问我怎么看。我把杯子放下，杯底碰出一声。"
 latria_sexual_frustration_flavor.1302.desc: "席间的谈话转到了名誉与欲念。\n\n一开始只是笑话。笑话说到具体的门、具体的时辰，就不好笑了。我坐在原处，看着自己的手在桌布下收紧。\n\n乐师还在奏，奏得很轻，像怕盖过这些话。"
 latria_sexual_frustration_flavor.1302.a: "当众细说自己的渴望，几次把话头绕回旧情。"
 latria_sexual_frustration_flavor.1302.b: "把话收住，向主人致谢后告退。"
 latria_sexual_frustration_flavor.1302.c: "把话题转回家族与封地。"
 latria_sexual_frustration_flavor.1302.d: "讲个旅途笑话，让众人重新举杯。"

 latria_sexual_frustration_flavor.1303.t: "午夜钟声"
 latria_sexual_frustration_flavor.1303.desc.favors: "钟声过后，祭司仍留在门边。他说欲念可以被引向善处，声音不高，夜里听得很清楚。殿里的烛火把他的影子拉到我膝前。\n\n我却不知道自己是否还愿意等那个“善处”。等待本身已经成了另一套戒律。我的手在袖中发热，发热的地方没有任何经文能够安放。祭司看着我，像是看出我没有把后半句问出来。\n\n钟声的余音还在梁上。我跪着，膝盖已经麻了。"
 latria_sexual_frustration_flavor.1303.desc.condemns: "钟声一遍遍回荡，祭司诵读的誓词也一遍遍落在我心上。我跪得膝头发麻，石板的凉意早被体温捂没了。答案仍没有出现。\n\n每一句誓词我都认得。认得不等于肯。念到“弃绝”两个字时，我的舌头顿了一下，顿完才把它们送出去。祭司没有纠正我，可那一下停顿已经够我自己听见。\n\n最后一声钟敲完。殿里静得能听见烛泪落下。"
 latria_sexual_frustration_flavor.1303.desc: "午夜的祷告没有带来平静，钟声却仍在回响。\n\n我跟到了最后一句。跟完以后，人还跪在原处，心里那件事也还在原处。它不因钟声改变形状。\n\n祭司合上书。书页合拢的声音比钟声更近。"
 latria_sexual_frustration_flavor.1303.a: "把戒欲的训词留在殿内。"
 latria_sexual_frustration_flavor.1303.b: "压下念头，再诵一遍祷词。"
 latria_sexual_frustration_flavor.1303.c: "留到天明，逐句研读经卷。"

 latria_sexual_frustration_flavor.1304.t: "耐心的尽头"
 latria_sexual_frustration_flavor.1304.desc.lustful: "我在寝衣里踱过房间，侍从送来的棋盘仍未动过一枚棋子。窗开着一条缝，夜气进来，吹不散身上那层热。\n\n我在床边站过，在桌边站过，在门边也站过。门后没有脚步。等待已经成了另一种折磨：明知不会有人来，仍把每一声更鼓听成叩门。棋子在匣里碰了一下，是我自己的袖子带的。\n\n我回到棋盘前，手按在一枚卒上，没有把它推出去。"
 latria_sexual_frustration_flavor.1304.desc.chaste: "我把寝衣的系带重新系紧，试图让每个动作都显得平静。系带勒进腰里，勒得很清楚。越是这样谨慎，心中的渴望越难装作不在。\n\n棋盘还在桌上，像一条可以走下去的正路。我坐下，拿起一枚棋，又放下。放下以后，手指仍想去做另一件事。我把那只手压在桌下，压住了，呼吸却乱了。\n\n屋里很静。静得我听得见自己没有说出口的那句咒骂。"
 latria_sexual_frustration_flavor.1304.desc: "屋里很静，我却再也无法安坐。\n\n我起来倒水，水没有喝。我去剪灯，灯芯剪得太短，火苗矮了一截。每一件事都做了个头，没有一件能把我按回椅子上。\n\n最后我站在屋子中间，手不知道往哪里放。"
 latria_sexual_frustration_flavor.1304.a: "放下棋盘，任自己想起心上人。"
 latria_sexual_frustration_flavor.1304.b: "坐回书案前，把念头压下。"
 latria_sexual_frustration_flavor.1304.c: "摆开棋子，独自推演残局。"
 latria_sexual_frustration_flavor.1304.d: "从第一步开始，慢慢下完一局。"

 latria_sexual_frustration_flavor.1305.t: "夜深的寝室"
 latria_sexual_frustration_flavor.1305.desc.emperor: "宫廷散去，我仍穿着礼服留在寝室里。奏报已经批完，印泥干了，众臣的脚步也远了。心事却没有跟着他们走。\n\n我解开领上的扣，解到一半又停住。床是铺好的，铺得太整齐，整齐得不像能睡进去。我在镜前站了一会儿，看见礼服下的自己，也看见眼底那点没有批进任何奏报的东西。\n\n侍从在门外问要不要卸冠。我让他们先不要进来。"
 latria_sexual_frustration_flavor.1305.desc.adventurer: "同伴们已在客栈歇息，我却独自留在房中。行装收好了，明日的路程也写在门后的木板上。心绪无处安放，它不占行囊的位置，却把整个房间占满。\n\n我坐在床沿，靴还没脱。楼下有人喝醉了唱歌，唱到一半被同伴捂住。那点笑声透上来，像从另一个我进不去的夜里传来。\n\n我把地图卷好，又展开。路还是那些路。"
 latria_sexual_frustration_flavor.1305.desc.clergy: "我独自在小室里停留，法衣仍穿在身上，床边的烛火已经暗了。誓言还在，一字不差地留在白天念过的地方。慰藉没有来。\n\n我把念珠从腕上取下，珠子一颗颗滑过指缝，滑到后来就不是祷词了。我想起一个人站在廊下的样子，想起自己当时把目光先移开。移开并没有让那个人消失。\n\n法衣的领口磨着脖子。我没有把它脱掉。"
 latria_sexual_frustration_flavor.1305.desc.ruler: "我穿着礼服回到空荡的寝室。守卫在门外行礼，甲叶响了一下，随后就是门闩。门内没有人能替我分担心事。\n\n冠还在头上。我把它取下来，放在枕边，放得像放另一颗头。镜子里的人看起来仍能明日上朝，只有我知道这一夜会怎么过。\n\n我在床边坐下，手套一只还戴着。"
 latria_sexual_frustration_flavor.1305.desc: "房中空无一人，我却迟迟不愿上床。\n\n灯还亮着，鞋还在脚上，外衣也还整齐。我把这些当作还能出去见人的证据。其实没有人在等我。我只是不想面对铺好的那张床。\n\n风从窗缝进来，把灯吹得斜了斜。"
 latria_sexual_frustration_flavor.1305.a: "夜已深，仍请来熟人，把心事细细谈开。"
 latria_sexual_frustration_flavor.1305.b: "压下心事，更衣安歇。"
 latria_sexual_frustration_flavor.1305.c: "拟好清晨的事务，再吹灭烛火。"

 latria_sexual_frustration_flavor.1306.t: "午夜的信使"
 latria_sexual_frustration_flavor.1306.desc.female: "我披着寝衣坐在床边，听见门外有人轻叩两下。不是约定过的叩法，只是侍女送东西时的那种敲。她进来，放下一封空白信纸，又退出去，眼睛没有往床上看。\n\n空白的纸比写满的信更吵。我知道自己在等谁的消息，也知道今夜不会有。我把纸拿到灯下，灯照出上面一点纤维，像一行还没写成的字。\n\n我的手指在纸上停了很久，停出一小块潮印。"
 latria_sexual_frustration_flavor.1306.desc.male: "我披着寝衣打开房门，走廊上已经空无一人。门槛旁有一封没有署名的信笺，大概是谁顺手放下的，也可能只是白日里落下的。我把它捡起来，仍旧睡不着。\n\n信里没有我要的那句话。它谈的是明日的时辰和一笔该付的钱。我还是把每一行读完，读完又翻到背面，背面是空的。空的那一面更像在等我写。\n\n走廊的灯灭了。我还站在门边，门没有关严。"
 latria_sexual_frustration_flavor.1306.desc: "门外的脚步声远去，桌上的信纸仍未落笔。\n\n我把笔拿起来三次。第一次写了一个字，涂掉了。第二次只在纸上留下一点墨。第三次我把笔放下，看着那点墨慢慢干。\n\n夜已经过半。纸还是差不多空白。"
 latria_sexual_frustration_flavor.1306.a: "写下那句迟疑已久的话。"
 latria_sexual_frustration_flavor.1306.b: "收起信纸，压下心事后躺下。"

 latria_sexual_frustration_flavor.1307.t: "席间的沉默"
 latria_sexual_frustration_flavor.1307.desc.accepted: "诗人吟起一段旧情，众人听得兴致盎然。有人跟着拍桌，有人把后半句提前接了。酒杯在手里转，谁也不觉得这话题需要避开谁。\n\n我举杯附和，心里却想起一段无人提及的往事。那件事没有诗里好听，也没有这么多人捧场。它只有一扇关上的门，和我事后独自坐到天明。诗人念到相拥的那一句，我的酒洒出一滴。\n\n没有人看见那一滴。我自己看见了。"
 latria_sexual_frustration_flavor.1307.desc.strict: "席间谈到一位因私情失宠的贵族，笑声很快停了。停得这样齐，像有人把一根弦按住。我把目光转向窗外，不愿让人看出自己的神色。\n\n窗外没什么可看，只有一盏巡夜的灯。我仍看着它。背后有人轻轻说“也是自作自受”。这句话不一定冲着我，可它落在我背上，像落在那件我还没被人抓住的事上。\n\n我把杯子握稳。指节发白。"
 latria_sexual_frustration_flavor.1307.desc: "酒杯仍在传递，谈话却停在了最不该停留的话题上。\n\n前一刻还在说收成。下一刻就有人提起谁的床帷。提起以后，谁也没有把话接回去。我坐在这个空隙里，听见自己的心跳盖过了乐声。\n\n有人咳了一声，想把空隙补上。没有补上。"
 latria_sexual_frustration_flavor.1307.a: "借酒兴讲起自己的情事，一段接着一段。"
 latria_sexual_frustration_flavor.1307.b: "把话咽回去，起身向同席诸人行礼告辞。"
 latria_sexual_frustration_flavor.1307.c: "念一首新诗，把众人的目光引向别处。"

 latria_sexual_frustration_flavor.1308.t: "守夜祷词"
 latria_sexual_frustration_flavor.1308.desc.favors: "守夜的钟声响过，我仍在圣所里祈祷。教义并不排斥肉体欢愉，这一条我能指给人看。可指给人看，并不能告诉我此刻跪着的这具身体该怎么办。\n\n长椅空着。烛火把我的影子投在椅背上，影子随呼吸起伏，像另一个不肯守夜的人。我想起白日里一次几乎说出口的邀请，想起自己把那句话改成了别的。改完以后，身体并没有跟着改。\n\n钟声远了。我还跪着，额上有一层汗。"
 latria_sexual_frustration_flavor.1308.desc.condemns: "我在圣所中反复诵念贞洁的祷词。第一遍还完整，第二遍开始漏字，第三遍我干脆停在同一句上，后面的字再也念不下去。\n\n钟声渐远，心中的念头没有退。它不跟钟走。我把掌心按在石板上，想借那点凉意，凉意却很快被捂热。捂热以后，我更清楚地知道自己在跟什么作对。\n\n空荡的长椅上没有旁人。我仍把声音压得很低。"
 latria_sexual_frustration_flavor.1308.desc: "烛火映着空荡的长椅，我仍没有起身。\n\n守夜本该到这里结束。我却觉得一站起来，那点被跪姿压住的热就会顺着腿回来。于是我继续跪着，跪成一种拖延。\n\n最后一支烛爆了一下。黑烟升上去，散在梁下。"
 latria_sexual_frustration_flavor.1308.a: "暂放戒欲的祷词，循着自己的心意离开。"
 latria_sexual_frustration_flavor.1308.b: "把欲念压下，守完夜祷。"
 latria_sexual_frustration_flavor.1308.c: "合起祷书，静坐梳理心绪。"
 latria_sexual_frustration_flavor.1308.d: "守到晨祷，替众人备好经卷。"

 latria_sexual_frustration_flavor.1309.t: "镜前的目光"
 latria_sexual_frustration_flavor.1309.desc.lustful: "我未着衣物，独自在寝室的铜镜前站了片刻。镜中的人没有躲，我也没有拿衣裳去挡。灯从侧面照过来，把锁骨和腰上的阴影都照清楚了。\n\n我厌倦了把这点欲念叫作一时软弱。它不是一时。它从傍晚跟到现在，跟过晚饭，跟过别人散去，现在只剩下我和这面镜子。我抬手碰了碰自己的肩，镜子里的手也碰上去。这一下很轻，却足够让呼吸变了。\n\n门外没有脚步。我不必装。"
 latria_sexual_frustration_flavor.1309.desc.chaste: "我未着衣物，坐在床沿默念誓词。每个字都记得清楚，清楚到我能在漏掉一个字时立刻听见。心头的渴望却没有因此消失。它就在这具没有被衣裳盖住的身上，没法说它在别处。\n\n我看着镜子，又把目光移开。移开没有用，铜镜还是把我映在里面。我把双手紧扣，扣得指节发白，像这样就能守住那句誓。\n\n誓词又断了一次。这次我没有立刻接上。"
 latria_sexual_frustration_flavor.1309.desc: "屋里没有旁人，镜中的沉默却令我无法回避自己。\n\n衣裳在椅上。人在镜前。这两件事之间只有几步，我却走了很久才承认自己为什么不把衣裳披上。灯火很稳。我的眼睛不稳。\n\n我在床沿坐下，席子是凉的，凉不过一会儿。"
 latria_sexual_frustration_flavor.1309.a: "承认这份心意，容自己想下去。"
 latria_sexual_frustration_flavor.1309.b: "披衣回到书案前，把心事压下。"
 latria_sexual_frustration_flavor.1309.c: "写下不愿对人说的心事，逐句理清。"

 latria_sexual_frustration_flavor.1310.t: "夜深未眠"
 latria_sexual_frustration_flavor.1310.desc.clergy: "夜祷之后，我回到自己的小室。法衣尚未更换，床边烛火已暗，我仍不愿躺下。躺下以后，手会知道该往哪里去，我还没决定要不要让它知道。\n\n念珠放在枕边，像一个证人。我把法衣的带子松开一半，又系上。系上以后，领口仍磨着皮肤，磨出一种不肯睡的清醒。\n\n小室里只有我。这并没有让事情变得简单。"
 latria_sexual_frustration_flavor.1310.desc.adventurer: "同伴已在客栈歇下，我独自在房中收好行装。明日的路程清楚：渡口、旱路、再一个渡口。心里的去处却不明，它不在任何一张地图上。\n\n我把靴脱了，又没有躺下。窗外有马在嚼草，嚼得慢慢的。那声音本该助睡。我听着它，想起白日里谁在渡口看了我一眼，那一眼短得几乎可以不算。我把它算了。\n\n油灯跳了一下。我没有去添油。"
 latria_sexual_frustration_flavor.1310.desc: "夜色已深，房门关上，我仍无法安睡。\n\n床是好的，枕也是好的。我在床边坐着，把白天没能靠近的那个人又想了一遍。想到手心发热，才发觉自己已经把寝衣的带子解开了，却还不记得是什么时候解的。\n\n我看着那根带子。它垂在腿边，像一个还没做出的决定。"
 latria_sexual_frustration_flavor.1310.a: "写信给一位旧识，把心事说清。"
 latria_sexual_frustration_flavor.1310.b: "把念头压下，熄灯安歇。"
 latria_sexual_frustration_flavor.1310.c: "煮一壶茶，慢慢收拾手边物品与书卷。"
