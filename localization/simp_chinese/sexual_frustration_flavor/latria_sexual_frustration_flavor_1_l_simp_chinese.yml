l_simp_chinese:
 latria_sexual_frustration_flavor.1001.t: "帘后的长夜"
 latria_sexual_frustration_flavor.1001.desc.female: "我披着寝衣坐在窗边，膝上压着一封未拆的信。月色从帘缝里漏进来，刚好照见折痕上的指纹。写信的人早走了，信却被我从匣底翻出来，又放回去，再翻出来。\n\n我想起最后一次见面。那人把话停在半句上，像是还要补一句，袖口却先缩了回去。我当时只点了点头，连一句挽留都没有说出口。如今夜深了，那半句话反而比整封信还清楚。\n\n风吹动帘子，信纸跟着轻响了一下。我把指尖按在封蜡上，既没有拆，也没有把它收回匣里。"
 latria_sexual_frustration_flavor.1001.desc.male: "我披着寝衣坐在窗边，膝上压着一封未拆的信。月色从帘缝里漏进来，刚好照见封皮上那道熟悉的笔迹。写信的人走了很久，信却一直被我压在账册底下。\n\n我想起那人临走前看了我一眼，像是在等一句回应。我当时手里还有别的事，只说改日再谈。改日到了，人已经不在，那一眼却还留在眼前。\n\n窗外的更声响过一轮。我把信翻过来，又翻回去，封蜡仍旧完好。"
 latria_sexual_frustration_flavor.1001.desc: "夜深以后，未竟的心事又一次浮上心头。\n\n我把那封信拿起来，看了看封口，又放回膝上。屋里没有旁人，连灯花爆响都显得清楚。我想把心思转到明日的事上，念头却总绕回同一个地方。\n\n帘子动了一下。信还在，人却不在。"
 latria_sexual_frustration_flavor.1001.a: "把信读到最后，容我再想一想那人。"
 latria_sexual_frustration_flavor.1001.b: "锁起信笺，把心事压下。"
 latria_sexual_frustration_flavor.1001.c: "另取一纸，把这些话写成诗。"

 latria_sexual_frustration_flavor.1002.t: "宴席间的辛香"
 latria_sexual_frustration_flavor.1002.desc.accepted: "宴席上的香料味压过了酒气，乐师换了第三支曲子，席间仍有人靠得很近地说话。这样的亲近在这里算不得失礼，宾客笑过便继续传杯。\n\n我却把每一道目光都看了一遍。有人举杯向我致意，我应了，眼睛却还在找那张没有出现的脸。邻座说了句笑话，我笑得晚了半拍。\n\n侍从添酒时，我几乎忘了手中的杯盏。香料的热气扑上来，心里那点空处却没有被填上。"
 latria_sexual_frustration_flavor.1002.desc.strict: "香料令宴席更加热闹，笑声一起，我便想起礼法如何盯着每一次逾矩。邻座把身子侧过来说话，我下意识把杯盏握正，像是这样就能显得稳妥。\n\n有人提起一段旧事，话到一半便收住了。席上随即换了话题，谈起封地和收成。我跟着点头，耳朵却还停在那句没说完的话上。\n\n侍从添酒时，我几乎忘了手中杯盏。酒满到沿上，我才把杯子放回去。"
 latria_sexual_frustration_flavor.1002.desc: "宴席喧闹，心思却总被同一件事牵走。\n\n乐声、杯盏和谈话都在眼前，我却听不全任何一句。邻座问我是否还要酒，我应了一声，自己也不知道应的是什么。\n\n等到曲子换过，我才发觉自己一直盯着厅门。门开了两次，进来的都不是我想见的人。"
 latria_sexual_frustration_flavor.1002.a: "顺着话头，说几句亲昵的话。"
 latria_sexual_frustration_flavor.1002.b: "收回目光，谢过主人后告辞。"
 latria_sexual_frustration_flavor.1002.c: "请乐师换一支曲子，听完再走。"
 latria_sexual_frustration_flavor.1002.d: "把宾客请到同一桌，聊个尽兴。"

 latria_sexual_frustration_flavor.1003.t: "园中的讲道"
 latria_sexual_frustration_flavor.1003.desc.favors: "讲道者坐在园中的石凳上，说肉体欢愉并不违背我们的信仰。风把书页吹起一角，他用手指按住，仍旧慢慢讲下去。\n\n这样的话本该让我宽心。我却在听的时候想起另一件事：那人离开前说过的一句玩笑，还有我当时没有接住的目光。经文从耳边过去，那句话反而停了下来。\n\n讲道者问我是否听明白了。我点头，书却已经合不上原来的那一页。"
 latria_sexual_frustration_flavor.1003.desc.condemns: "讲道者谈起克制与贞洁，一句一句都清楚。园里很静，连树叶响都像在替他停顿。我把双手放在膝上，姿势端正，心思却不在书上。\n\n我想起昨夜没有睡实的那一阵。并没有人来，也没有人说什么，只是那点热意自己回来了。我把目光钉在经文上，字却连不成句。\n\n讲道者翻过一页。我跟着低头，仍旧不知道他刚念到哪里。"
 latria_sexual_frustration_flavor.1003.desc: "我在园中听完讲道，风吹过书页，念头仍未安定。\n\n讲道者已经起身去招呼旁人。我还坐着，手指压着那一页，眼睛却看着石径尽头。那里并没有人，我仍旧看了一会儿。\n\n等我回过神，书页已经被风吹过去好几张。"
 latria_sexual_frustration_flavor.1003.a: "合上经卷，容我想一会儿心上人。"
 latria_sexual_frustration_flavor.1003.b: "把杂念压下，跟着诵读。"
 latria_sexual_frustration_flavor.1003.c: "请讲道者逐句讲解。"

 latria_sexual_frustration_flavor.1004.t: "猎隼的躁动"
 latria_sexual_frustration_flavor.1004.desc.lustful: "猎隼在腕上扑动，目光追着远处的鸽群。系脚的皮带勒得它不安，每一次展翅都带起一股风。我按住它，它仍旧盯着那片空地。\n\n我熟悉这份急切。猎人们在林边等我发话，马也踏得不耐烦。我却在想另一件事，想得甚至忘了手里的哨子。那点念头没有形状，只是不肯停。\n\n隼又扑了一下。我这才发觉自己把手套握得太紧。"
 latria_sexual_frustration_flavor.1004.desc.chaste: "猎隼在腕上不安地踱步。我强迫自己听缰绳和哨音，把目光放在林线以内。猎人们已经散开，只等我一声号令。\n\n心头的念头却比鸟儿更难按住。我数呼吸，数马蹄，数树上的叶子，数到后来又回到同一个人身上。那人并不在猎场上。我知道，仍旧想。\n\n隼侧过脑袋看我，像是在等一个它听得懂的指令。我一时给不出来。"
 latria_sexual_frustration_flavor.1004.desc: "猎人们等着我唤回猎隼，我却始终无法专心。\n\n林子里的风一停，腕上的扑动就格外清楚。我抬手，又放下，号子在嘴里转了一圈，没有吹出去。\n\n有人在远处喊我的名字。我应了一声，眼睛却还看着空地。"
 latria_sexual_frustration_flavor.1004.a: "让众人再等一会儿，容我想想心事。"
 latria_sexual_frustration_flavor.1004.b: "收回心思，重新整理猎具。"
 latria_sexual_frustration_flavor.1004.c: "慢慢理顺羽毛，再试一次唤鹰。"

 latria_sexual_frustration_flavor.1005.t: "议事间隙"
 latria_sexual_frustration_flavor.1005.desc.emperor: "诸侯离席后，侍从仍在收拾地图与印玺。长桌尽头只剩我一个人，未完的文书旁压着一封旧信。印泥的味道还没散。\n\n方才他们争的是边界和税。我点过头，也驳回过两句，看起来像是都听进去了。其实有一阵我只盯着那封信的角，看它从文书底下露出来。\n\n侍从问要不要把桌面清空。我把手按在那叠纸上，没有立刻答。"
 latria_sexual_frustration_flavor.1005.desc.adventurer: "同行者已商定下一个渡口，桌上的地图却还没有收起。我把一封旧信挪到灯下，发现自己又读不进路程清单了。\n\n外面有人在收拾马具，金属扣碰来碰去。该我确认的那一段路，我看了三遍，记住的仍是信上一个旧地名。那地方不在明日的路上。\n\n同伴在门口等我。我把信盖住，手指却没有离开。"
 latria_sexual_frustration_flavor.1005.desc.clergy: "议事散了，账簿与经卷还摊在桌上。我从书页间抽出一封旧信，心里不肯安静的声音又回来了。\n\n白日里我把捐输、修缮和节期都排过一遍。轮到独自坐着，那些数目便让开了。信纸被经卷压出了印，边角发毛，我却还是一眼认出那行字。\n\n廊下有人走过。我把信重新夹回去，夹的仍是原来那一页。"
 latria_sexual_frustration_flavor.1005.desc.ruler: "议事散了，文书和封蜡还堆在桌上。我抚平袖口，手边的旧信却比奏报更牵动心思。\n\n书记官留下的摘要写得很清楚。我拿起来，第一个名字还没看完，目光已经滑到信上。那封信不该出现在这张桌上。是我自己早上塞进来的。\n\n门外的人还等着下一道吩咐。我让他们先候着。"
 latria_sexual_frustration_flavor.1005.desc: "手边事务不少，一封旧信却让我迟迟不能专心。\n\n我把文书按高低叠好，又打乱，再叠一次。信始终留在最上面。灯油下去一截，我一个字也没批。\n\n有人在门外轻咳了一声。我这才把手从信上挪开。"
 latria_sexual_frustration_flavor.1005.a: "把事务搁下，重读那封旧信。"
 latria_sexual_frustration_flavor.1005.b: "收好信笺，继续办事。"
 latria_sexual_frustration_flavor.1005.c: "排好余下的事务，给自己留一刻歇息。"
 latria_sexual_frustration_flavor.1005.d: "把待办分门别类，逐一办完。"

 latria_sexual_frustration_flavor.1006.t: "灯下的旧信"
 latria_sexual_frustration_flavor.1006.desc.female: "我披着寝衣坐在灯下，指尖停在旧信的折痕上。信里没有允诺，只有几句平常的问候，末尾却空了一大块，像是写到那里忽然停住了。\n\n我把那块空白看了很久。当初收到时觉得不过如此，今夜却觉得那片空处比写出来的字更重。灯花爆了一下，影子在纸上跳。\n\n寝衣的带子松了，我没有去系。信还摊着，夜也还长。"
 latria_sexual_frustration_flavor.1006.desc.male: "我披着寝衣坐在床边，旧信上的字迹让我想起一段始终没有回应的情意。纸已经软了，折痕处几乎要裂开，我仍把它展平。\n\n信里写的是路上的天气和一桩小事。我却记得送信那日自己站在廊下，想追出去，又被旁人叫住。后来信被我收进匣里，人再没有回来。\n\n灯芯短了一截。我把信纸转了个方向，还是那些字。"
 latria_sexual_frustration_flavor.1006.desc: "夜色沉静，旧信上的字句却久久留在眼前。\n\n我本想只看一眼就睡。灯一亮，那几行字便不肯放过我。我读到一半，又从头读，像是中间藏着当初没看懂的意思。\n\n床已经铺好。我还坐着，信纸的边被我捏出了新的印。"
 latria_sexual_frustration_flavor.1006.a: "把信读到末尾。"
 latria_sexual_frustration_flavor.1006.b: "收好信笺，今夜不再想它，熄灯歇息。"

 latria_sexual_frustration_flavor.1007.t: "宴席散前"
 latria_sexual_frustration_flavor.1007.desc.accepted: "谈笑间有人提起旧日情人，席上无人觉得失礼。杯子碰过一轮，笑声也跟着过去，像在说一件天气之类的寻常事。\n\n我跟着举杯，目光却几次落向空着的席位。那里的杯盏已经收走了，只剩一块压平的桌布。我知道自己在等谁，也知道那人今夜不会来。\n\n邻座问我在看什么。我摇头，酒却忘了喝。"
 latria_sexual_frustration_flavor.1007.desc.strict: "席间把一桩私情说成警戒，众人随即谈起名誉与规矩。说话的人压低了声音，旁边的人还是听得见，于是笑也笑得小心。\n\n我低头理了理袖口，没有接话。那桩事不是我的，听着却像是冲着我来。桌下的手指把杯足转了一圈，又转了一圈。\n\n话题很快换了。我的袖口已经理平，心却还停在原处。"
 latria_sexual_frustration_flavor.1007.desc: "乐声未停，心思却早已离开席间。\n\n宾客还在传最后一轮酒。我看着他们的嘴一张一合，听见的却是自己心里那句没处放的话。有人向我敬酒，我举杯，酒面晃了一下。\n\n曲子近了尾声。我仍坐着，像是还没决定自己在不在这场宴里。"
 latria_sexual_frustration_flavor.1007.a: "我的旧情也该讲给他们听，从头说起。"
 latria_sexual_frustration_flavor.1007.b: "把话咽回去，谢过主人后告辞。"
 latria_sexual_frustration_flavor.1007.c: "把话题转到旅途，陪邻座聊一会儿。"

 latria_sexual_frustration_flavor.1008.t: "烛前的祷词"
 latria_sexual_frustration_flavor.1008.desc.favors: "圣龛前的烛火将尽。我想起信仰并不憎恶肉体欢愉，这句话我听过许多次，此刻却像第一次需要自己拿它做什么。\n\n蜡泪堆在铜座上，已经结了一层。我把祷词念到一半，嘴里仍是那些字，心里却在想一个人的手，想那人靠近时衣料的声音。龛里的像不动，火苗倒跳了一下。\n\n我想把念头拉回来。拉到一半，又松了。"
 latria_sexual_frustration_flavor.1008.desc.condemns: "我在圣龛前默念贞洁的誓词，熟悉的祷文却几次断在唇边。第一句还完整，第二句就开始漏字，漏掉的地方刚好够一个念头钻进来。\n\n那念头并不大声。它只是提醒我，今夜回去以后，床仍是空的，手仍是自己的。我把额前的头发抹开，重新从第一句念起。\n\n烛芯爆了一下。我的声音也跟着顿住。"
 latria_sexual_frustration_flavor.1008.desc: "祷告已毕，我仍留在烛火旁。\n\n该念的都念完了。膝盖有点麻，我却没有起身。火焰矮下去，又勉强挺住，像是也在等一个不肯来的结尾。\n\n我看着那点光，知道自己并没有把心里的事放下。它只是暂时让开了祷词。"
 latria_sexual_frustration_flavor.1008.a: "暂放戒欲的誓词，承认自己的渴望。"
 latria_sexual_frustration_flavor.1008.b: "收束念头，继续默祷。"
 latria_sexual_frustration_flavor.1008.c: "读一段经卷，想清楚再走。"
 latria_sexual_frustration_flavor.1008.d: "守着灯烛，诵读到天明。"

 latria_sexual_frustration_flavor.1009.t: "未批的奏报"
 latria_sexual_frustration_flavor.1009.desc.emperor: "奏报摊在长桌上，诸侯都等着我发话。我把一行字读了两遍，第二个数目仍旧记不住。笔在指间转了一圈，墨点落在空白处。\n\n他们看我的眼神已经从恭敬变成迟疑。有人轻咳，有人去倒水，谁也不敢先开口。我知道自己该裁决，脑子里却闪过昨夜没写完的那半行字。\n\n书记官把下一份奏报推近了一些。我的手还停在第一份上。"
 latria_sexual_frustration_flavor.1009.desc.ruler: "议事尚未结束，桌上的文书却一个字也读不进去。我合上卷宗，又打开，页边的批注还是昨日的。\n\n臣下在说粮价和河道。我听见几个词，随即走神，走着走着就走到一个人的名字上。那名字不在这份文书里。我仍旧在纸上找。\n\n有人问我是否要休会。我抬起头，才发觉屋里已经静了片刻。"
 latria_sexual_frustration_flavor.1009.a: "遣散众臣，让我独处片刻。"
 latria_sexual_frustration_flavor.1009.b: "收回心思，逐份批阅。"
 latria_sexual_frustration_flavor.1009.c: "把裁决先后理清，再逐一宣读。"

 latria_sexual_frustration_flavor.1010.t: "归鹰迟迟"
 latria_sexual_frustration_flavor.1010.desc.lustful: "猎鹰盘旋在林地上空，影子一次次掠过我的手套，却不肯落下。我举起手臂，它只在更高处转了一圈。\n\n我看着它迟迟不肯归来，忽然觉得自己也厌倦了把每一点心意都按回去。猎人们在马边低声说话，以为我在等风向。其实我在等自己把那点躁动说成别的东西。说不成。\n\n鹰叫了一声。那声音又尖又短，像是不肯再听号令。"
 latria_sexual_frustration_flavor.1010.desc.chaste: "鹰隼仍在远处盘旋。我握紧手套，强迫自己只听猎人的号令，只看林线和风向。皮带在掌心里发潮。\n\n这样的克制我做过许多次。今日却格外费力。每等一会儿，心里就多出一句不该有的话，我说给自己听，又自己打断。马踩碎一根枯枝，我被那点声音吓了一下。\n\n鹰还没回来。我的手已经酸了。"
 latria_sexual_frustration_flavor.1010.desc: "猎人们等着收队，我却还在望着林间的天空。\n\n号角就在鞍旁。我碰了碰它，没有拿起来。天上的黑点转了一圈，又转了一圈，谁也不催我，可每个人都在等。\n\n我终于低下头，发现自己连鹰飞往哪边都没看清。"
 latria_sexual_frustration_flavor.1010.a: "让猎人们候着，任我的心思随鹰远去。"
 latria_sexual_frustration_flavor.1010.b: "吹响收队的号角，检查猎具。"
 latria_sexual_frustration_flavor.1010.c: "沿林地走一段，再返回队伍。"

 nick_latria_the_unquiet: "欲火难平者"
 nick_latria_the_unquiet_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]不愿再把性欲藏在心里，亲口说给书记写进编年史，抄本至今仍在各地流传。"
 latria_flavor_focus: "收束心神"
 latria_flavor_focus_desc: "此人将精力投入经卷与日常事务。"
 latria_flavor_remorse: "挥之不去的悔意"
 latria_flavor_remorse_desc: "一时的宽慰留下了心绪不宁。"
 latria_flavor_sullied: "声名受损"
