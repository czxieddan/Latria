l_simp_chinese:
 latria_sexual_frustration_flavor.1411.t: "门前无人"
 latria_sexual_frustration_flavor.1411.desc: "灯芯烧得只剩一截，我还醒着，寝衣推到了腰上，手放在我从不对人提起的地方。我已经不再把这叫作烦躁。三夜了，我总把自己带到边上，又停在那里，听着廊下始终没有响起的脚步声。我在原处躺得太久，褥子已经潮了。\n\n我想起宴上那人俯身靠近我椅背的样子，近到其一挺直身子，那点暖意便跟着离开。我的呼吸短了下去。我把手掌压平，按住不动，那股渴念却不肯松开，只是更低、更沉地聚起来。\n\n楼下有扇门合上了。我的手又动起来，这一回我没有拦它。"
 latria_sexual_frustration_flavor.1411.a: "不再拦它，把这份渴认下来。"
 latria_sexual_frustration_flavor.1411.b: "把手挪开，直躺到灯灭。"
 latria_sexual_frustration_flavor.1411.c: "披上衣裳坐着，等这片寂静松开我。"

 latria_sexual_frustration_flavor.1412.t: "说得太多"
 latria_sexual_frustration_flavor.1412.desc: "厅里满是最后那点酒气，我已经说得太多。邻座问我这故事从哪里听来，我说了，接着把余下的也说了，那一段我在白天从不出声的部分。\n\n有人笑起来，喊着再来一杯。我听见自己的声音还在往前赶，越说越快，添上我素来略去的细节：时辰，那道门，我等候的样子。酒气把我的脸烘得发烫。身后不知谁把杯子放下。我在一个谨慎的人该停住的地方，怎么也停不住。\n\n邻座的椅子向后一刮。乐声已歇，还没有人动身回家，厅里一股牛油与泼出的酒味，我却仍握着那只本要放下的杯子。"
 latria_sexual_frustration_flavor.1412.a: "把余下的说完，让整桌都听见。"
 latria_sexual_frustration_flavor.1412.b: "把话咽回去，起身走。"
 latria_sexual_frustration_flavor.1412.c: "把话头转到旧友身上，剩下的交给酒。"

 latria_sexual_frustration_flavor.1413.t: "同样三行"
 latria_sexual_frustration_flavor.1413.desc: "我跪在祭坛前，寝衣压在膝下，石头的寒气透过布渗上来。石板把我小腿上的热气都吸走了。侍者已经退下。整篇日课我都念过了，嘴里却总绕回同样那三行，讲肉身的那几行，像绕着一扇我一次次走过的门。\n\n白天我还能把它唤作一场试炼，也就罢了。此刻烛火将尽，四下无人，我只能掂量自己心里有多少分量要去，多少要去趁更次未换赶到某一处宅门前。这渴念是有重量的，我的膝头被它压得发酸。\n\n离我最近的那支蜡烛弯了一下，又直起来。我把手按在冷石上，没有起身。"
 latria_sexual_frustration_flavor.1413.a: "把日课丢在半途，去我想去的地方。"
 latria_sexual_frustration_flavor.1413.b: "守着夜，把经文念到天明。"
 latria_sexual_frustration_flavor.1413.c: "慢慢读那一段，等字句里的意思回来。"

 latria_sexual_frustration_flavor.1414.t: "骑行无用"
 latria_sexual_frustration_flavor.1414.desc: "天未亮我们便已上马，鹿群还在前头。我握缰的手很稳。麻烦正在这里。我周身上下没有一处是稳的，已经好几日了，这一程颠簸只把它摇松了。\n\n我总看见上回围猎时那人笑着的样子，头发被溪水润得湿亮，那影子怎么也赶不走。猎犬吠开，我松了马头让它放足，地面飞快倒退，有那么几个马身的距离，我什么也没有想。\n\n随后林子合拢，步子慢下来，一切又都回来了。我坐在鞍上，两腿内侧烧得发烫，号角的皮带在我胯上磨出一道痕，我没有举起它。"
 latria_sexual_frustration_flavor.1414.a: "离了队列，纵马直到把那念头颠散。"
 latria_sexual_frustration_flavor.1414.b: "守住队形，取号角，按规矩来。"
 latria_sexual_frustration_flavor.1414.c: "看猎人指出的地面，循着足迹走。"

 latria_sexual_frustration_flavor.1415.t: "门已落栓"
 latria_sexual_frustration_flavor.1415.desc: "灯已拨低，门已落栓，我惦记了一年的人就在这屋里，衣裳褪尽，手掌贴在我胸口。那只手隔着衣料是烫的。\n\n我把人拉下来压进床里，那重量是真的，肌肤的热是真的，耳边那一点声响也是真的。床绳在我们身下作响。我在心里排演过太多回，真到了眼前，还未开始，人几乎先散了。我的腰抬起来。那人的唇落到我喉间，我便不再去数自己的呼吸。\n\n事后灯还亮着，一道蜡顺着烛台淌了很长。发丝铺在我臂上，谁也没有提明日。"
 latria_sexual_frustration_flavor.1415.a: "把人留下，家中议论由它去。"
 latria_sexual_frustration_flavor.1415.b: "让那人回自己房去，独自躺下。"
 latria_sexual_frustration_flavor.1415.c: "取过书来，读到两手安静。"

 latria_sexual_frustration_flavor.1416.t: "案对面的手腕"
 latria_sexual_frustration_flavor.1416.desc: "议事已经拖得很长，我一个字也没有签。印信冷着，搁在墨边。炉火没人添柴，已经熄了。书记念下一行，我只听见字形的起伏，听不出意思，因为对面那人把袖子推了上去，我正看着那截手腕。\n\n我的亲信抬眼瞧我。我硬着自己请他把那一条再念一遍。他念了。我仍旧一个字也没懂。桌下我的膝头开始动，我用手把它按住。\n\n领主们起身时，我仍坐着，直坐到屋里空净。亲信抱着文书在门边等，什么也不说，我感激他，却没法看他。"
 latria_sexual_frustration_flavor.1416.a: "散了议事，这个午后留给自己。"
 latria_sexual_frustration_flavor.1416.b: "接过文书，向亲信吐露实情。"
 latria_sexual_frustration_flavor.1416.c: "唤回书记，把每一条都定清。"

 latria_sexual_frustration_flavor.1417.t: "同一个问题问了两次"
 latria_sexual_frustration_flavor.1417.desc: "殿里空着，我的导师还在这里整理卷轴，我没有走，因为我走不了。我问了一个关于仪轨的问题，随后又问了另一个，两个其实是同一个问题换了身衣裳。\n\n导师耐着性子答我。卷轴上有尘与雪松油的气味。我看着那双手在卷轴间移动，心里想的是夜里的时辰，是走到某一处门前要多少路，是那个时辰还有没有人醒着。我们之间那盏灯，是唯一把我按在座上的东西。\n\n导师把一卷摊到我面前，等着。膝头在冷阶上跪得发僵。我把手按上去，读了第一个字，第二个字没有读。"
 latria_sexual_frustration_flavor.1417.a: "谢过导师，出门去那扇门前。"
 latria_sexual_frustration_flavor.1417.b: "请导师把仪轨从头再过一遍。"
 latria_sexual_frustration_flavor.1417.c: "展开卷轴，听导师讲。"

 latria_sexual_frustration_flavor.1418.t: "园中的名字"
 latria_sexual_frustration_flavor.1418.desc: "园里满是人，我恰好喝到足够老实的份上。我的杯子没等我要，就被人斟了两次。那句话说出口了。不是全部，只是带名字的那半截，而那名字不是外人的。\n\n笑声绕着一圈人传，有人把它重复了一遍，另有人看我的眼神里添了新的意味。砾石上留着那一圈人挪动的痕。我本该让它当作酒话过去。我却说得更多，那一圈人静了下来，静得像是已经决定要记住。\n\n仆人端着托盘沿小径过来。我接过一只并不想喝的杯子，抵在唇边，好让自己不去填那阵沉默。"
 latria_sexual_frustration_flavor.1418.a: "当着众人，把那名字再说一遍。"
 latria_sexual_frustration_flavor.1418.b: "拱手告辞，走出园子。"
 latria_sexual_frustration_flavor.1418.c: "拉过最近的那位客人，说些别的。"

 latria_sexual_frustration_flavor.1419.t: "自长廊那日"
 latria_sexual_frustration_flavor.1419.desc: "门已闩好，被褥掀开，我再不装作自己只是乏了。自午后起，自长廊上那只搭在我臂上的手起，身子就是这样，一直没有落定。\n\n我把手指按在自己身上，一口气呼出来，那声音我不想让人听见。我想那条长廊，那截袖子的麻布，那几根手指按下的分寸。我的背从床上弓起来。我只好用另一只手捂住嘴。\n\n它持续了许久，留下我一身发抖。灯还亮着。我躺着，手臂搭在眼上，被单缠到腰际，还留着白日的热气，那渴念没有走，只是低了些。"
 latria_sexual_frustration_flavor.1419.a: "任它走完，不再装困。"
 latria_sexual_frustration_flavor.1419.b: "握紧两手，放慢呼吸，等这阵抖过去。"
 latria_sexual_frustration_flavor.1419.c: "就着灯读一页书，等身子静下来。"

 latria_sexual_frustration_flavor.1420.t: "鞍上两日"
 latria_sexual_frustration_flavor.1420.desc: "在鞍上过了两日，草原没有尽头。马鞍在我膝下磨出一处破皮。马比我自己更认得快慢。离营之后我没有睡实过一觉，叫我睡不着的并不是身下的地。\n\n我想那人编发辫的样子，想其咬断线头的那一下。风是冷的，我的手裂了口，那念头还是回来，沉到身子底下，一下一下顶着，像多出来的一颗心。\n\n我们翻上一道坡，草一直铺到河边，一条发白的线，没有声音。我本可以独自折回去。马在腹下换了口气，等着，我松着缰坐在那儿，没有回头。"
 latria_sexual_frustration_flavor.1420.a: "折回营地去，取夜里能给的。"
 latria_sexual_frustration_flavor.1420.b: "随众人往前，把步子稳住。"
 latria_sexual_frustration_flavor.1420.c: "放出猎隼，看它掠向水边。"

 latria_sexual_frustration_flavor.1421.t: "过了谨慎的界"
 latria_sexual_frustration_flavor.1421.desc: "宴席早过了人人留神的时辰。我盯了那人一整晚，一眼也没有移开过，方才当着满堂说了出来，声音大得压过了乐声。\n\n一只杯子翻倒。乐师没有再起。有人笑，有人喊他们再奏，我已站起来，话还在往外涌。我说出了我想要的时辰，说出了地方，满屋的人都听见了。明日无论怎么摆布，这事都不能只算一句戏言。\n\n邻座扯我的袖子。我坐下，因为两腿已经发虚，蜡油淌过桌面落到我袖上，杯子被塞回我手里，我却仍望着桌子对面。"
 latria_sexual_frustration_flavor.1421.a: "把时辰和地点再说一遍，免得有人听岔。"
 latria_sexual_frustration_flavor.1421.b: "坐下饮酒，让喧闹把我那句话盖过去。"
 latria_sexual_frustration_flavor.1421.c: "转向邻座，问起他家里的事。"
 latria_sexual_frustration_flavor.1421.d: "把这事写成一首诗，念给席上听。"

 latria_sexual_frustration_flavor.1422.t: "三夜守夜"
 latria_sexual_frustration_flavor.1422.desc: "守夜我已连着三晚，禁食饿得头重脚轻。寒气钻进了我脚上的小骨。日课的字句还在嘴边，那个人在我心里，两样缠在一处，再也分不开。\n\n我知道誓戒要的是什么。我说的时候是甘愿的，直到今夜才第一次觉得不甘愿。我的手是冷的，胃已经忘了面包是什么。膝下的石头磨出一处光溜的凹，我嵌进去，像已在这里跪了许多年，从要紧处说，也确是如此。\n\n暗里不知哪位弟兄咳了一声，柱子那侧的长凳上有人挪了挪身子。我把头垂得更低，祷文便不再借我的声音，自己往下走。"
 latria_sexual_frustration_flavor.1422.a: "破斋，离开守夜，认下我要的。"
 latria_sexual_frustration_flavor.1422.b: "守着斋戒，把誓守到夜尽。"
 latria_sexual_frustration_flavor.1422.c: "翻到讲灵魂的那一段，把它读完。"

 latria_sexual_frustration_flavor.1423.t: "写错的数目"
 latria_sexual_frustration_flavor.1423.desc: "账目对不上，同一栏我读了四遍。蜡烛是新的，蜡还没有淌。屋子那头有人在向书记口述，那声音我挤在人堆里也认得，我的心思早已离了那一栏。\n\n我把手指压在纸页上按住位置。按不住。书记的笔一直在走。我觉出自己的脉在喉头跳，荒唐得很，屋里是冷的，我却并不冷。\n\n口述停了，我抬头抬得太快。书记等着。我又问了一遍那个数，写下去的是错的，墨在那上面干着，直等到屋里的人都散了，我才改。"
 latria_sexual_frustration_flavor.1423.a: "搁下账册，往那声音去。"
 latria_sexual_frustration_flavor.1423.b: "守着这一栏，直到每个数目都对。"
 latria_sexual_frustration_flavor.1423.c: "取来总账，逐笔核对。"

 latria_sexual_frustration_flavor.1424.t: "未动的酒"
 latria_sexual_frustration_flavor.1424.desc: "门已落栓，酒没有动过，我惦记的那个人就在这里，衣襟敞着，两手捧着我的脸。那双手起初发凉，很快也就暖了。\n\n我把人拉过来贴住，一切都比我想过的更热，也更笨。那人的膝找到了床沿，床架撞了一下墙。我的手落到其腰后，再往下，那人发出的声音并不轻，我也不去管谁听得见。我抖得厉害，是等了太久的缘故。\n\n后来灯烧到了底，酒在杯里凉了。那人的头枕在我肩上，我的手臂被压得发麻，我在听其呼吸。"
 latria_sexual_frustration_flavor.1424.a: "把这一年等下来的，明白说给那人听。"
 latria_sexual_frustration_flavor.1424.b: "退开，理正衣襟，手不再碰过去。"
 latria_sexual_frustration_flavor.1424.c: "躺着不动，就着低灯读到睡意来。"

 latria_sexual_frustration_flavor.1425.t: "勤勉的手"
 latria_sexual_frustration_flavor.1425.desc: "林子里已待了三日，猎获不算少，却没有一样碰到我身子里那样东西。我是勤勉的。我起得比旁人早，看着器具晾干，猎人派我哪条线我就守哪条线。我这双手听使唤。\n\n余下的我却在别处。我想起某一个午后，一道门口，一个人叫我的名字的那种叫法，我一直没能忘掉；那记忆在我踩镫起身时来，也在我清理猎物时再来，手里还留着兽皮的味。\n\n火低下去，余烬冷时哔剥作响。手臂酸了一整天，我仰面躺着，睁着眼，听马群换蹄。"
 latria_sexual_frustration_flavor.1425.a: "离了那趟线，牵出栗色马，走进暗里。"
 latria_sexual_frustration_flavor.1425.b: "把气缓下来，紧一紧肚带，做完这日的事。"
 latria_sexual_frustration_flavor.1425.c: "看着器具晾干，账目记清，再去睡。"

 latria_sexual_frustration_flavor.1426.t: "一页半"
 latria_sexual_frustration_flavor.1426.desc: "书房里静，导师把本文摊好，我读了一页半，一个字也没进去。拇指在页边留了个印子。灯是好灯。夜很长。没有一处等着我去。\n\n我一直在想那个时辰：满屋的人都睡了，长廊空着。导师翻过一页，问我可跟得上这论证。我说跟得上。从讲灵魂本性的头一行起我就没跟上，说来可惜，那一行正是我最需要的。\n\n导师握着笔等，椅子有一处榫头，我一动它就哼。我看着纸页，自己那只手平平地压在木案上，很稳，像别人的手，属于一个比我安静的人。"
 latria_sexual_frustration_flavor.1426.a: "合上书，趁长廊还空着，出去。"
 latria_sexual_frustration_flavor.1426.b: "守住座位，把这一页再读一遍。"
 latria_sexual_frustration_flavor.1426.c: "请导师把那论证再讲一遍。"

 latria_sexual_frustration_flavor.1427.t: "对酒慷慨"
 latria_sexual_frustration_flavor.1427.desc: "我拿酒待人不吝，席间的人也回我以不吝，不知在哪一杯之后，我把想要的说给了这张桌子。不算明白。也够明白了。这里有一个人的名字被我说了出来，说的时候我没敢看那张脸。\n\n有人不笑了，一条狗在长凳底下啃着什么。我的杯子空了，仆人替我斟上，我由他。满屋有一种静，是众人正拿着一样东西，合计要怎么处置。\n\n今夜我姐妹的位子空着，她的杯子还在仆人放下的地方，这运气我配不上。我把两手放在桌上，木头是凉的，乐声又从厅的那一头起。"
 latria_sexual_frustration_flavor.1427.a: "再说一遍，连名字一起，让家里人听见。"
 latria_sexual_frustration_flavor.1427.b: "谢过众人，取斗篷，走。"
 latria_sexual_frustration_flavor.1427.c: "把杯都斟满，把话头引到收成上。"
 latria_sexual_frustration_flavor.1427.d: "与嗓门最大的客人对答玩笑，直到满堂换了话头。"

 latria_sexual_frustration_flavor.1428.t: "圣像都在看着"
 latria_sexual_frustration_flavor.1428.desc: "殿里冷，四壁圣像都在看着，我一个时辰没有动。膝头已经麻了。那欲望没有麻。它像一块盖不住的炭，落在我身上。烛烟直上，没有风。\n\n我祈求过解脱，也祈求过气力，在这里我至少还老实，知道要应的是哪一样。那个人的脸从我和黄金之间浮起来。我没有把它推开。灯有油味，大理石是冷的，我的身子对这两样都不感兴趣。\n\n祭司的脚步自身后过去。我低着头，两手合着，膝头在石上留下两团湿印，心思却搁在城那头的一道门上。"
 latria_sexual_frustration_flavor.1428.a: "起身，穿过城去，让圣像守着。"
 latria_sexual_frustration_flavor.1428.b: "守住誓戒，留在大理石上到日课结束。"
 latria_sexual_frustration_flavor.1428.c: "翻开圣咏集，读到字句能留住我。"

 latria_sexual_frustration_flavor.1429.t: "仲夏的那堵墙"
 latria_sexual_frustration_flavor.1429.desc: "这个时辰的园子不归谁，我在园里，是因为床上更难过。夜是暖的。砾石小径还存着白日的热。某处泉眼在涌，园里只有这一处声音，草叶的气味浓得能尝出味来。\n\n我已经两夜没睡。我沿小径走，砾石在脚下响得很，每转一个弯都把我带回同一堵墙，仲夏那夜我同那人靠着的墙，谁也没说话，两个人都明白。\n\n我的手按在石上。石头还留着余温。一只蛾子不停地扑向我身后的灯。我站在那里，额头几乎要抵上墙，呼吸乱着，泉水只管自己流。"
 latria_sexual_frustration_flavor.1429.a: "走出角门，把这句话说给夜色。"
 latria_sexual_frustration_flavor.1429.b: "守住誓，把手从墙上收回来，进屋。"
 latria_sexual_frustration_flavor.1429.c: "沿小径走到天色发灰，两腿发酸。"

 latria_sexual_frustration_flavor.1430.t: "弦是冷的"
 latria_sexual_frustration_flavor.1430.desc: "满屋都睡了，我躺不住，便把琴取了出来。弦是冷的，拨子有一边已经磨薄。我弹那一支总弹的曲子，不够，已经一整个礼拜都不够了。\n\n指头认得那套路，其余的我却在别处，在一间窗板还关着的屋子里，在一个我不断回去的午后。音符散进暗里，没有人听见。\n\n我停下，手掌平压在弦上，把声音掐死。之后的静更难受。我坐着，琴横在膝上，弦在寒气里松了，头靠在椅背上，窗纸边缘已经泛灰。"
 latria_sexual_frustration_flavor.1430.a: "把它弹完，弹得难听，让全屋都听见。"
 latria_sexual_frustration_flavor.1430.b: "放下琴，坐着把这一夜熬完。"
 latria_sexual_frustration_flavor.1430.c: "摆开棋盘，两边都下，下到天光进来。"

 latria_sexual_frustration_flavor.1431.t: "暗处的针脚"
 latria_sexual_frustration_flavor.1431.desc: "烛火一个时辰前就矮了下去，我没有把被子拉上来。寝衣皱在腰际。我的指尖先摸到衣缝，又探到它下面，很慢，是我在廊下无人时教给自己的那种慢法。我闭着眼，唤回上周替我斟酒的那位管事，其袖口擦过我的手腕，多停了一息。\n\n我的呼吸一滞，停住。手动了一下，那股渴念便收得更紧、更低，像两头同时被拉起的绳结。我想起那人贴近我耳畔的嘴，那句没说完的话。掌心下的亚麻又暖又潮。\n\n廊道里一块木板响了。我的手顿住，随即又动起来，我由它去，黑暗替我把这秘密多留了一刻。"
 latria_sexual_frustration_flavor.1431.a: "在暗里了结它，认下这份饥渴。"
 latria_sexual_frustration_flavor.1431.b: "把手抽回，僵到烛芯没入烛泪。"
 latria_sexual_frustration_flavor.1431.c: "裹紧被子，等那阵酸胀松下去。"

 latria_sexual_frustration_flavor.1432.t: "未竟的晚祷"
 latria_sexual_frustration_flavor.1432.desc: "礼拜堂空了，我穿着寝衣跪在冰冷的石地上，祷词越来越薄，四处飘散。上次听我告解的那位教士把手停在我低下的头上，停了许久，那重量我一直没能放下。我双掌隔着薄布压在腿上，这一压并不是祷告。\n\n我在膝上挪了挪身子。石头的寒意穿透亚麻。我想起那只手，它的暖，想起自己曾不自觉地朝它偏过一分，又及时收住。呼吸在拱顶下的寂静里变得零乱，我压得更重，去寻那我来乞求、却始终求不到的释放。\n\n钟绳在我头顶静静垂着。我朝漆黑的祭坛仰起脸，手仍按在原处。"
 latria_sexual_frustration_flavor.1432.a: "让身子得着祷告不肯给的东西。"
 latria_sexual_frustration_flavor.1432.b: "合掌，守这长夜到天明。"
 latria_sexual_frustration_flavor.1432.c: "翻开经卷，读到字句把我凉透。"

 latria_sexual_frustration_flavor.1433.t: "蕨草为榻"
 latria_sexual_frustration_flavor.1433.desc: "黄昏时狩猎的人马散了，我独在这绿暗里，马儿在近旁啃着草。我顺着长满青苔的树干滑坐下去，骑装被汗浸得发潮。缠着我的那段记忆，是猎人把我托过溪涧时揽住我的腰，那人的胸膛贴着我的背，气息拂在我颈上。我的手已探进腰带里。\n\n我一按，树皮硌着肩。我想起那截手臂，想起那人并没有即刻松手。呼吸在冷空气里凝成白雾。渴念随着每一次缓慢的动作越收越紧，林子把它那一片寂静合拢在我四周，叶子在看不见的某处滴着水。\n\n一根枝条脆响。我的手僵住。马抬起头，我贴着树不动，脉搏在耳中擂得震响。"
 latria_sexual_frustration_flavor.1433.a: "就在这树身上把那股急劲卸掉。"
 latria_sexual_frustration_flavor.1433.b: "抽回手，缓着气等它过去。"
 latria_sexual_frustration_flavor.1433.c: "起身牵马，穿过林子走回去。"

 latria_sexual_frustration_flavor.1434.t: "未寄的短笺"
 latria_sexual_frustration_flavor.1434.desc: "书房的火将熄，那封我不会送出的信写了一半，压在手底下。我重读自己落下的最后一行，太坦白的一行，另一只手已悄悄摸到马裤的系带上。我想起那位使节，其也在这张书桌上俯过身，靠得太近，读的是我的脸而不是地图，还笑了。\n\n我把系带解开。呼吸短了。我唤回那人偏头的角度，那里面藏着我当年太谨慎、没有去接的邀约，我的手自作主张地动起来，另一只手里的笔早已干了。火在噼啪作响。那股渴念聚拢起来，怎么也没法被劝成一件可以归档收起的小事。\n\n烛焰被穿堂风带得歪了歪。我合上眼，任这念头把使节撩起的事做尽。"
 latria_sexual_frustration_flavor.1434.a: "写下真话，疏解它点起的酸胀。"
 latria_sexual_frustration_flavor.1434.b: "系好带子，淡淡一句抽身。"
 latria_sexual_frustration_flavor.1434.c: "拿起地图，把这事冷冷掂量。"

 latria_sexual_frustration_flavor.1435.t: "最后一杯之后"
 latria_sexual_frustration_flavor.1435.desc: "宴席散得只剩几支将尽的烛，坐在我对面的客人却还没走。桌下，我的膝盖不知何时抵上了那人的，谁都没有挪开。酒在我身上低低地嗡鸣。我想起那人听我笑话时笑的样子，俯身过来，近到我只需把嘴转过那一小段距离，便能碰到那人的。\n\n我空着的那只手扣住长凳。我想合拢那段距离，比我多年来想过的什么都更想，那股渴念绷紧，从喉头一直拉到小腹。那人从杯沿上方看着我。最后一个仆人也退下了。厅里满是燃尽的油脂味，还有我们两人的呼吸。\n\n那人的膝盖回抵了一下。我的手离开长凳，寻到衣袖的边缘，谁都没有出声。"
 latria_sexual_frustration_flavor.1435.a: "让乐声盖住我接下来要做的事。"
 latria_sexual_frustration_flavor.1435.b: "低头，把这份渴念收成一个祷告。"
 latria_sexual_frustration_flavor.1435.c: "提议对弈一局，让棋盘把血凉下来。"

 latria_sexual_frustration_flavor.1436.t: "蒙古之夜"
 latria_sexual_frustration_flavor.1436.desc: "毡帐里让牛粪火烘得暖，风在上头的毡面上磨来磨去。我从大猎里回来，血还热着，此刻我褪尽了衣裳躺在毛皮底下，身子几乎管束不住。我想起整日与我并骑的那人，那条在背后甩动的辫子，其斩获猎物时笑的样子。\n\n火光把帐壁染红。我的手不知何时已探到小腹上，我没有把它叫回来。烟是甜的，毛皮沉沉压着，那股渴念带着火苗也点不着的热。我唤回那人在鞍上的肩背，那一闪的牙。\n\n风歇了一息。我的手动起来，我任这夜接过白昼点起的东西。"
 latria_sexual_frustration_flavor.1436.a: "在这毛皮底下，给这场狩猎续上第二个结局。"
 latria_sexual_frustration_flavor.1436.b: "把毛皮裹紧，单凭意志压住身子。"
 latria_sexual_frustration_flavor.1436.c: "走进外面的寒里，走到血凉下来。"

 latria_sexual_frustration_flavor.1437.t: "月下屋顶"
 latria_sexual_frustration_flavor.1437.desc: "屋顶在我背下是暖的，茉莉从矮墙那头漫过来，香气沉沉。底下，一名侍妾的歌顺着暗里一线线缠上来，夜这样暖，我的寝衣与其说是遮体，不如说是装点。我把自己的渴念谱成一首卡西达，配着那人的唇形。\n\n我的手搭在胯上，我守了整晚的那点克制已磨成一根细线。月色极亮。歌一遍遍转着。我唤回那人隔着酒看我的样子，那邀约我还不曾去接，我的呼吸慢不下来。\n\n最后一个音散尽。我的手解开寝衣的结，这夜暖得足以容它。"
 latria_sexual_frustration_flavor.1437.a: "以双手应答这首卡西达，让屋顶替我藏住。"
 latria_sexual_frustration_flavor.1437.b: "重新系好寝衣，守住我一直守着的那道边。"
 latria_sexual_frustration_flavor.1437.c: "取来一册诗集，让别人的字句凉一凉我的。"

 latria_sexual_frustration_flavor.1438.t: "结合之礼"
 latria_sexual_frustration_flavor.1438.desc: "我这信仰最神圣的仪轨命人以肉身结合，我来到祭坛前奉行它。烛火高照。石头的寒气透过单薄的寝衣渗上来，仪轨的经文一针一线把我拆开，直到那点渴念不再是过错，而是供在祭坛布上的一份圣事。\n\n我跪下，双手并不稳。仪轨称这份渴念为圣，我的身子应着这一声命名，热得祷告也压不下去。我唤回一会儿要与我这手相握的那双手，那让这副肉身成殿的誓。\n\n仪轨的钟就要鸣响。我起身去迎它，而我已经被拆散了。"
 latria_sexual_frustration_flavor.1438.a: "奉行此礼，让这份结合成一场圣事。"
 latria_sexual_frustration_flavor.1438.b: "独自守夜，把渴念系在祭坛上。"
 latria_sexual_frustration_flavor.1438.c: "缓缓诵读仪轨，让其中的意思使我完整。"

 latria_sexual_frustration_flavor.1439.t: "安达卢斯花园"
 latria_sexual_frustration_flavor.1439.desc: "花园里的午夜，喷泉还留着那点细响。我一直在读《斑鸠情诗》，那些咏爱的句子把我掏得空落落地渴着。墙那头是我不能碰的邻人，今夜这墙却薄得像件蠢物。\n\n橘树还存着白昼最后一点暖。我的手搭上了喉头，那股渴念已近边上，只差一口气就要漫出去。我唤回灯下邻人的脸，我们在水这头玩过的、一眼与拒绝你来我往的把戏。\n\n喷泉顿了一顿，又续上。我的手抖着，没有落下，这夜跟着我一同屏住了气。"
 latria_sexual_frustration_flavor.1439.a: "任这渴念漫出去，接住邻人的把戏。"
 latria_sexual_frustration_flavor.1439.b: "一句客套抽身，让那堵墙不必破。"
 latria_sexual_frustration_flavor.1439.c: "与一位友人坐在喷泉边，让闲谈凉一凉诗句。"

 latria_sexual_frustration_flavor.1440.t: "圣徒的斋戒"
 latria_sexual_frustration_flavor.1440.desc: "我守圣徒的斋戒，身子成了我在其中踱步的牢。我所起的誓磨得像旧布一样薄，在庙里冰凉的石地上，我能摸到那破戒的边。我的脉搏跑得比祷告还快。\n\n寝衣单薄，石头把我膝上的热一点点吸走。我把双手按平在石板上，血里那阵奔涌却凉不下来。我唤回我硬给自己断了的那点触碰，那暖我发誓要斋掉的，呼吸浅浅。\n\n我头边的烛烧得笔直。我守住这道边，斋戒与脉搏在暗里继续厮杀。"
 latria_sexual_frustration_flavor.1440.a: "打破沉默，坦了这誓磨得有多薄。"
 latria_sexual_frustration_flavor.1440.b: "贴着冷石，把斋戒守过这一夜。"
 latria_sexual_frustration_flavor.1440.c: "翻开经文，让一个更清明的声音引我回去。"
