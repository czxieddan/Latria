 latria_wedding_night.t: "新婚之夜"
 latria_wedding_night.desc: "送新人入房的宾客终于散了。笑声还留在走廊里，门却已经掩上，把白日里那些客套、祝词和没完没了的酒都隔在外面。\n\n灯火把帐子照得很暖。床是新铺的，衣是新换的，连彼此看对方的样子都还有些生。[latria_actor.GetShortUIName]与[latria_partner.GetShortUIName]面对面坐了一会儿，谁也没有急着先开口，只听着门外的人渐渐走远。\n\n这一夜之后，他们便不再只是宾客口中的新人。"

 latria_serene_mind: "心旷神怡"
 latria_serene_mind_desc: "一场身心皆畅的相会令人神清气爽，疲意尽消。"
