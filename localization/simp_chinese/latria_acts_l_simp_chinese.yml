 latria_act.0101.t: "门后"
 latria_act.0101.desc: "房门合拢，走廊里的脚步声渐渐远去。我与[latria_partner.GetShortUIName]留在帐中，直到窗外泛白。\n\n侍从敲门时，我才想起今日还有许多事要办。"
 latria_act.0101.desc.adultery: "我等走廊静下来，才让[latria_partner.GetShortUIName]进门。\n\n分别前，我们又约定了一遍：今夜的事，不该有第三个人知道。"
 latria_act.0101.desc.dead: "我唤了[latria_partner.GetShortUIName]几声，却没有得到回答。[latria_partner.GetSheHe|U]已经没了气息。\n\n我猛地拉开门，叫侍从去找医师。"
 latria_act.0101.desc.adultery_dead: "我本以为最糟的不过是被人撞破，直到[latria_partner.GetShortUIName]倒下后再也没有醒来。\n\n门外响起脚步声。我该如何解释这一切？"
 latria_act.0101.desc.actor_dissatisfied: "夜色未褪，我已经起身。[latria_partner.GetShortUIName]似乎还想说什么，我却只想结束这场令人失望的相会。"
 latria_act.0101.desc.partner_dissatisfied: "比起来时，[latria_partner.GetShortUIName]离开得要匆忙得多。[latria_partner.GetSheHe|U]避开了我的目光，连一句道别也没有留下。"
 latria_act.0101.desc.manual: "我与[latria_partner.GetShortUIName]在僻静处坐了许久，亲吻与爱抚已足以让我们忘记时辰。"
 latria_act.0101.a: "离开"
 latria_act.0102.desc: "我没有再催[latria_actor.GetShortUIName]离开。房门一关，今夜便只留给我们。\n\n等到窗外泛白，侍从已经在门外候了许久。"
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName]离开前，我先听了听门外的动静。\n\n走廊里空无一人。至少今夜，这桩秘密仍只属于我们。"
 latria_act.0102.desc.partner_dissatisfied: "我原本盼着与[latria_actor.GetShortUIName]独处，如今却只想早些回去。这一夜，实在不值得如此期待。"
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName]起身时显得颇不耐烦。我试着开口，[latria_actor.GetSheHe]却只敷衍了几句，便朝门口走去。"
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName]在我身旁坐下，我们暂且抛开了各自的事务，只以亲吻与爱抚相伴。\n\n分别时，天还未亮。"

