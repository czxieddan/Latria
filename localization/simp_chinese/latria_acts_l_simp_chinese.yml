 death_latria_intercourse_strain: "死于交合"
 death_latria_manual_strain: "死于爱抚"

 latria_act.0101.t: "门后"
 latria_act.0101.desc: "房门合上时，走廊里还有人在低声说笑。那些脚步一步步走远，门缝里的光也跟着窄下去。我这才回头，看见[latria_partner.GetShortUIName]已经坐到床边，外衣还搭在臂上，像是进门以后就没再想起它。\n\n灯被吹矮了。椅背上的衣裳谁也没有去理，被褥却很快暖成一片。夜过得很慢，慢到我能听见灯芯每一次轻响；可等我再留意窗外，天色已经白了，靠外的那半床也凉了。\n\n侍从在门外敲了两下，又停住，仿佛不敢确定里面是否已经可以打扰。我这才想起，今日原还有许多事等着我。"
 latria_act.0101.desc.adultery: "我先在门边听了很久。走廊里的说话声散尽，连添灯的人也提着空盏走了，我才拉开一条缝，让[latria_partner.GetShortUIName]侧身进来。门闩落下的声音很轻，在这夜里却像响了很久。\n\n这一夜我们把声音压得很低。有时门外忽然有脚步，两个人便同时停住，连呼吸都让到一边，直到那声音转到别处去。灯火照着帐子，也照着我们不时望向门缝的眼睛。\n\n分别前，[latria_partner.GetSheHe]在门槛上又回头看了我一眼。不必再嘱咐。今夜的事，不该有第三个人知道。"
 latria_act.0101.desc.dead: "起初我还以为[latria_partner.GetShortUIName]只是睡沉了。我唤了[latria_partner.GetHerHis]的名字，先是贴近耳边，后来又把灯移到脸旁。火焰跳了一下，照见的仍是没有回应的眼睛。\n\n我伸手去探[latria_partner.GetHerHis]的胸口，掌心底下安静得可怕。被褥还留着方才的温度，枕边也还有压出来的痕迹，人却已经没有气息。我把那只渐渐变凉的手握了一会儿，像是还能把它唤回来。\n\n后来我猛地拉开门，叫侍从去找医师。自己的声音在走廊里撞回来，听起来也不像自己的。"
 latria_act.0101.desc.adultery_dead: "我原以为这一夜最糟的下场，不过是有人推门进来，看见不该看见的两个人。\n\n[latria_partner.GetShortUIName]却先倒了下去。我唤[latria_partner.GetHerHim]，摇[latria_partner.GetHerHim]，又把灯端到[latria_partner.GetHerHis]脸旁。眼睛没有睁开，唇边也没有再起一点气息。方才还温热的手，在我掌心里一点点凉下去。\n\n门外忽然响起脚步。我看着凌乱的床、未及穿上的衣，还有再也不会醒来的人。等那扇门打开，我连一句能先说出口的话都没有。"
 latria_act.0101.desc.actor_dissatisfied: "夜色还浓，我已经坐了起来，把滑到臂上的衣袖重新拉好。\n\n[latria_partner.GetShortUIName]在被中侧过身，像是还有话要说，手指也轻轻碰了碰我的手腕。我却只觉得这一夜又长又空，连伸手去碰[latria_partner.GetHerHim]的兴致也没有了。灯花爆了一下，房间里仍旧没什么暖意。\n\n我拿起椅上的外衣，没有回头。有些相会，拖得越久，越叫人想早些走到门外。"
 latria_act.0101.desc.partner_dissatisfied: "来的时候，[latria_partner.GetShortUIName]还在门口停了停，先看了看灯，又看了看我，像是舍不得立刻把这一夜开始。\n\n走的时候却快得多。衣带还没系好，[latria_partner.GetSheHe]已经下了床，目光避开我，手也避开我。我叫了[latria_partner.GetHerHis]一声，[latria_partner.GetSheHe]只应了一下，连一句道别也没有留下。门掩上时，带起的风把灯吹得斜了一斜。\n\n房间里还留着[latria_partner.GetHerHis]的气息。床沿却已经凉了，人像从未在这里坐过。"
 latria_act.0101.desc.manual: "我们没有走到床上去。\n\n[latria_partner.GetShortUIName]在我身旁坐下，起初还说着白日里没办完的事，说到一半便停了。亲吻来得很轻，爱抚也停在衣袖和发间，没有再往更深处去。窗外的更鼓响过一回，谁也没有去数。\n\n后来灯油尽了。我们在暗里又坐了片刻，听着彼此渐渐平稳的呼吸，才各自整理衣袖。这一夜到这里，已经够了。"
 latria_act.0101.a: "推开门，回到白日里去。"
 latria_act.0102.desc: "我本可以提醒[latria_actor.GetShortUIName]，夜已经深了，明日还有人在等。话到嘴边，又被我咽了回去。\n\n房门一关，外间的脚步和说话声都远了。灯火把帐子照得很暖，谁也没有急着起身。我听着[latria_actor.GetHerHis]的呼吸由乱到稳，自己也渐渐忘了时辰。等我再看窗外，天色已经白了，门外的侍从大约也候了许久。\n\n我这才松开[latria_actor.GetHerHis]的手。有些夜晚，原不该催它结束。"
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName]要离开时，我先走到门边，把耳朵贴在木板上听了听。\n\n走廊里空了一阵，又有人提着灯走过。那点光从门缝里慢慢移过来，又慢慢移开。我们谁也不说话，连衣料都不肯让它响一下。等到四周重新静下来，[latria_actor.GetSheHe]才整了整衣襟。\n\n我替[latria_actor.GetHerHim]拉开一条仅容侧身的门缝。至少这一夜，秘密还只属于我们两个。"
 latria_act.0102.desc.partner_dissatisfied: "门关上以前，我还在想这一夜会是什么样子，甚至把灯也提前拨得更暖了些。\n\n真的只剩下我们两个时，期待却一点点凉了下去。[latria_actor.GetShortUIName]的手、呼吸和那些本该叫人留恋的亲近，都像隔着一层什么。我应着，目光却总往门口飘，心里只想着门外那条还能离开的路。\n\n最后我先坐了起来，把衣袖拉整齐。这一夜实在不值得我把它盼到现在。"
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName]起身时，连灯也不肯让我重新点亮。房间里只剩窗边一点发白的光。\n\n我还躺着，想说一句什么，至少不让这一夜就这样断掉。[latria_actor.GetSheHe]只侧过脸，敷衍了两句，手指已经在系衣带，连我递过去的外衣也没有接。我的话还没说完，[latria_actor.GetSheHe]已经朝门口走去。\n\n门开的时候带进一阵凉气。我这才明白，有些失望是用不着解释的。"
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName]没有拉我走向床榻，只在我身旁坐下，把中间那只碍事的靠枕挪开。\n\n白日里那些还没办完的事，忽然都不急了。我们交换亲吻，也交换一些不必说完的话。手在衣袖和发间停留，却没有再往更深处去。窗外的天色仍黑着，更鼓也还远。\n\n分别时，[latria_actor.GetSheHe]替我拢了拢被我自己弄乱的衣襟。这一夜短，却并不叫人觉得亏欠。"

 latria_scheme.0010.t: "交合"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "[spouse|E]"
 latria_scheme.0010.t.concubine: "[concubine|E]"
 latria_scheme.0010.t.soulmate: "[soulmate|E]"
 latria_scheme.0010.t.lover: "[lover|E]"
 latria_scheme.0010.t.adultery: "私通"
 latria_scheme.0010.desc: "灯还没熄，[target.GetShortUIName]已经不再应我。\n\n我先是唤[target.GetHerHis]的名字，又把耳朵贴到[target.GetHerHis]唇边。什么也没有。指尖碰到的皮肤凉得不像方才，被褥却还留着我们两个人的温度。[target.GetHerHis]的手从我掌心滑下去，再没有收回来。\n\n我本该在天亮前把酒杯、外衣和这一夜的痕迹都收拾干净。如今枕边只剩一个再也不会动的人。窗外的天色正在发白，我却不知道该先遮住哪一样。"
 latria_scheme.0010.a: "替[target.GetHerHim]拉好被角，再去开门。"
 latria_scheme.0020.t: "空等的一夜"
 latria_scheme.0020.desc: "灯油下去了一截，门外仍没有[target.GetFirstName]的脚步。\n\n我把酒温过两回，又把椅上的外衣重新叠好。走廊里偶有人经过，鞋声近了，我便屏住呼吸；鞋声远了，房间又只剩我一个。每一次我都以为是[target.GetSheHe]。\n\n后来烛火自己跳了一下，蜡泪落到托盘里。我这才承认，这一夜已经过完了。准备好的酒、话和借口，都用不上了。"
 latria_scheme.0020.a: "吹灭灯。不必再等。"
 latria_scheme.0030.t: "迟来的消息"
 latria_scheme.0030.desc: "我还在盘算哪一扇侧门更僻静，哪一句邀约更不容易惹人起疑，消息却先到了桌上。\n\n[target.GetFirstName]已经不在人世。纸上的字很少，我却把它们看了很久。那些尚未送出的信、记熟的走廊、为这一夜备下的借口，忽然都成了多余的东西。\n\n我把还温着的酒倒掉。有些安排可以等一个更好的夜晚，却等不上一场已经发生的死。"
 latria_scheme.0030.a: "把未寄出的信烧掉。"
 latria_scheme.0040.t: "断掉的线"
 latria_scheme.0040.desc: "我差人去寻[target.GetFirstName]，从午后一直等到灯上。回来的却只有一句含糊的回话：见不到了。\n\n也许是忽然加严的门禁，也许是一双比往日更警觉的眼睛，也许只是[target.GetSheHe]再也不肯走近我为[target.GetHerHim]留着的那盏灯。我问了两次，那人仍说不出更多。\n\n原因已经不重要。这条线从我指间断了。我把记着时辰的纸条揉进掌心，连纸上的字也被汗浸糊了。"
 latria_scheme.0040.a: "这件事，到此为止。"

