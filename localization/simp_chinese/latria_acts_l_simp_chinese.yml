 latria_solo_relief_interaction: "独自爱抚"
 latria_solo_relief_interaction_desc: "独自的肉体欢愉。"
 latria_solo_relief_send: "开始"
 latria_solo_relief_night_tt: "希望独自度过这一夜。"
 latria_act.0201.t: "内室"
 latria_act.0201.desc: "我等外间的人散尽，连最后一盏路过的灯也远了，才自己把门闩落下。谈话声消失以后，房间里只剩下灯芯偶尔爆一下。\n\n外衣搭在椅背上。我把灯吹矮，只留床边那一盏，然后在没有第二个人的被褥里躺了很久。夜并不短。有些欲念来得清楚，去得却慢，像潮水反复漫过同一块石头，退下去，又悄悄回来。\n\n等呼吸终于缓下来，窗外已经泛白。我躺着听自己的心跳，又听了一会儿空房间，才想起该把被褥拉平，把这一夜收拾成什么也不曾发生的样子。"
 latria_act.0201.a: "整理衣衫，推开门。"

 latria_act.0301.t: "身体的界限"
 latria_act.0301.desc.illness: "夜还没有完全过去，不适却先来了。\n\n我原想撑着坐起来，额上的热意却一阵阵往上涌。四肢像被谁换成了别人的，使了两次力，仍旧不听使唤。被褥又沉又热，连呼吸都带着一股发干的甜味。我想叫门外的人，声音却只到唇边。\n\n窗外的光慢慢亮起来。我看着它越过窗棂，只希望这一阵发热尽快过去，又隐隐觉得它不会那么听话。"
 latria_act.0301.desc.stress: "人已经停下来了，手也从被褥里抽了出来，心却还停不住。\n\n我睁着眼，把这一夜来回想了好几遍。哪一处气息太乱，哪一句话不该说，哪一次又把自己逼过了头，全都清清楚楚。床帐外面很静，静得反而让那些念头更响，连远处的更鼓也像在替它们计数。\n\n我翻了个身，又翻回来。天快亮时，枕头已经换过好几次方向，我仍旧没有睡着。"
 latria_act.0301.desc.health: "我想下床去倒一杯水，脚刚沾到地面，眼前就暗了一暗。\n\n我只好扶住床沿，把额头抵在自己的手背上。心跳又急又空，像刚跑过很长一段路，其实我只是从枕上坐了起来。杯子就在几步外，屋里的东西也都还在原处，我的身子却好像已经用到了底。\n\n过了好一会儿，眼前的黑才慢慢退开。我没有再去拿那杯水，只重新躺了回去。"
 latria_act.0301.a: "先歇下，什么也不去想。"
 latria_act.0311.t: "长久亏空"
 latria_act.0311.desc.illness: "这不是某一夜突然压过来的。\n\n那些过了头的夜晚本来一幅幅散着，我总觉得睡一觉、用一顿热食便能还上。直到今天早晨，热意从胸口漫到指尖，我才明白它们早就连成了一片。水喝下去也干，被子盖上去也冷，连窗外的风都像从骨头里穿过去。\n\n我躺着听外面的人来来去去，连叫人的力气都得省着用。病意不是闯进来的，是在我身体里慢慢住下来的。"
 latria_act.0311.desc.stress: "疲惫并不在身上，它趴在睡意上，不让我进去。\n\n我闭上眼，白日的面孔、夜间的喘息和许多来不及后悔的片刻便一起挤过来。身体已经乏得抬不起手，心里却仍旧亮着，亮得让人厌烦。我数过自己的呼吸，也数过窗外的更次，没有一样能把那些画面压暗。\n\n鸡叫过了，天也亮了。我只是从枕头的这一侧换到那一侧，仍旧醒着。"
 latria_act.0311.desc.infertile: "起初只是一次没有消息。我没把它放在心上，后来那样的日子却成了许多次。\n\n我把那些本该到来的日子在心里数过，又不愿把它们说出来，怕一说便成了真的。今天医师终于把这件我一直绕开的事放到了面前：我的身体已经不能再孕育子嗣。他的声音不高，房间里却没有别的声音能盖住它。\n\n人走了以后，我把手放在小腹上。过了很久，才让那句话真正落下来。"
 latria_act.0311.desc.health: "从前我还能把这种虚脱当作睡得太晚，用一杯热酒和半日清静就混过去。\n\n如今连坐起来都要在床沿停一停。衣带比往日沉，杯子也比往日沉，从窗子走到门口，像走了一段不短的路。我在镜里看见自己的脸色，才相信这不是一两夜就能补回来的亏空。镜中的人看着我，像比我更早知道这件事。\n\n我重新躺下。这一回，是身子先替我做了决定。"
 latria_act.0311.a: "放下手头的事，卧床休养。"
 latria_act_exhausted_health: "精疲力竭"
 latria_act_exhausted_health_desc: "身体尚未恢复。"
 latria_act_depleted_health: "积劳亏虚"
 latria_act_depleted_health_desc: "长久的消耗伤了身体。"

