l_simp_chinese:
 latria_sexual_frustration_flavor.1401.t: "封存的印信"
 latria_sexual_frustration_flavor.1401.desc.female: "我披着寝衣，在床边把一封信反复折叠。信上没有名字，只有一枚迟迟没有盖下的印记。"
 latria_sexual_frustration_flavor.1401.desc.male: "我披着寝衣坐在床沿，手里握着一枚印信。若真要写下那句话，我便再也不能假装自己没有想过。"
 latria_sexual_frustration_flavor.1401.desc: "我将印信拿起又放下，始终没有落在纸上。"
 latria_sexual_frustration_flavor.1401.a: "在信上盖下印记"
 latria_sexual_frustration_flavor.1401.b: "把印信放回匣中"

 latria_sexual_frustration_flavor.1402.t: "最后的盛宴"
 latria_sexual_frustration_flavor.1402.desc.accepted: "宴席散去前，众人仍在谈论情人、婚约与旧日欢愉，没有人刻意压低声音。我却发现自己再也无法把这当作寻常闲谈。"
 latria_sexual_frustration_flavor.1402.desc.strict: "宴席上有人提起一位因私情而失势的贵族，席间随即安静下来。我知道那样的议论也会落到我身上。"
 latria_sexual_frustration_flavor.1402.desc: "杯盘狼藉，宾客将散，心底的念头却越发响亮。"
 latria_sexual_frustration_flavor.1402.a: "留到最后一支舞"
 latria_sexual_frustration_flavor.1402.b: "现在就离开"

 latria_sexual_frustration_flavor.1403.t: "无证人的忏悔"
 latria_sexual_frustration_flavor.1403.desc.favors: "圣坛前空无一人。我想起信仰容许肉体欢愉的教诲，却仍不知该如何安顿这份迫切。"
 latria_sexual_frustration_flavor.1403.desc.condemns: "我独自跪在圣坛前，法衣的衣襟整齐，祷词却一次次断在同一个地方。若无人听见，我是否还算违背了誓言？"
 latria_sexual_frustration_flavor.1403.desc: "圣所已经空了，我仍没有离开。"
 latria_sexual_frustration_flavor.1403.a: "离开圣坛，回到寝室"
 latria_sexual_frustration_flavor.1403.b: "跪到晨祷开始"

 latria_sexual_frustration_flavor.1404.t: "说出欲念"
 latria_sexual_frustration_flavor.1404.desc.lustful: "我未着衣物，独自站在寝室的铜镜前。镜中人没有躲开我的目光；我厌倦了把欲念说成一时的软弱。"
 latria_sexual_frustration_flavor.1404.desc.chaste: "我未着衣物，独自坐在床沿，双手紧扣。若我仍能守住誓言，那也不是因为这份渴望已经消失。"
 latria_sexual_frustration_flavor.1404.desc: "夜已深，我终于不再对自己隐瞒心中的欲念。"
 latria_sexual_frustration_flavor.1404.a: "承认它已经属于我"
 latria_sexual_frustration_flavor.1404.b: "重新穿好衣物"

 latria_sexual_frustration_flavor.1405.t: "编年史的一页"
 latria_sexual_frustration_flavor.1405.desc.emperor: "编年官伏在桌边，等我决定哪些事值得留下。我穿着礼服站在他身后，终于明白沉默并不能让这段煎熬消失。"
 latria_sexual_frustration_flavor.1405.desc.adventurer: "篝火旁的抄写员问我，是否要把这段旅途也写进编年。我看着没有寄出的信，知道答案会跟着我走下去。"
 latria_sexual_frustration_flavor.1405.desc.clergy: "我把法衣穿戴整齐，走到修院书记面前。誓词与欲念都是真的，我不愿再让旁人替我决定哪一个该被记下。"
 latria_sexual_frustration_flavor.1405.desc.ruler: "书记官等着记录我的口述。我身穿礼服，在侍从面前说出那件始终压在心底的事。"
 latria_sexual_frustration_flavor.1405.desc: "我决定不再把这件事藏在心里。"
 latria_sexual_frustration_flavor.1405.a: "让编年官如实记下"
 latria_sexual_frustration_flavor.1405.b: "立下贞洁誓言"

 latria_sexual_frustration_flavor.1406.t: "宾客散尽"
 latria_sexual_frustration_flavor.1406.desc.accepted: "末席的宾客仍在谈论情人与婚约，仿佛这些事再平常不过。我听着他们的笑声，发现自己再难把心思藏好。"
 latria_sexual_frustration_flavor.1406.desc.strict: "一位贵族因私情失势的消息传到席间，众人不约而同地安静下来。我知道这场沉默并非只为他而起。"
 latria_sexual_frustration_flavor.1406.desc: "宾客将散，杯盏未收，心头的念头却越来越难压下。"
 latria_sexual_frustration_flavor.1406.a: "留在厅中直到最后"
 latria_sexual_frustration_flavor.1406.b: "趁众人未散先行离席"

 latria_sexual_frustration_flavor.1407.t: "熄灯后的祷词"
 latria_sexual_frustration_flavor.1407.desc.favors: "我披着寝衣坐在床边，想起信仰并不否认肉体欢愉。可到了独处时分，我仍不知道如何安顿自己。"
 latria_sexual_frustration_flavor.1407.desc.condemns: "我把寝衣的衣襟拢好，低声重念贞洁誓词。烛火将尽，心中那份渴望仍未退去。"
 latria_sexual_frustration_flavor.1407.desc: "房中只剩一盏将熄的灯，我仍没有合眼。"
 latria_sexual_frustration_flavor.1407.a: "继续诵念祷词"
 latria_sexual_frustration_flavor.1407.b: "吹灭灯火躺下"

 latria_sexual_frustration_flavor.1408.t: "镜前无言"
 latria_sexual_frustration_flavor.1408.desc.lustful: "我未着衣物，独自在镜前站立。那份渴望已无法被称作一时的念头，我也不愿再假装如此。"
 latria_sexual_frustration_flavor.1408.desc.chaste: "我未着衣物，坐在床沿握紧双手。贞洁仍是我的选择，只是这份选择从未如此艰难。"
 latria_sexual_frustration_flavor.1408.desc: "我在寂静中看着镜中的自己，终于不再逃避心事。"
 latria_sexual_frustration_flavor.1408.a: "承认这份欲念"
 latria_sexual_frustration_flavor.1408.b: "披衣坐到书案前"

 latria_sexual_frustration_flavor.1409.t: "朝会失仪"
 latria_sexual_frustration_flavor.1409.desc: "朝会间隙，门扉未合，我也未及整理衣冠。众臣骤然沉默，书记官垂下目光；我听见自己的声音发紧，明白此刻每一双眼睛都代表着朝廷。"
 latria_sexual_frustration_flavor.1409.a: "站在众人面前，不再掩饰失态"
 latria_sexual_frustration_flavor.1409.b: "命众人退下，重新整肃衣冠"

 latria_sexual_frustration_flavor.1410.t: "门后的夜色"
 latria_sexual_frustration_flavor.1410.desc.female: "我披着寝衣坐在门边，听见外头的脚步声渐渐远去。夜深以后，那份无人回应的心意又回到心头。"
 latria_sexual_frustration_flavor.1410.desc.male: "我披着寝衣倚在床头，手边的书一页也没有翻过。门外安静下来，我却仍无法入睡。"
 latria_sexual_frustration_flavor.1410.desc: "长夜未尽，门外没有动静，心绪也没有平复。"
 latria_sexual_frustration_flavor.1410.a: "把灯留到天明"
 latria_sexual_frustration_flavor.1410.b: "合上书躺下"
