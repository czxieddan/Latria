 latria_act.0401.t: "辗转之夜"
 latria_act.0401.desc: "夜深人静，屋里只剩我醒着。那股欲念不等我唤，自己回来了，热热地抵在背上。数完这口气，它还在原处。烛火矮下去，床帐里的热气却升上来。\n\n我数着气息，数到乱了，又从头再来。白日里搁下的事一件件浮起来，压在最底下的，还是那点没有纾解的渴望。\n\n屋里越静，它越清楚。我知道这一夜又要醒着，把床板听到底。"
 latria_act.0401.a: "翻身再睡"
 latria_act.0402.t: "不得安宁"
 latria_act.0402.desc: "晨祷念到一半，那点欲念又从字缝里钻出来。我停下，把气息重新数起。数到平稳，它还在。\n\n诵经的声音在堂里回荡，我的嘴唇跟着动，字句却记不牢。跪在两边的人低着头，谁也没留意我。那点渴望压在胸口，越来越沉。\n\n香烧到尽头，我合上书，知道夜里它还会回来。"
 latria_act.0402.a: "收住心神"
 latria_act.0403.t: "压下的欲念"
 latria_act.0403.desc: "克制早已不再像耐心。它顶在胸口，把每一个平静的念头往边上挤。\n\n手里的活计一件件做完，心思却总绕回原处。烛火一晃，热气又涌上来。我放下活计，等它退下去，它却留得更久。\n\n这样的夜晚，我快撑不住了。"
 latria_act.0403.a: "忍耐"
 latria_act.0404.t: "濒临崩溃"
 latria_act.0404.desc: "睡不着，祷词压不住，白日的劳作也排不开它。夜里它最吵，白天它候在每一个停顿后头。\n\n傍晚我盼有人来叩门，哪怕只是问一句安。门开了，进来的总是送水的侍从，放下碗便退出去。\n\n门合上以后，屋里比先前更静。"
 latria_act.0404.a: "撑住"
 latria_act.0405.t: "难以承受"
 latria_act.0405.desc: "我不想再守下去了。白日里心口一直烫着，平日顺手的琐事也支使不动我的手。\n\n夜里横竖睡不成，我睁着眼，听蜡烛一寸一寸烧短。热气压在胸口，散不出去。\n\n这场煎熬看不到尽头。"
 latria_act.0405.a: "深吸一口气"
 latria_sexual_frustration_collapse_warning_tt: "我快要坚持不住了……"
 latria_act.0405.b: "承受下去"
