l_simp_chinese:
 latria_sexual_frustration_1: "欲念浮动"
 latria_sexual_frustration_1_desc: "未得纾解的性欲开始扰乱此人。"
 latria_sexual_frustration_2: "欲念难平"
 latria_sexual_frustration_2_desc: "性欲一再涌起，使人难以自持。"
 latria_sexual_frustration_3: "性压抑"
 latria_sexual_frustration_3_desc: "长久压下的性欲正拖累身心。"
 latria_sexual_frustration_4: "欲念煎熬"
 latria_sexual_frustration_4_desc: "克制带来的重负侵入了每个清醒时刻。"
 latria_sexual_frustration_5: "欲念难堪"
 latria_sexual_frustration_5_desc: "性欲已经成了难以承受的重负。"

 latria_act.0401.t: "辗转之夜"
 latria_act.0401.desc: "夜深人静时，被我搁下的欲念又回来了。"
 latria_act.0401.a: "翻身再睡"
 latria_act.0402.t: "不得安宁"
 latria_act.0402.desc: "稍一走神，那份未得纾解的渴望便重新占满心头。"
 latria_act.0402.a: "收住心神"
 latria_act.0403.t: "压下的欲念"
 latria_act.0403.desc: "克制早已不再像耐心，它挤压着每一个平静的念头。"
 latria_act.0403.a: "忍耐"
 latria_act.0404.t: "濒临崩溃"
 latria_act.0404.desc: "睡眠、祈祷和劳作都不能让我安宁，这份煎熬无处不在。"
 latria_act.0404.a: "撑住"
 latria_act.0405.t: "再无余地"
 latria_act.0405.desc: "这份重负吞没了其他念头，我看不到尽头。"
 latria_act.0405.a: "结束这一切"
 latria_act.0405.b: "承受下去"
