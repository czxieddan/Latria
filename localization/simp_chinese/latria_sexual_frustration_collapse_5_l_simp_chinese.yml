l_simp_chinese:
 latria_collapse_no_relief_tt: "性压抑没有缓解。"

 latria_sexual_frustration_flavor.1501.t: "灯还亮着"
 latria_sexual_frustration_flavor.1501.desc.dead: "我已经听不清门外的脚步。短刃从手中落下，有人推门进来，一遍遍地喊我的名字。我想回答，眼前却越来越暗，最后连灯火也看不见了。"
 latria_sexual_frustration_flavor.1501.desc.survived: "短刃没能结束我的性命。门外的人听见动静，闯进来救下了我。我穿着寝衣躺在床上，伤处已经包扎，熟悉的欲念仍纠缠着我。"
 latria_sexual_frustration_flavor.1501.desc.severe: "我从昏迷中醒来，短刃已经被拿走。有人守在床边，压低声音谈论我严重的伤势。我连坐起都办不到，那份煎熬却丝毫没有消退。"
 latria_sexual_frustration_flavor.1501.a.dead: "眼前……越来越暗……"
 latria_sexual_frustration_flavor.1501.a.survived: "好痛……"
 latria_sexual_frustration_flavor.1501.a.severe: "别碰我……好痛……"

 latria_sexual_frustration_flavor.1502.t: "空下的杯子"
 latria_sexual_frustration_flavor.1502.desc.dead: "杯子已经空了。我伏在床边，听见有人进屋，慌忙叫人来救我。桌上那封信还没有写完，我却再也握不住笔。周围的声音渐渐远去，终于什么也听不见了。"
 latria_sexual_frustration_flavor.1502.desc.survived: "我饮下的毒药没能致命。被人发现并救治后，我仍躺在寝室里，虚弱得无法起身。杯子已经收走，我却依旧无法摆脱那些欲念。"
 latria_sexual_frustration_flavor.1502.desc.severe: "毒药没有杀死我，却使我的身体衰弱下来。我躺在床上，看着旁人替我端水、整理衣物。这场自尽留下的病弱，没能给心中带来片刻安宁。"
 latria_sexual_frustration_flavor.1502.a.dead: "我……说不出话了……"
 latria_sexual_frustration_flavor.1502.a.survived: "难受……给我一点水……"
 latria_sexual_frustration_flavor.1502.a.severe: "连抬手的力气都没了……"

 latria_sexual_frustration_flavor.1503.t: "河岸边"
 latria_sexual_frustration_flavor.1503.desc.dead: "我已经望不见河岸。远处似乎有人在呼喊，声音却越来越模糊。我想起离开住处时未曾熄灭的灯，最后的念头也很快散去了。"
 latria_sexual_frustration_flavor.1503.desc.survived: "我被从河里救了上来。醒来时，有人正用斗篷将我裹住。我蜷在河岸边，浑身发冷，只能等人送我回去，心中的煎熬却依旧清楚。"
 latria_sexual_frustration_flavor.1503.desc.severe: "河水没能夺走我的性命。人们将我抬上岸时，我已经烧得厉害，咳嗽得说不出话来。他们低声说起肺病，而我仍在清醒的间隙想起那份欲念。"
 latria_sexual_frustration_flavor.1503.a.dead: "好冷……"
 latria_sexual_frustration_flavor.1503.a.survived: "我还……活着？"
 latria_sexual_frustration_flavor.1503.a.severe: "咳……喘不过气了……"

 latria_sexual_frustration_flavor.1504.t: "崖下"
 latria_sexual_frustration_flavor.1504.desc.dead: "我躺在崖下，听见搜寻的人沿着山路呼喊。声音越来越近，我却没能作出回应。眼前的山影逐渐模糊，直到再也分辨不出天色。"
 latria_sexual_frustration_flavor.1504.desc.survived: "我在崖下醒来，有人正蹲在身旁呼唤我。坠落使我伤得很重，却没能使我如愿死去。我躺着等候担架，熟悉的欲念又占满了脑海。"
 latria_sexual_frustration_flavor.1504.desc.severe: "从崖边跃下后，我竟活了下来。救援的人围在身边，谁也不肯看我的眼睛。我试着起身，却发现自己已再也无法像从前那样行走。那份煎熬仍在。"
 latria_sexual_frustration_flavor.1504.a.dead: "我听不见了……"
 latria_sexual_frustration_flavor.1504.a.survived: "动不了……好痛……"
 latria_sexual_frustration_flavor.1504.a.severe: "我的腿……"

 latria_sexual_frustration_flavor.1505.t: "被推开的房门"
 latria_sexual_frustration_flavor.1505.desc.dead: "我听见寝室的门被人撞开，随后有人急切地叫着我的名字。我想告诉他们，信就在床边，却怎么也说不出话来。门口的光亮渐渐暗下去，我再没有听见别的声音。"
 latria_sexual_frustration_flavor.1505.desc.survived: "寝室的门被人撞开，我被及时救了下来。如今我躺在床上，伤势让每一次翻身都很艰难。绳索已经不见了，迫使我自尽的煎熬却仍未消散。"
 latria_sexual_frustration_flavor.1505.desc.severe: "我听见有人一遍遍叫我的名字，却不知该怎样回答。换洗、进食都得由旁人照料。我望着寝室里熟悉的摆设，想不起自己下一步该做什么。床边那封信已经被收进了匣中。"
 latria_sexual_frustration_flavor.1505.a.dead: "我……"
 latria_sexual_frustration_flavor.1505.a.survived: "让我……喘口气……"
 latria_sexual_frustration_flavor.1505.a.severe: "有人……在叫我吗？"
