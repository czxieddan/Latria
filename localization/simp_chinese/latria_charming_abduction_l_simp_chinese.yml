 latria_charming_abduction.1001.t: "枕边的邀约"
 latria_charming_abduction.1001.desc: "浴水渐凉，香气还留在寝室里。我把外衣搭在榻边，望向桌上尚未封口的信。只差一句话，就能让[target.GetFirstName]辗转反侧。\n\n我的人已经记熟了侧门和走廊。只要[target.GetSheHe]肯为一夜温存遣开随从，厚重的帷幔便足以遮住许多事情。至于[target.GetSheHe]想象中的床笫之欢……那要等[target.GetSheHe]过得了门槛再说。"
 latria_charming_abduction.1001.a: "告诉[target.GetHerHim]，我会在榻边等候。"
 latria_charming_abduction.1001.b: "请[target.GetHerHim]来外间小酌。酒要温，灯要暗。"
 latria_charming_abduction.1001.c: "封好信，等一个更合适的夜晚。"
 latria_charming_abduction.1001.d: "把信丢进火里。到此为止。"
 latria_charming_abduction_wait_tt: "继续筹备，等待下一次执行机会。"

 latria_charming_abduction.1101.t: "一缕余香"
 latria_charming_abduction.1101.desc: "一小段绸带随着[target.GetFirstName]的回信送来，系得松松的，仿佛只消轻轻一扯便会散开。纸上的话依旧矜持，最后几笔却挤在一起，像是[target.GetSheHe]赶着写完，又舍不得搁笔。\n\n我把绸带绕过指间。下次寄去的信，该让[target.GetHerHim]闻到什么，又让[target.GetHerHim]忍不住去想什么？"
 latria_charming_abduction.1101.a: "在提及夜晚的那一行滴上香露。"
 latria_charming_abduction.1101.b: "只约时辰，不留落款。"
 latria_charming_abduction.1101.c: "把回信压在烛台下，暂且不作答。"

 latria_charming_abduction.1102.t: "门外还有一双眼睛"
 latria_charming_abduction.1102.desc: "关于[target.GetFirstName]就寝习惯的消息，比[target.GetHerHis]的情书更有用。原来每逢入夜，[target.GetSheHe]身边总有一名侍从留下，添酒、收衣，直到最后一盏灯熄灭才肯离开。\n\n一个忠心的人，足以毁掉一场精心安排的私会。我得给那双眼睛找些别的事情做。"
 latria_charming_abduction.1102.a: "让一袋银币替那位侍从安排一晚消遣。"
 latria_charming_abduction.1102.b: "信里添一句：独自前来，才有惊喜。"
 latria_charming_abduction.1102.c: "先收回邀约。那扇门可以再等一晚。"

 latria_charming_abduction.2001.t: "门闩落下之时"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName]踏进寝室时，目光还留在床边的烛火上。我伸出手，任[target.GetHerHim]以为再近一步就能碰到我。\n\n门闩轻响。[target.GetSheHe|U]回过头，帷幔后的影子已经站了起来。我的人扣住[target.GetHerHis]的双臂，连藏在袖中的绳索都没有碰响烛台。\n\n我拿起椅背上的外衣。今晚，这张床不会有人共枕。"
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName]接过我斟好的酒，侧过身，让出通往内室的路。[target.GetSheHe|U]以为我会牵住[target.GetHerHis]的手，领[target.GetHerHim]去一个更私密的地方。\n\n我却将酒杯放回桌上。侧门开了，我的人一拥而入。等[target.GetSheHe]想起呼救，门闩已经落下，绳索也已收紧。\n\n桌上那杯酒，几乎一口未动。"
 latria_charming_abduction.2001.secret: "\n\n走廊里没有惊动任何人。等宫廷察觉[target.GetHerHis]的缺席，这里的烛泪早就冷了。"
 latria_charming_abduction.2001.exposed: "\n\n窗外传来一声惊呼。看来天亮之前，便会有人把这场私会的另一半故事传出去。"
 latria_charming_abduction.2001.a: "把[target.GetHerHis]的外衣带上。我们该走了。"

 latria_charming_abduction.2002.t: "未尽的夜晚"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName]在门口停下。烛光、床榻，还有我刻意留下的那一点沉默，都没能让[target.GetHerHim]再近一步。\n\n「夜已经深了。」[target.GetSheHe]的目光越过我的肩头，落在一动不动的帷幔上。\n\n我伸出的手只碰到夜风。"
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName]没有碰那杯酒。[target.GetSheHe|U]在桌边站了一会儿，像是在掂量我的笑容，随后退回仍然敞开的门边。\n\n「让他们留着灯吧。我的人还在等我。」\n\n藏在侧门后的脚步声，此刻听起来格外清楚。"
 latria_charming_abduction.2002.secret: "\n\n我赶在伏兵现身前垂下了手。明日人们或许会笑我献殷勤碰了壁，却不会知道门后原本等着什么。"
 latria_charming_abduction.2002.exposed: "\n\n一截绳索从门后露了出来。[target.GetFirstNameNoTooltip]猛地变了脸色，一边退向[target.GetHerHis]的护卫，一边高喊我的名字。这下，谁也不会把它当作一场无伤大雅的调情了。"
 latria_charming_abduction.2002.a: "把灯熄了。这场邀约到此为止。"
 latria_charming_abduction.2002.b: "另备一封信，再寻机会。"
 latria_charming_abduction_retry_tt: "重新筹备这项计谋，清除本次执行的场景修正，保留此前的邀约筹备。"

 latria_charming_abduction.2101.t: "温柔的圈套"
 latria_charming_abduction.2101.bedchamber: "我来赴[owner.GetFirstName]的约时，甚至还在想着该如何吻[owner.GetHerHis]的手。寝室里的灯照得很低，恰好让人忘记留意帷幔后面。\n\n直到双臂被猛地扭到身后，我才明白[owner.GetSheHe]为何迟迟不肯靠近。这里没有等着我的温存，只有早已备好的绳索。"
 latria_charming_abduction.2101.antechamber: "我还没有喝下那杯酒，就已经成了[owner.GetFirstName]的俘虏。\n\n[owner.GetSheHe|U]放下酒杯，仿佛那是某种事先约好的暗号。下一刻，侧门里涌出的人便扣住了我的双臂。我一直望着[owner.GetHerHim]，等一句解释；[owner.GetSheHe]却只吩咐他们取来我的外衣。"
 latria_charming_abduction.2101.a: "别过脸去，不再看[owner.GetHerHim]。"

 latria_charming_abduction.2102.t: "烛影之后"
 latria_charming_abduction.2102.secret: "[owner.GetFirstName]的邀约写得缱绻，见面时却总在分神。走廊里有脚步声，门后的衣料也在响；我一提起随行的护卫，[owner.GetHerHis]的笑容便僵住了。\n\n我借故离开，直到重新站在自己的人中间，才发觉手心全是汗。也许只是一场扫兴的私会。也许我最好永远不知道，那扇门后究竟有什么。"
 latria_charming_abduction.2102.exposed: "那截绳索让我一下子清醒过来。\n\n[owner.GetFirstName]的低语、暗下去的烛火、迟迟不肯靠近的身影——原来都是为了把我留在门内。我退向走廊，叫来护卫，看着门后的人又缩回了阴影里。\n\n我差一点就要为那副笑容遣开所有人。"
 latria_charming_abduction.2102.a: "今后，门外总得留一个人。"

