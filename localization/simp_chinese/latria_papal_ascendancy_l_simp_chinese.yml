 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "次级[old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "公开秘密"
 latria_reveal_papal_secret_decision_desc: "我将亲自在教士与诸侯面前说出这个秘密。每位统治者都会从我口中听见真相，否认我职分的人自可举兵而来。"
 latria_reveal_papal_secret_decision_tooltip: "公开你的私通，并面对随之而来的废黜战争。"
