 game_concept_latria_holy_see_government_i: "@latria_holy_see_government!"
 game_concept_latria_holy_see_government_desc: "$latria_holy_see_government$是一种由[head_of_faith|E]统治的[theocratic|E][government_form|E]，教会与世俗的权力统一于[GetTitleByKey('e_latria_holy_see').GetNameNoTier]。\n\n[latria_vicar|E]通过[church_authority|E]统辖[vassals|E]，并使用[treasury|E]管理教会的财富。\n\n[GetTitleByKey('e_latria_holy_see').GetNameNoTier]依照$latria_divine_succession_law$传承，由[latria_vicar|E]宣明神意，择定继承人。"
