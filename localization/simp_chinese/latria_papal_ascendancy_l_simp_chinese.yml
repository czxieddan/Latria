 latria_papal_ascendancy.0010.t: "教宗的求援请求"
 latria_papal_ascendancy.0010.desc: "你的[ally|E][latria_pope.GetShortUIName]因私通丑闻遭到诸侯围攻。[latria_pope.GetSheHe]援引盟约，请你出兵对抗废黜联军。"
 latria_papal_ascendancy.0010.a: "恪守盟约，起兵保卫圣座"
 latria_papal_ascendancy.0010.b: "以此罪名开战，恕难从命"
 latria_honored_papal_alliance_opinion: "保卫圣座"
 latria_refused_papal_alliance_opinion: "背弃圣座盟约"
 latria_ally_share_received_msg_title: "圣座的酬谢"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName]将一份战败方赔款分给了你。"
 latria_ally_joined_defense_msg_title: "盟友响应保卫圣座"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName]恪守盟约，已加入防御方共同对抗废黜联军。"
 latria_ally_refused_defense_msg_title: "盟友拒绝出兵"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName]因私通丑闻拒绝出兵援助圣座。"

 latria_papal_scandal_war.0001.t: "废黜教宗的号召"
 latria_papal_scandal_war.0001.desc: "诸侯已经举兵，要求[latria_scandal_target.GetShortUIName]为公开的私通丑闻让出[head_of_faith|E]之位。联军的使者来到我的宫廷，邀我一同进军。"
 latria_papal_scandal_war.0001.a: "举兵加入废黜联军"
 latria_papal_scandal_war.0001.b: "不卷入这场战争"
