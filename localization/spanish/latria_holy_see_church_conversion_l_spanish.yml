 latria_holy_see_church_conversion.0001.t: "El mandato del vicario"
 latria_holy_see_church_conversion.0001.desc: "[latria_vicar.GetShortUINameNoTooltip] aguarda ante el altar con un mandato sellado. La iglesia está vacía, y la luz de las velas proyecta [latria_vicar.GetHerHis] sombra sobre la piedra. El mandato solo pide una cosa: estas tierras, bajo la Iglesia.\n\n[latria_vicar.GetSheHe] me lo tiende sin decir nada."
