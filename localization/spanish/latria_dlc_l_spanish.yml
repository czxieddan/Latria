l_spanish:
 dlc_latria: "Latria"
 dlc_latria_desc: "La costumbre ya no determina a quién puedes desear. Cuanto más se reprime el anhelo, más arde. Una lámpara solitaria, una carta nunca enviada, y una larga noche en vela. Un placer fugaz a veces calma el corazón y a veces deja una herida que tarda años en cerrar. En Latria, la carne y el espíritu pueden alcanzar la salvación o la destrucción."
