l_spanish:
 latria_collapse_no_relief_tt: "La represión sexual no ha remitido."

 latria_sexual_frustration_flavor.1501.t: "La lámpara aún arde"
 latria_sexual_frustration_flavor.1501.desc.dead: "Ya no distingo los pasos de fuera. La daga se me cae de la mano. Alguien abre la puerta y repite mi nombre una y otra vez. Intento responder, pero todo se oscurece hasta que dejo de ver la lámpara."
 latria_sexual_frustration_flavor.1501.desc.survived: "La daga no acabó con mi vida. Alguien oyó el alboroto e irrumpió para salvarme. Yazgo en la cama en ropa de dormir, con las heridas vendadas y el mismo anhelo insatisfecho aún atormentándome."
 latria_sexual_frustration_flavor.1501.desc.severe: "Cuando recobro el conocimiento, la daga ya no está. Alguien se sienta junto a la cama y habla en voz baja de la gravedad de mis heridas. Ni siquiera puedo incorporarme, pero el tormento que me trajo aquí no ha remitido."
 latria_sexual_frustration_flavor.1501.a.dead: "Todo se… oscurece…"
 latria_sexual_frustration_flavor.1501.a.survived: "Duele…"
 latria_sexual_frustration_flavor.1501.a.severe: "No me toques… duele…"

 latria_sexual_frustration_flavor.1502.t: "Una copa vacía"
 latria_sexual_frustration_flavor.1502.desc.dead: "La copa está vacía. Desde junto a la cama oigo entrar a alguien y pedir ayuda con urgencia. Mi carta sigue sin terminar, pero ya no puedo sostener la pluma. Las voces se apagan hasta que no oigo nada."
 latria_sexual_frustration_flavor.1502.desc.survived: "El veneno que bebí no me mató. Tras encontrarme y tratarme, sigo en la alcoba, demasiado enfermo para levantarme. Se han llevado la copa, pero los deseos que me impulsaron a beber permanecen."
 latria_sexual_frustration_flavor.1502.desc.severe: "El veneno me perdonó la vida y dejó mi cuerpo debilitado. Yazgo en la cama mientras otros me traen agua y arreglan mi ropa. La debilidad duradera no ha traído tregua a mis deseos."
 latria_sexual_frustration_flavor.1502.a.dead: "Yo… no puedo hablar…"
 latria_sexual_frustration_flavor.1502.a.survived: "Qué mal… un poco de agua…"
 latria_sexual_frustration_flavor.1502.a.severe: "Ni siquiera puedo levantar la mano…"

 latria_sexual_frustration_flavor.1503.t: "En la orilla del río"
 latria_sexual_frustration_flavor.1503.desc.dead: "Ya no veo la orilla. Parece que alguien grita a lo lejos, pero el sonido se vuelve confuso. Recuerdo la lámpara que dejé encendida en mi habitación. Hasta ese último pensamiento se desvanece."
 latria_sexual_frustration_flavor.1503.desc.survived: "Alguien me sacó del río. Cuando despierto, me están envolviendo en una capa. Tiemblo en la orilla, esperando que me lleven a casa, aún dolorosamente consciente del anhelo que me trajo aquí."
 latria_sexual_frustration_flavor.1503.desc.severe: "El río no me quitó la vida. Cuando me llevan a la orilla, tengo fiebre y toso tanto que no puedo hablar. Susurran sobre una enfermedad de los pulmones. En cuanto recobro la lucidez, vuelven los mismos deseos."
 latria_sexual_frustration_flavor.1503.a.dead: "Qué frío…"
 latria_sexual_frustration_flavor.1503.a.survived: "¿Sigo… con vida?"
 latria_sexual_frustration_flavor.1503.a.severe: "Yo… no puedo respirar…"

 latria_sexual_frustration_flavor.1504.t: "Al pie del precipicio"
 latria_sexual_frustration_flavor.1504.desc.dead: "Yazgo al pie del precipicio y oigo llamar a quienes me buscan por el sendero de montaña. Sus voces se acercan, pero no puedo responder. Las montañas se desdibujan ante mí hasta que dejo de distinguir el cielo."
 latria_sexual_frustration_flavor.1504.desc.survived: "Despierto al pie del precipicio con alguien agachado junto a mí, llamándome por mi nombre. La caída me ha dejado graves heridas, pero sigo con vida. Mientras espero una litera, los mismos deseos vuelven a llenar mis pensamientos."
 latria_sexual_frustration_flavor.1504.desc.severe: "Sobreviví al salto. Quienes me encontraron se reúnen a mi lado, sin querer mirarme a los ojos. Cuando intento levantarme, descubro que ya no puedo caminar como antes. Mi tormento permanece."
 latria_sexual_frustration_flavor.1504.a.dead: "No oigo nada…"
 latria_sexual_frustration_flavor.1504.a.survived: "No puedo moverme… duele…"
 latria_sexual_frustration_flavor.1504.a.severe: "Mis piernas…"

 latria_sexual_frustration_flavor.1505.t: "La puerta forzada"
 latria_sexual_frustration_flavor.1505.desc.dead: "Oigo cómo fuerzan la puerta de la alcoba y luego cómo alguien grita mi nombre con alarma. Intento decirles que la carta está junto a la cama, pero no me salen las palabras. La luz de la puerta se atenúa y no oigo nada más."
 latria_sexual_frustration_flavor.1505.desc.survived: "Alguien forzó la puerta de la alcoba y me salvó a tiempo. Ahora yazgo en la cama y las heridas dificultan cada movimiento. La cuerda ya no está, pero el tormento que me llevó hasta ella no me ha abandonado."
 latria_sexual_frustration_flavor.1505.desc.severe: "Oigo que alguien repite mi nombre una y otra vez, pero no sé cómo responder. Otros deben lavarme y darme de comer. Miro los muebles familiares de mi alcoba y no se me ocurre qué hacer a continuación. La carta junto a la cama ha sido guardada en un arcón."
 latria_sexual_frustration_flavor.1505.a.dead: "Yo…"
 latria_sexual_frustration_flavor.1505.a.survived: "Déjame… recuperar el aliento…"
 latria_sexual_frustration_flavor.1505.a.severe: "¿Alguien… me llama?"
