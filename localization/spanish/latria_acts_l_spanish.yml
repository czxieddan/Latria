 latria_solo_relief_interaction: "Caricia en soledad"
 latria_solo_relief_interaction_desc: "Los placeres de la carne, en soledad."
 latria_solo_relief_send: "Comenzar"
 latria_solo_relief_night_tt: "Esperas pasar la noche en soledad."
 latria_act.0201.t: "La cámara interior"
 latria_act.0201.desc: "Espero a que la estancia exterior quede vacía y a que se aleje incluso la última lámpara que pasa antes de echar yo mismo el cerrojo. Cuando desaparecen las voces, solo la mecha crepita de vez en cuando.\n\nMi ropa queda sobre la silla. Bajo la lámpara hasta que solo permanece la vela junto a la cama y luego permanezco largo rato entre unas sábanas donde no hay una segunda persona. La noche no es breve. Algunos deseos llegan con claridad y se retiran despacio, como el agua que pasa sobre la misma piedra, retrocede y vuelve en silencio.\n\nCuando mi respiración por fin se serena, la luz del día está en la ventana. Escucho mi corazón y después la habitación vacía, antes de recordar que debo alisar la cama y hacer que la noche parezca no haber ocurrido."
 latria_act.0201.a: "Vestirme y descorrer el cerrojo."

 latria_act.0301.t: "El límite del cuerpo"
 latria_act.0301.desc.illness: "La noche no ha pasado del todo, pero el malestar llega antes que la mañana.\n\nQuiero incorporarme. En cambio, el calor sube a mi frente. Las extremidades parecen haber sido cambiadas por las de otra persona: lo intento dos veces y siguen sin obedecerme. Las sábanas pesan y abrigan demasiado, y hasta mi respiración tiene una dulzura seca. Quiero llamar a quien está fuera, pero el sonido solo llega a mis labios.\n\nLa luz se reúne despacio en la ventana. La veo cruzar el marco, esperando que la fiebre se marche pronto y sospechando que no será tan dócil."
 latria_act.0301.desc.stress: "Mi cuerpo se ha detenido y he sacado las manos de las sábanas, pero mis pensamientos no se han detenido.\n\nPermanezco despierto y repaso la noche varias veces. Dónde se desordenó mi respiración, qué frase no debería haberse dicho nunca y dónde me exigí demasiado: todo sigue claro. Más allá de las cortinas de la cama hay silencio, y el silencio solo vuelve más altos los pensamientos. Hasta el aviso lejano del vigilante parece contarlos.\n\nMe vuelvo y luego vuelvo a cambiar de postura. Cerca del amanecer la almohada ya ha cambiado varias veces de dirección y sigo despierto."
 latria_act.0301.desc.health: "Quiero levantarme para tomar una copa de agua. En cuanto mi pie toca el suelo, la habitación se oscurece.\n\nMe aferro al borde de la cama y apoyo la frente en mi propia mano. El corazón late rápido y hueco, como si hubiera corrido un largo trecho, aunque solo me he incorporado desde la almohada. La copa está a unos pocos pasos y todo en la habitación sigue en su sitio. Mi cuerpo parece haber llegado a su final.\n\nPasa un rato antes de que la oscuridad se retire. Al final no voy a buscar el agua. Solo vuelvo a tenderme."
 latria_act.0301.a: "Tumbarme y no pensar en nada."
 latria_act.0311.t: "Desgaste prolongado"
 latria_act.0311.desc.illness: "Esto no cayó sobre mí en una sola noche.\n\nAquellas noches excesivas estaban dispersas, y yo seguía creyendo que un sueño y una comida caliente bastarían para pagarlas. Esta mañana el calor se extiende desde el pecho hasta los dedos, y comprendo que hacía tiempo que se habían unido. El agua no alivia la sequedad. Las mantas no me dan calor. Hasta el viento de la ventana parece atravesarme los huesos.\n\nPermanezco acostado escuchando pasar a la gente fuera y hasta tengo que reservar la fuerza necesaria para llamar a alguien. La enfermedad no irrumpió. Ha ido tomando residencia dentro de mí."
 latria_act.0311.desc.stress: "El cansancio no está en los miembros. Descansa sobre mi sueño y no me deja entrar.\n\nCierro los ojos, y los rostros del día, las respiraciones de la noche y los instantes que no tuve tiempo de lamentar se aprietan juntos. El cuerpo está demasiado gastado para levantar una mano, pero la mente sigue encendida, con luz suficiente para fatigarme. Cuento mis respiraciones y las vigilias más allá de la ventana. Nada puede oscurecer aquellas imágenes.\n\nEl gallo ha cantado y ha llegado el día. Solo paso de un lado de la almohada al otro y sigo despierto."
 latria_act.0311.desc.infertile: "Al principio fue una señal que no llegó. No le di importancia, pero después hubo muchos días así.\n\nConté los días que deberían haber llegado y no quise hablar de ellos, por miedo a que decirlos los volviera ciertos. Hoy el médico pone por fin delante de mí aquello a lo que no dejaba de dar rodeos: mi cuerpo ya no puede concebir un hijo. Su voz no es alta, pero nada más en la habitación puede cubrirla.\n\nDespués de que se marcha, apoyo una mano sobre el vientre. Pasa largo rato antes de dejar que esas palabras se asienten de verdad."
 latria_act.0311.desc.health: "Antes habría podido llamar a esta debilidad consecuencia de haber dormido demasiado tarde y superarla con una copa de vino caliente y medio día de quietud.\n\nAhora incluso sentarme exige una pausa al borde de la cama. Un cinturón parece más pesado que antes, y una copa también. La distancia de la ventana a la puerta parece más larga de lo que es. Solo al ver mi color en el espejo creo que esta deuda no puede pagarse con una noche o dos de descanso. La persona del cristal me mira como si lo hubiera sabido antes que yo.\n\nVuelvo a tenderme. Esta vez mi cuerpo decide antes que yo."
 latria_act.0311.a: "Dejar los asuntos del día y guardar cama."
 latria_act_exhausted_health: "Agotamiento"
 latria_act_exhausted_health_desc: "El cuerpo aún no se ha recuperado."
 latria_act_depleted_health: "Constitución debilitada"
 latria_act_depleted_health_desc: "El esfuerzo prolongado ha dañado el cuerpo."

