 latria_clerical_chastity_breach_denounced_toast: "Voto quebrantado denunciado"
 latria_wedding_night.t: "La noche de bodas"
 latria_wedding_night.desc: "Los invitados que acompañaron a los recién casados hasta su cámara por fin se han dispersado. Las risas permanecen en el pasillo, pero la puerta está cerrada y deja fuera las cortesías, las bendiciones y el vino del día, aparentemente inacabable.\n\nLa luz de la lámpara entibia las cortinas. La cama está recién hecha, la ropa recién cambiada, y hasta el modo en que se miran sigue siendo un poco extraño. [latria_actor.GetShortUIName] y [latria_partner.GetShortUIName] permanecen un rato frente a frente. Ninguno se apresura a hablar primero. Solo escuchan cómo la gente al otro lado de la puerta se aleja poco a poco.\n\nDespués de esta noche ya no serán solo los recién casados de los que hablaban sus invitados."

 latria_serene_mind: "Vigor y serenidad"
 latria_serene_mind_desc: "Un encuentro íntimo plenamente satisfactorio revitaliza la mente y el cuerpo."
 latria_repression_gained_tt: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'ganas', 'gana')] #N $VALUE|0$#! de [latria_sexual_repression|E] @latria_repression_gain_icon!"
