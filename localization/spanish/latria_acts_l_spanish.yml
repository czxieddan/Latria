 latria_act.0101.t: "Tras la puerta"
 latria_act.0101.desc: "Cuando la puerta se cierra, todavía se habla en voz baja en el pasillo. Los pasos se alejan y la línea de luz de la rendija se estrecha con ellos. Solo entonces me vuelvo y veo a [latria_partner.GetShortUIName] ya [Select_CString(latria_partner.IsFemale, 'sentada', 'sentado')] al borde de la cama, con la ropa todavía sobre un brazo, como olvidada después de entrar.\n\nLa lámpara está baja. No recogemos lo que descansa sobre la silla, aunque las sábanas pronto se entibian. La noche pasa tan despacio que oigo cada leve crepitar de la mecha. Cuando miro otra vez la ventana, ha llegado el día y la mitad exterior de la cama se ha enfriado.\n\nUn sirviente llama dos veces y se detiene, como si no estuviera seguro de que ya se nos pueda molestar. Solo entonces recuerdo cuánto espera ya de mí la jornada."
 latria_act.0101.desc.adultery: "Escucho largo rato junto a la puerta. Las voces del pasillo se apagan, y hasta el sirviente se marcha con una lámpara vacía, antes de abrir una rendija y dejar que [latria_partner.GetShortUIName] entre de lado. El cerrojo hace solo un leve sonido. Esta noche parece durar mucho.\n\nHablamos bajo. Más de una vez pasan pasos fuera y nos quedamos inmóviles, conteniendo incluso la respiración, hasta que se alejan. La luz cae sobre las cortinas y sobre nuestros ojos cada vez que se desvían hacia la rendija.\n\nAl despedirnos, [latria_partner.GetSheHe] me mira desde el umbral. No hace falta repetirlo. Nadie más debería oír hablar de esta noche."
 latria_act.0101.desc.dead: "Al principio creo que [latria_partner.GetShortUIName] solo ha caído en un sueño profundo. Pronuncio [latria_partner.GetHerHis] nombre junto al oído y luego acerco la lámpara al rostro. La llama salta y sigue mostrando unos ojos que no responden.\n\nApoyo la mano sobre [latria_partner.GetHerHis] pecho. El silencio bajo la palma me asusta. Las sábanas conservan el calor de hace un instante y la almohada su hueco, pero la respiración ha desaparecido. Sostengo la mano mientras se enfría, como si aún pudiera llamarla de vuelta.\n\nAl final abro la puerta de golpe y pido un médico. Mi voz choca contra el pasillo y regresa, sin parecerme ya mía."
 latria_act.0101.desc.adultery_dead: "Creí que lo peor de esta noche sería que alguien abriera la puerta y viera a dos personas que no deberían haber sido vistas juntas.\n\nEn cambio, [latria_partner.GetShortUIName] se desploma primero. Llamo, sacudo y acerco la lámpara al rostro. Los ojos no se abren. No se mueve ningún aliento en los labios. La mano que hace un momento estaba tibia se enfría poco a poco en la mía.\n\nFuera suenan pasos. Miro la cama deshecha, la ropa que aún no ha sido puesta y a alguien que no volverá a despertar. Cuando esa puerta se abra, no tendré ni una frase preparada."
 latria_act.0101.desc.actor_dissatisfied: "La noche aún es profunda cuando me incorporo y vuelvo a subirme la manga.\n\n[latria_partner.GetShortUIName] se vuelve bajo las mantas, como si quedara algo por decir, y me roza ligeramente la muñeca. Yo solo siento lo largas y vacías que han sido las horas. Hasta el deseo de extender la mano ha desaparecido. Una chispa crepita en la lámpara, pero la habitación no se entibia.\n\nRecojo mi ropa de la silla sin volverme. Algunos encuentros hacen desear más el pasillo cuanto más se prolongan."
 latria_act.0101.desc.partner_dissatisfied: "Al llegar, [latria_partner.GetShortUIName] se detuvo en el umbral, miró primero la lámpara y después a mí, como si le costara dejar que la noche empezara de inmediato.\n\nLa partida es mucho más rápida. El cinturón aún no está atado cuando [latria_partner.GetSheHe] ya ha dejado la cama, evitando mis ojos y mis manos. Pronuncio [latria_partner.GetHerHis] nombre. Recibo una respuesta breve y ninguna despedida. Al cerrarse la puerta, la corriente inclina la llama.\n\nLa habitación conserva todavía aquella presencia. El borde de la cama ya se ha enfriado, como si nadie se hubiera sentado allí."
 latria_act.0101.desc.manual: "No llegamos hasta la cama.\n\n[latria_partner.GetShortUIName] se sienta a mi lado y empieza a hablar de los asuntos inacabados del día, pero se detiene a mitad de una frase. Los besos son leves y las caricias se quedan en una manga o en el cabello. El aviso de un vigilante pasa bajo la ventana. No le prestamos atención.\n\nAl final se acaba el aceite de la lámpara. Nos quedamos un poco más a oscuras, escuchando cómo se serena la respiración, antes de alisarnos las mangas. Para esta noche, basta."
 latria_act.0101.a: "Abrir la puerta y volver al día."
 latria_act.0102.desc: "Podría recordar a [latria_actor.GetShortUIName] lo tarde que es y que mañana habrá gente esperando. Las palabras llegan a mis labios y no pasan de ahí.\n\nCuando la puerta se cierra, los pasos y las voces se alejan. La luz de la lámpara entibia las cortinas y no tenemos prisa por levantarnos. Escucho cómo [latria_actor.GetHerHis] respiración pasa del desorden a la calma y yo también olvido la hora. Cuando miro otra vez hacia la ventana, ya es de día. Los sirvientes de fuera probablemente llevan un buen rato esperando.\n\nSolo entonces suelto [latria_actor.GetHerHis] mano. Hay noches a las que no debería apresurarse hacia su final."
 latria_act.0102.desc.adultery: "Cuando [latria_actor.GetShortUIName] se dispone a marcharse, me acerco a la puerta y apoyo el oído en la madera.\n\nEl pasillo permanece vacío un rato. Después alguien pasa con una lámpara. Su luz cruza despacio la rendija y se aleja despacio. No hablamos ni dejamos que la ropa haga ruido. Cuando regresa el silencio, [latria_actor.GetSheHe] se arregla la ropa.\n\nAbro la puerta solo lo justo para que [latria_actor.GetSheHe] pase de lado. Al menos esta noche, el secreto sigue siendo solo nuestro."
 latria_act.0102.desc.partner_dissatisfied: "Antes de que se cerrara la puerta, todavía imaginaba cómo podría ser la noche. Incluso había hecho la lámpara más cálida de antemano.\n\nCuando al fin no hay nadie más, esa espera se enfría. Las manos de [latria_actor.GetShortUIName], [latria_actor.GetHerHis] respiración y cada cercanía que debería haberme retenido parecen llegarme a través de algo. Respondo, pero mis ojos vuelven a la puerta y mis pensamientos al pasillo.\n\nAl final soy yo quien se incorpora primero y se alisa la manga. Esta noche no valía el tiempo que pasé esperándola."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] se levanta sin dejarme encender de nuevo la lámpara. Solo queda un poco de luz pálida junto a la ventana.\n\nSigo en la cama, buscando una frase que impida que la noche se corte de forma tan brusca. [latria_actor.GetSheHe|U] vuelve el rostro, ofrece dos frases distraídas y ya se ata el cinturón, sin aceptar la ropa que le tiendo. Aún no he terminado de hablar cuando [latria_actor.GetSheHe] se dirige a la puerta.\n\nAl abrirse la puerta entra aire frío. Algunas decepciones no necesitan explicación."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] no me lleva hacia la cama, sino que se sienta a mi lado y aparta el cojín que había entre nosotros.\n\nLos asuntos inacabados del día parecen de pronto capaces de esperar. Intercambiamos besos y algunas frases que no hace falta terminar. Las manos se detienen en una manga o en el cabello y no van más adentro. Más allá de la ventana sigue siendo de noche, y el aviso del vigilante aún está lejos.\n\nAl despedirnos, [latria_actor.GetSheHe] alisa el pliegue que he dejado en mi ropa. La noche es breve, pero no deja la sensación de que falte algo."

 latria_scheme.0010.t: "El encuentro carnal"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "Mi [spouse|E]"
 latria_scheme.0010.t.concubine: "Mi [concubine|E]"
 latria_scheme.0010.t.soulmate: "Mi [soulmate|E]"
 latria_scheme.0010.t.lover: "Mi [lover|E]"
 latria_scheme.0010.t.adultery: "Una relación adúltera"
 latria_scheme.0010.desc: "Las velas siguen ardiendo, pero [target.GetShortUIName] ya no me responde.\n\nPronuncio el nombre y luego acerco el oído a los labios. No hay nada. La piel bajo mis dedos está más fría que hace un instante, aunque nuestro calor permanece en las sábanas. La mano se desliza de la mía y no regresa.\n\nPensaba retirar las copas, la ropa y cualquier rastro de esta noche antes del amanecer. Ahora solo queda junto a mí alguien que no volverá a moverse. La ventana palidece y no sé qué debería ocultar primero."
 latria_scheme.0010.a: "Cubrir a [target.GetShortUIName] con la manta y después abrir la puerta."
 latria_scheme.0020.t: "Una noche de espera"
 latria_scheme.0020.desc: "La lámpara ha bajado y todavía no oigo a [target.GetFirstName] junto a la puerta.\n\nCaliento el vino dos veces y vuelvo a doblar la ropa sobre la silla. De vez en cuando alguien cruza el pasillo. Cuando los pasos se acercan, contengo la respiración. Cuando se alejan, vuelvo a quedarme sin compañía. Cada vez creo que es [target.GetSheHe].\n\nAl final la vela vacila y la cera cae en la bandeja. Solo entonces admito que la noche ha terminado. El vino, las palabras y la excusa que preparé no harán falta."
 latria_scheme.0020.a: "Apagar la luz. No tiene sentido seguir esperando."
 latria_scheme.0030.t: "Una noticia demasiado tardía"
 latria_scheme.0030.desc: "Todavía sopeso qué puerta lateral sería más apartada y qué invitación despertaría menos sospechas cuando dejan la noticia sobre mi mesa.\n\n[target.GetFirstName] ya ha dejado este mundo. Hay pocas palabras en el papel. Las leo durante largo rato. Las cartas que no envié, los pasillos que memoricé, la excusa preparada para esta única noche: todo resulta inútil de pronto.\n\nVierto el vino mientras aún está tibio. Algunos preparativos pueden esperar una noche mejor. Ninguno alcanza a una muerte que ya ha ocurrido."
 latria_scheme.0030.a: "Quemar la carta que nunca envié."
 latria_scheme.0040.t: "Un hilo roto"
 latria_scheme.0040.desc: "Envío a alguien a buscar a [target.GetFirstName] y espero desde la tarde hasta que encienden las lámparas. Solo regresa una respuesta vaga: [target.GetSheHe] ya no está a mi alcance.\n\nQuizá una puerta esté vigilada con más atención. Quizá unos ojos se hayan vuelto desconfiados. O quizá [target.GetSheHe] simplemente no quiera acercarse a la luz que dejé encendida para [target.GetSheHe]. Pregunto dos veces. El mensajero no sabe nada más.\n\nEl motivo ya no importa. El hilo se ha roto entre mis dedos. Arrugo el papel donde anoté la hora hasta que el sudor borra las marcas."
 latria_scheme.0040.a: "Esto termina aquí."

