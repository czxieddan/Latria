 latria_act.0101.t: "Tras la puerta"
 latria_act.0101.desc: "La puerta se cierra y los pasos en el pasillo se apagan. [latria_partner.GetShortUIName] y yo permanecemos juntos hasta el amanecer.\n\nSolo la llamada del sirviente me recuerda los asuntos del día."
 latria_act.0101.desc.adultery: "Espero a que el pasillo quede vacío antes de dejar entrar a [latria_partner.GetShortUIName].\n\nAntes de separarnos, acordamos una cosa: nadie más debe enterarse de esta noche."
 latria_act.0101.desc.dead: "Repito el nombre [latria_partner.GetShortUINamePossessive], una y otra vez. No hay respuesta ni aliento.\n\nAbro la puerta de golpe y grito que alguien vaya a buscar a un médico."
 latria_act.0101.desc.adultery_dead: "Creía que lo peor que podía ocurrir era que nos descubrieran, hasta que [latria_partner.GetShortUIName] se desplomó y no despertó.\n\nSe acercan pasos por el pasillo. ¿Cómo voy a explicar esto?"
 latria_act.0101.desc.actor_dissatisfied: "Me levanto cuando aún está oscuro. [latria_partner.GetShortUIName] parece a punto de decir algo, pero ya he tenido bastante de este encuentro decepcionante."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] se apresura mucho más al marcharse que al llegar. [latria_partner.GetSheHe|U] evita mi mirada y no se despide."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] y yo buscamos un lugar tranquilo, satisfechos con besos y caricias. Ninguno está pendiente de la hora."
 latria_act.0101.a: "Marcharse"
 latria_act.0102.desc: "No le pido a [latria_actor.GetShortUIName] que se vaya. Una vez cerrada la puerta, la noche es nuestra.\n\nAl amanecer, los sirvientes llevan ya un buen rato esperando fuera."
 latria_act.0102.desc.adultery: "Antes de que [latria_actor.GetShortUIName] se marche, escucho junto a la puerta.\n\nEl pasillo está vacío. Al menos por esta noche, nuestro secreto sigue siendo nuestro."
 latria_act.0102.desc.partner_dissatisfied: "Ansiaba estar a solas con [latria_actor.GetShortUIName]. Ahora solo deseo marcharme. Esta noche apenas ha merecido la espera."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] se levanta con poca paciencia. Intento hablar, pero [latria_actor.GetSheHe] solo responde con unas palabras secas antes de dirigirse a la puerta."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] se sienta a mi lado y, por un rato, dejamos de lado nuestros deberes sin pedirnos más que besos y caricias.\n\nAún está oscuro cuando nos separamos."

