 latria_decision_disgraced_defenders_tt: "Los personajes de tu [rite|E] con el [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] o [GetTrait('fornicator').GetName(GetNullCharacter)] y tropas a su mando pueden unirse a los defensores."
 latria_decision_hook_defenders_tt: "Puedes gastar tus [hooks|E] para incorporar a la defensa a personajes de tu [rite|E]."

