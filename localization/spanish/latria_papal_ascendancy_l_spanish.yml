 latria_papal_scandal_depose_war: "Guerra de deposición papal"
 latria_papal_scandal_event_troops: "Refuerzos papales"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "Deponer al Papa"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "Guerra para deponer a [DEFENDER.GetShortUINameNotMe]"
 latria_papal_scandal_depose_war_victory_desc_defender: "Pierdes tu cargo de [head_of_faith|E]."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U] pierde [defender.GetHerHis] cargo de [head_of_faith|E]."
 latria_papal_scandal_depose_war_white_peace_desc: "Ambos bandos firman la paz y conservan sus [titles|E]."
 latria_papal_scandal_depose_war_defeat_desc_defender: "Derrotas a la coalición y sigues siendo [head_of_faith|E]."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U] derrota a la coalición y sigue siendo [head_of_faith|E]."

 latria_papal_ascendancy.0010.t: "Llamada a defender la Santa Sede"
 latria_papal_ascendancy.0010.desc: "Tu [ally|E], [latria_pope.GetShortUIName], se enfrenta a una coalición que busca deponer[latria_pope.GetHerHim] por una relación adúltera. Invocando vuestra alianza, [latria_pope.GetSheHe] te pide que marches contra la coalición."
 latria_papal_ascendancy.0010.a: "Honrar la sagrada alianza y marchar"
 latria_papal_ascendancy.0010.b: "No podemos luchar por semejante escándalo"
 latria_honored_papal_alliance_opinion: "Defendió la Santa Sede"
 latria_refused_papal_alliance_opinion: "Deshonró la alianza papal"
 latria_ally_share_received_msg_title: "La gratitud de la Santa Sede"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName] te ha enviado una parte de las reparaciones de los gobernantes derrotados."
 latria_ally_joined_defense_msg_title: "Un aliado se une a la defensa"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName] honró vuestra alianza y se unió a tu defensa contra la coalición."
 latria_ally_refused_defense_msg_title: "Un aliado rechaza la llamada"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName] rechazó tu llamada a defender la Santa Sede."

 latria_papal_scandal_war.0001.t: "Una llamada a deponer al Papa"
 latria_papal_scandal_war.0001.desc: "Los gobernantes han tomado las armas para deponer a [latria_scandal_target.GetShortUIName] después de que [latria_scandal_target.GetHerHis] relación adúltera se hiciera pública. Sus enviados llegan a mi corte para pedirme que marche con la coalición."
 latria_papal_scandal_war.0001.a: "Tomar las armas junto a la coalición"
 latria_papal_scandal_war.0001.b: "Mantenerse al margen de esta guerra"
