l_spanish:
 h_latria_holy_see: "Santa Sede"
 h_latria_holy_see_adj: "católica"
 nick_latria_vicar_of_christ: "el Vicario de Cristo"

 latria_papal_ascendancy.0001.t: "El trono por encima de toda corona"
 latria_papal_ascendancy.0001.desc: "Ante los prelados reunidos, alzo la mano sobre los estandartes rotos de quienes vinieron a derrocarme. Dios no salvó a Su vicario para que negociase con los príncipes. Por Su mandato, la Santa Sede ejercerá una autoridad indivisible y llevará la salvación a todos los reinos."
 latria_papal_ascendancy.0001.a: "Que el mundo se arrodille ante la Santa Sede"

 latria_papal_ascendancy.0002.t: "El mandato del vicario"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] ha derrotado al ejército alzado contra la Santa Sede. Ante el clero y los príncipes vencidos, [latria_papal_victor.GetSheHe] proclama que Dios [latria_papal_victor.GetHerHim] ha investido de autoridad absoluta y le ha encomendado la salvación del mundo."
 latria_papal_ascendancy.0002.a: "Comienza un nuevo orden"

 trait_latria_army_of_god: "Ejército de Dios"
 trait_latria_army_of_god_desc: "Este personaje dirige un ejército consagrado a la autoridad absoluta de la Santa Sede."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] dirige un ejército consagrado a la autoridad absoluta de la Santa Sede."

 latria_papal_redemption_or_ruin: "Redención o ruina"
 latria_papal_redemption_or_ruin_desc: "Exigir que [recipient.GetShortUINameNoTooltip] se someta a la Santa Sede y adopte el [rite|E] [actor.GetShortUINamePossessiveNoTooltip]. La negativa traerá la guerra."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] exige que te sometas a la Santa Sede y te conviertas a [actor.GetHerHis] [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "[old_title.GetBaseNameNoTierNoTooltip] Menor"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "[old_title.GetAdjectiveNoTooltip] menor"

 latria_reveal_papal_secret_decision: "Revelar el secreto"
 latria_reveal_papal_secret_decision_desc: "Revelaré mi secreto ante el clero y los príncipes. Que todos los gobernantes lo oigan de mi propia boca y que quienes nieguen mi cargo tomen las armas."
 latria_reveal_papal_secret_decision_tooltip: "Revelar públicamente tu relación adúltera y afrontar la guerra de deposición."
 latria_reveal_papal_secret_decision_confirm: "Revelarlo ante todos"
 latria_can_reveal_papal_secret_trigger: "Tienes un secreto de relación adúltera que puede revelarse"
 NOT_ANY_OF_MY_SECRETS: "Ninguno de tus secretos:"

 latria_papal_redemption_war: "Guerra papal de redención"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Redención papal"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "Guerra de redención [ATTACKER.GetPrimaryTitle.GetAdjective] contra [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "Guerra de redención [ATTACKER.GetPrimaryTitle.GetAdjective]"
 latria_papal_redemption_war_victory_desc: "El defensor pierde rango, se convierte en vasallo del Papa y adopta el [rite|E] del Papa."
 latria_papal_redemption_war_white_peace_desc: "Se retira la exigencia de sumisión."
 latria_papal_redemption_war_defeat_desc: "Fracasa la exigencia de sumisión del Papa."

