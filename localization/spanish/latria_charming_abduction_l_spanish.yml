 latria_charming_abduction.1001.t: "Una promesa junto a la almohada"
 latria_charming_abduction.1001.desc: "El agua del baño se enfría, aunque su fragancia aún perdura en la alcoba. Dejo la túnica junto a la cama y me vuelvo hacia la carta sin sellar sobre la mesa. Solo le falta una frase que quite el sueño a [target.GetFirstName].\n\nMi gente conoce la puerta lateral y cada recodo del pasillo. Si [target.GetSheHe] despide a [target.GetHerHis]s sirvientes por la promesa de una noche de ternura, las pesadas cortinas ocultarán muchas cosas. En cuanto a los placeres que [target.GetSheHe] cree que [target.GetHerHim] aguardan en mi cama... primero, [target.GetSheHe] debe cruzar el umbral."
 latria_charming_abduction.1001.a: "Avisar[target.GetHerHim] de que esperaré junto a la cama."
 latria_charming_abduction.1001.b: "Invitar[target.GetHerHim] a tomar vino en la antecámara. Vino tibio, velas tenues."
 latria_charming_abduction.1001.c: "Sellar la carta. Habrá una noche más propicia."
 latria_charming_abduction.1001.d: "Echar la carta al fuego. Esto termina aquí."
 latria_charming_abduction_wait_tt: "Seguir preparando y esperar otra oportunidad para actuar."

 latria_charming_abduction.1101.t: "Un rastro de perfume"
 latria_charming_abduction.1101.desc: "Con la respuesta [target.GetFirstNamePossessive] llega una cinta de seda, anudada con tanta holgura que el menor tirón podría desatarla. Las palabras siguen siendo decorosas, pero las últimas líneas se apiñan: [target.GetSheHe] tenía prisa por acabar, aunque se resistía a soltar la pluma.\n\nMe enrollo la cinta en un dedo. ¿Qué aroma debería llevar mi próxima carta? ¿Y qué pensamientos la acompañarían hasta [target.GetHerHis] cama?"
 latria_charming_abduction.1101.a: "Poner una gota de perfume donde menciono la noche."
 latria_charming_abduction.1101.b: "Indicar la hora. Dejar la carta sin firmar."
 latria_charming_abduction.1101.c: "Dejar la respuesta bajo el candelabro. Que espere."

 latria_charming_abduction.1102.t: "Otro par de ojos"
 latria_charming_abduction.1102.desc: "Las noticias sobre las costumbres nocturnas [target.GetFirstNamePossessive] resultan más útiles que [target.GetHerHis]s cartas de amor. Un sirviente siempre se queda tras el anochecer, sirviendo vino y guardando ropa, sin querer irse hasta que se apaga la última vela.\n\nUn solo sirviente leal podría arruinar una cita cuidadosamente dispuesta. Debo encontrar otra ocupación para esos ojos vigilantes."
 latria_charming_abduction.1102.a: "Una bolsa de plata debería comprar al sirviente una noche de distracción."
 latria_charming_abduction.1102.b: "Añadir una línea: ven sin compañía y tendré una sorpresa para ti."
 latria_charming_abduction.1102.c: "Retirar la invitación por ahora. Esa puerta puede esperar otra noche."

 latria_charming_abduction.2001.t: "Cuando cae el cerrojo"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] entra en la alcoba con [target.GetHerHis]s ojos aún puestos en las velas junto a la cama. Ofrezco una mano para convencer[target.GetHerHim] de que un paso más bastará para alcanzarme.\n\nEl cerrojo chasquea. [target.GetSheHe|U] se vuelve y las sombras tras las cortinas se ponen en pie. Mi gente sujeta [target.GetHerHis]s brazos; la cuerda sale de una manga sin siquiera rozar un candelabro.\n\nCojo la ropa de la silla. Esta noche nadie compartirá esta almohada."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] acepta el vino que he servido y se vuelve un poco, dejando libre el paso a la cámara interior. [target.GetSheHe|U] espera que tome [target.GetHerHis] mano y [target.GetHerHim] lleve a un lugar más apartado.\n\nEn cambio, dejo mi copa. La puerta lateral se abre y mi gente irrumpe. Para cuando [target.GetSheHe] piensa en gritar, el cerrojo ya está echado y las cuerdas tensas.\n\nEl vino de la mesa apenas se ha tocado."
 latria_charming_abduction.2001.secret: "\n\nNada se mueve en el pasillo. Cuando la corte advierta [target.GetHerHis] ausencia, hasta la cera de las velas estará fría."
 latria_charming_abduction.2001.exposed: "\n\nSe oye un grito al otro lado de la ventana. Parece que alguien contará la otra mitad de esta velada antes del amanecer."
 latria_charming_abduction.2001.a: "Traer [target.GetHerHis] capa. Es hora de irnos."

 latria_charming_abduction.2002.t: "Una velada inconclusa"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] se detiene en el umbral. Ni las velas, ni la cama, ni siquiera mi silencio cuidadosamente medido logran atraer[target.GetHerHim] un paso más cerca.\n\n\"Se hace tarde.\" [target.GetHerHis|U]s ojos se desvían por encima de mi hombro hacia las cortinas inmóviles.\n\nMi mano extendida solo encuentra el aire de la noche."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] deja el vino intacto. Por un momento, [target.GetSheHe] permanece junto a la mesa como si sopesara mi sonrisa, y luego retrocede hacia la puerta abierta.\n\n\"Que dejen las luces encendidas. Mi gente espera.\"\n\nLos pasos tras la puerta lateral suenan terriblemente fuertes."
 latria_charming_abduction.2002.secret: "\n\nBajo la mano antes de que salgan los hombres ocultos. Mañana quizá alguien se ría de mis atenciones rechazadas. Nadie sabrá lo que esperaba tras esa puerta."
 latria_charming_abduction.2002.exposed: "\n\nUn lazo de cuerda asoma. [target.GetFirstNameNoTooltip] retrocede, gritando mi nombre mientras [target.GetSheHe] se acerca a [target.GetHerHis]s guardias. Ya nadie confundirá esto con un coqueteo inofensivo."
 latria_charming_abduction.2002.a: "Apagar las velas. No habrá más invitaciones."
 latria_charming_abduction.2002.b: "Escribir otra carta y esperar una nueva oportunidad."
 latria_charming_abduction_retry_tt: "Preparar esta conjura de nuevo, eliminando el modificador del método de este intento y conservando los preparativos anteriores de la invitación."

 latria_charming_abduction.2101.t: "Una trampa tierna"
 latria_charming_abduction.2101.bedchamber: "Cuando vine a ver a [owner.GetFirstName], aún pensaba en la mejor forma de besar [owner.GetHerHis] mano. La alcoba estaba en penumbra, lo justo para olvidarse de mirar tras las cortinas.\n\nSolo cuando me retorcieron los brazos a la espalda entendí por qué [owner.GetSheHe] se había mantenido fuera de mi alcance. Aquí no me esperaba ternura alguna, solo una cuerda."
 latria_charming_abduction.2101.antechamber: "Caí en el cautiverio [owner.GetFirstNamePossessive] antes de poder probar el vino.\n\n[owner.GetSheHe|U] dejó [owner.GetHerHis] copa como si diera una señal acordada. Un instante después, irrumpieron personas por la puerta lateral y me sujetaron los brazos. No dejaba de mirar[owner.GetHerHim], esperando una explicación. [owner.GetSheHe|U] solo les dijo que fueran a buscar mi capa."
 latria_charming_abduction.2101.a: "Apartar la mirada. No [owner.GetHerHim] miraré."

 latria_charming_abduction.2102.t: "Tras la luz de las velas"
 latria_charming_abduction.2102.secret: "La invitación [owner.GetFirstNamePossessive] era tierna, pero [owner.GetSheHe] parecía tener la mente en otra parte al encontrarnos. Pasos en el pasillo; telas que crujían tras una puerta. Cuando mencioné a mis guardias, [owner.GetHerHis] sonrisa se tensó.\n\nPuse una excusa y me marché. Solo entre mi gente advertí el sudor en las palmas. Quizá fuera solo una cita torpe. Quizá sea mejor no saber nunca qué había tras aquella puerta."
 latria_charming_abduction.2102.exposed: "Vislumbrar la cuerda me devolvió de golpe la cordura.\n\nLos susurros [owner.GetFirstNamePossessive], las velas tenues, la distancia que [owner.GetSheHe] mantenía entre ambos: todo pretendía retenerme en esa habitación. Retrocedí al pasillo y llamé a mis guardias, viendo cómo las figuras tras la puerta volvían a ocultarse en las sombras.\n\nHabía estado a punto de despedir a todo el mundo por aquella sonrisa."
 latria_charming_abduction.2102.a: "En adelante, alguien esperará fuera de la puerta."

