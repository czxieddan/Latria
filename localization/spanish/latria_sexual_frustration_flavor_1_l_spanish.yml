l_spanish:
 latria_sexual_frustration_flavor.1001.t: "Una larga noche tras la cortina"
 latria_sexual_frustration_flavor.1001.desc.female: "En camisón, me siento junto a la ventana con una carta sin abrir en el regazo. Quien la escribió se marchó hace mucho, pero sigo pensando en todo lo que quedó sin decir."
 latria_sexual_frustration_flavor.1001.desc.male: "En camisón, me siento junto a la ventana con una carta sin abrir en el regazo. La letra familiar del sobre evoca un anhelo que no ha encontrado respuesta."
 latria_sexual_frustration_flavor.1001.desc: "Se hace tarde y los viejos pensamientos vuelven una vez más."
 latria_sexual_frustration_flavor.1001.a: "Leerla hasta el final y pensar en quien la escribió."
 latria_sexual_frustration_flavor.1001.b: "Guardar la carta bajo llave y ahogar el pensamiento."
 latria_sexual_frustration_flavor.1001.c: "Tomar una hoja nueva y convertirlo en un poema."

 latria_sexual_frustration_flavor.1002.t: "Especias en el festín"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Las especias y los cantos llenan el salón y a ningún invitado parece molestarle una mirada furtiva. Aun así, observo cada rostro como si alguien pudiera aparecer todavía."
 latria_sexual_frustration_flavor.1002.desc.strict: "Las especias animan el festín, pero cada risa me recuerda lo de cerca que la costumbre vigila un deseo descarriado. Casi olvido la copa que tengo en la mano."
 latria_sexual_frustration_flavor.1002.desc: "El festín es ruidoso. Mis pensamientos siguen vagando de todos modos."
 latria_sexual_frustration_flavor.1002.a: "Sumarme con unas palabras tiernas de mi cosecha."
 latria_sexual_frustration_flavor.1002.b: "Bajar la mirada, dar las gracias al anfitrión y despedirme."
 latria_sexual_frustration_flavor.1002.c: "Pedir a los músicos una melodía más antes de irme."
 latria_sexual_frustration_flavor.1002.d: "Reunir a los invitados en una mesa y pasar la velada conversando."

 latria_sexual_frustration_flavor.1003.t: "Un sermón en el jardín"
 latria_sexual_frustration_flavor.1003.desc.favors: "El predicador dice que el placer carnal no tiene por qué ofender a nuestra fe. Sus palabras deberían consolarme, pero mi inquietud no remite."
 latria_sexual_frustration_flavor.1003.desc.condemns: "El predicador habla de castidad y contención. Oigo cada palabra, pero no consigo mantener mis pensamientos en las escrituras."
 latria_sexual_frustration_flavor.1003.desc: "Escucho el sermón hasta el final. Una brisa pasa la página y mis pensamientos siguen revueltos."
 latria_sexual_frustration_flavor.1003.a: "Cerrar el libro y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1003.b: "Apartar esos pensamientos y unirme a la recitación."
 latria_sexual_frustration_flavor.1003.c: "Pedir al predicador que explique cada pasaje."

 latria_sexual_frustration_flavor.1004.t: "Un halcón inquieto"
 latria_sexual_frustration_flavor.1004.desc.lustful: "El halcón bate las alas contra mi guante mientras observa las palomas a lo lejos. Conozco bien esa impaciencia, aunque no encuentro dónde dar reposo a mis propios pensamientos."
 latria_sexual_frustration_flavor.1004.desc.chaste: "El halcón se mueve inquieto sobre mi guante. Me concentro en las riendas y la llamada, pero los pensamientos resultan más difíciles de domar."
 latria_sexual_frustration_flavor.1004.desc: "Los cazadores esperan que llame al halcón, pero no consigo concentrarme en la caza."
 latria_sexual_frustration_flavor.1004.a: "Dejar que la comitiva espere mientras pienso en mis asuntos."
 latria_sexual_frustration_flavor.1004.b: "Concentrarme y poner en orden los útiles de caza."
 latria_sexual_frustration_flavor.1004.c: "Alisar las plumas despacio y volver a intentar la llamada."

 latria_sexual_frustration_flavor.1005.t: "Entre reuniones del consejo"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Los señores se han dispersado y han dejado mapas y sellos por toda la mesa. Me siento a solas en la cabecera, con una vieja carta junto a los documentos pendientes."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Mis compañeros han acordado el próximo vado, pero el mapa sigue sobre la mesa. Acerco una vieja carta a la lámpara y pierdo el hilo de la lista de provisiones."
 latria_sexual_frustration_flavor.1005.desc.clergy: "La reunión ha terminado y las cuentas y escrituras siguen en la mesa. Saco una vieja carta de entre las páginas y vuelven los pensamientos inquietos."
 latria_sexual_frustration_flavor.1005.desc.ruler: "El consejo ha terminado, pero quedan los documentos y los sellos. Me aliso la manga; la vieja carta a mi lado retiene mi atención más que cualquier petición."
 latria_sexual_frustration_flavor.1005.desc: "Hay trabajo pendiente, pero una vieja carta no deja de atraer mi atención."
 latria_sexual_frustration_flavor.1005.a: "Dejar el trabajo y volver a leer la vieja carta."
 latria_sexual_frustration_flavor.1005.b: "Guardar la carta y volver a mis deberes."
 latria_sexual_frustration_flavor.1005.c: "Organizar el trabajo restante y concederme un breve descanso."
 latria_sexual_frustration_flavor.1005.d: "Ordenar cada tarea y asegurarme de terminarlas todas."

 latria_sexual_frustration_flavor.1006.t: "Una vieja carta a la luz de las velas"
 latria_sexual_frustration_flavor.1006.desc.female: "En camisón, me siento bajo la lámpara, con los dedos sobre los pliegues de una vieja carta. No contiene promesas, solo un afecto que no se ha desvanecido."
 latria_sexual_frustration_flavor.1006.desc.male: "En camisón, me siento junto a la cama. La letra familiar de la vieja carta evoca un afecto que nunca fue correspondido."
 latria_sexual_frustration_flavor.1006.desc: "La noche está en calma, pero las palabras de la vieja carta siguen ante mí."
 latria_sexual_frustration_flavor.1006.a: "Leer la carta hasta el final."
 latria_sexual_frustration_flavor.1006.b: "Guardar la carta, apagar la vela y disponerse a dormir."

 latria_sexual_frustration_flavor.1007.t: "Antes de que acabe el festín"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Alguien habla de un antiguo amante y nadie en la mesa se ofende. Alzo mi copa con los demás, pero mi mirada vuelve a un asiento vacío."
 latria_sexual_frustration_flavor.1007.desc.strict: "Un romance indiscreto sirve de advertencia y la conversación pasa a la reputación y la costumbre. Me aliso la manga y no digo nada."
 latria_sexual_frustration_flavor.1007.desc: "La música continúa, aunque mis pensamientos abandonaron la mesa hace mucho."
 latria_sexual_frustration_flavor.1007.a: "Oirán mi propio anhelo desde el principio."
 latria_sexual_frustration_flavor.1007.b: "Tragarme las palabras, dar las gracias al anfitrión y despedirme."
 latria_sexual_frustration_flavor.1007.c: "Preguntar a mi vecino por sus viajes."

 latria_sexual_frustration_flavor.1008.t: "Oración ante el santuario"
 latria_sexual_frustration_flavor.1008.desc.favors: "La vela ante el santuario se consume. Mi fe no desprecia los placeres de la carne, pero no consigo aplacar la urgencia que llevo dentro."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Repito mi voto de castidad ante el santuario, pero la oración familiar se interrumpe en mis labios más de una vez."
 latria_sexual_frustration_flavor.1008.desc: "La oración ha terminado. Permanezco junto a la vela."
 latria_sexual_frustration_flavor.1008.a: "Apartar el voto de abstinencia y admitir mi anhelo."
 latria_sexual_frustration_flavor.1008.b: "Contener mis pensamientos y seguir rezando."
 latria_sexual_frustration_flavor.1008.c: "Leer un pasaje y meditarlo antes de irme."
 latria_sexual_frustration_flavor.1008.d: "Mantener la vela encendida y recitar hasta el amanecer."

 latria_sexual_frustration_flavor.1009.t: "La petición sin leer"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Las peticiones cubren la larga mesa y los señores aguardan mis palabras. Leo una línea dos veces, pero mis pensamientos vagan por otro lugar."
 latria_sexual_frustration_flavor.1009.desc.ruler: "El consejo aún no ha terminado, pero no asimilo ni una palabra de los documentos que tengo delante. Cierro el libro e intento volver al asunto que nos ocupa."
 latria_sexual_frustration_flavor.1009.a: "Disolver el consejo y dejarme a solas con mis pensamientos."
 latria_sexual_frustration_flavor.1009.b: "Concentrarme y atender cada petición."
 latria_sexual_frustration_flavor.1009.c: "Poner las decisiones en orden y pronunciarlas una a una."

 latria_sexual_frustration_flavor.1010.t: "El regreso del águila"
 latria_sexual_frustration_flavor.1010.desc.lustful: "El halcón gira sobre el bosque. Mientras lo veo negarse a volver, recuerdo lo mucho que me cansa dejar a un lado cada deseo."
 latria_sexual_frustration_flavor.1010.desc.chaste: "El azor sigue girando a lo lejos. Aprieto el guante y me obligo a escuchar solo la llamada de los cazadores."
 latria_sexual_frustration_flavor.1010.desc: "Los cazadores esperan para levantar el campamento mientras sigo mirando el cielo sobre los árboles."
 latria_sexual_frustration_flavor.1010.a: "Hacer esperar a los cazadores mientras mis pensamientos siguen al águila."
 latria_sexual_frustration_flavor.1010.b: "Tocar la retirada y revisar los útiles de caza."
 latria_sexual_frustration_flavor.1010.c: "Caminar junto al bosque antes de volver a la comitiva."

 nick_latria_the_unquiet: "el Inquieto"
 latria_flavor_focus: "Determinación reunida"
 latria_flavor_focus_desc: "Este personaje ha dedicado su atención a las escrituras y los deberes cotidianos."
 latria_flavor_remorse: "Remordimiento persistente"
 latria_flavor_remorse_desc: "Un breve consuelo ha dejado la conciencia intranquila."
 latria_flavor_sullied: "Reputación mancillada"
 latria_flavor_sullied_desc: "Los rumores han perjudicado la posición y las amistades de este personaje."
 latria_flavor_broken_sleep: "Falta de sueño"
 latria_flavor_broken_sleep_desc: "La escasez de sueño distrae a este personaje y lo cansa con facilidad."
 latria_flavor_vagabond_focus: "Concentración del viajero"
 latria_flavor_vagabond_focus_desc: "El trabajo del camino acalla brevemente los pensamientos inquietos."
 latria_flavor_public_disgrace: "Deshonra pública"
 latria_flavor_public_disgrace_desc: "Los rumores de una falta pública han perjudicado la posición y las amistades de este personaje."
 latria_flavor_hunting_focus: "Atención a la caza"
 latria_flavor_hunting_focus_desc: "Este personaje ha centrado su atención en el rastreo, la cetrería y la equitación."
 latria_flavor_warm_company: "Compañía agradable"
 latria_flavor_warm_company_desc: "Una buena conversación ha hecho que este personaje tenga más ganas de buscar compañía."
 latria_flavor_neglected_duties: "Deberes desatendidos"
 latria_flavor_neglected_duties_desc: "Los asuntos privados han apartado a este personaje de sus deberes."
 latria_flavor_diligent_work: "Deberes en orden"
 latria_flavor_diligent_work_desc: "Este personaje ha encauzado sus pensamientos inquietos hacia una planificación y un trabajo cuidadosos."
