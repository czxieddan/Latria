 latria_daily_sexual_frustration_gain_impatient: "[GetTrait('impatient').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_too_early: "Demasiado pronto"
 latria_daily_sexual_frustration_gain_no_longer: "Sin represión"

 latria_act.0401.t: "Una noche inquieta"
 latria_act.0401.desc: "El sueño tarda en llegar. El deseo que aparté vuelve cuando la alcoba queda en silencio."
 latria_act.0401.a: "Dar vueltas bajo las mantas"
 latria_act.0402.t: "Sin sosiego"
 latria_act.0402.desc: "La menor distracción da paso al mismo anhelo insatisfecho."
 latria_act.0402.a: "Serenar mis pensamientos"
 latria_act.0403.t: "Deseo negado"
 latria_act.0403.desc: "La contención ha dejado de parecer paciencia. Oprime cada pensamiento tranquilo."
 latria_act.0403.a: "Resistir"
 latria_act.0404.t: "Al borde del colapso"
 latria_act.0404.desc: "No encuentro sosiego en el sueño, la oración ni el trabajo. La tensión me sigue a todas partes."
 latria_act.0404.a: "Mantener la entereza"
 latria_act.0405.t: "Demasiado para soportarlo"
 latria_act.0405.desc: "El deseo insatisfecho ha devorado todo otro pensamiento. Ha pasado otra noche sin dormir y hasta las tareas habituales se han vuelto difíciles. No le veo fin."
 latria_act.0405.a: "Respirar hondo"
 latria_sexual_frustration_collapse_warning_tt: "No puedo aguantar mucho más…"
 latria_act.0405.b: "Soportarlo"
