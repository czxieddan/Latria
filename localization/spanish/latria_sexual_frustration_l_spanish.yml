l_spanish:
 latria_sexual_frustration_1: "Deseo inquieto"
 latria_sexual_frustration_1_desc: "El deseo insatisfecho ha empezado a perturbar a este personaje."
 latria_sexual_frustration_2: "Deseo persistente"
 latria_sexual_frustration_2_desc: "El deseo vuelve una y otra vez, dificultando la compostura."
 latria_sexual_frustration_3: "Deseo reprimido"
 latria_sexual_frustration_3_desc: "El deseo carnal largamente negado pesa sobre el cuerpo y la mente."
 latria_sexual_frustration_4: "Deseo atormentado"
 latria_sexual_frustration_4_desc: "La tensión de la contención impregna ya cada hora de vigilia."
 latria_sexual_frustration_5: "Deseo insoportable"
 latria_sexual_frustration_5_desc: "El deseo se ha convertido en una carga intolerable."

 latria_sexual_frustration_0: "Deseo sereno"
 latria_sexual_frustration_0_desc: "El deseo insatisfecho no perturba a este personaje, que siente paz en cuerpo y mente."
 latria_sexual_frustration_hud_title: "[SelectLocalization( Or( Not( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').IsSet ), EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)0' ) ), 'latria_sexual_frustration_0', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)1' ), 'latria_sexual_frustration_1', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)2' ), 'latria_sexual_frustration_2', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)3' ), 'latria_sexual_frustration_3', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)4' ), 'latria_sexual_frustration_4', 'latria_sexual_frustration_5' ) ) ) ) )] [GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue|0]/5"
 latria_sexual_frustration_hud_subheading: "[latria_sexual_repression_level|E] para [GetPlayer.GetSexuality]"
