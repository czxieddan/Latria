 game_concept_latria_sexual_repression: "Represión"
 game_concept_latria_sexual_repression_desc: "La represión mide el deseo sexual insatisfecho de un personaje. Aumenta con el tiempo y disminuye cuando el personaje encuentra alivio carnal."
 game_concept_latria_sexual_repression_level: "Nivel de represión"
 game_concept_latria_sexual_repression_level_desc: "Cuando [latria_sexual_repression|E] alcanza [latria_sexual_repression_threshold|E], aumenta el [latria_sexual_repression_level|E]. Cada nivel aplica su modificador de personaje correspondiente."
 game_concept_latria_sexual_repression_threshold: "Umbral de represión"
 game_concept_latria_sexual_repression_threshold_desc: "[latria_sexual_repression_level|E] 1: #V 50#!; 2: #V 85#!; 3: #V 140#!; 4: #V 210#!; 5: #V 320#!."

 latria_daily_sexual_frustration_gain_base: "Aumento base"
 latria_daily_sexual_frustration_gain_prime_age: "Plenitud de la vida"
