 latria_act.0401.t: "Una noche inquieta"
 latria_act.0401.desc: "La alcoba está en silencio y solo yo sigo despierto. El deseo que aparté vuelve solo, sin que lo llame; un calor se me pega a la espalda. La vela se consume; bajo el dosel de la cama el aire se estanca.\n\nCuento respiraciones, pierdo la cuenta y vuelvo a empezar. Las pequeñas tareas del día emergen una tras otra; debajo sigue el mismo anhelo insatisfecho.\n\nCuanto más calla la alcoba, más claro se vuelve. Esta noche también me hallará despierto, oyendo cómo cruje la cama hasta el alba."
 latria_act.0401.a: "Dar vueltas bajo las mantas"
 latria_act.0402.t: "Sin sosiego"
 latria_act.0402.desc: "A mitad de la oración de la mañana, el mismo anhelo se cuela entre las palabras. Me detengo y cuento respiraciones de nuevo; cuando se calman, sigue ahí.\n\nEl canto recorre la nave. Mis labios lo siguen, pero los versos no se quedan; a ambos lados las cabezas permanecen inclinadas. El anhelo pesa en mi pecho, más pesado a cada instante.\n\nCuando el incienso se apaga, cierro el libro, sabiendo que volverá con la noche."
 latria_act.0402.a: "Serenar mis pensamientos"
 latria_act.0403.t: "Deseo negado"
 latria_act.0403.desc: "La contención ha dejado de parecer paciencia. Se alza en mi pecho y aparta cada pensamiento tranquilo.\n\nUna tarea tras otra pasa por mis manos, y mis pensamientos vuelven al mismo lugar. La llama vacila y el calor sube otra vez. Dejo la labor y espero a que pase; cada vez tarda más en irse.\n\nNoches así no las aguantaré muchas más."
 latria_act.0403.a: "Resistir"
 latria_act.0404.t: "Al borde del colapso"
 latria_act.0404.desc: "El sueño no llega; la oración no lo sujeta; el trabajo del día no lo desplaza. De noche es más estruendoso; de día espera tras cada pausa.\n\nAl caer la tarde espero un golpe en la puerta, aunque sea una palabra de saludo. La puerta se abre; no es más que un criado con agua, que deja el cuenco y se retira.\n\nCuando la puerta se cierra, la alcoba queda más silenciosa que antes."
 latria_act.0404.a: "Mantener la entereza"
 latria_act.0405.t: "Demasiado para soportarlo"
 latria_act.0405.desc: "No quiero seguir resistiendo. Durante el día el calor se queda en el pecho, y ni la faena más familiar obedece a mis manos.\n\nDe noche el sueño no llega; sigo con los ojos abiertos, oyendo cómo la vela se consume. El calor oprime el pecho y no se va.\n\nNo le veo fin."
 latria_act.0405.a: "Respirar hondo"
 latria_sexual_frustration_collapse_warning_tt: "No puedo aguantar mucho más…"
 latria_act.0405.b: "Soportarlo"
