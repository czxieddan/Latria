l_spanish:
 latria_force_pig_embrace_interaction: "Placer carnal con un cerdo"
 latria_force_pig_embrace_interaction_desc: "Obligar a [recipient.GetShortUINameNoTooltip] a unirse carnalmente con un cerdo ante testigos"

 latria_prison_punishment.0001.t: "Placer carnal con un cerdo"
 latria_prison_punishment.0001.desc: "Los guardias llevan un cerdo que chilla a la mazmorra. [recipient.GetShortUIName] retrocede, pero, a mi orden, [recipient.GetHerHim] obligan a unirse carnalmente con el animal ante los carceleros."
 latria_prison_punishment.0001.a: "Sujetar[recipient.GetHerHim] ahí"

 latria_prison_punishment.0002.t: "Impureza ante todos"
 latria_prison_punishment.0002.desc: "Por orden [puppet_or_actor.GetShortUINamePossessive], los guardias me obligan a unirme carnalmente con un cerdo ante los carceleros reunidos. Cuando me sueltan, la noticia de la condena ya corre de boca en boca."
 latria_prison_punishment.0002.a: "Recordaré esto"

 trait_latria_unclean: "Impuro"
 trait_latria_unclean_desc: "Este personaje fue obligado públicamente a unirse carnalmente con un cerdo y su nombre lleva una mancha imborrable."
 trait_latria_unclean_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] fue obligado públicamente a unirse carnalmente con un cerdo y [ROOT.GetCharacter.GetHerHis] nombre lleva una mancha imborrable."

 nick_latria_the_unclean: "el Impuro"
 nick_latria_the_unclean_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsLocalPlayer, 'sufriste', 'sufrió' )] en la mazmorra un castigo del que todos han oído hablar, y ya nadie quiere sentarse a [Select_CString( CHARACTER.IsLocalPlayer, 'tu', 'su' )] mesa."

 latria_forced_pig_embrace_opinion: "Me obligó a unirme carnalmente con un cerdo"
 latria_pig_embrace_crime: "Placer carnal con un cerdo"
 latria_doctrine_diet_kosher_name: "Comida kosher"
 latria_doctrine_diet_kosher_descriptive_name: "$latria_doctrine_diet_kosher_name$"
 latria_doctrine_diet_kosher_desc: "La ley separa lo puro de lo impuro: solo es puro el rumiante de pezuña hendida; la sangre es la vida, y la leche no comparte mesa con la carne."
 latria_doctrine_diet_halal_name: "Comida halal"
 latria_doctrine_diet_halal_descriptive_name: "$latria_doctrine_diet_halal_name$"
 latria_doctrine_diet_halal_desc: "Las bestias solo se comen si se sacrifican en el nombre de Dios y se les drena la sangre; el cerdo es impuro y jamás cruza nuestros labios."
 doctrine_parameter_latria_diet_forbidden_foods: "La carroña, la sangre y la carne de las bestias prohibidas no pueden comerse"
 doctrine_parameter_latria_pig_embrace_is_crime: "Los personajes con el [trait|lE] [GetTrait('latria_unclean').GetName( GetNullCharacter )] son [criminals|lE]"
