l_spanish:
 latria_sexual_frustration_flavor.1401.t: "Un sello reservado"
 latria_sexual_frustration_flavor.1401.desc.female: "En camisón, doblo una carta una y otra vez junto a la cama. No lleva firma y he tachado el saludo, pero los pliegues son ya demasiado profundos para ocultarlos. En la esquina de la mesa queda lacre caliente. Basta estampar el sello para poner lo que me ocupa esta noche en manos de otra persona.\n\nDesdoblo la carta y me detengo en la línea de la cita. La hora, el lugar, hasta la puerta por la que entrar, todo está claro. De día aún podía decir que eran apuntes sin importancia; ahora el mensajero espera en el corredor y no encuentro una excusa adecuada.\n\nUna tela roza suavemente al otro lado de la puerta. Tomo el sello, mientras la otra mano mantiene cerrada la carta, sin llamar a nadie."
 latria_sexual_frustration_flavor.1401.desc.male: "En camisón, me siento al borde de la cama con el sello en la mano. La carta de la mesa está escrita hasta la última línea. La tinta se ha secado, pero el espacio de la firma sigue vacío. Un sirviente ha preparado el lacre y cerrado la ventana. Al marcharse no ha preguntado por qué aún no descanso.\n\nConozco cada frase y sé cómo la leerá quien reciba la carta. Si añado mi nombre y mi sello, ya no podré presentar la invitación como una broma pasajera. Las palabras tantas veces rehechas en mi mente no me dejan ningún escondite en el papel.\n\nLlevo mucho rato apretando el sello. Lo giro en la posición correcta y miro la luz de la rendija, sin llamar todavía al mensajero."
 latria_sexual_frustration_flavor.1401.desc: "Levanto el sello y vuelvo a dejarlo, sin decidirme a cerrar la carta. El borde está bien doblado, el lacre preparado, y no queda otra tarea en la mesa. Aun así, aliso otra vez una esquina del papel, como si algún pliegue justificase la demora.\n\nLa frase ya está escrita. Por la mañana, quien lleve la carta solo preguntará adónde ir; no decidirá por mí si debo enviarla. Leo la dirección dos veces, pensando en una posible respuesta y también en que quizá no llegue ninguna.\n\nEl lacre comienza a cuajarse en la cucharilla. Lo acerco a la llama, pero mi mano libre vuelve a sujetar la carta contra la mesa."
 latria_sexual_frustration_flavor.1401.a: "Escribir la carta hasta el final y estampar mi sello."
 latria_sexual_frustration_flavor.1401.b: "Guardar el sello, reprimir el anhelo y acostarme."

 latria_sexual_frustration_flavor.1402.t: "El último festín"
 latria_sexual_frustration_flavor.1402.desc.accepted: "El banquete termina, pero aún se habla de amantes, compromisos y placeres antiguos. Alguien se abrocha la capa y se vuelve para añadir el final de una historia; quienes escuchan ríen y piden más vino a los sirvientes. Aquí nadie tiene que bajar la voz para hablar de estas cosas.\n\nYa me había levantado cuando un lugar conocido me hace sentarme de nuevo. También tengo recuerdos allí, aunque nunca los he contado con tanta ligereza. Intento añadir unas palabras; a mi lado dejan la copa y esperan. De pronto, todo lo guardado se me agolpa en los labios.\n\nLos músicos recogen sus instrumentos. Quien nos ha recibido mira la puerta del salón, pero mi abrigo sigue en el respaldo de la silla."
 latria_sexual_frustration_flavor.1402.desc.strict: "Durante el banquete, alguien menciona a un noble caído en desgracia por unos amores secretos. La jarra deja de pasar de mano en mano. Una persona pregunta por su familia; otra murmura que seguramente también se deshará el matrimonio previsto. Desde el extremo de la mesa, escucho cómo resuelven su vida punto por punto.\n\nMi nombre no se ha mencionado. Sin embargo, cuando me preguntan por qué guardo tanto silencio, ni siquiera encuentro mi sonrisa habitual. Las confidencias que pensaba hacer con ayuda del vino podrían, una vez iniciadas, no tener vuelta atrás.\n\nUn sirviente viene a recoger mi plato vacío. Aparto la mano, pero sigo sujetando la copa, sin terminar el último sorbo."
 latria_sexual_frustration_flavor.1402.desc: "Solo al ver a los sirvientes recoger la vajilla comprendo que el banquete llega a su fin. Algunos invitados se despiden junto a la puerta, se pregunta por caballos y carruajes, y mi copa aún está más que medio llena. Las palabras que quería decir nunca han encontrado su momento.\n\nA mi lado, alguien se acomoda la capa y pregunta si salimos juntos. Asiento y después vuelvo a mencionar un recuerdo. Ya he contado el comienzo, pero empiezo otra vez por él, como si acertar con esa frase pudiera impedir que la noche acabara así.\n\nLa mano de mi acompañante se detiene en el broche. Aparto la copa y escucho el eco del salón, mucho más claro que antes."
 latria_sexual_frustration_flavor.1402.a: "Retener a los últimos invitados en la mesa y repetir mis penas una y otra vez."
 latria_sexual_frustration_flavor.1402.b: "Reprimir el pensamiento, dar las gracias a mis anfitriones y despedirme."

 latria_sexual_frustration_flavor.1403.t: "Una confesión sin testigos"
 latria_sexual_frustration_flavor.1403.desc.favors: "Permanezco a solas ante el altar y oigo al último servidor cerrar suavemente la puerta. El libro sagrado sigue abierto en el atril, con una cinta en la página sobre los placeres de la carne. Conozco esas enseñanzas. Mi fe no me exige considerar este deseo un pecado.\n\nPero, en cuanto no queda nadie, no sé por dónde empezar. Las preguntas preparadas durante el día están demasiado cuidadas: evitan precisamente a la persona que tanto quiero ver. Repito una frase, me detengo y luego pronuncio en voz baja el nombre antes oculto tras una forma de dirigirme a ella.\n\nNo hay respuesta en el santuario. Retiro la mano del libro y sigo de rodillas, mirando la luz que mengua bajo la puerta."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Me arrodillo a solas ante el altar. Mi ropa está bien puesta, pero la oración se rompe siempre en el mismo lugar. Al marcharse, el último servidor preguntó si debía dejar una lámpara. Asentí, y ahora solo quedan una llama y un libro sagrado cuya lectura no he terminado.\n\nRecuerdo los preceptos y conozco desde hace tiempo las palabras del arrepentimiento. Pero cada vez que debo renunciar al deseo pienso en la carta que no he destruido. Sé muy bien dónde está: antes de salir de mi habitación la escondí entre páginas que nadie iría a hojear.\n\nNadie me apremia, y aun así resulta más difícil acabar la siguiente frase. Fuera suenan los pasos del relevo. Bajo la cabeza y vuelvo a leer desde el principio."
 latria_sexual_frustration_flavor.1403.desc: "Espero a que se apaguen todos los pasos sin abandonar el altar. Los bancos están alineados, una cinta cuelga del libro sagrado, y junto a la entrada queda una copa vacía olvidada por un servidor. Cuando aún había gente, me parecía imposible decir lo que llevaba dentro.\n\nAhora no hay nadie. Intento contar desde el principio lo que me preocupa. A mitad del relato, me oigo esconderlo de nuevo tras frases conocidas. Me detengo, miro la puerta y lo repito en voz baja. Esta vez no omito aquel nombre.\n\nLa luz cae ante mis rodillas. No me levanto enseguida; escucho cómo esas palabras se apagan lentamente en la sala vacía."
 latria_sexual_frustration_flavor.1403.a: "No hacer más votos de abstinencia y admitir mi elección."
 latria_sexual_frustration_flavor.1403.b: "Contener mi deseo y permanecer de rodillas hasta la oración matinal."

 latria_sexual_frustration_flavor.1404.t: "Dar nombre al anhelo"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Sin ropa, me quedo a solas ante el espejo de bronce de mi alcoba. La túnica está en el respaldo de una silla, los sirvientes se han retirado y he echado el cerrojo con mi propia mano. Mi reflejo no evita la mirada. Por fin dejo de buscar a toda prisa una ocupación insignificante que me distraiga.\n\nEstos días he llamado cansancio, hastío o insomnio tras un banquete a las ganas de ver a esa persona. Cada nuevo nombre ha añadido una línea a la carta de la mesa, que nunca se envía. Sé qué estoy esperando y me cansa borrar cada mañana lo que ya he escrito.\n\nHay una hoja nueva sobre la mesa. La miro y, por primera vez, me pregunto en serio si hacen falta todos esos saludos ceremoniosos al comienzo."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Sin ropa, me siento al borde de la cama, apretando las manos. Mis prendas están cerca y el libro de oraciones sigue fuera. Quería leer un pasaje familiar antes de descansar, pero llevo tanto en la misma línea que hasta he contado mal una vez las llamadas de la guardia.\n\nSi aún guardo mi juramento, no es porque haya dejado de desear la cercanía de alguien. Apenas aparece su nombre, sé que ya no puedo salir del paso diciendo que no tengo pensamientos impuros. Busco la página de mis votos y leo más despacio, intentando distinguir si cada frase sigue siendo una elección mía.\n\nLa página se inmoviliza entre mis dedos. Fuera ya no se oye nada. No cierro el libro ni me apresuro a terminar las palabras que quedan."
 latria_sexual_frustration_flavor.1404.desc: "La noche está muy avanzada. En mi alcoba, por fin admito que todavía quiero ver a esa persona. He corregido la carta de la mesa varias veces; en cada una he borrado la frase esencial, dejando solo el tiempo, los viajes y saludos sin importancia.\n\nExtiendo las hojas una tras otra y contemplo sus comienzos casi idénticos. Son decorosos, pero quien los reciba jamás sabrá por qué tardo tanto en apagar la luz. Escribir otra carta esta noche no supondrá ningún avance si solo cambio la forma de dirigirme a su destinatario.\n\nDejo la pluma junto al papel vacío. Fuera vuelve a sonar la llamada de la guardia. Esta vez no la uso para mandarme a dormir."
 latria_sexual_frustration_flavor.1404.a: "Admitir mi anhelo y dejar de combatirlo esta noche."
 latria_sexual_frustration_flavor.1404.b: "Vestirme de nuevo y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1405.t: "Una página en la crónica"
 latria_sexual_frustration_flavor.1405.desc.emperor: "El cronista se inclina sobre la mesa, esperando que decida qué merece quedar escrito. Estoy detrás, con ropa de ceremonia. La tinta de las recompensas y levas que acabo de dictar aún no se ha secado. Al llegar al ceremonial de mañana, me detengo y menciono aquellas largas noches que nadie registra.\n\nSu pluma no sigue de inmediato. Un asistente cambia de postura junto a la puerta; sé que todos han oído. Creía que, mientras recibiera a la corte como siempre durante el día, el tormento podría quedarse en mi alcoba. Pero cuando el cronista pregunta si debe anotarlo tal cual, ya no puedo negarme por costumbre.\n\nLa página nueva está preparada. La pluma flota sobre el blanco y todos esperan que continúe la frase."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "El copista, sentado a la mesa, pregunta si este tramo del viaje también debe entrar en la crónica. Le digo los pasos de río, los alojamientos y varios retrasos. Los anota y levanta la vista para esperar el lugar siguiente. La carta sin enviar asoma de mi equipaje, junto a mi mano.\n\nNo todas las paradas se debieron a la lluvia o a un eje roto. Tomé un rodeo para volver a ver a alguien, sin contar nunca a mis compañeros la verdadera razón. Ahora leo los lugares del trayecto, tan ordenado, y siento que lo omitido es precisamente lo que más me ha costado dejar atrás.\n\nEl copista moja la pluma. Saco la carta sin abrirla y primero aliso una esquina junto al mapa."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Me arreglo las vestiduras litúrgicas y me acerco al escribano. Preparaba el registro de donaciones y reparaciones; al oír que cambio de asunto, toma otra hoja. El libro sagrado sigue abierto al lado, en el mismo pasaje que he explicado a otras personas durante el día.\n\nEl juramento y el deseo son igualmente ciertos. No quiero describirme como alguien que nunca ha vacilado, y sé que, una vez escritos, estos pensamientos ya no serán solo para mi recuerdo. El escribano pregunta si debe conservar aquel nombre, muy bajo, como si temiera que alguien entendiera desde fuera.\n\nMiro la línea vacía. Las cuentas de oración siguen rodeando mi muñeca. No las muevo para esquivar la pregunta."
 latria_sexual_frustration_flavor.1405.desc.ruler: "El escribano espera mi dictado. Llevo ropa de ceremonia y a mi lado está el sello usado en el consejo. Sin embargo, al acabar los asuntos públicos menciono una historia privada que llevo mucho tiempo guardando. Los sirvientes de la puerta no se retiran. La habitación queda de pronto en silencio.\n\nEmpiezo por una carta antigua y sigo con varios encuentros que no llegaron a suceder. El escribano avanza más despacio, levantando la vista en los pasajes ambiguos. Quería que él escogiera expresiones decorosas; pero, al oír repetir mis palabras, ya no quiero que las convierta en otra historia.\n\nMe entrega la media página copiada. Tomo el papel y detengo la mirada en la primera mención que no oculta nada."
 latria_sexual_frustration_flavor.1405.desc: "Me acerco a la mesa del escribano con la decisión de explicar lo que he callado tanto tiempo. Aparta los documentos oficiales, prepara una hoja y pregunta por dónde empezar. Doy una fecha y me detengo: no fue entonces cuando comenzó realmente.\n\nRetomo una carta, un encuentro breve y varias noches de insomnio posteriores. La pluma avanza suavemente, pero estas palabras ya podrán ser leídas por otra persona de principio a fin. El escribano no juzga; solo espera un poco cuando hablo con ambigüedad y deja un espacio vacío.\n\nLa hoja terminada descansa entre ambos. Aún espera mis órdenes para saber si una tercera persona podrá verla."
 latria_sexual_frustration_flavor.1405.a: "Dejar que circulen las copias para que todos las lean."
 latria_sexual_frustration_flavor.1405.b: "Hacer que el escriba registre solo mis deberes y callarme lo demás."

 latria_sexual_frustration_flavor.1406.t: "Mientras se marchan los invitados"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Los últimos invitados siguen hablando de amantes y compromisos. Apenas menciono mi pasado, alguien suelta una risita al borde de la mesa. Copa en alto, no parece encontrar nada descortés y me apremia, entre sonrisas, a contar qué sucedió después.\n\nEsa historia lleva tanto tiempo conmigo que verla de pronto convertida en diversión para acompañar el vino me deja sin palabras. A mi lado añaden una suposición; otra persona bromea con lo que decía la carta. Quiero corregirles, pero hablo cada vez con más prisa, hasta tener en la lengua detalles que no pensaba mencionar.\n\nUn sirviente viene por la última jarra. Sujeto el borde de mi copa y oigo acercar una silla a la espera de la segunda parte."
 latria_sexual_frustration_flavor.1406.desc.strict: "La noticia de un noble caído por unos amores secretos llega a la mesa antes de que yo termine mi relato. A mi lado preguntan algo en voz baja; otra persona me mira y ríe brevemente. Quien hace un momento asentía ahora solo se ocupa de acomodar su servilleta.\n\nSé que debo parar, pero no quiero que este silencio termine mi historia por mí. Cuanto más intento dejar claro que no tengo relación con ese escándalo, más explicaciones parecen necesitar mis palabras anteriores. En la puerta ya se despiden algunos invitados. Ninguno de quienes quedan me pide que continúe.\n\nDejo la copa con algo más de fuerza de la debida. Las miradas siguen ahí. Debo decidir a quién dirigir la siguiente frase."
 latria_sexual_frustration_flavor.1406.desc: "Los invitados van a marcharse, pero no consigo acabar. Al mencionar una carta antigua, quienes se sientan cerca intercambian miradas y se oye una risita. Me callo y solo entonces descubro que varias personas delante de mí han dejado los cubiertos hace rato y me escuchan únicamente a mí.\n\nQuería explicar por qué aquella frase importaba, pero termino contándola por segunda vez. Alguien asiente por cortesía, alguien mira la puerta, alguien oculta una sonrisa tras la copa. Lo veo todo y me apresuro aún más, como si bastara una última frase para que me comprendieran.\n\nQuien preside la velada ya se ha levantado. Las sillas frente a mí siguen en su sitio, mientras a mi espalda comienzan las despedidas."
 latria_sexual_frustration_flavor.1406.a: "Seguir contando mi historia y responder ante toda la mesa a quien se burle."
 latria_sexual_frustration_flavor.1406.b: "Callarme, inclinarme ante los presentes y despedirme."

 latria_sexual_frustration_flavor.1407.t: "Oración tras la vela"
 latria_sexual_frustration_flavor.1407.desc.favors: "En camisón, junto a la cama, abro el libro de oraciones por la página de los placeres de la carne. Las enseñanzas que de día parecían corrientes las releo ahora varias veces. La puerta está atrancada, los demás se han ido y queda muy poco aceite en la lámpara.\n\nLa fe no me exige negar mi deseo, pero aún no sé cómo afrontar este afecto sin respuesta. Intento decirme las palabras que quisiera pronunciar. Quitados los saludos y las cortesías, las frases restantes son tan breves que me detengo largo rato.\n\nLa llama mengua. Marco la página con la cinta, sin cerrar de inmediato el libro ni seguir buscando otra respuesta."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Me junto los bordes del camisón y repito en voz baja el voto de castidad. La mecha se ha acortado y cada vez cuesta más distinguir las letras en la oscuridad. Continúo leyendo y, cuando me equivoco, regreso al principio, como si la exactitud bastara para atravesar esta noche.\n\nPero a mitad del pasaje vuelven las palabras que esa persona me dijo durante el día. No he olvidado el juramento, como tampoco he olvidado por qué me costaba despedirme. Al poner ambas cosas juntas, las respuestas de siempre dejan de bastar.\n\nLa lámpara va a apagarse. Extiendo la mano para proteger la llama. La frase siguiente está ante mis ojos; la miro mucho tiempo sin pronunciarla."
 latria_sexual_frustration_flavor.1407.desc: "Solo queda una lámpara a punto de apagarse y aún no he cerrado los ojos. El libro de oraciones descansa en mis rodillas, abierto por una página ya leída varias veces. Fuera pasa un guardia nocturno. Sus pasos desaparecen tras la esquina, pero sigo esperando el siguiente.\n\nAcerco un poco el libro a la luz para buscar dónde me detuve. La línea no tiene palabras difíciles. Conozco la razón: cada final me devuelve a una pregunta que debía haber aclarado durante el día. Ahora nadie puede responder, pero sigo imaginando la respuesta de la otra persona.\n\nEl último aceite brilla en el fondo. Coloco la cinta y dejo la mano en la cubierta, sin soplar la lámpara."
 latria_sexual_frustration_flavor.1407.a: "Apartar el voto de castidad y pensar en aquel afecto."
 latria_sexual_frustration_flavor.1407.b: "Contener mis pensamientos y recitar hasta el amanecer."

 latria_sexual_frustration_flavor.1408.t: "Silencio ante el espejo"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Sin ropa, permanezco a solas ante el espejo. Las prendas que me quité durante el día están junto a la cama; la invitación de la mesa ocupa media página. Antes siempre me arreglaba ante este espejo, preparando qué decir cuando viera a esa persona. Al encontrarnos, sin embargo, solo hablaba de cosas corrientes.\n\nYa ha habido suficientes vueltas. No quiero seguir llamando pensamiento casual a un deseo duradero ni esperar, en cada encuentro, a que la otra persona hable primero. Junto al espejo está sujeta la carta sin terminar. Al final queda sitio para una frase clara.\n\nMe vuelvo hacia el escritorio y miro la tinta seca de la pluma. Fuera nadie me apremia. Esta vez tampoco hay asuntos de gobierno que respondan por mí."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Sin ropa, me siento al borde de la cama con las manos apretadas. Junto al espejo, mis prendas están bien dobladas, con el libro de oraciones encima. He terminado el capítulo debido, pero no llega la calma habitual. Cuanto más calla la habitación, más difícil es pasar por alto aquel afecto.\n\nLa castidad sigue siendo mi elección. Pero no quiero hablar de perseverar como si fuera fácil, como si leer el libro sagrado significara no haber pensado jamás en otra cosa. Ordeno mentalmente las tareas de mañana; al llegar a la hora de ver a esa persona, me detengo y empiezo a ordenarlas de nuevo.\n\nMi reflejo también sigue sentado. Aflojo las manos y miro la pluma junto a la mesa, deseando dejar constancia fiel de esta vacilación."
 latria_sexual_frustration_flavor.1408.desc: "En el silencio miro mi reflejo. Sobre la mesa sigue extendida la carta sin terminar. Ya no necesito la sonrisa con la que disimulo durante el día. Vuelvo al borde de la cama y repaso aquel encuentro breve desde el principio.\n\nNinguna palabra fue una promesa y nadie me pidió que siguiera esperando. De los significados añadidos después, ¿cuántos venían de la otra persona y cuántos de mí? Por fin acepto distinguirlos uno a uno. Comprenderlo no hace que el deseo desaparezca de inmediato.\n\nMuevo el papel un poco hacia la luz. Al menos la línea todavía por escribir debería expresar claramente lo que yo tengo que decir."
 latria_sexual_frustration_flavor.1408.a: "Admitir este deseo y dejar de huir de él esta noche."
 latria_sexual_frustration_flavor.1408.b: "Vestirme, sentarme al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1409.t: "Una falta de compostura en la corte"
 latria_sexual_frustration_flavor.1409.desc: "Durante una pausa de la audiencia, me quito la ropa en una estancia lateral, buscando calmarme con un instante de soledad. Mi túnica sigue en manos de un sirviente cuando se abre la puerta del salón del consejo. Alzo la cabeza. Las conversaciones de la mesa larga han cesado; varios vasallos permanecen inmóviles a medio volverse.\n\nEl escribano baja los ojos y recoge un poco la hoja que estaba escribiendo. Quienes están en la puerta quieren retroceder, pero temen estorbar al sirviente con mi ropa. Nadie se mueve primero. Debería hablar enseguida, pero la voz sale tensa y las órdenes preparadas no se convierten en frases.\n\nPor fin el sirviente acerca la túnica. Sobre la mesa siguen los asuntos pendientes. Todos esperan que decida cómo continuar."
 latria_sexual_frustration_flavor.1409.a: "Permanecer ante ellos sin intentar ocultar mi falta."
 latria_sexual_frustration_flavor.1409.b: "Despedir a los señores y vestirme antes de reanudar el consejo."

 latria_sexual_frustration_flavor.1410.t: "La noche tras la puerta"
 latria_sexual_frustration_flavor.1410.desc.female: "En camisón, me siento junto a la puerta y escucho cómo se alejan los pasos. Alguien devuelve una llave en el corredor y da las buenas noches en voz baja. Podría haber llamado a una de esas personas para pedirle que llevase una carta por la mañana. Las voces se apagan sin que yo diga nada.\n\nVuelve aquel afecto sin respuesta. El borrador de la mesa tiene demasiadas palabras irrelevantes y no aclara lo único necesario: qué respuesta deseo. Me pongo el papel en las rodillas, leo desde el comienzo y por fin tacho aquel saludo corriente en el que ni yo misma creo.\n\nFuera reina el silencio. Llevo la pluma al espacio vacío. Antes de apoyarla, ya sé que esta carta me ocupará más tiempo que las anteriores."
 latria_sexual_frustration_flavor.1410.desc.male: "En camisón, me apoyo en la cabecera de la cama sin haber pasado una sola página del libro a mi lado. Fuera se hace el silencio y la lámpara ilumina el mismo pasaje, pero sigo pensando en la conversación que acabó demasiado pronto. Al despedirme dije que continuaríamos otro día; recibí tan solo una respuesta cortés.\n\nHe recurrido demasiadas veces a ese otro día. Siempre creo que en el próximo encuentro podré hablar con claridad. Después, a solas, solo me queda adivinar si la respuesta educada tenía otro sentido. Avanzo el marcapáginas una hoja y descubro que ni siquiera recuerdo la anterior.\n\nTodavía hay papel y pluma en la mesa. Cierro el libro, lo dejo en las rodillas y contemplo la rendija ya oscura bajo la puerta."
 latria_sexual_frustration_flavor.1410.desc: "La larga noche no termina. Tras la puerta cerrada, escucho alejarse los últimos pasos. La carta de la mesa sigue sin acabar, el libro junto a la cama permanece abierto. Las dos ocupaciones con las que intentaba pasar el tiempo se han quedado a medias.\n\nMe leo las líneas escritas. Las frases son sencillas, pero dejan escapatorias por todas partes; ni al final se sabe qué respuesta espero de esa persona. Si continúo así y envío la carta mañana, solo tendré una cosa más que esperar.\n\nSaco una hoja nueva y la sujeto bajo el libro. La lámpara aún ilumina lo suficiente para ver dónde debe empezar la primera línea."
 latria_sexual_frustration_flavor.1410.a: "Apartar el libro y escribir una larga carta."
 latria_sexual_frustration_flavor.1410.b: "Reprimir el anhelo, apagar la lámpara y acostarme."

 latria_sexual_frustration_flavor.1401.c: "Convertir en poema la invitación que no puedo enviar."
 latria_sexual_frustration_flavor.1402.c: "Pagar a los músicos para que toquen para los invitados restantes."
 latria_sexual_frustration_flavor.1402.d: "Pedir a los invitados que se queden a hablar de sus antiguos viajes."
 latria_sexual_frustration_flavor.1403.c: "Abrir las escrituras y buscar una respuesta en cada pasaje."
 latria_sexual_frustration_flavor.1404.c: "Abandonar mi voto de castidad y seguir mis deseos en adelante."
 latria_sexual_frustration_flavor.1404.d: "Ponerme el camisón y sentarme hasta que mis pensamientos se calmen."
 latria_sexual_frustration_flavor.1405.c: "Convertir mi relato en una carta privada y sellarla en un estuche."
 latria_sexual_frustration_flavor.1405.d: "Hacer voto de castidad ante estos testigos."
 latria_sexual_frustration_flavor.1406.c: "Recitar un poema nuevo a los invitados que se marchan."
 latria_sexual_frustration_flavor.1407.c: "Cerrar el libro de oraciones y meditar mis sentimientos despacio."
 latria_sexual_frustration_flavor.1408.c: "Enumerar los deberes de la mañana y ordenar todos los documentos."
 latria_sexual_frustration_flavor.1409.c: "Vestirme, volver a la mesa y resolver cada asunto de la corte."
 latria_sexual_frustration_flavor.1409.d: "Vestirme, bromear e invitar a los señores a sentarse de nuevo."
 latria_sexual_frustration_flavor.1410.c: "Ponerme una túnica, preparar té y sentarme hasta que pueda dormir."
