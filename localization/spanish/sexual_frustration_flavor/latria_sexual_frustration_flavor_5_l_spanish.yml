l_spanish:
 latria_sexual_frustration_flavor.1401.t: "Un sello reservado"
 latria_sexual_frustration_flavor.1401.desc.female: "En camisón, doblo una carta una y otra vez junto a la cama. No lleva nombre, solo un sello que aún no me he atrevido a estampar."
 latria_sexual_frustration_flavor.1401.desc.male: "En camisón, me siento al borde de la cama con un sello en la mano. Si escribo esas palabras, ya no podré fingir que nunca las pensé."
 latria_sexual_frustration_flavor.1401.desc: "Levanto el sello y vuelvo a dejarlo, sin tocar la página."
 latria_sexual_frustration_flavor.1401.a: "Escribir la carta hasta el final y estampar mi sello."
 latria_sexual_frustration_flavor.1401.b: "Guardar el sello, reprimir el anhelo y acostarme."

 latria_sexual_frustration_flavor.1402.t: "El último festín"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Antes de que termine el festín, los invitados aún hablan abiertamente de amantes, esponsales y viejos placeres. Ya no consigo tomar sus palabras por una charla ociosa."
 latria_sexual_frustration_flavor.1402.desc.strict: "Alguien nombra a un noble que perdió el favor por un romance indiscreto y la mesa queda en silencio. Sé que podrían juzgarme del mismo modo."
 latria_sexual_frustration_flavor.1402.desc: "Las mesas están revueltas y los invitados se marchan, pero el pensamiento que llevo dentro se hace más fuerte."
 latria_sexual_frustration_flavor.1402.a: "Retener a los últimos invitados en la mesa y repetir mis penas una y otra vez."
 latria_sexual_frustration_flavor.1402.b: "Reprimir el pensamiento, dar las gracias a mis anfitriones y despedirme."

 latria_sexual_frustration_flavor.1403.t: "Una confesión sin testigos"
 latria_sexual_frustration_flavor.1403.desc.favors: "El altar está vacío. Recuerdo que mi fe permite el placer carnal, pero sigo sin saber cómo aplacar esta urgencia."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Me arrodillo a solas ante el altar, con la ropa en orden, pero la oración se interrumpe siempre en las mismas palabras. Si nadie me oye, ¿he quebrantado mi voto de todos modos?"
 latria_sexual_frustration_flavor.1403.desc: "El santuario está vacío. Todavía no me he ido."
 latria_sexual_frustration_flavor.1403.a: "No hacer más votos de abstinencia y admitir mi elección."
 latria_sexual_frustration_flavor.1403.b: "Contener mi deseo y permanecer de rodillas hasta la oración matinal."

 latria_sexual_frustration_flavor.1404.t: "Dar nombre al anhelo"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Sin ropa y a solas ante el espejo de la alcoba, no aparto la mirada de mi reflejo. Me cansa llamar al deseo una debilidad pasajera."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Sin ropa y a solas junto a la cama, entrelazo las manos. Si mantengo mi voto, no será porque este anhelo haya desaparecido."
 latria_sexual_frustration_flavor.1404.desc: "La noche está avanzada. Al fin dejo de ocultarme mi propio deseo."
 latria_sexual_frustration_flavor.1404.a: "Admitir mi anhelo y dejar de combatirlo esta noche."
 latria_sexual_frustration_flavor.1404.b: "Vestirme de nuevo y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1405.t: "Una página en la crónica"
 latria_sexual_frustration_flavor.1405.desc.emperor: "El cronista espera a que decida qué merece recordarse. Con las ropas de ceremonia, detrás de él, comprendo que el silencio no hará desaparecer este tormento."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "El escriba se sienta a la mesa y pregunta si esta parte del viaje debe entrar en la crónica. Miro la carta sin enviar y sé que estas palabras viajarán conmigo."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Me pongo las vestiduras y me presento ante el escriba. El voto y el deseo son verdaderos; no dejaré que otro decida cuál merece ser recordado."
 latria_sexual_frustration_flavor.1405.desc.ruler: "El escribano espera para registrar mis palabras. Con las ropas de ceremonia, ante mis sirvientes, hablo de lo que he mantenido enterrado."
 latria_sexual_frustration_flavor.1405.desc: "Decido dejar de guardar este asunto para mí."
 latria_sexual_frustration_flavor.1405.a: "Dejar que circulen las copias para que todos las lean."
 latria_sexual_frustration_flavor.1405.b: "Hacer que el escriba registre solo mis deberes y callarme lo demás."

 latria_sexual_frustration_flavor.1406.t: "Mientras se marchan los invitados"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Los últimos invitados siguen hablando de amantes y esponsales. Apenas he empezado una vieja historia mía cuando alguien en la mesa suelta una risita."
 latria_sexual_frustration_flavor.1406.desc.strict: "Llega a la mesa la noticia de un noble que perdió el favor por un romance indiscreto. Antes de que pueda callarme, mis vecinos empiezan a susurrar y alguien se ríe."
 latria_sexual_frustration_flavor.1406.desc: "Los invitados se marchan, pero yo sigo hablando. Mis vecinos cruzan una mirada y alguien en la mesa suelta una risita."
 latria_sexual_frustration_flavor.1406.a: "Seguir contando mi historia y responder ante toda la mesa a quien se burle."
 latria_sexual_frustration_flavor.1406.b: "Callarme, inclinarme ante los presentes y despedirme."

 latria_sexual_frustration_flavor.1407.t: "Oración tras la vela"
 latria_sexual_frustration_flavor.1407.desc.favors: "En camisón junto a la cama, recuerdo que mi fe no niega los placeres de la carne. A solas, sigo sin saber cómo serenarme."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Me ciño el camisón y repito mi voto de castidad. La vela se consume, pero el anhelo interior no se desvanece."
 latria_sexual_frustration_flavor.1407.desc: "Solo queda una vela moribunda en la alcoba y sigo en vela."
 latria_sexual_frustration_flavor.1407.a: "Apartar el voto de castidad y pensar en aquel afecto."
 latria_sexual_frustration_flavor.1407.b: "Contener mis pensamientos y recitar hasta el amanecer."

 latria_sexual_frustration_flavor.1408.t: "Silencio ante el espejo"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Sin ropa y a solas ante el espejo, ya no puedo llamar a este anhelo un pensamiento pasajero. Tampoco quiero seguir fingiendo."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Sin ropa junto a la cama, entrelazo las manos. La castidad sigue siendo mi elección, aunque nunca había resultado tan difícil."
 latria_sexual_frustration_flavor.1408.desc: "En el silencio, miro mi reflejo y dejo de evitar lo que llevo en el corazón."
 latria_sexual_frustration_flavor.1408.a: "Admitir este deseo y dejar de huir de él esta noche."
 latria_sexual_frustration_flavor.1408.b: "Vestirme, sentarme al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1409.t: "Una falta de compostura en la corte"
 latria_sexual_frustration_flavor.1409.desc: "Durante una pausa del consejo, me desvisto en la cámara contigua. Antes de que pueda ponerme la túnica, se abre la puerta del salón del consejo. Los señores callan y el escribano baja la mirada; se me quiebra la voz mientras el sirviente espera con la túnica."
 latria_sexual_frustration_flavor.1409.a: "Permanecer ante ellos sin intentar ocultar mi falta."
 latria_sexual_frustration_flavor.1409.b: "Despedir a los señores y vestirme antes de reanudar el consejo."

 latria_sexual_frustration_flavor.1410.t: "La noche tras la puerta"
 latria_sexual_frustration_flavor.1410.desc.female: "En camisón, me siento junto a la puerta y oigo alejarse los pasos de fuera. A estas horas, el afecto que no encontró respuesta vuelve a mí."
 latria_sexual_frustration_flavor.1410.desc.male: "En camisón, me apoyo en la cama, con el libro aún sin abrir. El pasillo está en silencio, pero el sueño no llega."
 latria_sexual_frustration_flavor.1410.desc: "La noche es larga. Nada se mueve tras la puerta y mis pensamientos no se calman."
 latria_sexual_frustration_flavor.1410.a: "Apartar el libro y escribir una larga carta."
 latria_sexual_frustration_flavor.1410.b: "Reprimir el anhelo, apagar la lámpara y acostarme."

 latria_sexual_frustration_flavor.1401.c: "Convertir en poema la invitación que no puedo enviar."
 latria_sexual_frustration_flavor.1402.c: "Pagar a los músicos para que toquen para los invitados restantes."
 latria_sexual_frustration_flavor.1402.d: "Pedir a los invitados que se queden a hablar de sus antiguos viajes."
 latria_sexual_frustration_flavor.1403.c: "Abrir las escrituras y buscar una respuesta en cada pasaje."
 latria_sexual_frustration_flavor.1404.c: "Abandonar mi voto de castidad y seguir mis deseos en adelante."
 latria_sexual_frustration_flavor.1404.d: "Ponerme el camisón y sentarme hasta que mis pensamientos se calmen."
 latria_sexual_frustration_flavor.1405.c: "Convertir mi relato en una carta privada y sellarla en un estuche."
 latria_sexual_frustration_flavor.1405.d: "Hacer voto de castidad ante estos testigos."
 latria_sexual_frustration_flavor.1406.c: "Recitar un poema nuevo a los invitados que se marchan."
 latria_sexual_frustration_flavor.1407.c: "Cerrar el libro de oraciones y meditar mis sentimientos despacio."
 latria_sexual_frustration_flavor.1408.c: "Enumerar los deberes de la mañana y ordenar todos los documentos."
 latria_sexual_frustration_flavor.1409.c: "Vestirme, volver a la mesa y resolver cada asunto de la corte."
 latria_sexual_frustration_flavor.1409.d: "Vestirme, bromear e invitar a los señores a sentarse de nuevo."
 latria_sexual_frustration_flavor.1410.c: "Ponerme una túnica, preparar té y sentarme hasta que pueda dormir."
