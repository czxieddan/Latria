l_spanish:
 latria_sexual_frustration_flavor.1111.t: "La segunda vigilia"
 latria_sexual_frustration_flavor.1111.desc: "Me despierto en la segunda vigilia con la sábana enrollada en una pantorrilla. La lámpara se ha consumido hasta una llama del tamaño de un pulgar. Mi mano ya está baja sobre el vientre, tibia por mi propio cuerpo, y la retiro.\n\nHubo un instante al anochecer. Alguien se inclinó por delante de mí para alcanzar la sal, y un antebrazo rozó el dorso de mi muñeca, y ninguno de los dos se movió durante lo que dura un respiro. He repasado ese respiro más veces que la conversación entera.\n\nAprieto la palma plana sobre el jergón, junto a mi cadera. El lino de allí sigue fresco. Lo dejo fresco."
 latria_sexual_frustration_flavor.1111.a: "Dejar que mi mano vaya donde quiera."
 latria_sexual_frustration_flavor.1111.b: "Volverme y esperar el sueño."
 latria_sexual_frustration_flavor.1111.c: "No moverme y escuchar cómo se asienta la casa."

 latria_sexual_frustration_flavor.1112.t: "La copa entre nosotros"
 latria_sexual_frustration_flavor.1112.desc: "La copa va de mano en mano por el banco, y cuando me llega el borde aún está mojado de otra boca. Bebo donde está lo mojado. Al otro lado de la mesa alguien me mira hacerlo, y no aparta la vista, y tampoco sonríe.\n\nHablamos un rato de caballos, del precio de una yegua baya, del herrador del cruce. Bajo la mesa una rodilla viene a posarse contra la mía, sin peso detrás, solo el contacto, y yo sigo hablando de caballos.\n\nUn sirviente llena la copa. La rodilla se retira para saludar a un tío. Sostengo la copa con las dos manos y el vino se ha entibiado, y el banco a mi lado sigue vacío el resto de la comida."
 latria_sexual_frustration_flavor.1112.a: "Decir sin rodeos lo que decía la rodilla."
 latria_sexual_frustration_flavor.1112.b: "Dar las gracias a la compañía y retirarme temprano."
 latria_sexual_frustration_flavor.1112.c: "Quedarme, y hablar de caballos hasta que el salón se vacíe."

 latria_sexual_frustration_flavor.1113.t: "Una danza demasiado larga"
 latria_sexual_frustration_flavor.1113.desc: "La música gira y me pasan de una pareja a la siguiente. La tercera me sostiene la mano un tiempo por encima de la figura, el pulgar apretado contra la cara interna de mi muñeca, donde está el pulso, y sonríe como si fuera un accidente. Fallo el paso siguiente y lo cubro con una vuelta.\n\nAlguien se ríe en el extremo opuesto del salón. No me vuelvo a ver quién. Me arde la cara y sé que se nota a la luz de las velas, y las velas son la única luz honrada de la sala.\n\nLa serie termina. Me quedo de pie junto a la columna con la mano aún medio cerrada, la forma de aquel pulgar impresa en la piel, y los músicos empiezan otra vez."
 latria_sexual_frustration_flavor.1113.a: "Brindar por esa pareja, en voz alta, ante todo el salón."
 latria_sexual_frustration_flavor.1113.b: "Hacer una reverencia a la compañía y dejar el baile."
 latria_sexual_frustration_flavor.1113.c: "Buscar el rincón más silencioso y respirar despacio."

 latria_sexual_frustration_flavor.1114.t: "El largo regreso a caballo"
 latria_sexual_frustration_flavor.1114.desc: "Lluvia en las hojas, y el ciervo perdido hace una hora. Cabalgo al final, con la charla de los ojeadores apagándose por delante. Me duelen los muslos de la silla de un modo que no me dejará olvidar mi cuerpo antes de la noche, y la lana mojada de la capa está fría en el cuello.\n\nEn el arroyo, quien va a caballo a mi lado me sostiene la brida, y la mano se queda en la correa después de que el animal se haya calmado. El agua resbala del extremo de una trenza. Ninguno de los dos menciona la lluvia.\n\nSeguimos cabalgando. El cuero mojado cruje a cada paso, y cuento los crujidos en lugar de pensar, y pierdo la cuenta en algún punto más allá del tercer campo."
 latria_sexual_frustration_flavor.1114.a: "Dejar que la cacería siga hasta que se vaya la luz."
 latria_sexual_frustration_flavor.1114.b: "Mantener los ojos en el rastro y las manos en las riendas."
 latria_sexual_frustration_flavor.1114.c: "Leer el suelo, los tallos quebrados, la huella de un casco."
 latria_sexual_frustration_flavor.1114.d: "Soltar el halcón otra vez, y otra."

 latria_sexual_frustration_flavor.1115.t: "De rodillas a la tercera hora"
 latria_sexual_frustration_flavor.1115.desc: "Me arrodillo hasta que me duelen las rodillas sobre la piedra, y ese dolor es lo único que puedo retener en la atención. El aceite de la lámpara se ha enranciado. Mi cuerpo no quiere callar esta mañana. Quiere, y quiere en dirección a alguien que arregla las vigas del techo y silba mientras trabaja.\n\nDigo el oficio. Lo empiezo de nuevo desde el principio porque mi mente se deslizó en la cuarta línea. Alguien tose detrás de mí y no me vuelvo.\n\nLa piedra está fría a través del hábito. Me quedo abajo después de que los demás se alcen, y el frío me llega a las espinillas, y no basta."
 latria_sexual_frustration_flavor.1115.a: "Nombrarlo en el confesionario y cumplir penitencia después."
 latria_sexual_frustration_flavor.1115.b: "Mantener la vigilia hasta la campana."
 latria_sexual_frustration_flavor.1115.c: "Tomar el comentario y leer hasta el final del capítulo."

 latria_sexual_frustration_flavor.1116.t: "Lo que el capellán no preguntó"
 latria_sexual_frustration_flavor.1116.desc: "Mi capellán recorre el claustro a mi lado y no pregunta nada, lo cual es peor que preguntar. Yo hablo del pecado de la pereza y responde sobre la cosecha, la lluvia que llegó tarde, el precio del centeno.\n\nEl puño de la manga está deshilachado. Miro moverse los hilos sueltos mientras gesticula y pienso en la muñeca dentro de la manga, y luego otra vez en la pereza, y pierdo la cosecha por completo. Se detiene para que lo alcance.\n\nEn la puerta me bendice. Le retengo la mano un instante más allá de la bendición. Lo permite, y luego baja los escalones de dos en dos."
 latria_sexual_frustration_flavor.1116.a: "Decirlo todo."
 latria_sexual_frustration_flavor.1116.b: "Pedir una penitencia y cumplirla."
 latria_sexual_frustration_flavor.1116.c: "Escuchar lo que dice de la cosecha."

 latria_sexual_frustration_flavor.1117.t: "La petición tras el consejo"
 latria_sexual_frustration_flavor.1117.desc: "El consejo se vacía. Mi canciller se queda para insistir en una petición más, y yo oigo la forma de su boca en torno a las palabras en lugar de las palabras. El sello está tibio de mi propia mano y la cera no ha cuajado.\n\nNo he estado a solas con nadie desde el banquete. La corona es un peso en la nuca, y la nuca quiere un peso distinto, una mano allí en lugar de oro.\n\nConcedo la petición. Se inclina. Mantengo los ojos en el mapa hasta que la puerta se cierra, y luego en la puerta, y la vela junto al mapa se consume mientras yo no me muevo."
 latria_sexual_frustration_flavor.1117.a: "Mandar llamar a alguien cuando las velas se apaguen."
 latria_sexual_frustration_flavor.1117.b: "Mantener el trabajo hasta que la petición esté sellada."
 latria_sexual_frustration_flavor.1117.c: "Leer por mi cuenta las tres peticiones siguientes."

 latria_sexual_frustration_flavor.1118.t: "Vino de ciruelas en la terraza"
 latria_sexual_frustration_flavor.1118.desc: "Vino de ciruelas, la tercera copa, y las mangas no dejan de rozarse. Entre mi gente hablamos en versos, cada verso un paso más cerca, y un sirviente permanece junto a la balaustrada fingiendo no escuchar.\n\nDejo que mi manga caiga abierta en la muñeca. La otra manga no retrocede. En algún lugar bajo la terraza una flauta empieza, se detiene y vuelve a empezar, las mismas tres frases.\n\nPongo la copa en la balaustrada, a medio terminar, y el vino guarda lo último de la luz. Ninguno de los dos ha dicho la cosa llana. Un pétalo se da la vuelta sobre la losa. El sirviente de la balaustrada sigue sin escuchar."
 latria_sexual_frustration_flavor.1118.a: "Responder con un verso que no pueda confundirse."
 latria_sexual_frustration_flavor.1118.b: "Arreglar mi manga y hablar del tiempo."
 latria_sexual_frustration_flavor.1118.c: "Recorrer la terraza a solas hasta que enciendan las lámparas."

 latria_sexual_frustration_flavor.1119.t: "La lámpara que quedó encendida"
 latria_sexual_frustration_flavor.1119.desc: "He dejado la lámpara encendida y la sábana está a la altura de mi cintura. Mi mano recorre la piel tibia del vientre, más abajo, y esta vez no la detengo. Ya hay humedad en mí, por el pensamiento de una boca en mi garganta al anochecer, y mis dedos resbalan con facilidad.\n\nPienso en el peso de un cuerpo sobre el mío, el peso exacto, y mis caderas se alzan para encontrar la nada. Presiono y hago círculos y mi aliento se vuelve áspero en la habitación callada. El talón de mi mano se frota donde quiero.\n\nLlega en un largo estremecimiento que deja mi muslo temblando. Después me quedo con el brazo sobre los ojos, la lámpara todavía encendida, la sábana húmeda debajo."
 latria_sexual_frustration_flavor.1119.a: "Dejar que termine, y quedarme en la oscuridad húmeda."
 latria_sexual_frustration_flavor.1119.b: "Retirar la mano y contar las vigas."
 latria_sexual_frustration_flavor.1119.c: "Despabilar la lámpara y quedarme a oscuras."

 latria_sexual_frustration_flavor.1120.t: "La alcoba de la visita"
 latria_sexual_frustration_flavor.1120.desc: "Un golpe en la puerta después de que el salón quede a oscuras, y cuando abro estoy en camisón y no me he vestido para nadie. Veo la mirada que me recorre el cuerpo y no busco un manto.\n\nNo fingimos. Una boca encuentra mi garganta, mis manos están en un cinturón, y cuando esa persona me alza sobre la mesa la copa se vuelca y rueda. El ritmo es lento y yo no tengo paciencia. Oigo mi propia voz, lo cual me sorprende, y la risa contra mi cuello, y el ritmo no cambia.\n\nDespués el vino gotea del borde de la mesa al suelo, una gota cada vez. Ninguno de los dos se mueve para limpiarlo."
 latria_sexual_frustration_flavor.1120.a: "Dejar la puerta sin cerrojo y el camisón puesto."
 latria_sexual_frustration_flavor.1120.b: "Dar las gracias con amabilidad y cerrar la puerta."
 latria_sexual_frustration_flavor.1120.c: "Sentarme en el borde de la mesa y hablar hasta el alba."

 latria_sexual_frustration_flavor.1121.t: "Detrás del biombo pintado"
 latria_sexual_frustration_flavor.1121.desc: "El banquete ha pasado de la compostura. Han corrido un biombo en el rincón del salón y el ruido que hay detrás no es el ruido de comer. Una mano se cierra en mi muñeca y me dejo llevar, y las garzas pintadas en el biombo pasan lo bastante cerca para tocarlas.\n\nHay más manos que las de una sola persona. Dejo de contar. Los juncos están pisoteados y una copa rueda contra mi rodilla y nadie la recoge.\n\nMás tarde estoy contra el muro con el pelo suelto y la boca hinchada, una capa ajena sobre los hombros. La música no ha parado."
 latria_sexual_frustration_flavor.1121.a: "Pasar detrás del biombo y dejar que el salón oiga."
 latria_sexual_frustration_flavor.1121.b: "Negarme, y conservar mi copa y mi asiento."
 latria_sexual_frustration_flavor.1121.c: "Sacar el tablero y jugar hasta que mis manos estén firmes."

 latria_sexual_frustration_flavor.1122.t: "Cuatro palabras de un poema"
 latria_sexual_frustration_flavor.1122.desc: "La tablilla de escribir está sobre mis rodillas y la pluma de caña se ha secado. He escrito cuatro palabras de un poema sobre la curva de un hombro y ninguna de las cuatro es la justa. La quinta es peor.\n\nLa habitación está fría. Mi propia respiración suena fuerte en ella. Dejo la tablilla a un lado y aprieto el dorso de la mano contra la boca, y el deseo no va a ninguna parte, solo cambia de forma y se asienta más abajo.\n\nTomo otra vez la pluma. El verso queda sin terminar y la tinta se seca en la hendidura de la caña, y el hombro del verso sigue siendo solo un hombro."
 latria_sexual_frustration_flavor.1122.a: "Escribir el hombro, y el resto."
 latria_sexual_frustration_flavor.1122.b: "Cerrar la tablilla y quedarme con las manos quietas."
 latria_sexual_frustration_flavor.1122.c: "Leer algo tedioso hasta que la habitación sea solo una habitación."
 latria_sexual_frustration_flavor.1122.d: "Recitar el verso sin terminar durante la cena."

 latria_sexual_frustration_flavor.1123.t: "El peso del halcón"
 latria_sexual_frustration_flavor.1123.desc: "El halcón encapuchado se posa en mi guante y su peso es lo único honrado esta mañana. Esperamos en la hierba mojada a la garza. Me arde el hombro y el cuero se ha empapado en el pulgar.\n\nUn brazo viene contra el mío al agacharnos, y se queda. El ave cambia las patas. Mantengo los ojos en los juncos. Mi pulso está en mis oídos, más fuerte que el marjal, y tengo la certeza de que se oye.\n\nLa garza no viene nunca. Volvemos con el halcón en el puño y la hierba empapándome las botas hasta el tobillo, y ninguno de los dos dice nada del brazo."
 latria_sexual_frustration_flavor.1123.a: "Salir otra vez a caballo y cazar hasta que oscurezca."
 latria_sexual_frustration_flavor.1123.b: "No moverme, y dejar que el marjal quede en silencio."
 latria_sexual_frustration_flavor.1123.c: "Soltar el halcón y mirar solo el halcón."

 latria_sexual_frustration_flavor.1124.t: "La caja de las limosnas"
 latria_sexual_frustration_flavor.1124.desc: "Cuento monedas en la caja de las limosnas y contar es una manera de no pensar. Cobre, sobre todo, y dos peniques de plata del mercader de lana. La mano de alguien que da está en la caja junto a la mía, nuestros dedos entre las monedas, y el sacerdote nos mira a los dos desde el tercer escalón.\n\nNo he confesado esto. No sé qué nombre le daría. Mi rostro está compuesto. He practicado la compostura ante un espejo.\n\nLa mano se retira. Cierro la tapa y el pequeño cerrojo de latón chasquea, y mi propia mano no está firme sobre la llave, y el sacerdote sigue en el escalón."
 latria_sexual_frustration_flavor.1124.a: "Pagar una vela y dejar que el sacerdote me vea el rostro."
 latria_sexual_frustration_flavor.1124.b: "Mantener la vigilia hasta que las velas chisporroteen."
 latria_sexual_frustration_flavor.1124.c: "Leer el salterio completo una vez más."

 latria_sexual_frustration_flavor.1125.t: "Tratos acordados a medianoche"
 latria_sexual_frustration_flavor.1125.desc: "Llevamos con el tratado desde el mediodía. Las velas son churretes y el fuego se ha dejado apagar. Mi contraparte lee en voz alta la última cláusula y yo asiento sin oírla, por el modo en que una mandíbula se mueve alrededor de una lengua que no es la mía.\n\nEsta no es la primera noche. Conozco la distancia exacta a la que dejo de servir, y estamos dentro de ella desde la segunda vela.\n\nFirmo. Firma. La cera sigue blanda cuando aprieto mi anillo en ella, y mi mano está firme, y el escribiente se lleva la página, y eso es toda mi victoria."
 latria_sexual_frustration_flavor.1125.a: "Enviar una nota cuando la sala esté vacía."
 latria_sexual_frustration_flavor.1125.b: "Ceñirme a la cláusula, palabra por palabra."
 latria_sexual_frustration_flavor.1125.c: "Llevarme el tratado y leer cada línea."

 latria_sexual_frustration_flavor.1126.t: "Hierba, viento y un cuello abierto"
 latria_sexual_frustration_flavor.1126.desc: "Los caballos sueltos pastan y nos sentamos en el fieltro con las sillas aún puestas. La gente de mi acompañante dice que un jinete debe poder dormir en la silla. Yo ni siquiera puedo tener el cuerpo quieto en el suelo.\n\nHablan de un río que nunca he visto, un río con tres vados. Una camisa está abierta en el cuello. El viento mueve la hierba en largos barridos y yo miro el cuello en lugar del río.\n\nUn caballo resopla. Aparto la vista primero, y las orejas me arden con el viento, y la charla del río sigue sin mí."
 latria_sexual_frustration_flavor.1126.a: "Decirlo en voz alta, en esta lengua, mal."
 latria_sexual_frustration_flavor.1126.b: "Morderme la lengua y mirar los caballos."
 latria_sexual_frustration_flavor.1126.c: "Cabalgar fuerte hasta que el viento me lo saque del cuerpo."

 latria_sexual_frustration_flavor.1127.t: "El hueco en la almohada"
 latria_sexual_frustration_flavor.1127.desc.female: "La cama está demasiado caliente y he arrojado la colcha al suelo. El camisón se me ha subido hasta la cadera. Pongo la mano allí y mi cuerpo responde antes de que yo haya decidido nada, un calor rápido más abajo, más insistente que yo.\n\nPienso en el modo en que cierta persona dijo mi nombre en el corredor, la segunda sílaba sostenida, la puerta no del todo cerrada a su espalda. Mis dedos se mueven y mi aliento se engancha en aquella sílaba sostenida.\n\nMe detengo antes del final. Me quedo con la mano quieta y el corazón en marcha, y la almohada a mi lado no tiene ningún hueco."
 latria_sexual_frustration_flavor.1127.desc.male: "La colcha está en el suelo y el camisón se me ha subido hasta la cadera. Mi mano baja y ya estoy duro, de nada, de un corredor y un nombre y una puerta entreabierta.\n\nPienso en una boca y mis caderas se desplazan por su cuenta. Mi aliento se acorta. Podría terminar esto en un instante y no lo hago, y ese no es su propio tipo de trabajo.\n\nRetiro la mano y me tiendo plano. La habitación está muy silenciosa y el dolor no se va, y la almohada a mi lado está fresca y no la toco."
 latria_sexual_frustration_flavor.1127.desc: "La cama está demasiado caliente y la lámpara está apagada. He arrojado la colcha y mi mano se extravía, y mi cuerpo responde de inmediato, más insistente que yo, antes de que haya decidido permitirlo.\n\nPienso en un corredor, un nombre dicho dos veces, una manga recogida en la muñeca. El corredor está oscuro a esa hora. Mi aliento se acorta y dejo que el pensamiento llegue hasta el final y no más allá.\n\nRetiro la mano y no me muevo. La almohada a mi lado no tiene ningún hueco, y la colcha se queda en el suelo hasta la mañana."
 latria_sexual_frustration_flavor.1127.a: "Dejar que mi mano se quede donde está."
 latria_sexual_frustration_flavor.1127.b: "Juntar las manos y dormir de costado."
 latria_sexual_frustration_flavor.1127.c: "Alzarme y sentarme junto al postigo hasta que haya luz."

 latria_sexual_frustration_flavor.1128.t: "El brindis"
 latria_sexual_frustration_flavor.1128.desc: "Me alzo para el brindis y el salón es una mancha de rostros. Un rostro no es una mancha. Hablo de lealtad durante lo que dura una copa y mis ojos vuelven una y otra vez al mismo lugar por encima de la tercera mesa.\n\nAlguien tose en la mesa alta. El chisme estará en las cocinas antes de que se retiren los platos, y descubro que me importa menos de lo que debería, lo cual es en sí algo que hay que responder.\n\nMe siento. Mi mano toma el tallo de la copa y lo aprieta demasiado, y al otro lado del salón el rostro sigue vuelto hacia mí."
 latria_sexual_frustration_flavor.1128.a: "Nombrar a quien miraba, y beber a su salud."
 latria_sexual_frustration_flavor.1128.b: "Hablar solo de lealtad, y sentirlo."
 latria_sexual_frustration_flavor.1128.c: "Llevar la copa al otro extremo y sentarme con un viejo amigo."

 latria_sexual_frustration_flavor.1129.t: "El comentario al tercer capítulo"
 latria_sexual_frustration_flavor.1129.desc: "Mi capellán lee el comentario en voz alta y yo sigo la línea con el dedo sobre la página. La voz hace la lectura. Mi dedo se ha detenido, tres líneas por debajo de donde está la voz, en la misma página de hace una hora.\n\nUna página gira y mi dedo estorba. Quien lee espera. No lo muevo. La vela entre nosotros se inclina y se endereza, y en algún lugar de la casa se cierra una puerta.\n\nLa lectura sigue. He perdido por completo el argumento del tercer capítulo, y la habitación huele a cera y a tinta, y el dedo sigue donde estaba."
 latria_sexual_frustration_flavor.1129.a: "Confesar la distracción y cumplir la penitencia."
 latria_sexual_frustration_flavor.1129.b: "Pedir una regla más estricta y cumplirla."
 latria_sexual_frustration_flavor.1129.c: "Seguir la línea otra vez desde el principio de la página."

 latria_sexual_frustration_flavor.1130.t: "Lo que le conté a mi amigo"
 latria_sexual_frustration_flavor.1130.desc: "Le cuento a mi amigo todo, el corredor y la muñeca y la copa, y mi amigo escucha con el mentón apoyado en una mano y no mira ni una vez hacia la puerta. El vino entre nosotros sigue intacto. Decirlo en voz alta es un alivio y no cambia nada.\n\nLuego una mano se cierra sobre mi hombro, amistosa, y se queda allí. Miro el mapa. La campaña puede esperar una estación; el río no se ha movido.\n\nMi amigo se va. Me quedo con las piezas de la campaña delante, de madera, oliendo a la caja, y muevo una, y luego la devuelvo a donde estaba."
 latria_sexual_frustration_flavor.1130.a: "Contar el resto, y no pedir nada."
 latria_sexual_frustration_flavor.1130.b: "No decir más y ordenar las piezas."
 latria_sexual_frustration_flavor.1130.c: "Sopesar la campaña, y acertar."

 latria_sexual_frustration_flavor.1131.t: "El calor que permanece"
 latria_sexual_frustration_flavor.1131.desc: "Un sueño me deja con calor y me despierto con el camisón subido hasta la cintura. Mi propia mano ha sido la causa. No me muevo y dejo que la habitación vuelva, el suelo frío, la lámpara que muere, y el calor no se va con el sueño.\n\nFue alguien de la casa del mayordomo, o alguien con esa boca. Tenía mi muñeca sujeta contra la cama y no tenía prisa, y recuerdo el peso exacto de aquel cuerpo, el modo en que el jergón nos recibió a los dos. Jamás he visto esa mirada en unos ojos a la luz del día.\n\nBajo el camisón sobre mis caderas. La tela está húmeda donde he estado. Vuelvo la cara hacia la pared y el calor se queda bajo la manta, paciente, esperando a que ceda."
 latria_sexual_frustration_flavor.1131.a: "Dejar que mi mano vuelva donde quiere."
 latria_sexual_frustration_flavor.1131.b: "Estirar el camisón y esperar el alba."
 latria_sexual_frustration_flavor.1131.c: "Pensar en las bromas de la cena y dejar que el aliento se calme."

 latria_sexual_frustration_flavor.1132.t: "La tercera vela"
 latria_sexual_frustration_flavor.1132.desc: "Me arrodillo hasta que me duelen las rodillas y el dolor no basta para despejarme la cabeza. El templo está vacío más allá de la tercera vela. En la oscuridad detrás de mis ojos vuelve el mismo cuerpo, y no es el del dios.\n\nLas manos de alguien que peregrinaba, hace semanas, doblando una manta sobre mis hombros al borde del camino. El roce de unos nudillos en mi garganta. He rezado esa imagen fuera cien veces y vuelve cada noche más clara, el calor de una palma ajena donde el cuello se abre.\n\nAprieto la frente contra mis manos juntas. La piedra está fría. Mi aliento no. Sigo de rodillas mientras la última vela se acorta, y no pido perdón, solo que el temblor de mis muslos cese antes de ponerme en pie."
 latria_sexual_frustration_flavor.1132.a: "Nombrar el pensamiento y dejar que arda hasta el fondo."
 latria_sexual_frustration_flavor.1132.b: "Alzarme y mantener la vigilia hasta que el cuerpo se agote."
 latria_sexual_frustration_flavor.1132.c: "Aferrarme al calor de aquellas manos como consuelo."

 latria_sexual_frustration_flavor.1133.t: "Bajo el saliente"
 latria_sexual_frustration_flavor.1133.desc: "Lluvia otra vez, y la cacería dispersa. Me refugio bajo un saliente de roca con el montero mayor, los dos empapados, y el frío convierte cada lugar en que nos tocamos en una pequeña hoguera. Su brazo está contra el mío del hombro a la muñeca y he dejado de fingir que no lo noto.\n\nDice algo sobre la tormenta. Respondo sobre la tormenta. Su mano encuentra la parte baja de mi espalda para afianzarme en la piedra mojada y se queda allí, extendida y tibia a través de la lana empapada, y mi aliento se vuelve corto de un modo que el frío no excusa.\n\nLa lluvia no cede. Su pulgar se mueve una vez contra mi columna. Mantengo los ojos en la cortina gris de agua y no me aparto, y el saliente es demasiado estrecho para otra cosa que esto."
 latria_sexual_frustration_flavor.1133.a: "Quedarme en la lluvia un rato más."
 latria_sexual_frustration_flavor.1133.b: "Apartarme y mirar caer el agua."
 latria_sexual_frustration_flavor.1133.c: "Esperar a que pase la tormenta y volver a solas."

 latria_sexual_frustration_flavor.1134.t: "El lazo que nunca desaté"
 latria_sexual_frustration_flavor.1134.desc: "El consejo ha terminado y el estudio es mío. Sirvo vino que no quiero y el recuerdo viene igual, sin invitación, la boca de quien trajo el tratado en el banquete, el modo en que se lamió una gota del pulgar mientras los escribientes discutían las fronteras.\n\nDejo la copa. Mi mano va a los lazos de mi cuello y se detiene. En el recuerdo sus dedos son rápidos y seguros y yo no me opongo, me inclino sobre la mesa para no resbalar de ella, y todo el salón es una mancha de humo de velas a su espalda.\n\nLa vela chisporrotea. Vuelvo a atar el lazo que nunca desaté. El vino sigue intacto y la habitación está muy silenciosa, y mi pulso suena fuerte en mis oídos como alguien llamando a una puerta que no he abierto."
 latria_sexual_frustration_flavor.1134.a: "Admitir sin rodeos de qué boca me acuerdo."
 latria_sexual_frustration_flavor.1134.b: "Apagar la vela e irme a la cama a solas."
 latria_sexual_frustration_flavor.1134.c: "Sacar un juego de ajedrez y rehacerme."

 latria_sexual_frustration_flavor.1135.t: "La danza lenta"
 latria_sexual_frustration_flavor.1135.desc: "Los músicos atacan una melodía lenta y una mano se cierra sobre la mía antes de que pueda rehusarla. Giramos juntos cerca del estrado, cerca, más cerca de lo que pide la figura, y quien me sostiene huele a vino y a humo de leña y a algo más tibio debajo.\n\nUn muslo se desliza entre los míos en la vuelta y se queda medio tiempo de más. Mantengo el rostro compuesto para el salón. Bajo la música oigo mi propia respiración, y sé que la otra persona también la oye, porque su boca se curva y no se abre.\n\nLa serie termina. No nos separamos enseguida. Un pulgar recorre la costura de mi palma, despacio, deliberado, una pregunta sin palabras. Los músicos empiezan otra vez y no he respondido, y mi mano sigue en la suya."
 latria_sexual_frustration_flavor.1135.a: "Seguir la melodía y bailar la pieza siguiente."
 latria_sexual_frustration_flavor.1135.b: "Retirar la mano y entrar en la multitud."
 latria_sexual_frustration_flavor.1135.c: "Quedarme en el calor y escuchar la melodía hasta el final."
