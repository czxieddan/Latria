l_spanish:
 latria_sexual_frustration_flavor.1001.t: "Una larga noche tras la cortina"
 latria_sexual_frustration_flavor.1001.desc.female: "Me siento junto a la ventana en camisón, con una carta sin abrir sobre el regazo. La luna se cuela entre las cortinas y alumbra las marcas de los dedos sobre el pliegue. Quien la escribió se marchó hace tiempo; yo, en cambio, sigo sacando la carta del fondo del cofre, guardándola y volviéndola a sacar.\n\nRecuerdo nuestro último encuentro. Dejó una frase a medias, como si aún quisiera añadir algo, pero ya retiraba la mano bajo la manga. Yo me limité a asentir; ni siquiera pude pedirle que se quedara. Ahora, en plena noche, aquella frase incompleta me resulta más clara que toda la carta.\n\nEl viento mueve la cortina y el papel cruje suavemente. Apoyo los dedos en el lacre, sin romperlo ni devolver la carta al cofre."
 latria_sexual_frustration_flavor.1001.desc.male: "Me siento junto a la ventana en camisón, con una carta sin abrir sobre el regazo. La luna se cuela entre las cortinas y deja ver aquella letra tan familiar en el sobre. Quien la escribió se marchó hace mucho, pero yo he mantenido la carta debajo del libro de cuentas.\n\nRecuerdo la mirada que me dirigió antes de partir, como si esperara una respuesta. Entonces tenía otros asuntos entre manos y solo dije que hablaríamos otro día. Ese día llegó cuando ya se había ido; aquella mirada, sin embargo, sigue ante mí.\n\nFuera suena la ronda nocturna. Doy la vuelta a la carta y luego vuelvo a dejarla como estaba. El lacre sigue intacto."
 latria_sexual_frustration_flavor.1001.desc: "Ya entrada la noche, vuelven a ocuparme los asuntos del corazón que dejé pendientes.\n\nLevanto la carta, miro el sello y la devuelvo a mi regazo. No hay nadie más en la estancia; hasta el chisporroteo de la lámpara se oye con claridad. Intento pensar en las tareas de mañana, pero siempre acabo en el mismo lugar.\n\nLa cortina se mueve un instante. La carta sigue aquí; quien la escribió, no."
 latria_sexual_frustration_flavor.1001.a: "Leerla hasta el final y pensar en quien la escribió."
 latria_sexual_frustration_flavor.1001.b: "Guardar la carta bajo llave y ahogar el pensamiento."
 latria_sexual_frustration_flavor.1001.c: "Tomar una hoja nueva y convertirlo en un poema."

 latria_sexual_frustration_flavor.1002.t: "Especias en el festín"
 latria_sexual_frustration_flavor.1002.desc.accepted: "El aroma de las especias se impone al del vino. Los músicos empiezan su tercera pieza y aún hay invitados que conversan muy juntos. Aquí nadie considera impropia esa cercanía; tras las risas, las copas siguen pasando de mano en mano.\n\nYo, sin embargo, voy recorriendo todas las miradas. Alguien alza la copa para saludarme y correspondo, aunque mis ojos siguen buscando el rostro que falta. Quien se sienta a mi lado cuenta una broma y me río un instante tarde.\n\nCuando me sirven más vino, casi he olvidado la copa que tengo en la mano. Me llega el cálido aroma de las especias, pero el vacío que siento permanece."
 latria_sexual_frustration_flavor.1002.desc.strict: "Las especias animan el festín, pero cada vez que estallan las risas recuerdo cómo las normas vigilan cualquier exceso. Quien se sienta a mi lado se inclina para hablarme y, sin pensarlo, enderezo la copa, como si ese gesto bastara para guardar las formas.\n\nAlguien empieza a contar una vieja historia y se interrumpe a mitad de frase. La mesa cambia enseguida de asunto: ahora se habla de tierras y cosechas. Asiento con los demás, pero sigo pendiente de aquellas palabras que quedaron sin terminar.\n\nCuando me sirven más vino, casi he olvidado la copa que tengo en la mano. Solo la devuelvo a la mesa cuando el vino alcanza el borde."
 latria_sexual_frustration_flavor.1002.desc: "El festín bulle a mi alrededor, pero una misma preocupación no deja de llevarse mis pensamientos.\n\nTengo delante la música, las copas y las conversaciones, aunque no consigo seguir una sola frase hasta el final. Quien se sienta a mi lado me pregunta si quiero más vino. Respondo algo, sin saber siquiera qué he contestado.\n\nCuando cambia la música, descubro que llevo todo este tiempo mirando la puerta del salón. Se ha abierto dos veces; ninguna ha entrado la persona que deseo ver."
 latria_sexual_frustration_flavor.1002.a: "Sumarme con unas palabras tiernas de mi cosecha."
 latria_sexual_frustration_flavor.1002.b: "Bajar la mirada, dar las gracias al anfitrión y despedirme."
 latria_sexual_frustration_flavor.1002.c: "Pedir a los músicos una melodía más antes de irme."
 latria_sexual_frustration_flavor.1002.d: "Reunir a los invitados en una mesa y pasar la velada conversando."

 latria_sexual_frustration_flavor.1003.t: "Un sermón en el jardín"
 latria_sexual_frustration_flavor.1003.desc.favors: "El predicador se sienta en un banco de piedra del jardín y dice que los placeres de la carne no contradicen nuestra fe. El viento levanta una esquina del libro; la sujeta con un dedo y sigue hablando con calma.\n\nEsas palabras deberían tranquilizarme. Sin embargo, mientras escucho, recuerdo una broma que aquella persona hizo antes de marcharse y una mirada a la que no supe responder. Los pasajes sagrados me pasan por los oídos; aquella frase, en cambio, se queda.\n\nEl predicador me pregunta si lo he entendido. Asiento, pero he perdido la página en la que debía cerrar el libro."
 latria_sexual_frustration_flavor.1003.desc.condemns: "El predicador habla de contención y castidad; cada frase se oye con claridad. El jardín está tan quieto que hasta el rumor de las hojas parece marcar sus pausas. Dejo las manos sobre el regazo y mantengo la compostura, pero mis pensamientos no están en el libro.\n\nRecuerdo aquel rato de anoche en que no lograba dormir del todo. Nadie vino ni me dijo nada: fue el deseo el que volvió por su cuenta. Fijo la mirada en las escrituras, aunque no consigo reunir las palabras en una frase.\n\nEl predicador pasa una página. Bajo la cabeza a la vez que él, sin saber todavía qué pasaje acaba de leer."
 latria_sexual_frustration_flavor.1003.desc: "Escucho el sermón hasta el final en el jardín. El viento recorre las páginas, pero mis pensamientos siguen sin encontrar reposo.\n\nEl predicador ya se ha levantado para saludar a otras personas. Yo permanezco en el banco, sujetando la página con los dedos mientras miro el final del sendero de piedra. No hay nadie allí; aun así, sigo mirando un rato.\n\nCuando vuelvo en mí, el viento ya ha pasado varias páginas."
 latria_sexual_frustration_flavor.1003.a: "Cerrar el libro y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1003.b: "Apartar esos pensamientos y unirme a la recitación."
 latria_sexual_frustration_flavor.1003.c: "Pedir al predicador que explique cada pasaje."

 latria_sexual_frustration_flavor.1004.t: "Un halcón inquieto"
 latria_sexual_frustration_flavor.1004.desc.lustful: "El halcón bate las alas sobre mi muñeca, pendiente de las palomas que vuelan a lo lejos. Las correas que le sujetan las patas lo inquietan y cada aleteo levanta una ráfaga de aire. Lo contengo, pero sigue mirando aquel claro.\n\nConozco bien esa impaciencia. Los cazadores esperan mis órdenes al borde del bosque y hasta los caballos piafan. Yo pienso en otra cosa, tanto que he olvidado el silbato que llevo en la mano. No logro dar forma a ese pensamiento, pero tampoco hacerlo callar.\n\nEl halcón vuelve a agitarse. Solo entonces advierto con cuánta fuerza estoy apretando el guante."
 latria_sexual_frustration_flavor.1004.desc.chaste: "El halcón se mueve inquieto sobre mi muñeca. Me obligo a atender al ruido de las riendas y a los silbidos, sin apartar la vista del lindero del bosque. Los cazadores ya se han repartido por el terreno y solo esperan mi señal.\n\nMis pensamientos son aún más difíciles de contener que el ave. Cuento las respiraciones, los pasos de los caballos y las hojas de los árboles, hasta que todas esas cuentas me devuelven a la misma persona. No está en el coto. Lo sé, y aun así sigo pensando en ella.\n\nEl halcón ladea la cabeza para mirarme, como si esperara una orden que pudiera entender. Por el momento, no sé dársela."
 latria_sexual_frustration_flavor.1004.desc: "Los cazadores esperan a que llame al halcón, pero sigo sin poder concentrarme.\n\nCuando cesa el viento entre los árboles, noto con especial claridad el aleteo sobre mi muñeca. Levanto la mano y vuelvo a bajarla; tengo la llamada en los labios, pero no llego a emitirla.\n\nAlguien grita mi nombre a lo lejos. Respondo, aunque mis ojos siguen fijos en el claro."
 latria_sexual_frustration_flavor.1004.a: "Dejar que la comitiva espere mientras pienso en mis asuntos."
 latria_sexual_frustration_flavor.1004.b: "Concentrarme y poner en orden los útiles de caza."
 latria_sexual_frustration_flavor.1004.c: "Alisar las plumas despacio y volver a intentar la llamada."

 latria_sexual_frustration_flavor.1005.t: "Entre reuniones del consejo"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Los señores se han retirado, pero los sirvientes siguen recogiendo mapas y sellos. Me he quedado a solas en el extremo de la larga mesa, con una vieja carta junto a los documentos pendientes. Todavía se percibe el olor de la tinta de los sellos.\n\nHace un momento discutían sobre fronteras e impuestos. Asentí unas veces y rechacé alguna propuesta; debió de parecer que lo escuchaba todo. En realidad, durante un buen rato solo miré la esquina de aquella carta que asomaba bajo los documentos.\n\nUn sirviente pregunta si debe despejar la mesa. Apoyo la mano sobre el montón de papeles y tardo en contestar."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Mis compañeros ya han decidido el próximo paso del río, pero el mapa sigue sobre la mesa. Acerco una vieja carta a la lámpara y descubro que otra vez soy incapaz de atender a la relación de etapas.\n\nFuera están recogiendo los arreos; oigo chocar las hebillas. He leído tres veces el tramo del camino que me toca confirmar, pero solo recuerdo el nombre de un lugar mencionado en la carta. No pasaremos por allí mañana.\n\nUn compañero me espera en la puerta. Cubro la carta, aunque no aparto los dedos de ella."
 latria_sexual_frustration_flavor.1005.desc.clergy: "La reunión ha terminado y los libros de cuentas y las escrituras siguen abiertos sobre la mesa. Saco una vieja carta de entre las páginas y vuelve esa voz interior que no quiere callarse.\n\nDurante el día he ordenado las donaciones, las reparaciones y las festividades. Ahora que me siento a solas, todas aquellas cifras ceden su sitio. El libro sagrado ha dejado su marca en el papel y los bordes están gastados, pero reconozco esa línea al primer vistazo.\n\nAlguien pasa por la galería. Vuelvo a colocar la carta entre las páginas, justo donde estaba antes."
 latria_sexual_frustration_flavor.1005.desc.ruler: "El consejo ha terminado, pero los documentos y el lacre siguen amontonados sobre la mesa. Me aliso la manga; la vieja carta que tengo al lado ocupa mis pensamientos mucho más que los informes.\n\nEl escribano ha dejado un resumen claro. Lo levanto y, antes de acabar de leer el primer nombre, la mirada ya se me ha ido hacia la carta. No debería estar sobre esta mesa. Fui yo quien la metió entre los papeles esta mañana.\n\nFuera aún esperan mis próximas instrucciones. Les digo que aguarden un poco más."
 latria_sexual_frustration_flavor.1005.desc: "Tengo bastantes asuntos pendientes, pero una vieja carta me impide concentrarme.\n\nOrdeno los documentos por su tamaño, deshago la pila y vuelvo a formarla. La carta siempre queda encima. El nivel del aceite en la lámpara ha bajado y yo no he escrito una sola anotación.\n\nAlguien carraspea al otro lado de la puerta. Solo entonces aparto la mano de la carta."
 latria_sexual_frustration_flavor.1005.a: "Dejar el trabajo y volver a leer la vieja carta."
 latria_sexual_frustration_flavor.1005.b: "Guardar la carta y volver a mis deberes."
 latria_sexual_frustration_flavor.1005.c: "Organizar el trabajo restante y concederme un breve descanso."
 latria_sexual_frustration_flavor.1005.d: "Ordenar cada tarea y asegurarme de terminarlas todas."

 latria_sexual_frustration_flavor.1006.t: "Una vieja carta a la luz de las velas"
 latria_sexual_frustration_flavor.1006.desc.female: "Me siento bajo la lámpara en camisón, con los dedos detenidos sobre el pliegue de una vieja carta. No contiene promesas, solo unos saludos corrientes; al final, sin embargo, queda un gran espacio en blanco, como si quien escribía se hubiera interrumpido de pronto.\n\nPaso mucho tiempo mirando ese hueco. Cuando recibí la carta apenas le di importancia, pero esta noche me pesa más que las palabras escritas. La mecha chisporrotea y la sombra salta sobre el papel.\n\nEl lazo del camisón se ha aflojado y no lo anudo. La carta sigue abierta y aún queda mucha noche."
 latria_sexual_frustration_flavor.1006.desc.male: "Me siento junto a la cama en camisón. La letra de la vieja carta me recuerda un afecto al que nunca llegué a responder. El papel se ha reblandecido y casi se rompe por los pliegues, pero vuelvo a extenderlo.\n\nLa carta habla del tiempo durante el viaje y de un pequeño incidente. Yo, en cambio, recuerdo el día de su entrega: estaba en la galería, quise salir detrás de aquella persona y alguien me llamó. Después guardé la carta en el cofre; quien la escribió nunca regresó.\n\nLa mecha se ha consumido un poco más. Giro el papel, pero las palabras siguen siendo las mismas."
 latria_sexual_frustration_flavor.1006.desc: "La noche está en calma, pero las palabras de la vieja carta permanecen ante mis ojos.\n\nPensaba echarle solo un vistazo antes de dormir. En cuanto encendí la lámpara, aquellas líneas dejaron de soltarme. Llego a la mitad y vuelvo al principio, como si entre ellas hubiera un sentido que no comprendí en su día.\n\nLa cama ya está preparada. Yo sigo en mi asiento, dejando nuevas marcas en el borde del papel de tanto sujetarlo."
 latria_sexual_frustration_flavor.1006.a: "Leer la carta hasta el final."
 latria_sexual_frustration_flavor.1006.b: "Guardar la carta, apagar la vela y disponerse a dormir."

 latria_sexual_frustration_flavor.1007.t: "Antes de que acabe el festín"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Entre risas, alguien menciona a un antiguo amante y nadie en la mesa lo considera impropio. Las copas se encuentran una vez más y las risas pasan, como si solo se hubiera hablado del tiempo.\n\nLevanto mi copa con los demás, aunque la vista se me va varias veces hacia un asiento vacío. Ya han retirado la copa de ese puesto; solo queda el mantel alisado. Sé a quién espero y también sé que esta noche no vendrá.\n\nQuien se sienta a mi lado me pregunta qué estoy mirando. Niego con la cabeza y me olvido de beber."
 latria_sexual_frustration_flavor.1007.desc.strict: "En la mesa cuentan una relación clandestina como escarmiento y enseguida empiezan a hablar de honra y decoro. Quien la cuenta baja la voz, aunque los de al lado aún pueden oírla; por eso hasta las risas son cautelosas.\n\nBajo la mirada y me aliso la manga sin intervenir. La historia no es mía, pero al escucharla siento que va dirigida a mí. Bajo la mesa hago girar el pie de la copa entre los dedos, una vuelta tras otra.\n\nPronto cambian de conversación. Mi manga ya no tiene arrugas, pero mis pensamientos siguen donde estaban."
 latria_sexual_frustration_flavor.1007.desc: "La música continúa, aunque mis pensamientos abandonaron la mesa hace rato.\n\nLos invitados aún se sirven la última ronda de vino. Veo sus bocas abrirse y cerrarse, pero solo oigo esa frase que llevo dentro y no sé dónde decir. Alguien brinda por mí; levanto la copa y el vino se agita.\n\nLa pieza se acerca a su final. Sigo en mi asiento, como si aún no hubiera decidido si estoy presente en este festín."
 latria_sexual_frustration_flavor.1007.a: "Oirán mi propio anhelo desde el principio."
 latria_sexual_frustration_flavor.1007.b: "Tragarme las palabras, dar las gracias al anfitrión y despedirme."
 latria_sexual_frustration_flavor.1007.c: "Preguntar a mi vecino por sus viajes."

 latria_sexual_frustration_flavor.1008.t: "Oración ante el santuario"
 latria_sexual_frustration_flavor.1008.desc.favors: "La vela ante el santuario está a punto de consumirse. Recuerdo que mi fe no aborrece los placeres de la carne. He oído esas palabras muchas veces, pero ahora parece la primera en que debo decidir qué hacer con ellas.\n\nLa cera ha formado una capa sobre el soporte de bronce. Voy por la mitad de la oración; sigo pronunciando las mismas palabras, aunque pienso en la mano de alguien y en el roce de su ropa cuando se acerca. La imagen del santuario no se mueve; la llama, en cambio, da un salto.\n\nIntento recoger mis pensamientos. A mitad de camino, vuelvo a dejarlos ir."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Repito en silencio mis votos de castidad ante el santuario, pero la oración familiar se me corta varias veces en los labios. La primera frase sale entera; en la segunda ya se pierden palabras, y por esos huecos se cuela un pensamiento.\n\nNo es un pensamiento ruidoso. Solo me recuerda que, cuando regrese esta noche, la cama seguirá vacía y solo tendré mis propias manos. Me aparto el cabello de la frente y vuelvo a empezar por la primera frase.\n\nLa mecha chisporrotea. Mi voz también se detiene."
 latria_sexual_frustration_flavor.1008.desc: "He terminado de rezar, pero sigo junto a la vela.\n\nYa he recitado todo lo que debía. Se me han entumecido un poco las rodillas y, aun así, no me levanto. La llama baja y luego se sostiene a duras penas, como si también esperara un final que se resiste a llegar.\n\nMiro aquella luz y sé que no he dejado atrás lo que me preocupa. Solo ha cedido su lugar a la oración durante un rato."
 latria_sexual_frustration_flavor.1008.a: "Apartar el voto de abstinencia y admitir mi anhelo."
 latria_sexual_frustration_flavor.1008.b: "Contener mis pensamientos y seguir rezando."
 latria_sexual_frustration_flavor.1008.c: "Leer un pasaje y meditarlo antes de irme."
 latria_sexual_frustration_flavor.1008.d: "Mantener la vela encendida y recitar hasta el amanecer."

 latria_sexual_frustration_flavor.1009.t: "La petición sin leer"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Los informes están extendidos sobre la larga mesa y los señores esperan que hable. Leo una línea dos veces y sigo sin recordar la segunda cifra. La pluma gira entre mis dedos y deja una gota de tinta en un espacio en blanco.\n\nSus miradas han pasado del respeto a la duda. Alguien carraspea, otro se sirve agua; nadie se atreve a tomar la palabra. Sé que debo pronunciarme, pero me cruza por la cabeza aquella media línea que dejé sin escribir anoche.\n\nEl escribano acerca el siguiente informe. Mi mano aún descansa sobre el primero."
 latria_sexual_frustration_flavor.1009.desc.ruler: "El consejo aún no ha terminado, pero no consigo asimilar una sola palabra de los documentos que tengo delante. Cierro el legajo y vuelvo a abrirlo; las notas del margen siguen siendo las de ayer.\n\nMis consejeros hablan del precio del grano y de los cauces de los ríos. Oigo algunas palabras, después me distraigo y acabo pensando en un nombre. Ese nombre no figura en el documento. Aun así, sigo buscándolo sobre el papel.\n\nAlguien me pregunta si quiero suspender la reunión. Levanto la cabeza y solo entonces descubro que llevan un rato en silencio."
 latria_sexual_frustration_flavor.1009.a: "Disolver el consejo y dejarme a solas con mis pensamientos."
 latria_sexual_frustration_flavor.1009.b: "Concentrarme y atender cada petición."
 latria_sexual_frustration_flavor.1009.c: "Poner las decisiones en orden y pronunciarlas una a una."

 latria_sexual_frustration_flavor.1010.t: "El regreso del águila"
 latria_sexual_frustration_flavor.1010.desc.lustful: "El halcón describe círculos sobre el bosque. Su sombra pasa una y otra vez sobre mi guante, pero no se posa. Levanto el brazo y el ave se limita a dar otra vuelta, todavía más arriba.\n\nMientras lo veo resistirse a regresar, siento de pronto cuánto me cansa reprimir cada deseo. Los cazadores hablan en voz baja junto a los caballos, creyendo que espero a que cambie el viento. En realidad, espero poder llamar de otra manera a mi inquietud. No lo consigo.\n\nEl halcón lanza un grito breve y agudo, como si ya no quisiera obedecer ninguna llamada."
 latria_sexual_frustration_flavor.1010.desc.chaste: "El halcón sigue trazando círculos a lo lejos. Aprieto el guante y me obligo a escuchar solo las llamadas de los cazadores, a mirar únicamente el lindero y la dirección del viento. La correa se humedece en mi mano.\n\nHe ejercido esta contención muchas veces, pero hoy me cuesta más que de costumbre. Cada poco surge una frase que no debería permitirme; me la digo y yo mismo la interrumpo. Un caballo quiebra una rama seca y el chasquido me sobresalta.\n\nEl halcón todavía no ha vuelto. Ya me duele la mano."
 latria_sexual_frustration_flavor.1010.desc: "Los cazadores esperan para dar por terminada la jornada, mientras yo sigo mirando el cielo entre los árboles.\n\nEl cuerno está junto a la silla. Lo toco sin recogerlo. El punto oscuro en el cielo da una vuelta y después otra; nadie me apremia, pero todos esperan.\n\nPor fin bajo la cabeza y descubro que ni siquiera he visto hacia dónde volaba el halcón."
 latria_sexual_frustration_flavor.1010.a: "Hacer esperar a los cazadores mientras mis pensamientos siguen al águila."
 latria_sexual_frustration_flavor.1010.b: "Tocar la retirada y revisar los útiles de caza."
 latria_sexual_frustration_flavor.1010.c: "Caminar junto al bosque antes de volver a la comitiva."

 nick_latria_the_unquiet: "el Inquieto"
 nick_latria_the_unquiet_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsLocalPlayer, 'hiciste', 'hizo' )] constar en la crónica [Select_CString( CHARACTER.IsLocalPlayer, 'tus', 'sus' )] deseos carnales, y las copias aún circulan por todas partes."
 latria_flavor_focus: "Determinación reunida"
 latria_flavor_focus_desc: "Este personaje ha dedicado su atención a las escrituras y los deberes cotidianos."
 latria_flavor_remorse: "Remordimiento persistente"
 latria_flavor_remorse_desc: "Un breve consuelo ha dejado la conciencia intranquila."
 latria_flavor_sullied: "Reputación mancillada"
 latria_flavor_sullied_desc: "Los rumores han perjudicado la posición y las amistades de este personaje."
 latria_flavor_broken_sleep: "Falta de sueño"
 latria_flavor_broken_sleep_desc: "La escasez de sueño distrae a este personaje y lo cansa con facilidad."
 latria_flavor_vagabond_focus: "Concentración del viajero"
 latria_flavor_vagabond_focus_desc: "El trabajo del camino acalla brevemente los pensamientos inquietos."
 latria_flavor_public_disgrace: "Deshonra pública"
 latria_flavor_public_disgrace_desc: "Los rumores de una falta pública han perjudicado la posición y las amistades de este personaje."
 latria_flavor_hunting_focus: "Atención a la caza"
 latria_flavor_hunting_focus_desc: "Este personaje ha centrado su atención en el rastreo, la cetrería y la equitación."
 latria_flavor_warm_company: "Compañía agradable"
 latria_flavor_warm_company_desc: "Una buena conversación ha hecho que este personaje tenga más ganas de buscar compañía."
 latria_flavor_neglected_duties: "Deberes desatendidos"
 latria_flavor_neglected_duties_desc: "Los asuntos privados han apartado a este personaje de sus deberes."
 latria_flavor_diligent_work: "Deberes en orden"
