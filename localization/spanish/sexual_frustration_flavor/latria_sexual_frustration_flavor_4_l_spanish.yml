l_spanish:
 latria_sexual_frustration_flavor.1301.t: "Una invitación sin enviar"
 latria_sexual_frustration_flavor.1301.desc.female: "En camisón, me siento al escritorio con un único nombre en la página. Mi doncella pregunta si debe entregarla. Doblo la carta y no respondo."
 latria_sexual_frustration_flavor.1301.desc.male: "En camisón, me siento al escritorio con un único nombre en la página. Un sirviente espera fuera para llevarla, pero no me decido a sellar la carta."
 latria_sexual_frustration_flavor.1301.desc: "Una carta sin sellar lleva un buen rato esperando bajo la vela."
 latria_sexual_frustration_flavor.1301.a: "Terminar la carta y dársela al sirviente."
 latria_sexual_frustration_flavor.1301.b: "Guardar la carta, reprimir el anhelo y retirarme."

 latria_sexual_frustration_flavor.1302.t: "El juicio de una corte"
 latria_sexual_frustration_flavor.1302.desc.accepted: "El poeta de la corte bromea sobre viejos afectos y ni los nobles más severos fruncen el ceño. Alzo la copa con ellos, aunque no encuentro sosiego."
 latria_sexual_frustration_flavor.1302.desc.strict: "Un noble ha perdido su honra por un romance indiscreto y la corte habla de toda su familia. Escucho sus juicios, sabiendo que podrían pesarme en la misma balanza."
 latria_sexual_frustration_flavor.1302.desc: "La conversación gira hacia la reputación y el deseo."
 latria_sexual_frustration_flavor.1302.a: "Hablar de mi anhelo y volver a él una y otra vez en la conversación."
 latria_sexual_frustration_flavor.1302.b: "Callarme, dar las gracias a mis anfitriones y despedirme."

 latria_sexual_frustration_flavor.1303.t: "La campana de medianoche"
 latria_sexual_frustration_flavor.1303.desc.favors: "Tras la campanada, el sacerdote permanece junto a la puerta. Dice que el deseo puede encaminarse hacia el bien, pero no sé si puedo seguir esperando."
 latria_sexual_frustration_flavor.1303.desc.condemns: "La campana tañe una y otra vez, como el voto del sacerdote sobre mi corazón. Me duelen las rodillas de tanto arrodillarme y la respuesta sigue sin llegar."
 latria_sexual_frustration_flavor.1303.desc: "La oración de medianoche no ha traído calma, aunque las campanas siguen sonando."
 latria_sexual_frustration_flavor.1303.a: "Dejar los preceptos de abstinencia en el templo."
 latria_sexual_frustration_flavor.1303.b: "Reprimir el pensamiento y recitar la oración una vez más."

 latria_sexual_frustration_flavor.1304.t: "El fin de la paciencia"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Recorro la alcoba en camisón. El tablero de ajedrez que me envió mi sirviente sigue intacto; la espera se ha convertido en un tormento."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Vuelvo a atar el cinturón del camisón e intento que cada movimiento parezca sereno. Cuanto más cuidado pongo, más difícil es ignorar mi anhelo."
 latria_sexual_frustration_flavor.1304.desc: "La habitación está en silencio. Ya no puedo quedarme quieto."
 latria_sexual_frustration_flavor.1304.a: "Apartar el tablero y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1304.b: "Volver al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1305.t: "Una habitación tras el anochecer"
 latria_sexual_frustration_flavor.1305.desc.emperor: "La corte se ha retirado, pero sigo en mi alcoba con las ropas de ceremonia. Las peticiones están respondidas; los pensamientos que me inquietan no se fueron con los señores."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Mis compañeros se han retirado en la posada, pero sigo a solas en mi habitación. Mi equipo está recogido y la ruta de mañana fijada, pero no consigo calmar mis pensamientos."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Permanezco a solas en mi pequeña habitación, aún con las vestiduras puestas. La vela junto a la cama se ha apagado. Mi voto permanece, pero el consuelo no llega."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Regreso a una alcoba vacía con las ropas de ceremonia. Los guardias se inclinan fuera, pero dentro no hay nadie que pueda compartir esta carga."
 latria_sexual_frustration_flavor.1305.desc: "La alcoba está vacía, pero aún no quiero acostarme."
 latria_sexual_frustration_flavor.1305.a: "Mandar llamar a una persona de confianza, pese a lo tarde que es, y hablar largo y tendido."
 latria_sexual_frustration_flavor.1305.b: "Reprimir el anhelo, quitarme las vestiduras y retirarme."

 latria_sexual_frustration_flavor.1306.t: "Un mensajero a medianoche"
 latria_sexual_frustration_flavor.1306.desc.female: "En camisón, me siento junto a la cama y oigo dos golpes suaves. Mi doncella solo trae una hoja en blanco, pero sé de quién espero noticias."
 latria_sexual_frustration_flavor.1306.desc.male: "Abro la puerta de la alcoba en camisón, pero el pasillo ya está vacío. La nota sin firmar del umbral me deja sin sueño."
 latria_sexual_frustration_flavor.1306.desc: "Los pasos se alejan al otro lado de la puerta. La hoja de mi escritorio sigue en blanco."
 latria_sexual_frustration_flavor.1306.a: "Escribir las palabras que tanto he demorado."
 latria_sexual_frustration_flavor.1306.b: "Guardar la hoja, ahogar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1307.t: "Silencio en la mesa"
 latria_sexual_frustration_flavor.1307.desc.accepted: "El poeta recita un viejo romance y los demás escuchan encantados. Alzo mi copa con ellos, pensando en una historia que nadie ha contado."
 latria_sexual_frustration_flavor.1307.desc.strict: "En la mesa se habla de un noble que perdió el favor por un romance indiscreto y las risas se apagan. Me vuelvo hacia la ventana para ocultar mi expresión."
 latria_sexual_frustration_flavor.1307.desc: "Las copas siguen pasando, pero la conversación se demora en un tema que más valdría dejar en paz."
 latria_sexual_frustration_flavor.1307.a: "Dejar que el vino me suelte la lengua y contar una historia privada tras otra."
 latria_sexual_frustration_flavor.1307.b: "Callarme, inclinarme ante los presentes y despedirme."

 latria_sexual_frustration_flavor.1308.t: "Una oración durante la vigilia"
 latria_sexual_frustration_flavor.1308.desc.favors: "La campana marca la guardia nocturna y sigo rezando en el santuario. Mi fe no condena el placer carnal, pero no sé cómo afrontar este anhelo persistente."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Repito la oración de castidad en el santuario. La campana se apaga, pero el pensamiento que llevo dentro no."
 latria_sexual_frustration_flavor.1308.desc: "La luz de las velas cae sobre los bancos vacíos. No me he levantado."
 latria_sexual_frustration_flavor.1308.a: "Apartar la oración de abstinencia y salir siguiendo mi corazón."
 latria_sexual_frustration_flavor.1308.b: "Contener mi deseo y terminar la vigilia."

 latria_sexual_frustration_flavor.1309.t: "Una mirada al espejo"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Sin ropa y a solas ante el espejo de la alcoba, me detengo un momento. Mi expresión no ha cambiado, pero ya no llamaré al deseo una debilidad pasajera."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Sin ropa junto a la cama, repito mi voto. Recuerdo cada palabra, pero el anhelo interior no desaparece."
 latria_sexual_frustration_flavor.1309.desc: "No hay nadie más en la habitación. El silencio del espejo no me deja dónde apartar la mirada."
 latria_sexual_frustration_flavor.1309.a: "Admitir lo que siento y pensar en ello."
 latria_sexual_frustration_flavor.1309.b: "Vestirme, volver al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1310.t: "En vela en mis aposentos"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Tras la oración nocturna, regreso a mi pequeña habitación. Aún llevo las vestiduras y la vela junto a la cama está apagada, pero no quiero acostarme."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Mis compañeros se han retirado en la posada. A solas en mi habitación, guardo el equipo. El camino de mañana está claro; la salida de mis pensamientos no."
 latria_sexual_frustration_flavor.1310.desc: "Es tarde. La puerta está cerrada, pero no puedo dormir."
 latria_sexual_frustration_flavor.1310.a: "Escribir a una vieja amistad y hablar con franqueza de mis penas."
 latria_sexual_frustration_flavor.1310.b: "Reprimir el pensamiento, apagar la vela y acostarme."

 latria_sexual_frustration_flavor.1301.c: "Tomar una hoja nueva y convertir la invitación en un poema."
 latria_sexual_frustration_flavor.1302.c: "Devolver la conversación a las familias y las haciendas."
 latria_sexual_frustration_flavor.1302.d: "Contar una historia del camino para que vuelvan a alzar las copas."
 latria_sexual_frustration_flavor.1303.c: "Quedarme hasta el amanecer y estudiar las escrituras línea por línea."
 latria_sexual_frustration_flavor.1304.c: "Disponer las piezas y estudiar un problema de ajedrez."
 latria_sexual_frustration_flavor.1304.d: "Comenzar por el primer movimiento y jugar una partida entera despacio."
 latria_sexual_frustration_flavor.1305.c: "Organizar el trabajo de la mañana antes de apagar la vela."
 latria_sexual_frustration_flavor.1307.c: "Recitar un poema nuevo y atraer su atención hacia otra cosa."
 latria_sexual_frustration_flavor.1308.c: "Cerrar el libro de oraciones y meditar mis pensamientos en silencio."
 latria_sexual_frustration_flavor.1308.d: "Velar hasta la oración matinal y preparar los libros para todos."
 latria_sexual_frustration_flavor.1309.c: "Escribir lo que me inquieta y meditarlo línea por línea."
 latria_sexual_frustration_flavor.1310.c: "Preparar té y guardar mis pertenencias y libros sin prisa."
