l_spanish:
 latria_sexual_frustration_flavor.1301.t: "Una invitación sin enviar"
 latria_sexual_frustration_flavor.1301.desc.female: "Me siento al escritorio en camisón. En el papel solo he escrito un nombre y la tinta aún no se ha secado cuando mi doncella pregunta desde la puerta si debe entregarlo. Doblo la hoja una vez, sin sellarla ni responder.\n\nDurante el día no me atreví a escribir ese nombre. Ahora, de noche, el papel parece quemarme las manos. Después debería ir una invitación; ya sé dónde y a qué hora, pero la pluma se ha detenido tras el saludo. Mi doncella vuelve a preguntar, esta vez más bajo.\n\nMiro aquel nombre. Pesa más que toda la carta que aún no he escrito."
 latria_sexual_frustration_flavor.1301.desc.male: "Me siento al escritorio en camisón. En el papel solo he escrito un nombre. Un sirviente espera fuera para llevar el mensaje; su sombra se mueve en la rendija de la puerta y después queda inmóvil.\n\nCargo la pluma de tinta y la dejo suspendida sobre el papel. La frase que quiero escribir es clara: esta noche, por la puerta lateral, sin que nadie más lo sepa. Pero, en cuanto la escriba, dejará de ser algo que solo existe en mis pensamientos. La mecha chisporrotea y una gota de tinta cae junto al nombre.\n\nEl sirviente carraspea suavemente. Todavía no he sellado la carta."
 latria_sexual_frustration_flavor.1301.desc: "Llevo mucho rato con una carta sin sellar bajo la lámpara.\n\nEn la hoja solo figura el saludo. Después queda espacio para muchas frases, pero no he escrito ninguna. El lacre ya se ha ablandado al calor y tengo la cucharilla a mano. No la recojo.\n\nEl aceite de la lámpara ha bajado. La tinta del nombre sigue húmeda."
 latria_sexual_frustration_flavor.1301.a: "Terminar la carta y dársela al sirviente."
 latria_sexual_frustration_flavor.1301.b: "Guardar la carta, reprimir el anhelo y retirarme."

 latria_sexual_frustration_flavor.1302.t: "El juicio de una corte"
 latria_sexual_frustration_flavor.1302.desc.accepted: "El poeta de la corte bromea sobre antiguos amores y ni los nobles más severos fruncen el ceño. Cuenta un asunto de alcoba como si fuera una anécdota de caza. Los demás alzan sus copas y el vino traza un círculo de luz al moverse.\n\nSonrío y levanto la mía, pero el vino me sabe amargo. No soy quien aparece en la historia, aunque al oírla parece que también hayan sacado mis noches a la vista de todos. Quien se sienta a mi lado me toca la manga y pregunta por qué no intervengo. Solo entonces advierto que he sonreído tarde.\n\nEl poeta empieza otra frase. Mi copa sigue en el aire."
 latria_sexual_frustration_flavor.1302.desc.strict: "Un noble ha perdido su honra por una relación clandestina y todos hablan de su familia. Pronuncian las palabras despacio, como si dictaran sentencia. Alguien niega con la cabeza; otro vuelve a calcular los matrimonios de sus hijos.\n\nEscucho sus juicios y recuerdo que estoy en la misma balanza. En el otro platillo hay una carta sin enviar y varias noches de mal sueño. Nadie ha visto aún esas cosas, pero eso no las quita de la balanza.\n\nAlguien me pregunta qué opino. Dejo la copa sobre la mesa y su base golpea la madera."
 latria_sexual_frustration_flavor.1302.desc: "La conversación de la mesa ha pasado a la honra y al deseo.\n\nAl principio solo era una broma. Cuando empiezan a nombrar una puerta concreta y una hora precisa, deja de hacerme gracia. Permanezco en mi asiento, pendiente de mis manos, que se aprietan bajo el mantel.\n\nLos músicos siguen tocando muy bajo, como si temieran tapar aquellas palabras."
 latria_sexual_frustration_flavor.1302.a: "Hablar de mi anhelo y volver a él una y otra vez en la conversación."
 latria_sexual_frustration_flavor.1302.b: "Callarme, dar las gracias a mis anfitriones y despedirme."

 latria_sexual_frustration_flavor.1303.t: "La campana de medianoche"
 latria_sexual_frustration_flavor.1303.desc.favors: "Después de la campanada, el sacerdote sigue junto a la puerta. Dice que el deseo puede encaminarse hacia el bien; habla bajo, pero en la noche lo oigo con claridad. Las velas del templo alargan su sombra hasta mis rodillas.\n\nYo no sé si todavía quiero esperar a ese bien. La espera misma se ha convertido en otro precepto. Noto las manos calientes dentro de las mangas y ningún pasaje sagrado parece dar cabida a esa inquietud. El sacerdote me mira como si supiera que he dejado sin hacer la segunda mitad de mi pregunta.\n\nEl eco de la campana aún resuena entre las vigas. Sigo de rodillas y ya se me han entumecido."
 latria_sexual_frustration_flavor.1303.desc.condemns: "La campana resuena una y otra vez, y los votos que recita el sacerdote vuelven a pesar sobre mí con cada repetición. Se me entumecen las rodillas; mi propio calor hace rato que ha borrado el frío de la losa. La respuesta sigue sin llegar.\n\nConozco cada palabra de los votos. Conocerlas no es lo mismo que aceptarlas. Al llegar a «renunciar», la lengua se me detiene un instante antes de dejar salir la palabra. El sacerdote no me corrige, pero yo he oído muy bien esa pausa.\n\nTermina la última campanada. El templo queda tan silencioso que puedo oír caer la cera."
 latria_sexual_frustration_flavor.1303.desc: "La oración de medianoche no me ha traído calma y la campana sigue resonando.\n\nHe acompañado la recitación hasta la última frase. Al terminar, sigo de rodillas en el mismo sitio, y mi preocupación tampoco se ha movido. El sonido de la campana no ha cambiado nada en ella.\n\nEl sacerdote cierra el libro. El roce de las páginas al juntarse suena más cerca que la campana."
 latria_sexual_frustration_flavor.1303.a: "Dejar los preceptos de abstinencia en el templo."
 latria_sexual_frustration_flavor.1303.b: "Reprimir el pensamiento y recitar la oración una vez más."

 latria_sexual_frustration_flavor.1304.t: "El fin de la paciencia"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Recorro la habitación en camisón. En el tablero que ha traído el sirviente no se ha movido una sola pieza. La ventana está entreabierta y deja pasar el aire de la noche, que no consigue aliviar el calor que siento.\n\nMe he detenido junto a la cama, junto a la mesa y también junto a la puerta. Detrás no se oyen pasos. La espera se ha convertido en otro tormento: sé que nadie vendrá, pero sigo confundiendo cada golpe del tambor de la ronda con una llamada. Las piezas chocan dentro de la caja; ha sido mi propia manga.\n\nRegreso al tablero y apoyo la mano sobre un peón, sin adelantarlo."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Vuelvo a ajustar el lazo del camisón, procurando que cada movimiento parezca sereno. Noto con claridad la presión de la cinta. Cuanto más cuidado pongo, más difícil me resulta fingir que el deseo no está ahí.\n\nEl tablero sigue sobre la mesa, como una ocupación correcta a la que podría dedicarme. Me siento, levanto una pieza y la devuelvo a su sitio. Después mis dedos siguen inquietos, buscando algo distinto que hacer. Dejo la mano bajo la mesa para contenerla, pero pierdo la calma al respirar.\n\nLa habitación está en silencio. Tanto que puedo oír la maldición que no he pronunciado."
 latria_sexual_frustration_flavor.1304.desc: "La habitación está en silencio, pero ya no consigo permanecer en mi asiento.\n\nMe levanto a servir agua y no la bebo. Voy a recortar la mecha, la corto demasiado y la llama baja. Empiezo una tarea tras otra, sin que ninguna consiga devolverme a la silla.\n\nAl final me quedo en medio de la estancia, sin saber dónde poner las manos."
 latria_sexual_frustration_flavor.1304.a: "Apartar el tablero y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1304.b: "Volver al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1305.t: "Una habitación tras el anochecer"
 latria_sexual_frustration_flavor.1305.desc.emperor: "La corte se ha retirado y yo sigo en mi alcoba con la ropa de ceremonia. Los informes están despachados, la tinta de los sellos se ha secado y los pasos de los consejeros ya se han alejado. Mi preocupación no ha salido con ellos.\n\nEmpiezo a desabrocharme el cuello y me detengo a medias. La cama está hecha, demasiado impecable para que parezca posible acostarse en ella. Permanezco un rato ante el espejo. Bajo la ropa ceremonial sigo siendo yo, con algo en la mirada que no ha quedado recogido en ningún informe.\n\nLos sirvientes preguntan desde fuera si deseo que me retiren la corona. Les digo que aún no entren."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Mis compañeros ya descansan en la posada, pero yo sigo a solas en mi habitación. El equipaje está recogido y la ruta de mañana figura en la tablilla detrás de la puerta. No encuentro dónde dejar mis pensamientos; no ocupan espacio en las alforjas, pero llenan toda la estancia.\n\nMe siento al borde de la cama sin quitarme las botas. Abajo alguien canta con voz de borrachera hasta que un compañero le tapa la boca. Las risas suben hasta aquí, como si vinieran de otra noche a la que yo no pudiera entrar.\n\nEnrollo el mapa y vuelvo a desplegarlo. Los caminos siguen siendo los mismos."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Permanezco a solas en mi pequeña estancia, todavía con las vestiduras puestas. La vela junto a la cama pierde fuerza. Los votos siguen ahí, palabra por palabra, tal como los recité durante el día. El consuelo no ha llegado.\n\nMe quito las cuentas de oración de la muñeca y las dejo pasar entre los dedos. Una tras otra, hasta que ya no acompaño su paso con oraciones. Recuerdo a alguien de pie en la galería y cómo fui yo quien apartó primero la mirada. Apartarla no hizo desaparecer a esa persona.\n\nEl cuello de las vestiduras me roza. No me las quito."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Regreso a una alcoba vacía con la ropa de ceremonia. Los guardias me saludan fuera; suenan las placas de la armadura y después el pestillo. Dentro no hay nadie con quien compartir lo que me preocupa.\n\nTodavía llevo la corona. Me la quito y la dejo junto a la almohada, como si depositara otra cabeza. La persona del espejo parece capaz de presentarse mañana ante la corte. Solo yo sé cómo pasaré esta noche.\n\nMe siento junto a la cama. Aún llevo puesto uno de los guantes."
 latria_sexual_frustration_flavor.1305.desc: "No hay nadie más en la habitación, pero sigo resistiéndome a acostarme.\n\nLa lámpara está encendida, todavía llevo los zapatos y la ropa conserva su buena apariencia. Tomo todo eso como prueba de que aún podría salir a ver a alguien. En realidad, nadie me espera. Solo quiero evitar enfrentarme a aquella cama hecha.\n\nEl viento entra por la rendija de la ventana y ladea la llama."
 latria_sexual_frustration_flavor.1305.a: "Mandar llamar a una persona de confianza, pese a lo tarde que es, y hablar largo y tendido."
 latria_sexual_frustration_flavor.1305.b: "Reprimir el anhelo, quitarme las vestiduras y retirarme."

 latria_sexual_frustration_flavor.1306.t: "Un mensajero a medianoche"
 latria_sexual_frustration_flavor.1306.desc.female: "Me siento junto a la cama en camisón y oigo dos golpes suaves en la puerta. No son la señal acordada, sino la llamada corriente de mi doncella cuando trae algo. Entra, deja una hoja en blanco y vuelve a salir sin mirar hacia la cama.\n\nEl papel vacío hace más ruido que una carta llena. Sé de quién espero noticias y sé también que esta noche no llegarán. Acerco la hoja a la lámpara; la luz revela unas fibras, como una línea que todavía no ha llegado a escribirse.\n\nMantengo los dedos sobre el papel tanto tiempo que dejan una pequeña marca húmeda."
 latria_sexual_frustration_flavor.1306.desc.male: "Abro la puerta en camisón, pero la galería ya está vacía. Junto al umbral hay una nota sin firma. Quizá alguien la haya dejado al pasar o quizá se haya caído allí durante el día. La recojo y sigo sin poder dormir.\n\nNo contiene las palabras que esperaba. Habla de una hora para mañana y de una cantidad pendiente de pago. Aun así, leo todas las líneas y después le doy la vuelta. El reverso está en blanco; esa cara parece esperar todavía más que escriba algo.\n\nSe apaga la luz de la galería. Yo continúo junto a la puerta, sin cerrarla del todo."
 latria_sexual_frustration_flavor.1306.desc: "Los pasos se alejan al otro lado de la puerta y sigo sin escribir la carta que tengo sobre la mesa.\n\nHe levantado la pluma tres veces. La primera escribí una palabra y la taché. La segunda solo dejé un punto de tinta. A la tercera volví a dejar la pluma y miré cómo se secaba despacio aquella mancha.\n\nYa ha pasado la mitad de la noche. La hoja sigue casi vacía."
 latria_sexual_frustration_flavor.1306.a: "Escribir las palabras que tanto he demorado."
 latria_sexual_frustration_flavor.1306.b: "Guardar la hoja, ahogar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1307.t: "Silencio en la mesa"
 latria_sexual_frustration_flavor.1307.desc.accepted: "El poeta recita un antiguo romance y todos escuchan con entusiasmo. Unos marcan el ritmo sobre la mesa; otros completan el verso antes de que lo termine. Las copas giran entre las manos y nadie cree necesario evitar el asunto ante persona alguna.\n\nAlzo mi copa con los demás, pero recuerdo una historia de la que nadie habla. No sonaba tan hermosa como el poema ni tuvo tantos oyentes. Solo hubo una puerta cerrada y, después, yo a solas hasta el amanecer. Cuando el poeta llega al verso del abrazo, se me derrama una gota de vino.\n\nNadie ha visto esa gota. Yo sí."
 latria_sexual_frustration_flavor.1307.desc.strict: "En la mesa mencionan a un noble que perdió el favor por una relación clandestina y las risas cesan enseguida. Se apagan todas a la vez, como una cuerda que alguien acaba de sujetar. Miro hacia la ventana para que no puedan leerme la expresión.\n\nFuera no hay mucho que ver, salvo una luz de la ronda. Sigo mirándola. A mi espalda alguien murmura que se lo ha buscado. Quizá no vaya por mí, pero la frase me cae encima, sobre aquel asunto mío que todavía no han descubierto.\n\nSujeto la copa con firmeza. Los nudillos se me quedan blancos."
 latria_sexual_frustration_flavor.1307.desc: "Las copas siguen pasando, pero la conversación se ha detenido en el asunto que menos quisiera oír.\n\nHace un momento hablaban de la cosecha. Al siguiente, alguien ha mencionado la alcoba de otra persona y nadie ha devuelto la charla a su cauce. Permanezco en medio de esa pausa, oyendo mis propios latidos por encima de la música.\n\nAlguien tose para llenar el silencio. No lo consigue."
 latria_sexual_frustration_flavor.1307.a: "Dejar que el vino me suelte la lengua y contar una historia privada tras otra."
 latria_sexual_frustration_flavor.1307.b: "Callarme, inclinarme ante los presentes y despedirme."

 latria_sexual_frustration_flavor.1308.t: "Una oración durante la vigilia"
 latria_sexual_frustration_flavor.1308.desc.favors: "Ya ha sonado la campana de la vigilia y sigo rezando en el santuario. La doctrina no rechaza los placeres de la carne; podría señalar el pasaje a cualquiera. Pero señalarlo no me dice qué hacer con la inquietud que siento ahora, de rodillas.\n\nEl banco está vacío. La vela proyecta mi sombra sobre el respaldo, donde se mueve con mi respiración como alguien más que tampoco quisiera velar. Recuerdo una invitación que casi pronuncié durante el día y cómo la cambié por otras palabras. Cambiar la frase no cambió mi deseo.\n\nEl eco de la campana se aleja. Sigo de rodillas, con la frente húmeda de sudor."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Repito la oración de castidad en el santuario. La primera vez la digo entera; en la segunda empiezo a saltarme palabras y en la tercera me detengo en una misma frase, incapaz de continuar.\n\nLa campana se oye cada vez más lejos, pero mis pensamientos no retroceden con ella. Apoyo las palmas en la losa para tomar prestado algo de su frescor. Pronto la piedra se calienta y eso solo me deja más claro contra qué estoy luchando.\n\nNo hay nadie en los bancos vacíos. Aun así, mantengo la voz muy baja."
 latria_sexual_frustration_flavor.1308.desc: "La luz de las velas ilumina los bancos vacíos y yo sigo sin levantarme.\n\nLa vigilia debería terminar aquí. Sin embargo, temo que al ponerme en pie vuelva toda la inquietud que he intentado contener de rodillas. Así que permanezco en esta postura, aplazando el momento de marcharme.\n\nLa última vela chisporrotea. Una hebra de humo negro asciende y se dispersa bajo las vigas."
 latria_sexual_frustration_flavor.1308.a: "Apartar la oración de abstinencia y salir siguiendo mi corazón."
 latria_sexual_frustration_flavor.1308.b: "Contener mi deseo y terminar la vigilia."

 latria_sexual_frustration_flavor.1309.t: "Una mirada al espejo"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Permanezco un momento a solas ante el espejo de bronce de mi alcoba, todavía sin vestirme. La figura del espejo no se aparta y yo tampoco recojo la ropa para cubrirla. La lámpara me ilumina de lado y deja el reflejo a plena vista.\n\nMe he cansado de llamar debilidad pasajera a este deseo. No es pasajero: me acompaña desde el atardecer, durante la cena y después de que los demás se retiraran. Ahora solo quedamos el espejo y yo. Levanto una mano hacia mi hombro y el reflejo repite el gesto. Basta ese breve movimiento para que pierda la calma.\n\nNo se oyen pasos fuera. No tengo que fingir."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Me siento al borde de la cama, aún sin vestirme, y repito mis votos en silencio. Recuerdo cada palabra con tanta claridad que noto enseguida si omito una. El deseo, sin embargo, no desaparece. Está aquí conmigo y no puedo atribuírselo a nadie más.\n\nMiro el espejo y aparto los ojos. No sirve de nada; el bronce sigue reflejándome. Entrelazo las manos con fuerza, hasta que los nudillos palidecen, como si así pudiera mantener aquella promesa.\n\nLos votos vuelven a interrumpirse. Esta vez no continúo enseguida."
 latria_sexual_frustration_flavor.1309.desc: "No hay nadie más en la habitación, pero el silencio del espejo me impide eludirme.\n\nLa ropa está en la silla y yo estoy ante el espejo. Solo nos separan unos pasos, aunque he tardado mucho en admitir por qué no recojo las prendas. La llama permanece firme. Mi mirada, no.\n\nMe siento al borde de la cama. La estera está fría, aunque deja de estarlo al poco rato."
 latria_sexual_frustration_flavor.1309.a: "Admitir lo que siento y pensar en ello."
 latria_sexual_frustration_flavor.1309.b: "Vestirme, volver al escritorio y reprimir el pensamiento."

 latria_sexual_frustration_flavor.1310.t: "En vela en mis aposentos"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Regreso a mi pequeña estancia después de la oración nocturna. Aún llevo las vestiduras y la vela de la cabecera pierde fuerza, pero me resisto a acostarme. Sé qué pensamientos volverán en cuanto me tumbe y todavía no he decidido si dejarlos entrar.\n\nLas cuentas de oración reposan junto a la almohada, como un testigo. Aflojo a medias el lazo de las vestiduras y vuelvo a anudarlo. El cuello continúa rozándome y me mantiene en esa vigilia obstinada que no quiere ceder al sueño.\n\nSolo estoy yo en la estancia. Eso no vuelve las cosas más sencillas."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Mis compañeros ya se han retirado en la posada y termino de recoger el equipaje a solas. La ruta de mañana está clara: un paso del río, un tramo por tierra y otro paso. El destino de mis pensamientos, en cambio, no aparece en ningún mapa.\n\nMe quito las botas, pero no me acuesto. Fuera un caballo mastica despacio. Ese sonido debería ayudarme a dormir; al escucharlo, recuerdo la mirada que alguien me dirigió hoy junto al río. Fue tan breve que casi podría no contar. Yo sí la he contado.\n\nLa lámpara da un salto. No añado aceite."
 latria_sexual_frustration_flavor.1310.desc: "La noche está muy avanzada y la puerta cerrada, pero sigo sin poder dormir.\n\nLa cama es buena y la almohada también. Me quedo en el borde, pensando otra vez en la persona a la que no pude acercarme durante el día. Cuando noto el calor de las manos, descubro que he desatado el lazo del camisón sin recordar en qué momento lo hice.\n\nMiro la cinta. Cuelga junto a mis piernas, como una decisión todavía pendiente."
 latria_sexual_frustration_flavor.1310.a: "Escribir a una vieja amistad y hablar con franqueza de mis penas."
 latria_sexual_frustration_flavor.1310.b: "Reprimir el pensamiento, apagar la vela y acostarme."

 latria_sexual_frustration_flavor.1301.c: "Tomar una hoja nueva y convertir la invitación en un poema."
 latria_sexual_frustration_flavor.1302.c: "Devolver la conversación a las familias y las haciendas."
 latria_sexual_frustration_flavor.1302.d: "Contar una historia del camino para que vuelvan a alzar las copas."
 latria_sexual_frustration_flavor.1303.c: "Quedarme hasta el amanecer y estudiar las escrituras línea por línea."
 latria_sexual_frustration_flavor.1304.c: "Disponer las piezas y estudiar un problema de ajedrez."
 latria_sexual_frustration_flavor.1304.d: "Comenzar por el primer movimiento y jugar una partida entera despacio."
 latria_sexual_frustration_flavor.1305.c: "Organizar el trabajo de la mañana antes de apagar la vela."
 latria_sexual_frustration_flavor.1307.c: "Recitar un poema nuevo y atraer su atención hacia otra cosa."
 latria_sexual_frustration_flavor.1308.c: "Cerrar el libro de oraciones y meditar mis pensamientos en silencio."
 latria_sexual_frustration_flavor.1308.d: "Velar hasta la oración matinal y preparar los libros para todos."
 latria_sexual_frustration_flavor.1309.c: "Escribir lo que me inquieta y meditarlo línea por línea."
 latria_sexual_frustration_flavor.1310.c: "Preparar té y guardar mis pertenencias y libros sin prisa."
