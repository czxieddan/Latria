l_spanish:
 latria_sexual_frustration_flavor.1411.t: "Nadie en la puerta"
 latria_sexual_frustration_flavor.1411.desc: "La lámpara se ha consumido hasta un churrete y sigo sin dormir, el camisón subido más allá de mis caderas, mi propia mano donde no he dicho a nadie que va. He dejado de llamar a esto desasosiego. Tres noches llevo dejándome al borde y abandonándome allí, pendiente de un paso en el corredor que no llega. La sábana está húmeda donde llevo demasiado tiempo sin moverme.\n\nPienso en el modo en que aquella persona se inclinó sobre mi silla en el banquete, lo bastante cerca para que sintiera el calor de la sala irse cuando se enderezó. Mi aliento se acorta. Aprieto la palma plana y no me muevo, y el deseo no cede, solo se junta más abajo y más pesado.\n\nEn algún lugar de abajo se cierra una puerta. Mi mano se mueve otra vez, y esta vez no la detengo."
 latria_sexual_frustration_flavor.1411.a: "Terminar lo que mi mano ha empezado y admitir el deseo."
 latria_sexual_frustration_flavor.1411.b: "Retirar la mano y no moverme hasta que la lámpara muera."
 latria_sexual_frustration_flavor.1411.c: "Ponerme un manto y sentarme con el silencio hasta que afloje."

 latria_sexual_frustration_flavor.1412.t: "Más de lo que quería"
 latria_sexual_frustration_flavor.1412.desc: "El salón está ruidoso con lo último del vino y ya he dicho demasiado. Mi vecino preguntó dónde aprendí semejante historia y se lo dije, y luego le dije el resto, la parte que nunca he dicho en voz alta a la luz del día.\n\nAlguien ríe y pide más. Oigo mi propia voz seguir, más rápido, añadiendo el detalle que siempre omito, la hora, la puerta, el modo en que esperé. El vino me ha puesto la cara caliente. Una copa se posa en algún lugar detrás de mí. No consigo detenerme donde se detendría una persona prudente.\n\nLa silla de mi vecino rechina hacia atrás. La música ha terminado y nadie se ha ido todavía a casa, y el salón huele a sebo y a vino derramado, y sigo sosteniendo la copa que quería dejar."
 latria_sexual_frustration_flavor.1412.a: "Decir el resto y dejar que toda la mesa oiga."
 latria_sexual_frustration_flavor.1412.b: "Hacer una reverencia, guardarme el resto tras los dientes y marcharme."
 latria_sexual_frustration_flavor.1412.c: "Llevar la charla a los viejos amigos y dejar que el vino haga el resto."

 latria_sexual_frustration_flavor.1413.t: "Las mismas tres líneas"
 latria_sexual_frustration_flavor.1413.desc: "Me arrodillo ante el altar con el camisón bajo las rodillas y la piedra fría a través de la tela. Las losas me han sacado el calor de las espinillas. El ayudante se ha ido. He recitado el oficio entero y mi boca vuelve una y otra vez a las mismas tres líneas, las de la carne, como si las palabras fueran una puerta ante la que no dejo de pasar.\n\nDe día puedo llamar a esto una prueba y terminar con ello. Aquí, con las velas chisporroteando y nadie que mire, solo puedo medir cuánto de mí quiere salir del templo y llegar a cierta casa antes de que cambie la guardia. El deseo tiene peso. Me duelen las rodillas de llevarlo.\n\nLa vela más cercana se dobla y se endereza. Pongo la mano en la piedra fría y no me alzo."
 latria_sexual_frustration_flavor.1413.a: "Dejar el oficio sin terminar e ir adonde quiero ir."
 latria_sexual_frustration_flavor.1413.b: "Mantener la vigilia y aferrarme a las palabras hasta el alba."
 latria_sexual_frustration_flavor.1413.c: "Leer el pasaje despacio y dejar que el sentido me vuelva."

 latria_sexual_frustration_flavor.1414.t: "La cabalgada no ayuda"
 latria_sexual_frustration_flavor.1414.desc: "Llevamos en la silla desde antes de la luz y los ciervos siguen por delante. Mis manos están firmes en las riendas. Ese es el problema. Todo lo demás en mí no está firme, no lo está desde hace días, y la cabalgada solo lo ha soltado.\n\nSigo viendo a aquella persona en la última cacería, riendo, el pelo mojado del arroyo, y no puedo guardar la imagen. Los perros abren. Dejo que el caballo tome la cabeza y el suelo pasa rápido, y durante unas longitudes no pienso en nada en absoluto.\n\nLuego el bosque se cierra y el paso baja y todo vuelve. Voy en la silla con los muslos ardiendo, la correa del cuerno marcada en mi cadera, y no lo alzo."
 latria_sexual_frustration_flavor.1414.a: "Romper la línea y cabalgar hasta que el pensamiento me salga del cuerpo."
 latria_sexual_frustration_flavor.1414.b: "Mantener la línea, tomar el cuerno y guardar el orden de la cacería."
 latria_sexual_frustration_flavor.1414.c: "Leer el suelo que señala el montero y seguir las huellas."

 latria_sexual_frustration_flavor.1415.t: "La puerta atrancada"
 latria_sexual_frustration_flavor.1415.desc: "La lámpara está baja y la puerta atrancada y la persona que he querido durante un año está aquí, en mi alcoba, sin ropa, con la mano plana en mi pecho. La mano está tibia a través de la tela.\n\nAtraigo aquel cuerpo hacia la cama y el peso es real, el calor de la piel, el pequeño sonido junto a mi oído. Las cuerdas de la cama crujen bajo nosotros. He imaginado esto tantas veces que el hecho casi me deshace antes de que haya pasado nada. Mis caderas se alzan. Su boca encuentra mi garganta y dejo de contar mi propio aliento.\n\nDespués la lámpara sigue encendida, un largo hilo de cera corrido por el soporte. Su pelo está extendido sobre mi brazo y ninguno de los dos ha dicho una palabra sobre la mañana."
 latria_sexual_frustration_flavor.1415.a: "Que se quede, y que la casa hable si ha de hablar."
 latria_sexual_frustration_flavor.1415.b: "Mandar que vuelva a su habitación y tumbarme a solas."
 latria_sexual_frustration_flavor.1415.c: "Alcanzar un libro y leer hasta que mis manos queden quietas."

 latria_sexual_frustration_flavor.1416.t: "La muñeca al otro lado de la mesa"
 latria_sexual_frustration_flavor.1416.desc: "El consejo se ha alargado y no he firmado nada. Mi sello está frío junto a la tinta. El fuego se ha dejado apagar y nadie ha pedido leña. Mi escribiente lee la línea siguiente y oigo la forma de las palabras sin el sentido, porque la persona al otro lado de la mesa tiene la manga recogida y yo miro su muñeca.\n\nMi confidente me sorprende la mirada. Me obligo a pedir que la cláusula se lea otra vez. Se lee otra vez. No entiendo nada. Bajo la mesa mi rodilla ha empezado a moverse y la aprieto quieta con la mano.\n\nCuando los señores se alzan, sigo en el asiento hasta que la sala se vacía. Mi confidente espera junto a la puerta con los papeles, sin decir nada, y siento gratitud y no puedo mirarle."
 latria_sexual_frustration_flavor.1416.a: "Despedir al consejo y tomar la tarde para mí."
 latria_sexual_frustration_flavor.1416.b: "Seguir en el asiento, tomar los papeles y confesarlo a mi confidente."
 latria_sexual_frustration_flavor.1416.c: "Llamar de vuelta al escribiente y resolver cada cláusula antes de alzarme."

 latria_sexual_frustration_flavor.1417.t: "La misma pregunta dos veces"
 latria_sexual_frustration_flavor.1417.desc: "El templo está vacío y mi guía sigue aquí, ordenando los rollos, y no me he ido porque no consigo irme. Hice una pregunta sobre el rito y luego otra, y las dos eran la misma pregunta con ropa distinta.\n\nMi guía responde con paciencia. Los rollos huelen a polvo y a aceite de cedro. Miro las manos moverse entre ellos y pienso en la hora de la noche, y en cuán lejos está el camino hasta cierta puerta, y en si alguien estaría en vela. La lámpara entre nosotros es lo único que me mantiene en el asiento.\n\nMi guía pone un rollo delante de mí y espera. Mis rodillas se han entumecido en el escalón frío. Pongo la mano en el rollo y leo la primera palabra y no la segunda."
 latria_sexual_frustration_flavor.1417.a: "Dar las gracias a mi guía, salir y ir a esa puerta."
 latria_sexual_frustration_flavor.1417.b: "Pedir que el rito se repase una vez más, despacio."
 latria_sexual_frustration_flavor.1417.c: "Desenrollar el pergamino y escuchar lo que dice mi guía."

 latria_sexual_frustration_flavor.1418.t: "Un nombre en el jardín"
 latria_sexual_frustration_flavor.1418.desc: "El jardín está lleno de gente y he bebido lo justo para decir la verdad. Mi copa se ha llenado dos veces sin que lo pidiera. Dije la cosa en voz alta. No todo, sino la parte con un nombre dentro, y el nombre no era el de un desconocido.\n\nLa risa dio la vuelta al grupo y alguien lo repitió y alguien más me miró con interés nuevo. La grava muestra dónde se ha desplazado el círculo. Debí dejarlo pasar como vino. En cambio he dicho más, y el círculo se ha quedado callado como se queda un círculo cuando ha decidido recordar.\n\nUn sirviente avanza por el sendero con una bandeja. Tomo una copa que no quiero y la sostengo contra mi boca para no llenar el silencio."
 latria_sexual_frustration_flavor.1418.a: "Decir el nombre otra vez, con claridad, ante todos."
 latria_sexual_frustration_flavor.1418.b: "Hacer una reverencia, despedirme y dejar el jardín."
 latria_sexual_frustration_flavor.1418.c: "Llevar aparte al invitado más cercano y hablar de otra cosa."

 latria_sexual_frustration_flavor.1419.t: "Desde el corredor"
 latria_sexual_frustration_flavor.1419.desc: "He atrancado la puerta y retirado las mantas y no voy a seguir fingiendo que el cansancio me lo impide. Mi cuerpo está así desde la tarde, desde una mano en mi brazo en el corredor, y no se ha calmado.\n\nPongo los dedos en mí y mi aliento sale de un modo que no querría que se oyera. Pienso en el corredor, en el lino de aquella manga, en la presión exacta de los dedos. Mi espalda se arquea fuera de la cama. Tengo que ponerme la otra mano sobre la boca.\n\nTarda mucho y me deja temblando. La lámpara sigue encendida. Me quedo con el brazo sobre los ojos y las sábanas retorcidas hasta la cintura, oliendo todavía al calor del día, y el deseo no se ha ido, solo está más callado."
 latria_sexual_frustration_flavor.1419.a: "Dejar que siga su curso y no fingir más el cansancio."
 latria_sexual_frustration_flavor.1419.b: "Apretar las manos, respirar despacio y esperar a que pase el temblor."
 latria_sexual_frustration_flavor.1419.c: "Leer una página a la luz de la lámpara hasta que el cuerpo se calme."

 latria_sexual_frustration_flavor.1420.t: "Dos días en la silla"
 latria_sexual_frustration_flavor.1420.desc: "Dos días en la silla y la estepa sigue para siempre. La silla me ha hecho una llaga bajo la rodilla. Mi caballo conoce el paso mejor que yo. No he dormido bien desde que dejamos el campamento, y no es el suelo en que me tumbo lo que me quita el sueño.\n\nPienso en aquella persona trenzándose el pelo junto al fuego, en el modo en que mordía el extremo del hilo. El viento es frío y mis manos están agrietadas y aun así el pensamiento vuelve y se asienta abajo en mí, insistente, como un segundo latido.\n\nCoronamos una loma y la hierba baja hasta el río, una línea pálida sin sonido. Podría volverme a solas. El caballo se mueve debajo, esperando, y me quedo con las riendas flojas y no me vuelvo."
 latria_sexual_frustration_flavor.1420.a: "Volver al campamento y tomar lo que la noche ofrezca."
 latria_sexual_frustration_flavor.1420.b: "Seguir cabalgando con los demás y mantener el paso."
 latria_sexual_frustration_flavor.1420.c: "Soltar el halcón y seguir su vuelo hasta el agua."

 latria_sexual_frustration_flavor.1421.t: "Más allá del cuidado"
 latria_sexual_frustration_flavor.1421.desc: "El banquete ha seguido más allá del punto en que alguien es prudente. Llevo toda la velada mirando a aquella persona, no he apartado la vista ni una vez, y acabo de decirlo, a la sala, con una voz que ha llegado.\n\nUna copa se vuelca. Los músicos no han vuelto a empezar. Alguien ríe, alguien llama, y estoy de pie con las palabras todavía saliendo. He nombrado la hora que quiero y el lugar, y la sala lo ha oído. No hay versión de mañana en la que esto sea solo una broma.\n\nMi vecino tira de mi manga. Me siento porque las piernas se me han vuelto inseguras, la cera ha corrido por la mesa hasta mi manga, y la copa vuelve a mi mano, y sigo mirando al otro lado de la mesa."
 latria_sexual_frustration_flavor.1421.a: "Repetir la hora y el lugar para que nadie oiga mal."
 latria_sexual_frustration_flavor.1421.b: "Sentarme, beber y dejar que el ruido se cierre sobre lo que dije."
 latria_sexual_frustration_flavor.1421.c: "Volverme hacia mi vecino y preguntar por su propia casa."
 latria_sexual_frustration_flavor.1421.d: "Ponerlo todo en un poema para la mesa."

 latria_sexual_frustration_flavor.1422.t: "Tres noches de vigilia"
 latria_sexual_frustration_flavor.1422.desc: "He mantenido la vigilia tres noches seguidas y el ayuno me ha dejado la cabeza ligera. El frío se ha metido en los huesos pequeños de mis pies. Las palabras del oficio están en mi boca y la persona está en mi mente, y las dos se han enredado hasta no poder separarse.\n\nSé lo que pide el voto. Lo dije de buen grado y no lo he dicho a disgusto hasta esta noche. Mis manos están frías y mi estómago ha olvidado qué es el pan. La piedra bajo mis rodillas ha gastado un lugar liso y encajo en él como si llevara años de rodillas aquí, lo cual, en lo que importa, es cierto.\n\nUn hermano tose en algún lugar de la oscuridad, y alguien se mueve en un banco detrás de la columna. Inclino más la cabeza y la oración sigue sin mi voz."
 latria_sexual_frustration_flavor.1422.a: "Romper el ayuno, dejar la vigilia y admitir lo que quiero."
 latria_sexual_frustration_flavor.1422.b: "Guardar el ayuno y sostener el voto el resto de la noche."
 latria_sexual_frustration_flavor.1422.c: "Ir al pasaje sobre el alma y leerlo entero."

 latria_sexual_frustration_flavor.1423.t: "La cifra equivocada"
 latria_sexual_frustration_flavor.1423.desc: "Las cuentas no cuadran y he leído la misma columna cuatro veces. La vela es nueva y la cera no ha corrido. Al otro lado de la sala alguien dicta a un escribiente, y la voz es una que reconocería entre la multitud, y mi mente ha abandonado la columna por completo.\n\nPongo el dedo en la página para guardar el sitio. No lo guarda. La pluma del escribiente sigue moviéndose. Siento mi propio pulso en la garganta, lo cual es absurdo, y la sala está fría, y yo no tengo frío.\n\nCuando el dictado se detiene alzo la vista demasiado rápido. El escribiente espera. Pido otra vez la cifra y anoto la equivocada, y la tinta se seca sobre ella, y no la corrijo hasta que la sala se vacía."
 latria_sexual_frustration_flavor.1423.a: "Dejar las cuentas e ir adonde va la voz."
 latria_sexual_frustration_flavor.1423.b: "Ceñirme a la columna hasta que cada cifra esté bien."
 latria_sexual_frustration_flavor.1423.c: "Pedir el libro mayor y comprobar cada asiento desde el primero."

 latria_sexual_frustration_flavor.1424.t: "El vino intacto"
 latria_sexual_frustration_flavor.1424.desc: "La puerta está con el pestillo echado y el vino intacto y la persona que he querido está aquí con el manto abierto y las manos en mi rostro. Las manos están frías al principio y luego no.\n\nAtraigo aquel cuerpo contra mí y todo es más caliente y más torpe que nada de lo que imaginé. Su rodilla encuentra la cama y el marco golpea una vez contra el muro. Mi mano va a la parte baja de su espalda y más abajo, y el sonido que hace no es callado, y no me importa quién lo oiga. Tiemblo por lo mucho que he esperado.\n\nMás tarde la lámpara se ha consumido y el vino se ha entibiado en la copa. Su cabeza está en mi hombro, mi brazo dormido debajo, y escucho su respiración."
 latria_sexual_frustration_flavor.1424.a: "Decir sin rodeos lo que me ha costado el año de espera."
 latria_sexual_frustration_flavor.1424.b: "Apartarme, arreglar el manto y tener las manos quietas."
 latria_sexual_frustration_flavor.1424.c: "No moverme y leer con la lámpara baja hasta que venga el sueño."

 latria_sexual_frustration_flavor.1425.t: "Manos diligentes"
 latria_sexual_frustration_flavor.1425.desc: "Llevo tres días en el bosque y la caza ha sido buena y nada de ello ha tocado lo que hay en mí. Soy diligente. Me alzo antes que los demás, veo el equipo secarse, tomo la línea que me asigna el montero. Mis manos hacen lo que se les dice.\n\nEl resto de mí está en otra parte. Recuerdo una tarde concreta, un umbral, una persona diciendo mi nombre de un modo que no he podido olvidar, y el recuerdo viene mientras estoy de pie en los estribos y otra vez mientras limpio la caza, con el olor del pellejo en las manos.\n\nEl fuego está bajo y las brasas chasquean al enfriarse. Me duelen los brazos del día y me quedo de espaldas con los ojos abiertos, escuchando a los caballos moverse."
 latria_sexual_frustration_flavor.1425.a: "Dejar la línea y sacar el ruano a la oscuridad."
 latria_sexual_frustration_flavor.1425.b: "Respirar, apretar la cincha y terminar el trabajo del día."
 latria_sexual_frustration_flavor.1425.c: "Ver el equipo seco y la cuenta hecha antes de dormir."

 latria_sexual_frustration_flavor.1426.t: "Página y media"
 latria_sexual_frustration_flavor.1426.desc: "El estudio está callado y mi guía ha dispuesto el texto y he leído página y media sin retener una palabra. Mi pulgar ha dejado una marca en el margen. La lámpara es buena. La noche es larga. No se me espera en ninguna parte.\n\nSigo pensando en la hora en que la casa duerme y el corredor está vacío. Mi guía vuelve una página y pregunta si sigo el argumento. Digo que sí. No lo sigo desde la primera línea sobre la naturaleza del alma, lo cual es una lástima, porque es la línea que más necesito.\n\nMi guía espera, pluma en mano, y la silla tiene una junta que se queja cuando me muevo. Miro la página y mi propia mano está plana en la madera, muy quieta, como si perteneciera a alguien más tranquilo."
 latria_sexual_frustration_flavor.1426.a: "Cerrar el libro y salir mientras el corredor está vacío."
 latria_sexual_frustration_flavor.1426.b: "Seguir en el asiento y leer la página otra vez desde el principio."
 latria_sexual_frustration_flavor.1426.c: "Pedir a mi guía que repase el argumento una vez más."

 latria_sexual_frustration_flavor.1427.t: "Generoso con el vino"
 latria_sexual_frustration_flavor.1427.desc: "He sido generoso con el vino y la compañía lo ha sido conmigo, y en algún punto le he dicho a la mesa lo que quiero. No llanamente. Bastante llanamente. Hay aquí una persona cuyo nombre dije y cuyo rostro no miré mientras lo decía.\n\nAlguien ha dejado de reír, y un perro roe algo bajo el banco. Mi copa está vacía y un sirviente la llena y lo dejo. La sala tiene la quietud de la gente que decide qué hacer con una cosa que le han puesto en las manos.\n\nEl sitio de mi hermana está vacío esta noche y su copa sigue donde el sirviente la dejó, lo cual es una misericordia que no merezco. Pongo las dos manos en la mesa y la madera está fresca y la música empieza otra vez en el extremo opuesto del salón."
 latria_sexual_frustration_flavor.1427.a: "Decirlo una vez más, con el nombre, y dejar que la familia oiga."
 latria_sexual_frustration_flavor.1427.b: "Dar las gracias, tomar mi capa y marcharme."
 latria_sexual_frustration_flavor.1427.c: "Llenar las copas y llevar la charla a la cosecha."
 latria_sexual_frustration_flavor.1427.d: "Contestar bromas al invitado más ruidoso hasta que la sala pase a otra cosa."

 latria_sexual_frustration_flavor.1428.t: "Los iconos miran"
 latria_sexual_frustration_flavor.1428.desc: "El templo está frío y todos los iconos miran y no me he movido en una hora. Mis rodillas se han entumecido. El deseo no. Se asienta en mí como una brasa que no se deja cubrir. El humo de la vela sube recto, sin corriente.\n\nHe rezado por la liberación y he rezado por la fuerza, y aquí, al menos, no me engaño sobre cuál quiero que responda. El rostro de aquella persona sube entre el oro y yo. No lo aparto. La lámpara huele a aceite y el mármol está frío y a mi cuerpo no le interesa ninguno de los dos.\n\nLos pasos del sacerdote pasan detrás de mí. Mantengo la cabeza baja y las manos juntas, mis rodillas dejando dos marcas húmedas en la piedra, y la mente en un umbral al otro lado de la ciudad."
 latria_sexual_frustration_flavor.1428.a: "Alzarme, cruzar la ciudad y dejar que los iconos sigan su vigilia."
 latria_sexual_frustration_flavor.1428.b: "Sostener el voto y seguir en el mármol hasta que el oficio termine."
 latria_sexual_frustration_flavor.1428.c: "Abrir el libro en los salmos y leer hasta que las palabras sostengan."

 latria_sexual_frustration_flavor.1429.t: "El muro en el solsticio"
 latria_sexual_frustration_flavor.1429.desc: "El jardín a esta hora no es de nadie y estoy en él porque la cama era peor. La noche es tibia. El sendero de grava ha guardado el calor del día. En algún lugar corre una fuente, la única voz del jardín, y el olor de las hierbas es bastante fuerte para saborearse.\n\nNo duermo desde hace dos noches. Recorro el sendero y la grava suena y cada vuelta me trae al mismo muro, aquel contra el que estuve con aquella persona en el solsticio, sin decir nada, los dos sabiendo.\n\nMi mano está en la piedra. Sigue tibia. Una polilla vuelve una y otra vez a la lámpara detrás de mí. Me quedo allí con la frente cerca del muro y el aliento mal, y la fuente sigue."
 latria_sexual_frustration_flavor.1429.a: "Salir por la verja y decírselo a la noche."
 latria_sexual_frustration_flavor.1429.b: "Sostener el voto, retirar la mano del muro y entrar."
 latria_sexual_frustration_flavor.1429.c: "Recorrer el sendero hasta que el cielo se ponga gris y me canse las piernas."

 latria_sexual_frustration_flavor.1430.t: "Las cuerdas están frías"
 latria_sexual_frustration_flavor.1430.desc: "He sacado el instrumento porque la casa duerme y no podía seguir allí. Las cuerdas están frías y el plectro está gastado de un lado. Toco lo que siempre toco y no basta, no basta desde hace una semana.\n\nMis dedos conocen el patrón y el resto de mí está en otra parte, en una habitación con los postigos aún cerrados, en una tarde a la que no dejo de volver. Las notas salen a la oscuridad y nadie las oye.\n\nParo con la mano plana sobre las cuerdas para matar el sonido. El silencio de después es peor. Me quedo con el instrumento sobre las rodillas, las cuerdas flojas por el frío, la cabeza echada hacia atrás contra la silla y la ventana poniéndose gris en el borde."
 latria_sexual_frustration_flavor.1430.a: "Tocarlo entero, mal, hasta que toda la casa oiga."
 latria_sexual_frustration_flavor.1430.b: "Dejar el instrumento y pasar en el asiento el resto de la noche."
 latria_sexual_frustration_flavor.1430.c: "Sacar el tablero y jugar los dos lados hasta que llegue la luz."

 latria_sexual_frustration_flavor.1431.t: "La costura en la oscuridad"
 latria_sexual_frustration_flavor.1431.desc: "La vela chisporroteó hace una hora y no he subido la manta. El camisón está revuelto en torno a mi cintura. Mis dedos han encontrado la costura y luego han ido debajo, despacio, como me he enseñado cuando los corredores están callados. Mantengo los ojos cerrados y traigo de vuelta a quien me sirvió el vino la semana pasada, el modo en que su manga rozó mi muñeca y se quedó un respiro de más.\n\nMi aliento se engancha y se sostiene. Muevo la mano y el deseo se aprieta más, más abajo, un nudo tirado de los dos extremos. Pienso en su boca cerca de mi oído, en las palabras que no terminó. El lino está tibio y húmedo bajo mi palma.\n\nUna tabla cruje en el pasillo. Mi mano se detiene y luego empieza otra vez, y la dejo, y la oscuridad guarda mi secreto un momento más."
 latria_sexual_frustration_flavor.1431.a: "Terminarlo en la oscuridad y reconocer el hambre."
 latria_sexual_frustration_flavor.1431.b: "Retirar la mano y no ceder hasta que la mecha se ahogue."
 latria_sexual_frustration_flavor.1431.c: "Envolverme en la manta y esperar a que el dolor afloje."

 latria_sexual_frustration_flavor.1432.t: "Vísperas sin terminar"
 latria_sexual_frustration_flavor.1432.desc: "La capilla se ha vaciado y estoy de rodillas en camisón sobre la piedra fría, las oraciones adelgazadas y errantes. El sacerdote que me oyó la última vez posó la mano en mi cabeza inclinada y la dejó allí, y no he podido soltar aquel peso desde entonces. Mis palmas aprietan mis muslos a través de la tela fina y el apretar no es oración.\n\nMe muevo sobre las rodillas. La piedra es un golpe a través del lino. Pienso en aquella mano, en su calor, en el modo en que me incliné una fracción hacia ella antes de darme cuenta. Mi aliento se vuelve áspero en el silencio abovedado y aprieto más, buscando y no encontrando la liberación que vine a suplicar.\n\nLa cuerda de la campana cuelga quieta sobre mí. Alzo el rostro hacia el altar oscuro y mantengo las manos donde están."
 latria_sexual_frustration_flavor.1432.a: "Dejar que el cuerpo tenga lo que la oración le negó."
 latria_sexual_frustration_flavor.1432.b: "Juntar las manos y sostener la vigilia hasta el alba."
 latria_sexual_frustration_flavor.1432.c: "Abrir el libro y leer hasta que las palabras me enfríen."

 latria_sexual_frustration_flavor.1433.t: "El lecho de helechos"
 latria_sexual_frustration_flavor.1433.desc: "La cacería se dispersó al anochecer y estoy a solas en la oscuridad verde con mi caballo pastando cerca. Me deslizo contra un tronco con musgo y mi ropa de montar está húmeda de sudor. El recuerdo que me caza es el de quien me sujetó por la cintura para levantarme sobre el arroyo, su pecho duro contra mi espalda, su aliento en mi cuello. Mi mano se ha deslizado dentro del cinturón.\n\nPresiono y la corteza me muerde el hombro. Pienso en sus brazos, en el modo en que no soltó enseguida. Mi aliento humea en el aire frío. El deseo se enrosca más fuerte con cada movimiento lento y el bosque guarda su silencio alrededor, las hojas goteando en algún lugar fuera de la vista.\n\nUna ramita se quiebra. Mi mano se queda quieta. El caballo alza la cabeza, y sigo contra el árbol con el pulso fuerte en los oídos."
 latria_sexual_frustration_flavor.1433.a: "Aliviarlo aquí contra el árbol."
 latria_sexual_frustration_flavor.1433.b: "Retirar la mano y respirar despacio hasta que pase."
 latria_sexual_frustration_flavor.1433.c: "Alzarme y llevar el caballo de vuelta entre los árboles."

 latria_sexual_frustration_flavor.1434.t: "La nota sin enviar"
 latria_sexual_frustration_flavor.1434.desc: "El fuego del estudio está bajo y la carta yace a medio escribir bajo mi mano, la que no enviaré. Leo la última línea que puse, una línea sincera, demasiado sincera, y mi otra mano se ha deslizado a los lazos de mis calzas. Pienso en quien se inclinó demasiado cerca sobre este mismo escritorio y leyó mi rostro en lugar del mapa, y sonrió.\n\nAflojo los lazos. Mi aliento se acorta. Traigo de vuelta la inclinación de aquella cabeza, la invitación que fui demasiado prudente para responder, y mi mano se mueve con voluntad propia, la pluma seca en la otra. El fuego chasquea. El deseo se junta y no se deja razonar hasta algo que yo pueda archivar.\n\nLa vela se inclina en una corriente. Cierro los ojos y dejo que el pensamiento termine lo que empezó aquella persona."
 latria_sexual_frustration_flavor.1434.a: "Poner la verdad por escrito y aliviar el dolor que encendió."
 latria_sexual_frustration_flavor.1434.b: "Atar los lazos y retirarme con una palabra fría."
 latria_sexual_frustration_flavor.1434.c: "Tomar el mapa y sopesar el asunto en frío."

 latria_sexual_frustration_flavor.1435.t: "Después de la última copa"
 latria_sexual_frustration_flavor.1435.desc: "El banquete se ha reducido a unas velas que chisporrotean y el invitado frente a mí no se ha ido. Bajo la mesa mi rodilla ha venido a posarse contra la suya y ninguno de los dos la ha movido. El vino zumba en mí. Pienso en el modo en que rió mi broma y se inclinó, lo bastante cerca para que yo hubiera podido volver la boca la corta distancia hasta la suya.\n\nMi mano libre aprieta el banco. Quiero cerrar ese espacio más que nada que haya querido en mucho tiempo, y el deseo es un hilo brillante tensado de mi garganta a mi vientre. Ese invitado mira por encima del borde de la copa. El último sirviente se ha ido. El salón huele a sebo gastado y a nosotros dos respirando.\n\nSu rodilla aprieta de vuelta, una vez. Mi mano deja el banco y encuentra el borde de su manga, y ninguno de los dos habla."
 latria_sexual_frustration_flavor.1435.a: "Dejar que la música cubra lo que haga después."
 latria_sexual_frustration_flavor.1435.b: "Inclinar la cabeza y convertir el deseo en oración."
 latria_sexual_frustration_flavor.1435.c: "Proponer una partida y dejar que el tablero me enfríe la sangre."

 latria_sexual_frustration_flavor.1436.t: "Una noche mongola"
 latria_sexual_frustration_flavor.1436.desc: "La yurta está tibia con el fuego de estiércol y el viento escarba en el fieltro de arriba. He vuelto de la gran caza con la sangre aún alta, y ahora yazgo bajo las pieles con la ropa quitada y el cuerpo apenas gobernado. Pienso en quien cabalgó a mi lado todo el día, la trenza balanceándose en la espalda, el modo en que rió ante la presa.\n\nEl fuego pinta las paredes de rojo. Mi mano ha encontrado el camino sobre el vientre y no la hago volver. El humo es dulce, las pieles pesan, y el querer tiene un calor que las llamitas no alcanzan. Traigo de vuelta el porte de sus hombros en la silla, el brillo de sus dientes.\n\nEl viento cae un respiro. Mi mano se mueve y dejo que la noche tome lo que encendió el día."
 latria_sexual_frustration_flavor.1436.a: "Dar a la caza su segundo final, aquí bajo las pieles."
 latria_sexual_frustration_flavor.1436.b: "Cerrar las pieles y gobernar el cuerpo solo con la voluntad."
 latria_sexual_frustration_flavor.1436.c: "Salir al frío y caminar hasta que la sangre se enfríe."

 latria_sexual_frustration_flavor.1437.t: "La azotea a la luz de la luna"
 latria_sexual_frustration_flavor.1437.desc: "La azotea está tibia bajo mi espalda y el jazmín se derrama sobre el parapeto, pesado de aroma. Abajo, la canción de una concubina sube hilada por lo oscuro, y la noche es tan tibia que mi camisón es más adorno que abrigo. He hecho una qasida de mi querer y la he puesto en la forma de la boca de esa persona.\n\nMi mano descansa en la cadera y el dominio que he guardado toda la velada está gastado hasta un solo hilo. La luna es muy brillante. La canción gira y gira. Traigo de vuelta el modo en que me miró sobre el vino, la invitación que aún no he respondido, y mi aliento no quiere ir despacio.\n\nLa última nota se apaga. Mi mano suelta el nudo del camisón, y la noche es lo bastante tibia para dejarlo."
 latria_sexual_frustration_flavor.1437.a: "Responder a la qasida con las manos y dejar que la azotea lo guarde."
 latria_sexual_frustration_flavor.1437.b: "Rehacer el camisón y aferrarme al borde que he guardado."
 latria_sexual_frustration_flavor.1437.c: "Tomar un libro de versos y dejar que palabras ajenas enfríen las mías."

 latria_sexual_frustration_flavor.1438.t: "El rito de la unión"
 latria_sexual_frustration_flavor.1438.desc: "El rito más santo de mi fe manda la unión del cuerpo, y he venido al altar a guardarlo. Las velas están altas. Mi camisón es fino contra el frío de la piedra, y las palabras del rito me han deshecho puntada a puntada, hasta que el deseo ya no es falta sino sacramento posado sobre el mantel del altar.\n\nMe arrodillo y mis manos no están firmes. El rito nombra santo este anhelo, y mi cuerpo responde a ese nombre con un calor que no se reza. Traigo de vuelta las manos que se encontrarán aquí con las mías, el voto que hace de esta carne un templo.\n\nLa campana del rito está por sonar. Me alzo a su encuentro, y ya estoy deshecho."
 latria_sexual_frustration_flavor.1438.a: "Guardar el rito y dejar que la unión se haga sacramento."
 latria_sexual_frustration_flavor.1438.b: "Sostener la vigilia a solas y atar el anhelo al altar."
 latria_sexual_frustration_flavor.1438.c: "Leer el rito despacio y dejar que su sentido me haga entero."

 latria_sexual_frustration_flavor.1439.t: "El jardín andalusí"
 latria_sexual_frustration_flavor.1439.desc: "Medianoche en el jardín y la fuente guarda su sonido pequeño. He estado leyendo el tawq al-hamama, la poesía de la paloma, del amor, y los versos me han dejado hueco de querer. Del otro lado del muro está quien me está prohibido, y esta noche el muro parece cosa delgada y necia.\n\nLos naranjos guardan lo último del calor del día. Mi mano ha venido a posarse en la garganta y el querer está muy cerca del borde, a un respiro de derramarse. Traigo de vuelta el rostro de esa persona a la luz de la lámpara, el juego de miradas y rechazos que hemos jugado sobre el agua.\n\nLa fuente vacila y luego sigue. Mi mano tiembla y no cae, y la noche contiene el aliento conmigo."
 latria_sexual_frustration_flavor.1439.a: "Dejar que el querer se derrame y responder al juego de esa persona."
 latria_sexual_frustration_flavor.1439.b: "Retirarme tras una palabra cortés y dejar el muro entero."
 latria_sexual_frustration_flavor.1439.c: "Sentarme con alguien junto a la fuente y dejar que la charla enfríe el verso."

 latria_sexual_frustration_flavor.1440.t: "El ayuno del santo"
 latria_sexual_frustration_flavor.1440.desc: "Guardo el ayuno del santo y el cuerpo se ha vuelto una prisión que recorro. El voto que juré está gastado como paño viejo, y sobre la piedra fría del suelo del templo siento el borde mismo de romperlo. Mi pulso corre más que las oraciones.\n\nMi camisón es fino y la piedra me saca el calor de las rodillas. Aprieto las manos planas contra las losas y la carrera de mi sangre no se aquieta con el frío. Traigo de vuelta el roce que me he negado, la tibieza de la que he jurado ayunar, y mi aliento viene corto.\n\nLa vela junto a mi cabeza arde recta. Me aferro al borde, y el ayuno y el pulso guerrean en lo oscuro."
 latria_sexual_frustration_flavor.1440.a: "Romper el silencio y confesar cuán gastado está el voto."
 latria_sexual_frustration_flavor.1440.b: "Apretarme a la piedra fría y guardar el ayuno toda la noche."
 latria_sexual_frustration_flavor.1440.c: "Abrir las devociones y dejar que una voz más sabia me guíe de vuelta."
