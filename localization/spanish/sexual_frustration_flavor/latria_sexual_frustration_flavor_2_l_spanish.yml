l_spanish:
 latria_sexual_frustration_flavor.1101.t: "En vela bajo el dosel"
 latria_sexual_frustration_flavor.1101.desc.female: "Despierto en la cama, con el camisón caído a sus pies. No hay nadie más en la alcoba; el silencio solo agudiza el anhelo que quedó sin respuesta."
 latria_sexual_frustration_flavor.1101.desc.male: "Despierto en la cama, con el camisón caído a sus pies. El mundo tras la ventana está en silencio, pero el sueño no retiene mis pensamientos."
 latria_sexual_frustration_flavor.1101.desc: "El dosel cuelga bajo. La noche es larga y mis pensamientos no se calman."
 latria_sexual_frustration_flavor.1101.a: "Cerrar los ojos y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1101.b: "Apartar el pensamiento, correr las cortinas y volver a dormir."

 latria_sexual_frustration_flavor.1102.t: "Miradas entre bailes"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Pasan varios bailes y los rostros a mi alrededor cambian. A nadie le molesta un giro cercano, pero yo recuerdo aquel breve cruce de miradas."
 latria_sexual_frustration_flavor.1102.desc.strict: "Cuanto más cercano es el baile, más parecen susurros las risas. Dirijo la mirada a los músicos para que nadie adivine mis pensamientos."
 latria_sexual_frustration_flavor.1102.desc: "La música se acelera, pero el baile no se lleva mis pensamientos."
 latria_sexual_frustration_flavor.1102.a: "Pedir otro baile y acercarme un poco más."
 latria_sexual_frustration_flavor.1102.b: "Dar las gracias a mi pareja con una reverencia y retirarme a un lado del salón."

 latria_sexual_frustration_flavor.1103.t: "A la puerta del guía"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mi guía espiritual dice que negar el deseo no es el único camino a la devoción. Quisiera preguntar más, pero unos pasos se han detenido ante la puerta."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mi guía espiritual me recuerda que la castidad importa más allá de las miradas ajenas. Inclino la cabeza, esperando que no haya más preguntas."
 latria_sexual_frustration_flavor.1103.desc: "La habitación está en penumbra. Sopeso cómo hablar con mi guía espiritual."
 latria_sexual_frustration_flavor.1103.a: "Admitir mi anhelo y dejar de ocultarlo."
 latria_sexual_frustration_flavor.1103.b: "Preguntar solo por mis deberes actuales y callarme lo demás."

 latria_sexual_frustration_flavor.1104.t: "El águila que no regresa"
 latria_sexual_frustration_flavor.1104.desc.lustful: "El águila gira sobre el campo y no vuelve a mi guante. Envidio su libertad para seguir sus deseos sin dar explicaciones."
 latria_sexual_frustration_flavor.1104.desc.chaste: "El águila sigue girando. Mis sirvientes preguntan si pienso lanzar otra flecha. Les pido que esperen, como si la paciencia pudiera resolverlo todo."
 latria_sexual_frustration_flavor.1104.desc: "El águila no vuelve y los cazadores esperan mi palabra."
 latria_sexual_frustration_flavor.1104.a: "Dejar que el águila gire mientras mis pensamientos vagan."
 latria_sexual_frustration_flavor.1104.b: "Concentrarme y llamar al águila de vuelta al campamento."

 latria_sexual_frustration_flavor.1105.t: "Velas y una corona"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Un sirviente saca la corona de mi alcoba y deja los decretos pendientes junto a las velas. Me ciño el camisón y saco la carta sin enviar de entre los documentos."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Me pongo el camisón en la habitación de la posada. Mis compañeros se han retirado, pero la carta sin enviar junto a mi equipaje me mantiene en vela."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Doblo las vestiduras y me siento junto a la cama en camisón. La carta sin enviar yace bajo las escrituras; una vez más, la saco."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Mis sirvientes guardan mis ropas de ceremonia. En camisón, bajo la lámpara, despliego la carta sin enviar antes de atender los documentos pendientes."
 latria_sexual_frustration_flavor.1105.desc: "Las velas se consumen. Una carta sin enviar sigue a mi alcance."
 latria_sexual_frustration_flavor.1105.a: "Dar la carta a un mensajero."
 latria_sexual_frustration_flavor.1105.b: "Destruirla, apartar el pensamiento y apagar la vela para dormir."

 latria_sexual_frustration_flavor.1106.t: "Inquietud a la luz de las velas"
 latria_sexual_frustration_flavor.1106.desc.female: "En camisón, me siento junto a la cama mientras la luz de las velas se mueve por la ventana. Es tarde, pero el anhelo sin respuesta no me ha abandonado."
 latria_sexual_frustration_flavor.1106.desc.male: "En ropa de dormir, me siento junto a la cama. La guardia nocturna ha cruzado el patio dos veces y mis pensamientos siguen sin calmarse."
 latria_sexual_frustration_flavor.1106.desc: "La vela se consume, pero el sueño no llega bajo el dosel."
 latria_sexual_frustration_flavor.1106.a: "Dejar que mis pensamientos se detengan en aquel afecto."
 latria_sexual_frustration_flavor.1106.b: "Dejar de pensar en ello, apagar la vela y disponerse a dormir."


 latria_sexual_frustration_flavor.1107.t: "Un baile en respuesta"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Mi pareja pide otro baile y los demás lo toman por cortesía. Recuerdo el pensamiento que me cruzó la mente cuando su mano se demoró."
 latria_sexual_frustration_flavor.1107.desc.strict: "Mi pareja pide otro baile y varios rostros se vuelven hacia nosotros. Antes de que pueda responder, alguien se inclina para susurrar a un vecino."
 latria_sexual_frustration_flavor.1107.desc: "Los músicos comienzan otro baile, pero no me levanto."
 latria_sexual_frustration_flavor.1107.a: "Aceptar el baile y acercarme."
 latria_sexual_frustration_flavor.1107.b: "Rechazar con una reverencia y desear a mi pareja un baile agradable."

 latria_sexual_frustration_flavor.1108.t: "Oración antes de dormir"
 latria_sexual_frustration_flavor.1108.desc.favors: "En camisón, rezo junto a la cama. Mi fe permite los placeres de la carne, pero la urgencia que llevo dentro no remite."
 latria_sexual_frustration_flavor.1108.desc.condemns: "En camisón, me arrodillo junto a la cama y repito mi voto de castidad. Con cada verso, la voz interior se vuelve más difícil de ignorar."
 latria_sexual_frustration_flavor.1108.desc: "La vela junto a la cama parpadea. La oración continúa."
 latria_sexual_frustration_flavor.1108.a: "Apartar el voto de castidad y admitir mi anhelo."
 latria_sexual_frustration_flavor.1108.b: "Contener mis pensamientos y seguir rezando."

 latria_sexual_frustration_flavor.1109.t: "Un consejo inconcluso"
 latria_sexual_frustration_flavor.1109.desc: "Mis consejeros han propuesto varias vías, pero aún no he escogido ninguna. Mis pensamientos se alejan del asunto y hasta mi silencio se alarga."
 latria_sexual_frustration_flavor.1109.a: "Terminar el consejo y dejarme a solas con mis pensamientos."
 latria_sexual_frustration_flavor.1109.b: "Reprimir el pensamiento y pedir al escribano que continúe."
 latria_sexual_frustration_flavor.1110.t: "Una habitación después de medianoche"
 latria_sexual_frustration_flavor.1110.desc.clergy: "En camisón, vuelvo a mi pequeña habitación. La oración nocturna ha terminado y la vela se consume, pero la carta sin enviar sigue abierta sobre la mesa."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Solo quedan unas pocas lámparas encendidas en la posada. En camisón, me siento al borde de la cama, aún pensando en la carta que nunca envié."
 latria_sexual_frustration_flavor.1110.desc: "Los sonidos tras la puerta se apagan. Permanezco junto a la cama, esperando."
 latria_sexual_frustration_flavor.1110.a: "Terminar la carta y hacer que la envíen al amanecer."
 latria_sexual_frustration_flavor.1110.b: "Atrancar la puerta, apartar el pensamiento y retirarme a dormir."

 latria_sexual_frustration_flavor.1101.c: "Ponerme una túnica, sentarme y dejar que mi respiración se calme."
 latria_sexual_frustration_flavor.1102.c: "Hablar con los músicos sobre sus melodías."
 latria_sexual_frustration_flavor.1103.c: "Preguntar cómo podría convivir con estos sentimientos."
 latria_sexual_frustration_flavor.1103.d: "Empezar por la carta sin enviar y no ocultar nada."
 latria_sexual_frustration_flavor.1104.c: "Pedir a los demás que esperen mientras trabajo con paciencia con el águila."
 latria_sexual_frustration_flavor.1105.c: "Guardar la carta en su estuche y planear el trabajo de mañana."
 latria_sexual_frustration_flavor.1107.c: "Pedir a mi pareja que se siente y hablemos de otra cosa."
 latria_sexual_frustration_flavor.1107.d: "Invitar a toda la mesa a un animado baile en grupo."
 latria_sexual_frustration_flavor.1108.c: "Terminar la oración despacio, sin combatir cada pensamiento."
 latria_sexual_frustration_flavor.1109.c: "Hacer una breve pausa y organizar los asuntos pendientes."
 latria_sexual_frustration_flavor.1109.d: "Ordenar las decisiones urgentes y resolverlas aquí."
 latria_sexual_frustration_flavor.1110.c: "Ponerme una túnica e ir a buscar una taza de caldo caliente."
