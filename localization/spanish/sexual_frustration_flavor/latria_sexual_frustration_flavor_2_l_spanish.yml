l_spanish:
 latria_sexual_frustration_flavor.1101.t: "En vela bajo el dosel"
 latria_sexual_frustration_flavor.1101.desc.female: "Despierto de un sueño ligero. El camisón se ha deslizado hasta los pies de la cama y los hombros y las rodillas me quedan fuera del dosel. No hay nadie más entre las cortinas. Yo misma he revuelto las mantas; en la almohada solo hay una hendidura.\n\nRecojo el camisón. La tela me roza al pasar, pero aquel calor no cede. Fuera ya han anunciado dos veces el paso de las horas. Intento volverme de lado para dormir y, al cerrar los ojos, veo otra vez la nuca de aquella persona cuando se dio la vuelta durante el día. Un gancho del dosel tintinea, como si alguien levantara una esquina de la cortina. No hay nadie.\n\nMe tiendo boca arriba, sin saber dónde dejar las manos. Queda mucha noche y ya he perdido el sueño."
 latria_sexual_frustration_flavor.1101.desc.male: "Despierto de un sueño ligero, con el camisón deslizado hasta los pies de la cama. Más allá del dosel todo está oscuro; solo llega un golpe lejano del tambor de la ronda. Las mantas están hechas un ovillo de tanto dar vueltas.\n\nMe incorporo y vuelvo a acostarme. Al tumbarme, aquella inquietud cálida sigue sin abandonarme. Cuento mis respiraciones y, al llegar a la séptima, recuerdo lo cerca que se puso alguien para hablarme. No ocurrió nada entre nosotros, pero recuerdo demasiado bien aquella distancia.\n\nEl viento levanta una esquina del dosel y vuelve a dejarla caer. El otro lado de la cama sigue frío."
 latria_sexual_frustration_flavor.1101.desc: "Las cortinas de la cama están a medio bajar. La noche aún es larga y no consigo ordenar mis pensamientos.\n\nMe subo la manta hasta el pecho y después la aparto de una patada. Junto a la almohada no hay carta ni compañía, solo mi mano. Tengo la palma caliente y la apoyo sobre la estera para que se enfríe un poco.\n\nVuelven a anunciar la hora. Yo sigo sin dormir."
 latria_sexual_frustration_flavor.1101.a: "Cerrar los ojos y pensar en la persona que anhelo."
 latria_sexual_frustration_flavor.1101.b: "Apartar el pensamiento, correr las cortinas y volver a dormir."

 latria_sexual_frustration_flavor.1102.t: "Miradas entre bailes"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Han sonado tres piezas y varias parejas han dejado paso a otras. Nadie mira con recelo unos pasos demasiado próximos; los músicos incluso aflojan el ritmo para que dé tiempo a terminar una frase.\n\nYo sigo recordando aquel instante. La mano de mi pareja se quedó en mi muñeca un poco más de lo que pedía la cortesía, y su mirada tampoco se apartó enseguida. Al acabar la pieza, retiró la mano, aunque aún quedó el calor de los dedos. Volví a mi asiento; la copa estaba llena y no bebí.\n\nYa ha empezado el siguiente baile. Miro el espacio libre en el suelo y mis pies todavía quieren volver allí."
 latria_sexual_frustration_flavor.1102.desc.strict: "Cuanto más nos acercamos al bailar, más se parecen a murmullos las risas de alrededor. Miro hacia los músicos, pero mi pareja sigue guiándome de la mano. Una manga roza la otra y ese sonido me llega con más claridad que el tambor.\n\nAlguien se inclina para hablar junto a la mesa. No sé si se refieren a mí o a otra cosa. En cuanto termina la pieza, retrocedo medio paso, tan deprisa que casi me piso el zapato. Mi pareja me mira sin hacer preguntas.\n\nCuando me siento, todavía noto aquel calor en la muñeca. La cubro con la otra mano, como si así nadie pudiera verlo."
 latria_sexual_frustration_flavor.1102.desc: "La música se acelera, pero mis pensamientos no se dispersan con los pasos del baile.\n\nDoy dos vueltas siguiendo a mi pareja. No me equivoco de paso, aunque toda mi atención está puesta en lo cerca o lejos que oigo su respiración. La pieza se interrumpe un instante en su punto más alto. En esa pausa, ninguno de los dos dice nada.\n\nLos músicos vuelven a hacer sonar las cuerdas. Sigo en el mismo sitio, sin saber en qué momento debo dar por terminado este baile."
 latria_sexual_frustration_flavor.1102.a: "Pedir otro baile y acercarme un poco más."
 latria_sexual_frustration_flavor.1102.b: "Dar las gracias a mi pareja con una reverencia y retirarme a un lado del salón."

 latria_sexual_frustration_flavor.1103.t: "A la puerta del guía"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mi guía espiritual dice que reprimir los deseos no es el único camino de devoción. La lámpara proyecta nuestras sombras sobre la pared. Habla despacio, como si dejara huecos para que yo pudiera intervenir.\n\nQuisiera preguntar si también pertenece a ese camino despertarse a solas por la noche, sin saber dónde poner las manos. Estoy a punto de decirlo cuando se detienen unos pasos al otro lado de la puerta. Guardamos silencio. Los pasos vuelven a alejarse.\n\nMi guía me mira, esperando el resto de la frase. Me trago las palabras y solo queda aquel comienzo inconcluso."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mi guía espiritual me recuerda que la castidad no importa solo ante los ojos de los demás. No levanta la voz, pero de pronto la estancia parece más estrecha. Bajo la cabeza para responder y aprieto los dedos dentro de la manga.\n\nMe pregunta por qué he venido esta noche. Miro la lámpara, la puerta y las puntas de mis zapatos; cualquier cosa salvo sus ojos. La verdad cabría en pocas palabras, pero temo que, al decirla, lleguen más preguntas.\n\nAlguien tose fuera. Suspiro de alivio y enseguida me avergüenzo de sentirlo."
 latria_sexual_frustration_flavor.1103.desc: "La estancia está en penumbra y sopeso cómo empezar a hablar con mi guía espiritual.\n\nDebería preguntar por mis obligaciones; lo que deseo preguntar es otra cosa. Ante la puerta había ensayado ambas conversaciones, pero ahora que he entrado no recuerdo una sola frase. Mi guía me sirve agua; todavía está caliente.\n\nSostengo la taza entre las manos y el borde me toca los labios. Las palabras siguen sin salir."
 latria_sexual_frustration_flavor.1103.a: "Admitir mi anhelo y dejar de ocultarlo."
 latria_sexual_frustration_flavor.1103.b: "Preguntar solo por mis deberes actuales y callarme lo demás."

 latria_sexual_frustration_flavor.1104.t: "El águila que no regresa"
 latria_sexual_frustration_flavor.1104.desc.lustful: "El águila gira sobre el coto y se resiste a volver a mi guante. He levantado el brazo dos veces; en ambas ha ladeado las alas y subido aún más. Del bosque llega viento con olor a hierba y a sudor de caballo.\n\nCasi la envidio. No tiene que dar explicaciones ni mirar atrás, ni fingir ante todos que su impaciencia es paciencia. Un sirviente pregunta si debe guardar los arcos. Niego con la cabeza, siguiendo aún aquel punto oscuro. De tanto mirarlo, deja de parecerme un águila y me recuerda a otra persona que tampoco quiere volver.\n\nYa me duele el brazo. Aun así, no lo bajo."
 latria_sexual_frustration_flavor.1104.desc.chaste: "El águila sigue dando vueltas sin bajar. Los sirvientes me han preguntado varias veces si deben guardar los arcos. Solo les digo que esperen un poco más, como si con eso pudiera disiparse por sí solo el desorden que llevo dentro.\n\nLos cazadores han desmontado y se pasan el odre a la sombra. No me apremian, pero el ruido de los arreos llega a intervalos, como si lo hiciera por ellos. Miro el cielo y cuento en silencio, hasta que la cuenta vuelve a convertirse en el nombre de siempre.\n\nEl águila grita, pero no desciende. Me cambio el guante de mano, muy despacio."
 latria_sexual_frustration_flavor.1104.desc: "El águila tarda en volver y todos los cazadores esperan que dé una orden.\n\nDe tanto apretarlo, el silbato me ha dejado una marca en la palma. Lo llevo a los labios y vuelvo a bajarlo. Los círculos del ave se estrechan; nadie sabe si regresará en el siguiente instante.\n\nAlguien pregunta en voz baja si nos marchamos. Contesto algo, sin saber si he dicho que partamos o que sigamos esperando."
 latria_sexual_frustration_flavor.1104.a: "Dejar que el águila gire mientras mis pensamientos vagan."
 latria_sexual_frustration_flavor.1104.b: "Concentrarme y llamar al águila de vuelta al campamento."

 latria_sexual_frustration_flavor.1105.t: "Velas y una corona"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Un sirviente se lleva la corona ceremonial de la alcoba. Junto al candelabro quedan varios decretos sin despachar. Me acomodo el camisón y tomo asiento; debería empezar por el documento de arriba, pero mi mano saca de entre ellos la carta que no he enviado.\n\nSolo he escrito el saludo; después no hay nada. Durante el día lo intenté tres veces y las tres me detuve en el mismo punto. La corona ha dejado un último destello dentro de su estuche, como si aún esperara que atendiera las obligaciones del trono imperial. Aliso el papel y, aun después de alisarlo, no sé cuál debe ser la siguiente frase.\n\nUna gota de cera cae en la bandeja de bronce con un sonido apenas audible."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Me pongo el camisón en la habitación de la posada. Mis compañeros ya se han retirado y en la habitación contigua alguien ronca. La lámpara ilumina la carta sin enviar junto al equipaje; sus esquinas se están curvando.\n\nMañana debemos ponernos en camino. Ya están resueltos las provisiones, los caballos y el paso del río; solo la carta sigue sin destino. La despliego. Sus frases me parecen aún menos aptas para enviarlas que esta mañana. Una es demasiado franca y dejo un momento los nudillos sobre esa línea.\n\nAlguien cierra una puerta en el piso de abajo. Vuelvo a apoyar la carta sobre el equipaje, sin sujetarla del todo."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Doblo las vestiduras y vuelvo a sentarme junto a la cama en camisón. La carta sin enviar está debajo del libro sagrado; sobresale una esquina, como si quisiera hacerse ver por su cuenta.\n\nLa saco. El libro se cierra con un golpe sordo. No he escrito nada que contradiga mis votos, pero cada frase gira en torno a la misma persona. Al llegar a la tercera línea ya sé que no debería estar leyéndola a estas horas.\n\nLa llama da un salto. No devuelvo la carta a su sitio."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Los sirvientes guardan las ropas de ceremonia y me siento bajo la lámpara en camisón. Aún no he terminado con los documentos de la mesa, pero ya he desplegado la carta que tengo pendiente de enviar.\n\nFuera cambia la guardia; los pasos se alejan al unísono. Dentro solo se oye el papel. Escribo una palabra en el espacio en blanco de la carta, la miro y la cubro de tinta. El borrón llama más la atención que lo que había antes.\n\nDejo la pluma. Los documentos siguen donde estaban y no he puesto un solo sello."
 latria_sexual_frustration_flavor.1105.desc: "La lámpara está a punto de agotarse y aún tengo a mano una carta sin enviar.\n\nSé que la persona a la que va dirigida no podrá leerla esta noche. Aun así, vuelvo a escribir el saludo, más despacio que durante el día. La tinta se seca y en el papel queda apenas un trazo tenue.\n\nLa mecha chisporrotea. Levanto la cabeza y descubro cuánto tiempo llevo aquí."
 latria_sexual_frustration_flavor.1105.a: "Dar la carta a un mensajero."
 latria_sexual_frustration_flavor.1105.b: "Destruirla, apartar el pensamiento y apagar la vela para dormir."

 latria_sexual_frustration_flavor.1106.t: "Inquietud a la luz de las velas"
 latria_sexual_frustration_flavor.1106.desc.female: "Me siento junto a la cama en camisón. La vela proyecta mi sombra sobre el papel de la ventana; se mueve suavemente con mi respiración y parece más serena que yo. Ya es muy tarde, pero aquel deseo sin respuesta sigue en mi pecho, sin hacerse oír ni marcharse.\n\nMe aparto el cabello por detrás del hombro y vuelvo a traerlo hacia delante. Cuando los dedos me rozan un lado del cuello, me detengo un instante. No hay nadie más, pero esa pausa basta para que me arda la cara. Recuerdo unas palabras de hoy, a medio camino entre la broma y la verdad. Me reí al oírlas; después no dejé de recordarlas.\n\nLa cera ha formado otra capa. Yo sigo en mi asiento y las cortinas de la cama continúan recogidas."
 latria_sexual_frustration_flavor.1106.desc.male: "Me siento junto a la cama en camisón. El vigilante nocturno ya ha pasado dos veces ante la ventana. En la primera ronda todavía confiaba en dormirme; cuando pasó la segunda, ya había renunciado.\n\nNo tengo una carta en la mano ni una copa de vino. Solo apoyo la palma sobre la rodilla hasta que se calienta y después la vuelvo hacia arriba. La voz de esa persona no está realmente en la habitación, pero puedo repetir hasta las pausas de aquella frase. A la tercera vez, incluso a mí me parece absurdo.\n\nSoplo hacia la vela sin apagarla. La llama se inclina y después vuelve a enderezarse."
 latria_sexual_frustration_flavor.1106.desc: "La vela se consume y el sueño sigue sin llegar entre las cortinas de la cama.\n\nMe acuesto y oigo los latidos más fuertes que de costumbre. Me vuelvo de lado y siguen ahí. Todo en la habitación ocupa su sitio: la taza, los zapatos, la ropa de encima bien doblada. Nada de eso consigue llevarse esta inquietud.\n\nVuelvo a incorporarme. La luz sigue encendida, pero ya ha pasado buena parte de la noche."
 latria_sexual_frustration_flavor.1106.a: "Dejar que mis pensamientos se detengan en aquel afecto."
 latria_sexual_frustration_flavor.1106.b: "Dejar de pensar en ello, apagar la vela y disponerse a dormir."


 latria_sexual_frustration_flavor.1107.t: "Un baile en respuesta"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Mi pareja me invita a bailar otra pieza y los demás lo toman por una cortesía corriente. Los músicos ya tienen el arco sobre las cuerdas, esperando a que asienta.\n\nYo, en cambio, recuerdo aquella mano. Se detuvo un instante junto a mi cintura: lo bastante poco para atribuirlo a un paso del baile, demasiado para que yo pueda creer esa explicación. Miro el rostro de mi pareja y me devuelve la mirada con una leve sonrisa, sin decirlo abiertamente.\n\nEn la mesa chocan unas copas. El sonido es fuerte, pero aún oigo el sí que no he llegado a pronunciar."
 latria_sexual_frustration_flavor.1107.desc.strict: "Mi pareja me invita a otro baile y varias miradas se vuelven hacia nosotros. Todavía no he contestado cuando alguien se inclina para susurrar a su vecino. No oigo lo que dicen, pero ninguno de los dos aparta los ojos.\n\nLa mano sigue tendida con cortesía, sin insistencia. La mía, en cambio, se calienta dentro de la manga. Si la acepto, será más difícil fingir que esta pieza no tiene importancia. Si no lo hago, también recordarán mi rechazo.\n\nUno de los músicos carraspea. Su arco permanece sobre las cuerdas."
 latria_sexual_frustration_flavor.1107.desc: "Los músicos empiezan una nueva pieza y yo sigo sin levantarme.\n\nYa han pasado los primeros compases. Mi pareja no retira la mano ni me apremia; simplemente permanece ante mí. Miro esa mano y después mis propios dedos, apoyados en el borde de la mesa.\n\nAlguien mueve una silla detrás. El ruido me hace parpadear de sobresalto, pero todavía no me pongo en pie."
 latria_sexual_frustration_flavor.1107.a: "Aceptar el baile y acercarme."
 latria_sexual_frustration_flavor.1107.b: "Rechazar con una reverencia y desear a mi pareja un baile agradable."

 latria_sexual_frustration_flavor.1108.t: "Oración antes de dormir"
 latria_sexual_frustration_flavor.1108.desc.favors: "Rezo junto a la cama en camisón. Recuerdo muy bien las palabras de mi fe que permiten los placeres de la carne, pero ahora no me sirven de ayuda. Me dicen que no tengo por qué considerarlos una falta; no me dicen qué hacer con este deseo.\n\nLas rodillas me rozan el borde de la cama. Pronuncio la oración mientras repaso aquel cruce de miradas demasiado cercano de esta mañana. No pasó nada más. Sin embargo, he dividido esa mirada en pequeños instantes y he vuelto a recorrerlos uno por uno.\n\nLlego al punto donde debería terminar y continúo. Las frases que siguen las añado por mi cuenta, sin ningún orden."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Me arrodillo junto a la cama en camisón y repito mis votos de castidad. Con cada frase oigo más clara la voz interior: esta noche tampoco tendré compañía, las mantas seguirán frías y, al llegar la oscuridad, continuaré a solas con mi deseo.\n\nApoyo la sien contra la madera de la cama. Está fría y eso me alivia un poco. Pero basta con apartarme para que vuelva la misma inquietud. Empiezo otra vez por la primera frase, hablando muy bajo, como si temiera que me oyeran desde la habitación contigua.\n\nNo hay nadie en esa habitación. Aun así, sigo sin levantar la voz."
 latria_sexual_frustration_flavor.1108.desc: "La vela junto a la cama tiembla y yo sigo alargando la oración.\n\nYa he terminado el pasaje que conozco. Ahora debería guardar silencio, pero me resisto a dejarlo entrar. En cuanto lo haga, otra preocupación ocupará su lugar. Añado unas frases y, al acabarlas, sé bien que no son palabras de oración.\n\nLa llama se inclina hacia las cortinas. Sigo de rodillas y la pechera del camisón se ha arrugado."
 latria_sexual_frustration_flavor.1108.a: "Apartar el voto de castidad y admitir mi anhelo."
 latria_sexual_frustration_flavor.1108.b: "Contener mis pensamientos y seguir rezando."

 latria_sexual_frustration_flavor.1109.t: "Un consejo inconcluso"
 latria_sexual_frustration_flavor.1109.desc: "Mis consejeros ya han expuesto tres soluciones y sigo sin decidirme. La primera es la más segura; la segunda, la menos costosa; la tercera, la más fiel a la costumbre. Las he oído todas y he asentido a cada una, pero aún no sé decir cuál escojo.\n\nLa pluma del escribano queda suspendida en el aire. Alguien acerca una taza de agua a mi mano. Miro mi reflejo y de pronto mis pensamientos se van hacia una persona que nada tiene que ver con el abastecimiento. No está en esta sala, pero aún recuerdo las pausas de su voz al hablar.\n\nEl silencio se alarga hasta resultar incómodo. Me aclaro la garganta y sigo sin poder formar una frase."
 latria_sexual_frustration_flavor.1109.a: "Terminar el consejo y dejarme a solas con mis pensamientos."
 latria_sexual_frustration_flavor.1109.b: "Reprimir el pensamiento y pedir al escribano que continúe."
 latria_sexual_frustration_flavor.1110.t: "Una habitación después de medianoche"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Regreso a mi pequeña estancia en camisón. La oración nocturna ha terminado y casi todas las lámparas de la galería están apagadas. La carta sin enviar sigue abierta sobre la mesa, encima de una sarta de cuentas de oración.\n\nDebería guardar las cuentas en su caja y recoger también la carta. Apoyo la mano en el papel y ahí se queda. Ya sé las frases de memoria, pero todavía quiero volver a ver cómo he escrito aquel nombre. La tinta se ha corrido en un punto, como si me hubiera temblado la mano al escribir.\n\nLa estancia está en silencio. Permanezco junto a la mesa, con el lazo del camisón sin apretar."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Solo quedan unas pocas lámparas encendidas en la posada. Me siento al borde de la cama en camisón. El equipaje ya está atado y solo asoma la carta que no he enviado.\n\nAlguien se vuelve en la habitación contigua y la cama cruje. Espero a que cese el ruido antes de sacar la carta. Hay polvo del camino pegado al borde del papel. Soplo, pero el polvo no se desprende y las frases parecen aún más claras. Hay una que no debería haber escrito, justo en el centro.\n\nDoblo la carta, aunque no consigo hacer coincidir el pliegue con la marca anterior."
 latria_sexual_frustration_flavor.1110.desc: "Los ruidos al otro lado de la puerta se alejan poco a poco y yo sigo esperando junto a la cama.\n\nNadie ha quedado en venir esta noche. Aun así, he dejado la lámpara encendida y la ropa al alcance de la mano. Cada vez que pasan unos pasos, levanto la cabeza. Todos han seguido de largo.\n\nEl aceite de la lámpara ha bajado. El otro lado de la cama sigue vacío y yo todavía no me he acostado."
 latria_sexual_frustration_flavor.1110.a: "Terminar la carta y hacer que la envíen al amanecer."
 latria_sexual_frustration_flavor.1110.b: "Atrancar la puerta, apartar el pensamiento y retirarme a dormir."

 latria_sexual_frustration_flavor.1101.c: "Ponerme una túnica, sentarme y dejar que mi respiración se calme."
 latria_sexual_frustration_flavor.1102.c: "Hablar con los músicos sobre sus melodías."
 latria_sexual_frustration_flavor.1103.c: "Preguntar cómo podría convivir con estos sentimientos."
 latria_sexual_frustration_flavor.1103.d: "Empezar por la carta sin enviar y no ocultar nada."
 latria_sexual_frustration_flavor.1104.c: "Pedir a los demás que esperen mientras trabajo con paciencia con el águila."
 latria_sexual_frustration_flavor.1105.c: "Guardar la carta en su estuche y planear el trabajo de mañana."
 latria_sexual_frustration_flavor.1107.c: "Pedir a mi pareja que se siente y hablemos de otra cosa."
 latria_sexual_frustration_flavor.1107.d: "Invitar a toda la mesa a un animado baile en grupo."
 latria_sexual_frustration_flavor.1108.c: "Terminar la oración despacio, sin combatir cada pensamiento."
 latria_sexual_frustration_flavor.1109.c: "Hacer una breve pausa y organizar los asuntos pendientes."
 latria_sexual_frustration_flavor.1109.d: "Ordenar las decisiones urgentes y resolverlas aquí."
 latria_sexual_frustration_flavor.1110.c: "Ponerme una túnica e ir a buscar una taza de caldo caliente."
