l_spanish:
 latria_sexual_frustration_flavor.1201.t: "Una hora sin visitas"
 latria_sexual_frustration_flavor.1201.desc.female: "Espero junto a la ventana en camisón hasta que el té se enfría. Nunca se prometió un encuentro, pero sigo haciéndole un lugar en mis pensamientos."
 latria_sexual_frustration_flavor.1201.desc.male: "Espero junto a la ventana en camisón. Solo la guardia nocturna cruza el patio. Nadie va a venir, pero aún no quiero apagar la vela."
 latria_sexual_frustration_flavor.1201.desc: "La mecha se consume. Nada se mueve tras la ventana."
 latria_sexual_frustration_flavor.1201.a: "Escribir las palabras que pensaba decir."
 latria_sexual_frustration_flavor.1201.b: "Apagar la vela, ahogar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1202.t: "Susurros fuera de los baños"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Llegan risas de los baños, sin que importe quién llegó con quién. Debería ser una escena corriente, pero recuerdo cuánto hace que no me siento tan libre de recelos."
 latria_sexual_frustration_flavor.1202.desc.strict: "Fuera de los baños, varios nobles hablan de quién debe evitar a quién. Oigo mi nombre y la conversación se apaga."
 latria_sexual_frustration_flavor.1202.desc: "El agua resuena dentro de los baños. Las voces de fuera me distraen más."
 latria_sexual_frustration_flavor.1202.a: "Contarles el encuentro que anhelo, dejando que el relato se alargue sin fin."
 latria_sexual_frustration_flavor.1202.b: "Apartar el pensamiento, darles las gracias y despedirme."

 latria_sexual_frustration_flavor.1203.t: "Silencio después de la oración"
 latria_sexual_frustration_flavor.1203.desc.favors: "El sacerdote dice que el deseo no es pecaminoso en sí mismo. Quisiera creerle, pero el vacío en mi corazón permanece."
 latria_sexual_frustration_flavor.1203.desc.condemns: "El sacerdote habla de la virtud de la castidad y luego guarda silencio. Sigo de rodillas, con la oración de siempre y los pensamientos muy lejos."
 latria_sexual_frustration_flavor.1203.desc: "La oración ha terminado. Las campanas del templo aún resuenan en mis oídos."
 latria_sexual_frustration_flavor.1203.a: "Dejar de lado por ahora las enseñanzas de la abstinencia."
 latria_sexual_frustration_flavor.1203.b: "Reprimir el pensamiento y volver a empezar la oración."

 latria_sexual_frustration_flavor.1204.t: "Inquietud tras la caza"
 latria_sexual_frustration_flavor.1204.desc.lustful: "A solas en mi alcoba, sin ropa, aún oigo el eco de la cuerda del arco. Mi cuerpo está cansado, pero mis pensamientos siguen cada sombra por el coto de caza."
 latria_sexual_frustration_flavor.1204.desc.chaste: "A solas en mi alcoba, sin ropa, intento volver a la oración y al deber. Cada vez que cierro los ojos, vuelve el anhelo."
 latria_sexual_frustration_flavor.1204.desc: "El coto de caza está vacío, pero mi inquietud no se desvanece."
 latria_sexual_frustration_flavor.1204.a: "Recordar aquella figura que vi en el coto de caza."
 latria_sexual_frustration_flavor.1204.b: "Vestirme, volver al escritorio y ahogar el pensamiento."

 latria_sexual_frustration_flavor.1205.t: "El estudio cerrado"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Hago que todos salgan del estudio y dejen los mapas, los sellos y los documentos pendientes. He sacado una vieja carta del cajón, pero no me decido a leerla de nuevo."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "La ruta y las guardias están escritas sobre la mesa. Mis compañeros esperan fuera; he dado tiempo a todos para descansar, pero una vieja carta vuelve a mi mente cuando pienso en mis propias horas."
 latria_sexual_frustration_flavor.1205.desc.clergy: "A solas en el estudio, no he cerrado ni las cuentas ni las escrituras. Una vieja carta yace entre las páginas. Una y otra vez, alargo la mano y la retiro."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Mis sirvientes esperan al otro lado de la puerta del estudio. Les prohíbo que me molesten. Los sellos y documentos siguen ante mí, pero aún no he devuelto la vieja carta al cajón."
 latria_sexual_frustration_flavor.1205.desc: "Cierro la puerta del estudio y dejo la vieja carta y el trabajo pendiente sobre la mesa."
 latria_sexual_frustration_flavor.1205.a: "Dejar el trabajo para mañana y volver a leer la carta."
 latria_sexual_frustration_flavor.1205.b: "Reprimir el viejo anhelo y atender mis deberes."

 latria_sexual_frustration_flavor.1206.t: "Rumores en el festín"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Alguien en el festín habla de un amante con la misma naturalidad que del tiempo. Me dispongo a reír y quitarle importancia, pero caigo en la cuenta de cuánto hace que no participo en tales charlas."
 latria_sexual_frustration_flavor.1206.desc.strict: "Varios nobles hablan de un cortesano que perdió el favor por una falta de decoro y uno menciona mi nombre. Me aliso la manga y no me uno a ellos."
 latria_sexual_frustration_flavor.1206.desc: "La música llega a través del gentío. Su conversación me distrae más."
 latria_sexual_frustration_flavor.1206.a: "Contar toda mi vieja historia, repitiendo hasta las palabras dichas en privado."
 latria_sexual_frustration_flavor.1206.b: "Callarme, inclinarme ante mis compañeros de mesa y despedirme."

 latria_sexual_frustration_flavor.1207.t: "Un lugar vacío después de la oración"
 latria_sexual_frustration_flavor.1207.desc.favors: "Tras el oficio, el sacerdote deja su libro en el banco y se marcha. Mi fe no condena el deseo, pero no consigo calmar mis pensamientos."
 latria_sexual_frustration_flavor.1207.desc.condemns: "El sacerdote se ha ido, pero sigo de rodillas. La enseñanza sobre la castidad es clara; el anhelo que llevo dentro no se ha desvanecido."
 latria_sexual_frustration_flavor.1207.desc: "Solo la vela y yo permanecemos en el templo silencioso."
 latria_sexual_frustration_flavor.1207.a: "Salir del templo y pensar en aquel afecto."
 latria_sexual_frustration_flavor.1207.b: "Contener mi deseo y volver a leer los preceptos."

 latria_sexual_frustration_flavor.1208.t: "La persecución por el bosque"
 latria_sexual_frustration_flavor.1208.desc.lustful: "La presa se escabulle entre los árboles y los demás la persiguen. Cabalgo tras ellos, aunque otro anhelo sigue ocupando mis pensamientos."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Freno mi caballo y me recuerdo que solo he venido a cazar. Los sabuesos se pierden en la distancia, pero mis pensamientos no."
 latria_sexual_frustration_flavor.1208.desc: "La partida se detiene entre los árboles, esperando mi orden de continuar la persecución."
 latria_sexual_frustration_flavor.1208.a: "Dejar que los demás se adelanten mientras mis pensamientos vagan."
 latria_sexual_frustration_flavor.1208.b: "Concentrarme y llevar la caza adelante."

 latria_sexual_frustration_flavor.1209.t: "Ascuas junto a la ventana"
 latria_sexual_frustration_flavor.1209.desc.female: "En camisón, me siento junto a la ventana mientras el fuego del hogar se reduce a ascuas. Las palabras que no dije durante el día vuelven ahora a mí."
 latria_sexual_frustration_flavor.1209.desc.male: "En camisón, me apoyo en la ventana y observo a la guardia nocturna cruzar el patio. Un afecto sin respuesta no abandona mis pensamientos."
 latria_sexual_frustration_flavor.1209.desc: "Tras la ventana todo está en calma. El fuego se apaga, pero no tengo sueño."
 latria_sexual_frustration_flavor.1209.a: "Poner mis pensamientos por escrito."
 latria_sexual_frustration_flavor.1209.b: "Avivar el fuego, apartar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1210.t: "Nadie llama a la puerta"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Mis sirvientes han guardado la corona. En camisón junto a la cama, las cargas del imperio no me hacen olvidar lo que no me atrevo a decir."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Mis compañeros se han retirado en la posada. En camisón, me siento junto a una carta sin enviar; mañana seguiremos el camino, pero esta preocupación viajará conmigo."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Cuelgo las vestiduras junto a la cama y me siento a solas en camisón. Mi voto sigue en mis oídos, pero mis pensamientos no se calman."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Han guardado mis ropas de ceremonia. En camisón junto a la cama, los guardias de fuera no oyen ningún suspiro y mi cargo no resuelve este asunto privado."
 latria_sexual_frustration_flavor.1210.desc: "Es tarde y sigo a solas con esta preocupación."
 latria_sexual_frustration_flavor.1210.a: "Mandar llamar a una persona de confianza, pese a lo tarde que es, y hablar largo y tendido."
 latria_sexual_frustration_flavor.1210.b: "Reprimir el anhelo, apagar la vela y acostarme."

 latria_sexual_frustration_flavor.1202.c: "Cambiar de tema y preguntar por mis compañeros."
 latria_sexual_frustration_flavor.1202.d: "Invitarlos a todos a tomar té y hablar hasta cansarnos."
 latria_sexual_frustration_flavor.1203.c: "Pedir al sacerdote que se quede a estudiar las enseñanzas conmigo."
 latria_sexual_frustration_flavor.1204.c: "Ponerme el camisón y meditar despacio los pensamientos del día."
 latria_sexual_frustration_flavor.1205.c: "Organizar las guardias y concederme un poco de descanso."
 latria_sexual_frustration_flavor.1205.d: "Enumerar los deberes de mañana, uno por uno."
 latria_sexual_frustration_flavor.1206.c: "Desviar la conversación con un poema nuevo."
 latria_sexual_frustration_flavor.1207.c: "Sentarme ante las escrituras y terminar este capítulo."
 latria_sexual_frustration_flavor.1208.c: "Dar descanso a los caballos y estudiar las huellas sin prisa."
 latria_sexual_frustration_flavor.1209.c: "Avivar el fuego, preparar té y leer un libro viejo."
 latria_sexual_frustration_flavor.1209.d: "Convertir en poema las palabras que nunca dije."
 latria_sexual_frustration_flavor.1210.c: "Planear el día de mañana y poner en orden cada tarea."
