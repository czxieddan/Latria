l_spanish:
 latria_sexual_frustration_flavor.1201.t: "Una hora sin visitas"
 latria_sexual_frustration_flavor.1201.desc.female: "Llevo mucho rato esperando junto a la ventana en camisón. El té ha pasado de caliente a tibio y después se le ha formado una película en la superficie. Nunca acordamos este encuentro, pero he dejado la lámpara encendida, una taza vacía y hasta la silla de la ventana bien colocada.\n\nPor el patio solo ha pasado una vez la ronda nocturna. La luz del farol cruzó la tapia y desapareció. Hago girar la taza; el té ya no está para beberlo. Recuerdo aquel «si tengo tiempo» de la última despedida. Es una frase lo bastante vaga para prometer cualquier noche o para no comprometer ninguna.\n\nLa mecha se ha consumido un poco más. Sigo en mi asiento, con el camisón deslizado de un hombro, sin recogerlo."
 latria_sexual_frustration_flavor.1201.desc.male: "Llevo mucho rato esperando junto a la ventana en camisón. En el patio solo se oyen los pasos de la ronda, que se alejan y vuelven a acercarse. Nadie va a venir. Aun así, dejo la lámpara encendida, como si eso pudiera completar una invitación que nunca llegué a pronunciar.\n\nEl té se ha enfriado. Pruebo un sorbo y frunzo el ceño por lo amargo que está, pero lo termino. Quedan unas hojas en el fondo de la taza; las miro como si pudieran decirme dónde está esa persona esta noche. Fuera, el viento inclina las ramas y después las suelta.\n\nApoyo la mano en el marco de la ventana. El frío de la madera me sube por la palma, sin apagar la inquietud que siento."
 latria_sexual_frustration_flavor.1201.desc: "La mecha se consume y sigo sin oír movimiento al otro lado de la ventana.\n\nLevanto la mecha una vez. La llama crece y enseguida vuelve a bajar. Sobre la mesa hay papel, una pluma y una taza de té que ya no se puede beber. He tocado cada cosa, pero ninguna ha conseguido cambiar esta noche.\n\nAl final me limito a permanecer en mi asiento, oyendo cómo mi respiración llena el silencio."
 latria_sexual_frustration_flavor.1201.a: "Escribir las palabras que pensaba decir."
 latria_sexual_frustration_flavor.1201.b: "Apagar la vela, ahogar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1202.t: "Susurros fuera de los baños"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Fuera de los baños, las risas no cesan por ver quién llega en compañía de quién. El vapor sale por la rendija de la puerta y trae olor a hierbas jabonosas y piedra caliente. Alguien pasa a mi lado con el cabello mojado y la ropa anudada sin apretar; nadie le dedica una segunda mirada.\n\nUna escena tan corriente debería dejarme indiferente. Sin embargo, me quedo ante el umbral y recuerdo cuánto tiempo hace que no me acerco a nadie con esa naturalidad. Dentro, alguien llama a otra persona entre risas, con la voz aún tomada por el baño. Mis dedos se detienen sobre el marco.\n\nEl viento me lleva el vapor a la cara. No entro, pero tampoco me marcho."
 latria_sexual_frustration_flavor.1202.desc.strict: "Ante los baños, varios nobles hablan de quién debería evitar a quién. Oigo mi nombre y la conversación se interrumpe. Dentro sigue sonando el agua; fuera hay tanto silencio que distingo el roce de la ropa.\n\nAlguien me saluda con una inclinación demasiado rápida. Otra persona se arregla una manga que ya estaba en su sitio. Sé de qué clase de asuntos estaban hablando. Me arden las orejas y no es por el vapor de los baños.\n\nPermanezco allí un rato. El agua suena a intervalos al otro lado de la puerta, como si fuera contando lo que dura este silencio."
 latria_sexual_frustration_flavor.1202.desc: "El agua resuena sin cesar en los baños, pero son las voces junto a la entrada las que me distraen.\n\nSolo venía a lavarme la cara. Al llegar a la puerta oigo una conversación en voz baja y una risa que corta una frase por la mitad. No es fuerte, pero me hace detenerme. No sé de qué se ríen; solo sé que no debería quedarme aquí escuchando.\n\nAun así, escucho hasta que terminan la frase. Cuando acaba, tengo la cara más caliente que el paño que llevo en la mano."
 latria_sexual_frustration_flavor.1202.a: "Contarles el encuentro que anhelo, dejando que el relato se alargue sin fin."
 latria_sexual_frustration_flavor.1202.b: "Apartar el pensamiento, darles las gracias y despedirme."

 latria_sexual_frustration_flavor.1203.t: "Silencio después de la oración"
 latria_sexual_frustration_flavor.1203.desc.favors: "El sacerdote dice que el deseo humano no es una falta por naturaleza. El eco de la campana aún gira entre las vigas cuando cierra el libro sagrado y me deja un momento de silencio.\n\nQuiero creerle, pero el vacío que siento no se reduce. Sigo de rodillas, mirando mis manos. Durante el día repartieron pan; esta noche solo quieren alcanzar a una persona que no está aquí. Mi fe lo permite, pero ese permiso no pone a nadie a mi alcance.\n\nEl sacerdote espera una pregunta. No consigo hacerla y solo me aparto el cabello de la frente."
 latria_sexual_frustration_flavor.1203.desc.condemns: "El sacerdote habla de la virtud de la abstinencia y después guarda silencio. Ese silencio pesa más que sus enseñanzas. Sigo de rodillas; el cojín ya está caliente y las oraciones me resultan familiares, pero mis pensamientos se han quedado en algún camino fuera del templo.\n\nSé que debo responder. Sin embargo, solo tengo aire en la garganta y, al salir, se convierte en un sí apenas audible. El sacerdote me mira y no pregunta nada más. Esa mirada hace que mi respuesta me parezca todavía menos firme.\n\nLa campana deja de sonar. En el templo solo queda el chisporroteo ocasional de las mechas."
 latria_sexual_frustration_flavor.1203.desc: "He terminado de rezar, pero el eco de la campana aún resuena en el templo.\n\nLos demás ya se han levantado. Yo sigo de rodillas, como si me faltara una frase. No falta ninguna; sencillamente, al acabar, el deseo sigue aquí. No se marcha con las palabras ni con la gente.\n\nApoyo las palmas sobre las losas. La piedra está fría, pero ese frescor solo alcanza las muñecas; más allá ya no lo siento."
 latria_sexual_frustration_flavor.1203.a: "Dejar de lado por ahora las enseñanzas de la abstinencia."
 latria_sexual_frustration_flavor.1203.b: "Reprimir el pensamiento y volver a empezar la oración."

 latria_sexual_frustration_flavor.1204.t: "Inquietud tras la caza"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Estoy a solas en mi alcoba, aún sin vestirme, y todavía oigo el eco de la cuerda del arco. La ropa de caza está tirada sobre una silla y el barro de las botas no se ha secado. Noto el cansancio en las piernas y los hombros, pero mis pensamientos están en otra parte.\n\nDurante el día me crucé a caballo con alguien entre los árboles. Solo nos cruzamos; ni siquiera se rozaron nuestras mangas. Aun así, he repetido el momento muchas veces: la mano que sujetaba las riendas, la leve sonrisa al volverse y cómo dejó de mirarme después. Ahora no hay caballo ni compañía, solo mi reflejo en el espejo de bronce.\n\nMe siento al borde de la cama. Al notar la estera recuerdo que todavía no me he puesto la ropa."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Estoy a solas en mi alcoba, todavía sin vestirme, intentando devolver mis pensamientos a la oración y a mis obligaciones. He doblado la ropa de caza a un lado y ni siquiera me he lavado la cara. Cada vez que cierro los ojos vuelve aquel deseo, más claro que las huellas de los animales en el bosque.\n\nRepaso mis votos en silencio. A mitad de camino aparece la imagen de aquella persona al volverse entre los árboles y pierdo el hilo. Abro los ojos y miro mis manos; aún tiemblan, sin que yo sepa si es por el cansancio de la caza o por otra cosa.\n\nUn sirviente pregunta desde fuera si deseo agua caliente. Contesto y la voz me sale más ronca de lo que esperaba."
 latria_sexual_frustration_flavor.1204.desc: "El coto ya está vacío, pero la inquietud sigue conmigo.\n\nRegreso a mi habitación, dejo el arco y los guantes; lo que no consigo dejar atrás es aquella mirada del día. La estancia huele a barro y a sudor. Permanezco de pie un rato, hasta descubrir que no aparto los ojos de la puerta, como si esperara que alguien entrara detrás de mí.\n\nNo entra nadie. La puerta la he cerrado yo."
 latria_sexual_frustration_flavor.1204.a: "Recordar aquella figura que vi en el coto de caza."
 latria_sexual_frustration_flavor.1204.b: "Vestirme, volver al escritorio y ahogar el pensamiento."

 latria_sexual_frustration_flavor.1205.t: "El estudio cerrado"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Ordeno que todos salgan del estudio y dejen los mapas, los sellos y los documentos pendientes. Al cerrarse la puerta solo oigo mi respiración. Saco del cajón una vieja carta con los bordes ya gastados.\n\nNo habla de asuntos del imperio. Habla de un encuentro que no llegó a celebrarse y de unas palabras que entonces me hicieron creer que tendríamos tiempo de sobra. Desde entonces han pasado muchos días y la carta sigue aquí. Pongo el sello encima y vuelvo a retirarlo. El sello está frío; el papel aún parece conservar su calor.\n\nDesde fuera preguntan en voz baja si deben traer la comida. No contesto."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "La ruta y los turnos de guardia ya están escritos; mis compañeros esperan al otro lado de la puerta. He fijado las horas de descanso de todos, pero al llegar a las mías se me detiene la pluma. Del cajón asoma la esquina de una vieja carta, como si se negara a quedar oculta bajo el itinerario.\n\nLa saco y me basta leer el saludo para saber que no debería mirarla ahora. Alguien llama a la puerta y pregunta si seguimos hacia la próxima parada. Digo que sí, mientras mis ojos continúan en la segunda línea.\n\nEsa línea solo contiene el nombre de un lugar. No está en nuestro camino."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Me siento a solas en el estudio, con el libro de cuentas abierto y las escrituras todavía sobre la mesa. Entre sus páginas hay una vieja carta. Ya he alargado y retirado la mano varias veces.\n\nLa carta no ha llegado hoy. Lleva tanto tiempo entre las escrituras que siempre me detengo al alcanzar esa página. Hoy, por fin, la saco. No contiene palabras impropias, pero mi respiración pierde su calma al leerla.\n\nAlguien pasa por la galería y sus cuentas de oración chocan suavemente. Devuelvo la carta al libro y la sujeto; todavía noto su borde bajo la mano."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Los sirvientes esperan fuera del estudio y les ordeno que no me interrumpan. Tengo delante los sellos y los documentos, pero la vieja carta del cajón sigue ocupando mi atención.\n\nDebería despachar aquel informe sobre el puente. La pluma queda suspendida sobre el papel; cae una gota de tinta y deja una mancha. Al mirarla recuerdo una frase de la carta que no tiene nada que ver con puentes. Apenas son unas palabras, pero sé exactamente en qué línea estaban.\n\nAl otro lado de la puerta alguien cambia de postura. Aparto el informe y alargo la mano hacia el cajón."
 latria_sexual_frustration_flavor.1205.desc: "Cierro la puerta del estudio. La vieja carta y las tareas pendientes siguen sobre la mesa.\n\nEl pestillo cae con un ruido suave. Después solo se oye el papel. Coloco los asuntos a mi izquierda y la carta a mi derecha. Los miro un rato y acabo moviendo la carta al centro.\n\nLa mecha chisporrotea. No me levanto a recortarla."
 latria_sexual_frustration_flavor.1205.a: "Dejar el trabajo para mañana y volver a leer la carta."
 latria_sexual_frustration_flavor.1205.b: "Reprimir el viejo anhelo y atender mis deberes."

 latria_sexual_frustration_flavor.1206.t: "Rumores en el festín"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Alguien habla de un amante durante el festín con la misma soltura con que hablaría del tiempo. Pasa una ronda de vino, cambian dos nombres en la historia y los demás siguen riendo. Nadie baja la voz.\n\nPensaba reírme y dejarlo pasar. A mitad de la risa advierto cuánto tiempo llevo sin participar en una charla así: tanto que incluso miro a los demás antes de decidir dónde dejar la copa. Quien se sienta a mi lado pregunta si también tengo una historia que contar. Mis dedos se detienen en el borde de la copa.\n\nLa música llega a través del gentío. La oigo, pero no distingo qué pieza están tocando."
 latria_sexual_frustration_flavor.1206.desc.strict: "Varios nobles hablan de alguien de la corte que perdió el favor por una falta de decoro. Después uno menciona mi nombre. La conversación no se interrumpe por completo; solo pasa de las voces a los susurros. Bajo la mirada y me aliso la manga sin intervenir.\n\nQuizá lo que cuentan ni siquiera sea cierto. Eso ya importa poco. Lo que importa es que yo sí tengo un asunto que no podría llevar a esta mesa, y sus ojos parecen haberlo descubierto. Termino el vino, pero su calor no me queda en la garganta, sino en la cara.\n\nAlguien alza una copa para cambiar de tema. Cuando las copas chocan, todavía se me sobresalta la mano."
 latria_sexual_frustration_flavor.1206.desc: "La música me llega a través del gentío, aunque son las conversaciones de la mesa las que me distraen.\n\nPermanezco en mi asiento, oyendo cómo los asuntos pasan de un lado a otro y acaban siempre en alcobas y cartas privadas. Alguien ríe, otro tose, alguien me mira de reojo. No sé si esa mirada es casual.\n\nHago girar la copa vacía. Su base roza la mesa con un sonido muy leve."
 latria_sexual_frustration_flavor.1206.a: "Contar toda mi vieja historia, repitiendo hasta las palabras dichas en privado."
 latria_sexual_frustration_flavor.1206.b: "Callarme, inclinarme ante mis compañeros de mesa y despedirme."

 latria_sexual_frustration_flavor.1207.t: "Un lugar vacío después de la oración"
 latria_sexual_frustration_flavor.1207.desc.favors: "Al terminar la ceremonia, el sacerdote deja el libro sagrado en su asiento y se marcha. En el cojín aún queda la marca de su peso. Mi fe no considera culpable al deseo: acabo de leerlo en esa página y la tinta se distingue con claridad.\n\nAun así, no sé cómo calmarme. Tener permiso es una cosa; pasar la noche a solas, sin otra compañía que mis propias manos, es otra. Permanezco un rato junto al asiento vacío, sin sentarme ni cerrar el libro.\n\nEl viento deja entreabierta la puerta del templo. La luz entra por la rendija e ilumina justamente aquella línea."
 latria_sexual_frustration_flavor.1207.desc.condemns: "El sacerdote se ha marchado y yo sigo de rodillas. Las enseñanzas sobre la castidad son claras; podría recitarlas una por una. El deseo no ha salido tras él. Permanece conmigo, tan presente como mis manos apoyadas sobre el regazo.\n\nMiro el asiento vacío y de pronto envidio que aquella madera no tenga que pensar en nada. Yo no puedo hacer lo mismo. Apoyo la sien contra ella, pero sigo notando mi propio calor.\n\nLa vela se ha consumido un poco más. Continúo de rodillas."
 latria_sexual_frustration_flavor.1207.desc: "Solo quedamos las velas encendidas y yo en el templo.\n\nLos pasos de los demás ya se han alejado. Podría irme ahora, cerrar la puerta y dejar atrás esta página. No lo hago. Camino dos pasos entre los asientos vacíos y vuelvo al cojín de antes.\n\nLa llama está quieta. Yo, en cambio, me oigo el pulso en los oídos."
 latria_sexual_frustration_flavor.1207.a: "Salir del templo y pensar en aquel afecto."
 latria_sexual_frustration_flavor.1207.b: "Contener mi deseo y volver a leer los preceptos."

 latria_sexual_frustration_flavor.1208.t: "La persecución por el bosque"
 latria_sexual_frustration_flavor.1208.desc.lustful: "La presa atraviesa el bosque y los demás salen en su persecución. Espoleo mi caballo y los sigo. Las ramas me golpean las mangas y me llega el olor del sudor de los caballos. Solo después de recorrer un buen trecho advierto que no estoy persiguiendo al animal.\n\nDelante va una persona de espaldas. Nada más que alguien que participa en la cacería. Sin embargo, sigo cada movimiento al ritmo del galope con tanta atención que paso de largo ante una bifurcación. Los ladridos de los perros se van hacia la izquierda; mi caballo continúa recto.\n\nTiro de las riendas. Aquella persona no se vuelve. Mi respiración ya está demasiado agitada para atribuirla solo a la caza."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Freno el caballo y me recuerdo que he venido únicamente a cazar. Los ladridos se alejan y las huellas de los cascos se ven claras en el barro húmedo, pero tengo que mirarlas dos veces para entender hacia dónde giran.\n\nMis pensamientos se niegan a seguir esas huellas. Se han quedado en las manos de quien me ayudó hace un momento a apretar la cincha. Eran manos firmes; terminaron su tarea, se apartaron y no hubo una palabra más. Yo, sin embargo, he convertido aquel instante en otra cosa.\n\nEl caballo resopla. Solo entonces advierto que llevo demasiado tiempo sin moverme."
 latria_sexual_frustration_flavor.1208.desc: "La partida se detiene entre los árboles y espera que decida si seguimos el rastro.\n\nTodos vuelven el rostro hacia mí. Todavía gotean los arreos; alguien se seca la frente. Miro las huellas del suelo: son claras, pero mi respuesta no lo es. La mitad de mis pensamientos sigue al otro extremo del bosque, con alguien que no tiene nada que ver con la presa.\n\nEl viento cruza entre los árboles. Sujeto las riendas y tardo en hablar."
 latria_sexual_frustration_flavor.1208.a: "Dejar que los demás se adelanten mientras mis pensamientos vagan."
 latria_sexual_frustration_flavor.1208.b: "Concentrarme y llevar la caza adelante."

 latria_sexual_frustration_flavor.1209.t: "Ascuas junto a la ventana"
 latria_sexual_frustration_flavor.1209.desc.female: "Me siento junto a la ventana en camisón. En el hogar solo queda una fina línea de brasas. Las palabras que no dije durante el día me vuelven a los labios y retroceden otra vez. La frase era breve; lo largo ha sido el tiempo que llevo conteniéndola.\n\nDe vez en cuando las brasas se avivan e iluminan mis manos sobre el regazo. Sin darme cuenta, he arrugado el borde del camisón entre los dedos. Recuerdo el aire que levantó la manga de aquella persona al pasar hoy junto a mí. Solo fue una corriente de aire, pero aún recuerdo su dirección.\n\nFuera anuncian la hora. No respondo ni tengo ganas de dormir."
 latria_sexual_frustration_flavor.1209.desc.male: "Me apoyo en el marco de la ventana en camisón y observo las luces de la ronda en el patio. Pasan una tras otra, como si dividieran la noche en pequeños tramos. Aquel afecto sin respuesta no se deja dividir: permanece entero en mi pecho.\n\nApoyo la frente en la celosía. La madera huele a pintura vieja. Recuerdo cómo aquella persona miraba hacia otro lado al hablarme, como si temiera que las palabras cambiaran de sentido al mirarme a mí. Yo también aparté la vista. Después ninguno volvió a hablar.\n\nUn carbón cruje en el hogar y las brasas se hunden un poco."
 latria_sexual_frustration_flavor.1209.desc: "Fuera de la ventana todo está en silencio y el fuego pierde fuerza, pero yo no tengo sueño.\n\nAñado un pequeño leño. El fuego no se aviva; solo sale un poco de humo cuyo olor se queda en mi camisón. Vuelvo a sentarme junto a la ventana y repito en silencio la frase que no pude decir durante el día. Al terminar, sigue sin haber nadie que la escuche.\n\nLa oscuridad llena el patio. Yo la miro; ella no me devuelve la mirada."
 latria_sexual_frustration_flavor.1209.a: "Poner mis pensamientos por escrito."
 latria_sexual_frustration_flavor.1209.b: "Avivar el fuego, apartar el anhelo y acostarme."

 latria_sexual_frustration_flavor.1210.t: "Nadie llama a la puerta"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Los sirvientes ya han guardado la corona ceremonial y me siento a solas junto a la cama en camisón. Ni las fronteras del imperio, ni los registros de impuestos, ni las personas a las que debo recibir mañana han desplazado aquel asunto privado. Parece ocupar el otro extremo de la cama, aunque allí no hay nadie.\n\nMiro la mitad vacía. La almohada está lisa y la manta, bien extendida. Ese mismo orden parece un reproche. Pongo una mano sobre ese lado; la tela está fría y, aun después de sentirlo, no retiro la mano.\n\nSe apaga una lámpara en la galería. Nadie viene a llamar a esta puerta."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Mis compañeros ya descansan en la posada. Yo sigo en camisón junto a una carta sin enviar. Mañana volveremos al camino y los caballos ya han comido, pero esta preocupación no podrá quedarse aquí: viajará en el equipaje hasta el siguiente paso del río.\n\nGiro la carta bajo la lámpara. He escrito el saludo con demasiada fuerza para que parezca algo que pueda despacharse sin más durante el viaje. Abajo alguien paga su cuenta y las monedas de cobre tintinean. Cuando cesa el ruido, la habitación parece aún más silenciosa.\n\nGuardo la carta entre la ropa. Incluso ahí sé exactamente entre qué prendas está."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Cuelgo las vestiduras junto a la cama y me siento a solas en mi pequeña estancia, en camisón. Todavía oigo mis votos; los he recitado hace un momento. No me han traído calma. Las cuentas de oración llevan mucho rato inmóviles entre mis dedos, siempre en la misma cuenta.\n\nQuisiera dedicar esta noche a lo que debo. Pero cada vez que logro callar aparece un rostro que no debería estar en mis oraciones. Aprieto las cuentas hasta que se me clavan en la palma. Empiezan a dolerme y aquel rostro sigue ahí.\n\nLa puerta de la estancia no ha quedado bien cerrada. El viento entra por la rendija e inclina la llama."
 latria_sexual_frustration_flavor.1210.desc.ruler: "La ropa de ceremonia ya está guardada y yo sigo junto a la cama en camisón. Los guardias de fuera no oyen mi suspiro; tampoco mi rango ha puesto en orden este asunto del corazón. Intento repasar la audiencia de mañana, pero al llegar a la tercera persona no consigo continuar.\n\nEsa tercera persona no tiene nada que ver con la audiencia. Aun así, dejo la lista detenida ahí. La lámpara de la cabecera proyecta mi sombra sobre la pared; parece sentarse más erguida que yo.\n\nBajo la mecha. La sombra se encoge y yo sigo en mi asiento."
 latria_sexual_frustration_flavor.1210.desc: "La noche está muy avanzada y sigo a solas con esta preocupación.\n\nLa puerta está cerrada, la lámpara encendida y la cama solo tiene sitio para mí. Esas tres cosas no han cambiado. Lo que ha cambiado es que ya no finjo que voy a dormirme enseguida. Dejo la ropa sobre el respaldo de la silla y vuelvo a recogerla, como si alguien fuera a llamarme para salir en cualquier momento.\n\nNadie llama. Vuelvo a dejar la ropa sobre la silla."
 latria_sexual_frustration_flavor.1210.a: "Mandar llamar a una persona de confianza, pese a lo tarde que es, y hablar largo y tendido."
 latria_sexual_frustration_flavor.1210.b: "Reprimir el anhelo, apagar la vela y acostarme."

 latria_sexual_frustration_flavor.1202.c: "Cambiar de tema y preguntar por mis compañeros."
 latria_sexual_frustration_flavor.1202.d: "Invitarlos a todos a tomar té y hablar hasta cansarnos."
 latria_sexual_frustration_flavor.1203.c: "Pedir al sacerdote que se quede a estudiar las enseñanzas conmigo."
 latria_sexual_frustration_flavor.1204.c: "Ponerme el camisón y meditar despacio los pensamientos del día."
 latria_sexual_frustration_flavor.1205.c: "Organizar las guardias y concederme un poco de descanso."
 latria_sexual_frustration_flavor.1205.d: "Enumerar los deberes de mañana, uno por uno."
 latria_sexual_frustration_flavor.1206.c: "Desviar la conversación con un poema nuevo."
 latria_sexual_frustration_flavor.1207.c: "Sentarme ante las escrituras y terminar este capítulo."
 latria_sexual_frustration_flavor.1208.c: "Dar descanso a los caballos y estudiar las huellas sin prisa."
 latria_sexual_frustration_flavor.1209.c: "Avivar el fuego, preparar té y leer un libro viejo."
 latria_sexual_frustration_flavor.1209.d: "Convertir en poema las palabras que nunca dije."
 latria_sexual_frustration_flavor.1210.c: "Planear el día de mañana y poner en orden cada tarea."
