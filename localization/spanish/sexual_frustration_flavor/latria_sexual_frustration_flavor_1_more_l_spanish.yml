l_spanish:
 latria_sexual_frustration_flavor.1011.t: "La segunda vigilia"
 latria_sexual_frustration_flavor.1011.desc: "Me despierto en la segunda vigilia y la lámpara sigue encendida, el aceite bajo, un cerco marrón seco en el plato. El camisón se me ha retorcido en la cintura. Hace tanto frío en la estancia que oigo el postigo golpear dos veces y luego detenerse.\n\nFue una mano en mi muñeca, hace tres días, en el umbral del salón, y no se dijo nada. He repasado la duración de aquel roce más veces que las cuentas. La piel de allí ya es corriente. Aprieto el pulgar contra ella y solo siento mi propio pulso.\n\nHay agua en la copa junto a la cama, ya tibia. Bebo la mitad y la dejo. El postigo golpea otra vez. Permanezco con los ojos abiertos y cuento las vigas hasta que llega el gris."
 latria_sexual_frustration_flavor.1011.a: "Levantarme, despabilar la lámpara y dejar que el pensamiento vaya donde quiera."
 latria_sexual_frustration_flavor.1011.b: "Beber el agua, volverme hacia la pared y olvidarlo."
 latria_sexual_frustration_flavor.1011.c: "Sacar un libro del arca y leer hasta que llegue el gris."

 latria_sexual_frustration_flavor.1012.t: "La pera y el cuchillo pequeño"
 latria_sexual_frustration_flavor.1012.desc: "Me siento tres mesas más abajo del estrado, donde las velas chisporrotean y el vino se escancia aguado. Frente a mí, más allá de dos mercaderes y un escribiente, alguien pela una pera con un cuchillo pequeño y no se la come. La piel se desprende en una sola espiral larga.\n\nEn el último banquete, la persona se sentó a mi lado y su rodilla descansó contra la mía durante toda una canción. No logro convencerme de que fuera un accidente, ni logro convencerme de que no lo fuera.\n\nLos músicos cambian a una melodía más lenta. El cuchillo se detiene. La pera queda abierta en el plato, oscureciéndose en el corte. Un sirviente se inclina sobre mi hombro con la jarra y tiendo la copa sin apartar la vista."
 latria_sexual_frustration_flavor.1012.a: "Decirlo en voz alta y dejar que la mesa haga de ello lo que quiera."
 latria_sexual_frustration_flavor.1012.b: "Retirarme temprano con una inclinación y tragarme el resto."
 latria_sexual_frustration_flavor.1012.c: "Volverme hacia mi vecino y dejar que la música se lo lleve."

 latria_sexual_frustration_flavor.1013.t: "Lo que dejó el sueño"
 latria_sexual_frustration_flavor.1013.desc: "Me despierto con la sábana en la cadera y la ventana pálida, y por un instante la estancia no es la mía. Alguien estuvo aquí. Hubo un peso en el borde de la cama y una voz junto a mi oído diciendo mi nombre como si fuera una pregunta.\n\nNo recuerdo el rostro. Recuerdo el calor de una espalda contra mi pecho, mi mano abierta sobre un vientre que subía y bajaba, y que yo no tenía prisa alguna.\n\nLa sábana está húmeda donde estuve. Me incorporo y pongo los pies en las tablas frías. Fuera pasa un carro hacia el mercado. Alcanzo la ropa y descubro que estoy pendiente de la puerta."
 latria_sexual_frustration_flavor.1013.a: "Dejar que el cuerpo lo tenga y conservar el calor del sueño."
 latria_sexual_frustration_flavor.1013.b: "Alzarme, vestirme y alisar la noche."
 latria_sexual_frustration_flavor.1013.c: "Sentarme con las rodillas abrazadas y esperar a que la ventana blanquee."

 latria_sexual_frustration_flavor.1014.t: "La lámpara de vigilia"
 latria_sexual_frustration_flavor.1014.desc: "Me arrodillo a la tercera hora con el salterio abierto en la misma página que he leído cuatro veces. La lámpara de vigilia arroja un pequeño círculo rojo sobre las losas. Me duelen las rodillas. El frío sube a través de la lana.\n\nEn algún punto del claustro se cierra una puerta. La voz del capellán sigue detrás de mí, paciente, y no oigo nada de ella. Pienso en una boca en mi garganta el verano pasado, y en cómo aparté la cabeza y dejé que ocurriera de todos modos.\n\nLa cinta del salterio se ha deslizado al suelo. No la recojo. Mi pulgar guarda el sitio, y el círculo rojo de la lámpara tiembla cuando respiro. La piedra bajo mis rodillas está fría."
 latria_sexual_frustration_flavor.1014.a: "Admitir la debilidad y cumplir la penitencia mañana."
 latria_sexual_frustration_flavor.1014.b: "Seguir de rodillas una hora más y empezar el salmo de nuevo."
 latria_sexual_frustration_flavor.1014.c: "Pedir al capellán que se quede y termine la página."

 latria_sexual_frustration_flavor.1015.t: "La colcha a los pies de la cama"
 latria_sexual_frustration_flavor.1015.desc: "El fuego se ha consumido hasta la ceniza y yo sigo sin dormir, la colcha arrojada a los pies de la cama. Mi cuerpo está tibio y pesado y pendiente de sí mismo, la piel de la garganta y a lo largo de los muslos tensa y encendida, y hay en mí una humedad que nada tiene que ver con el tiempo.\n\nDejo que mi mano descanse baja sobre el vientre y no la muevo. El deseo de esta noche no es por un rostro. Es solo el pulso entre mis piernas, insistente, llevando el compás del último chasquido del fuego.\n\nPienso en una boca, en una mano, en el peso de alguien sobre mí, y mis caderas se desplazan por su cuenta. La colcha es un montón sobre las tablas. Vuelvo la cara hacia la almohada y respiro hasta que el dolor cede, y no cede."
 latria_sexual_frustration_flavor.1015.desc.lustful: "El calor sube bajo la sábana y dejo de fingir que se trata del tiempo. La humedad es mía, evidente, y mis dedos conocen el camino sin que nadie los envíe.\n\nLos dejo ir. Esta noche no hay un rostro en ello, solo una mano que me hundió contra el jergón y una rodilla que abrió las mías, y recuerdo la fuerza exacta de aquello. Mis caderas se alzan para encontrar la nada. El sonido que hago en la habitación vacía no es uno que conozca.\n\nDespués quedo con las manos abiertas, el pecho subiendo y bajando, lo último de aquello moviéndose todavía en mis muslos. Un leño se acomoda en el hogar. Subo la sábana hasta la cintura y el calor de mi cara permanece."
 latria_sexual_frustration_flavor.1015.desc.chaste: "Me despierto ya con calor, los muslos húmedos, y retiro la mano y la cierro sobre el borde de la sábana como si sujetar la tela pudiera sujetar la noche en su sitio.\n\nDigo en orden la oración de la mañana y pierdo el hilo en la tercera línea. Cuento las vigas y pierdo la cuenta. El cuerpo no escucha. Guarda lo que no admito a la luz del día, y sigue pidiendo.\n\nLa ventana pasa del gris al blanco. La campana del oficio matinal aún no ha sonado. Subo la colcha hasta la barbilla, cierro los ojos y espero a que el calor me abandone. Se va despacio."
 latria_sexual_frustration_flavor.1015.a: "Dejar que la mano haga lo que quiera y aprovechar el calor."
 latria_sexual_frustration_flavor.1015.b: "Apretar la colcha y gastar el calor hasta agotarlo."
 latria_sexual_frustration_flavor.1015.c: "Alzarme, beber y sentarme junto a la ventana."

 latria_sexual_frustration_flavor.1016.t: "El largo regreso a caballo"
 latria_sexual_frustration_flavor.1016.desc: "Cabalgo al final de la hilera, donde los caballos se han demorado, la luz verde y delgada entre las hojas. Mi capa pesa de humedad. Más adelante los cuernos siguen sonando en la ladera lejana.\n\nEn la última cacería me puse a la par de aquella persona en el arroyo y dejamos que los demás siguieran. Su manga estaba empapada hasta el codo. Se rió de algo que dije, y aquella risa me acompañó todo el camino de vuelta, y el camino de vuelta duró dos días.\n\nMi yegua baja la cabeza para beber. El agua parte su reflejo en dos. La dejo beber y miro cómo los pedazos vuelven a juntarse, y los cuernos empiezan de nuevo, más lejos."
 latria_sexual_frustration_flavor.1016.a: "Quedarme atrás un trecho y dejar que el pensamiento cabalgue conmigo hasta casa."
 latria_sexual_frustration_flavor.1016.b: "Hincar los talones y mantener la mente en la ladera."
 latria_sexual_frustration_flavor.1016.c: "Seguir las huellas y las ramas quebradas para dar con quien busco."

 latria_sexual_frustration_flavor.1017.t: "El sello y el libro de cuentas"
 latria_sexual_frustration_flavor.1017.desc: "El consejo se ha marchado y las velas están reducidas a churretes. Tengo el libro de cuentas abierto en el capítulo de la lana y el sello todavía en la mano, la cera blanda por mi propio puño.\n\nA lo que vuelvo una y otra vez no es a las cuentas. Es al modo en que cierta persona estuvo de pie junto a la ventana durante toda la sesión, sin decir nada, con un dedo en el pestillo, y a cómo la estancia pareció más pequeña por ello.\n\nPresiono el sello sobre la orden y lo levanto. La cera recibe la marca con nitidez. Al otro lado de la ventana el patio está vacío y el pestillo quieto. Leo dos veces la misma línea del libro y luego lo cierro."
 latria_sexual_frustration_flavor.1017.a: "Mandar llamar a esa persona mañana y decirlo sin rodeos."
 latria_sexual_frustration_flavor.1017.b: "Entregar el sello al escribiente e irme a la cama."
 latria_sexual_frustration_flavor.1017.c: "Abrir otra vez el libro y terminar la página."

 latria_sexual_frustration_flavor.1018.t: "La luna sobre el tablero"
 latria_sexual_frustration_flavor.1018.desc: "Los faroles están encendidos a lo largo del paseo y la luna se alza sobre la muralla del oeste, fina y blanca como una mondadura. El vino se ha entibiado en el jarro. Al otro lado del tablero, la persona que estudia sostiene una piedra blanca entre dos dedos y no la suelta.\n\nEn la contemplación de primavera se sentó tan cerca que nuestras mangas se rozaron, y recitó cuatro versos sobre una lámpara, y me miró en el último. No he olvidado el último verso.\n\nLa piedra baja al fin, en el rincón equivocado, y ríe, y me llena otra vez la copa. Bebo. La luz del farol se mueve sobre el tablero. Ninguno de los dos menciona el poema."
 latria_sexual_frustration_flavor.1018.a: "Tomar la lámpara y los cuatro versos, y añadir cuatro más."
 latria_sexual_frustration_flavor.1018.b: "Alzar la copa en agradecimiento y llevar la charla a la cosecha."
 latria_sexual_frustration_flavor.1018.c: "Poner una piedra y pedir que me enseñe."

 latria_sexual_frustration_flavor.1019.t: "Dicho al fuego"
 latria_sexual_frustration_flavor.1019.desc: "El fuego está bajo y mi confidente ocupa la otra silla, las manos envolviendo una copa, esperando como espera siempre.\n\nAsí que lo digo. No todo, sino la forma de ello: el umbral, la mano en mi muñeca, las noches desde entonces. Decirlo en voz alta lo hace más pequeño y peor. Mi confidente no aparta la vista y no llena el silencio.\n\nLa copa se ha enfriado en mis manos. Hay un leño que echar y no lo echo. Nos quedamos en lo último del calor y la estancia se oscurece despacio, y yo sigo sosteniendo la copa."
 latria_sexual_frustration_flavor.1019.a: "Seguir, y decir el resto."
 latria_sexual_frustration_flavor.1019.b: "Detenerme ahí y guardar el resto."
 latria_sexual_frustration_flavor.1019.c: "Quedarme un rato más y no decir nada."

 latria_sexual_frustration_flavor.1020.t: "Dicho bajo la bóveda"
 latria_sexual_frustration_flavor.1020.desc: "La bóveda toma mi voz y me la devuelve doblada. Hay una docena de personas en la nave y todas pueden oírme decir aquello que no he dicho a la luz del día.\n\nMantengo los ojos en la losa frente a la barandilla. Tiene una mella con forma de diente. Cuando termino, alguien desplaza el peso detrás de mí, y una mujer cerca de la puerta se echa el velo por delante y no lo baja.\n\nEl incensario oscila. El humo sube plano a lo largo de la piedra. Me quedo donde estoy, con las manos abiertas sobre las rodillas, hasta que el sacristán me toca el hombro."
 latria_sexual_frustration_flavor.1020.a: "Alzar la cabeza y terminar lo que omití."
 latria_sexual_frustration_flavor.1020.b: "Mantener la cabeza baja y rezar los salmos penitenciales hasta el final."
 latria_sexual_frustration_flavor.1020.c: "Esperar a que la nave se vacíe y pedir al capellán que se quede."

 latria_sexual_frustration_flavor.1021.t: "Después de la lluvia"
 latria_sexual_frustration_flavor.1021.desc: "La lluvia nos mantuvo en la sala de arriba pasada la segunda vigilia, y ninguno de los dos propuso bajar.\n\nRecuerdo el orden de las cosas. Una capa mojada sobre las tablas. Una boca en mi clavícula, luego más abajo, sin prisa, mientras mis dedos encontraban los lazos en una nuca. La lámpara estaba baja, pero no apagada. Cuando volvió a subir para besarme, pude saborear el vino en su boca, mis muslos resbalaban contra los suyos y alcé las caderas para recibir la mano que se posó allí.\n\nDespués la lluvia siguió. Tenía el pelo pegado a la mejilla. Hay una marca en mi hombro que no he mirado a la luz del día."
 latria_sexual_frustration_flavor.1021.desc.female: "La lluvia nos mantuvo en la sala de arriba pasada la segunda vigilia, y ninguno de los dos propuso bajar.\n\nRecuerdo el orden de las cosas. Una capa mojada sobre las tablas. Su boca en mi clavícula, luego más abajo, sin prisa, mientras mis dedos trabajaban los lazos de su nuca. La lámpara estaba baja, pero no apagada. Su palma se cerró sobre mi pecho y yo ya estaba húmeda, y alcé las caderas para recibir la mano que se instaló entre mis muslos.\n\nDespués la lluvia siguió. Tenía el pelo pegado a la mejilla. Hay una marca en mi hombro que no he mirado a la luz del día."
 latria_sexual_frustration_flavor.1021.desc.male: "La lluvia nos mantuvo en la sala de arriba pasada la segunda vigilia, y ninguno de los dos propuso bajar.\n\nRecuerdo el orden de las cosas. Una capa mojada sobre las tablas. Su boca en mi pecho, luego más abajo, sin prisa, mientras mis manos encontraban los lazos de su cintura. La lámpara chisporroteó dos veces y se mantuvo. Aquella persona bajó sobre mí y le sujeté las caderas, duro y ansioso, y marcó el ritmo a su antojo. Tenía el pelo mojado en las puntas.\n\nDespués la lluvia siguió, corriendo por el canalón sobre la ventana. Hay una marca en mi hombro que no he mirado a la luz del día."
 latria_sexual_frustration_flavor.1021.a: "Ver a esa persona mañana como siempre, y no ocultar nada."
 latria_sexual_frustration_flavor.1021.b: "Evitar a esa persona de ahora en adelante y guardar la noche."
 latria_sexual_frustration_flavor.1021.c: "No moverme, escuchar la lluvia y tener presente la marca."

 latria_sexual_frustration_flavor.1022.t: "El sendero detrás de las hierbas"
 latria_sexual_frustration_flavor.1022.desc: "Tomo el sendero detrás de los bancales de hierbas porque es el único lugar por el que la casa no camina después del anochecer. La grava está fría a través de las zapatillas. Romero, y por debajo el olor agrio de la menta pasada.\n\nHay un banco al final, donde el muro gira. Nos sentamos allí en primavera y dije algo necio y me fue perdonado antes de que terminara. El pestillo de la verja sigue bajado.\n\nLa luna está detrás de la torre. Me detengo ante el banco con la mano en el respaldo, donde la pintura se ha gastado hasta la madera. Una polilla trabaja en el farol de la puerta. La menta se mueve un poco. No me siento."
 latria_sexual_frustration_flavor.1022.a: "Sentarme en el banco y dejar que el pulso pase."
 latria_sexual_frustration_flavor.1022.b: "Volver a la casa y correr el cerrojo."
 latria_sexual_frustration_flavor.1022.c: "Recorrer el sendero una vez, y luego otra."

 latria_sexual_frustration_flavor.1023.t: "La tercera copa"
 latria_sexual_frustration_flavor.1023.desc: "Para la tercera copa el salón se ha vuelto ruidoso y tibio y los perros están bajo los bancos. Alguien ha empezado una canción con el número de versos equivocado y nadie la corrige.\n\nUna mano se posa en mi manga mientras se cuenta una historia, y permanece allí durante toda la historia, y desaparece cuando la historia termina. Me río en el momento oportuno. El vino está muy bueno esta noche.\n\nLos músicos atacan algo lento. Miro a lo largo de la mesa, donde están retirando las rebanadas de pan. Mi manga sigue tibia donde estuvo la mano. Giro la copa por el borde y dejo que el sirviente la llene otra vez."
 latria_sexual_frustration_flavor.1023.a: "Alzar la copa y mirar a esa persona al otro lado de la mesa."
 latria_sexual_frustration_flavor.1023.b: "Alegar el vino y subir a acostarme."
 latria_sexual_frustration_flavor.1023.c: "Hablar con mi vecino y escuchar la melodía hasta el final."

 latria_sexual_frustration_flavor.1024.t: "Agua de rosas y el muro del jardín"
 latria_sexual_frustration_flavor.1024.desc: "Han vertido agua de rosas sobre la fruta y toda la mesa huele a ella. Bajo el muro un ruiseñor sigue y sigue, mal, y nadie tiene corazón para hacerlo callar.\n\nMe han hecho dos veces una pregunta sobre el tratado y las dos veces respondí la mitad equivocada. La segunda, la persona sonrió dentro de su copa. El azafrán de su pulgar se ha quedado en el borde. La lámpara entre nosotros tiene una grieta en el vidrio.\n\nEl ruiseñor calla. En el silencio oigo el agua en la acequia detrás del muro. Tomo la copa que ya he vaciado y la sostengo hasta que alguien lo advierte y la llena."
 latria_sexual_frustration_flavor.1024.a: "Seguir su ejemplo y dejar el tratado para mañana."
 latria_sexual_frustration_flavor.1024.b: "Pedir permiso y salir al jardín."
 latria_sexual_frustration_flavor.1024.c: "Pedir que termine la mitad del poema."

 latria_sexual_frustration_flavor.1025.t: "El halcón en el puño"
 latria_sexual_frustration_flavor.1025.desc: "El halcón se asienta en mi puño mejor que en primavera, sin caperuza, con su peso acomodado. Los caballos están atados atrás, entre los abedules, y los ojeadores se han adelantado con su ruido.\n\nLa volamos una vez al borde del páramo y no pude apartar los ojos de las manos que la lanzaron, del modo en que se abrieron en el último instante. Desde entonces he pensado en esas manos a horas inconvenientes.\n\nEl halcón se mueve y la afianzo con dos dedos en las pihuelas. El viento sube por la ladera, frío y limpio. Mantengo los ojos en los árboles donde entraron los ojeadores y mi mente no está en los árboles."
 latria_sexual_frustration_flavor.1025.a: "Ceder el halcón a otro y alejarme a solas."
 latria_sexual_frustration_flavor.1025.b: "Lanzarla del puño y dejarla volar."
 latria_sexual_frustration_flavor.1025.c: "Volarla otra vez, hasta que me duela el brazo."

 latria_sexual_frustration_flavor.1026.t: "La página que alguien volvió"
 latria_sexual_frustration_flavor.1026.desc: "La lección ha terminado y el libro sigue abierto entre nosotros, en la página que el capellán volvió con un dedo seco. Lluvia en los postigos. La vela se ha consumido y doblado.\n\nNo seguí el argumento. Miré el dedo, y la tinta a lo largo de él, y el modo en que la manga estaba subida hasta el codo. La vergüenza llega después, siempre, y no sirve de nada.\n\nEl capellán cierra el libro y pregunta si he entendido. Digo que sí. La lluvia sigue en los postigos. Mantengo la mano plana sobre la cubierta para que no busque nada."
 latria_sexual_frustration_flavor.1026.a: "Llevar la cuestión al capellán mañana."
 latria_sexual_frustration_flavor.1026.b: "Pedir al capellán que lo repita, y esta vez escuchar."
 latria_sexual_frustration_flavor.1026.c: "Leer la página una vez más, solo las letras."

 latria_sexual_frustration_flavor.1027.t: "Lo que dejó el día"
 latria_sexual_frustration_flavor.1027.desc: "El último peticionario se ha ido y la sala huele a lana mojada y al sebo con que se frotan los bancos. Mi sello está tibio de mi mano. Los asuntos del día están resueltos y yo sigo aquí, sin moverme.\n\nHubo un momento en la ventana, entre dos oradores, en que se me dirigió una mirada que llevo desde entonces como una piedra en el zapato. No se dijo nada. No hacía falta decir nada.\n\nEl escribiente viene por el sello. Se lo doy y mis dedos están firmes. Sale. La puerta no cierra del todo. Presto oído a cómo se asienta el pestillo, y la lluvia empieza de nuevo sobre el plomo."
 latria_sexual_frustration_flavor.1027.a: "Despedir la sala mañana y decir una sola cosa."
 latria_sexual_frustration_flavor.1027.b: "Cerrar la ventana y terminar los papeles."
 latria_sexual_frustration_flavor.1027.c: "Despachar lo que queda, hoja por hoja."

 latria_sexual_frustration_flavor.1028.t: "La cinta en la caja"
 latria_sexual_frustration_flavor.1028.desc: "Hay una caja en el estante con una cinta dentro que no es mía, verde, gastada en el pliegue. La saco, la devuelvo y la saco otra vez.\n\nEn la feria perdí la cinta y alguien la encontró en el barro y me la devolvió con una reverencia que yo no necesitaba. Tenía las manos frías. Dije gracias y nada más, y durante todo el camino de vuelta no me perdoné aquel nada más.\n\nLa lámpara está baja. La cinta cruza mi palma y el verde es casi gris con esta luz. La doblo una vez, y luego otra, y los pliegues no coinciden."
 latria_sexual_frustration_flavor.1028.a: "Atarme la cinta a la muñeca y dormir."
 latria_sexual_frustration_flavor.1028.b: "Guardar la caja bajo llave en el fondo del arca."
 latria_sexual_frustration_flavor.1028.c: "Tomar papel y escribir la noche."

 latria_sexual_frustration_flavor.1029.t: "El fuego entre vigilias"
 latria_sexual_frustration_flavor.1029.desc: "El fuego se ha reducido a un ojo rojo y el campamento duerme salvo nosotros dos y los que montan guardia. Mi capa me cubre las rodillas. La espada está donde puedo alcanzarla, por costumbre.\n\nLlevamos once noches compartiendo el fuego y he aprendido el sonido de su respiración. Esta noche también está en vela. Ninguno de los dos dice nada sobre el camino de mañana, ni sobre la posada del último pueblo, donde había una sola habitación y la tomamos.\n\nEl viento aplana las llamas. Un leño se acomoda. Pongo otro y las chispas suben, y las chispas son lo único que se mueve en todo el bosque."
 latria_sexual_frustration_flavor.1029.a: "Sentarme junto al fuego y esperar la luz."
 latria_sexual_frustration_flavor.1029.b: "Alimentar el fuego, mantener la guardia y no mirar a esa persona."
 latria_sexual_frustration_flavor.1029.c: "Cambiar la guardia con esa persona y caminar hasta el borde del bosque."

 latria_sexual_frustration_flavor.1030.t: "La cuerda de la campana"
 latria_sexual_frustration_flavor.1030.desc: "La cuerda de la campana es áspera en mis manos, la campana ya ha sonado y la iglesia está vacía. El guía espera junto a la puerta con las llaves, paciente como la piedra.\n\nPienso en el cuerpo como una cosa que hay que guardar, y no consigo fijar el pensamiento. Se escapa. Bajo la lana hay calor y vida, y hay en mí un pulso que nada tiene que ver con la oración.\n\nSuelto la cuerda. Oscila un poco y queda quieta. El guía alza las llaves. Recorro la nave detrás de esa persona y mi sombra va por delante sobre las losas, larga y delgada, y sale por la puerta."
 latria_sexual_frustration_flavor.1030.a: "Dar la noche al cuerpo y resolverlo mañana."
 latria_sexual_frustration_flavor.1030.b: "Arrodillarme y terminar el oficio de la tarde."
 latria_sexual_frustration_flavor.1030.c: "Retener al guía y escuchar un pasaje más."

 latria_sexual_frustration_flavor.1031.t: "La cinta sobre las tablas"
 latria_sexual_frustration_flavor.1031.desc: "El fuego se ha consumido hasta una línea roja y no he pedido más leña. El vestido se me ha aflojado en el cuello y la estancia está bastante tibia, así que lo dejo así. Hace dos días, al romper la cacería, una mano se quedó en la parte baja de mi espalda más tiempo del que exigía desmontar.\n\nRecuerdo el peso de aquella palma, el aliento que se movió junto a mi oído cuando el caballo se revolvió, la palabra en voz baja que no era del todo una palabra. Mi propia mano va al lugar que la palma cubrió. La piel está tibia por el fuego, y cuando la presiono el calor es solo mío.\n\nLa cinta se ha deslizado del poste de la cama a las tablas. La miro yacer en la luz roja. El fuego se acomoda. No la recojo."
 latria_sexual_frustration_flavor.1031.a: "Recoger la cinta y dejar que el pensamiento vaya donde quiera."
 latria_sexual_frustration_flavor.1031.b: "Atar la cinta, cubrir el fuego y dormir."
 latria_sexual_frustration_flavor.1031.c: "Sacar el tablero y jugar el final a solas."

 latria_sexual_frustration_flavor.1032.t: "El peso de una palma"
 latria_sexual_frustration_flavor.1032.desc: "La piedra está fría a través de mis rodillas y llevo tanto tiempo de rodillas que el frío se ha vuelto compañía. Bajo la lana mi cuerpo tiene demasiado calor y no distingo si son los braseros u otra cosa. La semana pasada una mano se posó sobre mi cabeza en bendición y permaneció más allá de las palabras.\n\nLas oraciones salen correctas. Las respuestas son correctas. Lo que sube, en cambio, es el peso de aquella palma, el aceite en los dedos, el instante en que ninguno de los dos se movió y el sacristán tosió en el umbral. Aprieto la frente contra los nudillos. El mármol no devuelve nada.\n\nUna vela del altar lateral se dobla y luego se endereza. Me quedo donde estoy. El frío sube por mis rodillas y lo dejo."
 latria_sexual_frustration_flavor.1032.a: "Alzarme, buscar al sacerdote y decir lo que ha habido en mí."
 latria_sexual_frustration_flavor.1032.b: "Mantener la vigilia hasta la campana."
 latria_sexual_frustration_flavor.1032.c: "Recorrer el claustro hasta que mis piernas estén tan frías como mis rodillas."

 latria_sexual_frustration_flavor.1033.t: "La segunda capa"
 latria_sexual_frustration_flavor.1033.desc: "El fuego está entre nosotros y los perros se han callado. Alguien me echó una segunda capa sobre los hombros sin preguntar, y la lana huele al sudor de otra persona y a humo de leña. Su rodilla está contra la mía. Ninguno de los dos la ha movido.\n\nPuedo nombrar tres razones para levantarme: la guardia, la lona de la tienda que no cierra, el frío que llegará antes del alba. En cambio vuelvo la cara hacia las llamas y dejo que mi hombro se quede donde ha venido a posarse. Nuestro aliento sale y se adelgaza en el aire entre ambos. Bajo la capa mi mano encuentra la costura de mi propia manga y la sujeta.\n\nUna rama cae al fuego. Esa persona no se mueve. Yo no me muevo. Las chispas suben y se van."
 latria_sexual_frustration_flavor.1033.a: "Quedarme bajo la capa hasta que el fuego sea ceniza."
 latria_sexual_frustration_flavor.1033.b: "Dar las gracias por la lana e irme a mi tienda."
 latria_sexual_frustration_flavor.1033.c: "Preguntar por los perros hasta que cambie la guardia."

 latria_sexual_frustration_flavor.1034.t: "La tercera cláusula"
 latria_sexual_frustration_flavor.1034.desc: "El tratado se ha copiado dos veces y la segunda copia está mal en la tercera cláusula. La he leído cuatro veces y el error sigue ahí. Llevo el cuello abierto; el brasero ha calentado la estancia y no hay nadie aquí que lo vea.\n\nA lo que vuelvo es a la antecámara, a la boca de quien trajo el tratado en la cara interna de mi muñeca y luego por encima de ella, y a cómo dejé que siguiera mientras los pasos del notario iban y venían al otro lado de la puerta. No dije nada que pudiera escribirse. Esa persona dijo menos.\n\nLa vela ha comido un cuarto menguante en la cera. Tomo la pluma, la dejo y leo otra vez la tercera cláusula. Las palabras no han cambiado."
 latria_sexual_frustration_flavor.1034.a: "Mandar llamar a quien trajo el tratado y decir sin rodeos lo que he estado pensando."
 latria_sexual_frustration_flavor.1034.b: "Copiar la cláusula otra vez e ir a confesarme al alba."
 latria_sexual_frustration_flavor.1034.c: "Leer el salterio hasta que la vela se apague."

 latria_sexual_frustration_flavor.1035.t: "Dos vueltas"
 latria_sexual_frustration_flavor.1035.desc: "El salón está ruidoso y el vino se me ha subido a la cabeza, no lejos, solo lo suficiente. El vestido se me ha soltado en el hombro y no me he molestado en arreglarlo. En la última danza una mano se posó en mi cintura y permaneció durante dos vueltas, y la sala estaba demasiado llena para apartarse.\n\nTodavía puedo encontrar los cuatro puntos de aquellos dedos a través de la seda. Mi propia mano va al hombro, al lugar tibio donde la tela se ha deslizado. La música va ahora por detrás de los que tocan. Aun así llevo el compás.\n\nLa lámpara sobre mí humea. Alguien en la mesa del fondo se ríe de algo que no oí. Mi hombro está desnudo y lo dejo así."
 latria_sexual_frustration_flavor.1035.a: "Pedir otra melodía y bailarla."
 latria_sexual_frustration_flavor.1035.b: "Arreglar el vestido y tomar el aire frío en la ventana."
 latria_sexual_frustration_flavor.1035.c: "Sentarme junto al fuego con el perro viejo hasta que el salón se vacíe."

 latria_sexual_frustration_flavor.1036.t: "El río de los faroles"
 latria_sexual_frustration_flavor.1036.desc: "El jardín se ha llenado de faroles y el río de abajo lleva más, una deriva lenta de luz hacia lo oscuro. Sostengo un farol de seda que alguien me puso en la mano en la puerta; tiene un acertijo escrito en tinta a un lado y no lo he leído dos veces. La multitud se mueve y la mano de un desconocido roza la mía, una vez, y se pierde en la aglomeración.\n\nNo vi un rostro. Vi un hombro, el vuelo de una manga, y luego solo los faroles río abajo. Mi propia mano se cierra sobre nada. El acertijo pregunta qué carga lleva alguien que se hace más pesada cuanto más lejos se lleva, y resulta que conozco la respuesta y no la quiero.\n\nAlguien que debería estar aquí no está esta noche. Pongo mi farol en el agua con los demás y lo miro encontrar la corriente. Las luces se apagan una a una en el recodo. Me quedo en la barandilla hasta que se va el último."
 latria_sexual_frustration_flavor.1036.a: "Pedir un farol mío y escribir un nombre en él."
 latria_sexual_frustration_flavor.1036.b: "Dar las gracias a la multitud y tomar el camino callado a casa."
 latria_sexual_frustration_flavor.1036.c: "Leer el acertijo hasta el final y darle vueltas en la cabeza."

 latria_sexual_frustration_flavor.1037.t: "Tibio y sin vergüenza"
 latria_sexual_frustration_flavor.1037.desc: "El rito ha terminado y el templo se está vaciando, pero me quedo de rodillas un rato en el calor que queda. Nuestra fe no enseña que el cuerpo sea una deuda. Esta noche las palabras dijeron eso mismo, y mi piel ha guardado su tibieza, y no lo lamento.\n\nVuelve a mí un roce, una mano en la nuca hace unos días, y donde la voz antigua lo habría llamado mancha ahora solo hay una bendición. Dejo que el recuerdo se quede. No quema. Se posa en mí como luz de lámpara y mi respiración se hace lenta y pareja.\n\nSacan las últimas velas junto a mí. Me levanto con las rodillas firmes y la cara fresca. Sea lo que sea, no me avergüenza, y el templo no me pide que lo esté."
 latria_sexual_frustration_flavor.1037.a: "Decir la bendición en voz alta y dejar que el calor se quede."
 latria_sexual_frustration_flavor.1037.b: "Inclinarme ante el altar y llevarme la calma conmigo."
 latria_sexual_frustration_flavor.1037.c: "Sentarme un rato más y estudiar las palabras que me soltaron."

 latria_sexual_frustration_flavor.1038.t: "Un deseo en la llama"
 latria_sexual_frustration_flavor.1038.desc: "La hoguera está alta en el patio por el cambio de año, y toda la casa la ha saltado una vez, azafrán en el aire y sorbete enfriándose en las copas. Pedí mi deseo sobre la llama y no lo dije. Al otro lado del fuego alguien me miraba pedirlo y no apartó la vista.\n\nAhora la fiesta me ha llevado adentro con el vino y el ruido. Llevo el cuello suelto y la sala está tibia. Aún siento el calor del fuego en las espinillas, y el peso de esa mirada, sostenida un respiro más de lo que debería un desconocido. Giro mi copa y no bebo.\n\nEl fuego es ya un resplandor rojo por la puerta. Dejo el sorbete. El deseo sigue siendo mío y no lo he gastado."
 latria_sexual_frustration_flavor.1038.a: "Buscar a quien estaba al otro lado del fuego y hablar claro."
 latria_sexual_frustration_flavor.1038.b: "Desearle un buen año y despedirme."
 latria_sexual_frustration_flavor.1038.c: "Salir al fuego apagado y caminar por el jardín frío."

 latria_sexual_frustration_flavor.1039.t: "La mirada larga"
 latria_sexual_frustration_flavor.1039.desc: "El Naadam son tres días de polvo y ruido, y la leche de yegua se me ha subido a la cabeza más de lo que quería. Los luchadores siguen en la hierba pisoteada, gruñendo, sacudiéndose el polvo de los muslos. El viento baja de la estepa abierta y no hay nada entre yo y el cielo.\n\nHubo alguien en la segunda carrera cuya mirada sostuvo la mía un latido de más al pasar, y no la he soltado desde entonces. Miro la siguiente tanda y no veo nada de ella. Bajo el abrigo mi mano encuentra la costura y se queda. La hierba sisea y se tumba y se alza.\n\nEl polvo se asienta sobre el campo. La leche está tibia en la piel contra mi cadera. No voy a la tienda, todavía no."
 latria_sexual_frustration_flavor.1039.a: "Salir a caballo tras las carreras y dejar que el viento se lo lleve."
 latria_sexual_frustration_flavor.1039.b: "Dar las gracias a los luchadores y recogerme por la noche."
 latria_sexual_frustration_flavor.1039.c: "Sentarme con los jinetes y cambiar charla hasta que se vaya la luz."

 latria_sexual_frustration_flavor.1040.t: "La transgresión"
 latria_sexual_frustration_flavor.1040.desc: "El rito llama pecado a este querer, y me he arrodillado en la piedra fría para librarme de él. El frío sube por las rodillas y hace su trabajo, y el querer no se va. Se queda bajo las oraciones como una piedra bajo agua quieta, y cada palabra que digo es una transgresión contra él.\n\nLa boca a la que vuelvo no es de nadie que pueda nombrar, solo una tibieza, una cercanía, una mano que estuvo y luego no. Aprieto la frente contra los nudillos y trato de dar forma a la confesión. Las palabras no vienen. La garganta se me cierra sobre ellas y el templo no me devuelve nada.\n\nUn hermano se mueve en algún sitio tras la mampara y se queda quieto. Sigo sobre la piedra. La campana del oficio está cerca, y no he confesado, y no me levanto."
 latria_sexual_frustration_flavor.1040.a: "Ir a mi cámara y acabar con el querer."
 latria_sexual_frustration_flavor.1040.b: "Mantener la vigilia y dejar que la piedra me tenga."
 latria_sexual_frustration_flavor.1040.c: "Quedarme en lo oscuro y dejar que el consuelo me encuentre."
