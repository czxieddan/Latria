l_spanish:
 latria_sexual_frustration_flavor.1311.t: "Antes de que la casa despierte"
 latria_sexual_frustration_flavor.1311.desc: "Me despierto antes que la casa con el camisón subido más allá de los muslos y la mano ya apretada entre ellos. No la retiro. El sueño sigue sobre mí, el peso de alguien que no estaba en esta habitación, y mi cuerpo quiere terminar lo que el sueño empezó.\n\nMantengo los ojos cerrados y dejo que siga, el aliento acortándose, el talón de mi mano llevando el ritmo lento que ya he aprendido. Hay un nombre detrás de mis dientes. No lo digo, no con las tablas del corredor crujiendo bajo el paso de un sirviente.\n\nCuando se rompe no me muevo, con los dedos mojados y la sábana húmeda bajo la cadera. El paso sigue más allá de la puerta y se aleja. Bajo el camisón y la tela se pega."
 latria_sexual_frustration_flavor.1311.a: "Dejar que termine, luego vestirme para el día."
 latria_sexual_frustration_flavor.1311.b: "Retirar la mano y no moverme hasta la campana."
 latria_sexual_frustration_flavor.1311.c: "Alzarme, lavarme y sentarme un rato con el dolor."

 latria_sexual_frustration_flavor.1312.t: "El injerto en el peral"
 latria_sexual_frustration_flavor.1312.desc: "El jardín sigue mojado de la lluvia de la noche, y la persona que llevo toda la semana evitando me muestra el injerto nuevo del peral. Sus dedos se cierran sobre los míos para moverlos a lo largo del corte. Ninguno de los dos suelta cuando la demostración termina.\n\nSiento el pulso en su pulgar contra mi muñeca. Detrás del seto, dos de mi casa discuten por una silla de montar. Si yo volviera la cabeza un poco, y esa persona volviera la suya, estaríamos haciendo algo que nadie podría confundir con horticultura.\n\nDice que el injerto prenderá para el otoño. Su mano sigue en la mía. Una rama gotea sobre mi manga y no la limpio."
 latria_sexual_frustration_flavor.1312.a: "Decir sin rodeos lo que quiero, aquí bajo el árbol."
 latria_sexual_frustration_flavor.1312.b: "Dar las gracias por la lección y retroceder un paso."
 latria_sexual_frustration_flavor.1312.c: "Quedarme, y decir en cambio una cosa verdadera."

 latria_sexual_frustration_flavor.1313.t: "Al otro lado de la mesa"
 latria_sexual_frustration_flavor.1313.desc: "Las copas han dado la vuelta dos veces y el salón está lo bastante ruidoso para que nadie escuche a una sola persona. Llevo una hora mirando al mismo invitado al otro lado de la mesa, la línea de su garganta cuando ríe.\n\nPodría decirlo. No todo, solo lo suficiente para que sepa que no hablo del tiempo. Mi vecino lo oiría. También el mayordomo del extremo de la mesa, que repite a la casa todo lo que se le dice.\n\nGira su copa por el tallo y me mira por encima de ella. Abro la boca. Los músicos empiezan otra vez y lo que fuera a decir se va bajo el tambor."
 latria_sexual_frustration_flavor.1313.a: "Decirlo lo bastante alto para que se oiga."
 latria_sexual_frustration_flavor.1313.b: "Morderme la lengua y dejar que el vino haga su trabajo."
 latria_sexual_frustration_flavor.1313.c: "Volverme hacia mi vecino y hacer de ello un juego."

 latria_sexual_frustration_flavor.1314.t: "La primera palabra"
 latria_sexual_frustration_flavor.1314.desc: "Llevo de rodillas sobre la piedra fría tanto tiempo que las losas se me han impreso en las espinillas, y las palabras han dejado de ser palabras. Mi mente vuelve una y otra vez a una boca que no tengo por qué recordar dentro de este edificio, el modo en que se abrió, el sonido que salió de ella.\n\nMi guía espera en el atril con la paciencia de quien ha oído toda confesión que existe. Podría decírselo. Decirlo sería una puerta que no puedo volver a cerrar, y mi cuerpo quiere esa puerta abierta, esta noche, con la lámpara todavía encendida.\n\nLlego hasta la primera palabra. La vela entre nosotros se inclina en una corriente y miro la cera correr sobre el hierro y endurecerse allí."
 latria_sexual_frustration_flavor.1314.a: "Decírselo, y dejar que el templo me juzgue."
 latria_sexual_frustration_flavor.1314.b: "Guardar la confesión y cumplir la penitencia."
 latria_sexual_frustration_flavor.1314.c: "Pedir un libro y leer hasta que el temblor pare."
 latria_sexual_frustration_flavor.1314.d: "Mantener la vigilia hasta la mañana."

 latria_sexual_frustration_flavor.1315.t: "Matorral de alisos"
 latria_sexual_frustration_flavor.1315.desc: "La cacería se ha dispersado y he ido tras un jabalí que nunca estuvo allí. La persona con la que quería estar a solas me encuentra en el matorral de alisos con las calzas abiertas y la mano en mí, y no se aparta.\n\nSe arrodilla en las hojas mojadas. Tengo una mano en su pelo y la otra apoyada en un tronco, y los cuernos suenan en algún lugar al este, lo bastante cerca para que no debiéramos. Ninguno de los dos se detiene. Me toma en la boca y tengo que morderme la mejilla por dentro para no hacer ruido.\n\nDespués tengo las rodillas sucias y hay una hoja pegada a mi muslo. Se limpia la boca con el dorso de la muñeca y dice que el jabalí fue hacia el norte."
 latria_sexual_frustration_flavor.1315.a: "Dejar que la cacería siga sin mí."
 latria_sexual_frustration_flavor.1315.b: "Volver a la silla y ganarme mi sitio."
 latria_sexual_frustration_flavor.1315.c: "Leer el suelo y seguir las huellas."

 latria_sexual_frustration_flavor.1316.t: "El sello torcido"
 latria_sexual_frustration_flavor.1316.desc: "El consejo lleva una hora con la misma petición y no he firmado nada. Bajo la mesa mis manos están en el regazo, y pienso en la última noche de la campaña, la tienda, la persona que entró sin llamar y no se fue hasta que cambió la guardia.\n\nMi canciller pregunta si estoy de acuerdo. Digo que sí, y no tengo idea de a qué he accedido. El sello está tibio de mi anillo. Lo aprieto en la cera y la marca sale torcida, las letras dobladas en un borde.\n\nSalen en fila con sus papeles. Me quedo en la silla con el sello torcido delante y la estancia oliendo todavía a las velas de otras personas."
 latria_sexual_frustration_flavor.1316.a: "Mandar llamar a quien tengo en el pensamiento, con sello y todo."
 latria_sexual_frustration_flavor.1316.b: "Dejar el sello y volver a las peticiones."
 latria_sexual_frustration_flavor.1316.c: "Llamar de vuelta al consejo y terminar el trabajo."

 latria_sexual_frustration_flavor.1317.t: "Una línea en el margen"
 latria_sexual_frustration_flavor.1317.desc: "La sala de examen está barrida y en silencio y estoy a solas con los comentarios. Los caracteres no se quedan quietos. He leído cuatro veces la misma línea sobre la continencia, y cada vez ha sido sobre un par de manos que solté demasiado tarde, en un corredor, con una lámpara acercándose.\n\nDe mi propia mano, en el margen, he escrito un verso que no es comentario en absoluto. Si mi examinador lo viera, sabría para qué es, y para quién. Podría quemar la página. El brasero está a tres pasos y las brasas siguen rojas.\n\nCopio el verso otra vez, con más cuidado, y el pincel tiembla en la última pincelada."
 latria_sexual_frustration_flavor.1317.a: "Copiar el verso y dejar que se lea."
 latria_sexual_frustration_flavor.1317.b: "Cerrar el libro y dormir en la estera."
 latria_sexual_frustration_flavor.1317.c: "Volver a los comentarios y empezar de nuevo."
 latria_sexual_frustration_flavor.1317.d: "Poner el verso con la melodía que cantan los cortesanos."

 latria_sexual_frustration_flavor.1318.t: "Dos copas en el patio"
 latria_sexual_frustration_flavor.1318.desc: "El banquete se ha vaciado hacia el patio y mi amigo más antiguo me ha seguido fuera con dos copas. No se lo he dicho a nadie, ni a un sacerdote, ni a un sirviente, ni a la persona concernida. Esta noche el vino ha vuelto pesado el no decirlo, como una copa llena es pesada.\n\nPodría ponerlo en sus manos y dejar que cargue con una parte. No se reiría. Tampoco lo olvidaría, y cada vez que me mirara al otro lado de un salón habría esto entre nosotros, una cosa con nombre.\n\nMe tiende una copa y espera, y la fuente sigue corriendo detrás. La bebo de un trago y el hielo se agrieta y se asienta."
 latria_sexual_frustration_flavor.1318.a: "Decirlo en voz alta y dejar que lo guarde."
 latria_sexual_frustration_flavor.1318.b: "Jurar que no y sentirlo esta noche."
 latria_sexual_frustration_flavor.1318.c: "Leer en voz alta hasta que el patio se vacíe."

 latria_sexual_frustration_flavor.1319.t: "El muro del jardín"
 latria_sexual_frustration_flavor.1319.desc: "Tiene la espalda contra el muro del jardín con la falda subida por encima de las caderas, y mi mano está entre sus piernas donde cualquiera que pase por el sendero podría verlo. La humedad ya está ahí. La hay desde el corredor.\n\nConsigo meter dos dedos y me sujeta la muñeca y me mantiene allí, más fuerte, la frente contra mi hombro. Su aliento se vuelve áspero. Al otro lado del muro un jardinero sigue trabajando, la hoja de una pala resonando en las piedras.\n\nSe estremece y sus uñas se cierran en mi brazo. Cuando puede sostenerse, se alisa la falda y dice mi nombre una vez, en voz baja, como una pregunta que ya ha respondido."
 latria_sexual_frustration_flavor.1319.a: "Quedarme hasta que pueda caminar."
 latria_sexual_frustration_flavor.1319.b: "Retirar la mano y desear buenas tardes."
 latria_sexual_frustration_flavor.1319.c: "Rodear el muro por el camino largo, a solas."

 latria_sexual_frustration_flavor.1320.t: "Un catálogo"
 latria_sexual_frustration_flavor.1320.desc: "Vine al templo a librarme de ello y en cambio estoy de rodillas catalogándolo: el olor de un cuello concreto, el sonido que hace una persona concreta, el peso exacto de un cuerpo contra el mío en un umbral, una mano plana en el marco.\n\nMi guía vela y lee. Podría pedir una penitencia y me la daría, y la cumpliría, y para la tercera noche estaría de vuelta en esta piedra con la misma lista, más larga.\n\nPido en cambio un libro. Me lo da sin una palabra, marcando su sitio con el pulgar, y lo sostengo abierto y no leo una línea."
 latria_sexual_frustration_flavor.1320.a: "Nombrarlo todo, y dejar que el templo responda."
 latria_sexual_frustration_flavor.1320.b: "Pedir la penitencia y guardar mi lista."
 latria_sexual_frustration_flavor.1320.c: "Escuchar lo que quiera decirme."

 latria_sexual_frustration_flavor.1321.t: "Tres semanas en el camino"
 latria_sexual_frustration_flavor.1321.desc: "Llevamos tres semanas en el camino y no he estado a solas con nadie desde el último pueblo. Mi caballo está desensillado, el fuego bajo, y los demás duermen envueltos en sus capas a un brazo de mí, lo bastante cerca para oír a uno rechinar los dientes.\n\nMe quedo con la mano dentro de la camisa y los dientes en mi propio nudillo, escuchando a los caballos moverse y las botas del centinela en las hojas. Tarda mucho, y al final no hay satisfacción, solo cansancio, y el deseo sigue ahí bajo el cansancio.\n\nEl centinela vuelve a pasar junto al fuego y no me mira. Subo la capa y miro las brasas ponerse grises."
 latria_sexual_frustration_flavor.1321.a: "Tomar lo que la noche permita y dormir."
 latria_sexual_frustration_flavor.1321.b: "Alzarme y tomar mi turno de guardia."
 latria_sexual_frustration_flavor.1321.c: "Instruirme a solas hasta que me tiemblen los brazos."

 latria_sexual_frustration_flavor.1322.t: "La copa de la embajada"
 latria_sexual_frustration_flavor.1322.desc: "La mesa de la embajada está puesta para doce y ocupo el asiento junto a quien la representa, cuya gente tiene una costumbre sobre la hospitalidad en la que llevo pensando desde las presentaciones, a lo largo del pescado, a lo largo del segundo escanciado.\n\nVuelve a llenar mi copa por su cuenta, lo que no gusta a su mayordomo. Si dijera aquí lo que no debo, estaría en un despacho en el próximo barco, en mi nombre, con una letra que no es la mía. Si dijera lo que debo, también estaría en un despacho, y leído en voz alta en una sala en la que nunca entraré.\n\nPregunta por nuestras costumbres matrimoniales. Respondo mal. La vela se ha consumido hasta la arandela y ninguno de los dos ha pedido otra."
 latria_sexual_frustration_flavor.1322.a: "Responder como su costumbre permite."
 latria_sexual_frustration_flavor.1322.b: "Desear buenas noches y marcharme."
 latria_sexual_frustration_flavor.1322.c: "Llevar la charla al tratado y mantenerla allí."

 latria_sexual_frustration_flavor.1323.t: "El coro en el triforio"
 latria_sexual_frustration_flavor.1323.desc: "El coro practica en el triforio y yo debería estar oyendo la armonía y no la boca del sacerdote que lo dirige, el modo en que da forma a la tercera línea.\n\nHe tomado la costumbre de llegar temprano e irme tarde. El canto le hace algo a la opresión de mi pecho que la oración no le hace, y sé qué está sustituyendo. Mi guía ha notado la hora que guardo y no ha dicho nada al respecto, lo cual es peor que una reprimenda, porque significa que espera.\n\nLa última nota muere en lo alto de la bóveda. Me quedo en el banco con las manos planas en las rodillas hasta que el sacristán viene con sus llaves."
 latria_sexual_frustration_flavor.1323.a: "Cantar con ellos y dejar que el sonido lo lleve."
 latria_sexual_frustration_flavor.1323.b: "Guardar la regla e irme antes de la última estrofa."
 latria_sexual_frustration_flavor.1323.c: "Estudiar la composición con mi guía."

 latria_sexual_frustration_flavor.1324.t: "La campana de la mañana"
 latria_sexual_frustration_flavor.1324.desc: "Me despierto entre las sábanas revueltas con todo ello todavía encima, el camisón subido bajo los brazos, y mi mano entre las piernas antes de despertar del todo. El sueño se va y lo persigo, las caderas alzándose, y no me importa quién esté en la habitación contigua ni qué hora marque la campana.\n\nLlega en un arrebato que deja mi muslo temblando. Me quedo con los dedos todavía dentro y el aliento fuerte en el silencio, y la sábana está empapada debajo, fría ya donde el aire la alcanza.\n\nLa campana del oficio matinal empieza. Saco la sábana mojada y la pongo en la jofaina, y el agua se enturbia."
 latria_sexual_frustration_flavor.1324.a: "Terminar, lavarme y acudir a la campana."
 latria_sexual_frustration_flavor.1324.b: "Arrancar la sábana e irme sin lavarme."
 latria_sexual_frustration_flavor.1324.c: "Sentarme ante la tablilla hasta que mis manos estén firmes."

 latria_sexual_frustration_flavor.1325.t: "La puerta"
 latria_sexual_frustration_flavor.1325.desc: "Hay una partida en el rincón y he perdido tres rondas porque no dejo de mirar la puerta. La persona a la que espero llega tarde, y todos en este salón saben quién soy, y con quién me casé, y cuál de ellos me está mirando.\n\nPodría ponerme en pie sobre el banco y decirlo. La sala quedaría callada como quedan las salas, y por la mañana estaría en todos los salones de aquí a la costa, con mi nombre pegado y el nombre de mi familia detrás, y los dos nombres no volverían a separarse.\n\nLa puerta se abre. Es un sirviente con más vino. Tiendo mi copa y mi mano está firme, lo cual es peor."
 latria_sexual_frustration_flavor.1325.a: "Ponerme en pie y decirlo ante todo el salón."
 latria_sexual_frustration_flavor.1325.b: "Seguir en el asiento y dejar que la partida siga."
 latria_sexual_frustration_flavor.1325.c: "Buscar a mi amigo y sentarme a su lado."

 latria_sexual_frustration_flavor.1326.t: "Las cuentas"
 latria_sexual_frustration_flavor.1326.desc: "El mayordomo ha dispuesto las cuentas, el mapa y la lista de mis obligaciones, y no he leído ninguna. Pienso en una puerta de una ciudad por la que pasé en primavera, y en el modo en que alguien dijo mi nombre en la oscuridad detrás de ella, dos veces, antes de que el pestillo se alzara.\n\nHay mucho que hacer y soy yo quien debe hacerlo. Mojo la pluma y escribo la primera cifra y está mal, y la tacho con tanta fuerza que la punta se abre y la tinta cruza la columna.\n\nRecorto la pluma y empiezo de nuevo. Al otro lado de la ventana la guarnición se instruye y los gritos llevan el compás."
 latria_sexual_frustration_flavor.1326.a: "Dejar las cuentas y mandar por esa ciudad."
 latria_sexual_frustration_flavor.1326.b: "Dejar la pluma y tomar el libro mayor."
 latria_sexual_frustration_flavor.1326.c: "Repasar la lista hasta que las velas chisporroteen."

 latria_sexual_frustration_flavor.1327.t: "La loma"
 latria_sexual_frustration_flavor.1327.desc: "Cabalgamos desde el alba y la hierba está vacía en todas direcciones, ni un árbol, ni un jinete, nada hasta el borde del cielo. Mi cuerpo se queja desde el segundo día en la silla, y cabalgar no ha hecho nada por acallarlo; solo lo ha empeorado.\n\nMe detengo en lo alto de la loma, meto la mano en las calzas y lo termino en unas cuantas sacudidas, con el viento en la cara y nadie a la vista, el caballo moviéndose debajo todo el tiempo.\n\nAto el cordón y bajo cabalgando hasta los demás. Mi primo pregunta por qué sonrío y le digo que el caballo es bueno."
 latria_sexual_frustration_flavor.1327.a: "Tomar el momento que la estepa me da."
 latria_sexual_frustration_flavor.1327.b: "Seguir cabalgando y quitármelo de la cabeza."
 latria_sexual_frustration_flavor.1327.c: "Soltar el halcón hasta que me canse los brazos."

 latria_sexual_frustration_flavor.1328.t: "Vigilia"
 latria_sexual_frustration_flavor.1328.desc: "Estoy en el templo desde el oficio y sigo aquí. La lámpara se ha llenado dos veces y el aceite huele a la prensa barata. Mis rodillas han pasado del dolor a una especie de entumecimiento y el deseo no se ha ido a ninguna parte; se ha instalado y se ha puesto cómodo.\n\nLa vigilia debe vaciar a una persona. A esta le ha dado espacio al deseo, como una habitación oscura da forma a lo que haya en ella. Podría irme. La puerta no está cerrada y la ciudad no está lejos.\n\nEmpiezo el salmo otra vez desde el principio. Mi voz sale firme y la odio un poco."
 latria_sexual_frustration_flavor.1328.a: "Romper la vigilia y salir a la ciudad."
 latria_sexual_frustration_flavor.1328.b: "Mantener la vigilia hasta que el cielo se ponga gris."
 latria_sexual_frustration_flavor.1328.c: "Leer el salterio hasta el final."

 latria_sexual_frustration_flavor.1329.t: "Cuatro líneas"
 latria_sexual_frustration_flavor.1329.desc: "Estoy en camisón junto a la ventana y hay en el alféizar una carta que he escrito y no he enviado. Cuatro líneas. La última dice lo que quiero con palabras que no usaría a la luz del día, y la tinta está seca, y el sello intacto.\n\nPodría dársela al sirviente de la puerta. También podría quemarla, y he quemado otras tres, y la ceniza sigue en el brasero. A mi cuerpo no le interesa el quemarla. Quiere la respuesta que viene después de dar la carta.\n\nLa vela está reducida a un churrete y la cera ha corrido sobre el borde. Leo otra vez la última línea y el papel tiembla en mi mano."
 latria_sexual_frustration_flavor.1329.a: "Dar la carta al sirviente."
 latria_sexual_frustration_flavor.1329.b: "Ponerla en el brasero e irme a la cama."
 latria_sexual_frustration_flavor.1329.c: "Sentarme junto a la ventana hasta que el churrete se apague."

 latria_sexual_frustration_flavor.1330.t: "La cláusula de la frontera"
 latria_sexual_frustration_flavor.1330.desc: "El estudio de mi preceptor huele a polvo y a tinta fría y no he retenido una palabra del tratado. La persona explica la cláusula de la frontera y yo miro sus manos, la tinta en el costado del dedo, el modo en que sostiene la página.\n\nTiene edad para ser mi progenitor y el doble de cuidado, y no hay nada en ello y no hace falta que lo haya. El deseo no pide permiso. Se asienta en mí mientras vuelve la página y encuentra la cláusula siguiente con la uña.\n\nPregunta si he entendido. Digo que sí. Me mira un instante más de lo que la pregunta necesita y luego vuelve a la página."
 latria_sexual_frustration_flavor.1330.a: "Escribir un verso sobre la frontera en su lugar."
 latria_sexual_frustration_flavor.1330.b: "Pedir que escuche una confesión."
 latria_sexual_frustration_flavor.1330.c: "Repetir la cláusula palabra por palabra."

 latria_sexual_frustration_flavor.1331.t: "La hora lenta"
 latria_sexual_frustration_flavor.1331.desc: "La casa duerme y yo no, no desde hace una hora. El camisón está subido más allá de mis caderas y mis dedos han encontrado mi propia humedad sin que yo lo decidiera. Los dejo allí y dejo venir el pensamiento que lleva girando desde el corredor, la persona que se inclinó para enderezarme el cuello y no retrocedió después.\n\nPresiono y hago círculos como mi cuerpo me ha enseñado, despacio, luego no despacio, la otra mano plana en el cabecero para que no golpee el muro. Abajo hay una puerta de servicio y una escalera que se queja. No me detengo. Mi aliento se vuelve áspero y vuelvo la cara hacia la almohada para tragar el sonido.\n\nSe rompe y me quedo con los dedos todavía contra mí, el pulso siguiendo debajo. La escalera se queja otra vez y se acomoda. Bajo el camisón y la tela está húmeda y se pega."
 latria_sexual_frustration_flavor.1331.a: "Dejar que termine, luego vestirme antes de la campana."
 latria_sexual_frustration_flavor.1331.b: "Retirar la mano y no moverme."
 latria_sexual_frustration_flavor.1331.c: "Lavarme, y sentarme con el dolor hasta que se embote."

 latria_sexual_frustration_flavor.1332.t: "La nave fría"
 latria_sexual_frustration_flavor.1332.desc: "Vine al templo a vaciarme y me arrodillé en la piedra fría hasta que el deseo solo se asentó más hondo. Ahora tiene un rostro, la persona a la que me confesé en el banquete, el modo en que escuchaba con la cabeza inclinada, el modo en que su pulgar se movía en la copa. Mi mano está bajo el hábito y nadie puede verla en la oscuridad de la nave lateral.\n\nMantengo los ojos en la lámpara del altar y dejo trabajar los dedos, despacio, la mandíbula apretada. Una puerta se abre en algún lugar detrás del cancel y los acólitos entran para el oficio nocturno, sus pies en las losas. Debería parar. Mi mano no para. Aprieto la frente contra mis manos juntas y respiro entre los dientes.\n\nPasa y no deja nada dentro, solo el temblor. Los acólitos empiezan el salmo. Sigo de rodillas hasta que las piernas se me entumecen y la lámpara es lo único que puedo mirar."
 latria_sexual_frustration_flavor.1332.a: "Nombrarlo en el confesionario y cumplir la penitencia."
 latria_sexual_frustration_flavor.1332.b: "Mantener la vigilia hasta que el cielo se ponga gris."
 latria_sexual_frustration_flavor.1332.c: "Leer el salterio hasta el final."

 latria_sexual_frustration_flavor.1333.t: "La hondonada verde"
 latria_sexual_frustration_flavor.1333.desc: "He llevado a la persona que quería lejos de la cacería, a una hondonada donde la luz llega verde entre las hojas. Mis calzas están abiertas y su mano está en mí, y mi mano está bajo su falda, y ninguno de los dos finge que esto va de los ciervos. La humedad ya está ahí. La hay desde que le sujeté la muñeca en el vado.\n\nConsigo meter los dedos y se le escapa el aliento y me cubre la boca con la suya, fuerte, la mano libre hecha un puño en mi cuello. Los cuernos suenan entre los árboles, la cacería girando en algún lugar cercano. No paramos. Se mueve contra mi mano y su aliento llega en ráfagas cortas contra mi mejilla.\n\nSe estremece y queda inmóvil, agarrando mi muñeca. Los cuernos se apagan al este. Se alisa la falda con las manos temblorosas y una hoja cae de su pelo."
 latria_sexual_frustration_flavor.1333.a: "Dejar que la cacería siga sin nosotros."
 latria_sexual_frustration_flavor.1333.b: "Volver a la silla y ganarme mi sitio."
 latria_sexual_frustration_flavor.1333.c: "Volver por el camino largo y enfriarme."

 latria_sexual_frustration_flavor.1334.t: "El margen del tratado"
 latria_sexual_frustration_flavor.1334.desc: "El estudio está frío y el tratado yace abierto y he leído la misma cláusula tres veces. Quien lo trajo se ha ido, pero el recuerdo no, la hora en el corredor en que tuve a esa persona contra el muro con mi mano bajo su túnica y su boca abierta en mi hombro, los dos pendientes de un paso.\n\nMi mano se ha deslizado al regazo bajo la mesa. Me obligo a retirarla y la aprieto plana sobre la página. La tinta está seca bajo mi palma. Si escribiera en el margen lo que estoy pensando, el escribiente lo copiaría en limpio y lo pasaría antes de la mañana.\n\nMojo la pluma y escribo la cláusula otra vez, correctamente, y mi mano no está firme en la última palabra. La vela chisporrotea y despabilo la mecha."
 latria_sexual_frustration_flavor.1334.a: "Decir sin rodeos lo que quiero de esa persona."
 latria_sexual_frustration_flavor.1334.b: "Desear el bien y retroceder."
 latria_sexual_frustration_flavor.1334.c: "Sacar el tablero y jugar hasta que mis manos queden quietas."

 latria_sexual_frustration_flavor.1335.t: "Detrás del tapiz"
 latria_sexual_frustration_flavor.1335.desc: "El banquete está ruidoso y los músicos están entre melodías y he llevado a la persona que llevo toda la noche mirando detrás del tapiz, donde la luz no llega. Mi mano está bajo su túnica y su espalda contra el muro y se muerde el propio labio para no hacer ruido. Mi otra mano está sobre su boca, no fuerte, solo lo suficiente.\n\nEl salón está a tres pies al otro lado de la tela. Una copa se rompe y alguien ríe. Se mueve contra mis dedos y sus ojos se cierran y siento el estremecimiento cruzar aquel cuerpo, su aliento caliente y rápido contra mi palma.\n\nSe afloja un poco y la sostengo. Más allá del tapiz los músicos empiezan otra vez. Se alisa la túnica y sale primero, y yo espero un rato antes de seguir."
 latria_sexual_frustration_flavor.1335.a: "Volver a entrar y ocupar mi asiento."
 latria_sexual_frustration_flavor.1335.b: "Mantener mi sitio tras la tela un momento más."
 latria_sexual_frustration_flavor.1335.c: "Buscar a mi amigo y sentarme a su lado."
