l_spanish:
 latria_sexual_frustration_flavor.1211.t: "La lámpara encendida"
 latria_sexual_frustration_flavor.1211.desc: "La casa se ha quedado tan callada que oigo la lámpara. No he llamado a nadie. He sacado dos copas de todos modos, y la segunda está ahí con nada dentro. El pan sigue bajo el paño donde lo dejé al mediodía.\n\nLo que conservo es un hombro contra el mío en un umbral, su peso, el modo en que ninguno de los dos se movió durante lo que dura un respiro. Mi piel lo ha guardado. Vuelve a esta hora, bajo el camisón, detrás de mis rodillas y más abajo, y mi mano se posa plana en el vientre para acallarlo y no lo acalla.\n\nLa mecha se inclina. Giro la copa vacía para que el asa mire hacia la silla."
 latria_sexual_frustration_flavor.1211.a: "Apagar la lámpara y dejar que mi propia mano lo termine."
 latria_sexual_frustration_flavor.1211.b: "Despabilar la mecha, beber el té frío y dormir."
 latria_sexual_frustration_flavor.1211.c: "Leer hasta que las palabras dejen de dar vueltas."

 latria_sexual_frustration_flavor.1212.t: "El consejo espera"
 latria_sexual_frustration_flavor.1212.desc: "Se leen las peticiones y no oigo ninguna. Mi mayordomo está de pie al borde de la mesa con las manos juntas a la espalda, y llevo mirando la línea de su garganta desde la segunda página. La lluvia ha parado y la estancia está demasiado caliente. El fuego chasquea detrás de mí y se acomoda.\n\nSe inclina para mover una vela y una manga me roza la muñeca. Ninguno de los dos dice nada. La estancia huele a cera caliente y a lana mojada. Podría dar por terminada la sesión. La palabra ya está en mi boca y la retengo ahí, y esa persona espera con los ojos en el sello.\n\nEl escribiente pregunta si he decidido. No he decidido nada."
 latria_sexual_frustration_flavor.1212.a: "Terminar la sesión y retener a esa persona con un encargo inventado."
 latria_sexual_frustration_flavor.1212.b: "Resolver las peticiones y mantener los ojos en la página."
 latria_sexual_frustration_flavor.1212.c: "Llevar los papeles a la mesa del mapa y trabajar toda la noche."

 latria_sexual_frustration_flavor.1213.t: "Para qué sirve la oscuridad"
 latria_sexual_frustration_flavor.1213.desc: "La puerta está atrancada. No llevo nada puesto, y la sábana está en el suelo donde la arrojé. La habitación huele a la vela y a mi propia piel.\n\nMi cuerpo ha estado ruidoso todo el día y ahora lo está más. Dejo que mis rodillas caigan abiertas y mi mano baje sobre el vientre, más abajo, y no finjo estar haciendo otra cosa. Lo que viene es una boca en mi clavícula, unas muñecas sujetas y disfrutadas, y lo sigo hasta que mis caderas se alzan del jergón y mi aliento se rompe en pedazos en la oscuridad.\n\nDespués la habitación es la misma habitación. Me quedo con el brazo sobre los ojos. La vela se ha consumido hasta un charco y no he dormido."
 latria_sexual_frustration_flavor.1213.a: "Dejar que mi mano termine y dormir después."
 latria_sexual_frustration_flavor.1213.b: "Recoger la sábana del suelo y no moverme hasta el alba."
 latria_sexual_frustration_flavor.1213.c: "Vestirme, bajar y recorrer las murallas hasta que el cielo se ponga gris."
 latria_sexual_frustration_flavor.1213.d: "Entregarme otra vez, y otra, hasta que la vela muera."

 latria_sexual_frustration_flavor.1214.t: "La hora antes de laudes"
 latria_sexual_frustration_flavor.1214.desc: "Estoy a solas en la iglesia con las lámparas que debo despabilar. El frío sube por las losas y los santos miran más allá de mí, hacia la puerta. Bajo la sotana mi cuerpo está tibio y despierto y del todo sin interés por la hora.\n\nConozco las palabras para esto. Las he dicho sobre otras personas en el cajón de madera junto a la puerta, con la voz que uso para sus pecados. Decírmelas a mí no hace nada. El deseo se asienta detrás de mis costillas como una brasa tragada. Aprieto la palma plana contra la piedra del altar hasta que duele.\n\nLa campana sonará pronto. Mi mano sigue en la piedra, y la piedra ya no está fría."
 latria_sexual_frustration_flavor.1214.a: "Tomar el deseo en mis propias manos y pedir perdón después."
 latria_sexual_frustration_flavor.1214.b: "Permanecer de rodillas todo el oficio y dejar que las horas lo desgasten."
 latria_sexual_frustration_flavor.1214.c: "Abrir el libro y leer los salmos hasta que las palabras sostengan."

 latria_sexual_frustration_flavor.1215.t: "Una rodilla bajo la mesa"
 latria_sexual_frustration_flavor.1215.desc: "El salón está ruidoso. El perro de alguien está bajo los bancos y el vino ha dado la vuelta dos veces. Mi vecino no ha apartado su rodilla de la mía desde el venado, y el banco se ha vuelto tibio donde nos encontramos. Los juncos huelen a vino pisado.\n\nCada vez que la mesa se sacude con una risa, la presión cambia y vuelve. He dejado de seguir la discusión sobre la frontera. Pongo la mano en el banco, junto a la suya, y la dejo allí. Mira la mano, luego el muro del fondo, y su rodilla se queda. Mi rodilla se ha entumecido y no la he movido.\n\nUna copa se vuelca. El vino corre hasta el borde y gotea sobre los juncos. Nadie se ha movido."
 latria_sexual_frustration_flavor.1215.a: "Decirlo sin rodeos, aquí, y dejar que el salón oiga."
 latria_sexual_frustration_flavor.1215.b: "Dar las gracias a la mesa, alzarme y tomar el aire fuera."
 latria_sexual_frustration_flavor.1215.c: "Volverme hacia esa persona y hablar de cualquier otra cosa hasta que el fuego baje."

 latria_sexual_frustration_flavor.1216.t: "Mangas en el jardín"
 latria_sexual_frustration_flavor.1216.desc: "Las peonías han pasado su mejor momento y el jardinero ha dejado de fingir que trabaja. Damos la vuelta larga al estanque, porque el camino corto termina en la verja. La tarde se ha puesto del color del té aguado.\n\nSu manga no deja de encontrar el dorso de mi mano. En mi propia casa un roce así sería una decisión ya tomada, y se habría mandado por los casamenteros antes de que el té se enfriara. Aquí no es más que una manga, y soy yo quien debe leerla. Aminoro el paso. Aminora el paso. El agua guarda nuestros dos reflejos y ninguno se mueve primero.\n\nEn la verja se detiene y mira atrás una vez. Hay pétalos bajo mi zapato."
 latria_sexual_frustration_flavor.1216.a: "Preguntar sin rodeos, y responder por ello ante mi casa."
 latria_sexual_frustration_flavor.1216.b: "Hacer una reverencia, mantener las manos en las mangas y entrar."
 latria_sexual_frustration_flavor.1216.c: "Rodear el estanque otra vez a solas hasta que enciendan las lámparas."

 latria_sexual_frustration_flavor.1217.t: "El largo regreso a caballo"
 latria_sexual_frustration_flavor.1217.desc: "Llevamos en la silla desde antes de la luz, y durante las últimas tres millas he sido consciente de quien cabalga delante. El modo en que se sienta. El modo en que miró atrás en el vado. Tengo los muslos irritados y la boca seca y nada de eso es la razón por la que sigo mirando.\n\nLos ciervos se han ido, los ojeadores están dispersos, y nadie comentaría una demora. Mis manos están frías en las riendas y el resto de mí no está frío en absoluto. Hinco los talones y cierro la distancia hasta la nada. El bosque chasquea de agua.\n\nSe vuelve al oírnos y espera. El bosque está lleno de hojas mojadas y los caballos resoplan."
 latria_sexual_frustration_flavor.1217.a: "Llevar a esa persona entre los árboles y volver tarde."
 latria_sexual_frustration_flavor.1217.b: "Cabalgar hasta el refugio y poner el pensamiento en agua fría."
 latria_sexual_frustration_flavor.1217.c: "Desmontar y leer las huellas hasta que mis manos dejen de temblar."

 latria_sexual_frustration_flavor.1218.t: "Una habitación con libros prestados"
 latria_sexual_frustration_flavor.1218.desc: "Quien me deja dormir en su almacén y estudia me ha dejado la lámpara y un libro que no leo bien. Lluvia en los postigos, y olor a paja mojada. Mi cuerpo está inquieto desde el último pueblo, y la cama estrecha lo empeora. La lámpara humea cuando la corriente la alcanza.\n\nEntra para ver la mecha y se queda con los dedos en el estante, y puedo oler la tinta en sus manos. Le pido que se quede y me explique la página. Lo hace. Su hombro descansa contra el mío mientras señala, y ninguno de los dos lo mueve, y he dejado de oír la gramática.\n\nLa lluvia cede. Su dedo sigue en la misma línea."
 latria_sexual_frustration_flavor.1218.a: "Cantar, mal, hasta que el deseo tenga adónde ir."
 latria_sexual_frustration_flavor.1218.b: "Dar las gracias, apagar la lámpara y tumbarme de espaldas a la puerta."
 latria_sexual_frustration_flavor.1218.c: "Pedir que siga enseñando y mantener las manos en la página."
 latria_sexual_frustration_flavor.1218.d: "Copiar el pasaje tres veces hasta que mi mano esté demasiado cansada para querer."

 latria_sexual_frustration_flavor.1219.t: "La sala detrás del salón"
 latria_sexual_frustration_flavor.1219.desc: "El banquete se ha vaciado hacia el patio, y nosotros dos hemos acabado en la salita detrás del salón donde se guardan los bancos de repuesto. Tiene la espalda contra la puerta y una mano plana en mi pecho, y se ríe de mí, esperando.\n\nConsigo el broche de su cinturón, luego los lazos, y ríe otra vez y me ayuda. Su boca está en mi garganta y un muslo viene entre los míos, y ya he pasado el fingir. Nos tomamos tiempo en el banco, su pelo soltándose, mi aliento áspero, hasta que se estremece y yo voy detrás.\n\nDespués sigue sujetando mi muñeca. La música ha empezado otra vez en el salón."
 latria_sexual_frustration_flavor.1219.a: "Decir la verdad de todo ello y no soltar su mano."
 latria_sexual_frustration_flavor.1219.b: "Arreglar mi ropa, dar las gracias y volver al salón."
 latria_sexual_frustration_flavor.1219.c: "Sentarme con esa persona en el banco hasta que la música pare."

 latria_sexual_frustration_flavor.1220.t: "La vigilia que mantuve"
 latria_sexual_frustration_flavor.1220.desc: "Dije a los demás que mantendría la vigilia, y me dejaron la iglesia, una vela y el olor del incienso de la semana pasada. La medianoche llegó y pasó. Me duelen las rodillas y mi cuerpo no quiere callar. Las losas me han sacado el calor de los pies.\n\nCada vez que cierro los ojos hay una mano en la parte baja de mi espalda, de un baile de hace dos inviernos, y tengo que abrirlos otra vez. La vela arroja mi sombra contra el muro. Podría poner fin a esto en un instante y nadie lo sabría nunca, y ese es el problema.\n\nHay corriente desde la puerta. Mi sombra se mueve en el muro."
 latria_sexual_frustration_flavor.1220.a: "Tomarlo en mis propias manos aquí y hablar con franqueza a los santos."
 latria_sexual_frustration_flavor.1220.b: "Seguir de rodillas hasta que la ventana se ponga gris."
 latria_sexual_frustration_flavor.1220.c: "Leer el oficio en voz alta hasta que mi voz sea lo único en la estancia."

 latria_sexual_frustration_flavor.1221.t: "El guante de quien trajo el tratado"
 latria_sexual_frustration_flavor.1221.desc: "Quien trajo el tratado lleva tres días en mi salón y he contado todos y cada uno de ellos. Se quita el guante para volver las páginas, dedo a dedo, y he perdido dos veces la cláusula del río. El fuego se ha consumido y nadie ha ido por leña.\n\nMis consejeros me miran no escuchar. Hay un lugar en la ciudad donde nadie pregunta un nombre, y el pensamiento se ha posado en mi pecho desde la segunda mañana, pesado y tibio y del todo indigno. No he estado ante esa puerta en un año.\n\nTiende el guante para que mire el sello. Lo tomo. Todavía está tibio."
 latria_sexual_frustration_flavor.1221.a: "Firmar, despedir a esa persona y bajar a la ciudad esta noche."
 latria_sexual_frustration_flavor.1221.b: "Leer la cláusula otra vez y mantener las manos en la mesa."
 latria_sexual_frustration_flavor.1221.c: "Repasar los términos uno por uno hasta que las velas chisporroteen."
 latria_sexual_frustration_flavor.1221.d: "Averiguar qué puerta de la ciudad es la discreta."

 latria_sexual_frustration_flavor.1222.t: "Una mano retenida demasiado"
 latria_sexual_frustration_flavor.1222.desc: "El baile ha llegado a la danza lenta y me han pasado de mano en mano toda la velada. La última no suelta cuando la música se detiene. El salón está caliente de velas y del olor del vino ajeno. Los juncos están pisoteados y las velas chisporrotean.\n\nSu pulgar está sobre mis nudillos. El salón mira y finge no mirar, me arden las orejas, y no retiro la mano. Alguien se ríe cerca de los músicos. La presa se aprieta una vez, deliberada, y todo mi cuerpo responde antes de que pueda componer el rostro. Mi mano no está firme en la suya. La música empieza otra vez detrás de mí.\n\nSuelta. La marca de sus dedos se queda en mi mano."
 latria_sexual_frustration_flavor.1222.a: "Decir lo que quiero donde todo el salón pueda oírlo."
 latria_sexual_frustration_flavor.1222.b: "Dar las gracias por el baile y retroceder hacia la multitud."
 latria_sexual_frustration_flavor.1222.c: "Pedir que me acompañe a la puerta y hablar de caballos."

 latria_sexual_frustration_flavor.1223.t: "El vado"
 latria_sexual_frustration_flavor.1223.desc: "Nos detenemos en el vado para dar de beber a los caballos, y el día es bastante caluroso para que media partida se meta en el agua. Estoy de pie sobre la roca plana, sin camisa, estrujándola, cuando advierto a quien sigue en la silla, mirando. El agua suena fuerte sobre las piedras. Los caballos beben y cambian las patas.\n\nNo aparta la vista cuando la sorprendo. El agua me corre por las costillas y se me va de la muñeca. Hay mucho que yo podría hacer con la tarde y todo el bosque para hacerlo, y mi cuerpo ya lo ha decidido, y me está costando pensar en los caballos.\n\nDesmonta. Las riendas siguen en su mano."
 latria_sexual_frustration_flavor.1223.a: "Soltar la camisa e ir hacia esa persona ante quien quiera mirar."
 latria_sexual_frustration_flavor.1223.b: "Ponerme la camisa y cabalgar por delante al refugio."
 latria_sexual_frustration_flavor.1223.c: "Sacar el halcón y mantener las manos ocupadas hasta que la partida esté lista."

 latria_sexual_frustration_flavor.1224.t: "Dos jinetes y la hierba"
 latria_sexual_frustration_flavor.1224.desc: "La hierba es bastante alta para esconder un caballo, y el cielo hace lo que hace antes de la lluvia. Cabalgamos lado a lado desde que la manada giró, y su pierna lleva contra la mía el último estadio, y ninguno de los dos lo ha corregido. El viento huele a tallos aplastados. Los caballos están mojados hasta la rodilla.\n\nAquí fuera no hay muro tras el que ocultarse ni sacerdote a menos de un día de caballo. Eso nunca ha hecho el deseo más simple. Solo lo ha hecho más grande, como la tierra es más grande, y he dejado de fingir que no sé adónde va esto.\n\nSe detiene en lo alto de la loma y me mira por encima del hombro. Caen las primeras gotas."
 latria_sexual_frustration_flavor.1224.a: "Tomar su mano y llevarla abajo, a la hierba alta."
 latria_sexual_frustration_flavor.1224.b: "Asentir, volver mi caballo y echar una carrera hasta los carros."
 latria_sexual_frustration_flavor.1224.c: "Poner la diana en el poste lejano y disparar hasta que me tiemblen los brazos."

 latria_sexual_frustration_flavor.1225.t: "Lo que dije en el cajón"
 latria_sexual_frustration_flavor.1225.desc: "Me arrodillé en el cajón de madera y lo dije en voz alta, lo cual fue peor que no decir nada. El sacerdote al otro lado de la rejilla no se escandalizó ni me riñó. Me hizo una pregunta sobre mi propia casa y esperó, y oí mi propia voz dar la respuesta. La iglesia huele a piedra fría.\n\nAl volver por la iglesia sigo con la cara caliente. No es vergüenza, o no solo eso. Habiéndolo dicho, puedo sentirlo todo otra vez, a la luz del día, ante el altar, y mi cuerpo no tiene modales en absoluto. El cuello me aprieta demasiado.\n\nSigue en el cajón. La cortina se mueve cuando paso."
 latria_sexual_frustration_flavor.1225.a: "Volver al cajón y pedir que escuche el resto."
 latria_sexual_frustration_flavor.1225.b: "Arrodillarme ante la barandilla y aceptar la penitencia y las palabras que me dé."
 latria_sexual_frustration_flavor.1225.c: "Sentarme en la nave lateral y escuchar la lección hasta estar en calma."

 latria_sexual_frustration_flavor.1226.t: "Despertar a la cuarta hora"
 latria_sexual_frustration_flavor.1226.desc: "Salgo del sueño con el corazón en marcha y los muslos húmedos y la sábana arrojada a los pies de la cama. En el sueño era el patio de los establos y una mano en mi cuello, y sé de quién es esa mano. La habitación está fría y la almohada está mojada donde estuvo mi boca.\n\nLa habitación está gris. No hay nadie en ella. A mi cuerpo no le importa el gris ni la hora. Quiere el sueño terminado y es muy claro sobre cómo. Pongo el brazo sobre los ojos y me quedo con las rodillas alzadas. El suelo está frío como para doler.\n\nEl pájaro del alero empieza. Mi mano ya se mueve."
 latria_sexual_frustration_flavor.1226.a: "Terminarlo, y que el sueño me encuentre después."
 latria_sexual_frustration_flavor.1226.b: "Alzarme, vestirme y salir a los establos a trabajar hasta que me duela el cuerpo."
 latria_sexual_frustration_flavor.1226.c: "Leer la carta en la mesa hasta que la luz llegue de verdad."

 latria_sexual_frustration_flavor.1227.t: "La apuesta"
 latria_sexual_frustration_flavor.1227.desc: "Alguien ha apostado un caballo a que no soy capaz de decir ante toda la mesa el nombre de la persona que quiero. El vino es bueno, el fuego está vivo, la apuesta es estúpida, y todos esperan. El perro se ha detenido bajo el banco para escuchar. La apuesta se hizo delante del hombre del obispo.\n\nSiento el nombre en la boca como una piedra. Al otro lado de la mesa, la persona en cuestión mira su rebanada de pan y no a mí, y tengo mojada la nuca. Si lo digo, estará en todos los salones para el domingo. Alguien ha puesto más leña en el fuego.\n\nEl mayordomo me llena otra vez la copa. La mesa se ha quedado callada."
 latria_sexual_frustration_flavor.1227.a: "Decir el nombre y dejar que el salón haga lo que quiera con ello."
 latria_sexual_frustration_flavor.1227.b: "Reír, pagar la prenda y pedir más vino."
 latria_sexual_frustration_flavor.1227.c: "Sacar el tablero y vencer a quien hizo la apuesta."
 latria_sexual_frustration_flavor.1227.d: "Hacer un verso que lleve el nombre y ningún nombre."

 latria_sexual_frustration_flavor.1228.t: "Los términos"
 latria_sexual_frustration_flavor.1228.desc: "El matrimonio se discute bajo los árboles, con la voz que se usa para la propiedad. Quien lo afecta está de pie junto al muro con las manos juntas, escuchando a un escribiente leer lo que vale. Una abeja trabaja el espliego entre nosotros y nadie la espanta. La voz del escribiente se aplana en los números.\n\nMe han pedido que resuelva la cuestión de la dote. He leído la misma línea cuatro veces. Lo que quiero no es decente y no está en el papel, y lleva toda la tarde de pie junto al muro con un abrigo verde. El abrigo verde tiene el puño rasgado.\n\nEl escribiente espera con la pluma en alto. Una hoja cae sobre la mesa."
 latria_sexual_frustration_flavor.1228.a: "Resolver los términos pronto y despedir al escribiente y a la familia."
 latria_sexual_frustration_flavor.1228.b: "Leer cada línea dos veces y no revelar nada."
 latria_sexual_frustration_flavor.1228.c: "Llevar los papeles dentro y decidir con la cabeza despejada."
 latria_sexual_frustration_flavor.1228.d: "Ordenar las cuentas del patrimonio y dejar que los números me sostengan."

 latria_sexual_frustration_flavor.1229.t: "La mano del escriba"
 latria_sexual_frustration_flavor.1229.desc: "La copia es lenta, el scriptorium está frío, y he escrito la misma palabra mal tres veces. Mi mente no está en la página. Está en la boca de quien trajo el pan al mediodía. Alguien dos mesas más allá respira por una nariz tapada. El pan aún estaba tibio cuando llegó.\n\nHice un voto y lo he guardado, y guardarlo me ha hecho consciente de mi propio cuerpo de un modo difícil de rezar. Mi mano tiembla sobre el pergamino. Hay una manera de terminar esto que dura lo que una oración breve, y la quiero.\n\nLa tinta se seca en la letra equivocada."
 latria_sexual_frustration_flavor.1229.a: "Dejar el voto a un lado una tarde y decir con franqueza el motivo."
 latria_sexual_frustration_flavor.1229.b: "Mantener el voto y dejar que el deseo se consuma solo."
 latria_sexual_frustration_flavor.1229.c: "Retomar el pasaje y copiar hasta que mi mano esté firme."

 latria_sexual_frustration_flavor.1230.t: "El anochecer en el jardín"
 latria_sexual_frustration_flavor.1230.desc: "He salido en camisón porque la habitación era peor. El jardín está azul y las polillas están en el espliego. Alguien en el ala de los sirvientes toca mal un instrumento de cuerda, las mismas cuatro notas, una y otra vez. La hierba me ha calado las zapatillas y el borde del camisón pesa.\n\nTodavía siento dónde se posó una mano en mi cintura esta tarde, junto a la verja, ligera, durante lo que dura una cortesía. No se ha desvanecido. Lleva toda la noche subiendo de volumen, la música no ayuda, y mi propia piel me queda pequeña. No me he movido desde la verja. El banco está frío a través del lino.\n\nMe siento en el banco de piedra. Las polillas siguen en el espliego."
 latria_sexual_frustration_flavor.1230.a: "Volver dentro y dejar que la música cubra lo que hago."
 latria_sexual_frustration_flavor.1230.b: "Quedarme en el banco hasta que el frío atraviese el camisón."
 latria_sexual_frustration_flavor.1230.c: "Respirar, contar las cuatro notas y dejar que el jardín baste."

 latria_sexual_frustration_flavor.1231.t: "Despertar antes de la campana"
 latria_sexual_frustration_flavor.1231.desc: "Me despierto antes de la campana con la sábana arrojada al suelo y la piel húmeda a lo largo de la parte baja de la espalda. El camisón se me ha retorcido en los muslos. Estaba soñando, y el sueño sigue sobre mí, un calor que se ha asentado abajo y no se levanta.\n\nEra el mismo rostro que he tenido cuidado de no pensar en toda la semana. En el sueño no había cuidado. Una mano en mi cintura, una boca de la que sentía la forma, y mi propio cuerpo respondiendo antes de que yo hubiera decidido nada. Ahora no hay sueño, y no ha parado.\n\nMe quedo con las rodillas recogidas y la palma plana contra el vientre, y el calor solo se junta debajo. La campana no ha sonado. Mi aliento va rápido y corto y no me he movido para calmarlo."
 latria_sexual_frustration_flavor.1231.a: "Apagar la lámpara y dejar que mi propia mano lo termine."
 latria_sexual_frustration_flavor.1231.b: "Estirar el camisón, volverme y no moverme hasta la campana."
 latria_sexual_frustration_flavor.1231.c: "Leer hasta que el calor afloje."

 latria_sexual_frustration_flavor.1232.t: "La cabalgada aparte"
 latria_sexual_frustration_flavor.1232.desc: "Llevamos en la silla desde antes de la luz y he mantenido los ojos en quien cabalga delante. El modo en que se sienta. El modo en que miró atrás en el vado y aminoró para que yo pudiera ponerme a su lado. Tengo los muslos irritados en carne viva y la boca seca y nada de eso es la razón por la que sigo mirando.\n\nLos ciervos se han ido y los ojeadores se han dispersado en el bosque mojado. Nadie comentaría una demora. Hinco los talones hasta que no queda distancia y mi rodilla encuentra la suya, y el cuero cruje, y ninguno de los dos tira de las riendas.\n\nSe vuelve al oírnos y espera. El bosque suena a agua que gotea. Mis manos están frías en las riendas y el resto de mí no está frío en absoluto, y el caballo resopla bajo mi cuerpo."
 latria_sexual_frustration_flavor.1232.a: "Cerrar lo que queda de distancia y dejar que el bosque lo guarde."
 latria_sexual_frustration_flavor.1232.b: "Tirar de las riendas, seguir a solas y dominarme."
 latria_sexual_frustration_flavor.1232.c: "Desmontar y caminar por el sendero mojado hasta que se me despeje la cabeza."

 latria_sexual_frustration_flavor.1233.t: "La hora que guardan los santos"
 latria_sexual_frustration_flavor.1233.desc: "Estoy a solas en la iglesia con las lámparas que debo despabilar. El frío sube por las losas, pero bajo la sotana mi cuerpo está tibio y despierto y no tiene interés por el oficio. Los santos miran más allá de mí, hacia la puerta cerrada.\n\nConozco las palabras destinadas a enfriar esto. Las he dicho sobre otras personas en la oscuridad del cajón junto a la puerta, con la voz que guardo para sus pecados. Sobre las mías no hacen nada. El deseo se asienta detrás de mis costillas como una brasa tragada, y mi mano ha venido a posarse plana en la piedra del altar sin que yo se lo dijera.\n\nAprieto hacia abajo hasta que el borde frío me duele en la palma. La campana sonará pronto. Mi mano sigue en la piedra, y la piedra ha tomado mi calor y ya no está fría."
 latria_sexual_frustration_flavor.1233.a: "Tomar el deseo en mis propias manos y pedir perdón después."
 latria_sexual_frustration_flavor.1233.b: "Permanecer de rodillas todo el oficio y dejar que las horas lo desgasten."
 latria_sexual_frustration_flavor.1233.c: "Apoyar la frente en la piedra fría y dejar que me afirme."

 latria_sexual_frustration_flavor.1234.t: "La mano retenida demasiado"
 latria_sexual_frustration_flavor.1234.desc: "El consejo se ha ido y el estudio está callado. Durante toda la última hora solo he sido consciente de una cosa: cuando quien trae el tratado se inclinó sobre la mesa para pasarme el documento, su mano se cerró sobre la mía y se quedó allí un respiro más allá de lo que el sello exigía. La sala estaba llena de gente. Dejé que se quedara.\n\nVuelvo al peso de aquello, al calor de una palma sin motivo para demorarse. La vela se ha consumido mientras leía la misma cláusula tres veces. Mi cuerpo ha decidido que esto vale más que el tratado, y no me pide opinión.\n\nSu anillo dejó una marca en el dorso de mi mano. No la he frotado. La cera se encharca y la puerta sigue cerrada y leo la cláusula por cuarta vez."
 latria_sexual_frustration_flavor.1234.a: "Mandar llamar otra vez y decir sin rodeos lo que me hizo esa mano."
 latria_sexual_frustration_flavor.1234.b: "Mantener la vigilia nocturna a solas y dejar que me enfríe."
 latria_sexual_frustration_flavor.1234.c: "Sacar el tablero y jugar contra mí hasta que la imagen se borre."

 latria_sexual_frustration_flavor.1235.t: "Cuando la música gira"
 latria_sexual_frustration_flavor.1235.desc: "El salón está ruidoso y el vino ha dado la vuelta dos veces. Cuando los músicos atacan, me dejo llevar al baile, y la pareja que encuentro es aquella a la que he pasado toda la velada sin mirar. Su mano se posa en mi espalda, y a través de la tela fina puedo sentir cada dedo.\n\nGiramos, y giramos otra vez, y la sala se deshace en humo de velas y color. Me sostiene un poco más cerca de lo que pide la figura, y no lo corrijo. Mi pulso está en mis oídos, más fuerte que el tambor. El deseo ha subido de la nada y me ha reclamado ante todo el salón, y yo sonrío como si no pasara nada.\n\nLa música aminora hacia su final. Su mano no se ha movido de mi espalda, y no me he apartado."
 latria_sexual_frustration_flavor.1235.a: "Pedir a los músicos una danza más y sostenerla más cerca."
 latria_sexual_frustration_flavor.1235.b: "Dar las gracias, hacer una reverencia y retirarme antes de que la figura gire otra vez."
 latria_sexual_frustration_flavor.1235.c: "Quedarme en su compañía y hablar de todo menos de esto."
