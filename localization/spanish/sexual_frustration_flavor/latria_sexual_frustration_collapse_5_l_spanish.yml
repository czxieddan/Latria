l_spanish:
 latria_collapse_no_relief_tt: "La represión sexual no ha remitido."

 latria_sexual_frustration_flavor.1501.t: "La lámpara aún arde"
 latria_sexual_frustration_flavor.1501.desc.dead: "La daga se me escapa de la mano, y el ruido al golpear el suelo detiene los pasos al otro lado de la puerta. La puerta se abre; alguien se agacha a mi lado, me llama por mi nombre y luego se vuelve para pedir que traigan ayuda. La lámpara sigue en su sitio, pero no logro distinguir el rostro que tengo delante.\n\nQuiero hacerles saber que oigo; muevo los labios, pero no sale ningún sonido. De todas las palabras que repetía para mis adentros a solas, ya no logro recordar ni una frase entera. Alguien me toma de la mano y pregunta si puedo abrir los ojos; solo alcanzo a mirar la puerta que se ve detrás.\n\nMás pasos se apresuran a entrar en la estancia. Intento volver la cabeza hacia el ruido, pero las figuras junto a la puerta ya se desdibujan, hasta que ni siquiera distingo la luz de la lámpara."
 latria_sexual_frustration_flavor.1501.desc.survived: "Cuando despierto, me han cambiado la ropa de dormir y vendado las heridas con cuidado. Quien vela junto a la cama me ve abrir los ojos y llama de inmediato a la persona de mi servicio que estaba a punto de salir. Me cuentan que alguien advirtió el alboroto y abrió la puerta a tiempo; la daga ya ha sido retirada.\n\nIntento incorporarme, pero el dolor me detiene antes de que pueda separarme de la almohada. Me ajustan la manta y me preguntan si quiero agua; asiento, pero vuelvo la mirada hacia la carta sin enviar que descansa sobre la mesa. Las hojas siguen apiladas allí; en la de arriba asoma un saludo corregido muchas veces.\n\nMe acercan una copa a los labios y apenas tomo un sorbo. Quien vela a mi lado no se marcha; espera a que me acomode antes de dejar la copa con suavidad."
 latria_sexual_frustration_flavor.1501.desc.severe: "Al recobrar el conocimiento, lo primero que oigo es una conversación en voz baja junto a la cama. Alguien pregunta si unas heridas así pueden sanar; tras un momento de vacilación, la respuesta es pedir más paños limpios. Intento volverme para ver quién está ahí, pero el menor movimiento me duele tanto que no puedo hablar.\n\nLa daga ya no está a mi alcance; hasta han apartado la mesita junto a la cama. Pido ayuda para sentarme, pero solo me elevan la almohada y me aconsejan que siga en cama por ahora. La luz al otro lado de la ventana ha cambiado, pero sigo pensando en aquellas noches de desvelo y en la respuesta que nunca llegó.\n\nUna mano se acerca para arreglar las mantas. Quiero pedir que vayan más despacio, pero antes de terminar ya me aferro a la sábana bajo mi cuerpo."
 latria_sexual_frustration_flavor.1501.a.dead: "Todo se… oscurece…"
 latria_sexual_frustration_flavor.1501.a.survived: "Duele…"
 latria_sexual_frustration_flavor.1501.a.severe: "No me toques… duele…"

 latria_sexual_frustration_flavor.1502.t: "Una copa vacía"
 latria_sexual_frustration_flavor.1502.desc.dead: "La copa está vacía; con el cuerpo vencido junto a la cama, oigo que empujan la puerta. La persona que entra me llama por mi nombre, pero al ver lo que hay sobre la mesa se vuelve y grita pidiendo ayuda, sin siquiera cerrar la puerta. Alguien echa a correr por el corredor, y la corriente que entra en la estancia mueve la carta sin terminar.\n\nAún recuerdo la última frase a medio escribir y la pluma junto a la hoja. Alguien me sostiene por los hombros, pregunta qué he bebido y me pide que aguante un poco más. Miro hacia la mesa, con ganas de completar lo que quedó sin decir, pero mi mano no alcanza ni la esquina de papel que cuelga ante mis ojos.\n\nSiguen llamándome, pero la voz suena cada vez más lejana. Ya no distingo las palabras de la carta ni puedo dar una sola respuesta."
 latria_sexual_frustration_flavor.1502.desc.survived: "El veneno que bebí no acabó con mi vida. Cuando despierto, han traído a la estancia una palangana de agua limpia. Alguien lleva mucho tiempo velando junto a la cama; al verme abrir los ojos, se levanta para avisar a quienes esperan y luego se vuelve para preguntar si aún reconozco la habitación.\n\nHan retirado la copa de la mesa, y la carta sin terminar está sujeta bajo un libro. Quiero alargar la mano para cogerla, pero descubro que hasta acercarme al borde de la cama me cuesta un gran esfuerzo. Quien me cuida me acerca agua, espera a que termine de beber y pregunta a quién entregar la carta; miro la media línea que asoma bajo el libro y no respondo.\n\nAl otro lado de la ventana, la gente ya empieza a ir y venir. Pienso en lo que haría normalmente a estas horas, pero solo puedo apoyarme en la almohada y escuchar cómo, al otro lado de la puerta, el servicio hace marcharse a quienes piden verme."
 latria_sexual_frustration_flavor.1502.desc.severe: "El veneno no me quitó la vida, pero sigo sin poder levantarme sin ayuda como antes. Alguien trae el desayuno y deja ropa limpia junto a la cama; al extender la mano, descubro que ni siquiera consigo sostener firme el cuenco de siempre.\n\nUna persona de mi servicio me arregla los puños y me da de comer bocado a bocado. Quiero preguntar cuánto tiempo llevo aquí, pero debo detenerme a mitad de la frase para descansar. Se han acumulado varias cartas nuevas en la mesa; cuando me ofrecen leerlas en voz alta, primero pido que busquen aquel nombre familiar.\n\nQuien me atiende revisa las cartas una por una y niega suavemente con la cabeza. Miro el montón de cartas y levanto la mano para apartar un poco el cuenco, pero incluso para eso debo esperar a que alguien se incline hacia mí."
 latria_sexual_frustration_flavor.1502.a.dead: "Yo… no puedo hablar…"
 latria_sexual_frustration_flavor.1502.a.survived: "Qué mal… un poco de agua…"
 latria_sexual_frustration_flavor.1502.a.severe: "Ni siquiera puedo levantar la mano…"

 latria_sexual_frustration_flavor.1503.t: "En la orilla del río"
 latria_sexual_frustration_flavor.1503.desc.dead: "Ya no veo la orilla; solo oigo a alguien gritar a lo lejos. Hace un momento aún distinguía mi nombre, pero ahora solo llegan sonidos entrecortados. Intento mirar en esa dirección, pero la luz que oscila ante mis ojos me impide reconocer los árboles de la orilla.\n\nCreo que, cuando salí de mi alojamiento, la lámpara seguía encendida y el libro estaba abierto sobre la mesa. Me detuve tanto tiempo en la misma página y, aun así, salí sin colocar bien la cinta del marcador. Alguien entrará a ordenar la habitación y preguntará adónde he ido; recuerdo aquel rostro familiar y quiero decirle que estoy aquí.\n\nMe llega otro grito, pero no puedo responder. La luz ante mis ojos se apaga, y hasta el recuerdo de aquella habitación con la lámpara encendida se vuelve borroso."
 latria_sexual_frustration_flavor.1503.desc.survived: "Me sacan del río; cuando despierto, estoy en la orilla, con el cuerpo encogido, mientras alguien me envuelve en una capa. Quien está a mi lado me ve abrir los ojos, hace señas apresuradas hacia la distancia y luego se agacha para preguntar si oigo bien. El agua del río aún gotea de mi ropa, y el frío no me deja responder.\n\nAlguien me dice que ya han mandado buscar unas parihuelas y me aconseja que no intente levantarme todavía. Miro el sendero que vuelve a mi alojamiento y recuerdo aquella frase que no dejaba de sopesar mientras venía aquí a solas. Me preguntan a quién avisar; digo un nombre y lo repito en voz baja por miedo a que no se haya oído.\n\nVuelven a ajustarme la capa alrededor del cuerpo. Alguien promete llevar mi mensaje; quien se queda a mi lado me sostiene por el hombro y espera conmigo los pasos en el sendero."
 latria_sexual_frustration_flavor.1503.desc.severe: "De cuando me llevaron a la orilla solo recuerdo una voz que apremiaba a regresar cuanto antes. Cuando vuelvo a despertar, me han cambiado la ropa mojada y hay varias personas alrededor de la cama. Quiero preguntar cuánto tiempo he estado sin conocimiento, pero un ataque de tos me impide terminar siquiera de llamar a alguien.\n\nJunto a la cama se habla en voz baja de una enfermedad de los pulmones y se pide que cierren la ventana. Han cambiado varias veces el paño de mi frente, pero sigo sin distinguir si es de día o de noche. En los momentos de lucidez sigo mirando la puerta, esperando que entre alguien familiar; pero solo aparece una persona del servicio con agua, que pregunta en voz baja qué necesito.\n\nNiego con la cabeza e intento acomodarme contra la almohada. En cuanto me tienden una mano para ayudarme, la tos vuelve a cortar las palabras que aún no he podido pronunciar."
 latria_sexual_frustration_flavor.1503.a.dead: "Qué frío…"
 latria_sexual_frustration_flavor.1503.a.survived: "¿Sigo… con vida?"
 latria_sexual_frustration_flavor.1503.a.severe: "Yo… no puedo respirar…"

 latria_sexual_frustration_flavor.1504.t: "Al pie del precipicio"
 latria_sexual_frustration_flavor.1504.desc.dead: "Yazgo al pie del risco y oigo las voces de quienes me buscan por el sendero de la montaña. Una voz llama mi nombre, otra apremia al grupo a buscar más abajo y varias piedrecillas ruedan cerca de mí. Intento levantar una mano para que me vean, pero permanece a mi lado sin mover siquiera el borde de la ropa.\n\nLa silueta de la montaña oculta casi todo el cielo, y no recuerdo cuánto tiempo ha pasado desde que salí de mi alojamiento. Al salir, alguien me preguntó cuándo volvería; di una hora sin pensar, pero ahora no recuerdo mi respuesta. Los pasos se acercan; abro la boca, pero sigue sin salir ningún sonido.\n\nPor fin alguien se detiene cerca, se inclina y me llama. No distingo el rostro que tengo delante, ni siquiera el trozo de cielo que aún queda sobre mi cabeza."
 latria_sexual_frustration_flavor.1504.desc.survived: "Despierto al pie del risco y veo a alguien en cuclillas a mi lado, llamándome. Al ver que reacciono, esa persona se vuelve y hace señas al resto del grupo para que baje por el sendero. Estoy a punto de preguntar dónde me encuentro cuando reconozco la pared del risco sobre mí y no me atrevo a volver a mirarla.\n\nLas heridas de la caída me impiden levantarme; hasta el menor movimiento me obliga a parar para recobrar el aliento. Quien está a mi lado me pide que espere las parihuelas, recoge mi prenda de abrigo caída cerca y me cubre con ella. Miro el broche y recuerdo cómo lo arreglé ante el espejo antes de salir, pensando ya en aquella invitación que nunca obtuvo respuesta.\n\nLos pasos llegan hasta mí, y varias personas hablan en voz baja de cómo levantarme. Intento volverme para facilitar la tarea, pero grito antes incluso de moverme."
 latria_sexual_frustration_flavor.1504.desc.severe: "Despierto al pie del risco, con quienes han venido a ayudarme alrededor, pero nadie toma la palabra. Reconozco a una de esas personas y pregunto si es hora de volver. Esa persona me cubre bien con la prenda de abrigo, mira hacia el sendero y apremia a quienes traen las parihuelas.\n\nIntento levantarme, pero alguien me sujeta al instante y me pide que no me mueva. Bajo la mirada hacia mis piernas; a mi lado, una voz vacila antes de decir que quizá ya no pueda caminar como antes. El zapato caído a mi lado aún tiene barro; al mirarlo, recuerdo las noches en el corredor esperando una respuesta.\n\nAlguien pregunta si necesito algo más. Quiero pedir que recojan el zapato, pero en su lugar pregunto si ha llegado alguna noticia a mi alojamiento; por un momento, nadie responde."
 latria_sexual_frustration_flavor.1504.a.dead: "No oigo nada…"
 latria_sexual_frustration_flavor.1504.a.survived: "No puedo moverme… duele…"
 latria_sexual_frustration_flavor.1504.a.severe: "Mis piernas…"

 latria_sexual_frustration_flavor.1505.t: "La puerta forzada"
 latria_sexual_frustration_flavor.1505.desc.dead: "Cuando fuerzan la puerta de la alcoba, oigo a alguien llamar mi nombre con urgencia. La luz del corredor entra en la estancia; varias personas se agolpan en la puerta hasta que quien va delante las apremia a buscar ayuda. La carta sigue junto a la cama; quiero señalarla, pero ya no logro volver la mirada hacia ella.\n\nAlguien se acerca; la voz me resulta tan familiar que quiero responder. Entiendo bien las palabras, pero no consigo hablar; solo veo aquella boca moverse sin cesar. Alguien pregunta algo desde fuera, pero la persona inclinada a mi lado no se vuelve y sigue esperando la menor respuesta.\n\nIntento distinguir aquel rostro una vez más, pero todo se oscurece ante mis ojos. La luz de la puerta desaparece y, después, tampoco oigo ya las llamadas."
 latria_sexual_frustration_flavor.1505.desc.survived: "Forzaron la puerta de la alcoba y la ayuda llegó a tiempo. Desde la cama veo el cerrojo torcido; una persona de mi servicio ha traído una silla para velar fuera. Alguien me acomoda la almohada y pregunta si puedo hablar; apenas logro responder con voz ronca.\n\nLa cuerda ha desaparecido, y también han cambiado de sitio la carta que estaba junto a la cama. Intento volverme para buscarla, pero las heridas me detienen a medio camino. Quien me cuida sigue mi mirada y deja la carta donde pueda verla; el nombre sin terminar al final sigue impidiéndome apartar los ojos.\n\nLevanto una mano para pedir que, por ahora, no hagan preguntas. Esa persona asiente, acerca el agua y espera a que me reponga un poco antes de arroparme."
 latria_sexual_frustration_flavor.1505.desc.severe: "Alguien junto a la cama llama mi nombre; sé que espera una respuesta, pero no comprendo qué debo decir. Todos los muebles de la alcoba me resultan familiares, aunque la silla junto a la ventana parece haber cambiado de sitio. La miro fijamente hasta que alguien me arregla la manga con suavidad.\n\nMe lavan, me cambian la ropa y luego traen comida. Miro cómo se acerca la cuchara y solo recuerdo que debo abrir la boca cuando me lo indican. Alguien menciona la carta y otra persona mira de reojo el cofrecillo junto a la cama. También miro hacia allí, pero justo cuando voy a preguntar, olvido qué quería saber.\n\nLa tapa del cofrecillo ya está cerrada. Quien está junto a la cama vuelve a llamar mi nombre; esta vez giro la cabeza y veo que las manos ante mí se detienen."
 latria_sexual_frustration_flavor.1505.a.dead: "Yo…"
 latria_sexual_frustration_flavor.1505.a.survived: "Déjame… recuperar el aliento…"
 latria_sexual_frustration_flavor.1505.a.severe: "¿Alguien… me llama?"
