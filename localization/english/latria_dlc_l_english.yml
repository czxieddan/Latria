l_english:
 dlc_latria: "Latria"
 dlc_latria_desc: "Whom you may desire is no longer set by custom. The deeper longing is buried, the fiercer it burns; a lone lamp, a letter unsent, and a long night without sleep. A fleeting pleasure can soothe the heart, or leave a wound that lingers for years. In Latria, flesh and spirit may come to salvation, or to destruction."
