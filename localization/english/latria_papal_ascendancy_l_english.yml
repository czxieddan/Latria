l_english:
 h_latria_holy_see: "Holy See"
 h_latria_holy_see_adj: "Catholic"
 nick_latria_vicar_of_christ: "the Vicar of Christ"

 latria_papal_ascendancy.0001.t: "The Throne Above Every Crown"
 latria_papal_ascendancy.0001.desc: "Before the gathered prelates, I raise my hand over the broken banners of those who came to cast me down. God did not preserve His vicar so that I might bargain with princes. By His command, the Holy See shall wield undivided authority and carry salvation to every realm."
 latria_papal_ascendancy.0001.a: "Let the world kneel before the Holy See"

 latria_papal_ascendancy.0002.t: "The Vicar's Mandate"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] has broken the host raised against the Holy See. Before the clergy and the defeated princes, [latria_papal_victor.GetSheHe] proclaims that God has entrusted [latria_papal_victor.GetHerHim] with absolute authority and the salvation of the world."
 latria_papal_ascendancy.0002.a: "A new order begins"

 trait_latria_army_of_god: "Army of God"
 trait_latria_army_of_god_desc: "This character commands a host consecrated to the absolute authority of the Holy See."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] commands a host consecrated to the absolute authority of the Holy See."

 latria_papal_redemption_or_ruin: "Redemption or Ruin"
 latria_papal_redemption_or_ruin_desc: "Demand that [recipient.GetShortUINameNoTooltip] submit to the Holy See and adopt [actor.GetShortUINamePossessiveNoTooltip] [rite|E]. Refusal will bring war."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] demands your submission to the Holy See and conversion to [actor.GetHerHis] [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "Lesser [old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "Lesser [old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "Reveal the Secret"
 latria_reveal_papal_secret_decision_desc: "I will name my secret before the clergy and princes. Let every ruler hear it from my own mouth, and let those who deny my office take up arms."
 latria_reveal_papal_secret_decision_tooltip: "Publicly reveal your affair and face the deposition war."
 latria_reveal_papal_secret_decision_confirm: "Reveal it before all"
 latria_can_reveal_papal_secret_trigger: "You have an affair secret that can be revealed"
 NOT_ANY_OF_MY_SECRETS: "None of your Secrets:"

 latria_papal_redemption_war: "Papal War of Redemption"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Papal Redemption"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective] War of Redemption against [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective] War of Redemption"
 latria_papal_redemption_war_victory_desc: "The defender is reduced in rank, made a vassal of the Pope, and converted to the Pope's [rite|E]."
 latria_papal_redemption_war_white_peace_desc: "The demand for submission is withdrawn."
 latria_papal_redemption_war_defeat_desc: "The Pope's demand for submission is defeated."

 latria_decision_immediate_effect_loc: "#high #bold When you reveal the secret:#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X This will begin the $latria_papal_scandal_depose_war$:#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "Independent [rulers|E] of your [rite|E] and [vassals|E] who do not fully support you may join the coalition to depose you."
 latria_decision_paramour_defense_tt: "If your paramour is a [ruler|E], they may join the defenders."
 latria_decision_allies_call_tt: "Your [allies|E] may answer your call and join the defenders."
 latria_decision_forced_defenders_tt: "Your puppet [rulers|E] and independent rulers of your [rite|E] whose [piety_level|E] is $piety_level_0$ may join the defenders."
 latria_decision_disgraced_defenders_tt: "Characters of your [rite|E] with the [GetTrait('adulterer').GetName(GetNullCharacter)] or [GetTrait('fornicator').GetName(GetNullCharacter)] [trait|E] and troops at their command may join the defenders."
 latria_decision_hook_defenders_tt: "Your [hooks|E] may be spent to bring characters of your [rite|E] into the defense."

 latria_decision_if_win_effect_loc: "\n#high #bold If you win the war:#!#!\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "Defeated attacking [rulers|E] pay [gold|E] and [prestige|E] reparations according to their [title_tier|E]."
 latria_papal_scandal_reparations_first: "Defeated attacking [rulers|E] pay you [gold|E] and [prestige|E] according to their [title_tier|E]."
 latria_papal_scandal_reparations_third: "Defeated attacking [rulers|E] pay [CHARACTER.GetShortUIName] [gold|E] and [prestige|E] according to their [title_tier|E]."
 latria_papal_scandal_ally_share_tt: "Participating defensive [allies|E] split [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%] of the total [gold|E] and [prestige|E] reparations."
 latria_papal_redemption_unlocked_tt: "Unlocks the $latria_papal_redemption_or_ruin$ [interaction|E]."

 latria_decision_if_lose_effect_loc: "\n#high #bold If you lose the war:#!#!"
 latria_decision_defeat_imprison_tt: "The coalition leader will imprison you in their [dungeon|E]."
 latria_decision_if_white_peace_effect_loc: "\n#high #bold If the war ends in white peace:#!#!"

 latria_papal_scandal_depose_war: "Papal Deposition War"
 latria_papal_scandal_event_troops: "Papal Reinforcements"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "Depose the Pope"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "War to Depose [DEFENDER.GetShortUINameNotMe]"
 latria_papal_scandal_depose_war_victory_desc_defender: "You lose your position as [head_of_faith|E]."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U] loses [defender.GetHerHis] position as [head_of_faith|E]."
 latria_papal_scandal_depose_war_white_peace_desc: "Both sides make peace and retain their [titles|E]."
 latria_papal_scandal_depose_war_defeat_desc_defender: "You defeat the coalition and remain [head_of_faith|E]."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U] defeats the coalition and remains [head_of_faith|E]."

 latria_papal_ascendancy.0010.t: "Call to Defend the Holy See"
 latria_papal_ascendancy.0010.desc: "Your [ally|E], [latria_pope.GetShortUIName], faces a coalition seeking to depose [latria_pope.GetHerHim] over an affair. Invoking your alliance, [latria_pope.GetSheHe] asks you to march against the coalition."
 latria_papal_ascendancy.0010.a: "Honor the sacred alliance and march"
 latria_papal_ascendancy.0010.b: "We cannot fight for such a scandal"
 latria_honored_papal_alliance_opinion: "Defended the Holy See"
 latria_refused_papal_alliance_opinion: "Dishonored Papal Alliance"
 latria_ally_share_received_msg_title: "The Holy See's Gratitude"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName] has sent you a share of the defeated rulers' reparations."
 latria_ally_joined_defense_msg_title: "Ally Joins Defense"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName] honored your alliance and joined your defense against the coalition."
 latria_ally_refused_defense_msg_title: "Ally Refuses Call"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName] refused your call to defend the Holy See."

 latria_papal_scandal_war.0001.t: "A Call to Depose the Pope"
 latria_papal_scandal_war.0001.desc: "Rulers have taken up arms to depose [latria_scandal_target.GetShortUIName] after [latria_scandal_target.GetHerHis] affair was made public. Their envoys arrive at my court, asking me to march with the coalition."
 latria_papal_scandal_war.0001.a: "Take up arms with the coalition"
 latria_papal_scandal_war.0001.b: "Stay out of this war"
