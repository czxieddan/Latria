l_english:
 latria_sexual_frustration_flavor.1001.t: "A Long Night Behind the Curtain"
 latria_sexual_frustration_flavor.1001.desc.female: "In my nightgown, I sit by the window with an unopened letter in my lap. Its writer has long since departed, yet I linger over all that went unsaid."
 latria_sexual_frustration_flavor.1001.desc.male: "In my nightgown, I sit by the window with an unopened letter in my lap. Its familiar hand recalls a longing that has found no answer."
 latria_sexual_frustration_flavor.1001.desc: "The hour grows late, and old thoughts return once more."
 latria_sexual_frustration_flavor.1001.a: "Read the letter to its end"
 latria_sexual_frustration_flavor.1001.b: "Lock it away and return to bed"

 latria_sexual_frustration_flavor.1002.t: "Spice at the Feast"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Spices and songs fill the hall, and none of the guests seem troubled by a wandering glance. Still, I watch each face as though someone might yet appear."
 latria_sexual_frustration_flavor.1002.desc.strict: "The spices enliven the feast, but every laugh reminds me how closely custom watches a wayward desire. I nearly forget the cup in my hand."
 latria_sexual_frustration_flavor.1002.desc: "The feast is loud. My thoughts keep straying all the same."
 latria_sexual_frustration_flavor.1002.a: "Stay a little longer"
 latria_sexual_frustration_flavor.1002.b: "Take leave of the host"

 latria_sexual_frustration_flavor.1003.t: "A Sermon in the Garden"
 latria_sexual_frustration_flavor.1003.desc.favors: "The preacher calls carnal pleasure part of Creation. His words ought to comfort me, yet the restlessness within does not abate."
 latria_sexual_frustration_flavor.1003.desc.condemns: "The preacher speaks of chastity and restraint. I hear every word, but cannot keep my thoughts upon the scripture."
 latria_sexual_frustration_flavor.1003.desc: "I hear the sermon to its end. A breeze turns the page, and my thoughts remain unsettled."
 latria_sexual_frustration_flavor.1003.a: "Stay for the final prayer"
 latria_sexual_frustration_flavor.1003.b: "Close the book"

 latria_sexual_frustration_flavor.1004.t: "A Restless Falcon"
 latria_sexual_frustration_flavor.1004.desc.lustful: "The falcon beats its wings against my glove, eyeing the pigeons beyond. I know that eagerness well, though I cannot find where to set my own thoughts to rest."
 latria_sexual_frustration_flavor.1004.desc.chaste: "The falcon paces restlessly upon my glove. I focus on the reins and the call, but the thoughts in my mind prove harder to tame."
 latria_sexual_frustration_flavor.1004.desc: "The hunting field is empty, the falcon uneasy, and I cannot attend to either."
 latria_sexual_frustration_flavor.1004.a: "Let my thoughts wander"
 latria_sexual_frustration_flavor.1004.b: "Set the falconry gear in order"

 latria_sexual_frustration_flavor.1005.t: "Between Councils"
 latria_sexual_frustration_flavor.1005.desc.emperor: "The council has dispersed, leaving maps and seals across the table. In full court dress, I sit at its head; even silence seems to await an imperial answer."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "The horses are ready beyond the tent. My companions speak of the next ford, while I watch the fire and recall an affection that cannot travel with us."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Vespers are done. Still in my robes, I pause in the empty passage. My own footsteps are loud, but the thoughts within are louder."
 latria_sexual_frustration_flavor.1005.desc.ruler: "The council is over, but the papers and seals remain. I smooth my formal sleeve and find that I cannot read the petition before me."
 latria_sexual_frustration_flavor.1005.desc: "There is work at hand, but I cannot give it my attention."
 latria_sexual_frustration_flavor.1005.a: "Call the others back"
 latria_sexual_frustration_flavor.1005.b: "Return to the petitions"

 nick_latria_the_unquiet: "the Unquiet"
 latria_flavor_focus: "Gathered Resolve"
 latria_flavor_focus_desc: "Work and vigilance keep stray thoughts at bay."
 latria_flavor_remorse: "Lingering Remorse"
 latria_flavor_remorse_desc: "A brief comfort has left a longer unease."
 latria_flavor_sullied: "Sullied Reputation"
 latria_flavor_sullied_desc: "Rumors have harmed this character's standing and friendships."
 latria_flavor_broken_sleep: "Sleepless Nights"
 latria_flavor_broken_sleep_desc: "Long repression has crept into sleep and judgment."
 latria_flavor_vagabond_focus: "A Traveller's Focus"
 latria_flavor_vagabond_focus_desc: "The work of the road briefly quiets restless thoughts."

 latria_sexual_frustration_flavor.1006.t: "An Old Letter by Candlelight"
 latria_sexual_frustration_flavor.1006.desc.female: "In my nightgown, I sit beneath the lamp, my fingers resting on the folds of an old letter. It holds no promise, only an affection that has not faded."
 latria_sexual_frustration_flavor.1006.desc.male: "In my nightgown, I sit beside the bed. The familiar hand on the old letter recalls an affection that was never returned."
 latria_sexual_frustration_flavor.1006.desc: "The night is still, but the words on the old letter remain before me."
 latria_sexual_frustration_flavor.1006.a: "Read the letter to its end"
 latria_sexual_frustration_flavor.1006.b: "Put it away and douse the lamp"

 latria_sexual_frustration_flavor.1007.t: "Before the Feast Ends"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Someone speaks of an old lover, and none at the table take offense. I raise my cup with them, but my gaze keeps returning to an empty seat."
 latria_sexual_frustration_flavor.1007.desc.strict: "An affair is offered as a warning, and the company turns to reputation and custom. I smooth my sleeve and say nothing."
 latria_sexual_frustration_flavor.1007.desc: "The music continues, though my thoughts have long since left the table."
 latria_sexual_frustration_flavor.1007.a: "Remain at the feast a little longer"
 latria_sexual_frustration_flavor.1007.b: "Take leave of the host"

 latria_sexual_frustration_flavor.1008.t: "Prayer Before the Shrine"
 latria_sexual_frustration_flavor.1008.desc.favors: "The candle before the shrine burns low. My faith does not despise the pleasures of the flesh, yet I cannot settle the urgency within me."
 latria_sexual_frustration_flavor.1008.desc.condemns: "I repeat my vow of chastity before the shrine, but the familiar prayer breaks upon my lips more than once."
 latria_sexual_frustration_flavor.1008.desc: "The prayer is done. I remain beside the candle."
 latria_sexual_frustration_flavor.1008.a: "Continue in silent prayer"
 latria_sexual_frustration_flavor.1008.b: "Leave the shrine"

 latria_sexual_frustration_flavor.1009.t: "The Unread Petition"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Petitions cover the long table, and the lords await my word. I read one line twice, yet my thoughts stray elsewhere."
 latria_sexual_frustration_flavor.1009.desc.ruler: "The council is not yet over, but I cannot take in a word of the papers before me. I close the ledger and try to return my mind to the matter at hand."
 latria_sexual_frustration_flavor.1009.a: "Set the petition aside"
 latria_sexual_frustration_flavor.1009.b: "Call the council back to order"

 latria_sexual_frustration_flavor.1010.t: "The Eagle's Return"
 latria_sexual_frustration_flavor.1010.desc.lustful: "The falcon circles above the wood. As I watch it refuse to return, I recall how tired I am of setting every desire aside."
 latria_sexual_frustration_flavor.1010.desc.chaste: "The hawk still circles in the distance. I tighten my glove and force myself to listen only for the hunters' call."
 latria_sexual_frustration_flavor.1010.desc: "The hunters wait to break camp, while I keep watching the sky above the trees."
 latria_sexual_frustration_flavor.1010.a: "Let my thoughts follow the eagle"
 latria_sexual_frustration_flavor.1010.b: "Sound the call to return"

 latria_flavor_public_disgrace: "A Public Disgrace"
 latria_flavor_public_disgrace_desc: "Rumors of a public lapse have harmed this character's standing and friendships."
