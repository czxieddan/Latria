l_english:
 latria_sexual_frustration_flavor.1001.t: "A Long Night Behind the Curtain"
 latria_sexual_frustration_flavor.1001.desc.female: "In my nightgown, I sit by the window with an unopened letter in my lap. Its writer has long since departed, yet I linger over all that went unsaid."
 latria_sexual_frustration_flavor.1001.desc.male: "In my nightgown, I sit by the window with an unopened letter in my lap. The familiar hand upon the envelope recalls a longing that has found no answer."
 latria_sexual_frustration_flavor.1001.desc: "The hour grows late, and old thoughts return once more."
 latria_sexual_frustration_flavor.1001.a: "Read it to the end, and think of its writer."
 latria_sexual_frustration_flavor.1001.b: "Lock the letter away and stifle the thought."
 latria_sexual_frustration_flavor.1001.c: "Take a fresh sheet and make a poem of it."

 latria_sexual_frustration_flavor.1002.t: "Spice at the Feast"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Spices and songs fill the hall, and none of the guests seem troubled by a wandering glance. Still, I watch each face as though someone might yet appear."
 latria_sexual_frustration_flavor.1002.desc.strict: "The spices enliven the feast, but every laugh reminds me how closely custom watches a wayward desire. I nearly forget the cup in my hand."
 latria_sexual_frustration_flavor.1002.desc: "The feast is loud. My thoughts keep straying all the same."
 latria_sexual_frustration_flavor.1002.a: "Join in with a few tender words of my own."
 latria_sexual_frustration_flavor.1002.b: "Lower my gaze, thank the host, and take my leave."
 latria_sexual_frustration_flavor.1002.c: "Ask the musicians for one more tune before I go."
 latria_sexual_frustration_flavor.1002.d: "Gather the guests at one table and talk the evening away."

 latria_sexual_frustration_flavor.1003.t: "A Sermon in the Garden"
 latria_sexual_frustration_flavor.1003.desc.favors: "The preacher says that carnal pleasure need not offend our faith. The words ought to comfort me, yet the restlessness within does not abate."
 latria_sexual_frustration_flavor.1003.desc.condemns: "The preacher speaks of chastity and restraint. I hear every word, but cannot keep my thoughts upon the scripture."
 latria_sexual_frustration_flavor.1003.desc: "I hear the sermon to its end. A breeze turns the page, and my thoughts remain unsettled."
 latria_sexual_frustration_flavor.1003.a: "Close the book and think of the one I long for."
 latria_sexual_frustration_flavor.1003.b: "Put those thoughts aside and join the recitation."
 latria_sexual_frustration_flavor.1003.c: "Ask the preacher to explain each passage."

 latria_sexual_frustration_flavor.1004.t: "A Restless Falcon"
 latria_sexual_frustration_flavor.1004.desc.lustful: "The falcon beats its wings against my glove, eyeing the pigeons beyond. I know that eagerness well, though I cannot find where to set my own thoughts to rest."
 latria_sexual_frustration_flavor.1004.desc.chaste: "The falcon paces restlessly upon my glove. I focus on the reins and the call, but the thoughts in my mind prove harder to tame."
 latria_sexual_frustration_flavor.1004.desc: "The hunters wait for me to recall the falcon, but I cannot keep my mind on the hunt."
 latria_sexual_frustration_flavor.1004.a: "Let the company wait while I dwell on my own thoughts."
 latria_sexual_frustration_flavor.1004.b: "Gather my thoughts and put the hunting gear in order."
 latria_sexual_frustration_flavor.1004.c: "Smooth the feathers slowly, then try the call again."

 latria_sexual_frustration_flavor.1005.t: "Between Councils"
 latria_sexual_frustration_flavor.1005.desc.emperor: "The lords have dispersed, leaving maps and seals across the table. I sit alone at its head, an old letter resting beside the unfinished papers."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "My companions have agreed upon the next ford, but the map still covers the table. I draw an old letter toward the lamp and lose my place in the list of supplies."
 latria_sexual_frustration_flavor.1005.desc.clergy: "The meeting is over, leaving accounts and scripture upon the table. I draw an old letter from between the pages, and the restless thoughts return."
 latria_sexual_frustration_flavor.1005.desc.ruler: "The council is over, but the papers and seals remain. I smooth my sleeve; the old letter beside me holds my attention more firmly than any petition."
 latria_sexual_frustration_flavor.1005.desc: "There is work at hand, but an old letter keeps drawing my attention."
 latria_sexual_frustration_flavor.1005.a: "Set the work aside and read the old letter again."
 latria_sexual_frustration_flavor.1005.b: "Put the letter away and return to my duties."
 latria_sexual_frustration_flavor.1005.c: "Arrange the remaining work and allow myself a short rest."
 latria_sexual_frustration_flavor.1005.d: "Sort each task and see them all completed."

 latria_sexual_frustration_flavor.1006.t: "An Old Letter by Candlelight"
 latria_sexual_frustration_flavor.1006.desc.female: "In my nightgown, I sit beneath the lamp, my fingers resting on the folds of an old letter. It holds no promise, only an affection that has not faded."
 latria_sexual_frustration_flavor.1006.desc.male: "In my nightgown, I sit beside the bed. The familiar hand on the old letter recalls an affection that was never returned."
 latria_sexual_frustration_flavor.1006.desc: "The night is still, but the words on the old letter remain before me."
 latria_sexual_frustration_flavor.1006.a: "Read the letter to its end."
 latria_sexual_frustration_flavor.1006.b: "Put the letter away, snuff the candle, and settle to sleep."

 latria_sexual_frustration_flavor.1007.t: "Before the Feast Ends"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Someone speaks of an old lover, and none at the table take offense. I raise my cup with them, but my gaze keeps returning to an empty seat."
 latria_sexual_frustration_flavor.1007.desc.strict: "An indiscreet romance is offered as a warning, and the company turns to reputation and custom. I smooth my sleeve and say nothing."
 latria_sexual_frustration_flavor.1007.desc: "The music continues, though my thoughts have long since left the table."
 latria_sexual_frustration_flavor.1007.a: "They shall hear of my own longing, from the very beginning."
 latria_sexual_frustration_flavor.1007.b: "Swallow the words, thank the host, and take my leave."
 latria_sexual_frustration_flavor.1007.c: "Ask my neighbor about their travels instead."

 latria_sexual_frustration_flavor.1008.t: "Prayer Before the Shrine"
 latria_sexual_frustration_flavor.1008.desc.favors: "The candle before the shrine burns low. My faith does not despise the pleasures of the flesh, yet I cannot settle the urgency within me."
 latria_sexual_frustration_flavor.1008.desc.condemns: "I repeat my vow of chastity before the shrine, but the familiar prayer breaks upon my lips more than once."
 latria_sexual_frustration_flavor.1008.desc: "The prayer is done. I remain beside the candle."
 latria_sexual_frustration_flavor.1008.a: "Set aside the vow of abstinence and admit my longing."
 latria_sexual_frustration_flavor.1008.b: "Restrain my thoughts and continue in prayer."
 latria_sexual_frustration_flavor.1008.c: "Read a passage and consider it before I go."
 latria_sexual_frustration_flavor.1008.d: "Keep the candle burning and recite until dawn."

 latria_sexual_frustration_flavor.1009.t: "The Unread Petition"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Petitions cover the long table, and the lords await my word. I read one line twice, yet my thoughts stray elsewhere."
 latria_sexual_frustration_flavor.1009.desc.ruler: "The council is not yet over, but I cannot take in a word of the papers before me. I close the ledger and try to return my mind to the matter at hand."
 latria_sexual_frustration_flavor.1009.a: "Dismiss the council and leave me to my thoughts."
 latria_sexual_frustration_flavor.1009.b: "Gather my thoughts and attend to each petition."
 latria_sexual_frustration_flavor.1009.c: "Put the decisions in order, then pronounce each one."

 latria_sexual_frustration_flavor.1010.t: "The Eagle's Return"
 latria_sexual_frustration_flavor.1010.desc.lustful: "The falcon circles above the wood. As I watch it refuse to return, I recall how tired I am of setting every desire aside."
 latria_sexual_frustration_flavor.1010.desc.chaste: "The hawk still circles in the distance. I tighten my glove and force myself to listen only for the hunters' call."
 latria_sexual_frustration_flavor.1010.desc: "The hunters wait to break camp, while I keep watching the sky above the trees."
 latria_sexual_frustration_flavor.1010.a: "Keep the hunters waiting while my thoughts follow the eagle."
 latria_sexual_frustration_flavor.1010.b: "Sound the return and inspect the hunting gear."
 latria_sexual_frustration_flavor.1010.c: "Walk beside the wood before returning to the company."

