 latria_flavor_focus: "Gathered Resolve"
 latria_flavor_focus_desc: "This character has turned their attention to scripture and daily duties."
 latria_flavor_remorse: "Lingering Remorse"
 latria_flavor_remorse_desc: "A brief comfort has left an uneasy conscience."
 latria_flavor_sullied: "Sullied Reputation"
 latria_flavor_sullied_desc: "Rumors have harmed this character's standing and friendships."
 latria_flavor_broken_sleep: "Lost Sleep"
 latria_flavor_broken_sleep_desc: "Too little sleep has left this character distracted and easily tired."
 latria_flavor_vagabond_focus: "A Traveller's Focus"
 latria_flavor_vagabond_focus_desc: "The work of the road briefly quiets restless thoughts."
 latria_flavor_public_disgrace: "A Public Disgrace"
 latria_flavor_public_disgrace_desc: "Rumors of a public lapse have harmed this character's standing and friendships."
 latria_flavor_hunting_focus: "Attention to the Hunt"
 latria_flavor_hunting_focus_desc: "This character has turned their attention to tracking, falconry, and riding."
 latria_flavor_warm_company: "Pleasant Company"
 latria_flavor_warm_company_desc: "Good conversation has made this character more willing to seek company."
 latria_flavor_neglected_duties: "Neglected Duties"
 latria_flavor_neglected_duties_desc: "Private concerns have kept this character from their duties."
 latria_flavor_diligent_work: "Duties Put in Order"
 latria_flavor_diligent_work_desc: "This character has put restless thoughts to work in careful planning and labor."
