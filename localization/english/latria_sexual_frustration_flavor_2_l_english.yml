l_english:
 latria_sexual_frustration_flavor.1101.t: "Wakeful Beneath the Canopy"
 latria_sexual_frustration_flavor.1101.desc.female: "I wake in the bed, my nightgown fallen at its foot. There is no one else in the chamber; the quiet only sharpens the longing that went unanswered."
 latria_sexual_frustration_flavor.1101.desc.male: "I wake in the bed, my nightgown fallen at its foot. The world beyond the window is silent, but sleep will not keep my thoughts."
 latria_sexual_frustration_flavor.1101.desc: "The canopy hangs low. The night is long, and my thoughts will not settle."
 latria_sexual_frustration_flavor.1101.a: "Let the night pass"
 latria_sexual_frustration_flavor.1101.b: "Rise and light a candle"

 latria_sexual_frustration_flavor.1102.t: "Glances Between Dances"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Several dances pass, and the faces around me change. No one minds a close turn, yet I remember that brief meeting of eyes."
 latria_sexual_frustration_flavor.1102.desc.strict: "The closer the dance, the more the laughter sounds like whispers. I turn my gaze to the musicians lest anyone guess my thoughts."
 latria_sexual_frustration_flavor.1102.desc: "The music quickens, but the dance does not carry my thoughts away."
 latria_sexual_frustration_flavor.1102.a: "Ask for another dance"
 latria_sexual_frustration_flavor.1102.b: "Retire to the edge of the hall"

 latria_sexual_frustration_flavor.1103.t: "The Confessor's Door"
 latria_sexual_frustration_flavor.1103.desc.favors: "The confessor says that denying desire is not the only path to devotion. I would ask him more, but footsteps have stopped outside the door."
 latria_sexual_frustration_flavor.1103.desc.condemns: "The confessor reminds me that chastity matters beyond the eyes of others. I bow my head, hoping he will ask no more."
 latria_sexual_frustration_flavor.1103.desc: "The confessional is dim. I weigh what I ought to say."
 latria_sexual_frustration_flavor.1103.a: "Speak plainly"
 latria_sexual_frustration_flavor.1103.b: "Speak only of duty and prayer"

 latria_sexual_frustration_flavor.1104.t: "The Unreturned Eagle"
 latria_sexual_frustration_flavor.1104.desc.lustful: "The eagle circles above the field and will not return to my glove. I envy its freedom to follow its desire without explanation."
 latria_sexual_frustration_flavor.1104.desc.chaste: "The eagle circles on. My attendants ask if I mean to loose another arrow. I ask them to wait, as though patience could settle everything."
 latria_sexual_frustration_flavor.1104.desc: "The eagle will not return, and the hunters wait for my word."
 latria_sexual_frustration_flavor.1104.a: "Let the eagle circle"
 latria_sexual_frustration_flavor.1104.b: "Lower the bow and return to camp"

 latria_sexual_frustration_flavor.1105.t: "Candles and a Crown"
 latria_sexual_frustration_flavor.1105.desc.emperor: "My attendants remove the crown, while unfinished decrees remain beside the candles. The empire rests in my hands, yet I find myself thinking of something beyond affairs of state."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Only one lamp remains lit in camp. My companions sleep, but the unsent letter beside my pack keeps me awake."
 latria_sexual_frustration_flavor.1105.desc.clergy: "I fold my vestments beside the prayer stool. I remember every word of my vow, yet never has its burden felt so hard to bear."
 latria_sexual_frustration_flavor.1105.desc.ruler: "My attendants put away my formal clothes, and the petitions remain unfinished. I wonder whether my thoughts might quiet if I set my office aside for a moment."
 latria_sexual_frustration_flavor.1105.desc: "The candles burn low, but one thought keeps me awake."
 latria_sexual_frustration_flavor.1105.a: "Give the letter to a messenger"
 latria_sexual_frustration_flavor.1105.b: "Destroy it myself"

 latria_sexual_frustration_flavor.1106.t: "Restless by Candlelight"
 latria_sexual_frustration_flavor.1106.desc.female: "In my nightgown, I sit beside the bed as candlelight moves across the window. The hour is late, yet the longing that went unanswered has not left me."
 latria_sexual_frustration_flavor.1106.desc.male: "In my nightclothes, I sit beside the bed. The night watch has crossed the courtyard twice, and still my thoughts will not settle."
 latria_sexual_frustration_flavor.1106.desc: "The candle burns low, but sleep will not come beneath the canopy."
 latria_sexual_frustration_flavor.1106.a: "Yield to the longing"
 latria_sexual_frustration_flavor.1106.b: "Lie down and wait for dawn"


 latria_sexual_frustration_flavor.1107.t: "A Dance in Return"
 latria_sexual_frustration_flavor.1107.desc.accepted: "My partner asks for another dance, and the company treats it as courtesy. I remember the thought that crossed my mind when their hand lingered."
 latria_sexual_frustration_flavor.1107.desc.strict: "My partner asks for another dance, and several faces turn toward us. I accept politely, wary that rumor may travel farther than the music."
 latria_sexual_frustration_flavor.1107.desc: "The musicians begin another dance, but I do not rise."
 latria_sexual_frustration_flavor.1107.a: "Accept the invitation"
 latria_sexual_frustration_flavor.1107.b: "Remain in my seat"

 latria_sexual_frustration_flavor.1108.t: "Prayer Before Sleep"
 latria_sexual_frustration_flavor.1108.desc.favors: "In my nightgown, I pray beside the bed. My faith permits the pleasures of the flesh, yet that urgency within does not abate."
 latria_sexual_frustration_flavor.1108.desc.condemns: "In my nightgown, I kneel beside the bed and repeat my vow of chastity. With each line, the voice within grows harder to ignore."
 latria_sexual_frustration_flavor.1108.desc: "The candle beside the bed flickers. The prayer goes on."
 latria_sexual_frustration_flavor.1108.a: "Continue the prayer"
 latria_sexual_frustration_flavor.1108.b: "Rise and put out the candle"

 latria_sexual_frustration_flavor.1109.t: "An Unfinished Council"
 latria_sexual_frustration_flavor.1109.desc: "My councilors have offered several courses, but I have yet to choose among them. My thoughts wander from the matter at hand, and even my silence grows long."
 latria_sexual_frustration_flavor.1109.a: "End the council for today"
 latria_sexual_frustration_flavor.1109.b: "Ask the clerk to continue"
 latria_sexual_frustration_flavor.1110.t: "A Room After Midnight"
 latria_sexual_frustration_flavor.1110.desc.clergy: "In my nightgown, I return to my small room at the monastery. Night prayer is done and the candle is low, but I have not lain down."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Only a few lamps remain lit at the inn. In my nightgown, I sit at the bedside, still thinking of the letter I never sent."
 latria_sexual_frustration_flavor.1110.desc: "The sounds beyond the door fade. I remain beside the bed, waiting."
 latria_sexual_frustration_flavor.1110.a: "Open the chamber door"
 latria_sexual_frustration_flavor.1110.b: "Close it and return to bed"
