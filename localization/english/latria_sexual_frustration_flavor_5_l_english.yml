l_english:
 latria_sexual_frustration_flavor.1401.t: "A Sealed Signet"
 latria_sexual_frustration_flavor.1401.desc.female: "In my nightgown, I fold a letter over and over beside the bed. It bears no name, only a seal I have not yet dared to press."
 latria_sexual_frustration_flavor.1401.desc.male: "In my nightgown, I sit on the edge of the bed with a signet in hand. If I write those words, I can no longer pretend I never thought them."
 latria_sexual_frustration_flavor.1401.desc: "I lift the signet and set it down again, never touching it to the page."
 latria_sexual_frustration_flavor.1401.a: "Write the letter to its end and set my seal upon it."
 latria_sexual_frustration_flavor.1401.b: "Return the signet to its case and suppress the thought."

 latria_sexual_frustration_flavor.1402.t: "The Last Feast"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Before the feast ends, the guests still speak openly of lovers, betrothals, and old pleasures. I find that I can no longer treat their talk as idle chatter."
 latria_sexual_frustration_flavor.1402.desc.strict: "Someone names a noble who lost favor over an indiscreet romance, and the table falls quiet. I know the same judgment could be turned upon me."
 latria_sexual_frustration_flavor.1402.desc: "The tables are in disarray and the guests are leaving, but the thought within me grows louder."
 latria_sexual_frustration_flavor.1402.a: "Speak of my desire before the last guests."
 latria_sexual_frustration_flavor.1402.b: "Suppress the thought and leave at once."

 latria_sexual_frustration_flavor.1403.t: "A Confession Without Witnesses"
 latria_sexual_frustration_flavor.1403.desc.favors: "The altar stands empty. I remember that my faith permits carnal pleasure, yet I still do not know how to settle this urgency."
 latria_sexual_frustration_flavor.1403.desc.condemns: "I kneel alone before the altar, my clothes in order, but the prayer breaks at the same words each time. If no one hears me, have I still broken my vow?"
 latria_sexual_frustration_flavor.1403.desc: "The sanctuary is empty. I have not yet left it."
 latria_sexual_frustration_flavor.1403.a: "Swear no more vows of abstinence, and admit my choice."
 latria_sexual_frustration_flavor.1403.b: "Restrain my desire and kneel until morning prayer."

 latria_sexual_frustration_flavor.1404.t: "Name the Longing"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Unclothed and alone before the chamber mirror, I do not look away from my reflection. I am tired of calling desire a passing weakness."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Unclothed and alone at the bedside, I clasp my hands together. If I keep my vow, it will not be because this longing has vanished."
 latria_sexual_frustration_flavor.1404.desc: "The night is deep. At last, I stop hiding my desire from myself."
 latria_sexual_frustration_flavor.1404.a: "Admit my longing and cease to fight it tonight."
 latria_sexual_frustration_flavor.1404.b: "Dress once more and suppress the thought."

 latria_sexual_frustration_flavor.1405.t: "A Page in the Chronicle"
 latria_sexual_frustration_flavor.1405.desc.emperor: "The chronicler waits for me to decide what deserves remembrance. In formal robes behind him, I understand that silence will not make this torment disappear."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "The scribe sits at the table and asks whether this part of the journey belongs in the chronicle. I look at the unsent letter and know these words will travel with me."
 latria_sexual_frustration_flavor.1405.desc.clergy: "I put on my vestments and stand before the scribe. The vow and the desire are both true; I will not let another decide which deserves to be remembered."
 latria_sexual_frustration_flavor.1405.desc.ruler: "The clerk waits to record my words. In formal clothes, before my attendants, I speak of what I have kept buried."
 latria_sexual_frustration_flavor.1405.desc: "I decide to stop keeping this matter to myself."
 latria_sexual_frustration_flavor.1405.a: "Let the copies circulate for all to read."
 latria_sexual_frustration_flavor.1405.b: "Have the scribe record only my duties, and swallow the rest."

 latria_sexual_frustration_flavor.1406.t: "As the Guests Depart"
 latria_sexual_frustration_flavor.1406.desc.accepted: "The last guests speak of lovers and betrothals as though they were ordinary matters. I listen to their laughter and find it harder to keep my own thoughts hidden."
 latria_sexual_frustration_flavor.1406.desc.strict: "Word reaches the table of a noble who lost favor over an indiscreet romance, and the company falls silent. I know the silence is not for him alone."
 latria_sexual_frustration_flavor.1406.desc: "The guests are leaving and the cups remain, but the thought within me grows harder to master."
 latria_sexual_frustration_flavor.1406.a: "Remain and tell the last guests of my old affection."
 latria_sexual_frustration_flavor.1406.b: "Swallow the words and leave before the others."

 latria_sexual_frustration_flavor.1407.t: "Prayer After the Candle"
 latria_sexual_frustration_flavor.1407.desc.favors: "In my nightgown beside the bed, I recall that my faith does not deny the pleasures of the flesh. Alone, I still do not know how to settle myself."
 latria_sexual_frustration_flavor.1407.desc.condemns: "I draw my nightgown close and repeat my vow of chastity. The candle burns low, but the longing within does not fade."
 latria_sexual_frustration_flavor.1407.desc: "Only one dying candle remains in the chamber, and I am still awake."
 latria_sexual_frustration_flavor.1407.a: "Set aside the vow of chastity and dwell upon that affection."
 latria_sexual_frustration_flavor.1407.b: "Restrain my thoughts and recite until dawn."

 latria_sexual_frustration_flavor.1408.t: "Silent Before the Mirror"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Unclothed and alone before the mirror, I can no longer call this longing a passing thought. Nor do I wish to pretend otherwise."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Unclothed at the bedside, I clasp my hands. Chastity remains my choice, though never has that choice felt so difficult."
 latria_sexual_frustration_flavor.1408.desc: "In the quiet, I look at my reflection and stop avoiding what is in my heart."
 latria_sexual_frustration_flavor.1408.a: "Admit this desire and cease to flee it tonight."
 latria_sexual_frustration_flavor.1408.b: "Dress, sit at my desk, and suppress the thought."

 latria_sexual_frustration_flavor.1409.t: "A Failure of Composure at Court"
 latria_sexual_frustration_flavor.1409.desc: "During a recess in council, I undress in the adjoining chamber. Before I can put on my robe, the door to the council hall opens. The lords fall silent and the clerk lowers his eyes; my voice catches as the attendant stands by with the robe."
 latria_sexual_frustration_flavor.1409.a: "Stand before them and make no attempt to conceal my lapse."
 latria_sexual_frustration_flavor.1409.b: "Dismiss the lords and dress before resuming council."

 latria_sexual_frustration_flavor.1410.t: "Night Beyond the Door"
 latria_sexual_frustration_flavor.1410.desc.female: "In my nightgown, I sit beside the door and hear footsteps fade outside. In the late hour, the affection that found no answer returns to me."
 latria_sexual_frustration_flavor.1410.desc.male: "In my nightgown, I lean against the bed, my book still unopened. The passage is quiet, but sleep will not come."
 latria_sexual_frustration_flavor.1410.desc: "The night is long. Nothing stirs beyond the door, and my thoughts do not settle."
 latria_sexual_frustration_flavor.1410.a: "Put the book aside and write a long letter."
 latria_sexual_frustration_flavor.1410.b: "Suppress the thought, douse the lamp, and endure until dawn."

 latria_sexual_frustration_flavor.1401.c: "Make a poem of the invitation I cannot send."
 latria_sexual_frustration_flavor.1402.c: "Ask for one last tune and listen before I leave."
 latria_sexual_frustration_flavor.1402.d: "Have the guests stay and speak of their old travels."
 latria_sexual_frustration_flavor.1403.c: "Open the scripture and seek an answer in each passage."
 latria_sexual_frustration_flavor.1404.c: "Abandon my vow of chastity and follow my desires henceforth."
 latria_sexual_frustration_flavor.1404.d: "Put on my nightgown and sit until my thoughts settle."
 latria_sexual_frustration_flavor.1405.c: "Make a private letter of my account and seal it in a case."
 latria_sexual_frustration_flavor.1405.d: "Swear a vow of chastity before these witnesses."
 latria_sexual_frustration_flavor.1406.c: "Recite a new poem for the departing guests."
 latria_sexual_frustration_flavor.1407.c: "Close the prayer book and consider my feelings slowly."
 latria_sexual_frustration_flavor.1408.c: "List the morning's duties and put every paper in order."
 latria_sexual_frustration_flavor.1409.c: "Dress, return to the table, and settle each matter of court."
 latria_sexual_frustration_flavor.1409.d: "Dress, make a jest, and invite the lords to sit again."
 latria_sexual_frustration_flavor.1410.c: "Put on a robe, brew tea, and sit until I can sleep."
