l_english:
 latria_sexual_frustration_flavor.1401.t: "A Sealed Signet"
 latria_sexual_frustration_flavor.1401.desc.female: "I sit beside the bed in my nightgown, folding and unfolding a letter. There is no signature, and I have crossed out the greeting, but I cannot smooth away the deep creases. Warm sealing wax waits on the corner of the table. One impression of my signet would be enough to send tonight's thoughts into another person's keeping.\n\nI open the letter again and stop at the line proposing a meeting. I have specified the hour, the place, even which door to use. By daylight I could still call these notes an idle fancy. With a messenger waiting in the passage, I can find no excuse that sounds convincing.\n\nCloth rustles beyond the door. I take up the signet, keeping my other hand over the open letter, and do not call anyone in."
 latria_sexual_frustration_flavor.1401.desc.male: "I sit on the edge of the bed in my nightgown, holding my signet. The letter on the desk has reached its final line. The ink is dry, but the space for my name remains empty. A servant prepared the sealing wax and closed the window before leaving, without asking why I had not retired.\n\nI know every sentence in the letter, and how its intended reader will understand them. If I add my name and seal it, I can no longer dismiss the invitation as a moment's jest. I have revised these words countless times in my thoughts. Written down, they offer me nowhere to evade what I mean.\n\nI have been holding the signet for a long while. I turn it the right way up and look toward the light beneath the door, but still do not summon the messenger."
 latria_sexual_frustration_flavor.1401.desc: "I lift the signet and set it down again, without bringing it to the letter. The paper is neatly folded, the wax is ready, and there is nothing else at the desk that needs my attention. I smooth a corner once more, as though some neglected crease might still justify a delay.\n\nThe words are already written. In the morning, the messenger will ask where to take the letter, not decide for me whether it should go. I read the address twice. I imagine receiving an answer, then imagine receiving none at all.\n\nThe wax in the spoon is beginning to set. I move it closer to the lamp, while my free hand presses the letter back against the desk."
 latria_sexual_frustration_flavor.1401.a: "Write the letter to its end and set my seal upon it."
 latria_sexual_frustration_flavor.1401.b: "Put the signet away, suppress the longing, and lie down."

 latria_sexual_frustration_flavor.1402.t: "The Last Feast"
 latria_sexual_frustration_flavor.1402.desc.accepted: "The feast is nearly over, but the guests are still talking of lovers, betrothals, and old pleasures. Someone fastens a cloak while turning back to add the end of a story. The listeners laugh and ask the servants for more wine. No one here needs to lower a voice for such talk.\n\nI have already risen when a familiar place is mentioned, and I sit down again. I have memories of that place too, though I have never spoken of them so lightly. I venture a remark. My neighbor sets down a cup and waits for me to continue, and suddenly I have more to say than I can keep to myself.\n\nThe musicians are putting away their instruments. The host glances toward the hall door, but I have yet to take my outer robe from the back of the chair."
 latria_sexual_frustration_flavor.1402.desc.strict: "Someone at the feast mentions a noble brought low by a secret romance. The wine jug stops halfway around the table. One guest asks after his family; another murmurs that a proposed marriage will surely be abandoned. I sit at the far end, listening as they settle the details of another person's life.\n\nMy name has not been mentioned. Yet when my neighbor asks why I am so quiet, I cannot even manage an ordinary smile. I had meant to let the wine lend me courage enough to speak of my own troubles. Now I fear that, once I begin, I will be unable to take any of it back.\n\nA servant comes to collect my empty plate. I move my hand aside, but keep hold of my cup, leaving the last mouthful of wine undrunk."
 latria_sexual_frustration_flavor.1402.desc: "Only when I see the servants clearing cups and plates do I notice that the feast is ending. Several guests are making their farewells by the door, and the host is asking after their carriages and horses. My cup is still more than half full. I have found no suitable opening for what I want to say.\n\nMy neighbor straightens a cloak and asks whether I am coming too. I answer, then bring up an old story. I have already told its beginning, but I start there again, hoping that if I get this sentence right, the evening need not end just yet.\n\nMy neighbor's hand pauses at the clasp. I push my cup aside; the echoes in the hall are much clearer than they were before."
 latria_sexual_frustration_flavor.1402.a: "Keep the last guests at the table and tell my troubles over and over."
 latria_sexual_frustration_flavor.1402.b: "Suppress the thought, thank my hosts, and take my leave."

 latria_sexual_frustration_flavor.1403.t: "A Confession Without Witnesses"
 latria_sexual_frustration_flavor.1403.desc.favors: "I remain alone before the altar, listening as the last attendant gently closes the door. The scripture is still open on its stand, with a ribbon marking the passage about the pleasures of the flesh. I have read these teachings. I know that my faith does not require me to call this longing a sin.\n\nYet without anyone beside me, I do not know how to begin. The questions I prepared during the day sound carefully considered, and neatly avoid the person I have been wanting to see. I repeat one of them, then stop. Quietly, I speak the name I had concealed behind a polite form of address.\n\nNo answer comes from the empty hall. I take my hand from the scripture and remain kneeling, watching the light beneath the door grow dim."
 latria_sexual_frustration_flavor.1403.desc.condemns: "I kneel alone before the altar, my clothes neatly arranged, though the prayer keeps breaking off at the same words. The last attendant asked whether I wanted a lamp left burning. I nodded, and now there is only that lamp and a scripture I have yet to finish reading.\n\nI remember every precept. I learned long ago how I ought to confess my failings. Yet whenever I reach the renunciation of desire, I think of the letter I have not destroyed. I have not forgotten where it lies; before leaving my room, I carefully hid it between pages no one else would turn.\n\nWith no one urging me on, I find the next line harder to finish. Footsteps outside mark a change of watch. I bow my head and begin again."
 latria_sexual_frustration_flavor.1403.desc: "I wait until the last footsteps in the hall have faded, but remain before the altar. The benches have been straightened, a ribbon hangs from the scripture stand, and an empty cup forgotten by an attendant sits near the door. While others were here, I felt unable to say what I had come to say.\n\nNow that I am alone, I try to tell the whole matter from the beginning. Halfway through, I hear myself taking refuge in the same familiar phrases. I stop, glance toward the door, and quietly begin once more. This time I do not leave out the person's name.\n\nThe lamplight falls before my knees. I stay where I am, listening as the last words die away in the empty hall."
 latria_sexual_frustration_flavor.1403.a: "Swear no more vows of abstinence, and admit my choice."
 latria_sexual_frustration_flavor.1403.b: "Restrain my desire and kneel until morning prayer."

 latria_sexual_frustration_flavor.1404.t: "Name the Longing"
 latria_sexual_frustration_flavor.1404.desc.lustful: "I stand unclothed before the bronze mirror in my chamber. My outer robe hangs over the chair, the servants have withdrawn, and I have bolted the door myself. I meet my reflection's gaze and, at last, stop looking for some trivial task to occupy my thoughts.\n\nThese past days, I have called my wish to see that person weariness, boredom, or a sleepless night after a feast. Each new excuse has added another line to the letter on my desk, but I have never sent it. I know what I am waiting for. I am tired of rising in the morning only to strike out the words I wrote the night before.\n\nA fresh sheet lies on the table. I look toward it and, for the first time, consider whether I need those courteous greetings at all."
 latria_sexual_frustration_flavor.1404.desc.chaste: "I sit alone and unclothed on the edge of the bed, my hands clasped together. My clothes lie nearby, and I have not put away the prayer book. I meant to read a familiar passage and retire, but I have lingered over one line so long that I have lost count of the watch calls outside.\n\nIf I still keep my vow, it is not because I have ceased to long for someone's company. The moment that name comes to mind, I know I cannot dismiss the matter with a claim that my thoughts are untroubled. I turn to the page bearing my vow and read more slowly than usual, considering whether I still choose each promise for myself.\n\nI hold the page without turning it. The passage outside is silent. I neither close the book nor hurry through the words I have yet to finish."
 latria_sexual_frustration_flavor.1404.desc: "The night is far advanced. Sitting in my chamber, I finally admit that I still want to see that person. I have revised the letter on my desk several times. Each time, I remove the one sentence that matters most and leave the weather, my travels, and harmless greetings.\n\nI spread the drafts before me, looking at their almost identical beginnings. They are perfectly courteous. Whoever receives them will never know why I am so reluctant to put out the lamp. If I write another tonight, I cannot simply alter the greeting and pretend I have said anything more.\n\nI lay the pen beside a blank sheet. The watch calls again outside; this time I do not use it as a reason to make myself retire."
 latria_sexual_frustration_flavor.1404.a: "Admit my longing and cease to fight it tonight."
 latria_sexual_frustration_flavor.1404.b: "Dress once more and suppress the thought."

 latria_sexual_frustration_flavor.1405.t: "A Page in the Chronicle"
 latria_sexual_frustration_flavor.1405.desc.emperor: "The chronicler bends over the table, waiting for me to decide what deserves to be recorded. I stand behind him in formal robes. The account of grants and levies I have just dictated is still wet on the page. I begin to describe tomorrow's ceremonies, then stop and speak instead of the long nights no one has recorded.\n\nHis pen does not immediately follow. An attendant shifts position by the door; I know they have all heard me. I once thought that, so long as I continued receiving the lords each day, I could keep this distress within my chamber. When the chronicler asks whether he should write it down, I cannot give the easy dismissal I had expected.\n\nA fresh page lies ready. The pen waits above it, and everyone is listening for me to finish the sentence."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "The scribe sits at the table and asks whether I want this part of the journey in the chronicle. I name the crossings, lodgings, and delays. He records each one, then looks up for the next place. The unsent letter in my pack is visible beside my hand.\n\nRain and broken axles do not account for every halt. I made one detour only to see someone again, without ever telling my companions why. Now the journey lies neatly recorded before me. As I read through the place names, I find myself returning to the reason I have left out.\n\nThe scribe dips his pen. I draw out the letter without unfolding it and smooth one corner beside the map."
 latria_sexual_frustration_flavor.1405.desc.clergy: "I put my robes in order and approach the scribe. He had prepared to record donations and repairs, but takes a fresh sheet when he hears me change the subject. The scripture beside him is still open at the passage I explained to others earlier in the day.\n\nMy vow is sincere, and so is my desire. I will not describe myself as someone who has never hesitated. I also know that, once these words are written, they will no longer be mine alone to recall. The scribe quietly asks whether he should retain the person's name, taking care that no one outside can hear.\n\nI look at the space he has left on the page. The prayer beads are still around my wrist. I leave them alone and face his question."
 latria_sexual_frustration_flavor.1405.desc.ruler: "The clerk waits to take down my words. I am in formal clothes, with the seal from council still beside me. After finishing the public business, I begin to speak of a private matter I have kept to myself for a long time. The attendants by the door have not withdrawn, and the room suddenly grows quiet.\n\nI begin with an old letter, then describe several meetings that never took place. The clerk writes more slowly now, looking up whenever I leave something unclear. I had meant to let him find respectable phrases for me. Yet when I hear my words repeated, I am unwilling to have them turned into an account of something else.\n\nHe offers me the half page he has copied. I take it, and my gaze stops at the first name I have made no attempt to conceal."
 latria_sexual_frustration_flavor.1405.desc: "I approach the scribe's desk, determined to explain what I have kept to myself for so long. He moves the official papers aside, lays out a fresh page, and asks where to begin. I give him a date, then stop. That was not when the matter truly began.\n\nI start again with a letter, a brief meeting, and the sleepless nights that followed. The pen makes little sound, but soon another person will be able to read these words from beginning to end. The scribe offers no judgment. When I become vague, he simply waits and leaves a little space.\n\nThe finished account lies between us. He is waiting for my instructions before letting anyone else see it."
 latria_sexual_frustration_flavor.1405.a: "Let the copies circulate for all to read."
 latria_sexual_frustration_flavor.1405.b: "Have the scribe record only my duties, and swallow the rest."

 latria_sexual_frustration_flavor.1406.t: "As the Guests Depart"
 latria_sexual_frustration_flavor.1406.desc.accepted: "The last guests are still talking of lovers and betrothals. I have barely begun a story of my own when someone at the edge of the table chuckles. The guest holds up a cup, sees nothing discourteous in the laughter, and cheerfully urges me to tell what happened next.\n\nI have kept this memory to myself for so long that I falter when it becomes entertainment over wine. My neighbor supplies a guess; someone else makes a jest of the words in the letter. I try to correct them, but find myself speaking faster and faster. Details I never meant to mention are already on the tip of my tongue.\n\nA servant comes for the last wine jug. I keep my hand on the rim of my cup and hear someone draw a chair closer, waiting for the rest."
 latria_sexual_frustration_flavor.1406.desc.strict: "News of a noble's disgrace over a secret romance reaches the table before I have finished my own story. My neighbor suddenly murmurs a question. Another guest looks at me and laughs once. Someone who was nodding a moment ago is now occupied with folding a napkin.\n\nI know I should stop, but I cannot bear to let the silence finish my account for me. The harder I try to make clear that I have no connection to the scandal, the more my earlier words seem to require an explanation. Guests are already taking their leave by the door. None of those who remain asks me to continue.\n\nI set my cup down a little too heavily. Those eyes are still on me, and I must decide whom to address with my next words."
 latria_sexual_frustration_flavor.1406.desc: "The guests are leaving, but I have yet to stop talking. When I reach the part about an old letter, my neighbors exchange a glance and someone chuckles. I pause. Only then do I notice that the people before me have put down their utensils and are listening to me alone.\n\nI mean to explain why those words mattered, but find myself telling the story a second time. One guest nods politely, another looks toward the door, and a third hides a smile behind a cup. I see each response and grow more impatient, convinced that one more sentence will make them understand.\n\nThe host has risen. The chair opposite me has not moved, and I can hear farewells being exchanged behind my back."
 latria_sexual_frustration_flavor.1406.a: "Keep telling my story, and answer anyone who mocks me before the whole table."
 latria_sexual_frustration_flavor.1406.b: "Hold my tongue, bow to the company, and bid them farewell."

 latria_sexual_frustration_flavor.1407.t: "Prayer After the Candle"
 latria_sexual_frustration_flavor.1407.desc.favors: "I sit beside the bed in my nightgown and turn to the passage in my prayer book that speaks of the pleasures of the flesh. These teachings seemed ordinary enough by daylight. Now I read them several times. The door is bolted, everyone outside has dispersed, and only a little oil remains in the lamp.\n\nMy faith does not ask me to deny my longing, yet I still do not know what to do with an affection that has met no answer. I try saying aloud the words I want to write. Once I remove the courtesies and greetings, so little remains that I fall silent for a long time.\n\nThe flame sinks lower. I mark the page with its ribbon, but do not immediately close the book or seek an answer in another passage."
 latria_sexual_frustration_flavor.1407.desc.condemns: "I draw my nightgown close and quietly repeat my vow of chastity. The wick has burned short, and the words in the prayer book are growing difficult to make out. I keep reading. Whenever I make a mistake, I return to the beginning, as though an exact recitation could carry me safely through the night.\n\nHalfway through, I remember what that person said during the day. I have not forgotten my vow. Neither have I forgotten why I was so reluctant to say farewell. When I consider both together, the familiar answers no longer satisfy me.\n\nAs the lamp threatens to go out, I shelter the flame with my hand. The next line is right before me. I look at it for a long time without speaking."
 latria_sexual_frustration_flavor.1407.desc: "Only one dying lamp remains in the chamber, and I am still awake. The prayer book rests on my lap, open at a page I have read several times. A watchman passes outside. His footsteps disappear around the corner, but I keep waiting for the next one.\n\nI move the book closer to the light, looking for the place where I stopped. There are no difficult words in that line. I know why I cannot finish it: each time I reach the end, I remember a question I should have settled during the day. There is no one here to answer it now. I still keep imagining what they might have said.\n\nThe last oil glints at the bottom of the lamp. I place the ribbon between the pages and leave my hand on the cover, without putting out the light."
 latria_sexual_frustration_flavor.1407.a: "Set aside the vow of chastity and dwell upon that affection."
 latria_sexual_frustration_flavor.1407.b: "Restrain my thoughts and recite until dawn."

 latria_sexual_frustration_flavor.1408.t: "Silent Before the Mirror"
 latria_sexual_frustration_flavor.1408.desc.lustful: "I stand unclothed and alone before the mirror. The clothes I wore during the day lie beside the bed, and half a page of invitation waits on the table. How often I have stood here arranging my appearance and preparing what to say to that person. Whenever we actually meet, I speak only of ordinary things.\n\nI have done this often enough. I no longer wish to describe a lasting desire as an idle thought, or wait at every meeting for someone else to speak first. The unfinished letter lies beside the mirror. There is still room at the end for one sentence that says plainly what I mean.\n\nI turn toward the desk and the dried ink on the pen. No one outside is hurrying me, and this time I have no public business to offer in place of an answer."
 latria_sexual_frustration_flavor.1408.desc.chaste: "I sit unclothed on the edge of the bed, clasping my hands. My clothes are neatly folded beside the mirror, with the prayer book on top. I have finished the chapter I meant to read, yet the usual calm has not followed. The quieter the room becomes, the harder I find it to set that affection aside.\n\nChastity remains my choice. I will no longer speak of keeping it as though it were easy, or as though reading the scripture had left me with no other thoughts. I arrange tomorrow's duties in my mind. When I reach the hour at which I will see that person, I stop and begin arranging them again.\n\nMy reflection has been sitting there all the while. I unclasp my hands and look toward the pen, wanting to record my uncertainty honestly."
 latria_sexual_frustration_flavor.1408.desc: "In the quiet, I look at my reflection. The unfinished letter is still spread across the desk, but I no longer need the smile I used to conceal my thoughts during the day. I return to the edge of the bed and recall that brief meeting from the beginning.\n\nNothing that was said amounted to a promise. No one asked me to go on waiting. I am finally willing to consider each meaning I have since given those words: how much came from the other person, and how much I supplied myself. Making that distinction has not immediately diminished my longing.\n\nI move the paper closer to the lamp. At least the next unwritten line should make my own wishes clear."
 latria_sexual_frustration_flavor.1408.a: "Admit this desire and cease to flee it tonight."
 latria_sexual_frustration_flavor.1408.b: "Dress, sit at my desk, and suppress the thought."

 latria_sexual_frustration_flavor.1409.t: "A Failure of Composure at Court"
 latria_sexual_frustration_flavor.1409.desc: "During a recess in council, I remove my clothes in the adjoining chamber, hoping that a moment alone will settle my thoughts. My outer robe is still in the attendant's hands when the door to the council hall opens. I look up at the sound. Conversation at the long table has stopped, and several lords remain halfway through turning toward me.\n\nThe clerk lowers his gaze and draws his unfinished page closer. Those beside the door seem ready to retreat, but hesitate to block the attendant carrying my robe. No one moves first. I ought to give an order at once, yet my voice catches, and I cannot put the instructions I had prepared into a complete sentence.\n\nAt last the attendant brings the robe within reach. The unresolved business is still spread across the table. Everyone is waiting for me to decide what happens next."
 latria_sexual_frustration_flavor.1409.a: "Stand before them and make no attempt to conceal my lapse."
 latria_sexual_frustration_flavor.1409.b: "Dismiss the lords and dress before resuming council."

 latria_sexual_frustration_flavor.1410.t: "Night Beyond the Door"
 latria_sexual_frustration_flavor.1410.desc.female: "I sit beside the door in my nightgown, listening to the footsteps outside fade away. Someone returns a key in the passage and quietly bids another good night. I could have called one of them back and asked him to carry a letter in the morning. I let the last voices disappear without speaking.\n\nOnce again, I think of the affection that has received no answer. The draft on my desk says too much about things that do not matter, and nothing clearly about the reply I hope for. I take the paper onto my lap and read from the beginning. At last I strike out the ordinary greeting that even I do not believe.\n\nThe passage is utterly silent. I move my pen toward the empty space. Before I write, I already know that this letter will take longer than the others."
 latria_sexual_frustration_flavor.1410.desc.male: "I lean against the head of the bed in my nightgown, with a book beside me that I have not begun to read. The passage has fallen quiet. Lamplight rests on the same words while I think of the conversation that ended too soon during the day. As we parted, I said we would speak another time. The answer was just as courteous.\n\nI have promised another time too often. At each farewell I imagine that I will speak plainly at our next meeting. Once alone, I can only wonder whether that polite reply meant anything more. I move the bookmark forward, then notice that I cannot remember what was on the previous page.\n\nPaper and a pen wait by the desk. I close the book, leave it on my lap, and look toward the gap beneath the door, where the light has gone out."
 latria_sexual_frustration_flavor.1410.desc: "The long night is not over. I sit behind my closed door and listen to the last distant footsteps recede. My letter is unfinished, and the book beside the bed lies open. Both of the things I chose to pass the time have been abandoned halfway through.\n\nI read aloud the few lines I have written. The sentences are plain enough, but each leaves room for doubt. By the end, it is still unclear what answer I want from that person. If I continue in this fashion and send the letter tomorrow, I will only have given myself another reason to wait.\n\nI take a fresh sheet and hold it in place beneath the book. There is still enough lamplight to see where I should begin the first line."
 latria_sexual_frustration_flavor.1410.a: "Put the book aside and write a long letter."
 latria_sexual_frustration_flavor.1410.b: "Suppress the longing, douse the lamp, and lie down."

 latria_sexual_frustration_flavor.1401.c: "Make a poem of the invitation I cannot send."
 latria_sexual_frustration_flavor.1402.c: "Pay the musicians to play for the remaining guests."
 latria_sexual_frustration_flavor.1402.d: "Have the guests stay and speak of their old travels."
 latria_sexual_frustration_flavor.1403.c: "Open the scripture and seek an answer in each passage."
 latria_sexual_frustration_flavor.1404.c: "Abandon my vow of chastity and follow my desires henceforth."
 latria_sexual_frustration_flavor.1404.d: "Put on my nightgown and sit until my thoughts settle."
 latria_sexual_frustration_flavor.1405.c: "Make a private letter of my account and seal it in a case."
 latria_sexual_frustration_flavor.1405.d: "Swear a vow of chastity before these witnesses."
 latria_sexual_frustration_flavor.1406.c: "Recite a new poem for the departing guests."
 latria_sexual_frustration_flavor.1407.c: "Close the prayer book and consider my feelings slowly."
 latria_sexual_frustration_flavor.1408.c: "List the morning's duties and put every paper in order."
 latria_sexual_frustration_flavor.1409.c: "Dress, return to the table, and settle each matter of court."
 latria_sexual_frustration_flavor.1409.d: "Dress, make a jest, and invite the lords to sit again."
 latria_sexual_frustration_flavor.1410.c: "Put on a robe, brew tea, and sit until I can sleep."
