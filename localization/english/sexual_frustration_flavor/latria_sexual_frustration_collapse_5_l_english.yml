l_english:
 latria_collapse_no_relief_tt: "Sexual frustration has not eased."

 latria_sexual_frustration_flavor.1501.t: "The Lamp Still Burns"
 latria_sexual_frustration_flavor.1501.desc.dead: "The dagger slips from my hand, and the sound of it striking the floor stops the footsteps outside the door. The door opens; someone crouches beside me, calling my name, then turns to send for help. The lamp is still in its place, but I cannot make out the face before me.\n\nI want them to know I can hear; my lips move, but no sound comes out. Of all the words I kept rehearsing while I was alone, I can no longer remember a single whole sentence. Someone takes my hand and asks whether I can open my eyes; I can only stare at the doorway beyond.\n\nMore footsteps hurry into the room. I try to turn toward the sound, but the figures by the door have already blurred, and at last I can no longer distinguish even the lamplight."
 latria_sexual_frustration_flavor.1501.desc.survived: "When I wake, my nightclothes have been changed and my wounds carefully dressed. The person at my bedside sees me open my eyes and immediately calls back the attendant who is about to leave. I am told someone heard the disturbance and opened the door in time; the dagger has now been taken away.\n\nI try to push myself upright, but pain stops me before I can leave the pillow. The person beside me tucks in the blanket and asks whether I want water; I nod, but my gaze returns to the unsent letter on the desk. The sheets are still stacked there, the topmost showing a salutation revised many times.\n\nA cup is brought to my lips, and I take only a single sip. The person keeping watch stays by my bed, waiting until I am settled before gently setting the cup down."
 latria_sexual_frustration_flavor.1501.desc.severe: "As I regain consciousness, the first thing I hear is a hushed conversation beside the bed. Someone asks whether wounds like these can heal; after a pause, the answer is a request for more clean cloth. I try to turn and see who is there, but the slightest movement leaves me in too much pain to speak.\n\nThe dagger is no longer within reach; even the small bedside table has been moved away. I ask for help sitting up, but the person beside me merely raises the pillow and urges me to stay lying down for now. The light beyond the window has changed, yet I still think of those restless nights and the reply that never came.\n\nA hand reaches over to straighten the bedding. I try to ask for a gentler touch, but before I can finish, I am clutching the sheet beneath me."
 latria_sexual_frustration_flavor.1501.a.dead: "Everything is… growing dark…"
 latria_sexual_frustration_flavor.1501.a.survived: "It hurts…"
 latria_sexual_frustration_flavor.1501.a.severe: "Don't touch me… it hurts…"

 latria_sexual_frustration_flavor.1502.t: "An Empty Cup"
 latria_sexual_frustration_flavor.1502.desc.dead: "The cup is empty; slumped beside the bed, I hear the door being pushed open. The newcomer calls my name, then sees what is on the table and turns to shout for help, without even stopping to close the door. Someone starts running down the passage, and the draught entering the room stirs the unfinished letter.\n\nI still remember leaving the last sentence half written, with the pen beside the page. Someone steadies my shoulders, asks what I drank, and tells me to hold on a little longer. I look toward the table, wanting to finish what I had left unsaid, but my hand cannot even reach the corner of paper hanging before my eyes.\n\nThe person beside me keeps calling, but the voice grows steadily more distant. I can no longer make out the writing on the letter, nor give even a single answer."
 latria_sexual_frustration_flavor.1502.desc.survived: "The poison I drank did not kill me. When I wake, a basin of fresh water has been brought into the room. Someone has been keeping a long vigil beside the bed; seeing my eyes open, they rise to call the others, then turn back to ask whether I still recognize the room.\n\nThe cup has been cleared from the table, and the unfinished letter lies beneath a book. I try to reach for it, only to find that even moving toward the edge of the bed takes an effort. The person keeping watch brings me water, waits until I finish drinking, then asks who should receive the letter; I stare at the half-line showing beneath the book and say nothing.\n\nOutside the window, people are already beginning to stir. I think of what I would usually be doing at this hour, but can only rest against the pillow and listen as attendants turn visitors away outside the door."
 latria_sexual_frustration_flavor.1502.desc.severe: "The poison did not take my life, but I still cannot rise without help as I once could. Someone brings breakfast and leaves fresh clothes beside the bed; when I reach out, I discover I cannot even hold my familiar bowl steady.\n\nAn attendant straightens my cuffs and feeds me a mouthful at a time. I try to ask how long I have been lying here, but must stop halfway through to rest. Several new letters have gathered on the desk; when the attendant offers to read them aloud, I first ask whether that familiar name appears among them.\n\nThe attendant looks through them one by one and gives a slight shake of the head. I stare at the letters and lift my hand to push the bowl a little farther away, but even that must wait for someone to bend down and help."
 latria_sexual_frustration_flavor.1502.a.dead: "I… cannot speak…"
 latria_sexual_frustration_flavor.1502.a.survived: "So sick… some water…"
 latria_sexual_frustration_flavor.1502.a.severe: "I cannot even lift my hand…"

 latria_sexual_frustration_flavor.1503.t: "On the Riverbank"
 latria_sexual_frustration_flavor.1503.desc.dead: "I can no longer see the riverbank; all I hear is someone calling in the distance. A moment ago I could make out my name, but now there are only broken sounds. I try to look that way, but the wavering light before my eyes keeps me from recognizing the trees on the bank.\n\nWhen I left my lodgings, I think the lamp was still burning and the book still lay open on the desk. I lingered over the same page for so long, yet left without setting the bookmark ribbon in place. Someone will come to tidy the room and ask where I have gone; I picture that familiar face and want to say that I am here.\n\nAnother call reaches me, but I cannot answer. The light before my eyes fades, and even the memory of that room with its lamp still burning grows indistinct."
 latria_sexual_frustration_flavor.1503.desc.survived: "I am pulled from the river; when I wake, I am curled up on the bank while someone wraps a cloak around me. The person beside me sees my eyes open, hurriedly beckons to someone farther away, then crouches down to ask whether I can hear clearly. River water still drips from my clothes, and I am too cold to answer.\n\nSomeone says a stretcher has been sent for and urges me not to try standing yet. I look toward the path back to my lodgings and remember the words I kept turning over during my solitary walk here. Asked whom to notify, I give a name, then repeat it softly for fear it was not heard.\n\nThe cloak is drawn snugly around me again. Someone promises to carry my message; the person who stays steadies my shoulder and waits with me for footsteps on the path."
 latria_sexual_frustration_flavor.1503.desc.severe: "Of being carried onto the riverbank, I remember only a voice urging everyone to hurry back. When I next wake, my wet clothes have been changed and several people are gathered around the bed. I try to ask how long I have been unconscious, but a fit of coughing stops me before I can even finish addressing anyone.\n\nAt my bedside, they speak quietly of an illness of the lungs and ask someone to close the window. The cloth on my forehead has been changed several times, yet I still cannot tell whether it is day or night. In moments of clarity I still watch the door, waiting for someone familiar to come in; instead, it is only an attendant bringing water and quietly asking what I need.\n\nI shake my head and try to settle upright against the pillow. Just as the person beside the bed reaches to help, coughing once again cuts off the words I have yet to speak."
 latria_sexual_frustration_flavor.1503.a.dead: "So cold…"
 latria_sexual_frustration_flavor.1503.a.survived: "I'm still… alive?"
 latria_sexual_frustration_flavor.1503.a.severe: "I… cannot catch my breath…"

 latria_sexual_frustration_flavor.1504.t: "Beneath the Cliff"
 latria_sexual_frustration_flavor.1504.desc.dead: "I lie below the cliff, listening to the search party calling along the mountain path. One voice calls my name, another urges the others to search farther down, and loose stones roll past nearby. I try to raise a hand to be seen, but it stays at my side without so much as stirring the edge of my clothes.\n\nThe mountain blocks most of the sky, and I cannot remember how long it has been since I left my lodgings. On my way out, someone asked when I would return; I named an hour without thinking, but now I cannot remember my answer. The footsteps draw closer; I open my mouth, but still no sound emerges.\n\nAt last someone stops nearby and bends down to call to me. I cannot make out the face before me, nor even the patch of sky still visible overhead."
 latria_sexual_frustration_flavor.1504.desc.survived: "I wake below the cliff to find someone crouching beside me, calling my name. At my response, the person turns and beckons the others to come down along the mountain path. I am about to ask where I am when I recognize the cliff face above, and dare not look at it again.\n\nThe injuries from the fall keep me from rising; even a slight movement makes me stop to catch my breath. The person beside me tells me to wait for the stretcher, picks up my outer garment from nearby, and lays it over me. I look at the fastening, remembering how I straightened it in the mirror before leaving, already preoccupied with that unanswered invitation.\n\nThe footsteps reach me, and several people quietly discuss how to lift me. I try to turn to help them, but cry out before I have even moved."
 latria_sexual_frustration_flavor.1504.desc.severe: "I wake below the cliff with people gathered around me, but no one speaks first. I recognize one of them and ask whether it is time to go back. The person draws my outer garment over me, looks toward the mountain path, and urges those carrying the stretcher to hurry.\n\nI try to rise, but someone catches hold of me and urges me not to move. I look down at my legs; hesitantly, the person beside me says I may never walk as I did before. The shoe lying nearby is still muddy; looking at it, I remember the nights spent in the passage waiting for a reply.\n\nSomeone asks if there is anything else I need. I mean to ask for my shoe, but instead ask whether any news has reached my lodgings; for a moment, no one answers."
 latria_sexual_frustration_flavor.1504.a.dead: "I cannot hear anything…"
 latria_sexual_frustration_flavor.1504.a.survived: "I cannot move… it hurts…"
 latria_sexual_frustration_flavor.1504.a.severe: "My legs…"

 latria_sexual_frustration_flavor.1505.t: "The Door Forced Open"
 latria_sexual_frustration_flavor.1505.desc.dead: "As the bedchamber door is forced open, I hear someone urgently calling my name. Light from the passage spills into the room; several people crowd the doorway, then are urged to fetch help by the person in front. The letter is still beside the bed; I want to draw attention to it, but can no longer turn my gaze that way.\n\nSomeone comes closer, and the voice is so familiar that I want to answer. I understand every word, but cannot speak; all I can do is watch the mouth before me moving without pause. Someone asks a question from outside, but the person leaning over me does not turn, still waiting for the smallest response.\n\nI try to make out that face once more, but everything before me grows darker. The light in the doorway vanishes, and then I can no longer hear the calls either."
 latria_sexual_frustration_flavor.1505.desc.survived: "The bedchamber door was forced open, and help reached me in time. From my bed I can see the bent door bolt; an attendant has brought a chair to keep watch outside. Someone adjusts my pillow and asks whether I can speak; I manage only a hoarse reply.\n\nThe rope is gone, and the letter that lay beside the bed has been moved as well. I try to turn over to look for it, but my injuries stop me halfway. The person tending me follows my gaze and brings the letter where I can see it; the unfinished name at its end still holds my eyes.\n\nI raise a hand to ask for no questions yet. The person nods, sets the water within reach, and waits until I have recovered a little before tucking in the blanket."
 latria_sexual_frustration_flavor.1505.desc.severe: "Someone at the bedside calls my name; I know an answer is expected, but cannot work out what I should say. The furnishings in the bedchamber all seem familiar, though the chair by the window appears to have moved. I stare at it until someone gently straightens my sleeve.\n\nSomeone washes and changes me, then brings food. I watch the spoon coming closer, and only remember to open my mouth when the person beside me prompts me. Someone mentions the letter, and another person glances at the chest beside the bed. I look that way too, but just as I am about to ask, I forget what the question was.\n\nThe lid of the chest is already closed. The person at my bedside calls my name again; this time I turn my head and see the hands before me fall still."
 latria_sexual_frustration_flavor.1505.a.dead: "I…"
 latria_sexual_frustration_flavor.1505.a.survived: "Let me… catch my breath…"
 latria_sexual_frustration_flavor.1505.a.severe: "Is someone… calling me?"
