l_english:
 latria_collapse_no_relief_tt: "Sexual frustration has not eased."

 latria_sexual_frustration_flavor.1501.t: "The Lamp Still Burns"
 latria_sexual_frustration_flavor.1501.desc.dead: "I can no longer make out the footsteps outside. The dagger slips from my hand. Someone opens the door and calls my name over and over. I try to answer, but everything grows dim until I can no longer see the lamp."
 latria_sexual_frustration_flavor.1501.desc.survived: "The dagger did not end my life. Someone heard the disturbance and rushed in to save me. I lie in bed in my nightclothes, my wounds dressed, with the same unfulfilled longing still troubling me."
 latria_sexual_frustration_flavor.1501.desc.severe: "When I regain consciousness, the dagger is gone. Someone sits beside the bed, speaking quietly about the severity of my wounds. I cannot even sit up, yet the torment that brought me here has not eased."
 latria_sexual_frustration_flavor.1501.a.dead: "Everything is… growing dark…"
 latria_sexual_frustration_flavor.1501.a.survived: "It hurts…"
 latria_sexual_frustration_flavor.1501.a.severe: "Don't touch me… it hurts…"

 latria_sexual_frustration_flavor.1502.t: "An Empty Cup"
 latria_sexual_frustration_flavor.1502.desc.dead: "The cup is empty. From beside the bed, I hear someone enter and call urgently for help. My letter is still unfinished, but I can no longer hold the pen. The voices fade until I hear nothing at all."
 latria_sexual_frustration_flavor.1502.desc.survived: "The poison I drank did not kill me. After being found and treated, I still lie in my bedchamber, too sick to rise. The cup has been taken away, but the desires that drove me to it remain."
 latria_sexual_frustration_flavor.1502.desc.severe: "The poison spared my life and left my body infirm. I lie in bed while others bring me water and arrange my clothes. The lasting weakness has brought no respite from my desires."
 latria_sexual_frustration_flavor.1502.a.dead: "I… cannot speak…"
 latria_sexual_frustration_flavor.1502.a.survived: "So sick… some water…"
 latria_sexual_frustration_flavor.1502.a.severe: "I cannot even lift my hand…"

 latria_sexual_frustration_flavor.1503.t: "On the Riverbank"
 latria_sexual_frustration_flavor.1503.desc.dead: "I can no longer see the bank. Someone seems to be shouting in the distance, but the sound grows indistinct. I remember the lamp I left burning in my room. Even that last thought slips away."
 latria_sexual_frustration_flavor.1503.desc.survived: "Someone pulled me from the river. When I wake, a cloak is being wrapped around me. I shiver on the bank, waiting to be taken home, still painfully aware of the longing that led me here."
 latria_sexual_frustration_flavor.1503.desc.severe: "The river did not take my life. By the time they carry me onto the bank, I am feverish and coughing too hard to speak. They whisper about an illness of the lungs. Whenever I am lucid, the same desires return."
 latria_sexual_frustration_flavor.1503.a.dead: "So cold…"
 latria_sexual_frustration_flavor.1503.a.survived: "I'm still… alive?"
 latria_sexual_frustration_flavor.1503.a.severe: "I… cannot catch my breath…"

 latria_sexual_frustration_flavor.1504.t: "Beneath the Cliff"
 latria_sexual_frustration_flavor.1504.desc.dead: "I lie below the cliff, hearing the searchers call along the mountain path. Their voices draw closer, but I cannot answer. The mountains blur before me until I can no longer make out the sky."
 latria_sexual_frustration_flavor.1504.desc.survived: "I wake below the cliff to someone crouching beside me and calling my name. The fall has left me badly wounded, yet alive. As I wait for a litter, the same desires fill my thoughts again."
 latria_sexual_frustration_flavor.1504.desc.severe: "I survived the leap. Those who found me gather close, unwilling to meet my eyes. When I try to rise, I discover that I can no longer walk as I once did. My torment remains."
 latria_sexual_frustration_flavor.1504.a.dead: "I cannot hear anything…"
 latria_sexual_frustration_flavor.1504.a.survived: "I cannot move… it hurts…"
 latria_sexual_frustration_flavor.1504.a.severe: "My legs…"

 latria_sexual_frustration_flavor.1505.t: "The Door Forced Open"
 latria_sexual_frustration_flavor.1505.desc.dead: "I hear the bedchamber door break open, followed by someone calling my name in alarm. I try to tell them that the letter is beside the bed, but no words come. The light in the doorway dims, and I hear nothing more."
 latria_sexual_frustration_flavor.1505.desc.survived: "Someone forced open the bedchamber door and saved me in time. Now I lie in bed, my injuries making every movement difficult. The rope is gone, but the torment that drove me to it has not left me."
 latria_sexual_frustration_flavor.1505.desc.severe: "I hear someone calling my name again and again, but I do not know how to answer. Others must wash and feed me. I look at the familiar furnishings of my bedchamber and cannot think what I should do next. The letter beside the bed has been put away in a chest."
 latria_sexual_frustration_flavor.1505.a.dead: "I…"
 latria_sexual_frustration_flavor.1505.a.survived: "Let me… catch my breath…"
 latria_sexual_frustration_flavor.1505.a.severe: "Is someone… calling me?"
