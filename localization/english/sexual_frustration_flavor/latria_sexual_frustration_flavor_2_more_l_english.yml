l_english:
 latria_sexual_frustration_flavor.1111.t: "The Second Watch"
 latria_sexual_frustration_flavor.1111.desc: "I wake at the second watch with the sheet twisted around one calf. The lamp has burned down to a thumb of flame. My hand is already low on my stomach, warm from my own body, and I take it away.\n\nThere was a moment at dusk. Someone leaned past me for the salt, and a forearm brushed the back of my wrist, and neither of us moved for the length of a breath. I have gone over that breath more times than the whole conversation.\n\nI press my palm flat on the mattress beside my hip. The linen there is still cool. I leave it cool."
 latria_sexual_frustration_flavor.1111.a: "Let my hand go where it wants."
 latria_sexual_frustration_flavor.1111.b: "Turn over and wait for sleep."
 latria_sexual_frustration_flavor.1111.c: "Lie still and listen to the house settle."

 latria_sexual_frustration_flavor.1112.t: "The Cup Between Us"
 latria_sexual_frustration_flavor.1112.desc: "The cup goes hand to hand down the bench, and when it reaches me the rim is still wet from another mouth. I drink where the wet is. Across the table someone watches me do it, and does not look away, and does not smile either.\n\nWe talk about horses for a while, the price of a bay mare, the farrier at the crossroads. Under the table a knee comes to rest against mine, no weight behind it, only contact, and I keep talking about horses.\n\nA servant refills the cup. The knee withdraws to greet an uncle. I hold the cup in both hands and the wine has gone warm, and the bench beside me stays empty for the rest of the meal."
 latria_sexual_frustration_flavor.1112.a: "Say plainly what the knee was saying."
 latria_sexual_frustration_flavor.1112.b: "Thank the company and go early."
 latria_sexual_frustration_flavor.1112.c: "Stay, and talk of horses until the hall empties."

 latria_sexual_frustration_flavor.1113.t: "A Dance Too Long"
 latria_sexual_frustration_flavor.1113.desc: "The music turns and I am handed from one partner to the next. The third holds my hand a beat past the figure, thumb pressed to the inside of my wrist where the pulse is, and smiles as though it were an accident. I miss the next step and cover it with a turn.\n\nSomeone laughs at the far end of the hall. I do not turn to see who. My face is hot and I know it shows in the candlelight, and the candles are the only honest light in the room.\n\nThe set ends. I stand by the pillar with my hand still half closed, the shape of that thumb printed on the skin, and the musicians begin again."
 latria_sexual_frustration_flavor.1113.a: "Drink to that partner, loudly, before the whole hall."
 latria_sexual_frustration_flavor.1113.b: "Bow to the company and leave the floor."
 latria_sexual_frustration_flavor.1113.c: "Find the quietest corner and breathe slowly."

 latria_sexual_frustration_flavor.1114.t: "The Long Ride Back"
 latria_sexual_frustration_flavor.1114.desc: "Rain on the leaves, and the deer gone an hour ago. I ride at the back with the beaters' talk fading ahead of me. My thighs ache from the saddle in a way that will not let me forget my body before evening, and the wet wool of my cloak is cold at the collar.\n\nAt the stream a rider steadies my bridle, and the hand stays on the strap after the horse has settled. Water runs off the end of a braid. Neither of us mentions the rain.\n\nWe ride on. Wet leather creaks at every step, and I count the creaks instead of thinking, and I lose the count somewhere past the third field."
 latria_sexual_frustration_flavor.1114.a: "Let the hunt run until the light goes."
 latria_sexual_frustration_flavor.1114.b: "Keep my eyes on the trail and my hands on the reins."
 latria_sexual_frustration_flavor.1114.c: "Read the ground, the broken stems, the print of a hoof."
 latria_sexual_frustration_flavor.1114.d: "Fly the falcon again, and again."

 latria_sexual_frustration_flavor.1115.t: "Kneeling at the Third Hour"
 latria_sexual_frustration_flavor.1115.desc: "I kneel until my knees ache on the stone, and the ache is the only thing I can hold in my attention. The lamp oil has gone rancid. My body will not be quiet this morning. It wants, and it wants in the direction of someone who mends the roof beams and whistles at the work.\n\nI say the office. I begin it again from the top because my mind slipped at the fourth line. Someone coughs behind me and I do not turn.\n\nThe stone is cold through my habit. I stay down after the others rise, and the cold reaches my shins, and it is not enough."
 latria_sexual_frustration_flavor.1115.a: "Name it in the confessional and do penance after."
 latria_sexual_frustration_flavor.1115.b: "Keep the vigil until the bell."
 latria_sexual_frustration_flavor.1115.c: "Take up the commentary and read to the end of the chapter."

 latria_sexual_frustration_flavor.1116.t: "What the Chaplain Did Not Ask"
 latria_sexual_frustration_flavor.1116.desc: "My chaplain walks the cloister beside me and asks nothing, which is worse than asking. I talk about the sin of sloth and they answer about the harvest, the rain that came late, the price of rye.\n\nTheir cuff is frayed. I watch the loose threads move as they gesture and think about the wrist inside the sleeve, then about sloth again, and lose the harvest entirely. They stop walking to let me catch up.\n\nAt the door they bless me. I keep their hand a moment past the blessing. They let me, and then they go down the steps two at a time."
 latria_sexual_frustration_flavor.1116.a: "Tell them the whole of it."
 latria_sexual_frustration_flavor.1116.b: "Ask them for a penance and keep it."
 latria_sexual_frustration_flavor.1116.c: "Hear them out on the harvest."

 latria_sexual_frustration_flavor.1117.t: "The Petition After the Council"
 latria_sexual_frustration_flavor.1117.desc: "The council empties. My chancellor stays to press one more petition, and I hear the shape of their mouth around the words rather than the words. The seal is warm from my own hand and the wax has not set.\n\nI have not been alone with anyone since the feast. The crown is a weight on the back of the neck, and the neck wants a different weight, a hand there instead of gold.\n\nI grant the petition. They bow. I keep my eyes on the map until the door closes, and then on the door, and the candle beside the map burns down while I sit."
 latria_sexual_frustration_flavor.1117.a: "Send for someone after the candles are out."
 latria_sexual_frustration_flavor.1117.b: "Hold to the work until the petition is sealed."
 latria_sexual_frustration_flavor.1117.c: "Read the next three petitions myself."

 latria_sexual_frustration_flavor.1118.t: "Plum Wine on the Terrace"
 latria_sexual_frustration_flavor.1118.desc: "Plum wine, the third cup, and the sleeves keep brushing. Among my people we speak in lines of verse, each line a step nearer, and a servant stands at the rail pretending not to listen.\n\nI let my sleeve fall open at the wrist. The other sleeve does not retreat. Somewhere below the terrace a flute starts and stops and starts again, the same three phrases.\n\nI set the cup on the balustrade, half finished, and the wine holds the last of the light. Neither of us has said the plain thing. A petal turns over on the flagstone. The servant at the rail is still not listening."
 latria_sexual_frustration_flavor.1118.a: "Answer with a line that cannot be mistaken."
 latria_sexual_frustration_flavor.1118.b: "Straighten my sleeve and speak of the weather."
 latria_sexual_frustration_flavor.1118.c: "Walk the terrace alone until the lamps are lit."

 latria_sexual_frustration_flavor.1119.t: "The Lamp Left Burning"
 latria_sexual_frustration_flavor.1119.desc: "I have left the lamp burning and the sheet is down at my waist. My hand goes over the warm skin of my belly, lower, and this time I do not stop it. I am wet already, from the thought of a mouth at my throat at dusk, and my fingers slide easily.\n\nI think of the weight of a body over mine, the exact weight of it, and my hips lift to meet nothing. I press and circle and my breath goes ragged in the quiet room. The heel of my hand grinds where I want it.\n\nIt comes in a long shudder that leaves my thigh trembling. Afterward I lie with my arm across my eyes, the lamp still burning, the sheet damp under me."
 latria_sexual_frustration_flavor.1119.a: "Let it finish, and lie in the wet dark."
 latria_sexual_frustration_flavor.1119.b: "Take my hand away and count the beams."
 latria_sexual_frustration_flavor.1119.c: "Trim the lamp and lie in the dark."

 latria_sexual_frustration_flavor.1120.t: "The Visitor's Room"
 latria_sexual_frustration_flavor.1120.desc: "A knock after the hall is dark, and when I open the door I am in my nightgown and have not dressed for anyone. I see the look that goes over my body and I do not reach for a wrap.\n\nWe do not pretend. A mouth finds my throat, my hands are at a belt, and when I am lifted onto the table the cup goes over and rolls. The pace is slow and I am not patient. I hear my own voice, which surprises me, and the laugh against my neck, and the pace does not change.\n\nAfterward the wine drips from the table edge to the floor, one drop at a time. Neither of us moves to wipe it."
 latria_sexual_frustration_flavor.1120.a: "Keep the door unbarred and the nightgown on."
 latria_sexual_frustration_flavor.1120.b: "Thank them kindly and close the door."
 latria_sexual_frustration_flavor.1120.c: "Sit on the edge of the table and talk until dawn."

 latria_sexual_frustration_flavor.1121.t: "Behind the Painted Screen"
 latria_sexual_frustration_flavor.1121.desc: "The feast has gone past decorum. A screen is drawn across the corner of the hall and the noise behind it is not the noise of eating. A hand closes on my wrist and I let myself be drawn, and the painted herons on the screen pass close enough to touch.\n\nThere are more hands than one person's. I stop counting. The rushes are trodden flat and a cup rolls against my knee and no one picks it up.\n\nLater I sit against the wall with my hair loose and my mouth swollen, a stranger's cloak over my shoulders. The music has not stopped."
 latria_sexual_frustration_flavor.1121.a: "Go behind the screen and let the hall hear."
 latria_sexual_frustration_flavor.1121.b: "Refuse, and keep my cup and my seat."
 latria_sexual_frustration_flavor.1121.c: "Set the board and play until my hands are steady."

 latria_sexual_frustration_flavor.1122.t: "Four Words of a Poem"
 latria_sexual_frustration_flavor.1122.desc: "The writing board is on my knees and the reed pen has gone dry. I have written four words of a poem about the curve of a shoulder and none of the four are right. The fifth is worse.\n\nThe room is cold. My own breathing is loud in it. I set the board aside and press the back of my hand against my mouth, and the wanting goes nowhere, it only changes shape and settles lower.\n\nI take up the pen again. The line stays unfinished and the ink dries in the split of the reed, and the shoulder in the line is still only a shoulder."
 latria_sexual_frustration_flavor.1122.a: "Write the shoulder, and the rest of it."
 latria_sexual_frustration_flavor.1122.b: "Close the board and sit with my hands still."
 latria_sexual_frustration_flavor.1122.c: "Read something dull until the room is only a room."
 latria_sexual_frustration_flavor.1122.d: "Recite the unfinished line at supper."

 latria_sexual_frustration_flavor.1123.t: "The Falcon's Weight"
 latria_sexual_frustration_flavor.1123.desc: "The hooded falcon sits on my glove and its weight is the only honest thing this morning. We wait in the wet grass for the heron. My shoulder burns and the leather has soaked through at the thumb.\n\nAn arm comes against mine as we crouch, and stays. The bird shifts its feet. I keep my eyes on the reeds. My pulse is in my ears, louder than the marsh, and I am certain it can be heard.\n\nThe heron never comes. We walk back with the falcon riding my fist and the grass soaking my boots to the ankle, and neither of us says anything about the arm."
 latria_sexual_frustration_flavor.1123.a: "Ride out again and hunt until dark."
 latria_sexual_frustration_flavor.1123.b: "Keep still, and let the marsh go quiet."
 latria_sexual_frustration_flavor.1123.c: "Cast the falcon and watch only the falcon."

 latria_sexual_frustration_flavor.1124.t: "The Alms Box"
 latria_sexual_frustration_flavor.1124.desc: "I count coins into the alms box and the counting is a way of not thinking. Copper, mostly, and two silver pennies from the wool merchant. A donor's hand is in the box beside mine, our fingers among the coin, and the priest is watching us both from the third step.\n\nI have not confessed this. I do not know what I would call it. My face is composed. I have practiced being composed in a mirror.\n\nThe hand withdraws. I close the lid and the small brass lock clicks, and my own hand is not steady on the key, and the priest is still on the step."
 latria_sexual_frustration_flavor.1124.a: "Pay for a candle and let the priest see my face."
 latria_sexual_frustration_flavor.1124.b: "Keep the vigil until the candles gutter."
 latria_sexual_frustration_flavor.1124.c: "Read the psalter through once more."

 latria_sexual_frustration_flavor.1125.t: "Terms Agreed at Midnight"
 latria_sexual_frustration_flavor.1125.desc: "We have been at the treaty since noon. The candles are stubs and the fire has been let go out. My counterpart reads the last clause aloud and I agree to it without hearing it, because of the way a jaw moves around a language that is not mine.\n\nThis is not the first night. I know the exact distance at which I become useless, and we have been inside it since the second candle.\n\nI sign. They sign. The wax is still soft when I press my ring into it, and my hand is steady, and the clerk takes the page away, and that is the whole of my victory."
 latria_sexual_frustration_flavor.1125.a: "Send a note when the chamber is empty."
 latria_sexual_frustration_flavor.1125.b: "Keep to the clause, word by word."
 latria_sexual_frustration_flavor.1125.c: "Take the treaty away and read every line."

 latria_sexual_frustration_flavor.1126.t: "Grass, Wind, and an Open Collar"
 latria_sexual_frustration_flavor.1126.desc: "The horses are let loose to graze and we sit on the felt with the saddles still on. My companion's people say a rider should be able to sleep in the saddle. I cannot even sit still on the ground.\n\nThere is talk of a river I have never seen, a river with three crossings. A shirt is open at the throat. The wind moves the grass in long strokes and I watch the throat instead of the river.\n\nA horse snorts. I look away first, and my ears are hot in the wind, and the talk of the river goes on without me."
 latria_sexual_frustration_flavor.1126.a: "Say it out loud, in this language, badly."
 latria_sexual_frustration_flavor.1126.b: "Hold my tongue and look at the horses."
 latria_sexual_frustration_flavor.1126.c: "Ride hard until the wind has taken it out of me."

 latria_sexual_frustration_flavor.1127.t: "The Hollow in the Pillow"
 latria_sexual_frustration_flavor.1127.desc.female: "The bed is too warm and I have kicked the cover to the floor. My nightgown is rucked to the hip. I put my hand there and my body answers before I have decided anything, a quick heat low down, more insistent than I am.\n\nI think of the way a certain person said my name in the corridor, the second syllable held, the door not quite shut behind them. My fingers move and my breath catches on that held syllable.\n\nI stop before the end. I lie with my hand still and my heart going, and the pillow beside me has no hollow in it."
 latria_sexual_frustration_flavor.1127.desc.male: "The cover is on the floor and my nightgown is rucked to the hip. My hand goes down and I am hard already, from nothing, from a corridor and a name and a door left ajar.\n\nI think of a mouth and my hips shift of their own accord. My breath comes short. I could finish this in a moment and I do not, and the not is its own kind of work.\n\nI take my hand away and lie flat. The room is very quiet and the ache does not go, and the pillow beside me is cool and I do not touch it."
 latria_sexual_frustration_flavor.1127.desc: "The bed is too warm and the lamp is out. I have kicked the cover off and my hand strays, and my body answers at once, more insistent than I am, before I have decided to allow it.\n\nI think of a corridor, a name spoken twice, a sleeve drawn back at the wrist. The corridor is dark at that hour. My breath shortens and I let the thought run to the end of it and no further.\n\nI take my hand away and lie still. The pillow beside me has no hollow in it, and the cover stays on the floor until morning."
 latria_sexual_frustration_flavor.1127.a: "Let my hand stay where it is."
 latria_sexual_frustration_flavor.1127.b: "Fold my hands and sleep on my side."
 latria_sexual_frustration_flavor.1127.c: "Get up and sit by the shutter until it is light."

 latria_sexual_frustration_flavor.1128.t: "The Toast"
 latria_sexual_frustration_flavor.1128.desc: "I rise to give the toast and the hall is a blur of faces. One face is not a blur. I speak about loyalty for the length of a cup and my eyes keep going back to the same place above the third table.\n\nSomeone coughs at the high table. The gossip will be in the kitchens before the plates are cleared, and I find I care less than I should, which is itself a thing to answer for.\n\nI sit down. My hand takes the stem of the cup and holds it too hard, and across the hall the face is still turned toward me."
 latria_sexual_frustration_flavor.1128.a: "Name the one I was looking at, and drink to them."
 latria_sexual_frustration_flavor.1128.b: "Speak of loyalty only, and mean it."
 latria_sexual_frustration_flavor.1128.c: "Take the cup to the far end and sit with an old friend."

 latria_sexual_frustration_flavor.1129.t: "The Commentary on the Third Chapter"
 latria_sexual_frustration_flavor.1129.desc: "My chaplain reads the commentary aloud and I follow the line with my finger on the page. The voice does the reading. My finger has stopped moving, three lines below where the voice is, on the same page it was an hour ago.\n\nA page turns and my finger is in the way. The reader waits. I do not move it. The candle between us leans and straightens, and somewhere in the house a door is shut.\n\nThe reading goes on. I have lost the argument in the third chapter entirely, and the room smells of wax and ink, and the finger is still where it was."
 latria_sexual_frustration_flavor.1129.a: "Confess the wandering and take the penance."
 latria_sexual_frustration_flavor.1129.b: "Ask for a stricter rule and keep it."
 latria_sexual_frustration_flavor.1129.c: "Follow the line again from the top of the page."

 latria_sexual_frustration_flavor.1130.t: "What I Told My Friend"
 latria_sexual_frustration_flavor.1130.desc: "I tell my friend the whole of it, the corridor and the wrist and the cup, and my friend listens with a chin on one hand and does not once look at the door. The wine between us has gone untouched. Saying it aloud is a relief and changes nothing.\n\nThen a hand closes on my shoulder, friendly, and stays there. I look at the map. The campaign can wait a season; the river has not moved.\n\nMy friend goes. I sit with the campaign tokens in front of me, wooden, smelling of the box, and move one, and then move it back to where it was."
 latria_sexual_frustration_flavor.1130.a: "Tell the rest of it, and ask for nothing."
 latria_sexual_frustration_flavor.1130.b: "Say no more and straighten the tokens."
 latria_sexual_frustration_flavor.1130.c: "Weigh the campaign instead, and get it right."

 latria_sexual_frustration_flavor.1131.t: "The Warmth That Stays"
 latria_sexual_frustration_flavor.1131.desc: "A dream leaves me warm and I wake with the nightgown rucked to my waist. My own hand has been the cause. I lie still and let the room come back, the cold floor, the dying lamp, and the heat does not leave with the dream.\n\nIt was the steward's child, or someone with that mouth. They had my wrist pinned to the bed and were in no hurry, and I remember the exact weight of them, the way the mattress took us both. I have never once seen them look at me like that awake.\n\nI draw the nightgown down over my hips. The cloth is damp where I have been lying on it. I turn my face to the wall and the warmth stays under the blanket, patient, waiting for me to give in to it."
 latria_sexual_frustration_flavor.1131.a: "Let my hand go back where it wants."
 latria_sexual_frustration_flavor.1131.b: "Pull the nightgown straight and wait for dawn."
 latria_sexual_frustration_flavor.1131.c: "Think of the jests at supper and let my breath slow."

 latria_sexual_frustration_flavor.1132.t: "The Third Candle"
 latria_sexual_frustration_flavor.1132.desc: "I kneel until my knees ache and the ache is not enough to clear my head. The temple is empty past the third candle. In the dark behind my eyes the same body keeps returning, and it is not the god's.\n\nA pilgrim's hands, weeks ago, folding a blanket over my shoulders at the roadside. The brush of knuckles at my throat. I have prayed that image out a hundred times and it comes back each night more clearly, the warmth of a stranger's palm where the collar opens.\n\nI press my forehead to my folded hands. The stone is cold. My breath is not. I stay kneeling while the last candle shortens, and I do not ask forgiveness, only for the shaking in my thighs to stop before I stand."
 latria_sexual_frustration_flavor.1132.a: "Name the thought and let it burn through."
 latria_sexual_frustration_flavor.1132.b: "Rise and keep vigil until the body is spent."
 latria_sexual_frustration_flavor.1132.c: "Hold to the warmth of those hands as a comfort."

 latria_sexual_frustration_flavor.1133.t: "Under the Ledge"
 latria_sexual_frustration_flavor.1133.desc: "Rain again, and the hunt scattered. I shelter under a rock ledge with the master of hounds, both of us soaked through, and the cold makes every place we touch a small fire. Their arm is against mine from shoulder to wrist and I have stopped pretending not to notice.\n\nThey say something about the storm. I answer about the storm. Their hand finds the small of my back to steady me on the wet stone and stays there, spread warm through the wet wool, and my breath goes shallow in a way the cold cannot excuse.\n\nThe rain does not thin. Their thumb moves once against my spine. I keep my eyes on the grey curtain of water and do not step away, and the ledge is too narrow for anything but this."
 latria_sexual_frustration_flavor.1133.a: "Stay in the rain a while longer."
 latria_sexual_frustration_flavor.1133.b: "Shift away and watch the fall of the water."
 latria_sexual_frustration_flavor.1133.c: "Wait out the storm, then walk back alone."

 latria_sexual_frustration_flavor.1134.t: "The Lace I Never Loosened"
 latria_sexual_frustration_flavor.1134.desc: "The council is done and the study is mine. I pour wine I do not want and the memory comes anyway, uninvited, the envoy's mouth at the treaty feast, the way they licked a drop from their thumb while the scribes argued borders.\n\nI set the cup down. My hand goes to the laces at my throat and stops. In the memory their fingers are quick and sure and I am not objecting, I am leaning into the table to keep from sliding off it, and the whole hall is a blur of candle-smoke behind them.\n\nThe candle gutters. I retie the lace I never loosened. The wine sits untouched and the room is very quiet, and my pulse is loud in my ears like someone knocking at a door I have not opened."
 latria_sexual_frustration_flavor.1134.a: "Admit plainly whose mouth I am thinking of."
 latria_sexual_frustration_flavor.1134.b: "Snuff the candle and go to bed alone."
 latria_sexual_frustration_flavor.1134.c: "Set out a game of chess and gather myself."

 latria_sexual_frustration_flavor.1135.t: "The Slow Measure"
 latria_sexual_frustration_flavor.1135.desc: "The musicians take up a slow tune and a hand closes on mine before I can refuse it. We turn together near the dais, close, closer than the figure asks, and the one holding me smells of wine and woodsmoke and something warmer underneath.\n\nA thigh slides between mine on the turn and stays a half-beat too long. I keep my face composed for the hall. Under the music I can hear my own breathing, and I know the other hears it too, because their mouth curves and does not open.\n\nThe set ends. We do not part at once. A thumb traces the seam of my palm, slow, deliberate, a question with no words on it. The musicians begin again and I have not answered, and my hand is still in theirs."
 latria_sexual_frustration_flavor.1135.a: "Follow the tune and dance the next measure."
 latria_sexual_frustration_flavor.1135.b: "Draw my hand back and step into the crowd."
 latria_sexual_frustration_flavor.1135.c: "Stay in the warmth and hear the tune through."

 latria_sexual_frustration_flavor.1136.t: "The Pavilion at Dusk"
 latria_sexual_frustration_flavor.1136.desc: "The pavilion smells of oud and orange peel, and the servants have left the sherbet to sweat in its silver cup. A qasida runs half-spoken between us, each line a rung, and neither of us climbs the last one.\n\nDusk turns the water in the fountain the color of tea. The one I want lifts the cup and does not drink, only watches me over the rim, and those eyes are the whole end of the poem.\n\nI take the cup from their hand, drink where their mouth has been, and set it down. The oud player waits. No one has said the last line."
 latria_sexual_frustration_flavor.1136.a: "Call for the oud and let the song say it."
 latria_sexual_frustration_flavor.1136.b: "Thank the company and take my leave."
 latria_sexual_frustration_flavor.1136.c: "Stay, and let the quiet be good company."

 latria_sexual_frustration_flavor.1137.t: "Behind the Carved Screen"
 latria_sexual_frustration_flavor.1137.desc: "The fountain's hush fills the court, and a muwashshah runs from my mouth about the eyebrows of the beloved, the way they arch, the way they fall. The beloved is close enough to correct my meter.\n\nBehind the carved screen the light comes through in small stars. Their shoulder is against mine, warm through two layers of silk, and the poem has abandoned its subject entirely.\n\nI let the last line go unfinished. The screen keeps us from the court and shows us to no one, and the water goes on falling."
 latria_sexual_frustration_flavor.1137.a: "Finish the verse in a whisper meant for one."
 latria_sexual_frustration_flavor.1137.b: "Straighten, and speak of the fountain's repair."
 latria_sexual_frustration_flavor.1137.c: "Walk the arcade alone until the lamps are lit."

 latria_sexual_frustration_flavor.1138.t: "The Festival of Green Branches"
 latria_sexual_frustration_flavor.1138.desc: "My faith calls the body a gift, and once a year we hang the temple with green branches and mean it. The festival is tonight. I remember last year's, a hand in mine under the boughs, the incense, the blessing spoken over us like a canopy.\n\nThe one I want stands across the temple with a green branch in their fist, and the priest is already lighting the first lamp. My blood is not quiet, and my faith does not ask it to be.\n\nI hold to the memory of last year's branches until my hands are steady, and the green smell is everywhere."
 latria_sexual_frustration_flavor.1138.a: "Step forward and let the blessing fall on us both."
 latria_sexual_frustration_flavor.1138.b: "Keep the night's vigil until the branches wilt."
 latria_sexual_frustration_flavor.1138.c: "Read the rite of union to its end."

 latria_sexual_frustration_flavor.1139.t: "A Day at the Hippodrome"
 latria_sexual_frustration_flavor.1139.desc: "Dust hangs over the hippodrome and the factions roar for their colors. Icons are carried past my box on poles, and the incense cuts through the smell of horses and hot sand.\n\nA charioteer takes the turn low, looks up into the stands, and finds me. The glance holds a beat past the race and promises more than the race ever could. My hand tightens on the rail.\n\nThe dust settles. The factions go hoarse. I am still watching the track where the chariot went, and the incense has burned down to ash."
 latria_sexual_frustration_flavor.1139.a: "Say aloud whose glance I am holding."
 latria_sexual_frustration_flavor.1139.b: "Lean back and let the race be only a race."
 latria_sexual_frustration_flavor.1139.c: "Let the crowd's warm noise be enough."

 latria_sexual_frustration_flavor.1140.t: "The Desert Father's Teaching"
 latria_sexual_frustration_flavor.1140.desc: "The desert father teaches that the body is the enemy, and I wear a hairshirt under my robe to prove I have heard him. The hair pricks at my collar with every breath. His voice is dry as the wadi and twice as patient.\n\nHe calls prayer a fire that cools the blood. Mine will not cool. Behind my closed eyes it is not the enemy I see but the one I want, and the hairshirt saws at my throat.\n\nI bow my head and take up the prayer again from the top, and the words will not put out what is burning."
 latria_sexual_frustration_flavor.1140.a: "Rise and let the old law name what I feel."
 latria_sexual_frustration_flavor.1140.b: "Kneel and let the hairshirt do its work."
 latria_sexual_frustration_flavor.1140.c: "Follow the father's teaching line by line."
