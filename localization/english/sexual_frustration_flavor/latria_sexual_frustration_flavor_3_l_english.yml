l_english:
 latria_sexual_frustration_flavor.1201.t: "An Hour with No Visitor"
 latria_sexual_frustration_flavor.1201.desc.female: "I wait by the window in my nightgown until the tea skins over. No meeting was ever promised, yet I leave the lamp burning, set out an empty cup, and straighten the chair that faces the yard.\n\nThe night watch crosses the courtyard once. Lantern light slides along the wall and goes. I turn the cup; the tea is past drinking. I keep hearing the last thing that was said to me, a promise so empty it could hold any night, or none at all.\n\nThe wick burns short. I am still sitting. The nightgown slips from one shoulder, and I do not pull it up."
 latria_sexual_frustration_flavor.1201.desc.male: "I wait by the window in my nightgown. Only the night watch crosses the courtyard, steps fading and returning. No one is coming, but I leave the candle lit, as if light alone could finish an invitation I never spoke.\n\nThe tea has gone cold. I drink it anyway, and the bitterness makes me frown. A few leaves sit in the bottom of the cup. I stare at them as though they might tell me whether that person is anywhere else tonight. Wind bends a branch outside, then lets it go.\n\nI set my hand on the window frame. The wood is cold. The cold climbs my palm, and the heat under it does not leave."
 latria_sexual_frustration_flavor.1201.desc: "The wick burns low. Nothing stirs beyond the window.\n\nI raise the wick once. The flame jumps, then sinks again. Paper, a pen, and a cup of tea that can no longer be drunk sit on the table. I have touched each of them. None of them has turned the night into anything else.\n\nIn the end I only sit, and listen to my own breath fill the quiet."
 latria_sexual_frustration_flavor.1201.a: "Write down the words I meant to say."
 latria_sexual_frustration_flavor.1201.b: "Put out the candle, stifle the longing, and lie down."

 latria_sexual_frustration_flavor.1202.t: "Whispers Outside the Bathhouse"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Laughter carries from the bathhouse, undisturbed by who arrived with whom. Steam pushes through the door crack, smelling of soap and hot stone. Someone passes me with wet hair, a sash tied loosely, and no one looks twice.\n\nIt ought to be an ordinary sight. I stand outside the threshold and remember how long it has been since I came so unguarded near another person. Inside, a voice calls a name and laughs, the sound still wet from the water. My fingers stop on the doorframe.\n\nThe wind blows steam across my face. I neither go in nor leave."
 latria_sexual_frustration_flavor.1202.desc.strict: "Outside the bathhouse, several nobles discuss who must avoid whom. I hear my name, and the conversation falls silent. Water still sounds within. Outside, the quiet is sharp enough that cloth rasps when someone shifts.\n\nOne of them nods at me, too quickly. Another smooths a sleeve that was already straight. I know what sort of matter they were on. My ears grow hot, and it is not the steam.\n\nI stay where I am. The water within keeps time for the silence."
 latria_sexual_frustration_flavor.1202.desc: "Water echoes within the bathhouse. The voices outside distract me more.\n\nI came only to wash my face. At the door I hear low talk, broken halfway by a laugh. The laugh is not loud, yet it stops my step. I do not know what they find amusing. I know I should not stand here and listen.\n\nI listen through the sentence anyway. After it, my face is warmer than the cloth in my hand."
 latria_sexual_frustration_flavor.1202.a: "Tell them of the meeting I long for, letting the tale run on and on."
 latria_sexual_frustration_flavor.1202.b: "Set the thought aside, thank them, and take my leave."

 latria_sexual_frustration_flavor.1203.t: "Silence After Prayer"
 latria_sexual_frustration_flavor.1203.desc.favors: "The priest says that desire is not sinful in itself. The bell still turns under the beams. He has already closed the book, and left me the empty space after the last word.\n\nI would like to believe him, but the hollow in my heart remains. I kneel where I am and look at my hands. By day they have broken bread for others. Tonight they only want to hold someone who is not here. Faith allows it. Allowance does not put a person in my hands.\n\nThe priest waits for a question. I cannot form one. I only push the hair back from my brow."
 latria_sexual_frustration_flavor.1203.desc.condemns: "The priest speaks of the virtue of chastity, then falls silent. The silence weighs more than the lesson. I kneel where I am. The cushion under my knees has grown warm, the prayer is familiar, and my thoughts are already out on some road beyond the temple.\n\nI know I ought to answer. What leaves my throat is only a breath, and then a very small yes. The priest looks at me and does not ask again. That look makes the yes feel thinner.\n\nThe bell stops. Now and then a wick cracks."
 latria_sexual_frustration_flavor.1203.desc: "The prayer is done. The temple bells still ring in my ears.\n\nThe others have risen. I am still kneeling, as if I had missed a line. I missed none. When the last word is finished, the heat is still there. It does not follow the prayer, and it does not follow the others out.\n\nI press my palms to the stone. The cold reaches my wrists and goes no farther."
 latria_sexual_frustration_flavor.1203.a: "Set aside the teaching of abstinence for now."
 latria_sexual_frustration_flavor.1203.b: "Suppress the thought and begin the prayer again."

 latria_sexual_frustration_flavor.1204.t: "Restless After the Hunt"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Alone in my chamber and unclothed, I still hear the bowstring. My hunting clothes lie on the chair, and the mud on the boots has not dried. The tiredness sits in my legs and shoulders. My thoughts are not there.\n\nIn the wood someone passed me on horseback. Only a passing: our sleeves never touched. I have looked at it many times since. The hand on the rein, the small smile at the mouth when that rider turned, and the way the eyes left me once the smile was done. There is no horse in the room, and no rider. Only myself in the bronze mirror.\n\nI sit on the edge of the bed. The mat meets my skin, and only then do I remember that I have not yet dressed."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Alone in my chamber and unclothed, I try to return my thoughts to prayer and duty. The hunting clothes are folded aside. I have not even washed my face. Each time I close my eyes, the longing comes up clearer than any track in the wood.\n\nI begin the vow in my head. Halfway through, that rider turning in the trees cuts across it, and the vow breaks. I open my eyes and look at my hands. They are still shaking. I cannot tell the weariness of the hunt from the rest.\n\nA servant outside asks whether I want hot water. I answer. My voice is rougher than I meant."
 latria_sexual_frustration_flavor.1204.desc: "The hunting field is empty, but the restlessness in me will not fade.\n\nBack in the room I set down the bow, and the gloves, and cannot set down the glance from the day. Mud and sweat hang in the air. I stand a while before I notice that I have been watching the door, as if someone might still follow me in.\n\nNo one comes in. I shut the door myself."
 latria_sexual_frustration_flavor.1204.a: "Recall that figure I saw upon the hunting field."
 latria_sexual_frustration_flavor.1204.b: "Dress, return to my desk, and stifle the thought."

 latria_sexual_frustration_flavor.1205.t: "The Closed Study"
 latria_sexual_frustration_flavor.1205.desc.emperor: "I have the study emptied, leaving maps, seals, and unfinished papers. Once the door is shut, I hear only my own breath. I take an old letter from the drawer. The corners have gone soft.\n\nIt does not speak of the realm. It speaks of a meeting that never happened, and of a word I thought could wait. Many days have passed. The letter is still here. I set the seal upon it, then lift the seal away. The seal is cold. The paper seems warm.\n\nSomeone beyond the door asks, very low, whether supper should be sent. I do not answer."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "The route and watches lie written upon the table. My companions wait outside. I have allowed everyone time to rest, and when I come to my own hours the pen stops. A corner of an old letter shows from the drawer, as if it will not be covered by the route.\n\nI draw it out. The name at the top is enough to tell me this is the wrong hour to read it. Someone knocks and asks whether we ride on. I say that we do. My eyes stay on the second line.\n\nThe second line is only a place. That place is not on our road."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Alone in the study, I have closed neither the accounts nor the scripture. An old letter lies between the pages. Again and again I reach for it and draw back.\n\nIt did not come today. It has sat in the book so long that I pause whenever I turn to this page. Today I draw it out at last. There is no improper word on the paper. My breath still goes uneven while I read.\n\nSomeone passes in the corridor, and prayer beads click. I press the letter back into the book. I can still feel its edge."
 latria_sexual_frustration_flavor.1205.desc.ruler: "My attendants wait beyond the study door. I forbid them to disturb me. The seals and papers remain before me, but I have yet to return the old letter to its drawer.\n\nI ought to mark the petition about the bridge. The pen hangs over the page, and a drop of ink falls. I look at the spot and remember a line in the letter that has nothing to do with bridges. It is only a few words. I know which line holds them.\n\nOutside, someone shifts their feet. I push the petition aside and reach for the drawer."
 latria_sexual_frustration_flavor.1205.desc: "I close the study door, leaving the old letter and unfinished work upon the table.\n\nThe latch falls lightly. After that, the room is only paper. I set the work on the left and the letter on the right. After a while I move the letter to the middle.\n\nThe wick spits once. I do not trim it."
 latria_sexual_frustration_flavor.1205.a: "Leave the work until tomorrow and read the letter again."
 latria_sexual_frustration_flavor.1205.b: "Suppress the old longing and attend to my duties."

 latria_sexual_frustration_flavor.1206.t: "Rumors at the Feast"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Someone at the feast speaks of a lover as casually as the weather. After one round of wine the names in the story have changed twice, and the company still laughs. No one lowers a voice.\n\nI mean to laugh it off. Halfway through the laugh I realize how long it has been since I joined such talk, long enough that I look at my neighbor before I know where to set my cup. The neighbor asks whether I have a tale of my own. My fingers stop on the rim.\n\nMusic carries across the company. I hear it, and cannot name the tune."
 latria_sexual_frustration_flavor.1206.desc.strict: "Several nobles speak of a fellow courtier who lost favor through impropriety, and one of them mentions my name. The talk does not stop cleanly. It only drops from speech into breath. I smooth my sleeve and do not join them.\n\nWhat they say may not be true. True or false no longer matters. What matters is that I do have a matter I cannot set on the table, and their eyes seem already to have seen it. I finish the wine. The heat is not in my throat. It is in my face.\n\nSomeone lifts a cup to turn the talk. When the cups strike, my hand still jumps."
 latria_sexual_frustration_flavor.1206.desc: "Music carries across the company. Their conversation distracts me more.\n\nI sit where I am and hear the talk circle, until every circle ends at bed-curtains and private letters. Someone laughs. Someone coughs. Someone watches me from the corner of an eye. I do not know that the look was idle.\n\nI turn the empty cup once. The base draws a small sound across the table."
 latria_sexual_frustration_flavor.1206.a: "Tell my old story in full, repeating even the words spoken in private."
 latria_sexual_frustration_flavor.1206.b: "Hold my tongue, bow to my companions at table, and take my leave."

 latria_sexual_frustration_flavor.1207.t: "An Empty Place After Prayer"
 latria_sexual_frustration_flavor.1207.desc.favors: "After the service, the priest leaves his book upon the bench and departs. The empty seat still holds the hollow where he sat. My faith does not condemn desire. The sentence is on the page I have just read, and the ink is clear.\n\nI still cannot settle my thoughts. Permission is one thing. Facing my own hands alone at night is another. I stand beside the empty seat for a while. I neither sit nor close the book.\n\nThe wind draws the temple door to a crack. Light comes through and falls on that line."
 latria_sexual_frustration_flavor.1207.desc.condemns: "The priest is gone, but I remain upon my knees. The teaching on chastity is clear; I could recite every line. The longing within me has not left with him. It stays between my knees and my palms, and it stays specific.\n\nI look at the empty seat and envy the wood, which is allowed to think of nothing. I am not. I set my brow against it, and what I meet is still my own heat.\n\nThe candle shortens. I am still kneeling."
 latria_sexual_frustration_flavor.1207.desc: "Only the candle and I remain in the quiet temple.\n\nThe others' footsteps have gone far. I could leave now, draw the door shut, and turn the page. I do not. I walk two steps among the empty seats and come back to the same cushion.\n\nThe flame is quiet. I hear my blood in my ears."
 latria_sexual_frustration_flavor.1207.a: "Leave the temple and dwell upon that affection."
 latria_sexual_frustration_flavor.1207.b: "Restrain my desire and read the precepts again."

 latria_sexual_frustration_flavor.1208.t: "The Chase Through the Wood"
 latria_sexual_frustration_flavor.1208.desc.lustful: "The quarry slips between the trees, and the others give chase. I ride after them. Branches strike my sleeve, and the smell of horse-sweat comes up into my face. Half a mile on, I notice I am not chasing the beast.\n\nAhead of me is a back. Only another hunter, nothing more. The rise and fall of that back holds my eyes so hard that I miss the fork. The hounds bay off to the left. My horse keeps straight.\n\nI rein in. That rider does not turn. I am already breathing as if the hunt were not the cause."
 latria_sexual_frustration_flavor.1208.desc.chaste: "I rein in my horse and remind myself that I came only to hunt. The hounds fade into the distance. The hoofprints are clear in the wet mud, and I have to look twice before I see which way they turn.\n\nMy thoughts will not follow the prints. They stay on the hands that tightened my girth a little while ago. The hands were steady, and then they let go, and nothing was said. I have already made that moment into something else.\n\nThe horse snorts. Only then do I see how long I have stood still."
 latria_sexual_frustration_flavor.1208.desc: "The party pauses among the trees, waiting for my word to continue the chase.\n\nEvery face is turned toward me. Water still drips from the harness, and someone wipes a brow. I look at the tracks. The tracks are plain. My answer is not. Half of me is still at the other end of the wood, with a person who has nothing to do with the quarry.\n\nWind comes through the trees. I hold the reins and do not speak at once."
 latria_sexual_frustration_flavor.1208.a: "Let the others ride ahead while my thoughts wander."
 latria_sexual_frustration_flavor.1208.b: "Gather my thoughts and lead the hunt onward."

 latria_sexual_frustration_flavor.1209.t: "Embers by the Window"
 latria_sexual_frustration_flavor.1209.desc.female: "In my nightgown, I sit beside the window as the hearth dwindles to embers. The words I left unspoken by day turn once in my mouth and turn back. The sentence is not long. What is long is how far I have carried it.\n\nNow and then an ember brightens and shows my hands on my knees. My fingers worry the edge of the nightgown and crease it. I remember the wind a sleeve made when that person passed me today. It was only wind. I still know which way it went.\n\nSomeone calls the hour outside. I do not answer, and I do not want to sleep."
 latria_sexual_frustration_flavor.1209.desc.male: "In my nightgown, I lean against the window and watch the night watch cross the yard. The lanterns pass one by one, cutting the night into small pieces. An affection unanswered will not be cut. It stays whole in my chest.\n\nI set my brow against the lattice. The wood smells of old paint. I remember how that person looked elsewhere while speaking, as if a look at me would have turned the words into something else. I looked away as well. After that, neither of us spoke again.\n\nA coal in the hearth cracks and settles."
 latria_sexual_frustration_flavor.1209.desc: "Beyond the window all is quiet. The fire fades, but I am not sleepy.\n\nI lay on a small piece of wood. The fire does not rise. It only smokes, and the smoke stays in the nightgown. I sit by the window again and say, once more, the sentence I never sent by day. When I finish, there is still no listener.\n\nNight lies on the courtyard. I look at it. It does not look at me."
 latria_sexual_frustration_flavor.1209.a: "Set my thoughts down on paper."
 latria_sexual_frustration_flavor.1209.b: "Stoke the fire, put the longing aside, and lie down."

 latria_sexual_frustration_flavor.1210.t: "No Knock at the Door"
 latria_sexual_frustration_flavor.1210.desc.emperor: "My attendants have put away the crown. In my nightgown beside the bed, borders, tax rolls, and the people I must see tomorrow cannot push this private matter aside. It sits on the other half of the bed, though no one is there.\n\nI look at that empty half. The pillow is smooth. The corner of the cover is smooth. The smoothness itself feels like a rebuke. I set one hand on that side. The cloth is cold. When the cold has passed, I still do not take the hand back.\n\nA lamp in the corridor goes out. No one comes to knock."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "My companions have retired at the inn. In my nightgown, I sit beside an unsent letter. Tomorrow we ride on, and the horses are already fed. This worry will not stay here. It will travel in the pack, as far as the next ferry.\n\nI turn the letter under the lamp. The name at the top is written too heavily for a thing one might send from the road. Downstairs someone settles a bill, and coins ring for a while. When that sound is gone, the room is quieter.\n\nI slip the letter in among my clothes. I still know which layer holds it."
 latria_sexual_frustration_flavor.1210.desc.clergy: "I hang my vestments beside the bed and sit alone in my nightgown. My vow remains in my ears, because I spoke it myself a little while ago. My thoughts do not quiet. The beads stop between my fingers, and stay on the same bead for a long time.\n\nI mean to give the night where it ought to go. Whenever I grow still, I see a face that has no place in prayer. I close my hand on the beads. They press into the palm. The ache comes, and the face remains.\n\nThe door of the cell is not fully latched. Wind enters the crack, and the flame leans."
 latria_sexual_frustration_flavor.1210.desc.ruler: "My formal clothes are put away. In my nightgown beside the bed, the guards outside hear no sigh, and office cannot settle this private matter. I try to walk through tomorrow's audience in my head. I reach the third name and cannot go on.\n\nThat third person has nothing to do with the audience. I still stop the order there. The lamp throws my shadow on the wall. The shadow sits straighter than I do.\n\nI lower the wick. The shadow shortens. I am still sitting."
 latria_sexual_frustration_flavor.1210.desc: "The hour is late, and I remain alone with this worry.\n\nThe door is shut, the lamp is lit, and the bed holds only me. None of those three things has changed. What has changed is that I no longer pretend I will sleep at once. I lay my outer clothes on the back of the chair, then take them up again, as if someone might still call me out.\n\nNo one calls. I set the clothes down once more."
 latria_sexual_frustration_flavor.1210.a: "Send for a trusted acquaintance, late as it is, and talk at length."
 latria_sexual_frustration_flavor.1210.b: "Suppress the longing, put out the candle, and lie down."

 latria_sexual_frustration_flavor.1202.c: "Change the subject and ask after my companions."
 latria_sexual_frustration_flavor.1202.d: "Invite them all to tea and talk until we tire."
 latria_sexual_frustration_flavor.1203.c: "Ask the priest to stay and study the teachings with me."
 latria_sexual_frustration_flavor.1204.c: "Put on my nightgown and consider the day's thoughts slowly."
 latria_sexual_frustration_flavor.1205.c: "Arrange the watches and allow myself a little rest."
 latria_sexual_frustration_flavor.1205.d: "List tomorrow's duties, one by one."
 latria_sexual_frustration_flavor.1206.c: "Turn the conversation with a new poem."
 latria_sexual_frustration_flavor.1207.c: "Sit before the scripture and finish this chapter."
 latria_sexual_frustration_flavor.1208.c: "Rest the horses and study the tracks at leisure."
 latria_sexual_frustration_flavor.1209.c: "Stoke the fire, brew tea, and read an old book."
 latria_sexual_frustration_flavor.1209.d: "Make a poem of the words I never spoke."
 latria_sexual_frustration_flavor.1210.c: "Plan tomorrow and put each task in order."
