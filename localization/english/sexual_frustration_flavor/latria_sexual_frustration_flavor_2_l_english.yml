l_english:
 latria_sexual_frustration_flavor.1101.t: "Wakeful Beneath the Canopy"
 latria_sexual_frustration_flavor.1101.desc.female: "I wake from a thin sleep. My nightgown has slipped to the foot of the bed, and shoulder and knee are bare beyond the canopy. No one else is here. The bedclothes are kicked into a heap, and the pillow holds only one hollow.\n\nI draw the gown back. The cloth drags over my skin, and the warmth does not go with it. The watch has already called twice beyond the window. I turn onto my side and shut my eyes, and I see the nape of a neck from earlier in the day, the moment that person turned away. A canopy hook gives a small click, as if someone had lifted a corner. No one has.\n\nI lie flat. I do not know where to put my hands. The night is still long, and sleep has already left me."
 latria_sexual_frustration_flavor.1101.desc.male: "I wake from a thin sleep. My nightgown has slipped to the foot of the bed. Beyond the canopy it is black, and a drum sounds once, far off. The bedclothes are twisted into a knot. I did that myself, turning over.\n\nI sit up, then lie down again. The warmth that will not leave stays low in my belly. I count my breaths. At the seventh I remember how near someone stood while speaking. Nothing happened in that nearness. I remember it too clearly all the same.\n\nThe wind lifts a corner of the canopy and lets it fall. The other half of the bed is still cold."
 latria_sexual_frustration_flavor.1101.desc: "The canopy hangs halfway down. The night is not finished, and my thoughts will not settle.\n\nI pull the cover to my chest, then kick it off. There is no letter on the pillow, and no one beside me. Only my own hand. The palm is hot. I press it flat to the mat and try to cool it.\n\nThe watch sounds again. I am still awake."
 latria_sexual_frustration_flavor.1101.a: "Close my eyes and think of the one I long for."
 latria_sexual_frustration_flavor.1101.b: "Put the thought aside, draw the curtains, and settle back to sleep."

 latria_sexual_frustration_flavor.1102.t: "Glances Between Dances"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Three tunes have changed, and the faces at the tables have changed with them. No one looks twice at a step taken too near. The musicians even slow the measure, as if to leave room for a sentence to be finished.\n\nI remember that one moment. The hand stayed on my wrist a little longer than courtesy asks, and the eyes did not turn away at once. When the tune ended, the hand let go. A little heat remained at the fingertips. I am back in my seat. The cup is full. I have not drunk.\n\nThe next tune has already begun. I look at the empty stretch of floor. My feet still want to go there."
 latria_sexual_frustration_flavor.1102.desc.strict: "The nearer the steps, the more the laughter around us sounds like whispering. I turn my eyes toward the musicians. The other hand still leads mine. Sleeve brushes sleeve, and that small sound is clearer than the drum.\n\nSomeone at the edge of the tables leans down to speak. I cannot tell whether they mean me or some other matter. When the tune stops I step back at once, too quickly, and nearly tread on my own shoe. My partner looks at me and does not ask.\n\nAfter I sit, the heat is still on my wrist. I cover it with my other hand, as if that would keep it from being seen."
 latria_sexual_frustration_flavor.1102.desc: "The music quickens. My thoughts do not leave with the steps.\n\nI turn twice and miss nothing underfoot, yet I keep counting how near the other breath comes. The tune pauses at its highest point. In that pause, neither of us speaks.\n\nThe musicians draw the strings again. I am still standing where I was. I do not know where this dance ought to end."
 latria_sexual_frustration_flavor.1102.a: "Ask for another dance, and draw a little closer."
 latria_sexual_frustration_flavor.1102.b: "Thank my partner with a bow and retire to the edge of the hall."

 latria_sexual_frustration_flavor.1103.t: "At the Guide's Door"
 latria_sexual_frustration_flavor.1103.desc.favors: "My guide says that pressing desire down is not the only road of devotion. The lamp throws both our shadows on the wall. The words come slowly, leaving a gap for me to take.\n\nI nearly ask the rest: if I wake alone at night and do not know where to put my hands, does that still lie on this road? The question reaches my mouth. Footsteps stop outside the door. We both go still. The footsteps move on.\n\nMy guide looks at me and waits for the second half. I swallow it. Only an unfinished beginning remains."
 latria_sexual_frustration_flavor.1103.desc.condemns: "My guide reminds me that chastity does not matter only when others are watching. The voice is not raised. The room seems narrower all the same. I bow my head and answer once. My fingers close inside my sleeve.\n\nI am asked why I came tonight. I look at the lamp, at the door, at the toes of my shoes. I do not look at those eyes. The true sentence is not long. I fear that once it is out, the next question will follow.\n\nSomeone coughs beyond the door. I let out a breath, and then I am ashamed of the relief."
 latria_sexual_frustration_flavor.1103.desc: "The lamp is low. I weigh how to begin with my guide.\n\nWhat I ought to ask is duty. What I ought not to ask is the other matter. I practiced both speeches at the door. Once inside, I cannot recall a sentence of either. My guide pours water for me. The water is still hot.\n\nI hold the cup. The rim touches my lip. The words still do not come."
 latria_sexual_frustration_flavor.1103.a: "Admit my longing and cease to hide it."
 latria_sexual_frustration_flavor.1103.b: "Ask only about my present duties, and swallow the rest."

 latria_sexual_frustration_flavor.1104.t: "The Unreturned Eagle"
 latria_sexual_frustration_flavor.1104.desc.lustful: "The eagle circles over the field and will not drop to the glove. I lift my arm twice. It only tips a wing and climbs higher. Wind comes out of the trees, carrying grass and the sweat of horses.\n\nI nearly envy it. It need not explain, nor turn back, nor call a private urgency patience in front of other people. An attendant asks whether to unstring the bow. I shake my head. My eyes stay on the black speck. After a while the speck no longer looks like an eagle. It looks like someone else who will not come back.\n\nMy arm has begun to ache. I still have not lowered it."
 latria_sexual_frustration_flavor.1104.desc.chaste: "The eagle circles and will not come down. The attendants have asked more than once whether to put the bow away. I tell them to wait a little longer, as if a little more waiting might let the disorder in me pass on its own.\n\nThe hunters are already off their horses, passing a water skin in the shade. They do not hurry me. The tack keeps sounding, and the sound hurries me for them. I watch the sky and count under my breath. The count turns into the same person's name.\n\nThe eagle cries once and still does not drop. I move the glove to my other hand, and I do it slowly."
 latria_sexual_frustration_flavor.1104.desc: "The eagle is late returning. The hunters wait for me to speak.\n\nThe whistle has left a mark in my palm. I raise it to my lips and lower it again. The circle overhead grows smaller. No one knows whether the bird will come back in the next moment.\n\nSomeone asks, quietly, whether we are going. I answer. I do not know whether I have agreed to leave or to wait."
 latria_sexual_frustration_flavor.1104.a: "Let the eagle circle while my thoughts wander."
 latria_sexual_frustration_flavor.1104.b: "Gather my thoughts and call the eagle back to camp."

 latria_sexual_frustration_flavor.1105.t: "Candles and a Crown"
 latria_sexual_frustration_flavor.1105.desc.emperor: "An attendant carries the crown out of the bedchamber. Unread decrees still lie by the candles. I draw on my nightgown and sit. I ought to take the paper on top. My hand draws the unsent letter out of the pile instead.\n\nThere is only a form of address on it. After that, nothing. I stopped in the same place three times today. The crown catches a little light inside its case, as if it were still waiting for the work an emperor ought to do. I smooth the sheet. Once it is smooth, I still do not know the next sentence.\n\nA drop of wax falls into the copper tray. The sound is very small."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "I put on my nightgown in the inn room. My companions have already lain down. Someone snores through the wall. The unsent letter beside the pack is in the lamplight, and one corner has curled.\n\nWe ride tomorrow. Bread, horses, and the ferry are all arranged. Only this letter has nowhere to go. I open it. The sentences look even less fit to send than they did this morning. One line is too plain. I rest a knuckle on it and stop.\n\nSomeone shuts a door downstairs. I press the letter back onto the pack. I do not press it flat."
 latria_sexual_frustration_flavor.1105.desc.clergy: "I fold the vestments and sit on the bedside in my nightgown. The unsent letter lies under the book of scripture. A corner shows, as if it meant to be seen.\n\nI draw it out. The book shuts with a dull sound. Nothing in the letter breaks a vow, yet every sentence circles the same person. By the third line I know I should not be reading it at this hour.\n\nThe candle jumps. I do not put the letter back."
 latria_sexual_frustration_flavor.1105.desc.ruler: "The attendants put away the formal clothes. I sit under the lamp in my nightgown. The papers on the table are not finished. The unsent letter at my hand is the one I open first.\n\nThe guard changes outside. The steps go past in order. In the room there is only the sound of paper. I set one word in the blank space, look at it, and black it out with ink. The blackened place shows more than the word did.\n\nI lay the pen down. The papers are where they were. Not one seal has been pressed."
 latria_sexual_frustration_flavor.1105.desc: "The lamp is nearly out. An unsent letter is still within reach.\n\nI already know the person it is meant for will not read it tonight. I write the form of address again all the same, more slowly than I wrote it by day. The ink dries. Only a faint stroke remains on the paper.\n\nThe wick cracks. I look up and find I have been sitting a long while."
 latria_sexual_frustration_flavor.1105.a: "Give the letter to a messenger."
 latria_sexual_frustration_flavor.1105.b: "Destroy it, put the thought aside, and snuff the candle for sleep."

 latria_sexual_frustration_flavor.1106.t: "Restless by Candlelight"
 latria_sexual_frustration_flavor.1106.desc.female: "I sit on the bedside in my nightgown. The candle throws my shadow on the window paper. The shadow moves a little with my breath and looks steadier than I am. The night is far gone. The longing that found no answer is still in my chest. It makes no sound, and it does not leave.\n\nI put my hair behind my shoulder, then bring it forward again. When my fingers touch the side of my neck, I stop. No one else is here. The pause still heats my face. I remember a sentence from the day that was half in earnest, and the way I laughed, and how the laugh stayed with me afterward.\n\nThe wax has piled another layer. I am still sitting. The canopy is still up."
 latria_sexual_frustration_flavor.1106.desc.male: "I sit on the bedside in my nightclothes. The watchman has already passed the window twice. The first time, I still hoped I might sleep. By the second, I had given that up.\n\nThere is no letter in my hand, and no wine. I only press my palm to my knee until it is warm, then turn it over. The voice I am thinking of is not truly in the room. I can still repeat the pause in that sentence. By the third time, even I think it unbecoming.\n\nI blow at the candle and do not put it out. The flame leans, then stands straight again."
 latria_sexual_frustration_flavor.1106.desc: "The candle grows short. Sleep has not come under the canopy.\n\nI lie down and hear my heart louder than usual. I turn onto my side. The heart is still there. Everything in the room is where it was: the cup, the shoes, the folded outer clothes. None of it carries this warmth away.\n\nI sit up again. The lamp is still burning. A large part of the night has already gone."
 latria_sexual_frustration_flavor.1106.a: "Let my thoughts dwell upon that affection."
 latria_sexual_frustration_flavor.1106.b: "Dwell on it no longer; snuff the candle and settle to sleep."

 latria_sexual_frustration_flavor.1107.t: "A Dance in Return"
 latria_sexual_frustration_flavor.1107.desc.accepted: "My partner asks me for another dance. The company takes it for ordinary courtesy. The musicians already have the bow on the string, waiting for me to nod.\n\nI remember the hand from a moment ago. It rested once at my waist, briefly enough to be called a step, and not briefly enough for me to believe that. I look at my partner's face. My partner looks back. There is a little smile at the mouth, and nothing is said outright.\n\nSomeone at the table strikes a cup against another. The sound is loud. I can still hear the agreement I have not spoken."
 latria_sexual_frustration_flavor.1107.desc.strict: "My partner asks me for another dance, and several looks turn toward us at once. I have not answered yet. Someone is already leaning to whisper to the next seat. I cannot hear the whisper. Those two pairs of eyes have not left us.\n\nThe hand is still offered. The posture is polite and does not press. My own hand grows hot inside the sleeve. If I take it, this dance will be harder than the last to treat as nothing. If I do not, the refusal itself will be remembered.\n\nA musician clears his throat. The bow is still resting on the string."
 latria_sexual_frustration_flavor.1107.desc: "The musicians begin a new tune. I do not rise.\n\nThe first beats have already passed. My partner does not take the hand back, and does not urge me, and only stands there. I look at that hand. Then I look at my own fingers on the edge of the table.\n\nSomeone behind me shifts a chair. The sound makes me blink. I still do not stand."
 latria_sexual_frustration_flavor.1107.a: "Accept the dance and draw closer."
 latria_sexual_frustration_flavor.1107.b: "Decline with a bow and wish my partner a pleasant dance."

 latria_sexual_frustration_flavor.1108.t: "Prayer Before Sleep"
 latria_sexual_frustration_flavor.1108.desc.favors: "I pray beside the bed in my nightgown. I know well enough the teaching that the pleasures of the body need not be counted a sin. It does not help me now. It tells me the matter need not be guilt. It does not tell me where this heat should go.\n\nMy knees rest against the bedside. The prayer leaves my mouth, and my mind plays over a look from the day that came too near. The look itself was nothing. I have taken it apart into small pieces and looked through them again.\n\nI reach the place where I ought to stop. I do not stop. The sentences after that are my own, and they have no order."
 latria_sexual_frustration_flavor.1108.desc.condemns: "I kneel beside the bed in my nightgown and repeat the vow of chastity. With each line the voice underneath grows clearer: tonight I am still alone, the cover is still cold, and in the dark my hand will still find itself.\n\nI set my brow against the bedboard. The wood is cold. That helps a little. The moment I leave the cold, the warmth returns to where it was. I begin again at the first line. I keep my voice low, as if the next room might hear.\n\nNo one is in the next room. I keep my voice low all the same."
 latria_sexual_frustration_flavor.1108.desc: "The candle by the bed wavers. The prayer has not come to an end.\n\nI have already said the passage I know. Silence ought to follow. I will not let it in. If silence comes, the other matter will take its place. I add a few lines. When they are said, I know they are not a prayer.\n\nThe flame leans toward the canopy. I am still kneeling. The front of my gown is creased."
 latria_sexual_frustration_flavor.1108.a: "Set aside the vow of chastity and admit my longing."
 latria_sexual_frustration_flavor.1108.b: "Restrain my thoughts and continue the prayer."

 latria_sexual_frustration_flavor.1109.t: "An Unfinished Council"
 latria_sexual_frustration_flavor.1109.desc: "My councilors have set out three courses, and I have not chosen. The first is the surest, the second the least costly, the third the nearest to old custom. I heard all three. I nodded at all three. After the nods I still cannot say which one I will take.\n\nThe clerk's pen hangs in the air. Someone pushes a cup of water closer to my hand. I look at my face in the water and my mind leaves the room. It goes to a person who has nothing to do with stores of grain. That person is not here. I can still hear the pause in the way they speak.\n\nThe silence has grown awkward. I clear my throat. I still do not give them a sentence."
 latria_sexual_frustration_flavor.1109.a: "End the council and leave me to my thoughts."
 latria_sexual_frustration_flavor.1109.b: "Suppress the thought and ask the clerk to continue."

 latria_sexual_frustration_flavor.1110.t: "A Room After Midnight"
 latria_sexual_frustration_flavor.1110.desc.clergy: "I come back to my small room in my nightgown. Night prayer is done, and most of the lamps in the passage are out. The unsent letter is still open on the table, holding down a string of beads.\n\nI ought to put the beads in their case and put the letter away with them. My hand reaches the paper and stops. I already know the sentences by heart. I still want to see again how I wrote that name. The ink has spread in one place, as if my hand was unsteady when I made the stroke.\n\nThe room is very quiet. I stand at the table. The tie of the nightgown is not fastened."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Only a few lamps are still lit at the inn. I sit on the bedside in my nightgown. The pack is already tied. Only the unsent letter still shows.\n\nSomeone turns over in the next room, and the bedboard sounds once. I wait until the sound is gone before I draw the letter out. Road dust clings to the edge of the paper. I blow at it. The dust stays. The sentences seem clearer for it. One line I should not have written sits in the middle.\n\nI fold the letter. The crease will not meet the old mark."
 latria_sexual_frustration_flavor.1110.desc: "The sounds beyond the door fade. I am still waiting beside the bed.\n\nNo one agreed to come tonight. I have left the lamp burning all the same, and I have set my outer clothes where my hand can reach them. Each time steps pass, I lift my head. The steps all go on.\n\nThe oil has dropped a little. The other side of the bed is still empty. I have not lain down."
 latria_sexual_frustration_flavor.1110.a: "Finish the letter and have it sent at dawn."
 latria_sexual_frustration_flavor.1110.b: "Bar the door, put the thought aside, and retire for the night."

 latria_sexual_frustration_flavor.1101.c: "Put on a robe, sit still, and let my breathing settle."
 latria_sexual_frustration_flavor.1102.c: "Speak with the musicians about their tunes."
 latria_sexual_frustration_flavor.1103.c: "Ask how I might live with these feelings."
 latria_sexual_frustration_flavor.1103.d: "Begin with the unsent letter, and conceal nothing."
 latria_sexual_frustration_flavor.1104.c: "Ask the others to wait while I work patiently with the eagle."
 latria_sexual_frustration_flavor.1105.c: "Put the letter in its case and plan tomorrow's work."
 latria_sexual_frustration_flavor.1107.c: "Ask my partner to sit and speak of something else."
 latria_sexual_frustration_flavor.1107.d: "Invite the whole table to join a lively group dance."
 latria_sexual_frustration_flavor.1108.c: "Finish the prayer slowly, without fighting every thought."
 latria_sexual_frustration_flavor.1109.c: "Take a short recess and arrange the remaining business."
 latria_sexual_frustration_flavor.1109.d: "Put the urgent decisions in order and settle them here."
 latria_sexual_frustration_flavor.1110.c: "Put on a robe and seek a cup of warm broth."
