l_english:
 latria_sexual_frustration_flavor.1411.t: "No One at the Door"
 latria_sexual_frustration_flavor.1411.desc: "The lamp has burned down to a stub and I am still awake, my nightgown pushed up past my hips, my own hand where I have told no one it goes. I have stopped calling this restlessness. Three nights now I have brought myself to the edge and left it there, listening for a footstep in the passage that never comes. The sheet is damp where I have lain still too long.\n\nI think of the way that person leaned over my chair at the feast, close enough that I felt the warmth of the room leave with them when they straightened. My breath comes short. I press my palm flat and hold still, and the wanting does not ease, it only gathers lower and heavier.\n\nSomewhere below, a door closes. My hand moves again, and this time I do not stop it."
 latria_sexual_frustration_flavor.1411.a: "Finish what my hand has begun and admit the want."
 latria_sexual_frustration_flavor.1411.b: "Take my hand away and lie still until the lamp dies."
 latria_sexual_frustration_flavor.1411.c: "Put on a robe and sit with the quiet until it loosens."

 latria_sexual_frustration_flavor.1412.t: "More Than I Meant"
 latria_sexual_frustration_flavor.1412.desc: "The hall is loud with the last of the wine and I have said too much already. My neighbor asked where I learned such a story and I told them, and then I told them the rest, the part I have never said aloud in daylight.\n\nSomeone laughs and calls for more. I hear my own voice going on, faster, adding the detail I always leave out, the hour, the door, the way I waited. The wine has made my face hot. A cup is set down somewhere behind me. I cannot make myself stop at the place where a careful person would stop.\n\nMy neighbor's chair scrapes back. The music has ended and no one has yet gone home, and the hall smells of tallow and spilled wine, and I am still holding the cup I meant to put down."
 latria_sexual_frustration_flavor.1412.a: "Say the rest of it and let the whole table hear."
 latria_sexual_frustration_flavor.1412.b: "Bow to the company, keep the rest behind my teeth, and go."
 latria_sexual_frustration_flavor.1412.c: "Turn the talk to old friends and let the wine do the rest."

 latria_sexual_frustration_flavor.1413.t: "The Same Three Lines"
 latria_sexual_frustration_flavor.1413.desc: "I kneel at the altar with my nightgown under my knees and the stone cold through the cloth. The flagstones have taken the warmth out of my shins. The attendant has gone. I have recited the whole office and my mouth keeps returning to the same three lines, the ones about the flesh, as if the words were a door I keep walking past.\n\nBy day I can name this a trial and be done with it. Here, with the candles guttering and no one to see, I can only measure how much of me means to leave the temple and reach a particular house before the watch changes. The wanting has a weight. My knees ache from carrying it.\n\nThe candle nearest me bends, then rights itself. I put my hand on the cold stone and do not rise."
 latria_sexual_frustration_flavor.1413.a: "Leave the office unfinished and go where I want to go."
 latria_sexual_frustration_flavor.1413.b: "Keep the vigil and hold to the words until dawn."
 latria_sexual_frustration_flavor.1413.c: "Read the passage slowly and let the sense come back to me."

 latria_sexual_frustration_flavor.1414.t: "The Ride Does Not Help"
 latria_sexual_frustration_flavor.1414.desc: "We have been in the saddle since before light and the deer are still ahead of us. My hands are steady on the reins. That is the trouble. Everything else in me is not steady, has not been for days, and the ride has only shaken it loose.\n\nI keep seeing that person at the last hunt, laughing, hair wet from the stream, and I cannot put the image away. The hounds open. I let the horse have its head and the ground goes by fast, and for a few lengths I am not thinking of anything at all.\n\nThen the wood closes and the pace drops and all of it comes back. I sit in the saddle with my thighs burning, the horn's strap worn into a mark on my hip, and I do not raise it."
 latria_sexual_frustration_flavor.1414.a: "Break from the line and ride until the thought is out of me."
 latria_sexual_frustration_flavor.1414.b: "Hold the line, take the horn, and keep the hunt's order."
 latria_sexual_frustration_flavor.1414.c: "Read the ground the huntsman points out and follow the tracks."

 latria_sexual_frustration_flavor.1415.t: "The Door Barred"
 latria_sexual_frustration_flavor.1415.desc: "The lamp is low and the door is barred and the person I have wanted for a year is here, in my chamber, unclothed, with their hand flat on my chest. Their hand is warm through the cloth.\n\nI draw them down onto the bed and the weight of them is real, the heat of the skin, the small sound at my ear. The bed ropes creak under us. I have imagined this so often that the fact of it nearly undoes me before anything has happened. My hips lift. Their mouth finds my throat and I stop keeping count of my own breath.\n\nAfterward the lamp is still burning, a long thread of wax run down the holder. Their hair is spread across my arm and neither of us has said a word about morning."
 latria_sexual_frustration_flavor.1415.a: "Keep them here and let the household talk if it must."
 latria_sexual_frustration_flavor.1415.b: "Send them back to their own room and lie down alone."
 latria_sexual_frustration_flavor.1415.c: "Reach for a book and read until my hands are quiet."

 latria_sexual_frustration_flavor.1416.t: "The Wrist Across the Table"
 latria_sexual_frustration_flavor.1416.desc: "Council has run long and I have signed nothing. My seal sits cold beside the ink. The fire has been let go out and no one has called for wood. My clerk reads the next line and I hear the shape of the words without the sense, because the person across the table has their sleeve pushed back and I am looking at their wrist.\n\nMy confidant catches my eye. I make myself ask for the clause to be read again. It is read again. I understand none of it. Under the table my knee has begun to move and I press it still with my hand.\n\nWhen the lords rise I stay seated until the room has emptied. My confidant waits by the door with the papers, saying nothing, and I am grateful and cannot look at them."
 latria_sexual_frustration_flavor.1416.a: "Dismiss the council and take the afternoon for myself."
 latria_sexual_frustration_flavor.1416.b: "Keep my seat, take the papers, and confess it to my confidant."
 latria_sexual_frustration_flavor.1416.c: "Call the clerk back and settle every clause before I rise."

 latria_sexual_frustration_flavor.1417.t: "The Same Question Twice"
 latria_sexual_frustration_flavor.1417.desc: "The temple is empty and my guide is still here, sorting the scrolls, and I have not left because I cannot make myself leave. I asked a question about the rite and then asked another, and both were the same question wearing different clothes.\n\nMy guide answers patiently. The scrolls smell of dust and cedar oil. I watch the hands move among them and think about the hour of the night, and how far the walk is to a certain door, and whether anyone would be awake. The lamp between us is the only thing keeping me in my seat.\n\nMy guide sets a scroll in front of me and waits. My knees have gone stiff on the cold step. I put my hand on the roll and read the first word and not the second."
 latria_sexual_frustration_flavor.1417.a: "Thank my guide, walk out, and go to that door."
 latria_sexual_frustration_flavor.1417.b: "Ask for the rite to be gone through once more, slowly."
 latria_sexual_frustration_flavor.1417.c: "Unroll the scroll and listen to what my guide is saying."

 latria_sexual_frustration_flavor.1418.t: "A Name in the Garden"
 latria_sexual_frustration_flavor.1418.desc: "The garden is full of people and I have drunk just enough to be honest. My cup has been filled twice without my asking. I said the thing out loud. Not the whole of it, but the part with a name in it, and the name was not a stranger's.\n\nThe laughter went round the group and someone repeated it and someone else looked at me with new interest. The gravel shows where the circle has shifted. I should have let it pass as wine. Instead I have said more, and the circle has gone quiet in the way a circle does when it has decided to remember.\n\nA servant moves along the path with a tray. I take a cup I do not want and hold it against my mouth so I will not fill the silence."
 latria_sexual_frustration_flavor.1418.a: "Say the name again, clearly, before all of them."
 latria_sexual_frustration_flavor.1418.b: "Make a bow, take my leave, and quit the garden."
 latria_sexual_frustration_flavor.1418.c: "Draw the nearest guest aside and talk of something else."

 latria_sexual_frustration_flavor.1419.t: "Since the Corridor"
 latria_sexual_frustration_flavor.1419.desc: "I have got the door bolted and the covers back and I am not going to pretend any longer that I am too tired. My body has been like this since the afternoon, since a hand on my arm in the corridor, and it has not settled.\n\nI put my fingers to myself and my breath goes out of me in a way I would not want heard. I think of the corridor, the linen of that sleeve, the exact pressure of the fingers. My back arches off the bed. I have to put my other hand over my mouth.\n\nIt takes a long time and leaves me shaking. The lamp is still lit. I lie with my arm across my eyes and the sheets twisted to my waist, still smelling of the day's heat, and the wanting is not gone, only quieter."
 latria_sexual_frustration_flavor.1419.a: "Let it take its course and stop pretending I am tired."
 latria_sexual_frustration_flavor.1419.b: "Clench my hands, breathe slow, and wait for the shaking to pass."
 latria_sexual_frustration_flavor.1419.c: "Read a page by lamplight until my body quiets."

 latria_sexual_frustration_flavor.1420.t: "Two Days in the Saddle"
 latria_sexual_frustration_flavor.1420.desc: "Two days in the saddle and the steppe goes on forever. The saddle has worn a sore under my knee. My horse knows the pace better than I do. I have not slept properly since we left the camp, and it is not the ground I lie on that keeps me awake.\n\nI think of that person braiding their hair by the fire, the way they bit the end of the thread. The wind is cold and my hands are cracked and still the thought comes back and settles low in me, insistent, like a second heartbeat.\n\nWe crest a rise and the grass goes down to the river, a pale line with no sound in it. I could turn back alone. The horse shifts under me, waiting, and I sit there with the reins loose and do not turn."
 latria_sexual_frustration_flavor.1420.a: "Turn back for the camp and take what the night offers."
 latria_sexual_frustration_flavor.1420.b: "Ride on with the others and keep the pace."
 latria_sexual_frustration_flavor.1420.c: "Loose the falcon and follow its flight to the water."

 latria_sexual_frustration_flavor.1421.t: "Past Careful"
 latria_sexual_frustration_flavor.1421.desc: "The feast has gone on past the point where anyone is careful. I have been watching that person all evening, have not looked away once, and I have just said so, to the room, in a voice that carried.\n\nA cup goes over. The musicians have not started again. Someone laughs, someone calls for them, and I am on my feet with the words still coming. I have named the hour I want and the place, and the room has heard it. There is no version of tomorrow in which this is only a jest.\n\nMy neighbor pulls at my sleeve. I sit down because my legs have gone uncertain, wax has run across the table to my sleeve, and the cup is set back in my hand, and I am still looking across the table."
 latria_sexual_frustration_flavor.1421.a: "Say the hour and the place again so no one mishears."
 latria_sexual_frustration_flavor.1421.b: "Sit, drink, and let the noise close over what I said."
 latria_sexual_frustration_flavor.1421.c: "Turn to my neighbor and ask about their own household."
 latria_sexual_frustration_flavor.1421.d: "Put the whole of it into a poem for the table."

 latria_sexual_frustration_flavor.1422.t: "Three Nights of Vigil"
 latria_sexual_frustration_flavor.1422.desc: "I have kept the vigil three nights running and the fasting has made me light in the head. The cold has got into the small bones of my feet. The words of the office are in my mouth and the person is in my mind, and the two have got tangled past separating.\n\nI know what the vow asks. I said it willingly and I have not said it unwillingly until tonight. My hands are cold and my stomach has forgotten what bread is. The stone under my knees has worn a smooth place and I fit into it as if I had knelt here for years, which in the way that matters I have.\n\nA brother coughs somewhere in the dark, and someone shifts on a bench behind the pillar. I bow my head lower and the prayer goes on without my voice."
 latria_sexual_frustration_flavor.1422.a: "Break the fast, leave the vigil, and admit what I want."
 latria_sexual_frustration_flavor.1422.b: "Keep the fast and hold the vow through the rest of the night."
 latria_sexual_frustration_flavor.1422.c: "Turn to the passage on the soul and read it through."

 latria_sexual_frustration_flavor.1423.t: "The Wrong Figure"
 latria_sexual_frustration_flavor.1423.desc: "The accounts do not balance and I have read the same column four times. The candle is new and the wax has not run. Across the chamber someone is dictating to a clerk, and the voice is one I would know in a crowd, and my mind has left the column entirely.\n\nI put my finger on the page to hold my place. It does not hold. The clerk's pen keeps moving. I can feel my own pulse in my throat, which is absurd, and the room is cold, and I am not cold.\n\nWhen the dictation stops I look up too quickly. The clerk is waiting. I ask for the figure again and write down the wrong one, and the ink is drying on it, and I do not correct it until the chamber has cleared."
 latria_sexual_frustration_flavor.1423.a: "Set the accounts aside and go where the voice is going."
 latria_sexual_frustration_flavor.1423.b: "Hold to the column until every figure is right."
 latria_sexual_frustration_flavor.1423.c: "Send for the ledger and check each entry from the first."

 latria_sexual_frustration_flavor.1424.t: "The Wine Untouched"
 latria_sexual_frustration_flavor.1424.desc: "The door is latched and the wine is untouched and the person I have wanted is here with their robe open and their hands on my face. Their hands are cold at first and then not.\n\nI pull them against me and the whole of it is warmer and clumsier than anything I imagined. Their knee finds the bed and the frame knocks once against the wall. My hand goes to the small of their back and lower, and the sound they make is not quiet, and I do not care who hears it. I am shaking with how long I have waited.\n\nLater the lamp has burned down and the wine has gone warm in the cup. Their head is on my shoulder, my arm is asleep under it, and I am listening to them breathe."
 latria_sexual_frustration_flavor.1424.a: "Tell them plainly what the year of waiting has cost me."
 latria_sexual_frustration_flavor.1424.b: "Draw back, put the robe straight, and keep my hands to myself."
 latria_sexual_frustration_flavor.1424.c: "Lie still and read by the low lamp until sleep comes."

 latria_sexual_frustration_flavor.1425.t: "Diligent Hands"
 latria_sexual_frustration_flavor.1425.desc: "I have been three days in the forest and the hunting has been good and none of it has touched the thing in me. I am diligent. I rise before the others, I see the gear dried, I take the line the huntsman sets me. My hands do what they are told.\n\nThe rest of me is elsewhere. I remember a particular afternoon, a doorway, a person saying my name in a way I have not been able to forget, and the memory comes while I am standing in the stirrups and again while I am cleaning the game, with the smell of the pelt on my hands.\n\nThe fire is low and the embers tick as they cool. My arms ache from the day and I lie on my back with my eyes open, listening to the horses shift."
 latria_sexual_frustration_flavor.1425.a: "Leave the line and take the roan out into the dark."
 latria_sexual_frustration_flavor.1425.b: "Breathe, tighten the girth, and finish the day's work."
 latria_sexual_frustration_flavor.1425.c: "See the gear dried and the tally kept before I sleep."

 latria_sexual_frustration_flavor.1426.t: "A Page and a Half"
 latria_sexual_frustration_flavor.1426.desc: "The study is quiet and my guide has set out the text and I have read a page and a half without taking in a word. My thumb has left a mark on the margin. The lamp is good. The night is long. There is nowhere I am expected.\n\nI keep thinking of the hour when the household sleeps and the corridor is empty. My guide turns a page and asks whether I follow the argument. I say that I do. I have not followed it since the first line about the nature of the soul, which is a pity, because it is the line I most need.\n\nMy guide waits, pen in hand, and the chair has a joint that complains when I move. I look at the page and my own hand is flat on the wood, very still, as if it belonged to someone calmer."
 latria_sexual_frustration_flavor.1426.a: "Close the book and go out while the corridor is empty."
 latria_sexual_frustration_flavor.1426.b: "Keep my seat and read the page again from the top."
 latria_sexual_frustration_flavor.1426.c: "Ask my guide to go over the argument once more."

 latria_sexual_frustration_flavor.1427.t: "Generous with the Wine"
 latria_sexual_frustration_flavor.1427.desc: "I have been generous with the wine and the company has been generous back, and somewhere in it I have told the table what I want. Not plainly. Plainly enough. There is a person here whose name I said and whose face I did not look at while saying it.\n\nSomeone has stopped laughing, and a dog is worrying something under the bench. My cup is empty and a servant fills it and I let them. The room has the stillness of people deciding what to do with a thing they have been handed.\n\nMy sister's place is empty tonight and her cup is still where the servant set it, which is a mercy I do not deserve. I put both hands on the table and the wood is cool and the music starts again on the far side of the hall."
 latria_sexual_frustration_flavor.1427.a: "Say it once more, with the name, and let the family hear."
 latria_sexual_frustration_flavor.1427.b: "Thank the company, take my cloak, and go."
 latria_sexual_frustration_flavor.1427.c: "Fill the cups round and turn the talk to the harvest."
 latria_sexual_frustration_flavor.1427.d: "Match jests with the loudest guest until the room moves on."

 latria_sexual_frustration_flavor.1428.t: "The Icons Are Watching"
 latria_sexual_frustration_flavor.1428.desc: "The temple is cold and the icons are all watching and I have not moved in an hour. My knees have gone numb. The desire has not. It sits in me like a coal that will not be covered. The candle smoke goes straight up, without a draft.\n\nI have prayed for release and I have prayed for strength and I am honest enough, here, to know which one I want answered. That person's face comes up between me and the gold. I do not push it away. The lamp smells of oil and the marble is cold and my body is not interested in either.\n\nThe priest's footsteps pass behind me. I keep my head down and my hands together, my knees leaving two damp prints on the stone, and my mind on a doorway across the city."
 latria_sexual_frustration_flavor.1428.a: "Rise, cross the city, and let the icons keep their watch."
 latria_sexual_frustration_flavor.1428.b: "Hold the vow and stay on the marble until the office ends."
 latria_sexual_frustration_flavor.1428.c: "Open the book at the psalms and read until the words hold."

 latria_sexual_frustration_flavor.1429.t: "The Wall at Midsummer"
 latria_sexual_frustration_flavor.1429.desc: "The garden at this hour belongs to no one and I am in it because the bed was worse. The night is warm. The gravel path has kept the day's heat. Somewhere a fountain is running, the only voice in the garden, and the smell of the herbs is strong enough to taste.\n\nI have not slept in two nights. I walk the path and the gravel is loud and every turn brings me back to the same wall, the one I stood against with that person at midsummer, saying nothing, both of us knowing.\n\nMy hand is on the stone. It is still warm. A moth keeps returning to the lamp behind me. I stand there with my forehead near the wall and my breath going badly, and the fountain keeps on."
 latria_sexual_frustration_flavor.1429.a: "Walk out of the gate and say it to the night."
 latria_sexual_frustration_flavor.1429.b: "Keep the vow, take my hand from the wall, and go in."
 latria_sexual_frustration_flavor.1429.c: "Walk the path until the sky greys and my legs are tired."

 latria_sexual_frustration_flavor.1430.t: "The Strings Are Cold"
 latria_sexual_frustration_flavor.1430.desc: "I have taken out the instrument because the house is asleep and I could not lie there any longer. The strings are cold and the plectrum is worn thin on one side. I play the thing I always play and it is not enough, has not been enough for a week.\n\nMy fingers know the pattern and the rest of me is somewhere else entirely, in a room with the shutters still closed, on an afternoon I keep returning to. The notes go out into the dark and nobody hears them.\n\nI stop with my hand flat over the strings to kill the sound. The silence afterward is worse. I sit with the instrument across my knees, the strings gone slack in the cold, my head back against the chair and the window going grey at the edge."
 latria_sexual_frustration_flavor.1430.a: "Play it through, badly, until the whole house hears."
 latria_sexual_frustration_flavor.1430.b: "Set the instrument down and sit out the rest of the night."
 latria_sexual_frustration_flavor.1430.c: "Set out the board and play both sides until the light comes."

 latria_sexual_frustration_flavor.1431.t: "The Seam in the Dark"
 latria_sexual_frustration_flavor.1431.desc: "The candle guttered an hour ago and I have not pulled the cover up. My nightgown is rucked about my waist. My fingers have found the seam of it and then gone beneath, slow, the way I have taught myself when the corridors are quiet. I keep my eyes shut and bring back the steward who poured my wine last week, the way their sleeve brushed my wrist and stayed a breath too long.\n\nMy breath catches and holds. I move my hand and the wanting draws tighter, lower, a knot pulled at both ends. I think of their mouth near my ear, of the words they did not finish. The linen is warm and damp under my palm.\n\nA board creaks in the passage. My hand stills, then starts again, and I let it, and the dark keeps my secret a moment longer."
 latria_sexual_frustration_flavor.1431.a: "Finish it in the dark and own the hunger."
 latria_sexual_frustration_flavor.1431.b: "Draw my hand back and lie rigid till the wick drowns."
 latria_sexual_frustration_flavor.1431.c: "Wrap the cover round me and wait for the ache to slacken."

 latria_sexual_frustration_flavor.1432.t: "Vespers Unfinished"
 latria_sexual_frustration_flavor.1432.desc: "The chapel has emptied and I kneel in my nightgown on the cold stone, my prayers gone thin and wandering. The priest who heard me last rested their hand on my bowed head and let it stay, and I have not been able to put the weight of it down since. My palms press my thighs through the thin cloth and the pressing is not prayer.\n\nI shift on my knees. The stone is a shock through the linen. I think of that hand, the warmth of it, the way I leaned a fraction into it before I caught myself. My breath goes ragged in the vaulted quiet and I press harder, seeking and not finding the release I came to beg for.\n\nThe bell rope hangs still above me. I lift my face to the dark altar and keep my hands where they are."
 latria_sexual_frustration_flavor.1432.a: "Let the body have what the prayer denied it."
 latria_sexual_frustration_flavor.1432.b: "Clasp my hands and hold the vigil till dawn."
 latria_sexual_frustration_flavor.1432.c: "Open the book and read until the words cool me."

 latria_sexual_frustration_flavor.1433.t: "The Bracken Bed"
 latria_sexual_frustration_flavor.1433.desc: "The hunt scattered at dusk and I am alone in the green dark with my horse cropping nearby. I slide down against a mossy trunk and my riding clothes are damp with sweat. The memory that hunts me is the huntsman who caught me round the waist to lift me over the stream, their chest hard against my back, their breath at my neck. My hand has slipped inside my belt.\n\nI press and the bark bites my shoulder. I think of their arms, of the way they did not let go at once. My breath smokes in the cold air. The wanting coils tighter with each slow stroke and the forest holds its hush around me, the leaves dripping somewhere out of sight.\n\nA twig snaps. My hand freezes. The horse lifts its head, and I stay against the tree with my pulse loud in my ears."
 latria_sexual_frustration_flavor.1433.a: "Take the edge off here against the tree."
 latria_sexual_frustration_flavor.1433.b: "Withdraw my hand and breathe slow till it passes."
 latria_sexual_frustration_flavor.1433.c: "Rise and walk the horse back through the trees."

 latria_sexual_frustration_flavor.1434.t: "The Unsent Note"
 latria_sexual_frustration_flavor.1434.desc: "The study fire is low and the letter lies half-written under my hand, the one I will not send. I read the last line I set down, an honest line, too honest, and my other hand has crept to the laces of my hose. I think of the envoy who stood too close over this same desk and read my face instead of the map, and smiled.\n\nI work the laces loose. My breath shortens. I bring back the tilt of their head, the invitation in it I was too careful to answer, and my hand moves with a will of its own, the quill dry in the other. The fire ticks. The wanting gathers and will not be reasoned down to something I can file away.\n\nThe candle leans in a draught. I close my eyes and let the thought finish what the envoy began."
 latria_sexual_frustration_flavor.1434.a: "Set down the truth and ease the ache it lit."
 latria_sexual_frustration_flavor.1434.b: "Tie the laces and withdraw with a cool word."
 latria_sexual_frustration_flavor.1434.c: "Take up the map and weigh the matter cold."

 latria_sexual_frustration_flavor.1435.t: "After the Last Cup"
 latria_sexual_frustration_flavor.1435.desc: "The feast has thinned to a few guttering candles and the guest across from me has not gone. Under the table my knee has come to rest against theirs and neither of us has moved it. The wine hums in me. I think of the way they laughed at my jest and leaned in, close enough that I could have turned my mouth the small distance to theirs.\n\nMy free hand grips the bench. I want to close that gap more than I have wanted anything in an age, and the wanting is a bright wire drawn tight from my throat to my belly. They watch me over the rim of the cup. The last servant has gone. The hall smells of spent tallow and the two of us breathing.\n\nTheir knee presses back, once. My hand leaves the bench and finds the edge of their sleeve, and neither of us speaks."
 latria_sexual_frustration_flavor.1435.a: "Let the music cover what I do next."
 latria_sexual_frustration_flavor.1435.b: "Bow my head and school the want into a prayer."
 latria_sexual_frustration_flavor.1435.c: "Propose a game and let the board cool my blood."
