l_english:
 latria_sexual_frustration_flavor.1311.t: "Before the Household Wakes"
 latria_sexual_frustration_flavor.1311.desc: "I wake before the household with my nightgown rucked up past my thighs and my hand already pressed between them. I do not take it away. The dream is still on me, the weight of someone who was not in this room, and my body means to finish what the dream began.\n\nI keep my eyes shut and let it go on, my breath shortening, the heel of my hand keeping the slow rhythm I have learned by now. There is a name behind my teeth. I do not say it, not with the corridor boards creaking under a servant's step.\n\nWhen it breaks I lie still with my fingers wet and the sheet damp under my hip. The step goes past the door and on. I pull the nightgown down and the cloth sticks."
 latria_sexual_frustration_flavor.1311.a: "Let it finish, then dress for the day."
 latria_sexual_frustration_flavor.1311.b: "Take my hand away and lie still until the bell."
 latria_sexual_frustration_flavor.1311.c: "Get up, wash, and sit with the ache a while."

 latria_sexual_frustration_flavor.1312.t: "The Graft on the Pear Tree"
 latria_sexual_frustration_flavor.1312.desc: "The garden is still wet from the night's rain, and the person I have been avoiding all week is showing me the new graft on the pear tree. Their fingers close over mine to move them along the cut. Neither of us lets go once the demonstration is finished.\n\nI can feel the pulse in their thumb against my wrist. Behind the hedge two of my household are arguing about a saddle. If I turned my head a little, and they turned theirs, we would be doing something no one could mistake for horticulture.\n\nThey say the graft will take by autumn. Their hand is still on mine. A branch drips onto my sleeve and I do not wipe it away."
 latria_sexual_frustration_flavor.1312.a: "Say plainly what I want, here under the tree."
 latria_sexual_frustration_flavor.1312.b: "Thank them for the lesson and step back."
 latria_sexual_frustration_flavor.1312.c: "Stay, and tell them one true thing instead."

 latria_sexual_frustration_flavor.1313.t: "Across the Table"
 latria_sexual_frustration_flavor.1313.desc: "The cups have gone round twice and the hall is loud enough that nobody is listening to any one person. I have been watching the same guest across the table for an hour, the line of their throat when they laugh.\n\nI could say it. Not the whole of it, only enough that they would know I am not talking about the weather. My neighbour would hear. So would the steward at the end of the table, who repeats everything they are told to the household.\n\nThey turn their cup by the stem and look at me over it. I open my mouth. The musicians start up again and whatever I might have said goes under the drum."
 latria_sexual_frustration_flavor.1313.a: "Say it loudly enough to be heard."
 latria_sexual_frustration_flavor.1313.b: "Hold my tongue and let the wine do its work."
 latria_sexual_frustration_flavor.1313.c: "Turn to my neighbour and make a game of it."

 latria_sexual_frustration_flavor.1314.t: "The First Word"
 latria_sexual_frustration_flavor.1314.desc: "I have knelt on the cold stone long enough that the flagstones have printed themselves into my shins, and the words have stopped being words. My mind keeps going back to a mouth I have no business remembering inside this building, the way it opened, the sound that came out of it.\n\nMy guide waits at the lectern with the patience of someone who has heard every confession there is. I could tell them. The telling would be a door I cannot close again, and my body wants that door left open, tonight, with the lamp still burning.\n\nI get as far as the first word. The candle between us leans in a draught and I watch the wax run down over the iron and harden there."
 latria_sexual_frustration_flavor.1314.a: "Tell them, and let the temple judge me."
 latria_sexual_frustration_flavor.1314.b: "Keep the confession and take the penance."
 latria_sexual_frustration_flavor.1314.c: "Ask for a book and read until the shaking stops."
 latria_sexual_frustration_flavor.1314.d: "Keep the vigil until morning."

 latria_sexual_frustration_flavor.1315.t: "Alder Scrub"
 latria_sexual_frustration_flavor.1315.desc: "The hunt has scattered and I have gone after a boar that was never there. The person I wanted to be alone with finds me in the alder scrub with my breeches open and my hand on myself, and does not turn away.\n\nThey kneel down in the wet leaves. I have one hand in their hair and the other braced on a trunk, and the horns are sounding somewhere off to the east, close enough that we should not. Neither of us stops. They take me into their mouth and I have to bite the inside of my cheek to keep quiet.\n\nAfterwards my knees are filthy and there is a leaf stuck to my thigh. They wipe their mouth with the back of their wrist and say the boar went north."
 latria_sexual_frustration_flavor.1315.a: "Let the hunt go on without me."
 latria_sexual_frustration_flavor.1315.b: "Get back in the saddle and earn my place."
 latria_sexual_frustration_flavor.1315.c: "Read the ground and follow the tracks."

 latria_sexual_frustration_flavor.1316.t: "The Crooked Seal"
 latria_sexual_frustration_flavor.1316.desc: "The council has been at the same petition for an hour and I have signed nothing. Under the table my hands are in my lap, and I am thinking about the last night of the campaign, the tent, the person who came in without knocking and did not leave until the watch changed.\n\nMy chancellor asks whether I agree. I say that I do, and have no idea what I have agreed to. The seal is warm from my ring. I press it into the wax and the mark comes out crooked, the letters doubled at one edge.\n\nThey file out with their papers. I stay in the chair with the crooked seal in front of me and the room still smelling of other people's candles."
 latria_sexual_frustration_flavor.1316.a: "Send for the one I am thinking of, seal and all."
 latria_sexual_frustration_flavor.1316.b: "Set the seal down and go back to the petitions."
 latria_sexual_frustration_flavor.1316.c: "Call the council back and finish the work."

 latria_sexual_frustration_flavor.1317.t: "A Line in the Margin"
 latria_sexual_frustration_flavor.1317.desc: "The examination hall is swept and silent and I am alone with the commentaries. The characters will not hold still. I have read the same line about restraint four times, and each time it has been about a pair of hands I let go of too late, in a corridor, with a lamp coming.\n\nIn my own hand, in the margin, I have written a line of verse that is not commentary at all. If my examiner saw it they would know what it is for, and who. I could burn the page. The brazier is three steps away and the coals are still red.\n\nI copy the line out again, more carefully, and the brush is shaking by the last stroke."
 latria_sexual_frustration_flavor.1317.a: "Copy the verse out and let it be read."
 latria_sexual_frustration_flavor.1317.b: "Close the book and sleep on the mat."
 latria_sexual_frustration_flavor.1317.c: "Return to the commentaries and start again."
 latria_sexual_frustration_flavor.1317.d: "Set the verse to the tune the courtiers sing."

 latria_sexual_frustration_flavor.1318.t: "Two Cups in the Courtyard"
 latria_sexual_frustration_flavor.1318.desc: "The feast has emptied into the courtyard and my oldest friend has followed me out with two cups. I have told no one, not a priest, not a servant, not the person concerned. Tonight the wine has made the not telling heavy, the way a full cup is heavy.\n\nI could put it in their hands and let them carry some of it. They would not laugh. They would also not forget, and every time they looked at me across a hall there would be this between us, a thing with a name.\n\nThey hand me a cup and wait, and the fountain keeps running behind them. I drink it down and the ice cracks and settles."
 latria_sexual_frustration_flavor.1318.a: "Say it out loud and let them keep it."
 latria_sexual_frustration_flavor.1318.b: "Swear off it and mean it for tonight."
 latria_sexual_frustration_flavor.1318.c: "Read to them until the courtyard empties."

 latria_sexual_frustration_flavor.1319.t: "The Garden Wall"
 latria_sexual_frustration_flavor.1319.desc: "They have their back against the garden wall with their skirts pushed up over their hips, and my hand is between their legs where anyone walking the path could see. They are wet already. They have been since the corridor.\n\nI get two fingers into them and they catch my wrist and hold me there, harder, their forehead against my shoulder. Their breath goes ragged. On the other side of the wall a gardener is still working, the blade of a spade ringing on stones.\n\nThey shudder and their nails close on my arm. When they can stand they smooth their skirts down and say my name once, quietly, like a question they have already answered."
 latria_sexual_frustration_flavor.1319.a: "Stay with them until they can walk."
 latria_sexual_frustration_flavor.1319.b: "Take my hand back and wish them good evening."
 latria_sexual_frustration_flavor.1319.c: "Walk the long way round the wall alone."

 latria_sexual_frustration_flavor.1320.t: "A Catalogue"
 latria_sexual_frustration_flavor.1320.desc: "I came to the temple to be rid of it and instead I am on my knees cataloguing it: the smell of a particular neck, the sound a particular person makes, the exact weight of a body against mine in a doorway, one hand flat on the frame.\n\nMy guide is awake and reading. I could ask them for a penance and they would give me one, and I would do it, and by the third night I would be back on this stone with the same list, longer.\n\nI ask instead for a book. They give me one without a word, marking their place with their thumb, and I hold it open and do not read a line."
 latria_sexual_frustration_flavor.1320.a: "Name it all, and let the temple answer."
 latria_sexual_frustration_flavor.1320.b: "Ask for the penance and keep my list."
 latria_sexual_frustration_flavor.1320.c: "Listen to what they are willing to tell me."

 latria_sexual_frustration_flavor.1321.t: "Three Weeks on the Road"
 latria_sexual_frustration_flavor.1321.desc: "We have been three weeks on the road and I have not been alone with anyone since the last town. My horse is unsaddled, the fire is low, and the others are asleep in their cloaks at arm's length from me, close enough that I can hear one of them grinding their teeth.\n\nI lie with my hand inside my shirt and my teeth in my own knuckle, listening to the horses shift and the sentry's boots in the leaves. It takes a long time, and when it is done I am not satisfied, only tired, and the wanting is still there under the tiredness.\n\nThe sentry comes back past the fire and does not look at me. I pull my cloak up and watch the embers go grey."
 latria_sexual_frustration_flavor.1321.a: "Take what the night allows and sleep."
 latria_sexual_frustration_flavor.1321.b: "Get up and take my turn at the watch."
 latria_sexual_frustration_flavor.1321.c: "Drill alone until my arms shake."

 latria_sexual_frustration_flavor.1322.t: "The Envoy's Cup"
 latria_sexual_frustration_flavor.1322.desc: "The embassy's table is laid for twelve and I am seated beside their envoy, whose people have a custom about hospitality that I have been thinking about since the introductions, through the fish, through the second pour.\n\nThey refill my cup themselves, which their steward does not like. If I said the wrong thing here it would be in a dispatch by the next ship, in my name, in a hand not mine. If I said the right thing it would also be in a dispatch, and read aloud in a room I will never enter.\n\nThey ask a question about our marriage customs. I answer it badly. The candle has burned down to the socket and neither of us has called for another."
 latria_sexual_frustration_flavor.1322.a: "Answer them the way their custom allows."
 latria_sexual_frustration_flavor.1322.b: "Wish them a good night and go."
 latria_sexual_frustration_flavor.1322.c: "Turn the talk to the treaty and hold it there."

 latria_sexual_frustration_flavor.1323.t: "The Choir in the Gallery"
 latria_sexual_frustration_flavor.1323.desc: "The choir is practising in the gallery and I am supposed to be hearing the harmony and not the mouth of the priest who is leading it, the way they shape the third line.\n\nI have taken to arriving early and leaving late. The chanting does something to the tightness in my chest that prayer does not, and I know what it is standing in for. My guide has noticed the hour I keep and has said nothing about it, which is worse than a rebuke, because it means they are waiting.\n\nThe last note dies up in the vaulting. I stay in the pew with my hands flat on my knees until the sacristan comes with their keys."
 latria_sexual_frustration_flavor.1323.a: "Sing with them and let the sound carry it."
 latria_sexual_frustration_flavor.1323.b: "Keep the rule and leave before the last verse."
 latria_sexual_frustration_flavor.1323.c: "Study the setting with my guide instead."

 latria_sexual_frustration_flavor.1324.t: "The Morning Bell"
 latria_sexual_frustration_flavor.1324.desc: "I wake tangled in the sheets with the whole of it still on me, my nightgown up under my arms, and my hand between my legs before I am properly awake. The dream is going and I chase it, hips lifting, and I do not care who is in the next room or what hour the bell is.\n\nIt comes in a rush that leaves my thigh shaking. I lie there with my fingers still inside myself and my breath loud in the quiet, and the sheet is soaked through under me, cold already where the air reaches it.\n\nThe bell for the morning office starts. I pull the wet sheet free and put it in the basin, and the water goes cloudy."
 latria_sexual_frustration_flavor.1324.a: "Finish, wash, and answer the bell."
 latria_sexual_frustration_flavor.1324.b: "Drag the sheet off and go without washing."
 latria_sexual_frustration_flavor.1324.c: "Sit at the board until my hands are steady."

 latria_sexual_frustration_flavor.1325.t: "The Door"
 latria_sexual_frustration_flavor.1325.desc: "There is a game going in the corner and I have lost three rounds because I keep looking at the door. The person I am waiting for is late, and everyone in this hall knows who I am, and who I am married to, and which of them is watching me.\n\nI could stand up on the bench and say it. The room would go quiet the way rooms do, and by morning it would be in every hall from here to the coast, with my name attached and my family's name after it, and the two names would not be separated again.\n\nThe door opens. It is a servant with more wine. I hold my cup out and my hand is steady, which is worse."
 latria_sexual_frustration_flavor.1325.a: "Stand up and say it to the whole hall."
 latria_sexual_frustration_flavor.1325.b: "Stay seated and let the game go on."
 latria_sexual_frustration_flavor.1325.c: "Find my friend and sit with them instead."

 latria_sexual_frustration_flavor.1326.t: "The Accounts"
 latria_sexual_frustration_flavor.1326.desc: "The steward has laid out the accounts, the map, and the list of my obligations, and I have read none of them. I am thinking about a door in a town I passed through in the spring, and the way someone said my name in the dark behind it, twice, before the latch lifted.\n\nThere is a great deal to do and I am the one who must do it. I dip the pen and write the first figure and it is wrong, and I strike it through so hard the nib splits and ink goes across the column.\n\nI trim the pen and begin again. Outside the window the garrison is drilling and the shouting keeps time."
 latria_sexual_frustration_flavor.1326.a: "Leave the accounts and send for that town."
 latria_sexual_frustration_flavor.1326.b: "Put the pen down and take up the ledger."
 latria_sexual_frustration_flavor.1326.c: "Work through the list until the candles gutter."

 latria_sexual_frustration_flavor.1327.t: "The Rise"
 latria_sexual_frustration_flavor.1327.desc: "We have ridden since dawn and the grass is empty in every direction, no tree, no rider, nothing to the edge of the sky. My body has been complaining since the second day in the saddle, and the riding itself has done nothing to quiet it; it has only made it worse.\n\nI pull up at the top of the rise, get my hand down my breeches, and finish it in a few hard strokes with the wind in my face and no one within sight of me, the horse shifting under me the whole time.\n\nI knot the drawstring and ride down to them. My cousin asks why I am smiling and I tell them the horse is a good one."
 latria_sexual_frustration_flavor.1327.a: "Take the moment the steppe gives me."
 latria_sexual_frustration_flavor.1327.b: "Ride on and put it out of mind."
 latria_sexual_frustration_flavor.1327.c: "Fly the falcon until my arms are tired."

 latria_sexual_frustration_flavor.1328.t: "Vigil"
 latria_sexual_frustration_flavor.1328.desc: "I have been in the temple since the office and I am still here. The lamp has been filled twice and the oil smells of the cheap press. My knees have gone from pain to a kind of numbness and the wanting has not gone anywhere; it has settled in and made itself comfortable.\n\nVigil is meant to empty a person. It has given the wanting room instead, the way a dark room gives a shape to whatever stands in it. I could go. The door is not locked and the town is not far.\n\nI begin the psalm again from the beginning. My voice comes out steady and I hate it a little."
 latria_sexual_frustration_flavor.1328.a: "Break the vigil and go out into the town."
 latria_sexual_frustration_flavor.1328.b: "Keep the vigil until the sky greys."
 latria_sexual_frustration_flavor.1328.c: "Read the psalter through to the end."

 latria_sexual_frustration_flavor.1329.t: "Four Lines"
 latria_sexual_frustration_flavor.1329.desc: "I am in my nightgown at the window and there is a letter on the sill that I have written and not sent. Four lines. The last one says what I want in words I would not use in daylight, and the ink is dry, and the seal is unbroken.\n\nI could give it to the servant at the door. I could also burn it, and I have burned three others, and the ash is still in the brazier. My body is not interested in the burning. It wants the answer that comes after the giving.\n\nThe candle is down to a stub and the wax has run over the rim. I read the last line again and the paper shakes in my hand."
 latria_sexual_frustration_flavor.1329.a: "Give the letter to the servant."
 latria_sexual_frustration_flavor.1329.b: "Put it in the brazier and go to bed."
 latria_sexual_frustration_flavor.1329.c: "Sit by the window until the stub goes out."

 latria_sexual_frustration_flavor.1330.t: "The Border Clause"
 latria_sexual_frustration_flavor.1330.desc: "My tutor's study smells of dust and cold ink and I have not taken in a word of the treaty. They are explaining the clause about the border and I am watching their hands, the ink on the side of their finger, the way they hold the page down.\n\nThey are old enough to be my parent and twice as careful, and there is nothing in it and there does not need to be. The wanting does not ask permission. It sits in me while they turn the page and find the next clause with their nail.\n\nThey ask whether I have understood. I say yes. They look at me a moment longer than the question needs and then go back to the page."
 latria_sexual_frustration_flavor.1330.a: "Write a verse about the border instead."
 latria_sexual_frustration_flavor.1330.b: "Ask them to hear a confession."
 latria_sexual_frustration_flavor.1330.c: "Name the clause back to them, word for word."

 latria_sexual_frustration_flavor.1331.t: "The Slow Hour"
 latria_sexual_frustration_flavor.1331.desc: "The house is asleep and I have not been, not for an hour now. My nightgown is up past my hips and my fingers have found the wet of myself without my deciding it. I keep them there and let the thought come that has been circling since the corridor, the person who leaned in to straighten my collar and did not step back after.\n\nI press and circle the way my body has taught me, slow, then not slow, my other hand flat on the headboard to keep it from knocking the wall. There is a servant's door below and a stair that complains. I do not stop. My breath goes ragged and I turn my face into the pillow to swallow the sound.\n\nIt breaks and I lie with my fingers still against myself, the pulse going on under them. The stair complains once more and settles. I draw the nightgown down and the cloth is damp and clings."
 latria_sexual_frustration_flavor.1331.a: "Let it finish, then dress before the bell."
 latria_sexual_frustration_flavor.1331.b: "Take my hand away and lie still."
 latria_sexual_frustration_flavor.1331.c: "Wash, and sit with the ache until it dulls."

 latria_sexual_frustration_flavor.1332.t: "The Cold Nave"
 latria_sexual_frustration_flavor.1332.desc: "I came to the temple to empty myself and knelt on the cold stone until the wanting only settled deeper. It has a face now, the person I confessed to at the feast, the way they listened with their head tilted, the way their thumb moved on the cup. My hand is under my robe and no one can see it in the dark of the side aisle.\n\nI keep my eyes on the altar lamp and let my fingers work, slow, my jaw tight. A door opens somewhere behind the screen and acolytes come in for the night office, their feet on the flags. I should stop. My hand does not stop. I press my forehead to my folded hands and breathe through my teeth.\n\nIt passes and leaves me hollow and shaking. The acolytes begin the psalm. I stay kneeling until my legs go numb and the lamp is the only thing I can look at."
 latria_sexual_frustration_flavor.1332.a: "Name it in the confessional and take the penance."
 latria_sexual_frustration_flavor.1332.b: "Keep the vigil until the sky greys."
 latria_sexual_frustration_flavor.1332.c: "Read the psalter through to the end."

 latria_sexual_frustration_flavor.1333.t: "The Green Hollow"
 latria_sexual_frustration_flavor.1333.desc: "I have drawn the one I wanted away from the hunt into a hollow where the light comes green through the leaves. My breeches are open and their hand is on me, and my hand is under their skirts, and neither of us is pretending this is about the deer. They are wet already. They have been since I caught their wrist at the ford.\n\nI get my fingers into them and they gasp and cover my mouth with their own, hard, their free hand fisted in my collar. The horns sound off through the trees, the hunt turning somewhere near. We do not stop. They rock against my hand and their breath comes in short bursts against my cheek.\n\nThey shudder and go still, gripping my wrist. The horns fade east. They straighten their skirts with shaking hands and a leaf falls out of their hair."
 latria_sexual_frustration_flavor.1333.a: "Let the hunt go on without us."
 latria_sexual_frustration_flavor.1333.b: "Get back in the saddle and earn my place."
 latria_sexual_frustration_flavor.1333.c: "Walk the long way back and cool myself."

 latria_sexual_frustration_flavor.1334.t: "The Treaty's Margin"
 latria_sexual_frustration_flavor.1334.desc: "The study is cold and the treaty lies open and I have read the same clause three times. The envoy who brought it is gone but the memory is not, the hour in the corridor when I had them against the wall with my hand up under their tunic and their mouth open on my shoulder, both of us listening for a step.\n\nMy hand has drifted to my lap under the table. I make myself take it away and press it flat on the page. The ink is dry under my palm. If I wrote what I am thinking in the margin the clerk would copy it out fair and hand it round by morning.\n\nI dip the pen and write the clause again, correctly, and my hand is not steady by the last word. The candle gutters and I trim the wick."
 latria_sexual_frustration_flavor.1334.a: "Say plainly what I want of them."
 latria_sexual_frustration_flavor.1334.b: "Wish them well and step back."
 latria_sexual_frustration_flavor.1334.c: "Set the board and play until my hands are still."

 latria_sexual_frustration_flavor.1335.t: "Behind the Tapestry"
 latria_sexual_frustration_flavor.1335.desc: "The feast is loud and the musicians are between tunes and I have got the person I have been watching all night behind the tapestry where the light does not reach. My hand is up under their gown and their back is to the wall and they are biting their own lip to keep quiet. My other hand is over their mouth, not hard, just enough.\n\nThe hall is three feet away on the other side of the cloth. A cup breaks and someone laughs. They move against my fingers and their eyes close and I feel the shudder go through them, their breath hot and fast against my palm.\n\nThey sag a little and I hold them up. Beyond the tapestry the musicians start again. They smooth their gown and slip out first, and I wait a while before I follow."
 latria_sexual_frustration_flavor.1335.a: "Slip back in and take my seat."
 latria_sexual_frustration_flavor.1335.b: "Keep my place behind the cloth a moment longer."
 latria_sexual_frustration_flavor.1335.c: "Find my friend and sit with them instead."
