l_english:
 latria_sexual_frustration_flavor.1301.t: "An Invitation Unsent"
 latria_sexual_frustration_flavor.1301.desc.female: "I sit at my desk in my nightgown, with only a name written on the page. Before the ink has dried, my maid asks from the doorway whether she should deliver it. I fold the paper once, but neither seal it nor answer her.\n\nI would not dare write that name by daylight. Now that I have written it, I can scarcely bear to leave the page before me. An invitation ought to follow; I have already chosen the place and the hour, yet my pen has gone no further than the greeting. My maid asks again, more softly this time.\n\nI look at the name. There is more in those few letters than I can bring myself to put in the rest of the invitation."
 latria_sexual_frustration_flavor.1301.desc.male: "I sit at my desk in my nightgown, with only a name written on the page. Outside, a servant waits to carry my message. His shadow shifts in the gap beneath the door, then is still.\n\nI dip my pen and hold it above the paper. I know exactly what I mean to write: tonight, at the side door, with no one else knowing. Once I set those words down, I will no longer be the only person who might read them. The wick spits, and a drop of ink falls beside the name.\n\nThe servant gives a quiet cough. I still have not sealed the letter."
 latria_sexual_frustration_flavor.1301.desc: "I have left an unsealed letter beneath the lamp for a long while. Every time I look at it, the same unfinished greeting waits for me.\n\nThere is nothing after the name. I have room for all the sentences I have considered, and have written none of them. The wax is soft, and the sealing spoon lies within reach. I leave it where it is.\n\nThe oil has fallen a little lower in the lamp. The ink of the name is still wet."
 latria_sexual_frustration_flavor.1301.a: "Finish the letter and give it to the servant."
 latria_sexual_frustration_flavor.1301.b: "Put the letter away, suppress the longing, and retire."

 latria_sexual_frustration_flavor.1302.t: "A Court's Judgment"
 latria_sexual_frustration_flavor.1302.desc.accepted: "The court poet makes a jest of an old romance, and not even the sternest nobles frown. He recounts a private encounter as lightly as an amusing mishap on a hunt. The company raises its cups, catching the light on the wine.\n\nI smile and drink with them, though the wine tastes bitter. The story concerns someone else, yet I listen as though my own lonely nights have been offered for their amusement. My neighbor touches my sleeve and asks why I have nothing to add. Only then do I notice that my laughter came too late.\n\nThe poet begins another line. I am still holding my cup in the air."
 latria_sexual_frustration_flavor.1302.desc.strict: "A noble has disgraced himself over a secret romance, and the company is discussing his family. Each remark comes slowly, with the weight of a judgment. One guest shakes his head; another begins reconsidering a marriage for his children.\n\nI listen, knowing that they could judge me by the same measure. There is an unsent letter in my room, and I have passed several nights without proper sleep. No one here has seen either. I cannot take much comfort in their ignorance while they weigh every detail of someone else's conduct.\n\nSomeone asks for my opinion. I set my cup down, and its base strikes the table with a distinct sound."
 latria_sexual_frustration_flavor.1302.desc: "I listen as the conversation at table turns to reputation and desire. At first, the company is merely trading jokes.\n\nThen someone names a particular door, and the hour at which it was opened. The laughter no longer comes so easily. I remain in my place, tightening my hands beneath the tablecloth as the story grows more precise.\n\nThe musicians continue to play. I can hear them only faintly, as though they are careful not to drown out a single word."
 latria_sexual_frustration_flavor.1302.a: "Speak of my longing, drawing the conversation back to it again and again."
 latria_sexual_frustration_flavor.1302.b: "Hold my tongue, thank my hosts, and take my leave."

 latria_sexual_frustration_flavor.1303.t: "The Midnight Bell"
 latria_sexual_frustration_flavor.1303.desc.favors: "After the bell, the priest remains beside the door. He says that desire can be directed toward good. His voice is quiet, but I hear every word in the stillness, while the candles cast his shadow across the floor before me.\n\nI no longer know whether I am willing to wait for the good he promises. Waiting has begun to feel like another precept I am expected to obey. I search for a passage that might quiet my restlessness and find none. The priest watches me as though he knows I have left half my question unspoken.\n\nThe bell still echoes among the beams. I remain kneeling, though my knees have long since grown numb."
 latria_sexual_frustration_flavor.1303.desc.condemns: "The bell sounds again and again, and each repetition of the priest's vow presses upon me. I have knelt until my knees are numb; even the chill of the stone beneath me has faded. Still I have no answer.\n\nI know every word of the vow. I am less certain that I can give my assent to all of it. When I reach the words of renunciation, I hesitate before speaking them. The priest does not correct me, but I have heard the pause clearly enough myself.\n\nThe last stroke of the bell fades. In the quiet that follows, I can hear wax dripping from the candles."
 latria_sexual_frustration_flavor.1303.desc: "Midnight prayer has brought me no peace, though the bells are still ringing. I have followed the priest through every line.\n\nEven after the final words, I remain kneeling where I began. The thought that troubled me before the prayer is still there. I wait through the echoes, with nothing more to recite and no answer to take away.\n\nThe priest closes the book. I hear the pages meet, much nearer than the sound of the bells."
 latria_sexual_frustration_flavor.1303.a: "Leave the precepts of abstinence in the temple."
 latria_sexual_frustration_flavor.1303.b: "Suppress the thought and recite the prayer once more."

 latria_sexual_frustration_flavor.1304.t: "The End of Patience"
 latria_sexual_frustration_flavor.1304.desc.lustful: "I pace the chamber in my nightgown. The chessboard my attendant brought me is still untouched. A narrow opening in the window admits the night air, but I am no more at ease than before.\n\nI have stood beside the bed, beside the table, and beside the door. No footsteps wait on the other side. I know that no one is coming, yet every distant stroke of the watch makes me listen for a knock. The pieces rattle in their box, and I turn toward the sound before noticing that my own sleeve has caught it.\n\nI return to the board and rest a hand on a pawn. I do not move it forward."
 latria_sexual_frustration_flavor.1304.desc.chaste: "I retie the sash of my nightgown, trying to make each movement seem composed. I have pulled it uncomfortably tight. The more care I take over such small things, the harder it becomes to pretend that I feel no longing.\n\nThe chessboard is still on the table. I could sit there and give the evening to a proper game. I take my place, lift a piece, and set it down again; my thoughts have already wandered elsewhere. I press my hand beneath the table, but I cannot recover the calm I meant to show.\n\nThe room is very quiet. I can almost hear the curse I have not allowed myself to utter."
 latria_sexual_frustration_flavor.1304.desc: "The room is quiet, but I can no longer sit still. I rise from my chair with nothing in particular to do.\n\nI pour water and leave it undrunk. I trim the lamp, cutting the wick too short, and the flame sinks lower. I begin one small task after another. None holds my attention long enough to bring me back to my seat.\n\nAt last I stand in the middle of the room. I do not know what to do with my hands."
 latria_sexual_frustration_flavor.1304.a: "Put the chessboard aside and think of the one I long for."
 latria_sexual_frustration_flavor.1304.b: "Return to the desk and suppress the thought."

 latria_sexual_frustration_flavor.1305.t: "A Room After Nightfall"
 latria_sexual_frustration_flavor.1305.desc.emperor: "The court has dispersed, but I remain in my chamber in formal robes. I have answered the petitions; the ink of my seal has dried, and the footsteps of the lords have faded. My private troubles have stayed behind.\n\nI begin to undo the fastening at my collar, then stop. The bed has been made so neatly that I hesitate to disturb it. I stand before the mirror for a while, still dressed for an audience, and see the weariness I have kept out of every report. There is no further petition to answer tonight.\n\nOutside, the attendants ask whether they should remove my crown. I tell them to wait before coming in."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "My companions have retired at the inn, but I remain alone in my room. My gear is packed, and tomorrow's route is written on the board behind the door. There is nothing left to stow away, yet I cannot find any peace in the room I have put in order.\n\nI sit on the edge of the bed with my boots still on. Downstairs, a drunken traveler begins to sing before a companion muffles the song. Their laughter reaches me through the floor. I listen, unable to imagine sharing in their ease tonight.\n\nI roll up the map, then spread it out again. The roads have not changed."
 latria_sexual_frustration_flavor.1305.desc.clergy: "I remain alone in my small room, still wearing my robes. The candle beside the bed has burned low. I remember the vow I recited during the day, word for word, but it has brought me no comfort tonight.\n\nI slip the prayer beads from my wrist and pass them through my fingers. Before long, I have stopped following them with the words of a prayer. I remember someone standing beneath the passage roof, and how I was the first to look away. The memory has stayed with me despite that careful gesture.\n\nThe collar of my robe chafes. I leave it on."
 latria_sexual_frustration_flavor.1305.desc.ruler: "I return to an empty chamber in my formal clothes. The guards bow outside; I hear their armor shift, and then the door is secured. Inside, there is no one with whom I can share what troubles me.\n\nI am still wearing my crown. I take it off and set it beside the pillow, then look toward the mirror. The person reflected there seems quite ready to hold court tomorrow. Only I know how little rest I am likely to have before then.\n\nI sit down beside the bed. I have forgotten to take off one of my gloves."
 latria_sexual_frustration_flavor.1305.desc: "My chamber is empty, yet I keep putting off going to bed. There is no unfinished duty to keep me up.\n\nThe lamp is still lit, my shoes are on, and my outer robe remains neatly arranged. I linger over these signs that I could still go out and receive someone. No one is waiting for me. I simply do not want to turn toward the bed that has been made.\n\nA draft enters through the window. I watch the lamplight bend and steady itself."
 latria_sexual_frustration_flavor.1305.a: "Send for a trusted acquaintance, despite the late hour, and talk at length."
 latria_sexual_frustration_flavor.1305.b: "Suppress the longing, change out of my robes, and retire."

 latria_sexual_frustration_flavor.1306.t: "A Messenger at Midnight"
 latria_sexual_frustration_flavor.1306.desc.female: "I sit beside the bed in my nightgown and hear two quiet knocks. They are not the agreed signal, only the ordinary knock my maid gives when bringing something to my room. She enters, lays down a blank sheet, and withdraws without looking toward the bed.\n\nI find the empty page harder to ignore than a letter full of words. I know whose message I am waiting for, and that none will come tonight. I carry the paper to the lamp. The light picks out a few fibers where I keep hoping to find the beginning of a line.\n\nMy fingers rest on the page for a long time. When I lift them, a small damp mark remains."
 latria_sexual_frustration_flavor.1306.desc.male: "I open the door in my nightgown, but the passage is already empty. An unsigned note lies by the threshold. Someone may have left it there just now, or dropped it earlier in the day. I pick it up, no closer to sleep.\n\nThe words I hoped for are not there. The note concerns an appointment tomorrow and a payment that is due. I read every line anyway, then turn it over. The back is blank. I keep looking at that empty space, thinking of what I might write there myself.\n\nThe passage lamp has gone out. I am still beside the door, which I have not quite closed."
 latria_sexual_frustration_flavor.1306.desc: "I listen as the footsteps beyond my door fade away. The sheet on my desk still holds no message.\n\nThree times I take up the pen. On the first, I write a single word and cross it out. On the second, I leave only a spot of ink. On the third, I put the pen down and watch that spot slowly dry.\n\nMore than half the night has passed. I have scarcely altered the empty page."
 latria_sexual_frustration_flavor.1306.a: "Write the words I have delayed."
 latria_sexual_frustration_flavor.1306.b: "Put the page away, stifle the longing, and lie down."

 latria_sexual_frustration_flavor.1307.t: "Silence at the Table"
 latria_sexual_frustration_flavor.1307.desc.accepted: "The poet recites an old romance, and the company listens with delight. One guest beats time on the table; another calls out the end of a familiar line before the poet reaches it. Cups turn in their hands, and no one lowers a voice for anyone else's sake.\n\nI raise my cup with them, thinking of a story no one has mentioned. Mine would sound less pleasing in a poem, and it had no audience to applaud it. I remember a closed door, and sitting alone afterward until dawn. When the poet reaches the lovers' embrace, a drop of wine spills from my cup.\n\nNo one notices the drop. I keep looking at it."
 latria_sexual_frustration_flavor.1307.desc.strict: "The company speaks of a noble who lost favor over a secret romance. The laughter stops so abruptly that I turn toward the window. I do not want anyone to see my expression.\n\nThere is little outside to look at, only the lantern of the passing watch. I keep my eyes on it. Behind me, someone murmurs that the noble brought it upon himself. The remark need not concern me at all, yet I cannot hear it without thinking of what I have so far kept hidden.\n\nI steady the cup in my hand. My knuckles have gone white."
 latria_sexual_frustration_flavor.1307.desc: "I watch the cups pass around the table while the conversation lingers on a subject I wish no one had raised. A moment ago, we were discussing the harvest.\n\nThen someone mentioned a private romance. No one has found a way back to the fields and grain. I sit through the pause, listening to my own heartbeat more clearly than the music.\n\nSomeone coughs, plainly hoping to break the silence. I wait, but no conversation follows."
 latria_sexual_frustration_flavor.1307.a: "Let the wine loosen my tongue as I tell one private story after another."
 latria_sexual_frustration_flavor.1307.b: "Hold my tongue, bow to the company, and take my leave."

 latria_sexual_frustration_flavor.1308.t: "A Prayer Through the Vigil"
 latria_sexual_frustration_flavor.1308.desc.favors: "The bell has marked the night watch, and I am still at prayer in the sanctuary. My faith does not forbid the pleasures of the flesh. I could show anyone the passage that says so, yet I have found little help in it for the longing that keeps me here.\n\nThe benches are empty. Candlelight casts my shadow across their backs, and its slight movements keep drawing my attention away from the prayer. I remember an invitation I almost spoke during the day. At the last moment, I said something else. I have been thinking of the words I withheld ever since.\n\nThe bell fades into the distance. I remain kneeling, with my question still unasked."
 latria_sexual_frustration_flavor.1308.desc.condemns: "I repeat the prayer of chastity in the sanctuary. I complete it once, begin missing words the second time, and on the third reading stop at the same line altogether. I cannot persuade myself to move on.\n\nThe bell is fading, but the thought that troubles me has not gone with it. I press my palms to the cool stone, hoping for a moment's relief from my restlessness. Soon even that patch of stone has warmed. I am left with the same longing and the unfinished prayer.\n\nThere is no one on the empty benches. I still keep my voice very low."
 latria_sexual_frustration_flavor.1308.desc: "Candlelight falls across the empty benches. I remain where I have been kneeling, though the vigil should be over.\n\nI am reluctant to rise. While I stay here, I can at least give myself the familiar task of holding this posture. Once I leave, I will have to face the thoughts I have been putting off. I linger without finding another prayer to say.\n\nThe last candle sputters. I watch a thread of black smoke rise and disperse beneath the beams."
 latria_sexual_frustration_flavor.1308.a: "Set aside the prayer of abstinence and follow my heart out."
 latria_sexual_frustration_flavor.1308.b: "Restrain my desire and finish the vigil."

 latria_sexual_frustration_flavor.1309.t: "A Look in the Mirror"
 latria_sexual_frustration_flavor.1309.desc.lustful: "I stand alone before the bronze mirror in my chamber, with my clothes set aside. For once I meet my own gaze without reaching for something to cover myself. The lamplight comes from beside the mirror, leaving nothing to distract me from the expression I know so well.\n\nI am tired of calling this desire a passing weakness. It has stayed with me since evening, through supper and the departure of the last guests. Now I have no company to attend to and no conversation to keep it out of my thoughts. I remain before the glass, allowing myself to think of what I want.\n\nThere are no footsteps outside. I have no one here to deceive."
 latria_sexual_frustration_flavor.1309.desc.chaste: "I sit unclothed on the edge of the bed, repeating my vow under my breath. I know it well enough to notice at once if I omit a word. The longing has not left me, however carefully I recite. I can no longer pretend it belongs to someone unlike myself.\n\nI look toward the mirror, then turn away. My reflection is still there when I glance back. I clasp my hands tightly and try to hold to the promise I have just spoken. The familiar words come less readily now.\n\nOnce again I stop in the middle of the vow. This time, I do not immediately begin the next line."
 latria_sexual_frustration_flavor.1309.desc: "I am alone in the room. Before the silent mirror, I find it harder to turn away from my own thoughts.\n\nMy clothes lie on the chair, only a few steps from where I stand. I linger before admitting why I have not put them on. There is nothing here to occupy me, and no one whose arrival might spare me another moment of indecision. The lamp burns steadily; I keep looking away.\n\nI sit on the edge of the bed. The mat is cool at first, but soon even that small distraction is gone."
 latria_sexual_frustration_flavor.1309.a: "Admit what I feel and dwell upon it."
 latria_sexual_frustration_flavor.1309.b: "Dress, return to my desk, and suppress the thought."

 latria_sexual_frustration_flavor.1310.t: "Wakeful in My Quarters"
 latria_sexual_frustration_flavor.1310.desc.clergy: "After night prayer, I return to my small room. I have not changed out of my robes, and the candle beside the bed is low. I am still reluctant to lie down. Once the day's observances are over, I will have nothing left to put between myself and the thoughts that have followed me here.\n\nThe prayer beads lie beside the pillow. I cannot look at them without remembering my vow. I loosen the tie of my robe halfway, then fasten it again. The collar still chafes, keeping me uncomfortably awake.\n\nThere is no one else in the room. I find the decision no easier for that."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "My companions have retired at the inn. Alone in my room, I finish putting away my gear. Tomorrow's route is plain enough: a crossing, a stretch of road, and another crossing. I have no such certainty about the thoughts that keep returning to me.\n\nI take off my boots, but do not lie down. Outside, a horse slowly chews its fodder. The steady sound ought to help me sleep. Instead, I remember a glance someone gave me at the ferry earlier today. It was brief enough to dismiss, but I have been turning it over ever since.\n\nThe oil lamp flickers. I leave it burning without adding more oil."
 latria_sexual_frustration_flavor.1310.desc: "The hour is late and my door is shut, but I cannot sleep. Nothing outside is keeping me awake.\n\nThe bed is comfortable, and so is the pillow. I sit at the bedside, thinking once more of the person I could not draw near to during the day. At last I notice that I have loosened the sash of my nightgown. I cannot remember when I did it; I have been too occupied with what I left unsaid.\n\nI look down at the loose sash. I have still not decided whether to settle for the night."
 latria_sexual_frustration_flavor.1310.a: "Write to an old acquaintance and speak plainly of my troubles."
 latria_sexual_frustration_flavor.1310.b: "Suppress the thought, put out the candle, and lie down."

 latria_sexual_frustration_flavor.1301.c: "Take a fresh sheet and make a poem of the invitation."
 latria_sexual_frustration_flavor.1302.c: "Turn the conversation back to families and estates."
 latria_sexual_frustration_flavor.1302.d: "Tell a tale from the road and have them raising their cups again."
 latria_sexual_frustration_flavor.1303.c: "Remain until dawn and study the scripture line by line."
 latria_sexual_frustration_flavor.1304.c: "Set out the pieces and consider a chess problem."
 latria_sexual_frustration_flavor.1304.d: "Begin with the first move and play a whole game slowly."
 latria_sexual_frustration_flavor.1305.c: "Arrange the morning's work before putting out the candle."
 latria_sexual_frustration_flavor.1307.c: "Recite a new poem and draw their attention elsewhere."
 latria_sexual_frustration_flavor.1308.c: "Close the prayer book and consider my thoughts in silence."
 latria_sexual_frustration_flavor.1308.d: "Keep watch until morning prayer and prepare the books for all."
 latria_sexual_frustration_flavor.1309.c: "Write down what troubles me and consider it line by line."
 latria_sexual_frustration_flavor.1310.c: "Brew tea and put my belongings and books away at leisure."
