l_english:
 latria_sexual_frustration_flavor.1001.t: "A Long Night Behind the Curtain"
 latria_sexual_frustration_flavor.1001.desc.female: "I sit by the window in my nightgown, an unopened letter weighing on my lap. Moonlight slips through a gap in the curtain and catches the fingerprints along the crease. The writer left long ago. I have taken the letter from the bottom of the box, put it back, and taken it out again.\n\nI keep returning to our last meeting. The words stopped halfway, as if one more sentence were coming, and then the sleeve drew back first. I only nodded. I did not ask them to stay.\n\nThe wind moves the curtain, and the paper answers with a small sound. My fingertip rests on the seal. I neither break it nor return the letter to the box."
 latria_sexual_frustration_flavor.1001.desc.male: "I sit by the window in my nightgown, an unopened letter weighing on my lap. Moonlight slips through a gap in the curtain and finds the familiar hand on the cover. The writer has been gone a long time. The letter has stayed under my account book all the while.\n\nI remember the look they gave me before leaving, as if waiting for an answer. I had other business in hand and said only that we would speak another day. That day came. They were already gone. The look is still in front of me.\n\nThe watch has called once outside. I turn the letter over, then turn it back. The wax is unbroken."
 latria_sexual_frustration_flavor.1001.desc: "After the hour grows late, the old unfinished thoughts rise again.\n\nI pick the letter up, look at the seal, and set it back on my lap. No one else is in the room. Even the spit of the lamp-wick is plain. I try to turn my mind to tomorrow's business, to the names I must answer and the doors I must open, and the thought circles back to the same place.\n\nThe curtain stirs against the latch. Cold air touches my wrist. The letter is here. The writer is not."
 latria_sexual_frustration_flavor.1001.a: "Read it to the end, and think of its writer."
 latria_sexual_frustration_flavor.1001.b: "Lock the letter away and stifle the thought."
 latria_sexual_frustration_flavor.1001.c: "Take a fresh sheet and make a poem of it."

 latria_sexual_frustration_flavor.1002.t: "Spice at the Feast"
 latria_sexual_frustration_flavor.1002.desc.accepted: "The smell of spices rides over the wine, and the musicians have begun a third tune. People at the tables still lean close to speak. Such nearness is no breach of manners here. The guests laugh and pass the cups on.\n\nI look through every glance in the hall. Someone raises a cup to me. I answer, and my eyes keep searching for a face that has not come. My neighbor tells a joke. I laugh half a beat late.\n\nWhen the servant pours, I nearly forget the cup in my hand. The heat of the spices comes up at me. The empty place inside is not filled."
 latria_sexual_frustration_flavor.1002.desc.strict: "The spices make the feast louder, and every laugh reminds me how closely custom watches a step out of bounds. My neighbor leans in to speak. I set my grip straight on the cup, as if that alone could make me look steady.\n\nSomeone begins an old story and stops halfway. The table turns at once to fiefs and harvests. I nod along. My ear is still on the sentence that was never finished.\n\nWhen the servant pours, I nearly forget the cup in my hand. The wine reaches the rim before I set it down."
 latria_sexual_frustration_flavor.1002.desc: "The feast is loud, and still the same matter keeps pulling my thoughts away.\n\nMusic, cups, and talk are all in front of me, and I cannot finish hearing any of it. A spoon rings against a dish. My neighbor asks whether I want more wine. I answer, and I do not know what I have agreed to.\n\nWhen the tune changes, I find I have been watching the hall door. It has opened twice. Neither time was the person I hoped to see. The latch drops, and I am still looking."
 latria_sexual_frustration_flavor.1002.a: "Join in with a few tender words of my own."
 latria_sexual_frustration_flavor.1002.b: "Lower my gaze, thank the host, and take my leave."
 latria_sexual_frustration_flavor.1002.c: "Ask the musicians for one more tune before I go."
 latria_sexual_frustration_flavor.1002.d: "Gather the guests at one table and talk the evening away."

 latria_sexual_frustration_flavor.1003.t: "A Sermon in the Garden"
 latria_sexual_frustration_flavor.1003.desc.favors: "The preacher sits on a stone bench in the garden and says that carnal pleasure need not offend our faith. The wind lifts a corner of the page. He pins it with a finger and goes on, unhurried.\n\nSuch words ought to settle me. While I listen, I think of something else: a jest they made before leaving, and the look I did not catch. The scripture passes my ear. That sentence stays.\n\nThe preacher asks whether I have understood. I nod. The book will not close on the page it came from."
 latria_sexual_frustration_flavor.1003.desc.condemns: "The preacher speaks of chastity and restraint, each sentence plain. The garden is quiet. Even the leaves seem to pause for him. I set my hands on my knees and keep a proper posture. My mind is not on the book.\n\nI think of the stretch of last night when I did not truly sleep. No one came. No one spoke. The warmth returned on its own. I fix my eyes on the scripture, and the words will not join into a line.\n\nThe preacher turns a page. I lower my head with him and still do not know where he has just read."
 latria_sexual_frustration_flavor.1003.desc: "I hear the sermon out in the garden. The wind turns the page, and my thoughts will not settle.\n\nThe preacher has already risen to greet someone else. I am still seated, a finger holding the page, my eyes on the far end of the stone path. Gravel shows between the flags. No one is there. I look for a while all the same.\n\nWhen I come back to myself, the wind has carried the book several leaves past. The place I meant to keep is gone. A dry leaf sticks to the margin."
 latria_sexual_frustration_flavor.1003.a: "Close the book and think of the one I long for."
 latria_sexual_frustration_flavor.1003.b: "Put those thoughts aside and join the recitation."
 latria_sexual_frustration_flavor.1003.c: "Ask the preacher to explain each passage."

 latria_sexual_frustration_flavor.1004.t: "A Restless Falcon"
 latria_sexual_frustration_flavor.1004.desc.lustful: "The falcon beats its wings on my wrist, eyes following the pigeons far off. The jess worries it. Each spread of the wings throws a little wind. I hold it down. It still watches the open ground.\n\nI know that eagerness. The hunters wait at the wood's edge for my word, and the horse stamps. I am thinking of something else, so far that I forget the whistle in my hand. The thought has no shape. It will not stop.\n\nThe falcon beats once more. Only then do I notice how hard I have been gripping the glove."
 latria_sexual_frustration_flavor.1004.desc.chaste: "The falcon shifts restlessly on my wrist. I make myself listen for the reins and the call, and I keep my eyes inside the line of the wood. The hunters have already spread out. They wait only for my signal.\n\nThe thought in my head is harder to hold than the bird. I count breaths, hoofbeats, leaves on a branch, and by the end I am back on the same person. They are not on this hunt. I know that. I think of them still.\n\nThe falcon cocks its head at me, waiting for an order it can understand. For a moment I cannot give one."
 latria_sexual_frustration_flavor.1004.desc: "The hunters wait for me to call the falcon back, and I cannot keep my mind on the hunt.\n\nWhen the wind in the wood drops, the beating on my wrist is all the clearer. Leather creaks. I lift my hand and lower it again. The call turns once in my mouth and does not go out. My tongue is dry.\n\nSomeone shouts my name from farther off. A horse answers with a stamp. I answer too. My eyes are still on the open ground, where the pigeons have already settled."
 latria_sexual_frustration_flavor.1004.a: "Let the company wait while I dwell on my own thoughts."
 latria_sexual_frustration_flavor.1004.b: "Gather my thoughts and put the hunting gear in order."
 latria_sexual_frustration_flavor.1004.c: "Smooth the feathers slowly, then try the call again."

 latria_sexual_frustration_flavor.1005.t: "Between Councils"
 latria_sexual_frustration_flavor.1005.desc.emperor: "After the lords leave, the servants are still gathering maps and seals. I sit alone at the head of the long table. An old letter lies beside the unfinished papers. The smell of the ink-pad has not gone.\n\nThey were arguing borders and taxes. I nodded, and I refused two points, and I looked as if I had heard it all. For a while I was only watching the corner of that letter where it showed from under the papers.\n\nA servant asks whether the table should be cleared. My hand stays on the stack. I do not answer at once."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "My companions have settled on the next ford, and the map is still spread on the table. I draw an old letter toward the lamp and find I cannot read the list of supplies again.\n\nOutside, someone is packing harness. Metal fittings knock together. I have looked three times at the stretch of road I am meant to confirm. What I remember is an old place-name in the letter. It is not on tomorrow's road.\n\nA companion waits in the doorway. I cover the letter. My fingers do not leave it."
 latria_sexual_frustration_flavor.1005.desc.clergy: "The meeting is over. Accounts and scripture still lie open on the table. I draw an old letter from between the pages, and the restless voice comes back.\n\nThrough the day I set the gifts, the repairs, and the feast days in order. Once I am sitting alone, those figures give way. The scripture has pressed a mark into the paper, and the corners are frayed, and I still know the line at a glance.\n\nSomeone passes in the gallery. I slip the letter back in. It goes into the same page as before."
 latria_sexual_frustration_flavor.1005.desc.ruler: "The council is over. Papers and seals are still heaped on the table. I smooth my sleeve, and the old letter at my hand holds me harder than any petition.\n\nThe clerk's summary is clear enough. I take it up. Before I finish the first name, my eye has slid to the letter. Wax crumbs stick to my cuff. It should not be on this table. I tucked it in myself this morning.\n\nPeople outside are waiting for the next order. I tell them to wait. A bench creaks, and then the passage goes quiet."
 latria_sexual_frustration_flavor.1005.desc: "There is plenty of work at hand, and an old letter keeps me from settling to it.\n\nI stack the papers by height, disorder them, and stack them again. The letter stays on top. The lamp oil drops a notch, and the flame leans toward the draft. I have not marked a single word.\n\nSomeone coughs softly outside the door. Only then do I take my hand off the letter. The corner is warm where my thumb has been. Ink on the petition beneath it is still wet."
 latria_sexual_frustration_flavor.1005.a: "Set the work aside and read the old letter again."
 latria_sexual_frustration_flavor.1005.b: "Put the letter away and return to my duties."
 latria_sexual_frustration_flavor.1005.c: "Arrange the remaining work and allow myself a short rest."
 latria_sexual_frustration_flavor.1005.d: "Sort each task and see them all completed."

 latria_sexual_frustration_flavor.1006.t: "An Old Letter by Candlelight"
 latria_sexual_frustration_flavor.1006.desc.female: "I sit under the lamp in my nightgown, a fingertip resting on the crease of an old letter. There is no promise in it, only a few ordinary greetings, and then a wide blank at the end, as if the hand had stopped of a sudden.\n\nI look at that blank for a long time. When the letter first came, it seemed little enough. Tonight the empty space weighs more than the words that were written. The wick spits, and the shadow jumps on the paper.\n\nThe tie of my nightgown has loosened. I do not fasten it. The letter is still open, and the night is still long."
 latria_sexual_frustration_flavor.1006.desc.male: "I sit beside the bed in my nightgown. The hand on the old letter brings back an affection that was never answered. The paper has gone soft, and the crease is near to splitting. I smooth it flat all the same.\n\nThe letter speaks of weather on the road and of one small matter. What I remember is standing in the gallery on the day it arrived, ready to go after the messenger, and being called back by someone else. Later I put the letter in a box. The writer never returned.\n\nThe wick has burned down a little. I turn the sheet. The words are the same."
 latria_sexual_frustration_flavor.1006.desc: "The night is still, and the lines of the old letter stay in front of me.\n\nI meant to look once and sleep. The lamp is lit, and those few lines will not let me go. I read halfway, then from the start again, as if something I missed the first time were hidden in the middle. The same greeting. The same small news of the road.\n\nThe bed is already made. The cover is cold where I have not lain. I am still sitting. My fingers have pressed a new mark into the edge of the paper."
 latria_sexual_frustration_flavor.1006.a: "Read the letter to its end."
 latria_sexual_frustration_flavor.1006.b: "Put the letter away, snuff the candle, and settle to sleep."

 latria_sexual_frustration_flavor.1007.t: "Before the Feast Ends"
 latria_sexual_frustration_flavor.1007.desc.accepted: "In the talk, someone mentions an old lover, and no one at the table takes it as a breach. Cups meet for a round, and the laughter passes on, as if the matter were no more than the weather.\n\nI raise my cup with them. My eyes return more than once to the empty place. The cup there has already been taken away. Only a smoothed stretch of cloth remains. I know whom I am waiting for. I also know they will not come tonight.\n\nMy neighbor asks what I am looking at. I shake my head. I have forgotten to drink."
 latria_sexual_frustration_flavor.1007.desc.strict: "An indiscreet romance is offered as a warning, and the company turns at once to reputation and custom. The speaker lowers their voice. The people beside them hear it anyway, so even the laughter is careful.\n\nI look down and smooth my sleeve, and I do not take up the talk. The affair is not mine. Hearing it still feels as if it were aimed at me. Under the table my fingers turn the foot of the cup once, then once more.\n\nThe subject changes quickly. My sleeve is already smooth. My mind is still where it was."
 latria_sexual_frustration_flavor.1007.desc: "The music has not stopped, and my thoughts left the table long ago.\n\nThe guests are still passing the last round of wine. I watch their mouths open and close, and what I hear is the sentence in my own head that has nowhere to go. Someone drinks to me. I lift my cup. The surface of the wine tips and catches the lamp.\n\nThe tune is near its end. A string buzzes and is tuned again. I am still seated, as if I have not yet decided whether I am in this feast at all."
 latria_sexual_frustration_flavor.1007.a: "They shall hear of my own longing, from the very beginning."
 latria_sexual_frustration_flavor.1007.b: "Swallow the words, thank the host, and take my leave."
 latria_sexual_frustration_flavor.1007.c: "Ask my neighbor about their travels instead."

 latria_sexual_frustration_flavor.1008.t: "Prayer Before the Shrine"
 latria_sexual_frustration_flavor.1008.desc.favors: "The candle before the shrine is nearly spent. I remember that our faith does not despise the pleasures of the flesh. I have heard that sentence many times. Tonight it is as if I must decide, for the first time, what to do with it.\n\nWax has pooled on the copper stand and set in a skin. Halfway through the prayer my mouth is still on the words, and my mind is on someone's hand, and on the sound of cloth when they came close. The figure in the shrine does not move. The flame jumps once.\n\nI try to draw the thought back. Halfway, I let it go."
 latria_sexual_frustration_flavor.1008.desc.condemns: "I repeat the vow of chastity before the shrine, and the familiar prayer breaks on my lips more than once. The first line is whole. By the second, words drop out, and the gap is just wide enough for a thought to enter.\n\nThe thought is not loud. It only reminds me that when I go back tonight the bed will still be empty, and the hands will still be my own. I push the hair from my brow and begin again at the first line.\n\nThe wick spits. My voice stops with it."
 latria_sexual_frustration_flavor.1008.desc: "The prayer is done. I am still beside the candle.\n\nEverything that ought to be said has been said. My knees are numb against the stone, and I have not risen. The flame sinks, then holds itself up, as if it too were waiting for an ending that will not come.\n\nI watch that small light. Wax ticks as it cools on the copper stand. Smoke smells of the old wick. I know I have not set the matter in my heart aside. It has only stepped back for the prayer."
 latria_sexual_frustration_flavor.1008.a: "Set aside the vow of abstinence and admit my longing."
 latria_sexual_frustration_flavor.1008.b: "Restrain my thoughts and continue in prayer."
 latria_sexual_frustration_flavor.1008.c: "Read a passage and consider it before I go."
 latria_sexual_frustration_flavor.1008.d: "Keep the candle burning and recite until dawn."

 latria_sexual_frustration_flavor.1009.t: "The Unread Petition"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Petitions lie across the long table, and the lords are waiting for my word. I read one line twice and still cannot keep the second figure. The brush turns once in my fingers. A drop of ink falls on the blank.\n\nThe way they look at me has already gone from deference to doubt. Someone coughs softly. Someone goes to pour water. No one dares speak first. I know I ought to judge. What flashes through my mind is the half line I did not finish writing last night.\n\nThe clerk pushes the next petition a little nearer. My hand is still on the first."
 latria_sexual_frustration_flavor.1009.desc.ruler: "The council is not yet over, and I cannot take in a word of the papers on the table. I close the ledger and open it again. The notes in the margin are still yesterday's.\n\nMy councillors are speaking of grain prices and the river channel. I catch a few words and then wander, and the wandering ends on a person's name. That name is not in this document. I look for it on the page all the same.\n\nSomeone asks whether I mean to adjourn. I look up and find the room has already been quiet for a moment."
 latria_sexual_frustration_flavor.1009.a: "Dismiss the council and leave me to my thoughts."
 latria_sexual_frustration_flavor.1009.b: "Gather my thoughts and attend to each petition."
 latria_sexual_frustration_flavor.1009.c: "Put the decisions in order, then pronounce each one."

 latria_sexual_frustration_flavor.1010.t: "The Eagle's Return"
 latria_sexual_frustration_flavor.1010.desc.lustful: "The falcon circles above the wood. Its shadow crosses my glove again and again, and it will not come down. I lift my arm. It only turns once, higher.\n\nWatching it refuse to return, I find I am tired of pressing every desire back into place. The hunters speak low beside the horses and think I am waiting on the wind. I am waiting to name this restlessness as something else. I cannot.\n\nThe falcon cries once. The sound is sharp and short, as if it will take no further order."
 latria_sexual_frustration_flavor.1010.desc.chaste: "The hawk still circles far off. I tighten the glove and make myself listen only for the hunters' call, and look only at the wood-line and the wind. The strap grows damp in my palm. A horse shifts, and a bit rings once.\n\nI have held myself like this many times. Today it costs more. Each little wait adds a sentence I should not have. I say it to myself, then cut it off. The horse breaks a dry twig, and the sound startles me.\n\nThe hawk has not come back. My arm is already aching. I keep it raised all the same."
 latria_sexual_frustration_flavor.1010.desc: "The hunters are waiting to break camp, and I am still watching the sky above the trees.\n\nThe horn is beside the saddle. I touch the mouthpiece and do not take it up. Leather is warm from the sun, and a fly settles on the strap. The dark speck overhead turns once, then once more. No one hurries me. Everyone is waiting.\n\nAt last I lower my head and find I never even saw which way the falcon flew. The glove is empty. The jesses hang loose against my knee."
 latria_sexual_frustration_flavor.1010.a: "Keep the hunters waiting while my thoughts follow the eagle."
 latria_sexual_frustration_flavor.1010.b: "Sound the return and inspect the hunting gear."
 latria_sexual_frustration_flavor.1010.c: "Walk beside the wood before returning to the company."

