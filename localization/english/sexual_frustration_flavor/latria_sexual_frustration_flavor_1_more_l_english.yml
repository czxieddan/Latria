l_english:
 latria_sexual_frustration_flavor.1011.t: "The Second Watch"
 latria_sexual_frustration_flavor.1011.desc: "I wake in the second watch and the lamp is still burning, the oil low, a brown ring dried into the saucer. My nightgown has twisted at the waist. The room is cold enough that I can hear the shutter knock twice, then stop.\n\nIt was a hand at my wrist, three days ago, in the doorway of the hall, and nothing was said. I have gone over the length of that touch more times than I have gone over the accounts. The skin there is ordinary now. I press my thumb to it and feel only my own pulse.\n\nThere is water in the cup by the bed, gone warm. I drink half and set it down. The shutter knocks again. I lie with my eyes open and count the beams until the grey comes."
 latria_sexual_frustration_flavor.1011.a: "Get up, trim the lamp, and let the thought go where it will."
 latria_sexual_frustration_flavor.1011.b: "Drink the water, turn to the wall, and put it down."
 latria_sexual_frustration_flavor.1011.c: "Take a book from the chest and read until the grey comes."

 latria_sexual_frustration_flavor.1012.t: "The Pear and the Small Knife"
 latria_sexual_frustration_flavor.1012.desc: "I sit three tables down from the dais, where the candles gutter and the wine is poured thin. Across from me, past two merchants and a clerk, someone is peeling a pear with a small knife and not eating it. The peel comes off in one long coil.\n\nAt the last feast they sat beside me and their knee rested against mine for the length of one song. I cannot make myself believe it was an accident, and I cannot make myself believe it was not.\n\nThe musicians change to a slower tune. The knife stops. The pear sits open on the plate, going brown at the cut. A servant leans over my shoulder with the jug and I hold out the cup without looking away."
 latria_sexual_frustration_flavor.1012.a: "Say it aloud, and let the table make of it what it will."
 latria_sexual_frustration_flavor.1012.b: "Bow out early and swallow the rest."
 latria_sexual_frustration_flavor.1012.c: "Turn to my neighbor and let the music carry it off."

 latria_sexual_frustration_flavor.1013.t: "What the Dream Left"
 latria_sexual_frustration_flavor.1013.desc: "I come awake with the sheet at my hip and the window pale, and for a moment the room is not my room. Someone was here. There was a weight on the edge of the bed and a voice close to my ear saying my name as if it were a question.\n\nI do not remember the face. I remember the warmth of a back against my chest, my hand flat on a stomach that rose and fell, and that I was in no hurry at all.\n\nThe sheet is damp where I lay. I sit up and put my feet on the cold boards. Outside, a cart goes by toward the market. I reach for my clothes and find I am listening for the door."
 latria_sexual_frustration_flavor.1013.a: "Let the body have it, and keep the warmth of the dream."
 latria_sexual_frustration_flavor.1013.b: "Get up and dress, and smooth the night flat."
 latria_sexual_frustration_flavor.1013.c: "Sit with my knees up and wait for the window to whiten."

 latria_sexual_frustration_flavor.1014.t: "The Vigil Lamp"
 latria_sexual_frustration_flavor.1014.desc: "I kneel at the third hour with the psalter open at the same page I have read four times. The vigil lamp throws a small red circle on the flagstones. My knees ache. The cold comes up through the wool.\n\nSomewhere out in the cloister a door closes. The chaplain's voice goes on behind me, patient, and I hear none of it. I am thinking of a mouth at my throat last summer, and how I turned my head away and let it happen anyway.\n\nThe psalter's ribbon has slipped to the floor. I do not pick it up. My thumb keeps the place, and the red circle of the lamp shakes when I breathe. The stone under my knees is cold."
 latria_sexual_frustration_flavor.1014.a: "Admit the weakness, and take the penance tomorrow."
 latria_sexual_frustration_flavor.1014.b: "Kneel another hour and begin the psalm again."
 latria_sexual_frustration_flavor.1014.c: "Ask the chaplain to stay and finish the page."

 latria_sexual_frustration_flavor.1015.t: "The Quilt at the Foot of the Bed"
 latria_sexual_frustration_flavor.1015.desc: "The fire has burned to ash and I am still awake, the quilt kicked to the foot of the bed. My body is warm and heavy and aware of itself, the skin at my throat and along my thighs tight and flushed, and I am wet in a way that has nothing to do with the weather.\n\nI let my hand rest low on my stomach and do not move it. The wanting is not for a face tonight. It is only the pulse between my legs, insistent, keeping time with the last tick of the fire.\n\nI think of a mouth, a hand, the weight of someone above me, and my hips shift of their own accord. The quilt is a heap on the boards. I turn my face into the pillow and breathe until the ache eases, and it does not ease."
 latria_sexual_frustration_flavor.1015.desc.lustful: "The heat comes up under the sheet and I stop pretending it is the weather. I am wet, plainly wet, my own, and my fingers know the way without being sent.\n\nI let them go. There is no face in it tonight, only a hand that pressed me down into the mattress and a knee that opened mine, and I remember the exact force of that. My hips lift to meet nothing. The sound I make in the empty room is not one I know.\n\nAfterward I lie open-handed, my chest going up and down, the last of it still moving in my thighs. A log settles in the grate. I pull the sheet to my waist and the heat in my face stays."
 latria_sexual_frustration_flavor.1015.desc.chaste: "I wake already warm, my thighs damp, and I pull my hand back and close it on the hem of the sheet as if holding cloth could hold the night in place.\n\nI say the morning prayer in order and lose the thread at the third line. I count the beams and lose the count. The body does not listen. It keeps what I will not admit by daylight, and it keeps asking.\n\nThe window goes from grey to white. The bell for the morning office has not rung yet. I draw the quilt to my chin and shut my eyes and wait for the heat to go out of me. It goes slowly."
 latria_sexual_frustration_flavor.1015.a: "Let the hand do as it will, and use the heat."
 latria_sexual_frustration_flavor.1015.b: "Clench the quilt and wear the heat out."
 latria_sexual_frustration_flavor.1015.c: "Get up, drink, and sit by the window."

 latria_sexual_frustration_flavor.1016.t: "The Long Ride Back"
 latria_sexual_frustration_flavor.1016.desc: "I ride at the back of the line where the horses have slowed, the light going green and thin through the leaves. My cloak is heavy with wet. Somewhere ahead the horns are still working the far slope.\n\nAt the last hunt I fell in beside them at the stream and we let the others go on. Their sleeve was soaked to the elbow. They laughed at something I said, and the laugh stayed with me the whole way home, and the way home was two days.\n\nMy horse drops her head to drink. The water swings her reflection apart. I sit and let her drink and watch the pieces come back together, and the horns start up again, farther off."
 latria_sexual_frustration_flavor.1016.a: "Fall back a length and let the thought ride home with me."
 latria_sexual_frustration_flavor.1016.b: "Put my heels in and keep my mind on the slope."
 latria_sexual_frustration_flavor.1016.c: "Follow the hoofprints and the broken twigs to find them."

 latria_sexual_frustration_flavor.1017.t: "The Seal and the Ledger"
 latria_sexual_frustration_flavor.1017.desc: "The council has gone and the candles are down to stubs. I have the ledger open at the wool accounts and the seal still in my hand, the wax soft from my grip.\n\nWhat I keep returning to is not the accounts. It is the way a certain person stood at the window through the whole session, saying nothing, one finger on the latch, and how the room felt smaller for it.\n\nI press the seal down on the order and lift it. The wax takes the mark cleanly. Outside the window the courtyard is empty and the latch is still. I read the same line of the ledger twice and then close the book."
 latria_sexual_frustration_flavor.1017.a: "Send for them tomorrow and say it plainly."
 latria_sexual_frustration_flavor.1017.b: "Give the seal to the clerk and go to bed."
 latria_sexual_frustration_flavor.1017.c: "Open the ledger again and finish the page."

 latria_sexual_frustration_flavor.1018.t: "Moon Over the Board"
 latria_sexual_frustration_flavor.1018.desc: "The lanterns are lit along the walk and the moon is up over the west wall, thin and white as a paring. The wine has gone warm in the pot. Across the board from me the scholar holds a white stone between two fingers and does not set it down.\n\nAt the spring viewing they sat close enough that our sleeves touched, and recited four lines about a lamp, and looked at me on the last one. I have not forgotten the last line.\n\nThe stone comes down at last, in the wrong corner, and they laugh and refill my cup. I drink. The lantern light moves on the board. Neither of us mentions the poem."
 latria_sexual_frustration_flavor.1018.a: "Take up the lamp and the four lines, and add four more."
 latria_sexual_frustration_flavor.1018.b: "Raise the cup in thanks and turn the talk to the harvest."
 latria_sexual_frustration_flavor.1018.c: "Set a stone down and ask for instruction."

 latria_sexual_frustration_flavor.1019.t: "Said to the Fire"
 latria_sexual_frustration_flavor.1019.desc: "The fire is low and my confidant has the other chair, hands wrapped round a cup, waiting the way they always wait.\n\nSo I say it. Not all of it, but the shape of it: the doorway, the hand at my wrist, the nights since. Saying it aloud makes it smaller and worse. My confidant does not look away and does not fill the silence.\n\nThe cup has gone cold in my hands. There is a log to put on and I do not put it on. We sit in the last of the heat and the room goes slowly dark, and I am still holding the cup."
 latria_sexual_frustration_flavor.1019.a: "Go on, and say the rest of it."
 latria_sexual_frustration_flavor.1019.b: "Stop there and keep the rest."
 latria_sexual_frustration_flavor.1019.c: "Sit a while longer and say nothing."

 latria_sexual_frustration_flavor.1020.t: "Spoken Under the Vault"
 latria_sexual_frustration_flavor.1020.desc: "The vault takes my voice and gives it back doubled. A dozen people are in the nave and every one of them can hear me say the thing I have not said in daylight.\n\nI keep my eyes on the flagstone in front of the rail. There is a chip out of it shaped like a tooth. When I finish, someone shifts their weight behind me, and a woman near the door draws her veil across and does not lower it.\n\nThe censer swings. The smoke goes up flat along the stone. I stay where I am with my hands open on my knees until the sacristan touches my shoulder."
 latria_sexual_frustration_flavor.1020.a: "Lift my head and finish what I left out."
 latria_sexual_frustration_flavor.1020.b: "Keep my head down and say the penitential psalms to the end."
 latria_sexual_frustration_flavor.1020.c: "Wait for the nave to empty and ask the chaplain to stay."

 latria_sexual_frustration_flavor.1021.t: "After the Rain"
 latria_sexual_frustration_flavor.1021.desc: "The rain kept us in the upper room past the second watch, and neither of us suggested going down.\n\nI remember the order of things. A wet cloak on the boards. A mouth at my collarbone, then lower, unhurried, while my fingers found the ties at the back of a neck. The lamp was turned low but not out. When they came back up to kiss me I could taste the wine on them, my thighs were slick against theirs, and I lifted my hips to meet the hand that settled there.\n\nAfterward the rain went on. My hair was stuck to my cheek. There is a mark on my shoulder I have not looked at in daylight."
 latria_sexual_frustration_flavor.1021.desc.female: "The rain kept us in the upper room past the second watch, and neither of us suggested going down.\n\nI remember the order of things. A wet cloak on the boards. Their mouth at my collarbone, then lower, unhurried, while my fingers worked the ties at the back of their neck. The lamp was turned low but not out. Their palm closed over my breast and I was already wet, and I lifted my hips to meet the hand that settled between my thighs.\n\nAfterward the rain went on. My hair was stuck to my cheek. There is a mark on my shoulder I have not looked at in daylight."
 latria_sexual_frustration_flavor.1021.desc.male: "The rain kept us in the upper room past the second watch, and neither of us suggested going down.\n\nI remember the order of things. A wet cloak on the boards. Their mouth at my chest, then lower, unhurried, while my hands found the ties at their waist. The lamp guttered twice and held. They came down over me and I held their hips, hard and aching, and they set the pace themselves. Their hair was wet at the ends.\n\nAfterward the rain went on, running in the gutter above the window. There is a mark on my shoulder I have not looked at in daylight."
 latria_sexual_frustration_flavor.1021.a: "Meet them tomorrow as usual, and hide nothing."
 latria_sexual_frustration_flavor.1021.b: "Avoid them from now on, and put the night away."
 latria_sexual_frustration_flavor.1021.c: "Lie and listen to the rain, and keep the mark in mind."

 latria_sexual_frustration_flavor.1022.t: "The Path Behind the Herbs"
 latria_sexual_frustration_flavor.1022.desc: "I take the path behind the herb beds because it is the only place the household does not walk after dark. The gravel is cold through my slippers. Rosemary, and under it the sour smell of the mint gone over.\n\nThere is a bench at the end where the wall turns. We sat there in the spring and I said something foolish and was forgiven before I finished. The gate latch is still down.\n\nThe moon is behind the tower. I stand at the bench with my hand on the back of it, where the paint has worn to the grain. A moth works at the lantern by the door. The mint moves a little. I do not sit down."
 latria_sexual_frustration_flavor.1022.a: "Sit down on the bench and let the pulse pass."
 latria_sexual_frustration_flavor.1022.b: "Turn back to the house and bolt the door."
 latria_sexual_frustration_flavor.1022.c: "Walk the path once, and then again."

 latria_sexual_frustration_flavor.1023.t: "The Third Cup"
 latria_sexual_frustration_flavor.1023.desc: "By the third cup the hall has gone loud and warm and the dogs are under the benches. Someone has started a song with the wrong number of verses and no one is correcting them.\n\nA hand rests on my sleeve while a story is told, and stays there through the whole story, and is gone when the story ends. I laugh in the right place. The wine is very good tonight.\n\nThe musicians take up something slow. I look down the table where the trenchers are being cleared. My sleeve is still warm where the hand was. I turn the cup by the rim and let the servant fill it again."
 latria_sexual_frustration_flavor.1023.a: "Raise the cup and look at them across the table."
 latria_sexual_frustration_flavor.1023.b: "Plead the wine and go up to bed."
 latria_sexual_frustration_flavor.1023.c: "Speak to my neighbor and hear the tune out."

 latria_sexual_frustration_flavor.1024.t: "Rosewater and the Garden Wall"
 latria_sexual_frustration_flavor.1024.desc: "The rosewater has been poured over the fruit and the whole table smells of it. Under the wall a nightingale is going on and on, badly, and nobody has the heart to stop it.\n\nThey asked me a question about the treaty twice, and both times I answered the wrong half of it. The second time they smiled into their cup. The saffron on their thumb has come off on the rim. The lamp between us has a crack in the glass.\n\nThe nightingale stops. In the quiet I can hear the water in the channel behind the wall. I take up the cup I have already emptied and hold it until someone notices and refills it."
 latria_sexual_frustration_flavor.1024.a: "Follow their lead and move the treaty to tomorrow."
 latria_sexual_frustration_flavor.1024.b: "Beg leave and go out into the garden."
 latria_sexual_frustration_flavor.1024.c: "Ask them to finish the half of the poem."

 latria_sexual_frustration_flavor.1025.t: "The Hawk on the Fist"
 latria_sexual_frustration_flavor.1025.desc: "The hawk sits my fist better than she did in the spring, hood off, her weight settled. The horses are picketed back in the birches and the beaters have gone ahead with their noise.\n\nWe flew her together once at the edge of the moor and I could not keep my eyes off the hands that cast her, the way they opened at the last moment. I have thought about those hands at inconvenient hours since.\n\nThe hawk shifts and I steady her with two fingers on the jesses. The wind comes up the slope, cold and clean. I keep my eyes on the trees where the beaters went in and my mind is not on the trees."
 latria_sexual_frustration_flavor.1025.a: "Hand the hawk to another and walk off alone."
 latria_sexual_frustration_flavor.1025.b: "Cast her off the fist and let her fly."
 latria_sexual_frustration_flavor.1025.c: "Fly her again, until my arm aches."

 latria_sexual_frustration_flavor.1026.t: "The Page They Turned"
 latria_sexual_frustration_flavor.1026.desc: "The lesson is done and the book is still open between us, at the page the chaplain turned with one dry finger. Rain at the shutters. The candle has burned down and bent.\n\nI did not follow the argument. I watched the finger, and the ink along the side of it, and the way the sleeve was pushed back to the elbow. The shame comes after, always, and does no good.\n\nThe chaplain closes the book and asks whether I have understood. I say that I have. The rain goes on at the shutters. I keep my hand flat on the cover so that it will not reach for anything."
 latria_sexual_frustration_flavor.1026.a: "Take the question to the chaplain tomorrow."
 latria_sexual_frustration_flavor.1026.b: "Ask the chaplain to say it again, and this time listen."
 latria_sexual_frustration_flavor.1026.c: "Read the page once more, only the letters."

 latria_sexual_frustration_flavor.1027.t: "What the Day Left"
 latria_sexual_frustration_flavor.1027.desc: "The last petitioner has gone and the chamber smells of wet wool and the tallow they rub into the benches. My seal is warm from my hand. The day's business is done and I am still sitting here.\n\nThere was a moment at the window, between two speakers, when a look was given that I have carried since like a stone in my shoe. Nothing was said. Nothing needed to be.\n\nThe clerk comes for the seal. I give it to him and my fingers are steady. He goes. The door does not quite close. I sit and listen to the latch settle, and the rain starts again on the leads."
 latria_sexual_frustration_flavor.1027.a: "Send the room away tomorrow and say one thing."
 latria_sexual_frustration_flavor.1027.b: "Close the window and finish the papers."
 latria_sexual_frustration_flavor.1027.c: "Work through what is left, one sheet at a time."

 latria_sexual_frustration_flavor.1028.t: "The Ribbon in the Box"
 latria_sexual_frustration_flavor.1028.desc: "There is a box on the shelf with a ribbon in it that is not mine, green, gone thin at the fold. I take it out and put it back and take it out.\n\nAt the fair I lost the ribbon and someone found it in the mud and gave it back to me with a bow I did not need. Their hands were cold. I said thank you and nothing else, and the whole way home I was angry at myself for the nothing else.\n\nThe lamp is low. The ribbon lies across my palm and the green is almost grey in this light. I fold it once, and then again, and the creases do not line up."
 latria_sexual_frustration_flavor.1028.a: "Tie the ribbon round my wrist and sleep."
 latria_sexual_frustration_flavor.1028.b: "Lock the box at the bottom of the chest."
 latria_sexual_frustration_flavor.1028.c: "Take paper and write the night down."

 latria_sexual_frustration_flavor.1029.t: "The Fire Between Watches"
 latria_sexual_frustration_flavor.1029.desc: "The fire is down to a red eye and the camp is asleep except for the two of us and the pickets. My cloak is over my knees. The sword is where I can reach it, out of habit.\n\nWe have shared a fire for eleven nights and I have learned the sound of their breathing. Tonight they are awake too. Neither of us says anything about the road tomorrow, or about the inn at the last town where there was one room and we took it.\n\nThe wind turns the flames flat. A log settles. I put another on and the sparks go up, and the sparks are the only thing moving in the whole wood."
 latria_sexual_frustration_flavor.1029.a: "Sit by the fire and wait for light."
 latria_sexual_frustration_flavor.1029.b: "Feed the fire and keep the watch, and do not look at them."
 latria_sexual_frustration_flavor.1029.c: "Change watches with them and walk to the edge of the wood."

 latria_sexual_frustration_flavor.1030.t: "The Bell Rope"
 latria_sexual_frustration_flavor.1030.desc: "The bell rope is rough in my hands and the bell has been rung and the church is empty. The guide waits by the door with the keys, patient as stone.\n\nI am thinking of the body as a thing to be kept, and I cannot make the thought hold. It slips. Under the wool I am warm and alive and there is a pulse in me that has nothing to do with prayer.\n\nI let the rope go. It swings a little and is still. The guide lifts the keys. I walk down the nave behind them and my shadow goes ahead of me over the flags, long and thin, and out through the door."
 latria_sexual_frustration_flavor.1030.a: "Give the night to the body, and settle it tomorrow."
 latria_sexual_frustration_flavor.1030.b: "Kneel and finish the evening office."
 latria_sexual_frustration_flavor.1030.c: "Keep the guide behind and hear one more passage."

 latria_sexual_frustration_flavor.1031.t: "The Ribbon on the Boards"
 latria_sexual_frustration_flavor.1031.desc: "The fire has burned to a red line and I have not called for more wood. My gown is loosened at the throat and the room is warm enough that I leave it so. Two days ago, at the break of the hunt, a hand stayed at the small of my back longer than the dismount asked for.\n\nI remember the weight of that palm, the breath that moved at my ear when the horse shifted, the low word that was not quite a word. My own hand goes to the place the palm covered. The skin there is warm from the fire, and when I press it the warmth is only mine.\n\nThe ribbon has slipped from the bedpost to the boards. I watch it lie in the red light. The fire settles. I do not pick it up."
 latria_sexual_frustration_flavor.1031.a: "Take the ribbon up and let the thought go where it will."
 latria_sexual_frustration_flavor.1031.b: "Tie the ribbon, bank the fire, and sleep."
 latria_sexual_frustration_flavor.1031.c: "Set out the board and play the endgame alone."

 latria_sexual_frustration_flavor.1032.t: "The Weight of a Palm"
 latria_sexual_frustration_flavor.1032.desc: "The stone is cold through my knees and I have knelt long enough that the cold has become company. Under the wool my body is too warm, and I cannot tell whether it is the braziers or something else. Last week a hand rested on my head in blessing and stayed past the words.\n\nThe prayers come out correctly. The responses are correct. What rises instead is the weight of that palm, the oil on the fingers, the moment when neither of us moved and the sacristan coughed in the doorway. I press my forehead to my knuckles. The marble gives nothing back.\n\nA candle at the side altar bends, then stands straight. I stay where I am. The cold comes up through my knees and I let it."
 latria_sexual_frustration_flavor.1032.a: "Rise, find the priest, and say what has been in me."
 latria_sexual_frustration_flavor.1032.b: "Keep the vigil until the bell."
 latria_sexual_frustration_flavor.1032.c: "Walk the cloister until my legs are as cold as my knees."

 latria_sexual_frustration_flavor.1033.t: "The Second Cloak"
 latria_sexual_frustration_flavor.1033.desc: "The fire is between us and the hounds have gone quiet. Someone laid a second cloak over my shoulders without asking, and the wool smells of another person's sweat and woodsmoke. Their knee is against mine. Neither of us has moved it.\n\nI can name three reasons to stand: the watch, the tent flap that will not close, the cold that is coming before dawn. Instead I turn my face to the flames and let my shoulder stay where it has come to rest. Our breath goes out and thins in the air between us. Under the cloak my hand finds the seam of my own sleeve and holds it.\n\nA branch drops into the fire. They do not move. I do not move. The sparks go up and out."
 latria_sexual_frustration_flavor.1033.a: "Stay under the cloak until the fire is ash."
 latria_sexual_frustration_flavor.1033.b: "Thank them for the wool and go to my tent."
 latria_sexual_frustration_flavor.1033.c: "Ask them about the hounds until the watch changes."

 latria_sexual_frustration_flavor.1034.t: "The Third Clause"
 latria_sexual_frustration_flavor.1034.desc: "The treaty has been copied twice and the second copy is wrong in the third clause. I have read it four times and the error is still there. My collar is open; the brazier has made the room hot and there is no one here to see it.\n\nWhat I keep returning to is the antechamber, the envoy's mouth at the inside of my wrist and then above it, and how I let them go on while the notary's steps came and went beyond the door. I said nothing that could be written down. They said less.\n\nThe candle has eaten a crescent out of the wax. I take up the pen, set it down, and read the third clause again. The words have not changed."
 latria_sexual_frustration_flavor.1034.a: "Send for the envoy and say plainly what I have been thinking."
 latria_sexual_frustration_flavor.1034.b: "Copy the clause again and go to confession at first light."
 latria_sexual_frustration_flavor.1034.c: "Read the psalter until the candle is out."

 latria_sexual_frustration_flavor.1035.t: "Two Turns"
 latria_sexual_frustration_flavor.1035.desc: "The hall is loud and the wine has gone to my head, not far, only far enough. My gown has come loose at the shoulder and I have not troubled with it. In the last dance a hand settled at my waist and stayed through two turns, and the room was too crowded to step away.\n\nI can still find the four points of those fingers through the silk. My own hand goes to my shoulder, to the warm place where the cloth has slipped. The music is behind the players now. I keep the time anyway.\n\nThe lamp above me smokes. Someone at the far table laughs at something I did not hear. My shoulder is bare and I leave it so."
 latria_sexual_frustration_flavor.1035.a: "Call for one more tune and dance it."
 latria_sexual_frustration_flavor.1035.b: "Set the gown straight and take the cold air at the window."
 latria_sexual_frustration_flavor.1035.c: "Sit by the fire with the old hound until the hall empties."
