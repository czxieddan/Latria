l_english:
 latria_sexual_frustration_flavor.1211.t: "The Lamp Left Burning"
 latria_sexual_frustration_flavor.1211.desc: "The house has gone quiet enough that I can hear the lamp. I have called no one. I have set out two cups anyway, and the second sits there with nothing in it. The bread is still under the cloth where I left it at noon.\n\nWhat I keep is a shoulder against mine in a doorway, the weight of it, the way neither of us moved for the length of a breath. My skin has kept that. It comes back at this hour, under the nightgown, behind my knees and lower, and my hand goes flat on my stomach to quiet it and does not quiet it.\n\nThe wick leans. I turn the empty cup so its handle faces the chair."
 latria_sexual_frustration_flavor.1211.a: "Put out the lamp and let my own hand finish it."
 latria_sexual_frustration_flavor.1211.b: "Trim the wick, drink the cold tea, and sleep."
 latria_sexual_frustration_flavor.1211.c: "Read until the words stop circling."

 latria_sexual_frustration_flavor.1212.t: "The Council Waits"
 latria_sexual_frustration_flavor.1212.desc: "The petitions are read out and I hear none of them. My steward stands at the edge of the table with their hands clasped behind them, and I have been watching the line of their throat since the second page. The rain has stopped and the room is too warm. The fire ticks behind me and settles.\n\nThey lean across to move a candle and a sleeve brushes my wrist. Neither of us says anything. The room smells of hot wax and wet wool. I could end the session. The word is already in my mouth and I hold it there, and they wait with their eyes on the seal.\n\nThe clerk asks whether I have decided. I have decided nothing."
 latria_sexual_frustration_flavor.1212.a: "End the session and keep them back on an invented errand."
 latria_sexual_frustration_flavor.1212.b: "Rule on the petitions and keep my eyes on the page."
 latria_sexual_frustration_flavor.1212.c: "Carry the papers to the map table and work through the night."

 latria_sexual_frustration_flavor.1213.t: "What the Dark Is For"
 latria_sexual_frustration_flavor.1213.desc: "The door is barred. I am not dressed, and the sheet is on the floor where I kicked it. The room smells of the candle and of my own skin.\n\nMy body has been loud all day and it is louder now. I let my knees fall open and my hand go down over my belly, lower, and I do not pretend I am doing anything else. What comes is a mouth at my collarbone, wrists held down and liked, and I follow it until my hips lift off the mattress and my breath breaks apart in the dark.\n\nAfterward the room is the same room. I lie with my arm over my eyes. The candle has burned to a puddle and I have not slept."
 latria_sexual_frustration_flavor.1213.a: "Let my hand finish and sleep afterward."
 latria_sexual_frustration_flavor.1213.b: "Take the sheet off the floor and lie still till dawn."
 latria_sexual_frustration_flavor.1213.c: "Dress, go down, and walk the walls until the sky greys."
 latria_sexual_frustration_flavor.1213.d: "Give myself to it again, and again, until the candle dies."

 latria_sexual_frustration_flavor.1214.t: "The Hour Before Lauds"
 latria_sexual_frustration_flavor.1214.desc: "I am alone in the church with the lamps I am meant to trim. Cold comes up through the flagstones and the saints look past me at the door. Under the cassock my body is warm and awake and entirely uninterested in the hour.\n\nI know the words for this. I have said them over other people in the wooden box by the door, in the voice I use for their sins. Saying them over myself does nothing. The wanting sits behind my ribs like a swallowed coal. I press my palm flat to the altar stone until it hurts.\n\nThe bell will ring soon. My hand is still on the stone, and the stone is no longer cold."
 latria_sexual_frustration_flavor.1214.a: "Take the wanting into my own hands and ask pardon after."
 latria_sexual_frustration_flavor.1214.b: "Kneel through the office and let the hours wear it down."
 latria_sexual_frustration_flavor.1214.c: "Open the book and read the psalms until the words hold."

 latria_sexual_frustration_flavor.1215.t: "A Knee Under the Table"
 latria_sexual_frustration_flavor.1215.desc: "The hall is loud. Somebody's hound is under the benches and the wine has gone round twice. My neighbour has not moved their knee away from mine since the venison, and the bench has grown warm where we meet. The rushes smell of trodden wine.\n\nEach time the table shakes with laughter the pressure shifts and comes back. I have stopped following the argument about the border. I put my hand on the bench beside theirs and leave it there. They look at the hand, then at the far wall, and their knee stays. My knee has gone numb and I have not shifted it.\n\nA cup goes over. Wine runs to the edge and drips on the rushes. Nobody has moved."
 latria_sexual_frustration_flavor.1215.a: "Say it plainly, here, and let the hall hear."
 latria_sexual_frustration_flavor.1215.b: "Thank the table, rise, and take the air outside."
 latria_sexual_frustration_flavor.1215.c: "Turn to them and talk of anything else until the fire is low."

 latria_sexual_frustration_flavor.1216.t: "Sleeves in the Garden"
 latria_sexual_frustration_flavor.1216.desc: "The peonies are past their best and the gardener has stopped pretending to work. We are walking the long way round the pond, because the short way ends at the gate. The afternoon has gone the colour of weak tea.\n\nTheir sleeve keeps finding the back of my hand. In my own house a touch like that would be a decision already taken, and the matchmakers would be sent for before the tea was cold. Here it is only a sleeve, and I am the one who must read it. I slow down. They slow down. The water holds both our reflections and neither of us moves first.\n\nAt the gate they stop and look back once. There are petals under my shoe."
 latria_sexual_frustration_flavor.1216.a: "Ask them plainly, and answer for it to my house."
 latria_sexual_frustration_flavor.1216.b: "Bow, keep my hands in my sleeves, and go in."
 latria_sexual_frustration_flavor.1216.c: "Walk the pond again alone until the lamps are lit."

 latria_sexual_frustration_flavor.1217.t: "The Long Ride Back"
 latria_sexual_frustration_flavor.1217.desc: "We have been in the saddle since before light, and for the last three miles I have been aware of the rider ahead of me. The way they sit. The way they looked back at the ford. My thighs are chafed and my mouth is dry and none of it is the reason I keep watching them.\n\nThe deer are gone, the beaters are scattered, and nobody would remark on a delay. My hands are cold on the reins and the rest of me is not cold at all. I heel the horse and close the distance to nothing. The wood ticks with water.\n\nThey turn at the sound and wait. The wood is full of wet leaves and the horses are blowing."
 latria_sexual_frustration_flavor.1217.a: "Take them into the trees and be late back."
 latria_sexual_frustration_flavor.1217.b: "Ride on to the lodge and put the thought in cold water."
 latria_sexual_frustration_flavor.1217.c: "Dismount and read the tracks until my hands stop shaking."

 latria_sexual_frustration_flavor.1218.t: "A Room With Borrowed Books"
 latria_sexual_frustration_flavor.1218.desc: "The scholar who lets me sleep in their store-room has left me the lamp and a book I cannot read well. Rain on the shutters, and the smell of wet thatch. My body has been restless since the last town, and the narrow bed makes it worse. The lamp smokes when the draught finds it.\n\nThey come in to see to the wick and stand with their fingers on the shelf, and I can smell the ink on them. I ask them to stay and explain the page. They do. Their shoulder rests against mine while they point, and neither of us moves it, and I have stopped hearing the grammar.\n\nThe rain eases. Their finger is still on the same line."
 latria_sexual_frustration_flavor.1218.a: "Sing, badly, until the wanting has somewhere to go."
 latria_sexual_frustration_flavor.1218.b: "Thank them, put out the lamp, and lie with my back to the door."
 latria_sexual_frustration_flavor.1218.c: "Ask them to go on teaching and keep my hands on the page."
 latria_sexual_frustration_flavor.1218.d: "Copy the passage three times until my hand is too tired to want."

 latria_sexual_frustration_flavor.1219.t: "The Room Behind the Hall"
 latria_sexual_frustration_flavor.1219.desc: "The feast has emptied into the yard, and the two of us have ended up in the little room behind the hall where the spare benches are kept. They have their back to the door and a hand flat on my chest, and they are laughing at me, waiting.\n\nI get the clasp of their belt, then the laces, and they laugh again and help me. Their mouth is at my throat and a thigh comes between mine, and I am past pretending. We take our time on the bench, their hair coming loose, my breath gone ragged, until they shiver and I follow.\n\nAfterward they are still holding my wrist. The music has started up again in the hall."
 latria_sexual_frustration_flavor.1219.a: "Tell them the truth of it and keep hold of their hand."
 latria_sexual_frustration_flavor.1219.b: "Straighten my clothes, thank them, and go back to the hall."
 latria_sexual_frustration_flavor.1219.c: "Sit with them on the bench until the music stops."

 latria_sexual_frustration_flavor.1220.t: "The Vigil I Kept"
 latria_sexual_frustration_flavor.1220.desc: "I told the others I would keep the vigil, and they left me the church, one candle and the smell of last week's incense. Midnight came and went. My knees ache and my body will not be quiet. The flagstones have taken the heat out of my feet.\n\nEvery time I close my eyes there is a hand at the small of my back, from a dance two winters ago, and I have to open them again. The candle throws my shadow up the wall. I could put a stop to this in a moment and no one would ever know, and that is the trouble with it.\n\nThere is a draught from the door. My shadow moves on the wall."
 latria_sexual_frustration_flavor.1220.a: "Take it in my own hands here and be honest with the saints."
 latria_sexual_frustration_flavor.1220.b: "Stay on my knees until the window goes grey."
 latria_sexual_frustration_flavor.1220.c: "Read the office aloud until my voice is the only thing in the room."

 latria_sexual_frustration_flavor.1221.t: "The Envoy's Glove"
 latria_sexual_frustration_flavor.1221.desc: "The envoy has been three days in my hall and I have counted every one of them. They take their glove off to turn the pages of the treaty, finger by finger, and I have lost the clause about the river twice. The fire has burned down and nobody has been sent for wood.\n\nMy councillors are watching me not listen. There is a place in the town where nobody asks a name, and the thought of it has sat in my chest since the second morning, heavy and warm and entirely undignified. I have not been to that door in a year.\n\nThey hold out the glove for me to look at the seal. I take it. It is still warm."
 latria_sexual_frustration_flavor.1221.a: "Sign, dismiss them, and go down into the town tonight."
 latria_sexual_frustration_flavor.1221.b: "Read the clause again and keep my hands on the table."
 latria_sexual_frustration_flavor.1221.c: "Work through the terms one by one until the candles gutter."
 latria_sexual_frustration_flavor.1221.d: "Find out which door in the town is the quiet one."

 latria_sexual_frustration_flavor.1222.t: "A Hand Held Too Long"
 latria_sexual_frustration_flavor.1222.desc: "The dancing has come round to the slow measure and I have been passed from hand to hand all evening. The last one does not let go when the music stops. The hall is hot with candles and the smell of other people's wine. The rushes are trodden flat and the candles gutter.\n\nTheir thumb is on my knuckles. The hall is watching and pretending not to, my ears are hot, and I do not take my hand back. Somebody laughs near the musicians. Their grip tightens once, deliberate, and my whole body answers before I can arrange my face. My hand is not steady in theirs. The music starts again behind me.\n\nThey let go. The print of their fingers stays on my hand."
 latria_sexual_frustration_flavor.1222.a: "Say what I want where the whole hall can hear it."
 latria_sexual_frustration_flavor.1222.b: "Thank them for the dance and step back into the crowd."
 latria_sexual_frustration_flavor.1222.c: "Ask them to walk with me to the door and talk of horses."

 latria_sexual_frustration_flavor.1223.t: "The Ford"
 latria_sexual_frustration_flavor.1223.desc: "We stop at the ford to water the horses, and the day is hot enough that half the party goes in. I am standing on the flat rock with my shirt off, wringing it, when I notice the one still in the saddle, watching. The water is loud over the stones. The horses drink and shift their feet.\n\nThey do not look away when I catch them. Water runs down my ribs and off my wrist. There is a great deal I could do with the afternoon and the whole wood to do it in, and my body has already decided, and it is making it hard to think about the horses.\n\nThey dismount. The reins are still in their hand."
 latria_sexual_frustration_flavor.1223.a: "Drop the shirt and go to them in front of anyone who cares to look."
 latria_sexual_frustration_flavor.1223.b: "Put the shirt back on and ride ahead to the lodge."
 latria_sexual_frustration_flavor.1223.c: "Take out the falcon and keep my hands busy until the party is ready."

 latria_sexual_frustration_flavor.1224.t: "Two Riders and the Grass"
 latria_sexual_frustration_flavor.1224.desc: "The grass is high enough to hide a horse, and the sky is doing what it does before rain. We have ridden side by side since the herd turned, and their leg has been against mine for the last furlong, and neither of us has corrected it. The wind smells of crushed stems. The horses are wet to the knee.\n\nOut here there is no wall to hide behind and no priest within a day's ride. That has never made the wanting simpler. It has only made it larger, the way the land is larger, and I have stopped pretending I do not know where this is going.\n\nThey pull up at the crest and look at me over their shoulder. The first drops come down."
 latria_sexual_frustration_flavor.1224.a: "Take their hand and lead them down into the long grass."
 latria_sexual_frustration_flavor.1224.b: "Nod, turn my horse, and race them back to the wagons."
 latria_sexual_frustration_flavor.1224.c: "Set the target at the far post and shoot until my arms shake."

 latria_sexual_frustration_flavor.1225.t: "What I Said in the Box"
 latria_sexual_frustration_flavor.1225.desc: "I knelt in the wooden box and said it out loud, which was worse than saying nothing. The priest on the other side of the lattice did not gasp or scold. They asked me a question about my own house and waited, and I heard my own voice give the answer. The church smells of cold stone.\n\nWalking back through the church I am still hot in the face. It is not shame, or not only that. Having said it, I can feel the whole of it again, in daylight, in front of the altar, and my body has no manners at all. My collar is too tight.\n\nThey are still in the box. The curtain moves when I pass."
 latria_sexual_frustration_flavor.1225.a: "Go back to the box and ask them to hear the rest."
 latria_sexual_frustration_flavor.1225.b: "Kneel at the rail and take the penance and the words they give me."
 latria_sexual_frustration_flavor.1225.c: "Sit in the side aisle and listen to them teach until I am calm."

 latria_sexual_frustration_flavor.1226.t: "Waking at the Fourth Hour"
 latria_sexual_frustration_flavor.1226.desc: "I come out of the dream with my heart going and my thighs damp and the sheet kicked to the foot of the bed. In the dream it was the stable yard and a hand on my neck, and I know whose hand. The room is cold and the pillow is wet where my mouth was.\n\nThe room is grey. There is nobody in it. My body does not care about the grey or the hour. It wants the dream finished and it is very clear about how. I put my arm across my eyes and lie there with my knees up. The floor is cold enough to hurt.\n\nThe bird in the eaves starts. My hand is already moving."
 latria_sexual_frustration_flavor.1226.a: "Finish it and let the household find me asleep."
 latria_sexual_frustration_flavor.1226.b: "Get up, dress, and go out to the stables to work until I ache."
 latria_sexual_frustration_flavor.1226.c: "Read the letter on the table until the light comes properly."

 latria_sexual_frustration_flavor.1227.t: "The Wager"
 latria_sexual_frustration_flavor.1227.desc: "Somebody has wagered a horse that I cannot say the name of the person I want in front of the whole table. The wine is good, the fire is hot, the wager is stupid, and everyone is waiting. The hound has stopped under the bench to listen. The bet was made in front of the bishop's man.\n\nI can feel the name in my mouth like a stone. Across the table the person in question is looking at the trencher and not at me, and the back of my neck is wet. If I say it, it will be in every hall by Sunday. Somebody has put more wood on the fire.\n\nThe steward fills my cup again. The table has gone quiet."
 latria_sexual_frustration_flavor.1227.a: "Say the name and let the hall make what it likes of it."
 latria_sexual_frustration_flavor.1227.b: "Laugh, pay the forfeit, and call for more wine."
 latria_sexual_frustration_flavor.1227.c: "Set out the board and beat the man who made the wager."
 latria_sexual_frustration_flavor.1227.d: "Make a verse of it that has the name in it and no name at all."

 latria_sexual_frustration_flavor.1228.t: "The Terms"
 latria_sexual_frustration_flavor.1228.desc: "The marriage is being discussed under the trees, in the voice people use for property. The one it concerns stands by the wall with folded hands, listening to a clerk read out what they are worth. A bee works the lavender between us and nobody waves it off. The clerk's voice goes flat on the numbers.\n\nI have been asked to settle the question of the dowry. I have read the same line four times. What I want is not decent and it is not on the paper, and it has been standing by the wall all afternoon in a green coat. The green coat has a torn cuff.\n\nThe clerk waits with their pen up. A leaf comes down on the table."
 latria_sexual_frustration_flavor.1228.a: "Settle the terms quickly and send the clerk and the family away."
 latria_sexual_frustration_flavor.1228.b: "Read every line twice and give nothing away."
 latria_sexual_frustration_flavor.1228.c: "Take the papers inside and decide with a clear head."
 latria_sexual_frustration_flavor.1228.d: "Put the estate accounts in order and let the numbers hold me."

 latria_sexual_frustration_flavor.1229.t: "The Scribe's Hand"
 latria_sexual_frustration_flavor.1229.desc: "The copying is slow, the scriptorium is cold, and I have written the same word wrong three times. My mind is not on the page. It is on the mouth of the one who brought the bread at noon. Someone two desks away is breathing through a blocked nose. The bread was still warm when it came.\n\nI took a vow and I have kept it, and keeping it has made me aware of my own body in a way that is hard to pray through. My hand shakes over the vellum. There is a way to end this that lasts about as long as a short prayer, and I want it.\n\nThe ink is drying on the wrong letter."
 latria_sexual_frustration_flavor.1229.a: "Set the vow aside for one afternoon and be honest about why."
 latria_sexual_frustration_flavor.1229.b: "Hold to the vow and let the wanting burn itself down."
 latria_sexual_frustration_flavor.1229.c: "Take up the passage again and copy until my hand is steady."

 latria_sexual_frustration_flavor.1230.t: "Dusk in the Garden"
 latria_sexual_frustration_flavor.1230.desc: "I have come out in my nightgown because the room was worse. The garden is blue and the moths are at the lavender. Somebody in the servants' wing is playing a stringed thing badly, the same four notes, over and over. The grass is wet through my slippers and the hem is heavy.\n\nI can still feel where a hand rested on my waist at the gate this evening, light, for the length of a courtesy. It has not faded. It has been getting louder all night, the music is no help, and my own skin feels too small. I have not moved since the gate. The bench is cold through the linen.\n\nI sit on the stone bench. The moths go on at the lavender."
 latria_sexual_frustration_flavor.1230.a: "Go back in and let the music cover what I do."
 latria_sexual_frustration_flavor.1230.b: "Stay on the bench until the cold gets through the nightgown."
 latria_sexual_frustration_flavor.1230.c: "Breathe, count the four notes, and let the garden be enough."

 latria_sexual_frustration_flavor.1231.t: "Woken Before the Bell"
 latria_sexual_frustration_flavor.1231.desc: "I wake before the bell with the sheet kicked to the floor and my skin damp along the small of my back. The nightgown has twisted round my thighs. I was dreaming, and the dream is still on me, a warmth that has settled low and will not lift.\n\nIt was the same face I have been careful not to think of all week. In the dream there was no carefulness. A hand at my waist, a mouth I could feel the shape of, and my own body answering before I had decided anything. I am awake now and it has not stopped.\n\nI lie with my knees drawn up and my palm flat against my belly, and the warmth only gathers under it. The bell has not rung. My breath is going quick and shallow and I have not moved to slow it."
 latria_sexual_frustration_flavor.1231.a: "Put out the lamp and let my own hand finish it."
 latria_sexual_frustration_flavor.1231.b: "Straighten the gown, turn over, and lie still till the bell."
 latria_sexual_frustration_flavor.1231.c: "Read until the warmth loosens its hold."

 latria_sexual_frustration_flavor.1232.t: "The Ride Apart"
 latria_sexual_frustration_flavor.1232.desc: "We have been in the saddle since before light and I have kept my eyes on the rider ahead. The way they sit. The way they looked back at the ford and slowed so I could come up beside them. My thighs are chafed raw and my mouth is dry and none of it is why I keep watching.\n\nThe deer are gone and the beaters have scattered into the wet wood. Nobody would remark on a delay. I heel the horse until there is no distance left and my knee finds theirs, and the leather creaks, and neither of us reins away.\n\nThey turn at the sound and wait. The wood is loud with dripping water. My hands are cold on the reins and the rest of me is not cold at all, and the horse stands blowing under me."
 latria_sexual_frustration_flavor.1232.a: "Close the last of the distance and let the wood keep it."
 latria_sexual_frustration_flavor.1232.b: "Rein in, ride on alone, and master myself."
 latria_sexual_frustration_flavor.1232.c: "Dismount and walk the wet trail until my head clears."

 latria_sexual_frustration_flavor.1233.t: "The Hour the Saints Keep"
 latria_sexual_frustration_flavor.1233.desc: "I am alone in the church with the lamps I am meant to trim. Cold comes up through the flagstones, but under the cassock my body is warm and awake and has no interest in the office. The saints look past me at the shut door.\n\nI know the words meant to cool this. I have said them over other people in the dark of the box by the door, in the voice I keep for their sins. Over my own they do nothing. The wanting sits behind my ribs like a swallowed coal, and my hand has come to rest flat on the altar stone without my telling it to.\n\nI press down until the cold edge hurts my palm. The bell will ring soon. My hand is still on the stone, and the stone has taken the heat from me and is no longer cold."
 latria_sexual_frustration_flavor.1233.a: "Take the wanting into my own hands and ask pardon after."
 latria_sexual_frustration_flavor.1233.b: "Kneel through the office and let the hours wear it down."
 latria_sexual_frustration_flavor.1233.c: "Rest my forehead on the cold stone and let it steady me."

 latria_sexual_frustration_flavor.1234.t: "The Hand Held Too Long"
 latria_sexual_frustration_flavor.1234.desc: "The council has gone and the study is quiet. All through the last hour I have been aware of one thing only: when my envoy leaned across the table to pass me the treaty, their hand closed over mine and stayed there a breath past what the seal required. The room was full of people. I let it stay.\n\nI keep returning to the weight of it, the warmth of a palm that had no reason to linger. The candle has burned down while I read the same clause three times. My body has decided this is worth more than the treaty, and it is not taking my opinion on the matter.\n\nTheir ring left a mark on the back of my hand. I have not rubbed it away. The wax pools and the door stays shut and I read the clause a fourth time."
 latria_sexual_frustration_flavor.1234.a: "Send for them again and say plainly what their hand did to me."
 latria_sexual_frustration_flavor.1234.b: "Keep the night watch alone and let the vigil cool me."
 latria_sexual_frustration_flavor.1234.c: "Set out the board and play myself until the image fades."

 latria_sexual_frustration_flavor.1235.t: "When the Music Turns"
 latria_sexual_frustration_flavor.1235.desc: "The hall is loud and the wine has gone round twice. When the musicians strike up I let myself be drawn into the dance, and the partner I find is the one I have spent all evening not looking at. Their hand settles at my back, and through the thin cloth I can feel each finger.\n\nWe turn, and turn again, and the room blurs to candle-smoke and colour. They hold me a little closer than the figure asks, and I do not correct them. My pulse is in my ears, louder than the drum. The wanting has come up out of nowhere and made a claim on me in front of the whole hall, and I am smiling as though nothing were happening.\n\nThe music slows toward its close. Their hand has not moved from my back, and I have not stepped away."
 latria_sexual_frustration_flavor.1235.a: "Ask the musicians for one more dance and hold them closer."
 latria_sexual_frustration_flavor.1235.b: "Thank them, bow, and withdraw before the figure turns again."
 latria_sexual_frustration_flavor.1235.c: "Keep their company and talk of anything but this."
