l_english:
 latria_sexual_frustration_flavor.1201.t: "An Hour with No Visitor"
 latria_sexual_frustration_flavor.1201.desc.female: "I wait by the window in my nightgown until the tea has gone cold. No meeting was ever promised, yet I keep making room for one in my thoughts."
 latria_sexual_frustration_flavor.1201.desc.male: "I wait by the window in my nightgown. Only the night watch crosses the courtyard. No one is coming, but I am not ready to put out the candle."
 latria_sexual_frustration_flavor.1201.desc: "The wick burns low. Nothing stirs beyond the window."
 latria_sexual_frustration_flavor.1201.a: "Write down the words I meant to say."
 latria_sexual_frustration_flavor.1201.b: "Put out the candle and stifle this empty hope."

 latria_sexual_frustration_flavor.1202.t: "Whispers Outside the Bathhouse"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Laughter carries from the bathhouse, undisturbed by who arrived with whom. It ought to be an ordinary sight, yet I remember how long it has been since I felt so unguarded."
 latria_sexual_frustration_flavor.1202.desc.strict: "Outside the bathhouse, several nobles discuss who must avoid whom. I hear my name, and the conversation falls silent."
 latria_sexual_frustration_flavor.1202.desc: "Water echoes within the bathhouse. The voices outside distract me more."
 latria_sexual_frustration_flavor.1202.a: "Tell them that I, too, long for a meeting."
 latria_sexual_frustration_flavor.1202.b: "Suppress the thought and leave by the side door."

 latria_sexual_frustration_flavor.1203.t: "Silence After Prayer"
 latria_sexual_frustration_flavor.1203.desc.favors: "The priest says that desire is not sinful in itself. I would like to believe him, but the hollow in my heart remains."
 latria_sexual_frustration_flavor.1203.desc.condemns: "The priest speaks of the virtue of chastity, then falls silent. I kneel where I am, my prayer familiar and my thoughts far away."
 latria_sexual_frustration_flavor.1203.desc: "The prayer is done. The temple bells still ring in my ears."
 latria_sexual_frustration_flavor.1203.a: "Set aside the teaching of abstinence for now."
 latria_sexual_frustration_flavor.1203.b: "Suppress the thought and begin the prayer again."

 latria_sexual_frustration_flavor.1204.t: "Restless After the Hunt"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Alone in my chamber and unclothed, I still hear the bowstring's echo. My body is tired, but my thoughts follow every shadow across the hunting field."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Alone in my chamber and unclothed, I try to return my thoughts to prayer and duty. Each time I close my eyes, the longing returns."
 latria_sexual_frustration_flavor.1204.desc: "The hunting field is empty, but the restlessness in me will not fade."
 latria_sexual_frustration_flavor.1204.a: "Recall that figure I saw upon the hunting field."
 latria_sexual_frustration_flavor.1204.b: "Dress, return to my desk, and stifle the thought."

 latria_sexual_frustration_flavor.1205.t: "The Closed Study"
 latria_sexual_frustration_flavor.1205.desc.emperor: "I have the study emptied, leaving maps, seals, and unfinished papers. I have taken an old letter from the drawer, but cannot bring myself to read it again."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "The route and watches lie written upon the table. My companions wait outside; I have allowed everyone time to rest, but an old letter returns to mind when I consider my own hours."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Alone in the study, I have closed neither the accounts nor the scripture. An old letter lies between the pages. Again and again, I reach for it and draw back."
 latria_sexual_frustration_flavor.1205.desc.ruler: "My attendants wait beyond the study door. I forbid them to disturb me. The seals and papers remain before me, but I have yet to return the old letter to its drawer."
 latria_sexual_frustration_flavor.1205.desc: "I close the study door, leaving the old letter and unfinished work upon the table."
 latria_sexual_frustration_flavor.1205.a: "Leave the work until tomorrow and read the letter again."
 latria_sexual_frustration_flavor.1205.b: "Suppress the old longing and attend to my duties."

 latria_sexual_frustration_flavor.1206.t: "Rumors at the Feast"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Someone at the feast speaks of a lover as casually as the weather. I mean to laugh it off, then realize how long it has been since I joined such talk."
 latria_sexual_frustration_flavor.1206.desc.strict: "Several nobles speak of a fellow courtier who lost favor through impropriety, and one of them mentions my name. I smooth my sleeve and do not join them."
 latria_sexual_frustration_flavor.1206.desc: "Music carries across the company. Their conversation distracts me more."
 latria_sexual_frustration_flavor.1206.a: "Tell them of my old affection, heedless of their judgment."
 latria_sexual_frustration_flavor.1206.b: "Swallow the words and leave by the side passage."

 latria_sexual_frustration_flavor.1207.t: "An Empty Place After Prayer"
 latria_sexual_frustration_flavor.1207.desc.favors: "After the service, the priest leaves his book upon the bench and departs. My faith does not condemn desire, yet I cannot settle my thoughts."
 latria_sexual_frustration_flavor.1207.desc.condemns: "The priest is gone, but I remain upon my knees. The teaching on chastity is clear; the longing within me has not faded."
 latria_sexual_frustration_flavor.1207.desc: "Only the candle and I remain in the quiet temple."
 latria_sexual_frustration_flavor.1207.a: "Leave the temple and dwell upon that affection."
 latria_sexual_frustration_flavor.1207.b: "Restrain my desire and read the precepts again."

 latria_sexual_frustration_flavor.1208.t: "The Chase Through the Wood"
 latria_sexual_frustration_flavor.1208.desc.lustful: "The quarry slips between the trees, and the others give chase. I ride after them, though another longing still holds my thoughts."
 latria_sexual_frustration_flavor.1208.desc.chaste: "I rein in my horse and remind myself that I came only to hunt. The hounds fade into the distance, but my thoughts do not."
 latria_sexual_frustration_flavor.1208.desc: "The party pauses among the trees, waiting for my word to continue the chase."
 latria_sexual_frustration_flavor.1208.a: "Let the others ride ahead while my thoughts wander."
 latria_sexual_frustration_flavor.1208.b: "Gather my thoughts and lead the hunt onward."

 latria_sexual_frustration_flavor.1209.t: "Embers by the Window"
 latria_sexual_frustration_flavor.1209.desc.female: "In my nightgown, I sit beside the window as the hearth dwindles to embers. The words I left unspoken by day return to me now."
 latria_sexual_frustration_flavor.1209.desc.male: "In my nightgown, I lean against the window and watch the night watch cross the yard. An affection unanswered will not leave my thoughts."
 latria_sexual_frustration_flavor.1209.desc: "Beyond the window all is quiet. The fire fades, but I am not sleepy."
 latria_sexual_frustration_flavor.1209.a: "Set my thoughts down on paper."
 latria_sexual_frustration_flavor.1209.b: "Stoke the fire, lie down, and suppress the thought."

 latria_sexual_frustration_flavor.1210.t: "No Knock at the Door"
 latria_sexual_frustration_flavor.1210.desc.emperor: "My attendants have put away the crown. In my nightgown beside the bed, the empire's burdens cannot make me forget what I cannot bring myself to say."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "My companions have retired at the inn. In my nightgown, I sit beside an unsent letter; tomorrow we ride on, but this worry will travel with me."
 latria_sexual_frustration_flavor.1210.desc.clergy: "I hang my vestments beside the bed and sit alone in my nightgown. My vow remains in my ears, but my thoughts do not quiet."
 latria_sexual_frustration_flavor.1210.desc.ruler: "My formal clothes are put away. In my nightgown beside the bed, the guards outside hear no sigh, and office cannot settle this private matter."
 latria_sexual_frustration_flavor.1210.desc: "The hour is late, and I remain alone with this worry."
 latria_sexual_frustration_flavor.1210.a: "Call for someone I trust and tell them everything."
 latria_sexual_frustration_flavor.1210.b: "Swallow the words and bear the long night alone."

 latria_sexual_frustration_flavor.1202.c: "Change the subject and ask after my companions."
 latria_sexual_frustration_flavor.1202.d: "Invite them all to tea and talk until we tire."
 latria_sexual_frustration_flavor.1203.c: "Ask the priest to stay and study the teachings with me."
 latria_sexual_frustration_flavor.1204.c: "Put on my nightgown and consider the day's thoughts slowly."
 latria_sexual_frustration_flavor.1205.c: "Arrange the watches and allow myself a little rest."
 latria_sexual_frustration_flavor.1205.d: "List tomorrow's duties, one by one."
 latria_sexual_frustration_flavor.1206.c: "Turn the conversation with a new poem."
 latria_sexual_frustration_flavor.1207.c: "Sit before the scripture and finish this chapter."
 latria_sexual_frustration_flavor.1208.c: "Rest the horses and study the tracks at leisure."
 latria_sexual_frustration_flavor.1209.c: "Stoke the fire, brew tea, and read an old book."
 latria_sexual_frustration_flavor.1209.d: "Make a poem of the words I never spoke."
 latria_sexual_frustration_flavor.1210.c: "Plan tomorrow and put each task in order."
