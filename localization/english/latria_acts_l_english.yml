 latria_act.0201.t: "The Inner Room"
 latria_act.0201.desc: "I wait until the outer room has emptied, and even the last passing lamp has gone, before I lower the bolt myself. After the voices disappear, only the wick cracks now and then.\n\nMy clothes lie over the chair. I lower the lamp until the candle beside the bed is all that remains, then lie for a long time in bedclothes that hold no second person. The night is not short. Some desires arrive clearly and depart slowly, like water washing over the same stone, withdrawing, and quietly returning.\n\nWhen my breathing finally steadies, daylight is at the window. I listen to my heartbeat, and then to the empty room, before I remember to smooth the bed and make the night look as though nothing had happened."
 latria_act.0201.a: "Dress, and unbolt the door."
 latria_act.0301.t: "The Body's Limit"

 latria_act.0301.desc.illness: "The night has not fully passed, but the discomfort arrives ahead of morning.\n\nI mean to sit up. Heat rises through my brow instead. My limbs feel as though they have been exchanged for someone else's: I try twice, and they still refuse me. The bedclothes are heavy and hot, and even my breath carries a dry sweetness. I try to call the person outside, but the sound reaches only my lips.\n\nLight gathers slowly at the window. I watch it cross the frame, hoping the fever will leave quickly, and suspecting that it will not be so obedient."
 latria_act.0301.desc.stress: "My body has stopped, and I have drawn my hands out of the bedclothes, but my thoughts have not stopped.\n\nI lie awake and go back over the night several times. Where my breath grew disordered, which sentence should never have been spoken, and where I pushed myself too far: all of it remains clear. Beyond the bed curtains the room is quiet, and the quiet only makes those thoughts louder. Even the distant watchman's call seems to count them.\n\nI turn, then turn back. Near dawn the pillow has been shifted several times, and I am still awake."
 latria_act.0301.desc.health: "I mean to get up for a cup of water. The moment my foot touches the floor, the room darkens.\n\nI catch the edge of the bed and rest my brow against my own hand. My heart beats fast and hollow, as though I had run a long way, though I have only risen from the pillow. The cup is only a few steps away, and everything in the room remains where it was. My body seems to have reached its end.\n\nIt is some time before the darkness withdraws. I do not go for the water after all. I only lie down again."
 latria_act.0301.a: "Lie down, and think of nothing."
 latria_act.0311.t: "Long Depletion"
 latria_act.0311.desc.illness: "This did not fall upon me in a single night.\n\nThose excessive nights were scattered, and I kept believing one sleep and one hot meal would repay them. This morning the heat spreads from my chest into my fingers, and I understand that they joined long ago. Water does not ease the dryness. Blankets do not warm me. Even the wind at the window seems to pass through my bones.\n\nI lie listening to people pass outside and have to ration even the strength required to call someone. The sickness did not break in. It has been taking residence within me."
 latria_act.0311.desc.stress: "The weariness is not in my limbs. It lies across my sleep and will not let me in.\n\nI close my eyes, and faces from the day, breaths from the night, and moments I had no time to regret all press in together. My body is too spent to lift a hand, yet my mind remains lit, brightly enough to weary me. I count my breaths and the watches beyond the window. Neither can darken those images.\n\nThe cock has crowed, and daylight has come. I only shift from one side of the pillow to the other, and remain awake."
 latria_act.0311.desc.infertile: "At first it was one absent sign. I did not take it to heart, but then there were many such days.\n\nI counted the days that ought to have arrived and would not speak of them, afraid that speaking would make them true. Today the physician finally sets before me the thing I have kept walking around: my body can no longer conceive a child. His voice is not loud, yet nothing else in the room can cover it.\n\nAfter he leaves, I rest a hand upon my belly. A long while passes before I let the words truly settle."
 latria_act.0311.desc.health: "Once I could have called this faintness the result of sleeping too late, and got past it with a cup of hot wine and half a day of quiet.\n\nNow even sitting up requires a pause at the edge of the bed. A belt feels heavier than it used to, and so does a cup. The distance from window to door seems longer than it is. Only when I see my color in the mirror do I believe this debt cannot be repaid by a night or two of rest. The person in the glass looks at me as though knowing it sooner than I do.\n\nI lie down again. This time, my body decides before I do."
 latria_act.0311.a: "Set the day's business aside and take to bed."
