 latria_act.0101.t: "Behind the Door"
 latria_act.0101.desc: "When the door shuts, people are still talking quietly in the passage. Their footsteps recede, and the line of light in the crack narrows with them. Only then do I turn and see [latria_partner.GetShortUIName] already seated at the edge of the bed, clothes still over one arm, as though forgotten after coming in.\n\nThe lamp has been lowered. Neither of us moves to gather what lies across the chair, though the bedclothes soon grow warm. The night passes slowly enough for me to hear every small crack of the wick. When I look at the window again, daylight is there, and the outer half of the bed has gone cold.\n\nA servant knocks twice and stops, as though unsure whether we may yet be disturbed. Only then do I remember how much of the day is already waiting for me."
 latria_act.0101.desc.adultery: "I listen at the door for a long while. The voices in the passage thin out, and even the servant leaves with an empty lamp, before I open a crack and let [latria_partner.GetShortUIName] slip through sideways. The bolt makes only a small sound. Tonight it seems to last a long time.\n\nWe keep our voices low. More than once, footsteps pass outside, and both of us fall still, even setting our breath aside, until they turn away. The lamplight falls on the curtains and on our eyes whenever they stray toward the crack.\n\nAt parting, [latria_partner.GetSheHe] looks back at me from the threshold. There is no need to say it again. No third person ought to hear of tonight."
 latria_act.0101.desc.dead: "At first I think [latria_partner.GetShortUIName] has only fallen into a heavy sleep. I speak [latria_partner.GetHerHis] name close to one ear, then move the lamp beside [latria_partner.GetHerHis] face. The flame jumps, and still shows me eyes that do not answer.\n\nI lay a hand upon [latria_partner.GetHerHis] chest. The stillness beneath my palm frightens me. The bedclothes keep the warmth of a moment ago, and the pillow still holds its hollow, but the breath is gone. I hold the hand as it cools, as though I might yet call it back.\n\nAt last I wrench the door open and call for a physician. My own voice strikes the passage and returns, no longer sounding like mine."
 latria_act.0101.desc.adultery_dead: "I thought the worst this night could bring was someone opening the door upon two people who should not have been seen together.\n\nInstead, [latria_partner.GetShortUIName] collapses first. I call [latria_partner.GetHerHim], shake [latria_partner.GetHerHim], and hold the lamp to [latria_partner.GetHerHis] face. The eyes do not open. No breath stirs at the lips. The hand that was warm a moment ago cools little by little in mine.\n\nFootsteps sound outside. I look at the disordered bed, the clothes not yet put on, and someone who will never wake. When that door opens, I do not have even one sentence ready to speak."
 latria_act.0101.desc.actor_dissatisfied: "The night is still deep when I sit up and draw the sleeve back over my arm.\n\n[latria_partner.GetShortUIName] turns beneath the covers, as though there were something left to say, and lightly touches my wrist. I feel only how long and empty the hours have been. Even the wish to reach for [latria_partner.GetHerHim] has gone. A spark cracks in the lamp, but the room grows no warmer.\n\nI take my clothes from the chair without looking back. Some encounters make one long for the passage outside the longer they are allowed to last."
 latria_act.0101.desc.partner_dissatisfied: "On arriving, [latria_partner.GetShortUIName] paused in the doorway, looked first at the lamp and then at me, as though reluctant to let the night begin at once.\n\nLeaving is much quicker. The belt is not yet tied before [latria_partner.GetSheHe] is out of bed, avoiding both my eyes and my hands. I speak [latria_partner.GetHerHis] name. [latria_partner.GetSheHe|U] answers once and leaves no farewell. As the door closes, the draught it raises bends the flame.\n\nThe room still holds [latria_partner.GetHerHis] presence. The edge of the bed has already cooled, as though no one had sat there at all."
 latria_act.0101.desc.manual: "We never go as far as the bed.\n\n[latria_partner.GetShortUIName] sits beside me and begins to speak of the day's unfinished business, then stops halfway through a sentence. The kisses are light, and the caresses remain at a sleeve or in the hair. A watchman's call passes outside the window. Neither of us counts it.\n\nAt last the lamp oil fails. We sit a little longer in the dark, listening as each other's breathing grows steady, before each of us straightens a sleeve. For tonight, this is enough."
 latria_act.0101.a: "Open the door and return to the day."
 latria_act.0102.desc: "I could remind [latria_actor.GetShortUIName] how late it has grown, and that people will be waiting tomorrow. The words reach my lips and go no farther.\n\nOnce the door is shut, footsteps and voices withdraw. The lamplight warms the curtains, and neither of us is quick to rise. I listen as [latria_actor.GetHerHis] breathing passes from disorder into stillness, and I too forget the hour. When I look toward the window again, daylight is there. The servants outside have likely been waiting for some time.\n\nOnly then do I let go of [latria_actor.GetHerHis] hand. Some nights should not be hurried to their end."
 latria_act.0102.desc.adultery: "When [latria_actor.GetShortUIName] is ready to leave, I go to the door and set my ear against the wood.\n\nThe passage is empty for a while. Then someone carries a lamp past. Its light moves slowly across the crack and slowly away again. Neither of us speaks, nor do we let our clothes make a sound. Only when the quiet returns does [latria_actor.GetSheHe] straighten [latria_actor.GetHerHis] clothes.\n\nI open the door just wide enough for [latria_actor.GetHerHim] to pass sideways. For tonight, at least, the secret still belongs to the two of us."
 latria_act.0102.desc.partner_dissatisfied: "Before the door closed, I was still imagining what the night might be. I had even turned the lamp warmer in advance.\n\nOnce we are truly alone, that expectation cools. [latria_actor.GetShortUINamePossessive] hands, breath, and every closeness that ought to have made me linger all seem to reach me through something. I answer, but my eyes keep drifting toward the door and my thoughts toward the passage beyond it.\n\nIn the end I sit up first and draw my sleeve straight. Tonight was not worth the time I spent waiting for it."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] rises without letting me light the lamp again. Only a little pale light remains beside the window.\n\nI am still lying down, searching for something to say that might keep the night from ending so sharply. [latria_actor.GetSheHe|U] turns aside, offers two careless sentences, and is already tying a belt, without taking the clothes I hold out. My words are unfinished when [latria_actor.GetSheHe] starts for the door.\n\nCold air comes in as it opens. Some disappointments require no explanation."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] does not draw me toward the bed, but sits beside me and moves aside the cushion between us.\n\nThe unfinished business of the day suddenly seems able to wait. We trade kisses, and a few sentences that do not need to be completed. Hands linger at a sleeve or in the hair, and go no deeper. Beyond the window it is still dark, and the watchman's call is still far off.\n\nAt parting, [latria_actor.GetSheHe] smooths the fold I have disordered in my own clothes. The night is short, but it leaves no sense of something withheld."

 latria_scheme.0010.t: "The Act"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "My [spouse|E]"
 latria_scheme.0010.t.concubine: "My [concubine|E]"
 latria_scheme.0010.t.soulmate: "My [soulmate|E]"
 latria_scheme.0010.t.lover: "My [lover|E]"
 latria_scheme.0010.t.adultery: "An Affair"
 latria_scheme.0010.desc: "The candles are still burning, but [target.GetShortUIName] no longer answers me.\n\nI speak [target.GetHerHis] name, then lower my ear to [target.GetHerHis] lips. There is nothing. The skin beneath my fingers is colder than it was a moment ago, though our warmth still clings to the bedclothes. [target.GetHerHis|U] hand slips from mine and does not return.\n\nI meant to clear away the cups, the clothes, and every trace of this night before daylight. Now there is only someone beside me who will never stir. The window is growing pale, and I do not know which thing I ought to conceal first."
 latria_scheme.0010.a: "Draw the covers over [target.GetHerHim], then open the door."
 latria_scheme.0020.t: "A Night of Waiting"
 latria_scheme.0020.desc: "The lamp has burned low, and still I do not hear [target.GetFirstName] at the door.\n\nI warm the wine twice and fold the clothes upon the chair again. Now and then someone passes in the corridor. When the steps approach, I hold my breath. When they recede, I am alone once more. Each time, I think it is [target.GetSheHe].\n\nAt last the candle gutters, and wax drops into the tray. Only then do I admit that the night is over. The wine, the words, and the excuse I prepared will none of them be needed."
 latria_scheme.0020.a: "Put out the light. There is no point in waiting."
 latria_scheme.0030.t: "News That Comes Too Late"
 latria_scheme.0030.desc: "I am still weighing which side door is more private, and which invitation would rouse the least suspicion, when the news is set upon my table.\n\n[target.GetFirstName] is already gone from the world. There are few words on the paper. I read them for a long time. The unsent letters, the passages I have memorized, the excuse prepared for this one night: all of it is suddenly useless.\n\nI pour out the wine while it is still warm. Some arrangements can wait for a better night. None of them can overtake a death that has already happened."
 latria_scheme.0030.a: "Burn the letter I never sent."
 latria_scheme.0040.t: "A Broken Thread"
 latria_scheme.0040.desc: "I send someone to find [target.GetFirstName], and I wait from afternoon until the lamps are lit. All that returns is a vague reply: [target.GetSheHe] can no longer be reached.\n\nPerhaps a door is being watched more closely than before. Perhaps some pair of eyes has grown wary. Or perhaps [target.GetSheHe] simply will not come near the light I have left burning. I ask twice. The messenger can tell me nothing more.\n\nThe reason no longer matters. The thread has broken between my fingers. I crush the scrap of paper on which I wrote the hour, until sweat blurs the marks."
 latria_scheme.0040.a: "This ends here."

