 latria_wedding_night.t: "The Wedding Night"
 latria_wedding_night.desc: "The guests who accompanied the couple to their chamber have finally dispersed. Laughter remains in the passage, but the door is shut, leaving the day's courtesies, blessings, and seemingly endless wine outside.\n\nLamplight warms the curtains. The bed is newly made, the clothes newly changed, and even the way they look at each other is still a little unfamiliar. [latria_actor.GetShortUIName] and [latria_partner.GetShortUIName] sit facing each other for a while. Neither is quick to speak first. They only listen as the people beyond the door gradually withdraw.\n\nAfter tonight, they will no longer be merely the newly married pair named by their guests."

