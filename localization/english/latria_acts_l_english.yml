 latria_act.0101.t: "Behind the Door"
 latria_act.0101.desc: "The door closes, and the footsteps in the passage fade. [latria_partner.GetShortUIName] and I remain together until daylight.\n\nOnly the servant's knock reminds me of the day's business."
 latria_act.0101.desc.adultery: "I wait until the passage is empty before letting [latria_partner.GetShortUIName] in.\n\nBefore we part, we agree on one thing: no one else is to hear of tonight."
 latria_act.0101.desc.dead: "I call [latria_partner.GetShortUINamePossessive] name, then call again. There is no answer, nor any breath.\n\nI pull the door open and shout for someone to fetch a physician."
 latria_act.0101.desc.adultery_dead: "I thought discovery was the worst that could happen, until [latria_partner.GetShortUIName] collapsed and did not wake.\n\nFootsteps approach outside. How am I to explain this?"
 latria_act.0101.desc.actor_dissatisfied: "I rise while it is still dark. [latria_partner.GetShortUIName] seems about to say something, but I have had enough of this disappointing encounter."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] is far quicker to leave than to arrive. [latria_partner.GetSheHe|U] avoids my eye and offers no word of farewell."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] and I find a quiet place together, content with kisses and caresses. Neither of us watches the hour."
 latria_act.0101.a: "Leave"
 latria_act.0102.desc: "I do not ask [latria_actor.GetShortUIName] to leave. Once the door is shut, the night is ours.\n\nBy daylight, the servants have been waiting outside for some time."
 latria_act.0102.desc.adultery: "Before [latria_actor.GetShortUIName] leaves, I listen at the door.\n\nThe passage is empty. For tonight, at least, our secret remains our own."
 latria_act.0102.desc.partner_dissatisfied: "I had looked forward to being alone with [latria_actor.GetShortUIName]. Now I only wish to leave. Tonight has scarcely been worth the anticipation."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] rises with little patience to spare. I try to speak, but [latria_actor.GetSheHe] offers only a few curt words before making for the door."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] sits beside me, and for a while we put our duties aside, asking no more of each other than kisses and caresses.\n\nIt is still dark when we part."

