l_english:
 trait_latria_wanton_bloom: "the Wanton's Bloom"
 trait_latria_wanton_bloom_desc: "The night among the flowers and willows exacts its slow toll. The flesh wastes, the humors thin, and Venus collects her debt by inches."
 trait_latria_wanton_bloom_character_desc: "The night among the flowers and willows exacts its slow toll on [ROOT.GetCharacter.GetFirstNameNoTooltip]. The flesh wastes, the humors thin, and Venus collects her debt by inches."
 trait_track_latria_wanton_bloom: "the Wanton's Bloom"
 trait_track_latria_wanton_bloom_desc: "Each dawn finds the body lighter and the spirit dimmer."
 trait_latria_bone_fire: "the Bone-Fire"
 trait_latria_bone_fire_desc: "A dry heat rises from the marrow as though the bones themselves were steamed. Night sweats soak the sheets, and blood follows the cough."
 trait_latria_bone_fire_character_desc: "A dry heat rises from the marrow of [ROOT.GetCharacter.GetFirstNameNoTooltip] as though the bones were steamed. Night sweats soak the sheets, and blood follows the cough."
 trait_track_latria_bone_fire: "the Bone-Fire"
 trait_track_latria_bone_fire_desc: "The marrow burns hotter with every passing night."
 trait_latria_wanton_madness: "the Wanton's Madness"
 trait_latria_wanton_madness_desc: "The pleasures of Venus have curdled into madness. The mind wanders, the hand trembles, and no physician's art can call the wits back home."
 trait_latria_wanton_madness_character_desc: "The pleasures of Venus have curdled into madness in [ROOT.GetCharacter.GetFirstNameNoTooltip]. The mind wanders, the hand trembles, and no art can call the wits back home."
 trait_track_latria_wanton_madness: "the Wanton's Madness"
 trait_track_latria_wanton_madness_desc: "Reason slips a little further with each moon."
 trait_latria_bayberry_pox: "Bayberry Pox"
 trait_latria_bayberry_pox_desc: "A wanderer of the stews carried more than memory home. Berry-red blossoms rise upon the skin and refuse to fade."
 trait_latria_bayberry_pox_character_desc: "A wanderer of the stews, [ROOT.GetCharacter.GetFirstNameNoTooltip] carried more than memory home. Berry-red blossoms rise upon the skin and refuse to fade."
 trait_track_latria_bayberry_pox: "Bayberry Pox"
 trait_track_latria_bayberry_pox_desc: "Fresh berry-red blooms crowd the skin."
 trait_latria_hidden_rot: "the Hidden Rot"
 trait_latria_hidden_rot_desc: "What began as a heat in the blood has sunk deep. The corruption gnaws from within, hollowing the body root and branch."
 trait_latria_hidden_rot_character_desc: "What began as a heat in the blood has sunk deep in [ROOT.GetCharacter.GetFirstNameNoTooltip]. The corruption gnaws from within, hollowing the body root and branch."
 trait_track_latria_hidden_rot: "the Hidden Rot"
 trait_track_latria_hidden_rot_desc: "The rot spreads unseen beneath the skin."
 latria_sti.1.t: "The Wanton's Bloom Takes Root"
 latria_sti.1.desc: "A fever of the blood, a wasting of the flesh - the price of one night among the flowers and willows has come due. [ROOT.GetCharacter.GetFirstNameNoTooltip] will not soon be whole again."
 latria_sti.1.a: "So this is the toll of Venus."
 latria_sti.2.t: "The Bone-Fire Rises"
 latria_sti.2.desc: "A dry heat climbs from the marrow, and the sheets are soaked with sweat by dawn. [ROOT.GetCharacter.GetFirstNameNoTooltip] coughs, and blood flecks the linen."
 latria_sti.2.a: "The flesh burns from within."
 latria_sti.3.t: "The Wanton's Madness Descends"
 latria_sti.3.desc: "The night's pleasure has curdled into a fever of the mind. [ROOT.GetCharacter.GetFirstNameNoTooltip] speaks to shadows and cannot still trembling hands."
 latria_sti.3.a: "The wits have gone wandering."
 latria_sti.4.t: "The Bayberry Pox Blooms"
 latria_sti.4.desc: "Berry-red blossoms have risen on the skin of [ROOT.GetCharacter.GetFirstNameNoTooltip], and they will not fade. A gift from the stews, worn for all to see."
 latria_sti.4.a: "Let no one mistake this for spring."
 latria_sti.5.t: "The Hidden Rot Spreads"
 latria_sti.5.desc: "What was a heat in the blood has sunk deep. [ROOT.GetCharacter.GetFirstNameNoTooltip] feels the corruption gnawing from within, hollowing root and branch."
 latria_sti.5.a: "It eats unseen."