l_english:
 latria_sexual_frustration_flavor.1301.t: "An Invitation Unsent"
 latria_sexual_frustration_flavor.1301.desc.female: "In my nightgown, I sit at the desk with a single name on the page. My maid asks whether to deliver it. I fold the letter and do not answer."
 latria_sexual_frustration_flavor.1301.desc.male: "In my nightgown, I sit at the desk with a single name on the page. A servant waits outside to carry it, but I cannot bring myself to seal the letter."
 latria_sexual_frustration_flavor.1301.desc: "An unsealed letter has waited beneath the candle for some time."
 latria_sexual_frustration_flavor.1301.a: "Give it to the servant"
 latria_sexual_frustration_flavor.1301.b: "Cast the page into the fire"

 latria_sexual_frustration_flavor.1302.t: "A Court's Judgment"
 latria_sexual_frustration_flavor.1302.desc.accepted: "The court poet makes a jest of old affections, and not even the sternest nobles frown. I raise my cup with them, though I find no ease in it."
 latria_sexual_frustration_flavor.1302.desc.strict: "A noble has lost face over an affair, and the court speaks of the whole family. I listen to their judgment, knowing I might stand on the same scale."
 latria_sexual_frustration_flavor.1302.desc: "The conversation turns to reputation and desire."
 latria_sexual_frustration_flavor.1302.a: "Take up the cup"
 latria_sexual_frustration_flavor.1302.b: "Find an excuse to leave"

 latria_sexual_frustration_flavor.1303.t: "The Midnight Bell"
 latria_sexual_frustration_flavor.1303.desc.favors: "After the bell, the priest remains by the door. He says desire can be turned toward good, but I do not know whether I can wait any longer."
 latria_sexual_frustration_flavor.1303.desc.condemns: "The bell tolls again and again, as does the priest's vow upon my heart. My knees ache from kneeling, and still no answer comes."
 latria_sexual_frustration_flavor.1303.desc: "Midnight prayer has brought no calm, though the bells continue to ring."
 latria_sexual_frustration_flavor.1303.a: "Pray once more"
 latria_sexual_frustration_flavor.1303.b: "Leave the sanctuary"

 latria_sexual_frustration_flavor.1304.t: "The End of Patience"
 latria_sexual_frustration_flavor.1304.desc.lustful: "I pace the chamber in my nightgown. The chessboard sent by my attendant remains untouched; waiting has become its own torment."
 latria_sexual_frustration_flavor.1304.desc.chaste: "I retie the sash of my nightgown, trying to make every movement seem composed. The more careful I am, the harder it is to ignore my longing."
 latria_sexual_frustration_flavor.1304.desc: "The room is quiet. I can no longer sit still."
 latria_sexual_frustration_flavor.1304.a: "Leave the chamber"
 latria_sexual_frustration_flavor.1304.b: "Return to the desk"

 latria_sexual_frustration_flavor.1305.t: "A Room After Nightfall"
 latria_sexual_frustration_flavor.1305.desc.emperor: "The court has retired, but I remain in my chamber in formal robes. The petitions are answered; the thoughts that trouble me have not left with the lords."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "I let the company ride ahead and rest alone in an inn chamber. My gear is packed and tomorrow's route is set, but I cannot settle my thoughts."
 latria_sexual_frustration_flavor.1305.desc.clergy: "I remain alone in my small room at the monastery, still wearing my robes. The candle beside the bed has gone dark. My vow remains, but comfort does not come."
 latria_sexual_frustration_flavor.1305.desc.ruler: "I return to an empty chamber in formal clothes. The guards bow outside, but no one within can share this burden."
 latria_sexual_frustration_flavor.1305.desc: "The chamber is empty, but I am not ready to lie down."
 latria_sexual_frustration_flavor.1305.a: "Send for someone I trust"
 latria_sexual_frustration_flavor.1305.b: "Wait alone until dawn"

 latria_sexual_frustration_flavor.1306.t: "A Messenger at Midnight"
 latria_sexual_frustration_flavor.1306.desc.female: "In my nightgown, I sit beside the bed and hear two quiet knocks. My maid brings only a blank sheet, yet I know whose message I am waiting for."
 latria_sexual_frustration_flavor.1306.desc.male: "I open the chamber door in my nightgown, but the passage is already empty. The unsigned note on the threshold leaves me sleepless."
 latria_sexual_frustration_flavor.1306.desc: "The footsteps fade beyond the door. The page on my desk remains blank."
 latria_sexual_frustration_flavor.1306.a: "Write the words I have delayed"
 latria_sexual_frustration_flavor.1306.b: "Leave the page untouched"

 latria_sexual_frustration_flavor.1307.t: "Silence at the Table"
 latria_sexual_frustration_flavor.1307.desc.accepted: "The poet recites an old romance, and the company listens with delight. I raise my cup with them, thinking of a story no one has told."
 latria_sexual_frustration_flavor.1307.desc.strict: "The table speaks of a noble who lost favor over an affair, and the laughter dies away. I turn toward the window, hiding my expression."
 latria_sexual_frustration_flavor.1307.desc: "The cups keep passing, but the conversation lingers on a subject best left alone."
 latria_sexual_frustration_flavor.1307.a: "Take up the cup"
 latria_sexual_frustration_flavor.1307.b: "Rise and take my leave"

 latria_sexual_frustration_flavor.1308.t: "A Prayer Through the Vigil"
 latria_sexual_frustration_flavor.1308.desc.favors: "The bell marks the night watch, and I remain in the chapel at prayer. My faith does not condemn carnal pleasure, yet I do not know how to face this lasting longing."
 latria_sexual_frustration_flavor.1308.desc.condemns: "I repeat the prayer of chastity in the chapel. The bell fades, but the thought within me does not."
 latria_sexual_frustration_flavor.1308.desc: "Candlelight falls across the empty benches. I have not risen."
 latria_sexual_frustration_flavor.1308.a: "Remain until morning prayer"
 latria_sexual_frustration_flavor.1308.b: "Close the prayer book and leave"

 latria_sexual_frustration_flavor.1309.t: "A Look in the Mirror"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Unclothed and alone before the chamber mirror, I stand for a moment. My expression has not changed, but I will no longer call desire a passing weakness."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Unclothed at the bedside, I repeat my vow. I remember every word, yet the longing within does not disappear."
 latria_sexual_frustration_flavor.1309.desc: "No one else is in the room. The silence in the mirror leaves me nowhere to look away."
 latria_sexual_frustration_flavor.1309.a: "Admit what I feel"
 latria_sexual_frustration_flavor.1309.b: "Dress and return to my desk"

 latria_sexual_frustration_flavor.1310.t: "Wakeful in My Quarters"
 latria_sexual_frustration_flavor.1310.desc.clergy: "After night prayer, I return to my small room at the monastery. My robes are still on and the bedside candle is dark, but I will not lie down."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "My companions have retired at the inn. Alone in my room, I put away my gear. Tomorrow's road is clear; the way through my thoughts is not."
 latria_sexual_frustration_flavor.1310.desc: "The hour is late. The door is shut, but I cannot sleep."
 latria_sexual_frustration_flavor.1310.a: "Stop before that door"
 latria_sexual_frustration_flavor.1310.b: "Return to my room"
