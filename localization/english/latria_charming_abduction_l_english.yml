 latria_charming_abduction_failure_puppeteer: "[target.GetShortUIName|U] has slipped out of [owner.GetShortUINamePossessive] snare"

 latria_charming_abduction.1001.t: "A Promise by the Pillow"
 latria_charming_abduction.1001.desc: "The bathwater is cooling, though its fragrance still lingers in the bedchamber. I lay my robe beside the bed and turn to the unsealed letter upon the table. It wants only a line that will keep [target.GetFirstName] awake.\n\nMy people know the side door and every turn of the passage. If [target.GetSheHe] dismisses [target.GetHerHis] attendants for the promise of a tender night, the heavy curtains will conceal a great deal. As for the pleasures [target.GetSheHe] imagines awaiting [target.GetHerHim] in my bed... first, [target.GetSheHe] must cross the threshold."
 latria_charming_abduction.1001.a: "Tell [target.GetHerHim] I shall be waiting by the bed."
 latria_charming_abduction.1001.b: "Invite [target.GetHerHim] for wine in the outer chamber. Warm wine, low candles."
 latria_charming_abduction.1001.c: "Seal the letter. There will be a better night."
 latria_charming_abduction.1001.d: "Put the letter in the fire. This ends here."
 latria_charming_abduction_wait_tt: "Continue preparing and wait for another opportunity to act."

 latria_charming_abduction.1101.t: "A Trace of Perfume"
 latria_charming_abduction.1101.desc: "A length of silk arrives with [target.GetFirstNamePossessive] reply, loosely knotted, as though the slightest tug might undo it. The words remain decorous, but the final lines crowd together: [target.GetSheHe] was eager to finish, yet reluctant to put down the quill.\n\nI wind the ribbon around a finger. What scent should my next letter carry? And what thoughts might follow it into [target.GetHerHis] bed?"
 latria_charming_abduction.1101.a: "Place a drop of perfume where I mention the night."
 latria_charming_abduction.1101.b: "Name the hour. Leave the letter unsigned."
 latria_charming_abduction.1101.c: "Set the reply beneath the candlestick. Let it wait."

 latria_charming_abduction.1102.t: "Another Pair of Eyes"
 latria_charming_abduction.1102.desc: "Word of [target.GetFirstNamePossessive] bedtime habits proves more useful than [target.GetHerHis] love letters. One attendant always remains after dusk, pouring wine and putting away clothes, unwilling to leave until the last candle is out.\n\nOne loyal servant could ruin a carefully arranged tryst. I must find something else for those watchful eyes to do."
 latria_charming_abduction.1102.a: "A purse of silver should buy the servant an evening's diversion."
 latria_charming_abduction.1102.b: "Add one line: come alone, and I shall have a surprise for you."
 latria_charming_abduction.1102.c: "Withdraw the invitation for now. That door can wait another night."

 latria_charming_abduction.2001.t: "When the Bolt Falls"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] enters the bedchamber with [target.GetHerHis] eyes still upon the candles beside the bed. I offer a hand, letting [target.GetHerHim] believe that one more step will bring me within reach.\n\nThe bolt clicks. [target.GetSheHe|U] turns, and the shadows behind the curtains rise to their feet. My people seize [target.GetHerHis] arms; the cord slips from a sleeve without so much as disturbing a candlestick.\n\nI reach for the clothes upon the chair. No one will share this pillow tonight."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] accepts the wine I have poured and turns a little, leaving the way to the inner chamber clear. [target.GetSheHe|U] expects me to take [target.GetHerHis] hand and lead [target.GetHerHim] somewhere more secluded.\n\nInstead, I set down my cup. The side door opens, and my people rush in. By the time [target.GetSheHe] thinks to call out, the bolt is down and the cords are tight.\n\nThe wine upon the table is scarcely touched."
 latria_charming_abduction.2001.secret: "\n\nNothing stirs in the passage. By the time the court notices [target.GetHerHis] absence, even the candle wax will be cold."
 latria_charming_abduction.2001.exposed: "\n\nA cry rises beyond the window. It seems someone will be telling the other half of this evening's story before dawn."
 latria_charming_abduction.2001.a: "Bring [target.GetHerHis] cloak. It is time we left."

 latria_charming_abduction.2002.t: "An Unfinished Evening"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] stops in the doorway. The candles, the bed, even my carefully measured silence fail to draw [target.GetHerHim] another step closer.\n\n\"It grows late.\" [target.GetHerHis|U] eyes stray past my shoulder to the motionless curtains.\n\nMy outstretched hand meets only the night air."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] leaves the wine untouched. For a moment [target.GetSheHe] stands beside the table, as though weighing my smile, then retreats towards the open door.\n\n\"Have them leave the lights burning. My people are waiting.\"\n\nThe footsteps behind the side door sound terribly loud."
 latria_charming_abduction.2002.secret: "\n\nI lower my hand before the hidden men can emerge. Tomorrow, someone may laugh at my unwelcome attentions. No one will know what was waiting behind that door."
 latria_charming_abduction.2002.exposed: "\n\nA loop of cord slips into view. [target.GetFirstNameNoTooltip] recoils, calling my name as [target.GetSheHe] backs towards [target.GetHerHis] guards. No one will mistake this for harmless flirtation now."
 latria_charming_abduction.2002.a: "Put out the candles. There will be no more invitations."
 latria_charming_abduction.2002.b: "Write a fresh letter and wait for another chance."
 latria_charming_abduction_retry_tt: "Prepare this scheme again, removing this attempt's approach modifier while keeping earlier invitation preparations."

 latria_charming_abduction.2101.t: "A Tender Snare"
 latria_charming_abduction.2101.bedchamber: "When I came to meet [owner.GetFirstName], I was still wondering how best to kiss [owner.GetHerHis] hand. The bedchamber was dimly lit, just enough to make one forget to look behind the curtains.\n\nOnly when my arms were wrenched behind my back did I understand why [owner.GetSheHe] had kept beyond my reach. There was no tenderness waiting for me here, only a length of cord."
 latria_charming_abduction.2101.antechamber: "I became [owner.GetFirstNamePossessive] prisoner before I could take a sip of wine.\n\n[owner.GetSheHe|U] set down [owner.GetHerHis] cup as though giving an agreed signal. A moment later, people poured through the side door and seized my arms. I kept looking at [owner.GetHerHim], waiting for an explanation. [owner.GetSheHe|U] merely told them to fetch my cloak."
 latria_charming_abduction.2101.a: "Turn away. I will not look at [owner.GetHerHim]."

 latria_charming_abduction.2102.t: "Behind the Candlelight"
 latria_charming_abduction.2102.secret: "[owner.GetFirstNamePossessive] invitation was tender enough, yet [owner.GetSheHe] seemed distracted when we met. Footsteps in the passage; cloth rustling behind a door. When I mentioned my guards, [owner.GetHerHis] smile stiffened.\n\nI made an excuse and left. Only when I stood among my own people did I notice the sweat upon my palms. Perhaps it was merely an awkward tryst. Perhaps I would be happier never knowing what lay behind that door."
 latria_charming_abduction.2102.exposed: "The glimpse of cord brought me sharply to my senses.\n\n[owner.GetFirstNamePossessive] whispers, the lowered candles, the distance [owner.GetSheHe] kept between us: all of it had been meant to hold me inside that room. I backed into the passage and called my guards, watching the figures behind the door shrink into shadow.\n\nI had almost sent everyone away for the sake of that smile."
 latria_charming_abduction.2102.a: "From now on, someone waits outside the door."

