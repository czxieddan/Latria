l_english:
 latria_sexual_frustration_1: "Restless Desire"
 latria_sexual_frustration_1_desc: "Unanswered desire has begun to disturb this character."
 latria_sexual_frustration_2: "Gnawing Desire"
 latria_sexual_frustration_2_desc: "Desire returns again and again, making composure difficult."
 latria_sexual_frustration_3: "Carnal Frustration"
 latria_sexual_frustration_3_desc: "Long-denied carnal desire weighs on body and mind."
 latria_sexual_frustration_4: "Tormented Desire"
 latria_sexual_frustration_4_desc: "The strain of restraint now colors every waking hour."
 latria_sexual_frustration_5: "Unbearable Desire"
 latria_sexual_frustration_5_desc: "Desire has become an intolerable burden."

 latria_act.0401.t: "A Restless Night"
 latria_act.0401.desc: "Sleep comes slowly. The desire I set aside returns once the chamber is still."
 latria_act.0401.a: "Turn beneath the covers"
 latria_act.0402.t: "No Quiet"
 latria_act.0402.desc: "The smallest distraction gives way to the same unfulfilled longing."
 latria_act.0402.a: "Steady my thoughts"
 latria_act.0403.t: "Denied Desire"
 latria_act.0403.desc: "Restraint has ceased to feel like patience. It presses against every calm thought."
 latria_act.0403.a: "Endure"
 latria_act.0404.t: "At the Breaking Point"
 latria_act.0404.desc: "I cannot find ease in sleep, prayer, or labor. The strain follows me everywhere."
 latria_act.0404.a: "Hold myself together"
 latria_act.0405.t: "Nothing Left"
 latria_act.0405.desc: "The burden has swallowed every quieter thought. I can see no end to it."
 latria_act.0405.a: "Let it end"
 latria_act.0405.b: "Bear it"
