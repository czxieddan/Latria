 game_concept_latria_sexual_repression: "Repression"
 game_concept_latria_sexual_repression_desc: "Repression measures a character's unrelieved sexual desire. It rises over time and falls when the character finds carnal relief."
 game_concept_latria_sexual_repression_level: "Repression Level"
 game_concept_latria_sexual_repression_level_desc: "[latria_sexual_repression|E] levels increase at #V 20#!, #V 50#!, #V 100#!, #V 180#!, and #V 300#! Repression. Each level applies its corresponding character modifier."

