 latria_act.0401.t: "A Restless Night"
 latria_act.0401.desc: "The room is still, and I am the only one awake. The desire I set aside comes back on its own, warm against my back. The candle burns low; the air beneath the bed curtains rises.\n\nI count my breaths, lose the count, and begin again. The day's small tasks surface one by one; beneath them all lies the same unfulfilled longing.\n\nThe quieter the room, the clearer it grows. I know this night will find me awake, listening to the bedboards until dawn."
 latria_act.0401.a: "Turn beneath the covers"
 latria_act.0402.t: "No Quiet"
 latria_act.0402.desc: "Halfway through morning prayer, the same longing slips in between the words. I stop and count my breaths from the beginning; when they even out, it is still there.\n\nThe chant moves through the hall. My lips follow, but the verses will not stay; those kneeling on either side keep their heads bowed. The longing rests on my chest, heavier by the minute.\n\nWhen the incense burns down, I close the book, knowing it will come back with the night."
 latria_act.0402.a: "Steady my thoughts"
 latria_act.0403.t: "Denied Desire"
 latria_act.0403.desc: "Restraint has ceased to feel like patience. It presses against my chest and shoves every calm thought aside.\n\nOne task after another leaves my hands, yet my thoughts circle back to the same place. The candle flame stirs and the heat rises again. I set the work down and wait for it to pass; it stays longer each time.\n\nNights like this, I will not hold out much longer."
 latria_act.0403.a: "Endure"
 latria_act.0404.t: "At the Breaking Point"
 latria_act.0404.desc: "Sleep will not come; prayer cannot hold it down; the day's labor will not crowd it out. At night it is loudest; by day it waits behind every pause.\n\nToward evening I hope for a knock at the door, if only a word of greeting. The door opens, and it is always a servant with water, who sets down the bowl and withdraws.\n\nOnce the door closes, the room is quieter than before."
 latria_act.0404.a: "Hold myself together"
 latria_act.0405.t: "Too Much to Bear"
 latria_act.0405.desc: "I do not want to keep holding out. Through the day the heat stays in my chest, and even the smallest familiar task will not obey my hands.\n\nAt night sleep refuses me; I lie awake and listen to the candle burn itself down. The heat presses on my chest and will not leave.\n\nThere is no end to this in sight."
 latria_act.0405.a: "Draw a deep breath"
 latria_sexual_frustration_collapse_warning_tt: "I cannot hold on much longer…"
 latria_act.0405.b: "Bear it"
