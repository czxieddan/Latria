 latria_solo_relief_interaction: "Samotny dotyk"
 latria_solo_relief_interaction_desc: "Cielesne uciechy w samotności."
 latria_solo_relief_send: "Rozpocznij"
 latria_solo_relief_night_tt: "Masz nadzieję spędzić noc w samotności."
 latria_act.0201.t: "Wewnętrzna komnata"
 latria_act.0201.desc: "Czekam, aż zewnętrzna izba opustoszeje i odejdzie nawet ostatnia mijająca lampa, zanim sam opuszczę rygiel. Gdy głosy znikają, tylko knot czasem trzaska.\n\nUbranie leży na krześle. Przygaszam lampę, aż przy łóżku zostaje sama świeca, i długo leżę w pościeli, w której nie ma drugiej osoby. Noc nie jest krótka. Niektóre pragnienia przychodzą jasno i odchodzą powoli, jak woda obmywająca ten sam kamień, cofająca się i cicho wracająca.\n\nGdy oddech wreszcie się uspokaja, w oknie jest już dzień. Słucham własnego serca, potem pustej izby i dopiero wtedy przypominam sobie, by wygładzić łóżko i nadać nocy wygląd, jakby nic się nie stało."
 latria_act.0201.a: "Ubrać się i otworzyć rygiel."
 latria_act.0301.t: "Granice ciała"
 latria_act.0301.desc.illness: "Noc jeszcze nie całkiem minęła, a niedyspozycja przychodzi przed rankiem.\n\nChcę usiąść. Zamiast tego gorąco podnosi się do czoła. Kończyny zdają się zamienione na cudze: próbuję dwa razy i wciąż mnie nie słuchają. Pościel jest ciężka i gorąca, nawet oddech ma suchą słodycz. Chcę zawołać kogoś na zewnątrz, ale dźwięk dochodzi tylko do warg.\n\nŚwiatło powoli zbiera się w oknie. Patrzę, jak przekracza ramę, mając nadzieję, że gorączka szybko odejdzie, i podejrzewając, że nie będzie tak posłuszna."
 latria_act.0301.desc.stress: "Ciało się zatrzymało, a ja wyciągnąłem dłonie spod okrycia, ale myśli się nie zatrzymały.\n\nLeżę bezsennie i kilka razy wracam do nocy. Gdzie oddech się splątał, którego zdania nie należało wypowiadać i gdzie zapędziłem się za daleko: wszystko zostaje jasne. Za zasłonami łóżka jest cicho, a cisza tylko czyni myśli głośniejszymi. Nawet dalekie wołanie strażnika zdaje się je liczyć.\n\nObracam się i obracam z powrotem. Blisko świtu poduszka już kilka razy zmieniła kierunek, a ja wciąż nie śpię."
 latria_act.0301.desc.health: "Chcę wstać po kubek wody. Ledwo stopa dotyka podłogi, izba ciemnieje.\n\nChwytam krawędź łóżka i opieram czoło o własną dłoń. Serce bije szybko i pusto, jakbym długo biegł, choć tylko uniosłem się z poduszki. Kubek jest tylko o kilka kroków, a wszystko w izbie zostało na miejscu. Ciało zdaje się dojść do kresu.\n\nMija chwila, zanim ciemność ustępuje. W końcu nie idę po wodę. Tylko znów się kładę."
 latria_act.0301.a: "Położyć się i o niczym nie myśleć."
 latria_act.0311.t: "Długotrwałe wyczerpanie"
 latria_act.0311.desc.illness: "To nie spadło na mnie podczas jednej nocy.\n\nTamte nadmierne noce leżały osobno, a ja wciąż wierzyłem, że jeden sen i jeden ciepły posiłek je spłacą. Dziś rano gorąco rozchodzi się od piersi do palców i rozumiem, że dawno już się połączyły. Woda nie łagodzi suchości. Okrycia nie grzeją. Nawet wiatr przy oknie zdaje się przenikać kości.\n\nLeżę, słuchając ludzi przechodzących na zewnątrz, i nawet siłę potrzebną do zawołania kogoś muszę oszczędzać. Choroba nie wdarła się. Stopniowo zamieszkała we mnie."
 latria_act.0311.desc.stress: "Zmęczenie nie jest w członkach. Leży na śnie i nie wpuszcza mnie do środka.\n\nZamykam oczy, a twarze dnia, oddechy nocy i chwile, których nie zdążyłem żałować, tłoczą się razem. Ciało jest zbyt wyczerpane, by unieść dłoń, lecz umysł pozostaje zapalony dość jasno, by mnie męczyć. Liczę własne oddechy i straże za oknem. Nic nie może przyciemnić tych obrazów.\n\nKogut zapiał i nadszedł dzień. Przekładam się tylko z jednej strony poduszki na drugą i nie zasypiam."
 latria_act.0311.desc.infertile: "Najpierw nie nadszedł jeden znak. Nie wziąłem go do serca, ale potem takich dni było wiele.\n\nLiczyłem dni, które powinny nadejść, i nie chciałem o nich mówić, bojąc się, że wypowiedzenie uczyni je prawdziwymi. Dziś medyk kładzie wreszcie przede mną to, wokół czego ciągle chodziłem: moje ciało nie może już począć dziecka. Jego głos nie jest głośny, lecz nic innego w izbie nie może go pokryć.\n\nPo jego odejściu kładę dłoń na brzuchu. Długo trwa, zanim pozwalam tym słowom naprawdę osiąść."
 latria_act.0311.desc.health: "Dawniej mógłbym nazwać tę słabość skutkiem zbyt późnego snu i przejść przez nią z kubkiem gorącego wina i połową dnia spokoju.\n\nTeraz nawet aby usiąść, muszę zatrzymać się na krawędzi łóżka. Pas wydaje się cięższy niż dawniej, kubek także. Odległość od okna do drzwi wydaje się dłuższa, niż jest. Dopiero widząc swoją barwę w zwierciadle wierzę, że tego długu nie spłaci noc lub dwie spokoju. Osoba w szkle patrzy na mnie, jakby wiedziała to wcześniej ode mnie.\n\nZnów się kładę. Tym razem ciało decyduje przede mną."
 latria_act.0311.a: "Odłożyć sprawy dnia i odpocząć w łóżku."
 latria_act_exhausted_health: "Wyczerpanie"
 latria_act_exhausted_health_desc: "Ciało jeszcze nie odzyskało sił."
 latria_act_depleted_health: "Nadwątlone siły"
 latria_act_depleted_health_desc: "Długotrwały wysiłek zaszkodził ciału."

