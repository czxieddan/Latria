 latria_wedding_night.t: "Noc poślubna"
 latria_wedding_night.desc: "Goście, którzy odprowadzili nowożeńców do komnaty, wreszcie się rozeszli. Śmiech zostaje na korytarzu, ale drzwi są zamknięte i zostawiają na zewnątrz dzienne grzeczności, błogosławieństwa i niby nieskończone wino.\n\nŚwiatło lampy grzeje zasłony. Łóżko jest świeżo posłane, ubrania świeżo zmienione, a nawet sposób, w jaki na siebie patrzą, jest jeszcze trochę obcy. [latria_actor.GetShortUIName] i [latria_partner.GetShortUIName] przez chwilę siedzą naprzeciw siebie. Żadne nie spieszy się, by odezwać się pierwsze. Słuchają tylko, jak ludzie za drzwiami stopniowo odchodzą.\n\nPo tej nocy nie będą już tylko nowożeńcami, o których mówili goście."
 latria_serene_mind: "Rześkość i spokój"
 latria_serene_mind_desc: "Głęboko satysfakcjonujące intymne spotkanie ożywiło ciało i umysł."
