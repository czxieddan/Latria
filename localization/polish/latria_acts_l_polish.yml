 latria_act.0101.t: "Za drzwiami"
 latria_act.0101.desc: "Drzwi się zamykają, a kroki na korytarzu cichną. [latria_partner.GetShortUIName] i ja zostajemy razem do świtu.\n\nDopiero pukanie sługi przypomina mi o codziennych sprawach."
 latria_act.0101.desc.adultery: "Czekam, aż korytarz opustoszeje, i dopiero wtedy wpuszczam osobę, którą jest [latria_partner.GetShortUIName].\n\nPrzed rozstaniem uzgadniamy jedno: nikt inny nie może usłyszeć o tej nocy."
 latria_act.0101.desc.dead: "Wołam imię [latria_partner.GetShortUINamePossessive], potem wołam ponownie. Nie ma odpowiedzi ani oddechu.\n\nOtwieram drzwi i krzyczę, by ktoś sprowadził medyka."
 latria_act.0101.desc.adultery_dead: "Zdawało mi się, że najgorsze byłoby odkrycie naszego sekretu. Teraz [latria_partner.GetShortUIName] leży bez przytomności i nie daje się obudzić.\n\nZa drzwiami zbliżają się kroki. Jak mam to wyjaśnić?"
 latria_act.0101.desc.actor_dissatisfied: "Wstaję, gdy jest jeszcze ciemno. [latria_partner.GetShortUIName] zdaje się chcieć coś powiedzieć, lecz mam już dość tego rozczarowującego spotkania."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] wychodzi z większym pośpiechem niż przy wejściu. [latria_partner.GetSheHe|U] unika mojego wzroku i nie mówi ani słowa na pożegnanie."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] i ja znajdujemy spokojny kąt, poprzestając na pocałunkach i pieszczotach. Żadne z nas nie liczy godzin."
 latria_act.0101.a: "Wyjść"
 latria_act.0102.desc: "Nie proszę o odejście osoby, którą jest [latria_actor.GetShortUIName]. Gdy drzwi się zamykają, noc należy do nas.\n\nO świcie służba czeka już od dłuższej chwili."
 latria_act.0102.desc.adultery: "Zanim [latria_actor.GetShortUIName] wyjdzie, nasłuchuję przy drzwiach.\n\nKorytarz jest pusty. Przynajmniej tej nocy nasz sekret pozostaje tylko nasz."
 latria_act.0102.desc.partner_dissatisfied: "Tak bardzo chciało mi się sam na sam z osobą, którą jest [latria_actor.GetShortUIName]. Teraz chcę jedynie odejść. Ta noc nie była warta czekania."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] wstaje wyraźnie zniecierpliwiony. Próbuję coś powiedzieć, lecz [latria_actor.GetSheHe] rzuca tylko kilka zdawkowych słów i kieruje się ku drzwiom."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] siada obok mnie. Na chwilę odkładamy obowiązki, nie oczekując od siebie niczego poza pocałunkami i pieszczotami.\n\nGdy się rozstajemy, wciąż jest ciemno."

