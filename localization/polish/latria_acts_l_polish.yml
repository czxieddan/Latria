 death_latria_manual_strain: "śmierć od cielesnego dotyku"

 latria_act.0101.t: "Za drzwiami"
 latria_act.0101.desc: "Gdy drzwi się zamykają, na korytarzu wciąż mówi się cicho. Kroki się oddalają, a pasmo światła w szparze zwęża się wraz z nimi. Dopiero wtedy odwracam się i widzę, że [latria_partner.GetShortUIName] już siedzi na krawędzi łóżka, z ubraniem wciąż na ramieniu, jakby zapomniano o nim po wejściu.\n\nLampa jest przygaszona. Żadne z nas nie bierze tego, co leży na krześle, ale pościel wkrótce się ogrzewa. Noc płynie tak powoli, że słyszę każdy cichy trzask knota. Gdy znów patrzę w okno, jest już dzień, a zewnętrzna połowa łóżka wystygła.\n\nSłużący puka dwa razy i przystaje, jakby nie był pewien, czy można już nam przeszkodzić. Dopiero wtedy przypominam sobie, ile spraw czeka mnie za dnia."
 latria_act.0101.desc.adultery: "Długo nasłuchuję przy drzwiach. Głosy na korytarzu rzedną, a nawet sługa odchodzi z pustą lampą, zanim uchylam szparę i wpuszczam [latria_partner.GetShortUIName] bokiem. Rygiel wydaje tylko cichy dźwięk. Tej nocy zdaje się trwać długo.\n\nMówimy cicho. Nieraz przechodzą na zewnątrz kroki i zastygamy, wstrzymując nawet oddech, póki nie oddalą się w głąb korytarza. Światło lampy pada na zasłony i na nasze oczy, ilekroć zwracają się ku szparze.\n\nPrzy rozstaniu [latria_partner.GetSheHe] ogląda się na mnie z progu. Nie trzeba powtarzać. O tej nocy nie powinna usłyszeć trzecia osoba."
 latria_act.0101.desc.dead: "Najpierw myślę, że [latria_partner.GetShortUIName] tylko mocno [Select_CString(latria_partner.IsFemale, 'zasnęła', 'zasnął')]. Wypowiadam [latria_partner.GetHerHis] imię tuż przy uchu, potem przysuwam lampę do [latria_partner.GetHerHis] twarzy. Płomień drga i wciąż pokazuje mi oczy, które nie odpowiadają.\n\nKładę dłoń na [latria_partner.GetHerHis] piersi. Cisza pod nią mnie przeraża. Pościel zachowuje ciepło sprzed chwili, poduszka swoje wgłębienie, ale oddechu już nie ma. Trzymam [latria_partner.GetHerHis] dłoń, gdy stygnie, jakby można było jeszcze przywrócić [Select_CString(latria_partner.IsFemale, 'ją', 'go')] do życia.\n\nW końcu gwałtownie otwieram drzwi i wołam medyka. Mój głos uderza o korytarz i wraca, już niepodobny do mojego."
 latria_act.0101.desc.adultery_dead: "[Select_CString(ROOT.Char.IsFemale, 'Myślałam', 'Myślałem')], że najgorszą rzeczą tej nocy będzie, jeśli ktoś otworzy drzwi i zobaczy dwoje ludzi, których nie powinno się było zobaczyć razem.\n\nZamiast tego [latria_partner.GetShortUIName] osuwa się [Select_CString(latria_partner.IsFemale, 'pierwsza', 'pierwszy')]. Wołam, potrząsam i przystawiam lampę do [latria_partner.GetHerHis] twarzy. Oczy się nie otwierają. Przy wargach nie porusza się oddech. Dłoń, jeszcze ciepła przed chwilą, powoli stygnie w mojej.\n\nNa zewnątrz słychać kroki. Patrzę na skotłowane łóżko, ubranie, którego nie zdążono włożyć, i na kogoś, kto już się nie obudzi. Gdy drzwi się otworzą, nie będę [Select_CString(ROOT.Char.IsFemale, 'miała', 'miał')] gotowego nawet jednego zdania."
 latria_act.0101.desc.actor_dissatisfied: "Noc jest jeszcze głęboka, gdy siadam i znów naciągam rękaw na ramię.\n\n[latria_partner.GetShortUIName] obraca się pod przykryciem, jakby zostało coś do powiedzenia, i lekko dotyka mojego nadgarstka. Czuję tylko, jak długie i puste były te godziny. Nawet chęć wyciągnięcia ręki zniknęła. W lampie trzaska iskra, ale w izbie nie robi się cieplej.\n\nBiorę ubranie z krzesła, nie oglądając się. Niektóre spotkania tym bardziej każą pragnąć korytarza, im dłużej się je przeciąga."
 latria_act.0101.desc.partner_dissatisfied: "Przy wejściu [latria_partner.GetShortUIName] [Select_CString(latria_partner.IsFemale, 'zatrzymała', 'zatrzymał')] się w progu, [Select_CString(latria_partner.IsFemale, 'spojrzała', 'spojrzał')] najpierw na lampę, potem na mnie, jakby [Select_CString(latria_partner.IsFemale, 'nie chciała', 'nie chciał')] od razu zaczynać tej nocy.\n\nWyjście jest znacznie szybsze. Pas nie jest jeszcze zawiązany, a [latria_partner.GetSheHe] już opuszcza łóżko, unikając mojego spojrzenia i rąk. Wypowiadam [latria_partner.GetHerHis] imię. Dostaję krótką odpowiedź i żadnego pożegnania. Gdy drzwi się zamykają, powstały przeciąg pochyla płomień.\n\n[latria_partner.GetHerHis|U] obecność zostaje jeszcze w izbie. Krawędź łóżka już wystygła, jakby nikt tam nie siedział."
 latria_act.0101.desc.manual: "Nie dochodzimy do łóżka.\n\n[latria_partner.GetShortUIName] siada obok mnie i zaczyna mówić o niedokończonych sprawach dnia, lecz urywa zdanie w połowie. Pocałunki są lekkie, a pieszczoty zostają na rękawie albo we włosach. Za oknem przechodzi wołanie strażnika. Żadne z nas go nie liczy.\n\nW końcu kończy się oliwa w lampie. Jeszcze chwilę siedzimy w ciemności, słuchając, jak oddech staje się równy, a potem poprawiamy rękawy. Na tę noc tyle wystarczy."
 latria_act.0101.a: "Otworzyć drzwi i wrócić do dnia."
 latria_act.0102.desc: "[Select_CString(ROOT.Char.IsFemale, 'Mogłabym', 'Mógłbym')] przypomnieć [latria_actor.GetShortUIName], jak już późno i że jutro będą czekać ludzie. Słowa dochodzą do warg i nie idą dalej.\n\nGdy drzwi są zamknięte, kroki i głosy się cofają. Światło lampy grzeje zasłony i żadne z nas nie spieszy się, by wstać. Słucham, jak [latria_actor.GetHerHis] oddech przechodzi z niepokoju w spokój, i [Select_CString(ROOT.Char.IsFemale, 'sama', 'sam')] zapominam godzinę. Gdy znów patrzę ku oknu, jest dzień. Słudzy na zewnątrz pewnie czekają już długo.\n\nDopiero wtedy puszczam [latria_actor.GetHerHis] dłoń. Niektórych nocy nie powinno się poganiać ku końcowi."
 latria_act.0102.desc.adultery: "Gdy [latria_actor.GetShortUIName] zamierza wyjść, podchodzę do drzwi i przykładam ucho do drewna.\n\nKorytarz przez chwilę jest pusty. Potem ktoś przechodzi z lampą. Jej światło powoli przecina szparę i powoli odchodzi. Milczymy i nie pozwalamy nawet ubraniu wydać dźwięku. Gdy wraca cisza, [latria_actor.GetSheHe] poprawia ubranie.\n\nOtwieram drzwi tylko na tyle, by przepuścić [Select_CString(latria_actor.IsFemale, 'ją', 'go')] bokiem. Przynajmniej tej nocy tajemnica należy jeszcze tylko do nas."
 latria_act.0102.desc.partner_dissatisfied: "Zanim drzwi się zamknęły, wciąż [Select_CString(ROOT.Char.IsFemale, 'wyobrażałam', 'wyobrażałem')] sobie, jaka może być noc. Zawczasu [Select_CString(ROOT.Char.IsFemale, 'podkręciłam', 'podkręciłem')] nawet lampę.\n\nGdy w końcu nie ma przy nas nikogo, to oczekiwanie stygnie. [latria_actor.GetHerHis|U] dłonie, oddech i każda bliskość, która powinna mnie zatrzymać, zdają się docierać przez coś. Odpowiadam, ale oczy wciąż wracają ku drzwiom, a myśli na korytarz za nimi.\n\nNa końcu to ja podnoszę się [Select_CString(ROOT.Char.IsFemale, 'pierwsza', 'pierwszy')] i poprawiam rękaw. Ta noc nie była warta czasu spędzonego na czekaniu."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] wstaje, nie pozwalając mi znów zapalić lampy. Przy oknie zostaje tylko trochę bladej jasności.\n\nWciąż leżę i szukam zdania, które nie pozwoliłoby nocy urwać się tak ostro. [latria_actor.GetSheHe|U] odwraca twarz, rzuca dwa niedbałe zdania i już wiąże pas, nie biorąc ubrania, które podaję. Moje słowa nie dobiegły końca, gdy [latria_actor.GetSheHe] rusza ku drzwiom.\n\nPrzez otwarte drzwi wpada chłodne powietrze. Niektóre rozczarowania nie potrzebują wyjaśnienia."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] nie prowadzi mnie ku łóżku, tylko siada obok i odsuwa poduszkę między nami.\n\nNiedokończone sprawy dnia nagle wydają się zdolne poczekać. Wymieniamy pocałunki i kilka zdań, których nie trzeba kończyć. Dłonie zatrzymują się na rękawie albo we włosach i nie idą głębiej. Za oknem wciąż jest ciemno, a wołanie strażnika jest jeszcze daleko.\n\nPrzy rozstaniu [latria_actor.GetSheHe] wygładza fałdę, którą [Select_CString(ROOT.Char.IsFemale, 'sama pogniotłam', 'sam pogniotłem')] na swoim ubraniu. Noc jest krótka, ale nie zostawia wrażenia, że czegoś brakuje."

 latria_scheme.0010.t: "Zbliżenie"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "Mój [spouse|E]"
 latria_scheme.0010.t.concubine: "Moja [concubine|E]"
 latria_scheme.0010.t.soulmate: "Moja [soulmate|E]"
 latria_scheme.0010.t.lover: "Mój [lover|E]"
 latria_scheme.0010.t.adultery: "Cudzołóstwo"
 latria_scheme.0010.desc: "Świece wciąż się palą, lecz [target.GetShortUIName] już mi nie odpowiada.\n\nWypowiadam [target.GetHerHis] imię i przykładam ucho do [target.GetHerHis] ust. Nie ma nic. Skóra pod palcami jest zimniejsza niż przed chwilą, choć nasze ciepło zostaje w pościeli. Dłoń wysuwa się z mojej i nie wraca.\n\n[Select_CString(ROOT.Char.IsFemale, 'Zamierzałam', 'Zamierzałem')] sprzątnąć kubki, ubrania i wszelki ślad tej nocy przed świtem. Teraz obok leży tylko ktoś, kto się już nie poruszy. Okno blednie i nie wiem, co [Select_CString(ROOT.Char.IsFemale, 'powinnam', 'powinienem')] ukryć najpierw."
 latria_scheme.0010.a: "Naciągnąć na [Select_CString(target.IsFemale, 'nią', 'niego')] przykrycie i otworzyć drzwi."
 latria_scheme.0020.t: "Noc oczekiwania"
 latria_scheme.0020.desc: "Olej w lampie opadł, a kroków [target.GetFirstName] wciąż nie słychać przy drzwiach.\n\nDwa razy ogrzewam wino i znów składam ubranie na krześle. Czasem ktoś przechodzi korytarzem. Gdy kroki się zbliżają, wstrzymuję oddech. Gdy się oddalają, znów jestem [Select_CString(ROOT.Char.IsFemale, 'sama', 'sam')]. Za każdym razem myślę, że to [target.GetSheHe].\n\nW końcu świeca zamigocze, a wosk spada na tackę. Dopiero wtedy przyznaję, że noc się skończyła. Wino, słowa i przygotowana wymówka nie będą potrzebne."
 latria_scheme.0020.a: "Zgasić światło. Nie ma sensu czekać."
 latria_scheme.0030.t: "Zbyt późna wieść"
 latria_scheme.0030.desc: "Wciąż ważę, które boczne drzwi byłyby bardziej ustronne i które zaproszenie wzbudziłoby najmniej podejrzeń, gdy wieść kładą na stole.\n\n[target.GetFirstName] już [Select_CString(target.IsFemale, 'odeszła', 'odszedł')] z tego świata. Słów na papierze jest niewiele. Czytam je długo. Niewysłane listy, zapamiętane korytarze, wymówka przygotowana na tę jedną noc — wszystko naraz staje się zbędne.\n\nWylewam jeszcze ciepłe wino. Niektóre przygotowania mogą poczekać na lepszą noc. Żadne nie dogoni śmierci, która już się stała."
 latria_scheme.0030.a: "Spalić niewysłany list."
 latria_scheme.0040.t: "Zerwana nić"
 latria_scheme.0040.desc: "Posyłam kogoś, by odnalazł [target.GetFirstName], i czekam od popołudnia do zapalenia lamp. Wraca tylko niejasna odpowiedź: spotkanie jest już niemożliwe.\n\nMoże drzwi są pilnowane uważniej. Może czyjś wzrok stał się ostrożniejszy. A może [target.GetSheHe] po prostu nie chce już zbliżyć się do lampy, którą [Select_CString(ROOT.Char.IsFemale, 'zostawiłam', 'zostawiłem')] zapaloną dla [Select_CString(target.IsFemale, 'niej', 'niego')]. Pytam dwa razy. Posłaniec nie wie nic więcej.\n\nPowód przestał mieć znaczenie. Nić pękła między palcami. Gniotę świstek z zapisaną godziną, aż pot rozmazuje znaki."
 latria_scheme.0040.a: "Na tym koniec."

