l_polish:
 latria_sexual_frustration_flavor.1001.t: "Długa noc za zasłoną"
 latria_sexual_frustration_flavor.1001.desc.female: "Siedzę w nocnej koszuli przy oknie z nieotwartym listem na kolanach. Osoba, która go napisała, dawno już odeszła, a ja wciąż wracam do niewypowiedzianych słów."
 latria_sexual_frustration_flavor.1001.desc.male: "Siedzę w nocnej koszuli przy oknie z nieotwartym listem na kolanach. Znajome pismo na kopercie przypomina tęsknotę, która nie znalazła odpowiedzi."
 latria_sexual_frustration_flavor.1001.desc: "Robi się późno, a dawne myśli powracają."
 latria_sexual_frustration_flavor.1001.a: "Przeczytać do końca i pomyśleć o osobie, która go napisała."
 latria_sexual_frustration_flavor.1001.b: "Zamknąć list na klucz i stłumić tę myśl."
 latria_sexual_frustration_flavor.1001.c: "Wziąć czysty arkusz i ułożyć z tego wiersz."

 latria_sexual_frustration_flavor.1002.t: "Przyprawy na uczcie"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Przyprawy i pieśni wypełniają salę, a żaden z gości nie przejmuje się błądzącymi spojrzeniami. Mimo to przyglądam się każdej twarzy, jakby ktoś jeszcze miał się pojawić."
 latria_sexual_frustration_flavor.1002.desc.strict: "Przyprawy ożywiają ucztę, lecz każdy śmiech przypomina mi, jak pilnie obyczaj strzeże niesfornego pożądania. Niemal zapominam o pucharze w dłoni."
 latria_sexual_frustration_flavor.1002.desc: "Uczta jest głośna. Moje myśli i tak błądzą gdzie indziej."
 latria_sexual_frustration_flavor.1002.a: "Dodać kilka czułych słów od siebie."
 latria_sexual_frustration_flavor.1002.b: "Opuścić wzrok, podziękować gospodarzowi i odejść."
 latria_sexual_frustration_flavor.1002.c: "Poprosić muzyków o jeszcze jedną melodię przed wyjściem."
 latria_sexual_frustration_flavor.1002.d: "Zebrać gości przy jednym stole i przegadać wieczór."

 latria_sexual_frustration_flavor.1003.t: "Kazanie w ogrodzie"
 latria_sexual_frustration_flavor.1003.desc.favors: "Kaznodzieja mówi, że cielesne uciechy nie muszą obrażać naszej wiary. Te słowa powinny mnie pocieszyć, lecz wewnętrzny niepokój nie ustępuje."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Kaznodzieja mówi o czystości i powściągliwości. Słyszę każde słowo, lecz nie potrafię skupić myśli na świętym piśmie."
 latria_sexual_frustration_flavor.1003.desc: "Słucham kazania do końca. Wiatr przewraca stronę, a moje myśli wciąż są niespokojne."
 latria_sexual_frustration_flavor.1003.a: "Zamknąć księgę i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1003.b: "Odsunąć te myśli i dołączyć do recytacji."
 latria_sexual_frustration_flavor.1003.c: "Poprosić kaznodzieję o wyjaśnienie każdego ustępu."

 latria_sexual_frustration_flavor.1004.t: "Niespokojny sokół"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Sokół bije skrzydłami na mojej rękawicy, wypatrując gołębi w oddali. Dobrze znam tę niecierpliwość, choć nie wiem, gdzie znaleźć spoczynek dla własnych myśli."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Sokół niespokojnie drepcze na mojej rękawicy. Skupiam się na wodzach i przywołaniu, lecz myśli okazują się trudniejsze do poskromienia."
 latria_sexual_frustration_flavor.1004.desc: "Myśliwi czekają, aż przywołam sokoła, lecz nie potrafię skupić się na polowaniu."
 latria_sexual_frustration_flavor.1004.a: "Niech towarzysze zaczekają, aż uporam się z myślami."
 latria_sexual_frustration_flavor.1004.b: "Zebrać myśli i uporządkować sprzęt łowiecki."
 latria_sexual_frustration_flavor.1004.c: "Powoli wygładzić pióra i znów spróbować przywołania."

 latria_sexual_frustration_flavor.1005.t: "Między posiedzeniami rady"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Możni rozeszli się, pozostawiając na stole mapy i pieczęcie. Siedzę samotnie u jego szczytu, a obok niedokończonych dokumentów spoczywa stary list."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Towarzysze uzgodnili następny bród, lecz mapa wciąż zakrywa stół. Przysuwam stary list do lampy i gubię miejsce w spisie zapasów."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Spotkanie dobiegło końca, pozostawiając na stole rachunki i święte księgi. Wyciągam spomiędzy stron stary list i niespokojne myśli wracają."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Rada się skończyła, lecz dokumenty i pieczęcie pozostały. Wygładzam rękaw; stary list obok przyciąga moją uwagę silniej niż jakakolwiek petycja."
 latria_sexual_frustration_flavor.1005.desc: "Praca czeka, lecz stary list wciąż odciąga moją uwagę."
 latria_sexual_frustration_flavor.1005.a: "Odłożyć pracę i jeszcze raz przeczytać stary list."
 latria_sexual_frustration_flavor.1005.b: "Schować list i wrócić do obowiązków."
 latria_sexual_frustration_flavor.1005.c: "Rozplanować pozostałe zajęcia i pozwolić sobie na krótki odpoczynek."
 latria_sexual_frustration_flavor.1005.d: "Uporządkować zadania i dopilnować wykonania każdego."

 latria_sexual_frustration_flavor.1006.t: "Stary list przy świecy"
 latria_sexual_frustration_flavor.1006.desc.female: "Siedzę w nocnej koszuli przy lampie, opierając palce na zagięciach starego listu. Nie ma w nim obietnic, tylko uczucie, które nie wygasło."
 latria_sexual_frustration_flavor.1006.desc.male: "Siedzę w nocnej koszuli przy łóżku. Znajome pismo w starym liście przypomina uczucie, którego nigdy nie odwzajemniono."
 latria_sexual_frustration_flavor.1006.desc: "Noc jest spokojna, lecz słowa starego listu wciąż leżą przede mną."
 latria_sexual_frustration_flavor.1006.a: "Przeczytać list do końca."
 latria_sexual_frustration_flavor.1006.b: "Schować list, zgasić świecę i ułożyć się do snu."

 latria_sexual_frustration_flavor.1007.t: "Nim skończy się uczta"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Ktoś wspomina dawnego kochanka i nikt przy stole nie czuje się urażony. Wznoszę puchar razem z innymi, lecz mój wzrok wciąż wraca do pustego miejsca."
 latria_sexual_frustration_flavor.1007.desc.strict: "Nieostrożny romans służy za przestrogę i rozmowa schodzi na reputację oraz obyczaj. Wygładzam rękaw i milczę."
 latria_sexual_frustration_flavor.1007.desc: "Muzyka trwa, choć moje myśli dawno już opuściły stół."
 latria_sexual_frustration_flavor.1007.a: "Niech usłyszą o mojej tęsknocie, od samego początku."
 latria_sexual_frustration_flavor.1007.b: "Przełknąć słowa, podziękować gospodarzowi i odejść."
 latria_sexual_frustration_flavor.1007.c: "Zapytać sąsiada o podróże."

 latria_sexual_frustration_flavor.1008.t: "Modlitwa przed kapliczką"
 latria_sexual_frustration_flavor.1008.desc.favors: "Świeca przed kapliczką dogasa. Moja wiara nie gardzi cielesnymi uciechami, a jednak nie potrafię uciszyć natarczywego pragnienia."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Powtarzam ślub czystości przed kapliczką, lecz znajoma modlitwa niejednokrotnie urywa mi się na ustach."
 latria_sexual_frustration_flavor.1008.desc: "Modlitwa skończona. Pozostaję przy świecy."
 latria_sexual_frustration_flavor.1008.a: "Odłożyć ślub wstrzemięźliwości i przyznać się do tęsknoty."
 latria_sexual_frustration_flavor.1008.b: "Powściągnąć myśli i modlić się dalej."
 latria_sexual_frustration_flavor.1008.c: "Przeczytać ustęp i rozważyć go przed odejściem."
 latria_sexual_frustration_flavor.1008.d: "Podtrzymywać płomień i recytować do świtu."

 latria_sexual_frustration_flavor.1009.t: "Nieprzeczytana petycja"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Petycje pokrywają długi stół, a możni czekają na moje słowo. Czytam jeden wers dwukrotnie, lecz myśli błądzą gdzie indziej."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Rada jeszcze się nie skończyła, lecz nie potrafię przyswoić ani słowa z leżących przede mną dokumentów. Zamykam księgę i próbuję wrócić myślami do bieżącej sprawy."
 latria_sexual_frustration_flavor.1009.a: "Odprawić radę i zostać sam na sam z myślami."
 latria_sexual_frustration_flavor.1009.b: "Zebrać myśli i rozpatrzyć każdą petycję."
 latria_sexual_frustration_flavor.1009.c: "Uporządkować decyzje, a potem ogłosić każdą z nich."

 latria_sexual_frustration_flavor.1010.t: "Powrót orła"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Sokół krąży nad lasem. Patrząc, jak odmawia powrotu, przypominam sobie, jak męczy mnie odkładanie każdego pragnienia na bok."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Jastrząb wciąż krąży w oddali. Zaciskam rękawicę i zmuszam się do słuchania jedynie nawoływań myśliwych."
 latria_sexual_frustration_flavor.1010.desc: "Myśliwi czekają na zwinięcie obozu, a ja wciąż wpatruję się w niebo nad drzewami."
 latria_sexual_frustration_flavor.1010.a: "Niech myśliwi czekają, a moje myśli podążają za orłem."
 latria_sexual_frustration_flavor.1010.b: "Dać sygnał powrotu i sprawdzić sprzęt łowiecki."
 latria_sexual_frustration_flavor.1010.c: "Przejść się skrajem lasu przed powrotem do towarzyszy."

 nick_latria_the_unquiet: "Niespokojny"
 latria_flavor_focus: "Zebrana determinacja"
 latria_flavor_focus_desc: "Ta postać skupia uwagę na świętych księgach i codziennych obowiązkach."
 latria_flavor_remorse: "Nieustające wyrzuty sumienia"
 latria_flavor_remorse_desc: "Krótka pociecha pozostawiła niespokojne sumienie."
 latria_flavor_sullied: "Nadszarpnięta reputacja"
 latria_flavor_sullied_desc: "Plotki zaszkodziły pozycji tej postaci i jej przyjaźniom."
 latria_flavor_broken_sleep: "Brak snu"
 latria_flavor_broken_sleep_desc: "Niedobór snu sprawia, że ta postać łatwo się rozprasza i męczy."
 latria_flavor_vagabond_focus: "Skupienie podróżnika"
 latria_flavor_vagabond_focus_desc: "Trudy podróży na krótko uciszają niespokojne myśli."
 latria_flavor_public_disgrace: "Publiczna hańba"
 latria_flavor_public_disgrace_desc: "Pogłoski o publicznym uchybieniu zaszkodziły pozycji tej postaci i jej przyjaźniom."
 latria_flavor_hunting_focus: "Skupienie na łowach"
 latria_flavor_hunting_focus_desc: "Ta postać skupia uwagę na tropieniu, sokolnictwie i jeździe konnej."
 latria_flavor_warm_company: "Miłe towarzystwo"
 latria_flavor_warm_company_desc: "Dobra rozmowa sprawiła, że ta postać chętniej szuka towarzystwa."
 latria_flavor_neglected_duties: "Zaniedbane obowiązki"
 latria_flavor_neglected_duties_desc: "Prywatne troski odciągnęły tę postać od obowiązków."
 latria_flavor_diligent_work: "Uporządkowane obowiązki"
 latria_flavor_diligent_work_desc: "Ta postać spożytkowała niespokojne myśli na staranne planowanie i pracę."
