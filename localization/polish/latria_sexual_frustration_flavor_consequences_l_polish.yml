l_polish:
 latria_flavor_distracted: "Zaprzątnięte myśli"
 latria_flavor_distracted_desc: "Osobiste myśli wciąż odrywają tę postać od nauki i codziennych spraw."
 latria_flavor_composure: "Opanowanie"
 latria_flavor_composure_desc: "Ta postać nauczyła się trzymać język za zębami i spokojniej znosić codzienne utrapienia."
 latria_flavor_rested: "Wypoczęta postać"
 latria_flavor_rested_desc: "Ta postać odłożyła niespokojne myśli na dość długo, by dać ciału odpocząć."
 latria_flavor_observance: "Gorliwe praktyki religijne"
 latria_flavor_observance_desc: "Staranna modlitwa i recytacja przyniosły tej postaci szacunek współwyznawców."
 latria_flavor_reliable: "Godna zaufania postać"
 latria_flavor_reliable_desc: "Ta postać nie pozwala, by osobiste troski przeszkadzały jej w obowiązkach, i sumiennie zajmuje się swoimi sprawami."
 latria_flavor_scriptural_insight: "Zrozumienie świętych pism"
 latria_flavor_scriptural_insight_desc: "Cierpliwa nauka i rozważania pogłębiły zrozumienie nauk przez tę postać."
 latria_flavor_unburdened: "Otwarte serce"
 latria_flavor_unburdened_desc: "Osobiste zmagania tej postaci są już powszechnie znane, nie musi więc dłużej ich ukrywać."
 latria_flavor_ridiculed: "Pośmiewisko"
 latria_flavor_ridiculed_desc: "Niekończące się publiczne opowieści tej postaci o własnych pragnieniach dały innym powód do śmiechu."
 latria_flavor_missed_hunt: "Nieuwaga na polowaniu"
 latria_flavor_missed_hunt_desc: "Pogrążona we własnych myślach postać zaniedbała sprzęt myśliwski i kazała towarzyszom czekać."
 latria_flavor_creative_focus: "Myśli w wierszach"
 latria_flavor_creative_focus_desc: "Ujęcie trudnych uczuć w wierszach pomogło tej postaci uporządkować myśli."
 latria_flavor_restored_spirits: "Pociecha w muzyce"
 latria_flavor_restored_spirits_desc: "Spokojne słuchanie muzyki przywróciło tej postaci ochotę do rozmowy."
 latria_flavor_clear_judgment: "Jaśniejszy umysł"
 latria_flavor_clear_judgment_desc: "Cierpliwe rozważania pomogły tej postaci rozpatrywać sprawy bez pośpiechu."
