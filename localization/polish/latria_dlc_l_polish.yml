l_polish:
 dlc_latria: "Latria"
 dlc_latria_desc: "Zwyczaj nie wyznacza już, kogo wolno ci pożądać. Im głębiej tłumisz pragnienie, tym mocniej płonie. Samotna lampa, nigdy niewysłany list i długa, bezsenna noc. Ulotna rozkosz czasem koi serce, a czasem zostawia ranę, która nie goi się latami. W Latrii ciało i duch mogą dostąpić zbawienia albo popaść w zgubę."
