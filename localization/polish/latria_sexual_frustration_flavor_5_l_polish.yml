l_polish:
 latria_sexual_frustration_flavor.1401.t: "Nieużyty sygnet"
 latria_sexual_frustration_flavor.1401.desc.female: "W nocnej koszuli składam wciąż na nowo list przy łóżku. Nie ma na nim imienia, a pieczęci wciąż nie odważam się przyłożyć."
 latria_sexual_frustration_flavor.1401.desc.male: "W nocnej koszuli siedzę na skraju łóżka z sygnetem w dłoni. Jeśli zapiszę te słowa, nie zdołam już udawać, że nigdy o tym nie myślę."
 latria_sexual_frustration_flavor.1401.desc: "Podnoszę sygnet i znów go odkładam, nie dotykając nim papieru."
 latria_sexual_frustration_flavor.1401.a: "Dokończyć list i przyłożyć pieczęć."
 latria_sexual_frustration_flavor.1401.b: "Odłożyć sygnet, stłumić tęsknotę i się położyć."

 latria_sexual_frustration_flavor.1402.t: "Ostatnia uczta"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Nim uczta dobiegnie końca, goście wciąż otwarcie mówią o kochankach, zaręczynach i dawnych przyjemnościach. Nie potrafię już uznać ich słów za zwykłe pogawędki."
 latria_sexual_frustration_flavor.1402.desc.strict: "Ktoś wspomina możnego, który popadł w niełaskę przez nieostrożny romans, i przy stole zapada cisza. Wiem, że ten sam osąd może spotkać i mnie."
 latria_sexual_frustration_flavor.1402.desc: "Na stołach panuje nieład, a goście wychodzą, lecz dręcząca mnie myśl staje się coraz głośniejsza."
 latria_sexual_frustration_flavor.1402.a: "Zatrzymać ostatnich gości przy stole i wciąż opowiadać o swoich troskach."
 latria_sexual_frustration_flavor.1402.b: "Stłumić tę myśl, podziękować gospodarzom i odejść."

 latria_sexual_frustration_flavor.1403.t: "Wyznanie bez świadków"
 latria_sexual_frustration_flavor.1403.desc.favors: "Przed ołtarzem nie ma nikogo. Pamiętam, że moja wiara pozwala na cielesne przyjemności, lecz wciąż nie wiem, jak ukoić to przemożne pragnienie."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Klęczę samotnie przed ołtarzem w starannie ułożonym stroju, lecz modlitwa za każdym razem urywa się na tych samych słowach. Czy łamię ślub, nawet jeśli nikt mnie nie słyszy?"
 latria_sexual_frustration_flavor.1403.desc: "Sanktuarium jest puste. Wciąż go nie opuszczam."
 latria_sexual_frustration_flavor.1403.a: "Nie składać już ślubów wstrzemięźliwości i przyznać się do swojego wyboru."
 latria_sexual_frustration_flavor.1403.b: "Powściągnąć pożądanie i klęczeć aż do porannej modlitwy."

 latria_sexual_frustration_flavor.1404.t: "Nazwać pragnienie"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Stoję samotnie, bez odzienia, przed lustrem w komnacie i nie odwracam wzroku od odbicia. Mam dość nazywania pożądania chwilową słabością."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Siedzę samotnie, bez odzienia, na skraju łóżka i splatam dłonie. Jeśli dochowam ślubu, to nie dlatego, że to pragnienie zniknęło."
 latria_sexual_frustration_flavor.1404.desc: "Noc jest już głęboka. Wreszcie przestaję ukrywać przed sobą własne pożądanie."
 latria_sexual_frustration_flavor.1404.a: "Przyznać się do swojego pragnienia i tej nocy już z nim nie walczyć."
 latria_sexual_frustration_flavor.1404.b: "Ponownie się ubrać i stłumić tę myśl."

 latria_sexual_frustration_flavor.1405.t: "Karta kroniki"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Kronikarz czeka, aż zdecyduję, co zasługuje na pamięć. Stojąc za nim w odświętnych szatach, pojmuję, że milczenie nie sprawi, iż ta udręka zniknie."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Skryba siedzi przy stole i pyta, czy ten fragment podróży powinien trafić do kroniki. Patrzę na niewysłany list i wiem, że te słowa będą mi towarzyszyć."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Przywdziewam szaty liturgiczne i staję przed skrybą. Ślub i pożądanie są równie prawdziwe; nie pozwolę, by ktoś inny decydował, które zasługuje na pamięć."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Pisarz czeka, by zapisać moje słowa. W odświętnym stroju, przed służbą, mówię o tym, co od dawna skrywam."
 latria_sexual_frustration_flavor.1405.desc: "Postanawiam przestać zachowywać tę sprawę dla siebie."
 latria_sexual_frustration_flavor.1405.a: "Pozwolić, by odpisy krążyły i każdy mógł je przeczytać."
 latria_sexual_frustration_flavor.1405.b: "Kazać skrybie spisać tylko moje obowiązki, a resztę przemilczeć."

 latria_sexual_frustration_flavor.1406.t: "Gdy goście odchodzą"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Ostatni goście wciąż rozmawiają o kochankach i zaręczynach. Ledwie zaczynam opowiadać własną dawną historię, gdy ktoś przy stole chichocze."
 latria_sexual_frustration_flavor.1406.desc.strict: "Do stołu dociera wieść o możnym, który stracił łaskę przez nieostrożny romans. Zanim zdołam zamilknąć, sąsiedzi zaczynają szeptać, a ktoś się śmieje."
 latria_sexual_frustration_flavor.1406.desc: "Goście wychodzą, lecz ja wciąż mówię. Sąsiedzi wymieniają spojrzenia, a ktoś przy stole chichocze."
 latria_sexual_frustration_flavor.1406.a: "Dalej opowiadać swoją historię i odpowiadać przy całym stole każdemu, kto mnie wyśmiewa."
 latria_sexual_frustration_flavor.1406.b: "Zamilknąć, ukłonić się zebranym i ich pożegnać."

 latria_sexual_frustration_flavor.1407.t: "Modlitwa przy gasnącej świecy"
 latria_sexual_frustration_flavor.1407.desc.favors: "W nocnej koszuli przy łóżku przypominam sobie, że moja wiara nie odrzuca cielesnych przyjemności. W samotności wciąż jednak nie wiem, jak znaleźć spokój."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Szczelniej otulam się nocną koszulą i powtarzam ślub czystości. Świeca dogasa, lecz moje pragnienie nie słabnie."
 latria_sexual_frustration_flavor.1407.desc: "W komnacie pozostała tylko jedna gasnąca świeca, a ja wciąż nie śpię."
 latria_sexual_frustration_flavor.1407.a: "Odłożyć ślub czystości i oddać się myślom o tym uczuciu."
 latria_sexual_frustration_flavor.1407.b: "Powściągnąć myśli i odmawiać modlitwy aż do świtu."

 latria_sexual_frustration_flavor.1408.t: "Milczenie przed lustrem"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Stoję samotnie, bez odzienia, przed lustrem. Nie mogę już nazywać tego pragnienia przelotną myślą. Nie chcę też dłużej udawać."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Siedzę bez odzienia na skraju łóżka i splatam dłonie. Czystość pozostaje moim wyborem, choć nigdy jeszcze ten wybór nie był tak trudny."
 latria_sexual_frustration_flavor.1408.desc: "W ciszy patrzę na swoje odbicie i przestaję unikać tego, co noszę w sercu."
 latria_sexual_frustration_flavor.1408.a: "Przyznać się do tego pożądania i tej nocy już przed nim nie uciekać."
 latria_sexual_frustration_flavor.1408.b: "Ubrać się, usiąść przy biurku i stłumić tę myśl."

 latria_sexual_frustration_flavor.1409.t: "Utrata opanowania na dworze"
 latria_sexual_frustration_flavor.1409.desc: "Podczas przerwy w obradach rady rozbieram się w sąsiedniej komnacie. Zanim zdążę włożyć szatę, drzwi do sali obrad się otwierają. Możni milkną, a pisarz spuszcza wzrok; głos więźnie mi w gardle, gdy sługa stoi obok z szatą."
 latria_sexual_frustration_flavor.1409.a: "Stanąć przed nimi i nie próbować ukryć swego uchybienia."
 latria_sexual_frustration_flavor.1409.b: "Odprawić możnych i ubrać się przed wznowieniem obrad."

 latria_sexual_frustration_flavor.1410.t: "Noc za drzwiami"
 latria_sexual_frustration_flavor.1410.desc.female: "W nocnej koszuli siedzę przy drzwiach i słucham cichnących kroków. O tej późnej porze wraca do mnie nieodwzajemnione uczucie."
 latria_sexual_frustration_flavor.1410.desc.male: "W nocnej koszuli opieram się o łóżko, a książka wciąż pozostaje zamknięta. Na korytarzu panuje cisza, lecz sen nie nadchodzi."
 latria_sexual_frustration_flavor.1410.desc: "Noc jest długa. Za drzwiami nic się nie porusza, a moje myśli nie znajdują spokoju."
 latria_sexual_frustration_flavor.1410.a: "Odłożyć książkę i napisać długi list."
 latria_sexual_frustration_flavor.1410.b: "Stłumić tęsknotę, zgasić lampę i się położyć."

 latria_sexual_frustration_flavor.1401.c: "Ułożyć wiersz z zaproszenia, którego nie mogę wysłać."
 latria_sexual_frustration_flavor.1402.c: "Zapłacić muzykom, by zagrali dla pozostałych gości."
 latria_sexual_frustration_flavor.1402.d: "Poprosić gości, by zostali i opowiedzieli o dawnych podróżach."
 latria_sexual_frustration_flavor.1403.c: "Otworzyć świętą księgę i szukać odpowiedzi w każdym ustępie."
 latria_sexual_frustration_flavor.1404.c: "Porzucić ślub czystości i odtąd podążać za swoimi pragnieniami."
 latria_sexual_frustration_flavor.1404.d: "Włożyć nocną koszulę i siedzieć, aż myśli się uspokoją."
 latria_sexual_frustration_flavor.1405.c: "Spisać relację jako prywatny list i zamknąć go w szkatułce."
 latria_sexual_frustration_flavor.1405.d: "Złożyć ślub czystości przed tymi świadkami."
 latria_sexual_frustration_flavor.1406.c: "Wyrecytować nowy wiersz odchodzącym gościom."
 latria_sexual_frustration_flavor.1407.c: "Zamknąć modlitewnik i spokojnie rozważyć swoje uczucia."
 latria_sexual_frustration_flavor.1408.c: "Spisać poranne obowiązki i uporządkować wszystkie dokumenty."
 latria_sexual_frustration_flavor.1409.c: "Ubrać się, wrócić do stołu i rozstrzygnąć każdą sprawę dworu."
 latria_sexual_frustration_flavor.1409.d: "Ubrać się, zażartować i poprosić możnych, by znów usiedli."
 latria_sexual_frustration_flavor.1410.c: "Włożyć szatę, zaparzyć herbatę i siedzieć, aż sen stanie się możliwy."
