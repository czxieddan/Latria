l_polish:
 latria_sexual_frustration_flavor.1301.t: "Niewysłane zaproszenie"
 latria_sexual_frustration_flavor.1301.desc.female: "Siedzę w nocnej koszuli przy biurku, z jednym imieniem na kartce. Moja służąca pyta, czy ma ją dostarczyć. Składam list i nie odpowiadam."
 latria_sexual_frustration_flavor.1301.desc.male: "Siedzę w nocnej koszuli przy biurku, z jednym imieniem na kartce. Za drzwiami czeka sługa gotów ją zanieść, lecz nie potrafię zmusić się do zapieczętowania listu."
 latria_sexual_frustration_flavor.1301.desc: "Nieopieczętowany list od dawna czeka pod świecą."
 latria_sexual_frustration_flavor.1301.a: "Dokończyć list i przekazać go słudze."
 latria_sexual_frustration_flavor.1301.b: "Schować list, stłumić tęsknotę i udać się na spoczynek."

 latria_sexual_frustration_flavor.1302.t: "Osąd dworu"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Nadworny poeta żartuje z dawnych uczuć i nawet najsurowsi szlachcice nie marszczą brwi. Wznoszę z nimi puchar, choć nie znajduję w tym ulgi."
 latria_sexual_frustration_flavor.1302.desc.strict: "Szlachcic stracił twarz przez nieostrożny romans i dwór rozprawia o całej jego rodzinie. Słucham ich osądu, wiedząc, że mnie też może spotkać taki los."
 latria_sexual_frustration_flavor.1302.desc: "Rozmowa schodzi na reputację i pożądanie."
 latria_sexual_frustration_flavor.1302.a: "Mówić o swojej tęsknocie, raz po raz sprowadzając rozmowę na jej temat."
 latria_sexual_frustration_flavor.1302.b: "Powstrzymać język, podziękować gospodarzom i odejść."

 latria_sexual_frustration_flavor.1303.t: "Dzwon o północy"
 latria_sexual_frustration_flavor.1303.desc.favors: "Po uderzeniu dzwonu kapłan pozostaje przy drzwiach. Mówi, że pożądanie można skierować ku dobru, lecz nie wiem, czy potrafię dłużej czekać."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Dzwon bije raz po raz, a ślub wypowiadany przez kapłana tak samo odbija się w moim sercu. Kolana bolą od klęczenia, a odpowiedź wciąż nie nadchodzi."
 latria_sexual_frustration_flavor.1303.desc: "Modlitwa o północy nie przyniosła spokoju, choć dzwony wciąż biją."
 latria_sexual_frustration_flavor.1303.a: "Zostawić nakazy wstrzemięźliwości w świątyni."
 latria_sexual_frustration_flavor.1303.b: "Stłumić tę myśl i ponownie odmówić modlitwę."

 latria_sexual_frustration_flavor.1304.t: "Kres cierpliwości"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Przemierzam komnatę w nocnej koszuli. Szachownica przysłana przez sługę pozostaje nietknięta; czekanie stało się osobną udręką."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Ponownie wiążę pas nocnej koszuli, starając się nadać każdemu ruchowi pozory opanowania. Im bardziej się pilnuję, tym trudniej zignorować tęsknotę."
 latria_sexual_frustration_flavor.1304.desc: "W pokoju jest cicho. Nie potrafię już usiedzieć w miejscu."
 latria_sexual_frustration_flavor.1304.a: "Odłożyć szachownicę i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1304.b: "Wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1305.t: "Pokój po zmroku"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Dwór udał się na spoczynek, lecz ja zostaję w komnacie w odświętnych szatach. Petycje są rozpatrzone; dręczące mnie myśli nie odeszły wraz z możnymi."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Towarzysze położyli się w gospodzie, lecz ja zostaję samotnie w pokoju. Sprzęt jest spakowany, jutrzejsza trasa ustalona, a mimo to nie potrafię uspokoić myśli."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Zostaję samotnie w małym pokoju, wciąż w szatach. Świeca przy łóżku zgasła. Ślub trwa, lecz pociecha nie nadchodzi."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Wracam w odświętnych szatach do pustej komnaty. Strażnicy kłaniają się za drzwiami, lecz wewnątrz nikt nie podzieli ze mną tego ciężaru."
 latria_sexual_frustration_flavor.1305.desc: "Komnata jest pusta, lecz nie chcę jeszcze się położyć."
 latria_sexual_frustration_flavor.1305.a: "Mimo późnej pory wezwać zaufaną osobę i długo porozmawiać."
 latria_sexual_frustration_flavor.1305.b: "Stłumić tęsknotę, zdjąć szaty i udać się na spoczynek."

 latria_sexual_frustration_flavor.1306.t: "Posłaniec o północy"
 latria_sexual_frustration_flavor.1306.desc.female: "Siedzę w nocnej koszuli przy łóżku i słyszę dwa ciche stuknięcia. Służąca przynosi tylko czystą kartkę, a jednak wiem, na czyją wiadomość czekam."
 latria_sexual_frustration_flavor.1306.desc.male: "Otwieram drzwi komnaty w nocnej koszuli, lecz korytarz jest już pusty. Niepodpisana notatka na progu odbiera mi sen."
 latria_sexual_frustration_flavor.1306.desc: "Kroki za drzwiami cichną. Kartka na biurku wciąż jest pusta."
 latria_sexual_frustration_flavor.1306.a: "Zapisać słowa odkładane od tak dawna."
 latria_sexual_frustration_flavor.1306.b: "Schować kartkę, stłumić tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1307.t: "Cisza przy stole"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Poeta recytuje dawny romans, a towarzystwo słucha z zachwytem. Wznoszę z nimi puchar, myśląc o historii, której nikt nie opowiedział."
 latria_sexual_frustration_flavor.1307.desc.strict: "Przy stole mówi się o szlachcicu, który stracił łaski przez nieostrożny romans, i śmiech zamiera. Odwracam się ku oknu, skrywając wyraz twarzy."
 latria_sexual_frustration_flavor.1307.desc: "Puchary wciąż krążą, lecz rozmowa trwa przy temacie, który lepiej zostawić w spokoju."
 latria_sexual_frustration_flavor.1307.a: "Pozwolić winu rozwiązać język i opowiadać prywatne historie jedną po drugiej."
 latria_sexual_frustration_flavor.1307.b: "Powstrzymać język, ukłonić się towarzystwu i odejść."

 latria_sexual_frustration_flavor.1308.t: "Modlitwa podczas czuwania"
 latria_sexual_frustration_flavor.1308.desc.favors: "Dzwon oznajmia nocną wartę, a ja wciąż modlę się w sanktuarium. Moja wiara nie potępia cielesnych uciech, a jednak nie wiem, jak zmierzyć się z tą nieustającą tęsknotą."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Powtarzam w sanktuarium modlitwę o czystość. Dzwon cichnie, lecz myśl we mnie nie ustępuje."
 latria_sexual_frustration_flavor.1308.desc: "Blask świec pada na puste ławy. Wciąż nie wstaję."
 latria_sexual_frustration_flavor.1308.a: "Odłożyć modlitwę o wstrzemięźliwość i wyjść za głosem serca."
 latria_sexual_frustration_flavor.1308.b: "Powściągnąć pożądanie i dokończyć czuwanie."

 latria_sexual_frustration_flavor.1309.t: "Spojrzenie w lustro"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Staję na chwilę bez ubrania, samotnie przed lustrem w komnacie. Wyraz twarzy się nie zmienił, lecz nie będę już nazywać pożądania chwilową słabością."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Bez ubrania przy łóżku powtarzam swój ślub. Pamiętam każde słowo, a jednak wewnętrzna tęsknota nie znika."
 latria_sexual_frustration_flavor.1309.desc: "W pokoju nie ma nikogo innego. Cisza w lustrze nie pozwala mi odwrócić wzroku."
 latria_sexual_frustration_flavor.1309.a: "Przyznać się do swoich uczuć i rozmyślać o nich."
 latria_sexual_frustration_flavor.1309.b: "Ubrać się, wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1310.t: "Bezsenność w kwaterze"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Po nocnej modlitwie wracam do małego pokoju. Wciąż mam na sobie szaty, a świeca przy łóżku zgasła, lecz nie chcę się położyć."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Towarzysze położyli się w gospodzie. Samotnie w pokoju odkładam sprzęt. Jutrzejsza droga jest jasna; droga przez moje myśli już nie."
 latria_sexual_frustration_flavor.1310.desc: "Jest późno. Drzwi są zamknięte, lecz nie mogę zasnąć."
 latria_sexual_frustration_flavor.1310.a: "Napisać do starego znajomego i otwarcie opowiedzieć o troskach."
 latria_sexual_frustration_flavor.1310.b: "Stłumić tę myśl, zgasić świecę i położyć się."

 latria_sexual_frustration_flavor.1301.c: "Wziąć czystą kartkę i ułożyć zaproszenie wierszem."
 latria_sexual_frustration_flavor.1302.c: "Sprowadzić rozmowę z powrotem na rodziny i majątki."
 latria_sexual_frustration_flavor.1302.d: "Opowiedzieć historię z podróży i znów skłonić ich do wznoszenia pucharów."
 latria_sexual_frustration_flavor.1303.c: "Zostać do świtu i studiować święte pismo wers po wersie."
 latria_sexual_frustration_flavor.1304.c: "Rozstawić figury i rozważyć zadanie szachowe."
 latria_sexual_frustration_flavor.1304.d: "Zacząć od pierwszego ruchu i powoli rozegrać całą partię."
 latria_sexual_frustration_flavor.1305.c: "Rozplanować poranną pracę przed zgaszeniem świecy."
 latria_sexual_frustration_flavor.1307.c: "Wyrecytować nowy wiersz i odciągnąć ich uwagę."
 latria_sexual_frustration_flavor.1308.c: "Zamknąć modlitewnik i w ciszy rozważyć swoje myśli."
 latria_sexual_frustration_flavor.1308.d: "Czuwać do porannej modlitwy i przygotować księgi dla wszystkich."
 latria_sexual_frustration_flavor.1309.c: "Spisać swoje troski i rozważyć je wers po wersie."
 latria_sexual_frustration_flavor.1310.c: "Zaparzyć herbatę i bez pośpiechu schować rzeczy oraz księgi."
