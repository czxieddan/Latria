l_polish:
 e_latria_holy_see: "Stolica Apostolska"
 e_latria_holy_see_adj: "Katolicka"
 nick_latria_vicar_of_christ: "Namiestnik Chrystusa"
 nick_latria_vicar_of_christ_desc: "[CHARACTER.GetShortUINameNotMeNoTooltipNoFormat|U] jest ostatnim zbawieniem [CHARACTER.GetFaith.HighGodNamePossessive] dla upadłego świata – bo gdyby świat mógł jeszcze zbawić się sam, czy [CHARACTER.GetFaith.HighGodName] [Select_CString(EqualTo_string(CHARACTER.GetFaith.HighGodNameSheHe, 'ona' ), 'wyniosłaby', 'wyniósłby' )] ponad wszystkie korony kogoś takiego jak #EMP [Select_CString(CHARACTER.IsFemale, 'ona', 'on' )]#!?"

 latria_papal_ascendancy.0001.t: "Tron ponad każdą koroną"
 latria_papal_ascendancy.0001.desc: "Przed zebranymi prałatami wznoszę rękę nad połamanymi sztandarami tych, którzy przybyli mnie obalić. Bóg nie ocalił swego namiestnika po to, bym targował się z książętami. Z Jego woli Stolica Apostolska obejmie niepodzielną władzę i zaniesie zbawienie do każdego państwa."
 latria_papal_ascendancy.0001.a: "Niech świat uklęknie przed Stolicą Apostolską"

 latria_papal_ascendancy.0002.t: "Posłannictwo namiestnika"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] rozbija wojsko zebrane przeciw Stolicy Apostolskiej. Przed duchowieństwem i pokonanymi książętami [latria_papal_victor.GetSheHe] ogłasza, że Bóg powierzył [latria_papal_victor.GetHerHim] władzę absolutną i zbawienie świata."
 latria_papal_ascendancy.0002.a: "Nastaje nowy porządek"

 trait_latria_army_of_god: "Święta armia Pana"
 trait_latria_army_of_god_desc: "Ta postać dowodzi wojskiem poświęconym absolutnej władzy Stolicy Apostolskiej."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] dowodzi wojskiem poświęconym absolutnej władzy Stolicy Apostolskiej."

 latria_papal_redemption_or_ruin: "Zbawienie albo zguba"
 latria_papal_redemption_or_ruin_desc: "Zażądaj, by [recipient.GetShortUINameNoTooltip] podporządkował się Stolicy Apostolskiej i przyjął [rite|E], którego wyznawcą jest [actor.GetShortUINamePossessiveNoTooltip]. Odmowa sprowadzi wojnę."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] żąda twojego podporządkowania Stolicy Apostolskiej i przyjęcia [actor.GetHerHis] obrządku: [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "Niższe [old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "Niższe [old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "Ujawnij sekret"
 latria_reveal_papal_secret_decision_desc: "Wyjawię swój sekret przed duchownymi i książętami. Niech każdy władca usłyszy go z moich ust, a ci, którzy podważają mój urząd, niech chwycą za broń."
 latria_reveal_papal_secret_decision_tooltip: "Publicznie ujawnij swoje cudzołóstwo i staw czoła wojnie o pozbawienie cię urzędu."
 latria_reveal_papal_secret_decision_confirm: "Ujawnij go przed wszystkimi"
 latria_can_reveal_papal_secret_trigger: "Masz sekret dotyczący cudzołóstwa, który można ujawnić"
 NOT_ANY_OF_MY_SECRETS: "Żaden z twoich sekretów:"

 latria_papal_redemption_war: "Papieska wojna o zbawienie"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Papieskie zbawienie"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective] wojna o zbawienie przeciwko [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective] wojna o zbawienie"
 latria_papal_redemption_war_victory_desc: "Obrońca traci rangę, zostaje wasalem papieża i przyjmuje papieski [rite|E]."
 latria_papal_redemption_war_white_peace_desc: "Żądanie podporządkowania zostaje wycofane."
 latria_papal_redemption_war_defeat_desc: "Papieskie żądanie podporządkowania zostaje odparte."

 latria_decision_immediate_effect_loc: "#high #bold Gdy ujawnisz sekret:#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X Rozpocznie się $latria_papal_scandal_depose_war$:#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "Niezależni [rulers|E] wyznający twój [rite|E] oraz [vassals|E], którzy nie popierają cię w pełni, mogą dołączyć do koalicji dążącej do twojego obalenia"
 latria_decision_paramour_defense_tt: "Osoba, z którą cudzołożysz, może dołączyć do obrońców, jeśli sprawuje władzę jako [ruler|E]"
 latria_decision_allies_call_tt: "Twoi [allies|E] mogą odpowiedzieć na wezwanie i dołączyć do obrońców"
 latria_decision_forced_defenders_tt: "Marionetkowi [rulers|E] pod twoją kontrolą oraz niezależni władcy wyznający twój [rite|E], których [piety_level|E] wynosi @piety_level_0_icon_christian! [GetModifier( 'piety_level_0' ).GetNameWithTooltip|L], mogą dołączyć do obrońców"
 latria_decision_disgraced_defenders_tt: "Postacie wyznające twój [rite|E], mające cechę ([trait|E]) [GetTrait('adulterer').GetName(GetNullCharacter)] lub [GetTrait('fornicator').GetName(GetNullCharacter)] i dowodzące wojskami mogą dołączyć do obrońców"
 latria_decision_hook_defenders_tt: "Twoje [hooks|E] mogą zostać wykorzystane do wezwania na pomoc postaci wyznających twój [rite|E]"

 latria_decision_if_win_effect_loc: "\n#high #bold Jeśli wygrasz wojnę:#!#!\nPokonujesz koalicję i pozostajesz na urzędzie jako [head_of_faith|E].\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "Pokonani atakujący [rulers|E] płacą reparacje ([gold|E] i [prestige|E]) zależnie od [title_tier|E]"
 latria_papal_scandal_reparations_first: "Pokonani atakujący [rulers|E] płacą ci reparacje ([gold|E] i [prestige|E]) zależnie od [title_tier|E]"
 latria_papal_scandal_reparations_third: "Pokonani atakujący [rulers|E] płacą [CHARACTER.GetShortUIName] reparacje ([gold|E] i [prestige|E]) zależnie od [title_tier|E]"
 latria_papal_scandal_ally_share_tt: "Uczestniczący w obronie [allies|E] dzielą między siebie [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%] łącznych reparacji ([gold|E] i [prestige|E])"
 latria_papal_redemption_unlocked_tt: "Odblokowuje interakcję ([interaction|E]) $latria_papal_redemption_or_ruin$"

 latria_decision_if_lose_effect_loc: "\n#high #bold Jeśli przegrasz wojnę:#!#!\nTracisz urząd, który sprawuje [head_of_faith|E].\n"
 latria_decision_defeat_imprison_tt: "Przywódca koalicji uwięzi cię w lochu ([dungeon|E])"
 latria_decision_if_white_peace_effect_loc: "\n#high #bold Jeśli wojna zakończy się białym pokojem:#!#!"

