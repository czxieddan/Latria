 latria_act.0401.t: "Niespokojna noc"
 latria_act.0401.desc: "Sen nie nadchodzi. Gdy w komnacie zapada cisza, powraca odłożone na bok pożądanie."
 latria_act.0401.a: "Przewrócić się pod kołdrą"
 latria_act.0402.t: "Bez wytchnienia"
 latria_act.0402.desc: "Najdrobniejsze rozproszenie ustępuje tej samej niezaspokojonej tęsknocie."
 latria_act.0402.a: "Uspokoić myśli"
 latria_act.0403.t: "Stłumione pragnienie"
 latria_act.0403.desc: "Powściągliwość przestała przypominać cierpliwość. Napiera na każdą spokojną myśl."
 latria_act.0403.a: "Wytrwać"
 latria_act.0404.t: "Na skraju załamania"
 latria_act.0404.desc: "Ani sen, ani modlitwa, ani praca nie przynoszą mi ukojenia. To napięcie podąża za mną wszędzie."
 latria_act.0404.a: "Nie dać się złamać"
 latria_act.0405.t: "Zbyt wiele do zniesienia"
 latria_act.0405.desc: "Niezaspokojone pożądanie pochłonęło wszystkie inne myśli. Minęła kolejna bezsenna noc, a nawet codzienne zajęcia sprawiają mi trudność. Nie widzę końca tej udręki."
 latria_act.0405.a: "Wziąć głęboki oddech"
 latria_sexual_frustration_collapse_warning_tt: "Już długo nie wytrzymam…"
 latria_act.0405.b: "Znieść to"
