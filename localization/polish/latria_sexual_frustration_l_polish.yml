 latria_act.0401.t: "Niespokojna noc"
 latria_act.0401.desc: "W komnacie cicho, czuwam tylko ja. Odłożone pożądanie wraca samo, choć nikt go nie woła; ciepło kładzie mi się na plecach. Świeca dogasa, a pod zasłoną łoża stoi zaduch.\n\nLiczę oddechy, gubię rachunek i zaczynam od nowa. Drobne dzienne sprawy wypływają jedna po drugiej, a pod nimi wciąż ta sama nieukojona tęsknota.\n\nIm ciszej w komnacie, tym wyraźniejsza. Ta noc i mnie zastanie bez snu — nasłuchującego, aż do świtu zaśnie łoże."
 latria_act.0401.a: "Przewrócić się pod kołdrą"
 latria_act.0402.t: "Bez wytchnienia"
 latria_act.0402.desc: "W połowie porannej modlitwy ta sama tęsknota wsuwa się między słowa. Przystaję i liczę oddechy od nowa; gdy się wyrównują, ona wciąż tu jest.\n\nŚpiew niesie się przez nawę. Wargi za nim podążają, lecz wersety nie chcą zostać; naokół głowy trzymają się spuszczone. Tęsknota ciąży na piersi, z każdą chwilą cięższa.\n\nGdy kadzidło dogasa, zamykam księgę, wiedząc, że wróci z nocą."
 latria_act.0402.a: "Uspokoić myśli"
 latria_act.0403.t: "Stłumione pragnienie"
 latria_act.0403.desc: "Powściągliwość przestała przypominać cierpliwość. Wzbiera w piersi i odsuwa każdą spokojną myśl.\n\nPraca po pracy przechodzi przez ręce, a myśli wracają w to samo miejsce. Płomień drgnie — i żar wraca. Odkładam pracę i czekam, aż opadnie; za każdym razem trzyma dłużej.\n\nTakich nocy już długo nie wytrzymam."
 latria_act.0403.a: "Wytrwać"
 latria_act.0404.t: "Na skraju załamania"
 latria_act.0404.desc: "Sen nie przychodzi; modlitwa nie okiełznaje pożądania; dzienna praca nie zagłusza go. Nocą hałasuje najgłośniej, w dzień czeka za każdą pauzą.\n\nKu wieczorowi czekam na pukanie do drzwi — choćby słowo powitania. Drzwi się otwierają; wchodzi tylko sługa z wodą, stawia miskę i odchodzi.\n\nGdy drzwi się zamykają, w komnacie jest ciszej niż przedtem."
 latria_act.0404.a: "Nie dać się złamać"
 latria_act.0405.t: "Zbyt wiele do zniesienia"
 latria_act.0405.desc: "Nie chcę się dłużej krępować. Za dnia żar nie schodzi z piersi, a nawet najzwyklejsza czynność nie słucha moich rąk.\n\nW nocy sen nie bierze; leżę z otwartymi oczami i słucham, jak świeca dogasa. Żar przygniata pierś i nie ustępuje.\n\nNie widzę końca tej udręki."
 latria_act.0405.a: "Wziąć głęboki oddech"
 latria_sexual_frustration_collapse_warning_tt: "Już długo nie wytrzymam…"
 latria_act.0405.b: "Znieść to"
