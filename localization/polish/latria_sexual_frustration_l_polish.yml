 game_concept_latria_sexual_repression: "Tłumione pożądanie"
 game_concept_latria_sexual_repression_desc: "Tłumione pożądanie mierzy niezaspokojone pragnienia seksualne postaci. Rośnie z upływem czasu i maleje, gdy postać znajduje cielesne ukojenie."
 game_concept_latria_sexual_repression_level: "Poziom tłumionego pożądania"
 game_concept_latria_sexual_repression_level_desc: "Gdy [latria_sexual_repression|E] osiąga [latria_sexual_repression_threshold|E], wzrasta [latria_sexual_repression_level|E]. Każdy poziom nakłada odpowiedni modyfikator postaci."
 game_concept_latria_sexual_repression_threshold: "Próg tłumionego pożądania"
 game_concept_latria_sexual_repression_threshold_desc: "[latria_sexual_repression_level|E] 1: #V 50#!; 2: #V 85#!; 3: #V 140#!; 4: #V 210#!; 5: #V 320#!."

 latria_daily_sexual_frustration_gain_base: "Przyrost podstawowy"
