l_polish:
 latria_sexual_frustration_1: "Niespokojne pożądanie"
 latria_sexual_frustration_1_desc: "Niezaspokojone pożądanie zaczyna niepokoić tę postać."
 latria_sexual_frustration_2: "Dręczące pożądanie"
 latria_sexual_frustration_2_desc: "Pożądanie wciąż powraca, utrudniając zachowanie spokoju."
 latria_sexual_frustration_3: "Tłumione pożądanie"
 latria_sexual_frustration_3_desc: "Długo tłumione pragnienia cielesne ciążą ciału i umysłowi."
 latria_sexual_frustration_4: "Udręka pożądania"
 latria_sexual_frustration_4_desc: "Ciężar powściągliwości towarzyszy teraz każdej chwili czuwania."
 latria_sexual_frustration_5: "Nieznośne pożądanie"
 latria_sexual_frustration_5_desc: "Pożądanie stało się ciężarem nie do zniesienia."

 latria_sexual_frustration_0: "Spokojne pożądanie"
 latria_sexual_frustration_0_desc: "Niezaspokojone pożądanie nie dręczy tej postaci, a jej ciało i umysł zaznają spokoju."
 latria_sexual_frustration_hud_title: "[SelectLocalization( Or( Not( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').IsSet ), EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)0' ) ), 'latria_sexual_frustration_0', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)1' ), 'latria_sexual_frustration_1', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)2' ), 'latria_sexual_frustration_2', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)3' ), 'latria_sexual_frustration_3', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)4' ), 'latria_sexual_frustration_4', 'latria_sexual_frustration_5' ) ) ) ) )] [GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue|0]/5"
