l_polish:
 latria_sexual_frustration_flavor.1101.t: "Bezsenność pod baldachimem"
 latria_sexual_frustration_flavor.1101.desc.female: "Budzę się w łóżku, z nocną koszulą u jego stóp. W komnacie nie ma nikogo innego; cisza tylko wzmaga tęsknotę, która pozostała bez odpowiedzi."
 latria_sexual_frustration_flavor.1101.desc.male: "Budzę się w łóżku, z nocną koszulą u jego stóp. Świat za oknem milczy, lecz sen nie potrafi zatrzymać moich myśli."
 latria_sexual_frustration_flavor.1101.desc: "Baldachim wisi nisko. Noc jest długa, a myśli nie chcą się uspokoić."
 latria_sexual_frustration_flavor.1101.a: "Zamknąć oczy i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1101.b: "Odsunąć tę myśl, zaciągnąć zasłony i znów ułożyć się do snu."

 latria_sexual_frustration_flavor.1102.t: "Spojrzenia między tańcami"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Mija kilka tańców, zmieniają się otaczające mnie twarze. Nikomu nie przeszkadza bliski obrót, a ja wciąż pamiętam to krótkie spotkanie spojrzeń."
 latria_sexual_frustration_flavor.1102.desc.strict: "Im bliższy taniec, tym bardziej śmiechy przypominają szepty. Odwracam wzrok ku muzykom, by nikt nie odgadł moich myśli."
 latria_sexual_frustration_flavor.1102.desc: "Muzyka przyspiesza, lecz taniec nie rozprasza moich myśli."
 latria_sexual_frustration_flavor.1102.a: "Poprosić o kolejny taniec i przysunąć się nieco bliżej."
 latria_sexual_frustration_flavor.1102.b: "Podziękować ukłonem i wycofać się na skraj sali."

 latria_sexual_frustration_flavor.1103.t: "U drzwi przewodnika"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mój przewodnik duchowy mówi, że tłumienie pożądania nie jest jedyną drogą do pobożności. Chcę zapytać o więcej, lecz za drzwiami zatrzymują się kroki."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mój przewodnik duchowy przypomina, że czystość liczy się także poza zasięgiem cudzych oczu. Pochylam głowę z nadzieją, że nie padną kolejne pytania."
 latria_sexual_frustration_flavor.1103.desc: "Pokój jest ciemny. Zastanawiam się, jak przemówić do mojego przewodnika duchowego."
 latria_sexual_frustration_flavor.1103.a: "Przyznać się do tęsknoty i przestać ją skrywać."
 latria_sexual_frustration_flavor.1103.b: "Zapytać tylko o bieżące obowiązki, a resztę przemilczeć."

 latria_sexual_frustration_flavor.1104.t: "Orzeł nie wraca"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Orzeł krąży nad polem i nie chce wrócić na rękawicę. Zazdroszczę mu swobody podążania za pragnieniem bez żadnych wyjaśnień."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Orzeł wciąż krąży. Służący pytają, czy zamierzam wypuścić kolejną strzałę. Proszę, by zaczekali, jakby cierpliwość mogła wszystko rozwiązać."
 latria_sexual_frustration_flavor.1104.desc: "Orzeł nie wraca, a myśliwi czekają na moje słowo."
 latria_sexual_frustration_flavor.1104.a: "Niech orzeł krąży, a moje myśli błądzą."
 latria_sexual_frustration_flavor.1104.b: "Zebrać myśli i przywołać orła do obozu."

 latria_sexual_frustration_flavor.1105.t: "Świece i korona"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Sługa wynosi koronę z mojej komnaty, pozostawiając obok świec niedokończone dekrety. Otulam się nocną koszulą i wyciągam spomiędzy dokumentów niewysłany list."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Zakładam nocną koszulę w pokoju gospody. Towarzysze już się położyli, lecz niewysłany list obok mojego tobołka nie pozwala mi zasnąć."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Składam szaty i siadam przy łóżku w nocnej koszuli. Niewysłany list leży pod świętą księgą; znowu go wyciągam."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Służba odkłada moje odświętne szaty. Siedząc w nocnej koszuli przy lampie, rozwijam niewysłany list, nim zajmę się niedokończonymi dokumentami."
 latria_sexual_frustration_flavor.1105.desc: "Świece dogasają. Niewysłany list wciąż jest w zasięgu ręki."
 latria_sexual_frustration_flavor.1105.a: "Przekazać list posłańcowi."
 latria_sexual_frustration_flavor.1105.b: "Zniszczyć go, odsunąć tę myśl i zgasić świecę przed snem."

 latria_sexual_frustration_flavor.1106.t: "Niepokój przy świecy"
 latria_sexual_frustration_flavor.1106.desc.female: "Siedzę w nocnej koszuli przy łóżku, a blask świecy tańczy na oknie. Jest późno, lecz nieodwzajemniona tęsknota mnie nie opuszcza."
 latria_sexual_frustration_flavor.1106.desc.male: "Siedzę w nocnej koszuli przy łóżku. Nocna straż dwukrotnie przeszła przez dziedziniec, a moje myśli wciąż nie chcą się uspokoić."
 latria_sexual_frustration_flavor.1106.desc: "Świeca dogasa, lecz sen nie nadchodzi pod baldachimem."
 latria_sexual_frustration_flavor.1106.a: "Pozwolić myślom trwać przy tym uczuciu."
 latria_sexual_frustration_flavor.1106.b: "Nie rozmyślać już o tym; zgasić świecę i ułożyć się do snu."


 latria_sexual_frustration_flavor.1107.t: "Taniec w rewanżu"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Osoba, z którą tańczę, prosi o kolejny taniec, a towarzystwo uznaje to za grzeczność. Pamiętam jednak myśl, która przemknęła mi przez głowę, gdy jej dłoń zatrzymała się na dłużej."
 latria_sexual_frustration_flavor.1107.desc.strict: "Osoba, z którą tańczę, prosi o kolejny taniec i kilka twarzy odwraca się ku nam. Zanim odpowiem, ktoś nachyla się do sąsiada i szepcze."
 latria_sexual_frustration_flavor.1107.desc: "Muzycy zaczynają kolejny taniec, lecz nie wstaję."
 latria_sexual_frustration_flavor.1107.a: "Przyjąć zaproszenie i przysunąć się bliżej."
 latria_sexual_frustration_flavor.1107.b: "Odmówić z ukłonem i życzyć udanego tańca."

 latria_sexual_frustration_flavor.1108.t: "Modlitwa przed snem"
 latria_sexual_frustration_flavor.1108.desc.favors: "Modlę się przy łóżku w nocnej koszuli. Moja wiara pozwala na cielesne uciechy, lecz wewnętrzne pragnienie nie słabnie."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Klęczę przy łóżku w nocnej koszuli i powtarzam ślub czystości. Z każdym wersem coraz trudniej zignorować wewnętrzny głos."
 latria_sexual_frustration_flavor.1108.desc: "Świeca przy łóżku migocze. Modlitwa trwa."
 latria_sexual_frustration_flavor.1108.a: "Odłożyć ślub czystości i przyznać się do tęsknoty."
 latria_sexual_frustration_flavor.1108.b: "Powściągnąć myśli i modlić się dalej."

 latria_sexual_frustration_flavor.1109.t: "Niedokończona rada"
 latria_sexual_frustration_flavor.1109.desc: "Moi radni przedstawili kilka rozwiązań, lecz wciąż nie wybieram żadnego. Myśli odchodzą od bieżącej sprawy, a nawet moje milczenie się przedłuża."
 latria_sexual_frustration_flavor.1109.a: "Zakończyć radę i zostać sam na sam z myślami."
 latria_sexual_frustration_flavor.1109.b: "Stłumić tę myśl i poprosić pisarza, by kontynuował."
 latria_sexual_frustration_flavor.1110.t: "Pokój po północy"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Wracam w nocnej koszuli do mojego małego pokoju. Nocna modlitwa dobiegła końca i świeca dogasa, lecz niewysłany list wciąż leży otwarty na stole."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "W gospodzie pali się już tylko kilka lamp. Siedzę w nocnej koszuli na skraju łóżka, wciąż myśląc o niewysłanym liście."
 latria_sexual_frustration_flavor.1110.desc: "Odgłosy za drzwiami cichną. Wciąż czekam przy łóżku."
 latria_sexual_frustration_flavor.1110.a: "Dokończyć list i wysłać go o świcie."
 latria_sexual_frustration_flavor.1110.b: "Zaryglować drzwi, odsunąć tę myśl i położyć się na noc."

 latria_sexual_frustration_flavor.1101.c: "Włożyć szatę, usiąść spokojnie i wyrównać oddech."
 latria_sexual_frustration_flavor.1102.c: "Porozmawiać z muzykami o ich melodiach."
 latria_sexual_frustration_flavor.1103.c: "Zapytać, jak żyć z tymi uczuciami."
 latria_sexual_frustration_flavor.1103.d: "Zacząć od niewysłanego listu i niczego nie ukrywać."
 latria_sexual_frustration_flavor.1104.c: "Poprosić pozostałych, by zaczekali, i cierpliwie zająć się orłem."
 latria_sexual_frustration_flavor.1105.c: "Schować list do szkatułki i zaplanować jutrzejszą pracę."
 latria_sexual_frustration_flavor.1107.c: "Zaproponować wspólne siedzenie i rozmowę o czymś innym."
 latria_sexual_frustration_flavor.1107.d: "Zaprosić cały stół do żywego tańca grupowego."
 latria_sexual_frustration_flavor.1108.c: "Powoli dokończyć modlitwę, nie walcząc z każdą myślą."
 latria_sexual_frustration_flavor.1109.c: "Zrobić krótką przerwę i uporządkować pozostałe sprawy."
 latria_sexual_frustration_flavor.1109.d: "Uporządkować pilne decyzje i rozstrzygnąć je tutaj."
 latria_sexual_frustration_flavor.1110.c: "Włożyć szatę i poszukać kubka ciepłego bulionu."
