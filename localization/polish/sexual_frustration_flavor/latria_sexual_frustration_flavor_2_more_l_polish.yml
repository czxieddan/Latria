 latria_sexual_frustration_flavor.1111.t: "Druga warta"
 latria_sexual_frustration_flavor.1111.desc: "Budzę się w drugiej warcie, z prześcieradłem skręconym wokół łydki. Lampa wypaliła się do płomienia wielkości kciuka. Dłoń mam już nisko na brzuchu, ciepłą od własnego ciała, i zabieram ją.\n\nJest taki moment o zmierzchu. Ktoś pochyla się obok mnie po sól, przedramię muska grzbiet mojego przegubu i żadne z nas nie porusza się przez długość jednego oddechu. Ten oddech roztrząsam częściej niż całą rozmowę.\n\nPrzyciskam dłoń płasko do materaca przy biodrze. Płótno tam jest wciąż chłodne. Zostawiam je chłodne."
 latria_sexual_frustration_flavor.1111.a: "Pozwolić dłoni iść tam, gdzie chce."
 latria_sexual_frustration_flavor.1111.b: "Odwrócić się i czekać na sen."
 latria_sexual_frustration_flavor.1111.c: "Leżeć bez ruchu i słuchać, jak dom się układa."

 latria_sexual_frustration_flavor.1112.t: "Puchar między nami"
 latria_sexual_frustration_flavor.1112.desc: "Puchar idzie z ręki do ręki wzdłuż ławy, a kiedy do mnie dochodzi, brzeg jest wciąż mokry od cudzych ust. Piję tam, gdzie jest mokro. Ktoś po drugiej stronie stołu patrzy, jak to robię, nie odwraca wzroku i nie uśmiecha się przy tym.\n\nPrzez chwilę mówimy o koniach, o cenie gniadej klaczy, o kowalu na rozstajach. Pod stołem kolano opiera się o moje, bez ciężaru, tylko dotyk, a ja dalej mówię o koniach.\n\nSługa dolewa pucharu. Kolano cofa się, żeby powitać stryja. Trzymam puchar w obu dłoniach, wino zagrzało się, a ława obok mnie zostaje pusta do końca posiłku."
 latria_sexual_frustration_flavor.1112.a: "Powiedzieć wprost to, co mówiło kolano."
 latria_sexual_frustration_flavor.1112.b: "Podziękować towarzystwu i wyjść wcześnie."
 latria_sexual_frustration_flavor.1112.c: "Zostać i mówić o koniach, aż sala opustoszeje."

 latria_sexual_frustration_flavor.1113.t: "Taniec zbyt długi"
 latria_sexual_frustration_flavor.1113.desc: "Muzyka się obraca, a mnie podają z rąk do rąk, od partnera do partnera. Trzecia osoba trzyma moją dłoń o jedno uderzenie dłużej, niż każe figura, kciuk przyciśnięty do wewnętrznej strony przegubu, tam gdzie puls, i uśmiecha się, jakby to był przypadek. Gubię następny krok i przykrywam to obrotem.\n\nKtoś śmieje się w drugim końcu sali. Nie odwracam się, żeby zobaczyć kto. Twarz mam gorącą i wiem, że widać to w świetle świec, a świece są jedynym uczciwym światłem w izbie.\n\nTaniec się kończy. Stoję przy filarze z dłonią wciąż wpół zamkniętą, z kształtem tego kciuka odbitym na skórze, a muzykanci zaczynają od nowa."
 latria_sexual_frustration_flavor.1113.a: "Wypić za tę osobę, głośno, przed całą salą."
 latria_sexual_frustration_flavor.1113.b: "Ukłonić się towarzystwu i zejść z parkietu."
 latria_sexual_frustration_flavor.1113.c: "Znaleźć najcichszy kąt i oddychać wolno."

 latria_sexual_frustration_flavor.1114.t: "Długa droga powrotna"
 latria_sexual_frustration_flavor.1114.desc: "Deszcz o liście, a jeleń odszedł godzinę temu. Jadę z tyłu, rozmowa naganiaczy cichnie przede mną. Uda bolą mnie od siodła tak, że nie dadzą mi zapomnieć o ciele przed wieczorem, a mokra wełna płaszcza jest zimna pod kołnierzem.\n\nPrzy strumieniu ktoś podtrzymuje mi wodze, a dłoń zostaje na pasku, choć koń już się uspokoił. Woda ścieka z końca warkocza. Nikt z nas nie wspomina deszczu.\n\nJedziemy dalej. Mokra skóra skrzypi przy każdym kroku, a ja liczę skrzypnięcia zamiast myśleć i gubię rachunek gdzieś za trzecim polem."
 latria_sexual_frustration_flavor.1114.a: "Pozwolić polowaniu trwać, aż zgaśnie światło."
 latria_sexual_frustration_flavor.1114.b: "Trzymać oczy na tropie, a ręce na wodzach."
 latria_sexual_frustration_flavor.1114.c: "Czytać ziemię, połamane łodygi, odcisk kopyta."
 latria_sexual_frustration_flavor.1114.d: "Puszczać sokoła znowu i znowu."

 latria_sexual_frustration_flavor.1115.t: "Klęczenie o trzeciej godzinie"
 latria_sexual_frustration_flavor.1115.desc: "Klęczę, aż kolana rozbolą mnie na kamieniu, i ten ból jest jedynym, co mogę utrzymać w uwadze. Oliwa w lampie zjełczała. Ciało nie chce dziś rano być ciche. Pragnie, i pragnie w stronę kogoś, kto naprawia belki dachu i pogwizduje przy pracy.\n\nOdsuwam oficjum. Zaczynam od początku, bo myśl zsunęła mi się na czwartej linijce. Ktoś za mną kaszle, a ja się nie odwracam.\n\nKamień jest zimny przez habit. Zostaję na dole, gdy inni wstają, chłód dochodzi mi do goleni, i to nie wystarcza."
 latria_sexual_frustration_flavor.1115.a: "Nazwać to w konfesjonale i przyjąć pokutę potem."
 latria_sexual_frustration_flavor.1115.b: "Trzymać czuwanie aż do dzwonu."
 latria_sexual_frustration_flavor.1115.c: "Wziąć komentarz i przeczytać do końca rozdziału."

 latria_sexual_frustration_flavor.1116.t: "O co kapelan nie zapytał"
 latria_sexual_frustration_flavor.1116.desc: "Kapelan idzie obok mnie krużgankiem i o nic nie pyta, co jest gorsze niż pytanie. Mówię o grzechu lenistwa, a w odpowiedzi słyszę o żniwach, o spóźnionym deszczu, o cenie żyta.\n\nMankiet jest przetarty. Patrzę, jak luźne nitki poruszają się przy geście, myślę o przegubie w rękawie, potem znowu o lenistwie i gubię żniwa zupełnie. Ta osoba zatrzymuje się, żebym ją dogonił.\n\nPrzy drzwiach dostaję błogosławieństwo. Trzymam tę dłoń chwilę dłużej, niż trwa błogosławieństwo. Ta osoba pozwala mi na to, a potem zbiega po stopniach, dwa naraz."
 latria_sexual_frustration_flavor.1116.a: "Wyznać temu człowiekowi wszystko."
 latria_sexual_frustration_flavor.1116.b: "Poprosić o pokutę i wypełnić ją."
 latria_sexual_frustration_flavor.1116.c: "Wysłuchać, co ta osoba ma do powiedzenia o żniwach."

 latria_sexual_frustration_flavor.1117.t: "Petycja po radzie"
 latria_sexual_frustration_flavor.1117.desc: "Rada się przerzedza. Kanclerz zostaje, żeby przeforsować jeszcze jedną petycję, a ja słyszę kształt ust wokół słów zamiast słów. Pieczęć jest ciepła od mojej dłoni, wosk jeszcze nie zastygł.\n\nOd uczty nie zdarza mi się zostać z kimś sam na sam. Korona jest ciężarem na karku, a kark chce innego ciężaru, dłoni tam zamiast złota.\n\nPrzyznaję petycję. Ukłon. Oczy trzymam na mapie, aż drzwi się zamkną, a potem na drzwiach, i świeca przy mapie wypala się, gdy siedzę."
 latria_sexual_frustration_flavor.1117.a: "Wezwać kogoś, gdy świece zgasną."
 latria_sexual_frustration_flavor.1117.b: "Trzymać się pracy, aż petycja będzie zapieczętowana."
 latria_sexual_frustration_flavor.1117.c: "Przeczytać trzy następne petycje samemu."

 latria_sexual_frustration_flavor.1118.t: "Wino śliwkowe na tarasie"
 latria_sexual_frustration_flavor.1118.desc: "Wino śliwkowe, trzeci puchar, a rękawy wciąż się muskają. Mój lud mówi wierszem, każda linijka to krok bliżej, a sługa stoi przy balustradzie, udając, że nie słucha.\n\nPozwalam rękawowi opaść przy przegubie. Drugi rękaw się nie cofa. Gdzieś pod tarasem flet zaczyna, urywa się i zaczyna znowu, te same trzy zwroty.\n\nStawiam puchar na balustradzie, dopity do połowy, a wino trzyma resztkę światła. Nikt z nas nie powiedział tego wprost. Płatek obraca się na płycie. Sługa przy balustradzie wciąż nie słucha."
 latria_sexual_frustration_flavor.1118.a: "Odpowiedzieć wersem, którego nie da się wziąć za nic innego."
 latria_sexual_frustration_flavor.1118.b: "Poprawić rękaw i mówić o pogodzie."
 latria_sexual_frustration_flavor.1118.c: "Chodzić po tarasie samemu, aż zapalą latarnie."

 latria_sexual_frustration_flavor.1119.t: "Niegaszona lampa"
 latria_sexual_frustration_flavor.1119.desc: "Zostawiam lampę palącą się, prześcieradło mam spuszczone do pasa. Dłoń idzie po ciepłej skórze brzucha, niżej, i tym razem jej nie zatrzymuję. Wilgoć jest już we mnie, od myśli o ustach na gardle o zmierzchu, a palce ślizgają się łatwo.\n\nMyślę o ciężarze ciała nad moim, o dokładnym ciężarze, i biodra unoszą się na spotkanie niczego. Naciskam i zataczam kręgi, a oddech rwie się w cichej izbie. Nasada dłoni trze tam, gdzie chcę.\n\nPrzychodzi długim drżeniem, po którym udo mi się trzęsie. Potem leżę z ramieniem w poprzek oczu, lampa wciąż się pali, prześcieradło pode mną wilgotne."
 latria_sexual_frustration_flavor.1119.a: "Pozwolić temu się dokończyć i leżeć w mokrej ciemności."
 latria_sexual_frustration_flavor.1119.b: "Zabrać dłoń i liczyć belki."
 latria_sexual_frustration_flavor.1119.c: "Przyciąć knot i leżeć w ciemności."

 latria_sexual_frustration_flavor.1120.t: "Izba gościa"
 latria_sexual_frustration_flavor.1120.desc: "Pukanie, gdy sala jest już ciemna. Otwieram drzwi w nocnej koszuli, bez stroju i bez żadnego przygotowania na czyjąkolwiek cześć. Widzę spojrzenie, które przesuwa się po moim ciele, i nie sięgam po okrycie.\n\nNie udajemy. Usta znajdują moje gardło, dłonie mam na pasie, a kiedy zostaję uniesiona na stół, puchar przewraca się i toczy. Tempo jest wolne, a mnie brak cierpliwości. Słyszę własny głos, co mnie zaskakuje, i śmiech przy szyi, a tempo się nie zmienia.\n\nPotem wino ścieka z krawędzi stołu na podłogę, kropla po kropli. Nikt z nas nie rusza, żeby to zetrzeć."
 latria_sexual_frustration_flavor.1120.a: "Zostawić drzwi niezaryglowane i koszulę na sobie."
 latria_sexual_frustration_flavor.1120.b: "Podziękować życzliwie i zamknąć drzwi."
 latria_sexual_frustration_flavor.1120.c: "Usiąść na krawędzi stołu i mówić do świtu."

 latria_sexual_frustration_flavor.1121.t: "Za malowanym parawanem"
 latria_sexual_frustration_flavor.1121.desc: "Uczta przekroczyła to, co przyzwoite. W kącie sali rozciągnięto parawan, a hałas za nim nie jest hałasem jedzenia. Dłoń zaciska się na moim przegubie, a ja pozwalam się pociągnąć, i malowane czaple na parawanie przechodzą dość blisko, by ich dotknąć.\n\nDłoni jest więcej, niż ma jedna osoba. Przestaję liczyć. Sitowie jest wydeptane płasko, puchar toczy się o moje kolano i nikt go nie podnosi.\n\nPóźniej siedzę pod ścianą, włosy luźne, usta obrzmiałe, cudzy płaszcz na ramionach. Muzyka nie przestała grać."
 latria_sexual_frustration_flavor.1121.a: "Pójść za parawan i pozwolić sali słyszeć."
 latria_sexual_frustration_flavor.1121.b: "Odmówić i zachować puchar oraz miejsce."
 latria_sexual_frustration_flavor.1121.c: "Rozstawić planszę i grać, aż dłonie będą spokojne."

 latria_sexual_frustration_flavor.1122.t: "Cztery słowa wiersza"
 latria_sexual_frustration_flavor.1122.desc: "Deska do pisania leży mi na kolanach, a trzcinowe pióro wyschło. Mam cztery słowa wiersza o linii ramienia i żadne z tych czterech nie jest dobre. Piąte jest gorsze.\n\nW izbie jest zimno. Własny oddech jest w niej głośny. Odkładam deskę i przyciskam grzbiet dłoni do ust, a tęsknota nie idzie donikąd, tylko zmienia kształt i układa się niżej.\n\nZnowu biorę pióro. Wers zostaje niedokończony, atrament schnie w rozszczepieniu trzciny, a ramię w wersie wciąż jest tylko ramieniem."
 latria_sexual_frustration_flavor.1122.a: "Zapisać ramię i całą resztę."
 latria_sexual_frustration_flavor.1122.b: "Zamknąć deskę i siedzieć z nieruchomymi dłońmi."
 latria_sexual_frustration_flavor.1122.c: "Czytać coś nudnego, aż izba będzie tylko izbą."
 latria_sexual_frustration_flavor.1122.d: "Wyrecytować niedokończony wers przy wieczerzy."

 latria_sexual_frustration_flavor.1123.t: "Ciężar sokoła"
 latria_sexual_frustration_flavor.1123.desc: "Sokół z kapturem siedzi mi na rękawicy, a jego ciężar to jedyna uczciwa rzecz tego ranka. Czekamy w mokrej trawie na czaplę. Ramię mnie pali, skóra przemokła na kciuku.\n\nRamię dochodzi do mojego, gdy przykucamy, i zostaje. Ptak przesuwa łapy. Oczy trzymam na trzcinach. Puls mam w uszach, głośniejszy niż mokradło, i mam pewność, że to słychać.\n\nCzapla nie przychodzi. Wracamy pieszo, sokół jedzie mi na rękawicy, trawa moczy buty do kostek, i nikt z nas nie mówi nic o ramieniu."
 latria_sexual_frustration_flavor.1123.a: "Wyjechać znowu i polować do zmroku."
 latria_sexual_frustration_flavor.1123.b: "Trwać bez ruchu i pozwolić mokradłu ucichnąć."
 latria_sexual_frustration_flavor.1123.c: "Zerwać sokoła i patrzeć tylko na sokoła."

 latria_sexual_frustration_flavor.1124.t: "Skrzynka jałmużny"
 latria_sexual_frustration_flavor.1124.desc: "Liczę monety do skrzynki jałmużny, a liczenie jest sposobem na niemyślenie. Głównie miedź i dwa srebrne grosze od kupca wełny. Dłoń ofiarodawcy jest w skrzynce obok mojej, nasze palce między monetami, a kapłan patrzy na nas oboje z trzeciego stopnia.\n\nZ tego się nie spowiadam i nie wiem, jak to nazwać. Twarz mam ułożoną. Ćwiczę tę ułożoność przed lustrem.\n\nDłoń się cofa. Zamykam wieko, mały mosiężny zamek klika, własna dłoń nie jest pewna na kluczu, a kapłan wciąż stoi na stopniu."
 latria_sexual_frustration_flavor.1124.a: "Zapłacić za świecę i pozwolić kapłanowi zobaczyć moją twarz."
 latria_sexual_frustration_flavor.1124.b: "Trzymać czuwanie, aż świece się skopcą."
 latria_sexual_frustration_flavor.1124.c: "Przeczytać psałterz jeszcze raz, do końca."

 latria_sexual_frustration_flavor.1125.t: "Warunki uzgodnione o północy"
 latria_sexual_frustration_flavor.1125.desc: "Siedzimy nad traktatem od południa. Ze świec zostały ogarki, ogień pozwolono zgasnąć. Druga strona czyta na głos ostatnią klauzulę, a ja zgadzam się, nie słysząc jej, przez to, jak szczęka porusza się wokół języka, który nie jest mój.\n\nTo nie pierwsza taka noc. Znam dokładną odległość, na której przestaję się nadawać do czegokolwiek, i od drugiej świecy jesteśmy w jej wnętrzu.\n\nPodpisuję. Druga strona podpisuje. Wosk jest wciąż miękki, gdy wciskam w niego pierścień, dłoń mam pewną, skryba zabiera kartę, i to jest całość mojego zwycięstwa."
 latria_sexual_frustration_flavor.1125.a: "Posłać liścik, gdy komnata będzie pusta."
 latria_sexual_frustration_flavor.1125.b: "Trzymać się klauzuli, słowo po słowie."
 latria_sexual_frustration_flavor.1125.c: "Zabrać traktat i przeczytać każdą linijkę."

 latria_sexual_frustration_flavor.1126.t: "Trawa, wiatr i otwarty kołnierz"
 latria_sexual_frustration_flavor.1126.desc: "Konie puszczono na trawę, a my siedzimy na filcu, z siodłami wciąż na wierzchu. Ludzie, z którymi jadę, mówią, że jeździec powinien umieć spać w siodle. Ja nie umiem nawet usiedzieć na ziemi.\n\nMówią o rzece, której nigdy nie widzę, o rzece z trzema brodami. Koszula jest otwarta pod gardłem. Wiatr prowadzi trawę długimi pociągnięciami, a ja patrzę na gardło zamiast na rzekę.\n\nKoń parska. Odwracam wzrok pierwszy, uszy mam gorące na wietrze, a rozmowa o rzece toczy się beze mnie."
 latria_sexual_frustration_flavor.1126.a: "Powiedzieć to na głos, w tym języku, źle."
 latria_sexual_frustration_flavor.1126.b: "Powstrzymać język i patrzeć na konie."
 latria_sexual_frustration_flavor.1126.c: "Jechać ostro, aż wiatr mi to odbierze."

 latria_sexual_frustration_flavor.1127.t: "Wklęśnięcie w poduszce"
 latria_sexual_frustration_flavor.1127.desc.female: "Łóżko jest zbyt ciepłe, kołdrę skopałam na podłogę. Nocna koszula zadarta do biodra. Kładę tam dłoń, a ciało odpowiada, zanim cokolwiek postanowię, szybkim ciepłem nisko, bardziej natarczywym niż ja.\n\nMyślę o tym, jak pewna osoba wymawia moje imię w korytarzu, z przytrzymaną drugą sylabą, i o drzwiach niedomkniętych za nią. Palce się poruszają, a oddech więźnie mi na tej przytrzymanej sylabie.\n\nPrzestaję przed końcem. Leżę z nieruchomą dłonią i bijącym sercem, a poduszka obok mnie nie ma wklęśnięcia."
 latria_sexual_frustration_flavor.1127.desc.male: "Kołdra jest na podłodze, nocna koszula zadarta do biodra. Dłoń idzie w dół, a ja jestem już twardy, od niczego, od korytarza i imienia, i od drzwi zostawionych uchylonych.\n\nMyślę o ustach, a biodra przesuwają się same. Oddech przychodzi krótko. Mógłbym to skończyć w jednej chwili i nie robię tego, a to niewykonanie jest własną pracą.\n\nZabieram dłoń i leżę płasko. W izbie jest bardzo cicho, ból nie odchodzi, a poduszka obok jest chłodna i nie dotykam jej."
 latria_sexual_frustration_flavor.1127.desc: "Łóżko jest zbyt ciepłe, lampa zgasła. Kołdrę mam skopaną, dłoń błądzi, a ciało odpowiada od razu, bardziej natarczywe niż ja, zanim pozwolę.\n\nMyślę o korytarzu, o imieniu wypowiedzianym dwa razy, o rękawie odsuniętym przy przegubie. O tej godzinie korytarz jest ciemny. Oddech mi się skraca, a ja pozwalam myśli dobiec do końca i ani kroku dalej.\n\nZabieram dłoń i leżę bez ruchu. Poduszka obok nie ma wklęśnięcia, a kołdra zostaje na podłodze do rana."
 latria_sexual_frustration_flavor.1127.a: "Pozostawić dłoń tam, gdzie jest."
 latria_sexual_frustration_flavor.1127.b: "Złożyć dłonie i spać na boku."
 latria_sexual_frustration_flavor.1127.c: "Wstać i siedzieć przy okiennicy, aż się rozjaśni."

 latria_sexual_frustration_flavor.1128.t: "Toast"
 latria_sexual_frustration_flavor.1128.desc: "Wstaję, żeby wznieść toast, a sala jest rozmytą plamą twarzy. Jedna twarz nie jest plamą. Mówię o wierności przez długość jednego pucharu, a oczy wracają mi w to samo miejsce nad trzecim stołem.\n\nKtoś kaszle przy wysokim stole. Plotka będzie w kuchni, zanim zbiorą talerze, a ja przekonuję się, że obchodzi mnie to mniej, niż powinno, co samo w sobie wymaga odpowiedzi.\n\nSiadam. Dłoń chwyta nóżkę pucharu i trzyma ją zbyt mocno, a po drugiej stronie sali twarz wciąż jest zwrócona ku mnie."
 latria_sexual_frustration_flavor.1128.a: "Nazwać tę osobę, na którą patrzę, i wypić za nią."
 latria_sexual_frustration_flavor.1128.b: "Mówić tylko o wierności i mówić szczerze."
 latria_sexual_frustration_flavor.1128.c: "Zabrać puchar w drugi koniec i usiąść ze starym przyjacielem."

 latria_sexual_frustration_flavor.1129.t: "Komentarz do trzeciego rozdziału"
 latria_sexual_frustration_flavor.1129.desc: "Kapelan czyta komentarz na głos, a ja idę za linijką palcem po stronie. Głos wykonuje czytanie. Mój palec przestał się poruszać, trzy linijki niżej, niż jest głos, na tej samej stronie co godzinę temu.\n\nStrona się obraca, a mój palec zawadza. Czytający czeka. Nie poruszam palca. Świeca między nami chyla się i prostuje, a gdzieś w domu zamykają się drzwi.\n\nCzytanie toczy się dalej. Wywód w trzecim rozdziale gubię zupełnie, izba pachnie woskiem i atramentem, a palec wciąż jest tam, gdzie był."
 latria_sexual_frustration_flavor.1129.a: "Wyznać błądzenie myśli i przyjąć pokutę."
 latria_sexual_frustration_flavor.1129.b: "Poprosić o surowszą regułę i trzymać ją."
 latria_sexual_frustration_flavor.1129.c: "Iść za linijką od nowa, od góry strony."

 latria_sexual_frustration_flavor.1130.t: "Wyznanie przyjacielowi"
 latria_sexual_frustration_flavor.1130.desc: "Mówię przyjacielowi wszystko, korytarz, przegub i puchar, a przyjaciel słucha z brodą na dłoni i ani razu nie patrzy na drzwi. Wino między nami stoi nietknięte. Powiedzenie tego na głos przynosi ulgę i nie zmienia nic.\n\nPotem dłoń zaciska się na moim ramieniu, po przyjacielsku, i zostaje. Patrzę na mapę. Kampania może poczekać sezon; rzeka się nie przesunęła.\n\nPrzyjaciel wychodzi. Siedzę z drewnianymi żetonami kampanii przed sobą, pachnącymi skrzynką, przesuwam jeden, a potem cofam go tam, gdzie był."
 latria_sexual_frustration_flavor.1130.a: "Powiedzieć resztę i o nic nie prosić."
 latria_sexual_frustration_flavor.1130.b: "Nie mówić więcej i wyrównać żetony."
 latria_sexual_frustration_flavor.1130.c: "Zważyć kampanię zamiast tego i policzyć ją dobrze."

 latria_sexual_frustration_flavor.1131.t: "Ciepło, które zostaje"
 latria_sexual_frustration_flavor.1131.desc: "Sen zostawia we mnie ciepło, a budzę się z koszulą zadartą do pasa. Sprawcą jest własna dłoń. Leżę bez ruchu i pozwalam izbie wrócić, zimnej podłodze, dogasającej lampie, a ciepło nie odchodzi razem ze snem.\n\nTo dziecko zarządcy, albo ktoś o tych ustach. Przegub mam przypięty do łóżka, bez pośpiechu, i pamiętam dokładny ciężar, i to, jak materac wziął nas oboje. Na jawie nigdy ani razu nie widzę takiego spojrzenia.\n\nObciągam koszulę na biodrach. Tkanina jest wilgotna tam, gdzie na niej leżę. Odwracam twarz do ściany, a ciepło zostaje pod kocem, cierpliwe, czeka, aż mu ulegnę."
 latria_sexual_frustration_flavor.1131.a: "Pozwolić dłoni wrócić tam, gdzie chce."
 latria_sexual_frustration_flavor.1131.b: "Poprawić koszulę i czekać na świt."
 latria_sexual_frustration_flavor.1131.c: "Myśleć o żartach przy wieczerzy i pozwolić oddechowi zwolnić."

 latria_sexual_frustration_flavor.1132.t: "Trzecia świeca"
 latria_sexual_frustration_flavor.1132.desc: "Klęczę, aż kolana mnie rozbolą, a ból nie wystarcza, żeby oczyścić głowę. Po trzeciej świecy świątynia jest pusta. W ciemności za oczami to samo ciało wraca i wraca, i nie jest to ciało boga.\n\nDłonie pielgrzyma, tygodnie temu, układające koc na moich ramionach przy drodze. Muśnięcie kostek o gardło. Sto razy modlę się, żeby ten obraz odszedł, a on każdej nocy wraca wyraźniejszy: ciepło obcej dłoni tam, gdzie otwiera się kołnierz.\n\nPrzyciskam czoło do złożonych dłoni. Kamień jest zimny. Oddech nie. Zostaję na klęczkach, gdy ostatnia świeca się skraca, i nie proszę o wybaczenie, tylko o to, by drżenie w udach ustało, zanim wstanę."
 latria_sexual_frustration_flavor.1132.a: "Nazwać myśl i pozwolić jej się wypalić."
 latria_sexual_frustration_flavor.1132.b: "Wstać i trzymać czuwanie, aż ciało się wyczerpie."
 latria_sexual_frustration_flavor.1132.c: "Trzymać się ciepła tych dłoni jak pociechy."

 latria_sexual_frustration_flavor.1133.t: "Pod występem"
 latria_sexual_frustration_flavor.1133.desc: "Znowu deszcz, polowanie się rozsypało. Chronię się pod skalnym występem obok osoby, która prowadzi sforę, oboje przemoczeni, a chłód robi z każdego miejsca, w którym się stykamy, małe ognisko. Ramię tej osoby dotyka mojego od barku do przegubu, a ja przestaję udawać, że nie zauważam.\n\nTa osoba mówi coś o burzy. Odpowiadam o burzy. Dłoń znajduje moje plecy, żeby mnie podtrzymać na mokrym kamieniu, i zostaje tam, rozgrzana przez mokrą wełnę, a oddech robi mi się płytki w sposób, którego chłód nie usprawiedliwia.\n\nDeszcz nie rzednie. Kciuk tej osoby porusza się raz wzdłuż mojego kręgosłupa. Oczy trzymam na szarej zasłonie wody i nie odsuwam się, a występ jest zbyt wąski na cokolwiek poza tym."
 latria_sexual_frustration_flavor.1133.a: "Zostać na deszczu jeszcze chwilę."
 latria_sexual_frustration_flavor.1133.b: "Odsunąć się i patrzeć na spadającą wodę."
 latria_sexual_frustration_flavor.1133.c: "Przeczekać burzę, a potem wrócić samemu."

 latria_sexual_frustration_flavor.1134.t: "Nierozwiązane wiązanie"
 latria_sexual_frustration_flavor.1134.desc: "Rada skończona, gabinet jest mój. Nalewam wina, którego nie chcę, a wspomnienie i tak przychodzi, nieproszone: usta posła na uczcie traktatowej, sposób, w jaki zlizują kroplę z kciuka, gdy skrybowie spierają się o granice.\n\nOdkładam puchar. Dłoń idzie do wiązań pod gardłem i staje. We wspomnieniu palce są szybkie i pewne, a ja nie oponuję, opieram się o stół, żeby nie zsunąć się z niego, i cała sala jest rozmytą plamą dymu ze świec za tą osobą.\n\nŚwieca się kopci. Wiązanie pod gardłem wciąż jest zawiązane i zaciskam je mocniej. Wino stoi nietknięte, w izbie jest bardzo cicho, a puls mam głośny w uszach, jak ktoś pukający do drzwi, których nie otwieram."
 latria_sexual_frustration_flavor.1134.a: "Przyznać wprost, czyje usta mam w myśli."
 latria_sexual_frustration_flavor.1134.b: "Zdmuchnąć świecę i pójść spać samemu."
 latria_sexual_frustration_flavor.1134.c: "Rozstawić szachy i zebrać się."

 latria_sexual_frustration_flavor.1135.t: "Wolna miara"
 latria_sexual_frustration_flavor.1135.desc: "Muzykanci biorą wolną melodię, a dłoń zaciska się na mojej, zanim zdążę odmówić. Obracamy się razem przy podwyższeniu, blisko, bliżej, niż każe figura, a osoba, która mnie trzyma, pachnie winem, dymem z drewna i czymś cieplejszym pod spodem.\n\nUdo wsuwa się między moje przy obrocie i zostaje o pół uderzenia za długo. Utrzymuję twarz w spokoju dla sali. Pod muzyką słyszę własny oddech i wiem, że druga strona też go słyszy, bo usta tej osoby wyginają się i nie otwierają.\n\nTaniec się kończy. Nie rozstajemy się od razu. Kciuk prowadzi szew mojej dłoni, wolno, z rozmysłem, pytanie bez słów. Muzykanci zaczynają od nowa, a ja wciąż nie odpowiadam i moja dłoń wciąż jest w tamtej dłoni."
 latria_sexual_frustration_flavor.1135.a: "Iść za melodią i zatańczyć następną miarę."
 latria_sexual_frustration_flavor.1135.b: "Cofnąć dłoń i wejść w tłum."
 latria_sexual_frustration_flavor.1135.c: "Zostać w cieple i wysłuchać melodii do końca."
