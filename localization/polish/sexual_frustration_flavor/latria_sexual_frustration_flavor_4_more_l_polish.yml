 latria_sexual_frustration_flavor.1311.t: "Zanim domownicy wstaną"
 latria_sexual_frustration_flavor.1311.desc: "Budzę się przed domownikami, nocna koszula zadarta za uda, dłoń już przyciśnięta między nimi. Nie zabieram jej. Sen wciąż jest na mnie, ciężar kogoś, kogo nie było w tej izbie, a ciało chce dokończyć to, co sen zaczął.\n\nTrzymam oczy zamknięte i pozwalam temu trwać, oddech się skraca, nasada dłoni trzyma wolny rytm, wyuczony do tej pory. Za zębami mam imię. Nie mówię go, nie przy deskach korytarza skrzypiących pod krokiem sługi.\n\nKiedy to się załamie, leżę bez ruchu z mokrymi palcami i wilgotnym prześcieradłem pod biodrem. Krok mija drzwi i idzie dalej. Obciągam koszulę, a tkanina się lepi."
 latria_sexual_frustration_flavor.1311.a: "Pozwolić temu się skończyć, a potem ubrać się na dzień."
 latria_sexual_frustration_flavor.1311.b: "Zabrać dłoń i leżeć bez ruchu do dzwonu."
 latria_sexual_frustration_flavor.1311.c: "Wstać, umyć się i posiedzieć z bólem chwilę."

 latria_sexual_frustration_flavor.1312.t: "Szczepienie na gruszy"
 latria_sexual_frustration_flavor.1312.desc: "Ogród jest wciąż mokry od nocnego deszczu, a osoba, której unikam cały tydzień, pokazuje mi nowy szczep na gruszy. Palce tej osoby zamykają się na moich, żeby je poprowadzić wzdłuż cięcia. Po skończonym pokazie żadne z nas nie puszcza.\n\nCzuję puls w kciuku tej osoby na moim przegubie. Za żywopłotem dwoje moich domowników spiera się o siodło. Wystarczyłoby obrócić głowę trochę, a tę osobę poprosić o to samo, i robilibyśmy coś, czego nikt nie wziąłby za ogrodnictwo.\n\nTa osoba mówi, że szczep przyjmie się do jesieni. Dłoń wciąż jest na mojej. Gałąź kapie mi na rękaw, a ja tego nie ścieram."
 latria_sexual_frustration_flavor.1312.a: "Powiedzieć wprost, czego chcę, tutaj pod drzewem."
 latria_sexual_frustration_flavor.1312.b: "Podziękować za lekcję i cofnąć się."
 latria_sexual_frustration_flavor.1312.c: "Zostać i powiedzieć zamiast tego jedną prawdziwą rzecz."

 latria_sexual_frustration_flavor.1313.t: "Przez stół"
 latria_sexual_frustration_flavor.1313.desc: "Puchary obeszły dwa razy, a sala jest dość głośna, by nikt nie słuchał jednej osoby. Od godziny patrzę na tego samego gościa przez stół, na linię gardła, gdy się śmieje.\n\nMogę to powiedzieć. Nie całość, tylko dość, żeby ta osoba wiedziała, że nie mówię o pogodzie. Sąsiad by usłyszał. Tak samo zarządca na końcu stołu, który powtarza domownikom wszystko, co mu się powie.\n\nTa osoba obraca puchar za nóżkę i patrzy na mnie nad nim. Otwieram usta. Muzykanci znowu uderzają, i to, co mogło być powiedziane, idzie pod bęben."
 latria_sexual_frustration_flavor.1313.a: "Powiedzieć to dość głośno, by było słychać."
 latria_sexual_frustration_flavor.1313.b: "Powstrzymać język i pozwolić winu robić swoje."
 latria_sexual_frustration_flavor.1313.c: "Odwrócić się do sąsiada i zrobić z tego grę."

 latria_sexual_frustration_flavor.1314.t: "Pierwsze słowo"
 latria_sexual_frustration_flavor.1314.desc: "Klęczę na zimnym kamieniu dość długo, by płyty wbiły się w moje golenie, a słowa przestały być słowami. Myśl wraca mi do ust, których nie mam powodu pamiętać w tym budynku, do tego, jak się otwierały, do dźwięku, który z nich wyszedł.\n\nOsoba, która mnie prowadzi, czeka przy pulpicie z cierpliwością kogoś, kto słyszał już każde wyznanie. Mogę powiedzieć. Powiedzenie byłoby drzwiami, których nie zamknę drugi raz, a ciało chce tych drzwi otwartych, dziś, z wciąż palącą się lampą.\n\nDocieram do pierwszego słowa. Świeca między nami chyla się w przeciągu, a ja patrzę, jak wosk spływa po żelazie i tam twardnieje."
 latria_sexual_frustration_flavor.1314.a: "Powiedzieć i pozwolić świątyni mnie sądzić."
 latria_sexual_frustration_flavor.1314.b: "Zatrzymać wyznanie i przyjąć pokutę."
 latria_sexual_frustration_flavor.1314.c: "Poprosić o księgę i czytać, aż drżenie ustanie."
 latria_sexual_frustration_flavor.1314.d: "Trzymać czuwanie do rana."

 latria_sexual_frustration_flavor.1315.t: "Zarośla olchy"
 latria_sexual_frustration_flavor.1315.desc: "Polowanie się rozsypało, a ja idę za dzikiem, którego nigdy tam nie było. Osoba, z którą chcę być sam, znajduje mnie w olchowych zaroślach, z otwartymi spodniami i dłonią na sobie, i nie odwraca się.\n\nTa osoba klęka w mokrych liściach. Jedną dłoń mam w tamtych włosach, drugą opartą o pień, a rogi grają gdzieś na wschodzie, dość blisko, byśmy nie powinni. Nikt z nas nie przestaje. Ta osoba bierze mnie do ust, a ja muszę ugryźć się od środka w policzek, żeby być cicho.\n\nPotem kolana mam brudne, a do uda przykleił się liść. Ta osoba ociera usta grzbietem przegubu i mówi, że dzik poszedł na północ."
 latria_sexual_frustration_flavor.1315.a: "Pozwolić polowaniu toczyć się beze mnie."
 latria_sexual_frustration_flavor.1315.b: "Wrócić w siodło i zapracować na swoje miejsce."
 latria_sexual_frustration_flavor.1315.c: "Czytać ziemię i iść tropem."

 latria_sexual_frustration_flavor.1316.t: "Krzywa pieczęć"
 latria_sexual_frustration_flavor.1316.desc: "Rada od godziny stoi przy tej samej petycji, a ja nic nie podpisuję. Pod stołem dłonie mam na kolanach i myślę o ostatniej nocy kampanii, o namiocie, o osobie, która weszła bez pukania i nie wyszła, aż zmieniła się warta.\n\nKanclerz pyta, czy się zgadzam. Mówię, że tak, i nie mam pojęcia, na co się zgadzam. Pieczęć jest ciepła od pierścienia. Przyciskam ją do wosku, a znak wychodzi krzywy, litery podwojone przy jednej krawędzi.\n\nWychodzą gęsiego z papierami. Zostaję w krześle z krzywą pieczęcią przed sobą i izbą wciąż pachnącą cudzymi świecami."
 latria_sexual_frustration_flavor.1316.a: "Wezwać tę osobę, o której myślę, z pieczęcią i wszystkim."
 latria_sexual_frustration_flavor.1316.b: "Odłożyć pieczęć i wrócić do petycji."
 latria_sexual_frustration_flavor.1316.c: "Zwołać radę z powrotem i dokończyć pracę."

 latria_sexual_frustration_flavor.1317.t: "Wers na marginesie"
 latria_sexual_frustration_flavor.1317.desc: "Sala egzaminacyjna jest zamieciona i cicha, mam tylko komentarze. Znaki nie chcą stać spokojnie. Tę samą linijkę o wstrzemięźliwości czytam cztery razy i za każdym razem jest o parze dłoni, które puszczam zbyt późno, w korytarzu, z nadchodzącą lampą.\n\nWłasną ręką, na marginesie, mam zapisany wers, który nie jest komentarzem zupełnie. Gdyby egzaminator to zobaczył, wiedziałby, na co to jest i dla kogo. Stronę można spalić. Piecyk jest trzy kroki stąd, a węgle wciąż czerwone.\n\nPrzepisuję wers jeszcze raz, staranniej, a przy ostatnim pociągnięciu pędzel się trzęsie."
 latria_sexual_frustration_flavor.1317.a: "Przepisać wers i pozwolić go czytać."
 latria_sexual_frustration_flavor.1317.b: "Zamknąć księgę i spać na macie."
 latria_sexual_frustration_flavor.1317.c: "Wrócić do komentarzy i zacząć od nowa."
 latria_sexual_frustration_flavor.1317.d: "Nałożyć wers na melodię, którą śpiewają dworzanie."

 latria_sexual_frustration_flavor.1318.t: "Dwa puchary na dziedzińcu"
 latria_sexual_frustration_flavor.1318.desc: "Uczta wylała się na dziedziniec, a mój najstarszy przyjaciel wyszedł za mną z dwoma pucharami. Nie mówię nikomu, ani kapłanowi, ani słudze, ani osobie, której to dotyczy. Dziś wino sprawia, że niemówienie jest ciężkie, tak jak ciężki jest pełny puchar.\n\nMogę to włożyć w te dłonie i pozwolić im ponieść część. Nie będą się śmiać. Ale i nie zapomną, i za każdym razem, gdy spojrzą na mnie przez salę, będzie to między nami, rzecz z imieniem.\n\nTa osoba podaje mi puchar i czeka, a fontanna za nią wciąż płynie. Wypijam, lód pęka i układa się."
 latria_sexual_frustration_flavor.1318.a: "Powiedzieć to na głos i pozwolić im to zachować."
 latria_sexual_frustration_flavor.1318.b: "Przysiąc sobie to i mówić szczerze choćby na dziś."
 latria_sexual_frustration_flavor.1318.c: "Czytać tej osobie, aż dziedziniec opustoszeje."

 latria_sexual_frustration_flavor.1319.t: "Mur ogrodu"
 latria_sexual_frustration_flavor.1319.desc: "Ta osoba stoi plecami do muru ogrodu, spódnice zadarte nad biodra, a moja dłoń jest między udami, gdzie każdy idący ścieżką mógłby zobaczyć. Ta osoba jest już wilgotna. Jest tak od korytarza.\n\nWchodzę w tę osobę dwoma palcami, a dłoń na moim przegubie trzyma mnie tam, mocniej, czoło na moim ramieniu. Oddech się rwie. Po drugiej stronie muru ogrodnik wciąż pracuje, ostrze łopaty dzwoni o kamienie.\n\nDrżenie, paznokcie zaciskają się na moim ramieniu. Kiedy można już stać, spódnice zostają wygładzone, a moje imię pada raz, cicho, jak pytanie, na które jest już odpowiedź."
 latria_sexual_frustration_flavor.1319.a: "Zostać z tą osobą, aż będzie można iść."
 latria_sexual_frustration_flavor.1319.b: "Zabrać dłoń i życzyć dobrej nocy."
 latria_sexual_frustration_flavor.1319.c: "Obejść mur dłuższą drogą, samemu."

 latria_sexual_frustration_flavor.1320.t: "Katalog"
 latria_sexual_frustration_flavor.1320.desc: "Przychodzę do świątyni, żeby się tego pozbyć, a zamiast tego klęczę i układam katalog: zapach pewnej szyi, dźwięk, który wydaje pewna osoba, dokładny ciężar ciała przy moim w progu, jedna dłoń płasko na framudze.\n\nOsoba, która mnie prowadzi, nie śpi i czyta. Mogę poprosić o pokutę, dostanę ją, wypełnię, i trzeciej nocy będę z powrotem na tym kamieniu z tą samą listą, dłuższą.\n\nProszę zamiast tego o księgę. Dostaję ją bez słowa, z palcem tej osoby zostawionym na miejscu, i trzymam ją otwartą, nie czytając ani linijki."
 latria_sexual_frustration_flavor.1320.a: "Nazwać wszystko i pozwolić świątyni odpowiedzieć."
 latria_sexual_frustration_flavor.1320.b: "Poprosić o pokutę i zachować swoją listę."
 latria_sexual_frustration_flavor.1320.c: "Słuchać tego, co ta osoba chce mi powiedzieć."

 latria_sexual_frustration_flavor.1321.t: "Trzy tygodnie w drodze"
 latria_sexual_frustration_flavor.1321.desc: "Jesteśmy trzy tygodnie w drodze i od ostatniego miasta nie zdarza mi się zostać z kimś sam na sam. Koń jest rozsiodłany, ogień niski, a inni śpią w płaszczach na odległość ramienia, dość blisko, by słyszeć, jak ktoś zgrzyta zębami.\n\nLeżę z dłonią pod koszulą i zębami na własnej kostce, słuchając, jak konie przestępują i jak buty strażnika szeleszczą w liściach. To trwa długo, a kiedy się kończy, nie jest to zaspokojenie, tylko zmęczenie, i tęsknota wciąż jest pod zmęczeniem.\n\nStrażnik wraca obok ognia i nie patrzy na mnie. Podciągam płaszcz i patrzę, jak żar szarzeje."
 latria_sexual_frustration_flavor.1321.a: "Wziąć to, co noc pozwala, i spać."
 latria_sexual_frustration_flavor.1321.b: "Wstać i wziąć swoją kolej na warcie."
 latria_sexual_frustration_flavor.1321.c: "Ćwiczyć samemu, aż ramiona się zatrzęsą."

 latria_sexual_frustration_flavor.1322.t: "Puchar posła"
 latria_sexual_frustration_flavor.1322.desc: "Stół poselstwa jest nakryty na dwanaście osób, a ja siedzę obok posła, którego lud ma zwyczaj gościnności, o którym myślę od prezentacji, przez rybę, przez drugie nalanie.\n\nTa osoba sama dolewa mi pucharu, co się nie podoba jej stewardowi. Jeśli powiem tu niewłaściwą rzecz, będzie w depeszy następnym statkiem, w moim imieniu, ręką nie swoją. Jeśli powiem właściwą, też będzie w depeszy, i czytana na głos w izbie, do której nigdy nie wejdę.\n\nPada pytanie o nasze zwyczaje małżeńskie. Odpowiadam źle. Świeca wypaliła się do lichtarza, i żadne z nas nie woła o nową."
 latria_sexual_frustration_flavor.1322.a: "Odpowiedzieć tak, jak pozwala ich zwyczaj."
 latria_sexual_frustration_flavor.1322.b: "Życzyć dobrej nocy i pójść."
 latria_sexual_frustration_flavor.1322.c: "Skierować rozmowę na traktat i tam ją trzymać."

 latria_sexual_frustration_flavor.1323.t: "Chór na galerii"
 latria_sexual_frustration_flavor.1323.desc: "Chór ćwiczy na galerii, a ja mam słyszeć harmonię, a nie usta kapłana, który go prowadzi, i sposób, w jaki formuje trzecią linijkę.\n\nNabieram zwyczaju przychodzenia wcześnie i wychodzenia późno. Śpiew robi z ciasnotą w mojej piersi coś, czego modlitwa nie robi, i wiem, za co to stoi. Osoba, która mnie prowadzi, zauważa godzinę, o której się zjawiam, i nic nie mówi, co jest gorsze niż nagana, bo znaczy, że czeka.\n\nOstatnia nuta umiera w sklepieniu. Zostaję w ławie z dłońmi płasko na kolanach, aż zakrystian przyjdzie z kluczami."
 latria_sexual_frustration_flavor.1323.a: "Śpiewać z nimi i pozwolić dźwiękowi to unieść."
 latria_sexual_frustration_flavor.1323.b: "Trzymać regułę i wyjść przed ostatnią zwrotką."
 latria_sexual_frustration_flavor.1323.c: "Studiować zapis głosów z tą osobą zamiast tego."

 latria_sexual_frustration_flavor.1324.t: "Poranny dzwon"
 latria_sexual_frustration_flavor.1324.desc: "Budzę się w splątanych prześcieradłach, z całą tą rzeczą wciąż na sobie, z koszulą zadartą pod ramiona, i z dłonią między udami, zanim na dobre się rozbudzę. Sen odchodzi, a ja go gonię, biodra w górę, i nie dbam, kto jest w następnej izbie ani która jest godzina.\n\nPrzychodzi falą, po której udo się trzęsie. Leżę z palcami wciąż w sobie i z głośnym oddechem w ciszy, a prześcieradło pode mną jest przemoczone, już zimne tam, gdzie dosięga go powietrze.\n\nDzwon na jutrznię zaczyna. Wyciągam mokre prześcieradło i wkładam je do miski, a woda robi się mętna."
 latria_sexual_frustration_flavor.1324.a: "Skończyć, umyć się i odpowiedzieć dzwonowi."
 latria_sexual_frustration_flavor.1324.b: "Ściągnąć prześcieradło i pójść bez mycia."
 latria_sexual_frustration_flavor.1324.c: "Siedzieć przy desce, aż dłonie będą pewne."

 latria_sexual_frustration_flavor.1325.t: "Drzwi"
 latria_sexual_frustration_flavor.1325.desc: "W kącie trwa gra, a ja oddaję trzy rundy z rzędu, bo wciąż patrzę na drzwi. Osoba, na którą czekam, spóźnia się, a każdy w tej sali wie, kim jestem, z kim jestem połączony ślubem i które z nich mnie obserwuje.\n\nMogę wstać na ławie i powiedzieć to. Izba ucichnie tak, jak izby cichną, a do rana będzie to w każdej sali stąd do wybrzeża, z moim imieniem i z imieniem mojej rodziny po nim, i te dwa imiona nie będą już rozdzielone.\n\nDrzwi się otwierają. To sługa z winem. Wyciągam puchar, dłoń mam pewną, co jest gorsze."
 latria_sexual_frustration_flavor.1325.a: "Wstać i powiedzieć to całej sali."
 latria_sexual_frustration_flavor.1325.b: "Zostać na siedząco i pozwolić grze trwać."
 latria_sexual_frustration_flavor.1325.c: "Znaleźć przyjaciela i usiąść z nim zamiast tego."

 latria_sexual_frustration_flavor.1326.t: "Rachunki"
 latria_sexual_frustration_flavor.1326.desc: "Zarządca rozłożył rachunki, mapę i listę moich zobowiązań, a ja nie czytam żadnego z nich. Myślę o drzwiach w mieście, przez które przechodzę wiosną, i o tym, jak ktoś wymawia w ciemności za nimi moje imię, dwa razy, zanim zasuwa się podnosi.\n\nJest wiele do zrobienia i to ja muszę to zrobić. Zanurzam pióro i piszę pierwszą liczbę, jest błędna, a przekreślam ją tak mocno, że stalówka się rozszczepia i atrament idzie przez kolumnę.\n\nPrzycinam pióro i zaczynam od nowa. Za oknem załoga ćwiczy musztrę, a krzyki trzymają rytm."
 latria_sexual_frustration_flavor.1326.a: "Zostawić rachunki i posłać po tamto miasto."
 latria_sexual_frustration_flavor.1326.b: "Odłożyć pióro i wziąć księgę."
 latria_sexual_frustration_flavor.1326.c: "Przejść listę, aż świece się skopcą."

 latria_sexual_frustration_flavor.1327.t: "Wzniesienie"
 latria_sexual_frustration_flavor.1327.desc: "Jedziemy od świtu, a trawa jest pusta w każdym kierunku, bez drzewa, bez jeźdźca, nic aż do krawędzi nieba. Ciało skarży się od drugiego dnia w siodle, a sama jazda nie robi nic, żeby to uciszyć; tylko to pogarsza.\n\nZatrzymuję się na szczycie wzniesienia, wkładam dłoń w spodnie i kończę to kilkoma twardymi pociągnięciami, z wiatrem w twarzy i nikim w zasięgu wzroku, a koń przez cały czas przestępuje pode mną.\n\nZawiązuję sznurek i zjeżdżam do nich. Kuzyn pyta, dlaczego się uśmiecham, a ja mówię, że koń jest dobry."
 latria_sexual_frustration_flavor.1327.a: "Wziąć chwilę, którą daje mi step."
 latria_sexual_frustration_flavor.1327.b: "Jechać dalej i wyrzucić to z myśli."
 latria_sexual_frustration_flavor.1327.c: "Puszczać sokoła, aż ramiona się zmęczą."

 latria_sexual_frustration_flavor.1328.t: "Czuwanie"
 latria_sexual_frustration_flavor.1328.desc: "Jestem w świątyni od oficjum i wciąż tu jestem. Lampę napełniano dwa razy, a oliwa pachnie taniej prasy. Kolana przeszły od bólu do czegoś w rodzaju odrętwienia, a tęsknota nie poszła donikąd; rozgościła się i jest jej wygodnie.\n\nCzuwanie ma opróżniać człowieka. Zamiast tego dało tęsknocie miejsce, tak jak ciemna izba daje kształt temu, co w niej stoi. Mógłbym pójść. Drzwi nie są zamknięte, a miasto niedaleko.\n\nZaczynam psalm od początku. Głos wychodzi mi pewny i trochę go za to nienawidzę."
 latria_sexual_frustration_flavor.1328.a: "Zerwać czuwanie i wyjść do miasta."
 latria_sexual_frustration_flavor.1328.b: "Trzymać czuwanie, aż niebo zszarzeje."
 latria_sexual_frustration_flavor.1328.c: "Przeczytać psałterz do końca."

 latria_sexual_frustration_flavor.1329.t: "Cztery linijki"
 latria_sexual_frustration_flavor.1329.desc: "Jestem w nocnej koszuli przy oknie, a na parapecie leży list, który piszę i nie wysyłam. Cztery linijki. Ostatnia mówi, czego chcę, słowami, których nie używam za dnia, atrament jest suchy, a pieczęć nienaruszona.\n\nMogę go oddać słudze przy drzwiach. Mogę też spalić, a trzy inne już spłonęły i popiół wciąż jest w piecyku. Ciało nie jest zainteresowane spaleniem. Chce odpowiedzi, która przychodzi po oddaniu.\n\nŚwieca jest już ogarkiem, a wosk spłynął przez brzeg. Czytam ostatnią linijkę jeszcze raz, a papier trzęsie się w dłoni."
 latria_sexual_frustration_flavor.1329.a: "Oddać list słudze."
 latria_sexual_frustration_flavor.1329.b: "Włożyć go do piecyka i pójść spać."
 latria_sexual_frustration_flavor.1329.c: "Siedzieć przy oknie, aż ogarek zgaśnie."

 latria_sexual_frustration_flavor.1330.t: "Klauzula o granicy"
 latria_sexual_frustration_flavor.1330.desc: "Gabinet nauczyciela pachnie kurzem i zimnym atramentem, a ja nie biorę z traktatu ani słowa. Ta osoba objaśnia klauzulę o granicy, a ja patrzę na dłonie, na atrament z boku palca, na sposób, w jaki przytrzymuje stronę.\n\nTa osoba jest dość stara, by być moim rodzicem, i dwa razy ostrożniejsza, i nic w tym nie ma, i nie musi być. Tęsknota nie pyta o pozwolenie. Siedzi we mnie, gdy ta osoba przewraca stronę i znajduje paznokciem następną klauzulę.\n\nPada pytanie, czy rozumiem. Mówię, że tak. Ta osoba patrzy na mnie chwilę dłużej, niż wymaga pytanie, a potem wraca do strony."
 latria_sexual_frustration_flavor.1330.a: "Napisać wers o granicy zamiast tego."
 latria_sexual_frustration_flavor.1330.b: "Poprosić o wysłuchanie spowiedzi."
 latria_sexual_frustration_flavor.1330.c: "Powtórzyć klauzulę słowo w słowo."

 latria_sexual_frustration_flavor.1331.t: "Wolna godzina"
 latria_sexual_frustration_flavor.1331.desc: "Dom śpi, a ja nie, już od godziny. Koszula jest zadarta za biodra, a palce znalazły moją wilgoć, choć nic nie postanawiam. Trzymam je tam i pozwalam przyjść myśli, która krąży od korytarza, o osobie, która pochyliła się, żeby poprawić mi kołnierz, i nie cofnęła się potem.\n\nNaciskam i zataczam kręgi tak, jak ciało mnie nauczyło, wolno, potem nie wolno, drugą dłoń płasko na wezgłowiu, żeby nie stukało o ścianę. Na dole są drzwi służby i schody, które się skarżą. Nie przestaję. Oddech mi się rwie, a twarz odwracam w poduszkę, żeby przełknąć dźwięk.\n\nTo się załamie, a ja leżę z palcami wciąż przy sobie, puls trwa pod nimi. Schody skarżą się jeszcze raz i układają. Obciągam koszulę, tkanina jest wilgotna i lepi się."
 latria_sexual_frustration_flavor.1331.a: "Pozwolić temu się skończyć, a potem ubrać się przed dzwonem."
 latria_sexual_frustration_flavor.1331.b: "Zabrać dłoń i leżeć bez ruchu."
 latria_sexual_frustration_flavor.1331.c: "Umyć się i posiedzieć z bólem, aż stępieje."

 latria_sexual_frustration_flavor.1332.t: "Zimna nawa"
 latria_sexual_frustration_flavor.1332.desc: "Przychodzę do świątyni, żeby się opróżnić, i klęczę na zimnym kamieniu, aż tęsknota tylko układa się głębiej. Ma teraz twarz, osobę, której spowiadam się na uczcie, sposób, w jaki słucha z przechyloną głową, sposób, w jaki kciuk porusza się po pucharze. Dłoń mam pod szatą, a w ciemności bocznej nawy nikt tego nie widzi.\n\nOczy trzymam na lampie ołtarza i pozwalam palcom pracować, wolno, szczęka zaciśnięta. Gdzieś za parawanem otwierają się drzwi i akolici wchodzą na nocne oficjum, stopy na płytach. Trzeba przestać. Dłoń nie przestaje. Przyciskam czoło do złożonych dłoni i oddycham przez zęby.\n\nTo mija i zostaje po tym pustka i drżenie. Akolici zaczynają psalm. Zostaję na klęczkach, aż nogi zdrętwieją, a lampa jest jedynym, na co mogę patrzeć."
 latria_sexual_frustration_flavor.1332.a: "Nazwać to w konfesjonale i przyjąć pokutę."
 latria_sexual_frustration_flavor.1332.b: "Trzymać czuwanie, aż niebo zszarzeje."
 latria_sexual_frustration_flavor.1332.c: "Przeczytać psałterz do końca."

 latria_sexual_frustration_flavor.1333.t: "Zielona kotlina"
 latria_sexual_frustration_flavor.1333.desc: "Odciągam od polowania tę osobę, której chcę, w kotlinę, gdzie światło idzie zielone przez liście. Spodnie mam otwarte, dłoń tej osoby jest na mnie, a moja pod spódnicami, i żadne z nas nie udaje, że chodzi o jelenie. Ta osoba jest już wilgotna. Jest tak, odkąd przy brodzie chwytam ten przegub.\n\nWchodzę w to ciało palcami, słychać chwytający powietrze oddech, a usta tej osoby przykrywają moje, mocno, wolna dłoń zwinięta w moim kołnierzu. Rogi grają między drzewami, polowanie skręca gdzieś blisko. Nie przestajemy. Ruch na mojej dłoni, oddech krótkimi falami przy policzku.\n\nDrżenie, bezruch, dłoń zaciśnięta na moim przegubie. Rogi cichną na wschodzie. Spódnice zostają wyprostowane drżącymi dłońmi, a z włosów wypada liść."
 latria_sexual_frustration_flavor.1333.a: "Pozwolić polowaniu toczyć się bez nas."
 latria_sexual_frustration_flavor.1333.b: "Wrócić w siodło i zapracować na swoje miejsce."
 latria_sexual_frustration_flavor.1333.c: "Wrócić dłuższą drogą i ochłodzić się."

 latria_sexual_frustration_flavor.1334.t: "Margines traktatu"
 latria_sexual_frustration_flavor.1334.desc: "Gabinet jest zimny, traktat leży otwarty, a ja czytam tę samą klauzulę trzy razy. Posła, który go przyniósł, nie ma, ale pamięci nie, godziny w korytarzu, gdy ta osoba stoi przy ścianie, moja dłoń pod tuniką, usta otwarte na moim ramieniu, i oboje nasłuchujemy kroku.\n\nDłoń zeszła mi na kolana pod stołem. Zmuszę się do zabrania jej i przyciśnięcia płasko do strony. Atrament jest suchy pod dłonią. Gdybym napisał na marginesie to, o czym myślę, skryba przepisałby to na czysto i do rana puścił w obieg.\n\nZanurzam pióro i piszę klauzulę jeszcze raz, poprawnie, a przy ostatnim słowie dłoń nie jest pewna. Świeca się kopci, a ja przycinam knot."
 latria_sexual_frustration_flavor.1334.a: "Powiedzieć wprost, czego chcę od tej osoby."
 latria_sexual_frustration_flavor.1334.b: "Życzyć dobrze i cofnąć się."
 latria_sexual_frustration_flavor.1334.c: "Rozstawić planszę i grać, aż dłonie będą nieruchome."

 latria_sexual_frustration_flavor.1335.t: "Za arrasem"
 latria_sexual_frustration_flavor.1335.desc: "Uczta jest głośna, muzykanci są między melodiami, a ja mam osobę, na którą patrzę cały wieczór, za arrasem, gdzie światło nie dochodzi. Dłoń mam pod suknią, plecami do ściany, a warga jest przygryziona, żeby być cicho. Druga dłoń na ustach, nie mocno, tylko dość.\n\nSala jest trzy stopy dalej, po drugiej stronie tkaniny. Puchar się tłucze, ktoś się śmieje. Ruch na moich palcach, oczy się zamykają, i czuję drżenie, które przez to ciało przechodzi, oddech gorący i szybki przy dłoni.\n\nCiało trochę opada, a ja je podtrzymuję. Za arrasem muzykanci zaczynają od nowa. Suknia zostaje wygładzona, ta osoba wychodzi pierwsza, a ja czekam chwilę, zanim pójdę w ślad."
 latria_sexual_frustration_flavor.1335.a: "Wśliznąć się z powrotem i zająć miejsce."
 latria_sexual_frustration_flavor.1335.b: "Zostać za tkaniną jeszcze chwilę."
 latria_sexual_frustration_flavor.1335.c: "Znaleźć przyjaciela i usiąść z nim zamiast tego."

 latria_sexual_frustration_flavor.1336.t: "Pożyczony dach"
 latria_sexual_frustration_flavor.1336.desc: "Wnoszę dzban wina i przekrojony melon na pożyczony dach, bo dziś Tkaczka i Pasterz przekraczają rzekę gwiazd i spotykają się, a cały dom jest niżej, z twarzami zadartymi w górę. Ta osoba, której chcę całe lato, siedzi blisko, kolanem przy moim, i oboje udajemy, że patrzymy w niebo.\n\nSpotykają się jedną noc w roku, tych dwoje, i wracają na swoje brzegi. Obracam w dłoni skórkę melona i myślę, że ta jedna noc by mi wystarczyła. Wino zagrzało się. Ramię tej osoby nie odsuwa się od mojego i moje nie odsuwa się od jej.\n\nPod nami ktoś woła, że gwiazdy się przesunęły. Ta osoba obok unosi puchar ku niebu, ja unoszę swój i żadne z nas nie mówi tego, co siedzi między nami na ciepłych płytkach."
 latria_sexual_frustration_flavor.1336.a: "Powiedzieć to wprost, tu pod gwiazdami."
 latria_sexual_frustration_flavor.1336.b: "Zatrzymać to w sobie i podać melona."
 latria_sexual_frustration_flavor.1336.c: "Zejść na dół i iść, aż ból stępieje."

 latria_sexual_frustration_flavor.1337.t: "Rubajaty podczaszego"
 latria_sexual_frustration_flavor.1337.desc: "Jestem w winiarni przy bazarze, gdzie po izbie krąży rubajat, cztery linijki na puchar, a podczaszy podchodzi, by napełnić mój. Nalewa, nie roniąc kropli, i nie odwraca wzroku, a w izbie dość głośno, by nikt tego nie zauważył prócz mnie.\n\nStarzy poeci pili tak i nigdy nie kładli dłoni tam, gdzie śpiewały usta. Tęsknota wchodzi w wers i wychodzi czysta, a podczaszy stoi z przechyloną flaszą, czekając, aż to patrzenie się skończy.\n\nRubajat się kończy. Napełniają ostatni puchar, odstawiają flaszę i idą do następnego stołu, a ja trzymam wino, nie pijąc, i pozwalam ostatniej linijce dokończyć w mojej głowie."
 latria_sexual_frustration_flavor.1337.a: "Odpowiedzieć na wers własnym."
 latria_sexual_frustration_flavor.1337.b: "Podziękować i zwrócić się do towarzystwa."
 latria_sexual_frustration_flavor.1337.c: "Rozstawić planszę i grać, aż dłonie będą nieruchome."

 latria_sexual_frustration_flavor.1338.t: "Święte źródło"
 latria_sexual_frustration_flavor.1338.desc: "Ryt zostawił źródło parujące i świątynię pustą, jeśli nie liczyć kapłana, który go dogląda. Mam się wykąpać w wodzie, zanim nade mną wypowiedzą błogosławieństwo boga, a dzisiejsze błogosławieństwo kładzie się na ciele i na tym, czego ono chce, nie przeciw niemu.\n\nDłonie kapłana są pewne na moich ramionach, gdy leje wodę na moją głowę, para unosi się między nami i żadne z nich nie cofa się, gdy ryt się kończy. Bóg powiedział, że tęsknota nie jest grzechem. Woda spływa mi po plecach, a ja stoję w niej chwilę dłużej, niż trzeba.\n\nKapłan sięga po płótno i czeka. Lampa syczy. Puszczam resztę wody i biorę tkaninę z tych dłoni."
 latria_sexual_frustration_flavor.1338.a: "Pozwolić błogosławieństwu znaczyć to, co mówi."
 latria_sexual_frustration_flavor.1338.b: "Wytrzeć się i trwać w nocnym czuwaniu."
 latria_sexual_frustration_flavor.1338.c: "Czytać tekst rytu, aż gorąco przejdzie."

 latria_sexual_frustration_flavor.1339.t: "Późny sympozjon"
 latria_sexual_frustration_flavor.1339.desc: "Wieńce więdną, a flet znowu się odezwał, i wino jest zmieszane z wodą tak, jak robi to przezorny gospodarz, żeby noc trwała długo, zamiast się skończyć. Leżę na posłaniu z tą osobą, na którą patrzę od pierwszego dania, dość blisko, by światło lampy było w obu naszych pucharach.\n\nTa osoba pochyla się bliżej, żeby słyszeć mnie przez flet, dłoń płasko na poduszce między nami, bez dotyku, i godzina jest dość późna, by inni przestali słuchać. Wino jest przeważnie wodą i nie bierze mnie, co jest gorsze, bo wiem dokładnie, co by się stało.\n\nFlet milknie między melodiami. Ta osoba obok nie zabiera dłoni, lampa pali się nisko, a ktoś woła o więcej wieńców."
 latria_sexual_frustration_flavor.1339.a: "Zaśpiewać następną linijkę z fletem."
 latria_sexual_frustration_flavor.1339.b: "Odejść i przespać to."
 latria_sexual_frustration_flavor.1339.c: "Zwrócić się do towarzystwa i przeciągnąć noc."

 latria_sexual_frustration_flavor.1340.t: "Włosiennica"
 latria_sexual_frustration_flavor.1340.desc: "Pod bogatymi szatami noszę włosiennicę, wełna szorstka przy skórze, a opat znowu powtarza swoje ostrzeżenie: ciało jest wrogiem, a ślub murem. Mam ją nosić przez całe oficjum i pozwolić jej mnie uczyć.\n\nWełna gryzie, gdy klękam, i gorzej, gdy wstaję, a pot sprawił, że się lepi, i ciało napiera na ślub tak, jak zawsze, gdy muszę z nim siedzieć bez ruchu. Modlę się słowami. Słowa nie tykają tęsknoty.\n\nOpat patrzy na mnie od balustrady ołtarza. Trzymam dłonie złożone i oczy spuszczone, i kończę oficjum z wełną, która mnie pili, i ślubem, który trzyma, ledwo."
 latria_sexual_frustration_flavor.1340.a: "Wymknąć się i zdjąć z tego ostrość samemu."
 latria_sexual_frustration_flavor.1340.b: "Klęczeć dłużej i pozwolić wełnie robić swoje."
 latria_sexual_frustration_flavor.1340.c: "Poprosić o tekst i czytać pod okiem opata."
