 latria_sexual_frustration_flavor.1411.t: "Nikogo przy drzwiach"
 latria_sexual_frustration_flavor.1411.desc: "Lampa wypaliła się do ogarka, a ja wciąż nie śpię, koszula zadarta za biodra, własna dłoń tam, dokąd nie posyłam jej przy nikim. Przestaję nazywać to niepokojem. Trzecią noc przyprowadzam się do krawędzi i zostawiam tam, nasłuchując kroku w przejściu, który nie przychodzi. Prześcieradło jest wilgotne tam, gdzie leżę bez ruchu zbyt długo.\n\nMyślę o tym, jak ta osoba pochyla się nad moim krzesłem na uczcie, dość blisko, że z wyprostowaniem się tej osoby ciepło izby wychodzi razem. Oddech przychodzi krótko. Przyciskam dłoń płasko i trwam bez ruchu, a tęsknota nie zelżeje, tylko zbiera się niżej i ciężej.\n\nGdzieś na dole zamykają się drzwi. Dłoń znowu się porusza, i tym razem jej nie zatrzymuję."
 latria_sexual_frustration_flavor.1411.a: "Dokończyć to, co dłoń zaczęła, i przyznać się do pragnienia."
 latria_sexual_frustration_flavor.1411.b: "Zabrać dłoń i leżeć bez ruchu, aż lampa zgaśnie."
 latria_sexual_frustration_flavor.1411.c: "Włożyć szatę i posiedzieć w ciszy, aż rozluźni."

 latria_sexual_frustration_flavor.1412.t: "Więcej, niż trzeba było"
 latria_sexual_frustration_flavor.1412.desc: "Sala jest głośna od resztek wina, a ja mówię już za dużo. Sąsiad pyta, skąd znam taką opowieść, a ja mówię, i potem mówię resztę, tę część, której nigdy nie wypowiadam na głos za dnia.\n\nKtoś się śmieje i woła o więcej. Słyszę własny głos, szybszy, dodający szczegół, który zawsze pomijam: godzinę, drzwi, sposób, w jaki czekam. Wino rozgrzało mi twarz. Gdzieś za mną odstawiają puchar. Nie umiem zatrzymać się w miejscu, w którym zatrzymałby się ktoś ostrożny.\n\nKrzesło sąsiada zgrzyta. Muzyka się skończyła, a nikt jeszcze nie poszedł do domu, sala pachnie łojem i rozlanym winem, a ja wciąż trzymam puchar, odkładany już tyle razy."
 latria_sexual_frustration_flavor.1412.a: "Powiedzieć resztę i pozwolić całemu stołowi słyszeć."
 latria_sexual_frustration_flavor.1412.b: "Ukłonić się towarzystwu, zatrzymać resztę za zębami i pójść."
 latria_sexual_frustration_flavor.1412.c: "Skierować rozmowę na starych przyjaciół i pozwolić winu zrobić resztę."

 latria_sexual_frustration_flavor.1413.t: "Te same trzy linijki"
 latria_sexual_frustration_flavor.1413.desc: "Klęczę przy ołtarzu, koszula pod kolanami, kamień zimny przez tkaninę. Płyty wyciągnęły ciepło z moich goleni. Dyżurny odszedł. Odsuwam całe oficjum, a usta wracają do tych samych trzech linijek, tych o ciele, jakby słowa były drzwiami, obok których wciąż przechodzę.\n\nZa dnia mogę nazwać to próbą i mieć spokój. Tutaj, z kopcącymi świecami i nikim do patrzenia, mogę tylko zmierzyć, ile ze mnie chce wyjść ze świątyni i dotrzeć do pewnego domu, zanim zmieni się warta. Tęsknota ma ciężar. Kolana bolą mnie od noszenia go.\n\nNajbliższa świeca chyla się, potem staje prosto. Kładę dłoń na zimnym kamieniu i nie wstaję."
 latria_sexual_frustration_flavor.1413.a: "Zostawić oficjum niedokończone i pójść tam, gdzie chcę iść."
 latria_sexual_frustration_flavor.1413.b: "Trzymać czuwanie i trzymać się słów do świtu."
 latria_sexual_frustration_flavor.1413.c: "Czytać fragment wolno i pozwolić sensowi wrócić."

 latria_sexual_frustration_flavor.1414.t: "Jazda nie pomaga"
 latria_sexual_frustration_flavor.1414.desc: "Jesteśmy w siodle od przed świtem, a jelenie wciąż są przed nami. Dłonie mam pewne na wodzach. To jest cały kłopot. Wszystko inne we mnie nie jest pewne i nie jest od dni, a jazda tylko to rozluźniła.\n\nWciąż mam przed oczami tę osobę z ostatniego polowania, roześmianą, z włosami mokrymi od strumienia, i nie umiem odłożyć obrazu. Psy idą głosem. Popuszczam koniowi cugli, ziemia leci szybko, i przez kilka długości nie myślę o niczym zupełnie.\n\nPotem las się zamyka, tempo spada i wszystko wraca. Siedzę w siodle z piekącymi udami, paskiem rogu wbitym w znak na biodrze, i nie podnoszę go."
 latria_sexual_frustration_flavor.1414.a: "Wypaść z szeregu i jechać, aż myśl ze mnie wyjdzie."
 latria_sexual_frustration_flavor.1414.b: "Utrzymać szereg, wziąć róg i trzymać porządek polowania."
 latria_sexual_frustration_flavor.1414.c: "Czytać ziemię, którą wskazuje łowczy, i iść tropem."

 latria_sexual_frustration_flavor.1415.t: "Zaryglowane drzwi"
 latria_sexual_frustration_flavor.1415.desc: "Lampa jest nisko, drzwi zaryglowane, a osoba, której chcę od roku, jest tutaj, w mojej komnacie, bez ubrania, z dłonią płasko na mojej piersi. Dłoń jest ciepła przez tkaninę.\n\nPociągam to ciało na łóżko, ciężar jest prawdziwy, ciepło skóry, mały dźwięk przy uchu. Sznury łóżka skrzypią pod nami. Wyobrażam to sobie tak często, że sam fakt niemal mnie rozpina, zanim cokolwiek się stanie. Biodra idą w górę. Usta znajdują moje gardło, a ja przestaję liczyć własny oddech.\n\nPotem lampa wciąż się pali, długa nić wosku spłynęła po lichtarzu. Włosy tej osoby są rozłożone na moim ramieniu i żadne z nas nie mówi słowa o poranku."
 latria_sexual_frustration_flavor.1415.a: "Zatrzymać tę osobę tutaj i pozwolić domownikom mówić, jeśli muszą."
 latria_sexual_frustration_flavor.1415.b: "Odesłać tę osobę do własnej izby i położyć się samemu."
 latria_sexual_frustration_flavor.1415.c: "Sięgnąć po księgę i czytać, aż dłonie będą ciche."

 latria_sexual_frustration_flavor.1416.t: "Przegub przez stół"
 latria_sexual_frustration_flavor.1416.desc: "Rada się przeciąga, a ja nic nie podpisuję. Pieczęć leży zimna obok atramentu. Ogień pozwolono zgasnąć i nikt nie wołał o drewno. Skryba czyta następną linijkę, a ja słyszę kształt słów bez sensu, bo osoba przez stół ma rękaw odsunięty i patrzę na przegub.\n\nOsoba, której się zwierzam, łapie moje spojrzenie. Zmuszę się do poproszenia o powtórzenie klauzuli. Zostaje powtórzona. Nie rozumiem z niej nic. Pod stołem kolano zaczęło się poruszać, a ja przyciskam je dłonią do bezruchu.\n\nKiedy panowie wstają, zostaję na siedząco, aż izba opustoszeje. Osoba, której się zwierzam, czeka przy drzwiach z papierami, nic nie mówi, a ja jestem wdzięczny i nie patrzę w tę stronę."
 latria_sexual_frustration_flavor.1416.a: "Odprawić radę i wziąć popołudnie dla siebie."
 latria_sexual_frustration_flavor.1416.b: "Zostać na miejscu, wziąć papiery i wyznać to tej osobie."
 latria_sexual_frustration_flavor.1416.c: "Zwołać skrybę z powrotem i rozstrzygnąć każdą klauzulę, zanim wstanę."

 latria_sexual_frustration_flavor.1417.t: "To samo pytanie dwa razy"
 latria_sexual_frustration_flavor.1417.desc: "Świątynia jest pusta, a osoba, która mnie prowadzi, wciąż tu jest, porządkuje zwoje, i nie wychodzę, bo nie umiem zmusić się do wyjścia. Zadaję pytanie o obrzęd, a potem drugie, i oba są tym samym pytaniem w innych szatach.\n\nOsoba, która mnie prowadzi, odpowiada cierpliwie. Zwoje pachną kurzem i olejkiem cedrowym. Patrzę na dłonie poruszające się między nimi i myślę o godzinie nocy, o tym, jak daleko jest do pewnych drzwi i czy ktoś by jeszcze nie spał. Lampa między nami jest jedynym, co trzyma mnie na miejscu.\n\nOsoba, która mnie prowadzi, kładzie przede mną zwój i czeka. Kolana zesztywniały mi na zimnym stopniu. Kładę dłoń na zwoju i czytam pierwsze słowo, a drugiego nie."
 latria_sexual_frustration_flavor.1417.a: "Podziękować, wyjść i pójść do tamtych drzwi."
 latria_sexual_frustration_flavor.1417.b: "Poprosić o przejście obrzędu jeszcze raz, wolno."
 latria_sexual_frustration_flavor.1417.c: "Rozwinąć zwój i słuchać tego, co ta osoba mówi."

 latria_sexual_frustration_flavor.1418.t: "Imię w ogrodzie"
 latria_sexual_frustration_flavor.1418.desc: "Ogród jest pełen ludzi, a ja mam w sobie dość wina, by być szczerym. Puchar napełniano mi dwa razy, choć nie proszę. Mówię to na głos. Nie całość, ale tę część z imieniem, i imię nie jest imieniem obcego.\n\nŚmiech obchodzi grupę, ktoś to powtarza, a ktoś inny patrzy na mnie z nowym zainteresowaniem. Żwir pokazuje, gdzie krąg się przesunął. Trzeba było pozwolić temu przejść jako winu. Zamiast tego mówię więcej, a krąg cichnie tak, jak krąg cichnie, gdy postanowił zapamiętać.\n\nSługa idzie ścieżką z tacą. Biorę puchar, którego nie chcę, i trzymam go przy ustach, żeby nie wypełnić ciszy."
 latria_sexual_frustration_flavor.1418.a: "Powiedzieć imię jeszcze raz, wyraźnie, przed nimi wszystkimi."
 latria_sexual_frustration_flavor.1418.b: "Ukłonić się, pożegnać i opuścić ogród."
 latria_sexual_frustration_flavor.1418.c: "Odciągnąć najbliższego gościa na bok i mówić o czymś innym."

 latria_sexual_frustration_flavor.1419.t: "Od korytarza"
 latria_sexual_frustration_flavor.1419.desc: "Drzwi są zaryglowane, okrycie odrzucone, i nie zamierzam dłużej udawać, że jestem zbyt zmęczony. Ciało jest takie od popołudnia, od dłoni na ramieniu w korytarzu, i nie ułożyło się.\n\nKładę na sobie palce, a oddech wychodzi ze mnie tak, że nie chciałbym, by to słyszano. Myślę o korytarzu, o płótnie tamtego rękawa, o dokładnym nacisku palców. Plecy wyginają się nad łóżkiem. Muszę położyć drugą dłoń na ustach.\n\nTo trwa długo i zostawia mnie drżącym. Lampa wciąż się pali. Leżę z ramieniem przez oczy, z prześcieradłami skręconymi do pasa, wciąż pachnącymi dziennym ciepłem, a tęsknota nie odeszła, tylko ucichła."
 latria_sexual_frustration_flavor.1419.a: "Pozwolić temu iść swoim biegiem i przestać udawać zmęczenie."
 latria_sexual_frustration_flavor.1419.b: "Zacisnąć dłonie, oddychać wolno i czekać, aż drżenie przejdzie."
 latria_sexual_frustration_flavor.1419.c: "Czytać stronę przy lampie, aż ciało ucichnie."

 latria_sexual_frustration_flavor.1420.t: "Dwa dni w siodle"
 latria_sexual_frustration_flavor.1420.desc: "Dwa dni w siodle, a step ciągnie się bez końca. Siodło wytarło mi ranę pod kolanem. Koń zna tempo lepiej niż ja. Nie śpię porządnie, odkąd opuściliśmy obóz, i to nie ziemia, na której leżę, nie daje mi spać.\n\nMyślę o tej osobie, która zaplata włosy przy ogniu, o sposobie, w jaki przygryza koniec nitki. Wiatr jest zimny, dłonie mam popękane, a myśl wciąż wraca i układa się nisko we mnie, natrętna jak drugie bicie serca.\n\nWychodzimy na wzniesienie, a trawa schodzi do rzeki, bladej linii bez dźwięku. Mógłbym zawrócić sam. Koń przestępuje pode mną, czeka, a ja siedzę z luźnymi wodzami i nie zawracam."
 latria_sexual_frustration_flavor.1420.a: "Zawrócić do obozu i wziąć to, co noc oferuje."
 latria_sexual_frustration_flavor.1420.b: "Jechać dalej z innymi i trzymać tempo."
 latria_sexual_frustration_flavor.1420.c: "Zerwać sokoła i iść za jego lotem do wody."

 latria_sexual_frustration_flavor.1421.t: "Poza ostrożnością"
 latria_sexual_frustration_flavor.1421.desc: "Uczta przeciągnęła się poza punkt, w którym ktokolwiek jest ostrożny. Patrzę na tę osobę cały wieczór, ani razu nie odwracam wzroku, i właśnie to mówię, izbie, głosem, który niósł.\n\nPuchar się przewraca. Muzykanci nie zaczęli znowu. Ktoś się śmieje, ktoś woła o nich, a ja jestem na nogach, słowa wciąż idą. Nazywam godzinę, której chcę, i miejsce, a izba to słyszała. Nie ma takiej wersji jutra, w której to jest tylko żart.\n\nSąsiad ciągnie mnie za rękaw. Siadam, bo nogi zrobiły się niepewne, wosk spłynął przez stół do rękawa, puchar jest włożony z powrotem w dłoń, a ja wciąż patrzę przez stół."
 latria_sexual_frustration_flavor.1421.a: "Powiedzieć godzinę i miejsce jeszcze raz, żeby nikt nie przesłyszał."
 latria_sexual_frustration_flavor.1421.b: "Usiąść, pić i pozwolić hałasowi zamknąć się nad tym, co powiedziane."
 latria_sexual_frustration_flavor.1421.c: "Odwrócić się do sąsiada i zapytać o jego własny dom."
 latria_sexual_frustration_flavor.1421.d: "Włożyć to wszystko w wiersz dla stołu."

 latria_sexual_frustration_flavor.1422.t: "Trzy noce czuwania"
 latria_sexual_frustration_flavor.1422.desc: "Trzymam czuwanie trzy noce z rzędu, a post zrobił mi lekkość w głowie. Chłód wszedł w drobne kości stóp. Słowa oficjum są w moich ustach, a osoba w mojej myśli, i te dwie rzeczy splątały się tak, że nie da się ich rozdzielić.\n\nWiem, czego żąda ślub. Wypowiadam go chętnie i nie wypowiadam niechętnie aż do dzisiejszej nocy. Dłonie mam zimne, a żołądek zapomniał, czym jest chleb. Kamień pod kolanami wytarł gładkie miejsce, a ja wchodzę w nie, jakbym klęczy tu od lat, co w tym, co się liczy, jest prawdą.\n\nGdzieś w ciemności brat kaszle, a ktoś przesuwa się na ławie za filarem. Schylam głowę niżej, a modlitwa toczy się dalej bez mojego głosu."
 latria_sexual_frustration_flavor.1422.a: "Zerwać post, opuścić czuwanie i przyznać, czego chcę."
 latria_sexual_frustration_flavor.1422.b: "Trzymać post i trzymać ślub przez resztę nocy."
 latria_sexual_frustration_flavor.1422.c: "Wrócić do fragmentu o duszy i przeczytać go do końca."

 latria_sexual_frustration_flavor.1423.t: "Błędna liczba"
 latria_sexual_frustration_flavor.1423.desc: "Rachunki się nie zgadzają, a tę samą kolumnę czytam cztery razy. Świeca jest nowa, wosk jeszcze nie spłynął. Po drugiej stronie komnaty ktoś dyktuje skrybie, a głos jest taki, który poznaję w tłumie, i myśl opuściła kolumnę zupełnie.\n\nKładę palec na stronie, żeby przytrzymać miejsce. Nie trzyma. Pióro skryby wciąż się porusza. Czuję własny puls w gardle, co jest niedorzeczne, izba jest zimna, a mnie nie jest zimno.\n\nKiedy dyktowanie się kończy, podnoszę wzrok zbyt szybko. Skryba czeka. Proszę o liczbę jeszcze raz i zapisuję błędną, atrament na niej schnie, a ja nie poprawiam, aż komnata opustoszeje."
 latria_sexual_frustration_flavor.1423.a: "Odłożyć rachunki i pójść tam, dokąd idzie głos."
 latria_sexual_frustration_flavor.1423.b: "Trzymać się kolumny, aż każda liczba będzie dobra."
 latria_sexual_frustration_flavor.1423.c: "Posłać po księgę i sprawdzić każdy wpis od pierwszego."

 latria_sexual_frustration_flavor.1424.t: "Nietknięte wino"
 latria_sexual_frustration_flavor.1424.desc: "Drzwi są zaryglowane, wino nietknięte, a osoba, której chcę, jest tutaj z otwartą szatą i dłońmi na mojej twarzy. Dłonie są z początku zimne, a potem nie.\n\nPociągam to ciało na siebie, a całość jest cieplejsza i bardziej niezręczna niż wszystko, co sobie wyobrażam. Kolano znajduje łóżko, rama stuka raz o ścianę. Dłoń idzie na plecy i niżej, a dźwięk, który się rozlega, nie jest cichy, i nie dbam, kto to słyszy. Trzęsę się od tego, jak długo czekam.\n\nPóźniej lampa się wypaliła, a wino w pucharze zagrzało się. Głowa tej osoby jest na moim ramieniu, ramię pod nią zdrętwiało, a ja słucham oddechu."
 latria_sexual_frustration_flavor.1424.a: "Powiedzieć wprost, ile kosztował mnie rok czekania."
 latria_sexual_frustration_flavor.1424.b: "Cofnąć się, poprawić szatę i trzymać dłonie przy sobie."
 latria_sexual_frustration_flavor.1424.c: "Leżeć bez ruchu i czytać przy niskiej lampie, aż przyjdzie sen."

 latria_sexual_frustration_flavor.1425.t: "Pilne dłonie"
 latria_sexual_frustration_flavor.1425.desc: "Jestem trzy dni w lesie, polowanie jest dobre, a nic z tego nie tknęło tej rzeczy we mnie. Jestem pilny. Wstaję przed innymi, pilnuję wysuszenia sprzętu, biorę linię, którą wyznacza mi łowczy. Dłonie robią to, co im się każe.\n\nReszta mnie jest gdzie indziej. Pamiętam pewne popołudnie, próg, osobę wymawiającą moje imię w sposób, którego nie umiem zapomnieć, i wspomnienie przychodzi, gdy stoję w strzemionach, i znowu, gdy patroszę zwierzynę, z zapachem skóry na dłoniach.\n\nOgień jest niski, a żar tyka, stygnąc. Ramiona bolą mnie od dnia, a ja leżę na plecach z otwartymi oczami, słuchając, jak konie przestępują."
 latria_sexual_frustration_flavor.1425.a: "Opuścić linię i wyprowadzić deresza w ciemność."
 latria_sexual_frustration_flavor.1425.b: "Oddychać, zaciągnąć popręg i dokończyć pracę dnia."
 latria_sexual_frustration_flavor.1425.c: "Dopilnować wysuszenia sprzętu i rachunku przed snem."

 latria_sexual_frustration_flavor.1426.t: "Strona i pół"
 latria_sexual_frustration_flavor.1426.desc: "Gabinet jest cichy, osoba, która mnie prowadzi, rozłożyła tekst, a ja czytam półtorej strony, nie biorąc ani słowa. Kciuk zostawił znak na marginesie. Lampa jest dobra. Noc jest długa. Nie ma miejsca, w którym jestem oczekiwany.\n\nWciąż myślę o godzinie, gdy domownicy śpią, a korytarz jest pusty. Osoba, która mnie prowadzi, przewraca stronę i pyta, czy nadążam za wywodem. Mówię, że tak. Nie nadążam od pierwszej linijki o naturze duszy, co jest szkoda, bo to jest linijka, której najbardziej potrzebuję.\n\nOsoba, która mnie prowadzi, czeka z piórem w dłoni, a krzesło ma złączenie, które skarży się, gdy się poruszam. Patrzę na stronę, a własna dłoń leży płasko na drewnie, bardzo spokojnie, jakby należała do kogoś spokojniejszego."
 latria_sexual_frustration_flavor.1426.a: "Zamknąć księgę i wyjść, póki korytarz jest pusty."
 latria_sexual_frustration_flavor.1426.b: "Zostać na miejscu i przeczytać stronę od góry."
 latria_sexual_frustration_flavor.1426.c: "Poprosić o powtórzenie wywodu jeszcze raz."

 latria_sexual_frustration_flavor.1427.t: "Szczodry z winem"
 latria_sexual_frustration_flavor.1427.desc: "Jestem szczodry z winem, a towarzystwo odwzajemnia szczodrość, i gdzieś w tym mówię stołowi, czego chcę. Nie wprost. Dość wprost. Jest tu osoba, której imię powiedziałem, a na której twarz nie patrzę, gdy to mówię.\n\nKtoś przestał się śmiać, a pies pod ławą czymś się zajmuje. Puchar mam pusty, sługa go napełnia, a ja pozwalam. Izba ma bezruch ludzi, którzy decydują, co zrobić z rzeczą, którą im podano.\n\nMiejsce siostry jest dziś puste, a jej puchar wciąż tam, gdzie postawił go sługa, co jest łaską, na którą nie zasługuję. Kładę obie dłonie na stole, drewno jest chłodne, a muzyka zaczyna się znowu w drugim końcu sali."
 latria_sexual_frustration_flavor.1427.a: "Powiedzieć to jeszcze raz, z imieniem, i pozwolić rodzinie słyszeć."
 latria_sexual_frustration_flavor.1427.b: "Podziękować towarzystwu, wziąć płaszcz i pójść."
 latria_sexual_frustration_flavor.1427.c: "Napełnić puchary wkoło i skierować rozmowę na żniwa."
 latria_sexual_frustration_flavor.1427.d: "Rzucić żart za żart z najgłośniejszym gościem, aż izba pójdzie dalej."

 latria_sexual_frustration_flavor.1428.t: "Ikony patrzą"
 latria_sexual_frustration_flavor.1428.desc: "Świątynia jest zimna, ikony patrzą wszystkie, a ja od godziny się nie poruszam. Kolana mi zdrętwiały. Pragnienie nie. Siedzi we mnie jak węgiel, którego nie da się przykryć. Dym świecy idzie prosto w górę, bez przeciągu.\n\nModlę się o uwolnienie i modlę się o siłę, i jestem tu dość szczery, by wiedzieć, które z nich chcę usłyszeć. Twarz tej osoby wchodzi między mnie a złoto. Nie odpycham jej. Lampa pachnie oliwą, marmur jest zimny, a ciało nie jest zainteresowane ani jednym, ani drugim.\n\nKroki kapłana mijają za mną. Trzymam głowę spuszczoną i dłonie razem, kolana zostawiają dwa wilgotne ślady na kamieniu, a myśl na progu po drugiej stronie miasta."
 latria_sexual_frustration_flavor.1428.a: "Wstać, przejść miasto i pozwolić ikonom trzymać wartę."
 latria_sexual_frustration_flavor.1428.b: "Trzymać ślub i zostać na marmurze do końca oficjum."
 latria_sexual_frustration_flavor.1428.c: "Otworzyć księgę na psalmach i czytać, aż słowa utrzymają."

 latria_sexual_frustration_flavor.1429.t: "Mur w środku lata"
 latria_sexual_frustration_flavor.1429.desc: "Ogród o tej godzinie nie należy do nikogo, a ja jestem w nim, bo łóżko jest gorsze. Noc jest ciepła. Żwirowa ścieżka trzyma ciepło dnia. Gdzieś płynie fontanna, jedyny głos w ogrodzie, a zapach ziół jest dość mocny, by poczuć go w smaku.\n\nNie śpię od dwóch nocy. Idę ścieżką, żwir jest głośny, a każdy zakręt przynosi mnie z powrotem do tego samego muru, tego, przy którym stoi ta osoba w środku lata, nic nie mówiąc, oboje wiedząc.\n\nDłoń mam na kamieniu. Jest wciąż ciepły. Ćma wraca do lampy za mną. Stoję tam z czołem blisko muru i z oddechem idącym źle, a fontanna płynie dalej."
 latria_sexual_frustration_flavor.1429.a: "Wyjść przez bramę i powiedzieć to nocy."
 latria_sexual_frustration_flavor.1429.b: "Trzymać ślub, zdjąć dłoń z muru i wejść."
 latria_sexual_frustration_flavor.1429.c: "Iść ścieżką, aż niebo zszarzeje, a nogi się zmęczą."

 latria_sexual_frustration_flavor.1430.t: "Struny są zimne"
 latria_sexual_frustration_flavor.1430.desc: "Wyjmuję instrument, bo dom śpi, a ja nie mogę dłużej tam leżeć. Struny są zimne, a plektron wytarty cienko z jednej strony. Gram to, co gram zawsze, i to nie wystarcza, nie wystarcza od tygodnia.\n\nPalce znają wzór, a cała reszta mnie jest zupełnie gdzie indziej, w izbie z wciąż zamkniętymi okiennicami, w popołudnie, do którego wciąż wracam. Nuty wychodzą w ciemność i nikt ich nie słyszy.\n\nPrzestaję z dłonią płasko na strunach, żeby zabić dźwięk. Cisza potem jest gorsza. Siedzę z instrumentem przez kolana, struny zwiotczały od chłodu, głowa odchylona na krześle, a okno szarzeje na krawędzi."
 latria_sexual_frustration_flavor.1430.a: "Zagrać to do końca, źle, aż cały dom usłyszy."
 latria_sexual_frustration_flavor.1430.b: "Odłożyć instrument i wysiedzieć resztę nocy."
 latria_sexual_frustration_flavor.1430.c: "Rozstawić planszę i grać obie strony, aż przyjdzie światło."

 latria_sexual_frustration_flavor.1431.t: "Szew w ciemności"
 latria_sexual_frustration_flavor.1431.desc: "Świeca skopciła godzinę temu, a ja nie podciągam okrycia. Koszula jest skręcona w pasie. Palce znalazły jej szew, a potem weszły pod spód, wolno, tak jak uczę się tego, gdy korytarze są ciche. Trzymam oczy zamknięte i wracam do zeszłego tygodnia, do wina nalewanego mi przez zarządcę, do rękawa, który muska przegub i zostaje o oddech za długo.\n\nOddech więźnie i stoi. Poruszam dłonią, a tęsknota zaciska się mocniej, niżej, węzeł ciągnięty z obu końców. Myślę o ustach przy uchu, o słowach, których nie dokończono. Płótno jest ciepłe i wilgotne pod dłonią.\n\nDeska skrzypi w przejściu. Dłoń nieruchomieje, potem zaczyna znowu, a ja pozwalam, i ciemność trzyma mój sekret jeszcze chwilę."
 latria_sexual_frustration_flavor.1431.a: "Dokończyć to w ciemności i przyznać się do głodu."
 latria_sexual_frustration_flavor.1431.b: "Cofnąć dłoń i leżeć sztywno, aż knot utonie."
 latria_sexual_frustration_flavor.1431.c: "Owinąć się okryciem i czekać, aż ból rozluźni."

 latria_sexual_frustration_flavor.1432.t: "Nieszpory niedokończone"
 latria_sexual_frustration_flavor.1432.desc: "Kaplica opustoszała, a ja klęczę w nocnej koszuli na zimnym kamieniu, z modlitwami cienkimi i błądzącymi. Kapłan, który słucha mnie ostatni, kładzie dłoń na mojej schylonej głowie i pozwala jej zostać, a ja od tamtej pory nie umiem zdjąć tego ciężaru. Dłonie przyciskają uda przez cienką tkaninę, a to przyciskanie nie jest modlitwą.\n\nPrzesuwam się na kolanach. Kamień jest wstrząsem przez płótno. Myślę o tej dłoni, o jej cieple, o tym, jak wchodzę w nią o odrobinę, zanim się przyłapię. Oddech rwie się w sklepionej ciszy, a ja naciskam mocniej, szukając i nie znajdując uwolnienia, o które przyszedłem prosić.\n\nSznur dzwonu wisi nade mną bez ruchu. Podnoszę twarz do ciemnego ołtarza i trzymam dłonie tam, gdzie są."
 latria_sexual_frustration_flavor.1432.a: "Pozwolić ciału mieć to, czego modlitwa mu odmówiła."
 latria_sexual_frustration_flavor.1432.b: "Złożyć dłonie i trzymać czuwanie do świtu."
 latria_sexual_frustration_flavor.1432.c: "Otworzyć księgę i czytać, aż słowa mnie ochłodzą."

 latria_sexual_frustration_flavor.1433.t: "Łoże z paproci"
 latria_sexual_frustration_flavor.1433.desc: "Polowanie rozsypało się o zmierzchu, a ja jestem sam w zielonej ciemności, koń skubie obok. Zsuwam się po omszałym pniu, ubranie do jazdy mam wilgotne od potu. Wspomnienie, które mnie tropi, to łowczy, który chwyta mnie w pasie, żeby mnie przenieść przez strumień: pierś twarda przy moich plecach, oddech przy szyi. Dłoń wsunęła się pod pas.\n\nNaciskam, a kora gryzie moje ramię. Myślę o ramionach, o sposobie, w jaki nie puszczają od razu. Oddech mi dymi w zimnym powietrzu. Tęsknota zwija się ciaśniej z każdym wolnym pociągnięciem, a las trzyma wokół mnie ciszę, liście kapią gdzieś poza wzrokiem.\n\nTrzaska gałązka. Dłoń zamiera. Koń podnosi głowę, a ja zostaję przy drzewie z pulsem głośnym w uszach."
 latria_sexual_frustration_flavor.1433.a: "Zdjąć z tego ostrość tutaj, przy drzewie."
 latria_sexual_frustration_flavor.1433.b: "Cofnąć dłoń i oddychać wolno, aż przejdzie."
 latria_sexual_frustration_flavor.1433.c: "Wstać i poprowadzić konia z powrotem między drzewami."

 latria_sexual_frustration_flavor.1434.t: "Liścik niewysłany"
 latria_sexual_frustration_flavor.1434.desc: "Ogień w gabinecie jest niski, a list leży na wpół zapisany pod moją dłonią, ten, którego nie wyślę. Czytam ostatnią linijkę, którą stawiam, uczciwą, zbyt uczciwą, a druga dłoń podpełzła do wiązań nogawic. Myślę o posłańcu, który stoi zbyt blisko nad tym samym biurkiem, czyta moją twarz zamiast mapy i uśmiecha się.\n\nRozluźniam wiązania. Oddech się skraca. Wracam do przechylenia tej głowy, do zaproszenia w nim, na które jestem zbyt ostrożny, by odpowiedzieć, a dłoń porusza się własną wolą, suche pióro w drugiej. Ogień tyka. Tęsknota się zbiera i nie da się jej wyrozumować do czegoś, co można odłożyć do akt.\n\nŚwieca chyla się w przeciągu. Zamykam oczy i pozwalam myśli dokończyć to, co poseł zaczął."
 latria_sexual_frustration_flavor.1434.a: "Zapisać prawdę i ulżyć bólowi, który zapaliła."
 latria_sexual_frustration_flavor.1434.b: "Zawiązać wiązania i wycofać się z chłodnym słowem."
 latria_sexual_frustration_flavor.1434.c: "Wziąć mapę i zważyć sprawę na zimno."

 latria_sexual_frustration_flavor.1435.t: "Po ostatnim pucharze"
 latria_sexual_frustration_flavor.1435.desc: "Uczta zrzedła do kilku kopcących świec, a gość naprzeciw wciąż tu jest. Pod stołem moje kolano ułożyło się przy tamtym i żadne z nas go nie odsuwa. Wino we mnie szumi. Myślę o tym, jak ta osoba śmieje się z mojego żartu i pochyla, dość blisko, że mogę obrócić usta tę niewielką odległość.\n\nWolna dłoń chwyta ławę. Chcę zamknąć tę odległość bardziej niż czegokolwiek od dawna, a tęsknota jest jasnym drutem naciągniętym od gardła do brzucha. Ta osoba patrzy na mnie nad brzegiem pucharu. Ostatni sługa odszedł. Sala pachnie wypalonym łojem i oddechem nas dwojga.\n\nKolano tej osoby odpowiada raz. Dłoń schodzi z ławy i znajduje krawędź rękawa, i żadne z nas się nie odzywa."
 latria_sexual_frustration_flavor.1435.a: "Pozwolić muzyce przykryć to, co zrobię dalej."
 latria_sexual_frustration_flavor.1435.b: "Schylić głowę i ułożyć tęsknotę w modlitwę."
 latria_sexual_frustration_flavor.1435.c: "Zaproponować grę i pozwolić planszy ochłodzić krew."

 latria_sexual_frustration_flavor.1436.t: "Mongolska noc"
 latria_sexual_frustration_flavor.1436.desc: "W gerze ciepło od ognia z nawozu, a wiatr szarpie filcem nad głową. Wracam z wielkiego polowania, krew wciąż we mnie stoi, i leżę teraz pod futrami, bez ubrania, z ciałem ledwo posłusznym. Myślę o tej osobie, która jechała przy mnie cały dzień, o warkoczu kołyszącym się na plecach, o tym, jak śmiała się przy ubiciu.\n\nOgień maluje ściany na czerwono. Dłoń znalazła drogę w dół po brzuchu, a ja jej nie cofam. Dym jest słodki, futra ciężkie, a tęsknota ma gorąco, którego te płomyki nie tykają. Wracam do ułożenia ramion tej osoby w siodle, do błysku zębów.\n\nWiatr na oddech cichnie. Dłoń się porusza, a ja pozwalam nocy wziąć to, co zapalił dzień."
 latria_sexual_frustration_flavor.1436.a: "Dać polowaniu drugi koniec, tu pod futrami."
 latria_sexual_frustration_flavor.1436.b: "Naciągnąć futra i opanować ciało samą wolą."
 latria_sexual_frustration_flavor.1436.c: "Wyjść na zimno i iść, aż krew ostygnie."

 latria_sexual_frustration_flavor.1437.t: "Dach w świetle księżyca"
 latria_sexual_frustration_flavor.1437.desc: "Dach jest ciepły pod moimi plecami, a jaśmin przelewa się przez attykę, ciężki od zapachu. Niżej pieśń nałożnicy przewleka się przez ciemność, a noc jest tak ciepła, że nocna koszula jest bardziej ozdobą niż okryciem. Składam z tęsknoty kasidę i dopasowuję ją do kształtu ust tej osoby.\n\nDłoń spoczywa na biodrze, a powściągliwość, którą trzymam cały wieczór, jest przetarta do jednej nitki. Księżyc jest bardzo jasny. Pieśń obraca się i obraca. Wracam do tego, jak ta osoba patrzyła na mnie nad winem, do zaproszenia, na które jeszcze nie odpowiadam, a oddech nie chce zwolnić.\n\nOstatni dźwięk gaśnie. Dłoń rozwiązuje supeł sukni, a noc jest dość ciepła, by na to pozwolić."
 latria_sexual_frustration_flavor.1437.a: "Odpowiedzieć na kasidę dłońmi i pozwolić dachowi to zatrzymać."
 latria_sexual_frustration_flavor.1437.b: "Zawiązać suknię i trzymać się krawędzi, której się trzymam."
 latria_sexual_frustration_flavor.1437.c: "Wziąć tom wierszy i pozwolić obcym słowom ochłodzić moje."

 latria_sexual_frustration_flavor.1438.t: "Ryt zjednoczenia"
 latria_sexual_frustration_flavor.1438.desc: "Najświętszy ryt mojej wiary nakazuje zjednoczenie ciała, a ja przychodzę do ołtarza, by go dopełnić. Świece stoją wysoko. Nocna koszula jest cienka przy chłodzie kamienia, a słowa rytu rozsupłują mnie ścieg po ściegu, aż pożądanie nie jest już winą, lecz sakramentem położonym na ołtarzowym płótnie.\n\nKlękam, a dłonie nie są pewne. Ryt nazywa tę tęsknotę świętą, a ciało odpowiada na to miano gorącem, którego nie da się wymodlić. Wracam do dłoni, które spotkają tu moje, do ślubu, który czyni to ciało świątynią.\n\nDzwon na ryt ma zaraz zabrzmieć. Wstaję mu naprzeciw i już jestem rozsupłany."
 latria_sexual_frustration_flavor.1438.a: "Dpełnić ryt i pozwolić zjednoczeniu stać się sakramentem."
 latria_sexual_frustration_flavor.1438.b: "Trwać w czuwaniu samemu i przywiązać tęsknotę do ołtarza."
 latria_sexual_frustration_flavor.1438.c: "Czytać ryt wolno i pozwolić jego sensowi mnie uzupełnić."

 latria_sexual_frustration_flavor.1439.t: "Ogród andaluzyjski"
 latria_sexual_frustration_flavor.1439.desc: "Północ w ogrodzie, a fontanna trzyma swój cichy dźwięk. Czytam tawq al-hamamę, gołębią poezję miłości, i wersy wydrążają mnie tęsknotą. Za murem jest osoba, której mi nie wolno, i dziś mur wydaje się rzeczą cienką i głupią.\n\nDrzewa pomarańczowe trzymają resztkę dziennego ciepła. Dłoń spoczęła mi na gardle, a tęsknota jest tuż przy krawędzi, o oddech od przelania. Wracam do twarzy tej osoby w świetle lampy, do gry spojrzeń i odmów, którą prowadzimy nad wodą.\n\nFontanna zacina się i wznawia. Dłoń drży i nie opada, a noc trzyma oddech razem ze mną."
 latria_sexual_frustration_flavor.1439.a: "Pozwolić tęsknocie się przelać i odpowiedzieć na grę tej osoby."
 latria_sexual_frustration_flavor.1439.b: "Wycofać się za grzecznym słowem i zostawić mur nienaruszony."
 latria_sexual_frustration_flavor.1439.c: "Siedzieć z przyjacielem przy fontannie i pozwolić rozmowie ochłodzić wers."

 latria_sexual_frustration_flavor.1440.t: "Post świętego"
 latria_sexual_frustration_flavor.1440.desc: "Zachowuję post świętego, a ciało stało się więzieniem, po którym krążę. Ślub jest przetarty jak stara tkanina i na zimnym kamieniu posadzki świątyni czuję samą krawędź jego złamania. Puls biegnie szybciej niż modlitwy.\n\nNocna koszula jest cienka, a kamień wysysa ciepło z kolan. Przyciskam dłonie płasko do płyt, a pęd krwi nie da się uciszyć zimnem. Wracam do dotyku, którego sobie odmawiam, do ciepła, którego zabrania mi ślub, i oddech idzie płytko.\n\nŚwieca przy głowie pali się prosto. Trzymam się krawędzi, a post i puls prowadzą wojnę w ciemności."
 latria_sexual_frustration_flavor.1440.a: "Przełamać milczenie i wyznać, jak cienki stał się ślub."
 latria_sexual_frustration_flavor.1440.b: "Przywrzeć do zimnego kamienia i zachować post przez noc."
 latria_sexual_frustration_flavor.1440.c: "Otworzyć modlitwy i pozwolić mądrzejszemu głosowi mnie zawrócić."
