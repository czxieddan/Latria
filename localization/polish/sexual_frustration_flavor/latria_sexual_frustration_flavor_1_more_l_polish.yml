l_polish:
 latria_sexual_frustration_flavor.1011.t: "Druga warta"
 latria_sexual_frustration_flavor.1011.desc: "Budzę się w drugiej warcie, a lampa wciąż się pali, oliwy zostało niewiele, na spodku zaschła brązowa obwódka. Nocna koszula skręciła mi się w pasie. W izbie jest tak zimno, że słyszę, jak okiennica stuka dwa razy i milknie.\n\nTo była dłoń na moim przegubie, trzy dni temu, w progu sali, i nie padło ani jedno słowo. Długość tego dotknięcia roztrząsam częściej niż rachunki. Skóra w tym miejscu jest już zwyczajna. Przyciskam do niej kciuk i czuję tylko własny puls.\n\nW kubku przy łóżku jest woda, już ciepła. Wypijam połowę i odstawiam. Okiennica znowu stuka. Leżę z otwartymi oczami i liczę belki, aż przyjdzie szarość."
 latria_sexual_frustration_flavor.1011.a: "Wstać, przyciąć knot i pozwolić myśli iść, dokąd chce."
 latria_sexual_frustration_flavor.1011.b: "Wypić wodę, odwrócić się do ściany i odłożyć to."
 latria_sexual_frustration_flavor.1011.c: "Wziąć księgę ze skrzyni i czytać, aż przyjdzie szarość."

 latria_sexual_frustration_flavor.1012.t: "Gruszka i mały nóż"
 latria_sexual_frustration_flavor.1012.desc: "Siedzę trzy stoły od podwyższenia, tam gdzie świece się kopcą, a wino leją cienkie. Naprzeciw, za dwoma kupcami i jednym skrybą, ktoś obiera gruszkę małym nożem i nie je jej. Skórka schodzi jednym długim zwojem.\n\nNa ostatniej uczcie przez cały czas jednej pieśni kolano tej osoby dotyka mojego kolana. Nie potrafię wmówić sobie, że to przypadek, i nie potrafię wmówić sobie, że nim nie jest.\n\nMuzykanci przechodzą na wolniejszą melodię. Nóż się zatrzymuje. Gruszka leży otwarta na talerzu, brązowieje w miejscu cięcia. Sługa pochyla się nad moim ramieniem z dzbanem, a ja wyciągam kubek, nie odwracając wzroku."
 latria_sexual_frustration_flavor.1012.a: "Powiedzieć to na głos i niech stół zrobi z tym, co chce."
 latria_sexual_frustration_flavor.1012.b: "Ukłonić się wcześnie i przełknąć resztę."
 latria_sexual_frustration_flavor.1012.c: "Odwrócić się do sąsiada i pozwolić muzyce to unieść."

 latria_sexual_frustration_flavor.1013.t: "Co zostawił sen"
 latria_sexual_frustration_flavor.1013.desc: "Budzę się z prześcieradłem na biodrach i bladym oknem, i przez chwilę izba nie jest moją izbą. Ktoś tu był. Na skraju łóżka leżał czyjś ciężar, a głos tuż przy moim uchu wymawiał moje imię, jakby to było pytanie.\n\nNie pamiętam twarzy. Pamiętam ciepło pleców przy mojej piersi, dłoń płasko na brzuchu, który wznosił się i opadał, i to, że nigdzie mi się nie spieszyło.\n\nPrześcieradło jest wilgotne tam, gdzie leżę. Siadam i stawiam stopy na zimnych deskach. Za oknem wóz turkocze w stronę targu. Sięgam po ubranie i łapię się na tym, że nasłuchuję drzwi."
 latria_sexual_frustration_flavor.1013.a: "Pozwolić ciału mieć swoje i zachować ciepło snu."
 latria_sexual_frustration_flavor.1013.b: "Wstać, ubrać się i wygładzić noc."
 latria_sexual_frustration_flavor.1013.c: "Siedzieć z podciągniętymi kolanami i czekać, aż okno zbieleje."

 latria_sexual_frustration_flavor.1014.t: "Lampa czuwania"
 latria_sexual_frustration_flavor.1014.desc: "Klękam o trzeciej godzinie z psałterzem otwartym na tej samej stronie, którą czytam już czwarty raz. Lampa czuwania rzuca na płyty mały czerwony krąg. Kolana mnie bolą. Chłód idzie w górę przez wełnę.\n\nGdzieś w krużganku zamykają się drzwi. Głos kapelana za moimi plecami płynie dalej, cierpliwy, a ja nie słyszę z niego nic. Myślę o ustach na moim gardle zeszłego lata i o tym, jak odwracam głowę i mimo wszystko pozwalam na to.\n\nWstążka psałterza zsunęła się na podłogę. Nie podnoszę jej. Kciuk trzyma miejsce, a czerwony krąg lampy drży, gdy oddycham. Kamień pod kolanami jest zimny."
 latria_sexual_frustration_flavor.1014.a: "Przyznać się do słabości i przyjąć pokutę jutro."
 latria_sexual_frustration_flavor.1014.b: "Klęczeć jeszcze godzinę i zacząć psalm od nowa."
 latria_sexual_frustration_flavor.1014.c: "Poprosić kapelana, by został i dokończył stronę."

 latria_sexual_frustration_flavor.1015.t: "Kołdra w nogach łóżka"
 latria_sexual_frustration_flavor.1015.desc: "Ogień spopielał, a ja wciąż nie śpię, kołdra skopana w nogi łóżka. Ciało mam ciepłe, ciężkie i świadome siebie, skóra na gardle i wzdłuż ud napięta i zarumieniona, a wilgoć we mnie nie ma nic wspólnego z pogodą.\n\nKładę dłoń nisko na brzuchu i nie poruszam nią. Dzisiejsza tęsknota nie ma twarzy. To tylko pulsowanie między udami, natarczywe, w rytmie ostatnich tyknięć ognia.\n\nMyślę o ustach, o dłoni, o ciężarze kogoś nade mną, a biodra przesuwają się same. Kołdra leży kupą na deskach. Wtulam twarz w poduszkę i oddycham, aż ból zelżeje, a on nie zelżeje."
 latria_sexual_frustration_flavor.1015.desc.lustful: "Żar wzbiera pod prześcieradłem i przestaję udawać, że to sprawa pogody. Wilgoć jest jawna, moja własna, a palce same znają drogę, choć ich tam nie posyłam.\n\nPozwalam im iść. Nie ma w tym dziś twarzy, jest tylko dłoń, która wciska mnie w materac, i kolano, które rozchyla moje, i pamiętam dokładnie tę siłę. Biodra unoszą się na spotkanie niczego. Dźwięk, który wydaję w pustej izbie, nie należy do tych, które znam.\n\nPotem leżę z otwartymi dłońmi, pierś wznosi się i opada, resztka tego wciąż porusza się w udach. Polano układa się w palenisku. Podciągam prześcieradło do pasa, a żar na twarzy zostaje."
 latria_sexual_frustration_flavor.1015.desc.chaste: "Budzę się w cieple, mam wilgotne uda, cofam dłoń i zaciskam ją na rąbku prześcieradła, jakby trzymanie tkaniny mogło utrzymać noc w miejscu.\n\nOdsuwam jutrznię słowo po słowie i gubię wątek na trzeciej linijce. Liczę belki i gubię rachunek. Ciało nie słucha. Trzyma to, do czego za dnia się nie przyznaję, i wciąż się dopomina.\n\nOkno z szarego robi się białe. Dzwon na jutrznię jeszcze nie bił. Podciągam kołdrę pod brodę, zamykam oczy i czekam, aż ciepło ze mnie wyjdzie. Wychodzi wolno."
 latria_sexual_frustration_flavor.1015.a: "Pozwolić dłoni robić swoje i spożytkować żar."
 latria_sexual_frustration_flavor.1015.b: "Zacisnąć dłonie na kołdrze i wytrzeć żar do końca."
 latria_sexual_frustration_flavor.1015.c: "Wstać, napić się i usiąść przy oknie."

 latria_sexual_frustration_flavor.1016.t: "Długa droga powrotna"
 latria_sexual_frustration_flavor.1016.desc: "Jadę na końcu, tam gdzie konie zwolniły, a światło przez liście idzie zielone i cienkie. Płaszcz mam ciężki od wilgoci. Gdzieś z przodu rogi wciąż pracują nad dalekim zboczem.\n\nNa ostatnim polowaniu przy strumieniu zrównuję się z tą osobą i pozwalamy innym jechać dalej. Rękaw jest przemoczony do łokcia. Ta osoba śmieje się z czegoś, co mówię, i śmiech zostaje ze mną przez całą drogę do domu, a droga do domu trwa dwa dni.\n\nKlacz opuszcza łeb, żeby pić. Woda rozbija jej odbicie. Siedzę i pozwalam jej pić, patrzę, jak kawałki wracają do siebie, a rogi odzywają się znowu, dalej."
 latria_sexual_frustration_flavor.1016.a: "Zostać o długość w tyle i pozwolić myśli jechać do domu ze mną."
 latria_sexual_frustration_flavor.1016.b: "Wbić pięty i trzymać myśli na zboczu."
 latria_sexual_frustration_flavor.1016.c: "Iść po śladach kopyt i połamanych gałązkach, by je odnaleźć."

 latria_sexual_frustration_flavor.1017.t: "Pieczęć i księga rachunkowa"
 latria_sexual_frustration_flavor.1017.desc: "Rada się rozeszła, świece są już tylko ogarkami. Mam księgę otwartą na rachunkach wełny i pieczęć wciąż w dłoni, wosk miękki od mojego uścisku.\n\nNie do rachunków wracam myślą. Do tego, jak pewna osoba stoi przy oknie przez całe posiedzenie, nic nie mówi, palec trzyma na zasuwie, i jak przez to izba wydaje się mniejsza.\n\nPrzyciskam pieczęć do rozkazu i podnoszę. Wosk przyjmuje znak czysto. Za oknem dziedziniec jest pusty, zasuwa nieruchoma. Czytam tę samą linijkę księgi dwa razy, a potem zamykam księgę."
 latria_sexual_frustration_flavor.1017.a: "Wezwać tę osobę jutro i powiedzieć wprost."
 latria_sexual_frustration_flavor.1017.b: "Oddać pieczęć skrybie i pójść spać."
 latria_sexual_frustration_flavor.1017.c: "Otworzyć księgę jeszcze raz i dokończyć stronę."

 latria_sexual_frustration_flavor.1018.t: "Księżyc nad planszą"
 latria_sexual_frustration_flavor.1018.desc: "Latarnie palą się wzdłuż ścieżki, księżyc stoi nad zachodnim murem, cienki i biały jak obierka. Wino w dzbanie zagrzało się. Naprzeciw, nad planszą, uczony trzyma biały kamień w dwóch palcach i nie stawia go.\n\nNa wiosennym oglądaniu siedzimy dość blisko, by rękawy się zetknęły, i słyszę cztery wersy o lampie, a przy ostatnim spojrzenie tej osoby pada na mnie. Ostatniego wersu nie zapominam.\n\nKamień w końcu opada, w złym rogu, potem śmiech i mój kubek znów pełny. Piję. Światło latarni przesuwa się po planszy. Nikt z nas nie wspomina wiersza."
 latria_sexual_frustration_flavor.1018.a: "Wziąć lampę i cztery wersy, i dodać cztery własne."
 latria_sexual_frustration_flavor.1018.b: "Unieść kubek w podzięce i skierować rozmowę na żniwa."
 latria_sexual_frustration_flavor.1018.c: "Położyć kamień i poprosić o naukę."

 latria_sexual_frustration_flavor.1019.t: "Powiedziane ogniowi"
 latria_sexual_frustration_flavor.1019.desc: "Ogień jest niski, a osoba, której się zwierzam, zajmuje drugie krzesło, dłonie owinięte wokół kubka, i czeka tak, jak zawsze czeka.\n\nWięc mówię. Nie wszystko, ale kształt tego: próg, dłoń na moim przegubie, noce od tamtej pory. Powiedziane na głos staje się mniejsze i gorsze. Osoba, której się zwierzam, nie odwraca wzroku i nie wypełnia ciszy.\n\nKubek w moich dłoniach wystygł. Jest polano do dołożenia i nie dokładam. Siedzimy w resztce ciepła, izba powoli ciemnieje, a ja wciąż trzymam kubek."
 latria_sexual_frustration_flavor.1019.a: "Mówić dalej i powiedzieć resztę."
 latria_sexual_frustration_flavor.1019.b: "Zatrzymać się tu i zachować resztę dla siebie."
 latria_sexual_frustration_flavor.1019.c: "Posiedzieć jeszcze chwilę i nic nie mówić."

 latria_sexual_frustration_flavor.1020.t: "Słowo pod sklepieniem"
 latria_sexual_frustration_flavor.1020.desc: "Sklepienie bierze mój głos i oddaje go podwojony. W nawie jest tuzin ludzi i każdy z nich słyszy, jak mówię to, czego nie mówię za dnia.\n\nOczy trzymam na płycie przed balustradą. Jest w niej odłamek w kształcie zęba. Kiedy kończę, ktoś za mną przenosi ciężar ciała, a kobieta przy drzwiach zaciąga zasłonę na twarz i nie opuszcza jej.\n\nKadzielnica się kołysze. Dym idzie w górę płasko po kamieniu. Zostaję, gdzie jestem, z otwartymi dłońmi na kolanach, aż zakrystian dotyka mojego ramienia."
 latria_sexual_frustration_flavor.1020.a: "Podnieść głowę i powiedzieć to, co zostało pominięte."
 latria_sexual_frustration_flavor.1020.b: "Trzymać głowę spuszczoną i odmówić psalmy pokutne do końca."
 latria_sexual_frustration_flavor.1020.c: "Czekać, aż nawa opustoszeje, i poprosić kapelana, by został."

 latria_sexual_frustration_flavor.1021.t: "Po deszczu"
 latria_sexual_frustration_flavor.1021.desc: "Deszcz trzyma nas w górnej izbie po drugiej warcie i żadne z nas nie proponuje zejścia.\n\nPamiętam kolejność rzeczy. Mokry płaszcz na deskach. Usta na moim obojczyku, potem niżej, bez pośpiechu, a moje palce trafiają na wiązania z tyłu karku. Lampa przykręcona, ale nie zgaszona. Kiedy usta wracają do pocałunku, czuję wino, uda mam śliskie, a ja unoszę biodra na spotkanie dłoni, która się tam układa.\n\nPotem deszcz trwa dalej. Włosy mam przyklejone do policzka. Na ramieniu jest znak, któremu nie przyglądam się za dnia."
 latria_sexual_frustration_flavor.1021.desc.female: "Deszcz trzyma nas w górnej izbie po drugiej warcie i żadne z nas nie proponuje zejścia.\n\nPamiętam kolejność rzeczy. Mokry płaszcz na deskach. Usta na moim obojczyku, potem niżej, bez pośpiechu, a moje palce pracują przy wiązaniach z tyłu karku. Lampa przykręcona, ale nie zgaszona. Dłoń zaciska się na mojej piersi, a ja już jestem wilgotna i unoszę biodra na spotkanie ręki, która układa się między moimi udami.\n\nPotem deszcz trwa dalej. Włosy mam przyklejone do policzka. Na ramieniu jest znak, któremu nie przyglądam się za dnia."
 latria_sexual_frustration_flavor.1021.desc.male: "Deszcz trzyma nas w górnej izbie po drugiej warcie i żadne z nas nie proponuje zejścia.\n\nPamiętam kolejność rzeczy. Mokry płaszcz na deskach. Usta na mojej piersi, potem niżej, bez pośpiechu, a moje dłonie trafiają na wiązania w pasie. Lampa mruga dwa razy i wytrzymuje. Tamto ciało opada na mnie, a ja trzymam biodra, twarde i spragnione, i tempo jest własne, wybrane. Końce włosów są mokre.\n\nPotem deszcz trwa dalej, spływa rynną nad oknem. Na ramieniu jest znak, któremu nie przyglądam się za dnia."
 latria_sexual_frustration_flavor.1021.a: "Spotkać tę osobę jutro jak zwykle i nic nie ukrywać."
 latria_sexual_frustration_flavor.1021.b: "Od tej pory unikać tej osoby i odłożyć tę noc."
 latria_sexual_frustration_flavor.1021.c: "Leżeć, słuchać deszczu i pamiętać o znaku."

 latria_sexual_frustration_flavor.1022.t: "Ścieżka za ziołami"
 latria_sexual_frustration_flavor.1022.desc: "Idę ścieżką za grządkami ziół, bo to jedyne miejsce, po którym domownicy nie chodzą po zmroku. Żwir jest zimny przez pantofle. Rozmaryn, a pod nim kwaśny zapach przekwitłej mięty.\n\nNa końcu, gdzie mur zakręca, jest ławka. Siedzimy tam wiosną, mówię coś głupiego i zostaje mi to darowane, zanim skończę. Zasuwa bramy wciąż jest opuszczona.\n\nKsiężyc jest za wieżą. Stoję przy ławce z dłonią na jej oparciu, tam gdzie farba wytarła się do drewna. Ćma pracuje przy latarni obok drzwi. Mięta porusza się lekko. Nie siadam."
 latria_sexual_frustration_flavor.1022.a: "Usiąść na ławce i pozwolić pulsowi przejść."
 latria_sexual_frustration_flavor.1022.b: "Wrócić do domu i zasunąć drzwi."
 latria_sexual_frustration_flavor.1022.c: "Przejść ścieżkę raz, a potem jeszcze raz."

 latria_sexual_frustration_flavor.1023.t: "Trzeci puchar"
 latria_sexual_frustration_flavor.1023.desc: "Przy trzecim pucharze sala jest już głośna i ciepła, a psy leżą pod ławami. Ktoś zaczął pieśń z niewłaściwą liczbą zwrotek i nikt nie poprawia.\n\nDłoń spoczywa na moim rękawie, gdy opowiadana jest historia, i zostaje tam przez całą historię, i znika, kiedy historia się kończy. Śmieję się w dobrym miejscu. Wino jest dziś bardzo dobre.\n\nMuzykanci biorą coś wolnego. Patrzę wzdłuż stołu, tam gdzie zbierają deseczki. Rękaw mam wciąż ciepły tam, gdzie była dłoń. Obracam puchar za brzeg i pozwalam słudze napełnić go znowu."
 latria_sexual_frustration_flavor.1023.a: "Unieść puchar i spojrzeć na tę osobę przez stół."
 latria_sexual_frustration_flavor.1023.b: "Powołać się na wino i pójść na górę spać."
 latria_sexual_frustration_flavor.1023.c: "Odezwać się do sąsiada i wysłuchać melodii do końca."

 latria_sexual_frustration_flavor.1024.t: "Woda różana i mur ogrodu"
 latria_sexual_frustration_flavor.1024.desc: "Wodę różaną wylano na owoce i cały stół nią pachnie. Pod murem słowik ciągnie i ciągnie, źle, i nikomu nie starcza serca, by go uciszyć.\n\nDwa razy pada pytanie o traktat i dwa razy odpowiadam niewłaściwą połową. Za drugim razem uśmiech chowa się w pucharze. Szafran z kciuka zszedł na brzeg naczynia. Lampa między nami ma pęknięte szkło.\n\nSłowik milknie. W ciszy słyszę wodę w kanale za murem. Biorę pusty już puchar i trzymam go, aż ktoś zauważy i napełni."
 latria_sexual_frustration_flavor.1024.a: "Pójść za tym, co zaczyna ta osoba, i przełożyć traktat na jutro."
 latria_sexual_frustration_flavor.1024.b: "Prosić o pozwolenie odejścia i wyjść do ogrodu."
 latria_sexual_frustration_flavor.1024.c: "Poprosić o dokończenie tej połowy wiersza."

 latria_sexual_frustration_flavor.1025.t: "Jastrząb na rękawicy"
 latria_sexual_frustration_flavor.1025.desc: "Jastrząb siedzi mi na rękawicy lepiej niż wiosną, bez kaptura, ciężar ułożony. Konie stoją uwiązane w brzezinie, a naganiacze odeszli z hałasem.\n\nRaz puszczamy ją razem na skraju wrzosowiska i nie mogę oderwać oczu od dłoni, które ją zrzucają, od tego, jak otwierają się w ostatniej chwili. Od tamtej pory myślę o tych dłoniach w niewygodnych godzinach.\n\nJastrząb się przesuwa, a ja podtrzymuję go dwoma palcami na rzemieniach. Wiatr idzie w górę zbocza, zimny i czysty. Oczy trzymam na drzewach, w które weszli naganiacze, a myśli nie na drzewach."
 latria_sexual_frustration_flavor.1025.a: "Oddać jastrzębia komuś innemu i odejść samemu."
 latria_sexual_frustration_flavor.1025.b: "Zerwać jastrzębia z rękawicy i pozwolić mu lecieć."
 latria_sexual_frustration_flavor.1025.c: "Puszczać go znowu, aż ramię rozboli."

 latria_sexual_frustration_flavor.1026.t: "Przewrócona strona"
 latria_sexual_frustration_flavor.1026.desc: "Lekcja skończona, a księga wciąż otwarta między nami na stronie przewróconej jednym suchym palcem kapelana. Deszcz o okiennice. Świeca wypaliła się i wygięła.\n\nNie idę za wywodem. Patrzę na palec, na atrament z jego boku, na rękaw odsunięty do łokcia. Wstyd przychodzi potem, zawsze, i nie przynosi nic dobrego.\n\nKapelan zamyka księgę i pyta, czy rozumiem. Mówię, że tak. Deszcz trwa o okiennice. Trzymam dłoń płasko na okładce, żeby po nic nie sięgnęła."
 latria_sexual_frustration_flavor.1026.a: "Zanieść pytanie do kapelana jutro."
 latria_sexual_frustration_flavor.1026.b: "Poprosić kapelana, by powtórzył, i tym razem słuchać."
 latria_sexual_frustration_flavor.1026.c: "Przeczytać stronę jeszcze raz, tylko litery."

 latria_sexual_frustration_flavor.1027.t: "Co zostawił dzień"
 latria_sexual_frustration_flavor.1027.desc: "Ostatni petent wyszedł, a komnata pachnie mokrą wełną i łojem, którym nacierają ławy. Pieczęć mam ciepłą od dłoni. Dzisiejsze sprawy skończone, a ja wciąż tu siedzę.\n\nJest taki moment przy oknie, między dwoma mówcami, kiedy pada spojrzenie, które od tamtej pory noszę jak kamień w bucie. Nic nie powiedziano. Nic nie trzeba było mówić.\n\nSkryba przychodzi po pieczęć. Oddaję mu ją, palce mam spokojne. Wychodzi. Drzwi nie domykają się do końca. Siedzę i słucham, jak zasuwa się układa, i deszcz znowu zaczyna się o ołowiane rynny."
 latria_sexual_frustration_flavor.1027.a: "Odesłać izbę jutro i powiedzieć jedną rzecz."
 latria_sexual_frustration_flavor.1027.b: "Zamknąć okno i dokończyć papiery."
 latria_sexual_frustration_flavor.1027.c: "Przejść to, co zostało, arkusz po arkuszu."

 latria_sexual_frustration_flavor.1028.t: "Wstążka w szkatułce"
 latria_sexual_frustration_flavor.1028.desc: "Na półce stoi szkatułka, a w niej wstążka, która nie jest moja, zielona, przetarta w zgięciu. Wyjmuję ją, chowam i wyjmuję.\n\nNa jarmarku gubię wstążkę, ktoś znajduje ją w błocie i oddaje mi ją z ukłonem, o który nie proszę. Dłonie są zimne. Mówię dziękuję i nic więcej, i przez całą drogę do domu mam do siebie żal o to nic więcej.\n\nLampa jest nisko. Wstążka leży w poprzek dłoni, a zieleń w tym świetle jest prawie szara. Składam ją raz, potem drugi, i zgięcia się nie schodzą."
 latria_sexual_frustration_flavor.1028.a: "Zawiązać wstążkę na przegubie i spać."
 latria_sexual_frustration_flavor.1028.b: "Zamknąć szkatułkę na dnie skrzyni."
 latria_sexual_frustration_flavor.1028.c: "Wziąć papier i zapisać tę noc."

 latria_sexual_frustration_flavor.1029.t: "Ogień między wartami"
 latria_sexual_frustration_flavor.1029.desc: "Ogień zszedł do czerwonego oka, obóz śpi, tylko my dwoje i warty przy koniach. Płaszcz mam na kolanach. Miecz leży tam, gdzie mogę go dosięgnąć, z przyzwyczajzenia.\n\nOd jedenastu nocy dzielimy ogień i znam już dźwięk tamtego oddechu. Dziś ta osoba też nie śpi. Nikt z nas nie mówi nic o jutrzejszej drodze ani o gospodzie w ostatnim mieście, gdzie był jeden pokój i wzięliśmy go.\n\nWiatr kładzie płomienie płasko. Polano się układa. Dokładam drugie, iskry idą w górę, i iskry są jedynym, co porusza się w całym lesie."
 latria_sexual_frustration_flavor.1029.a: "Siedzieć przy ogniu i czekać na światło."
 latria_sexual_frustration_flavor.1029.b: "Dokarmiać ogień, trzymać wartę i nie patrzeć na tę osobę."
 latria_sexual_frustration_flavor.1029.c: "Zmienić się wartą i pójść na skraj lasu."

 latria_sexual_frustration_flavor.1030.t: "Sznur dzwonu"
 latria_sexual_frustration_flavor.1030.desc: "Sznur dzwonu jest szorstki w dłoniach, dzwon już bił, kościół jest pusty. Osoba, która mnie prowadzi, czeka przy drzwiach z kluczami, z cierpliwością kamienia.\n\nMyślę o ciele jako o rzeczy, którą trzeba zachować, i nie umiem utrzymać tej myśli. Wymyka się. Pod wełną jest mi ciepło i żywo, i mam w sobie puls, który nie ma nic wspólnego z modlitwą.\n\nPuszczam sznur. Kołysze się trochę i nieruchomieje. Klucze idą w górę. Idę nawą za tą osobą, a mój cień wyprzedza mnie po płytach, długi i cienki, i wychodzi przez drzwi."
 latria_sexual_frustration_flavor.1030.a: "Oddać noc ciału i załatwić to jutro."
 latria_sexual_frustration_flavor.1030.b: "Klęknąć i dokończyć nieszpory."
 latria_sexual_frustration_flavor.1030.c: "Zatrzymać tę osobę i usłyszeć jeszcze jeden fragment."

 latria_sexual_frustration_flavor.1031.t: "Wstążka na deskach"
 latria_sexual_frustration_flavor.1031.desc: "Ogień wypalił się do czerwonej kreski, a ja nie wołam o więcej drewna. Suknia jest luźna pod gardłem, w izbie dość ciepło, by tak to zostawić. Dwa dni temu, przy zsiadaniu, dłoń została na moich plecach dłużej, niż wymagało tego zejście z siodła.\n\nPamiętam ciężar tej dłoni, oddech, który poruszył się przy moim uchu, gdy koń przestąpił, niskie słowo, które nie całkiem było słowem. Własna ręka idzie tam, gdzie tamta przykryła. Skóra jest ciepła od ognia, a kiedy naciskam, ciepło jest tylko moje.\n\nWstążka zsunęła się z kolca łóżka na deski. Patrzę, jak leży w czerwonym świetle. Ogień się układa. Nie podnoszę jej."
 latria_sexual_frustration_flavor.1031.a: "Podnieść wstążkę i pozwolić myśli iść, dokąd chce."
 latria_sexual_frustration_flavor.1031.b: "Zawiązać wstążkę, zasypać ogień i spać."
 latria_sexual_frustration_flavor.1031.c: "Rozstawić planszę i rozegrać końcówkę samemu."

 latria_sexual_frustration_flavor.1032.t: "Ciężar dłoni"
 latria_sexual_frustration_flavor.1032.desc: "Kamień jest zimny przez kolana, a klęczę dość długo, by chłód stał się towarzystwem. Pod wełną ciało mam zbyt ciepłe i nie umiem powiedzieć, czy to piece, czy coś innego. W zeszłym tygodniu dłoń spoczęła na mojej głowie w błogosławieństwie i została po słowach.\n\nModlitwy wychodzą poprawnie. Odpowiedzi są poprawne. Zamiast nich wzbiera ciężar tej dłoni, oliwa na palcach, chwila, w której nikt z nas się nie poruszył, i kaszel zakrystiana w progu. Przyciskam czoło do kostek. Marmur nic nie oddaje.\n\nŚwieca przy bocznym ołtarzu wygina się, potem staje prosto. Zostaję, gdzie jestem. Chłód idzie w górę przez kolana, a ja mu pozwalam."
 latria_sexual_frustration_flavor.1032.a: "Wstać, znaleźć kapłana i powiedzieć to, co jest we mnie."
 latria_sexual_frustration_flavor.1032.b: "Trzymać czuwanie aż do dzwonu."
 latria_sexual_frustration_flavor.1032.c: "Chodzić po krużganku, aż nogi będą tak zimne jak kolana."

 latria_sexual_frustration_flavor.1033.t: "Drugi płaszcz"
 latria_sexual_frustration_flavor.1033.desc: "Ogień jest między nami, psy ucichły. Ktoś kładzie mi na ramiona drugi płaszcz, nie pytając, a wełna pachnie cudzym potem i dymem z drewna. Kolano tej osoby dotyka mojego. Nikt z nas go nie odsuwa.\n\nMogę wymienić trzy powody, żeby wstać: warta, płachta namiotu, która się nie domyka, chłód, który przyjdzie przed świtem. Zamiast tego zwracam twarz do płomieni i pozwalam ramieniu zostać tam, gdzie się ułożyło. Nasze oddechy wychodzą i cienieją w powietrzu między nami. Pod płaszczem dłoń znajduje szew własnego rękawa i trzyma go.\n\nGałąź wpada w ogień. Ta osoba się nie porusza. Ja się nie poruszam. Iskry idą w górę i w bok."
 latria_sexual_frustration_flavor.1033.a: "Zostać pod płaszczem, aż ogień będzie popiołem."
 latria_sexual_frustration_flavor.1033.b: "Podziękować za wełnę i pójść do namiotu."
 latria_sexual_frustration_flavor.1033.c: "Pytać o psy, aż zmieni się warta."

 latria_sexual_frustration_flavor.1034.t: "Trzecia klauzula"
 latria_sexual_frustration_flavor.1034.desc: "Traktat przepisano dwa razy i druga kopia jest błędna w trzeciej klauzuli. Czytam to cztery razy, a błąd wciąż tam jest. Kołnierz mam otwarty; piecyk rozgrzał izbę, a nie ma tu nikogo, kto by to widział.\n\nWracam myślą do przedsionka, do ust posła na wewnętrznej stronie mojego przegubu, a potem wyżej, i do tego, jak pozwalam temu trwać, gdy kroki notariusza zbliżają się i oddalają za drzwiami. Nie mówię nic, co można by zapisać. Druga strona mówi jeszcze mniej.\n\nŚwieca wygryzła z wosku półksiężyc. Biorę pióro, odkładam je i czytam trzecią klauzulę jeszcze raz. Słowa się nie zmieniły."
 latria_sexual_frustration_flavor.1034.a: "Wezwać posła i powiedzieć wprost, o czym myślę."
 latria_sexual_frustration_flavor.1034.b: "Przepisać klauzulę jeszcze raz i pójść do spowiedzi o pierwszym świetle."
 latria_sexual_frustration_flavor.1034.c: "Czytać psałterz, aż świeca zgaśnie."

 latria_sexual_frustration_flavor.1035.t: "Dwa obroty"
 latria_sexual_frustration_flavor.1035.desc: "Sala jest głośna, a wino poszło mi do głowy, niedaleko, tylko dość daleko. Suknia zsunęła się z ramienia, a ja się tym nie przejmuję. W ostatnim tańcu dłoń ułożyła się na moim pasie i została przez dwa obroty, a w izbie zbyt tłoczno, by się odsunąć.\n\nWciąż odnajduję przez jedwab cztery punkty tych palców. Własna dłoń idzie na ramię, w ciepłe miejsce, z którego zsunęła się tkanina. Muzyka jest już za muzykantami. I tak trzymam rytm.\n\nLampa nade mną kopci. Ktoś przy dalekim stole śmieje się z czegoś, czego nie słyszę. Ramię mam obnażone i tak zostawiam."
 latria_sexual_frustration_flavor.1035.a: "Kazać zagrać jeszcze jedną melodię i zatańczyć ją."
 latria_sexual_frustration_flavor.1035.b: "Poprawić suknię i odetchnąć chłodnym powietrzem przy oknie."
 latria_sexual_frustration_flavor.1035.c: "Siedzieć przy ogniu ze starym psem, aż sala opustoszeje."

 latria_sexual_frustration_flavor.1036.t: "Rzeka latarni"
 latria_sexual_frustration_flavor.1036.desc: "Ogród jest obwieszony latarniami, a cała rzeka w dole niesie ich więcej, wolny dryf światła ku ciemności. Trzymam jedwabną latarnię, którą ktoś wcisnął mi w bramie; z boku wypisano na niej zagadkę, a ja nie czytam jej po raz drugi. Tłum się przesuwa i dłoń obcej osoby muska moją, raz, i ginie w ciżbie.\n\nNie widzę twarzy. Widzę ramię, zamach rękawa, a potem tylko latarnie spływające w dół rzeki. Własna dłoń zaciska się na niczym. Zagadka pyta, co człowiek niesie, a co tym bardziej staje się ciężkie, im dalej się je niesie; odkrywam, że znam odpowiedź i nie chcę jej.\n\nTej nocy nie ma tu kogoś, kto powinien być. Stawiam latarnię na wodzie obok innych i patrzę, jak znajduje nurt. Światła gasną jedno po drugim za zakrętem. Stoję przy poręczy, aż zniknie ostatnie."
 latria_sexual_frustration_flavor.1036.a: "Kazać przynieść własną latarnię i wypisać na niej imię."
 latria_sexual_frustration_flavor.1036.b: "Podziękować ciżbie i wrócić cichą ścieżką."
 latria_sexual_frustration_flavor.1036.c: "Przeczytać zagadkę do końca i obracać ją w głowie."

 latria_sexual_frustration_flavor.1037.t: "Ciepło bez wstydu"
 latria_sexual_frustration_flavor.1037.desc: "Ryt się skończył i świątynia pustoszeje, ale klęczę jeszcze chwilę w poobrzędowym cieple. Nasza wiara nie uczy, że ciało jest długiem. Dziś słowa mówiły właśnie to, moja skóra zachowała ich ciepło i nie żałuję tego.\n\nWraca do mnie dotyk, dłoń na karku sprzed kilku dni, i tam, gdzie dawny głos nazwałby to plamą, jest teraz tylko błogosławieństwo. Pozwalam wspomnieniu zostać. Nie pali. Siedzi we mnie jak światło lampy, a oddech idzie wolno i równo.\n\nOstatnią świecę wynoszą obok mnie. Wstaję, kolana mam pewne, twarz chłodną. Czymkolwiek jestem, nie wstydzę się tego, a świątynia nie każe mi się wstydzić."
 latria_sexual_frustration_flavor.1037.a: "Wypowiedzieć błogosławieństwo na głos i pozwolić ciepłu zostać."
 latria_sexual_frustration_flavor.1037.b: "Ukłonić się ołtarzowi i wynieść spokój ze sobą."
 latria_sexual_frustration_flavor.1037.c: "Siedzieć jeszcze chwilę i wczytać się w słowa, które mnie uwolniły."

 latria_sexual_frustration_flavor.1038.t: "Życzenie w płomieniu"
 latria_sexual_frustration_flavor.1038.desc: "Na dziedzińcu wznosi się wysoko ognisko na przełom roku, cały dom przeskoczył go raz, w powietrzu szafran, sorbet stygnie w pucharach. Nad płomieniem wypowiadam życzenie i nie mówię go głośno. Po drugiej stronie ognia ktoś patrzy, jak je wypowiadam, i nie odwraca wzroku.\n\nTeraz uczta wniosła mnie do środka na winie i hałasie. Kołnierz mam luźny, w izbie jest ciepło. Wciąż czuję żar ognia na goleniach i ciężar tego spojrzenia, trzymanego o oddech dłużej, niż wolno obcemu. Obracam puchar i nie piję.\n\nOgnień jest już tylko czerwonym poblaskiem w drzwiach. Odkładam sorbet. Życzenie wciąż jest moje, niewykorzystane."
 latria_sexual_frustration_flavor.1038.a: "Odnaleźć tę osobę zza ognia i powiedzieć wprost."
 latria_sexual_frustration_flavor.1038.b: "Życzyć tej osobie dobrego roku i odejść."
 latria_sexual_frustration_flavor.1038.c: "Wyjść do przygaszonego ognia i przejść zimny ogród."

 latria_sexual_frustration_flavor.1039.t: "Długie spojrzenie"
 latria_sexual_frustration_flavor.1039.desc: "Naadam to trzy dni pyłu i hałasu, a kobyle mleko poszło mi do głowy bardziej, niż trzeba. Zapaśnicy wciąż walczą w stratowanej trawie, stękają, otrzepują pył z ud. Wiatr idzie z otwartego stepu i nic nie stoi między mną a niebem.\n\nW drugim biegu pewien jeździec przytrzymał spojrzenie na moje o uderzenie za długo i odtąd nie umiem tego odłożyć. Patrzę w następną kolejkę i nic z niej nie widzę. Pod kaftanem dłoń znajduje szew i trzyma się go. Trawa syczy, kładzie się i podnosi.\n\nPył osiada nad polem. Mleko jest ciepłe w bukłaku przy biodrze. Nie idę do namiotu, jeszcze nie."
 latria_sexual_frustration_flavor.1039.a: "Wyjechać po gonitwach i pozwolić wiatrowi to zabrać."
 latria_sexual_frustration_flavor.1039.b: "Podziękować zapaśnikom i położyć się na noc."
 latria_sexual_frustration_flavor.1039.c: "Siedzieć z jeźdźcami i gadać, aż światło odejdzie."

 latria_sexual_frustration_flavor.1040.t: "Wykroczenie"
 latria_sexual_frustration_flavor.1040.desc: "Ryt nazywa tę tęsknotę grzechem, a ja klękam na zimnym kamieniu, żeby się jej pozbyć. Zimno idzie w górę przez kolana i robi swoje, a tęsknota nie odchodzi. Leży pod modlitwami jak kamień pod nieruchomą wodą i każde słowo, które mówię, jest jej przekroczeniem.\n\nUsta, do których wracam, nie należą do nikogo, kogo umiem nazwać, są tylko ciepłem, bliskością, dłonią, która była i której nie ma. Przyciskam czoło do kostek i próbuję ułożyć spowiedź. Słowa nie przychodzą. Gardło się na nich zamyka, a świątynia nic nie oddaje.\n\nGdzieś za przepierzeniem porusza się brat i zastyga. Zostaję na kamieniu. Dzwon na oficjum jest blisko, spowiedź się nie odbyła, a ja nie wstaję."
 latria_sexual_frustration_flavor.1040.a: "Pójść do swojej izby i skończyć z tęsknotą."
 latria_sexual_frustration_flavor.1040.b: "Trwać w czuwaniu i pozwolić kamieniowi mnie mieć."
 latria_sexual_frustration_flavor.1040.c: "Leżeć w ciemności i pozwolić pociesze mnie znaleźć."
