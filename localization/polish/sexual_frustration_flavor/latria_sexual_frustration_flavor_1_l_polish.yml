l_polish:
 latria_sexual_frustration_flavor.1001.t: "Długa noc za zasłoną"
 latria_sexual_frustration_flavor.1001.desc.female: "Siedzę w nocnej koszuli przy oknie, z nieotwartym listem na kolanach. Przez szparę w zasłonie wpada blask księżyca i oświetla ślady palców na zgięciu papieru. Osoba, która go napisała, dawno odeszła. Wyciągam list z dna szkatułki, chowam go i znów wyciągam.\n\nWracam myślami do naszego ostatniego spotkania. Zdanie urwało się w połowie, jakby miało jeszcze paść dopowiedzenie, lecz najpierw odsunął się rękaw. Skinęłam tylko głową. Nie poprosiłam nawet o pozostanie. Teraz, w środku nocy, te niedokończone słowa pamiętam wyraźniej niż cały list.\n\nWiatr porusza zasłoną, papier cicho szeleści. Kładę palec na woskowej pieczęci. Ani jej nie łamię, ani nie odkładam listu do szkatułki."
 latria_sexual_frustration_flavor.1001.desc.male: "Siedzę w nocnej koszuli przy oknie, z nieotwartym listem na kolanach. Przez szparę w zasłonie wpada blask księżyca i oświetla znajome pismo na złożonym arkuszu. Osoba, która go napisała, odeszła dawno temu, a list przez cały ten czas leżał pod moją księgą rachunkową.\n\nPamiętam pożegnalne spojrzenie, jakby oczekiwało odpowiedzi. Miałem wtedy inne sprawy na głowie i powiedziałem tylko, że porozmawiamy innym razem. Nadszedł kolejny dzień, ale nie było już z kim rozmawiać. Tamto spojrzenie wciąż mam przed oczami.\n\nZa oknem rozlega się nocne wołanie straży. Odwracam list i obracam go z powrotem. Wosk pozostaje nienaruszony."
 latria_sexual_frustration_flavor.1001.desc: "Noc robi się późna, a do mnie znów wracają sprawy, których nigdy nie udało się doprowadzić do końca.\n\nPodnoszę list, oglądam pieczęć i odkładam go na kolana. W izbie nie ma nikogo poza mną; nawet trzask knota słychać wyraźnie. Próbuję zająć myśli jutrzejszymi obowiązkami, lecz za każdym razem wracają w to samo miejsce.\n\nZasłona lekko się porusza. List wciąż tu jest. Osoby, od której przyszedł, już nie ma."
 latria_sexual_frustration_flavor.1001.a: "Przeczytać do końca i pomyśleć o osobie, która go napisała."
 latria_sexual_frustration_flavor.1001.b: "Zamknąć list na klucz i stłumić tę myśl."
 latria_sexual_frustration_flavor.1001.c: "Wziąć czysty arkusz i ułożyć z tego wiersz."

 latria_sexual_frustration_flavor.1002.t: "Przyprawy na uczcie"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Woń przypraw zagłusza zapach wina. Muzykanci zaczynają trzecią melodię, a przy stołach wciąż rozmawia się z bliska. Tutaj nikogo taka poufałość nie razi; po chwili śmiechu goście dalej podają sobie puchary.\n\nPrzyglądam się każdemu spojrzeniu. Ktoś unosi puchar w moją stronę i odpowiadam tym samym, ale oczy nadal szukają twarzy, której wśród gości nie ma. Sąsiad opowiada żart. Śmieję się z odrobiną spóźnienia.\n\nGdy sługa dolewa wina, niemal zapominam o trzymanym pucharze. Dociera do mnie ciepły zapach przypraw, lecz nie wypełnia pustki, którą czuję."
 latria_sexual_frustration_flavor.1002.desc.strict: "Przyprawy ożywiają ucztę. Z każdym wybuchem śmiechu przypominam sobie, jak uważnie obyczaj strzeże przed najdrobniejszym uchybieniem. Gdy sąsiad pochyla się, żeby coś powiedzieć, odruchowo poprawiam chwyt na pucharze, jakby to mogło dodać mi powagi.\n\nKtoś zaczyna dawną opowieść, lecz urywa ją w połowie. Rozmowa zaraz schodzi na lenna i zbiory. Kiwam głową razem z innymi, ale wciąż nasłuchuję zakończenia tamtego zdania.\n\nSługa dolewa wina, a ja niemal zapominam o pucharze w dłoni. Dopiero gdy wino sięga krawędzi, odstawiam go na stół."
 latria_sexual_frustration_flavor.1002.desc: "Uczta jest głośna, lecz tę samą myśl wciąż trudno mi od siebie odsunąć.\n\nWokół mnie muzyka, puchary i rozmowy, a ja nie potrafię wysłuchać ani jednego zdania do końca. Sąsiad pyta, czy chcę jeszcze wina. Odpowiadam coś, nawet nie wiedząc, na co przystaję.\n\nDopiero gdy zmienia się melodia, spostrzegam, że przez cały czas patrzę na drzwi sali. Otworzyły się już dwukrotnie. Za żadnym razem nie weszła osoba, którą pragnę zobaczyć."
 latria_sexual_frustration_flavor.1002.a: "Dodać kilka czułych słów od siebie."
 latria_sexual_frustration_flavor.1002.b: "Opuścić wzrok, podziękować gospodarzowi i odejść."
 latria_sexual_frustration_flavor.1002.c: "Poprosić muzyków o jeszcze jedną melodię przed wyjściem."
 latria_sexual_frustration_flavor.1002.d: "Zebrać gości przy jednym stole i przegadać wieczór."

 latria_sexual_frustration_flavor.1003.t: "Kazanie w ogrodzie"
 latria_sexual_frustration_flavor.1003.desc.favors: "Kaznodzieja siedzi na kamiennej ławie w ogrodzie i mówi, że cielesne uciechy nie sprzeciwiają się naszej wierze. Wiatr podwija róg strony; przytrzymuje go palcem i spokojnie mówi dalej.\n\nTe słowa powinny przynieść mi ukojenie. Tymczasem słuchając, przypominam sobie zupełnie inną rozmowę: żart rzucony przed rozstaniem i spojrzenie, na które nie było z mojej strony odpowiedzi. Słowa świętej księgi mijają mnie, a tamto zdanie zostaje.\n\nKaznodzieja pyta, czy wszystko rozumiem. Kiwam głową, ale nie potrafię już znaleźć w księdze strony, od której zaczynaliśmy."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Kaznodzieja mówi o powściągliwości i czystości, wyraźnie wypowiadając każde zdanie. W ogrodzie jest cicho; nawet szelest liści zdaje się wyznaczać mu przerwy. Trzymam dłonie na kolanach i siedzę przykładnie, choć myśli wcale nie zajmuje księga.\n\nPrzypomina mi się ta część minionej nocy, kiedy sen nie chciał przyjść na dobre. Nikt się nie zjawił, nikt niczego nie powiedział. Dawne pragnienie wróciło samo. Wbijam wzrok w święty tekst, lecz słowa nie układają mi się w zdania.\n\nKaznodzieja przewraca stronę. Pochylam za nim głowę, nadal nie wiedząc, w którym miejscu skończył czytać."
 latria_sexual_frustration_flavor.1003.desc: "Słucham kazania w ogrodzie do końca. Wiatr przesuwa karty księgi, a moje myśli wciąż nie znajdują spokoju.\n\nKaznodzieja już wstał, żeby powitać innych. Ja nadal siedzę, przytrzymując palcem stronę, i patrzę na koniec kamiennej ścieżki. Nikogo tam nie ma. Mimo to jeszcze przez chwilę nie odwracam wzroku.\n\nKiedy wracam myślami do księgi, wiatr zdążył już przewrócić kilka kolejnych kart."
 latria_sexual_frustration_flavor.1003.a: "Zamknąć księgę i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1003.b: "Odsunąć te myśli i dołączyć do recytacji."
 latria_sexual_frustration_flavor.1003.c: "Poprosić kaznodzieję o wyjaśnienie każdego ustępu."

 latria_sexual_frustration_flavor.1004.t: "Niespokojny sokół"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Sokół bije skrzydłami na moim nadgarstku, śledząc wzrokiem odległe stado gołębi. Pęta na nogach nie dają mu spokoju, a przy każdym rozłożeniu skrzydeł czuję podmuch. Przytrzymuję go, lecz on nadal wpatruje się w otwartą przestrzeń.\n\nDobrze znam tę niecierpliwość. Myśliwi czekają pod lasem na moje słowo, koń też zaczyna przestępować z nogi na nogę. Mnie jednak zajmuje coś innego, tak bardzo, że zapominam o gwizdku w dłoni. Ta myśl nie ma jeszcze wyraźnego kształtu, ale nie chce mnie opuścić.\n\nSokół znów trzepocze. Dopiero teraz dostrzegam, jak mocno zaciskam rękę w rękawicy."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Sokół niespokojnie przestępuje na moim nadgarstku. Zmuszam się do słuchania odgłosów wodzy i gwizdów, do patrzenia wyłącznie w stronę lasu. Myśliwi zajęli już miejsca i czekają tylko na mój sygnał.\n\nMyśli trudniej poskromić niż ptaka. Liczę oddechy, uderzenia kopyt, liście na gałęziach, a pod koniec znów wracam do tej samej osoby. Nie ma jej na polowaniu. Wiem o tym, lecz nadal o niej myślę.\n\nSokół przekrzywia głowę, jakby czekał na polecenie, które potrafi zrozumieć. Przez chwilę nie umiem mu go dać."
 latria_sexual_frustration_flavor.1004.desc: "Myśliwi czekają, aż przywołam sokoła, a ja wciąż nie potrafię skupić się na polowaniu.\n\nKiedy wiatr w lesie cichnie, trzepot na moim nadgarstku staje się szczególnie wyraźny. Podnoszę rękę, po czym znów ją opuszczam. Układam usta do gwizdu, ale nie wydobywa się z nich żaden dźwięk.\n\nKtoś woła z oddali moje imię. Odpowiadam, choć wzrok nadal tkwi w pustej przestrzeni."
 latria_sexual_frustration_flavor.1004.a: "Niech towarzysze zaczekają, aż uporam się z myślami."
 latria_sexual_frustration_flavor.1004.b: "Zebrać myśli i uporządkować sprzęt łowiecki."
 latria_sexual_frustration_flavor.1004.c: "Powoli wygładzić pióra i znów spróbować przywołania."

 latria_sexual_frustration_flavor.1005.t: "Między posiedzeniami rady"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Możni opuścili salę, ale służba wciąż zbiera mapy i pieczęcie. Siedzę samotnie u szczytu długiego stołu. Przy niedokończonych dokumentach leży stary list, a w powietrzu nadal unosi się zapach tuszu do pieczęci.\n\nDopiero co spierano się tutaj o granice i podatki. Z mojej strony padały potakujące gesty i sprzeciwy, jakby nie umknęło mi ani słowo. Tymczasem przez pewien czas zajmował mnie wyłącznie róg listu wystający spod dokumentów.\n\nSługa pyta, czy uprzątnąć cały stół. Kładę dłoń na stosie papierów i nie odpowiadam od razu."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Towarzysze uzgodnili już, którym brodem przeprawimy się dalej, lecz mapa wciąż leży na stole. Przesuwam stary list pod lampę i znów nie mogę skupić się na spisie etapów podróży.\n\nNa zewnątrz ktoś porządkuje uprząż; metalowe sprzączki brzęczą o siebie. Trzeci raz przyglądam się odcinkowi drogi, który mam zatwierdzić, lecz pamiętam tylko dawną nazwę miejscowości z listu. Jutro nie będziemy tamtędy przejeżdżać.\n\nKtoś z towarzyszy czeka w drzwiach. Przykrywam list, ale nie zabieram z niego palców."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Narada się skończyła, a rachunki i święte księgi nadal leżą otwarte na stole. Wyciągam spomiędzy kart stary list. Znów odzywa się we mnie ten głos, który nie chce ucichnąć.\n\nZa dnia potrafię uporządkować ofiary, naprawy i obchody świąt. Gdy zostaję bez towarzystwa, wszystkie te liczby ustępują miejsca czemuś innemu. Księga odcisnęła ślad na papierze listu, rogi są postrzępione, lecz tamten wiersz rozpoznaję od razu.\n\nKtoś przechodzi krużgankiem. Wsuwam list z powrotem między karty, dokładnie w to samo miejsce."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Narada się skończyła, ale dokumenty i wosk do pieczęci wciąż piętrzą się na stole. Wygładzam rękaw. Leżący pod ręką stary list zajmuje mnie bardziej niż wszystkie raporty.\n\nNotatka pozostawiona przez pisarza jest zupełnie jasna. Podnoszę ją, lecz zanim doczytam pierwsze imię, wzrok już ucieka do listu. Nie powinno go być na tym stole. Trafił tu rano, włożony między papiery moją własną ręką.\n\nZa drzwiami czekają na kolejne polecenie. Każę im jeszcze zaczekać."
 latria_sexual_frustration_flavor.1005.desc: "Pracy mam pod dostatkiem, a jednak stary list wciąż nie pozwala mi się na niej skupić.\n\nUkładam papiery według wielkości, mieszam je i porządkuję ponownie. List za każdym razem zostaje na wierzchu. Oliwy w lampie ubywa, a na dokumentach nadal nie ma ani jednej mojej uwagi.\n\nKtoś cicho chrząka za drzwiami. Dopiero wtedy odsuwam rękę od listu."
 latria_sexual_frustration_flavor.1005.a: "Odłożyć pracę i jeszcze raz przeczytać stary list."
 latria_sexual_frustration_flavor.1005.b: "Schować list i wrócić do obowiązków."
 latria_sexual_frustration_flavor.1005.c: "Rozplanować pozostałe zajęcia i pozwolić sobie na krótki odpoczynek."
 latria_sexual_frustration_flavor.1005.d: "Uporządkować zadania i dopilnować wykonania każdego."

 latria_sexual_frustration_flavor.1006.t: "Stary list przy świecy"
 latria_sexual_frustration_flavor.1006.desc.female: "Siedzę w nocnej koszuli przy lampie, z palcem na zgięciu starego listu. Nie ma w nim żadnej obietnicy, tylko kilka zwyczajnych pozdrowień. Na końcu została jednak duża pusta przestrzeń, jakby pisanie nagle się urwało.\n\nDługo wpatruję się w to puste miejsce. Gdy dostałam list, nie przywiązywałam do niego większej wagi. Tej nocy niewypełniony fragment kartki ciąży mi bardziej niż zapisane słowa. Knot trzaska, cień podskakuje na papierze.\n\nRozwiązała mi się tasiemka koszuli, lecz jej nie poprawiam. List nadal leży otwarty. Do końca nocy daleko."
 latria_sexual_frustration_flavor.1006.desc.male: "Siedzę w nocnej koszuli przy łóżku. Pismo na starym liście przypomina mi uczucie, które nigdy nie doczekało się odpowiedzi. Papier zmiękł, a wzdłuż zgięć niemal się rozdziera. Mimo to rozprostowuję go ostrożnie.\n\nList opowiada o pogodzie w podróży i pewnej drobnej sprawie. Ja pamiętam przede wszystkim dzień, kiedy go przyniesiono: stałem w krużganku i chciałem jeszcze wybiec, ale ktoś mnie zatrzymał wołaniem. Później schowałem list do szkatułki. Osoba, od której przyszedł, już nie wróciła.\n\nKnot wypalił się jeszcze trochę. Obracam arkusz, lecz widzę wciąż te same słowa."
 latria_sexual_frustration_flavor.1006.desc: "Noc jest cicha, a słowa starego listu wciąż pozostają mi przed oczami.\n\nMiał to być tylko rzut oka przed snem. Gdy jednak zapalam lampę, tych kilka wierszy już mnie nie puszcza. Dochodzę do połowy i zaczynam od początku, jakby gdzieś pomiędzy słowami krył się sens, który dawniej mi umknął.\n\nPosłanie jest gotowe. Nadal siedzę, a na brzegu papieru pojawia się nowe zagniecenie od moich palców."
 latria_sexual_frustration_flavor.1006.a: "Przeczytać list do końca."
 latria_sexual_frustration_flavor.1006.b: "Schować list, zgasić świecę i ułożyć się do snu."

 latria_sexual_frustration_flavor.1007.t: "Nim skończy się uczta"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Wśród rozmów ktoś wspomina dawnego kochanka i nikt przy stole nie uważa tego za uchybienie. Puchary stykają się ze sobą, śmiech przechodzi dalej, jakby mowa była o pogodzie albo innej codziennej sprawie.\n\nPodnoszę puchar razem z innymi, lecz wzrok kilka razy wraca do pustego miejsca. Naczynia już stamtąd zabrano; została tylko wygładzona połać obrusa. Wiem, na kogo czekam. Wiem też, że tej nocy nikt taki nie przyjdzie.\n\nSąsiad pyta, czemu się przyglądam. Kręcę głową, zapominając napić się wina."
 latria_sexual_frustration_flavor.1007.desc.strict: "Przy stole ktoś przytacza potajemny romans ku przestrodze i rozmowa zaraz schodzi na dobre imię oraz obyczaje. Głos opowiadającego cichnie, lecz sąsiedzi nadal wszystko słyszą. Nawet śmieją się ostrożnie.\n\nOpuszczam wzrok, wygładzam rękaw i nie zabieram głosu. To przecież cudza historia, a jednak brzmi, jakby była wymierzona we mnie. Pod stołem obracam palcami stopkę pucharu, raz i drugi.\n\nTemat szybko się zmienia. Rękaw już leży gładko, lecz moje myśli nadal tkwią przy tamtej opowieści."
 latria_sexual_frustration_flavor.1007.desc: "Muzyka jeszcze nie ucichła, choć myślami od dawna jestem daleko od stołu.\n\nGoście podają sobie ostatnią kolejkę wina. Patrzę, jak poruszają ustami, lecz słyszę tylko własne zdanie, z którym nie mam się do kogo zwrócić. Ktoś wznosi toast w moją stronę. Podnoszę puchar i wino lekko się kołysze.\n\nMelodia dobiega końca. Wciąż siedzę, jakby jeszcze nie było pewne, czy w ogóle uczestniczę w tej uczcie."
 latria_sexual_frustration_flavor.1007.a: "Niech usłyszą o mojej tęsknocie, od samego początku."
 latria_sexual_frustration_flavor.1007.b: "Przełknąć słowa, podziękować gospodarzowi i odejść."
 latria_sexual_frustration_flavor.1007.c: "Zapytać sąsiada o podróże."

 latria_sexual_frustration_flavor.1008.t: "Modlitwa przed kapliczką"
 latria_sexual_frustration_flavor.1008.desc.favors: "Świeca przy świętej niszy jest bliska wypalenia. Przypominam sobie, że nasza wiara nie gardzi cielesnymi uciechami. Te słowa padały przy mnie wiele razy, ale teraz po raz pierwszy muszę chyba rozstrzygnąć, co z nimi począć.\n\nNa miedzianej podstawce zastygła warstwa wosku. Jestem w połowie modlitwy; usta nadal wypowiadają jej słowa, a myśli wracają do czyjejś dłoni i szelestu ubrania podczas zbliżania się. Wizerunek w niszy pozostaje nieruchomy. Tylko płomień drga.\n\nPróbuję przywołać myśli z powrotem. W połowie tej próby znów pozwalam im odejść."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Przed świętą niszą powtarzam po cichu ślub czystości, lecz znajoma modlitwa kilka razy urywa mi się na ustach. Pierwsze zdanie jest jeszcze całe. W drugim zaczyna brakować słów, a w lukę akurat mieści się natrętna myśl.\n\nNie odzywa się głośno. Przypomina tylko, że gdy dziś wrócę, łóżko wciąż będzie puste i nie znajdę przy sobie niczyjej dłoni poza własną. Odsuwam włosy z czoła i zaczynam jeszcze raz od pierwszego zdania.\n\nKnot trzaska. Mój głos urywa się razem z nim."
 latria_sexual_frustration_flavor.1008.desc: "Modlitwa już się skończyła, a ja nadal pozostaję przy świecy.\n\nWszystko, co należało wypowiedzieć, zostało wypowiedziane. Kolana trochę mi zdrętwiały, lecz nie wstaję. Płomień przygasa, potem z trudem się podnosi, jakby także czekał na zakończenie, które nie chce nadejść.\n\nPatrzę na ten drobny blask i wiem, że sprawa, która mnie dręczy, wcale nie odeszła. Tylko na czas modlitwy ustąpiła miejsca słowom."
 latria_sexual_frustration_flavor.1008.a: "Odłożyć ślub wstrzemięźliwości i przyznać się do tęsknoty."
 latria_sexual_frustration_flavor.1008.b: "Powściągnąć myśli i modlić się dalej."
 latria_sexual_frustration_flavor.1008.c: "Przeczytać ustęp i rozważyć go przed odejściem."
 latria_sexual_frustration_flavor.1008.d: "Podtrzymywać płomień i recytować do świtu."

 latria_sexual_frustration_flavor.1009.t: "Nieprzeczytana petycja"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Raporty leżą na długim stole, a możni czekają na moje słowo. Czytam ten sam wiersz dwukrotnie i nadal nie umiem zapamiętać drugiej liczby. Obracam pióro w palcach. Kropla atramentu spada na niezapisane miejsce.\n\nW ich spojrzeniach szacunek już ustępuje niepewności. Ktoś chrząka, ktoś idzie nalać wody; nikt nie ośmiela się odezwać pierwszy. Wiem, że pora wydać rozstrzygnięcie, lecz przed oczami staje mi urwany w połowie wiersz z wczorajszego wieczoru.\n\nPisarz przysuwa kolejny raport nieco bliżej. Moja ręka wciąż spoczywa na pierwszym."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Narada jeszcze trwa, lecz z leżących na stole dokumentów nie przyswajam ani słowa. Zamykam akta i otwieram je ponownie. Na marginesach wciąż widnieją wczorajsze uwagi.\n\nDoradcy mówią o cenie zboża i korycie rzeki. Wyłapuję kilka słów, potem odpływam myślami, aż trafiam na czyjeś imię. Tego imienia nie ma w dokumencie. Mimo to nadal szukam go na papierze.\n\nKtoś pyta, czy zarządzić przerwę. Podnoszę głowę i dopiero wtedy dostrzegam, że w izbie od chwili panuje cisza."
 latria_sexual_frustration_flavor.1009.a: "Odprawić radę i zostać sam na sam z myślami."
 latria_sexual_frustration_flavor.1009.b: "Zebrać myśli i rozpatrzyć każdą petycję."
 latria_sexual_frustration_flavor.1009.c: "Uporządkować decyzje, a potem ogłosić każdą z nich."

 latria_sexual_frustration_flavor.1010.t: "Powrót orła"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Sokół krąży nad lasem. Jego cień raz po raz przesuwa się po mojej rękawicy, lecz ptak nie chce usiąść. Unoszę rękę, a on tylko zatacza kolejny krąg, jeszcze wyżej.\n\nPatrząc, jak zwleka z powrotem, czuję znużenie ciągłym tłumieniem każdego własnego pragnienia. Myśliwi rozmawiają półgłosem przy koniach; sądzą, że czekam na odpowiedni wiatr. Ja tymczasem czekam, aż uda mi się nazwać ten niepokój czymś innym. Nie udaje się.\n\nSokół wydaje krótki, ostry krzyk, jakby nie zamierzał już słuchać żadnych poleceń."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Ptak wciąż krąży w oddali. Zaciskam rękawicę i zmuszam się do słuchania wyłącznie nawoływań myśliwych, do śledzenia linii lasu oraz kierunku wiatru. Skórzany pasek wilgotnieje mi w dłoni.\n\nDobrze znam taką powściągliwość. Dziś jednak wymaga szczególnego wysiłku. Z każdą chwilą czekania przychodzi zdanie, którego nie powinno być w moich myślach. Powtarzam je sobie i zaraz urywam. Koń łamie suchą gałązkę, a mnie ten drobny trzask przyprawia o przestrach.\n\nPtak jeszcze nie wrócił. Ramię już mnie boli."
 latria_sexual_frustration_flavor.1010.desc: "Myśliwi czekają, żeby zakończyć łowy, a ja nadal wpatruję się w niebo ponad drzewami.\n\nRóg wisi przy siodle. Dotykam go, lecz nie biorę do ręki. Ciemny punkcik na niebie zatacza jeden krąg, potem następny. Nikt mnie nie ponagla, ale wszyscy czekają.\n\nW końcu opuszczam głowę. Nie umiem nawet powiedzieć, w którą stronę odleciał ptak."
 latria_sexual_frustration_flavor.1010.a: "Niech myśliwi czekają, a moje myśli podążają za orłem."
 latria_sexual_frustration_flavor.1010.b: "Dać sygnał powrotu i sprawdzić sprzęt łowiecki."
 latria_sexual_frustration_flavor.1010.c: "Przejść się skrajem lasu przed powrotem do towarzyszy."

 nick_latria_the_unquiet: "Niespokojny"
 nick_latria_the_unquiet_desc: "[CHARACTER.GetShortUINameNotMeNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'kazała', 'kazał' )] wpisać do kroniki swoje cielesne pragnienia, a odpisy tej kroniki wciąż krążą po całym świecie."
 latria_flavor_focus: "Zebrana determinacja"
 latria_flavor_focus_desc: "Ta postać skupia uwagę na świętych księgach i codziennych obowiązkach."
 latria_flavor_remorse: "Nieustające wyrzuty sumienia"
 latria_flavor_remorse_desc: "Krótka pociecha pozostawiła niespokojne sumienie."
 latria_flavor_sullied: "Nadszarpnięta reputacja"
 latria_flavor_sullied_desc: "Plotki zaszkodziły pozycji tej postaci i jej przyjaźniom."
 latria_flavor_broken_sleep: "Brak snu"
 latria_flavor_broken_sleep_desc: "Niedobór snu sprawia, że ta postać łatwo się rozprasza i męczy."
 latria_flavor_vagabond_focus: "Skupienie podróżnika"
 latria_flavor_vagabond_focus_desc: "Trudy podróży na krótko uciszają niespokojne myśli."
 latria_flavor_public_disgrace: "Publiczna hańba"
 latria_flavor_public_disgrace_desc: "Pogłoski o publicznym uchybieniu zaszkodziły pozycji tej postaci i jej przyjaźniom."
 latria_flavor_hunting_focus: "Skupienie na łowach"
 latria_flavor_hunting_focus_desc: "Ta postać skupia uwagę na tropieniu, sokolnictwie i jeździe konnej."
 latria_flavor_warm_company: "Miłe towarzystwo"
 latria_flavor_warm_company_desc: "Dobra rozmowa sprawiła, że ta postać chętniej szuka towarzystwa."
 latria_flavor_neglected_duties: "Zaniedbane obowiązki"
 latria_flavor_neglected_duties_desc: "Prywatne troski odciągnęły tę postać od obowiązków."
 latria_flavor_diligent_work: "Uporządkowane obowiązki"
 latria_flavor_diligent_work_desc: "Ta postać spożytkowała niespokojne myśli na staranne planowanie i pracę."
