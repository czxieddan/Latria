 latria_sexual_frustration_flavor.1211.t: "Niegaszona lampa"
 latria_sexual_frustration_flavor.1211.desc: "Dom ucichł tak, że słyszę lampę. Nikogo nie wołam. I tak wystawiam dwa kubki, a drugi stoi tam pusty. Chleb wciąż leży pod tkaniną tam, gdzie zostawiam go w południe.\n\nZostaje mi bark przy moim barku w progu, jego ciężar, to, że żadne z nas nie poruszyło się przez długość oddechu. Skóra to zachowała. Wraca o tej godzinie, pod nocną koszulą, za kolanami i niżej, a dłoń idzie płasko na brzuch, żeby to uciszyć, i nie ucisza.\n\nKnot się chyla. Obracam pusty kubek tak, by ucho było zwrócone do krzesła."
 latria_sexual_frustration_flavor.1211.a: "Zgasić lampę i pozwolić własnej dłoni dokończyć."
 latria_sexual_frustration_flavor.1211.b: "Przyciąć knot, wypić zimny napar i spać."
 latria_sexual_frustration_flavor.1211.c: "Czytać, aż słowa przestaną krążyć."

 latria_sexual_frustration_flavor.1212.t: "Rada czeka"
 latria_sexual_frustration_flavor.1212.desc: "Petycje są odczytywane, a ja nie słyszę żadnej. Zarządca stoi przy krawędzi stołu z dłońmi splecionymi za plecami, a ja od drugiej strony obserwuję linię gardła. Deszcz ustał, w izbie jest zbyt ciepło. Ogień za mną tyka i układa się.\n\nTa osoba pochyla się, żeby przesunąć świecę, i rękaw muska mój przegub. Nikt z nas nic nie mówi. Izba pachnie gorącym woskiem i mokrą wełną. Mogę zakończyć posiedzenie. Słowo jest już w moich ustach i trzymam je tam, a ta osoba czeka ze wzrokiem na pieczęci.\n\nSkryba pyta, czy jest decyzja. Nie ma żadnej."
 latria_sexual_frustration_flavor.1212.a: "Zakończyć posiedzenie i zatrzymać tę osobę pod zmyślonym poleceniem."
 latria_sexual_frustration_flavor.1212.b: "Rozstrzygnąć petycje i trzymać oczy na stronie."
 latria_sexual_frustration_flavor.1212.c: "Zanieść papiery do stołu z mapą i pracować całą noc."

 latria_sexual_frustration_flavor.1213.t: "Do czego jest ciemność"
 latria_sexual_frustration_flavor.1213.desc: "Drzwi są zaryglowane. Nie mam na sobie ubrania, a prześcieradło leży na podłodze tam, gdzie je skopuję. Izba pachnie świecą i moją własną skórą.\n\nCiało jest głośne cały dzień, a teraz jest głośniejsze. Pozwalam kolanom opaść, a dłoni iść w dół po brzuchu, niżej, i nie udaję, że robię coś innego. Przychodzi obraz ust na obojczyku, przegubów trzymanych na dole i lubianych, i idę za nim, aż biodra unoszą się z materaca, a oddech rozpada się w ciemności.\n\nPotem izba jest tą samą izbą. Leżę z ramieniem przez oczy. Świeca wypaliła się do kałuży, a ja nie śpię."
 latria_sexual_frustration_flavor.1213.a: "Pozwolić dłoni skończyć i spać potem."
 latria_sexual_frustration_flavor.1213.b: "Podnieść prześcieradło z podłogi i leżeć bez ruchu do świtu."
 latria_sexual_frustration_flavor.1213.c: "Ubrać się, zejść i chodzić po murach, aż niebo zszarzeje."
 latria_sexual_frustration_flavor.1213.d: "Oddać się temu znowu i znowu, aż świeca zgaśnie."

 latria_sexual_frustration_flavor.1214.t: "Godzina przed jutrznią"
 latria_sexual_frustration_flavor.1214.desc: "Zostaję w kościele z lampami, które trzeba przyciąć. Chłód idzie w górę przez płyty, a święci patrzą mimo mnie na drzwi. Pod sutanną ciało mam ciepłe, rozbudzone i całkowicie niezainteresowane godziną.\n\nZnam słowa na to. Wypowiadam je nad innymi w drewnianej skrzyni przy drzwiach, głosem, którego używam do ich grzechów. Wypowiedziane nad sobą nie robią nic. Tęsknota siedzi za żebrami jak przełknięty węgiel. Przyciskam dłoń płasko do kamienia ołtarza, aż boli.\n\nDzwon wkrótce zadzwoni. Dłoń wciąż mam na kamieniu, a kamień nie jest już zimny."
 latria_sexual_frustration_flavor.1214.a: "Wziąć tęsknotę we własne ręce i prosić o przebaczenie potem."
 latria_sexual_frustration_flavor.1214.b: "Klęczeć przez całe oficjum i pozwolić godzinom to zetrzeć."
 latria_sexual_frustration_flavor.1214.c: "Otworzyć księgę i czytać psalmy, aż słowa utrzymają."

 latria_sexual_frustration_flavor.1215.t: "Kolano pod stołem"
 latria_sexual_frustration_flavor.1215.desc: "Sala jest głośna. Czyjś pies leży pod ławami, a wino obeszło dwa razy. Kolano sąsiada nie odsuwa się od mojego od dziczyzny, a ława zrobiła się ciepła tam, gdzie się stykamy. Sitowie pachnie rozdeptanym winem.\n\nZa każdym razem, gdy stół trzęsie się od śmiechu, nacisk przesuwa się i wraca. Przestaję nadążać za sporem o granicę. Kładę dłoń na ławie obok tamtej i zostawiam ją. Ta osoba patrzy na dłoń, potem na daleką ścianę, a kolano zostaje. Moje kolano zdrętwiało i nie przesuwam go.\n\nPuchar się przewraca. Wino dobiega do krawędzi i kapie na sitowie. Nikt się nie poruszył."
 latria_sexual_frustration_flavor.1215.a: "Powiedzieć to wprost, tutaj, i pozwolić sali słyszeć."
 latria_sexual_frustration_flavor.1215.b: "Podziękować stołowi, wstać i odetchnąć powietrzem na dworze."
 latria_sexual_frustration_flavor.1215.c: "Odwrócić się do tej osoby i mówić o czymkolwiek innym, aż ogień będzie niski."

 latria_sexual_frustration_flavor.1216.t: "Rękawy w ogrodzie"
 latria_sexual_frustration_flavor.1216.desc: "Piwonie są już po swoim najlepszym, a ogrodnik przestał udawać pracę. Idziemy dłuższą drogą wokół stawu, bo krótsza kończy się przy bramie. Popołudnie zrobiło się w kolorze słabej herbaty.\n\nRękaw tej osoby wciąż trafia na grzbiet mojej dłoni. U mnie w domu dotyk taki byłby decyzją już podjętą, a swaci zostaliby wezwani, zanim herbata wystygnie. Tutaj to tylko rękaw, i to ja muszę go odczytać. Zwalniam. Ta osoba zwalnia. Woda trzyma oba nasze odbicia i żadne z nas nie porusza się pierwsze.\n\nPrzy bramie ta osoba zatrzymuje się i ogląda raz. Pod moim butem są płatki."
 latria_sexual_frustration_flavor.1216.a: "Zapytać wprost i odpowiedzieć za to przed moim domem."
 latria_sexual_frustration_flavor.1216.b: "Ukłonić się, trzymać dłonie w rękawach i wejść."
 latria_sexual_frustration_flavor.1216.c: "Obejść staw jeszcze raz, samemu, aż zapalą latarnie."

 latria_sexual_frustration_flavor.1217.t: "Długa droga powrotna"
 latria_sexual_frustration_flavor.1217.desc: "Jesteśmy w siodle od przed świtem, a od trzech mil świadomość jeźdźca przede mną nie daje mi spokoju. Sposób, w jaki siedzi. Sposób, w jaki ogląda się przy brodzie. Uda mam otarte, usta suche, i nic z tego nie jest powodem, dla którego wciąż patrzę.\n\nJelenie odeszły, naganiacze się rozsypali, a nikt nie skomentowałby zwłoki. Dłonie mam zimne na wodzach, a cała reszta mnie nie jest zimna zupełnie. Popędzam konia i zmniejszam odległość do zera. Las tyka od wody.\n\nTa osoba odwraca się na dźwięk i czeka. Las jest pełen mokrych liści, a konie parskają."
 latria_sexual_frustration_flavor.1217.a: "Zabrać tę osobę między drzewa i wrócić późno."
 latria_sexual_frustration_flavor.1217.b: "Jechać do dworku i włożyć tę myśl w zimną wodę."
 latria_sexual_frustration_flavor.1217.c: "Zsiąść i czytać tropy, aż dłonie przestaną się trząść."

 latria_sexual_frustration_flavor.1218.t: "Izba z pożyczonymi księgami"
 latria_sexual_frustration_flavor.1218.desc: "Uczony, który pozwala mi spać w swojej izbie na zapasy, zostawia mi lampę i księgę, której nie umiem dobrze czytać. Deszcz o okiennice i zapach mokrej strzechy. Ciało mam niespokojne od ostatniego miasta, a wąskie łóżko robi to gorszym. Lampa kopci, gdy przeciąg ją znajdzie.\n\nTa osoba wchodzi, żeby zająć się knotem, i stoi z palcami na półce, a ja czuję atrament. Proszę, żeby została i objaśniła stronę. Zostaje. Ramię tej osoby opiera się o moje, gdy pokazuje, i żadne z nas go nie odsuwa, a ja przestaję słyszeć gramatykę.\n\nDeszcz zelżeje. Palec tej osoby wciąż jest na tej samej linijce."
 latria_sexual_frustration_flavor.1218.a: "Śpiewać, źle, aż tęsknota będzie miała gdzie iść."
 latria_sexual_frustration_flavor.1218.b: "Podziękować, zgasić lampę i leżeć plecami do drzwi."
 latria_sexual_frustration_flavor.1218.c: "Poprosić o dalszą naukę i trzymać dłonie na stronie."
 latria_sexual_frustration_flavor.1218.d: "Przepisać fragment trzy razy, aż dłoń będzie zbyt zmęczona, by chcieć."

 latria_sexual_frustration_flavor.1219.t: "Izba za salą"
 latria_sexual_frustration_flavor.1219.desc: "Uczta wylała się na podwórze, a my dwoje kończymy w małej izbie za salą, gdzie trzymają zapasowe ławy. Ta osoba stoi plecami do drzwi, dłoń płasko na mojej piersi, i śmieje się ze mnie, czekając.\n\nDostaję zapięcie pasa, potem wiązania, a ta osoba śmieje się znowu i pomaga mi. Usta są na moim gardle, udo wchodzi między moje, i mam dość udawania. Nie spieszymy się na ławie, włosy tej osoby się rozsypują, oddech mi się rwie, aż drży i idę za tym.\n\nPotem ta osoba wciąż trzyma mój przegub. W sali znowu zaczęła się muzyka."
 latria_sexual_frustration_flavor.1219.a: "Powiedzieć prawdę i trzymać tę dłoń."
 latria_sexual_frustration_flavor.1219.b: "Poprawić ubranie, podziękować i wrócić do sali."
 latria_sexual_frustration_flavor.1219.c: "Siedzieć z tą osobą na ławie, aż muzyka się skończy."

 latria_sexual_frustration_flavor.1220.t: "Czuwanie, które trzymam"
 latria_sexual_frustration_flavor.1220.desc: "Mówię pozostałym, że będę trzymać czuwanie, i zostawiają mi kościół, jedną świecę i zapach zeszłotygodniowego kadzidła. Północ przychodzi i mija. Kolana mnie bolą, a ciało nie chce być ciche. Płyty wyciągnęły ciepło z moich stóp.\n\nIlekroć zamykam oczy, jest dłoń na moich plecach, z tańca dwie zimy temu, i muszę je znowu otworzyć. Świeca rzuca mój cień na ścianę. Mogę to zakończyć w jednej chwili i nikt nigdy by się nie dowiedział, i w tym jest cały kłopot.\n\nOd drzwi jest przeciąg. Mój cień porusza się na ścianie."
 latria_sexual_frustration_flavor.1220.a: "Wziąć to we własne ręce tutaj i być szczerym wobec świętych."
 latria_sexual_frustration_flavor.1220.b: "Zostać na kolanach, aż okno zszarzeje."
 latria_sexual_frustration_flavor.1220.c: "Czytać oficjum na głos, aż mój głos będzie jedynym w izbie."

 latria_sexual_frustration_flavor.1221.t: "Rękawica posła"
 latria_sexual_frustration_flavor.1221.desc: "Poseł jest trzy dni w mojej sali i liczę każdy z nich. Zdejmuje rękawicę, żeby przewracać karty traktatu, palec po palcu, a ja dwa razy gubię klauzulę o rzece. Ogień się wypalił i nikt nie został posłany po drewno.\n\nRadcy patrzą, jak nie słucham. Jest w mieście miejsce, gdzie nikt nie pyta o imię, i myśl o nim siedzi mi w piersi od drugiego ranka, ciężka, ciepła i zupełnie niegodna. Od roku te drzwi mnie nie widziały.\n\nRękawica jest wyciągnięta w moją stronę, do obejrzenia pieczęci. Biorę ją. Jest wciąż ciepła."
 latria_sexual_frustration_flavor.1221.a: "Podpisać, odprawić tę osobę i zejść dziś w nocy do miasta."
 latria_sexual_frustration_flavor.1221.b: "Przeczytać klauzulę jeszcze raz i trzymać dłonie na stole."
 latria_sexual_frustration_flavor.1221.c: "Przejść warunki po kolei, aż świece się skopcą."
 latria_sexual_frustration_flavor.1221.d: "Dowiedzieć się, które drzwi w mieście są te ciche."

 latria_sexual_frustration_flavor.1222.t: "Dłoń trzymana zbyt długo"
 latria_sexual_frustration_flavor.1222.desc: "Taniec doszedł do wolnej miary, a mnie cały wieczór podają z rąk do rąk. Ostatnia dłoń nie puszcza, gdy muzyka milknie. Sala jest gorąca od świec i zapachu cudzego wina. Sitowie wydeptane płasko, świece się kopcą.\n\nKciuk tej osoby jest na moich kostkach. Sala patrzy i udaje, że nie, uszy mam gorące, a ja nie zabieram dłoni. Ktoś śmieje się przy muzykantach. Uścisk zaciska się raz, z rozmysłem, i całe ciało odpowiada, zanim ułożę twarz. Dłoń nie jest pewna w tamtej dłoni. Muzyka zaczyna się znowu za mną.\n\nTa osoba puszcza. Odbicie palców zostaje na mojej dłoni."
 latria_sexual_frustration_flavor.1222.a: "Powiedzieć, czego chcę, tam gdzie cała sala słyszy."
 latria_sexual_frustration_flavor.1222.b: "Podziękować za taniec i cofnąć się w tłum."
 latria_sexual_frustration_flavor.1222.c: "Poprosić o drogę do drzwi i rozmowę o koniach."

 latria_sexual_frustration_flavor.1223.t: "Bród"
 latria_sexual_frustration_flavor.1223.desc: "Zatrzymujemy się przy brodzie, żeby napoić konie, a dzień jest dość gorący, by połowa towarzystwa weszła do wody. Stoję na płaskim kamieniu bez koszuli, wykręcam ją, kiedy zauważam tę osobę wciąż w siodle, patrzącą. Woda jest głośna na kamieniach. Konie piją i przestępują z nogi na nogę.\n\nTa osoba nie odwraca wzroku, gdy ją przyłapuję. Woda spływa mi po żebrach i z przegubu. Z popołudniem i całym lasem do dyspozycji można zrobić wiele, a ciało już postanowiło i utrudnia myślenie o koniach.\n\nTa osoba zsiada. Wodze wciąż są w dłoni."
 latria_sexual_frustration_flavor.1223.a: "Upuścić koszulę i pójść do tej osoby na oczach każdego, kto chce patrzeć."
 latria_sexual_frustration_flavor.1223.b: "Włożyć koszulę i jechać przodem do dworku."
 latria_sexual_frustration_flavor.1223.c: "Wziąć sokoła i zająć dłonie, aż towarzystwo będzie gotowe."

 latria_sexual_frustration_flavor.1224.t: "Dwoje jeźdźców i trawa"
 latria_sexual_frustration_flavor.1224.desc: "Trawa jest dość wysoka, by ukryć konia, a niebo robi to, co robi przed deszczem. Jedziemy obok siebie, odkąd stado skręciło, a noga tej osoby od ostatniego stajania dotyka mojej i żadne z nas tego nie poprawia. Wiatr pachnie zgniecionymi łodygami. Konie są mokre do kolan.\n\nTutaj nie ma muru, za którym można się schować, ani kapłana w zasięgu dnia jazdy. To nigdy nie czyni tęsknoty prostszą. Czyni ją tylko większą, tak jak większa jest ziemia, i przestaję udawać, że nie wiem, dokąd to idzie.\n\nTa osoba zatrzymuje się na grzbiecie i patrzy na mnie przez ramię. Padają pierwsze krople."
 latria_sexual_frustration_flavor.1224.a: "Wziąć tę dłoń i sprowadzić tę osobę w wysoką trawę."
 latria_sexual_frustration_flavor.1224.b: "Skinąć, zawrócić konia i wyścignąć tę osobę do wozów."
 latria_sexual_frustration_flavor.1224.c: "Ustawić tarczę przy dalekim słupie i strzelać, aż ramiona się zatrzęsą."

 latria_sexual_frustration_flavor.1225.t: "Słowa w konfesjonale"
 latria_sexual_frustration_flavor.1225.desc: "Klęczę w drewnianej skrzyni i mówię to na głos, co jest gorsze niż milczenie. Kapłan po drugiej stronie kraty nie wzdycha i nie karci. Pada pytanie o mój własny dom, potem czekanie, i słyszę, jak własny głos daje odpowiedź. Kościół pachnie zimnym kamieniem.\n\nIdąc z powrotem przez kościół, wciąż mam gorącą twarz. To nie wstyd, albo nie tylko wstyd. Skoro to powiedziane, czuję całość od nowa, w świetle dnia, przed ołtarzem, a ciało nie ma żadnych manier. Kołnierz jest zbyt ciasny.\n\nTa osoba wciąż jest w skrzyni. Zasłona porusza się, gdy przechodzę."
 latria_sexual_frustration_flavor.1225.a: "Wrócić do skrzyni i poprosić o wysłuchanie reszty."
 latria_sexual_frustration_flavor.1225.b: "Klęknąć przy balustradzie i przyjąć pokutę oraz słowa, które dostanę."
 latria_sexual_frustration_flavor.1225.c: "Usiąść w bocznej nawie i słuchać nauki, aż będę spokojny."

 latria_sexual_frustration_flavor.1226.t: "Przebudzenie o czwartej godzinie"
 latria_sexual_frustration_flavor.1226.desc: "Wychodzę ze snu z bijącym sercem, wilgotnymi udami i prześcieradłem skopanym w nogi łóżka. We śnie jest podwórze stajni i dłoń na moim karku, i wiem, czyja to dłoń. W izbie jest zimno, a poduszka jest mokra tam, gdzie były usta.\n\nIzba jest szara. Nie ma w niej nikogo. Ciało nie dba o szarość ani o godzinę. Chce snu dokończonego i bardzo jasno mówi, jak. Kładę ramię przez oczy i leżę z podciągniętymi kolanami. Podłoga jest dość zimna, by boleć.\n\nPtak w okapie zaczyna. Dłoń już się porusza."
 latria_sexual_frustration_flavor.1226.a: "Dokończyć i pozwolić domownikom zastać mnie śpiącym."
 latria_sexual_frustration_flavor.1226.b: "Wstać, ubrać się i wyjść do stajni pracować, aż rozboli."
 latria_sexual_frustration_flavor.1226.c: "Czytać list na stole, aż światło przyjdzie jak należy."

 latria_sexual_frustration_flavor.1227.t: "Zakład"
 latria_sexual_frustration_flavor.1227.desc: "Ktoś postawił konia, że nie powiem przy całym stole imienia osoby, której chcę. Wino jest dobre, ogień gorący, zakład głupi, a wszyscy czekają. Pies zatrzymał się pod ławą, żeby słuchać. Zakład zawarto przy człowieku biskupa.\n\nCzuję imię w ustach jak kamień. Po drugiej stronie stołu osoba, o którą chodzi, patrzy na deszkę i nie na mnie, a kark mam mokry. Jeśli powiem, w niedzielę będzie to w każdej sali. Ktoś dołożył drewna do ognia.\n\nZarządca znowu napełnia mi puchar. Stół ucichł."
 latria_sexual_frustration_flavor.1227.a: "Powiedzieć imię i niech sala zrobi z tym, co chce."
 latria_sexual_frustration_flavor.1227.b: "Śmiać się, zapłacić karę i wołać o więcej wina."
 latria_sexual_frustration_flavor.1227.c: "Rozstawić planszę i pokonać tego, kto zrobił zakład."
 latria_sexual_frustration_flavor.1227.d: "Ułożyć z tego wiersz, który ma w sobie imię i nie ma go wcale."

 latria_sexual_frustration_flavor.1228.t: "Warunki"
 latria_sexual_frustration_flavor.1228.desc: "Małżeństwo jest omawiane pod drzewami, głosem, którego ludzie używają do rzeczy. Osoba, której to dotyczy, stoi pod ścianą ze złożonymi dłońmi i słucha, jak skryba odczytuje, ile jest warta. Pszczoła pracuje w lawendzie między nami i nikt jej nie odgania. Głos skryby robi się płaski przy liczbach.\n\nPoproszono mnie o rozstrzygnięcie sprawy wiana. Tę samą linijkę czytam cztery razy. To, czego chcę, nie jest przyzwoite i nie ma tego na papierze, a przez całe popołudnie stoi pod ścianą w zielonym płaszczu. Zielony płaszcz ma rozdarty mankiet.\n\nSkryba czeka z podniesionym piórem. Liść spada na stół."
 latria_sexual_frustration_flavor.1228.a: "Rozstrzygnąć warunki szybko i odesłać skrybę oraz rodzinę."
 latria_sexual_frustration_flavor.1228.b: "Przeczytać każdą linijkę dwa razy i nic nie zdradzić."
 latria_sexual_frustration_flavor.1228.c: "Zabrać papiery do środka i zdecydować z jasną głową."
 latria_sexual_frustration_flavor.1228.d: "Uporządkować rachunki majątku i pozwolić liczbom mnie trzymać."

 latria_sexual_frustration_flavor.1229.t: "Ręka skryby"
 latria_sexual_frustration_flavor.1229.desc: "Kopiowanie idzie wolno, skryptorium jest zimne, a ten sam wyraz piszę błędnie trzy razy. Myśl nie jest na stronie. Jest na ustach tej osoby, która w południe przynosi chleb. Ktoś dwa pulpity dalej oddycha przez zatkany nos. Chleb był jeszcze ciepły, gdy go przyniesiono.\n\nŚlub jest złożony i trzymany, a trzymanie go sprawia, że jestem świadomy własnego ciała w sposób, którego trudno się modlić. Dłoń trzęsie się nad welinem. Jest sposób na zakończenie tego, który trwa mniej więcej tyle, ile krótka modlitwa, i chcę go.\n\nAtrament schnie na niewłaściwej literze."
 latria_sexual_frustration_flavor.1229.a: "Odłożyć ślub na jedno popołudnie i być szczerym, dlaczego."
 latria_sexual_frustration_flavor.1229.b: "Trzymać ślub i pozwolić tęsknocie się wypalić."
 latria_sexual_frustration_flavor.1229.c: "Wziąć fragment od nowa i kopiować, aż dłoń będzie pewna."

 latria_sexual_frustration_flavor.1230.t: "Zmierzch w ogrodzie"
 latria_sexual_frustration_flavor.1230.desc: "Wychodzę w nocnej koszuli, bo izba jest gorsza. Ogród jest niebieski, a ćmy są przy lawendzie. Ktoś w skrzydle służby gra źle na strunowym czymś, te same cztery nuty, w kółko. Trawa jest mokra przez pantofle, a dół sukni ciężki.\n\nWciąż czuję, gdzie dłoń spoczęła na moim pasie przy bramie dziś wieczorem, lekko, na długość ukłonu. Nie zbladło. Przez całą noc robi się głośniejsze, muzyka nie pomaga, a własna skóra wydaje się za mała. Od bramy się nie poruszam. Ława jest zimna przez płótno.\n\nSiedzę na kamiennej ławie. Ćmy dalej pracują przy lawendzie."
 latria_sexual_frustration_flavor.1230.a: "Wrócić do środka i pozwolić muzyce przykryć to, co robię."
 latria_sexual_frustration_flavor.1230.b: "Zostać na ławie, aż chłód przejdzie przez nocną koszulę."
 latria_sexual_frustration_flavor.1230.c: "Oddychać, liczyć cztery nuty i pozwolić ogrodowi wystarczyć."

 latria_sexual_frustration_flavor.1231.t: "Przebudzenie przed dzwonem"
 latria_sexual_frustration_flavor.1231.desc: "Budzę się przed dzwonem, prześcieradło skopane na podłogę, skóra wilgotna wzdłuż pleców. Nocna koszula skręciła się wokół ud. Śni się, i sen wciąż jest na mnie, ciepło, które ułożyło się nisko i nie chce się podnieść.\n\nTo ta sama twarz, o której cały tydzień staram się nie myśleć. We śnie nie ma żadnej ostrożności. Dłoń na pasie, usta, których kształt czuję, i własne ciało odpowiadające, zanim postanowię. Jestem rozbudzony i to nie ustało.\n\nLeżę z podciągniętymi kolanami i dłonią płasko na brzuchu, a ciepło tylko zbiera się pod nią. Dzwon nie bił. Oddech idzie szybko i płytko, a ja nie poruszam się, żeby go zwolnić."
 latria_sexual_frustration_flavor.1231.a: "Zgasić lampę i pozwolić własnej dłoni dokończyć."
 latria_sexual_frustration_flavor.1231.b: "Poprawić suknię, odwrócić się i leżeć bez ruchu do dzwonu."
 latria_sexual_frustration_flavor.1231.c: "Czytać, aż ciepło rozluźni chwyt."

 latria_sexual_frustration_flavor.1232.t: "Jazda na uboczu"
 latria_sexual_frustration_flavor.1232.desc: "Jesteśmy w siodle od przed świtem, a ja trzymam oczy na jeźdźcu z przodu. Sposób, w jaki siedzi. Sposób, w jaki ogląda się przy brodzie i zwalnia, żeby dać mi się zrównać. Uda mam otarte do krwi, usta suche, i nic z tego nie jest powodem, dla którego wciąż patrzę.\n\nJelenie odeszły, a naganiacze rozsypali się po mokrym lesie. Nikt nie skomentowałby zwłoki. Popędzam konia, aż nie zostaje odległości, a moje kolano znajduje tamto, skóra skrzypi, i żadne z nas nie ściąga wodzy.\n\nTa osoba odwraca się na dźwięk i czeka. Las jest głośny od kapiącej wody. Dłonie mam zimne na wodzach, a cała reszta mnie nie jest zimna zupełnie, i koń stoi, parskając pode mną."
 latria_sexual_frustration_flavor.1232.a: "Zamknąć resztę odległości i pozwolić lasowi to zachować."
 latria_sexual_frustration_flavor.1232.b: "Ściągnąć wodze, jechać dalej samemu i zapanować nad sobą."
 latria_sexual_frustration_flavor.1232.c: "Zsiąść i iść mokrym szlakiem, aż głowa się przejaśni."

 latria_sexual_frustration_flavor.1233.t: "Godzina, której strzegą święci"
 latria_sexual_frustration_flavor.1233.desc: "Zostaję w kościele z lampami, które trzeba przyciąć. Chłód idzie w górę przez płyty, ale pod sutanną ciało mam ciepłe, rozbudzone i bez zainteresowania oficjum. Święci patrzą mimo mnie na zamknięte drzwi.\n\nZnam słowa, które mają to ochłodzić. Wypowiadam je nad innymi w ciemności skrzyni przy drzwiach, głosem, który trzymam na ich grzechy. Nad własnymi nie robią nic. Tęsknota siedzi za żebrami jak przełknięty węgiel, a dłoń ułożyła się płasko na kamieniu ołtarza, choć jej tego nie kazuję.\n\nNaciskam, aż zimna krawędź zaboli dłoń. Dzwon wkrótce zadzwoni. Ręka wciąż jest na kamieniu, a kamień wziął ode mnie ciepło i nie jest już zimny."
 latria_sexual_frustration_flavor.1233.a: "Wziąć tęsknotę we własne ręce i prosić o przebaczenie potem."
 latria_sexual_frustration_flavor.1233.b: "Klęczeć przez całe oficjum i pozwolić godzinom to zetrzeć."
 latria_sexual_frustration_flavor.1233.c: "Oprzeć czoło na zimnym kamieniu i pozwolić mu mnie uspokoić."

 latria_sexual_frustration_flavor.1234.t: "Dłoń trzymana zbyt długo"
 latria_sexual_frustration_flavor.1234.desc: "Rada się rozeszła, gabinet jest cichy. Przez całą ostatnią godzinę świadomość mam tylko o jednym: gdy przez stół podają mi traktat, a dłoń zamyka się na mojej i została tam o oddech dłużej, niż wymagała pieczęć. Izba była pełna ludzi. Pozwalam jej zostać.\n\nWracam do ciężaru tego, do ciepła dłoni, która nie miała powodu zostać. Świeca wypaliła się, gdy tę samą klauzulę czytam trzy razy. Ciało postanowiło, że to jest warte więcej niż traktat, i nie pyta mnie o zdanie.\n\nPierścień zostawił znak na grzbiecie mojej dłoni. Nie ścieram go. Wosk zbiera się w kałużę, drzwi pozostają zamknięte, a klauzulę czytam czwarty raz."
 latria_sexual_frustration_flavor.1234.a: "Wezwać tę osobę znowu i powiedzieć wprost, co jej dłoń mi zrobiła."
 latria_sexual_frustration_flavor.1234.b: "Trzymać nocną wartę samemu i pozwolić czuwaniu mnie ochłodzić."
 latria_sexual_frustration_flavor.1234.c: "Rozstawić planszę i grać samemu, aż obraz zblednie."

 latria_sexual_frustration_flavor.1235.t: "Gdy muzyka się obraca"
 latria_sexual_frustration_flavor.1235.desc: "Sala jest głośna, a wino obeszło dwa razy. Gdy muzykanci uderzają, pozwalam się wciągnąć w taniec, a partner, którego znajduję, jest tą osobą, na którą cały wieczór nie patrzę. Dłoń układa się na moich plecach i przez cienką tkaninę czuję każdy palec.\n\nObracamy się i obracamy znowu, a izba rozmywa się w dym ze świec i kolor. Ta osoba trzyma mnie trochę bliżej, niż każe figura, i nie poprawiam tego. Puls mam w uszach, głośniejszy niż bęben. Tęsknota przyszła znikąd i zgłasza do mnie prawo przed całą salą, a ja uśmiecham się, jakby nic się nie działo.\n\nMuzyka zwalnia ku końcowi. Dłoń tej osoby nie poruszyła się z moich pleców, a ja nie odsuwam się."
 latria_sexual_frustration_flavor.1235.a: "Poprosić muzykantów o jeszcze jeden taniec i trzymać tę osobę bliżej."
 latria_sexual_frustration_flavor.1235.b: "Podziękować, ukłonić się i wycofać, zanim figura obróci się znowu."
 latria_sexual_frustration_flavor.1235.c: "Zachować towarzystwo tej osoby i mówić o wszystkim prócz tego."

 latria_sexual_frustration_flavor.1236.t: "Długi ogień"
 latria_sexual_frustration_flavor.1236.desc: "Ogień wypalił się w długie czerwone łoże, a sala zrobiła się głośna tak, jak robi się, gdy nikt nie wychodzi. Skald brnie przez wers o czyimś dziadku. Futra, miód, ława ciepła tam, gdzie ciała leżą jedno przy drugim.\n\nTa osoba, której chcę, siedzi obok z ramieniem na oparciu ławy, nie dotykając mnie, a ja od trzech wersów jestem świadomy tego ramienia. Za drzwiami fiord jest czarny i lód schodzi z wody. Moje kolano jest przy jej kolanie i żadne z nas go nie odsuwa.\n\nSkald przerywa dla oddechu. Ramię za mną przesuwa się i nie opada."
 latria_sexual_frustration_flavor.1236.a: "Poprosić o wers i zaśpiewać odpowiedź samemu."
 latria_sexual_frustration_flavor.1236.b: "Podziękować ławie, wstać i wyjść w ciemność."
 latria_sexual_frustration_flavor.1236.c: "Odwrócić się do tej osoby i mówić, aż ogień będzie żarem."

 latria_sexual_frustration_flavor.1237.t: "Wylew"
 latria_sexual_frustration_flavor.1237.desc: "Wylew stanął nad polami, a powietrze jest dość gęste, by je pić. Jestem w ogrodzie w lnie, z kohlem na oczach, girlanda z lotosu już mięknie w upale. Świątynia Izydy trzyma swój chłodny kamień kilka kroków dalej, a ja dwa razy przechodzę obok tego muru.\n\nW ciepłej ciemności ktoś podaje dłoń, otwartą, bez pośpiechu. Świerszcze są dość głośne, by nikt w domu nie usłyszał odpowiedzi. Moje ciało już jej udzieliło, niskiej i natarczywej, i nie czeka na moje obycie.\n\nNie biorę tej dłoni. Lotos kapie mi na przegub."
 latria_sexual_frustration_flavor.1237.a: "Wziąć dłoń i odpowiedzieć za to przed moim domem."
 latria_sexual_frustration_flavor.1237.b: "Złożyć dłonie w rękawach i wejść do środka samemu."
 latria_sexual_frustration_flavor.1237.c: "Przejść zalaną ścieżką, aż zapalą lampy."

 latria_sexual_frustration_flavor.1238.t: "Ryt zielonych gałęzi"
 latria_sexual_frustration_flavor.1238.desc: "Ryt się skończył, a świątynia wciąż pachnie ściętymi gałęziami. Wiosenna woda została pobłogosławiona w drzwiach, a mnie liczono pośród świętych razem z resztą, ciało wliczone, i do tego właśnie wracam. Z każdego filaru wiszą zielone rzeczy.\n\nTaniec trwa dłużej niż lampy i tańczę go. Posmak wciąż mam w ustach: przegub w moim, obrót, bęben. Ciało postanowiło, że błogosławieństwo było pozwoleniem, i prowadzi tę sprawę.\n\nFilary kapią. Ktoś wciąż śmieje się w przedsionku."
 latria_sexual_frustration_flavor.1238.a: "Trzymać ryt jego słowem i pozwolić odpowiedzieć własnym dłoniom."
 latria_sexual_frustration_flavor.1238.b: "Klęknąć i trwać w czuwaniu, aż bębny zamilkną."
 latria_sexual_frustration_flavor.1238.c: "Czytać własny tekst rytu, aż słowa utrzymają."

 latria_sexual_frustration_flavor.1239.t: "Świt na stepie"
 latria_sexual_frustration_flavor.1239.desc: "Wyjeżdżamy przed słońcem, z kumysem w bukłaku i niebem tak niebieskim, jak bywa tylko tutaj, bez krawędzi nigdzie. Sokół siedzi mi na przegubie, a trawa jest głośna od owadów. Od czasu wozów nic nie powiedziano.\n\nJeden jeździec wstrzymał konia przy mnie na grani i nie pojechał dalej. Noga tej osoby jest przy mojej, oba konie parskają, a przed nami otwarty kraj, bez muru i bez kapłana w promieniu dnia. To nigdy nie zmniejszyło tęsknoty.\n\nSokół przestępuje z nogi na nogę. Jeździec czeka."
 latria_sexual_frustration_flavor.1239.a: "Skręcić z tą osobą i pozwolić trawie to zatrzymać."
 latria_sexual_frustration_flavor.1239.b: "Skinąć, jechać dalej i włożyć między nas pracę dnia."
 latria_sexual_frustration_flavor.1239.c: "Siedzieć w siodle i oddychać, aż dłonie będą pewne."

 latria_sexual_frustration_flavor.1240.t: "Bicz i woda"
 latria_sexual_frustration_flavor.1240.desc: "Bicz leży na ławie, gdzie został odłożony, a zimna woda stoi w miednicy. Moja wiara mówi wprost, że ciało trzeba złamać do posłuszeństwa. Nigdy nie widzę, żeby to łamanie brało.\n\nUżywam obu. Woda wstrząsa, ramiona pieką, a potem tęsknota wciąż jest za żebrami, całkiem niewzruszona. Tego nikt nie mówi głośno: nie da się jej wybiczować.\n\nMiednica kapie na płyty. Dłonie mam pewne na ławie."
 latria_sexual_frustration_flavor.1240.a: "Odłożyć bicz i wziąć tęsknotę we własne ręce."
 latria_sexual_frustration_flavor.1240.b: "Wziąć bicz znowu i być posłusznym."
 latria_sexual_frustration_flavor.1240.c: "Czytać z nauczycielem, aż słowa będą głośniejsze."
