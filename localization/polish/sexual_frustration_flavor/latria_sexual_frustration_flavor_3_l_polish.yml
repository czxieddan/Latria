l_polish:
 latria_sexual_frustration_flavor.1201.t: "Godzina bez gościa"
 latria_sexual_frustration_flavor.1201.desc.female: "Czekam przy oknie w nocnej koszuli, aż herbata stygnie. Nikt nie obiecał spotkania, a ja wciąż robię dla niego miejsce w myślach."
 latria_sexual_frustration_flavor.1201.desc.male: "Czekam przy oknie w nocnej koszuli. Przez dziedziniec przechodzi tylko nocna straż. Nikt nie przyjdzie, lecz nie chcę jeszcze gasić świecy."
 latria_sexual_frustration_flavor.1201.desc: "Knot dogasa. Za oknem nic się nie porusza."
 latria_sexual_frustration_flavor.1201.a: "Zapisać słowa, które chciało się wypowiedzieć."
 latria_sexual_frustration_flavor.1201.b: "Zgasić świecę, stłumić tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1202.t: "Szepty przed łaźnią"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Z łaźni dobiega śmiech, niezakłócony tym, kto z kim przyszedł. To powinien być zwyczajny widok, a jednak przypomina mi, jak dawno nie było mi tak swobodnie."
 latria_sexual_frustration_flavor.1202.desc.strict: "Przed łaźnią kilkoro szlachciców rozmawia o tym, kto musi kogo unikać. Słyszę swoje imię i rozmowa zamiera."
 latria_sexual_frustration_flavor.1202.desc: "W łaźni rozbrzmiewa plusk wody. Bardziej rozpraszają mnie głosy na zewnątrz."
 latria_sexual_frustration_flavor.1202.a: "Opowiadać o upragnionym spotkaniu, pozwalając opowieści ciągnąć się bez końca."
 latria_sexual_frustration_flavor.1202.b: "Odsunąć tę myśl, podziękować im i odejść."

 latria_sexual_frustration_flavor.1203.t: "Cisza po modlitwie"
 latria_sexual_frustration_flavor.1203.desc.favors: "Kapłan mówi, że pożądanie samo w sobie nie jest grzechem. Chcę mu wierzyć, lecz pustka w moim sercu pozostaje."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Kapłan mówi o cnocie czystości, a potem milknie. Klęczę na miejscu ze znajomą modlitwą na ustach i myślami daleko stąd."
 latria_sexual_frustration_flavor.1203.desc: "Modlitwa dobiegła końca. Dzwony świątyni wciąż brzmią mi w uszach."
 latria_sexual_frustration_flavor.1203.a: "Na razie odłożyć naukę o wstrzemięźliwości."
 latria_sexual_frustration_flavor.1203.b: "Stłumić tę myśl i ponownie zacząć modlitwę."

 latria_sexual_frustration_flavor.1204.t: "Niepokój po łowach"
 latria_sexual_frustration_flavor.1204.desc.lustful: "W samotności, bez ubrania w swojej komnacie, wciąż słyszę echo cięciwy. Ciało jest zmęczone, lecz myśli podążają za każdym cieniem na łowisku."
 latria_sexual_frustration_flavor.1204.desc.chaste: "W samotności, bez ubrania w swojej komnacie, próbuję wrócić myślami do modlitwy i obowiązków. Za każdym razem, gdy zamykam oczy, tęsknota powraca."
 latria_sexual_frustration_flavor.1204.desc: "Łowisko jest puste, lecz mój niepokój nie ustępuje."
 latria_sexual_frustration_flavor.1204.a: "Przypomnieć sobie tę sylwetkę z łowiska."
 latria_sexual_frustration_flavor.1204.b: "Ubrać się, wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1205.t: "Zamknięta pracownia"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Każę opuścić pracownię, pozostawiając mapy, pieczęcie i niedokończone dokumenty. Wyciągam z szuflady stary list, lecz nie potrafię zmusić się do ponownej lektury."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Trasa i warty są spisane na stole. Towarzysze czekają za drzwiami; wszyscy mają wyznaczony czas odpoczynku, lecz gdy przychodzi kolej na mnie, powraca myśl o starym liście."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Siedzę samotnie w pracowni. Ani rachunki, ani święta księga nie są zamknięte. Między stronami leży stary list. Raz po raz sięgam po niego i cofam rękę."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Służba czeka za drzwiami pracowni. Zabraniam im przeszkadzać. Pieczęcie i dokumenty leżą przede mną, lecz stary list wciąż nie wrócił do szuflady."
 latria_sexual_frustration_flavor.1205.desc: "Zamykam drzwi pracowni, pozostawiając na stole stary list i niedokończoną pracę."
 latria_sexual_frustration_flavor.1205.a: "Zostawić pracę do jutra i znów przeczytać list."
 latria_sexual_frustration_flavor.1205.b: "Stłumić dawną tęsknotę i zająć się obowiązkami."

 latria_sexual_frustration_flavor.1206.t: "Plotki na uczcie"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Ktoś na uczcie wspomina kochanka tak swobodnie, jakby mówił o pogodzie. Chcę zbyć to śmiechem, po czym dostrzegam, jak dawno nie zdarzyło mi się dołączyć do takiej rozmowy."
 latria_sexual_frustration_flavor.1206.desc.strict: "Kilku szlachciców rozmawia o dworzaninie, który stracił łaski wskutek niestosownego zachowania, i jeden z nich wspomina moje imię. Wygładzam rękaw i nie dołączam do rozmowy."
 latria_sexual_frustration_flavor.1206.desc: "Muzyka rozbrzmiewa wśród towarzystwa. Bardziej rozprasza mnie ich rozmowa."
 latria_sexual_frustration_flavor.1206.a: "Opowiedzieć całą dawną historię, powtarzając nawet słowa wypowiedziane na osobności."
 latria_sexual_frustration_flavor.1206.b: "Powstrzymać język, ukłonić się towarzyszom przy stole i odejść."

 latria_sexual_frustration_flavor.1207.t: "Puste miejsce po modlitwie"
 latria_sexual_frustration_flavor.1207.desc.favors: "Po nabożeństwie kapłan zostawia księgę na ławie i odchodzi. Moja wiara nie potępia pożądania, a jednak nie potrafię uspokoić myśli."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Kapłan odszedł, lecz ja wciąż klęczę. Nauka o czystości jest jasna; moja tęsknota nie osłabła."
 latria_sexual_frustration_flavor.1207.desc: "W cichej świątyni pozostajemy tylko ja i świeca."
 latria_sexual_frustration_flavor.1207.a: "Opuścić świątynię i wrócić myślami do tego uczucia."
 latria_sexual_frustration_flavor.1207.b: "Powściągnąć pożądanie i ponownie przeczytać nakazy."

 latria_sexual_frustration_flavor.1208.t: "Pościg przez las"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Zwierzyna przemyka między drzewami, a pozostali ruszają w pościg. Jadę za nimi, choć inna tęsknota wciąż zaprząta mi myśli."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Ściągam wodze i przypominam sobie, że przybywam tu tylko na łowy. Ogary oddalają się, lecz myśli nie ustępują."
 latria_sexual_frustration_flavor.1208.desc: "Towarzysze zatrzymują się między drzewami, czekając na moje słowo, by kontynuować pościg."
 latria_sexual_frustration_flavor.1208.a: "Pozwolić pozostałym jechać przodem, a myślom błądzić."
 latria_sexual_frustration_flavor.1208.b: "Zebrać myśli i poprowadzić dalsze łowy."

 latria_sexual_frustration_flavor.1209.t: "Żar przy oknie"
 latria_sexual_frustration_flavor.1209.desc.female: "Siedzę w nocnej koszuli przy oknie, a w palenisku zostaje tylko żar. Słowa niewypowiedziane za dnia teraz do mnie wracają."
 latria_sexual_frustration_flavor.1209.desc.male: "W nocnej koszuli opieram się o okno i patrzę, jak nocna straż przechodzi przez dziedziniec. Nieodwzajemnione uczucie nie opuszcza moich myśli."
 latria_sexual_frustration_flavor.1209.desc: "Za oknem jest cicho. Ogień dogasa, lecz nie chce mi się spać."
 latria_sexual_frustration_flavor.1209.a: "Przelać myśli na papier."
 latria_sexual_frustration_flavor.1209.b: "Podsycić ogień, odsunąć tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1210.t: "Nikt nie puka"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Służba odłożyła koronę. Siedzę przy łóżku w nocnej koszuli; ciężar cesarstwa nie pozwala zapomnieć o tym, czego nie potrafię wypowiedzieć."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Towarzysze położyli się w gospodzie. Siedzę w nocnej koszuli przy niewysłanym liście; jutro ruszamy dalej, ale ta troska pojedzie ze mną."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Wieszam szaty przy łóżku i siadam samotnie w nocnej koszuli. Ślub wciąż brzmi mi w uszach, lecz myśli nie cichną."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Odświętne szaty są odłożone. Siedzę przy łóżku w nocnej koszuli; strażnicy za drzwiami nie słyszą westchnienia, a urząd nie rozwiąże tej prywatnej sprawy."
 latria_sexual_frustration_flavor.1210.desc: "Jest późno, a ja wciąż tkwię sam na sam z tą troską."
 latria_sexual_frustration_flavor.1210.a: "Mimo późnej pory wezwać zaufaną osobę i długo porozmawiać."
 latria_sexual_frustration_flavor.1210.b: "Stłumić tęsknotę, zgasić świecę i położyć się."

 latria_sexual_frustration_flavor.1202.c: "Zmienić temat i zapytać o towarzyszy."
 latria_sexual_frustration_flavor.1202.d: "Zaprosić wszystkich na herbatę i rozmawiać do znużenia."
 latria_sexual_frustration_flavor.1203.c: "Poprosić kapłana, by został i wspólnie studiował nauki."
 latria_sexual_frustration_flavor.1204.c: "Włożyć nocną koszulę i spokojnie rozważyć myśli z całego dnia."
 latria_sexual_frustration_flavor.1205.c: "Rozplanować warty i pozwolić sobie na chwilę odpoczynku."
 latria_sexual_frustration_flavor.1205.d: "Spisać jutrzejsze obowiązki jeden po drugim."
 latria_sexual_frustration_flavor.1206.c: "Skierować rozmowę na inny tor nowym wierszem."
 latria_sexual_frustration_flavor.1207.c: "Usiąść przed świętą księgą i dokończyć ten rozdział."
 latria_sexual_frustration_flavor.1208.c: "Dać koniom odpocząć i bez pośpiechu zbadać ślady."
 latria_sexual_frustration_flavor.1209.c: "Podsycić ogień, zaparzyć herbatę i poczytać starą księgę."
 latria_sexual_frustration_flavor.1209.d: "Ułożyć wiersz z niewypowiedzianych słów."
 latria_sexual_frustration_flavor.1210.c: "Zaplanować jutro i uporządkować każde zadanie."
