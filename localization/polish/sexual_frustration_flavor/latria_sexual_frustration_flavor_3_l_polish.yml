l_polish:
 latria_sexual_frustration_flavor.1201.t: "Godzina bez gościa"
 latria_sexual_frustration_flavor.1201.desc.female: "Długo czekam przy oknie w nocnej koszuli. Herbata na stole z gorącej robi się letnia, aż na powierzchni osiada cienki kożuszek. Nikt nie umówił się ze mną na to spotkanie. Mimo to zostawiłam zapaloną lampę, pustą czarkę, nawet poprawiłam ustawienie krzesła przy oknie.\n\nPrzez dziedziniec tylko raz przechodzi nocny strażnik. Światło latarni przesuwa się nad murem i znika. Obracam czarkę; herbaty nie da się już pić. Przypominam sobie słowa usłyszane przy ostatnim pożegnaniu: „jeśli znajdzie się czas”. Mogą pasować do każdej nocy albo do żadnej.\n\nKnot wypala się coraz bardziej. Nadal siedzę. Koszula zsuwa mi się z jednego ramienia, lecz jej nie podciągam."
 latria_sexual_frustration_flavor.1201.desc.male: "Długo czekam przy oknie w nocnej koszuli. Na dziedzińcu słychać tylko kroki nocnej straży, oddalające się i znów wracające. Nikt nie przyjdzie. Mimo to zostawiam lampę zapaloną, jakby mogła dopełnić zaproszenia, którego nie wypowiedziałem.\n\nHerbata wystygła. Biorę łyk i krzywię się od goryczy, lecz wypijam resztę. Na dnie zostaje kilka listków. Przyglądam się im, jakby mogły mi powiedzieć, czy ta osoba spędza dzisiejszą noc gdzie indziej. Wiatr za oknem przygina gałąź, potem ją puszcza.\n\nKładę dłoń na ramie okna. Drewno jest zimne. Chłód przenika przez rękę, ale nie gasi ciepła, które czuję w sobie."
 latria_sexual_frustration_flavor.1201.desc: "Knot staje się coraz krótszy, a za oknem wciąż nic się nie dzieje.\n\nPodnoszę go raz. Płomień na chwilę rośnie, po czym szybko znów opada. Na stole mam papier, pióro i czarkę herbaty, która nie nadaje się już do picia. Sięgam po każdą z tych rzeczy, lecz żadna nie zmienia tej nocy.\n\nW końcu po prostu siedzę i słucham, jak mój oddech wypełnia ciszę."
 latria_sexual_frustration_flavor.1201.a: "Zapisać słowa, które chciało się wypowiedzieć."
 latria_sexual_frustration_flavor.1201.b: "Zgasić świecę, stłumić tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1202.t: "Szepty przed łaźnią"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Rozmowy i śmiech przed łaźnią nie cichną przez to, kto z kim przychodzi. Ze szpary w drzwiach wydobywa się para pachnąca środkiem do mycia i rozgrzanym kamieniem. Mija mnie ktoś z mokrymi włosami i luźno przewiązaną szatą. Nikt nie poświęca temu drugiego spojrzenia.\n\nTaka zwyczajność powinna pozostawić mnie obojętnie. Tymczasem stoję przed progiem i przypominam sobie, jak dawno nie było mi dane równie swobodnie zbliżyć się do drugiej osoby. W środku ktoś ze śmiechem woła czyjeś imię. Głos brzmi, jakby jego właściciel dopiero wyszedł z wody. Moje palce zatrzymują się na framudze.\n\nWiatr niesie parę prosto na moją twarz. Ani nie wchodzę, ani nie odchodzę."
 latria_sexual_frustration_flavor.1202.desc.strict: "Przed łaźnią kilkoro możnych rozmawia o tym, kto powinien kogo unikać. Słyszę własne imię i rozmowa natychmiast się urywa. Za drzwiami nadal pluszcze woda. Przed nimi robi się tak cicho, że słychać szelest ubrań.\n\nKtoś kiwa mi głową, zbyt pospiesznie. Ktoś inny poprawia rękaw, który już leży zupełnie równo. Wiem, jakiego rodzaju sprawy właśnie omawiano. Uszy robią mi się gorące i nie jest to wina pary z łaźni.\n\nPrzez chwilę stoję bez ruchu. Kolejne pluski zza drzwi zdają się odmierzać długość tego milczenia."
 latria_sexual_frustration_flavor.1202.desc: "W łaźni woda pluszcze bez przerwy, lecz to zasłyszane przy wejściu głosy bardziej mnie rozpraszają.\n\nPrzychodzę tylko umyć twarz. Przy drzwiach słyszę cichą rozmowę ze środka, przerwaną w połowie śmiechem. Nie jest głośny, a jednak zatrzymuje mnie w miejscu. Nie wiem, co ich bawi. Wiem tylko, że nie należy tu stać i podsłuchiwać.\n\nMimo to słucham do końca zdania. Potem moja twarz jest gorętsza niż trzymany w dłoni ręcznik."
 latria_sexual_frustration_flavor.1202.a: "Opowiadać o upragnionym spotkaniu, pozwalając opowieści ciągnąć się bez końca."
 latria_sexual_frustration_flavor.1202.b: "Odsunąć tę myśl, podziękować im i odejść."

 latria_sexual_frustration_flavor.1203.t: "Cisza po modlitwie"
 latria_sexual_frustration_flavor.1203.desc.favors: "Kapłan mówi, że ludzkie pragnienia nie są grzechem z samej natury. Dźwięk dzwonu jeszcze krąży pod belkami, a on już zamyka księgę i zostawia mi chwilę ciszy.\n\nChcę mu wierzyć. Pustka we mnie jednak wcale się nie zmniejsza. Klęczę w tym samym miejscu i patrzę na swoje dłonie. Za dnia rozdają innym chleb, nocą pragną tylko uchwycić kogoś, kogo tu nie ma. Wiara na to pozwala, lecz samo przyzwolenie nie wkłada niczyjej ręki w moją.\n\nKapłan czeka na pytanie. Nie potrafię go zadać. Odsuwam tylko włosy z czoła."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Kapłan mówi o cnocie wstrzemięźliwości, po czym milknie. Ta cisza ciąży bardziej niż napomnienie. Nadal klęczę; poduszka pod kolanami już się ogrzała. Modlitwa jest znajoma, ale myślami pozostaję daleko, na którejś drodze poza świątynią.\n\nWiem, że należy odpowiedzieć. W gardle mam jednak tylko oddech, który uchodząc, zmienia się w ciche „tak”. Kapłan spogląda na mnie i nie pyta dalej. Od tego spojrzenia moja odpowiedź wydaje się jeszcze mniej przekonująca.\n\nDzwon milknie. W świątyni zostają tylko sporadyczne trzaski knotów."
 latria_sexual_frustration_flavor.1203.desc: "Modlitwa się skończyła, lecz echo dzwonu nadal krąży po świątyni.\n\nPozostali już wstali. Ja nadal klęczę, jakby zabrakło mi jednego zdania. Żadnego przecież nie brakuje; po ostatnich słowach wciąż tylko czuję to samo ciepło. Nie odchodzi wraz z modlitwą ani wraz z ludźmi.\n\nPrzyciskam dłoń do kamiennej płyty. Kamień jest zimny, ale jego chłód dochodzi tylko do nadgarstka. Dalej już nie sięga."
 latria_sexual_frustration_flavor.1203.a: "Na razie odłożyć naukę o wstrzemięźliwości."
 latria_sexual_frustration_flavor.1203.b: "Stłumić tę myśl i ponownie zacząć modlitwę."

 latria_sexual_frustration_flavor.1204.t: "Niepokój po łowach"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Jestem w sypialni bez towarzystwa i bez ubrania. W uszach nadal brzmi mi cięciwa. Strój myśliwski leży rzucony na krzesło, błoto na butach jeszcze nie wyschło. Czuję zmęczenie w nogach i ramionach, lecz myśli zajmuje coś innego.\n\nZa dnia ktoś minął mnie konno między drzewami. Tylko mijanie się, nawet rękawy się nie zetknęły. A jednak odtwarzam tę chwilę bez końca: dłoń ściągającą wodze, lekki uśmiech przy odwróceniu głowy, wzrok uciekający zaraz potem. Teraz w izbie nie ma konia ani tej osoby, jest tylko moje odbicie w spiżowym zwierciadle.\n\nSiadam na brzegu łóżka. Dopiero gdy mata dotyka skóry, przypominam sobie, że pora coś na siebie narzucić."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Jestem w sypialni bez towarzystwa i bez ubrania. Próbuję zwrócić myśli ku modlitwie i obowiązkom. Strój myśliwski leży złożony z boku; nie znajduję nawet czasu, by najpierw obmyć twarz. Za każdym zamknięciem oczu tęsknota wraca, wyraźniejsza niż tropy zwierząt w lesie.\n\nPowtarzam w myślach słowa ślubu. W połowie wtrąca się obraz tamtej osoby odwracającej głowę między drzewami i słowa się urywają. Otwieram oczy i patrzę na dłonie. Nadal drżą; nie wiem, czy ze zmęczenia po łowach, czy z innej przyczyny.\n\nZa drzwiami sługa pyta, czy przynieść gorącej wody. Odpowiadam. Mój głos brzmi bardziej chrapliwie, niż się spodziewam."
 latria_sexual_frustration_flavor.1204.desc: "Łowisko już opustoszało, a niepokój we mnie wciąż nie chce ucichnąć.\n\nWracam do izby, odkładam łuk i rękawicę. Tamtego spojrzenia z dnia nie potrafię odłożyć. W pokoju czuć błoto i pot. Dopiero po chwili stania dostrzegam, że cały czas patrzę na drzwi, jakby ktoś miał wejść za mną.\n\nNikt nie wchodzi. Drzwi zostały zamknięte moją własną ręką."
 latria_sexual_frustration_flavor.1204.a: "Przypomnieć sobie tę sylwetkę z łowiska."
 latria_sexual_frustration_flavor.1204.b: "Ubrać się, wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1205.t: "Zamknięta pracownia"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Każę wszystkim wyjść z pracowni. Zostają mapy, pieczęcie i niedokończone dokumenty. Po zamknięciu drzwi słyszę już tylko własny oddech. Wyciągam z szuflady stary list o postrzępionych rogach.\n\nNie ma w nim spraw państwa. Jest spotkanie, do którego nie doszło, i słowa, przy których zdawało mi się, że czasu mamy pod dostatkiem. Wiele tego czasu już minęło, a list pozostał. Kładę na nim pieczęć, potem ją zdejmuję. Pieczęć jest zimna. Papier wydaje się jeszcze ciepły.\n\nKtoś cicho pyta zza drzwi, czy podać posiłek. Nie odpowiadam."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Trasa i kolejność wart są już zapisane, towarzysze czekają za drzwiami. Wyznaczam wszystkim godziny odpoczynku, lecz gdy przychodzi kolej na mnie, pióro się zatrzymuje. Z szuflady wystaje róg starego listu, jakby umyślnie nie pozwalał się przykryć planem drogi.\n\nWyciągam go. Wystarcza pierwsze powitanie, by wiedzieć, że nie należy czytać go akurat teraz. Ktoś puka i pyta, czy jedziemy do następnego postoju. Odpowiadam, że jedziemy, choć oczy nadal tkwią przy drugim wierszu listu.\n\nW drugim wierszu jest tylko nazwa miejscowości. Nie leży ona na naszej drodze."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Siedzę samotnie w pracowni. Księga rachunkowa pozostaje otwarta, święta księga również nie jest jeszcze schowana. Między jej kartami tkwi stary list. Już kilka razy wyciągam ku niemu rękę i zaraz ją cofam.\n\nList nie przyszedł dzisiaj. Leży w księdze od dawna, tak dawna, że przy każdej lekturze zatrzymuję się na tej stronie. Dziś wreszcie go wyjmuję. Nie ma na papierze żadnych niestosownych słów, ale podczas czytania mój oddech i tak traci równy rytm.\n\nKtoś przechodzi krużgankiem. Cicho stukają paciorki modlitewne. Wciskam list z powrotem do księgi; mimo to nadal czuję pod dłonią jego brzeg."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Słudzy czuwają przed drzwiami pracowni. Każę im nie przeszkadzać. Przede mną leżą pieczęcie i dokumenty, lecz stary list wyjęty z szuflady wciąż nie wraca na swoje miejsce.\n\nNależałoby zatwierdzić raport o moście. Pióro zawisa nad papierem, atrament spada i zostawia punkt. Patrzę na niego, aż nagle przypomina mi się zdanie z listu, zupełnie niezwiązane z mostami. Zaledwie kilka słów, a pamiętam dokładnie, w którym stały wierszu.\n\nKtoś za drzwiami przestępuje z nogi na nogę. Odsuwam raport i sięgam w stronę szuflady."
 latria_sexual_frustration_flavor.1205.desc: "Zamykam drzwi pracowni. Na stole pozostają stary list i niedokończone sprawy.\n\nZasuwa opada bardzo cicho. Kiedy ten dźwięk gaśnie, zostaję już tylko z papierami. Dokumenty układam po lewej, list po prawej. Patrzę na nie przez chwilę i przesuwam list na środek.\n\nKnot trzaska. Nie sięgam, żeby go przyciąć."
 latria_sexual_frustration_flavor.1205.a: "Zostawić pracę do jutra i znów przeczytać list."
 latria_sexual_frustration_flavor.1205.b: "Stłumić dawną tęsknotę i zająć się obowiązkami."

 latria_sexual_frustration_flavor.1206.t: "Plotki na uczcie"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Ktoś na uczcie mówi o kochanku tak swobodnie, jakby opowiadał o pogodzie. Po kolejnej rundzie wina w opowieści zmieniają się dwa imiona, a wszyscy nadal się śmieją. Nikt nie ścisza głosu.\n\nZamierzam zbyć to śmiechem. W jego połowie dostrzegam jednak, jak dawno nie uczestniczę w podobnych pogawędkach. Tak dawno, że muszę spojrzeć na innych, by wiedzieć, gdzie odstawić puchar. Sąsiad pyta, czy i ja mam jakąś historię do opowiedzenia. Moje palce nieruchomieją na brzegu naczynia.\n\nMuzyka dochodzi przez tłum. Słyszę ją, ale nie rozpoznaję melodii."
 latria_sexual_frustration_flavor.1206.desc.strict: "Kilku możnych opowiada o towarzyszu, który przez uchybienie obyczajom utracił łaski. Potem ktoś wymienia moje imię. Rozmowa nie urywa się całkiem; tylko głośne słowa przechodzą w szepty. Opuszczam wzrok, poprawiam rękaw i nie dołączam.\n\nTa historia wcale nie musi być prawdziwa. Prawda przestała już mieć znaczenie. Istotne jest to, że we mnie naprawdę tkwi sprawa, której nie wolno wyłożyć przy tym stole, a ich oczy zdają się już ją widzieć. Dopijam wino. Jego gorąco czuję na twarzy, nie w gardle.\n\nKtoś podnosi puchar, chcąc zmienić temat. Gdy naczynia się zderzają, moja ręka mimo wszystko drga."
 latria_sexual_frustration_flavor.1206.desc: "Muzyka dociera do mnie przez tłum, lecz to rozmowy przy stole bardziej mnie rozpraszają.\n\nSiedzę na swoim miejscu i słucham, jak wątki krążą ze wszystkich stron, aż w końcu każdy dochodzi do zasłon łóżka i prywatnych listów. Ktoś się śmieje, ktoś kaszle, ktoś zerka na mnie kątem oka. Nie wiem, czy to spojrzenie jest przypadkowe.\n\nObracam pusty puchar. Jego spód cicho szura po stole."
 latria_sexual_frustration_flavor.1206.a: "Opowiedzieć całą dawną historię, powtarzając nawet słowa wypowiedziane na osobności."
 latria_sexual_frustration_flavor.1206.b: "Powstrzymać język, ukłonić się towarzyszom przy stole i odejść."

 latria_sexual_frustration_flavor.1207.t: "Puste miejsce po modlitwie"
 latria_sexual_frustration_flavor.1207.desc.favors: "Po obrzędzie kapłan zostawia księgę na siedzisku i odchodzi. W pustym miejscu nadal widać wgłębienie po jego siedzeniu. Nasza wiara nie uznaje pragnienia za grzech; właśnie takie zdanie znajduje się na dopiero co czytanej przeze mnie stronie. Atrament jest wyraźny.\n\nNadal jednak nie wiem, jak znaleźć spokój. Przyzwolenie to jedno, a noc spędzana tylko z własnymi dłońmi to drugie. Stoję przez chwilę przy pustym miejscu. Nie siadam ani nie zamykam księgi.\n\nWiatr porusza drzwiami świątyni, zostawiając wąską szparę. Wpada przez nią światło, prosto na tamten wiersz."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Kapłan odszedł, a ja nadal klęczę w tym samym miejscu. Nauki o czystości są jasne i jednoznaczne, każdą potrafię powtórzyć z pamięci. Tęsknota nie wyszła jednak razem z nim. Została między moimi kolanami a dłońmi, odczuwalna aż nazbyt wyraźnie.\n\nPatrzę na puste siedzisko i nagle zazdroszczę desce, że nie musi o niczym myśleć. Ja nie potrafię. Opieram o nią czoło, lecz nadal czuję tylko własne ciepło.\n\nŚwieca wypaliła się jeszcze trochę. Wciąż klęczę."
 latria_sexual_frustration_flavor.1207.desc: "W świątyni zostaję tylko ja i niezgaszone świece.\n\nKroki pozostałych już się oddaliły. Mogę teraz wyjść, przymknąć drzwi i zostawić tę stronę za sobą. Nie robię tego. Przechodzę dwa kroki między pustymi miejscami, po czym wracam na tę samą poduszkę.\n\nPłomień pali się spokojnie. Ja słyszę w uszach własną pulsującą krew."
 latria_sexual_frustration_flavor.1207.a: "Opuścić świątynię i wrócić myślami do tego uczucia."
 latria_sexual_frustration_flavor.1207.b: "Powściągnąć pożądanie i ponownie przeczytać nakazy."

 latria_sexual_frustration_flavor.1208.t: "Pościg przez las"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Zwierzyna przemyka między drzewami i wszyscy ruszają w pościg. Popędzam konia za nimi. Gałęzie uderzają o rękawy, dociera do mnie zapach końskiego potu. Dopiero po kilkuset krokach dostrzegam, że wcale nie ścigam zwierzęcia.\n\nPrzede mną jedzie czyjaś sylwetka. To tylko osoba towarzysząca mi na łowach, nic więcej. A jednak z każdym jej pochyleniem i wyprostowaniem mój wzrok mocniej się do niej przywiązuje, aż mijam rozstaje. Szczekanie psów odchodzi w lewo. Mój koń nadal biegnie prosto.\n\nŚciągam wodze. Osoba przede mną nie ogląda się za siebie. Mój oddech nie brzmi już jak po zwykłym pościgu za zwierzyną."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Ściągam wodze i przypominam sobie, że przyjeżdżam tu wyłącznie polować. Szczekanie psów cichnie w oddali. Ślady kopyt w mokrym błocie są wyraźne, a jednak muszę spojrzeć dwa razy, żeby pojąć, gdzie skręcają.\n\nMyśli nie chcą podążać za śladami. Zatrzymują się przy dłoniach, które przed chwilą pomogły mi dociągnąć popręg. Były pewne, potem po prostu puściły pasek. Nie padło ani słowo. Ja jednak nadaję tamtemu gestowi zupełnie inne znaczenie.\n\nKoń parska. Dopiero teraz dostrzegam, jak długo stoimy bez ruchu."
 latria_sexual_frustration_flavor.1208.desc: "Drużyna zatrzymuje się między drzewami i czeka na moją decyzję, czy kontynuować tropienie.\n\nWszystkie twarze są zwrócone ku mnie. Z uprzęży jeszcze kapie woda, ktoś ociera czoło. Patrzę na ślady w ziemi. Są wyraźne, lecz moja odpowiedź taka nie jest. Połową myśli nadal tkwię na drugim końcu lasu, przy osobie, która nie ma nic wspólnego ze zwierzyną.\n\nMiędzy drzewami przechodzi podmuch. Trzymam wodze i nie odzywam się od razu."
 latria_sexual_frustration_flavor.1208.a: "Pozwolić pozostałym jechać przodem, a myślom błądzić."
 latria_sexual_frustration_flavor.1208.b: "Zebrać myśli i poprowadzić dalsze łowy."

 latria_sexual_frustration_flavor.1209.t: "Żar przy oknie"
 latria_sexual_frustration_flavor.1209.desc.female: "Siedzę w nocnej koszuli przy oknie. W palenisku została tylko wąska smuga żaru. Słowa, których nie wypowiedziałam za dnia, znów dochodzą mi do ust i znów się cofają. Zdanie jest krótkie; długo trwało tylko powstrzymywanie go aż do teraz.\n\nŻar od czasu do czasu rozbłyska i oświetla dłonie na moich kolanach. Palce bezwiednie ściskają brzeg koszuli, gniotąc materiał. Przypominam sobie podmuch od czyjegoś rękawa, gdy ta osoba mijała mnie dzisiaj. Tylko podmuch, a jednak wciąż pamiętam, z której nadszedł strony.\n\nZa oknem strażnik obwieszcza godzinę. Nie odpowiadam i wcale nie mam ochoty spać."
 latria_sexual_frustration_flavor.1209.desc.male: "W nocnej koszuli opieram się o ramę okna i patrzę na światła nocnej straży na dziedzińcu. Mijają jedno po drugim, jakby dzieliły noc na krótkie odcinki. Uczucie bez odpowiedzi nie daje się tak podzielić. Zostaje w mojej piersi w całości.\n\nOpieram czoło o kratę okna. Drewno pachnie starą farbą. Pamiętam, jak podczas rozmowy wzrok tej osoby uciekał gdzie indziej, jakby spojrzenie na mnie miało nadać słowom inny sens. Wtedy także odwróciłem oczy. Potem nic już między nami nie padło.\n\nWęgiel w palenisku trzaska i osuwa się trochę niżej."
 latria_sexual_frustration_flavor.1209.desc: "Za oknem panuje cisza, ogień przygasa, a ja nie czuję najmniejszej senności.\n\nDokładam mały kawałek drewna. Ogień nie rośnie, pojawia się tylko odrobina dymu. Jego zapach zostaje na nocnej koszuli. Wracam pod okno i jeszcze raz powtarzam w myślach zdanie, które za dnia nie trafiło do adresata. Kiedy kończę, nadal nikt go nie słucha.\n\nCiemność zalega na dziedzińcu. Patrzę na nią, lecz ona nie odwzajemnia spojrzenia."
 latria_sexual_frustration_flavor.1209.a: "Przelać myśli na papier."
 latria_sexual_frustration_flavor.1209.b: "Podsycić ogień, odsunąć tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1210.t: "Nikt nie puka"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Przyboczni schowali już koronę. Siedzę bez towarzystwa na skraju łóżka, w nocnej koszuli. Granice cesarstwa, rejestry podatków i osoby, które mam jutro przyjąć, nie zdołały wyprzeć tej prywatnej sprawy. Zajmuje drugi koniec łóżka, choć przecież nikogo tam nie ma.\n\nPatrzę na pustą połowę. Poduszka jest gładka, róg przykrycia również. Sama ta staranność wydaje się wyrzutem. Kładę tam dłoń. Materiał jest chłodny, lecz nawet kiedy czuję już ten chłód, nie cofam ręki.\n\nW krużganku gaśnie jedna lampa. Nikt nie przychodzi zapukać do moich drzwi."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Towarzysze położyli się już w gospodzie. Ja siedzę w nocnej koszuli nad niewysłanym listem. Jutro znów trzeba ruszać, konie są już nakarmione. Troski nie uda się tu zostawić; wejdzie do tobołka i pojedzie ze mną aż do następnego brodu.\n\nObracam list pod lampą. Powitanie jest zapisane zbyt ciężką ręką, żeby uznać go za coś, co można po prostu wysłać po drodze. Na dole ktoś reguluje rachunek. Przez chwilę brzęczą miedziane monety. Gdy dźwięk cichnie, w pokoju robi się jeszcze ciszej.\n\nWsuwam list między ubrania. Nadal dokładnie wiem, w której warstwie leży."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Wieszam szaty obrzędowe przy łóżku i siadam w nocnej koszuli w pustej izbie. W uszach jeszcze brzmią słowa ślubu, dopiero co wypowiedziane przeze mnie. Nie przynoszą spokoju. Sznur modlitewny długo pozostaje nieruchomy między palcami, na tym samym paciorku.\n\nPragnę poświęcić tę noc temu, czemu należy. Lecz za każdym razem, gdy udaje mi się wyciszyć, przed oczami pojawia się twarz, dla której nie powinno być miejsca w modlitwie. Zaciskam paciorki w dłoni. Nawet kiedy zaczynają boleśnie uwierać, twarz nie znika.\n\nDrzwi izby nie są dokładnie zaryglowane. Przez szparę wpada wiatr i płomień się przechyla."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Odświętne szaty już schowano. W nocnej koszuli pozostaję przy łóżku. Straż za drzwiami nie słyszy mojego westchnienia, a władza nie potrafi uspokoić tej troski. Próbuję przejść w myślach przez jutrzejszą audiencję. Przy trzeciej osobie nie umiem iść dalej.\n\nTa trzecia osoba nie ma nic wspólnego z audiencją. Mimo to właśnie na niej zatrzymuję kolejność. Lampa przy łóżku rzuca mój cień na ścianę. Siedzi prościej ode mnie.\n\nOpuszczam knot. Cień staje się niższy, a ja nadal siedzę."
 latria_sexual_frustration_flavor.1210.desc: "Noc jest już późna, a ja nadal zostaję ze swoją troską bez towarzystwa.\n\nDrzwi są zamknięte, lampa płonie, łóżko mieści tylko mnie. Te trzy rzeczy się nie zmieniają. Zmienia się to, że przestaję udawać rychły sen. Kładę wierzchnią szatę na oparciu krzesła, potem znów ją podnoszę, jakby ktoś miał za chwilę zawołać mnie na zewnątrz.\n\nNikt nie woła. Ponownie odkładam ubranie na oparcie."
 latria_sexual_frustration_flavor.1210.a: "Mimo późnej pory wezwać zaufaną osobę i długo porozmawiać."
 latria_sexual_frustration_flavor.1210.b: "Stłumić tęsknotę, zgasić świecę i położyć się."

 latria_sexual_frustration_flavor.1202.c: "Zmienić temat i zapytać o towarzyszy."
 latria_sexual_frustration_flavor.1202.d: "Zaprosić wszystkich na herbatę i rozmawiać do znużenia."
 latria_sexual_frustration_flavor.1203.c: "Poprosić kapłana, by został i wspólnie studiował nauki."
 latria_sexual_frustration_flavor.1204.c: "Włożyć nocną koszulę i spokojnie rozważyć myśli z całego dnia."
 latria_sexual_frustration_flavor.1205.c: "Rozplanować warty i pozwolić sobie na chwilę odpoczynku."
 latria_sexual_frustration_flavor.1205.d: "Spisać jutrzejsze obowiązki jeden po drugim."
 latria_sexual_frustration_flavor.1206.c: "Skierować rozmowę na inny tor nowym wierszem."
 latria_sexual_frustration_flavor.1207.c: "Usiąść przed świętą księgą i dokończyć ten rozdział."
 latria_sexual_frustration_flavor.1208.c: "Dać koniom odpocząć i bez pośpiechu zbadać ślady."
 latria_sexual_frustration_flavor.1209.c: "Podsycić ogień, zaparzyć herbatę i poczytać starą księgę."
 latria_sexual_frustration_flavor.1209.d: "Ułożyć wiersz z niewypowiedzianych słów."
 latria_sexual_frustration_flavor.1210.c: "Zaplanować jutro i uporządkować każde zadanie."
