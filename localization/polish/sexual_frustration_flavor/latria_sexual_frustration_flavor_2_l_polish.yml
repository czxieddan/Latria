 latria_sexual_frustration_flavor.1101.t: "Bezsenność pod baldachimem"
 latria_sexual_frustration_flavor.1101.desc.female: "Budzę się z płytkiego snu. Nocna koszula zsunęła się na koniec łóżka, ramiona i kolana wystają poza zasłony. Pod baldachimem nie ma nikogo oprócz mnie. Sama rozkopałam przykrycie, a na poduszce zostało tylko jedno wgłębienie.\n\nPrzyciągam koszulę z powrotem. Materiał ociera się o skórę, ale ciepło nie ustępuje. Nocna straż zdążyła już dwa razy obwieścić godzinę. Chcę odwrócić się na bok i znów zasnąć, lecz kiedy zamykam oczy, widzę kark tej osoby, gdy odwracała się za dnia. Haczyk zasłony brzęka, jakby ktoś uchylił jej róg. Nikogo nie ma.\n\nKładę się na wznak i nie wiem, gdzie podziać ręce. Noc jeszcze długa, ale sen już odszedł."
 latria_sexual_frustration_flavor.1101.desc.male: "Budzę się z płytkiego snu. Nocna koszula zsunęła się na koniec łóżka. Za zasłonami panuje ciemność; tylko w oddali odzywa się bęben nocnej straży. Przykrycie jest pozwijane w kłąb od mojego przewracania się.\n\nSiadam, po czym znów się kładę. Uporczywe ciepło w podbrzuszu nadal nie ustępuje. Liczę oddechy. Przy siódmym znów przypomina mi się, jak blisko staliśmy podczas tamtej rozmowy. Nic wtedy między nami nie zaszło, a jednak pamiętam tę odległość zbyt dokładnie.\n\nWiatr podnosi róg zasłony i zaraz go opuszcza. Druga strona łóżka pozostaje chłodna."
 latria_sexual_frustration_flavor.1101.desc: "Zasłony łóżka są na wpół opuszczone. Do końca nocy daleko, a moje myśli nadal pozostają w nieładzie.\n\nPodciągam przykrycie pod pierś i znów je odkopuję. Przy poduszce nie ma listu ani drugiej osoby, jest tylko moja dłoń. Czuję w niej ciepło, więc przyciskam ją do maty, żeby trochę ostygła.\n\nStraż ponownie obwieszcza godzinę. Ja wciąż nie śpię."
 latria_sexual_frustration_flavor.1101.a: "Zamknąć oczy i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1101.b: "Odsunąć tę myśl, zaciągnąć zasłony i znów ułożyć się do snu."

 latria_sexual_frustration_flavor.1102.t: "Spojrzenia między tańcami"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Zmieniły się już trzy melodie i kilka razy zmieniło się towarzystwo przy stole. Nikt nie patrzy krzywo na zbyt bliskie kroki w tańcu. Muzykanci nawet zwalniają, żeby można było dokończyć rozmowę.\n\nJa jednak pamiętam tamtą chwilę. Dłoń pozostała na moim nadgarstku odrobinę dłużej, niż wymagał obyczaj, i spojrzenie także nie uciekło od razu. Gdy melodia się skończyła, uścisk zelżał, lecz zostało po nim ciepło palców. Wracam na miejsce. Puchar jest pełny, ale nie piję.\n\nZaczyna się już następny taniec. Patrzę na wolny kawałek podłogi i znów mam ochotę tam podejść."
 latria_sexual_frustration_flavor.1102.desc.strict: "Im bliżej prowadzą nas taneczne kroki, tym bardziej śmiechy wokół przypominają szepty. Przenoszę wzrok na muzykantów, choć moja ręka nadal podąża za cudzą. Rękaw ociera się o rękaw; słyszę to wyraźniej niż uderzenia bębna.\n\nKtoś pochyla się przy stole, żeby coś powiedzieć. Nie wiem, czy mowa o mnie, czy o czymś zupełnie innym. Gdy melodia milknie, od razu cofam się o pół kroku, tak szybko, że niemal zahaczam o własny but. Pada na mnie spojrzenie, lecz żadne pytanie.\n\nKiedy siadam, na nadgarstku nadal czuję odrobinę ciepła. Przykrywam to miejsce drugą dłonią, jakby dzięki temu nikt nie mógł go zauważyć."
 latria_sexual_frustration_flavor.1102.desc: "Muzyka przyspiesza, lecz taneczne kroki nie rozpraszają moich myśli.\n\nWykonuję dwa obroty, ani razu nie myląc kroku, a jednak przez cały czas śledzę, jak blisko jest oddech drugiej osoby. W najwyższym punkcie melodia na chwilę się urywa. W tej chwili żadne z nas nic nie mówi.\n\nMuzykant znów porusza struny. Nadal stoję w tym samym miejscu i nie wiem, w którym momencie zakończyć ten taniec."
 latria_sexual_frustration_flavor.1102.a: "Poprosić o kolejny taniec i przysunąć się nieco bliżej."
 latria_sexual_frustration_flavor.1102.b: "Podziękować ukłonem i wycofać się na skraj sali."

 latria_sexual_frustration_flavor.1103.t: "U drzwi przewodnika"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mój przewodnik duchowy mówi, że tłumienie pragnień nie jest jedyną drogą pobożności. Lampa rzuca nasze dwa cienie na ścianę. Mówi powoli, jakby zostawiał mi miejsce na odpowiedź.\n\nChcę zapytać, czy do tej drogi należy również nocne przebudzenie w samotności, kiedy nie wiadomo, gdzie podziać dłonie. Mam już te słowa na ustach, gdy za drzwiami zatrzymują się kroki. Oboje na chwilę milkniemy. Po chwili kroki oddalają się.\n\nPrzewodnik patrzy na mnie, czekając na dalszy ciąg. Przełykam resztę zdania. Zostaje tylko urwany początek."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mój przewodnik duchowy przypomina, że czystość ma znaczenie także wtedy, gdy nikt nie patrzy. Nie podnosi głosu, lecz izba nagle wydaje mi się ciaśniejsza. Opuszczam głowę i cicho przytakuję, zaciskając palce wewnątrz rękawa.\n\nPyta, dlaczego przychodzę tej nocy. Patrzę na lampę, na drzwi, na czubki własnych butów, tylko nie w jego oczy. Prawda zmieściłaby się w kilku słowach, lecz boję się, że gdy je wypowiem, zaczną się dalsze pytania.\n\nKtoś kaszle za drzwiami. Oddycham z ulgą i zaraz wstydzę się tej ulgi."
 latria_sexual_frustration_flavor.1103.desc: "Lampa słabo oświetla izbę. Dobieram słowa, którymi zwrócę się do mojego przewodnika duchowego.\n\nWypada zapytać o obowiązki. O tę drugą sprawę pytać nie wypada. Jeszcze przed drzwiami obie rozmowy brzmiały w mojej głowie całkiem składnie, lecz po wejściu nie pamiętam ani jednego zdania. Przewodnik nalewa mi wody; jest jeszcze gorąca.\n\nTrzymam naczynie w dłoniach, jego brzeg dotyka moich ust. Słowa nadal nie chcą się wydobyć."
 latria_sexual_frustration_flavor.1103.a: "Przyznać się do tęsknoty i przestać ją skrywać."
 latria_sexual_frustration_flavor.1103.b: "Zapytać tylko o bieżące obowiązki, a resztę przemilczeć."

 latria_sexual_frustration_flavor.1104.t: "Orzeł nie wraca"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Orzeł krąży nad łowiskiem i wciąż nie chce wrócić na rękawicę. Dwukrotnie unoszę ramię, a on za każdym razem tylko przechyla skrzydła i wzlatuje wyżej. Z lasu nadchodzi wiatr pachnący trawą i końskim potem.\n\nNiemal mu zazdroszczę. Nie musi się tłumaczyć ani oglądać za siebie, ani udawać przed wszystkimi, że jego niecierpliwość jest cierpliwością. Sługa pyta, czy schować łuk. Kręcę głową, nadal śledząc ciemny punkt. Im dłużej patrzę, tym mniej przypomina mi on orła, a bardziej kogoś, kto także nie chce wrócić.\n\nRamię już mnie boli. Wciąż go nie opuszczam."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Orzeł krąży i nie zlatuje. Sługa już kilka razy pyta, czy schować łuk, a ja odpowiadam tylko, żeby jeszcze chwilę zaczekać. Jakby od odrobiny czekania zamęt w mojej głowie mógł sam ustąpić.\n\nMyśliwi zsiedli już z koni i podają sobie bukłak w cieniu drzew. Nie ponaglają mnie, lecz szczęk uprzęży raz po raz zdaje się robić to za nich. Wpatruję się w niebo i liczę pod nosem, aż zamiast liczb znów pojawia się to samo imię.\n\nOrzeł krzyczy, ale nadal nie siada. Bardzo powoli przekładam rękawicę na drugą dłoń."
 latria_sexual_frustration_flavor.1104.desc: "Orzeł zwleka z powrotem, a wszyscy myśliwi czekają na moje słowo.\n\nŚciskany gwizdek odciska mi się na dłoni. Podnoszę go do ust i znów opuszczam. Kręgi na niebie robią się coraz mniejsze; nikt nie wie, czy ptak za chwilę wróci.\n\nKtoś cicho pyta, czy już ruszamy. Odpowiadam, nie wiedząc nawet, czy każę jechać, czy dalej czekać."
 latria_sexual_frustration_flavor.1104.a: "Niech orzeł krąży, a moje myśli błądzą."
 latria_sexual_frustration_flavor.1104.b: "Zebrać myśli i przywołać orła do obozu."

 latria_sexual_frustration_flavor.1105.t: "Świece i korona"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Przyboczny wynosi z sypialni ceremonialną koronę. Przy świeczniku leży jeszcze kilka niezatwierdzonych dekretów. Otulam się nocną koszulą i siadam; należałoby zacząć od pisma na wierzchu. Tymczasem moja ręka wyciąga spomiędzy dokumentów niewysłany list.\n\nWidnieje w nim tylko powitanie. Dalej jest pusto. Za dnia trzykrotnie dochodzę podczas pisania do tego samego miejsca i ani razu nie udaje mi się go przekroczyć. W szkatułce odbija się blask korony, jakby wciąż czekała, aż zajmę się cesarskimi obowiązkami. Wygładzam papier, ale nadal nie wiem, jak zacząć następne zdanie.\n\nWosk spada na miedzianą tackę z ledwie słyszalnym odgłosem."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "W pokoju gospody otulam się nocną koszulą. Towarzysze już się położyli, ktoś za ścianą chrapie. Światło lampy pada na niewysłany list przy moim tobołku. Brzegi papieru zaczynają się zwijać.\n\nJutro ruszamy w drogę. Suchary, konie i przeprawa są już przygotowane, tylko ten list wciąż nie ma dokąd trafić. Rozkładam go. Jego zdania jeszcze mniej niż rano nadają się do wysłania. Jedno jest zbyt otwarte; zatrzymuję przy nim palec.\n\nNa dole ktoś zamyka drzwi. Przyciskam list do tobołka, ale bez przekonania."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Składam szaty obrzędowe i w nocnej koszuli wracam na skraj łóżka. Niewysłany list leży pod świętą księgą. Wystaje jego róg, jakby sam domagał się zauważenia.\n\nWyciągam go. Zamykająca się księga wydaje głuchy odgłos. W liście nie ma słów sprzecznych ze ślubami, a jednak każde zdanie krąży wokół jednej osoby. Przy trzecim wierszu już wiem, że nie należy czytać go o tej porze.\n\nPłomień świecy drga. Nie odkładam listu na miejsce."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Służba chowa odświętne szaty, a ja siadam przy lampie w nocnej koszuli. Dokumenty na stole nadal czekają na zatwierdzenie, lecz najpierw rozwijam niewysłany list leżący pod ręką.\n\nNa zewnątrz zmienia się warta. Równe kroki przechodzą dalej, zostawiając w izbie tylko szelest papieru. Dopisuję słowo w pustym miejscu listu, patrzę na nie i zamazuję je atramentem. Czarna plama rzuca się w oczy bardziej niż samo słowo.\n\nOdkładam pióro. Dokumenty leżą tam, gdzie przedtem, bez choćby jednej nowej pieczęci."
 latria_sexual_frustration_flavor.1105.desc: "Lampa dogasa, a niewysłany list nadal leży pod ręką.\n\nWiem już, że osoba, do której piszę, nie przeczyta go dzisiejszej nocy. Mimo to ponownie zapisuję powitanie, wolniej niż za dnia. Atrament wysycha i na papierze zostaje tylko blady ślad.\n\nKnot trzaska. Podnoszę głowę i dopiero teraz dostrzegam, jak długo tu siedzę."
 latria_sexual_frustration_flavor.1105.a: "Przekazać list posłańcowi."
 latria_sexual_frustration_flavor.1105.b: "Zniszczyć go, odsunąć tę myśl i zgasić świecę przed snem."

 latria_sexual_frustration_flavor.1106.t: "Niepokój przy świecy"
 latria_sexual_frustration_flavor.1106.desc.female: "Siedzę w nocnej koszuli przy łóżku. Świeca rzuca mój cień na papier w oknie; porusza się lekko z każdym oddechem i wygląda spokojniej niż ja. Noc jest już późna, a tęsknota bez odpowiedzi nadal trwa w mojej piersi. Nie odzywa się i nie odchodzi.\n\nOdsuwam włosy za ramię, po czym przekładam je z powrotem. Gdy palce dotykają szyi, na chwilę nieruchomieję. Nie ma tu nikogo, a mimo to od tej chwili zawahania robi mi się gorąco na twarzy. Przypominam sobie słowa wypowiedziane za dnia, na poły żartem, na poły serio. Roześmiałam się wtedy, ale później nie przestałam o nich myśleć.\n\nPrzybyła kolejna warstwa zastygłego wosku. Wciąż siedzę, a zasłony łóżka nadal są podniesione."
 latria_sexual_frustration_flavor.1106.desc.male: "Siedzę w nocnej koszuli przy łóżku. Strażnik za oknem przeszedł już dwa obchody. Podczas pierwszego miałem jeszcze nadzieję zasnąć. Gdy minął drugi, przestałem na to liczyć.\n\nNie trzymam ani listu, ani pucharu. Tylko przyciskam dłoń do kolana, a kiedy się ogrzeje, odwracam ją. Głos tej osoby nie rozlega się naprawdę w izbie, lecz potrafię odtworzyć każdą przerwę w tamtym zdaniu. Przy trzecim powtórzeniu sam czuję, że to już niedorzeczne.\n\nDmucham na świecę, ale jej nie gaszę. Płomień przechyla się i znów prostuje."
 latria_sexual_frustration_flavor.1106.desc: "Świeca jest coraz krótsza, a pod zasłonami łóżka nadal nie przychodzi sen.\n\nKładę się i słyszę własne serce wyraźniej niż zwykle. Obracam się na bok; bicie nie ustępuje. Wszystko w izbie jest na swoim miejscu: naczynie, buty, złożona wierzchnia szata. Żadna z tych rzeczy nie potrafi zabrać ze sobą dręczącego mnie ciepła.\n\nZnów siadam. Lampa jeszcze płonie, lecz spora część nocy już minęła."
 latria_sexual_frustration_flavor.1106.a: "Pozwolić myślom trwać przy tym uczuciu."
 latria_sexual_frustration_flavor.1106.b: "Nie rozmyślać już o tym; zgasić świecę i ułożyć się do snu."


 latria_sexual_frustration_flavor.1107.t: "Taniec w rewanżu"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Osoba, z którą przed chwilą tańczyliśmy, zaprasza mnie na kolejną melodię. Dla pozostałych to zwyczajna uprzejmość. Muzykant już położył smyczek na strunach i czeka tylko na moje skinienie.\n\nJa jednak pamiętam tamtą dłoń. Zatrzymała się przy mojej talii na tyle krótko, by uznać to za część tańca, i na tyle długo, by trudno było mi w to uwierzyć. Patrzę w twarz osoby przede mną i napotykam jej wzrok. W kąciku ust pojawia się lekki uśmiech, lecz nic nie zostaje nazwane.\n\nPrzy stole stukają o siebie puchary. Dźwięk jest głośny, a mimo to słyszę własną zgodę, której jeszcze nie wypowiadam."
 latria_sexual_frustration_flavor.1107.desc.strict: "Pada zaproszenie do kolejnego tańca i od stołu zaraz kieruje się ku nam kilka spojrzeń. Jeszcze nie odpowiadam, a już ktoś pochyla się do sąsiada i szepcze. Nie słyszę słów, lecz obie te osoby nie spuszczają z nas oczu.\n\nWyciągnięta ku mnie dłoń nadal czeka, uprzejmie, bez nalegania. Moja własna grzeje się wewnątrz rękawa. Jeśli przyjmę zaproszenie, jeszcze trudniej będzie udawać, że to zwykły taniec. Jeśli odmówię, sama odmowa również zostanie zapamiętana.\n\nMuzykant chrząka. Smyczek nadal spoczywa na strunach."
 latria_sexual_frustration_flavor.1107.desc: "Muzykanci rozpoczynają nowy taniec, a ja wciąż zwlekam ze wstaniem.\n\nPierwsze takty już minęły. Osoba, która mnie zaprasza, nie cofa dłoni ani mnie nie ponagla. Po prostu stoi. Patrzę na wyciągniętą rękę, potem na własne palce spoczywające na brzegu stołu.\n\nZa mną ktoś przesuwa krzesło. Ten drobny odgłos każe mi mrugnąć z przestrachu, ale nadal nie wstaję."
 latria_sexual_frustration_flavor.1107.a: "Przyjąć zaproszenie i przysunąć się bliżej."
 latria_sexual_frustration_flavor.1107.b: "Odmówić z ukłonem i życzyć udanego tańca."

 latria_sexual_frustration_flavor.1108.t: "Modlitwa przed snem"
 latria_sexual_frustration_flavor.1108.desc.favors: "Modlę się przy łóżku w nocnej koszuli. Dobrze pamiętam słowa o tym, że nasza wiara dopuszcza cielesne uciechy, lecz teraz niewiele mi pomagają. Mówią tylko, że nie trzeba uznawać tego za grzech. Nie podpowiadają, co zrobić z tym uporczywym pragnieniem.\n\nKolana opierają się o brzeg łóżka. Wypowiadam modlitwę, a w myślach odtwarzam zbyt bliskie spotkanie spojrzeń za dnia. Samo w sobie niczego nie zawierało. Mimo to dzielę je na drobne chwile i przyglądam się każdej z osobna.\n\nDocieram do miejsca, w którym należy skończyć, i nie kończę. Następne zdania dodaję od siebie, bez żadnego ładu."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Klęczę przy łóżku w nocnej koszuli i powtarzam ślub czystości. Z każdym zdaniem wyraźniej słyszę głos w sobie: tej nocy znów nie będzie nikogo obok, pościel pozostanie zimna, a w ciemności znajdę tylko własną dłoń.\n\nOpieram czoło o deskę łóżka. Drewno jest chłodne i przez chwilę jest mi lżej. Kiedy jednak odsuwam się od chłodu, ciepło wraca na swoje miejsce. Zaczynam ponownie od pierwszego zdania, bardzo cicho, jakby ktoś za ścianą mógł usłyszeć.\n\nZa ścianą nikogo nie ma. Mimo to nadal ściszam głos."
 latria_sexual_frustration_flavor.1108.desc: "Płomień przy łóżku lekko drży, a moja modlitwa wciąż nie dobiega końca.\n\nZnajomy ustęp mam już za sobą. Teraz powinna nastąpić cisza, lecz nie chcę jej dopuścić. Gdy przyjdzie, zajmie ją tamta druga sprawa. Dodaję więc kilka zdań, choć po ich wypowiedzeniu wiem, że nie należą do modlitwy.\n\nPłomień pochyla się ku zasłonie łóżka. Nadal klęczę, ze zmiętym przodem koszuli."
 latria_sexual_frustration_flavor.1108.a: "Odłożyć ślub czystości i przyznać się do tęsknoty."
 latria_sexual_frustration_flavor.1108.b: "Powściągnąć myśli i modlić się dalej."

 latria_sexual_frustration_flavor.1109.t: "Niedokończona rada"
 latria_sexual_frustration_flavor.1109.desc: "Doradcy przedstawili trzy sposoby postępowania, a ja wciąż nie wydaję rozstrzygnięcia. Pierwszy jest najpewniejszy, drugi najoszczędniejszy, trzeci najlepiej odpowiada dawnemu zwyczajowi. Wszystko do mnie dotarło, na wszystko odpowiadało moje skinienie głowy. Nadal jednak nie umiem wskazać wyboru.\n\nPióro pisarza zawisło w powietrzu. Ktoś przysuwa mi naczynie z wodą. Patrzę na własne odbicie i nagle myśli uciekają ku osobie, która nie ma nic wspólnego z zapasami żywności. Nie ma jej w tej izbie. Mimo to pamiętam przerwy, jakie robi podczas mówienia.\n\nMilczenie trwa już niezręcznie długo. Odchrząkuję, ale nadal nie potrafię ułożyć zdania."
 latria_sexual_frustration_flavor.1109.a: "Zakończyć radę i zostać sam na sam z myślami."
 latria_sexual_frustration_flavor.1109.b: "Stłumić tę myśl i poprosić pisarza, by kontynuował."
 latria_sexual_frustration_flavor.1110.t: "Pokój po północy"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Wracam w nocnej koszuli do swojej niewielkiej izby. Nocne modlitwy się skończyły, większość lamp w krużganku już zgasła. Niewysłany list wciąż leży jednak otwarty na stole, przytrzymując sznur modlitewnych paciorków.\n\nNależałoby schować paciorki do szkatułki i odłożyć list. Moja ręka dotyka papieru i nieruchomieje. Znam już wszystkie zdania na pamięć, a mimo to chcę jeszcze raz zobaczyć, jak wygląda zapisane przeze mnie imię. W jednym miejscu atrament się rozlał, jakby podczas pisania zadrżała mi ręka.\n\nW izbie jest cicho. Stoję przy stole, z luźno zawiązaną tasiemką nocnej koszuli."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "W gospodzie zostało już tylko kilka zapalonych lamp. Siedzę w nocnej koszuli na skraju łóżka. Tobołek jest związany; tylko niewysłany list jeszcze z niego wystaje.\n\nKtoś za ścianą przewraca się na drugi bok i deski łóżka skrzypią. Czekam, aż dźwięk umilknie, dopiero wtedy wyciągam list. Do brzegów papieru przywarł kurz z drogi. Dmucham na niego. Kurz zostaje, za to zdania wydają się jeszcze wyraźniejsze. Jedno nigdy nie powinno trafić na papier, a widnieje akurat pośrodku.\n\nSkładam list, lecz nowe zagięcie nie trafia w dawny ślad."
 latria_sexual_frustration_flavor.1110.desc: "Odgłosy za drzwiami powoli się oddalają, a ja nadal czekam przy łóżku.\n\nNikt nie obiecał przyjść do mnie dzisiejszej nocy. Mimo to zostawiam zapaloną lampę i kładę wierzchnią szatę w zasięgu ręki. Za każdym razem, gdy przechodzą czyjeś kroki, podnoszę głowę. Wszystkie odchodzą dalej.\n\nOliwy w lampie ubywa. Druga strona łóżka nadal jest pusta, a ja wciąż się nie kładę."
 latria_sexual_frustration_flavor.1110.a: "Dokończyć list i wysłać go o świcie."
 latria_sexual_frustration_flavor.1110.b: "Zaryglować drzwi, odsunąć tę myśl i położyć się na noc."

 latria_sexual_frustration_flavor.1101.c: "Włożyć szatę, usiąść spokojnie i wyrównać oddech."
 latria_sexual_frustration_flavor.1102.c: "Porozmawiać z muzykami o ich melodiach."
 latria_sexual_frustration_flavor.1103.c: "Zapytać, jak żyć z tymi uczuciami."
 latria_sexual_frustration_flavor.1103.d: "Zacząć od niewysłanego listu i niczego nie ukrywać."
 latria_sexual_frustration_flavor.1104.c: "Poprosić pozostałych, by zaczekali, i cierpliwie zająć się orłem."
 latria_sexual_frustration_flavor.1105.c: "Schować list do szkatułki i zaplanować jutrzejszą pracę."
 latria_sexual_frustration_flavor.1107.c: "Zaproponować wspólne siedzenie i rozmowę o czymś innym."
 latria_sexual_frustration_flavor.1107.d: "Zaprosić cały stół do żywego tańca grupowego."
 latria_sexual_frustration_flavor.1108.c: "Powoli dokończyć modlitwę, nie walcząc z każdą myślą."
 latria_sexual_frustration_flavor.1109.c: "Zrobić krótką przerwę i uporządkować pozostałe sprawy."
 latria_sexual_frustration_flavor.1109.d: "Uporządkować pilne decyzje i rozstrzygnąć je tutaj."
 latria_sexual_frustration_flavor.1110.c: "Włożyć szatę i poszukać kubka ciepłego bulionu."
