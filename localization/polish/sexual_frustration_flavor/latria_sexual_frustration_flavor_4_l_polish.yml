l_polish:
 latria_sexual_frustration_flavor.1301.t: "Niewysłane zaproszenie"
 latria_sexual_frustration_flavor.1301.desc.female: "Siedzę w nocnej koszuli przy biurku. Na papierze widnieje tylko jedno imię. Atrament jeszcze nie wysechł, a służąca już pyta z progu, czy zanieść list. Zaginam arkusz, ale ani go nie pieczętuję, ani nie odpowiadam.\n\nZa dnia nie odważyłam się zapisać tego imienia. Nocą, gdy wreszcie znalazło się na papierze, kartka niemal parzy. Dalej powinno nastąpić zaproszenie. Dokąd i o której godzinie — wszystko już obmyśliłam, lecz pióro zatrzymuje się po powitaniu. Służąca ponawia pytanie, jeszcze ciszej.\n\nPatrzę na to imię. Ciąży mi bardziej niż cała niedokończona reszta listu."
 latria_sexual_frustration_flavor.1301.desc.male: "Siedzę w nocnej koszuli przy biurku. Na papierze widnieje tylko jedno imię. Za drzwiami sługa czeka, żeby zanieść wiadomość. Jego cień porusza się w szparze, po czym znów nieruchomieje.\n\nObficie zanurzam pióro w atramencie i zatrzymuję je nad kartką. Zdanie, które zamierzam napisać, jest zupełnie jasne: tej nocy, przy bocznych drzwiach, bez wiedzy kogokolwiek trzeciego. Gdy jednak trafi na papier, przestanie być tylko sprawą moich myśli. Knot trzaska. Obok imienia spada kropla atramentu.\n\nSługa cicho chrząka. Nadal nie pieczętuję listu."
 latria_sexual_frustration_flavor.1301.desc: "Niezapieczętowany list od dawna leży przede mną przy lampie.\n\nNa kartce jest tylko powitanie. Dalej wystarczyłoby miejsca na wiele zdań, ale nie zapisuję żadnego. Wosk już zmiękł od ogrzewania. Łyżeczka do pieczętowania leży pod ręką, lecz po nią nie sięgam.\n\nOliwy w lampie ubywa. Atrament w imieniu nadal jest mokry."
 latria_sexual_frustration_flavor.1301.a: "Dokończyć list i przekazać go słudze."
 latria_sexual_frustration_flavor.1301.b: "Schować list, stłumić tęsknotę i udać się na spoczynek."

 latria_sexual_frustration_flavor.1302.t: "Osąd dworu"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Nadworny poeta żartuje z dawnej miłości i nawet najpoważniejsi możni nie marszczą brwi. Opowiada o sprawach zza zasłon łóżka jak o zabawnej przygodzie na polowaniu. Wszyscy podnoszą puchary, na winie kołysze się krąg światła.\n\nZ uśmiechem unoszę własny puchar, lecz wino smakuje mi gorzko. To nie moja historia, a jednak brzmi, jakby ktoś wystawił na widok także moje noce. Sąsiad dotyka mojego rękawa i pyta, dlaczego nic nie dodaję. Dopiero wtedy dostrzegam, że mój śmiech przyszedł za późno.\n\nPoeta zaczyna następne zdanie. Mój puchar wciąż tkwi w połowie drogi do ust."
 latria_sexual_frustration_flavor.1302.desc.strict: "Pewien możny stracił dobre imię przez potajemny romans. Wszyscy rozprawiają teraz o jego rodzinie. Słowa padają powoli, niemal jak wyrok. Ktoś kręci głową, ktoś na nowo rozważa małżeństwa swoich dzieci.\n\nSłuchając tych ocen, przypominam sobie, że i mnie waży ta sama szala. Na drugiej leżą niewysłany list i kilka niespokojnych nocy. Jeszcze nikt ich nie zobaczył. To, że pozostają niewidoczne, nie usuwa ich z wagi.\n\nKtoś pyta o moje zdanie. Odstawiam puchar; jego spód stuka o stół."
 latria_sexual_frustration_flavor.1302.desc: "Rozmowa przy stole schodzi na dobre imię i pragnienia.\n\nZ początku to tylko żarty. Kiedy jednak pojawiają się konkretne drzwi i konkretna pora nocy, przestaje mnie to bawić. Siedzę na swoim miejscu i czuję, jak pod obrusem zaciska mi się dłoń.\n\nMuzykanci wciąż grają. Bardzo cicho, jakby obawiali się zagłuszyć te słowa."
 latria_sexual_frustration_flavor.1302.a: "Mówić o swojej tęsknocie, raz po raz sprowadzając rozmowę na jej temat."
 latria_sexual_frustration_flavor.1302.b: "Powstrzymać język, podziękować gospodarzom i odejść."

 latria_sexual_frustration_flavor.1303.t: "Dzwon o północy"
 latria_sexual_frustration_flavor.1303.desc.favors: "Po uderzeniach dzwonu kapłan nadal stoi przy drzwiach. Mówi, że pragnienie można skierować ku dobru. Nie podnosi głosu, lecz nocą słyszę go wyraźnie. Świece w świątyni wydłużają jego cień aż do moich kolan.\n\nNie wiem jednak, czy chcę jeszcze czekać na to dobro. Samo czekanie stało się kolejnym nakazem. Dłonie grzeją mi się w rękawach, a dla tego ciepła nie znajduję miejsca w żadnym świętym tekście. Kapłan patrzy na mnie, jakby dostrzegał pytanie, którego drugiej połowy nie wypowiadam.\n\nPod belkami jeszcze brzmi echo dzwonu. Klęczę, choć kolana już mi zdrętwiały."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Dzwon odzywa się raz po raz. Tak samo powracają we mnie słowa ślubu recytowane przez kapłana. Kolana drętwieją od klęczenia; chłód kamiennych płyt dawno ustąpił pod moim ciepłem. Odpowiedź nadal nie przychodzi.\n\nZnam każde zdanie ślubu. Znać nie znaczy chcieć. Przy słowie „wyrzeczenie” mój język na chwilę się zatrzymuje, dopiero potem wypuszcza je dalej. Kapłan mnie nie poprawia. To zawahanie wystarczyło jednak, żebym usłyszeć je w swoim głosie.\n\nWybrzmiewa ostatnie uderzenie dzwonu. W świątyni jest tak cicho, że słyszę kapanie wosku."
 latria_sexual_frustration_flavor.1303.desc: "Modlitwa o północy nie przynosi mi spokoju, choć echo dzwonu nadal się niesie.\n\nPowtarzam słowa aż do ostatniego zdania. Potem nadal klęczę w tym samym miejscu, a dręcząca mnie sprawa również pozostaje tam, gdzie była. Dźwięk dzwonu niczego w niej nie zmienia.\n\nKapłan zamyka księgę. Odgłos schodzących się kart jest bliższy niż bicie dzwonu."
 latria_sexual_frustration_flavor.1303.a: "Zostawić nakazy wstrzemięźliwości w świątyni."
 latria_sexual_frustration_flavor.1303.b: "Stłumić tę myśl i ponownie odmówić modlitwę."

 latria_sexual_frustration_flavor.1304.t: "Kres cierpliwości"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Przemierzam izbę w nocnej koszuli. Na szachownicy przyniesionej przez sługę żadna figura nie zmieniła miejsca. Okno jest uchylone. Nocne powietrze wpada do środka, lecz nie rozprasza ciepła, które czuję.\n\nZatrzymuję się przy łóżku, przy stole, wreszcie przy drzwiach. Za nimi nie słychać kroków. Czekanie stało się osobną udręką: wiem, że nikt nie przyjdzie, a mimo to każde uderzenie nocnego bębna biorę za pukanie. W pudełku stukają o siebie figury. To tylko mój rękaw o nie zahaczył.\n\nWracam do szachownicy i kładę palec na pionie, ale nie przesuwam go naprzód."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Jeszcze raz mocno wiążę nocną koszulę, próbując nadać każdemu ruchowi pozór spokoju. Wyraźnie czuję ucisk tasiemki w talii. Im staranniej się pilnuję, tym trudniej udawać, że tęsknoty nie ma.\n\nSzachownica czeka na stole jak uczciwe zajęcie, któremu można się oddać. Siadam, podnoszę figurę i odkładam ją z powrotem. Palce nadal chciałyby zająć się czymś innym. Przytrzymuję tę dłoń pod stołem. Ręka nieruchomieje, lecz oddech traci równy rytm.\n\nW izbie jest cicho. Tak cicho, że słyszę własne przekleństwo, którego nie wypowiadam."
 latria_sexual_frustration_flavor.1304.desc: "Izba jest cicha, lecz ja nie potrafię już spokojnie siedzieć.\n\nWstaję nalać wody i nie piję jej. Podchodzę przyciąć knot; obcinam go zbyt krótko, więc płomień opada. Każdą czynność zaczynam, ale żadna nie skłania mnie do powrotu na krzesło.\n\nW końcu stoję pośrodku izby i nie wiem, gdzie podziać ręce."
 latria_sexual_frustration_flavor.1304.a: "Odłożyć szachownicę i pomyśleć o osobie, za którą tęsknię."
 latria_sexual_frustration_flavor.1304.b: "Wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1305.t: "Pokój po zmroku"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Dwór się rozszedł, a ja nadal pozostaję w sypialni w odświętnych szatach. Raporty są zatwierdzone, tusz do pieczęci wysechł, kroki doradców ucichły w oddali. Troska nie wyszła razem z nimi.\n\nRozpinam zapięcie przy szyi i zatrzymuję się w połowie. Łóżko jest pościelone aż nazbyt starannie, tak równo, że trudno wyobrazić sobie leżenie w nim. Stoję przez chwilę przed zwierciadłem. Widzę siebie pod odświętnym strojem i coś w oczach, co nie trafiło do żadnego raportu.\n\nSłużący pytają zza drzwi, czy zdjąć mi koronę. Każę im jeszcze nie wchodzić."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Towarzysze położyli się już w gospodzie. Ja pozostaję w swoim pokoju bez towarzystwa. Bagaże są spakowane, jutrzejszą trasę zapisano na desce za drzwiami. Nie mam gdzie ulokować myśli. W tobołku nie zajmują miejsca, za to wypełniają całą izbę.\n\nSiadam na brzegu łóżka, nadal w butach. Na dole ktoś pijany zaczyna śpiewać i w połowie towarzysz zatyka mu usta. Ich śmiech dociera na górę, jakby pochodził z innej nocy, do której nie mam wstępu.\n\nZwijam mapę i znów ją rozwijam. Drogi pozostają te same."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Pozostaję w małej izbie bez towarzystwa. Nadal mam na sobie szaty obrzędowe, a świeca przy łóżku już przygasła. Ślub trwa, słowo w słowo taki sam jak podczas dziennej recytacji. Ukojenie nie przyszło.\n\nZdejmuję z nadgarstka sznur modlitewny. Paciorki kolejno przesuwają się między palcami, aż przestają im towarzyszyć słowa modlitwy. Przypomina mi się ktoś stojący w krużganku i to, jak mój wzrok pierwszy uciekł w bok. Odwrócenie spojrzenia nie sprawiło, że ta osoba zniknęła.\n\nKołnierz szaty ociera mi szyję. Nie zdejmuję go."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Wracam w odświętnych szatach do pustej sypialni. Strażnicy za drzwiami składają ukłon. Raz brzęczą płytki zbroi, potem odzywa się zasuwa. W środku nie ma nikogo, kto mógłby podzielić moje troski.\n\nKoronę nadal mam na głowie. Zdejmuję ją i kładę przy poduszce, niemal jak drugą głowę. Osoba w zwierciadle wygląda, jakby bez trudu miała jutro stanąć przed dworem. Tylko ja wiem, jak upłynie ta noc.\n\nSiadam na brzegu łóżka. Jedną rękawicę wciąż mam na dłoni."
 latria_sexual_frustration_flavor.1305.desc: "W pokoju nie ma nikogo poza mną, a jednak wciąż zwlekam z położeniem się.\n\nLampa jeszcze płonie, buty mam na nogach, wierzchnia szata leży równo. Traktuję to jak dowody, że w każdej chwili mogę wyjść do ludzi. W rzeczywistości nikt na mnie nie czeka. Po prostu nie chcę patrzeć na przygotowane łóżko.\n\nPrzez szparę w oknie wpada wiatr i lekko przechyla płomień."
 latria_sexual_frustration_flavor.1305.a: "Mimo późnej pory wezwać zaufaną osobę i długo porozmawiać."
 latria_sexual_frustration_flavor.1305.b: "Stłumić tęsknotę, zdjąć szaty i udać się na spoczynek."

 latria_sexual_frustration_flavor.1306.t: "Posłaniec o północy"
 latria_sexual_frustration_flavor.1306.desc.female: "Siedzę w nocnej koszuli przy łóżku, gdy ktoś dwukrotnie lekko puka do drzwi. To nie umówiony znak, tylko zwykłe pukanie służącej, która coś przynosi. Wchodzi, kładzie czystą kartkę i wychodzi, nie spoglądając w stronę łóżka.\n\nCzysty papier jest głośniejszy od zapisanego listu. Wiem, od kogo oczekuję wieści, i wiem, że tej nocy nie nadejdą. Podnoszę kartkę do lampy. Światło wydobywa drobne włókna, przypominające wiersz, którego jeszcze nie napisano.\n\nMoje palce długo spoczywają na papierze. Zostaje po nich niewielki wilgotny ślad."
 latria_sexual_frustration_flavor.1306.desc.male: "Otwieram drzwi w nocnej koszuli. Korytarz jest już pusty. Przy progu leży niepodpisana wiadomość; zapewne ktoś ją tu zostawił, a może upadła jeszcze za dnia. Podnoszę ją, wciąż nie mogąc zasnąć.\n\nNie ma w niej zdania, na które czekam. Mowa tylko o jutrzejszej godzinie i sumie do zapłacenia. Mimo to czytam każdy wiersz, a potem odwracam kartkę. Druga strona jest pusta. Jakby to ona czekała na moje słowa.\n\nŚwiatło na korytarzu gaśnie. Nadal stoję przy niedomkniętych drzwiach."
 latria_sexual_frustration_flavor.1306.desc: "Kroki za drzwiami cichną w oddali. Papier na stole wciąż czeka na pióro.\n\nSięgam po nie trzy razy. Za pierwszym zapisuję jedno słowo i je skreślam. Za drugim zostawiam na kartce tylko kroplę atramentu. Za trzecim odkładam pióro i patrzę, jak ta kropla powoli wysycha.\n\nMinęła już połowa nocy. Kartka nadal jest niemal pusta."
 latria_sexual_frustration_flavor.1306.a: "Zapisać słowa odkładane od tak dawna."
 latria_sexual_frustration_flavor.1306.b: "Schować kartkę, stłumić tęsknotę i położyć się."

 latria_sexual_frustration_flavor.1307.t: "Cisza przy stole"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Poeta opiewa dawną miłość, a wszyscy słuchają z zachwytem. Ktoś wybija rytm na stole, ktoś dopowiada koniec wersu, zanim poeta zdąży go wymówić. Puchary obracają się w dłoniach. Nikt nie sądzi, by należało przy kimkolwiek unikać tego tematu.\n\nWznoszę puchar wraz z innymi, lecz myślę o przeszłości, o której nikt tu nie wspomina. Nie brzmi tak pięknie jak wiersz i nie ma tylu słuchaczy. Są w niej tylko zamknięte drzwi i późniejsze samotne czuwanie aż do świtu. Gdy poeta dochodzi do wersu o uścisku, z mojego pucharu wylewa się kropla wina.\n\nNikt jej nie zauważa. Tylko ja."
 latria_sexual_frustration_flavor.1307.desc.strict: "Przy stole pada wzmianka o szlachcicu, który popadł w niełaskę z powodu potajemnej miłości. Śmiech urywa się tak zgodnie, jakby ktoś przycisnął drgającą strunę. Odwracam wzrok ku oknu, żeby nikt nie odczytał niczego z mojej twarzy.\n\nZa oknem nie ma na czym zawiesić oka, poza światłem nocnego obchodu. Mimo to wciąż na nie patrzę. Za plecami słyszę ciche: „Sam sobie zasłużył”. Może nie chodzi o mnie, ale te słowa spadają mi na plecy, jakby dotyczyły tego, na czym mnie jeszcze nie przyłapano.\n\nMocniej ujmuję puchar. Bieleją mi knykcie."
 latria_sexual_frustration_flavor.1307.desc: "Puchary nadal krążą, lecz rozmowa zatrzymuje się przy temacie, przy którym najmniej powinna.\n\nPrzed chwilą była mowa o plonach. Chwilę później ktoś wspomina o czyimś łożu. Potem nikt już nie wraca do poprzedniej rozmowy. Siedzę w tej ciszy, a własne serce zagłusza mi muzykę.\n\nKtoś kaszle, próbując wypełnić tę pustkę. Bez skutku."
 latria_sexual_frustration_flavor.1307.a: "Pozwolić winu rozwiązać język i opowiadać prywatne historie jedną po drugiej."
 latria_sexual_frustration_flavor.1307.b: "Powstrzymać język, ukłonić się towarzystwu i odejść."

 latria_sexual_frustration_flavor.1308.t: "Modlitwa podczas czuwania"
 latria_sexual_frustration_flavor.1308.desc.favors: "Dzwon na nocne czuwanie już przebrzmiał, a ja nadal modlę się w świątyni. Nauka wiary nie odrzuca przyjemności cielesnych; potrafię wskazać odpowiedni ustęp. Nie mówi mi to jednak, co począć z ciałem, które teraz tu klęczy.\n\nŁawy są puste. Świeca rzuca mój cień na oparcie; cień porusza się z każdym oddechem, jak ktoś drugi, kto nie chce czuwać. Myślę o zaproszeniu, które za dnia niemal padło z moich ust, i o słowach, którymi je zastępuję w ostatniej chwili. Ciało nie podąża za tą zmianą.\n\nDźwięk dzwonu cichnie. Nadal klęczę, z cienką warstwą potu na czole."
 latria_sexual_frustration_flavor.1308.desc.condemns: "W świątyni raz po raz odmawiam modlitwę o czystość. Za pierwszym razem wypowiadam ją w całości, za drugim zaczynam pomijać słowa, za trzecim zatrzymuję się na tym samym zdaniu i nie mogę ruszyć dalej.\n\nDzwon cichnie w oddali, lecz myśl nie ustępuje. Nie odchodzi wraz z jego dźwiękiem. Przyciskam dłonie do kamiennej posadzki, szukając chłodu, ale szybko ją ogrzewam. Gdy ciepło przechodzi na kamień, tym wyraźniej wiem, z czym walczę.\n\nNa pustych ławach nie ma nikogo. Mimo to nadal mówię bardzo cicho."
 latria_sexual_frustration_flavor.1308.desc: "Światło świec pada na puste ławy. Nadal nie wstaję.\n\nNa tym powinno zakończyć się czuwanie. Mam jednak wrażenie, że gdy tylko wstanę, ciepło tłumione przez klęczenie znów popłynie wzdłuż nóg. Klęczę więc dalej, odwlekając tę chwilę.\n\nOstatnia świeca trzaska. Czarny dym unosi się i rozprasza pod belkami."
 latria_sexual_frustration_flavor.1308.a: "Odłożyć modlitwę o wstrzemięźliwość i wyjść za głosem serca."
 latria_sexual_frustration_flavor.1308.b: "Powściągnąć pożądanie i dokończyć czuwanie."

 latria_sexual_frustration_flavor.1309.t: "Spojrzenie w lustro"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Stoję przez chwilę bez ubrania przed brązowym lustrem w sypialni. Odbicie nie unika spojrzenia, a ja nie sięgam po odzież, by się zasłonić. Światło pada z boku, wyraźnie ukazując cienie na obojczykach i w talii.\n\nMam dość nazywania tego pragnienia chwilową słabością. Nie jest chwilowe. Towarzyszy mi od zmierzchu, przez wieczerzę i odejście gości, aż zostajemy tylko ja i to lustro. Unoszę dłoń do ramienia; dłoń w odbiciu robi to samo. Dotyk jest lekki, lecz wystarcza, by zmienił się oddech.\n\nZa drzwiami nie słychać kroków. Nie muszę udawać."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Siedzę bez ubrania na skraju łóżka i po cichu powtarzam przysięgę. Pamiętam każde słowo tak dobrze, że natychmiast słyszę każde pominięcie. Pragnienie jednak nie znika. Jest właśnie w tym ciele, którego nie osłania odzież. Nie mogę twierdzić, że znajduje się gdzie indziej.\n\nPatrzę w lustro, po czym odwracam wzrok. Na próżno: brązowa tafla wciąż mnie odbija. Splatam dłonie tak mocno, że bieleją knykcie, jakby w ten sposób można było dochować przysięgi.\n\nSłowa znowu się urywają. Tym razem nie podejmuję ich od razu."
 latria_sexual_frustration_flavor.1309.desc: "Nikogo przy mnie nie ma, lecz milczenie odbicia nie pozwala mi unikać siebie.\n\nUbranie leży na krześle. Ja stoję przed lustrem. Dzieli nas tylko kilka kroków, a jednak długo nie umiem przyznać, dlaczego się nie okrywam. Płomień jest spokojny. Moje spojrzenie nie.\n\nSiadam na skraju łóżka. Mata jest chłodna, ale tylko przez chwilę."
 latria_sexual_frustration_flavor.1309.a: "Przyznać się do swoich uczuć i rozmyślać o nich."
 latria_sexual_frustration_flavor.1309.b: "Ubrać się, wrócić do biurka i stłumić tę myśl."

 latria_sexual_frustration_flavor.1310.t: "Bezsenność w kwaterze"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Po nocnych modlitwach wracam do swojej izby. Wciąż mam na sobie szaty liturgiczne, świeca przy łóżku już przygasa, a ja nie chcę się położyć. Gdy to zrobię, dłoń będzie wiedziała, dokąd sięgnąć. Jeszcze nie zapada we mnie decyzja, czy jej na to pozwolić.\n\nPrzy poduszce leżą paciorki modlitewne, niczym świadek. Rozwiązuję do połowy wiązanie szaty, po czym zawiązuję je ponownie. Kołnierz nadal ociera skórę, nie pozwalając zapomnieć o czuwaniu.\n\nW izbie nie ma nikogo prócz mnie. Niczego to nie ułatwia."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Towarzysze już odpoczywają w gospodzie, a ja kończę pakować się w swoim pokoju. Jutrzejsza droga jest jasna: przeprawa, trakt, kolejna przeprawa. Nie wiem jednak, dokąd zmierza serce. Tego miejsca nie ma na żadnej mapie.\n\nZdejmuję buty, ale się nie kładę. Za oknem koń powoli przeżuwa siano. Ten odgłos powinien usypiać. Słucham go i wracam myślą do spojrzenia, którym ktoś obdarzył mnie dziś przy przeprawie. Tak krótkiego, że niemal nie warto go liczyć. Ja je liczę.\n\nPłomień lampy drga. Nie dolewam oliwy."
 latria_sexual_frustration_flavor.1310.desc: "Noc jest już głęboka, drzwi zamknięte, a sen nadal nie przychodzi.\n\nŁóżku niczego nie brakuje, poduszce też. Siedzę na brzegu i znów myślę o osobie, do której za dnia nie udaje mi się zbliżyć. Dopiero gdy dłonie stają się gorące, dostrzegam rozwiązane troki nocnej koszuli. Nie pamiętam, kiedy to nastąpiło.\n\nPatrzę na jeden z nich. Zwisa przy nodze jak decyzja, która jeszcze nie zapadła."
 latria_sexual_frustration_flavor.1310.a: "Napisać do starego znajomego i otwarcie opowiedzieć o troskach."
 latria_sexual_frustration_flavor.1310.b: "Stłumić tę myśl, zgasić świecę i położyć się."

 latria_sexual_frustration_flavor.1301.c: "Wziąć czystą kartkę i ułożyć zaproszenie wierszem."
 latria_sexual_frustration_flavor.1302.c: "Sprowadzić rozmowę z powrotem na rodziny i majątki."
 latria_sexual_frustration_flavor.1302.d: "Opowiedzieć historię z podróży i znów skłonić ich do wznoszenia pucharów."
 latria_sexual_frustration_flavor.1303.c: "Zostać do świtu i studiować święte pismo wers po wersie."
 latria_sexual_frustration_flavor.1304.c: "Rozstawić figury i rozważyć zadanie szachowe."
 latria_sexual_frustration_flavor.1304.d: "Zacząć od pierwszego ruchu i powoli rozegrać całą partię."
 latria_sexual_frustration_flavor.1305.c: "Rozplanować poranną pracę przed zgaszeniem świecy."
 latria_sexual_frustration_flavor.1307.c: "Wyrecytować nowy wiersz i odciągnąć ich uwagę."
 latria_sexual_frustration_flavor.1308.c: "Zamknąć modlitewnik i w ciszy rozważyć swoje myśli."
 latria_sexual_frustration_flavor.1308.d: "Czuwać do porannej modlitwy i przygotować księgi dla wszystkich."
 latria_sexual_frustration_flavor.1309.c: "Spisać swoje troski i rozważyć je wers po wersie."
 latria_sexual_frustration_flavor.1310.c: "Zaparzyć herbatę i bez pośpiechu schować rzeczy oraz księgi."
