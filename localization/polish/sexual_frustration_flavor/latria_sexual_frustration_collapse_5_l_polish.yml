l_polish:
 latria_collapse_no_relief_tt: "Tłumione pożądanie nie słabnie."

 latria_sexual_frustration_flavor.1501.t: "Lampa wciąż płonie"
 latria_sexual_frustration_flavor.1501.desc.dead: "Nie rozróżniam już kroków za drzwiami. Sztylet wypada mi z dłoni. Ktoś otwiera drzwi i wciąż woła moje imię. Próbuję odpowiedzieć, lecz wszystko ciemnieje, aż przestaję widzieć lampę."
 latria_sexual_frustration_flavor.1501.desc.survived: "Sztylet nie odebrał mi życia. Ktoś usłyszał hałas i wbiegł, by mnie ocalić. Leżę w łóżku w nocnym odzieniu, z opatrzonymi ranami, a to samo niezaspokojone pragnienie wciąż mnie dręczy."
 latria_sexual_frustration_flavor.1501.desc.severe: "Gdy odzyskuję przytomność, sztyletu już nie ma. Ktoś siedzi przy łóżku i mówi cicho o tym, jak ciężkie są moje rany. Nie mogę nawet usiąść, lecz udręka, która mnie tu przywiodła, nie słabnie."
 latria_sexual_frustration_flavor.1501.a.dead: "Wszystko… ciemnieje…"
 latria_sexual_frustration_flavor.1501.a.survived: "Boli…"
 latria_sexual_frustration_flavor.1501.a.severe: "Nie dotykaj mnie… boli…"

 latria_sexual_frustration_flavor.1502.t: "Pusty kielich"
 latria_sexual_frustration_flavor.1502.desc.dead: "Kielich jest pusty. Przy łóżku słyszę, jak ktoś wchodzi i gorączkowo woła o pomoc. Mój list wciąż jest niedokończony, lecz nie mogę już utrzymać pióra. Głosy cichną, aż nie słyszę już nic."
 latria_sexual_frustration_flavor.1502.desc.survived: "Wypita trucizna mnie nie zabiła. Po odnalezieniu i leczeniu wciąż leżę w sypialni, zbyt słabo się czując, by wstać. Kielich zabrano, lecz pragnienia, które mnie do niego pchnęły, pozostały."
 latria_sexual_frustration_flavor.1502.desc.severe: "Trucizna oszczędziła moje życie, ale pozostawiła ciało schorowane. Leżę w łóżku, gdy inni przynoszą mi wodę i układają moje ubrania. Trwała słabość nie przyniosła wytchnienia od pożądania."
 latria_sexual_frustration_flavor.1502.a.dead: "Nie… mogę mówić…"
 latria_sexual_frustration_flavor.1502.a.survived: "Tak mi niedobrze… trochę wody…"
 latria_sexual_frustration_flavor.1502.a.severe: "Nie mogę nawet unieść ręki…"

 latria_sexual_frustration_flavor.1503.t: "Na brzegu rzeki"
 latria_sexual_frustration_flavor.1503.desc.dead: "Nie widzę już brzegu. Ktoś chyba krzyczy w oddali, lecz dźwięk staje się niewyraźny. Przypominam sobie lampę, która została zapalona w mojej komnacie. Nawet ta ostatnia myśl odpływa."
 latria_sexual_frustration_flavor.1503.desc.survived: "Ktoś wyciągnął mnie z rzeki. Gdy się budzę, otula mnie płaszczem. Drżę na brzegu, czekając na powrót do domu, wciąż boleśnie odczuwając pragnienie, które mnie tu przywiodło."
 latria_sexual_frustration_flavor.1503.desc.severe: "Rzeka nie odebrała mi życia. Gdy wynoszą mnie na brzeg, mam gorączkę i kaszlę zbyt mocno, by mówić. Szepczą o chorobie płuc. Ilekroć odzyskuję jasność myśli, wraca to samo pożądanie."
 latria_sexual_frustration_flavor.1503.a.dead: "Tak zimno…"
 latria_sexual_frustration_flavor.1503.a.survived: "Wciąż… żyję?"
 latria_sexual_frustration_flavor.1503.a.severe: "Nie… mogę złapać tchu…"

 latria_sexual_frustration_flavor.1504.t: "Pod urwiskiem"
 latria_sexual_frustration_flavor.1504.desc.dead: "Leżę pod urwiskiem i słyszę nawoływania ludzi szukających mnie na górskiej ścieżce. Ich głosy się zbliżają, lecz nie mogę odpowiedzieć. Góry rozmywają mi się przed oczami, aż nie potrafię już dostrzec nieba."
 latria_sexual_frustration_flavor.1504.desc.survived: "Budzę się pod urwiskiem. Ktoś kuca obok i woła moje imię. Upadek ciężko mnie poranił, lecz żyję. Czekam na nosze, a to samo pożądanie znów wypełnia moje myśli."
 latria_sexual_frustration_flavor.1504.desc.severe: "Skok mnie nie zabił. Ci, którzy mnie znaleźli, zbierają się blisko, nie chcąc spojrzeć mi w oczy. Gdy próbuję wstać, odkrywam, że nie mogę już chodzić jak dawniej. Moja udręka trwa."
 latria_sexual_frustration_flavor.1504.a.dead: "Nic nie słyszę…"
 latria_sexual_frustration_flavor.1504.a.survived: "Nie mogę się ruszyć… boli…"
 latria_sexual_frustration_flavor.1504.a.severe: "Moje nogi…"

 latria_sexual_frustration_flavor.1505.t: "Wyważone drzwi"
 latria_sexual_frustration_flavor.1505.desc.dead: "Słyszę wyważane drzwi sypialni, a potem ktoś z trwogą woła moje imię. Próbuję powiedzieć, że list leży przy łóżku, lecz słowa nie nadchodzą. Światło w drzwiach przygasa i nie słyszę już nic."
 latria_sexual_frustration_flavor.1505.desc.survived: "Ktoś wyważył drzwi sypialni i zdążył mnie ocalić. Teraz leżę w łóżku, a obrażenia utrudniają mi każdy ruch. Sznura już nie ma, lecz udręka, która mnie do niego pchnęła, wciąż mnie nie opuszcza."
 latria_sexual_frustration_flavor.1505.desc.severe: "Słyszę, jak ktoś wciąż woła moje imię, lecz nie wiem, jak odpowiedzieć. Inni muszą mnie myć i karmić. Patrzę na znajome sprzęty w sypialni i nie potrafię pomyśleć, co zrobić dalej. List leżący przy łóżku schowano do skrzyni."
 latria_sexual_frustration_flavor.1505.a.dead: "Ja…"
 latria_sexual_frustration_flavor.1505.a.survived: "Daj mi… złapać tchu…"
 latria_sexual_frustration_flavor.1505.a.severe: "Czy ktoś… mnie woła?"
