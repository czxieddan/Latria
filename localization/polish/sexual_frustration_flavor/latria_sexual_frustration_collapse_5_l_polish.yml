l_polish:
 latria_collapse_no_relief_tt: "Tłumione pożądanie nie słabnie."

 latria_sexual_frustration_flavor.1501.t: "Lampa wciąż płonie"
 latria_sexual_frustration_flavor.1501.desc.dead: "Sztylet wyślizguje mi się z dłoni, a odgłos uderzenia o podłogę zatrzymuje kroki za drzwiami. Drzwi się otwierają; ktoś przykuca obok, woła moje imię, po czym odwraca się i każe wezwać pomoc. Lampa stoi na swoim miejscu, lecz nie potrafię rozpoznać twarzy przede mną.\n\nChcę dać znać, że słyszę; poruszam wargami, lecz nie wydobywa się żaden dźwięk. Ze wszystkich słów, które jeszcze przed chwilą powracały do mnie w samotności, nie potrafię już odtworzyć ani jednego całego zdania. Ktoś ujmuje moją dłoń i pyta, czy mogę otworzyć oczy; potrafię jedynie patrzeć na drzwi za stojącą przede mną osobą.\n\nDo komnaty wpadają kolejne pospieszne kroki. Próbuję odwrócić głowę ku odgłosom, lecz postacie przy drzwiach już się rozmywają, aż w końcu nie rozróżniam nawet światła lampy."
 latria_sexual_frustration_flavor.1501.desc.survived: "Gdy odzyskuję przytomność, mam już świeże nocne odzienie, a rany są starannie opatrzone. Osoba przy łóżku widzi, że otwieram oczy, i natychmiast przywołuje kogoś ze służby, kto właśnie zamierza wyjść. Dowiaduję się, że hałas zwrócił czyjąś uwagę i drzwi otworzyły się w porę; sztylet już zabrano.\n\nPróbuję się podnieść, lecz ból zatrzymuje mnie, zanim zdążę oderwać się od poduszki. Osoba obok poprawia okrycie i pyta, czy chcę wody; kiwam głową, lecz znów patrzę na niewysłany list leżący na stole. Kartki wciąż leżą w stosie, a na wierzchniej widać wielokrotnie poprawiany zwrot do osoby, do której piszę.\n\nKtoś podnosi kubek do moich ust; wypijam tylko jeden łyk. Osoba czuwająca przy łóżku nie odchodzi; czeka, aż znów wygodnie się ułożę, i dopiero wtedy cicho odstawia kubek."
 latria_sexual_frustration_flavor.1501.desc.severe: "Gdy odzyskuję przytomność, najpierw słyszę przyciszoną rozmowę przy łóżku. Ktoś pyta, czy takie rany mogą się zagoić; po chwili wahania odpowiedzią jest prośba o więcej czystego płótna. Próbuję się odwrócić i zobaczyć, kto tam jest, lecz najmniejszy ruch sprawia taki ból, że nie mogę mówić.\n\nSztyletu nie ma już pod ręką; odsunięto nawet niewielki stolik przy łóżku. Proszę o pomoc przy siadaniu, lecz osoba obok tylko podnosi poduszkę i radzi mi na razie leżeć. Światło za oknem już się zmieniło, a ja wciąż myślę o niespokojnych nocach i odpowiedzi, która nigdy nie nadeszła.\n\nCzyjaś dłoń sięga, by poprawić pościel. Chcę poprosić o ostrożniejszy ruch, ale zanim kończę mówić, zaciskam dłoń na prześcieradle pod sobą."
 latria_sexual_frustration_flavor.1501.a.dead: "Wszystko… ciemnieje…"
 latria_sexual_frustration_flavor.1501.a.survived: "Boli…"
 latria_sexual_frustration_flavor.1501.a.severe: "Nie dotykaj mnie… boli…"

 latria_sexual_frustration_flavor.1502.t: "Pusty kielich"
 latria_sexual_frustration_flavor.1502.desc.dead: "Kubek jest pusty; opierając się bezwładnie o brzeg łóżka, słyszę otwierane drzwi. Ktoś woła moje imię, po czym na widok rzeczy na stole odwraca się i wzywa pomoc, nie zatrzymując się nawet, by zamknąć drzwi. Ktoś zaczyna biec korytarzem, a wpadający do komnaty przeciąg porusza niedokończonym listem.\n\nWciąż pamiętam ostatnie zdanie urwane w połowie i pióro leżące obok kartki. Ktoś podtrzymuje mnie za ramiona, pyta o zawartość kubka i prosi, by wytrzymać jeszcze chwilę. Patrzę w stronę stołu, chcąc dopowiedzieć to, co zostało niewyjaśnione, lecz dłoń nie sięga nawet rogu kartki zwisającego przed moimi oczami.\n\nOsoba obok wciąż mnie woła, lecz głos staje się coraz bardziej odległy. Nie potrafię już odczytać liter w liście ani wydać z siebie choćby słowa odpowiedzi."
 latria_sexual_frustration_flavor.1502.desc.survived: "Wypita trucizna nie odebrała mi życia. Gdy się budzę, w komnacie stoi już misa świeżej wody. Przy łóżku od dawna ktoś czuwa; widząc, że otwieram oczy, wstaje, by przywołać pozostałe osoby, a potem znów zwraca się do mnie i pyta, czy rozpoznaję komnatę.\n\nKubek zabrano ze stołu, a niedokończony list leży przyciśnięty książką. Chcę po niego sięgnąć, lecz nawet przysunięcie się do brzegu łóżka wymaga wysiłku. Osoba czuwająca podaje mi wodę, czeka, aż skończę pić, i pyta, komu przekazać list; patrzę na odsłonięte pół linijki i milczę.\n\nZa oknem ludzie zaczynają już krzątać się przy swoich sprawach. Myślę o tym, czym zwykle zajmuję się o tej porze, lecz mogę jedynie oprzeć się o poduszkę i słuchać, jak służba odprawia spod drzwi osoby proszące o spotkanie."
 latria_sexual_frustration_flavor.1502.desc.severe: "Trucizna nie odebrała mi życia, lecz nadal nie mogę wstawać bez pomocy jak dawniej. Ktoś przynosi śniadanie i kładzie przy łóżku świeżą odzież; gdy wyciągam rękę, okazuje się, że nie potrafię nawet utrzymać prosto dobrze znanej miski.\n\nKtoś ze służby poprawia moje mankiety i podaje mi jedzenie kęs po kęsie. Chcę zapytać, jak długo już tu leżę, lecz w połowie zdania muszę przerwać, żeby odpocząć. Na stole zebrało się kilka nowych listów; gdy słyszę propozycję przeczytania ich na głos, najpierw proszę o sprawdzenie, czy jest wśród nich znajome imię.\n\nOsoba ze służby przegląda listy jeden po drugim i lekko kręci głową. Patrzę na stos listów i unoszę dłoń, by odsunąć nieco miskę, lecz nawet z tym muszę czekać, aż ktoś się ku mnie pochyli."
 latria_sexual_frustration_flavor.1502.a.dead: "Nie… mogę mówić…"
 latria_sexual_frustration_flavor.1502.a.survived: "Tak mi niedobrze… trochę wody…"
 latria_sexual_frustration_flavor.1502.a.severe: "Nie mogę nawet unieść ręki…"

 latria_sexual_frustration_flavor.1503.t: "Na brzegu rzeki"
 latria_sexual_frustration_flavor.1503.desc.dead: "Nie widzę już brzegu rzeki; słyszę tylko czyjeś wołanie w oddali. Jeszcze przed chwilą udawało mi się rozróżnić własne imię, lecz teraz docierają do mnie tylko urywane dźwięki. Próbuję spojrzeć w tamtą stronę, lecz migotliwe światło przed oczami nie pozwala mi rozpoznać drzew na brzegu.\n\nW chwili mojego wyjścia lampa chyba jeszcze się paliła, a książka leżała otwarta na stole. Tak długo wzrok zatrzymywał się na tej samej stronie, a przy wyjściu nawet wstążka zakładki pozostała nie na miejscu. Ktoś przyjdzie posprzątać komnatę i zapyta, gdzie jestem; myślę o tej znajomej twarzy i chcę powiedzieć, że jestem tutaj.\n\nDociera do mnie kolejne wołanie, ale nie potrafię odpowiedzieć. Światło przed oczami przygasa, a nawet wspomnienie komnaty z wciąż płonącą lampą zaczyna się zacierać."
 latria_sexual_frustration_flavor.1503.desc.survived: "Wyciągają mnie z rzeki; gdy odzyskuję przytomność, kulę się na brzegu, a ktoś owija mnie płaszczem. Osoba obok widzi, że otwieram oczy, pospiesznie przywołuje kogoś z oddali, a potem przykuca i pyta, czy dobrze słyszę. Z ubrania wciąż kapie rzeczna woda, a zimno nie pozwala mi odpowiedzieć.\n\nKtoś mówi, że posłano już po nosze, i radzi mi nie próbować jeszcze wstawać. Patrzę na ścieżkę prowadzącą do mojego lokum i przypominam sobie słowa, które wciąż krążyły mi po głowie podczas samotnej drogi tutaj. Na pytanie, kogo powiadomić, podaję imię, a potem cicho je powtarzam, bojąc się, że nie zostało usłyszane.\n\nKtoś ponownie otula mnie szczelniej płaszczem. Ktoś obiecuje przekazać wiadomość; osoba, która zostaje, podtrzymuje mnie za ramię i czeka ze mną na odgłos kroków na ścieżce."
 latria_sexual_frustration_flavor.1503.desc.severe: "Z chwili wynoszenia mnie na brzeg pamiętam tylko głos nalegający, by szybko wracać. Gdy znów się budzę, mokrą odzież już zmieniono, a przy łóżku stoi kilka osób. Chcę zapytać, jak długo trwała utrata przytomności, lecz napad kaszlu przerywa mi, zanim zdołam choćby zwrócić się do kogoś po imieniu.\n\nPrzy łóżku cicho mówi się o chorobie płuc i prosi o zamknięcie okna. Płótno na moim czole zmieniano już kilka razy, lecz nadal nie potrafię odróżnić dnia od nocy. W chwilach jasności wciąż spoglądam ku drzwiom, czekając na kogoś znajomego; pojawia się tam jednak tylko ktoś ze służby z wodą i cicho pyta, czego potrzebuję.\n\nKręcę głową i próbuję usiąść stabilnie, opierając się o poduszkę. Ledwie osoba przy łóżku wyciąga rękę, by pomóc, kaszel znów przerywa słowa, których nie zdążam wypowiedzieć."
 latria_sexual_frustration_flavor.1503.a.dead: "Tak zimno…"
 latria_sexual_frustration_flavor.1503.a.survived: "Wciąż… żyję?"
 latria_sexual_frustration_flavor.1503.a.severe: "Nie… mogę złapać tchu…"

 latria_sexual_frustration_flavor.1504.t: "Pod urwiskiem"
 latria_sexual_frustration_flavor.1504.desc.dead: "Leżę pod urwiskiem i słyszę nawoływania osób szukających mnie na górskiej ścieżce. Jeden głos woła moje imię, drugi nalega, by szukać niżej, a w pobliżu toczą się drobne kamienie. Próbuję unieść rękę, żeby mnie dostrzeżono, lecz pozostaje przy boku i nie porusza nawet skraju ubrania.\n\nSylwetka góry zasłania większą część nieba, a ja nie pamiętam, ile czasu minęło od mojego wyjścia. Przy wyjściu pada pytanie o porę powrotu; podaję jakąś godzinę od niechcenia, lecz teraz nie pamiętam już własnej odpowiedzi. Kroki zbliżają się; otwieram usta, ale nadal nie wydobywa się żaden dźwięk.\n\nWreszcie ktoś zatrzymuje się blisko i pochyla, wołając do mnie. Nie potrafię rozpoznać twarzy przede mną ani nawet skrawka nieba, który jeszcze widać nad głową."
 latria_sexual_frustration_flavor.1504.desc.survived: "Budzę się pod urwiskiem; ktoś przykuca obok i woła mnie po imieniu. Na moją reakcję osoba obok odwraca się i przywołuje resztę grupy, wskazując zejście górską ścieżką. Już chcę zapytać, gdzie jestem, gdy rozpoznaję skalną ścianę nade mną i nie śmiem znów na nią spojrzeć.\n\nRany po upadku nie pozwalają mi wstać; nawet po drobnym ruchu muszę przerwać, by złapać oddech. Osoba obok każe mi poczekać na nosze, podnosi leżące w pobliżu okrycie i kładzie je na mnie. Patrzę na zapięcie i przypominam sobie poprawianie go przed lustrem tuż przed wyjściem; już wtedy myśli krążyły wokół zaproszenia bez odpowiedzi.\n\nKroki docierają blisko, a kilka osób po cichu naradza się, jak mnie podnieść. Próbuję się obrócić, żeby ułatwić zadanie, lecz krzyczę, zanim zdołam się poruszyć."
 latria_sexual_frustration_flavor.1504.desc.severe: "Budzę się pod urwiskiem, w otoczeniu osób niosących pomoc, lecz nikt nie zabiera głosu. Rozpoznaję jedną z tych osób i pytam, czy nie pora wracać. Osoba obok poprawia przykrywające mnie okrycie, spogląda ku ścieżce i ponagla grupę niosącą nosze.\n\nPróbuję wstać, lecz ktoś od razu mnie podtrzymuje i prosi, żeby się nie ruszać. Spoglądam na nogi; osoba obok z wahaniem mówi, że być może nie będę już chodzić tak jak dawniej. Leżący obok but nadal jest ubłocony; patrzę na niego i przypominam sobie noce spędzane na korytarzu w oczekiwaniu na odpowiedź.\n\nKtoś pyta, czy jeszcze czegoś potrzebuję. Chcę poprosić o podanie buta, lecz zamiast tego pytam, czy do mojego lokum dotarły jakieś wieści; przez chwilę nikt nie odpowiada."
 latria_sexual_frustration_flavor.1504.a.dead: "Nic nie słyszę…"
 latria_sexual_frustration_flavor.1504.a.survived: "Nie mogę się ruszyć… boli…"
 latria_sexual_frustration_flavor.1504.a.severe: "Moje nogi…"

 latria_sexual_frustration_flavor.1505.t: "Wyważone drzwi"
 latria_sexual_frustration_flavor.1505.desc.dead: "Gdy drzwi sypialni ustępują pod uderzeniami, słyszę, jak ktoś rozpaczliwie woła moje imię. Światło z korytarza wpada do komnaty; kilka osób tłoczy się w drzwiach, aż stojąca z przodu osoba każe im biec po pomoc. List wciąż leży przy łóżku; chcę zwrócić na niego uwagę, lecz nie potrafię już skierować tam wzroku.\n\nKtoś podchodzi bliżej; głos brzmi tak znajomo, że chcę odpowiedzieć. Rozumiem każde słowo, ale nie potrafię nic powiedzieć; widzę tylko usta przede mną, które bez przerwy się poruszają. Zza drzwi pada pytanie, lecz osoba pochylona nade mną nie odwraca się i nadal czeka na choćby najmniejszą odpowiedź.\n\nPróbuję jeszcze raz dostrzec tę twarz, lecz przed oczami robi się coraz ciemniej. Światło w drzwiach znika, a potem przestaję słyszeć także nawoływania."
 latria_sexual_frustration_flavor.1505.desc.survived: "Drzwi sypialni wyważono, a pomoc nadeszła w porę. Z łóżka widzę wygięty rygiel; ktoś ze służby przynosi krzesło, by czuwać za drzwiami. Ktoś poprawia poduszkę i pyta, czy mogę mówić; wydobywam z siebie tylko ochrypłą odpowiedź.\n\nSznura już nie ma, a list leżący przy łóżku również przeniesiono. Próbuję się obrócić, żeby go poszukać, lecz rany zatrzymują mnie w połowie ruchu. Osoba, która się mną opiekuje, podąża za moim wzrokiem i kładzie list w zasięgu oczu; niedokończone imię na końcu wciąż nie pozwala mi odwrócić spojrzenia.\n\nUnoszę rękę, prosząc gestem, by na razie nie zadawano pytań. Osoba obok kiwa głową, przysuwa wodę i czeka, aż trochę dojdę do siebie, zanim poprawi moje okrycie."
 latria_sexual_frustration_flavor.1505.desc.severe: "Ktoś przy łóżku woła moje imię; wiem, że czeka na odpowiedź, ale nie rozumiem, co należy powiedzieć. Wszystkie sprzęty w sypialni wydają się znajome, lecz krzesło przy oknie jakby zmieniło miejsce. Wpatruję się w nie, aż ktoś delikatnie poprawia mi rękaw.\n\nKtoś pomaga mi się umyć i przebrać, po czym przynosi jedzenie. Patrzę na zbliżającą się łyżkę i dopiero po przypomnieniu osoby obok pamiętam, by otworzyć usta. Ktoś wspomina o liście, a inna osoba zerka na skrzynkę przy łóżku. Też patrzę w tamtą stronę, lecz gdy już mam o coś zapytać, zapominam, jakie to było pytanie.\n\nWieko skrzynki jest już zamknięte. Osoba przy łóżku znów woła moje imię; tym razem odwracam głowę i widzę, jak dłonie przede mną nieruchomieją."
 latria_sexual_frustration_flavor.1505.a.dead: "Ja…"
 latria_sexual_frustration_flavor.1505.a.survived: "Daj mi… złapać tchu…"
 latria_sexual_frustration_flavor.1505.a.severe: "Czy ktoś… mnie woła?"
