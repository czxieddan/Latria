l_polish:
 latria_sexual_frustration_flavor.1401.t: "Nieużyty sygnet"
 latria_sexual_frustration_flavor.1401.desc.female: "W nocnej koszuli składam wciąż na nowo list przy łóżku. Nie ma podpisu, a powitanie jest skreślone, lecz głębokich zagięć nie da się już ukryć. Na rogu stołu czeka ogrzany wosk. Wystarczy przyłożyć sygnet, by dzisiejsze myśli trafiły w cudze ręce.\n\nRozkładam list i zatrzymuję się przy zaproszeniu na spotkanie. Godzina, miejsce, nawet drzwi, którymi należy wejść — wszystko jest jasne. Za dnia mogłam uznać to za luźne zapiski. Teraz posłaniec czeka na korytarzu i nie znajduję już stosownej wymówki.\n\nZa drzwiami szeleści tkanina. Podnoszę sygnet, drugą dłonią wciąż przytrzymując zamknięty list. Nikogo nie wołam do środka."
 latria_sexual_frustration_flavor.1401.desc.male: "Siedzę w nocnej koszuli na brzegu łóżka, trzymając sygnet. List na stole jest zapisany do ostatniej linijki. Atrament wysechł, tylko miejsce na podpis pozostało puste. Sługa przygotował wosk i zamknął okno. Wychodząc, nie zapytał, dlaczego jeszcze nie odpoczywam.\n\nZnam każde zdanie i wiem, jak zostanie odczytane. Jeśli dodam imię i pieczęć, nie zdołam już nazwać tego zaproszenia przelotnym żartem. Słowa tyle razy poprawiane w myślach nie zostawiają mi na papierze żadnego miejsca do ukrycia.\n\nOd dawna ściskam sygnet. Obracam go właściwą stroną i patrzę na światło w szparze drzwi. Nadal nie przywołuję posłańca."
 latria_sexual_frustration_flavor.1401.desc: "Podnoszę sygnet i znów go odkładam, zwlekając z zapieczętowaniem listu. Brzeg jest równo złożony, wosk gotowy, a przy stole nie czeka żadna inna praca. Mimo to jeszcze raz wygładzam róg papieru, jakby jakieś zagięcie usprawiedliwiało zwłokę.\n\nTo zdanie już istnieje. Rano posłaniec zapyta tylko, dokąd iść, nie rozstrzygnie za mnie, czy list należy wysłać. Dwa razy czytam adres, myśląc o odpowiedzi, która może nadejść, i o tym, że może nie nadejść żadna.\n\nWosk w łyżeczce zaczyna krzepnąć. Przesuwam go bliżej płomienia, lecz wolna dłoń znowu przyciska list do stołu."
 latria_sexual_frustration_flavor.1401.a: "Dokończyć list i przyłożyć pieczęć."
 latria_sexual_frustration_flavor.1401.b: "Odłożyć sygnet, stłumić tęsknotę i się położyć."

 latria_sexual_frustration_flavor.1402.t: "Ostatnia uczta"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Uczta dobiega końca, ale goście nadal mówią o kochankach, zaręczynach i dawnych przyjemnościach. Ktoś zapina płaszcz, po czym odwraca się, by dopowiedzieć zakończenie. Słuchacze śmieją się i proszą służbę o jeszcze trochę wina. Tutaj nikt nie musi przy takich słowach ściszać głosu.\n\nStoję już przy krześle, gdy znajoma nazwa miejscowości skłania mnie, by znów usiąść. Mam z nią własne wspomnienia, nigdy tak lekko nieopowiadane. Próbuję coś wtrącić. Osoba obok odkłada puchar i czeka; nagle wszystkie długo skrywane słowa cisną mi się na usta.\n\nMuzycy chowają instrumenty. Gospodarz zerka ku drzwiom sali, lecz moje okrycie wciąż spoczywa na oparciu."
 latria_sexual_frustration_flavor.1402.desc.strict: "Podczas uczty ktoś wspomina o szlachcicu, który stracił pozycję przez potajemną miłość. Krążący dzban wina zatrzymuje się. Jedna osoba pyta o jego ród, druga cicho stwierdza, że planowane małżeństwo zapewne też przepadnie. Siedzę na końcu stołu, słuchając, jak punkt po punkcie rozstrzygają czyjeś życie.\n\nMoje imię nie pada. A jednak na pytanie sąsiada, dlaczego tak milczę, nie potrafię odpowiedzieć nawet zwykłym uśmiechem. Zwierzenia, w których miało pomóc wino, raz rozpoczęte mogłyby już nie dać się cofnąć.\n\nSługa przychodzi po mój pusty talerz. Odsuwam rękę, ale puchar nadal trzymam, długo nie dopijając ostatniego łyku."
 latria_sexual_frustration_flavor.1402.desc: "Dopiero widok służby zbierającej naczynia uświadamia mi, że uczta się kończy. Kilkoro gości żegna się przy drzwiach, gospodarz pyta o konie i wozy, a przede mną wciąż stoi niemal pełny puchar. Słowa, które miały paść, ani razu nie znalazły odpowiedniej chwili.\n\nOsoba obok poprawia płaszcz i pyta, czy wyjdziemy razem. Przytakuję, po czym znów wspominam dawne zdarzenie. Początek został już opowiedziany, lecz wracam do niego, jakby wystarczyło dobrze wypowiedzieć tę jedną frazę, by wieczór nie skończył się właśnie tak.\n\nDłoń przy zapięciu płaszcza nieruchomieje. Odsuwam puchar; echo w sali brzmi znacznie wyraźniej niż przed chwilą."
 latria_sexual_frustration_flavor.1402.a: "Zatrzymać ostatnich gości przy stole i wciąż opowiadać o swoich troskach."
 latria_sexual_frustration_flavor.1402.b: "Stłumić tę myśl, podziękować gospodarzom i odejść."

 latria_sexual_frustration_flavor.1403.t: "Wyznanie bez świadków"
 latria_sexual_frustration_flavor.1403.desc.favors: "Zostaję przy ołtarzu bez towarzystwa i słyszę, jak ostatni sługa świątynny cicho zamyka drzwi. Święta księga nadal leży otwarta na pulpicie, ze wstążką przy stronie o przyjemnościach cielesnych. Znam tę naukę. Wiara nie każe mi uważać tego pragnienia za grzech.\n\nA jednak gdy nikogo nie ma, nie wiem, od czego zacząć. Pytania przygotowane za dnia są zbyt staranne: zręcznie omijają osobę, którą tak chcę zobaczyć. Powtarzam jedno zdanie, urywam, a potem cicho wypowiadam imię dotąd ukryte za zdawkowym określeniem.\n\nW świątyni nie ma odpowiedzi. Odsuwam rękę od księgi i nadal klęczę, patrząc na światło gasnące pod drzwiami."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Klęczę przed ołtarzem bez towarzystwa. Szata jest schludna, lecz modlitwa raz po raz urywa się w tym samym miejscu. Ostatni wychodzący sługa zapytał, czy zostawić lampę. Skinienie mojej głowy sprawiło, że została; teraz jest tu tylko ona i niedoczytana święta księga.\n\nPamiętam wszystkie przykazania, znam też na pamięć słowa pokuty. Lecz przy każdym wyrzeczeniu się pragnienia myślę o niezniszczonym liście. Wiem doskonale, gdzie leży: tuż przed wyjściem z pokoju trafia między strony, których nikt inny nie będzie przeglądać.\n\nNikt nie ponagla, a przez to jeszcze trudniej dokończyć następne zdanie. Za drzwiami słychać kroki zmiany warty. Pochylam głowę i znów czytam od początku."
 latria_sexual_frustration_flavor.1403.desc: "Czekam, aż ucichną wszystkie kroki, ale nie odchodzę od ołtarza. Ławy stoją równo, wstążka świętej księgi zwisa przy pulpicie, a przy wejściu pozostał pusty kubek zapomniany przez sługę. Gdy byli tu inni, wydawało mi się, że nie potrafię przemówić.\n\nTeraz nie ma nikogo. Próbuję opowiedzieć od początku o tym, co mnie dręczy. W połowie słyszę, że znów osłaniam się znajomymi zdaniami. Milknę, spoglądam na drzwi i powtarzam cicho. Tym razem nie pomijam imienia tej osoby.\n\nŚwiatło pada przed moje kolana. Nie wstaję od razu; słucham, jak te słowa powoli cichną w pustej sali."
 latria_sexual_frustration_flavor.1403.a: "Nie składać już ślubów wstrzemięźliwości i przyznać się do swojego wyboru."
 latria_sexual_frustration_flavor.1403.b: "Powściągnąć pożądanie i klęczeć aż do porannej modlitwy."

 latria_sexual_frustration_flavor.1404.t: "Nazwać pragnienie"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Stoję bez ubrania przed brązowym lustrem w sypialni. Szata leży na oparciu krzesła, służba odeszła, zasuwę zamykam własną ręką. Odbicie nie ucieka wzrokiem. Ja też wreszcie nie szukam w pośpiechu błahej czynności, która odwróciłaby uwagę.\n\nOd pewnego czasu chęć ujrzenia tej osoby nazywam zmęczeniem, znużeniem, bezsennością po uczcie. Każda nowa nazwa dodaje linijkę do listu na stole, który wciąż nie zostaje wysłany. Wiem, na co czekam, i mam dość porannego skreślania gotowych słów.\n\nNa stole leży świeża kartka. Patrzę na nią i po raz pierwszy poważnie rozważam, czy początek potrzebuje jeszcze tych wszystkich uprzejmych powitań."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Siedzę bez ubrania na skraju łóżka, mocno splatając dłonie. Odzież jest obok, modlitewnik wciąż nieodłożony. Znajomy ustęp miał poprzedzić sen, ale długo tkwię przy tej samej linijce, nawet raz myląc liczbę sygnałów nocnej straży za oknem.\n\nJeśli nadal dochowuję przysięgi, to nie dlatego, że znika pragnienie czyjejś bliskości. Ledwie pojawia się imię tej osoby, wiem, że nie mogę już zbyć sprawy zapewnieniem o braku pokus. Otwieram stronę ze ślubowaniem i czytam wolniej niż zwykle, rozważając, czy każde zdanie rzeczywiście jest moim wyborem.\n\nKartka zatrzymuje się między palcami. Za drzwiami już cisza. Nie zamykam księgi ani nie pospieszam pozostałych słów."
 latria_sexual_frustration_flavor.1404.desc: "Noc jest głęboka. Siedząc w sypialni, wreszcie przyznaję, że nadal chcę zobaczyć tę osobę. List na stole ma już kilka wersji. Z każdej znika najważniejsze zdanie, zostają pogoda, plany podróży i nieistotne uprzejmości.\n\nRozkładam kartki po kolei i patrzę na niemal identyczne początki. Są przyzwoite, lecz ich odbiorca nigdy nie dowie się, dlaczego tak długo nie gaszę światła. Napisanie dziś kolejnego listu nie będzie postępem, jeśli zmienię jedynie powitanie.\n\nKładę pióro obok czystej kartki. Za oknem znów rozlega się sygnał straży. Tym razem nie służy mi za wymówkę, by położyć się spać."
 latria_sexual_frustration_flavor.1404.a: "Przyznać się do swojego pragnienia i tej nocy już z nim nie walczyć."
 latria_sexual_frustration_flavor.1404.b: "Ponownie się ubrać i stłumić tę myśl."

 latria_sexual_frustration_flavor.1405.t: "Karta kroniki"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Kronikarz pochyla się nad stołem, czekając, aż zdecyduję, co warto zachować. Stoję za nim w uroczystym stroju. Atrament niedawno podyktowanych nadań i poborów jeszcze nie wysechł. Przy jutrzejszym ceremoniale urywam i zamiast niego wspominam długie noce, których nikt nie zapisuje.\n\nPióro nie rusza od razu. Przy drzwiach sługa zmienia pozycję; wiem, że wszyscy słyszą. Dotąd wystarczały mi zwykłe dzienne audiencje, by wierzyć, że te udręki pozostaną w sypialni. Kiedy jednak kronikarz pyta, czy wiernie je zanotować, nie potrafię już odruchowo odmówić.\n\nNowa strona jest rozłożona. Pióro zawisa nad pustym miejscem, a wszyscy czekają na dalszy ciąg mojego zdania."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Kopista siedzi przy stole i pyta, czy ten odcinek podróży również trafi do kroniki. Wyliczam przeprawy, noclegi i kilka opóźnień. Zapisuje je kolejno, po czym podnosi wzrok, czekając na następną nazwę. Tuż przy mojej dłoni z bagażu wystaje niewysłany list.\n\nNie każdy postój wynikał z deszczu czy pękniętej osi. Był też objazd, żeby znów kogoś zobaczyć, którego prawdziwej przyczyny towarzysze nigdy nie poznali. Teraz czytam uporządkowane nazwy miejsc i czuję, że właśnie pominięta sprawa najtrudniej dawała mi się zostawić za sobą.\n\nKopista zanurza pióro. Wyjmuję list, nie otwieram go, tylko najpierw wygładzam róg obok mapy."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Poprawiam szaty liturgiczne i podchodzę do pisarza. Zamierzał notować darowizny i naprawy; słysząc zmianę tematu, sięga po nową kartkę. Święta księga obok nadal jest otwarta na ustępie, który za dnia objaśniam innym.\n\nPrzysięga i pragnienie są równie prawdziwe. Nie chcę przedstawiać siebie jako kogoś, kto nigdy się nie waha. Wiem też, że zapisane słowa przestaną być tylko moim wspomnieniem. Pisarz pyta, czy zachować imię tej osoby, tak cicho, jakby obawiał się, że ktoś za drzwiami zrozumie.\n\nPatrzę na pustą linijkę. Paciorki modlitewne nadal oplatają nadgarstek. Nie przesuwam ich, by uniknąć odpowiedzi."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Pisarz czeka na moje słowa. Mam na sobie uroczysty strój, obok leży pieczęć używana podczas narady. Po sprawach publicznych wspominam jednak prywatną historię, długo tłumioną w sercu. Służba przy drzwiach nie wychodzi. W pokoju nagle robi się cicho.\n\nZaczynam od dawnego listu, potem opowiadam o kilku spotkaniach, do których nie doszło. Pisarz notuje wolniej, przy każdym niejasnym miejscu spoglądając na mnie. Miał znaleźć stosowne sformułowania za mnie; kiedy jednak słyszę własne słowa powtórzone, nie chcę już, by zmieniały się w inną historię.\n\nPodaje mi zapisaną połowę strony. Biorę papier i zatrzymuję wzrok na pierwszym określeniu, które niczego nie ukrywa."
 latria_sexual_frustration_flavor.1405.desc: "Podchodzę do stołu pisarza z zamiarem wyjaśnienia tego, co tak długo skrywam. Odsuwa urzędowe dokumenty, rozkłada nową kartkę i pyta, od czego zacząć. Podaję datę, po czym urywam: to nie wtedy naprawdę się zaczęło.\n\nWracam do listu, krótkiego spotkania i kilku późniejszych bezsennych nocy. Pióro sunie cicho po papierze, lecz te słowa ktoś inny będzie mógł przeczytać od początku do końca. Pisarz nie osądza. Gdy mówię niejasno, jedynie czeka, zostawiając nieco pustego miejsca.\n\nGotowa kartka leży między nami. Czy pokaże ją trzeciej osobie — w tej sprawie nadal czeka na moje polecenie."
 latria_sexual_frustration_flavor.1405.a: "Pozwolić, by odpisy krążyły i każdy mógł je przeczytać."
 latria_sexual_frustration_flavor.1405.b: "Kazać skrybie spisać tylko moje obowiązki, a resztę przemilczeć."

 latria_sexual_frustration_flavor.1406.t: "Gdy goście odchodzą"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Ostatni goście nadal mówią o kochankach i zaręczynach. Ledwie wspominam własną przeszłość, z boku stołu dobiega cichy śmiech. Z pucharem w dłoni jego autor nie widzi w tym nic niegrzecznego i z uśmiechem domaga się dalszego ciągu.\n\nTa historia pozostaje we mnie tak długo, że nagła przemiana w rozrywkę przy winie odbiera mi głos. Ktoś obok dopowiada przypuszczenie, ktoś inny żartuje ze słów w liście. Próbuję sprostować, lecz mówię coraz bardziej pospiesznie. Na język cisną się nawet szczegóły, które miały pozostać niewypowiedziane.\n\nSługa przychodzi po ostatni dzban. Przytrzymuję brzeg pucharu i słyszę, jak ktoś przysuwa krzesło, czekając na drugą część."
 latria_sexual_frustration_flavor.1406.desc.strict: "Wieść o szlachcicu, który stracił pozycję przez potajemną miłość, dociera do stołu, zanim kończę opowieść. Ktoś obok nagle pyta o coś szeptem, inna osoba patrzy na mnie i krótko się śmieje. Kto przed chwilą przytakiwał, teraz zajmuje się wyłącznie serwetą.\n\nWiem, że pora przestać, lecz nie chcę, żeby ta cisza dokończyła za mnie historię. Im usilniej próbuję wyjaśnić, że nie mam związku ze skandalem, tym więcej objaśnień zdają się wymagać wcześniejsze słowa. Przy drzwiach goście już się żegnają. Nikt z pozostałych nie prosi o ciąg dalszy.\n\nOdstawiam puchar trochę za mocno. Spojrzenia nadal na mnie ciążą. Muszę zdecydować, do kogo skieruję następne zdanie."
 latria_sexual_frustration_flavor.1406.desc: "Goście zamierzają odejść, a ja wciąż nie kończę. Przy wzmiance o starym liście sąsiedzi wymieniają spojrzenia i z boku pada krótki śmiech. Milknę, dopiero teraz dostrzegając, że osoby przede mną dawno odłożyły sztućce i słuchają już tylko mnie.\n\nChcę wyjaśnić, dlaczego to zdanie było ważne, lecz zamiast tego opowiadam je po raz drugi. Ktoś grzecznie kiwa głową, ktoś zerka na drzwi, ktoś chowa uśmiech za pucharem. Widzę wszystko i tylko bardziej się spieszę, jakby brakowało ostatniej frazy, by wreszcie zrozumieli.\n\nGospodarz już stoi. Krzesła przede mną pozostają nieruchome, a zza pleców dobiegają pożegnania."
 latria_sexual_frustration_flavor.1406.a: "Dalej opowiadać swoją historię i odpowiadać przy całym stole każdemu, kto mnie wyśmiewa."
 latria_sexual_frustration_flavor.1406.b: "Zamilknąć, ukłonić się zebranym i ich pożegnać."

 latria_sexual_frustration_flavor.1407.t: "Modlitwa przy gasnącej świecy"
 latria_sexual_frustration_flavor.1407.desc.favors: "W nocnej koszuli siedzę przy łóżku i otwieram modlitewnik na stronie o przyjemnościach cielesnych. Nauki zwyczajne za dnia teraz czytam wielokrotnie. Drzwi są zaryglowane, inni odeszli, a w lampie została resztka oliwy.\n\nWiara nie każe mi zaprzeczać własnemu pragnieniu, ale nadal nie wiem, jak zmierzyć się z uczuciem bez odpowiedzi. Wypowiadam do siebie słowa, które chcę przekazać. Bez pozdrowień i uprzejmości zostają tak krótkie zdania, że na długo milknę.\n\nPłomień się kurczy. Zaznaczam stronę wstążką, nie zamykając od razu księgi i nie szukając dalej innej odpowiedzi."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Zbieram poły nocnej koszuli i cicho powtarzam ślubowanie czystości. Knot jest już krótki, litery w modlitewniku coraz trudniej odróżnić w mroku. Mimo to czytam; przy każdej pomyłce wracam do początku, jakby dokładność miała wystarczyć do przetrwania nocy.\n\nLecz w połowie wracają słowa wypowiedziane za dnia przez tę osobę. Pamiętam przysięgę. Pamiętam też, dlaczego tak trudno było się pożegnać. Gdy te dwie rzeczy stoją obok siebie, znajome odpowiedzi nagle przestają wystarczać.\n\nLampa ma zgasnąć. Osłaniam płomień dłonią. Następne zdanie jest przed oczami; patrzę długo, wciąż bez słowa."
 latria_sexual_frustration_flavor.1407.desc: "W pokoju została tylko dogasająca lampa, a moje oczy nadal są otwarte. Modlitewnik leży na kolanach; ta sama strona została przeczytana już kilka razy. Za oknem przechodzi nocny strażnik. Jego kroki milkną za rogiem, lecz ja nadal czekam na następny.\n\nPrzysuwam księgę do światła, szukając miejsca przerwanej lektury. Nie ma tam trudnych słów. Znam powód: przy końcu wiersza wraca pytanie, które należało wyjaśnić za dnia. Teraz nikt nie odpowie, a ja wciąż układam cudzą odpowiedź.\n\nResztka oliwy połyskuje na dnie. Wkładam wstążkę, dłoń zostawiam na okładce i nie zdmuchuję płomienia."
 latria_sexual_frustration_flavor.1407.a: "Odłożyć ślub czystości i oddać się myślom o tym uczuciu."
 latria_sexual_frustration_flavor.1407.b: "Powściągnąć myśli i odmawiać modlitwy aż do świtu."

 latria_sexual_frustration_flavor.1408.t: "Milczenie przed lustrem"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Stoję bez ubrania przed lustrem. Przy łóżku leży odzież zdjęta za dnia, na stole zaproszenie zapisane do połowy. Przed tym zwierciadłem zwykle poprawiam wygląd i obmyślam słowa na nasze spotkanie. Gdy jednak do niego dochodzi, mówię tylko o rzeczach zwyczajnych.\n\nDość już tych powrotów. Nie chcę dłużej nazywać od dawna trwającego pragnienia przypadkową myślą ani przy każdym spotkaniu czekać, aż druga osoba odezwie się pierwsza. Przy lustrze leży przyciśnięty niedokończony list. Na końcu wystarczy jeszcze miejsca na jedno jasne zdanie.\n\nOdwracam się do biurka i patrzę na zaschnięty atrament na piórze. Nikt z zewnątrz mnie nie ponagla. Tym razem również obowiązki nie odpowiedzą za mnie."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Siedzę bez ubrania na skraju łóżka, mocno zaciskając dłonie. Przy lustrze leżą równo złożone szaty, a na nich modlitewnik. Wyznaczony rozdział jest przeczytany, lecz zwykły spokój nie przychodzi. Im cichszy pokój, tym trudniej pominąć to uczucie.\n\nCzystość pozostaje moim wyborem. Nie chcę jednak mówić o wytrwaniu tak lekko, jakby po lekturze świętej księgi nigdy nie było innych myśli. Układam w głowie jutrzejsze zajęcia. Przy godzinie spotkania z tą osobą zatrzymuję się i zaczynam je porządkować od nowa.\n\nOdbicie również siedzi bez ruchu. Rozluźniam dłonie i patrzę na pióro przy stole, chcąc uczciwie zapisać tę niepewność."
 latria_sexual_frustration_flavor.1408.desc: "W ciszy patrzę na swoje odbicie. Na stole wciąż leży niedokończony list. Uśmiech, za którym chowam się za dnia, nie jest już potrzebny. Wracam na skraj łóżka i rozważam krótkie spotkanie od samego początku.\n\nŻadne słowo nie było obietnicą. Nikt też nie kazał mi dalej czekać. Ile znaczeń dopisanych później pochodziło od drugiej osoby, a ile ode mnie? Wreszcie chcę je rozdzielić jedno po drugim. Zrozumienie tego nie sprawia, że pragnienie od razu ustępuje.\n\nPrzesuwam papier pod światło. Przynajmniej niewypowiedziana jeszcze linijka powinna jasno wyrazić moje własne słowa."
 latria_sexual_frustration_flavor.1408.a: "Przyznać się do tego pożądania i tej nocy już przed nim nie uciekać."
 latria_sexual_frustration_flavor.1408.b: "Ubrać się, usiąść przy biurku i stłumić tę myśl."

 latria_sexual_frustration_flavor.1409.t: "Utrata opanowania na dworze"
 latria_sexual_frustration_flavor.1409.desc: "W przerwie audiencji zdejmuję szaty w bocznej komnacie, chcąc uspokoić myśli chwilą samotności. Okrycie jest jeszcze w rękach sługi, gdy otwierają się drzwi do sali obrad. Podnoszę głowę. Przy długim stole rozmowy już ucichły; kilkoro poddanych zastyga w pół obrotu.\n\nPisarz spuszcza wzrok i przyciąga ku sobie niedokończoną kartę. Ludzie przy wejściu chcą się cofnąć, lecz boją się zagrodzić drogę słudze z ubraniem. Nikt nie rusza pierwszy. Trzeba natychmiast przemówić, ale głos jest ściśnięty, a przygotowane polecenia nie składają się w zdania.\n\nWreszcie sługa podaje okrycie. Na stole nadal leżą nierozstrzygnięte sprawy, a wszyscy czekają, aż zdecyduję, co dalej."
 latria_sexual_frustration_flavor.1409.a: "Stanąć przed nimi i nie próbować ukryć swego uchybienia."
 latria_sexual_frustration_flavor.1409.b: "Odprawić możnych i ubrać się przed wznowieniem obrad."

 latria_sexual_frustration_flavor.1410.t: "Noc za drzwiami"
 latria_sexual_frustration_flavor.1410.desc.female: "Siedzę w nocnej koszuli przy drzwiach i słucham oddalających się kroków. Ktoś na korytarzu oddaje klucz i cicho życzy dobrej nocy. Mogłam przywołać jedną z tych osób, prosząc o zaniesienie listu rano. Głosy cichną, a ja nadal nic nie mówię.\n\nWraca uczucie pozostawione bez odpowiedzi. Szkic na stole zawiera zbyt wiele błahych słów, a nie wyjaśnia tylko, jakiej odpowiedzi pragnę. Kładę papier na kolanach i czytam od pierwszej linijki. Wreszcie skreślam zwyczajne powitanie, w które sama nie wierzę.\n\nZa drzwiami zapada zupełna cisza. Przenoszę pióro nad wolne miejsce. Jeszcze nie dotyka kartki, a już wiem, że ten list zajmie mi więcej czasu niż poprzednie."
 latria_sexual_frustration_flavor.1410.desc.male: "W nocnej koszuli opieram się o wezgłowie. W książce pod ręką nie przewróciłem ani strony. Za drzwiami cichnie, światło pada na ten sam ustęp, a ja wciąż myślę o rozmowie, która za dnia skończyła się zbyt wcześnie. Na pożegnanie powiedziałem, że dokończymy innym razem. Odpowiedź była jedynie uprzejma.\n\nZbyt często używałem tego „innym razem”. Za każdym razem wierzę, że następnym wszystko wyjaśnię, a później sam tylko zgaduję, czy grzeczna odpowiedź miała inne znaczenie. Przesuwam zakładkę o stronę i zaraz odkrywam, że nie pamiętam nawet treści poprzedniej.\n\nNa stole pozostały papier i pióro. Zamykam książkę, zostawiam ją na kolanach i patrzę na ciemną już szczelinę pod drzwiami."
 latria_sexual_frustration_flavor.1410.desc: "Długa noc jeszcze się nie skończyła. Siedzę za zamkniętymi drzwiami, słuchając ostatnich kroków oddalających się w mroku. List na stole jest niedokończony, książka przy łóżku otwarta. Obie czynności, które miały zająć czas, utknęły w połowie.\n\nCzytam sobie zapisane linijki. Są zrozumiałe, lecz wszędzie pozostawiają furtkę. Nawet na końcu nie wiadomo, jakiej odpowiedzi oczekuję od tej osoby. Jeśli dalej będę tak pisać, po jutrzejszej wysyłce dojdzie mi tylko kolejna rzecz, na którą trzeba czekać.\n\nWyjmuję czystą kartkę i przyciskam ją książką. Lampa nadal świeci dość jasno, by pokazać, gdzie powinna zacząć się pierwsza linijka."
 latria_sexual_frustration_flavor.1410.a: "Odłożyć książkę i napisać długi list."
 latria_sexual_frustration_flavor.1410.b: "Stłumić tęsknotę, zgasić lampę i się położyć."

 latria_sexual_frustration_flavor.1401.c: "Ułożyć wiersz z zaproszenia, którego nie mogę wysłać."
 latria_sexual_frustration_flavor.1402.c: "Zapłacić muzykom, by zagrali dla pozostałych gości."
 latria_sexual_frustration_flavor.1402.d: "Poprosić gości, by zostali i opowiedzieli o dawnych podróżach."
 latria_sexual_frustration_flavor.1403.c: "Otworzyć świętą księgę i szukać odpowiedzi w każdym ustępie."
 latria_sexual_frustration_flavor.1404.c: "Porzucić ślub czystości i odtąd podążać za swoimi pragnieniami."
 latria_sexual_frustration_flavor.1404.d: "Włożyć nocną koszulę i siedzieć, aż myśli się uspokoją."
 latria_sexual_frustration_flavor.1405.c: "Spisać relację jako prywatny list i zamknąć go w szkatułce."
 latria_sexual_frustration_flavor.1405.d: "Złożyć ślub czystości przed tymi świadkami."
 latria_sexual_frustration_flavor.1406.c: "Wyrecytować nowy wiersz odchodzącym gościom."
 latria_sexual_frustration_flavor.1407.c: "Zamknąć modlitewnik i spokojnie rozważyć swoje uczucia."
 latria_sexual_frustration_flavor.1408.c: "Spisać poranne obowiązki i uporządkować wszystkie dokumenty."
 latria_sexual_frustration_flavor.1409.c: "Ubrać się, wrócić do stołu i rozstrzygnąć każdą sprawę dworu."
 latria_sexual_frustration_flavor.1409.d: "Ubrać się, zażartować i poprosić możnych, by znów usiedli."
 latria_sexual_frustration_flavor.1410.c: "Włożyć szatę, zaparzyć herbatę i siedzieć, aż sen stanie się możliwy."
