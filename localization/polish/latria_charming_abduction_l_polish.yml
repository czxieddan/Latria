 LATRIA_CHARMING_ABDUCTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] wpadnie w twoją pułapkę jako twój [prisoner|E]."
 LATRIA_CHARMING_ABDUCTION_DISCOVERY_DESC: "[TARGET_CHARACTER.GetShortUIName|U] dowie się, co kryje się za twoimi czułymi obietnicami."
 latria_charming_abduction_invalidated_title: "Świece gasną"
 latria_charming_abduction_i_imprisoned_message: "[target.GetShortUIName|U] jest już pod moją strażą. Nie ma potrzeby wysyłać tego zaproszenia."
 latria_charming_abduction_no_longer_possible: "Nie da się już urządzić tego spotkania. Zaproszenie musi trafić do ognia."
 latria_charming_abduction_success_puppeteer: "[owner.GetShortUIName|U] zwabia w niewolę osobę, którą jest [target.GetShortUIName]"
 latria_charming_abduction_failure_puppeteer: "[target.GetShortUIName|U] wymyka się z pułapki [owner.GetShortUINamePossessive]"

 latria_charming_abduction.1001.t: "Obietnica przy poduszce"
 latria_charming_abduction.1001.desc: "Woda w kąpieli stygnie, choć jej zapach wciąż unosi się w sypialni. Kładę szatę przy łóżku i spoglądam na nieopieczętowany list na stole. Brakuje tylko zdania, przez które [target.GetFirstName] nie zaśnie.\n\nMoi ludzie znają boczne drzwi i każdy zakręt korytarza. Jeśli [target.GetSheHe] odprawi [target.GetHerHis] świtę dla obietnicy czułej nocy, ciężkie zasłony skryją wiele. Co do rozkoszy, które [target.GetSheHe] wyobraża sobie jako czekające na [Select_CString( target.IsFemale, 'nią', 'niego' )] w moim łóżku... najpierw [target.GetSheHe] musi przekroczyć próg."
 latria_charming_abduction.1001.a: "Powiadomić [Select_CString( target.IsFemale, 'ją', 'go' )], że będę czekać przy łóżku."
 latria_charming_abduction.1001.b: "Zaprosić [Select_CString( target.IsFemale, 'ją', 'go' )] na wino w przedpokoju. Ciepłe wino, przygaszone świece."
 latria_charming_abduction.1001.c: "Zapieczętować list. Nadejdzie lepsza noc."
 latria_charming_abduction.1001.d: "Wrzucić list do ognia. To koniec."
 latria_charming_abduction_wait_tt: "Kontynuuj przygotowania i poczekaj na kolejną okazję do działania."

 latria_charming_abduction.1101.t: "Ślad perfum"
 latria_charming_abduction.1101.desc: "Wraz z odpowiedzią [target.GetFirstNamePossessive] przychodzi jedwabna wstążka, luźno związana, jakby najlżejsze pociągnięcie miało rozwiązać węzeł. Słowa pozostają przyzwoite, lecz ostatnie wersy cisną się jeden na drugi: [target.GetSheHe] pragnie skończyć, a jednak nie chce odłożyć pióra.\n\nOwijam wstążkę wokół palca. Jaki zapach powinien mieć mój następny list? I jakie myśli mogą za nim podążyć do [target.GetHerHis] łóżka?"
 latria_charming_abduction.1101.a: "Umieścić kroplę perfum przy wzmiance o nocy."
 latria_charming_abduction.1101.b: "Podać godzinę. Nie podpisywać listu."
 latria_charming_abduction.1101.c: "Położyć odpowiedź pod świecznikiem. Niech czeka."

 latria_charming_abduction.1102.t: "Jeszcze jedna para oczu"
 latria_charming_abduction.1102.desc: "Wieści o wieczornych zwyczajach [target.GetFirstNamePossessive] okazują się przydatniejsze niż [target.GetHerHis] listy miłosne. Jeden ze sług zawsze zostaje po zmroku, nalewa wina i odkłada ubrania, nie chcąc odejść, zanim zgaśnie ostatnia świeca.\n\nJeden wierny sługa może zniweczyć starannie przygotowaną schadzkę. Muszę znaleźć inne zajęcie dla tych czujnych oczu."
 latria_charming_abduction.1102.a: "Sakiewka srebra zapewni słudze wieczór rozrywki."
 latria_charming_abduction.1102.b: "Dopisać jedno zdanie: przyjdź bez świty, a czeka cię niespodzianka."
 latria_charming_abduction.1102.c: "Na razie wycofać zaproszenie. Te drzwi mogą poczekać kolejną noc."

 latria_charming_abduction.2001.t: "Gdy zapada rygiel"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] wchodzi do sypialni. [target.GetHerHis] oczy wciąż spoczywają na świecach przy łóżku. Wyciągam rękę, pozwalając [target.GetHerHim] wierzyć, że jeszcze jeden krok wystarczy, by mnie dosięgnąć.\n\nRygiel szczęka. [target.GetSheHe|U] odwraca się, a cienie za zasłonami wstają. Moi ludzie chwytają [target.GetHerHis] ramiona; sznur wysuwa się z rękawa, nie potrącając nawet świecznika.\n\nSięgam po ubrania na krześle. Tej nocy nikt nie podzieli ze mną poduszki."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] przyjmuje nalane przeze mnie wino i odwraca się nieco, odsłaniając przejście do wewnętrznej komnaty. [target.GetSheHe|U] oczekuje, że ujmę [target.GetHerHis] dłoń i zaprowadzę [Select_CString( target.IsFemale, 'ją', 'go' )] w bardziej ustronne miejsce.\n\nZamiast tego odstawiam puchar. Boczne drzwi otwierają się i wpadają moi ludzie. Zanim [target.GetSheHe] pomyśli o wezwaniu pomocy, rygiel jest zasunięty, a więzy zaciśnięte.\n\nWino na stole jest ledwie tknięte."
 latria_charming_abduction.2001.secret: "\n\nNa korytarzu panuje cisza. Zanim dwór zauważy [target.GetHerHis] nieobecność, nawet wosk zdąży ostygnąć."
 latria_charming_abduction.2001.exposed: "\n\nZa oknem rozlega się krzyk. Wygląda na to, że jeszcze przed świtem ktoś opowie drugą połowę historii tego wieczoru."
 latria_charming_abduction.2001.a: "Przynieść [target.GetHerHis] płaszcz. Czas wyruszać."

 latria_charming_abduction.2002.t: "Niedokończony wieczór"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] zatrzymuje się w progu. Świece, łóżko, nawet moje starannie wymierzone milczenie nie skłaniają [Select_CString( target.IsFemale, 'jej', 'go' )] do kolejnego kroku.\n\n\"Robi się późno\". [target.GetHerHis|U] wzrok wędruje ponad moim ramieniem ku nieruchomym zasłonom.\n\nMoja wyciągnięta ręka napotyka tylko nocne powietrze."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] nie rusza wina. Przez chwilę [target.GetSheHe] stoi przy stole, jakby oceniając mój uśmiech, po czym cofa się ku otwartym drzwiom.\n\n\"Niech zostawią zapalone światła. Moi ludzie czekają\".\n\nKroki za bocznymi drzwiami brzmią przeraźliwie głośno."
 latria_charming_abduction.2002.secret: "\n\nOpuszczam rękę, zanim ukryci ludzie zdążą wyjść. Jutro ktoś może wyśmiać moje niechciane zaloty. Nikt nie dowie się, co czekało za tymi drzwiami."
 latria_charming_abduction.2002.exposed: "\n\nW polu widzenia pojawia się pętla sznura. [target.GetFirstNameNoTooltip] wzdryga się i woła moje imię, a [target.GetSheHe] cofa się w stronę [target.GetHerHis] strażników. Nikt już nie uzna tego za niewinny flirt."
 latria_charming_abduction.2002.a: "Zgasić świece. Nie będzie więcej zaproszeń."
 latria_charming_abduction.2002.b: "Napisać nowy list i poczekać na kolejną okazję."
 latria_charming_abduction_retry_tt: "Przygotuj ten spisek ponownie, usuwając modyfikator podejścia z tej próby i zachowując wcześniejsze przygotowania zaproszenia."

 latria_charming_abduction.2101.t: "Czuła pułapka"
 latria_charming_abduction.2101.bedchamber: "Przychodząc na spotkanie z osobą imieniem [owner.GetFirstName], wciąż zastanawiam się, jak najlepiej ucałować [owner.GetHerHis] dłoń. Sypialnia jest słabo oświetlona, akurat na tyle, by zapomnieć o zajrzeniu za zasłony.\n\nDopiero gdy wykręcają mi ręce za plecy, pojmuję, dlaczego [owner.GetSheHe] trzyma się poza moim zasięgiem. Nie czekała tu na mnie czułość, tylko kawał sznura."
 latria_charming_abduction.2101.antechamber: "Trafiam do niewoli [owner.GetFirstNamePossessive], zanim zdążę napić się wina.\n\n[owner.GetSheHe|U] odstawia [owner.GetHerHis] puchar, jakby dając umówiony znak. Chwilę później przez boczne drzwi wpadają ludzie i chwytają moje ramiona. Wpatruję się w [Select_CString( owner.IsFemale, 'nią', 'niego' )], czekając na wyjaśnienie. [owner.GetSheHe|U] każe im tylko przynieść mój płaszcz."
 latria_charming_abduction.2101.a: "Odwrócić wzrok. Nie będę patrzeć na [Select_CString( owner.IsFemale, 'nią', 'niego' )]."

 latria_charming_abduction.2102.t: "Za blaskiem świec"
 latria_charming_abduction.2102.secret: "Zaproszenie [owner.GetFirstNamePossessive] było dość czułe, a jednak podczas spotkania [owner.GetSheHe] zdaje się rozkojarzony. Kroki na korytarzu; szelest tkaniny za drzwiami. Gdy wspominam o strażnikach, [owner.GetHerHis] uśmiech sztywnieje.\n\nZnajduję wymówkę i wychodzę. Dopiero wśród swoich ludzi dostrzegam pot na dłoniach. Może to była tylko niezręczna schadzka. Może lepiej nigdy się nie dowiedzieć, co kryło się za tymi drzwiami."
 latria_charming_abduction.2102.exposed: "Widok sznura natychmiast przywraca mi rozsądek.\n\nSzepty [owner.GetFirstNamePossessive], przygaszone świece, dystans, który [owner.GetSheHe] utrzymuje między nami: wszystko miało zatrzymać mnie w tym pokoju. Cofam się na korytarz i wołam strażników, patrząc, jak postacie za drzwiami nikną w cieniu.\n\nNiewiele brakowało, by ten uśmiech skłonił mnie do odprawienia wszystkich."
 latria_charming_abduction.2102.a: "Odtąd ktoś zawsze czeka za drzwiami."

