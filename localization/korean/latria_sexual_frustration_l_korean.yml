 latria_act.0401.t: "뒤척이는 밤"
 latria_act.0401.desc: "방은 고요하고 깨어 있는 것은 나뿐이다. 접어 두었던 욕망이 부르지 않아도 제발로 돌아온다. 등을 데우는 열기. 촛불은 짧아지고, 병풍 아래로는 공기가 고인다.\n\n숨을 세지만 중간에 셈을 잃고 다시 센다. 낮의 작은 일들이 하나씩 떠오르고, 그 밑에는 언제나 채워지지 않은 갈망이 놓여 있다.\n\n방이 고요할수록 그것은 더 또렷하다. 이 밤도 나는 동틀 때까지 침대의 삐걱임을 들으며 지새우게 되리라."
 latria_act.0401.a: "이불 속에서 몸을 뒤척인다"
 latria_act.0402.t: "평온은 없고"
 latria_act.0402.desc: "아침 기도가 반쯤 되었을 때 같은 갈망이 낱말 사이로 미끄러져 든다. 멈추어 숨을 다시 세지만, 고르게 가라앉아도 그것은 아직 거기 있다.\n\n노래가 홀을 가로지른다. 입술은 따라가지만 구절은 붙잡히지 않고, 양쪽의 이들은 고개를 숙인 채다. 갈망은 가슴을 누르며 시시각각 무거워진다.\n\n향이 다 타들어 갈 무렵, 나는 책을 덮으며 그것이 밤과 함께 돌아오리라는 것을 안다."
 latria_act.0402.a: "마음을 다잡는다"
 latria_act.0403.t: "억눌러 온 욕망"
 latria_act.0403.desc: "자제는 더 이상 인내처럼 느껴지지 않는다. 가슴속에서 밀어 올라 평온한 생각을 하나하나 밀어낸다.\n\n일이 하나씩 손을 거쳐 가지만, 생각은 늘 같은 자리로 돌아온다. 불꽃이 흔들리고 열기가 다시 차오른다. 일을 내려놓고 가라앉기를 기다리지만, 물러나는 것보다 머무는 시간이 점점 길어진다.\n\n이런 밤이 이어진다면 오래 버티지 못하리라."
 latria_act.0403.a: "견딘다"
 latria_act.0404.t: "무너지기 직전"
 latria_act.0404.desc: "잠은 오지 않고, 기도는 붙들지 못하며, 낮의 노동도 밀어내지 못한다. 밤에는 가장 요란하고, 낮에는 망설임 뒤에서 기다린다.\n\n해 질 무렵 문 두드리는 소리를 기다린다. 한마디 인사라도. 문이 열리지만 들어오는 것은 언제나 물을 나르는 시종으로, 그릇을 내려놓고 물러난다.\n\n문이 닫히면 방은 전보다 더 고요해진다."
 latria_act.0404.a: "버틴다"
 latria_act.0405.t: "감당하기 어려운 짐"
 latria_act.0405.desc: "더는 버티고 싶지 않다. 낮 내내 가슴의 열이 식지 않고, 손에 익은 일조차 손가락이 듣지 않는다.\n\n밤에는 아무리 해도 잠들지 못한 채 눈을 뜨고, 촛불이 다 타들어 가는 소리를 듣는다. 열기는 가슴에 눌러앉아 떠나지 않는다.\n\n이 고통에는 끝이 보이지 않는다."
 latria_act.0405.a: "깊이 숨을 들이쉰다"
 latria_sexual_frustration_collapse_warning_tt: "더는 버티기 어렵다…"
 latria_act.0405.b: "계속 견딘다"
