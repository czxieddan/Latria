l_korean:
 latria_sexual_frustration_1: "뒤숭숭한 욕망"
 latria_sexual_frustration_1_desc: "충족되지 않은 성욕이 이 인물을 괴롭히기 시작했습니다."
 latria_sexual_frustration_2: "떨칠 수 없는 욕망"
 latria_sexual_frustration_2_desc: "욕망이 거듭 밀려와 평정을 유지하기 어렵습니다."
 latria_sexual_frustration_3: "억눌린 욕망"
 latria_sexual_frustration_3_desc: "오랫동안 억눌러 온 성욕이 몸과 마음을 짓누릅니다."
 latria_sexual_frustration_4: "고통스러운 욕망"
 latria_sexual_frustration_4_desc: "자제의 고통이 이제 깨어 있는 내내 따라다닙니다."
 latria_sexual_frustration_5: "감당할 수 없는 욕망"
 latria_sexual_frustration_5_desc: "욕망이 견딜 수 없는 짐이 되었습니다."

 latria_sexual_frustration_0: "평온한 욕망"
 latria_sexual_frustration_hud_title: "[SelectLocalization( Or( Not( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').IsSet ), EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)0' ) ), 'latria_sexual_frustration_0', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)1' ), 'latria_sexual_frustration_1', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)2' ), 'latria_sexual_frustration_2', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)3' ), 'latria_sexual_frustration_3', SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue, '(CFixedPoint)4' ), 'latria_sexual_frustration_4', 'latria_sexual_frustration_5' ) ) ) ) )] [GetPlayer.MakeScope.Var('latria_sexual_frustration_level').GetValue|0]/5"
 latria_sexual_frustration_hud_subheading: "[GetPlayer.GetSexuality]의 [latria_sexual_repression_level|E]"
 latria_sexual_frustration_level_effects: "#S 효과:#!\n[StaticModifier.GetDescWithEffects]"
 latria_sexual_frustration_no_level_effects: "#S 효과:#!\n현재 이 인물에게 적용 중인 성적 억압 변화 요소가 없습니다."
 latria_daily_sexual_frustration_gain_display: "#P [GetPlayer.MakeScope.ScriptValue('latria_daily_sexual_frustration_gain')|+=3]#!/일"
 latria_sexual_frustration_track_title: "성적 억압 [GetPlayer.MakeScope.Var('latria_sexual_frustration').GetValue|0]/300"
 latria_sexual_frustration_requires_0: "성적 억압이 #V 0#! 이상이어야 함"
 latria_sexual_frustration_requires_20: "성적 억압이 #V 20#! 이상이어야 함"
 latria_sexual_frustration_requires_50: "성적 억압이 #V 50#! 이상이어야 함"
 latria_sexual_frustration_requires_100: "성적 억압이 #V 100#! 이상이어야 함"
 latria_sexual_frustration_requires_180: "성적 억압이 #V 180#! 이상이어야 함"
 latria_sexual_frustration_requires_300: "성적 억압이 #V 300#! 이상이어야 함"

 game_concept_latria_sexual_repression: "성적 억압"
 game_concept_latria_sexual_repression_desc: "성적 억압은 인물의 해소되지 않은 성욕을 나타냅니다. 시간이 지나면 증가하고 육욕을 해소하면 감소합니다."
 game_concept_latria_sexual_repression_level: "성적 억압 단계"
 game_concept_latria_sexual_repression_level_desc: "[latria_sexual_repression|E]이 #V 20#!, #V 50#!, #V 100#!, #V 180#!, #V 300#!에 도달하면 성적 억압 단계가 높아집니다. 각 단계는 해당하는 인물 변화 요소를 적용합니다."

 latria_daily_sexual_frustration_gain_base: "기본 증가량"
 latria_daily_sexual_frustration_gain_prime_age: "장년기"
 latria_daily_sexual_frustration_gain_senior_age: "노년기"
 latria_daily_sexual_frustration_gain_lustful: "[GetTrait('lustful').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_chaste: "[GetTrait('chaste').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_temperate: "[GetTrait('temperate').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_gluttonous: "[GetTrait('gluttonous').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_impatient: "[GetTrait('impatient').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_too_early: "너무 이름"
 latria_daily_sexual_frustration_gain_no_longer: "더 이상 억압되지 않음"

 latria_act.0401.t: "뒤척이는 밤"
 latria_act.0401.desc: "잠이 좀처럼 오지 않는다. 방이 고요해지자 접어 두었던 욕망이 돌아온다."
 latria_act.0401.a: "이불 속에서 몸을 뒤척인다"
 latria_act.0402.t: "평온은 없고"
 latria_act.0402.desc: "잠시 한눈을 팔면 해소되지 않은 갈망이 다시 밀려든다."
 latria_act.0402.a: "마음을 다잡는다"
 latria_act.0403.t: "억눌러 온 욕망"
 latria_act.0403.desc: "자제는 더 이상 인내처럼 느껴지지 않는다. 평온한 생각마저 짓누른다."
 latria_act.0403.a: "견딘다"
 latria_act.0404.t: "무너지기 직전"
 latria_act.0404.desc: "잠도, 기도도, 노동도 평온을 주지 못한다. 이 고통은 어디를 가든 나를 따라온다."
 latria_act.0404.a: "버틴다"
 latria_act.0405.t: "감당하기 어려운 짐"
 latria_act.0405.desc: "해소되지 않은 욕망이 다른 모든 생각을 삼켰다. 또다시 뜬눈으로 밤을 새웠고 익숙한 일조차 버겁다. 끝이 보이지 않는다."
 latria_act.0405.a: "깊이 숨을 들이쉰다"
 latria_sexual_frustration_collapse_warning_tt: "더는 버티기 어렵다…"
 latria_act.0405.b: "계속 견딘다"
