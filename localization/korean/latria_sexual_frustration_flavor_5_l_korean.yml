l_korean:
 latria_sexual_frustration_flavor.1401.t: "봉인된 인장"
 latria_sexual_frustration_flavor.1401.desc.female: "잠옷 차림으로 침대 곁에서 편지를 거듭 접는다. 이름은 없고 아직 감히 찍지 못한 인장만 있을 뿐이다."
 latria_sexual_frustration_flavor.1401.desc.male: "잠옷 차림으로 침대 가장자리에 앉아 인장을 쥔다. 그 말을 적으면 더는 그런 생각을 한 적 없다고 할 수 없다."
 latria_sexual_frustration_flavor.1401.desc: "인장을 들었다 내려놓지만 끝내 종이에 대지 않는다."
 latria_sexual_frustration_flavor.1401.a: "편지를 끝까지 쓰고 인장을 찍는다."
 latria_sexual_frustration_flavor.1401.b: "인장을 치우고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1402.t: "마지막 연회"
 latria_sexual_frustration_flavor.1402.desc.accepted: "연회가 끝나기 전에도 손님들은 연인과 약혼, 옛 쾌락을 거리낌 없이 이야기한다. 이제는 그 말을 한담으로 넘길 수 없음을 느낀다."
 latria_sexual_frustration_flavor.1402.desc.strict: "누군가 경솔한 연애로 총애를 잃은 귀족을 언급하자 탁자가 조용해진다. 같은 심판이 내게도 돌아올 수 있음을 안다."
 latria_sexual_frustration_flavor.1402.desc: "탁자는 어지럽고 손님들은 떠나지만 마음속 생각은 더 크게 울린다."
 latria_sexual_frustration_flavor.1402.a: "마지막 손님들을 붙잡고 내 괴로움을 거듭 이야기한다."
 latria_sexual_frustration_flavor.1402.b: "생각을 억누르고 주인들에게 감사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1403.t: "증인 없는 고백"
 latria_sexual_frustration_flavor.1403.desc.favors: "제단 앞에는 아무도 없다. 내 신앙이 육욕의 쾌락을 허락한다는 것을 기억하지만 이 조급함을 어떻게 달래야 할지 아직 모르겠다."
 latria_sexual_frustration_flavor.1403.desc.condemns: "옷매무새를 단정히 하고 제단 앞에 홀로 무릎 꿇지만 기도는 매번 같은 말에서 끊긴다. 아무도 듣지 않는다면 그래도 서약을 어긴 것일까?"
 latria_sexual_frustration_flavor.1403.desc: "성소는 비었다. 나는 아직 떠나지 않았다."
 latria_sexual_frustration_flavor.1403.a: "더는 금욕을 서약하지 않고 내 선택을 인정한다."
 latria_sexual_frustration_flavor.1403.b: "욕망을 억누르고 아침기도까지 무릎 꿇는다."

 latria_sexual_frustration_flavor.1404.t: "갈망에 이름을 붙이다"
 latria_sexual_frustration_flavor.1404.desc.lustful: "옷을 벗은 채 방의 거울 앞에 홀로 서서 내 모습을 외면하지 않는다. 욕망을 한때의 나약함이라고 부르기도 지쳤다."
 latria_sexual_frustration_flavor.1404.desc.chaste: "옷을 벗은 채 침대 곁에 홀로 앉아 두 손을 맞잡는다. 서약을 지킨다 해도 이 갈망이 사라졌기 때문은 아닐 것이다."
 latria_sexual_frustration_flavor.1404.desc: "밤이 깊었다. 마침내 나 자신에게 욕망을 숨기지 않는다."
 latria_sexual_frustration_flavor.1404.a: "갈망을 인정하고 오늘 밤은 싸우기를 멈춘다."
 latria_sexual_frustration_flavor.1404.b: "다시 옷을 입고 생각을 억누른다."

 latria_sexual_frustration_flavor.1405.t: "연대기의 한 장"
 latria_sexual_frustration_flavor.1405.desc.emperor: "연대기 작가는 무엇을 기억할지 내가 정하기를 기다린다. 예복 차림으로 그 뒤에 서 있으니 침묵한다고 이 고통이 사라지지 않음을 알겠다."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "필경사가 탁자에 앉아 여정의 이 부분도 연대기에 남길지 묻는다. 보내지 않은 편지를 보니 이 말들이 나를 따라갈 것임을 안다."
 latria_sexual_frustration_flavor.1405.desc.clergy: "성의를 갖춰 입고 서기관 앞에 선다. 서약도 욕망도 진실이다. 무엇을 기억할지 남이 정하게 두지 않겠다."
 latria_sexual_frustration_flavor.1405.desc.ruler: "서기관이 내 말을 기록하려고 기다린다. 예복 차림으로 시종들 앞에서 묻어 두었던 일을 말한다."
 latria_sexual_frustration_flavor.1405.desc: "이 일을 더는 혼자 품고 있지 않기로 한다."
 latria_sexual_frustration_flavor.1405.a: "사본을 퍼뜨려 모두 읽게 한다."
 latria_sexual_frustration_flavor.1405.b: "서기관에게 공무만 적게 하고 나머지 말은 삼킨다."

 latria_sexual_frustration_flavor.1406.t: "손님들이 떠날 무렵"
 latria_sexual_frustration_flavor.1406.desc.accepted: "마지막 손님들은 아직 연인과 약혼을 이야기한다. 내 옛이야기를 꺼내기 무섭게 탁자에서 누군가 작게 웃는다."
 latria_sexual_frustration_flavor.1406.desc.strict: "경솔한 연애로 총애를 잃은 귀족의 소식이 전해진다. 말을 멈추기도 전에 옆 사람들이 수군거리고 누군가 웃는다."
 latria_sexual_frustration_flavor.1406.desc: "손님들은 떠나는데 나는 아직 말을 멈추지 않았다. 옆 사람들이 눈길을 주고받고 탁자에서 작은 웃음이 난다."
 latria_sexual_frustration_flavor.1406.a: "이야기를 계속하고 비웃는 자에게는 모두 앞에서 쏘아붙인다."
 latria_sexual_frustration_flavor.1406.b: "말을 멈추고 일행에게 인사하며 작별한다."

 latria_sexual_frustration_flavor.1407.t: "불을 끈 뒤의 기도"
 latria_sexual_frustration_flavor.1407.desc.favors: "잠옷 차림으로 침대 곁에 앉아 내 신앙이 육욕의 쾌락을 부정하지 않음을 떠올린다. 홀로 있을 때면 여전히 마음을 어떻게 달래야 할지 모르겠다."
 latria_sexual_frustration_flavor.1407.desc.condemns: "잠옷을 여미고 순결 서약을 되뇐다. 촛불은 잦아들어도 마음속 갈망은 사라지지 않는다."
 latria_sexual_frustration_flavor.1407.desc: "방에는 꺼져 가는 촛불 하나만 남았고 나는 여전히 깨어 있다."
 latria_sexual_frustration_flavor.1407.a: "순결 서약을 접고 그 애정에 생각을 맡긴다."
 latria_sexual_frustration_flavor.1407.b: "생각을 억누르고 새벽까지 낭송한다."

 latria_sexual_frustration_flavor.1408.t: "거울 앞의 침묵"
 latria_sexual_frustration_flavor.1408.desc.lustful: "옷을 벗고 거울 앞에 홀로 섰다. 더는 이 갈망을 스쳐 가는 생각이라 할 수 없다. 그런 척하고 싶지도 않다."
 latria_sexual_frustration_flavor.1408.desc.chaste: "옷을 벗은 채 침대 곁에서 두 손을 맞잡는다. 순결은 여전히 내 선택이지만 이토록 어렵게 느껴진 적은 없었다."
 latria_sexual_frustration_flavor.1408.desc: "고요 속에서 내 모습을 바라보며 마음속 일을 더는 피하지 않는다."
 latria_sexual_frustration_flavor.1408.a: "이 욕망을 인정하고 오늘 밤은 달아나지 않는다."
 latria_sexual_frustration_flavor.1408.b: "옷을 입고 책상에 앉아 생각을 억누른다."

 latria_sexual_frustration_flavor.1409.t: "궁정에서 잃은 평정"
 latria_sexual_frustration_flavor.1409.desc: "자문회가 잠시 쉬는 동안 옆방에서 옷을 벗는다. 겉옷을 걸치기도 전에 회의장으로 통하는 문이 열린다. 제후들은 침묵하고 서기관은 눈을 내리깐다. 시종이 겉옷을 들고 곁에 서 있는 동안 내 목소리가 막힌다."
 latria_sexual_frustration_flavor.1409.a: "그들 앞에 서서 내 실수를 감추지 않는다."
 latria_sexual_frustration_flavor.1409.b: "제후들을 물리고 옷을 입은 뒤 자문회를 재개한다."

 latria_sexual_frustration_flavor.1410.t: "문 너머의 밤"
 latria_sexual_frustration_flavor.1410.desc.female: "잠옷 차림으로 문 곁에 앉아 밖의 발소리가 멀어지는 것을 듣는다. 밤이 깊자 응답받지 못한 애정이 돌아온다."
 latria_sexual_frustration_flavor.1410.desc.male: "잠옷 차림으로 침대에 기댄다. 책은 아직 펴지 않았다. 복도는 고요하지만 잠은 오지 않는다."
 latria_sexual_frustration_flavor.1410.desc: "밤은 길다. 문밖에는 아무 기척도 없고 생각도 가라앉지 않는다."
 latria_sexual_frustration_flavor.1410.a: "책을 치우고 긴 편지를 쓴다."
 latria_sexual_frustration_flavor.1410.b: "갈망을 억누르고 등불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1401.c: "보내지 못하는 초대를 시로 적는다."
 latria_sexual_frustration_flavor.1402.c: "악사들에게 돈을 주고 남은 손님들을 위해 연주하게 한다."
 latria_sexual_frustration_flavor.1402.d: "손님들을 붙잡아 옛 여행 이야기를 나눈다."
 latria_sexual_frustration_flavor.1403.c: "경전을 펼치고 구절마다 답을 구한다."
 latria_sexual_frustration_flavor.1404.c: "순결 서약을 버리고 앞으로는 욕망을 따른다."
 latria_sexual_frustration_flavor.1404.d: "잠옷을 입고 생각이 가라앉을 때까지 앉는다."
 latria_sexual_frustration_flavor.1405.c: "기록을 사적인 편지로 고쳐 함에 봉한다."
 latria_sexual_frustration_flavor.1405.d: "이 증인들 앞에서 순결을 서약한다."
 latria_sexual_frustration_flavor.1406.c: "떠나는 손님들을 위해 새로운 시를 읊는다."
 latria_sexual_frustration_flavor.1407.c: "기도서를 덮고 내 마음을 천천히 헤아린다."
 latria_sexual_frustration_flavor.1408.c: "아침의 의무를 적고 서류를 모두 정리한다."
 latria_sexual_frustration_flavor.1409.c: "옷을 입고 탁자로 돌아가 궁정의 일을 하나씩 마친다."
 latria_sexual_frustration_flavor.1409.d: "옷을 입고 농담을 건네며 제후들을 다시 앉힌다."
 latria_sexual_frustration_flavor.1410.c: "겉옷을 걸치고 차를 끓여 잠들 수 있을 때까지 앉는다."
