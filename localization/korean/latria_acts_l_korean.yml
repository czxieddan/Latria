 latria_solo_relief_interaction: "홀로 하는 애무"
 latria_solo_relief_interaction_desc: "홀로 육욕의 쾌락을 즐깁니다."
 latria_solo_relief_send: "시작하기"
 latria_solo_relief_night_tt: "홀로 밤을 보내려 합니다."
 latria_act.0201.t: "안쪽 방"
 latria_act.0201.desc: "바깥 방의 사람이 흩어지고 지나가던 마지막 등잔까지 멀어지기를 기다렸다가 내가 직접 빗장을 내린다. 말소리가 사라지자 가끔 등잔심만 튀긴다.\n\n옷은 의자 위에 둔다. 등잔을 낮춰 침대 곁의 초 하나만 남기고, 두 번째 사람이 없는 이불 속에 오래 누워 있는다. 밤은 짧지 않다. 어떤 욕망은 분명히 왔다가 느리게 물러난다. 같은 돌을 씻던 물결이 빠졌다가 조용히 돌아오는 것처럼.\n\n숨이 마침내 가라앉았을 때 창밖은 이미 밝다. 내 심장 소리를 듣고, 그다음 빈 방을 듣고 나서야 이불을 펴고 아무 일도 없었던 것처럼 이 밤을 정리해야 한다는 것을 떠올린다."
 latria_act.0201.a: "옷을 정리하고 문을 연다."
 latria_act.0301.t: "몸의 한계"
 latria_act.0301.desc.illness: "밤은 아직 다 지나지 않았는데, 불편이 아침보다 먼저 온다.\n\n일어나 앉으려 하면 열이 이마로 오른다. 팔다리는 남의 것으로 바뀐 듯해서 두 번 힘을 주어도 말을 듣지 않는다. 이불은 무겁고 뜨겁고, 숨에도 마른 단맛이 있다. 밖의 사람을 부르려 해도 소리는 입술까지만 닿는다.\n\n빛이 천천히 창에 모여 창틀을 넘는다. 그것을 보며 열이 빨리 가기를 바라면서도, 그렇게 순순하지는 않을 것이라고 짐작한다."
 latria_act.0301.desc.stress: "몸은 멈췄고 손도 이불에서 뺐다. 생각은 멈추지 않는다.\n\n눈을 뜬 채 이 밤을 여러 번 되짚는다. 어디에서 숨이 흐트러졌는지, 어떤 말을 하지 말았어야 했는지, 어디에서 자신을 너무 몰아붙였는지. 모두 분명하다. 휘장 밖은 고요하고, 고요할수록 생각은 커진다. 멀리 있는 야경꾼조차 그것을 세는 듯하다.\n\n몸을 뒤집었다가 다시 돌아눕는다. 새벽이 가까워질 때까지 베개 방향을 여러 번 바꿨는데도 아직 잠들지 못했다."
 latria_act.0301.desc.health: "물 한 잔을 가지러 일어나려 한다. 발이 바닥에 닿는 순간 방이 어두워진다.\n\n침대 가장자리를 붙잡고 이마를 내 손에 기댄다. 심장은 빠르고 비게 뛴다. 멀리 달린 뒤 같지만, 베개에서 몸을 일으킨 것뿐이다. 잔은 몇 걸음 앞에 있고 방 안의 물건도 제자리에 있다. 몸이 먼저 끝에 닿은 듯하다.\n\n어둠이 물러날 때까지 시간이 걸린다. 결국 그 물은 가지러 가지 않는다. 다시 누울 뿐이다."
 latria_act.0301.a: "누워 아무것도 생각하지 않는다."
 latria_act.0311.t: "오랜 쇠약"
 latria_act.0311.desc.illness: "이것은 하룻밤에 밀려온 것이 아니다.\n\n지나쳤던 밤들은 흩어져 있었고, 한잠 자고 따뜻한 음식 한 끼를 먹으면 갚을 수 있다고 여겼다. 오늘 아침 열이 가슴에서 손끝으로 퍼지고 나서야 그것들이 오래전에 이어져 있었음을 안다. 물을 마셔도 마르고, 이불을 덮어도 차다. 창의 바람조차 뼈를 통과하는 듯하다.\n\n밖을 오가는 사람의 소리를 들으며 누워 있고, 사람을 부르는 힘조차 아껴야 한다. 병은 들이닥친 것이 아니다. 몸 안에 천천히 자리를 잡았다."
 latria_act.0311.desc.stress: "피로는 팔다리에 있지 않다. 잠 위에 엎드려 나를 들이지 않는다.\n\n눈을 감으면 낮의 얼굴, 밤의 숨, 후회할 틈이 없던 순간이 함께 밀려온다. 손은 들 수 없을 만큼 몸이 지쳤는데, 마음은 여전히 밝고 밝아서 더 피곤하다. 내 숨도 세고 창밖의 야경도 세었다. 어느 것도 그 장면들을 어둡게 하지 못한다.\n\n닭이 울고 날도 밝았다. 베개 이쪽에서 저쪽으로 옮길 뿐, 여전히 깨어 있다."
 latria_act.0311.desc.infertile: "처음에는 오지 않은 소식이 한 번이었다. 마음에 두지 않았지만, 나중에는 그런 날이 여러 번이 되었다.\n\n와야 했던 날들을 마음속으로 세고, 말하면 진짜가 될까 봐 입 밖에 내지 않았다. 오늘 의원이 내가 계속 피해 온 일을 마침내 앞에 놓는다. 이 몸으로는 더는 자손을 품을 수 없다고. 목소리는 크지 않지만, 방 안의 다른 소리로는 덮을 수 없다.\n\n사람이 떠난 뒤 아랫배에 손을 얹는다. 그 말이 정말로 내려앉을 때까지 오래 걸린다."
 latria_act.0311.desc.health: "예전에는 이런 탈진을 너무 늦게 잔 탓이라고 하고, 따뜻한 술 한 잔과 반나절의 고요로 넘길 수 있었다.\n\n이제는 앉는 것조차 침대 가장자리에서 한 번 멈춰야 한다. 띠도 잔도 예전보다 무겁다. 창에서 문까지의 거리가 실제보다 길어 보인다. 거울 속의 안색을 보고 나서야 하룻밤이나 이틀의 쉼으로는 메울 수 없는 결핍이라고 믿는다. 거울 속의 사람은 나보다 먼저 그것을 안 듯이 나를 본다.\n\n다시 눕는다. 이번에는 몸이 먼저 결정했다."
 latria_act.0311.a: "일을 내려놓고 누워 쉰다."
 latria_act_exhausted_health: "기진맥진"
 latria_act_exhausted_health_desc: "몸이 아직 회복되지 않았습니다."
 latria_act_depleted_health: "쇠약한 체질"
 latria_act_depleted_health_desc: "오랜 소모로 몸이 상했습니다."

