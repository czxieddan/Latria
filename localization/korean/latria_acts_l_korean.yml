 latria_act.0301.desc.illness: "이 밤을 보내고 나니 이마가 뜨겁고 팔다리가 말을 듣지 않는다."
 latria_act.0301.desc.stress: "멈추고 나서도 마음은 여전히 팽팽하다."
 latria_act.0301.desc.health: "침대에 몸을 기댄다. 몸이 한계에 다다랐다."
