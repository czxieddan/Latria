 latria_wedding_night.t: "첫날밤"
 latria_wedding_night.desc: "신혼 부부를 방까지 데려다준 손님들이 마침내 흩어졌다. 웃음소리는 복도에 남았지만 문은 닫혔고, 낮의 인사와 축사, 끝날 것 같지 않던 술은 밖에 남았다.\n\n등잔불은 휘장을 따뜻하게 한다. 침대는 새로 깔렸고 옷도 새로 갈아입었으며, 서로를 보는 모습조차 아직 조금 낯설다. [latria_actor.GetShortUIName](와)과 [latria_partner.GetShortUIName](은)는 한동안 마주 앉는다. 어느 쪽도 먼저 입을 열려 하지 않고, 문 너머의 사람들이 점점 멀어지는 소리만 듣는다.\n\n이 밤이 지나면 둘은 손님들의 입에 오르던 신혼 부부에 머물지 않는다."
 latria_serene_mind: "상쾌하고 평온함"
 latria_serene_mind_desc: "더없이 만족스러운 친밀한 만남으로 몸과 마음에 활력이 돌았습니다."
