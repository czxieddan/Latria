 latria_act.0101.t: "문 뒤에서"
 latria_act.0101.desc: "문이 닫히고 복도의 발소리가 멀어진다. [latria_partner.GetShortUIName](와)과 나는 동이 틀 때까지 함께 머문다.\n\n시종이 문을 두드리고서야 오늘 처리할 일이 떠오른다."
 latria_act.0101.desc.adultery: "복도에 아무도 없을 때를 기다려 [latria_partner.GetShortUIName](을)를 들인다.\n\n헤어지기 전, 우리는 한 가지를 약속한다. 오늘 밤의 일은 아무에게도 알리지 않기로."
 latria_act.0101.desc.dead: "[latria_partner.GetShortUINamePossessive] 이름을 부르고 또 부른다. 대답도, 숨소리도 없다.\n\n나는 문을 열어젖히고 의사를 데려오라고 외친다."
 latria_act.0101.desc.adultery_dead: "들키는 것이 최악이라고 생각했다. [latria_partner.GetShortUIName](이)가 쓰러져 다시 깨어나지 않기 전까지는.\n\n문밖에서 발소리가 다가온다. 이 일을 어떻게 설명해야 할까?"
 latria_act.0101.desc.actor_dissatisfied: "아직 어두울 때 자리에서 일어난다. [latria_partner.GetShortUIName](은)는 무언가 말하려는 듯하지만, 나는 이 실망스러운 만남을 끝내고 싶을 뿐이다."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName](은)는 올 때보다 훨씬 서둘러 떠난다. [latria_partner.GetSheHe|U](은)는 내 눈을 피하고 작별 인사조차 하지 않는다."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName](와)과 나는 조용한 곳에 자리를 잡고 입맞춤과 애무로 만족한다. 둘 다 시간이 가는 줄 모른다."
 latria_act.0101.a: "떠난다"
 latria_act.0102.desc: "나는 [latria_actor.GetShortUIName]에게 떠나라고 하지 않는다. 문이 닫히면 이 밤은 우리 둘만의 것이다.\n\n날이 밝았을 때는 시종들이 이미 한참이나 문밖에서 기다리고 있다."
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName](이)가 떠나기 전, 문에 귀를 기울인다.\n\n복도는 비어 있다. 적어도 오늘 밤만큼은 우리의 비밀이 지켜졌다."
 latria_act.0102.desc.partner_dissatisfied: "[latria_actor.GetShortUIName](와)과 단둘이 있기를 고대했다. 이제는 그저 떠나고 싶다. 이렇게까지 기다릴 만한 밤은 아니었다."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName](이)가 조급하게 일어선다. 말을 걸어 보지만 [latria_actor.GetSheHe](은)는 짧게 몇 마디만 내뱉고 문으로 향한다."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName](이)가 내 곁에 앉는다. 우리는 잠시 의무를 내려놓고 입맞춤과 애무만을 나눈다.\n\n헤어질 때도 바깥은 아직 어둡다."

