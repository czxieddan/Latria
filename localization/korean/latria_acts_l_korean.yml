 latria_act.0311.t: "오랜 쇠약"
 latria_act.0311.desc.illness: "오랜 방종에 결국 몸이 무너지고 병이 퍼진다."
 latria_act.0311.desc.stress: "쌓인 피로에 잠을 이루지 못한다."
 latria_act.0311.desc.infertile: "이 몸으로는 더 이상 자손을 볼 수 없다."
 latria_act.0311.desc.health: "일어서는 것조차 힘들어졌다. 몸이 한계에 다다랐다."
