 latria_act.0101.t: "문 뒤에서"
 latria_act.0101.desc: "문이 닫힐 때도 복도에서는 낮은 말소리가 남아 있다. 발소리가 멀어지고, 문틈의 빛도 함께 좁아진다. 그때서야 돌아보니 [latria_partner.GetShortUIName](은)는 이미 침대 가장자리에 앉아 있고, 옷은 아직 팔에 걸쳐져 들어온 뒤 잊힌 듯하다.\n\n등잔은 낮춰져 있다. 의자 위의 것은 둘 다 집어 들지 않지만 이불은 곧 따뜻해진다. 밤은 느리게 흘러 등잔심의 작은 소리가 하나씩 들린다. 다시 창을 보니 날이 밝았고, 바깥쪽 이불의 반은 식어 있다.\n\n시종이 두 번 두드리고 멈춘다. 안을 이미 방해해도 되는지 확실하지 않은 듯하다. 그제야 낮에 기다리는 일이 얼마나 많은지 떠올린다."
 latria_act.0101.desc.adultery: "나는 한참 문에 귀를 댄다. 복도의 목소리가 잦아들고 등잔을 들던 사람까지 빈 등잔을 들고 떠난 뒤에야 문을 조금 열어 [latria_partner.GetShortUIName](을)를 옆으로 들인다. 빗장 소리는 작다. 오늘 밤은 그 소리가 오래 남는 듯하다.\n\n목소리는 낮게 유지한다. 밖에서 발소리가 지날 때마다 둘은 숨까지 옆으로 두고, 그 소리가 돌아설 때까지 움직이지 않는다. 등잔불은 휘장을 비추고, 시선이 문틈으로 향할 때마다 우리의 눈도 비춘다.\n\n헤어질 때 [latria_partner.GetSheHe](은)는 문지방에서 나를 돌아본다. 다시 말할 필요는 없다. 오늘 밤은 세 번째 사람이 알아서는 안 된다."
 latria_act.0101.desc.dead: "처음에는 [latria_partner.GetShortUIName](이)가 깊이 잠든 것뿐이라고 생각한다. 귀 가까이에서 이름을 부르고, 그다음 등잔을 얼굴 옆으로 옮긴다. 불꽃이 튀어도 비치는 것은 대답하지 않는 눈이다.\n\n가슴에 손을 얹는다. 손바닥 아래의 고요함이 두렵다. 이불에는 조금 전까지의 온기가 남고 베개에도 눌린 자국이 남는다. 숨만 없다. 차가워지는 손을 잠시 쥔다. 아직 불러올 수 있을 것처럼.\n\n마침내 문을 벌컥 열고 의원을 부른다. 내 목소리는 복도에 부딪혀 돌아오고, 내 것처럼 들리지 않는다."
 latria_act.0101.desc.adultery_dead: "오늘 밤 최악의 일은 누군가 문을 열어 보여서는 안 될 두 사람을 보는 것이라고 생각했다.\n\n그보다 먼저 [latria_partner.GetShortUIName](이)가 쓰러진다. 부르고, 흔들고, 등잔을 얼굴 가까이 가져간다. 눈은 뜨이지 않는다. 입술에도 숨이 돌아오지 않는다. 조금 전까지 따뜻하던 손은 내 손바닥 안에서 조금씩 식는다.\n\n밖에서 발소리가 난다. 흐트러진 침대, 아직 입지 못한 옷, 그리고 다시는 깨지 않을 사람을 본다. 그 문이 열려도 먼저 내놓을 말 한 마디가 없다."
 latria_act.0101.desc.actor_dissatisfied: "밤은 아직 깊은데 나는 일어나 앉아 팔로 미끄러진 소매를 다시 끌어올린다.\n\n[latria_partner.GetShortUIName](은)는 이불 속에서 몸을 돌리며 아직 할 말이 남은 듯 내 손목에 가볍게 손가락을 댄다. 나는 이 시간이 얼마나 길고 비었는지만 느낀다. 손을 뻗을 마음조차 사라진다. 등잔심이 튀어도 방은 따뜻해지지 않는다.\n\n돌아보지 않고 의자에서 옷을 집는다. 끝내지 않을수록 더 빨리 문 밖으로 나가고 싶어지는 만남도 있다."
 latria_act.0101.desc.partner_dissatisfied: "들어올 때 [latria_partner.GetShortUIName](은)는 문간에서 멈추고, 먼저 등잔을 본 다음 나를 보았다. 이 밤을 바로 시작하고 싶지 않은 듯했다.\n\n떠나는 속도는 훨씬 빠르다. 띠가 매어지기도 전에 침대를 떠나며 내 눈도 손도 피한다. 이름을 부르자 짧은 대답만 있고 작별은 없다. 문이 닫힐 때 그 바람이 등잔불을 비스듬히 흔든다.\n\n기척은 방에 남는다. 침대 가장자리는 이미 식어 아무도 앉지 않았던 듯하다."
 latria_act.0101.desc.manual: "침대까지는 가지 않는다.\n\n[latria_partner.GetShortUIName](은)는 내 곁에 앉아 낮에 끝내지 못한 일을 말하기 시작하지만, 문장 중간에서 멈춘다. 입맞춤은 가볍고 애무도 소매와 머리카락에 머물며 더 깊이는 가지 않는다. 창밖으로 야경꾼의 소리가 지나간다. 둘 다 세지 않는다.\n\n마침내 등잔 기름이 다한다. 어둠 속에 조금 더 앉아 서로의 숨이 가라앉는 것을 듣고 나서 각자 소매를 정돈한다. 오늘 밤은 이것으로 충분하다."
 latria_act.0101.a: "문을 열고 낮으로 돌아간다."
 latria_act.0102.desc: "나는 [latria_actor.GetShortUIName]에게 밤이 깊었고 내일도 기다리는 사람이 있다고 말해도 된다. 말은 입술까지 왔다가 더 나가지 않는다.\n\n문이 닫히자 발소리와 말소리가 멀어진다. 등잔불은 휘장을 따뜻하게 하고, 둘 다 서둘러 일어나려 하지 않는다. [latria_actor.GetHerHis] 숨이 흐트러진 것에서 고요한 것으로 바뀌는 것을 듣다가 나 역시 시각을 잊는다. 다시 창을 보니 날이 밝아 있다. 밖의 시종은 아마도 오래 기다렸을 것이다.\n\n그때서야 손을 놓는다. 끝을 재촉하지 않아도 되는 밤도 있다."
 latria_act.0102.desc.adultery: "[latria_actor.GetShortUIName](이)가 떠나려 할 때 나는 문으로 가서 나무에 귀를 댄다.\n\n복도는 한동안 비어 있다. 그러다 누가 등잔을 들고 지나간다. 그 빛은 문틈을 천천히 가로지르고 천천히 멀어진다. 우리는 말하지 않고 옷조차 소리를 내지 않게 한다. 고요가 돌아온 뒤에야 옷이 정돈된다.\n\n옆으로 지나갈 만큼만 문을 연다. 적어도 오늘 밤, 비밀은 아직 둘만의 것이다."
 latria_act.0102.desc.partner_dissatisfied: "문이 닫히기 전, 나는 아직 이 밤이 어떤 모습일지 생각하고 있었다. 등잔조차 미리 더 따뜻하게 해 두었다.\n\n정말로 둘만 남으니 그 기대는 식어 간다. 손도, 숨도, 나를 붙들어 두었어야 할 다정함도 무언가의 건너편에서 닿는 듯하다. 나는 대답하면서도 눈은 문으로, 생각은 복도로 돌아간다.\n\n결국 먼저 일어나 소매를 정돈하는 것은 나다. 이 밤은 기다려 온 시간에 미치지 못했다."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName](은)는 내가 등잔을 다시 켜지 못하게 한 채 일어난다. 창가에는 희끗한 빛만 조금 남는다.\n\n나는 아직 누워, 밤이 이렇게 날카롭게 끊기지 않게 할 말을 찾는다. [latria_actor.GetSheHe](은)는 얼굴을 돌리고 건성인 두 마디를 하며, 내가 내민 옷도 받지 않은 채 이미 띠를 맨다. 말이 끝나기도 전에 문으로 향하는 길은 시작된다.\n\n문과 함께 찬 공기가 들어온다. 설명이 필요 없는 실망도 있다."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName](은)는 나를 침대로 끌어가지 않고 곁에 앉아 사이에 있던 베개를 치운다.\n\n낮에 끝내지 못한 일들이 갑자기 기다려도 될 것처럼 보인다. 입맞춤과, 끝까지 말하지 않아도 되는 몇 마디를 나눈다. 손은 소매나 머리카락에 머물고 더 깊이는 가지 않는다. 창밖은 아직 어둡고 야경꾼의 소리도 아직 멀다.\n\n헤어질 때 손가락이 내가 스스로 흐트러뜨린 옷의 주름을 펴 준다. 밤은 짧지만, 무언가 부족한 느낌은 남기지 않는다."

 latria_scheme.0010.t: "정사"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "나의 [spouse|E]"
 latria_scheme.0010.t.concubine: "나의 [concubine|E]"
 latria_scheme.0010.t.soulmate: "나의 [soulmate|E]"
 latria_scheme.0010.t.lover: "나의 [lover|E]"
 latria_scheme.0010.t.adultery: "불륜"
 latria_scheme.0010.desc: "촛불은 아직 타는데, [target.GetShortUIName](은)는 더는 내게 대답하지 않는다.\n\n이름을 부르고 귀를 입술에 가져다 댄다. 아무것도 없다. 손끝의 살은 조금 전보다 차가운데, 우리의 온기는 이불에 남아 있다. 손은 손바닥에서 미끄러져 돌아오지 않는다.\n\n날이 밝기 전에 잔과 옷, 이 밤의 흔적을 치울 생각이었다. 이제는 곁에 다시는 움직이지 않을 사람만 남았다. 창이 밝아 오는데, 무엇을 먼저 가려야 할지 모르겠다."
 latria_scheme.0010.a: "이불을 [target.GetShortUIName]에게 덮어 준 뒤 문을 연다."
 latria_scheme.0020.t: "헛되이 기다린 밤"
 latria_scheme.0020.desc: "등잔 기름은 한참 줄었는데, 문 밖에는 아직 [target.GetFirstName]의 발소리가 없다.\n\n술을 두 번 데우고 의자 위의 옷을 다시 개킨다. 가끔 복도를 누가 지나간다. 발소리가 가까워지면 숨을 멈추고, 멀어지면 다시 혼자다. 그때마다 기다리던 사람이라고 여긴다.\n\n마침내 촛불이 저절로 흔들리고 촛농이 받침에 떨어진다. 그때서야 이 밤이 끝났음을 인정한다. 준비해 둔 술도, 말도, 핑계도 필요 없다."
 latria_scheme.0020.a: "불을 끈다. 더 기다릴 필요는 없다."
 latria_scheme.0030.t: "너무 늦은 소식"
 latria_scheme.0030.desc: "어느 옆문이 더 한적하고 어떤 초대가 의심을 덜 살지 아직 재고 있는데, 소식이 탁자 위에 놓인다.\n\n[target.GetFirstName](은)는 이미 이 세상을 떠났다. 종이 위의 글자는 적다. 나는 그것을 오래 본다. 보내지 못한 편지, 외워 둔 복도, 이 하룻밤을 위해 마련해 둔 핑계. 모두 한꺼번에 쓸모없어진다.\n\n아직 따뜻한 술을 버린다. 더 나은 밤을 기다릴 수 있는 준비도 있다. 이미 일어난 죽음은 어떤 준비도 따라잡지 못한다."
 latria_scheme.0030.a: "보내지 못한 편지를 태운다."
 latria_scheme.0040.t: "끊어진 실"
 latria_scheme.0040.desc: "사람을 보내 [target.GetFirstName](을)를 찾게 하고, 오후부터 등잔이 켜질 때까지 기다린다. 돌아온 것은 흐릿한 대답뿐이다. 더는 만날 수 없다고.\n\n문 단속이 더 엄해진 것일 수도 있다. 누군가의 눈이 갑자기 날카로워진 것일 수도 있다. 아니면 [target.GetShortUIName](은)는 자신을 위해 내가 켜 둔 등잔 가까이 다시는 오지 않으려는 것일 수도 있다. 두 번 물어도 심부름꾼은 더 알지 못한다.\n\n이유는 이제 중요하지 않다. 실은 손가락 사이에서 끊겼다. 시각을 적어 둔 종이를 땀이 글씨를 번지게 할 때까지 손바닥 안에서 구긴다."
 latria_scheme.0040.a: "이 일은 여기까지다."

