l_korean:
 latria_sexual_frustration_flavor.1101.t: "침장 아래의 불면"
 latria_sexual_frustration_flavor.1101.desc.female: "나는 선잠에서 깨어났다. 잠옷은 어느새 침대 발치로 밀려났고, 어깨와 무릎은 침장 밖으로 나와 있다. 침장 안에는 나 말고 아무도 없다. 이불을 걷어찬 것도 나였고, 베개에는 한 사람이 누웠던 자리만 패여 있다.\n\n잠옷을 끌어당기자 옷감이 살갗을 스쳤지만 남아 있던 열기는 가라앉지 않았다. 창밖에서는 밤을 알리는 소리가 벌써 두 차례 지나갔다. 돌아누워 다시 자려 해도 눈을 감으면 낮에 그 사람이 돌아서던 뒷모습이 보인다. 침장 고리가 살짝 울려 누군가 한쪽을 걷는 듯했다. 하지만 아무도 없다.\n\n나는 반듯이 누웠다. 손을 어디에 두어야 할지 모르겠다. 밤은 아직 긴데 잠은 이미 달아났다."
 latria_sexual_frustration_flavor.1101.desc.male: "나는 선잠에서 깨어났다. 잠옷은 어느새 침대 발치로 밀려나 있다. 침장 밖은 어둡고, 멀리서 밤을 알리는 북소리만 한번 들렸다. 이불은 내가 뒤척인 탓에 한데 구겨져 있다.\n\n몸을 일으켰다가 다시 누웠다. 누운 뒤에도 가시지 않은 열기는 그대로다. 숨을 세다가 일곱 번째에 이르자 한 사람이 말하면서 가까이 다가왔던 거리가 떠올랐다. 그렇게 가까이 있어도 아무 일은 없었다. 그런데 나는 그 거리를 너무도 선명하게 기억한다.\n\n바람이 침장 한 귀퉁이를 들었다가 도로 내려놓았다. 침대 반대편은 여전히 차갑다."
 latria_sexual_frustration_flavor.1101.desc: "침장은 반쯤 내려와 있고 긴 밤은 아직 끝나지 않았다. 내 생각도 여전히 어지럽다.\n\n이불을 가슴까지 끌어 올렸다가 다시 걷어찼다. 베갯머리에는 편지도, 다른 사람도 없다. 내 손만 놓여 있다. 손바닥이 뜨거워서 조금 식혀 보려 깔개에 눌러 댔다.\n\n밤을 알리는 소리가 또 한 차례 울렸다. 나는 아직 깨어 있다."
 latria_sexual_frustration_flavor.1101.a: "눈을 감고 그리운 이를 생각한다."
 latria_sexual_frustration_flavor.1101.b: "생각을 접고 침장을 친 뒤 다시 잠을 청한다."

 latria_sexual_frustration_flavor.1102.t: "춤 사이의 눈길"
 latria_sexual_frustration_flavor.1102.desc.accepted: "춤곡이 세 번 바뀌고 자리의 사람들도 몇 차례 바뀌었다. 춤추다 조금 가까워져도 곁눈질하는 이는 없다. 악사들은 말을 끝까지 나눌 수 있도록 박자까지 늦추었다.\n\n하지만 나는 그 순간이 잊히지 않는다. 상대의 손이 예의상 필요한 시간보다 조금 더 오래 내 손목에 머물렀고, 눈길도 바로 피하지 않았다. 곡이 끝나자 손은 떨어졌지만 손끝에는 온기가 조금 남았다. 자리로 돌아오니 잔이 가득 차 있었다. 나는 마시지 않았다.\n\n벌써 다음 곡이 시작되었다. 비어 있는 마룻바닥을 바라보니 발은 아직 그쪽으로 가고 싶어 한다."
 latria_sexual_frustration_flavor.1102.desc.strict: "춤추며 가까워질수록 주위의 웃음소리가 수군거림처럼 들린다. 나는 악사들 쪽으로 눈길을 돌리지만, 손은 여전히 상대가 이끄는 대로 움직인다. 소매끼리 스치는 소리가 북소리보다 또렷하다.\n\n탁자 곁에서 누군가 몸을 숙여 이야기한다. 우리 이야기를 하는지 다른 이야기를 하는지 모르겠다. 곡이 멎자 나는 곧바로 반걸음 물러났다. 너무 급히 물러나는 바람에 내 신발을 밟을 뻔했다. 상대는 나를 한번 보았을 뿐 이유를 묻지 않았다.\n\n자리에 앉은 뒤에도 손목의 온기가 남아 있다. 나는 반대 손으로 그곳을 덮었다. 그러면 아무에게도 보이지 않을 것처럼."
 latria_sexual_frustration_flavor.1102.desc: "음악은 점점 빨라지지만 춤을 추어도 내 생각은 흩어지지 않는다.\n\n나는 상대를 따라 두 바퀴 돌았다. 발은 틀리지 않았지만 마음으로는 상대의 숨소리가 얼마나 가까워졌다 멀어지는지만 헤아렸다. 곡이 가장 높이 오르던 순간 잠깐 멎었다. 그 짧은 사이에 누구도 말하지 않았다.\n\n악사들이 다시 현을 울렸다. 나는 아직 그 자리에 서서 이 춤을 어디에서 끝내야 할지 모르고 있다."
 latria_sexual_frustration_flavor.1102.a: "한 곡 더 청하고 조금 더 가까이 다가간다."
 latria_sexual_frustration_flavor.1102.b: "춤 상대에게 인사하고 연회장 가장자리로 물러난다."

 latria_sexual_frustration_flavor.1103.t: "인도자의 문 앞에서"
 latria_sexual_frustration_flavor.1103.desc.favors: "영적 인도자는 욕망을 억누르는 것만이 경건하게 사는 길은 아니라고 말했다. 등불이 벽에 우리 두 사람의 그림자를 드리운다. 말은 느리다. 내가 이어 말할 틈을 남겨 두는 듯하다.\n\n나는 더 묻고 싶었다. 밤중에 혼자 깨어나 손을 어디에 두어야 할지 모를 때도 그 길 위에 있는 것인지. 말을 꺼내려는데 문밖에서 갑자기 발소리가 멈추었다. 우리는 둘 다 잠시 조용해졌다. 발소리는 다시 멀어졌다.\n\n인도자는 나를 바라보며 나머지 말을 기다린다. 나는 그 말을 삼켰다. 끝내지 못한 첫마디만 남았다."
 latria_sexual_frustration_flavor.1103.desc.condemns: "영적 인도자는 남들 앞에 있을 때만 순결이 중요한 것은 아니라고 일러 주었다. 목소리를 높이지도 않았는데 방이 갑자기 좁아진 듯하다. 나는 고개를 숙여 대답하고 소매 안에서 손을 움켜쥐었다.\n\n오늘 밤 왜 찾아왔느냐고 묻는다. 나는 등불을 보고, 문을 보고, 내 신발 끝을 본다. 인도자의 눈만은 보지 않는다. 사실대로 말하자면 길지도 않다. 하지만 입을 열면 더 물을까 봐 두렵다.\n\n문밖에서 누군가 기침했다. 나는 안도했다가, 그 안도감이 부끄러워졌다."
 latria_sexual_frustration_flavor.1103.desc: "방 안의 등불은 어둑하다. 나는 영적 인도자에게 어떻게 말을 꺼낼지 고르고 있다.\n\n물어야 할 것은 내 의무이고, 묻지 말아야 할 것은 따로 있다. 문 앞에서 두 가지 이야기를 모두 연습했는데 막상 들어오니 한마디도 생각나지 않는다. 인도자가 물을 따라 주었다. 아직 따뜻하다.\n\n나는 잔을 두 손으로 감쌌다. 잔 가장자리가 입술에 닿아도 말은 나오지 않는다."
 latria_sexual_frustration_flavor.1103.a: "갈망을 인정하고 더는 숨기지 않는다."
 latria_sexual_frustration_flavor.1103.b: "당장의 의무만 묻고 나머지 말은 삼킨다."

 latria_sexual_frustration_flavor.1104.t: "돌아오지 않는 독수리"
 latria_sexual_frustration_flavor.1104.desc.lustful: "매가 사냥터 위를 돌면서 좀처럼 장갑으로 내려오지 않는다. 나는 두 번이나 팔을 들었지만 매는 날개를 기울이더니 더 높이 날아갔다. 숲에서 나온 바람이 풀 냄새와 말의 땀 냄새를 싣고 온다.\n\n매가 부러울 지경이다. 설명할 필요도, 돌아볼 필요도 없고, 사람들 앞에서 조급함을 인내라고 둘러댈 필요도 없다. 시종이 활을 거둘지 물었다. 나는 고개를 저으면서 계속 그 검은 점을 쫓았다. 바라보다 보니 그것은 매보다 돌아오지 않는 다른 사람을 닮아 간다.\n\n팔은 벌써 뻐근하다. 그래도 나는 내리지 않았다."
 latria_sexual_frustration_flavor.1104.desc.chaste: "매가 내려오지 않고 계속 맴돈다. 시종은 몇 번이나 활을 거둘지 물었다. 나는 조금만 더 기다리라는 말만 했다. 더 기다리면 마음속 어지러움도 저절로 지나갈 것처럼.\n\n사냥꾼들은 벌써 말에서 내려 나무 그늘에서 물주머니를 돌린다. 그들은 재촉하지 않지만 마구 부딪치는 소리가 대신 재촉하는 것 같다. 나는 하늘을 보며 조용히 수를 센다. 그러다 보면 또 같은 사람의 이름을 되뇌고 있다.\n\n매가 한번 울었지만 여전히 내려오지 않는다. 나는 다른 손으로 장갑을 옮겼다. 아주 천천히 옮겼다."
 latria_sexual_frustration_flavor.1104.desc: "매는 좀처럼 돌아오지 않고 사냥꾼들은 모두 내 지시를 기다린다.\n\n호루라기를 쥔 자국이 내 손바닥에 남았다. 나는 그것을 입술로 가져갔다가 다시 내렸다. 하늘에서 매가 도는 원은 점점 작아지지만, 다음 순간 돌아올지는 아무도 모른다.\n\n누군가 작은 목소리로 이제 갈 것이냐고 물었다. 대답은 했지만 가자는 대답인지 더 기다리자는 대답인지 나도 모르겠다."
 latria_sexual_frustration_flavor.1104.a: "독수리가 맴도는 동안 생각에 잠긴다."
 latria_sexual_frustration_flavor.1104.b: "마음을 다잡고 독수리를 야영지로 불러들인다."

 latria_sexual_frustration_flavor.1105.t: "촛불과 왕관"
 latria_sexual_frustration_flavor.1105.desc.emperor: "가까이 모시는 시종이 예관을 받쳐 들고 침실을 나갔다. 촛대 곁에는 결재하지 못한 칙령 몇 통이 남아 있다. 나는 잠옷을 여미고 앉았다. 맨 위의 칙령부터 보아야 하는데, 손은 문서 사이에서 보내지 않은 편지를 꺼냈다.\n\n편지에는 상대를 부르는 말만 있고 그 뒤는 비어 있다. 낮에도 세 번이나 써 보았지만 세 번 모두 같은 곳에서 멈췄다. 함 속의 예관이 희미하게 빛난다. 내가 황제의 일을 하기를 아직 기다리는 듯하다. 편지를 반듯하게 눌러 펴도 다음에 무슨 말을 쓸지 모르겠다.\n\n촛농이 놋쇠 접시로 떨어지며 아주 작은 소리를 냈다."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "나는 여관 방에서 잠옷을 걸쳤다. 동료들은 이미 잠자리에 들었고 옆방에서는 누군가 코를 곤다. 짐 옆에 놓인 보내지 않은 편지가 등불을 받는다. 모서리가 말려 올라가 있다.\n\n내일은 길을 떠나야 한다. 마른 식량과 말과 나루까지 모두 준비했는데 이 편지만 갈 곳이 없다. 펼쳐 보니 아침보다도 남에게 보낼 수 없는 말처럼 읽힌다. 한 문장이 너무 솔직해서 그 줄 위에 손가락 마디를 잠시 멈추었다.\n\n아래층에서 문 닫는 소리가 났다. 나는 편지를 다시 짐 위에 얹었지만 단단히 눌러 두지는 않았다."
 latria_sexual_frustration_flavor.1105.desc.clergy: "나는 의례복을 개어 두고 잠옷 차림으로 침대 가장자리에 다시 앉았다. 보내지 않은 편지가 경전 아래 눌려 있다. 드러난 모서리는 마치 스스로 눈에 띄려는 것 같다.\n\n편지를 꺼내자 경전이 둔탁한 소리를 내며 닫혔다. 서약을 어기는 말은 적혀 있지 않다. 그런데도 모든 문장이 같은 사람을 맴돈다. 세 번째 줄에 이르자 이 시각에 읽어서는 안 되는 편지라는 것을 알았다.\n\n촛불이 한번 흔들렸다. 나는 편지를 도로 넣지 않았다."
 latria_sexual_frustration_flavor.1105.desc.ruler: "시종이 예복을 치우고, 나는 잠옷 차림으로 등불 아래 앉았다. 탁자의 문서는 아직 결재가 끝나지 않았는데 손 가까이 있던 보내지 않은 편지를 먼저 펼쳤다.\n\n밖에서 경비가 교대하며 가지런한 발소리가 지나갔다. 방 안에는 종이 넘기는 소리만 남았다. 나는 편지의 빈 곳에 글자 하나를 썼다가, 바라보고는 잉크로 덮어 지웠다. 검게 지운 곳이 원래 글자보다 더 눈에 띈다.\n\n나는 펜을 내려놓았다. 문서는 제자리에 있고 인장은 하나도 찍지 않았다."
 latria_sexual_frustration_flavor.1105.desc: "등불은 꺼져 가고, 보내지 않은 편지는 아직 내 손 가까이에 있다.\n\n받을 사람이 오늘 밤 이 편지를 읽지 못하리라는 것은 이미 안다. 그래도 나는 그 사람을 부르는 말을 다시 썼다. 낮보다 더 천천히 썼다. 잉크가 마르고 종이에는 옅은 자국만 남았다.\n\n등잔 심지가 타닥 소리를 냈다. 고개를 들고서야 내가 한참을 앉아 있었다는 것을 깨달았다."
 latria_sexual_frustration_flavor.1105.a: "편지를 전령에게 건넨다."
 latria_sexual_frustration_flavor.1105.b: "편지를 없애고 생각을 접은 뒤 촛불을 끄고 잠든다."

 latria_sexual_frustration_flavor.1106.t: "촛불 아래의 뒤척임"
 latria_sexual_frustration_flavor.1106.desc.female: "나는 잠옷 차림으로 침대 가장자리에 앉아 있다. 촛불이 창호지에 내 그림자를 비춘다. 숨 쉴 때마다 조금씩 움직이는 그림자가 나보다 차분해 보인다. 밤은 벌써 깊은데, 답을 얻지 못한 갈망은 아직 마음속에 남아 소리도 없이 떠나지도 않는다.\n\n머리카락을 어깨 뒤로 넘겼다가 다시 앞으로 내렸다. 손가락이 목 옆에 닿자 잠깐 멈추었다. 아무도 없는데 그 멈칫한 순간이 부끄러워 얼굴이 달아올랐다. 낮에 들은, 진심인지 농담인지 모를 말이 떠오른다. 그때는 웃어넘겼지만 웃고 나서도 줄곧 기억하고 있었다.\n\n촛농이 한 겹 더 높이 쌓였다. 나는 아직 앉아 있고 침장도 아직 내리지 않았다."
 latria_sexual_frustration_flavor.1106.desc.male: "나는 잠옷 차림으로 침대 가장자리에 앉아 있다. 창밖의 야경꾼은 벌써 두 차례 지나갔다. 처음에는 나도 잠들 수 있으리라 기대했지만 두 번째 발소리가 지나갈 무렵에는 포기했다.\n\n손에는 편지도 술도 없다. 그저 손바닥을 무릎에 눌렀다가 따뜻해지면 뒤집을 뿐이다. 마음속 그 사람의 목소리가 실제로 방에 들리는 것은 아니다. 그래도 그 말을 하다 어디서 멈추었는지까지 그대로 되뇔 수 있다. 세 번이나 되뇌고 나니 나 자신도 어처구니가 없다.\n\n나는 촛불을 향해 입김을 불었지만 끄지는 않았다. 불꽃은 기울었다가 다시 곧게 섰다."
 latria_sexual_frustration_flavor.1106.desc: "초는 짧아져 가는데 침장 안의 나는 여전히 잠들지 못한다.\n\n누우니 평소보다 심장 소리가 크게 들린다. 돌아누워도 그 소리는 그대로다. 방 안의 물건은 모두 제자리에 있다. 잔도, 신발도, 개어 놓은 겉옷도. 어느 것도 이 열기를 가시게 해 주지는 못한다.\n\n나는 다시 일어나 앉았다. 불은 아직 켜져 있지만 밤은 벌써 한참 지나갔다."
 latria_sexual_frustration_flavor.1106.a: "그 애정에 생각을 머물게 한다."
 latria_sexual_frustration_flavor.1106.b: "더 생각하지 않고 촛불을 끈 뒤 잠을 청한다."


 latria_sexual_frustration_flavor.1107.t: "답례의 춤"
 latria_sexual_frustration_flavor.1107.desc.accepted: "춤 상대가 내게 한 곡 더 추자고 청했다. 다른 이들은 그저 흔한 예의로 받아들인다. 악사는 벌써 활을 현에 대고 내가 고개를 끄덕이기를 기다린다.\n\n하지만 나는 조금 전의 그 손을 기억한다. 내 허리 곁에 잠시 머물렀던 손. 춤 동작이었다고 말할 만큼 짧았지만, 내가 정말 그렇게 믿기에는 길었다. 내가 상대의 얼굴을 보니 그 사람도 나를 본다. 입가에는 옅은 미소가 있지만 아무 말도 꺼내지 않는다.\n\n탁자 쪽에서 잔이 부딪쳤다. 큰 소리였는데도 내게는 아직 입 밖에 내지 않은 승낙의 말이 들린다."
 latria_sexual_frustration_flavor.1107.desc.strict: "춤 상대가 내게 한 곡 더 추자고 청하자 자리의 눈길 몇 개가 곧바로 이쪽을 향했다. 대답하기도 전에 누군가 옆 사람에게 몸을 숙여 속삭인다. 내용은 들리지 않지만 두 사람의 눈은 우리에게서 떨어지지 않는다.\n\n상대는 아직 손을 내밀고 있다. 예의를 갖춘 자세이고 억지로 권하는 것도 아니다. 하지만 소매 안의 내 손은 뜨겁다. 그 손을 잡으면 이번 춤은 아까보다 아무 일 없는 척하기 어려울 것이다. 잡지 않으면 거절한 일 자체가 사람들의 기억에 남을 것이다.\n\n악사가 헛기침했다. 활은 아직 현 위에 머물러 있다."
 latria_sexual_frustration_flavor.1107.desc: "악사들이 새 춤곡을 연주하기 시작했지만 나는 좀처럼 일어나지 못한다.\n\n첫 몇 박자는 벌써 지나갔다. 춤 상대는 손을 거두지도 나를 재촉하지도 않고 그냥 서 있다. 나는 그 손을 보았다가 탁자 가장자리에 놓인 내 손가락을 본다.\n\n뒤에서 누군가 의자를 옮겼다. 그 작은 소리에 놀라 눈을 한번 깜박였지만, 나는 여전히 일어서지 않았다."
 latria_sexual_frustration_flavor.1107.a: "춤을 받아들이고 더 가까이 다가간다."
 latria_sexual_frustration_flavor.1107.b: "인사하며 거절하고 즐거운 춤이 되기를 빈다."

 latria_sexual_frustration_flavor.1108.t: "잠들기 전의 기도"
 latria_sexual_frustration_flavor.1108.desc.favors: "나는 잠옷 차림으로 침대 곁에서 기도한다. 신앙이 육욕의 쾌락을 허락한다는 말은 잘 알지만 지금은 도움이 되지 않는다. 이것을 죄로 여길 필요가 없다고 할 뿐, 이 갈망을 어디에 두어야 할지는 알려 주지 않는다.\n\n무릎은 침대 가장자리에 닿아 있고 입에서는 기도문이 흘러나온다. 하지만 마음속에서는 낮에 너무 가까이에서 눈을 마주쳤던 순간이 거듭 떠오른다. 눈을 마주친 것뿐, 아무 일도 없었다. 그런데 나는 그 짧은 눈길을 여러 순간으로 나누어 하나씩 다시 들여다본다.\n\n기도가 끝날 곳에 이르러도 나는 멈추지 않았다. 그 뒤의 말은 내가 보탠 것이고, 두서조차 없었다."
 latria_sexual_frustration_flavor.1108.desc.condemns: "나는 잠옷 차림으로 침대 곁에 무릎을 꿇고 순결의 서약을 되뇐다. 한 구절을 읊을 때마다 마음속 목소리가 더 뚜렷해진다. 오늘 밤도 나는 혼자이고, 이불은 차갑고, 어둠 속에서 내 손에 닿는 것은 나 자신뿐일 것이다.\n\n나는 이마 한쪽을 침대 판자에 댔다. 나무가 차가워 조금은 견딜 만하다. 하지만 그 차가운 곳에서 떨어지면 열기가 다시 돌아온다. 나는 첫 문장부터 새로 시작했다. 옆방에서 들을까 두려운 사람처럼 목소리를 아주 낮췄다.\n\n옆방에는 아무도 없다. 그래도 나는 계속 목소리를 낮춘다."
 latria_sexual_frustration_flavor.1108.desc: "침대 곁의 촛불이 가볍게 흔들리고, 내 기도는 좀처럼 끝나지 않는다.\n\n익숙한 대목은 이미 모두 읊었다. 다음에는 침묵해야 하지만 나는 그 침묵을 받아들이지 못한다. 조용해지면 다른 일이 그 자리를 차지할 것이다. 몇 마디를 더 보태고 나니 나 자신도 그것이 기도문이 아니라는 것을 알겠다.\n\n촛불이 침장 쪽으로 기울었다. 나는 계속 무릎을 꿇고 있고 옷깃은 벌써 구겨졌다."
 latria_sexual_frustration_flavor.1108.a: "순결 서약을 내려놓고 내 갈망을 인정한다."
 latria_sexual_frustration_flavor.1108.b: "생각을 억누르고 계속 기도한다."

 latria_sexual_frustration_flavor.1109.t: "끝내지 못한 자문회"
 latria_sexual_frustration_flavor.1109.desc: "신하들은 이미 세 가지 방책을 제시했지만 나는 아직 결정을 내리지 못했다. 첫 번째가 가장 안전하고, 두 번째는 비용이 가장 적게 들며, 세 번째는 전례에 가장 잘 맞는다. 모두 듣고 모두 고개도 끄덕였다. 그래 놓고도 어느 것을 택할지 말하지 못한다.\n\n서기관의 펜이 허공에서 멈추었다. 누군가 물잔을 내 손 가까이 밀어 준다. 물 위에 비친 내 모습을 보다가 문득 생각이 딴 데로 갔다. 군량과는 아무 상관 없는 한 사람에게로. 그 사람은 지금 이 방에 없지만, 나는 말하다 잠시 멈추던 모습까지 떠올릴 수 있다.\n\n침묵이 민망할 만큼 길어졌다. 나는 목을 가다듬었지만 여전히 말 한마디 내놓지 못했다."
 latria_sexual_frustration_flavor.1109.a: "자문회를 끝내고 홀로 생각에 잠긴다."
 latria_sexual_frustration_flavor.1109.b: "생각을 억누르고 서기관에게 계속하라고 한다."
 latria_sexual_frustration_flavor.1110.t: "자정이 지난 방"
 latria_sexual_frustration_flavor.1110.desc.clergy: "나는 잠옷 차림으로 내 작은 방에 돌아왔다. 밤기도는 끝났고 복도의 등불도 대부분 꺼졌다. 그런데 보내지 않은 편지는 아직 탁자 위에서 기도 구슬 한 줄을 누른 채 펼쳐져 있다.\n\n구슬을 함에 넣고 편지도 치워야 한다. 하지만 종이에 손을 얹자 그대로 멈추었다. 편지의 문장은 이미 외우고 있다. 외우면서도 그 사람의 이름을 내가 어떤 글씨로 적었는지 다시 보고 싶다. 한 군데 잉크가 번져 있다. 쓸 때 손이 흔들렸던 모양이다.\n\n작은 방은 아주 조용하다. 나는 탁자 곁에 서 있고 잠옷 끈은 느슨하다."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "여관에는 등불 몇 개만 남아 있다. 나는 잠옷 차림으로 침대 가장자리에 앉았다. 짐은 벌써 묶어 두었지만 보내지 않은 편지 한 통만 밖으로 나와 있다.\n\n옆방에서 누군가 돌아눕자 침대 판자가 울렸다. 나는 그 소리가 멎기를 기다린 뒤 편지를 꺼냈다. 종이 가장자리에 길에서 묻은 먼지가 남아 있다. 입으로 불어도 먼지는 떨어지지 않고 문장만 더 또렷해 보인다. 쓰지 말았어야 할 말이 하필 한가운데 적혀 있다.\n\n나는 편지를 접었다. 접힌 선이 원래 자국과 맞지 않는다."
 latria_sexual_frustration_flavor.1110.desc: "문밖의 소리는 조금씩 멀어지는데 나는 아직 침대 곁에서 기다리고 있다.\n\n오늘 밤 찾아오기로 한 사람은 없다. 그래도 불을 켜 두고 겉옷을 손 닿는 곳에 놓았다. 발소리가 지나갈 때마다 한 번씩 고개를 들었다. 그 발소리는 모두 멀어져 갔다.\n\n등잔 기름이 한참 줄었다. 침대 반대편은 여전히 비어 있고, 나는 아직 눕지 않았다."
 latria_sexual_frustration_flavor.1110.a: "편지를 마저 써서 새벽에 보내게 한다."
 latria_sexual_frustration_flavor.1110.b: "문을 걸어 잠그고 생각을 접은 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1101.c: "겉옷을 걸치고 가만히 앉아 호흡을 가다듬는다."
 latria_sexual_frustration_flavor.1102.c: "악사들과 곡조에 관해 이야기한다."
 latria_sexual_frustration_flavor.1103.c: "이 마음과 함께 살아갈 길을 묻는다."
 latria_sexual_frustration_flavor.1103.d: "보내지 않은 편지부터 시작해 아무것도 숨기지 않는다."
 latria_sexual_frustration_flavor.1104.c: "독수리를 차분히 길들이는 동안 기다려 달라고 한다."
 latria_sexual_frustration_flavor.1105.c: "편지를 함에 넣고 내일의 일을 계획한다."
 latria_sexual_frustration_flavor.1107.c: "춤 상대에게 앉아서 다른 이야기를 하자고 한다."
 latria_sexual_frustration_flavor.1107.d: "탁자의 모든 손님을 흥겨운 군무에 초대한다."
 latria_sexual_frustration_flavor.1108.c: "모든 생각과 싸우려 하지 않고 기도를 천천히 마친다."
 latria_sexual_frustration_flavor.1109.c: "잠시 쉬며 남은 의제를 정리한다."
 latria_sexual_frustration_flavor.1109.d: "급한 판결을 정리하고 이 자리에서 마친다."
 latria_sexual_frustration_flavor.1110.c: "겉옷을 걸치고 따뜻한 국물 한 잔을 찾는다."
