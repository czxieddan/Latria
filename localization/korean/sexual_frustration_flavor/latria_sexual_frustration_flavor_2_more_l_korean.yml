l_korean:
 latria_sexual_frustration_flavor.1111.t: "이경(二更)"
 latria_sexual_frustration_flavor.1111.desc: "이경에 잠이 깬다. 이불은 한쪽 종아리를 감아 비틀려 있다. 등잔은 손톱만 한 불꽃으로 줄었다. 내 손은 이미 배 아래에, 내 몸의 열로 따뜻해진 채 놓여 있고, 나는 그것을 거둔다.\n\n해질 녘에 한순간이 있었다. 누군가 소금을 집으려 내 앞으로 몸을 기울였고, 앞팔이 내 손목 뒤를 스쳤고, 숨 한 번 쉴 동안 어느 쪽도 움직이지 않았다. 나는 그 숨을 그 대화 전체보다 더 여러 번 되짚었다.\n\n나는 손바닥을 엉덩이 옆 매트리스에 평평하게 누른다. 그 자리의 아마포는 아직 서늘하다. 서늘한 채로 둔다."
 latria_sexual_frustration_flavor.1111.a: "손이 가려는 곳으로 보낸다."
 latria_sexual_frustration_flavor.1111.b: "돌아누워 잠을 기다린다."
 latria_sexual_frustration_flavor.1111.c: "가만히 누워 집이 가라앉는 소리를 듣는다."

 latria_sexual_frustration_flavor.1112.t: "우리 사이의 잔"
 latria_sexual_frustration_flavor.1112.desc: "잔은 벤치를 따라 손에서 손으로 가고, 내게 닿을 때 테는 아직 다른 입이 남긴 젖음으로 축축하다. 나는 그 젖은 자리에 대고 마신다. 상 너머에서 누군가 그것을 지켜보며, 시선을 돌리지도 않고 웃지도 않는다.\n\n우리는 한동안 말 이야기를 한다. 밤색 암말의 값, 사거리 대장장이. 상 밑에서 무릎 하나가 내 무릎에 얹힌다. 실은 없고 접촉뿐인데, 나는 계속 말 이야기를 한다.\n\n시종이 잔을 채운다. 무릎은 삼촌에게 인사하러 물러난다. 나는 잔을 두 손으로 쥐고, 술은 미지근해졌고, 곁의 벤치는 식사가 끝날 때까지 비어 있다."
 latria_sexual_frustration_flavor.1112.a: "그 무릎이 하던 말을 분명히 한다."
 latria_sexual_frustration_flavor.1112.b: "일행에게 감사하고 일찍 간다."
 latria_sexual_frustration_flavor.1112.c: "남아서 홀이 빌 때까지 말 이야기를 한다."

 latria_sexual_frustration_flavor.1113.t: "너무 긴 춤"
 latria_sexual_frustration_flavor.1113.desc: "음악이 돌고 나는 한 사람에게서 다음 사람에게로 건네진다. 세 번째는 정해진 동작보다 한 박을 더 내 손을 쥐고, 맥박이 뛰는 손목 안쪽에 엄지를 대고, 우연인 양 웃는다. 나는 다음 발을 놓치고 회전으로 그것을 덮는다.\n\n홀 저 끝에서 누군가 웃는다. 누군지 보려고 돌아보지 않는다. 얼굴이 뜨겁고 촛불 아래에서 그것이 드러남을 안다. 이 방에서 촛불만이 유일하게 정직한 빛이다.\n\n곡이 끝난다. 나는 기둥 곁에, 손을 아직 반쯤 쥔 채 서서, 그 엄지의 모양이 살갗에 찍힌 것을 느끼고, 악사들이 다시 시작한다."
 latria_sexual_frustration_flavor.1113.a: "홀 전체가 보는 앞에서 큰 소리로 그 사람에게 잔을 든다."
 latria_sexual_frustration_flavor.1113.b: "일행에게 인사하고 춤판에서 물러난다."
 latria_sexual_frustration_flavor.1113.c: "가장 조용한 구석을 찾아 천천히 숨을 쉰다."

 latria_sexual_frustration_flavor.1114.t: "돌아오는 긴 길"
 latria_sexual_frustration_flavor.1114.desc: "잎에 비가 오고, 사슴은 한 시간 전에 사라졌다. 나는 뒤에서 타며, 앞쪽에서 몰이꾼들의 이야기가 옅어진다. 안장의 여파로 허벅지가 시큰하여, 저녁 전에 제 몸을 잊지 못하게 한다. 젖은 망토의 모직이 깃에서 차갑다.\n\n여울에서 기수 하나가 내 고삐를 붙들어 주고, 말이 진정된 뒤에도 손은 가죽끈에 남는다. 땋은 머리 끝에서 물이 흐른다. 어느 쪽도 비 이야기를 하지 않는다.\n\n우리는 계속 탄다. 젖은 가죽이 걸음마다 삐걱이고, 나는 생각 대신 그 삐걱임을 세다가, 세 번째 들판을 지나 어딘가에서 셈을 놓친다."
 latria_sexual_frustration_flavor.1114.a: "빛이 꺼질 때까지 사냥을 이어 간다."
 latria_sexual_frustration_flavor.1114.b: "눈은 길에, 손은 고삐에 둔다."
 latria_sexual_frustration_flavor.1114.c: "땅을, 꺾인 줄기를, 발굽 자국을 읽는다."
 latria_sexual_frustration_flavor.1114.d: "매를 또다시, 또다시 날린다."

 latria_sexual_frustration_flavor.1115.t: "세 번째 경에 꿇어"
 latria_sexual_frustration_flavor.1115.desc: "돌 위에서 무릎이 시큰해질 때까지 꿇어 있고, 그 시큰함만이 내 주의를 붙든다. 등잔 기름이 산패했다. 오늘 아침 내 몸은 조용해지지 않는다. 그것은 원하고, 지붕 들보를 고치며 그 일에 휘파람을 부는 누군가의 쪽을 향해 원한다.\n\n나는 예배를 올린다. 네 번째 줄에서 마음이 미끄러져 처음부터 다시 시작한다. 뒤에서 누군가 헛기침을 하고, 나는 돌아보지 않는다.\n\n수도복을 뚫고 돌의 냉기가 온다. 다른 이들이 일어난 뒤에도 나는 그대로 있고, 냉기는 정강이에 이르지만 그것으로 부족하다."
 latria_sexual_frustration_flavor.1115.a: "고해소에서 그 이름을 대고, 뒤에 속죄를 받는다."
 latria_sexual_frustration_flavor.1115.b: "종이 울릴 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1115.c: "주석서를 들어 그 장을 끝까지 읽는다."

 latria_sexual_frustration_flavor.1116.t: "사제가 묻지 않은 것"
 latria_sexual_frustration_flavor.1116.desc: "내 사제는 나와 복도를 걸으며 아무것도 묻지 않는다. 묻는 것보다 더하다. 나는 게으름의 죄를 이야기하고, 그 사람은 수확과 늦게 온 비, 호밀값을 이야기한다.\n\n그 사람의 소맷부리가 닳았다. 나는 손짓할 때 풀린 실이 움직이는 것을 보다가 소매 속 손목을 생각하고, 다시 게으름을 생각하다가, 수확 이야기를 통째로 놓친다. 그 사람이 걸음을 멈추어 내가 따라오게 한다.\n\n문에서 그 사람이 나를 축복한다. 나는 축복이 끝난 뒤에도 그 손을 잠시 쥔다. 그 사람은 내버려 두었다가, 계단을 두 칸씩 건너 내려간다."
 latria_sexual_frustration_flavor.1116.a: "그 사람에게 전부를 말한다."
 latria_sexual_frustration_flavor.1116.b: "그 사람에게 속죄를 청하고 그것을 지킨다."
 latria_sexual_frustration_flavor.1116.c: "수확 이야기를 끝까지 듣는다."

 latria_sexual_frustration_flavor.1117.t: "의논 뒤의 청원서"
 latria_sexual_frustration_flavor.1117.desc: "의논의 자리가 비어 간다. 내 재상은 청원서 하나를 더 밀어붙이려 남고, 나는 말의 뜻보다 그 말이 맴도는 입 모양을 듣는다. 인장은 내 손의 열로 따뜻하고 밀랍은 굳지 않았다.\n\n연회 뒤로 나는 누구와도 단둘이 있지 않았다. 왕관은 목덜미를 누르는 무게이고, 목은 다른 무게를 원한다. 금 대신 그 자리에 얹힐 손 하나를.\n\n나는 청원을 허락한다. 그 사람이 절한다. 나는 문이 닫힐 때까지 지도에, 그다음에는 문에 눈을 두었고, 지도 곁의 촛불은 내가 앉아 있는 동안 다 타들어 갔다."
 latria_sexual_frustration_flavor.1117.a: "촛불이 꺼진 뒤 누군가를 부른다."
 latria_sexual_frustration_flavor.1117.b: "청원서에 인장이 찍힐 때까지 일을 붙든다."
 latria_sexual_frustration_flavor.1117.c: "다음 청원서 세 장을 직접 읽는다."

 latria_sexual_frustration_flavor.1118.t: "테라스의 자두주"
 latria_sexual_frustration_flavor.1118.desc: "자두주 세 번째 잔, 소매는 자꾸 스친다. 내 사람들은 시의 행으로 말하며, 한 행이 한 걸음씩 가까워진다. 시종 하나가 난간에 서서 듣지 않는 척한다.\n\n나는 소매를 손목에서 열어 둔다. 맞은편 소매는 물러나지 않는다. 테라스 아래 어딘가에서 피리가 시작되고 멈추고 다시 시작한다. 같은 세 구절이다.\n\n나는 잔을 난간에, 절반쯤 남은 채로 올려놓고, 술이 마지막 빛을 품는다. 어느 쪽도 분명한 말은 하지 않았다. 돌바닥에서 꽃잎 하나가 뒤집힌다. 난간의 시종은 여전히 듣지 않는 척한다."
 latria_sexual_frustration_flavor.1118.a: "오해할 수 없는 한 행으로 답한다."
 latria_sexual_frustration_flavor.1118.b: "소매를 고쳐 하고 날씨 이야기를 한다."
 latria_sexual_frustration_flavor.1118.c: "등롱이 밝혀질 때까지 혼자 테라스를 걷는다."

 latria_sexual_frustration_flavor.1119.t: "켜 둔 등잔"
 latria_sexual_frustration_flavor.1119.desc: "나는 등잔을 켜 두었고 이불은 허리에 걸려 있다. 손이 배의 따뜻한 살갗을 지나 더 아래로 가고, 이번에는 멈추지 않는다. 나는 이미 젖어 있다. 해질 녘 내 목에 닿았던 입술을 생각한 탓이고, 손가락은 쉽게 미끄러진다.\n\n내 위를 덮은 몸의 무게, 그 정확한 무게를 생각하고, 엉덩이가 허공을 향해 들린다. 누르고 돌리고, 고요한 방에서 숨이 거칠어진다. 손바닥 뒤꿈치가 내가 원하는 자리를 짓이긴다.\n\n그것은 긴 전율로 와서 허벅지를 떨게 남긴다. 뒤에 나는 팔을 눈 위에 걸치고 누워 있고, 등잔은 아직 타고, 아래 이불은 축축하다."
 latria_sexual_frustration_flavor.1119.a: "끝까지 가게 두고, 젖은 어둠 속에 누워 있는다."
 latria_sexual_frustration_flavor.1119.b: "손을 거두어 서까래를 센다."
 latria_sexual_frustration_flavor.1119.c: "등잔 심지를 다듬고 어둠 속에 누운다."

 latria_sexual_frustration_flavor.1120.t: "손님 방"
 latria_sexual_frustration_flavor.1120.desc: "홀의 불이 꺼진 뒤에 노크가 있고, 문을 열자 나는 잠옷 차림이다. 누구를 위해 옷을 입은 것이 아니다. 내 몸을 훑는 눈길이 보이고, 나는 숄을 집지 않는다.\n\n우리는 아무것도 가장하지 않는다. 입술이 내 목을 찾고, 내 손은 허리띠에 가 있고, 내가 상 위로 들려 올려질 때 잔이 넘어가 굴러떨어진다. 속도는 느리고 나는 참을성이 없다. 내 목소리가 들리고, 그것이 나를 놀라게 하고, 목에 닿은 웃음이 있고, 속도는 변하지 않는다.\n\n뒤에 술이 상 가장자리에서 바닥으로 한 방울씩 떨어진다. 어느 쪽도 닦으려 움직이지 않는다."
 latria_sexual_frustration_flavor.1120.a: "문을 걸지 않고 잠옷을 입은 채 둔다."
 latria_sexual_frustration_flavor.1120.b: "고맙게 인사하고 문을 닫는다."
 latria_sexual_frustration_flavor.1120.c: "상 가장자리에 앉아 날이 밝을 때까지 이야기한다."

 latria_sexual_frustration_flavor.1121.t: "그림 병풍 뒤"
 latria_sexual_frustration_flavor.1121.desc: "연회는 격식을 지나쳤다. 홀 한 귀퉁이에 병풍이 드리워지고, 그 뒤의 소리는 먹는 소리가 아니다. 손 하나가 내 손목을 쥐고, 나는 이끌리는 대로 두었고, 병풍에 그려진 왜가리가 손닿을 만큼 가까이 지나간다.\n\n손은 한 사람의 것보다 많다. 나는 세기를 그만둔다. 부들깔개는 밟혀 납작하고, 잔 하나가 내 무릎에 굴러 닿지만 아무도 줍지 않는다.\n\n뒤에 나는 벽에 기대 앉아 있다. 머리는 풀렸고 입술은 부었으며, 어깨에는 낯선 이의 망토가 걸쳐 있다. 음악은 멈추지 않았다."
 latria_sexual_frustration_flavor.1121.a: "병풍 뒤로 가서 홀이 듣게 한다."
 latria_sexual_frustration_flavor.1121.b: "거절하고, 잔과 자리를 지킨다."
 latria_sexual_frustration_flavor.1121.c: "판을 벌려 손이 흔들리지 않을 때까지 둔다."

 latria_sexual_frustration_flavor.1122.t: "시 네 자"
 latria_sexual_frustration_flavor.1122.desc: "서판은 무릎 위에 있고 갈대펜은 말랐다. 어깨의 곡선에 관한 시의 네 자를 썼으나, 그 넷 중 맞는 것이 없다. 다섯 번째는 더하다.\n\n방은 춥다. 그 속에서 내 숨소리가 크다. 나는 서판을 치우고 손등을 입에 대고, 욕망은 어디로도 가지 않고 모양만 바꾸어 더 아래로 가라앉는다.\n\n나는 다시 펜을 든다. 행은 끝맺지 못한 채 남고, 갈대 갈라진 틈에서 잉크가 마르고, 그 행의 어깨는 여전히 어깨일 뿐이다."
 latria_sexual_frustration_flavor.1122.a: "어깨를, 그리고 나머지도 쓴다."
 latria_sexual_frustration_flavor.1122.b: "서판을 덮고 손을 가만히 두고 앉는다."
 latria_sexual_frustration_flavor.1122.c: "방이 그저 방이 될 때까지 시시한 것을 읽는다."
 latria_sexual_frustration_flavor.1122.d: "저녁 식사에서 끝맺지 못한 그 행을 읊는다."

 latria_sexual_frustration_flavor.1123.t: "매의 무게"
 latria_sexual_frustration_flavor.1123.desc: "복면을 쓴 매가 내 장갑에 앉았고, 그 무게가 오늘 아침 유일하게 정직한 것이다. 우리는 젖은 풀밭에서 왜가리를 기다린다. 어깨가 타고, 엄지 쪽 가죽은 물을 먹었다.\n\n우리가 웅크릴 때 팔 하나가 내 팔에 닿아 그대로 남는다. 새가 발을 옮긴다. 나는 갈대 쪽에 눈을 둔다. 맥박이 귀에, 늪보다 크게 울리고, 그것이 들린다고 나는 확신한다.\n\n왜가리는 오지 않는다. 우리는 매를 주먹에 얹고, 풀에 부츠를 복사뼈까지 적신 채 돌아오고, 어느 쪽도 팔 이야기는 하지 않는다."
 latria_sexual_frustration_flavor.1123.a: "다시 말을 몰아 어두워질 때까지 사냥한다."
 latria_sexual_frustration_flavor.1123.b: "가만히 있어 늪이 조용해지게 둔다."
 latria_sexual_frustration_flavor.1123.c: "매를 놓고 오직 매만 본다."

 latria_sexual_frustration_flavor.1124.t: "구제함"
 latria_sexual_frustration_flavor.1124.desc: "나는 구제함에 동전을 세어 넣고, 그 셈은 생각하지 않는 방법이다. 대개 구리이고, 양모 상인이 낸 은화 두 닢. 시주하는 이의 손이 내 손 곁에, 우리 손가락이 동전 사이에 있고, 사제는 세 번째 단에서 우리 둘을 본다.\n\n나는 이것을 고해하지 않았다. 무엇이라 불러야 할지 모른다. 내 얼굴은 정돈되어 있다. 나는 거울 앞에서 정돈된 얼굴을 연습했다.\n\n손이 물러난다. 나는 뚜껑을 닫고 작은 놋쇠 자물쇠가 딸깍인다. 내 손은 열쇠에서 흔들리고, 사제는 아직 그 단에 있다."
 latria_sexual_frustration_flavor.1124.a: "촛불 값을 치르고 사제가 내 얼굴을 보게 한다."
 latria_sexual_frustration_flavor.1124.b: "촛불이 흔들려 꺼질 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1124.c: "시편집을 한 번 더 처음부터 읽는다."

 latria_sexual_frustration_flavor.1125.t: "자정에 합의된 조항"
 latria_sexual_frustration_flavor.1125.desc: "우리는 정오부터 조약에 매여 있다. 촛불은 짧게 닳았고 불은 꺼진 채 버려졌다. 상대가 마지막 조항을 소리 내어 읽고, 나는 듣지 않고 동의한다. 내 것이 아닌 언어를 다루는 턱의 움직임 때문이다.\n\n이것은 첫날 밤이 아니다. 나는 내가 쓸모없어지는 정확한 거리를 알고, 우리는 두 번째 촛불부터 그 안에 들어와 있다.\n\n나는 서명한다. 상대도 서명한다. 반지를 눌러 찍을 때 밀랍은 아직 물러 있고, 내 손은 흔들리지 않으며, 서기가 종이를 가져가고, 그것이 내 승리의 전부다."
 latria_sexual_frustration_flavor.1125.a: "방이 비면 서찰을 보낸다."
 latria_sexual_frustration_flavor.1125.b: "한 마디씩, 조항을 지킨다."
 latria_sexual_frustration_flavor.1125.c: "조약을 가져가 한 줄도 빠짐없이 읽는다."

 latria_sexual_frustration_flavor.1126.t: "풀과 바람, 열린 깃"
 latria_sexual_frustration_flavor.1126.desc: "말들은 풀을 뜯게 풀려 나갔고, 우리는 안장을 그대로 둔 채 펠트 위에 앉는다. 일행의 사람들은 기수라면 안장에서 잠들 수 있어야 한다고 한다. 나는 땅에 앉아서도 가만있지 못한다.\n\n본 적 없는 강, 여울이 셋인 강 이야기가 나온다. 셔츠의 목이 열려 있다. 바람이 풀을 길게 눕히고, 나는 강 대신 그 목을 본다.\n\n말이 콧김을 뿜는다. 내가 먼저 시선을 돌리고, 바람 속에서 귀가 뜨겁고, 강 이야기는 나를 빼고 계속된다."
 latria_sexual_frustration_flavor.1126.a: "서툰 이 언어로 소리 내어 말한다."
 latria_sexual_frustration_flavor.1126.b: "혀를 누르고 말들을 본다."
 latria_sexual_frustration_flavor.1126.c: "바람이 그것을 걷어 갈 때까지 세게 달린다."

 latria_sexual_frustration_flavor.1127.t: "베개에 남지 않은 자리"
 latria_sexual_frustration_flavor.1127.desc.female: "침대는 지나치게 따뜻하고, 나는 이불을 바닥으로 걷어찼다. 잠옷은 허리까지 뭉쳐 있다. 나는 손을 그 자리에 가고, 내 몸은 내가 무엇을 정하기도 전에 대답한다. 아래쪽에서 빠르게 번지는 열, 나보다 끈질긴.\n\n어떤 사람이 복도에서 내 이름을 부르던 방식, 길게 끌리던 두 번째 음절, 그 뒤로 완전히 닫히지 않은 문을 생각한다. 손가락이 움직이고, 그 끌린 음절에서 숨이 걸린다.\n\n나는 끝 전에 멈춘다. 손을 가만히 두고 심장이 뛰는 채로 누워 있고, 곁의 베개에는 움푹한 자리가 없다."
 latria_sexual_frustration_flavor.1127.desc.male: "이불은 바닥에 있고 잠옷은 허리까지 뭉쳐 있다. 손이 내려가고, 나는 이미 단단하다. 아무것도 아닌 것에서, 복도와 이름 하나와 반쯤 열린 문에서.\n\n입술을 생각하고, 엉덩이가 저절로 움직인다. 숨이 짧아진다. 나는 한순간에 끝낼 수 있고 그러지 않으며, 하지 않음은 그 자체로 하나의 노동이다.\n\n나는 손을 거두어 반듯하게 누운다. 방은 매우 조용하고 아픔은 가지 않으며, 곁의 베개는 서늘하고 나는 그것에 손을 대지 않는다."
 latria_sexual_frustration_flavor.1127.desc: "침대는 지나치게 따뜻하고 등잔은 꺼졌다. 나는 이불을 걷어차고 손이 샛길로 들며, 허락을 정하기도 전에 내 몸이, 나보다 끈질기게, 즉시 대답한다.\n\n복도, 두 번 불린 이름, 손목에서 걷힌 소매를 생각한다. 그 시각의 복도는 어둡다. 숨이 짧아지고, 나는 그 생각을 끝까지, 그 이상은 가지 않게 둔다.\n\n나는 손을 거두어 가만히 누운다. 곁의 베개에는 움푹한 자리가 없고, 이불은 아침까지 바닥에 남는다."
 latria_sexual_frustration_flavor.1127.a: "손을 그 자리에 둔다."
 latria_sexual_frustration_flavor.1127.b: "손을 모아 쥐고 옆으로 누워 잠든다."
 latria_sexual_frustration_flavor.1127.c: "일어나 밝아올 때까지 덧문 곁에 앉는다."

 latria_sexual_frustration_flavor.1128.t: "축배"
 latria_sexual_frustration_flavor.1128.desc: "나는 축배를 들려고 일어서고, 홀은 얼굴들의 흐림이다. 한 얼굴만 흐리지 않다. 나는 잔 하나가 비는 동안 충절을 말하고, 눈은 자꾸 세 번째 상 위 같은 자리로 돌아간다.\n\n상좌에서 누군가 헛기침을 한다. 그 소문은 접시가 치워지기 전에 부엌에 닿을 것이고, 나는 마땅히 그래야 할 만큼 개의치 않음을, 그 자체가 답해야 할 일임을 깨닫는다.\n\n나는 앉는다. 손이 잔의 자루를 지나치게 세게 쥐고, 홀 너머 그 얼굴은 여전히 나를 향해 있다."
 latria_sexual_frustration_flavor.1128.a: "내가 보고 있던 이의 이름을 대고, 그 사람에게 잔을 든다."
 latria_sexual_frustration_flavor.1128.b: "오직 충절만을, 진심으로 말한다."
 latria_sexual_frustration_flavor.1128.c: "잔을 들고 저 끝으로 가 오랜 벗과 앉는다."

 latria_sexual_frustration_flavor.1129.t: "세 번째 장에 관한 주석"
 latria_sexual_frustration_flavor.1129.desc: "내 사제가 주석을 소리 내어 읽고, 나는 종이 위 손가락으로 행을 따라간다. 읽는 것은 목소리다. 내 손가락은 멈추었다. 목소리보다 세 줄 아래, 한 시간 전과 같은 면에서.\n\n면이 넘어가려 하고 내 손가락이 가로막는다. 읽는 이가 기다린다. 나는 움직이지 않는다. 우리 사이 촛불이 굽었다가 곧게 서고, 집 어딘가에서 문이 닫힌다.\n\n읽기는 계속된다. 나는 세 번째 장의 논증을 완전히 놓쳤고, 방에서는 밀랍과 잉크 냄새가 나고, 손가락은 여전히 그 자리에 있다."
 latria_sexual_frustration_flavor.1129.a: "마음이 떠돌았음을 고하고 속죄를 받는다."
 latria_sexual_frustration_flavor.1129.b: "더 엄한 규율을 청하고 그것을 지킨다."
 latria_sexual_frustration_flavor.1129.c: "그 면의 첫 줄에서 다시 행을 따라간다."

 latria_sexual_frustration_flavor.1130.t: "벗에게 한 말"
 latria_sexual_frustration_flavor.1130.desc: "나는 벗에게 전부를 말한다. 복도와 손목과 잔을. 벗은 한 손에 턱을 얹고 듣고, 한 번도 문 쪽을 보지 않는다. 우리 사이 술은 손대지 않은 채다. 소리 내어 말하는 것은 다행이고, 아무것도 바꾸지 않는다.\n\n그때 손 하나가 다정하게 내 어깨를 쥐고 그대로 남는다. 나는 지도를 본다. 이 원정은 한 철을 기다릴 수 있다. 강은 움직이지 않았다.\n\n벗이 간다. 나는 앞에 놓인 나무 원정 말들을, 함 냄새가 나는 그것들을 두고 앉아, 하나를 움직였다가 제자리로 되돌린다."
 latria_sexual_frustration_flavor.1130.a: "나머지도 말하고, 아무것도 청하지 않는다."
 latria_sexual_frustration_flavor.1130.b: "더는 말하지 않고 말들을 반듯하게 놓는다."
 latria_sexual_frustration_flavor.1130.c: "대신 원정을 저울질하여 제대로 헤아린다."

 latria_sexual_frustration_flavor.1131.t: "남는 온기"
 latria_sexual_frustration_flavor.1131.desc: "꿈이 나를 따뜻하게 남기고, 나는 잠옷이 허리까지 뭉친 채 깬다. 원인은 내 손이었다. 나는 가만히 누워 방이 돌아오게 둔다. 차가운 바닥, 꺼져 가는 등잔. 그러나 열기는 꿈과 함께 가지 않는다.\n\n그것은 집사의 자식이었거나, 그 입을 가진 누군가였다. 그 사람은 내 손목을 침대에 눌러 붙들고 서두르지 않았으며, 나는 그 무게를, 우리 둘을 받아 내던 매트리스의 방식을 정확히 기억한다. 깨어 있는 그 사람이 나를 그렇게 보는 것을 나는 한 번도 보지 못했다.\n\n나는 잠옷을 허리 아래로 끌어내린다. 천은 내가 누워 있던 자리에서 축축하다. 벽 쪽으로 얼굴을 돌리면 온기는 담요 밑에, 참을성 있게, 내가 그것에 항복하기를 기다리며 남는다."
 latria_sexual_frustration_flavor.1131.a: "손을 다시 가려는 곳으로 보낸다."
 latria_sexual_frustration_flavor.1131.b: "잠옷을 펴고 날이 밝기를 기다린다."
 latria_sexual_frustration_flavor.1131.c: "저녁의 농담을 생각하며 숨을 늦춘다."

 latria_sexual_frustration_flavor.1132.t: "세 번째 촛불"
 latria_sexual_frustration_flavor.1132.desc: "무릎이 시큰해질 때까지 꿇어 있지만, 그 시큰함으로는 머리가 맑아지지 않는다. 세 번째 촛불이 지나자 신전은 비었다. 눈 뒤 어둠 속에서 같은 몸이 자꾸 돌아오고, 그것은 신의 몸이 아니다.\n\n몇 주 전, 길가에서 내 어깨에 담요를 덮어 주던 순례자의 손. 목에 스친 손가락 마디. 나는 그 그림을 백 번쯤 기도로 몰아냈고, 그것은 밤마다 더 또렷하게 돌아온다. 깃이 열리는 자리에 닿았던 낯선 이의 손바닥의 온기.\n\n나는 이마를 모은 손에 댄다. 돌은 차갑다. 내 숨은 차갑지 않다. 마지막 촛불이 짧아지는 동안 나는 꿇어 있고, 용서를 청하지 않고, 일어서기 전에 허벅지의 떨림이 멎기를 청한다."
 latria_sexual_frustration_flavor.1132.a: "그 생각의 이름을 대고, 그것이 타 지나가게 둔다."
 latria_sexual_frustration_flavor.1132.b: "일어나 몸이 소진될 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1132.c: "그 손의 온기를 위안으로 붙든다."

 latria_sexual_frustration_flavor.1133.t: "바위 턱 밑"
 latria_sexual_frustration_flavor.1133.desc: "다시 비가 오고 사냥은 흩어졌다. 나는 사냥개지기와 함께 바위 턱 밑에 몸을 피하고, 우리 둘 다 흠뻑 젖었으며, 추위는 우리가 닿는 모든 자리를 작은 불로 만든다. 그 사람의 팔이 어깨부터 손목까지 내 팔에 닿아 있고, 나는 모른 척하기를 그만두었다.\n\n그 사람이 폭풍우 이야기를 하고, 나도 폭풍우를 이야기한다. 그 사람의 손이 젖은 돌 위에서 나를 붙들려고 내 허리께를 찾아 그대로 남고, 젖은 모직을 통해 따뜻하게 번지며, 내 숨은 추위로 핑계 댈 수 없는 방식으로 얕아진다.\n\n비는 가늘어지지 않는다. 그 사람의 엄지가 내 등뼈에 한 번 움직인다. 나는 물의 잿빛 장막에 눈을 두고 물러서지 않으며, 이 턱은 이것 외에 무엇도 허락할 만큼 넓지 않다."
 latria_sexual_frustration_flavor.1133.a: "조금 더 비 속에 머문다."
 latria_sexual_frustration_flavor.1133.b: "몸을 옮겨 물이 떨어지는 것을 본다."
 latria_sexual_frustration_flavor.1133.c: "폭풍우가 지나기를 기다렸다가 혼자 돌아간다."

 latria_sexual_frustration_flavor.1134.t: "끌러 낸 적 없는 끈"
 latria_sexual_frustration_flavor.1134.desc: "의논이 끝나 서재는 내 것이 되었다. 나는 원하지 않는 술을 따르고, 기억은 청하지 않았는데도 온다. 조약 연회에서 사절의 입술, 서기들이 국경을 논하는 동안 그 사람이 엄지에 남은 한 방울을 핥던 방식.\n\n나는 잔을 내려놓는다. 손이 목의 끈으로 가서 멈춘다. 기억 속에서 그 사람의 손가락은 빠르고 확실하고, 나는 거절하지 않는다. 미끄러지지 않으려고 상에 몸을 기울이고, 그 사람 뒤로 홀 전체가 촛불 연기의 흐림이다.\n\n촛불이 흔들린다. 나는 끌러 낸 적 없는 끈을 다시 매듭짓는다. 술은 손대지 않은 채 놓여 있고 방은 매우 조용하며, 내 맥박은 열지 않은 문을 두드리는 누군가처럼 귀에 크게 울린다."
 latria_sexual_frustration_flavor.1134.a: "누구의 입술을 생각하는지 분명히 인정한다."
 latria_sexual_frustration_flavor.1134.b: "촛불을 끄고 혼자 잠자리에 든다."
 latria_sexual_frustration_flavor.1134.c: "체스판을 벌여 마음을 모은다."

 latria_sexual_frustration_flavor.1135.t: "느린 박"
 latria_sexual_frustration_flavor.1135.desc: "악사들이 느린 곡을 들고, 내가 거절하기도 전에 손 하나가 내 손을 쥔다. 우리는 상좌 곁에서 함께 돌고, 가깝게, 동작이 요구하는 것보다 더 가깝게. 나를 쥔 이에게서 술과 장작 연기, 그리고 그 밑에 더 따뜻한 것이 난다.\n\n돌아설 때 허벅지 하나가 내 허벅지 사이로 미끄러져 반 박자를 더 머문다. 나는 홀을 위해 얼굴을 정돈한다. 음악 밑에서 내 숨소리가 들리고, 그 사람도 그것을 들음을 나는 안다. 그 사람의 입이 휘어지되 열리지 않기 때문이다.\n\n곡이 끝난다. 우리는 곧바로 떨어지지 않는다. 엄지 하나가 내 손바닥의 솔기를, 느리고 의도적으로 더듬는다. 말 없는 물음이다. 악사들이 다시 시작하고 나는 답하지 않았으며, 내 손은 아직 그 사람의 손안에 있다."
 latria_sexual_frustration_flavor.1135.a: "곡을 따라 다음 박을 춤춘다."
 latria_sexual_frustration_flavor.1135.b: "손을 거두어 사람들 사이로 든다."
 latria_sexual_frustration_flavor.1135.c: "그 온기 속에 머물러 곡을 끝까지 듣는다."
