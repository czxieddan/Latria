l_korean:
 latria_sexual_frustration_flavor.1311.t: "집안이 깨기 전"
 latria_sexual_frustration_flavor.1311.desc: "집안이 깨기 전에 잠이 깬다. 잠옷은 허벅지를 지나 뭉쳐 있고, 내 손은 이미 그 사이에 눌려 있다. 나는 손을 거두지 않는다. 꿈은 아직 내게 있고, 이 방에 없던 누군가의 무게, 내 몸은 그 꿈이 시작한 것을 끝낼 작정이다.\n\n나는 눈을 감고 그것이 이어지게 두며, 숨이 짧아지고, 손바닥 뒤꿈치가 이제는 익힌 느린 박자를 지킨다. 내 이빨 뒤에 이름 하나가 있다. 하인의 발밑에서 복도 널이 삐걱이는 동안에는 말하지 않는다.\n\n그것이 터지면 나는 손가락이 젖은 채, 엉덩이 밑 이불이 축축한 채 가만히 누워 있다. 발소리는 문을 지나 멀어진다. 나는 잠옷을 끌어내리고, 천이 달라붙는다."
 latria_sexual_frustration_flavor.1311.a: "끝맺게 둔 뒤, 그날의 옷을 입는다."
 latria_sexual_frustration_flavor.1311.b: "손을 거두어 종이 울릴 때까지 가만히 누운다."
 latria_sexual_frustration_flavor.1311.c: "일어나 씻고, 그 시큰함과 한동안 앉아 있는다."

 latria_sexual_frustration_flavor.1312.t: "배나무의 접가지"
 latria_sexual_frustration_flavor.1312.desc: "정원은 밤새 온 비로 아직 젖어 있고, 한 주 내내 피해 온 그 사람이 배나무의 새 접가지를 보여 준다. 그 사람의 손가락이 내 손을 덮어 절단면을 따라 옮긴다. 시범이 끝난 뒤에도 어느 쪽도 놓지 않는다.\n\n그 사람의 엄지가 내 손목에 대고 뛰는 것이 만져진다. 울타리 뒤에서 내 집안 사람 둘이 안장을 두고 다툰다. 내가 조금 고개를 돌리고 그 사람이 그 사람의 고개를 돌리면, 우리는 아무도 원예로 착각할 수 없는 일을 하게 된다.\n\n그 사람은 가을까지 접가지가 붙을 것이라고 말한다. 그 사람의 손은 여전히 내 손 위에 있다. 가지에서 물이 내 소매로 떨어지고, 나는 그것을 닦지 않는다."
 latria_sexual_frustration_flavor.1312.a: "이 나무 아래에서 내가 원하는 것을 분명히 말한다."
 latria_sexual_frustration_flavor.1312.b: "가르침에 감사하고 물러선다."
 latria_sexual_frustration_flavor.1312.c: "남아서 대신 그 사람에게 참말 하나를 한다."

 latria_sexual_frustration_flavor.1313.t: "상 너머"
 latria_sexual_frustration_flavor.1313.desc: "잔이 두 번 돌고, 홀은 누구도 한 사람에게 귀 기울이지 않을 만큼 시끄럽다. 나는 한 시간째 상 너머 같은 손님을, 그 사람이 웃을 때의 목선을 보고 있다.\n\n나는 말할 수 있다. 전부는 아니고, 내가 날씨 이야기를 하고 있지 않음을 알 만큼만. 내 이웃이 들을 것이다. 상 끝의 집사도, 들은 것을 모두 집안에 되풀이하는 그 사람도.\n\n그 사람이 잔의 자루를 돌려 잡고 그 너머로 나를 본다. 나는 입을 연다. 악사들이 다시 시작하고, 내가 했을 말은 북 아래로 들어간다."
 latria_sexual_frustration_flavor.1313.a: "들릴 만큼 크게 말한다."
 latria_sexual_frustration_flavor.1313.b: "혀를 누르고 술이 제 일을 하게 둔다."
 latria_sexual_frustration_flavor.1313.c: "이웃에게 몸을 돌려 놀이로 만든다."

 latria_sexual_frustration_flavor.1314.t: "첫 마디"
 latria_sexual_frustration_flavor.1314.desc: "돌바닥의 무늬가 정강이에 찍힐 만큼 오래 찬 돌 위에 꿇었고, 말은 말을 그만두었다. 내 마음은 이 건물 안에서 기억할 까닭이 없는 입술로 자꾸 돌아간다. 그것이 벌어지던 방식, 거기서 나온 소리.\n\n내 안내자는 세상에 있는 모든 고해를 들어 본 사람의 인내로 강대에서 기다린다. 나는 말할 수 있다. 말하는 것은 다시 닫을 수 없는 문이 될 것이고, 내 몸은 그 문이 오늘 밤 등잔을 켠 채 열려 있기를 원한다.\n\n나는 첫 마디까지 간다. 우리 사이 촛불이 바람에 기울고, 밀랍이 쇠를 타고 흘러내려 거기서 굳는 것을 본다."
 latria_sexual_frustration_flavor.1314.a: "말하고, 신전이 나를 심판하게 둔다."
 latria_sexual_frustration_flavor.1314.b: "고해를 품고 속죄를 받는다."
 latria_sexual_frustration_flavor.1314.c: "책을 청해 떨림이 멎을 때까지 읽는다."
 latria_sexual_frustration_flavor.1314.d: "아침까지 철야를 지킨다."

 latria_sexual_frustration_flavor.1315.t: "오리나무 덤불"
 latria_sexual_frustration_flavor.1315.desc: "사냥은 흩어졌고, 나는 없었던 멧돼지를 쫓았다. 단둘이 있고 싶었던 그 사람이, 바지를 열고 손을 제 몸에 얹은 나를 오리나무 덤불에서 찾아내고, 시선을 돌리지 않는다.\n\n그 사람이 젖은 잎 위에 무릎을 꿇는다. 나는 한 손을 그 사람의 머리에, 다른 손을 줄기에 받치고 있고, 뿔피리가 동쪽 어딘가에서 울리며, 우리가 그러지 말아야 할 만큼 가깝다. 어느 쪽도 멈추지 않는다. 그 사람이 나를 입에 물고, 나는 조용히 있으려고 뺨 안쪽을 깨문다.\n\n뒤에 내 무릎은 더럽고 허벅지에 잎 하나가 붙어 있다. 그 사람이 손목 뒤로 입을 닦고, 멧돼지는 북쪽으로 갔다고 말한다."
 latria_sexual_frustration_flavor.1315.a: "사냥이 나를 빼고 이어지게 둔다."
 latria_sexual_frustration_flavor.1315.b: "다시 안장에 올라 내 자리를 벌 만하게 채운다."
 latria_sexual_frustration_flavor.1315.c: "땅을 읽고 자국을 따라간다."

 latria_sexual_frustration_flavor.1316.t: "비뚤어진 인장"
 latria_sexual_frustration_flavor.1316.desc: "의논은 한 시간째 같은 청원서에 붙들려 있고 나는 아무것도 서명하지 않았다. 상 밑에서 내 손은 무릎 위에 있고, 나는 그 원정의 마지막 밤, 천막, 노크 없이 들어와 교대가 될 때까지 나가지 않은 그 사람을 생각한다.\n\n재상이 동의하는지 묻는다. 나는 그렇다고 하고, 무엇에 동의했는지 전혀 모른다. 인장은 내 반지의 열로 따뜻하다. 밀랍에 누르자 자국이 비뚤어져 나오고, 한쪽 가장자리에서 글자가 겹친다.\n\n그들이 서류를 들고 줄지어 나간다. 나는 비뚤어진 인장을 앞에 두고 의자에 남아 있고, 방에는 아직 남의 촛불 냄새가 있다."
 latria_sexual_frustration_flavor.1316.a: "내가 생각하는 그 사람을, 인장째로 부른다."
 latria_sexual_frustration_flavor.1316.b: "인장을 내려놓고 청원서로 돌아간다."
 latria_sexual_frustration_flavor.1316.c: "의논의 자리를 다시 불러 일을 끝낸다."

 latria_sexual_frustration_flavor.1317.t: "여백의 한 행"
 latria_sexual_frustration_flavor.1317.desc: "시험장은 쓸려서 조용하고, 나는 주석서와 단둘이 있다. 글자가 가만있지 않는다. 나는 절제에 관한 같은 행을 네 번 읽었고, 매번 그것은 등불이 다가오는 복도에서 너무 늦게 놓아 버린 두 손에 관한 것이었다.\n\n내 손으로, 여백에, 나는 주석이 전혀 아닌 시 한 행을 썼다. 시험관이 그것을 보면 무엇을 위한 것이고 누구를 위한 것인지 알 것이다. 나는 그 면을 태울 수 있다. 화로는 세 걸음, 숯은 아직 붉다.\n\n나는 그 행을 더 조심스럽게 다시 옮겨 적고, 마지막 획에서 붓이 떨린다."
 latria_sexual_frustration_flavor.1317.a: "그 시를 옮겨 적어 읽히게 둔다."
 latria_sexual_frustration_flavor.1317.b: "책을 덮고 매트 위에서 잠든다."
 latria_sexual_frustration_flavor.1317.c: "주석서로 돌아가 처음부터 다시 시작한다."
 latria_sexual_frustration_flavor.1317.d: "그 시를 궁인들이 부르는 곡조에 얹는다."

 latria_sexual_frustration_flavor.1318.t: "안뜰의 두 잔"
 latria_sexual_frustration_flavor.1318.desc: "연회는 안뜰로 빠져나갔고, 가장 오래된 벗이 잔 둘을 들고 나를 따라 나왔다. 나는 아무에게도 말하지 않았다. 사제에게도, 하인에게도, 그 당사자에게도. 오늘 밤 술은 말하지 않음을 무겁게 만들었다. 잔이 가득한 만큼 무겁게.\n\n나는 그것을 그 사람의 손에 놓고 얼마간 지니게 할 수 있다. 그 사람은 웃지 않을 것이다. 또한 잊지도 않을 것이고, 홀에서 나를 볼 때마다 이것이, 이름이 붙은 것이 우리 사이에 있을 것이다.\n\n그 사람이 잔을 건네고 기다리고, 그 뒤에서 분수가 계속 흐른다. 나는 그것을 마시고, 얼음이 갈라지며 가라앉는다."
 latria_sexual_frustration_flavor.1318.a: "소리 내어 말하고, 그 사람이 지니게 둔다."
 latria_sexual_frustration_flavor.1318.b: "오늘 밤만이라도 정말로 끊겠다고 맹세한다."
 latria_sexual_frustration_flavor.1318.c: "안뜰이 빌 때까지 그 사람에게 읽어 준다."

 latria_sexual_frustration_flavor.1319.t: "정원 담"
 latria_sexual_frustration_flavor.1319.desc: "그 사람은 정원 담을 등지고, 치마가 허리 위로 밀려 올라간 채 서 있고, 내 손은 그 사람의 다리 사이에, 길을 걷는 누구나 볼 수 있는 곳에 있다. 그 사람은 이미 젖었다. 복도에서부터 그랬다.\n\n나는 손가락 두 개를 그 사람에게 넣고, 그 사람이 내 손목을 잡아 더 세게 그 자리에 붙들고, 이마를 내 어깨에 댄다. 그 사람의 숨이 거칠어진다. 담 너머에서는 정원사가 아직 일하고, 삽날이 돌에 부딪혀 울린다.\n\n그 사람이 떨고 손톱이 내 팔을 파고든다. 설 수 있게 되자 그 사람은 치마를 매만져 내리고, 이미 답을 정한 물음처럼 내 이름을 한 번, 조용히 부른다."
 latria_sexual_frustration_flavor.1319.a: "그 사람이 걸을 수 있게 될 때까지 곁에 있는다."
 latria_sexual_frustration_flavor.1319.b: "손을 거두어 좋은 저녁을 빈다."
 latria_sexual_frustration_flavor.1319.c: "혼자 담을 도는 먼 길을 걷는다."

 latria_sexual_frustration_flavor.1320.t: "목록"
 latria_sexual_frustration_flavor.1320.desc: "나는 그것을 털어 버리려 신전에 왔고, 대신 무릎을 꿇고 그것을 목록으로 만든다. 어떤 목의 냄새, 어떤 사람이 내는 소리, 문간에서 문틀에 손바닥을 평평하게 댄 채 내게 닿았던 몸의 정확한 무게.\n\n내 안내자는 깨어 읽고 있다. 나는 속죄를 청할 수 있고 그 사람은 내게 줄 것이며, 나는 그것을 할 것이고, 사흘째 밤에는 더 길어진 같은 목록을 들고 이 돌 위로 돌아올 것이다.\n\n대신 나는 책을 청한다. 그 사람은 엄지로 제 자리를 표시하고 말없이 한 권을 주고, 나는 그것을 펼쳐 든 채 한 행도 읽지 않는다."
 latria_sexual_frustration_flavor.1320.a: "그 모두의 이름을 대고, 신전이 답하게 둔다."
 latria_sexual_frustration_flavor.1320.b: "속죄를 청하고 내 목록을 지킨다."
 latria_sexual_frustration_flavor.1320.c: "그 사람이 말해 줄 용의가 있는 것을 듣는다."

 latria_sexual_frustration_flavor.1321.t: "길 위의 삼 주"
 latria_sexual_frustration_flavor.1321.desc: "우리는 삼 주를 길 위에서 보냈고, 지난 읍 뒤로 나는 누구와도 단둘이 있지 않았다. 말의 안장은 풀렸고 불은 낮고, 나머지는 팔 하나 거리로 망토를 덮고 잠들어, 그중 하나가 이를 가는 소리가 들릴 만큼 가깝다.\n\n나는 셔츠 안으로 손을 넣고 제 손가락 마디를 깨문 채, 말들이 움직이는 소리와 잎을 밟는 보초의 부츠 소리를 들으며 누워 있다. 오래 걸리고, 끝난 뒤 나는 만족하지 않고 다만 피곤하며, 욕망은 그 피곤 밑에 그대로 있다.\n\n보초가 불 곁을 지나 돌아오고 나를 보지 않는다. 나는 망토를 끌어 올리고 숯이 잿빛이 되는 것을 본다."
 latria_sexual_frustration_flavor.1321.a: "밤이 허락하는 것을 취하고 잠든다."
 latria_sexual_frustration_flavor.1321.b: "일어나 내 차례의 보초를 선다."
 latria_sexual_frustration_flavor.1321.c: "팔이 떨릴 때까지 혼자 훈련한다."

 latria_sexual_frustration_flavor.1322.t: "사절의 잔"
 latria_sexual_frustration_flavor.1322.desc: "사절단의 상은 열둘을 위해 차려졌고, 나는 그 사람의 사절 곁에 앉았다. 그 사람들 민족에게는 환대에 관한 관습이 있어, 나는 인사 이후로 생선 요리를 지나 두 번째 따름까지 그것을 생각해 왔다.\n\n그 사람은 제 손으로 내 잔을 채우고, 그 사람의 집사는 그것을 달가워하지 않는다. 내가 여기서 잘못을 말하면 다음 배의 전서에, 내 이름으로, 내 것이 아닌 필체로 실릴 것이다. 옳은 말을 해도 또한 전서에 실려, 내가 결코 들지 못할 방에서 소리 내어 읽힐 것이다.\n\n그 사람이 우리 혼인 관습에 관해 묻고, 나는 서툴게 답한다. 촛불은 받침까지 닳았고, 어느 쪽도 새것을 청하지 않았다."
 latria_sexual_frustration_flavor.1322.a: "그 사람들의 관습이 허락하는 방식으로 답한다."
 latria_sexual_frustration_flavor.1322.b: "좋은 밤을 빌고 간다."
 latria_sexual_frustration_flavor.1322.c: "이야기를 조약으로 돌려 거기 붙들어 둔다."

 latria_sexual_frustration_flavor.1323.t: "회랑의 성가대"
 latria_sexual_frustration_flavor.1323.desc: "성가대가 회랑에서 연습하고, 나는 화음을 들어야 하고, 그것을 이끄는 사제의 입술, 세 번째 줄을 빚어 내는 방식을 보면 안 된다.\n\n나는 일찍 와서 늦게 가는 버릇이 생겼다. 그 성가는 기도가 하지 못하는 일을 내 가슴의 조임에 하고, 나는 그것이 무엇을 대신하는지 안다. 내 안내자는 내가 지키는 시각을 알아차리고 아무 말도 하지 않았는데, 그것은 꾸지람보다 더한 일, 그 사람이 기다리고 있다는 뜻이기 때문이다.\n\n마지막 음이 아치 위에서 죽는다. 나는 손을 무릎에 평평하게 얹은 채, 성물지기가 열쇠를 들고 올 때까지 신도석에 머문다."
 latria_sexual_frustration_flavor.1323.a: "그들과 함께 노래하고, 소리가 그것을 실어 가게 둔다."
 latria_sexual_frustration_flavor.1323.b: "규율을 지켜 마지막 절 전에 나간다."
 latria_sexual_frustration_flavor.1323.c: "대신 안내자와 함께 그 곡을 공부한다."

 latria_sexual_frustration_flavor.1324.t: "아침 종"
 latria_sexual_frustration_flavor.1324.desc: "이불에 얽혀, 그 모든 것이 아직 내게 남은 채 깬다. 잠옷은 겨드랑이 아래로 말려 올라가고, 채 깨기도 전에 손이 다리 사이에 있다. 꿈이 달아나고 나는 그것을 쫓고, 엉덩이가 들리고, 옆방에 누가 있는지 종이 몇 시인지 개의치 않는다.\n\n그것은 허벅지를 떨게 남기는 급류로 온다. 나는 손가락이 아직 제 안에 든 채, 고요 속에서 숨을 크게 쉬며 누워 있고, 아래 이불은 흠뻑 젖어, 공기가 닿는 자리에서는 이미 차갑다.\n\n아침 예배의 종이 시작된다. 나는 젖은 이불을 걷어내어 대야에 넣고, 물이 흐려진다."
 latria_sexual_frustration_flavor.1324.a: "끝맺고 씻고, 종에 응답한다."
 latria_sexual_frustration_flavor.1324.b: "이불을 잡아채고 씻지 않고 간다."
 latria_sexual_frustration_flavor.1324.c: "손이 흔들리지 않을 때까지 서판 앞에 앉아 있는다."

 latria_sexual_frustration_flavor.1325.t: "문"
 latria_sexual_frustration_flavor.1325.desc: "구석에서 놀이가 진행 중이고, 나는 문을 자꾸 보느라 세 판을 잃었다. 내가 기다리는 사람은 늦고, 이 홀의 모두가 내가 누구인지, 누구와 혼인했는지, 그들 중 누가 나를 보고 있는지 안다.\n\n나는 벤치에 올라서서 말할 수 있다. 방은 방들이 그러하듯 조용해지고, 아침까지 내 이름이 붙고 그 뒤에 내 집안의 이름이 이어진 채 해안까지의 모든 홀에 퍼질 것이며, 두 이름은 다시 갈라지지 않을 것이다.\n\n문이 열린다. 술을 더 가져온 하인이다. 나는 잔을 내밀고, 손은 흔들리지 않으며, 그것이 더하다."
 latria_sexual_frustration_flavor.1325.a: "일어서서 홀 전체에 말한다."
 latria_sexual_frustration_flavor.1325.b: "앉은 채로 놀이가 이어지게 둔다."
 latria_sexual_frustration_flavor.1325.c: "대신 벗을 찾아 그 사람과 앉는다."

 latria_sexual_frustration_flavor.1326.t: "장부"
 latria_sexual_frustration_flavor.1326.desc: "집사는 장부와 지도와 내 의무의 목록을 펼쳐 놓았고, 나는 어느 것도 읽지 않았다. 나는 봄에 지나친 읍의 한 문, 그 어둠 뒤에서 누군가 걸쇠가 들리기 전에 두 번 내 이름을 부르던 방식을 생각한다.\n\n할 일은 많고 그것을 해야 하는 사람은 나다. 나는 펜을 담가 첫 숫자를 쓰고, 그것이 틀려, 어찌나 세게 그어 지웠는지 촉이 갈라지고 잉크가 그 열을 가로질러 번진다.\n\n나는 펜을 다듬어 다시 시작한다. 창밖에서 수비대가 훈련하고, 고함이 박자를 맞춘다."
 latria_sexual_frustration_flavor.1326.a: "장부를 두고 그 읍으로 사람을 보낸다."
 latria_sexual_frustration_flavor.1326.b: "펜을 내려놓고 원장을 집어 든다."
 latria_sexual_frustration_flavor.1326.c: "촛불이 흔들려 꺼질 때까지 목록을 처리한다."

 latria_sexual_frustration_flavor.1327.t: "마루"
 latria_sexual_frustration_flavor.1327.desc: "우리는 동틀 때부터 타고, 풀이 사방으로 비어, 나무도 기수도, 하늘 끝까지 아무것도 없다. 내 몸은 안장에 오른 이틀째부터 불평했고, 타는 일 자체는 그것을 가라앉히는 데 아무것도 하지 못했으며, 다만 더 악화시켰다.\n\n나는 마루에서 말을 세우고, 손을 바지 안으로 넣어, 얼굴에 바람을 맞고 시야 안에 아무도 없는 채 몇 번의 거친 손길로 끝맺는다. 그 내내 말은 내 밑에서 자리를 옮긴다.\n\n나는 끈을 매듭짓고 그들에게 내려간다. 사촌이 왜 웃느냐 묻고, 나는 이 말이 좋은 말이라고 대답한다."
 latria_sexual_frustration_flavor.1327.a: "초원이 내게 주는 이 순간을 취한다."
 latria_sexual_frustration_flavor.1327.b: "계속 타며 그것을 마음에서 몰아낸다."
 latria_sexual_frustration_flavor.1327.c: "팔이 지칠 때까지 매를 날린다."

 latria_sexual_frustration_flavor.1328.t: "철야"
 latria_sexual_frustration_flavor.1328.desc: "나는 예배 뒤로 신전에 있고, 아직 여기 있다. 등잔은 두 번 채워졌고 기름에서는 값싼 짜개 냄새가 난다. 내 무릎은 아픔에서 어떤 무감각으로 옮겨 갔고, 욕망은 어디로도 가지 않았다. 자리를 잡고 편하게 앉았다.\n\n철야는 사람을 비우기 위한 것이다. 그것은 대신 욕망에 자리를 주었고, 어두운 방이 그 안에 선 무엇이든에 형태를 주는 것처럼. 나는 갈 수 있다. 문은 잠기지 않았고 읍은 멀지 않다.\n\n나는 시편을 처음부터 다시 시작한다. 내 목소리가 흔들림 없이 나오고, 나는 그것이 조금 미워진다."
 latria_sexual_frustration_flavor.1328.a: "철야를 깨고 읍으로 나간다."
 latria_sexual_frustration_flavor.1328.b: "하늘이 잿빛이 될 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1328.c: "시편집을 끝까지 읽는다."

 latria_sexual_frustration_flavor.1329.t: "네 줄"
 latria_sexual_frustration_flavor.1329.desc: "나는 잠옷 차림으로 창가에 있고, 창턱에는 내가 쓰고 보내지 않은 편지가 있다. 네 줄. 마지막 줄은 내가 대낮에는 쓰지 않을 말로 내가 원하는 것을 말하고, 잉크는 말랐고, 봉인은 뜯기지 않았다.\n\n나는 문의 하인에게 그것을 줄 수 있다. 태울 수도 있고, 이미 셋을 태웠으며, 그 재는 아직 화로에 있다. 내 몸은 태우는 데 관심이 없다. 그것은 건넨 뒤에 오는 답을 원한다.\n\n촛불은 짧게 닳았고 밀랍이 테를 넘어 흘렀다. 나는 마지막 줄을 다시 읽고, 종이가 내 손에서 떨린다."
 latria_sexual_frustration_flavor.1329.a: "그 편지를 하인에게 준다."
 latria_sexual_frustration_flavor.1329.b: "그것을 화로에 넣고 잠자리에 든다."
 latria_sexual_frustration_flavor.1329.c: "그 짧은 촛불이 꺼질 때까지 창가에 앉는다."

 latria_sexual_frustration_flavor.1330.t: "국경 조항"
 latria_sexual_frustration_flavor.1330.desc: "내 스승의 서재에서는 먼지와 식은 잉크 냄새가 나고, 나는 조약의 한 마디도 받아들이지 않았다. 그 사람은 국경에 관한 조항을 설명하고, 나는 그 사람의 손, 손가락 옆에 묻은 잉크, 종이를 눌러 두는 방식을 본다.\n\n그 사람은 내 부모뻘이 되고 두 배로 조심스러우며, 아무 일도 없고, 있을 필요도 없다. 욕망은 허락을 묻지 않는다. 그 사람이 면을 넘기고 손톱으로 다음 조항을 찾는 동안, 그것은 내 안에 앉아 있다.\n\n그 사람이 이해했는지 묻고, 나는 그렇다고 한다. 그 사람은 물음이 필요로 하는 것보다 조금 더 오래 나를 보고, 그다음 면으로 돌아간다."
 latria_sexual_frustration_flavor.1330.a: "대신 국경에 관한 시 한 행을 쓴다."
 latria_sexual_frustration_flavor.1330.b: "그 사람에게 고해를 들어 달라 청한다."
 latria_sexual_frustration_flavor.1330.c: "그 조항을 한 마디도 빠짐없이 그대로 되짚어 말한다."

 latria_sexual_frustration_flavor.1331.t: "느린 시각"
 latria_sexual_frustration_flavor.1331.desc: "집은 잠들었고 나는 한 시간째 잠들지 못했다. 잠옷은 허리를 지나 올라가고, 내 손가락은 내가 정하기도 전에 내 젖음을 찾아냈다. 나는 거기 두고, 복도에서부터 맴돌던 생각을 온다. 내 깃을 바로잡으려 몸을 기울였다가 그 뒤로 물러서지 않은 그 사람.\n\n내 몸이 가르쳐 준 대로, 느리게, 그다음 느리지 않게 누르고 돌린다. 다른 손은 침상 머리판에 평평하게 얹어 그것이 벽에 부딪히지 않게 한다. 아래에는 하인들의 문과 불평하는 계단이 있다. 나는 멈추지 않는다. 숨이 거칠어지고, 소리를 삼키려고 베개에 얼굴을 묻는다.\n\n그것이 터지고, 나는 손가락을 아직 제 몸에 댄 채, 그 밑에서 맥박이 계속 뛰는 채로 누워 있다. 계단이 한 번 더 불평하고 가라앉는다. 나는 잠옷을 끌어내리고, 천은 축축하게 달라붙는다."
 latria_sexual_frustration_flavor.1331.a: "끝맺게 둔 뒤 종 전에 옷을 입는다."
 latria_sexual_frustration_flavor.1331.b: "손을 거두어 가만히 누운다."
 latria_sexual_frustration_flavor.1331.c: "씻고, 그 시큰함이 무뎌질 때까지 앉아 있는다."

 latria_sexual_frustration_flavor.1332.t: "찬 신랑"
 latria_sexual_frustration_flavor.1332.desc: "나는 스스로를 비우려 신전에 왔고, 욕망이 다만 더 깊이 가라앉을 때까지 찬 돌 위에 꿇었다. 이제 그것에는 얼굴이 있다. 연회에서 내가 고해한 그 사람, 고개를 기울이고 듣던 방식, 잔 위에서 엄지를 움직이던 방식. 내 손은 법의 밑에 있고, 곁 통로의 어둠 속에서 아무도 그것을 볼 수 없다.\n\n나는 제단 등불에 눈을 두고, 턱을 조인 채 손가락이 느리게 일하게 둔다. 병풍 뒤 어딘가에서 문이 열리고 복사들이 밤 예배에 들어와 돌바닥을 밟는다. 나는 멈춰야 한다. 내 손은 멈추지 않는다. 나는 이마를 모은 손에 대고 이빨 사이로 숨을 쉰다.\n\n그것이 지나가고 나를 비우고 떨게 남긴다. 복사들이 시편을 시작한다. 나는 다리가 저려지고 등불만이 볼 수 있는 유일한 것이 될 때까지 꿇어 있는다."
 latria_sexual_frustration_flavor.1332.a: "고해소에서 그 이름을 대고 속죄를 받는다."
 latria_sexual_frustration_flavor.1332.b: "하늘이 잿빛이 될 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1332.c: "시편집을 끝까지 읽는다."

 latria_sexual_frustration_flavor.1333.t: "푸른 오목한 땅"
 latria_sexual_frustration_flavor.1333.desc: "나는 원하던 그 사람을 사냥에서 떼어, 잎을 통해 빛이 푸르게 드는 오목한 땅으로 데려왔다. 내 바지는 열려 있고 그 사람의 손이 내게, 내 손은 그 사람의 치마 밑에, 어느 쪽도 이것이 사슴에 관한 것이라 가장하지 않는다. 그 사람은 이미 젖었다. 여울에서 손목을 붙들 때부터.\n\n나는 손가락을 그 사람에게 넣고, 그 사람이 숨을 삼키며 제 입으로 내 입을 세게 덮고, 남은 손을 내 깃에 주먹으로 쥔다. 나무 사이로 뿔피리가 울리고, 사냥이 근처 어딘가에서 방향을 튼다. 우리는 멈추지 않는다. 그 사람이 내 손에 몸을 대고, 그 사람의 숨이 짧게 끊어져 내 뺨에 닿는다.\n\n그 사람이 떨고, 내 손목을 쥐며 가만히 멈춘다. 뿔피리가 동쪽으로 옅어진다. 그 사람이 떨리는 손으로 치마를 펴고, 머리에서 잎 하나가 떨어진다."
 latria_sexual_frustration_flavor.1333.a: "사냥이 우리를 빼고 이어지게 둔다."
 latria_sexual_frustration_flavor.1333.b: "다시 안장에 올라 내 자리를 벌 만하게 채운다."
 latria_sexual_frustration_flavor.1333.c: "먼 길로 돌아가며 나를 식힌다."

 latria_sexual_frustration_flavor.1334.t: "조약의 여백"
 latria_sexual_frustration_flavor.1334.desc: "서재는 춥고 조약은 펼쳐져, 나는 같은 조항을 세 번 읽었다. 그것을 가져온 사절은 떠났고 기억은 남았다. 내가 그 사람을 벽에 붙들고 손을 그 사람의 옷 안으로 넣고, 그 사람의 입이 내 어깨에 벌어져, 우리 둘 다 발소리에 귀를 기울이던 복도의 그 시각.\n\n내 손은 상 밑에서 무릎으로 흘러갔다. 나는 억지로 그것을 거두어 면에 평평하게 누른다. 손바닥 밑에서 잉크가 말랐다. 내가 생각을 여백에 적으면 서기가 깨끗하게 옮겨 적어 아침까지 돌려 읽힐 것이다.\n\n나는 펜을 담가 그 조항을 제대로 다시 쓰고, 마지막 낱말에 이르러 손이 흔들린다. 촛불이 흔들리고 나는 심지를 다듬는다."
 latria_sexual_frustration_flavor.1334.a: "내가 그 사람에게 원하는 것을 분명히 말한다."
 latria_sexual_frustration_flavor.1334.b: "안녕을 빌고 물러선다."
 latria_sexual_frustration_flavor.1334.c: "판을 벌려 손이 가만해질 때까지 둔다."

 latria_sexual_frustration_flavor.1335.t: "직조물 뒤"
 latria_sexual_frustration_flavor.1335.desc: "연회는 시끄럽고 악사들은 곡 사이에, 나는 밤새 보아 온 그 사람을 빛이 닿지 않는 직조물 뒤로 데려왔다. 내 손은 그 사람의 가운 밑으로 올라가고, 그 사람은 벽을 등지고, 조용히 있으려 제 입술을 깨물고 있다. 내 다른 손은 그 사람의 입 위에, 세게는 아니고, 충분할 만큼.\n\n천 너머 홀은 세 발, 바로 거기다. 잔이 깨지고 누군가 웃는다. 그 사람이 내 손가락에 몸을 대고 눈을 감고, 나는 전율이 그 사람을 지나가는 것을 느끼고, 그 사람의 숨이 뜨겁고 빠르게 내 손바닥에 닿는다.\n\n그 사람이 조금 주저앉고 나는 그 사람을 받쳐 세운다. 직조물 너머에서 악사들이 다시 시작한다. 그 사람이 가운을 매만져 펴고 먼저 빠져나가고, 나는 한동안 기다린 뒤 따라간다."
 latria_sexual_frustration_flavor.1335.a: "다시 미끄러져 들어가 자리를 잡는다."
 latria_sexual_frustration_flavor.1335.b: "조금 더 천 뒤에 머문다."
 latria_sexual_frustration_flavor.1335.c: "대신 벗을 찾아 그 사람과 앉는다."
