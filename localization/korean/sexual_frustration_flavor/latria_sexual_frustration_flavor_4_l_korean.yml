l_korean:
 latria_sexual_frustration_flavor.1301.t: "보내지 않은 초대장"
 latria_sexual_frustration_flavor.1301.desc.female: "잠옷 차림으로 책상에 앉아 종이에 이름 하나만 적었다. 시녀가 전할지 묻는다. 편지를 접고 대답하지 않는다."
 latria_sexual_frustration_flavor.1301.desc.male: "잠옷 차림으로 책상에 앉아 종이에 이름 하나만 적었다. 하인은 밖에서 전해주기를 기다리지만 차마 편지를 봉할 수가 없다."
 latria_sexual_frustration_flavor.1301.desc: "봉하지 않은 편지가 촛불 아래 오래 놓여 있다."
 latria_sexual_frustration_flavor.1301.a: "편지를 마저 쓰고 하인에게 건넨다."
 latria_sexual_frustration_flavor.1301.b: "편지를 치우고 갈망을 억누른 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1302.t: "궁정의 심판"
 latria_sexual_frustration_flavor.1302.desc.accepted: "궁정 시인이 옛 연정을 농담 삼아 이야기하자 가장 엄격한 귀족조차 눈살을 찌푸리지 않는다. 나도 함께 잔을 들지만 마음은 편하지 않다."
 latria_sexual_frustration_flavor.1302.desc.strict: "귀족 하나가 경솔한 연애로 체면을 잃자 궁정에서는 그 집안 전체를 이야기한다. 나 역시 같은 저울에 오를 수 있음을 알기에 그 평결에 귀를 기울인다."
 latria_sexual_frustration_flavor.1302.desc: "화제가 평판과 욕망으로 옮겨 간다."
 latria_sexual_frustration_flavor.1302.a: "내 갈망을 말하며 거듭 화제를 되돌린다."
 latria_sexual_frustration_flavor.1302.b: "말을 삼키고 주인들에게 감사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1303.t: "자정의 종소리"
 latria_sexual_frustration_flavor.1303.desc.favors: "종이 울린 뒤에도 사제는 문가에 남는다. 욕망을 선한 곳으로 이끌 수 있다고 하지만 내가 더 기다릴 수 있을지 모르겠다."
 latria_sexual_frustration_flavor.1303.desc.condemns: "종소리가 거듭 울리고 사제의 서약도 내 마음에 되풀이된다. 무릎을 꿇고 있자니 아프지만 답은 여전히 오지 않는다."
 latria_sexual_frustration_flavor.1303.desc: "자정 기도로도 평온은 오지 않았다. 종은 계속 울린다."
 latria_sexual_frustration_flavor.1303.a: "금욕의 계율을 사원에 두고 나온다."
 latria_sexual_frustration_flavor.1303.b: "생각을 억누르고 기도를 한 번 더 올린다."

 latria_sexual_frustration_flavor.1304.t: "인내의 끝"
 latria_sexual_frustration_flavor.1304.desc.lustful: "잠옷 차림으로 방을 서성인다. 시종이 가져온 체스판에는 손도 대지 않았다. 기다림 자체가 고통이 되었다."
 latria_sexual_frustration_flavor.1304.desc.chaste: "잠옷의 띠를 다시 매며 동작마다 침착해 보이려고 한다. 조심할수록 갈망을 외면하기 어렵다."
 latria_sexual_frustration_flavor.1304.desc: "방은 고요하다. 나는 더는 가만히 앉아 있을 수 없다."
 latria_sexual_frustration_flavor.1304.a: "체스판을 치우고 그리운 이를 생각한다."
 latria_sexual_frustration_flavor.1304.b: "책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1305.t: "해가 진 뒤의 방"
 latria_sexual_frustration_flavor.1305.desc.emperor: "궁정 사람들은 물러났지만 나는 예복을 입은 채 방에 남았다. 청원에는 답했으나 나를 괴롭히는 생각은 제후들과 함께 떠나지 않았다."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "동료들은 여관에서 잠들었지만 나는 방에 홀로 남았다. 짐도 꾸렸고 내일의 경로도 정했는데 생각을 가라앉힐 수가 없다."
 latria_sexual_frustration_flavor.1305.desc.clergy: "성의를 입은 채 작은 방에 홀로 남았다. 침대 곁의 촛불은 꺼졌다. 서약은 남았지만 위안은 오지 않는다."
 latria_sexual_frustration_flavor.1305.desc.ruler: "예복 차림으로 빈방에 돌아온다. 문밖 경비병들은 고개를 숙이지만 안에는 이 짐을 나눌 이가 없다."
 latria_sexual_frustration_flavor.1305.desc: "방은 비었지만 아직 눕고 싶지 않다."
 latria_sexual_frustration_flavor.1305.a: "늦은 시간에도 믿을 만한 지인을 불러 길게 이야기한다."
 latria_sexual_frustration_flavor.1305.b: "갈망을 억누르고 옷을 갈아입은 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1306.t: "자정의 전령"
 latria_sexual_frustration_flavor.1306.desc.female: "잠옷 차림으로 침대 곁에 앉아 있는데 문을 조용히 두 번 두드리는 소리가 난다. 시녀는 빈 종이만 가져왔지만 내가 누구의 소식을 기다리는지는 안다."
 latria_sexual_frustration_flavor.1306.desc.male: "잠옷 차림으로 방문을 열지만 복도는 이미 비었다. 문턱의 서명 없는 쪽지 때문에 다시 잠들 수가 없다."
 latria_sexual_frustration_flavor.1306.desc: "문밖의 발소리가 멀어진다. 책상 위 종이는 여전히 비었다."
 latria_sexual_frustration_flavor.1306.a: "미루어 온 말을 적는다."
 latria_sexual_frustration_flavor.1306.b: "종이를 치우고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1307.t: "탁자에 내려앉은 침묵"
 latria_sexual_frustration_flavor.1307.desc.accepted: "시인이 오래된 연애담을 읊자 일행이 즐겁게 듣는다. 나도 잔을 들며 아무도 이야기하지 않은 사연을 떠올린다."
 latria_sexual_frustration_flavor.1307.desc.strict: "탁자에서 경솔한 연애로 총애를 잃은 귀족이 언급되자 웃음이 사라진다. 나는 표정을 감추려 창으로 고개를 돌린다."
 latria_sexual_frustration_flavor.1307.desc: "잔은 계속 돌지만 대화는 건드리지 말아야 할 주제에 머문다."
 latria_sexual_frustration_flavor.1307.a: "술기운에 사적인 이야기를 잇달아 풀어놓는다."
 latria_sexual_frustration_flavor.1307.b: "말을 삼키고 일행에게 인사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1308.t: "밤을 지키는 기도"
 latria_sexual_frustration_flavor.1308.desc.favors: "야경을 알리는 종이 울려도 나는 성소에 남아 기도한다. 내 신앙은 육욕의 쾌락을 죄악시하지 않지만 이 오래된 갈망을 어떻게 마주해야 할지 모르겠다."
 latria_sexual_frustration_flavor.1308.desc.condemns: "성소에서 순결의 기도를 거듭 올린다. 종소리는 잦아들지만 마음속 생각은 사라지지 않는다."
 latria_sexual_frustration_flavor.1308.desc: "빈 긴 의자에 촛불이 비친다. 나는 아직 일어나지 않았다."
 latria_sexual_frustration_flavor.1308.a: "금욕의 기도를 접고 마음이 이끄는 대로 나간다."
 latria_sexual_frustration_flavor.1308.b: "욕망을 억누르고 밤기도를 마친다."

 latria_sexual_frustration_flavor.1309.t: "거울 속 눈길"
 latria_sexual_frustration_flavor.1309.desc.lustful: "옷을 벗은 채 방의 거울 앞에 잠시 홀로 선다. 표정은 바뀌지 않았지만 더는 욕망을 한때의 나약함이라고 부르지 않겠다."
 latria_sexual_frustration_flavor.1309.desc.chaste: "옷을 벗은 채 침대 곁에서 서약을 되뇐다. 모든 낱말을 기억하지만 마음속 갈망은 사라지지 않는다."
 latria_sexual_frustration_flavor.1309.desc: "방에는 아무도 없다. 거울 속 침묵에 시선을 피할 곳도 없다."
 latria_sexual_frustration_flavor.1309.a: "내 마음을 인정하고 그 생각에 잠긴다."
 latria_sexual_frustration_flavor.1309.b: "옷을 입고 책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1310.t: "방 안의 불면"
 latria_sexual_frustration_flavor.1310.desc.clergy: "밤기도 뒤 작은 방에 돌아온다. 아직 성의를 입고 있고 침대 곁 촛불은 꺼졌지만 눕지 않는다."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "동료들은 여관에서 잠들었다. 방에서 홀로 장비를 정리한다. 내일 갈 길은 분명한데 내 생각의 길은 그렇지 않다."
 latria_sexual_frustration_flavor.1310.desc: "밤이 깊었다. 문은 닫혔지만 잠들 수가 없다."
 latria_sexual_frustration_flavor.1310.a: "옛 지인에게 편지를 써서 괴로움을 솔직하게 털어놓는다."
 latria_sexual_frustration_flavor.1310.b: "생각을 억누르고 촛불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1301.c: "새 종이를 꺼내 초대를 시로 적는다."
 latria_sexual_frustration_flavor.1302.c: "화제를 가문과 영지로 돌린다."
 latria_sexual_frustration_flavor.1302.d: "여정의 이야기를 들려주어 다시 잔을 들게 한다."
 latria_sexual_frustration_flavor.1303.c: "새벽까지 남아 경전을 한 줄씩 공부한다."
 latria_sexual_frustration_flavor.1304.c: "체스 말을 놓고 문제를 풀어 본다."
 latria_sexual_frustration_flavor.1304.d: "첫 수부터 시작해 천천히 한 판을 마친다."
 latria_sexual_frustration_flavor.1305.c: "아침의 일을 정리한 뒤 촛불을 끈다."
 latria_sexual_frustration_flavor.1307.c: "새로운 시를 읊어 사람들의 주의를 돌린다."
 latria_sexual_frustration_flavor.1308.c: "기도서를 덮고 침묵 속에 생각을 헤아린다."
 latria_sexual_frustration_flavor.1308.d: "아침기도까지 밤을 지키며 모두의 경전을 준비한다."
 latria_sexual_frustration_flavor.1309.c: "괴로운 일을 적고 한 줄씩 헤아린다."
 latria_sexual_frustration_flavor.1310.c: "차를 끓이고 소지품과 책을 천천히 정리한다."
