l_korean:
 latria_sexual_frustration_flavor.1301.t: "보내지 않은 초대장"
 latria_sexual_frustration_flavor.1301.desc.female: "나는 잠옷 차림으로 책상 앞에 앉아 편지지에 이름 하나만 적었다. 잉크가 마르기도 전에 시녀가 문간에서 보낼지 물었다. 나는 종이를 한번 접었다. 봉하지도 대답하지도 않았다.\n\n낮에는 감히 쓰지 못한 이름이다. 밤에 적고 나니 종이가 뜨겁게 느껴진다. 그 뒤에는 초대의 말이 와야 한다. 어디서 어느 시각에 만날지도 다 생각해 두었지만 펜은 호칭 뒤에서 멈췄다. 시녀가 다시 한번 물었다. 목소리는 더 작아졌다.\n\n나는 그 이름을 바라본다. 다 쓰지 못한 편지 전체보다 그 이름이 무겁다."
 latria_sexual_frustration_flavor.1301.desc.male: "나는 잠옷 차림으로 책상 앞에 앉아 편지지에 이름 하나만 적었다. 문밖의 시종은 전할 말을 기다린다. 문틈의 그림자가 한번 움직였다가 멈추었다.\n\n펜에 잉크를 충분히 묻혀 종이 위에 들었다. 쓰려는 말은 분명하다. 오늘 밤, 옆문에서, 다른 사람은 모르게. 하지만 종이에 적는 순간 더는 마음속 일로만 남지 않을 것이다. 등잔 심지가 타닥거렸고 이름 옆에 잉크 한 방울이 떨어졌다.\n\n시종이 가볍게 헛기침했다. 나는 아직 편지를 봉하지 못했다."
 latria_sexual_frustration_flavor.1301.desc: "봉하지 않은 편지가 등불 아래에 한참 놓여 있다.\n\n종이에는 상대를 부르는 말뿐이다. 그 뒤의 여백에는 여러 문장을 쓸 수 있지만 나는 하나도 쓰지 않았다. 봉랍은 이미 열에 물러졌고 봉랍 숟가락도 손 가까이 있는데 집어 들지 않았다.\n\n등잔 기름이 한참 줄었다. 적힌 이름은 아직 마르지 않았다."
 latria_sexual_frustration_flavor.1301.a: "편지를 마저 쓰고 하인에게 건넨다."
 latria_sexual_frustration_flavor.1301.b: "편지를 치우고 갈망을 억누른 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1302.t: "궁정의 심판"
 latria_sexual_frustration_flavor.1302.desc.accepted: "궁정 시인이 옛 연정을 웃음거리로 삼아도 가장 엄숙한 귀족조차 눈살을 찌푸리지 않는다. 침장 안의 사적인 일을 사냥터의 우스운 이야기처럼 풀어낸다. 사람들이 잔을 들자 술 위에서 빛이 둥글게 흔들린다.\n\n나도 웃으며 잔을 들었지만 입안의 술은 쓰다. 이야기 속 사람은 내가 아닌데, 누군가 내 밤까지 꺼내 남들에게 펼쳐 보이는 것 같다. 옆 사람이 내 소매를 건드리며 왜 말을 보태지 않느냐고 물었다. 그제야 내가 늦게 웃었다는 것을 깨달았다.\n\n시인이 또 한 구절을 시작했다. 내 잔은 아직 허공에 멈춰 있다."
 latria_sexual_frustration_flavor.1302.desc.strict: "귀족 하나가 은밀한 연애로 체면을 잃자 사람들이 모두 그 가문을 이야기한다. 말이 느리다. 판결문을 읽는 듯 느리다. 누군가는 고개를 젓고 누군가는 자녀의 혼처를 다시 따져 본다.\n\n그들의 평가를 들으며 나도 같은 저울 위에 서 있다는 생각을 한다. 반대편에는 보내지 않은 편지 한 통과 제대로 자지 못한 몇 밤이 있다. 아직 남들이 보지 못한 것들이다. 보이지 않는다고 저울 위에 없는 것은 아니다.\n\n누군가 내 생각을 물었다. 나는 잔을 내려놓았다. 밑바닥이 탁자에 닿아 소리를 냈다."
 latria_sexual_frustration_flavor.1302.desc: "자리의 대화가 명예와 욕망으로 옮겨 갔다.\n\n처음에는 그저 농담이었다. 그런데 어느 문에서 어느 시각에 만났는지까지 이야기가 구체적으로 흘러가자 더는 웃기지 않았다. 나는 제자리에 앉아 식탁보 아래에서 내 손이 굳게 쥐어지는 것을 본다.\n\n악사들은 아직 연주한다. 이 말들을 덮을까 두려운 듯 아주 조용히 연주한다."
 latria_sexual_frustration_flavor.1302.a: "내 갈망을 말하며 거듭 화제를 되돌린다."
 latria_sexual_frustration_flavor.1302.b: "말을 삼키고 주인들에게 감사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1303.t: "자정의 종소리"
 latria_sexual_frustration_flavor.1303.desc.favors: "종이 울린 뒤에도 사제는 문가에 남아 있다. 욕망을 선한 쪽으로 이끌 수 있다고 말한다. 높지 않은 목소리가 밤에는 또렷하게 들린다. 사원 안의 촛불이 사제의 그림자를 내 무릎 앞까지 늘였다.\n\n하지만 내가 그 '선한 쪽'을 더 기다리고 싶은지 모르겠다. 기다림 자체가 또 하나의 계율이 되어 버렸다. 소매 안의 손이 뜨겁다. 어느 경전에서도 이 마음을 둘 곳을 찾지 못한다. 사제는 내가 뒷말을 묻지 않았다는 것을 알아챈 듯 나를 본다.\n\n종소리의 여운이 아직 들보 위에 남아 있다. 나는 무릎을 꿇고 있고, 무릎은 벌써 저리다."
 latria_sexual_frustration_flavor.1303.desc.condemns: "종소리가 거듭 울리고 사제가 읽는 서약도 내 마음에 거듭 내려앉는다. 무릎은 꿇은 지 오래되어 저리다. 돌바닥의 찬 기운은 내 체온에 이미 사라졌는데 답은 아직 나타나지 않는다.\n\n서약의 말은 하나하나 다 안다. 안다는 것과 기꺼이 받아들이는 것은 다르다. '버리겠다'는 대목에서 혀가 잠깐 멈추었다가 뒤늦게 말을 내보냈다. 사제는 바로잡지 않았지만 그 망설임은 나 자신이 듣기에 충분했다.\n\n마지막 종이 울리고 멎었다. 사원 안은 촛농 떨어지는 소리가 들릴 만큼 조용하다."
 latria_sexual_frustration_flavor.1303.desc: "한밤의 기도로도 내 마음은 고요해지지 않았고 종소리는 아직 울린다.\n\n나는 마지막 구절까지 따라 읊었다. 다 읊고 나서도 나는 제자리에 무릎을 꿇고 있고 마음속 일도 제자리에 남아 있다. 종소리 때문에 달라지지 않는다.\n\n사제가 책을 덮었다. 책장이 모이는 소리는 종소리보다 가까이에서 들렸다."
 latria_sexual_frustration_flavor.1303.a: "금욕의 계율을 사원에 두고 나온다."
 latria_sexual_frustration_flavor.1303.b: "생각을 억누르고 기도를 한 번 더 올린다."

 latria_sexual_frustration_flavor.1304.t: "인내의 끝"
 latria_sexual_frustration_flavor.1304.desc.lustful: "나는 잠옷 차림으로 방을 오간다. 시종이 가져온 체스판에는 말 하나도 움직이지 않았다. 창문이 조금 열려 밤공기가 들어오지만 남은 열기는 가시지 않는다.\n\n침대 옆에도, 탁자 옆에도, 문 옆에도 서 보았다. 문 너머에는 발소리가 없다. 기다리는 일 자체가 또 다른 고통이 되었다. 아무도 오지 않으리라는 것을 알면서도 밤을 알리는 북소리마다 문을 두드리는 소리로 듣는다. 함 속에서 체스 말이 한번 부딪쳤다. 내 소매가 건드린 것이었다.\n\n나는 체스판 앞으로 돌아와 폰 하나에 손을 얹었다. 앞으로 밀지는 않았다."
 latria_sexual_frustration_flavor.1304.desc.chaste: "나는 잠옷 끈을 다시 단단히 묶었다. 움직임 하나하나를 차분하게 보이려 애쓴다. 끈이 허리를 조이는 감각이 또렷하다. 이렇게 조심할수록 마음속 갈망이 없는 척하기는 더 어렵다.\n\n체스판은 아직 탁자 위에 있다. 마음 놓고 따라갈 수 있는 바른길처럼 보인다. 나는 앉아서 말을 하나 들었다가 내려놓았다. 내려놓고 나서도 마음은 다른 데로 향한다. 그 손을 탁자 아래로 내려 눌러 두었다. 손은 멈추었지만 숨은 흐트러졌다.\n\n방은 아주 조용하다. 내가 입 밖에 내지 않은 욕설까지 들릴 만큼 조용하다."
 latria_sexual_frustration_flavor.1304.desc: "방은 고요한데 나는 더는 가만히 앉아 있을 수 없다.\n\n일어나 물을 따르고도 마시지 않았다. 등잔 심지를 다듬으러 갔다가 너무 짧게 잘라 불꽃이 낮아졌다. 하는 일마다 시작만 했을 뿐, 어느 것도 나를 의자에 붙들어 두지 못했다.\n\n마침내 나는 방 한가운데 서 있다. 손을 어디에 두어야 할지 모르겠다."
 latria_sexual_frustration_flavor.1304.a: "체스판을 치우고 그리운 이를 생각한다."
 latria_sexual_frustration_flavor.1304.b: "책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1305.t: "해가 진 뒤의 방"
 latria_sexual_frustration_flavor.1305.desc.emperor: "궁정 사람들이 물러갔지만 나는 아직 예복 차림으로 침실에 남아 있다. 보고서는 모두 결재했고 인주도 말랐으며 신하들의 발소리도 멀어졌다. 하지만 내 마음속 일은 그들과 함께 떠나지 않았다.\n\n나는 옷깃의 잠금쇠를 풀다가 중간에 멈추었다. 잠자리는 잘 마련되어 있다. 너무 반듯해서 그 안으로 들어가 잘 수 있을 것 같지 않다. 거울 앞에 잠시 서니 예복을 입은 내 모습이 보인다. 어떤 보고서에도 적지 못한 마음이 눈에 남은 것도 보인다.\n\n시종이 문밖에서 관을 벗겨 드릴지 물었다. 나는 아직 들어오지 말라고 했다."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "동료들은 이미 여관에서 쉬고 있지만 나는 방에 홀로 남아 있다. 짐도 꾸렸고 내일의 여정도 문 뒤 나무판에 적었다. 마음만 둘 곳이 없다. 짐 속의 자리를 차지하지도 않으면서 방 전체를 채운다.\n\n나는 장화를 벗지 않은 채 침대 가장자리에 앉았다. 아래층에서 누군가 술에 취해 노래하다가 동료에게 입을 막혔다. 작은 웃음소리가 올라온다. 내가 들어갈 수 없는 다른 밤에서 들려오는 것 같다.\n\n나는 지도를 말았다가 다시 펼쳤다. 길은 여전히 같은 길이다."
 latria_sexual_frustration_flavor.1305.desc.clergy: "나는 의례복을 입은 채 작은 방에 혼자 남아 있다. 침대 곁의 촛불은 벌써 어두워졌다. 서약은 낮에 읊었던 그대로 한 글자도 달라지지 않고 남아 있다. 위안은 찾아오지 않았다.\n\n나는 손목의 기도 구슬을 풀었다. 구슬이 손가락 사이로 하나씩 지나가다가 어느새 기도문을 잊었다. 복도에 서 있던 한 사람과, 그때 내가 먼저 눈길을 돌렸던 일이 떠오른다. 외면한다고 그 사람이 사라지지는 않았다.\n\n의례복의 옷깃이 목에 쓸린다. 나는 옷을 벗지 않았다."
 latria_sexual_frustration_flavor.1305.desc.ruler: "나는 예복 차림으로 텅 빈 침실에 돌아왔다. 문밖에서 경비가 인사하며 갑옷이 한 번 부딪쳤고 뒤이어 빗장 소리가 났다. 문 안에는 내 마음을 나누어 짊어질 사람이 없다.\n\n관은 아직 머리에 있다. 나는 관을 벗어 베개 옆에 놓았다. 다른 머리 하나를 내려놓는 것 같다. 거울 속 사람은 내일도 알현을 받을 수 있을 모습이다. 하지만 이 밤을 어떻게 보내게 될지는 나만 안다.\n\n나는 침대 곁에 앉았다. 장갑 한 짝은 아직 끼고 있다."
 latria_sexual_frustration_flavor.1305.desc: "방에는 나 말고 아무도 없지만 나는 좀처럼 잠자리에 들고 싶지 않다.\n\n불은 아직 켜져 있고 신발도 신고 있으며 겉옷도 반듯하다. 나는 그것들을 아직 나가서 사람을 만날 수 있다는 증거로 삼는다. 사실 나를 기다리는 사람은 없다. 그저 잘 정돈된 잠자리를 마주하고 싶지 않을 뿐이다.\n\n창틈으로 바람이 들어와 등불을 살짝 기울였다."
 latria_sexual_frustration_flavor.1305.a: "늦은 시간에도 믿을 만한 지인을 불러 길게 이야기한다."
 latria_sexual_frustration_flavor.1305.b: "갈망을 억누르고 옷을 갈아입은 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1306.t: "자정의 전령"
 latria_sexual_frustration_flavor.1306.desc.female: "나는 잠옷 차림으로 침대 가장자리에 앉아 있다가 문을 가볍게 두 번 두드리는 소리를 들었다. 약속한 신호가 아니라 시녀가 물건을 가져올 때 내는 소리였다. 시녀는 들어와 빈 편지지 한 장을 내려놓고 물러났다. 눈길은 침대로 향하지 않았다.\n\n빈 종이가 글로 가득한 편지보다 더 마음을 어지럽힌다. 누구의 소식을 기다리는지 나는 안다. 오늘 밤에는 오지 않을 것도 안다. 종이를 등불 아래로 가져가니 섬유 몇 가닥이 비쳤다. 아직 글자가 되지 못한 한 줄처럼 보인다.\n\n내 손가락이 종이 위에 오래 머물렀다. 그 자리에 작은 물기가 배었다."
 latria_sexual_frustration_flavor.1306.desc.male: "나는 잠옷 차림으로 방문을 열었다. 복도는 벌써 비어 있다. 문턱 곁에는 서명 없는 쪽지가 한 장 놓여 있다. 누가 지나며 두었거나 낮에 떨어뜨린 것일 수도 있다. 그것을 주워 들고도 나는 여전히 잠들지 못한다.\n\n쪽지에는 내가 바라는 말이 없다. 내일의 시각과 치러야 할 돈에 관한 이야기다. 그래도 한 줄씩 끝까지 읽고 뒷면까지 뒤집어 보았다. 뒤는 비어 있다. 그 빈 쪽이 오히려 내가 쓰기를 기다리는 듯하다.\n\n복도의 등불이 꺼졌다. 나는 아직 문간에 서 있고 문은 완전히 닫히지 않았다."
 latria_sexual_frustration_flavor.1306.desc: "문밖의 발소리는 멀어졌지만 탁자 위 편지에는 아직 쓴 말이 없다.\n\n나는 세 번이나 펜을 들었다. 처음에는 글자 하나를 썼다가 지웠다. 두 번째에는 종이에 잉크 점 하나만 남겼다. 세 번째에는 펜을 내려놓고 그 점이 천천히 마르는 것을 보았다.\n\n밤은 벌써 절반이 지났다. 종이는 여전히 거의 비어 있다."
 latria_sexual_frustration_flavor.1306.a: "미루어 온 말을 적는다."
 latria_sexual_frustration_flavor.1306.b: "종이를 치우고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1307.t: "탁자에 내려앉은 침묵"
 latria_sexual_frustration_flavor.1307.desc.accepted: "시인이 옛 연정을 읊자 사람들은 흥미롭게 듣는다. 누군가는 탁자를 두드려 박자를 맞추고 누군가는 뒷구절을 먼저 잇는다. 손안에서 술잔이 돌아간다. 이 이야기를 누구 앞에서 삼가야 한다고 여기는 이는 없다.\n\n나도 잔을 들어 호응했지만 마음에는 아무도 꺼내지 않은 옛일이 떠올랐다. 시처럼 듣기 좋은 이야기도 아니고 이렇게 많은 사람이 반겨 준 일도 아니다. 닫힌 문 하나와 그 뒤 혼자 새벽까지 앉아 있던 나뿐이었다. 시인이 서로 안는 대목을 읊자 내 잔에서 술 한 방울이 흘렀다.\n\n그 한 방울을 본 사람은 없다. 나 자신만 보았다."
 latria_sexual_frustration_flavor.1307.desc.strict: "은밀한 연애 때문에 총애를 잃은 귀족 이야기가 나오자 웃음이 곧 멎었다. 누가 현 하나를 눌러 멈춘 것처럼 일제히 멎었다. 나는 표정을 들키고 싶지 않아 창밖으로 눈을 돌렸다.\n\n밖에는 야간 순찰의 등불 하나뿐, 볼 만한 것이 없다. 그래도 계속 바라보았다. 뒤에서 누군가 작게 '자업자득이지'라고 말했다. 나를 향한 말이 아닐 수도 있다. 그런데 그 말은 내 등에 내려앉아, 아직 들키지 않은 내 일을 짚는 것 같았다.\n\n나는 잔을 단단히 잡았다. 손가락 마디가 하얗게 질렸다."
 latria_sexual_frustration_flavor.1307.desc: "술잔은 계속 돌지만 대화는 가장 머물지 말아야 할 화제에서 멈추었다.\n\n조금 전까지는 수확을 이야기했다. 그러다 누군가 다른 사람의 침장 안 사정을 꺼냈다. 그 뒤에는 누구도 이전 이야기로 돌아가지 않았다. 나는 그 침묵 속에 앉아 음악보다 큰 내 심장 소리를 듣는다.\n\n누군가 헛기침으로 그 빈틈을 메우려 했다. 침묵은 그대로였다."
 latria_sexual_frustration_flavor.1307.a: "술기운에 사적인 이야기를 잇달아 풀어놓는다."
 latria_sexual_frustration_flavor.1307.b: "말을 삼키고 일행에게 인사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1308.t: "밤을 지키는 기도"
 latria_sexual_frustration_flavor.1308.desc.favors: "밤을 지키는 종이 울린 뒤에도 나는 성소에서 기도하고 있다. 교리가 육욕의 쾌락을 배척하지 않는다는 구절은 다른 이에게 짚어 줄 수도 있다. 하지만 그 구절을 안다고 지금 무릎을 꿇고 있는 내가 어찌해야 할지 알 수 있는 것은 아니다.\n\n긴 의자들은 비어 있다. 촛불이 내 그림자를 등받이에 드리운다. 숨을 따라 오르내리는 그림자는 밤기도를 지키기 싫어하는 다른 사람 같다. 낮에 거의 입 밖으로 꺼낼 뻔했던 초대가 생각난다. 그 말을 다른 말로 바꾸었지만 내 갈망까지 바뀌지는 않았다.\n\n종소리는 멀어졌다. 나는 아직 무릎을 꿇고 있고 이마에는 땀이 맺혔다."
 latria_sexual_frustration_flavor.1308.desc.condemns: "나는 성소에서 순결의 기도문을 거듭 읊는다. 첫 번째에는 온전히 읊었지만 두 번째부터는 말이 빠졌다. 세 번째에는 아예 같은 문장에서 멈추어 뒷말을 이어 가지 못했다.\n\n종소리가 멀어져도 마음속 생각은 물러가지 않는다. 종소리와 함께 떠나지 않는다. 나는 돌바닥에 손바닥을 대어 찬 기운을 빌려 보려 했다. 하지만 그마저 금세 따뜻해졌다. 따뜻해지고 나니 내가 무엇과 맞서고 있는지 더 분명하게 알겠다.\n\n텅 빈 긴 의자에는 아무도 없다. 그래도 나는 목소리를 아주 낮춘다."
 latria_sexual_frustration_flavor.1308.desc: "촛불이 빈 긴 의자를 비추고 나는 아직 일어나지 않았다.\n\n밤기도는 여기서 끝내야 한다. 그런데 일어서면 무릎을 꿇고 누르던 갈망이 다시 돌아올 것만 같다. 그래서 계속 무릎을 꿇고 있다. 이제는 그 자세로 시간을 미루고 있다.\n\n마지막 초의 심지가 타닥 소리를 냈다. 검은 연기가 올라가 들보 아래에서 흩어졌다."
 latria_sexual_frustration_flavor.1308.a: "금욕의 기도를 접고 마음이 이끄는 대로 나간다."
 latria_sexual_frustration_flavor.1308.b: "욕망을 억누르고 밤기도를 마친다."

 latria_sexual_frustration_flavor.1309.t: "거울 속 눈길"
 latria_sexual_frustration_flavor.1309.desc.lustful: "나는 옷을 벗은 채 침실의 놋거울 앞에 잠시 혼자 서 있었다. 거울 속 사람은 피하지 않았고 나도 옷으로 가리지 않았다. 옆에서 비치는 등불이 거울 속 명암을 또렷하게 드러냈다.\n\n이 욕망을 잠깐의 나약함이라고 부르는 데 지쳤다. 잠깐이 아니다. 저녁 무렵부터 지금까지, 저녁 식사를 지나 사람들이 흩어질 때까지 따라왔다. 이제 나와 이 거울만 남았다. 나는 손을 들어 어깨에 잠시 댔고 거울 속 손도 똑같이 움직였다. 작은 움직임에도 내 마음이 얼마나 동요하는지 알겠다.\n\n문밖에는 발소리가 없다. 나는 가장할 필요가 없다."
 latria_sexual_frustration_flavor.1309.desc.chaste: "나는 옷을 벗은 채 침대 가장자리에 앉아 서약을 조용히 되뇐다. 모든 낱말이 선명하게 기억나서 하나만 빠뜨려도 곧바로 알아챌 수 있다. 그래도 마음속 갈망은 사라지지 않는다. 내게 남아 있는 것을 다른 곳에 있다고 둘러댈 수도 없다.\n\n나는 거울을 보았다가 눈을 돌렸다. 외면해도 소용없다. 놋거울에는 여전히 내가 비친다. 두 손을 단단히 맞잡자 손가락 마디가 하얗게 질렸다. 그러면 그 서약을 지킬 수 있을 것만 같다.\n\n서약이 또 한 번 끊겼다. 이번에는 곧바로 잇지 않았다."
 latria_sexual_frustration_flavor.1309.desc: "방에는 다른 사람이 없지만 거울 속 침묵 때문에 나는 나 자신을 피할 수 없다.\n\n옷은 의자 위에 있고 나는 거울 앞에 있다. 그 사이는 몇 걸음에 불과하다. 그런데도 옷을 걸치지 않는 이유를 인정하기까지 한참이 걸렸다. 등불은 흔들림 없고 내 눈길은 흔들린다.\n\n나는 침대 가장자리에 앉았다. 깔개는 차가웠지만 오래가지 않았다."
 latria_sexual_frustration_flavor.1309.a: "내 마음을 인정하고 그 생각에 잠긴다."
 latria_sexual_frustration_flavor.1309.b: "옷을 입고 책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1310.t: "방 안의 불면"
 latria_sexual_frustration_flavor.1310.desc.clergy: "밤기도를 마치고 나는 내 작은 방에 돌아왔다. 의례복도 아직 갈아입지 않았고 침대 곁의 촛불도 어두워졌지만 눕고 싶지 않다. 누우면 애써 미뤄 둔 갈망을 다시 마주하게 될 것이다. 그 마음을 받아들일지 아직 정하지 못했다.\n\n베갯머리에 놓인 기도 구슬은 증인처럼 보인다. 나는 의례복의 끈을 반쯤 풀었다가 다시 묶었다. 묶고 나서도 옷깃이 살갗을 스쳐 좀처럼 잠들지 못할 만큼 정신이 또렷하다.\n\n작은 방에는 나뿐이다. 그렇다고 일이 단순해지지는 않았다."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "동료들은 이미 여관에서 잠들었고 나는 방에 혼자 남아 짐을 정리했다. 내일의 길은 분명하다. 나루를 지나 육로를 따라가면 다시 나루가 나온다. 하지만 내 마음이 향할 곳은 분명하지 않다. 어떤 지도에도 나와 있지 않다.\n\n장화를 벗고도 눕지 않았다. 창밖에서 말이 천천히 풀을 씹는다. 잠을 부를 만한 소리인데 나는 그 소리를 들으며 낮에 나루에서 누가 나를 바라보았던 일을 떠올린다. 너무 짧아서 눈길로 치지 않아도 될 순간이었다. 나는 그 순간을 헤아려 두었다.\n\n등불이 한번 흔들렸다. 나는 기름을 더 넣지 않았다."
 latria_sexual_frustration_flavor.1310.desc: "밤은 깊었고 방문도 닫았지만 나는 여전히 편히 잠들지 못한다.\n\n침대도 베개도 편안하다. 나는 침대 가장자리에 앉아 낮에 가까이 가지 못한 사람을 다시 떠올렸다. 손바닥이 뜨거워지고 나서야 잠옷 끈을 벌써 풀었다는 것을 알았다. 언제 풀었는지는 기억도 나지 않는다.\n\n나는 그 끈을 바라본다. 아직 내리지 못한 결정처럼 다리 곁에 늘어져 있다."
 latria_sexual_frustration_flavor.1310.a: "옛 지인에게 편지를 써서 괴로움을 솔직하게 털어놓는다."
 latria_sexual_frustration_flavor.1310.b: "생각을 억누르고 촛불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1301.c: "새 종이를 꺼내 초대를 시로 적는다."
 latria_sexual_frustration_flavor.1302.c: "화제를 가문과 영지로 돌린다."
 latria_sexual_frustration_flavor.1302.d: "여정의 이야기를 들려주어 다시 잔을 들게 한다."
 latria_sexual_frustration_flavor.1303.c: "새벽까지 남아 경전을 한 줄씩 공부한다."
 latria_sexual_frustration_flavor.1304.c: "체스 말을 놓고 문제를 풀어 본다."
 latria_sexual_frustration_flavor.1304.d: "첫 수부터 시작해 천천히 한 판을 마친다."
 latria_sexual_frustration_flavor.1305.c: "아침의 일을 정리한 뒤 촛불을 끈다."
 latria_sexual_frustration_flavor.1307.c: "새로운 시를 읊어 사람들의 주의를 돌린다."
 latria_sexual_frustration_flavor.1308.c: "기도서를 덮고 침묵 속에 생각을 헤아린다."
 latria_sexual_frustration_flavor.1308.d: "아침기도까지 밤을 지키며 모두의 경전을 준비한다."
 latria_sexual_frustration_flavor.1309.c: "괴로운 일을 적고 한 줄씩 헤아린다."
 latria_sexual_frustration_flavor.1310.c: "차를 끓이고 소지품과 책을 천천히 정리한다."
