l_korean:
 latria_sexual_frustration_flavor.1211.t: "켜 둔 등잔"
 latria_sexual_frustration_flavor.1211.desc: "집이 등잔 소리가 들릴 만큼 조용해졌다. 나는 아무도 부르지 않았다. 그래도 잔을 둘 내놓았고, 두 번째 잔은 빈 채로 거기 있다. 빵은 정오에 두었던 그 천 밑에 그대로다.\n\n내가 지니고 있는 것은 문간에서 내 어깨에 닿았던 어깨, 그 무게, 숨 한 번 쉴 동안 어느 쪽도 움직이지 않던 방식이다. 내 살갗이 그것을 보관했다. 그것은 이 시각에, 잠옷 밑에서, 무릎 뒤와 그 아래로 돌아오고, 나는 손을 배에 평평하게 얹어 가라앉히려 하지만 가라앉지 않는다.\n\n심지가 기울었다. 나는 빈 잔을 돌려 손잡이가 의자를 향하게 한다."
 latria_sexual_frustration_flavor.1211.a: "등잔을 끄고 내 손이 끝맺게 둔다."
 latria_sexual_frustration_flavor.1211.b: "심지를 다듬고 식은 차를 마신 뒤 잠든다."
 latria_sexual_frustration_flavor.1211.c: "말들이 돌기를 멈출 때까지 읽는다."

 latria_sexual_frustration_flavor.1212.t: "기다리는 의논"
 latria_sexual_frustration_flavor.1212.desc: "청원서가 낭독되고, 나는 한 마디도 듣지 않는다. 내 집사는 손을 등 뒤로 모은 채 상 가장자리에 서 있고, 나는 두 번째 면부터 그 사람의 목선을 보고 있다. 비는 그쳤고 방은 지나치게 따뜻하다. 뒤에서 불이 타닥이다 가라앉는다.\n\n그 사람이 촛대를 옮기려 몸을 기울이고 소매가 내 손목을 스친다. 어느 쪽도 아무 말도 하지 않는다. 방에서는 뜨거운 밀랍과 젖은 모직 냄새가 난다. 나는 이 자리를 끝낼 수 있다. 그 말이 이미 내 입 안에 있고 나는 그것을 거기 붙들어 두며, 그 사람은 인장에 눈을 둔 채 기다린다.\n\n서기가 결정했는지 묻는다. 나는 아무것도 결정하지 않았다."
 latria_sexual_frustration_flavor.1212.a: "이 자리를 끝내고, 지어낸 심부름으로 그 사람을 붙들어 둔다."
 latria_sexual_frustration_flavor.1212.b: "청원서를 처리하며 눈을 면에 둔다."
 latria_sexual_frustration_flavor.1212.c: "서류를 지도 상으로 가져가 밤새 일한다."

 latria_sexual_frustration_flavor.1213.t: "어둠이 쓰이는 대로"
 latria_sexual_frustration_flavor.1213.desc: "문은 걸렸다. 나는 옷을 입지 않았고, 이불은 걷어찼던 그 바닥에 있다. 방에서는 촛불과 내 살갗 냄새가 난다.\n\n내 몸은 하루 종일 시끄러웠고 지금은 더 시끄럽다. 나는 무릎을 벌어지게 두고 손을 배 위로, 더 아래로 보낸다. 딴 일을 하고 있는 척하지 않는다. 오는 것은 빗장뼈에 닿은 입술, 눌린 손목이 좋았던 일, 그리고 나는 그것을 따라가, 엉덩이가 매트리스에서 들리고 어둠 속에서 숨이 흩어질 때까지 간다.\n\n뒤의 방은 같은 방이다. 나는 팔을 눈 위에 걸치고 누워 있다. 촛불은 웅덩이처럼 녹았고 나는 잠들지 않았다."
 latria_sexual_frustration_flavor.1213.a: "손이 끝맺게 두고 뒤에 잠든다."
 latria_sexual_frustration_flavor.1213.b: "이불을 바닥에서 주워 날이 밝을 때까지 가만히 누운다."
 latria_sexual_frustration_flavor.1213.c: "옷을 입고 내려가 하늘이 잿빛이 될 때까지 성벽을 걷는다."
 latria_sexual_frustration_flavor.1213.d: "촛불이 죽을 때까지 다시, 또 다시 그것에 몸을 맡긴다."

 latria_sexual_frustration_flavor.1214.t: "새벽 기도 전의 시각"
 latria_sexual_frustration_flavor.1214.desc: "나는 손봐야 할 등불들을 두고 성당에 혼자 있다. 냉기가 돌바닥을 뚫고 올라오고, 성인들은 나를 지나 문 쪽을 본다. 수단 밑에서 내 몸은 따뜻하고 깨어 있으며, 지금이 몇 시인지는 조금도 개의치 않는다.\n\n나는 이것에 쓸 말을 안다. 문 곁 나무 상자에서, 그들의 죄에 쓰는 목소리로 남들 위에 말해 왔다. 내 위에 말하면 아무 소용이 없다. 욕망은 삼킨 숯처럼 갈비뼈 뒤에 앉는다. 나는 손바닥을 제단 돌에 아프도록 평평하게 누른다.\n\n곧 종이 울린다. 내 손은 여전히 돌 위에 있고, 돌은 더는 차갑지 않다."
 latria_sexual_frustration_flavor.1214.a: "그 욕망을 내 손으로 다스리고, 뒤에 용서를 청한다."
 latria_sexual_frustration_flavor.1214.b: "예배 내내 꿇어 있고 시간이 그것을 닳게 둔다."
 latria_sexual_frustration_flavor.1214.c: "책을 펴 시편을, 말이 붙들릴 때까지 읽는다."

 latria_sexual_frustration_flavor.1215.t: "상 밑의 무릎"
 latria_sexual_frustration_flavor.1215.desc: "홀은 시끄럽다. 누군가의 사냥개가 벤치 밑에 있고 술은 두 번 돌았다. 내 이웃은 사슴 고기가 나온 뒤로 무릎을 내 무릎에서 떼지 않았고, 우리가 닿는 자리에서 벤치가 따뜻해졌다. 부들깔개에서 밟힌 술 냄새가 난다.\n\n상이 웃음으로 흔들릴 때마다 그 압력이 옮겨 갔다가 돌아온다. 나는 국경 논쟁을 따라가기를 그만두었다. 나는 그 사람 손 옆 벤치에 내 손을 얹고 그대로 둔다. 그 사람이 손을, 그리고 먼 벽을 보고, 무릎은 남는다. 내 무릎은 저려졌고 나는 그것을 움직이지 않았다.\n\n잔 하나가 넘어간다. 술이 가장자리로 흘러 부들깔개에 떨어진다. 아무도 움직이지 않았다."
 latria_sexual_frustration_flavor.1215.a: "여기서 분명히 말하고, 홀이 듣게 한다."
 latria_sexual_frustration_flavor.1215.b: "상에 인사하고 일어나 밖에서 공기를 쐰다."
 latria_sexual_frustration_flavor.1215.c: "그 사람에게 몸을 돌려 불이 낮아질 때까지 다른 이야기를 한다."

 latria_sexual_frustration_flavor.1216.t: "정원의 소매"
 latria_sexual_frustration_flavor.1216.desc: "모란은 절정을 지나, 정원사는 일하는 척하기를 그만두었다. 우리는 연못을 도는 먼 길로 걷는다. 가까운 길은 문에서 끝나기 때문이다. 오후는 묽은 차 빛이 되었다.\n\n그 사람의 소매가 자꾸 내 손등을 찾는다. 내 집에서라면 그런 손길은 이미 내려진 결정이고, 차가 식기 전에 중매인을 보내야 한다. 여기서는 그저 소매이고, 그것을 읽어야 하는 쪽은 나다. 나는 걸음을 늦추고, 그 사람도 늦춘다. 물이 우리 두 사람의 모습을 담고, 어느 쪽도 먼저 움직이지 않는다.\n\n문에서 그 사람이 멈추어 한 번 돌아본다. 내 신발 밑에는 꽃잎이 있다."
 latria_sexual_frustration_flavor.1216.a: "분명히 묻고, 그에 대한 답을 내 집안에 한다."
 latria_sexual_frustration_flavor.1216.b: "인사하고 손을 소매에 둔 채 안으로 든다."
 latria_sexual_frustration_flavor.1216.c: "등롱이 밝혀질 때까지 혼자 연못을 한 번 더 돈다."

 latria_sexual_frustration_flavor.1217.t: "돌아오는 긴 길"
 latria_sexual_frustration_flavor.1217.desc: "우리는 동트기 전부터 안장에 있었다. 지난 삼 마일을 나는 앞의 기수를 의식하고 있다. 그 사람이 앉는 방식. 여울에서 돌아보던 방식. 허벅지가 쓸리고 입이 마르지만, 그것은 내가 자꾸 그 사람을 보는 이유가 아니다.\n\n사슴은 사라지고 몰이꾼은 흩어졌으니, 늦어도 아무도 이러쿵하지 않을 것이다. 고삐에 쥔 손은 차갑고 나머지는 조금도 차갑지 않다. 나는 말의 옆구리를 차 거리를 없앤다. 숲은 물방울 소리로 타닥인다.\n\n그 사람이 소리에 돌아서서 기다린다. 숲은 젖은 잎으로 가득하고 말들은 콧김을 뿜는다."
 latria_sexual_frustration_flavor.1217.a: "그 사람을 나무 사이로 데려가, 늦게 돌아간다."
 latria_sexual_frustration_flavor.1217.b: "사냥집까지 말을 몰아 그 생각을 찬물에 넣는다."
 latria_sexual_frustration_flavor.1217.c: "말에서 내려 손이 멎을 때까지 자국을 읽는다."

 latria_sexual_frustration_flavor.1218.t: "빌린 책이 있는 방"
 latria_sexual_frustration_flavor.1218.desc: "자기 창고방에서 자게 해 주는 학자가 등잔과, 내가 잘 읽지 못하는 책 한 권을 남겨 두었다. 덧문에 비, 젖은 초가 지붕 냄새. 지난 마을 뒤로 내 몸은 가라앉지 않았고, 좁은 침상이 그것을 더한다. 바람이 스며들면 등잔에서 그을음이 난다.\n\n그 사람이 심지를 손보러 들어와 손가락을 선반에 얹고 서고, 나는 그 사람에게서 잉크 냄새를 맡는다. 나는 남아 이 면을 설명해 달라 청하고, 그 사람은 그렇게 한다. 손가락으로 짚는 동안 그 사람의 어깨가 내 어깨에 얹히고, 어느 쪽도 그것을 움직이지 않으며, 나는 문법을 듣기를 그만두었다.\n\n비가 잦아든다. 그 사람의 손가락은 여전히 같은 행에 있다."
 latria_sexual_frustration_flavor.1218.a: "그 욕망이 갈 곳을 얻을 때까지 서툴게 노래한다."
 latria_sexual_frustration_flavor.1218.b: "감사하고 등잔을 끈 뒤 문 쪽으로 등을 돌리고 누운다."
 latria_sexual_frustration_flavor.1218.c: "가르침을 이어 달라 청하고 손을 면에 둔다."
 latria_sexual_frustration_flavor.1218.d: "손이 원할 수 없을 만큼 지칠 때까지 그 대목을 세 번 옮겨 적는다."

 latria_sexual_frustration_flavor.1219.t: "홀 뒤의 방"
 latria_sexual_frustration_flavor.1219.desc: "연회는 마당으로 빠져나갔고, 우리 둘은 여분 벤치를 두는 홀 뒤 작은 방에 이르렀다. 그 사람은 문을 등지고 손을 내 가슴에 평평하게 얹은 채, 나를 보고 웃으며 기다린다.\n\n나는 그 사람의 허리띠 매듭을, 그리고 끈을 풀고, 그 사람이 다시 웃으며 나를 돕는다. 그 사람의 입이 내 목에 있고 허벅지 하나가 내 사이로 들고, 나는 더는 아무것도 가장하지 않는다. 우리는 벤치에서 시간을 들이고, 그 사람의 머리가 풀리고, 내 숨이 거칠어지다가, 그 사람이 떨고 내가 뒤를 따른다.\n\n뒤에도 그 사람은 여전히 내 손목을 쥐고 있다. 홀에서는 음악이 다시 시작되었다."
 latria_sexual_frustration_flavor.1219.a: "그 사람에게 실상을 말하고 손을 붙든다."
 latria_sexual_frustration_flavor.1219.b: "옷을 고쳐 입고, 감사하고, 홀로 돌아간다."
 latria_sexual_frustration_flavor.1219.c: "음악이 멎을 때까지 그 사람과 벤치에 앉아 있는다."

 latria_sexual_frustration_flavor.1220.t: "내가 지킨 철야"
 latria_sexual_frustration_flavor.1220.desc: "나는 철야를 지키겠다고 말했고, 그들은 촛불 하나와 지난주의 향 냄새를 남기고 성당을 내게 두었다. 자정이 왔다가 갔다. 무릎이 시큰하고 몸은 조용해지지 않는다. 돌바닥이 내 발의 열을 가져갔다.\n\n눈을 감을 때마다 두 겨울 전 춤에서 내 허리께에 얹혔던 손이 있고, 나는 다시 눈을 떠야 한다. 촛불이 내 그림자를 벽에 던진다. 나는 한순간에 이것을 끝낼 수 있고 아무도 영원히 모를 것이며, 그것이 바로 문제다.\n\n문에서 바람이 스며든다. 내 그림자가 벽에서 움직인다."
 latria_sexual_frustration_flavor.1220.a: "여기서 내 손으로 다스리고 성인들에게 정직하게 군다."
 latria_sexual_frustration_flavor.1220.b: "창이 잿빛이 될 때까지 꿇어 있는다."
 latria_sexual_frustration_flavor.1220.c: "내 목소리만이 방에 남을 때까지 예배를 소리 내어 읽는다."

 latria_sexual_frustration_flavor.1221.t: "사절의 장갑"
 latria_sexual_frustration_flavor.1221.desc: "사절이 내 홀에 든 지 사흘이고, 나는 그 사흘을 모두 셌다. 그 사람은 조약의 면을 넘기려 장갑을 손가락 하나씩 벗고, 나는 강에 관한 조항을 두 번이나 놓쳤다. 불은 타들어 갔고 장작을 구하러 보낸 이도 없다.\n\n내 의원들은 내가 듣지 않는 것을 지켜본다. 읍에는 이름도 묻지 않는 곳이 있고, 그 생각은 둘째 날 아침부터 무겁고 따뜻하고 조금도 품위 없이 내 가슴에 앉아 있다. 나는 일 년째 그 문에 가지 않았다.\n\n그 사람이 인장을 보라고 장갑을 내민다. 나는 그것을 받는다. 아직 따뜻하다."
 latria_sexual_frustration_flavor.1221.a: "서명하고 그 사람을 물러가게 한 뒤, 오늘 밤 읍으로 내려간다."
 latria_sexual_frustration_flavor.1221.b: "그 조항을 다시 읽고 손을 상에 둔다."
 latria_sexual_frustration_flavor.1221.c: "촛불이 흔들려 꺼질 때까지 조항을 하나씩 처리한다."
 latria_sexual_frustration_flavor.1221.d: "읍에서 어느 문이 조용한 것인지 알아낸다."

 latria_sexual_frustration_flavor.1222.t: "너무 오래 쥔 손"
 latria_sexual_frustration_flavor.1222.desc: "춤이 느린 박에 이르렀고, 나는 저녁 내내 손에서 손으로 넘어갔다. 마지막 상대는 음악이 멎어도 놓지 않는다. 홀은 촛불과 남의 술 냄새로 뜨겁다. 부들깔개는 밟혀 납작하고 촛불은 흔들린다.\n\n그 사람의 엄지가 내 손가락 마디에 있다. 홀은 보면서 보지 않는 척하고, 내 귀는 뜨겁고, 나는 손을 거두지 않는다. 악사들 곁에서 누군가 웃는다. 그 사람의 손이 한 번, 의도적으로 조이고, 내 얼굴을 정돈하기도 전에 온몸이 대답한다. 그 사람의 손안에서 내 손이 흔들린다. 뒤에서 음악이 다시 시작된다.\n\n그 사람이 놓는다. 손가락의 자국이 내 손에 남는다."
 latria_sexual_frustration_flavor.1222.a: "홀 전체가 들을 수 있는 곳에서 내가 원하는 것을 말한다."
 latria_sexual_frustration_flavor.1222.b: "춤에 감사하고 사람들 사이로 물러난다."
 latria_sexual_frustration_flavor.1222.c: "문까지 함께 걸으며 말 이야기를 하자 청한다."

 latria_sexual_frustration_flavor.1223.t: "여울"
 latria_sexual_frustration_flavor.1223.desc: "우리는 말에게 물을 먹이려 여울에서 멈추고, 날이 더워 일행의 절반이 물에 든다. 나는 평평한 돌 위에서 셔츠를 벗어 비틀고 서 있다가, 아직 안장에 남은 이가 보고 있음을 알아차린다. 물이 돌 위에서 크게 소리 낸다. 말들이 마시며 발을 옮긴다.\n\n내가 붙들자 그 사람은 시선을 돌리지 않는다. 물이 내 갈비뼈를 타고 손목에서 떨어진다. 이 오후에 할 수 있는 일은 많고 그것을 할 숲은 통째로 있으며, 내 몸은 이미 정했고, 그래서 말들을 생각하기가 어렵다.\n\n그 사람이 말에서 내린다. 고삐는 아직 그 사람의 손에 있다."
 latria_sexual_frustration_flavor.1223.a: "셔츠를 떨어뜨리고, 보려는 이들 앞에서 그 사람에게 간다."
 latria_sexual_frustration_flavor.1223.b: "셔츠를 다시 입고 앞서 사냥집으로 말을 몬다."
 latria_sexual_frustration_flavor.1223.c: "매를 꺼내 일행이 준비될 때까지 손을 바쁘게 둔다."

 latria_sexual_frustration_flavor.1224.t: "두 기수와 풀"
 latria_sexual_frustration_flavor.1224.desc: "풀이 말을 감출 만큼 높고, 하늘은 비 전에 그러는 대로다. 우리는 무리가 방향을 튼 뒤로 나란히 타고, 지난 한 펄롱 동안 그 사람의 다리가 내 다리에 닿아 있으며, 어느 쪽도 고쳐 놓지 않았다. 바람에서 으깨진 줄기 냄새가 난다. 말들은 무릎까지 젖었다.\n\n여기에는 숨을 담도, 하루를 달려야 닿는 사제도 없다. 그것이 이 욕망을 더 단순하게 만든 적은 없다. 다만 더 크게, 땅이 더 넓은 만큼 크게 만들었고, 나는 이것이 어디로 가는지 모르는 척하기를 그만두었다.\n\n그 사람이 마루에서 말을 세우고 어깨 너머로 나를 본다. 첫 빗방울이 떨어진다."
 latria_sexual_frustration_flavor.1224.a: "그 사람의 손을 잡고 기다란 풀숲으로 데려간다."
 latria_sexual_frustration_flavor.1224.b: "고개를 끄덕이고 말을 돌려, 그 사람과 겨루어 수레로 돌아간다."
 latria_sexual_frustration_flavor.1224.c: "먼 기둥에 과녁을 세우고 팔이 떨릴 때까지 쏜다."

 latria_sexual_frustration_flavor.1225.t: "상자 안에서 한 말"
 latria_sexual_frustration_flavor.1225.desc: "나는 나무 상자 안에서 꿇어 앉아 소리 내어 말했다. 아무 말도 하지 않는 것보다 더했다. 격자 너머 사제는 숨을 삼키지도 꾸짖지도 않았다. 그 사람은 내 집안에 관한 물음을 하나 던지고 기다렸고, 나는 내 목소리가 답하는 것을 들었다. 성당에서 찬 돌 냄새가 난다.\n\n성당을 되짚어 걸으며 나는 얼굴이 여전히 뜨겁다. 그것은 부끄러움이 아니거나, 그것만은 아니다. 말해 버린 뒤 나는 그것 전체를, 대낮에, 제단 앞에서 다시 느낄 수 있고, 내 몸은 예의라는 것이 전혀 없다. 내 깃이 너무 조인다.\n\n그 사람은 아직 상자 안에 있다. 내가 지나갈 때 휘장이 움직인다."
 latria_sexual_frustration_flavor.1225.a: "상자로 돌아가 나머지를 들어 달라 청한다."
 latria_sexual_frustration_flavor.1225.b: "난간 앞에 꿇어 그 사람이 주는 속죄와 말을 받는다."
 latria_sexual_frustration_flavor.1225.c: "곁 통로에 앉아 마음이 가라앉을 때까지 그 사람의 가르침을 듣는다."

 latria_sexual_frustration_flavor.1226.t: "네 번째 경에 깨어"
 latria_sexual_frustration_flavor.1226.desc: "심장이 뛰고 허벅지가 축축하고 이불이 침상 발치로 걷어차인 채로 꿈에서 나온다. 꿈은 마구간 마당이었고 내 목에 손 하나가 있었으며, 나는 그것이 누구의 손인지 안다. 방은 차갑고, 내 입이 있던 자리의 베개가 젖었다.\n\n방은 잿빛이다. 그 안에 아무도 없다. 내 몸은 잿빛도 시각도 개의치 않는다. 그것은 꿈이 끝맺기를 원하고, 어떻게 끝맺을지 아주 분명하다. 나는 팔을 눈 위에 걸치고 무릎을 세운 채 누워 있다. 바닥은 아플 만큼 차갑다.\n\n처마의 새가 시작한다. 내 손은 이미 움직이고 있다."
 latria_sexual_frustration_flavor.1226.a: "끝맺고, 집안 사람들이 나를 잠든 것으로 보게 둔다."
 latria_sexual_frustration_flavor.1226.b: "일어나 옷을 입고 마구간으로 나가 몸이 시큰해질 때까지 일한다."
 latria_sexual_frustration_flavor.1226.c: "빛이 제대로 들 때까지 상 위의 편지를 읽는다."

 latria_sexual_frustration_flavor.1227.t: "내기"
 latria_sexual_frustration_flavor.1227.desc: "누군가 상 전체가 보는 앞에서 내가 원하는 이의 이름을 말하지 못한다는 데 말 한 필을 걸었다. 술은 좋고 불은 뜨겁고 내기는 어리석고 모두가 기다린다. 사냥개가 벤치 밑에서 멈추어 듣는다. 그 내기는 주교의 사람 앞에서 걸렸다.\n\n이름이 돌멩이처럼 내 입 안에 만져진다. 상 너머의 그 사람은 접시에 눈을 두고 나를 보지 않으며, 내 목덜미는 젖었다. 말하면 일요일까지 모든 홀에 퍼질 것이다. 누군가 불에 장작을 더 넣었다.\n\n집사가 내 잔을 다시 채운다. 상은 조용해졌다."
 latria_sexual_frustration_flavor.1227.a: "이름을 말하고, 홀이 원하는 대로 그것을 만들게 둔다."
 latria_sexual_frustration_flavor.1227.b: "웃고 벌을 치른 뒤 술을 더 청한다."
 latria_sexual_frustration_flavor.1227.c: "판을 벌여 내기를 건 사람을 이긴다."
 latria_sexual_frustration_flavor.1227.d: "이름이 있으면서 조금도 없는 시로 만든다."

 latria_sexual_frustration_flavor.1228.t: "혼담의 조건"
 latria_sexual_frustration_flavor.1228.desc: "나무 아래에서 혼인이, 사람들이 재물을 논하는 목소리로 논의된다. 그 일 당사자는 손을 모은 채 벽 곁에 서서, 서기가 그 사람의 값을 읽는 것을 듣는다. 우리 사이에서 벌이 라벤더를 뒤지고 아무도 쫓지 않는다. 서기의 목소리가 숫자에서 납작해진다.\n\n나는 지참금 문제를 정하라는 청을 받았다. 같은 줄을 네 번 읽었다. 내가 원하는 것은 점잖지 않고 종이 위에 없으며, 초록빛 외투를 입고 오후 내내 벽 곁에 서 있다. 그 초록빛 외투의 소맷부리는 찢겼다.\n\n서기가 펜을 들고 기다린다. 잎 하나가 상 위로 내려온다."
 latria_sexual_frustration_flavor.1228.a: "조건을 서둘러 정하고 서기와 그 집안 사람들을 물러가게 한다."
 latria_sexual_frustration_flavor.1228.b: "모든 줄을 두 번씩 읽고 아무것도 내주지 않는다."
 latria_sexual_frustration_flavor.1228.c: "서류를 안으로 가져가 맑은 머리로 정한다."
 latria_sexual_frustration_flavor.1228.d: "영지 장부를 정리하고 숫자가 나를 붙들게 둔다."

 latria_sexual_frustration_flavor.1229.t: "서기의 손"
 latria_sexual_frustration_flavor.1229.desc: "필사는 더디고 서고는 춥고, 나는 같은 낱말을 세 번 틀리게 썼다. 내 마음은 면에 있지 않다. 정오에 빵을 가져온 이의 입술에 있다. 두 책상 건너에서 누군가 막힌 코로 숨을 쉰다. 빵은 왔을 때 아직 따뜻했다.\n\n나는 서원을 했고 지켜 왔으며, 그것을 지킨 탓에 기도로 밀어내기 어려운 방식으로 내 몸을 자각하게 되었다. 내 손이 양피지 위에서 떨린다. 짧은 기도만큼 걸리는, 이것을 끝낼 방법이 있고, 나는 그것을 원한다.\n\n잉크가 틀린 글자 위에서 마른다."
 latria_sexual_frustration_flavor.1229.a: "한 오후 동안 서원을 치우고, 그 이유에 정직하게 군다."
 latria_sexual_frustration_flavor.1229.b: "서원을 붙들고 욕망이 스스로 타들어 가게 둔다."
 latria_sexual_frustration_flavor.1229.c: "그 대목을 다시 잡고 손이 흔들리지 않을 때까지 옮겨 적는다."

 latria_sexual_frustration_flavor.1230.t: "정원의 해질 녘"
 latria_sexual_frustration_flavor.1230.desc: "방이 더했으므로 나는 잠옷 차림으로 나왔다. 정원은 푸르고, 나방들이 라벤더에 있다. 하인들 쪽 별채에서 누군가 현악기를 서툴게, 같은 네 음을 자꾸 켠다. 풀이 실내화를 적셔 밑단이 무겁다.\n\n오늘 저녁 문에서 내 허리에, 인사 한 번의 길이만큼 가볍게 얹혔던 손이 아직 만져진다. 그것은 옅어지지 않았다. 밤새 더 커졌고, 음악은 도움이 되지 않으며, 내 살갗은 너무 작게 느껴진다. 나는 문에서 이 자리를 떠나지 않았다. 아마포를 뚫고 벤치가 차갑다.\n\n나는 돌벤치에 앉는다. 나방은 라벤더를 계속 뒤진다."
 latria_sexual_frustration_flavor.1230.a: "안으로 들어가 내가 하는 일을 음악이 덮게 둔다."
 latria_sexual_frustration_flavor.1230.b: "냉기가 잠옷을 뚫을 때까지 벤치에 머문다."
 latria_sexual_frustration_flavor.1230.c: "숨을 고르고 네 음을 세며, 정원이 그걸로 충분하게 둔다."

 latria_sexual_frustration_flavor.1231.t: "종 전에 깨어"
 latria_sexual_frustration_flavor.1231.desc: "이불이 바닥으로 걷어차이고 허리께 살갗이 축축한 채 종 전에 깬다. 잠옷은 허벅지를 감아 비틀렸다. 나는 꿈을 꾸었고, 그 꿈은 아직 내게 남아, 아래에 가라앉아 들리지 않는 온기다.\n\n그것은 한 주 내내 생각하지 않으려 조심해 온 그 얼굴이었다. 꿈에는 조심스러움이 없었다. 허리에 얹힌 손, 그 모양까지 만져지는 입술, 그리고 내가 무엇을 정하기도 전에 대답하는 내 몸. 나는 지금 깨어 있고, 그것은 멎지 않았다.\n\n나는 무릎을 당겨 안고 손바닥을 배에 평평하게 댄 채 누워 있고, 온기는 그 밑으로만 모인다. 종은 울리지 않았다. 내 숨은 빠르고 얕게 가고, 나는 그것을 늦추려 움직이지 않았다."
 latria_sexual_frustration_flavor.1231.a: "등잔을 끄고 내 손이 끝맺게 둔다."
 latria_sexual_frustration_flavor.1231.b: "가운을 펴고 돌아누워 종이 울릴 때까지 가만히 있는다."
 latria_sexual_frustration_flavor.1231.c: "온기가 붙든 것을 놓을 때까지 읽는다."

 latria_sexual_frustration_flavor.1232.t: "떨어진 기행"
 latria_sexual_frustration_flavor.1232.desc: "우리는 동트기 전부터 안장에 있고, 나는 앞의 기수에게서 눈을 떼지 않았다. 그 사람이 앉는 방식. 여울에서 돌아보고, 내가 곁으로 올 수 있게 속도를 늦추던 방식. 허벅지는 벗겨지게 쓸리고 입은 마르지만, 그것은 내가 자꾸 보는 이유가 아니다.\n\n사슴은 사라지고 몰이꾼은 젖은 숲으로 흩어졌다. 늦어도 아무도 이러쿵하지 않을 것이다. 나는 거리가 없어질 때까지 말을 몰아 무릎이 그 사람의 무릎을 찾고, 가죽이 삐걱이고, 어느 쪽도 고삐를 당겨 물러서지 않는다.\n\n그 사람이 소리에 돌아서서 기다린다. 숲은 떨어지는 물소리로 시끄럽다. 고삐에 쥔 내 손은 차갑고 나머지는 조금도 차갑지 않으며, 말은 내 밑에서 콧김을 뿜으며 선다."
 latria_sexual_frustration_flavor.1232.a: "남은 거리를 없애고, 숲이 그것을 지니게 둔다."
 latria_sexual_frustration_flavor.1232.b: "고삐를 당겨 혼자 말을 몰며 나를 다스린다."
 latria_sexual_frustration_flavor.1232.c: "말에서 내려 머리가 맑아질 때까지 젖은 길을 걷는다."

 latria_sexual_frustration_flavor.1233.t: "성인들이 지키는 시각"
 latria_sexual_frustration_flavor.1233.desc: "나는 손봐야 할 등불들을 두고 성당에 혼자 있다. 냉기가 돌바닥을 뚫고 올라오지만, 수단 밑에서 내 몸은 따뜻하고 깨어 있으며 예배에는 관심이 없다. 성인들은 나를 지나 닫힌 문을 본다.\n\n나는 이것을 식히려는 말을 안다. 문 곁 상자의 어둠 속에서, 그들의 죄에 남겨 둔 목소리로 남들 위에 말해 왔다. 내 위에 말하면 아무것도 하지 못한다. 욕망은 삼킨 숯처럼 갈비뼈 뒤에 앉고, 내 손은 시키지 않았는데도 제단 돌 위에 평평하게 얹혔다.\n\n냉기의 모서리가 손바닥을 아프게 할 때까지 누른다. 곧 종이 울린다. 내 손은 여전히 돌 위에 있고, 돌은 내 열을 가져가 더는 차갑지 않다."
 latria_sexual_frustration_flavor.1233.a: "그 욕망을 내 손으로 다스리고, 뒤에 용서를 청한다."
 latria_sexual_frustration_flavor.1233.b: "예배 내내 꿇어 있고 시간이 그것을 닳게 둔다."
 latria_sexual_frustration_flavor.1233.c: "이마를 찬 돌에 대고 그것이 나를 붙들게 둔다."

 latria_sexual_frustration_flavor.1234.t: "너무 오래 얹힌 손"
 latria_sexual_frustration_flavor.1234.desc: "의논이 물러가고 서재는 조용하다. 지난 한 시간 내내 나는 오직 한 가지만을 의식했다. 내 사절이 조약을 건네려 상 너머로 몸을 기울였을 때, 그 사람의 손이 내 손 위를 덮고 인장이 요구한 것보다 숨 한 번 더 머물렀다. 방에는 사람이 가득했다. 나는 그대로 두었다.\n\n나는 그 무게, 머물 이유가 없던 손바닥의 온기로 자꾸 돌아간다. 내가 같은 조항을 세 번 읽는 동안 촛불은 닳았다. 내 몸은 이것이 조약보다 값지다고 정했고, 그 문제에 내 의견을 물을 생각이 없다.\n\n그 사람의 반지가 내 손등에 자국을 남겼다. 나는 문질러 지우지 않았다. 밀랍이 고이고 문은 닫힌 채, 나는 그 조항을 네 번째로 읽는다."
 latria_sexual_frustration_flavor.1234.a: "그 사람을 다시 불러 그 손이 내게 한 일을 분명히 말한다."
 latria_sexual_frustration_flavor.1234.b: "혼자 밤 보초를 서며 철야가 나를 식게 둔다."
 latria_sexual_frustration_flavor.1234.c: "판을 벌려 그 그림이 옅어질 때까지 혼자 둔다."

 latria_sexual_frustration_flavor.1235.t: "음악이 돌 때"
 latria_sexual_frustration_flavor.1235.desc: "홀은 시끄럽고 술은 두 번 돌았다. 악사들이 시작하자 나는 춤으로 이끌리는 대로 두었고, 내가 만난 상대는 저녁 내내 보지 않으려 애쓴 그 사람이다. 그 사람의 손이 내 등에 얹히고, 얇은 천을 통해 손가락 하나하나가 만져진다.\n\n우리는 돌고, 또 돌고, 방은 촛불 연기와 빛깔로 흐려진다. 그 사람은 동작이 요구하는 것보다 조금 더 가깝게 나를 붙들고, 나는 고쳐 주지 않는다. 맥박이 귀에, 북보다 크게 울린다. 욕망은 어디서 왔는지 모르게 올라와 홀 전체 앞에서 내게 권리를 주장하고, 나는 아무 일도 없는 듯 웃고 있다.\n\n음악이 끝을 향해 느려진다. 그 사람의 손은 내 등에서 움직이지 않았고, 나는 물러서지 않았다."
 latria_sexual_frustration_flavor.1235.a: "악사들에게 한 곡을 더 청하고 그 사람을 더 가깝게 붙든다."
 latria_sexual_frustration_flavor.1235.b: "감사하고 인사하여, 동작이 다시 돌기 전에 물러난다."
 latria_sexual_frustration_flavor.1235.c: "그 사람과 함께 머물며 이 일 외의 모든 것을 이야기한다."

 latria_sexual_frustration_flavor.1236.t: "긴 불"
 latria_sexual_frustration_flavor.1236.desc: "불은 길고 붉은 불씨 자리까지 사그라들었고, 홀은 아무도 떠나지 않을 때의 그 소란스러움에 이르렀다. 스칼드 하나가 누군가의 조부에 관한 시를 짓고 있다. 털가죽, 벌꿀술, 사람들로 빽빽한 벤치의 따뜻한 자리.\n\n내가 원하는 그 사람이 내 옆에 앉아 팔을 벤치 등받이에 걸치고 나를 건드리지는 않는다. 나는 그 팔을 세 연절째 의식하고 있다. 문 밖에는 피오르가 검고 물에서 얼음이 내려온다. 내 무릎이 그 사람의 무릎에 닿아 있고 어느 쪽도 그것을 치우지 않았다.\n\n스칼드가 숨을 고르려 멈춘다. 내 뒤의 팔이 움직이지만 내려오지는 않는다."
 latria_sexual_frustration_flavor.1236.a: "한 연절을 청하고 내가 직접 노래로 답한다."
 latria_sexual_frustration_flavor.1236.b: "벤치에 인사하고 일어나 어둠 속으로 나간다."
 latria_sexual_frustration_flavor.1236.c: "그 사람을 향해 돌아앉아 불이 재가 될 때까지 이야기한다."

 latria_sexual_frustration_flavor.1237.t: "범람"
 latria_sexual_frustration_flavor.1237.desc: "홍수가 들판을 넘어섰고 공기는 마실 수 있을 만큼 걸쭉하다. 나는 정원에서 아마포를 입고 눈에는 콜, 손에는 연꽃 화환이 벌써 열기에 시들어 간다. 이시스 신전이 몇 걸음 떨어져 서늘한 돌을 지니고 있고, 나는 그 벽을 두 번 지나쳤다.\n\n따뜻한 어둠 속에서 손바닥을 위로 한 손이 내밀어진다. 서두르지 않는다. 귀뚜라미가 어찌나 우는지 집안 누구도 대답을 듣지 못할 것이다. 내 몸은 이미 낮고 끈질기게 대답했고, 그것은 내 예의를 기다리지 않는다.\n\n나는 그 손을 잡지 않았다. 연꽃이 내 손목에 물을 떨어뜨린다."
 latria_sexual_frustration_flavor.1237.a: "그 손을 잡고 내 집에 그 까닭을 밝힌다."
 latria_sexual_frustration_flavor.1237.b: "소매 속으로 손을 모아 혼자 안으로 든다."
 latria_sexual_frustration_flavor.1237.c: "등불이 켜질 때까지 물에 잠긴 길을 걷는다."

 latria_sexual_frustration_flavor.1238.t: "푸른 가지의 의례"
 latria_sexual_frustration_flavor.1238.desc: "의례가 끝나고 신전에는 아직 잘린 가지 냄새가 남아 있다. 문간에서 봄물이 축성되었고, 나는 나머지와 함께 몸까지 거룩하다 여겨졌다. 내가 자꾸 되돌아가는 부분이 바로 그것이다. 모든 기둥에 푸른 것이 걸려 있다.\n\n춤은 등불을 지나 계속되었고 나는 그 춤을 추었다. 그 여운이 아직 입에 남는다. 내 손목에 있던 손목, 한 번의 회전, 북. 내 몸은 그 축복을 허락으로 정하고 그 논리를 펴고 있다.\n\n기둥에서 물이 떨어진다. 누군가 아직 현관에서 웃고 있다."
 latria_sexual_frustration_flavor.1238.a: "의례의 그 말을 붙들고 내 손에 답하게 한다."
 latria_sexual_frustration_flavor.1238.b: "무릎 꿇고 북이 멎을 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1238.c: "의례의 본문을 읽으며 말이 붙들게 한다."

 latria_sexual_frustration_flavor.1239.t: "초원의 새벽"
 latria_sexual_frustration_flavor.1239.desc: "해가 뜨기 전에 우리는 가죽 부대에 든 쿠미스를 싣고 나선다. 하늘은 이 곳에서만 볼 수 있는, 어디에도 끝이 없는 그 푸른빛이다. 매 한 마리가 내 손목에 앉아 있고 풀은 벌레들로 시끄럽다. 수레를 떠난 뒤로 아무 말이 없다.\n\n한 기수가 능선에서 내 옆에 고삐를 당기고 더 가지 않았다. 두 말이 바람을 몰아쉬는 가운데 그 사람의 다리가 내 다리에 닿아 있고, 앞에는 하루 안에 사제도 벽도 없는 트인 땅이 있다. 그것이 이 욕망을 작게 만든 적은 한 번도 없다.\n\n매가 발을 옮긴다. 기수는 기다린다."
 latria_sexual_frustration_flavor.1239.a: "그 사람과 길을 틀어 풀에게 그것을 맡긴다."
 latria_sexual_frustration_flavor.1239.b: "고개를 끄덕이고 말을 몰아 그날의 일을 우리 사이에 둔다."
 latria_sexual_frustration_flavor.1239.c: "안장에 앉은 채 손이 가다듬어질 때까지 숨을 고른다."

 latria_sexual_frustration_flavor.1240.t: "채찍과 물"
 latria_sexual_frustration_flavor.1240.desc: "채찍은 내가 둔 벤치에 있고 찬물은 대야에 있다. 내 믿음은 몸을 순종으로 꺾어야 할 것이라 분명히 말한다. 나는 그 꺾임이 이루어진 적을 아직 찾지 못했다.\n\n나는 둘 다 써 보았다. 물은 놀라게 하고 어깨는 얼얼하며, 그 뒤에도 욕망은 갈비뼈 뒤에 그대로 남아 전혀 감명받지 않았다. 아무도 소리 내어 말하지 않는 부분이 그것이다. 채찍으로 쫓아낼 수 없다.\n\n대야가 바닥 돌에 물을 떨어뜨린다. 내 손은 벤치 위에서 가다듬어져 있다."
 latria_sexual_frustration_flavor.1240.a: "채찍을 치우고 욕망을 내 손으로 받아들인다."
 latria_sexual_frustration_flavor.1240.b: "채찍을 다시 들고 순종한다."
 latria_sexual_frustration_flavor.1240.c: "스승과 함께 읽으며 말이 더 커지게 한다."
