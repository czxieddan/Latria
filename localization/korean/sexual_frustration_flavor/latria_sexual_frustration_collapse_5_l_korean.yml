l_korean:
 latria_collapse_no_relief_tt: "성적 억압이 누그러지지 않았다."

 latria_sexual_frustration_flavor.1501.t: "아직 타오르는 등불"
 latria_sexual_frustration_flavor.1501.desc.dead: "단검이 손에서 미끄러져 떨어지자, 바닥에 부딪치는 소리에 문밖의 발걸음이 멎었다. 문이 열리고 누군가 곁에 쪼그려 앉아 내 이름을 부르더니, 뒤를 돌아 도움을 청하러 가라고 외쳤다. 등불은 제자리에 있는데도 다가온 사람의 얼굴이 잘 보이지 않는다.\n\n다 듣고 있다는 것을 알리고 싶어 입술을 움직였지만, 아무 소리도 나오지 않았다. 조금 전까지 혼자 거듭 되뇌던 말들이 이제는 한 문장도 온전히 떠오르지 않는다. 누군가 내 손을 잡고 눈을 뜰 수 있느냐고 묻지만, 나는 그 너머의 문만 바라볼 뿐이다.\n\n더 많은 발소리가 방 안으로 밀려든다. 소리가 나는 쪽으로 고개를 돌리려 하지만 문가의 사람들은 이미 흐릿해졌고, 마침내 등불마저 알아볼 수 없게 되었다."
 latria_sexual_frustration_flavor.1501.desc.survived: "눈을 떴을 때는 잠옷이 갈아입혀져 있었고, 상처도 정성껏 싸매져 있었다. 침대 곁에 있던 사람이 내가 눈을 뜬 것을 보고 막 나가려던 시종을 곧장 불러 세웠다. 누군가 소란을 알아채고 제때 문을 열고 들어왔다고 한다. 단검은 이제 치워졌다.\n\n몸을 일으키려 했지만 베개에서 벗어나기도 전에 통증 때문에 멈춰야 했다. 곁에 있던 사람이 이불 끝을 여미고 물을 마시겠느냐고 묻는다. 고개를 끄덕이면서도 시선은 책상 위의 부치지 못한 편지로 돌아간다. 종이 몇 장이 여전히 포개져 있고, 맨 위에는 여러 번 고쳐 쓴 호칭이 드러나 있다.\n\n물잔이 입술에 닿고, 나는 한 모금만 마셨다. 곁을 지키던 사람은 떠나지 않고 내가 다시 편히 누울 때까지 기다린 뒤 잔을 조용히 내려놓았다."
 latria_sexual_frustration_flavor.1501.desc.severe: "의식을 되찾자 가장 먼저 침대 곁에서 낮게 나누는 말소리가 들렸다. 이런 상처도 나을 수 있겠느냐는 물음에, 대답하던 사람은 잠시 망설이다 깨끗한 천을 더 가져오라고 했다. 누가 있는지 보려고 몸을 돌리려 했지만, 조금 움직이자마자 아파서 말이 나오지 않았다.\n\n단검은 더 이상 손 닿는 곳에 없고, 침대 옆 작은 탁자마저 멀리 옮겨져 있었다. 앉을 수 있게 부축해 달라고 했지만, 곁에 있는 사람은 베개만 높여 주고 당분간 누워 있으라고 권했다. 창밖의 빛은 이미 달라졌지만, 나는 여전히 뒤척이며 잠 못 이루던 밤들과 끝내 오지 않은 답장을 떠올린다.\n\n침구를 정돈하려는 손이 다가온다. 천천히 해 달라고 말하려 했지만, 말을 마치기도 전에 몸 아래 깔린 시트를 움켜쥐었다."
 latria_sexual_frustration_flavor.1501.a.dead: "눈앞이… 어두워진다…"
 latria_sexual_frustration_flavor.1501.a.survived: "아프다…"
 latria_sexual_frustration_flavor.1501.a.severe: "건드리지 마… 아프다…"

 latria_sexual_frustration_flavor.1502.t: "빈 잔"
 latria_sexual_frustration_flavor.1502.desc.dead: "잔은 이미 비어 있다. 침대 곁에 엎드린 채 문이 열리는 소리를 듣는다. 들어온 사람은 먼저 내 이름을 부르더니, 탁자 위의 물건을 보고는 문도 닫지 못한 채 돌아서서 도움을 외쳤다. 복도에서 누군가 뛰기 시작하고, 방 안으로 들어온 바람에 쓰다 만 편지가 흔들린다.\n\n마지막 문장을 절반밖에 쓰지 못했다는 것은 아직 기억난다. 깃펜은 종이 옆에 놓여 있다. 누군가 내 어깨를 받치고 무엇을 마셨느냐고 물으며, 조금만 더 버티라고 한다. 못다 한 말을 마저 적고 싶어 탁자를 바라보지만, 손은 눈앞에 늘어진 종이 귀퉁이조차 닿지 못한다.\n\n곁에 있는 사람은 여전히 나를 부르지만, 목소리는 점점 멀어진다. 편지의 글씨도 알아볼 수 없고, 대답 한마디도 하지 못했다."
 latria_sexual_frustration_flavor.1502.desc.survived: "마신 독약은 치명적이지 않았다. 눈을 떴을 때 방 안에는 맑은 물을 담은 대야가 놓여 있었다. 침대 곁에는 오랫동안 지켜본 사람이 앉아 있었다. 내가 눈을 뜨자 일어나 사람들을 부르고는 다시 돌아보며 이 방을 알아보겠느냐고 물었다.\n\n탁자 위의 잔은 치워졌고, 쓰다 만 편지는 책 아래 눌려 있다. 손을 뻗어 집으려다가 침대 가장자리로 조금 옮겨 가는 것조차 힘겹다는 것을 깨달았다. 곁을 지키던 사람이 물을 건네고 내가 다 마시기를 기다렸다가 편지를 누구에게 전하면 되겠느냐고 묻는다. 나는 드러난 반 줄의 글씨를 바라볼 뿐 대답하지 않았다.\n\n창밖에서는 벌써 사람들이 움직이기 시작했다. 평소 이 시각에 하던 일들이 떠오르지만, 베개에 기댄 채 시종들이 문밖에서 찾아온 사람들을 돌려보내는 소리를 들을 수밖에 없다."
 latria_sexual_frustration_flavor.1502.desc.severe: "독약은 내 목숨을 앗아가지 못했지만, 예전처럼 혼자 일어나는 일은 아직도 할 수 없다. 누군가 아침 식사를 가져오고 갈아입을 옷을 침대 곁에 놓는다. 손을 내밀고서야 늘 쓰던 그릇조차 이제는 제대로 들 수 없다는 것을 알았다.\n\n시종이 내 소매 끝을 정돈하고 음식을 한 입씩 먹여 준다. 얼마나 오래 누워 있었는지 물으려 했지만, 말을 하다 중간에 쉬어야 했다. 책상 위에는 새 편지가 몇 통 쌓여 있다. 시종이 읽어 주겠느냐고 묻자, 나는 먼저 그 익숙한 이름이 있는지 찾아 달라고 부탁했다.\n\n시종은 편지를 한 통씩 살펴보고 가만히 고개를 젓는다. 편지 더미를 바라보며 그릇을 조금 밀어 놓으려고 손을 들었지만, 그마저도 누군가 몸을 숙여 주기를 기다려야 했다."
 latria_sexual_frustration_flavor.1502.a.dead: "말이… 나오지 않아…"
 latria_sexual_frustration_flavor.1502.a.survived: "괴롭다… 물을 조금…"
 latria_sexual_frustration_flavor.1502.a.severe: "손조차 들 수 없다…"

 latria_sexual_frustration_flavor.1503.t: "강가에서"
 latria_sexual_frustration_flavor.1503.desc.dead: "강둑은 더 이상 보이지 않고, 멀리서 누군가 외치는 소리만 들린다. 조금 전까지는 내 이름을 부르는 것이 또렷했는데, 이제는 끊어지는 소리만 남았다. 그쪽을 바라보려 하지만 눈앞에서 흔들리는 빛 때문에 강둑의 나무를 알아볼 수 없다.\n\n거처를 나설 때 등불은 아직 꺼지지 않았던 것 같다. 책상 위의 책도 펼쳐져 있었다. 같은 쪽에서 한참을 머물렀는데도 나가기 전에 가름끈을 제대로 놓지 않았다. 누군가 방을 정리하러 와서 내가 어디로 갔는지 물을 것이다. 익숙한 얼굴이 떠올라, 여기 있다고 말해 주고 싶어진다.\n\n다시 외침이 들려오지만, 대답할 수 없었다. 눈앞의 빛이 어두워지고, 등불을 켜 둔 그 방조차 점점 또렷하게 떠오르지 않는다."
 latria_sexual_frustration_flavor.1503.desc.survived: "강에서 구조된 뒤 눈을 뜨니 강둑에 웅크리고 있었고, 누군가 망토로 나를 감싸 주고 있었다. 곁에 있던 사람은 내가 눈을 뜨자 급히 멀리 손짓을 보내고, 다시 쪼그려 앉아 말이 잘 들리느냐고 묻는다. 옷자락에서는 아직 강물이 떨어지고, 너무 추워서 대답할 수 없다.\n\n누군가 들것을 구하러 사람을 보냈으니 서둘러 일어나지 말라고 한다. 거처로 돌아가는 오솔길을 바라보며, 혼자 이곳에 걸어올 때도 거듭 곱씹던 말을 떠올린다. 곁에 있는 사람이 누구에게 알려야 하느냐고 묻자 이름 하나를 말하고는, 못 들었을까 봐 나직이 한 번 더 되뇌었다.\n\n망토가 다시 단단히 여며진다. 누군가 말을 전해 주겠다고 약속하고, 곁에 남은 사람은 내 어깨를 받치며 길에서 들려올 발소리를 함께 기다린다."
 latria_sexual_frustration_flavor.1503.desc.severe: "강둑으로 옮겨질 때의 일은 서둘러 돌아가자고 재촉하는 소리밖에 기억나지 않는다. 다시 눈을 떴을 때는 젖은 옷이 갈아입혀져 있었고, 침대 주위에는 몇 사람이 모여 있었다. 얼마나 오래 정신을 잃고 있었는지 묻고 싶었지만, 기침이 터져 나와 처음 부르던 호칭조차 다 말하지 못했다.\n\n침대 곁에서는 폐병 이야기를 낮게 나누고, 누군가에게 창문을 잘 닫으라고 한다. 이마의 천은 몇 번이나 바뀌었는데도 지금이 낮인지 밤인지 도무지 알 수 없다. 간간이 정신이 들면 익숙한 사람이 들어오기를 기다리며 문을 바라본다. 하지만 문가에는 물을 가져온 시종만 서서 필요한 것이 있느냐고 나직이 묻는다.\n\n나는 고개를 젓고 베개에 기대어 몸을 바로 세우려 한다. 침대 곁의 사람이 부축하려고 손을 뻗자마자, 아직 입 밖으로 내지 못한 말이 다시 기침에 가로막힌다."
 latria_sexual_frustration_flavor.1503.a.dead: "춥다…"
 latria_sexual_frustration_flavor.1503.a.survived: "아직… 살아 있는 건가?"
 latria_sexual_frustration_flavor.1503.a.severe: "숨을… 쉴 수 없어…"

 latria_sexual_frustration_flavor.1504.t: "절벽 아래"
 latria_sexual_frustration_flavor.1504.desc.dead: "절벽 아래 누운 채 산길을 따라 나를 찾는 사람들의 외침을 듣는다. 누군가는 내 이름을 부르고, 다른 누군가는 일행에게 더 아래를 찾아보라고 재촉한다. 작은 돌들이 근처로 굴러 떨어진다. 눈에 띄도록 손을 들고 싶지만 손은 몸 옆에 머문 채 옷자락조차 움직이지 못한다.\n\n산 그림자가 하늘 대부분을 가려 거처를 떠난 지 얼마나 되었는지도 기억나지 않는다. 나갈 때 누군가 언제 돌아오느냐고 물었고, 나는 무심코 시각을 하나 댔다. 이제는 무엇이라 대답했는지조차 떠오르지 않는다. 발소리는 점점 가까워진다. 입을 벌려 보아도 여전히 소리가 나오지 않는다.\n\n마침내 누군가 가까이 멈춰 서서 몸을 굽혀 나를 부른다. 다가온 사람의 얼굴이 보이지 않고, 머리 위에 남은 작은 하늘조차 알아볼 수 없다."
 latria_sexual_frustration_flavor.1504.desc.survived: "절벽 아래에서 눈을 뜨자 누군가 곁에 쪼그려 앉아 나를 부르고 있었다. 내가 반응하자 곁의 사람은 돌아서서 손짓하며 일행에게 산길을 따라 내려오라고 했다. 여기가 어디냐고 물으려는 순간 머리 위의 절벽이 눈에 들어왔고, 그 뒤로는 감히 다시 보지 못했다.\n\n추락하며 입은 상처 때문에 일어날 수 없고, 조금만 움직여도 멈추어 숨을 골라야 한다. 곁의 사람은 들것을 기다리라며 근처에 떨어진 겉옷을 주워 내 몸에 덮어 주었다. 옷의 여밈을 바라보며 나가기 전에 거울 앞에서 매만지던 일이 떠오른다. 그때도 마음에 걸린 것은 답이 오지 않은 초대였다.\n\n발소리가 곁까지 다가오고, 몇 사람이 나를 어떻게 들어 올릴지 낮게 의논한다. 돕고자 몸을 돌리려 했지만 움직이기도 전에 비명이 나왔다."
 latria_sexual_frustration_flavor.1504.desc.severe: "절벽 아래에서 눈을 뜨니 구조하러 온 사람들이 둘러서 있었지만, 아무도 먼저 입을 열지 않았다. 그중 한 사람을 알아보고 이제 돌아가야 하지 않겠느냐고 물었다. 곁의 사람은 겉옷을 잘 덮어 주고 산길을 바라보며, 들것을 가져오는 사람들에게 서두르라고 재촉했다.\n\n일어나려 하자 누군가 곧바로 붙잡고 움직이지 말라고 한다. 두 다리를 내려다보자 곁의 사람이 머뭇거리며, 앞으로는 예전처럼 걷지 못할 수도 있다고 말했다. 옆에 떨어진 신에는 아직 진흙이 묻어 있다. 그것을 바라보며 복도에서 답장을 기다리던 밤들을 떠올린다.\n\n누군가 더 필요한 것이 있느냐고 묻는다. 신을 주워 달라고 하려던 참인데, 입에서는 거처에 무슨 소식이 왔느냐는 말이 먼저 나왔다. 잠시 아무도 대답하지 않았다."
 latria_sexual_frustration_flavor.1504.a.dead: "아무 소리도 들리지 않아…"
 latria_sexual_frustration_flavor.1504.a.survived: "움직일 수가 없어… 아프다…"
 latria_sexual_frustration_flavor.1504.a.severe: "내 다리가…"

 latria_sexual_frustration_flavor.1505.t: "부서진 방문"
 latria_sexual_frustration_flavor.1505.desc.dead: "침실 문이 부서지듯 열릴 때, 누군가 다급하게 내 이름을 부르는 소리가 들렸다. 복도의 빛이 방 안으로 쏟아지고 몇 사람이 문가에 몰려들었다가, 앞에 선 사람의 재촉에 도움을 청하러 간다. 편지는 아직 침대 옆에 있다. 들어온 사람에게 알려 주고 싶지만, 시선조차 그쪽으로 돌릴 수 없게 되었다.\n\n누군가 다가온다. 너무나 익숙한 목소리여서 한마디라도 대답하고 싶어진다. 무슨 말인지 분명히 알아듣는데도 말이 나오지 않고, 앞에 있는 입이 끊임없이 움직이는 것만 보인다. 문밖에서 누군가 무언가를 물었지만, 내 곁에 몸을 숙인 사람은 돌아보지 않고 작은 반응이라도 기다린다.\n\n그 얼굴을 다시 또렷이 보고 싶지만 눈앞은 점점 어두워진다. 문가의 빛이 사라지고, 뒤이어 부르는 소리마저 들리지 않게 되었다."
 latria_sexual_frustration_flavor.1505.desc.survived: "침실 문이 부서지듯 열렸고, 나는 제때 구조되었다. 침대에 누워 보니 문빗장이 비뚤어져 있고, 시종은 의자를 가져다 문밖을 지키고 있다. 누군가 베개를 바로 놓아 주며 말을 할 수 있느냐고 묻는다. 나는 쉰 목소리로 한마디만 대답했다.\n\n밧줄은 사라졌고, 침대 곁에 있던 편지도 다른 곳으로 옮겨졌다. 편지를 찾으려고 돌아눕다가 상처 때문에 도중에 멈춰야 했다. 나를 돌보는 사람이 시선을 따라 편지를 가져다 잘 보이는 곳에 놓아 준다. 끝에 다 쓰지 못한 이름은 여전히 눈을 떼지 못하게 한다.\n\n나는 손을 들어 지금은 묻지 말아 달라는 뜻을 전한다. 곁의 사람은 고개를 끄덕이고 물을 가까이 놓은 뒤, 내가 조금 진정하기를 기다렸다가 이불을 덮어 주었다."
 latria_sexual_frustration_flavor.1505.desc.severe: "누군가 침대 곁에서 내 이름을 부른다. 대답을 기다린다는 것은 알지만, 무슨 말을 해야 할지 모르겠다. 침실의 물건들은 모두 본 적 있는 듯한데, 창가의 의자는 자리가 바뀐 것 같다. 누군가 내 소매를 바로잡아 줄 때까지 그것을 빤히 바라본다.\n\n누군가 몸을 씻기고 옷을 갈아입혀 준 뒤 음식을 가져온다. 다가오는 숟가락을 바라보다가 곁에서 일러 주고서야 입을 벌려야 한다는 것이 떠오른다. 누군가 그 편지 이야기를 꺼내자 다른 사람이 침대 곁의 상자를 흘끗 보았다. 나도 그쪽을 바라보고 막 물으려는데, 무엇을 묻고 싶었는지 잊어버렸다.\n\n상자 뚜껑은 이미 닫혀 있다. 침대 곁의 사람이 다시 내 이름을 부른다. 이번에는 고개를 돌렸고, 눈앞의 사람이 손을 멈추는 것이 보였다."
 latria_sexual_frustration_flavor.1505.a.dead: "나는…"
 latria_sexual_frustration_flavor.1505.a.survived: "숨 좀… 돌리게 해줘…"
 latria_sexual_frustration_flavor.1505.a.severe: "누가… 나를 부르는 건가?"
