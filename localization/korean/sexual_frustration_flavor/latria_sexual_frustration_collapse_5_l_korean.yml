l_korean:
 latria_collapse_no_relief_tt: "성적 억압이 누그러지지 않았다."

 latria_sexual_frustration_flavor.1501.t: "아직 타오르는 등불"
 latria_sexual_frustration_flavor.1501.desc.dead: "이제 문밖의 발소리도 알아들을 수 없다. 손에서 단검이 미끄러져 떨어진다. 누군가 문을 열고 들어와 내 이름을 거듭 부른다. 대답하려 하지만 눈앞이 점점 어두워져 끝내 등불조차 보이지 않는다."
 latria_sexual_frustration_flavor.1501.desc.survived: "단검은 내 목숨을 끊지 못했다. 소란을 들은 누군가가 달려와 나를 구했다. 상처에 붕대를 감고 잠옷 차림으로 침대에 누웠지만, 채우지 못한 갈망은 여전히 나를 괴롭힌다."
 latria_sexual_frustration_flavor.1501.desc.severe: "정신을 차렸을 때 단검은 사라지고 없었다. 누군가 침대 곁에 앉아 내 심한 상처를 두고 낮은 목소리로 이야기한다. 몸을 일으킬 수도 없건만, 나를 이 지경으로 몰아넣은 괴로움은 조금도 가시지 않았다."
 latria_sexual_frustration_flavor.1501.a.dead: "눈앞이… 어두워진다…"
 latria_sexual_frustration_flavor.1501.a.survived: "아프다…"
 latria_sexual_frustration_flavor.1501.a.severe: "건드리지 마… 아프다…"

 latria_sexual_frustration_flavor.1502.t: "빈 잔"
 latria_sexual_frustration_flavor.1502.desc.dead: "잔은 비었다. 침대 곁에서 누군가 들어와 다급하게 도움을 청하는 소리가 들린다. 편지는 아직 다 쓰지 못했는데 더는 펜을 쥘 수 없다. 목소리가 점점 멀어지더니 마침내 아무 소리도 들리지 않는다."
 latria_sexual_frustration_flavor.1502.desc.survived: "마신 독약은 나를 죽이지 못했다. 사람들에게 발견되어 치료받았지만, 여전히 침실에 누워 몸을 일으키지 못한다. 잔은 치워졌어도 나를 이리로 이끈 욕망은 남아 있다."
 latria_sexual_frustration_flavor.1502.desc.severe: "독약은 내 목숨을 살려두고 몸을 쇠약하게 만들었다. 나는 침대에 누워 남들이 물을 가져오고 옷을 정리해 주는 모습을 지켜본다. 이토록 오래 앓아도 욕망에서 벗어날 수는 없었다."
 latria_sexual_frustration_flavor.1502.a.dead: "말이… 나오지 않아…"
 latria_sexual_frustration_flavor.1502.a.survived: "괴롭다… 물을 조금…"
 latria_sexual_frustration_flavor.1502.a.severe: "손조차 들 수 없다…"

 latria_sexual_frustration_flavor.1503.t: "강가에서"
 latria_sexual_frustration_flavor.1503.desc.dead: "이제 강둑이 보이지 않는다. 멀리서 누군가 외치는 듯하지만 소리가 점차 흐릿해진다. 방에 켜두고 온 등불이 생각난다. 그 마지막 생각마저 사라진다."
 latria_sexual_frustration_flavor.1503.desc.survived: "누군가 강에서 나를 건져냈다. 눈을 뜨자 누군가 망토로 나를 감싸고 있다. 강가에서 떨며 집으로 돌아가기를 기다리는 동안에도 나를 이리로 이끈 갈망은 아프도록 또렷하다."
 latria_sexual_frustration_flavor.1503.desc.severe: "강물은 내 목숨을 앗아가지 못했다. 사람들이 나를 강둑으로 옮겼을 때는 열이 오르고 기침이 심해 말도 할 수 없었다. 그들은 폐병을 두고 소곤거린다. 정신이 들 때마다 같은 욕망이 되살아난다."
 latria_sexual_frustration_flavor.1503.a.dead: "춥다…"
 latria_sexual_frustration_flavor.1503.a.survived: "아직… 살아 있는 건가?"
 latria_sexual_frustration_flavor.1503.a.severe: "숨을… 쉴 수 없어…"

 latria_sexual_frustration_flavor.1504.t: "절벽 아래"
 latria_sexual_frustration_flavor.1504.desc.dead: "절벽 아래 누워 있자 산길을 따라 나를 찾는 사람들의 외침이 들린다. 목소리는 가까워지는데 대답할 수 없다. 눈앞의 산이 흐려지더니 더는 하늘조차 알아볼 수 없다."
 latria_sexual_frustration_flavor.1504.desc.survived: "절벽 아래에서 눈을 뜨니 누군가 곁에 쪼그려 앉아 내 이름을 부르고 있다. 떨어지면서 크게 다쳤지만 살아남았다. 들것을 기다리는 동안 같은 욕망이 다시 생각을 가득 채운다."
 latria_sexual_frustration_flavor.1504.desc.severe: "뛰어내리고도 살아남았다. 나를 찾은 사람들이 곁에 모였지만 누구도 내 눈을 마주하려 하지 않는다. 일어서려다가 예전처럼 걸을 수 없게 되었음을 알았다. 괴로움은 여전하다."
 latria_sexual_frustration_flavor.1504.a.dead: "아무 소리도 들리지 않아…"
 latria_sexual_frustration_flavor.1504.a.survived: "움직일 수가 없어… 아프다…"
 latria_sexual_frustration_flavor.1504.a.severe: "내 다리가…"

 latria_sexual_frustration_flavor.1505.t: "부서진 방문"
 latria_sexual_frustration_flavor.1505.desc.dead: "침실 문이 부서져 열리는 소리와 함께 누군가 다급하게 내 이름을 부른다. 편지가 침대 곁에 있다고 말하려 하지만 말이 나오지 않는다. 문간의 빛이 어두워지더니 더는 아무 소리도 들리지 않는다."
 latria_sexual_frustration_flavor.1505.desc.survived: "누군가 침실 문을 부수고 들어와 제때 나를 구했다. 이제 침대에 누워 있지만 상처 때문에 몸을 조금만 움직여도 힘겹다. 밧줄은 사라졌어도 나를 이리로 몰아넣은 괴로움은 떠나지 않았다."
 latria_sexual_frustration_flavor.1505.desc.severe: "누군가 거듭 내 이름을 부르는데 어떻게 대답해야 할지 모르겠다. 몸을 씻고 음식을 먹는 일도 남이 돌봐줘야 한다. 침실의 낯익은 가구들을 바라보지만 다음에 무엇을 해야 할지 떠오르지 않는다. 침대 곁의 편지는 상자에 들어갔다."
 latria_sexual_frustration_flavor.1505.a.dead: "나는…"
 latria_sexual_frustration_flavor.1505.a.survived: "숨 좀… 돌리게 해줘…"
 latria_sexual_frustration_flavor.1505.a.severe: "누가… 나를 부르는 건가?"
