l_korean:
 latria_sexual_frustration_flavor.1401.t: "봉인된 인장"
 latria_sexual_frustration_flavor.1401.desc.female: "잠옷을 걸치고 침대 곁에서 편지를 거듭 접는다. 서명은 없고 상대를 부르는 말도 지웠지만, 접힌 자국은 이미 감출 수 없을 만큼 깊다. 책상 모서리에는 데운 봉랍이 남아 있다. 인장만 누르면 오늘 밤의 속마음이 다른 이의 손에 들어갈 것이다.\n\n편지를 펼쳐 약속을 잡은 줄에서 멈춘다. 시각과 장소는 물론 어느 문으로 와야 하는지까지 분명히 적혀 있다. 낮에는 무심코 적은 잡담이라고 둘러댈 수 있었다. 하지만 지금은 전령이 복도에서 기다린다. 더는 마땅한 구실이 떠오르지 않는다.\n\n문밖에서 옷자락이 작게 스친다. 인장을 집어 들지만 다른 손은 여전히 편지 입구를 누르고 있다. 아무도 들어오라 부르지 않는다."
 latria_sexual_frustration_flavor.1401.desc.male: "잠옷 차림으로 침대 가장자리에 앉아 인장을 쥔다. 책상 위 편지는 마지막 줄까지 적혔고 잉크도 말랐지만, 서명할 자리는 비어 있다. 시종은 봉랍을 준비하고 창문까지 닫아 주었다. 왜 아직 쉬지 않느냐고 묻지 않고 나갔다.\n\n편지의 모든 문장을 알고, 받는 이가 어떻게 읽을지도 안다. 이름을 쓰고 인장을 찍으면 더는 이 초대를 한때의 농담이라 할 수 없다. 머릿속에서 수없이 고친 문장들이 종이 위에서는 피할 틈 하나 내주지 않는다.\n\n인장을 오래 쥐고 있었다. 방향을 바로잡고 문틈의 빛을 바라본다. 아직 전령을 부르지는 않는다."
 latria_sexual_frustration_flavor.1401.desc: "인장을 들었다 놓기를 반복하며 좀처럼 편지를 봉하지 못한다. 입구는 가지런히 접혔고 봉랍도 준비되었다. 책상에서 달리 할 일은 없다. 그런데도 종이 귀퉁이를 한 번 더 편다. 시간을 들여야 할 주름이라도 남은 듯이.\n\n그 말은 이미 적혀 있다. 아침에 편지를 나를 사람은 어디로 갈지만 물을 뿐, 보내야 하는지까지 대신 판단해 주지 않는다. 주소를 두 번 읽는다. 답장을 받을 수도, 아무런 답도 오지 않을 수도 있다고 생각한다.\n\n숟가락의 봉랍이 굳기 시작한다. 불 가까이 옮기는 동안 빈손은 다시 편지를 책상 위에 눌러 놓는다."
 latria_sexual_frustration_flavor.1401.a: "편지를 끝까지 쓰고 인장을 찍는다."
 latria_sexual_frustration_flavor.1401.b: "인장을 치우고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1402.t: "마지막 연회"
 latria_sexual_frustration_flavor.1402.desc.accepted: "연회가 끝나 가지만 사람들은 여전히 연인과 혼약, 지난날의 즐거움을 이야기한다. 망토를 여미다 돌아서서 이야기의 결말을 덧붙이는 이도 있고, 듣던 이들은 웃으며 시종에게 술을 더 청한다. 여기서는 그런 말 때문에 목소리를 낮출 필요가 없다.\n\n이미 일어섰다가 익숙한 지명을 듣고 다시 앉는다. 내게도 그곳의 옛일이 있지만 이렇게 가볍게 말해 본 적은 없다. 한마디 거들어 보자 옆 사람이 잔을 내려놓고 다음 말을 기다린다. 마음에 쌓아 둔 말이 갑자기 입가로 몰려온다.\n\n악사들은 현악기를 정리하고 있다. 주인은 홀의 문을 한번 바라보지만 나는 아직 의자 등받이의 겉옷을 집지 않았다."
 latria_sexual_frustration_flavor.1402.desc.strict: "연회에서 누군가 은밀한 정사로 지위를 잃은 귀족을 언급한다. 오가던 술병이 멈춘다. 한 사람은 가문을 묻고, 다른 사람은 그 혼사도 아마 깨질 것이라 낮게 말한다. 나는 말석에서 한 사람의 삶이 항목마다 판정되는 소리를 듣는다.\n\n내 이름은 나오지 않았다. 하지만 옆 사람이 왜 이렇게 조용하냐고 묻자 평소의 웃음조차 짓지 못한다. 술기운을 빌려 꺼내려던 속마음도 지금 입을 열면 다시 거둘 수 없을 것만 같다.\n\n시종이 빈 접시를 가지러 온다. 손을 비켜 주지만 잔은 계속 쥐고 있다. 마지막 한 모금을 좀처럼 마저 마시지 못한다."
 latria_sexual_frustration_flavor.1402.desc: "시종이 잔과 접시를 치우는 것을 보고서야 연회가 끝날 때임을 깨닫는다. 몇몇 손님은 문가에서 작별하고, 주인은 수레와 말을 묻는다. 내 앞의 술은 아직 절반도 줄지 않았다. 하고 싶던 말은 끝내 알맞은 틈을 찾지 못했다.\n\n옆 사람이 망토를 정리하며 함께 나가겠느냐고 묻는다. 그렇다고 대답한 뒤 다시 옛일을 꺼낸다. 이야기의 처음은 이미 했는데도 거기서부터 시작한다. 이 말만 제대로 하면 오늘 밤이 이렇게 끝나지는 않을 듯하다.\n\n상대의 손이 옷의 잠금쇠 위에서 멈춘다. 잔을 밀어 놓자 홀의 울림이 아까보다 훨씬 또렷하게 들린다."
 latria_sexual_frustration_flavor.1402.a: "마지막 손님들을 붙잡고 내 괴로움을 거듭 이야기한다."
 latria_sexual_frustration_flavor.1402.b: "생각을 억누르고 주인들에게 감사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1403.t: "증인 없는 고백"
 latria_sexual_frustration_flavor.1403.desc.favors: "혼자 제단 앞에 남아 마지막 시종이 조용히 문을 닫는 소리를 듣는다. 경전은 아직 받침대에 펼쳐져 있고, 육체의 쾌락을 다룬 쪽에는 책갈피 끈이 끼워져 있다. 이 가르침은 읽어 보았다. 신앙이 이 갈망을 죄로 여기라 요구하지 않는다는 것도 안다.\n\n그런데 곁에 아무도 없으니 어디서부터 말해야 할지 모르겠다. 낮에 준비한 질문들은 너무 빈틈없이 다듬어져 정작 계속 만나고 싶은 사람을 피해 간다. 한 문장을 다시 읊다 멈추고, 호칭 뒤에 숨겨 두었던 이름을 낮게 말한다.\n\n성소에서는 대답이 없다. 경전에서 손을 떼고 그대로 무릎을 꿇은 채 문 아래 점점 어두워지는 빛을 본다."
 latria_sexual_frustration_flavor.1403.desc.condemns: "혼자 제단 앞에 무릎을 꿇는다. 옷깃은 단정하지만 기도는 번번이 같은 곳에서 끊긴다. 마지막으로 나가던 시종이 등불을 남길지 묻자 고개를 끄덕였다. 이제 등불 하나와 다 읽지 못한 경전만 남았다.\n\n계율은 모두 기억하고, 어떻게 참회해야 하는지도 오래전에 익혔다. 하지만 욕망을 버리겠다는 대목마다 없애지 않은 편지가 떠오른다. 어디 두었는지 잊은 게 아니다. 방을 나서기 전, 다른 이가 뒤적이지 않을 책장 사이에 일부러 숨겨 두었다.\n\n재촉하는 사람이 없으니 오히려 다음 구절을 끝내기 더 어렵다. 밖에서 교대하는 발소리가 들린다. 고개를 숙이고 다시 첫머리부터 읽는다."
 latria_sexual_frustration_flavor.1403.desc: "성소의 발소리가 모두 흩어질 때까지 기다렸지만 제단을 떠나지 않는다. 긴 의자는 가지런하고 경전의 책갈피 끈은 받침대 옆으로 늘어져 있다. 문가에는 시종이 놓고 간 빈 잔이 하나 남았다. 아까 사람이 있을 때는 내 이야기를 입 밖에 낼 수 없을 것만 같았다.\n\n이제 사방에 아무도 없다. 그 속마음을 처음부터 풀어 보려 한다. 중간쯤 말하다가 또 익숙한 문장으로 감추고 있다는 것을 스스로 듣는다. 멈추고 문을 한번 올려다본 뒤 낮게 다시 말한다. 이번에는 그 사람의 이름을 빼지 않는다.\n\n빛이 무릎 앞에 떨어진다. 바로 일어나지 않고, 빈 성소에서 그 말이 천천히 잦아드는 것을 듣는다."
 latria_sexual_frustration_flavor.1403.a: "더는 금욕을 서약하지 않고 내 선택을 인정한다."
 latria_sexual_frustration_flavor.1403.b: "욕망을 억누르고 아침기도까지 무릎 꿇는다."

 latria_sexual_frustration_flavor.1404.t: "갈망에 이름을 붙이다"
 latria_sexual_frustration_flavor.1404.desc.lustful: "옷을 벗은 채 혼자 침실의 청동 거울 앞에 선다. 겉옷은 의자 등받이에 걸려 있고 시종은 물러갔으며 빗장은 내 손으로 걸었다. 거울 속 사람은 눈을 피하지 않는다. 나도 마침내 생각을 돌릴 자잘한 일을 급히 찾지 않는다.\n\n요즘 나는 그 사람을 만나고 싶은 마음을 피로라 부르고, 답답함이라 부르고, 연회 뒤의 불면이라 불렀다. 말을 바꿀 때마다 책상의 편지에는 한 줄씩 늘었지만 끝내 보내지는 않았다. 무엇을 기다리는지 알고, 아침마다 써 둔 말을 지우는 데도 지쳤다.\n\n책상에는 새 종이 한 장이 있다. 그것을 바라보며 처음으로 진지하게 생각한다. 첫머리에 그 많은 의례적인 인사가 아직도 필요할까."
 latria_sexual_frustration_flavor.1404.desc.chaste: "옷을 벗은 채 혼자 침대 가장자리에 앉아 두 손을 꼭 맞잡는다. 옷은 바로 옆에 있고 기도서도 치우지 않았다. 익숙한 구절을 읽고 쉬려 했으나 같은 줄에서 오래 멈춰, 창밖의 시각을 알리는 소리마저 한 번 잘못 셌다.\n\n여전히 맹세를 지키는 것은 누군가와 가까워지고 싶은 마음이 사라졌기 때문이 아니다. 그 사람의 이름이 떠오르자 잡념이 없다는 말로 더는 얼버무릴 수 없음을 안다. 맹세가 적힌 쪽을 펴고 평소보다 천천히 읽는다. 문장마다 정말 내 선택인지 가려 보고 싶다.\n\n책장이 손가락 사이에서 멈춘다. 문밖은 이미 조용하다. 책을 덮지도, 아직 읽지 않은 문장을 서둘러 마치지도 않는다."
 latria_sexual_frustration_flavor.1404.desc: "밤이 깊었다. 침실에 앉아 마침내 여전히 그 사람을 만나고 싶다고 인정한다. 책상의 편지는 몇 번이고 고쳤다. 매번 가장 중요한 문장은 지우고 날씨와 일정, 하찮은 인사만 남겼다.\n\n종이를 차례로 펼쳐 거의 똑같은 첫머리들을 본다. 글은 점잖지만 받는 이는 내가 왜 이토록 등불을 끄지 못하는지 끝내 모를 것이다. 오늘 밤 한 통 더 쓰더라도 호칭만 바꿔 놓고 일이 나아졌다고 할 수는 없다.\n\n빈 종이 옆에 펜을 놓는다. 창밖에서 다시 시각을 알리는 소리가 난다. 이번에는 그 소리를 핑계로 잠자리에 들라며 나를 재촉하지 않는다."
 latria_sexual_frustration_flavor.1404.a: "갈망을 인정하고 오늘 밤은 싸우기를 멈춘다."
 latria_sexual_frustration_flavor.1404.b: "다시 옷을 입고 생각을 억누른다."

 latria_sexual_frustration_flavor.1405.t: "연대기의 한 장"
 latria_sexual_frustration_flavor.1405.desc.emperor: "연대기 편찬자가 책상에 몸을 숙인 채 무엇을 남길지 내가 정하기를 기다린다. 나는 예복을 입고 그 뒤에 서 있다. 방금까지 구술한 포상과 징발의 잉크도 마르지 않았다. 내일의 의식 절차를 말하다 멈추고, 대신 아무도 기록하지 않는 긴 밤들을 꺼낸다.\n\n그의 펜은 곧바로 따라오지 않는다. 문가의 측근이 선 자세를 바꾼다. 모두 들었음을 안다. 낮에 평소처럼 신하들을 만나면 이 괴로움을 계속 침실 안에 둘 수 있으리라 생각했다. 하지만 편찬자가 그대로 적을지 묻자 필요 없다는 말이 예전처럼 쉽게 나오지 않는다.\n\n새 장이 펼쳐진다. 펜촉이 빈 곳에 떠 있고, 모두가 방금 한 말의 뒤를 기다린다."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "필경사가 책상에 앉아 이번 여정도 연대기에 적을지 묻는다. 나루와 숙소, 몇 차례의 지체를 말하자 차례대로 기록하고 고개를 들어 다음 지명을 기다린다. 짐 속에서 보내지 않은 편지가 내 손 옆으로 드러나 있다.\n\n비나 부러진 차축 때문이 아닌 머무름도 있었다. 어떤 사람을 다시 보려고 길을 돌아갔지만 진짜 까닭은 동료들에게 끝내 말하지 않았다. 이제 반듯하게 정리된 여정의 지명을 읽으니 오히려 빠진 것이야말로 이 길에서 가장 떨치기 어려웠던 일이라는 생각이 든다.\n\n필경사가 잉크를 묻힌다. 편지를 꺼내 펼치지는 않고 먼저 지도 옆에서 종이 귀퉁이를 편다."
 latria_sexual_frustration_flavor.1405.desc.clergy: "성직 예복을 단정히 갖추고 서기 앞으로 간다. 기부와 보수를 적으려던 서기는 내가 화제를 바꾸자 다른 종이를 꺼낸다. 책상 옆의 경전은 아직 펼쳐져 있다. 바로 낮에 다른 이들에게 풀이했던 대목이다.\n\n맹세도 욕망도 참이다. 한 번도 망설인 적 없는 사람인 양 나를 말하고 싶지는 않다. 또한 기록하는 순간 이 말들이 더는 나 혼자 되새길 것이 아니라는 점도 안다. 서기는 그 사람의 이름을 남길지 아주 낮게 묻는다. 문밖의 누군가가 사정을 알아챌까 두려워하는 듯하다.\n\n비어 있는 줄을 본다. 기도 구슬은 여전히 손목에 감겨 있다. 그것을 굴리는 것으로 이 질문을 피하지 않는다."
 latria_sexual_frustration_flavor.1405.desc.ruler: "서기관이 내 구술을 기다린다. 나는 예복 차림이고 옆에는 회의 때 쓴 인새도 놓여 있다. 그런데 공무를 마친 뒤 줄곧 마음에 눌러 두었던 사적인 일을 꺼낸다. 문가의 시종은 물러나지 않는다. 방이 갑자기 조용해진다.\n\n먼저 오래된 편지를 말하고, 이어 몇 번의 이루어지지 못한 만남을 이야기한다. 서기의 글씨는 아까보다 느려지고 모호한 대목마다 나를 올려다본다. 처음에는 점잖은 표현을 대신 골라 주길 바랐다. 하지만 내 말을 되풀이해 듣자 다른 이야기로 바뀌는 것은 원치 않게 된다.\n\n그가 옮겨 적은 반 장을 내민다. 종이를 받아 들고 처음으로 감추지 않고 적은 호칭에서 눈길을 멈춘다."
 latria_sexual_frustration_flavor.1405.desc: "오랫동안 감춘 속마음을 분명히 말하기로 하고 서기의 책상으로 간다. 그는 공문서를 옮기고 새 종이를 편 뒤 어디서부터 적을지 묻는다. 날짜 하나를 대다가 곧 멈춘다. 그때가 이 일이 정말 시작된 때는 아니기 때문이다.\n\n편지 한 통과 짧은 만남, 뒤이은 몇 번의 불면부터 다시 이야기한다. 펜이 종이 위를 조용히 지나가지만, 이 말들은 이제 다른 사람이 처음부터 끝까지 읽을 수 있는 것이 되었다. 서기는 판단하지 않는다. 말이 모호해질 때만 잠시 기다리며 빈칸을 남긴다.\n\n다 쓴 종이가 우리 사이에 놓인다. 제삼자에게 보여도 될지 그는 아직 내 지시를 기다린다."
 latria_sexual_frustration_flavor.1405.a: "사본을 퍼뜨려 모두 읽게 한다."
 latria_sexual_frustration_flavor.1405.b: "서기관에게 공무만 적게 하고 나머지 말은 삼킨다."

 latria_sexual_frustration_flavor.1406.t: "손님들이 떠날 무렵"
 latria_sexual_frustration_flavor.1406.desc.accepted: "마지막 손님들이 아직 연인과 혼약을 이야기한다. 내가 옛일을 꺼내자마자 자리 한쪽에서 작은 웃음이 난다. 그 사람은 잔을 들고도 무례하다고 여기지 않는 듯 웃으며 그 뒤의 일까지 말해 달라고 재촉한다.\n\n너무 오래 마음에 담아 온 일이 갑자기 술안주가 되자 잠시 말을 잇지 못한다. 옆 사람이 추측을 덧붙이고, 또 다른 이는 편지의 말로 농을 친다. 바로잡으려 입을 열지만 말할수록 조급해지고, 꺼낼 생각이 없던 세부까지 혀끝에 오른다.\n\n시종이 마지막 술병을 치우러 온다. 잔 가장자리를 누르고 있으니 누군가 뒷이야기를 기다리며 의자를 당기는 소리가 들린다."
 latria_sexual_frustration_flavor.1406.desc.strict: "은밀한 정사로 귀족이 지위를 잃었다는 소식이 자리에 전해질 때, 나는 아직 내 이야기를 끝내지 못했다. 옆 사람이 갑자기 낮게 무언가 묻고, 다른 이는 나를 보더니 짧게 웃는다. 방금까지 고개를 끄덕이던 사람은 이제 손의 냅킨만 정리한다.\n\n멈춰야 함을 안다. 하지만 이 침묵이 대신 내 이야기를 끝내도록 두고 싶지 않다. 그 추문과 무관하다고 밝히려 할수록 앞서 한 말에도 해명이 필요한 듯해진다. 문가에서는 벌써 손님들이 작별하지만 남은 이들 누구도 계속하라 재촉하지 않는다.\n\n잔을 조금 세게 내려놓는다. 시선들은 여전하다. 다음 말을 누구에게 할지 정해야 한다."
 latria_sexual_frustration_flavor.1406.desc: "손님들은 떠나려는데 나는 좀처럼 말을 마치지 못한다. 옛 편지를 언급하자 옆자리 사람들이 눈짓을 주고받고 자리 끝에서 작은 웃음이 난다. 말을 멈추고서야 앞의 몇 사람이 진작 식기를 놓고 내 말만 듣고 있음을 알아차린다.\n\n그 문장이 왜 중요한지 설명하려 했는데 또 한 번의 반복이 되고 만다. 예의 바르게 끄덕이는 이도, 문을 보는 이도, 잔 뒤로 웃음을 숨기는 이도 있다. 그 반응을 전부 보니 오히려 마음이 급해진다. 마지막 한마디만 더 하면 이해시킬 수 있을 것 같다.\n\n주인은 이미 일어섰다. 앞의 의자들은 그대로인데, 뒤에서는 파장하는 인사가 들려온다."
 latria_sexual_frustration_flavor.1406.a: "이야기를 계속하고 비웃는 자에게는 모두 앞에서 쏘아붙인다."
 latria_sexual_frustration_flavor.1406.b: "말을 멈추고 일행에게 인사하며 작별한다."

 latria_sexual_frustration_flavor.1407.t: "불을 끈 뒤의 기도"
 latria_sexual_frustration_flavor.1407.desc.favors: "잠옷을 걸치고 침대 곁에 앉아 기도서에서 육체의 쾌락을 말하는 쪽을 편다. 낮에는 평범하게 읽히던 가르침을 지금은 몇 번이고 되짚는다. 문은 잠겼고 밖의 사람들은 흩어졌으며 등잔에는 마지막 기름만 남았다.\n\n신앙은 내 갈망을 부정하라 하지 않는다. 하지만 답이 없는 그 마음을 어떻게 대해야 할지는 여전히 모르겠다. 하고 싶은 말을 나 자신에게 읽어 본다. 안부와 인사를 빼니 남은 문장이 너무 짧아서 오래 멈춘다.\n\n불꽃이 작아진다. 책갈피 끈으로 그 쪽을 표시하고도 바로 덮지 않는다. 다른 답을 찾아 또 넘기지도 않는다."
 latria_sexual_frustration_flavor.1407.desc.condemns: "잠옷의 옷깃을 모으고 정결의 맹세를 낮게 되뇐다. 심지는 짧아졌고 기도서의 글씨는 어둠 속에서 점점 알아보기 어렵다. 그래도 계속 읽는다. 한 곳 틀리면 첫머리로 돌아간다. 정확히 읽기만 하면 오늘 밤을 무사히 넘길 수 있을 듯이.\n\n하지만 중간쯤에서 그 사람이 낮에 했던 말이 다시 떠오른다. 맹세를 잊은 게 아니다. 다만 그때 왜 그토록 헤어지기 싫었는지도 잊지 않았다. 두 일을 나란히 놓으니 익숙한 답들이 갑자기 모두 부족해진다.\n\n등불이 꺼지려 할 때 손을 뻗어 불꽃을 감싼다. 다음 문장은 눈앞에 있다. 오래 보아도 아직 목소리는 나오지 않는다."
 latria_sexual_frustration_flavor.1407.desc: "방에는 꺼져 가는 등불 하나만 남았는데 아직 눈을 감지 못한다. 무릎의 기도서는 같은 쪽을 벌써 몇 번 읽었다. 창밖으로 야경꾼이 지나간다. 모퉁이에서 발소리가 끊겨도 나는 다음 소리를 기다린다.\n\n책을 조금 더 불 가까이 옮겨 아까 멈춘 곳을 찾는다. 그 줄에는 어려운 말이 없다. 왜 자꾸 읽지 못하는지 안다. 끝에 이를 때마다 낮에 분명히 물었어야 할 질문이 떠오른다. 이제 아무도 답할 수 없는데도 상대의 대답을 거듭 대신 헤아린다.\n\n바닥의 마지막 기름이 빛난다. 책갈피 끈을 끼우고 표지에 손을 둔 채 등불을 불어 끄지 않는다."
 latria_sexual_frustration_flavor.1407.a: "순결 서약을 접고 그 애정에 생각을 맡긴다."
 latria_sexual_frustration_flavor.1407.b: "생각을 억누르고 새벽까지 낭송한다."

 latria_sexual_frustration_flavor.1408.t: "거울 앞의 침묵"
 latria_sexual_frustration_flavor.1408.desc.lustful: "옷을 벗고 혼자 거울 앞에 선다. 침대 곁에는 낮에 벗은 옷이 있고 책상에는 반 장을 쓴 초대장이 있다. 전에는 늘 거울 앞에서 용모를 정돈하며 그 사람을 만나면 할 말을 생각했다. 하지만 막상 만나면 평범한 이야기만 했다.\n\n이런 되풀이는 충분히 오래 했다. 오래된 갈망을 우연히 떠오른 생각이라고 말하고 싶지 않고, 만날 때마다 상대가 먼저 말하기를 기다리고 싶지도 않다. 거울 옆에 눌러 둔 미완성 편지의 끝에는 분명한 한 문장을 보탤 자리가 있다.\n\n책상으로 돌아서 펜촉의 마른 잉크를 본다. 밖에서 재촉하는 사람은 없다. 이번에는 공무도 내 대신 대답해 주지 않는다."
 latria_sexual_frustration_flavor.1408.desc.chaste: "옷을 벗은 채 침대 가장자리에 앉아 두 손을 꼭 쥔다. 거울 옆의 옷은 가지런히 접혔고 맨 위에 기도서가 있다. 읽어야 할 장은 끝냈지만 익숙한 평온은 오지 않는다. 방이 조용할수록 그 마음을 지나치기 어려워진다.\n\n정결은 여전히 내 선택이다. 하지만 경전을 다 읽으면 다른 생각은 한 번도 하지 않은 듯, 지키기가 쉽다고 말하고 싶지는 않다. 내일 할 일을 머릿속에 늘어놓다가 그 사람을 만날 시각에 이르면 멈춰 다시 배열한다.\n\n거울 속 사람도 계속 앉아 있다. 꼭 쥔 손을 풀고 책상 옆의 펜을 본다. 이 망설임을 있는 그대로 적고 싶다."
 latria_sexual_frustration_flavor.1408.desc: "고요 속에서 거울의 나를 본다. 책상에는 다 쓰지 않은 편지가 펼쳐져 있다. 낮에 속마음을 가리던 미소는 이제 지을 필요가 없다. 침대 가장자리에 다시 앉아 짧았던 만남을 처음부터 떠올린다.\n\n어떤 말도 약속이라 할 수 없고, 누구도 계속 기다리라고 하지 않았다. 나중에 덧붙인 의미 가운데 얼마가 상대의 것이고 얼마가 내 것인지 마침내 하나씩 구분하려 한다. 그것을 안다고 갈망이 곧바로 사라지지는 않는다.\n\n종이를 등불 아래로 조금 옮긴다. 아직 쓰지 않은 그 한 줄만큼은 적어도 내 말로 분명히 해야 한다."
 latria_sexual_frustration_flavor.1408.a: "이 욕망을 인정하고 오늘 밤은 달아나지 않는다."
 latria_sexual_frustration_flavor.1408.b: "옷을 입고 책상에 앉아 생각을 억누른다."

 latria_sexual_frustration_flavor.1409.t: "궁정에서 잃은 평정"
 latria_sexual_frustration_flavor.1409.desc: "조회의 틈에 곁방에서 옷을 벗고 잠시 혼자 마음을 가라앉히려 한다. 겉옷은 아직 시종의 손에 있는데 회의장으로 통하는 문이 먼저 열린다. 소리에 고개를 들자 긴 탁자의 대화는 멈췄고, 몇몇 신하는 돌아보던 자세 그대로 굳어 있다.\n\n서기관은 눈을 내리고 쓰다 만 종이를 안쪽으로 당긴다. 문가의 사람들은 물러나려다 옷을 든 시종을 막을까 두려워 아무도 먼저 움직이지 않는다. 바로 말을 해야 하지만 나오는 목소리는 뻣뻣하고 준비했던 지시도 문장으로 이어지지 않는다.\n\n마침내 시종이 겉옷을 가까이 내민다. 탁자에는 미결의 업무가 여전히 펼쳐져 있다. 모두가 다음에 어떻게 할지 내 결정을 기다린다."
 latria_sexual_frustration_flavor.1409.a: "그들 앞에 서서 내 실수를 감추지 않는다."
 latria_sexual_frustration_flavor.1409.b: "제후들을 물리고 옷을 입은 뒤 자문회를 재개한다."

 latria_sexual_frustration_flavor.1410.t: "문 너머의 밤"
 latria_sexual_frustration_flavor.1410.desc.female: "잠옷을 걸치고 문가에 앉아 밖의 발소리가 차츰 멀어지는 것을 듣는다. 복도에서 누군가 열쇠를 돌려주고 낮게 밤 인사를 한다. 그중 한 사람을 불러 아침에 편지를 전해 달라고 부탁할 수도 있었다. 소리가 모두 사라져도 나는 입을 열지 않는다.\n\n답을 받지 못한 마음이 다시 눈앞에 온다. 책상의 초안에는 쓸데없는 말이 너무 많은데 정작 어떤 답을 바라는지는 분명하지 않다. 종이를 무릎에 올려 첫 줄부터 읽고, 나 자신도 믿지 않는 그 흔한 인사를 마침내 지운다.\n\n문밖이 완전히 조용해진다. 펜을 빈 곳으로 옮긴다. 아직 대지도 않았지만 이 편지는 전보다 오래 쓰게 될 것임을 이미 안다."
 latria_sexual_frustration_flavor.1410.desc.male: "잠옷을 걸치고 침대 머리에 기대 있지만 손 옆의 책은 한 쪽도 넘기지 않았다. 문밖이 고요해지고 등불은 같은 문단을 비춘다. 나는 낮에 너무 일찍 끝난 대화를 계속 생각한다. 헤어질 때 다음에 더 이야기하자고 했고, 상대도 예의에 맞게 답했을 뿐이다.\n\n다음이라는 말을 너무 많이 썼다. 매번 다음에는 분명히 말할 수 있으리라 믿다가 혼자가 되면 그 공손한 대답에 다른 뜻이 있었을지 짐작할 뿐이다. 책갈피를 한 쪽 앞으로 옮겼다가 앞의 쪽에 무엇이 적혔는지도 기억하지 못함을 깨닫는다.\n\n책상에는 아직 종이와 펜이 있다. 책을 덮어 무릎에 둔 채, 이미 어두워진 문 아래 틈을 바라본다."
 latria_sexual_frustration_flavor.1410.desc: "긴 밤은 아직 끝나지 않았다. 닫힌 방문 안에 앉아 먼 곳의 마지막 발소리가 떠나는 것을 듣는다. 책상의 편지는 미완성이고 침대 옆의 책도 펼쳐져 있다. 시간을 보내려던 두 일이 모두 중간에 멈췄다.\n\n써 둔 몇 줄을 나에게 읽어 준다. 문장은 어렵지 않지만 곳곳에 여지를 남긴다. 끝까지 읽어도 그 사람이 어떻게 답하기를 바라는지 알 수 없다. 계속 이렇게 써서 내일 보내면 기다릴 일이 하나 더 늘 뿐이다.\n\n새 종이를 꺼내 책 아래에 눌러 놓는다. 등불은 아직 밝다. 첫 줄을 어디에 써야 할지 알아볼 만큼은 충분하다."
 latria_sexual_frustration_flavor.1410.a: "책을 치우고 긴 편지를 쓴다."
 latria_sexual_frustration_flavor.1410.b: "갈망을 억누르고 등불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1401.c: "보내지 못하는 초대를 시로 적는다."
 latria_sexual_frustration_flavor.1402.c: "악사들에게 돈을 주고 남은 손님들을 위해 연주하게 한다."
 latria_sexual_frustration_flavor.1402.d: "손님들을 붙잡아 옛 여행 이야기를 나눈다."
 latria_sexual_frustration_flavor.1403.c: "경전을 펼치고 구절마다 답을 구한다."
 latria_sexual_frustration_flavor.1404.c: "순결 서약을 버리고 앞으로는 욕망을 따른다."
 latria_sexual_frustration_flavor.1404.d: "잠옷을 입고 생각이 가라앉을 때까지 앉는다."
 latria_sexual_frustration_flavor.1405.c: "기록을 사적인 편지로 고쳐 함에 봉한다."
 latria_sexual_frustration_flavor.1405.d: "이 증인들 앞에서 순결을 서약한다."
 latria_sexual_frustration_flavor.1406.c: "떠나는 손님들을 위해 새로운 시를 읊는다."
 latria_sexual_frustration_flavor.1407.c: "기도서를 덮고 내 마음을 천천히 헤아린다."
 latria_sexual_frustration_flavor.1408.c: "아침의 의무를 적고 서류를 모두 정리한다."
 latria_sexual_frustration_flavor.1409.c: "옷을 입고 탁자로 돌아가 궁정의 일을 하나씩 마친다."
 latria_sexual_frustration_flavor.1409.d: "옷을 입고 농담을 건네며 제후들을 다시 앉힌다."
 latria_sexual_frustration_flavor.1410.c: "겉옷을 걸치고 차를 끓여 잠들 수 있을 때까지 앉는다."
