l_korean:
 latria_sexual_frustration_flavor.1411.t: "문에 아무도 없다"
 latria_sexual_frustration_flavor.1411.desc: "등잔은 짧게 닳았고 나는 여전히 깨어, 잠옷은 허리를 지나 밀려 올라가고, 내 손은 아무에게도 말하지 않은 그 자리에 있다. 나는 이것을 안절부절이라 부르기를 그만두었다. 사흘째 밤, 나는 스스로를 가장자리까지 데려가 거기 두고, 복도에서 결코 오지 않는 발소리에 귀를 기울인다. 너무 오래 가만히 누운 자리의 이불이 축축하다.\n\n연회에서 그 사람이 내 의자 위로 몸을 기울이던 방식, 그 사람이 몸을 세우자 방의 온기가 함께 빠져나갈 만큼 가까웠던 것을 생각한다. 숨이 짧아진다. 나는 손바닥을 평평하게 눌러 가만히 있고, 욕망은 가라앉지 않고 다만 더 아래, 더 무겁게 모인다.\n\n아래 어딘가에서 문이 닫힌다. 내 손이 다시 움직이고, 이번에는 멈추지 않는다."
 latria_sexual_frustration_flavor.1411.a: "손이 시작한 것을 끝맺고 그 욕망을 인정한다."
 latria_sexual_frustration_flavor.1411.b: "손을 거두어 등잔이 죽을 때까지 가만히 누운다."
 latria_sexual_frustration_flavor.1411.c: "가운을 걸치고 고요와 함께 앉아 그것이 풀리기를 기다린다."

 latria_sexual_frustration_flavor.1412.t: "의도보다 더"
 latria_sexual_frustration_flavor.1412.desc: "홀은 마지막 술로 시끄럽고, 나는 이미 지나치게 말했다. 내 이웃이 그런 이야기를 어디서 배웠는지 묻고, 나는 말했고, 그다음 나머지, 대낮에 소리 내어 말한 적 없는 부분까지 말했다.\n\n누군가 웃고 더 달라고 한다. 나는 내 목소리가, 더 빨라져서, 언제나 빼두는 세부를, 그 시각과 문과 내가 기다리던 방식을 더하는 것을 듣는다. 술이 내 얼굴을 뜨겁게 했다. 뒤 어딘가에서 잔이 내려놓인다. 나는 조심스러운 사람이라면 멈출 자리에서 스스로를 멈추게 하지 못한다.\n\n이웃의 의자가 뒤로 긁힌다. 음악은 끝났고 아직 아무도 돌아가지 않았으며, 홀에서는 짐승 기름과 엎질러진 술 냄새가 나고, 나는 내려놓으려던 잔을 여전히 쥐고 있다."
 latria_sexual_frustration_flavor.1412.a: "나머지도 말하고 상 전체가 듣게 한다."
 latria_sexual_frustration_flavor.1412.b: "일행에게 인사하고, 나머지는 이빨 뒤에 두고, 간다."
 latria_sexual_frustration_flavor.1412.c: "이야기를 오랜 벗들로 돌리고 나머지는 술에 맡긴다."

 latria_sexual_frustration_flavor.1413.t: "같은 세 줄"
 latria_sexual_frustration_flavor.1413.desc: "나는 잠옷을 무릎 밑에 깔고 제단 앞에 꿇고, 천을 뚫고 돌이 차갑다. 돌바닥이 내 정강이의 온기를 가져갔다. 시종은 물러갔다. 나는 예배 전체를 읊었고, 내 입은 육신에 관한 그 세 줄로 자꾸 돌아가, 그 말이 내가 자꾸 지나치는 문이기라도 한 듯하다.\n\n대낮에는 이것을 시련이라 이름 붙이고 끝낼 수 있다. 여기, 촛불이 흔들리고 볼 이 없는 곳에서는, 내 안의 얼마가 신전을 떠나 교대 전에 어떤 집에 닿으려 하는지 가늠할 수 있을 뿐이다. 욕망에는 무게가 있다. 그것을 지고 내 무릎이 시큰하다.\n\n가장 가까운 촛불이 굽었다가 스스로를 바로 세운다. 나는 손을 찬 돌에 얹고 일어서지 않는다."
 latria_sexual_frustration_flavor.1413.a: "예배를 끝맺지 않고, 내가 가려는 곳으로 간다."
 latria_sexual_frustration_flavor.1413.b: "철야를 지키며 날이 밝을 때까지 그 말을 붙든다."
 latria_sexual_frustration_flavor.1413.c: "그 대목을 천천히 읽고 뜻이 돌아오게 둔다."

 latria_sexual_frustration_flavor.1414.t: "타는 것은 도움이 되지 않는다"
 latria_sexual_frustration_flavor.1414.desc: "우리는 동트기 전부터 안장에 있고 사슴은 여전히 우리 앞에 있다. 고삐에 쥔 내 손은 흔들리지 않는다. 그것이 문제다. 내 안의 나머지는 모두 흔들리고, 며칠째 그러했고, 타는 일은 그것을 다만 헐겁게 흔들어 놓았다.\n\n나는 지난 사냥의 그 사람을, 웃고, 여울에 젖은 머리를 한 그 사람을 자꾸 보고, 그 그림을 치울 수 없다. 사냥개가 소리를 낸다. 나는 말에게 고삐를 맡기고 땅이 빠르게 지나가게 두며, 몇 마만큼은 아무것도 생각하지 않는다.\n\n그다음 숲이 닫히고 속도가 떨어지고, 그 모든 것이 돌아온다. 나는 허벅지가 타는 채 안장에 앉아, 뿔피리 끈이 엉덩이에 새긴 자국을 두고, 그것을 들지 않는다."
 latria_sexual_frustration_flavor.1414.a: "행렬에서 벗어나 그 생각이 빠져나갈 때까지 탄다."
 latria_sexual_frustration_flavor.1414.b: "행렬을 지키고 뿔피리를 들어 사냥의 순서를 지킨다."
 latria_sexual_frustration_flavor.1414.c: "사냥개지기가 가리키는 땅을 읽고 자국을 따라간다."

 latria_sexual_frustration_flavor.1415.t: "문이 걸린 방"
 latria_sexual_frustration_flavor.1415.desc: "등잔은 낮고 문은 걸렸고, 일 년을 원해 온 그 사람이 여기, 내 방에, 옷을 벗고, 손을 내 가슴에 평평하게 얹은 채 있다. 그 사람의 손은 천을 통해 따뜻하다.\n\n나는 그 사람을 침상으로 당기고, 그 무게는 실재하고, 살갗의 열과 귀에 닿는 작은 소리가 있다. 침상 밧줄이 우리 밑에서 삐걱인다. 나는 이것을 너무 여러 번 상상하여, 아무 일도 일어나기 전에 그 사실만으로 거의 무너진다. 엉덩이가 들린다. 그 사람의 입이 내 목을 찾고, 나는 제 숨을 세기를 그만둔다.\n\n뒤에 등잔은 아직 타고, 밀랍이 받침을 따라 길게 흘러내렸다. 그 사람의 머리카락이 내 팔 위에 펼쳐져 있고, 어느 쪽도 아침에 관해 한 마디도 하지 않았다."
 latria_sexual_frustration_flavor.1415.a: "그 사람을 여기 두고, 집안이 말해야 한다면 말하게 한다."
 latria_sexual_frustration_flavor.1415.b: "그 사람을 제 방으로 돌려보내고 혼자 눕는다."
 latria_sexual_frustration_flavor.1415.c: "책을 집어 손이 가만해질 때까지 읽는다."

 latria_sexual_frustration_flavor.1416.t: "상 너머의 손목"
 latria_sexual_frustration_flavor.1416.desc: "의논은 길어지고 나는 아무것도 서명하지 않았다. 인장은 잉크 곁에서 식어 있다. 불은 꺼진 채 버려졌고 장작을 부르지 않았다. 내 서기가 다음 줄을 읽고, 나는 뜻 없이 말의 모양만 듣는다. 상 너머의 그 사람이 소매를 걷어 올렸고, 나는 그 사람의 손목을 보고 있기 때문이다.\n\n내 비밀을 아는 이가 내 눈을 붙든다. 나는 억지로 그 조항을 다시 읽어 달라 청한다. 다시 읽힌다. 나는 아무것도 이해하지 못한다. 상 밑에서 내 무릎이 움직이기 시작하고, 나는 손으로 눌러 가만히 둔다.\n\n영주들이 일어설 때 나는 방이 빌 때까지 앉아 있다. 그 이는 서류를 들고 문 곁에서 아무 말 없이 기다리고, 나는 고맙고, 그 사람을 볼 수 없다."
 latria_sexual_frustration_flavor.1416.a: "의논을 물러가게 하고 그 오후를 내게 쓴다."
 latria_sexual_frustration_flavor.1416.b: "자리를 지키고 서류를 받아, 그 이에게 고백한다."
 latria_sexual_frustration_flavor.1416.c: "서기를 다시 불러 일어서기 전에 모든 조항을 정한다."

 latria_sexual_frustration_flavor.1417.t: "같은 물음, 두 번"
 latria_sexual_frustration_flavor.1417.desc: "신전은 비었고 내 안내자는 두루마리를 정리하며 아직 여기, 나는 스스로를 떠나게 하지 못해 떠나지 않았다. 나는 의례에 관해 묻고, 그다음 또 물었으며, 둘 다 다른 옷을 입은 같은 물음이었다.\n\n안내자는 참을성 있게 답한다. 두루마리에서는 먼지와 삼나무 기름 냄새가 난다. 나는 손이 그 사이에서 움직이는 것을 보며, 밤의 그 시각과, 어떤 문까지의 거리와, 누가 깨어 있을지를 생각한다. 우리 사이 등잔만이 나를 자리에 붙들어 둔다.\n\n안내자가 두루마리 하나를 내 앞에 놓고 기다린다. 찬 단 위에서 내 무릎이 굳었다. 나는 두루마리에 손을 얹고 첫 낱말을 읽고, 두 번째는 읽지 않는다."
 latria_sexual_frustration_flavor.1417.a: "안내자에게 감사하고 걸어 나가, 그 문으로 간다."
 latria_sexual_frustration_flavor.1417.b: "그 의례를 천천히 한 번 더 짚어 달라 청한다."
 latria_sexual_frustration_flavor.1417.c: "두루마리를 펴고 안내자가 하는 말을 듣는다."

 latria_sexual_frustration_flavor.1418.t: "정원의 이름 하나"
 latria_sexual_frustration_flavor.1418.desc: "정원에는 사람이 가득하고, 나는 정직해질 만큼만 마셨다. 잔은 청하지 않았는데 두 번 채워졌다. 나는 그 말을 소리 내어 했다. 전부는 아니고, 이름이 든 부분을, 그리고 그 이름은 낯선 이의 것이 아니었다.\n\n웃음이 무리를 돌고, 누군가 그것을 되풀이하고, 다른 누군가는 새삼스러운 관심으로 나를 보았다. 자갈에 원이 옮겨 간 자리가 난다. 나는 그것을 술 탓으로 돌려 넘겼어야 했다. 대신 나는 더 말했고, 원은, 기억하기로 정한 원이 그러하듯 조용해졌다.\n\n시종이 쟁반을 들고 길을 따라 온다. 나는 원하지 않는 잔을 받아 침묵을 메우지 않으려고 입에 대고 쥔다."
 latria_sexual_frustration_flavor.1418.a: "그들 모두 앞에서 그 이름을 다시, 분명히 말한다."
 latria_sexual_frustration_flavor.1418.b: "인사하고 작별을 고, 정원을 떠난다."
 latria_sexual_frustration_flavor.1418.c: "가장 가까운 손님을 곁으로 데려 다른 이야기를 한다."

 latria_sexual_frustration_flavor.1419.t: "복도에서부터"
 latria_sexual_frustration_flavor.1419.desc: "나는 문을 걸고 이불을 걷었으며, 더는 피곤한 척하지 않을 작정이다. 내 몸은 오후부터, 복도에서 내 팔에 얹혔던 손 하나 뒤부터 이렇고, 가라앉지 않았다.\n\n나는 손가락을 제 몸에 대고, 내 숨은 남에게 들려주고 싶지 않은 방식으로 빠져나간다. 나는 복도, 그 소매의 아마포, 손가락의 정확한 압력을 생각한다. 내 등이 침상에서 아치를 그린다. 나는 다른 손으로 입을 막아야 한다.\n\n오래 걸리고 나를 떨게 남긴다. 등잔은 아직 켜져 있다. 나는 팔을 눈 위에 걸치고, 허리까지 비틀린 시트에, 아직 그날의 열 냄새가 남은 채 누워, 욕망은 사라지지 않고 다만 조용해졌다."
 latria_sexual_frustration_flavor.1419.a: "그것이 갈 대로 가게 두고, 피곤한 척을 그만둔다."
 latria_sexual_frustration_flavor.1419.b: "손을 쥐고 천천히 숨 쉬며 떨림이 지나기를 기다린다."
 latria_sexual_frustration_flavor.1419.c: "등잔 빛으로 한 면을, 몸이 조용해질 때까지 읽는다."

 latria_sexual_frustration_flavor.1420.t: "안장 위의 이틀"
 latria_sexual_frustration_flavor.1420.desc: "안장 위의 이틀, 초원은 끝없이 이어진다. 안장이 무릎 밑을 쓸어 상처가 났다. 내 말은 나보다 그 박자를 잘 안다. 우리는 진영을 떠난 뒤로 나는 제대로 자지 못했고, 나를 깨어 있게 하는 것은 내가 누운 땅이 아니다.\n\n나는 불 곁에서 머리를 땋던 그 사람, 실 끝을 깨물던 방식을 생각한다. 바람은 차갑고 손은 갈라졌고, 그래도 그 생각은 돌아와 내 아래에, 끈질기게, 두 번째 심장처럼 자리를 잡는다.\n\n우리는 마루를 넘고, 풀이 소리 없는 창백한 선인 강까지 내려간다. 나는 혼자 돌아설 수 있다. 말은 기다리며 내 밑에서 자리를 옮기고, 나는 고삐를 늘인 채 앉아, 돌리지 않는다."
 latria_sexual_frustration_flavor.1420.a: "진영으로 돌아가 밤이 주는 것을 취한다."
 latria_sexual_frustration_flavor.1420.b: "나머지와 함께 계속 타며 그 박자를 지킨다."
 latria_sexual_frustration_flavor.1420.c: "매를 놓아 물까지 그 비행을 따라간다."

 latria_sexual_frustration_flavor.1421.t: "조심스러움을 지나"
 latria_sexual_frustration_flavor.1421.desc: "연회는 누구도 조심하지 않게 되는 지점을 지나 이어졌다. 나는 저녁 내내 그 사람을, 한 번도 시선을 돌리지 않고 보았고, 방에, 멀리까지 닿는 목소리로 방금 그렇게 말했다.\n\n잔이 넘어간다. 악사들은 다시 시작하지 않았다. 누군가 웃고, 누군가 그 사람을 부르고, 나는 말이 아직 나오는 채로 일어서 있다. 나는 내가 원하는 시각과 장소를 댔고, 방이 그것을 들었다. 이것이 그저 농담으로 남는 내일은 없다.\n\n이웃이 내 소매를 당긴다. 다리가 분명치 않아 나는 앉고, 밀랍이 상을 가로질러 내 소매까지 흘렀고, 잔이 다시 내 손에 놓이며, 나는 여전히 상 너머를 보고 있다."
 latria_sexual_frustration_flavor.1421.a: "아무도 잘못 듣지 않도록 그 시각과 장소를 다시 말한다."
 latria_sexual_frustration_flavor.1421.b: "앉아 마시고, 소음이 내가 한 말을 덮게 둔다."
 latria_sexual_frustration_flavor.1421.c: "이웃에게 몸을 돌려 그 사람의 집안을 묻는다."
 latria_sexual_frustration_flavor.1421.d: "그 전부를 상에 바칠 시로 만든다."

 latria_sexual_frustration_flavor.1422.t: "사흘 밤의 철야"
 latria_sexual_frustration_flavor.1422.desc: "나는 사흘 밤을 연달아 철야로 지냈고, 단식은 내 머리를 가볍게 만들었다. 냉기가 발의 작은 뼈에 들었다. 예배의 말이 내 입에, 그 사람이 내 마음에, 둘은 갈라낼 수 없게 얽혔다.\n\n나는 서원이 무엇을 요구하는지 안다. 나는 기꺼이 그것을 말했고, 오늘 밤까지 마지못해 말한 적은 없다. 손은 차갑고 위는 빵이 무엇인지 잊었다. 무릎 아래 돌은 매끄러운 자리를 닳아 만들었고, 나는 마치 몇 년을 여기 꿇어 온 듯 거기에 맞는다. 정작 중요한 방식으로는, 나는 그렇다.\n\n어둠 어딘가에서 형제 하나가 헛기침하고, 기둥 뒤 벤치에서 누군가 자리를 옮긴다. 나는 고개를 더 숙이고, 기도는 내 목소리 없이 이어진다."
 latria_sexual_frustration_flavor.1422.a: "단식을 깨고 철야를 떠나, 내가 원하는 것을 인정한다."
 latria_sexual_frustration_flavor.1422.b: "단식을 지키고 밤의 나머지를 서원으로 버틴다."
 latria_sexual_frustration_flavor.1422.c: "영혼에 관한 대목으로 가서 끝까지 읽는다."

 latria_sexual_frustration_flavor.1423.t: "틀린 숫자"
 latria_sexual_frustration_flavor.1423.desc: "장부의 대조가 맞지 않고, 나는 같은 열을 네 번 읽었다. 촛불은 새것이고 밀랍은 아직 흘러내리지 않았다. 방 너머에서 누군가 서기에게 받아 적게 하고, 그 목소리는 군중 속에서도 알아들을 목소리이고, 내 마음은 그 열을 완전히 떠났다.\n\n나는 자리를 붙들려고 손가락을 면에 얹는다. 붙들리지 않는다. 서기의 펜은 계속 움직인다. 내 맥박이 목에서 만져지고, 그것은 우스운 일이고, 방은 차갑고, 나는 차갑지 않다.\n\n받아쓰기가 멈추자 나는 너무 빨리 고개를 든다. 서기가 기다린다. 나는 숫자를 다시 청하고 틀린 것을 적고, 그 위에서 잉크가 마르고, 나는 방이 빌 때까지 고치지 않는다."
 latria_sexual_frustration_flavor.1423.a: "장부를 치우고 그 목소리가 가는 곳으로 간다."
 latria_sexual_frustration_flavor.1423.b: "모든 숫자가 맞을 때까지 그 열을 붙든다."
 latria_sexual_frustration_flavor.1423.c: "원장을 가져오게 하여 첫 항목부터 하나씩 확인한다."

 latria_sexual_frustration_flavor.1424.t: "손대지 않은 술"
 latria_sexual_frustration_flavor.1424.desc: "문은 걸렸고 술은 손대지 않았고, 내가 원해 온 그 사람이 가운을 열고 손을 내 얼굴에 얹은 채 여기 있다. 그 사람의 손은 처음에는 차갑고, 그다음은 아니다.\n\n나는 그 사람을 제게 당기고, 그 모든 것은 내가 상상한 무엇보다 따뜻하고 서툴다. 그 사람의 무릎이 침상을 찾고 침상 틀이 한 번 벽에 부딪힌다. 내 손은 그 사람의 허리께로, 그 아래로 가고, 그 사람이 내는 소리는 조용하지 않으며, 나는 누가 듣든 개의치 않는다. 나는 오래 기다린 만큼 떨고 있다.\n\n뒤에 등잔은 닳았고 잔 속 술은 미지근해졌다. 그 사람의 머리는 내 어깨에, 그 밑에서 내 팔은 저리고, 나는 그 사람의 숨을 듣고 있다."
 latria_sexual_frustration_flavor.1424.a: "그 일 년의 기다림이 내게 무엇을 앗아 갔는지 분명히 말한다."
 latria_sexual_frustration_flavor.1424.b: "물러나 가운을 펴고, 손을 제게 둔다."
 latria_sexual_frustration_flavor.1424.c: "가만히 누워 낮은 등잔 빛으로 잠이 올 때까지 읽는다."

 latria_sexual_frustration_flavor.1425.t: "부지런한 손"
 latria_sexual_frustration_flavor.1425.desc: "나는 사흘을 숲에서 보냈고 사냥은 좋았고, 그 무엇도 내 안의 이것에 닿지 않았다. 나는 부지런하다. 나머지보다 먼저 일어나고, 장비가 마르는 것을 보고, 사냥개지기가 정한 자리를 지킨다. 내 손은 시키는 대로 한다.\n\n나머지는 딴 곳에 있다. 나는 어떤 오후, 문간, 잊지 못한 방식으로 내 이름을 부르던 사람을 기억하고, 그 기억은 등자 위에 설 때, 또 손에 가죽 냄새를 묻히고 짐승을 손질할 때 온다.\n\n불은 낮고 숯은 식으며 타닥인다. 팔은 그날의 일로 시큰하고, 나는 등을 대고 눈을 뜬 채 누워 말들이 자리를 옮기는 소리를 듣는다."
 latria_sexual_frustration_flavor.1425.a: "그 자리를 떠나 어둠 속으로 그 밤색 말을 끌고 나간다."
 latria_sexual_frustration_flavor.1425.b: "숨을 고르고 배띠를 조이고 그날의 일을 끝낸다."
 latria_sexual_frustration_flavor.1425.c: "잠들기 전에 장비가 마른 것과 셈이 맞은 것을 본다."

 latria_sexual_frustration_flavor.1426.t: "한 면 반"
 latria_sexual_frustration_flavor.1426.desc: "서재는 조용하고, 내 안내자가 본문을 펼쳐 놓았고, 나는 한 면 반을 한 마디도 받아들이지 않고 읽었다. 엄지가 여백에 자국을 남겼다. 등잔은 좋다. 밤은 길다. 내가 있어야 할 곳은 없다.\n\n나는 집안이 잠들고 복도가 비는 시각을 자꾸 생각한다. 안내자가 면을 넘기고 내가 논리를 따라가는지 묻는다. 나는 그렇다고 한다. 나는 영혼의 본성에 관한 첫 행 뒤로 그것을 따라가지 않았으니, 그것이야말로 내가 가장 필요로 하는 행이어서 안타까운 일이다.\n\n안내자가 펜을 들고 기다리고, 의자에는 내가 움직일 때마다 불평하는 이음이 있다. 나는 면을 보고, 내 손은 나무 위에 평평하게, 아주 가만히, 마치 더 차분한 누군가의 것처럼 놓여 있다."
 latria_sexual_frustration_flavor.1426.a: "책을 덮고 복도가 빈 동안에 나간다."
 latria_sexual_frustration_flavor.1426.b: "자리를 지키고 그 면을 처음부터 다시 읽는다."
 latria_sexual_frustration_flavor.1426.c: "안내자에게 그 논리를 한 번 더 짚어 달라 청한다."

 latria_sexual_frustration_flavor.1427.t: "술에 후한 밤"
 latria_sexual_frustration_flavor.1427.desc: "나는 술에 후했고 일행도 내게 후했고, 그 어딘가에서 나는 상에 내가 원하는 것을 말했다. 분명하지 않게. 충분히 분명하게. 여기, 내가 이름을 댄, 그러나 말하는 동안 얼굴을 보지 않은 사람이 있다.\n\n누군가 웃기를 그만두었고, 개가 벤치 밑에서 무언가를 물고 늘어진다. 내 잔은 비었고 시종이 채우고 나는 둔다. 방은, 건네받은 것을 어떻게 할지 정하는 사람들의 정적을 지녔다.\n\n오늘 밤 내 누이의 자리는 비었고, 그 사람의 잔은 시종이 놓은 그 자리에 그대로, 그것은 내가 누릴 자격 없는 자비다. 나는 두 손을 상에 얹고, 나무는 서늘하고, 음악이 홀 저쪽에서 다시 시작된다."
 latria_sexual_frustration_flavor.1427.a: "이름을 넣어 한 번 더 말하고, 집안이 듣게 한다."
 latria_sexual_frustration_flavor.1427.b: "일행에게 감사하고 망토를 들고 간다."
 latria_sexual_frustration_flavor.1427.c: "모두의 잔을 채우고 이야기를 추수로 돌린다."
 latria_sexual_frustration_flavor.1427.d: "가장 떠들썩한 손님과 농담을 주고받아 방이 넘어가게 한다."

 latria_sexual_frustration_flavor.1428.t: "성상들이 보고 있다"
 latria_sexual_frustration_flavor.1428.desc: "신전은 춥고 성상들이 모두 보고, 나는 한 시간째 움직이지 않았다. 무릎은 저려졌다. 욕망은 아니다. 그것은 덮이지 않는 숯처럼 내 안에 앉는다. 촛불 연기는 바람 없이 곧게 올라간다.\n\n나는 놓아 줌을 위해 기도했고 힘을 위해 기도했으며, 여기서는 어느 쪽에 답이 오기를 원하는지 알 만큼 정직하다. 그 사람의 얼굴이 나와 금빛 사이로 떠오른다. 나는 밀어내지 않는다. 등잔에서는 기름 냄새가, 대리석은 차갑고, 내 몸은 어느 쪽에도 관심이 없다.\n\n사제의 발소리가 뒤로 지나간다. 나는 고개를 숙이고 손을 모은 채, 무릎이 돌에 젖은 자국 둘을 남기고, 마음은 도시 건너편의 한 문간에 있다."
 latria_sexual_frustration_flavor.1428.a: "일어나 도시를 가로질러, 성상들이 보초를 서게 둔다."
 latria_sexual_frustration_flavor.1428.b: "서원을 붙들고 예배가 끝날 때까지 대리석 위에 머문다."
 latria_sexual_frustration_flavor.1428.c: "책을 시편에서 펴, 말이 붙들릴 때까지 읽는다."

 latria_sexual_frustration_flavor.1429.t: "한여름의 담"
 latria_sexual_frustration_flavor.1429.desc: "이 시각의 정원은 누구의 것도 아니고, 나는 침상이 더했으므로 그 안에 있다. 밤은 따뜻하다. 자갈 길은 낮의 열을 지녔다. 어딘가에서 분수가 흐르고, 그것이 정원의 유일한 목소리이며, 약초 냄새는 맛볼 수 있을 만큼 강하다.\n\n나는 두 밤을 자지 못했다. 나는 길을 걷고 자갈은 시끄럽고, 돌 때마다 나는 같은 담으로 돌아온다. 한여름에 그 사람과, 아무 말 없이, 우리 둘 다 알면서 기대어 섰던 그 담으로.\n\n내 손은 돌 위에 있다. 아직 따뜻하다. 나방이 등 뒤의 등잔으로 자꾸 돌아온다. 나는 이마를 담 가까이 두고, 숨이 고르지 못한 채 서 있고, 분수는 계속 흐른다."
 latria_sexual_frustration_flavor.1429.a: "문 밖으로 걸어 나가 그것을 밤에 말한다."
 latria_sexual_frustration_flavor.1429.b: "서원을 지키고, 담에서 손을 떼어, 안으로 든다."
 latria_sexual_frustration_flavor.1429.c: "하늘이 잿빛이 되고 다리가 지칠 때까지 그 길을 걷는다."

 latria_sexual_frustration_flavor.1430.t: "차가운 현"
 latria_sexual_frustration_flavor.1430.desc: "집이 잠들었고 더는 누워 있을 수 없어, 나는 악기를 꺼냈다. 현은 차갑고, 피크는 한쪽이 얇게 닳았다. 나는 언제나 연주하는 것을 연주하지만 그것은 충분하지 않고, 일주일째 충분하지 않다.\n\n내 손가락은 그 짜임새를 알고, 나머지는 전혀 딴 곳에, 덧문이 아직 닫힌 방, 내가 자꾸 돌아가는 그 오후에 있다. 음들은 어둠으로 나가고 아무도 듣지 않는다.\n\n나는 손을 현 위에 평평하게 얹어 소리를 죽이며 멈춘다. 그 뒤의 침묵이 더하다. 나는 무릎에 악기를 걸치고 앉아, 현은 추위에 늘어지고, 머리는 의자에 젖혀지고, 창은 가장자리가 잿빛이 된다."
 latria_sexual_frustration_flavor.1430.a: "서툴게, 온 집이 들을 때까지 끝까지 연주한다."
 latria_sexual_frustration_flavor.1430.b: "악기를 내려놓고 밤의 나머지를 앉아서 견딘다."
 latria_sexual_frustration_flavor.1430.c: "판을 벌려 빛이 올 때까지 양쪽을 다 둔다."

 latria_sexual_frustration_flavor.1431.t: "어둠 속의 솔기"
 latria_sexual_frustration_flavor.1431.desc: "촛불은 한 시간 전에 흔들렸고 나는 이불을 끌어 올리지 않았다. 잠옷은 허리께로 뭉쳐 있다. 내 손가락은 그 솔기를 찾아, 그다음 그 밑으로, 복도가 조용할 때 스스로 가르쳐 온 대로 느리게 들어갔다. 나는 눈을 감고, 지난주 내 술을 따르던 집사를, 그 사람의 소매가 내 손목을 스치고 숨 한 번 더 머물던 방식을 떠올린다.\n\n숨이 걸려 멎는다. 손을 움직이자 욕망이 더 조이고, 더 아래로, 양쪽에서 당겨진 매듭이 된다. 나는 귀 가까이 있던 그 사람의 입술을, 끝맺지 않은 그 사람의 말을 생각한다. 손바닥 밑의 아마포는 따뜻하고 축축하다.\n\n복도에서 널이 삐걱인다. 내 손이 멎었다가 다시 시작되고, 나는 그대로 두고, 어둠은 내 비밀을 조금 더 지녀 준다."
 latria_sexual_frustration_flavor.1431.a: "어둠 속에서 끝맺고 그 굶주림을 제 것으로 인정한다."
 latria_sexual_frustration_flavor.1431.b: "손을 거두어 심지가 잠길 때까지 뻣뻣하게 누운다."
 latria_sexual_frustration_flavor.1431.c: "이불을 감고 그 아픔이 느슨해지기를 기다린다."

 latria_sexual_frustration_flavor.1432.t: "끝맺지 못한 저녁 기도"
 latria_sexual_frustration_flavor.1432.desc: "예배당은 비었고, 나는 잠옷 차림으로 찬 돌 위에 꿇어, 기도가 얇아지고 떠돈다. 지난번 내 고해를 들은 사제가 숙인 내 머리에 손을 얹고 그대로 두었고, 나는 그 무게를 아직 내려놓지 못했다. 손바닥이 얇은 천을 통해 허벅지를 누르고, 그 누름은 기도가 아니다.\n\n나는 무릎을 옮긴다. 돌이 아마포를 통해 충격처럼 온다. 나는 그 손, 그 온기, 정신을 차리기 전에 조금 기울었던 나를 생각한다. 아치 아래 고요 속에서 숨이 거칠어지고, 나는 더 세게 누르며, 빌러 온 그 놓아 줌을 찾고 찾지 못한다.\n\n종줄이 내 위에 가만히 걸려 있다. 나는 어두운 제단에 얼굴을 들고, 손을 그 자리에 둔다."
 latria_sexual_frustration_flavor.1432.a: "기도가 물려 준 것을 몸이 받게 둔다."
 latria_sexual_frustration_flavor.1432.b: "손을 모아 쥐고 날이 밝을 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1432.c: "책을 펴, 말이 나를 식힐 때까지 읽는다."

 latria_sexual_frustration_flavor.1433.t: "고사리 자리"
 latria_sexual_frustration_flavor.1433.desc: "사냥은 해질 녘에 흩어지고, 말은 곁에서 풀을 뜯는 채 나는 푸른 어둠에 혼자다. 나는 이끼 낀 줄기에 기대 미끄러져 앉고, 승마복은 땀에 젖었다. 나를 쫓는 기억은, 여울 너머로 나를 들어 올리려 허리를 붙들었던 사냥개지기, 내 등에 단단히 닿은 가슴, 내 목에 닿은 숨이다. 내 손은 허리띠 안으로 미끄러졌다.\n\n나는 누르고, 나무껍질이 어깨를 문다. 나는 그 사람의 팔을, 곧바로 놓지 않던 방식을 생각한다. 내 숨이 찬 공기에서 연기가 된다. 욕망은 느린 손길마다 더 단단히 감기고, 숲은 나를 둘러싼 침묵을 지키며, 잎이 보이지 않는 곳 어딘가에서 물을 떨어뜨린다.\n\n가지가 부러진다. 내 손이 얼어붙는다. 말이 머리를 들고, 나는 맥박이 귀에 크게 울리는 채 나무에 기대어 머문다."
 latria_sexual_frustration_flavor.1433.a: "이 나무에 기대 여기서 그 날을 무르게 한다."
 latria_sexual_frustration_flavor.1433.b: "손을 거두어 그것이 지나갈 때까지 천천히 숨 쉰다."
 latria_sexual_frustration_flavor.1433.c: "일어나 나무 사이로 말을 끌고 돌아간다."

 latria_sexual_frustration_flavor.1434.t: "보내지 않은 서찰"
 latria_sexual_frustration_flavor.1434.desc: "서재의 불은 낮고, 보내지 않을 편지가 손 밑에 반쯤 쓰인 채 놓여 있다. 나는 마지막으로 적은 줄을 읽는다. 정직한 줄, 지나치게 정직한. 다른 손은 어느새 내 허벅지 끈으로 기어갔다. 나는 같은 이 상을 두고 너무 가까이 서서, 지도 대신 내 얼굴을 읽고 웃던 사절을 생각한다.\n\n나는 끈을 풀어 늦춘다. 숨이 짧아진다. 나는 그 사람의 고개가 기울던 각도를, 너무 조심스러워 답하지 못한 그 초대를 떠올리고, 내 손은 제 뜻대로 움직이며, 다른 손에는 깃펜이 말라 있다. 불이 타닥인다. 욕망이 모이고, 내가 서류처럼 치워 둘 만한 것으로 셈해지지 않는다.\n\n촛불이 바람에 기울고, 나는 눈을 감고 그 사절이 시작한 것을 그 생각이 끝맺게 둔다."
 latria_sexual_frustration_flavor.1434.a: "진실을 적어, 그것이 켠 아픔을 덜어 낸다."
 latria_sexual_frustration_flavor.1434.b: "끈을 묶고, 서늘한 한마디로 물러난다."
 latria_sexual_frustration_flavor.1434.c: "지도를 들어 그 일을 냉정하게 저울질한다."

 latria_sexual_frustration_flavor.1435.t: "마지막 잔 뒤"
 latria_sexual_frustration_flavor.1435.desc: "연회는 흔들리는 몇 자의 촛불로 줄었고, 내 맞은편의 손님은 가지 않았다. 상 밑에서 내 무릎이 그 사람의 무릎에 얹혀 쉬고, 어느 쪽도 움직이지 않았다. 술이 내 안에서 웅웅거린다. 나는 그 사람이 내 농담에 웃으며, 내 입을 그 사람의 입까지 그 작은 거리만큼 돌릴 수 있었을 만큼 가까이 기울여 오던 방식을 생각한다.\n\n남은 손이 벤치를 쥔다. 나는 오랜 세월 무엇을 원했던 것보다 더 그 거리를 없애고 싶고, 욕망은 목에서 배까지 팽팽하게 당겨진 밝은 철사다. 그 사람은 잔 테 너머로 나를 본다. 마지막 시종도 갔다. 홀에서는 다 타 버린 기름과 우리 둘의 숨 냄새가 난다.\n\n그 사람의 무릎이 한 번 눌러 답한다. 내 손이 벤치를 떠나 그 사람의 소매 가장자리를 찾고, 어느 쪽도 말하지 않는다."
 latria_sexual_frustration_flavor.1435.a: "다음에 내가 할 일을 음악이 덮게 둔다."
 latria_sexual_frustration_flavor.1435.b: "고개를 숙여 그 욕망을 기도로 가르친다."
 latria_sexual_frustration_flavor.1435.c: "놀이를 제안하고 판이 내 피를 식히게 둔다."
