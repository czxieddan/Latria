l_korean:
 latria_sexual_frustration_flavor.1011.t: "이경(二更)"
 latria_sexual_frustration_flavor.1011.desc: "이경에 잠이 깼다. 등잔은 아직 타고 있고 기름은 바닥을 드러냈으며, 접시에는 갈색으로 말라붙은 고리 하나가 남아 있다. 잠옷은 허리께에서 비틀려 있다. 방이 어찌나 차가운지 덧문이 두 번 부딪히는 소리까지 들리고, 이내 그친다.\n\n사흘 전, 홀의 문간에서 내 손목에 얹혔던 손 하나가 있었다. 아무 말도 오가지 않았다. 나는 그 손길의 길이를 장부보다 더 여러 번 되짚었다. 그 자리의 살갗은 이제 평범하다. 엄지로 눌러 보면 내 맥박만 느껴진다.\n\n침상 곁 잔에는 물이 담겨 있으나 미지근하다. 반을 마시고 내려놓는다. 덧문이 다시 부딪힌다. 나는 눈을 뜬 채 서까래를 세며 잿빛이 번지기를 기다린다."
 latria_sexual_frustration_flavor.1011.a: "일어나 등잔 심지를 다듬고, 생각이 흐르는 대로 둔다."
 latria_sexual_frustration_flavor.1011.b: "물을 마시고 벽 쪽으로 돌아누워 그 일을 내려놓는다."
 latria_sexual_frustration_flavor.1011.c: "궤에서 책을 꺼내 잿빛이 밝아올 때까지 읽는다."

 latria_sexual_frustration_flavor.1012.t: "배 한 알과 작은 칼"
 latria_sexual_frustration_flavor.1012.desc: "나는 상좌에서 세 번째 상에 앉아 있다. 촛불이 흔들리고 술이 묽게 따라지는 자리다. 내 맞은편, 상인 둘과 서기 하나를 지나친 곳에서 누군가 작은 칼로 배를 깎고 있다. 먹지는 않는다. 껍질이 한 줄로 길게 말려 내려온다.\n\n지난 연회에서 그 사람은 내 곁에 앉아 노래 한 곡이 끝나는 동안 무릎을 내 무릎에 대고 있었다. 우연이었다고 믿을 수도, 우연이 아니었다고 믿을 수도 없다.\n\n악사들이 더 느린 곡으로 바꾼다. 칼이 멈춘다. 배는 잘린 자리가 갈색으로 변해 가며 접시에 벌어져 있다. 시종이 등 뒤에서 술병을 기울이고, 나는 시선을 돌리지 않은 채 잔을 내민다."
 latria_sexual_frustration_flavor.1012.a: "소리 내어 말하고, 이 상에서 알아서들 하게 둔다."
 latria_sexual_frustration_flavor.1012.b: "일찍 물러나 나머지는 삼켜 버린다."
 latria_sexual_frustration_flavor.1012.c: "곁 사람에게 몸을 돌리고 음악이 그 생각을 실어 가게 둔다."

 latria_sexual_frustration_flavor.1013.t: "꿈이 남긴 것"
 latria_sexual_frustration_flavor.1013.desc: "이불이 허리께에 걸리고 창이 희끄무레한 채로 잠이 깬다. 잠시 방은 내 방이 아니다. 누군가 여기 있었다. 침상 가장자리가 눌려 있었고, 내 이름을 묻듯이 부르는 목소리가 귀 가까이 있었다.\n\n얼굴은 기억나지 않는다. 내 가슴에 등을 대고 있던 온기, 오르내리던 배 위에 평평하게 얹었던 내 손, 그리고 조금도 서두르지 않았던 나를 기억한다.\n\n누웠던 자리의 이불이 축축하다. 일어나 앉아 차가운 마룻바닥에 발을 내려놓는다. 밖에서는 수레 한 대가 시장 쪽으로 지나간다. 옷가지를 향해 손을 뻗다가, 내가 문 쪽에 귀를 기울이고 있음을 깨닫는다."
 latria_sexual_frustration_flavor.1013.a: "몸에 맡기고 꿈의 온기를 간직한다."
 latria_sexual_frustration_flavor.1013.b: "일어나 옷을 입고, 밤을 반듯하게 눌러 편다."
 latria_sexual_frustration_flavor.1013.c: "무릎을 세워 앉아 창이 희어지기를 기다린다."

 latria_sexual_frustration_flavor.1014.t: "철야등"
 latria_sexual_frustration_flavor.1014.desc: "세 번째 경에 무릎을 꿇는다. 시편집은 네 번이나 읽은 같은 면에 펼쳐져 있다. 철야등이 바닥 돌 위에 작은 붉은 원을 드리운다. 무릎이 시큰하고, 추위가 모직을 뚫고 올라온다.\n\n복도 저편 어디에선가 문이 닫힌다. 뒤에서 사제의 목소리가 인내심 있게 이어지지만 한 마디도 들리지 않는다. 지난여름 내 목에 닿았던 입술, 그리고 고개를 돌려 버리고도 그대로 두었던 일을 생각한다.\n\n시편집의 표지가 바닥으로 미끄러져 내렸다. 줍지 않는다. 엄지가 자리를 지켜 주고, 숨을 쉴 때마다 등불의 붉은 원이 흔들린다. 무릎 아래 돌은 차갑다."
 latria_sexual_frustration_flavor.1014.a: "약함을 인정하고, 속죄는 내일 받는다."
 latria_sexual_frustration_flavor.1014.b: "한 시간을 더 꿇어 앉아 시편을 처음부터 다시 읊는다."
 latria_sexual_frustration_flavor.1014.c: "사제에게 남아 그 면을 마저 읽어 달라 청한다."

 latria_sexual_frustration_flavor.1015.t: "침상 발치의 이불"
 latria_sexual_frustration_flavor.1015.desc: "불은 재가 되었고 나는 여전히 깨어 있다. 이불은 침상 발치로 걷어차여 있다. 몸은 따뜻하고 무겁고 제 자신을 자각한다. 목의 살갗과 허벅지를 따라 흐르는 피가 조이고 달아오르며, 나는 날씨와는 무관한 방식으로 젖어 있다.\n\n손을 배 아래에 얹어 두고 움직이지 않는다. 오늘 밤 이 욕망에는 얼굴이 없다. 다리 사이의 맥박뿐, 집요하게, 불이 마지막으로 타닥이는 소리와 박자를 맞춘다.\n\n입술 하나, 손 하나, 내 위를 덮던 누군가의 무게를 생각하고, 그러면 엉덩이가 저절로 움직인다. 이불은 마룻바닥에 한 뭉치로 쌓여 있다. 베개에 얼굴을 묻고 숨을 고르며 아픔이 가라앉기를 기다리지만, 가라앉지 않는다."
 latria_sexual_frustration_flavor.1015.desc.lustful: "이불 밑으로 열이 올라오고, 나는 더는 그것을 날씨 탓으로 돌리지 않는다. 나는 젖어 있다. 분명히, 내 손으로 젖어 있다. 손가락은 누가 시키지 않아도 길을 안다.\n\n손을 내맡긴다. 오늘 밤 거기에는 얼굴이 없다. 나를 매트리스로 눌러 내리던 손, 내 무릎을 벌리던 무릎 하나, 그 힘의 강도만이 또렷하다. 엉덩이가 허공으로 들린다. 빈 방에서 내가 내는 소리는 내가 아는 소리가 아니다.\n\n뒤이어 나는 손바닥을 펴고 누워 가슴을 오르내리며, 그 여운이 아직 허벅지에서 움직인다. 장작 하나가 화로에서 주저앉는다. 이불을 허리까지 끌어 올려도 얼굴의 열기는 남는다."
 latria_sexual_frustration_flavor.1015.desc.chaste: "이미 따뜻한 몸으로, 축축한 허벅지로 잠이 깬다. 손을 거두어 이불 자락을 쥐는, 천을 붙들면 밤을 제자리에 붙들 수 있기라도 한 듯이.\n\n아침 기도를 순서대로 읊다가 세 번째 줄에서 실을 놓친다. 서까래를 세다가 셈을 놓친다. 몸은 듣지 않는다. 대낮에는 인정하지 않는 것을 그대로 품고, 자꾸만 청한다.\n\n창이 잿빛에서 흰빛으로 바뀐다. 아침 예배의 종은 아직 울리지 않았다. 이불을 턱까지 끌어 올리고 눈을 감은 채 열이 빠지기를 기다린다. 열은 더디게 빠진다."
 latria_sexual_frustration_flavor.1015.a: "손이 하자는 대로 두고, 그 열을 쓴다."
 latria_sexual_frustration_flavor.1015.b: "이불을 움켜쥐고 열이 닳도록 견딘다."
 latria_sexual_frustration_flavor.1015.c: "일어나 물을 마시고 창가에 앉는다."

 latria_sexual_frustration_flavor.1016.t: "돌아오는 긴 길"
 latria_sexual_frustration_flavor.1016.desc: "나는 말들이 느려진 행렬의 뒤에서 탄다. 빛은 잎사귀 사이로 푸르게 얇아진다. 망토는 젖은 무게로 무겁다. 앞쪽 어딘가에서 뿔피리가 아직 먼 사면을 훑고 있다.\n\n지난 사냥에서 나는 여울에서 그 사람과 나란히 서서 나머지가 먼저 가게 두었다. 그 사람의 소매는 팔꿈치까지 젖어 있었다. 내가 한 말에 그 사람이 웃었고, 그 웃음은 돌아오는 내내 나를 따라왔으며, 돌아가는 길은 이틀이었다.\n\n말이 고개를 숙여 물을 마신다. 물결이 그 비친 모습을 흩어 놓는다. 나는 말에게 마시게 하며 조각들이 다시 모이는 것을 보고, 뿔피리가 다시, 더 멀리서 시작된다."
 latria_sexual_frustration_flavor.1016.a: "한 마만큼 뒤처져, 그 생각이 나와 함께 돌아오게 둔다."
 latria_sexual_frustration_flavor.1016.b: "박차를 넣고 마음을 사면에 붙들어 둔다."
 latria_sexual_frustration_flavor.1016.c: "발굽 자국과 꺾인 가지를 따라 그 사람을 찾는다."

 latria_sexual_frustration_flavor.1017.t: "인장과 장부"
 latria_sexual_frustration_flavor.1017.desc: "의논이 끝나 사람들이 물러가고 촛대는 짧게 닳았다. 장부는 양모 계정에서 펼쳐져 있고 인장은 아직 내 손에 있다. 손아귀의 열에 밀랍이 물러졌다.\n\n자꾸 돌아가는 것은 계정이 아니다. 어떤 사람이 회의 내내 창가에 서서, 손가락 하나를 걸쇠에 걸친 채 아무 말도 하지 않던 모습, 그리고 그 때문에 방이 더 좁아진 것 같던 감각이다.\n\n명령서에 인장을 눌러 찍고 들어 올린다. 밀랍이 흠 없이 자국을 받는다. 창밖 안뜰은 비어 있고 걸쇠는 그대로다. 나는 장부의 같은 줄을 두 번 읽고 책을 덮는다."
 latria_sexual_frustration_flavor.1017.a: "내일 그 사람을 불러 분명히 말한다."
 latria_sexual_frustration_flavor.1017.b: "인장을 서기에게 주고 잠자리에 든다."
 latria_sexual_frustration_flavor.1017.c: "장부를 다시 펴 그 면을 마저 끝낸다."

 latria_sexual_frustration_flavor.1018.t: "판 위의 달"
 latria_sexual_frustration_flavor.1018.desc: "길을 따라 등롱이 밝혀지고, 달은 서쪽 담 위에 얇고 흰 껍질처럼 떠 있다. 주전자 속 술은 미지근해졌다. 판 맞은편의 학자가 흰 돌 하나를 두 손가락 사이에 쥐고 놓지 않는다.\n\n봄의 모임에서 그 사람은 소매가 닿을 만큼 가까이 앉아 등불에 관한 네 줄을 읊었고, 마지막 줄에서 나를 보았다. 나는 그 마지막 줄을 잊지 못했다.\n\n돌은 마침내, 엉뚱한 자리에 놓인다. 그 사람이 웃으며 내 잔을 채운다. 나는 마신다. 등롱 빛이 판 위를 옮겨 간다. 두 사람 다 시 이야기는 꺼내지 않는다."
 latria_sexual_frustration_flavor.1018.a: "등불과 그 네 줄을 받아 네 줄을 더 얹는다."
 latria_sexual_frustration_flavor.1018.b: "잔을 들어 감사하고 이야기를 추수로 돌린다."
 latria_sexual_frustration_flavor.1018.c: "돌 하나를 놓고 가르침을 청한다."

 latria_sexual_frustration_flavor.1019.t: "불에게 한 말"
 latria_sexual_frustration_flavor.1019.desc: "불이 낮게 타고, 내 비밀을 아는 이가 다른 의자에 앉아 잔을 두 손으로 감싸 쥔 채, 언제나처럼 기다리고 있다.\n\n그래서 나는 말한다. 전부는 아니고 그 윤곽만을. 문간, 내 손목에 얹혔던 손, 그 뒤로 이어진 밤들. 소리 내어 말하자 그것은 더 작아지고 더 나빠진다. 그 이는 시선을 돌리지 않고, 침묵을 메우지도 않는다.\n\n손안의 잔은 식었다. 넣을 장작이 있지만 넣지 않는다. 우리는 마지막 열기 속에 앉아 있고 방은 천천히 어두워지며, 나는 여전히 잔을 쥐고 있다."
 latria_sexual_frustration_flavor.1019.a: "계속하여 나머지도 말한다."
 latria_sexual_frustration_flavor.1019.b: "거기서 멈추고 나머지는 품는다."
 latria_sexual_frustration_flavor.1019.c: "조금 더 앉아 아무 말도 하지 않는다."

 latria_sexual_frustration_flavor.1020.t: "아치 아래서 한 말"
 latria_sexual_frustration_flavor.1020.desc: "아치가 내 목소리를 받아 두 배로 되돌려준다. 신랑에는 열두엇이 있고, 그들 모두가 내가 대낮에는 하지 못했던 말을 하는 것을 듣는다.\n\n나는 난간 앞 돌바닥에 시선을 둔다. 이빨 모양으로 깨진 자리가 있다. 말을 마치자 뒤에서 누군가 무게를 옮기고, 문 곁의 여인이 베일을 끌어당겨 내리지 않는다.\n\n향로가 흔들린다. 연기가 돌을 따라 납작하게 올라간다. 나는 무릎 위에 손을 펴고 그대로 있다가, 성물지기가 어깨에 손을 얹을 때까지 움직이지 않는다."
 latria_sexual_frustration_flavor.1020.a: "고개를 들어 빼놓은 말을 마저 한다."
 latria_sexual_frustration_flavor.1020.b: "고개를 숙인 채 참회 시편을 끝까지 읊는다."
 latria_sexual_frustration_flavor.1020.c: "신랑이 빌 때까지 기다렸다가 사제에게 남기를 청한다."

 latria_sexual_frustration_flavor.1021.t: "비가 그친 뒤"
 latria_sexual_frustration_flavor.1021.desc: "비가 우리를 이경이 지나도록 위층 방에 붙들어 두었고, 어느 쪽도 아래로 내려가자 말하지 않았다.\n\n나는 일의 순서를 기억한다. 마룻바닥에 떨어진 젖은 망토. 빗장뼈에 닿은 입술, 그리고 서두르지 않고 더 아래로, 그사이 내 손가락은 목덜미의 끈을 찾아냈다. 등잔은 낮게 줄여 두었으나 끄지는 않았다. 다시 올라와 입을 맞출 때 그 사람에게서 술 맛이 났고, 내 허벅지는 그 사람의 허벅지와 함께 미끄러웠으며, 나는 그 자리에 얹힌 손을 향해 엉덩이를 들었다.\n\n뒤에도 비는 계속되었다. 머리카락이 뺨에 붙어 있었다. 어깨에 자국이 하나 남아 있고, 나는 대낮에 그것을 들여다보지 않았다."
 latria_sexual_frustration_flavor.1021.desc.female: "비가 우리를 이경이 지나도록 위층 방에 붙들어 두었고, 어느 쪽도 아래로 내려가자 말하지 않았다.\n\n나는 일의 순서를 기억한다. 마룻바닥에 떨어진 젖은 망토. 빗장뼈에 닿은 그 사람의 입술, 그리고 서두르지 않고 더 아래로, 그사이 내 손가락은 그 사람의 목덜미 끈을 풀고 있었다. 등잔은 낮게 줄였으나 끄지는 않았다. 그 사람의 손바닥이 내 가슴을 덮았고 나는 이미 젖어 있었으며, 내 허벅지 사이에 얹힌 손을 향해 엉덩이를 들었다.\n\n뒤에도 비는 계속되었다. 머리카락이 뺨에 붙어 있었다. 어깨에 자국이 하나 남아 있고, 나는 대낮에 그것을 들여다보지 않았다."
 latria_sexual_frustration_flavor.1021.desc.male: "비가 우리를 이경이 지나도록 위층 방에 붙들어 두었고, 어느 쪽도 아래로 내려가자 말하지 않았다.\n\n나는 일의 순서를 기억한다. 마룻바닥에 떨어진 젖은 망토. 그 사람의 입술이 내 가슴에, 그리고 서두르지 않고 더 아래로, 그사이 내 손은 그 사람의 허리 끈을 찾아냈다. 등잔은 두 번 흔들리다가 버텼다. 그 사람이 내 위로 내려왔고 나는 그 사람의 골반을 붙들었다. 단단하고 아팠다. 속도는 그 사람이 정했다. 그 사람의 머리카락 끝은 젖어 있었다.\n\n뒤에도 비는 계속되어 창 위 홈통으로 흘러내렸다. 어깨에 자국이 하나 남아 있고, 나는 대낮에 그것을 들여다보지 않았다."
 latria_sexual_frustration_flavor.1021.a: "내일도 평소대로 그 사람을 만나고, 아무것도 감추지 않는다."
 latria_sexual_frustration_flavor.1021.b: "이제부터 그 사람을 피하고, 그 밤을 치워 둔다."
 latria_sexual_frustration_flavor.1021.c: "누워 비를 들으며 그 자국을 마음에 둔다."

 latria_sexual_frustration_flavor.1022.t: "약초밭 뒤의 길"
 latria_sexual_frustration_flavor.1022.desc: "나는 약초밭 뒤 길로 든다. 해가 진 뒤에 집안 사람들이 걷지 않는 유일한 곳이기 때문이다. 자갈이 실내화 밑으로 차갑다. 로즈메리, 그리고 그 밑에 민트가 지나간 뒤의 시큼한 냄새.\n\n담이 꺾이는 끝에 벤치가 있다. 봄에 우리는 거기 앉았고, 나는 어리석은 말을 꺼내 끝맺기 전에 용서받았다. 문 걸쇠는 아직 내려져 있다.\n\n달은 탑 뒤에 있다. 나는 벤치 등받이에 손을 얹고 선다. 페인트가 닳아 나무결이 드러난 자리다. 문 곁 등롱에 나방 하나가 매달려 애쓴다. 민트가 조금 흔들린다. 나는 앉지 않는다."
 latria_sexual_frustration_flavor.1022.a: "벤치에 앉아 맥박이 지나가게 둔다."
 latria_sexual_frustration_flavor.1022.b: "집으로 돌아가 문을 걸어 잠근다."
 latria_sexual_frustration_flavor.1022.c: "그 길을 한 번 걷고, 다시 한 번 걷는다."

 latria_sexual_frustration_flavor.1023.t: "세 번째 잔"
 latria_sexual_frustration_flavor.1023.desc: "세 번째 잔이 도 무렵 홀은 시끄럽고 따뜻해지고, 개들은 벤치 밑에 들었다. 누군가 절 수가 틀린 노래를 시작했고 아무도 고쳐 주지 않는다.\n\n이야기 하나가 끝나는 동안 손 하나가 내 소매에 얹혀 있다가, 이야기가 끝나면 사라진다. 나는 알맞은 대목에서 웃는다. 오늘 밤 술은 몹시 좋다.\n\n악사들이 느린 곡을 집어 든다. 나는 접시가 치워지는 상 아래쪽을 본다. 손이 있던 자리의 소매는 아직 따뜻하다. 잔의 테를 돌려 잡고 시종이 다시 채우게 둔다."
 latria_sexual_frustration_flavor.1023.a: "잔을 들고 상 너머로 그 사람을 본다."
 latria_sexual_frustration_flavor.1023.b: "술을 핑계 대고 올라가 잠자리에 든다."
 latria_sexual_frustration_flavor.1023.c: "곁 사람과 이야기하며 곡이 끝까지 가게 둔다."

 latria_sexual_frustration_flavor.1024.t: "장미수와 정원 담"
 latria_sexual_frustration_flavor.1024.desc: "장미수가 과일 위에 부어져 상 전체에서 그 냄새가 난다. 담 밑에서 꾀꼬리 한 마리가 서툴게 자꾸만 울고, 아무도 그칠 마음을 내지 못한다.\n\n그 사람은 조약에 관해 두 번 물었고, 나는 두 번 다 엉뚱한 절반을 대답했다. 두 번째에 그 사람은 잔 안으로 웃었다. 그 사람 엄지의 사프란이 잔 테에 묻어났다. 우리 사이 등잔의 유리에는 금이 가 있다.\n\n꾀꼬리가 그친다. 고요 속에서 담 뒤 도랑의 물소리가 들린다. 이미 비운 잔을 들어, 누군가 알아채고 다시 채울 때까지 쥐고 있다."
 latria_sexual_frustration_flavor.1024.a: "그 사람의 뜻을 따라 조약을 내일로 미룬다."
 latria_sexual_frustration_flavor.1024.b: "양해를 구하고 정원으로 나간다."
 latria_sexual_frustration_flavor.1024.c: "그 사람에게 시의 나머지 절반을 마저 읊어 달라 청한다."

 latria_sexual_frustration_flavor.1025.t: "주먹 위의 매"
 latria_sexual_frustration_flavor.1025.desc: "매는 봄보다 내 주먹에 잘 앉아 있다. 복면을 벗고, 무게가 자리를 잡았다. 말들은 자작나무 숲 뒤에 말뚝으로 매여 있고, 몰이꾼들은 소리를 내며 앞서 갔다.\n\n우리는 한 번 황무지 끝에서 함께 매를 날렸다. 나는 매를 놓던 손을, 마지막 순간에 벌어지던 그 손 모양을, 눈을 떼지 못했다. 그 뒤로 나는 그 손을 달가워하지 않는 시각에 생각해 왔다.\n\n매가 자리를 옮기고, 나는 두 손가락을 가죽 끈에 대어 잡아 준다. 바람이 사면을 타고 올라온다. 차갑고 깨끗하다. 나는 몰이꾼이 들어간 나무숲에 눈을 두지만 마음은 그 숲에 있지 않다."
 latria_sexual_frustration_flavor.1025.a: "매를 다른 이에게 넘기고 혼자 걸어 나간다."
 latria_sexual_frustration_flavor.1025.b: "주먹에서 매를 놓아 날려 보낸다."
 latria_sexual_frustration_flavor.1025.c: "팔이 시큰해질 때까지 다시 날린다."

 latria_sexual_frustration_flavor.1026.t: "그 사람이 넘긴 면"
 latria_sexual_frustration_flavor.1026.desc: "수업은 끝났고 책은 여전히 우리 사이에, 사제가 마른 손가락 하나로 넘긴 그 면에 펼쳐져 있다. 덧문에 비가 온다. 촛불은 다 타서 굽었다.\n\n나는 논리를 따라가지 않았다. 그 손가락, 그 옆에 묻은 잉크, 팔꿈치까지 밀어 올린 소매를 보았다. 부끄러움은 언제나 뒤에 와서, 아무 도움도 되지 않는다.\n\n사제가 책을 덮고 이해했는지 묻는다. 나는 그렇다고 대답한다. 덧문에는 비가 계속된다. 나는 손이 무엇엔가 뻗지 않도록 표지 위에 평평하게 얹어 둔다."
 latria_sexual_frustration_flavor.1026.a: "그 물음을 내일 사제에게 가져간다."
 latria_sexual_frustration_flavor.1026.b: "사제에게 다시 말해 달라 청하고, 이번에는 듣는다."
 latria_sexual_frustration_flavor.1026.c: "그 면을 한 번 더, 글자만 읽는다."

 latria_sexual_frustration_flavor.1027.t: "그날이 남긴 것"
 latria_sexual_frustration_flavor.1027.desc: "마지막 청원자가 물러가고, 방에는 젖은 모직과 사람들이 벤치에 문질러 바른 짐승 기름 냄새가 배어 있다. 내 인장은 손의 열로 따뜻하다. 그날의 일은 끝났고 나는 아직 여기 앉아 있다.\n\n창가에서, 두 사람이 말하는 사이에, 눈길 하나가 오갔다. 나는 그 눈길을 신발 속 돌멩이처럼 지금까지 지니고 다닌다. 아무 말도 오가지 않았다. 필요하지 않았다.\n\n서기가 인장을 가지러 온다. 나는 그에게 넘기고, 손가락은 흔들리지 않는다. 그가 나간다. 문은 완전히 닫히지 않는다. 나는 앉아서 걸쇠가 자리 잡는 소리를 듣고, 지붕의 납줄에 비가 다시 시작된다."
 latria_sexual_frustration_flavor.1027.a: "내일 모두를 물러가게 하고 한 가지만 말한다."
 latria_sexual_frustration_flavor.1027.b: "창을 닫고 서류를 마저 끝낸다."
 latria_sexual_frustration_flavor.1027.c: "남은 것을 한 장씩 처리한다."

 latria_sexual_frustration_flavor.1028.t: "함 속의 리본"
 latria_sexual_frustration_flavor.1028.desc: "선반 위 함에 내 것이 아닌 리본이 들어 있다. 초록빛이고 접힌 자리는 얇아졌다. 나는 꺼냈다 넣고, 다시 꺼낸다.\n\n장날에 나는 리본을 잃었고, 누군가 진흙에서 그것을 찾아 필요도 없는 인사를 하며 돌려주었다. 그 사람의 손은 차가웠다. 나는 고맙다고만 하고 아무 말도 더 하지 않았으며, 돌아오는 내내 하지 않은 그 말에 스스로 화가 났다.\n\n등잔이 낮다. 리본이 손바닥에 걸쳐 있고 이 빛 속에서 초록은 거의 잿빛이다. 한 번 접고, 다시 접지만 주름이 맞지 않는다."
 latria_sexual_frustration_flavor.1028.a: "리본을 손목에 묶고 잠든다."
 latria_sexual_frustration_flavor.1028.b: "함에 잠금을 채워 궤 맨 아래에 둔다."
 latria_sexual_frustration_flavor.1028.c: "종이를 가져다 그 밤을 적는다."

 latria_sexual_frustration_flavor.1029.t: "교대 사이의 불"
 latria_sexual_frustration_flavor.1029.desc: "불은 붉은 눈동자 하나로 줄었고, 우리 둘과 매인 말들만 빼면 진영은 잠들었다. 망토는 무릎을 덮고 있다. 검은 습관대로 손 닿는 곳에 있다.\n\n우리는 열한 밤을 같은 불 곁에서 보냈고, 나는 그 사람의 숨소리를 배웠다. 오늘 밤 그 사람도 깨어 있다. 어느 쪽도 내일의 길 이야기를 하지 않고, 방이 하나뿐이어서 그대로 묵었던 지난 마을 여관 이야기도 하지 않는다.\n\n바람이 불꽃을 납작하게 눕힌다. 장작 하나가 주저앉는다. 하나를 더 넣자 불티가 올라가고, 그 불티만이 숲 전체에서 움직이는 유일한 것이다."
 latria_sexual_frustration_flavor.1029.a: "불 곁에 앉아 날이 밝기를 기다린다."
 latria_sexual_frustration_flavor.1029.b: "불을 먹이고 보초를 서며 그 사람을 보지 않는다."
 latria_sexual_frustration_flavor.1029.c: "그 사람과 교대하여 숲 끝까지 걷는다."

 latria_sexual_frustration_flavor.1030.t: "종줄"
 latria_sexual_frustration_flavor.1030.desc: "종줄은 손에서 거칠고, 종은 이미 울렸고, 성당은 비었다. 안내자가 열쇠를 들고 문 곁에서 돌처럼 참을성 있게 기다린다.\n\n나는 몸을 지켜야 할 것으로 생각하려 하지만, 그 생각이 붙들리지 않는다. 미끄러진다. 모직 밑에서 나는 따뜻하고 살아 있고, 기도와는 무관한 맥박이 내 안에 뛴다.\n\n나는 줄을 놓는다. 조금 흔들리다 멈춘다. 안내자가 열쇠를 든다. 나는 그 사람 뒤로 신랑을 걸어가고, 내 그림자가 돌바닥 위로 길고 가늘게 앞서 가 문 밖으로 나간다."
 latria_sexual_frustration_flavor.1030.a: "그 밤을 몸에 주고, 내일 정리한다."
 latria_sexual_frustration_flavor.1030.b: "무릎을 꿇고 저녁 예배를 마저 올린다."
 latria_sexual_frustration_flavor.1030.c: "안내자를 붙들어 두고 한 대목을 더 듣는다."

 latria_sexual_frustration_flavor.1031.t: "마룻바닥의 리본"
 latria_sexual_frustration_flavor.1031.desc: "불은 붉은 선으로 타들어 갔고 나는 장작을 더 달라고 하지 않았다. 가운의 목이 풀려 있고, 방은 그것을 그대로 둘 만큼 따뜻하다. 이틀 전, 사냥이 멈춘 자리에서 손 하나가 내 허리께에, 말에서 내리는 데 필요한 것보다 오래 머물렀다.\n\n나는 그 손바닥의 무게, 말이 움직일 때 귀에 닿아 움직이던 숨, 단어는 아니었던 낮은 소리를 기억한다. 내 손이 그 손바닥이 덮었던 자리로 간다. 그 살갗은 불의 열로 따뜻하고, 눌러 보면 그 온기는 내 것뿐이다.\n\n리본이 침상 기둥에서 마룻바닥으로 미끄러졌다. 붉은 빛 속에 누워 있는 것을 본다. 불이 가라앉는다. 나는 줍지 않는다."
 latria_sexual_frustration_flavor.1031.a: "리본을 들고 생각이 흐르는 대로 둔다."
 latria_sexual_frustration_flavor.1031.b: "리본을 묶고 불을 덮어 재운 뒤 잠든다."
 latria_sexual_frustration_flavor.1031.c: "판을 벌여 혼자 종반을 둔다."

 latria_sexual_frustration_flavor.1032.t: "손바닥의 무게"
 latria_sexual_frustration_flavor.1032.desc: "돌의 냉기가 무릎을 뚫고, 그 추위가 벗이 될 만큼 오래 꿇어 있었다. 모직 밑에서 내 몸은 지나치게 따뜻하고, 화로 때문인지 다른 무엇 때문인지 알 수 없다. 지난주에는 축복 중에 손 하나가 내 머리에 얹혔다가, 말이 끝난 뒤에도 남았다.\n\n기도는 정확히 나오고 응답도 정확하다. 대신 떠오르는 것은 그 손바닥의 무게, 손가락에 묻은 기름, 어느 쪽도 움직이지 않던 순간과 문간에서 헛기침하던 성물지기다. 나는 이마를 주먹에 댄다. 대리석은 아무것도 돌려주지 않는다.\n\n곁 제단의 촛불이 굽었다가 곧게 선다. 나는 그대로 있다. 냉기가 무릎으로 올라오고, 나는 그것을 둔다."
 latria_sexual_frustration_flavor.1032.a: "일어나 사제를 찾아, 내 안에 있던 것을 말한다."
 latria_sexual_frustration_flavor.1032.b: "종이 울릴 때까지 철야를 지킨다."
 latria_sexual_frustration_flavor.1032.c: "다리가 무릎만큼 차가워질 때까지 복도를 걷는다."

 latria_sexual_frustration_flavor.1033.t: "두 번째 망토"
 latria_sexual_frustration_flavor.1033.desc: "우리 사이에 불이 있고 사냥개들은 잠잠하다. 누군가 묻지도 않고 두 번째 망토를 내 어깨에 둘렀고, 모직에서는 남의 땀과 장작 연기 냄새가 난다. 그 사람의 무릎이 내 무릎에 닿아 있다. 어느 쪽도 움직이지 않았다.\n\n일어설 이유는 셋 댈 수 있다. 보초, 닫히지 않는 천막 자락, 새벽 전에 올 추위. 대신 나는 불꽃 쪽으로 얼굴을 돌리고 어깨가 안착한 자리에 그대로 있게 둔다. 우리의 숨이 밖으로 나가 우리 사이 공기에서 얇아진다. 망토 밑에서 내 손이 제 소매의 솔기를 찾아 쥔다.\n\n가지 하나가 불로 떨어진다. 그 사람은 움직이지 않는다. 나도 움직이지 않는다. 불티가 위로, 밖으로 올라간다."
 latria_sexual_frustration_flavor.1033.a: "불이 재가 될 때까지 망토 밑에 머문다."
 latria_sexual_frustration_flavor.1033.b: "모직에 감사하고 내 천막으로 간다."
 latria_sexual_frustration_flavor.1033.c: "교대가 올 때까지 그 사람에게 사냥개 이야기를 묻는다."

 latria_sexual_frustration_flavor.1034.t: "세 번째 조항"
 latria_sexual_frustration_flavor.1034.desc: "조약은 두 번 옮겨 적혔고 두 번째 사본의 세 번째 조항이 틀렸다. 네 번을 읽어도 오류는 그대로다. 내 깃은 열려 있다. 화로가 방을 데웠고, 볼 사람도 없다.\n\n자꾸 돌아가는 것은 앞방이다. 내 손목 안쪽에, 그리고 그 위에 닿았던 사절의 입술, 문 밖에서 공증인의 발소리가 오가는데도 나는 그대로 두었다. 적힐 만한 말은 하지 않았다. 그 사람은 더 적게 말했다.\n\n촛불이 밀랍에서 초승달 하나를 파먹었다. 나는 펜을 들었다 놓고 세 번째 조항을 다시 읽는다. 말은 변하지 않았다."
 latria_sexual_frustration_flavor.1034.a: "사절을 불러 내가 생각해 온 것을 분명히 말한다."
 latria_sexual_frustration_flavor.1034.b: "그 조항을 다시 옮겨 적고 날이 밝는 대로 고해하러 간다."
 latria_sexual_frustration_flavor.1034.c: "촛불이 꺼질 때까지 시편집을 읽는다."

 latria_sexual_frustration_flavor.1035.t: "두 번의 회전"
 latria_sexual_frustration_flavor.1035.desc: "홀은 시끄럽고 술이 머리로 올랐다. 멀리는 아니고, 충분한 만큼만. 어깨에서 가운이 풀렸고 나는 손대지 않았다. 지난 춤에서 손 하나가 내 허리에 얹혀 두 번의 회전을 함께했고, 방은 발을 뺄 수 없을 만큼 붐볐다.\n\n나는 비단 너머로 그 네 손가락의 네 점을 아직 찾을 수 있다. 내 손은 어깨로, 천이 미끄러진 따뜻한 자리로 간다. 음악은 이제 악사들 뒤에 있다. 그래도 나는 박자를 지킨다.\n\n머리 위 등잔에서 그을음이 난다. 먼 상에서 누군가 내가 듣지 못한 말에 웃는다. 내 어깨는 드러나 있고, 나는 그대로 둔다."
 latria_sexual_frustration_flavor.1035.a: "곡을 하나 더 청해 춤춘다."
 latria_sexual_frustration_flavor.1035.b: "가운을 고쳐 입고 창가에서 찬 공기를 쐰다."
 latria_sexual_frustration_flavor.1035.c: "늙은 사냥개 곁 불가에 앉아 홀이 빌 때까지 머문다."
