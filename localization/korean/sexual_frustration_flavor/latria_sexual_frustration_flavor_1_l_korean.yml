l_korean:
 latria_sexual_frustration_flavor.1001.t: "휘장 뒤의 긴 밤"
 latria_sexual_frustration_flavor.1001.desc.female: "나는 잠옷 차림으로 창가에 앉아 뜯지 않은 편지를 무릎에 올려 두었다. 휘장 틈으로 스며든 달빛이 접힌 자리에 남은 손자국을 비춘다. 편지를 쓴 사람은 떠난 지 오래다. 나는 함 바닥에서 그 편지를 꺼냈다가 도로 넣고, 또 꺼내기를 거듭했다.\n\n마지막으로 만났던 날이 떠오른다. 그 사람은 말을 하다 멈추었다. 무언가 덧붙이려는 듯했지만, 그러기 전에 소매부터 거두었다. 나는 고개만 끄덕였고 붙잡는 말 한마디 하지 못했다. 밤이 깊어진 지금은 편지에 적힌 말보다 그때 끝맺지 못한 말이 더 또렷하다.\n\n바람에 휘장이 흔들리자 편지에서도 작은 소리가 났다. 나는 봉랍에 손끝을 댄 채, 봉투를 뜯지도 함에 도로 넣지도 못하고 있다."
 latria_sexual_frustration_flavor.1001.desc.male: "나는 잠옷 차림으로 창가에 앉아 뜯지 않은 편지를 무릎에 올려 두었다. 휘장 틈으로 스며든 달빛이 봉투에 적힌 익숙한 글씨를 비춘다. 편지를 쓴 사람은 떠난 지 오래지만, 나는 줄곧 이 편지를 장부 아래 눌러 두었다.\n\n떠나기 전 그 사람이 나를 한번 바라보던 모습이 떠오른다. 무슨 대답을 기다리는 듯했다. 나는 하던 일이 있어서 다음에 이야기하자는 말만 했다. 그다음이 찾아왔을 때 그 사람은 이미 없었다. 그때의 눈빛만 아직도 눈앞에 남아 있다.\n\n창밖에서 밤을 알리는 소리가 한 차례 지나갔다. 나는 편지를 뒤집었다가 다시 돌려놓았다. 봉랍은 여전히 온전하다."
 latria_sexual_frustration_flavor.1001.desc: "밤이 깊어지자 끝내 풀지 못한 마음속 일이 다시 떠오른다.\n\n나는 편지를 들어 봉한 곳을 살펴보고는 다시 무릎에 내려놓았다. 방에는 아무도 없어 등잔 심지가 타닥거리는 소리마저 또렷하다. 내일 할 일을 생각해 보려 해도 마음은 자꾸 같은 곳으로 돌아간다.\n\n휘장이 한번 흔들렸다. 편지는 아직 여기 있는데, 그 사람은 없다."
 latria_sexual_frustration_flavor.1001.a: "끝까지 읽으며 쓴 사람을 생각한다."
 latria_sexual_frustration_flavor.1001.b: "편지를 잠가 두고 생각을 억누른다."
 latria_sexual_frustration_flavor.1001.c: "새 종이를 꺼내 시로 적는다."

 latria_sexual_frustration_flavor.1002.t: "연회의 향신료"
 latria_sexual_frustration_flavor.1002.desc.accepted: "연회장의 향신료 냄새가 술 냄새보다 짙다. 악사들은 벌써 세 번째 곡을 연주하고 있는데, 손님들은 여전히 가까이 붙어 이야기를 나눈다. 이곳에서는 그 정도의 친근함을 무례하게 여기지 않는다. 손님들은 웃고는 다시 술잔을 돌린다.\n\n나는 오가는 눈길을 하나하나 살피고 있다. 누군가 잔을 들어 인사를 건네기에 나도 답했지만, 눈은 나타나지 않은 얼굴을 계속 찾았다. 옆 사람이 농담을 했을 때도 나는 한 박자 늦게 웃었다.\n\n시종이 술을 따를 때는 잔을 들고 있다는 사실마저 잊을 뻔했다. 향신료의 더운 기운이 올라오지만, 마음 한구석의 허전함은 그대로다."
 latria_sexual_frustration_flavor.1002.desc.strict: "향신료가 연회의 흥을 더한다. 웃음소리가 터질 때마다 나는 예법이 선을 넘는 행동을 얼마나 엄하게 감시하는지 떠올린다. 옆 사람이 몸을 기울여 말을 걸자 나도 모르게 잔을 바로 잡았다. 그러면 좀 더 처신이 단정해 보일 것 같았다.\n\n누군가 옛일을 꺼내다가 말을 멈추었다. 곧 화제가 바뀌어 봉토와 수확 이야기가 오갔다. 나도 고개를 끄덕였지만, 귀에는 아직 끝내지 못한 그 말이 맴돌았다.\n\n시종이 술을 따를 때는 손에 든 잔마저 잊을 뻔했다. 술이 가장자리까지 차오르고 나서야 나는 잔을 내려놓았다."
 latria_sexual_frustration_flavor.1002.desc: "연회는 소란스럽지만, 내 마음은 자꾸 같은 일에 이끌린다.\n\n음악도 술잔도 사람들의 이야기도 바로 곁에 있는데, 어느 한마디도 끝까지 듣지 못한다. 옆 사람이 술을 더 마시겠느냐고 물었다. 대답은 했지만 무슨 대답을 했는지 나도 모르겠다.\n\n곡이 바뀌고 나서야 내가 줄곧 연회장 문을 바라보고 있었다는 것을 깨달았다. 문은 두 번 열렸다. 들어온 사람은 모두 내가 보고 싶었던 사람이 아니었다."
 latria_sexual_frustration_flavor.1002.a: "나도 다정한 말 몇 마디로 거든다."
 latria_sexual_frustration_flavor.1002.b: "시선을 내리고 주인에게 감사한 뒤 떠난다."
 latria_sexual_frustration_flavor.1002.c: "떠나기 전 악사들에게 한 곡 더 청한다."
 latria_sexual_frustration_flavor.1002.d: "손님들을 한 탁자에 모아 밤새 이야기를 나눈다."

 latria_sexual_frustration_flavor.1003.t: "정원의 설교"
 latria_sexual_frustration_flavor.1003.desc.favors: "설교자는 정원의 돌 의자에 앉아 육욕의 쾌락이 우리 신앙에 어긋나지 않는다고 말한다. 바람에 책장 한 귀퉁이가 들리자 손가락으로 누르고는, 여전히 느긋하게 이야기를 이어 간다.\n\n마음이 놓여야 할 말이다. 그런데 나는 그 말을 들으며 다른 일을 떠올린다. 그 사람이 떠나기 전에 했던 농담 한마디와, 그때 미처 받아 주지 못한 눈길. 경전의 구절은 귓가를 스쳐 가고 그 말만 마음에 남는다.\n\n설교자가 알아들었느냐고 물었다. 나는 고개를 끄덕였다. 하지만 책을 덮으려니 어느 쪽을 읽고 있었는지조차 알 수 없다."
 latria_sexual_frustration_flavor.1003.desc.condemns: "설교자는 절제와 순결에 관해 말한다. 한마디 한마디가 또렷하다. 정원은 고요해서 나뭇잎 소리도 그가 말을 멈출 때를 기다려 나는 듯하다. 나는 두 손을 무릎에 얹고 단정히 앉아 있지만, 마음은 책에 가 있지 않다.\n\n지난밤 잠을 이루지 못했던 때가 생각난다. 누가 찾아온 것도, 무슨 말을 한 것도 아니었다. 그저 그 갈망이 저절로 되살아났을 뿐이다. 경전에 눈길을 붙들어 두어도 글자가 문장으로 이어지지 않는다.\n\n설교자가 한 장을 넘겼다. 나도 따라 고개를 숙였지만, 그가 방금 어디를 읽었는지 여전히 모르겠다."
 latria_sexual_frustration_flavor.1003.desc: "나는 정원에서 설교를 끝까지 들었다. 책장 위로 바람이 지나가도 마음속 생각은 가라앉지 않는다.\n\n설교자는 벌써 일어나 다른 이들을 맞으러 갔다. 나는 그대로 앉아 손가락으로 책장을 누르고, 눈으로는 돌길 끝을 바라본다. 아무도 없는데도 한동안 그쪽을 보고 있었다.\n\n정신을 차렸을 때는 바람이 벌써 책장을 몇 장이나 넘겨 놓은 뒤였다."
 latria_sexual_frustration_flavor.1003.a: "책을 덮고 그리운 이를 생각한다."
 latria_sexual_frustration_flavor.1003.b: "잡념을 접고 함께 낭송한다."
 latria_sexual_frustration_flavor.1003.c: "설교자에게 구절마다 풀이를 청한다."

 latria_sexual_frustration_flavor.1004.t: "안절부절못하는 매"
 latria_sexual_frustration_flavor.1004.desc.lustful: "매가 내 팔 위에서 날개를 퍼덕이며 멀리 있는 비둘기 떼를 쫓는다. 발에 묶인 가죽끈이 거슬리는지 날개를 펼칠 때마다 바람이 일어난다. 내가 달래도 매는 계속 그 빈터를 노려본다.\n\n그 조급함은 나도 안다. 사냥꾼들은 숲 가장자리에서 내 명령을 기다리고, 말들도 참을성 없이 발을 구른다. 하지만 나는 다른 일에 정신이 팔려 손에 쥔 호루라기마저 잊었다. 뚜렷하게 떠오르는 것도 없으면서 그 생각은 멎지를 않는다.\n\n매가 다시 한번 날개를 퍼덕였다. 그제야 내가 장갑을 너무 세게 움켜쥐고 있었다는 것을 알았다."
 latria_sexual_frustration_flavor.1004.desc.chaste: "매가 내 팔 위에서 안절부절못하며 발을 옮긴다. 나는 억지로 고삐와 호루라기 소리에 귀를 기울이고 숲의 경계 안에 시선을 묶어 둔다. 사냥꾼들은 이미 흩어져 내 명령만 기다리고 있다.\n\n마음속 생각은 새보다도 붙들기 어렵다. 숨을 세고, 말발굽 소리를 세고, 나무에 달린 잎을 센다. 그러다 보면 또 같은 사람에게 생각이 돌아간다. 그 사람이 사냥터에 없다는 것은 나도 안다. 알면서도 자꾸 떠올린다.\n\n매가 고개를 돌려 나를 본다. 알아들을 수 있는 명령을 기다리는 듯하지만, 나는 당장 아무 지시도 내리지 못한다."
 latria_sexual_frustration_flavor.1004.desc: "사냥꾼들은 내가 매를 불러들이기를 기다리지만, 나는 좀처럼 집중할 수 없다.\n\n숲속의 바람이 멎자 팔 위에서 퍼덕이는 날갯짓이 유난히 선명해졌다. 나는 손을 들었다가 다시 내렸다. 부르는 소리를 입안에서 굴리기만 하고 끝내 내보내지 못했다.\n\n멀리서 누군가 내 이름을 불렀다. 대답은 했지만 눈은 여전히 빈터를 향해 있었다."
 latria_sexual_frustration_flavor.1004.a: "내 생각에 잠기는 동안 일행을 기다리게 한다."
 latria_sexual_frustration_flavor.1004.b: "마음을 다잡고 사냥 도구를 정리한다."
 latria_sexual_frustration_flavor.1004.c: "깃털을 천천히 고르고 다시 불러 본다."

 latria_sexual_frustration_flavor.1005.t: "회의 사이에"
 latria_sexual_frustration_flavor.1005.desc.emperor: "제후들이 자리를 뜬 뒤에도 시종들은 지도와 인장을 정리하고 있다. 긴 탁자 끝에는 나만 남았다. 마치지 못한 문서 옆에 오래된 편지 한 통이 눌려 있고, 인주 냄새도 아직 가시지 않았다.\n\n조금 전 그들은 경계와 세금을 두고 다투었다. 나는 고개를 끄덕이기도 하고 몇 마디 반박도 해서, 겉으로는 모든 말을 들은 것처럼 보였을 것이다. 사실 한동안 내가 보고 있던 것은 문서 아래로 삐져나온 편지 모서리뿐이었다.\n\n시종이 탁자를 전부 치울지 물었다. 나는 그 종이 더미 위에 손을 얹고 곧바로 대답하지 않았다."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "동료들은 다음에 건널 나루를 정했지만 탁자 위의 지도는 아직 펼쳐져 있다. 나는 오래된 편지를 등불 아래로 옮겼다. 그러고 보니 여정 목록은 또 한 줄도 눈에 들어오지 않는다.\n\n밖에서는 누군가 마구를 정리하는지 금속 버클이 서로 부딪친다. 내가 확인해야 할 길을 세 번 읽었는데도 기억나는 것은 편지에 적힌 옛 지명 하나뿐이다. 내일 지날 길에는 없는 곳이다.\n\n동료가 문간에서 나를 기다린다. 나는 편지를 덮었지만 그 위에서 손가락을 떼지 못했다."
 latria_sexual_frustration_flavor.1005.desc.clergy: "회의가 끝나고 탁자 위에는 장부와 경전이 펼쳐진 채 남았다. 나는 책장 사이에서 오래된 편지 한 통을 꺼냈다. 잠잠해지지 않던 마음속 생각이 또 돌아온다.\n\n낮에는 기부금과 보수 공사, 축일 일정을 하나하나 정리했다. 혼자 앉고 나니 그런 숫자들은 머릿속에서 밀려났다. 경전에 눌린 자국이 나고 가장자리가 해진 편지인데도 나는 그 글씨를 단번에 알아보았다.\n\n복도를 누군가 지나갔다. 나는 편지를 다시 끼워 넣었다. 처음 들어 있던 바로 그 책장 사이였다."
 latria_sexual_frustration_flavor.1005.desc.ruler: "회의가 끝나도 문서와 봉랍은 탁자 위에 쌓여 있다. 나는 소맷단을 매만진다. 손 가까이 놓인 오래된 편지가 보고서보다 마음을 더 붙든다.\n\n서기관이 남긴 요약문은 명료하게 적혀 있다. 집어 들었지만 첫 번째 이름도 다 읽기 전에 눈길이 편지로 미끄러졌다. 이 탁자에 놓여 있어서는 안 될 편지다. 아침에 여기 끼워 넣은 사람도 나였다.\n\n문밖에서는 사람들이 다음 지시를 기다리고 있다. 나는 우선 더 기다리라고 했다."
 latria_sexual_frustration_flavor.1005.desc: "처리할 일은 많지만, 오래된 편지 한 통 때문에 나는 좀처럼 집중하지 못한다.\n\n문서를 크기대로 쌓았다가 흐트러뜨리고 다시 쌓는다. 편지는 언제나 맨 위에 남겨 둔다. 등잔 기름이 한참 줄어드는 동안 나는 단 한 글자도 결재하지 못했다.\n\n문밖에서 누군가 가볍게 헛기침했다. 그제야 나는 편지 위에서 손을 옮겼다."
 latria_sexual_frustration_flavor.1005.a: "일을 미루고 오래된 편지를 다시 읽는다."
 latria_sexual_frustration_flavor.1005.b: "편지를 치우고 본분으로 돌아간다."
 latria_sexual_frustration_flavor.1005.c: "남은 일을 정리하고 잠시 쉰다."
 latria_sexual_frustration_flavor.1005.d: "할 일을 나누어 모두 마친다."

 latria_sexual_frustration_flavor.1006.t: "촛불 아래의 오래된 편지"
 latria_sexual_frustration_flavor.1006.desc.female: "나는 잠옷 차림으로 등불 아래 앉아 오래된 편지의 접힌 자리에 손끝을 대고 있다. 편지에는 약속도 없이 평범한 안부 몇 마디만 적혀 있다. 끝에는 넓은 빈칸이 남아 있다. 거기까지 쓰다가 갑자기 멈춘 듯하다.\n\n나는 그 빈 곳을 한참 바라보았다. 처음 받았을 때는 별생각 없이 넘겼는데, 오늘 밤은 적혀 있는 글자보다 그 여백이 더 무겁게 느껴진다. 등잔 심지가 타닥 소리를 내자 종이 위에서 그림자가 흔들렸다.\n\n잠옷 끈이 느슨해졌지만 다시 묶지 않았다. 편지는 아직 펼쳐져 있고, 밤도 아직 길다."
 latria_sexual_frustration_flavor.1006.desc.male: "나는 잠옷 차림으로 침대 가장자리에 앉아 있다. 오래된 편지의 글씨를 보니 끝내 답을 얻지 못한 마음이 떠오른다. 종이는 흐물흐물해졌고 접힌 곳은 곧 찢어질 듯하지만, 나는 또 반듯하게 펼친다.\n\n편지에 적힌 것은 여행길의 날씨와 사소한 일 하나다. 하지만 내게는 편지가 온 날 복도에 서 있던 내 모습이 기억난다. 뒤쫓아 나가려다 누군가 부르는 소리에 발을 멈추었다. 나중에 나는 편지를 함에 넣었고, 그 사람은 다시 돌아오지 않았다.\n\n등잔 심지가 조금 더 짧아졌다. 편지의 방향을 바꾸어 보아도 적힌 말은 그대로다."
 latria_sexual_frustration_flavor.1006.desc: "밤은 고요한데, 오래된 편지의 글귀는 좀처럼 내 눈앞에서 떠나지 않는다.\n\n한번만 보고 자려고 했다. 하지만 불을 켜자 그 몇 줄이 나를 붙들었다. 중간까지 읽다가 다시 처음부터 읽는다. 그 사이에 예전에는 알아듣지 못했던 뜻이 숨어 있을 것만 같다.\n\n잠자리는 이미 마련되어 있다. 나는 아직 앉아 있고, 편지 가장자리에는 내가 쥔 자국이 새로 생겼다."
 latria_sexual_frustration_flavor.1006.a: "편지를 끝까지 읽는다."
 latria_sexual_frustration_flavor.1006.b: "편지를 치우고 촛불을 끈 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1007.t: "연회가 끝나기 전에"
 latria_sexual_frustration_flavor.1007.desc.accepted: "이야기 도중 누군가 옛 연인을 언급했지만, 자리에 있는 누구도 무례하다고 여기지 않았다. 잔이 한 차례 부딪치고 웃음도 지나갔다. 날씨처럼 평범한 일을 이야기하는 듯했다.\n\n나도 잔을 들었지만, 눈길은 몇 번이나 비어 있는 자리로 향했다. 그곳의 잔은 이미 치워졌고 반듯하게 눌린 식탁보만 남아 있었다. 내가 누구를 기다리는지도, 그 사람이 오늘 밤 오지 않으리라는 것도 안다.\n\n옆 사람이 무엇을 보느냐고 물었다. 나는 고개를 저었다. 술 마시는 것은 잊은 채였다."
 latria_sexual_frustration_flavor.1007.desc.strict: "사람들이 어떤 은밀한 연애를 경계해야 할 사례로 들더니 이내 명예와 규범을 이야기했다. 말하는 사람은 목소리를 낮췄지만 옆에서는 다 들렸으므로, 웃는 이들도 조심스러웠다.\n\n나는 고개를 숙여 소맷단을 매만지며 입을 다물었다. 내 이야기가 아닌데도 나를 두고 하는 말처럼 들렸다. 탁자 아래에서 술잔 밑동을 손가락으로 한 바퀴 돌리고, 다시 한 바퀴 돌렸다.\n\n화제는 금세 바뀌었다. 소맷단은 이미 반듯해졌지만 내 마음은 아직 그 자리에 머물러 있다."
 latria_sexual_frustration_flavor.1007.desc: "음악은 멎지 않았지만 내 마음은 진작 연회 자리를 떠났다.\n\n손님들은 마지막 술잔을 돌리고 있다. 나는 그들의 입이 움직이는 것을 바라보면서도 마음속에서 꺼낼 곳을 찾지 못한 말만 듣는다. 누군가 내게 건배를 청해 잔을 들자 술이 살짝 출렁였다.\n\n곡이 끝나 간다. 나는 계속 앉아 있다. 이 연회에 마음을 둘지 말지조차 아직 정하지 못한 사람 같다."
 latria_sexual_frustration_flavor.1007.a: "내 그리움도 처음부터 이야기해 준다."
 latria_sexual_frustration_flavor.1007.b: "말을 삼키고 주인에게 감사한 뒤 떠난다."
 latria_sexual_frustration_flavor.1007.c: "대신 옆 사람에게 여행 이야기를 청한다."

 latria_sexual_frustration_flavor.1008.t: "성소 앞의 기도"
 latria_sexual_frustration_flavor.1008.desc.favors: "성소 앞의 촛불이 다 타 간다. 우리 신앙은 육욕의 쾌락을 미워하지 않는다는 말이 떠오른다. 여러 번 들은 말인데도 지금은 처음으로 내가 그 말을 어떻게 받아들일지 정해야 할 것 같다.\n\n촛농이 놋쇠 받침에 쌓여 한 겹 굳었다. 기도를 절반쯤 읊는 동안 입에서는 익숙한 말이 나오지만, 마음에는 한 사람의 손과 그 사람이 다가올 때 옷감이 스치던 소리가 떠오른다. 성소의 상은 그대로이고 불꽃만 한번 흔들렸다.\n\n나는 생각을 기도로 되돌리려 한다. 그러다 도중에 또 놓아 버린다."
 latria_sexual_frustration_flavor.1008.desc.condemns: "나는 성소 앞에서 순결의 서약을 조용히 되뇌지만, 익숙한 기도문이 몇 번이나 입술에서 끊긴다. 첫 문장은 온전히 읊어도 두 번째부터는 말이 빠진다. 그 빈틈으로 생각 하나가 들어온다.\n\n그 생각은 요란하지 않다. 오늘 밤 돌아가도 잠자리는 비어 있고, 내 손을 잡아 줄 사람도 없으리라는 것을 일러 줄 뿐이다. 나는 이마에 내려온 머리카락을 쓸어 넘기고 첫 문장부터 다시 읊는다.\n\n초의 심지가 타닥 소리를 냈다. 내 목소리도 함께 멈추었다."
 latria_sexual_frustration_flavor.1008.desc: "기도는 끝났지만 나는 여전히 촛불 곁에 남아 있다.\n\n읊어야 할 말은 모두 읊었다. 무릎이 조금 저리지만 일어나지 않는다. 불꽃은 낮아졌다가 간신히 다시 선다. 좀처럼 찾아오지 않는 끝을 불꽃도 기다리는 것 같다.\n\n나는 그 작은 빛을 바라본다. 마음속 일을 내려놓지 못했다는 것은 알고 있다. 그저 기도하는 동안만 잠시 밀어 두었을 뿐이다."
 latria_sexual_frustration_flavor.1008.a: "금욕 서약을 내려놓고 내 갈망을 인정한다."
 latria_sexual_frustration_flavor.1008.b: "생각을 억누르고 계속 기도한다."
 latria_sexual_frustration_flavor.1008.c: "경전 한 구절을 읽고 숙고한 뒤 떠난다."
 latria_sexual_frustration_flavor.1008.d: "촛불을 지키며 새벽까지 낭송한다."

 latria_sexual_frustration_flavor.1009.t: "읽지 못한 청원"
 latria_sexual_frustration_flavor.1009.desc.emperor: "긴 탁자 위에 보고서가 펼쳐져 있고, 제후들은 모두 내 말을 기다린다. 같은 줄을 두 번 읽어도 두 번째 숫자가 기억에 남지 않는다. 손가락 사이에서 펜이 한 바퀴 돌다가 빈 곳에 잉크 한 방울을 떨어뜨렸다.\n\n그들의 눈빛은 어느새 공손함에서 망설임으로 바뀌었다. 누군가는 헛기침하고 누군가는 물을 따르지만, 감히 먼저 입을 여는 사람은 없다. 내가 결정을 내려야 한다는 것은 안다. 그런데 머릿속에는 지난밤 끝내 쓰지 못한 반 줄이 스쳐 간다.\n\n서기관이 다음 보고서를 조금 더 가까이 밀어 주었다. 내 손은 아직 첫 번째 보고서 위에 멈춰 있다."
 latria_sexual_frustration_flavor.1009.desc.ruler: "회의는 아직 끝나지 않았는데 탁자 위의 문서는 한 글자도 내 눈에 들어오지 않는다. 문서철을 닫았다가 다시 열어 보아도 여백의 주석은 어제 적힌 그대로다.\n\n신하들은 곡물 가격과 하천을 이야기한다. 몇 단어가 들리다가 이내 정신이 딴 데로 간다. 그러다 어느새 한 사람의 이름에 이른다. 이 문서에는 없는 이름인데도 나는 종이 위에서 계속 찾는다.\n\n누군가 잠시 회의를 멈출지 물었다. 고개를 들고서야 방 안이 한동안 조용했다는 것을 깨달았다."
 latria_sexual_frustration_flavor.1009.a: "자문회를 물리고 홀로 생각에 잠긴다."
 latria_sexual_frustration_flavor.1009.b: "마음을 다잡고 청원을 하나씩 살핀다."
 latria_sexual_frustration_flavor.1009.c: "판결의 순서를 정한 뒤 하나씩 선고한다."

 latria_sexual_frustration_flavor.1010.t: "독수리의 귀환"
 latria_sexual_frustration_flavor.1010.desc.lustful: "매가 숲 위를 맴돈다. 그림자가 내 장갑을 몇 번이나 스쳐 가는데도 내려앉으려 하지 않는다. 팔을 들어 올려도 매는 더 높은 곳에서 한 바퀴를 돌 뿐이다.\n\n좀처럼 돌아오지 않는 매를 보니, 나도 마음이 움직일 때마다 억누르는 일에 지쳤다는 생각이 문득 든다. 사냥꾼들은 말 곁에서 낮은 목소리로 이야기하며 내가 바람을 기다리는 줄 안다. 사실은 이 초조함을 다른 말로 바꿀 수 있기를 기다리고 있다. 하지만 그런 말은 떠오르지 않는다.\n\n매가 한번 울었다. 날카롭고 짧은 소리였다. 더는 명령을 듣지 않겠다는 듯했다."
 latria_sexual_frustration_flavor.1010.desc.chaste: "매는 여전히 멀리서 맴돈다. 나는 장갑을 꽉 쥐고 애써 사냥꾼들의 신호에만 귀를 기울인다. 숲의 경계와 바람의 방향만 보려 한다. 손안의 가죽끈이 축축해졌다.\n\n이렇게 자신을 억누른 적은 많다. 하지만 오늘은 유난히 힘이 든다. 조금 기다릴 때마다 마음속에 품지 말아야 할 말이 하나씩 늘어난다. 혼자 되뇌다가 스스로 말을 끊는다. 말이 마른 나뭇가지를 밟아 부러뜨리자 그 작은 소리에도 놀랐다.\n\n매는 아직 돌아오지 않았다. 내 손은 벌써 뻐근하다."
 latria_sexual_frustration_flavor.1010.desc: "사냥꾼들은 철수하기를 기다리는데, 나는 아직 숲 위의 하늘을 바라보고 있다.\n\n뿔피리는 안장 바로 옆에 있다. 손을 대 보았지만 집어 들지는 않았다. 하늘의 검은 점이 한 바퀴 돌고 또 한 바퀴 돈다. 아무도 재촉하지 않지만 모두가 기다리고 있다.\n\n마침내 고개를 내린 나는 매가 어느 쪽으로 날아갔는지조차 제대로 보지 않았다는 것을 깨달았다."
 latria_sexual_frustration_flavor.1010.a: "생각이 독수리를 따라가는 동안 사냥꾼들을 기다리게 한다."
 latria_sexual_frustration_flavor.1010.b: "귀환 신호를 보내고 사냥 도구를 점검한다."
 latria_sexual_frustration_flavor.1010.c: "숲 옆을 걷다가 일행에게 돌아간다."

 nick_latria_the_unquiet: "평온을 잃은 자"
 nick_latria_the_unquiet_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 자신의 육욕을 연대기에 기록하게 했고, 그 사본은 지금도 곳곳에 퍼져 있습니다."
 latria_flavor_focus: "다잡은 결의"
 latria_flavor_focus_desc: "해당 인물은 경전과 일상적인 의무에 주의를 기울이고 있습니다."
 latria_flavor_remorse: "가시지 않는 후회"
 latria_flavor_remorse_desc: "짧은 위안 뒤에 양심의 가책이 남았습니다."
 latria_flavor_sullied: "손상된 평판"
 latria_flavor_sullied_desc: "소문으로 해당 인물의 평판과 교우 관계가 나빠졌습니다."
 latria_flavor_broken_sleep: "수면 부족"
 latria_flavor_broken_sleep_desc: "잠이 부족해 집중하기 어렵고 쉽게 지칩니다."
 latria_flavor_vagabond_focus: "여행자의 집중"
 latria_flavor_vagabond_focus_desc: "여정의 일거리가 잠시 어지러운 생각을 잠재웁니다."
 latria_flavor_public_disgrace: "공개적인 망신"
 latria_flavor_public_disgrace_desc: "공개적으로 실수했다는 소문에 평판과 교우 관계가 나빠졌습니다."
 latria_flavor_hunting_focus: "사냥에 집중"
 latria_flavor_hunting_focus_desc: "해당 인물은 추적과 매사냥, 승마에 주의를 기울이고 있습니다."
 latria_flavor_warm_company: "즐거운 동행"
 latria_flavor_warm_company_desc: "즐거운 대화를 나눈 뒤로 다른 이들과 어울리기를 더 좋아하게 되었습니다."
 latria_flavor_neglected_duties: "소홀해진 의무"
 latria_flavor_neglected_duties_desc: "사적인 걱정거리 탓에 의무를 다하지 못했습니다."
 latria_flavor_diligent_work: "정리된 업무"
 latria_flavor_diligent_work_desc: "해당 인물은 어지러운 마음을 세심한 계획과 노동에 쏟았습니다."
 latria_flavor_repression_released_tt: "[latria_sexual_repression|E]: #P -[SCOPE.ScriptValue('latria_flavor_release_amount')|0]#!"
 latria_flavor_repression_reflected_tt: "[latria_sexual_repression|E]: #P -[SCOPE.ScriptValue('latria_flavor_reflection_amount')|0]#!"
 latria_flavor_repression_restrained_tt: "[latria_sexual_repression|E]: #N +[SCOPE.ScriptValue('latria_flavor_resistance_gain')|0]#!"
