l_korean:
 latria_sexual_frustration_flavor.1201.t: "아무도 찾아오지 않는 시간"
 latria_sexual_frustration_flavor.1201.desc.female: "나는 잠옷 차림으로 창가에서 한참을 기다렸다. 탁자 위의 차는 뜨거웠다가 미지근해졌고, 이제는 얇은 막까지 생겼다. 약속한 만남도 아닌데 불을 남겨 두고 빈 잔을 놓고 창가의 의자까지 바로 세웠다.\n\n뜰에는 순찰하는 사람만 한 번 지나갔다. 등불이 담 위를 스쳤다가 사라졌다. 잔을 돌려 보았지만 차는 이미 마실 수 없게 되었다. 지난번에 그 사람이 떠나면서 했던 '시간이 나면'이라는 말이 떠오른다. 어느 밤이나 들어맞을 만큼 막연한 말이었다. 어느 밤에도 해당하지 않을 수도 있었다.\n\n초의 심지가 짧아졌다. 나는 아직 앉아 있다. 잠옷이 한쪽 어깨에서 흘러내렸지만 끌어 올리지 않았다."
 latria_sexual_frustration_flavor.1201.desc.male: "나는 잠옷 차림으로 창가에서 한참을 기다렸다. 뜰에서는 야간 순찰의 발소리만 멀어졌다가 가까워진다. 아무도 오지 않을 텐데 불은 그대로 켜 두었다. 켜 두면 입 밖에 내지 못한 초대의 말을 마저 할 수 있을 것처럼.\n\n식은 차를 한 모금 마시니 쓴맛에 얼굴이 찌푸려졌다. 그래도 끝까지 마셨다. 잔 바닥에 찻잎 몇 장이 남았다. 그것을 들여다보면 그 사람이 오늘 밤 다른 곳에 있는지 알 수라도 있을 듯 바라보았다. 창밖의 바람이 나뭇가지를 눌렀다가 놓았다.\n\n나는 창틀에 손을 얹었다. 나무는 차갑다. 서늘함이 손바닥으로 전해져도 마음속 열기는 아직 남아 있다."
 latria_sexual_frustration_flavor.1201.desc: "초의 심지가 짧아졌지만 창밖에는 줄곧 아무 기척도 없다.\n\n나는 심지를 한 번 돋웠다. 불꽃은 잠깐 커졌다가 곧 다시 낮아졌다. 탁자에는 종이와 펜, 더는 마실 수 없는 차 한 잔이 있다. 어느 것에나 손을 대 보았지만 이 밤을 달라지게 해 준 것은 하나도 없다.\n\n결국 나는 가만히 앉아 내 숨소리가 고요를 채우는 것을 듣는다."
 latria_sexual_frustration_flavor.1201.a: "하려던 말을 적는다."
 latria_sexual_frustration_flavor.1201.b: "촛불을 끄고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1202.t: "목욕탕 밖의 속삭임"
 latria_sexual_frustration_flavor.1202.desc.accepted: "목욕탕 밖의 웃음과 이야기는 누가 누구와 함께 왔다는 이유로 멈추지 않는다. 문틈에서 김이 밀려 나오며 비누풀과 뜨거운 돌 냄새를 풍긴다. 젖은 머리를 늘어뜨리고 옷끈을 느슨하게 맨 사람이 내 곁을 지나가도 누구 하나 눈여겨보지 않는다.\n\n이렇게 흔한 광경이라면 나도 대수롭지 않게 넘겨야 할 것이다. 그런데 문턱 밖에 서니 누군가에게 저처럼 편안하게 다가간 지 참 오래되었다는 생각이 문득 든다. 안에서는 누군가 웃으며 다른 사람의 이름을 부른다. 방금 물에서 나온 듯한 목소리다. 내 손가락은 문틀 위에서 멈추었다.\n\n바람이 김을 내 얼굴로 밀어 보냈다. 나는 들어가지도 떠나지도 않았다."
 latria_sexual_frustration_flavor.1202.desc.strict: "목욕탕 문밖에서 귀족 몇 명이 누가 누구를 피해야 하는지 이야기하고 있다. 내 이름이 들리는 순간 대화가 끊겼다. 안에서는 여전히 물소리가 나지만 밖은 옷감 스치는 소리까지 들릴 만큼 조용하다.\n\n한 사람이 내게 고개를 끄덕였다. 지나치게 급한 인사였다. 다른 사람은 이미 반듯한 소맷단을 매만진다. 무슨 부류의 이야기를 하고 있었는지 나는 안다. 귀가 뜨거워진 것은 목욕탕의 김 때문이 아니다.\n\n나는 그 자리에 잠시 서 있었다. 안에서 한 번씩 들리는 물소리가 이 침묵의 길이를 세는 듯하다."
 latria_sexual_frustration_flavor.1202.desc: "목욕탕 안에서는 물소리가 끊이지 않지만 문가의 목소리가 내 신경을 더 붙든다.\n\n나는 세수하러 왔을 뿐이다. 문 앞에 이르니 안에서 낮게 이야기하다 말고 웃는 소리가 들렸다. 크지도 않은 웃음소리에 발이 멈추었다. 무엇 때문에 웃는지는 모르지만 여기 서서 엿들으면 안 된다는 것은 안다.\n\n그래도 나는 그 말을 끝까지 들었다. 다 듣고 나니 얼굴이 손에 든 수건보다 더 뜨거웠다."
 latria_sexual_frustration_flavor.1202.a: "바라는 만남을 한없이 이야기한다."
 latria_sexual_frustration_flavor.1202.b: "생각을 접고 감사 인사를 한 뒤 떠난다."

 latria_sexual_frustration_flavor.1203.t: "기도 뒤의 침묵"
 latria_sexual_frustration_flavor.1203.desc.favors: "사제는 사람의 욕망이 본래부터 죄인 것은 아니라고 말했다. 종소리가 아직 들보 위에서 울리는 동안 사제는 벌써 경전을 덮고 내게 말할 틈을 주었다.\n\n나는 그 말을 믿고 싶다. 하지만 마음속 빈 곳은 줄어들지 않았다. 그대로 무릎을 꿇고 내 손을 본다. 낮에는 이 손으로 사람들에게 빵을 나누어 주었는데, 밤에는 여기 없는 한 사람을 붙잡고 싶을 뿐이다. 신앙이 허락해도 이 손을 잡아 줄 사람이 생기는 것은 아니다.\n\n사제는 내가 묻기를 기다린다. 나는 묻지 못하고 이마에 내려온 머리카락만 쓸어 넘겼다."
 latria_sexual_frustration_flavor.1203.desc.condemns: "사제는 금욕의 미덕을 말하고는 침묵했다. 그 침묵은 훈계보다 무겁다. 나는 제자리에 무릎을 꿇고 있다. 무릎 아래 방석은 벌써 따뜻해졌고 기도문도 여전히 익숙한데, 마음은 멀리 사원 밖 어느 길에 머물러 있다.\n\n대답해야 한다는 것은 안다. 하지만 목에서는 숨 한 번만 나와 아주 작은 '예'가 되었다. 사제는 나를 한번 보았을 뿐 더 묻지 않았다. 그 눈길을 받으니 내 대답이 더욱 미덥지 못하게 느껴진다.\n\n종소리가 멎었다. 사원 안에는 가끔 초의 심지가 타닥거리는 소리만 남았다."
 latria_sexual_frustration_flavor.1203.desc: "기도는 끝났지만 사원 안에는 아직 종소리가 울린다.\n\n다른 이들은 이미 일어섰다. 나는 한 구절을 빠뜨린 사람처럼 계속 무릎을 꿇고 있다. 사실 빠뜨린 말은 없다. 다 읊고 나서도 그 열기가 남아 있을 뿐이다. 기도문과 함께 사라지지도, 사람들을 따라 떠나지도 않는다.\n\n나는 손바닥을 돌바닥에 댔다. 돌은 차갑지만 그 서늘함은 손목까지만 전해지고 더는 올라오지 않는다."
 latria_sexual_frustration_flavor.1203.a: "당분간 금욕의 가르침을 내려놓는다."
 latria_sexual_frustration_flavor.1203.b: "생각을 억누르고 다시 기도한다."

 latria_sexual_frustration_flavor.1204.t: "사냥 뒤에도 가라앉지 않는 마음"
 latria_sexual_frustration_flavor.1204.desc.lustful: "나는 옷을 벗은 채 침실에 혼자 있다. 귀에는 아직 활시위 소리가 남아 있다. 사냥복은 의자에 던져 두었고 장화의 진흙도 마르지 않았다. 다리와 어깨는 피곤하지만 마음은 그 피로에 가 있지 않다.\n\n낮에 숲에서 한 사람과 말을 탄 채 스쳐 지나갔다. 그냥 지나쳤을 뿐 소매조차 닿지 않았다. 그런데 나는 그 한순간을 몇 번이고 떠올린다. 고삐를 당기던 손과 돌아보며 짓던 옅은 미소, 웃고 난 뒤에는 더 보지 않던 모습까지. 지금 방에는 말도 그 사람도 없다. 놋거울 속의 나만 있다.\n\n나는 침대 가장자리에 앉았다. 깔개가 살갗에 닿고서야 아직 옷을 걸치지 않았다는 생각이 났다."
 latria_sexual_frustration_flavor.1204.desc.chaste: "나는 옷을 벗은 채 침실에 혼자 있다. 기도와 의무로 마음을 되돌리려 애쓴다. 사냥복은 옆에 개어 두었고 세수조차 아직 하지 않았다. 눈을 감을 때마다 갈망이 떠오른다. 숲속 짐승의 흔적보다 더 또렷하다.\n\n마음속으로 서약을 한번 되뇌었다. 절반쯤 이르자 숲에서 그 사람이 돌아보던 모습이 끼어들어 말이 끊겼다. 눈을 뜨고 내 손을 본다. 손이 아직 떨리는데 사냥으로 지쳐서인지 다른 이유인지 모르겠다.\n\n문밖에서 시종이 더운물을 가져올지 물었다. 나는 대답했다. 생각보다 목소리가 잠겨 있었다."
 latria_sexual_frustration_flavor.1204.desc: "사냥터는 비었는데 내 마음의 동요는 좀처럼 가시지 않는다.\n\n방으로 돌아와 활을 내려놓고 장갑도 내려놓았다. 하지만 낮에 스친 그 눈길은 내려놓지 못했다. 방 안에는 진흙과 땀 냄새가 난다. 잠시 서 있다 보니 내가 계속 문을 바라보고 있었다. 누군가 뒤따라 들어오기를 기다리는 것처럼.\n\n아무도 들어오지 않았다. 그 문을 닫은 사람은 나였다."
 latria_sexual_frustration_flavor.1204.a: "사냥터에서 본 그 모습을 떠올린다."
 latria_sexual_frustration_flavor.1204.b: "옷을 입고 책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1205.t: "닫힌 서재"
 latria_sexual_frustration_flavor.1205.desc.emperor: "나는 모두에게 서재에서 나가라고 명했다. 지도와 인장, 끝내지 못한 문서만 남겼다. 문이 닫히고 나니 내 숨소리만 들린다. 서랍에서 꺼낸 오래된 편지는 가장자리가 벌써 해져 있다.\n\n이 편지는 나랏일을 다루지 않는다. 이루어지지 못한 만남과, 그때는 앞으로 시간이 많다고 여기며 했던 말이 적혀 있다. 그 뒤로 많은 날이 지났는데 편지는 남아 있다. 나는 편지 위에 인장을 올렸다가 다시 치웠다. 인장은 차갑고 편지지는 아직 온기가 남은 듯하다.\n\n문밖에서 누군가 작은 목소리로 식사를 들일지 물었다. 나는 답하지 않았다."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "여정과 당번은 종이에 적혀 있고 동료들은 문밖에서 기다린다. 모두의 쉴 시간을 정해 주었지만 내 차례가 되자 펜이 멈추었다. 서랍의 오래된 편지는 모서리를 드러낸 채다. 경로를 적은 종이 아래에 가려지기를 일부러 거부하는 것 같다.\n\n나는 편지를 꺼냈다. 첫머리의 호칭을 보고는 지금 읽어서는 안 된다는 것을 알았다. 문밖에서 누군가 두드리며 다음 목적지로 계속 갈 것이냐고 물었다. 나는 간다고 대답하면서도 눈은 편지의 둘째 줄에 두었다.\n\n둘째 줄에는 지명 하나뿐이다. 우리가 지날 길에는 없는 곳이다."
 latria_sexual_frustration_flavor.1205.desc.clergy: "나는 서재에 혼자 앉아 있다. 장부도 덮지 않았고 경전도 치우지 않았다. 책장 사이에 오래된 편지가 끼워져 있어 벌써 몇 번이나 손을 뻗었다가 거두었다.\n\n오늘 온 편지가 아니다. 경전 안에 오래 끼워 둔 탓에 이제는 이 쪽을 펼 때마다 잠시 멈추게 된다. 오늘은 마침내 편지를 꺼냈다. 종이에는 도를 넘는 말이 없는데도 읽는 동안 숨이 흐트러졌다.\n\n복도를 누군가 지나며 기도 구슬이 작게 부딪쳤다. 나는 편지를 책 안으로 도로 눌러 넣었다. 눌러 두고도 그 가장자리가 손에 느껴진다."
 latria_sexual_frustration_flavor.1205.desc.ruler: "시종들은 서재 문밖을 지키고 있다. 나는 방해하지 말라고 일렀다. 인장과 문서는 눈앞에 놓여 있지만 서랍에서 꺼낸 오래된 편지는 좀처럼 치우지 못한다.\n\n다리에 관한 보고서를 결재해야 했다. 펜 끝이 종이 위에 멈춘 사이 잉크가 떨어져 점을 남겼다. 그 점을 보다가 다리와 아무 상관 없는 편지의 한 문장이 떠올랐다. 짧은 말인데 나는 그것이 몇 번째 줄에 적혀 있는지까지 기억한다.\n\n문밖에서 누군가 발을 옮겼다. 나는 보고서를 밀어 놓고 서랍으로 손을 뻗었다."
 latria_sexual_frustration_flavor.1205.desc: "나는 서재 문을 닫았다. 오래된 편지와 끝내지 못한 일이 모두 탁자 위에 남아 있다.\n\n빗장이 내려앉는 소리는 작았다. 그 소리가 그치자 방 안에는 종이 소리뿐이다. 나는 일할 문서를 왼쪽에, 편지를 오른쪽에 놓았다. 잠시 바라보다 편지를 다시 가운데로 옮겼다.\n\n등잔 심지가 타닥 소리를 냈다. 나는 심지를 다듬지 않았다."
 latria_sexual_frustration_flavor.1205.a: "일을 내일로 미루고 편지를 다시 읽는다."
 latria_sexual_frustration_flavor.1205.b: "묵은 갈망을 억누르고 본분을 다한다."

 latria_sexual_frustration_flavor.1206.t: "연회의 소문"
 latria_sexual_frustration_flavor.1206.desc.accepted: "연회에서 누군가 연인 이야기를 꺼냈다. 날씨를 이야기하듯 가벼운 말투다. 술이 한 차례 도는 동안 이야기 속 이름이 둘이나 바뀌었지만 사람들은 계속 웃었다. 목소리를 낮추는 사람도 없다.\n\n나도 웃어넘기려 했다. 그러다 내가 이런 이야기를 나눈 지 얼마나 오래되었는지 문득 알았다. 잔을 어디 놓을지조차 다른 사람을 먼저 살필 만큼 오래되었다. 옆 사람이 내게도 들려줄 이야기가 있느냐고 물었다. 내 손가락이 잔 가장자리에서 멈추었다.\n\n사람들 너머로 음악이 들린다. 듣고는 있지만 어느 곡인지 알아듣지 못했다."
 latria_sexual_frustration_flavor.1206.desc.strict: "귀족 몇 명이 처신을 잘못해 총애를 잃은 동료를 이야기하다가 누군가 내 이름을 꺼냈다. 대화는 완전히 끊기지 않았다. 큰 목소리가 속삭임으로 바뀌었을 뿐이다. 나는 고개를 숙여 소맷단을 매만지며 끼어들지 않았다.\n\n그들이 하는 말이 사실인지는 알 수 없다. 이제 사실인지 아닌지는 중요하지 않다. 정작 내 마음에도 이 자리에 꺼낼 수 없는 일이 있고, 그들의 눈은 벌써 그것을 본 듯하다는 것이 문제다. 나는 술을 다 마셨다. 술기운은 목이 아니라 얼굴에 올랐다.\n\n누군가 화제를 바꾸려 잔을 들었다. 잔이 부딪칠 때도 내 손은 움찔했다."
 latria_sexual_frustration_flavor.1206.desc: "사람들 너머로 음악이 들리지만 자리의 대화가 내 마음을 더 흩뜨린다.\n\n나는 제자리에 앉아 사방에서 오가는 이야기를 듣는다. 이리저리 돌아도 끝내는 침장과 사적인 편지 이야기로 이어진다. 누군가는 웃고, 누군가는 헛기침하고, 누군가는 곁눈으로 나를 본다. 그 눈길이 우연이었는지 모르겠다.\n\n나는 빈 잔을 한 바퀴 돌렸다. 잔 밑바닥이 탁자를 스치며 아주 작은 소리를 냈다."
 latria_sexual_frustration_flavor.1206.a: "옛이야기를 모두 들려주고 사적으로 나눈 말까지 되풀이한다."
 latria_sexual_frustration_flavor.1206.b: "말을 삼키고 동석자들에게 인사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1207.t: "기도 뒤의 빈자리"
 latria_sexual_frustration_flavor.1207.desc.favors: "예배가 끝나자 사제는 자리에 경전을 두고 떠났다. 빈자리에는 앉았던 자국이 아직 남아 있다. 신앙은 욕망을 죄로 여기지 않는다는 말이 내가 방금 읽은 쪽에 또렷한 글씨로 적혀 있다.\n\n그런데도 나는 어떻게 마음을 가라앉힐지 모르겠다. 허락된다는 것과 밤에 혼자 자기 손을 바라보는 것은 별개의 일이다. 나는 빈자리 옆에 잠시 서 있었다. 앉지도 않고 경전을 덮지도 않았다.\n\n바람에 사원의 문이 조금 닫혔다. 남은 틈으로 빛이 들어와 바로 그 구절을 비춘다."
 latria_sexual_frustration_flavor.1207.desc.condemns: "사제가 떠난 뒤에도 나는 제자리에 무릎을 꿇고 있다. 순결에 관한 가르침은 명확하며 하나하나 외울 수도 있다. 하지만 마음속 갈망은 사제와 함께 떠나지 않았다. 무릎을 꿇고 손을 모은 지금도 분명하게 남아 있다.\n\n나는 비어 있는 자리를 바라보았다. 아무 생각도 하지 않아도 되는 그 나무판이 문득 부러워졌다. 나는 그럴 수 없다. 이마 한쪽을 대 보았지만 느껴지는 것은 여전히 내 열기였다.\n\n초가 조금 더 짧아졌다. 나는 아직 무릎을 꿇고 있다."
 latria_sexual_frustration_flavor.1207.desc: "사원 안에는 나와 아직 꺼지지 않은 촛불만 남았다.\n\n사람들의 발소리는 이미 멀어졌다. 지금 떠나 문을 닫고 이 책장을 넘겨도 된다. 하지만 나는 그러지 않았다. 빈자리 사이로 두어 걸음 걸었다가 원래 있던 방석으로 돌아왔다.\n\n불꽃은 고요하다. 그런데 내 귀에는 맥박 소리가 울린다."
 latria_sexual_frustration_flavor.1207.a: "사원을 떠나 그 애정에 생각을 맡긴다."
 latria_sexual_frustration_flavor.1207.b: "욕망을 억누르고 계율을 다시 읽는다."

 latria_sexual_frustration_flavor.1208.t: "숲속의 추격"
 latria_sexual_frustration_flavor.1208.desc.lustful: "사냥감이 숲을 가로질러 달아나고 사람들이 뒤를 쫓았다. 나도 말을 몰아 따라갔다. 나뭇가지가 소매를 때리고 말의 땀 냄새가 얼굴로 밀려온다. 한참을 달리고 나서야 내가 쫓는 것이 그 짐승이 아니라는 것을 알았다.\n\n앞에 한 사람의 뒷모습이 있다. 함께 사냥하는 사람일 뿐, 그 이상은 아니다. 그런데 그 모습이 말 위에서 움직일 때마다 내 눈길이 거기에 붙들려 갈림길까지 지나쳤다. 사냥개 짖는 소리는 왼쪽으로 갔는데 내 말은 계속 앞으로 달린다.\n\n나는 고삐를 당겼다. 그 사람은 돌아보지 않았다. 내 숨은 사냥 때문이라고만 하기에는 너무 가빴다."
 latria_sexual_frustration_flavor.1208.desc.chaste: "나는 말고삐를 당기며 이번에는 사냥만 하러 왔다고 스스로에게 일렀다. 사냥개 짖는 소리는 멀어지고 젖은 진흙의 발굽 자국은 뚜렷하다. 그런데도 두 번 보고서야 어느 쪽으로 꺾였는지 알았다.\n\n생각은 발굽 자국을 따라가지 않는다. 조금 전 안장 끈을 조여 주던 손에 머물러 있다. 그 손은 흔들림 없이 일을 마치고는 놓아주었다. 아무 말도 하지 않았다. 하지만 나는 그 잠깐의 손길에 다른 뜻을 붙들어 두었다.\n\n말이 콧김을 뿜었다. 그제야 내가 같은 자리에 너무 오래 머물렀다는 것을 깨달았다."
 latria_sexual_frustration_flavor.1208.desc: "일행이 숲속에 멈추어 추적을 계속할지 내가 정하기를 기다린다.\n\n모두의 얼굴이 나를 향한다. 마구에서는 아직 물이 떨어지고 누군가 이마를 훔친다. 나는 바닥의 발자국을 본다. 자국은 선명한데 내 대답은 그렇지 못하다. 마음의 절반은 아직 숲 반대쪽에, 사냥감과 관계없는 한 사람에게 머물러 있다.\n\n나무 사이로 바람이 불어왔다. 나는 고삐를 쥔 채 곧바로 입을 열지 않았다."
 latria_sexual_frustration_flavor.1208.a: "다른 이들을 앞서 보내고 홀로 생각에 잠긴다."
 latria_sexual_frustration_flavor.1208.b: "마음을 다잡고 사냥을 계속 이끈다."

 latria_sexual_frustration_flavor.1209.t: "창가의 잉걸불"
 latria_sexual_frustration_flavor.1209.desc.female: "나는 잠옷 차림으로 창가에 앉아 있다. 난로에는 가느다란 잉걸불만 남았다. 낮에 꺼내지 못한 말을 입안에서 한 번 굴렸다가 다시 삼킨다. 길지도 않은 말이다. 길었던 것은 지금까지 그 말을 참은 시간이다.\n\n잉걸불이 가끔 밝아지며 무릎 위에 놓인 내 손을 비춘다. 손가락이 나도 모르게 잠옷 끝을 움켜쥐어 주름을 만들었다. 오늘 그 사람이 내 곁을 지나가며 소매로 일으킨 바람이 떠오른다. 그저 바람일 뿐인데 나는 그 방향까지 계속 기억하고 있다.\n\n창밖에서 밤을 알리는 소리가 났다. 나는 대답하지 않았다. 잠들고 싶지도 않다."
 latria_sexual_frustration_flavor.1209.desc.male: "나는 잠옷 차림으로 창틀에 기대어 뜰을 도는 순찰의 등불을 바라본다. 불빛이 하나씩 지나가며 밤을 짧게 나누는 듯하다. 답을 얻지 못한 내 마음은 나뉘지 않고 통째로 가슴에 남아 있다.\n\n나는 이마를 창살에 댔다. 나무에서 오래된 칠 냄새가 난다. 말하면서 다른 곳을 보던 그 사람이 생각난다. 나를 보면 말이 다른 뜻으로 바뀔까 두려운 듯했다. 나도 그때 눈길을 피했다. 서로 피하고 나서는 둘 다 더 말하지 않았다.\n\n난로 속 숯이 한번 소리를 내며 조금 내려앉았다."
 latria_sexual_frustration_flavor.1209.desc: "창밖은 고요하고 난롯불은 어두워지는데 나는 조금도 졸리지 않는다.\n\n작은 장작 하나를 넣었지만 불은 살아나지 않고 연기만 조금 났다. 연기 냄새가 잠옷에 배었다. 나는 창가로 돌아와 낮에 전하지 못한 말을 다시 조용히 되뇌었다. 끝까지 말해도 듣는 사람은 없었다.\n\n뜰에는 밤의 어둠이 짙게 내려앉아 있다. 나는 그것을 바라보지만 어둠은 나를 돌아보지 않는다."
 latria_sexual_frustration_flavor.1209.a: "생각을 종이에 적는다."
 latria_sexual_frustration_flavor.1209.b: "불을 지피고 갈망을 접은 뒤 눕는다."

 latria_sexual_frustration_flavor.1210.t: "문 두드리는 이 없고"
 latria_sexual_frustration_flavor.1210.desc.emperor: "시종이 예관을 치워 주었고, 나는 잠옷 차림으로 침대 가장자리에 혼자 앉았다. 제국의 경계도, 세금 장부도, 내일 만날 사람들도 그 사적인 일을 밀어내지 못했다. 아무도 없는 침대 반대편에 그 생각이 앉아 있는 듯하다.\n\n나는 빈 쪽을 바라보았다. 베개도 이불 모서리도 반듯하다. 그 반듯함 자체가 나를 나무라는 것 같다. 그쪽에 손 하나를 얹었다. 옷감은 차갑다. 차가운 감촉을 느끼고도 손을 거두지 않았다.\n\n복도의 등불 하나가 꺼졌다. 이 문을 두드리러 오는 사람은 없다."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "동료들은 여관에서 잠들었고 나는 잠옷 차림으로 보내지 않은 편지를 지킨다. 내일도 길을 떠나야 하고 말에게도 벌써 먹이를 주었다. 하지만 이 마음은 여기 두고 갈 수 없다. 짐 속으로 따라 들어와 다음 나루까지 함께 갈 것이다.\n\n나는 등불 아래에서 편지를 돌려 보았다. 상대를 부르는 말에 힘이 너무 들어가 있다. 길에서 가볍게 부칠 편지처럼 보이지 않는다. 아래층에서 누군가 계산을 하며 동전을 부딪쳤다. 그 소리가 지나가자 방은 더 조용해졌다.\n\n나는 옷가지 사이에 편지를 끼워 넣었다. 넣고 나서도 몇 번째 옷 아래에 있는지 안다."
 latria_sexual_frustration_flavor.1210.desc.clergy: "나는 의례복을 침대 곁에 걸고 잠옷 차림으로 작은 방에 홀로 앉았다. 방금 내가 읊은 서약이 아직 귓가에 남아 있다. 마음은 그 때문에 고요해지지 않았다. 손가락 사이의 기도 구슬은 한참 동안 같은 알에서 멈춰 있다.\n\n나는 이 밤을 마땅히 바쳐야 할 곳에 바치고 싶다. 하지만 조용해질 때마다 기도 중에 떠올려서는 안 될 얼굴이 눈앞에 나타난다. 구슬을 꽉 쥐니 손바닥이 눌린다. 아플 만큼 쥐어도 그 얼굴은 그대로다.\n\n작은 방의 문은 빗장이 제대로 걸리지 않았다. 틈으로 바람이 들어와 등불이 기울었다."
 latria_sexual_frustration_flavor.1210.desc.ruler: "예복은 이미 치워졌고 나는 잠옷 차림으로 침대 곁에 남아 있다. 문밖의 경비는 내 한숨을 듣지 못한다. 지위도 이 마음을 가라앉혀 주지 못했다. 내일 알현할 사람들을 머릿속으로 차례차례 떠올려 보다가 세 번째에서 더 나아가지 못했다.\n\n그 세 번째 사람은 알현과 아무 관계가 없다. 그래도 나는 거기서 순서를 멈추었다. 머리맡의 등불이 벽에 내 그림자를 드리운다. 그림자가 나보다 더 반듯하게 앉아 있다.\n\n나는 심지를 낮추었다. 그림자는 작아졌고 나는 계속 앉아 있다."
 latria_sexual_frustration_flavor.1210.desc: "밤은 벌써 깊었지만 나는 아직 이 마음속 일을 혼자 지키고 있다.\n\n문은 닫혀 있고 불은 켜져 있고 잠자리에 들 사람은 나뿐이다. 그 세 가지는 달라지지 않았다. 달라진 것은 이제 내가 곧 잠들 수 있는 척하지 않는다는 점이다. 나는 겉옷을 의자 등받이에 놓았다가 다시 들었다. 누가 언제든 밖으로 부를 것처럼.\n\n부르는 사람은 없다. 나는 의자 등받이에 옷을 다시 내려놓았다."
 latria_sexual_frustration_flavor.1210.a: "늦은 시간에도 믿을 만한 지인을 불러 길게 이야기한다."
 latria_sexual_frustration_flavor.1210.b: "갈망을 억누르고 촛불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1202.c: "화제를 바꾸어 일행의 안부를 묻는다."
 latria_sexual_frustration_flavor.1202.d: "모두 차에 초대하고 지칠 때까지 이야기한다."
 latria_sexual_frustration_flavor.1203.c: "사제에게 남아서 가르침을 함께 공부하자고 청한다."
 latria_sexual_frustration_flavor.1204.c: "잠옷을 입고 낮의 생각을 천천히 헤아린다."
 latria_sexual_frustration_flavor.1205.c: "불침번을 정하고 잠시 쉰다."
 latria_sexual_frustration_flavor.1205.d: "내일의 의무를 하나씩 적는다."
 latria_sexual_frustration_flavor.1206.c: "새로운 시로 화제를 돌린다."
 latria_sexual_frustration_flavor.1207.c: "경전 앞에 앉아 이 장을 마저 읽는다."
 latria_sexual_frustration_flavor.1208.c: "말을 쉬게 하고 천천히 발자국을 살핀다."
 latria_sexual_frustration_flavor.1209.c: "불을 지피고 차를 끓여 오래된 책을 읽는다."
 latria_sexual_frustration_flavor.1209.d: "하지 못한 말을 시로 적는다."
 latria_sexual_frustration_flavor.1210.c: "내일을 계획하고 할 일을 하나씩 정리한다."
