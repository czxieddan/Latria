l_korean:
 latria_sexual_frustration_flavor.1201.t: "아무도 찾아오지 않는 시간"
 latria_sexual_frustration_flavor.1201.desc.female: "차가 식을 때까지 잠옷 차림으로 창가에서 기다린다. 약속한 만남도 없는데 내 마음은 자꾸 그 자리를 비워 둔다."
 latria_sexual_frustration_flavor.1201.desc.male: "잠옷 차림으로 창가에서 기다린다. 뜰을 지나는 것은 야경꾼뿐이다. 아무도 오지 않겠지만 아직 촛불을 끄고 싶지 않다."
 latria_sexual_frustration_flavor.1201.desc: "심지가 짧아진다. 창밖에는 아무 기척도 없다."
 latria_sexual_frustration_flavor.1201.a: "하려던 말을 적는다."
 latria_sexual_frustration_flavor.1201.b: "촛불을 끄고 갈망을 억누른 뒤 눕는다."

 latria_sexual_frustration_flavor.1202.t: "목욕탕 밖의 속삭임"
 latria_sexual_frustration_flavor.1202.desc.accepted: "누가 누구와 왔든 목욕탕에서는 웃음소리가 끊이지 않는다. 평범한 광경일 텐데, 나는 그처럼 거리낌 없이 지낸 지 얼마나 오래되었는지 떠올린다."
 latria_sexual_frustration_flavor.1202.desc.strict: "목욕탕 밖에서 귀족 몇 명이 누가 누구를 피해야 하는지 이야기한다. 내 이름이 들리더니 대화가 잠잠해진다."
 latria_sexual_frustration_flavor.1202.desc: "목욕탕 안에서는 물소리가 울리지만 밖의 목소리에 더 신경이 쓰인다."
 latria_sexual_frustration_flavor.1202.a: "바라는 만남을 한없이 이야기한다."
 latria_sexual_frustration_flavor.1202.b: "생각을 접고 감사 인사를 한 뒤 떠난다."

 latria_sexual_frustration_flavor.1203.t: "기도 뒤의 침묵"
 latria_sexual_frustration_flavor.1203.desc.favors: "사제는 욕망 자체가 죄악인 것은 아니라고 한다. 믿고 싶지만 마음속 빈자리는 그대로다."
 latria_sexual_frustration_flavor.1203.desc.condemns: "사제는 순결의 미덕을 이야기한 뒤 침묵한다. 나는 그 자리에 무릎 꿇은 채 익숙한 기도를 올리지만 생각은 멀리 가 있다."
 latria_sexual_frustration_flavor.1203.desc: "기도는 끝났다. 사원의 종소리가 아직 귓가에 울린다."
 latria_sexual_frustration_flavor.1203.a: "당분간 금욕의 가르침을 내려놓는다."
 latria_sexual_frustration_flavor.1203.b: "생각을 억누르고 다시 기도한다."

 latria_sexual_frustration_flavor.1204.t: "사냥 뒤에도 가라앉지 않는 마음"
 latria_sexual_frustration_flavor.1204.desc.lustful: "옷을 벗고 방에 홀로 있는데도 활시위 소리가 귓가에 남아 있다. 몸은 피곤하지만 생각은 사냥터의 모든 그림자를 쫓는다."
 latria_sexual_frustration_flavor.1204.desc.chaste: "옷을 벗고 방에 홀로 앉아 기도와 의무로 마음을 돌려 본다. 눈을 감을 때마다 갈망이 돌아온다."
 latria_sexual_frustration_flavor.1204.desc: "사냥터는 비었지만 마음속 동요는 가시지 않는다."
 latria_sexual_frustration_flavor.1204.a: "사냥터에서 본 그 모습을 떠올린다."
 latria_sexual_frustration_flavor.1204.b: "옷을 입고 책상으로 돌아가 생각을 억누른다."

 latria_sexual_frustration_flavor.1205.t: "닫힌 서재"
 latria_sexual_frustration_flavor.1205.desc.emperor: "서재에서 모두 물리고 지도와 인장, 끝내지 못한 서류만 남겼다. 서랍에서 오래된 편지를 꺼냈지만 차마 다시 읽지는 못하겠다."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "이동 경로와 불침번이 탁자 위 종이에 적혀 있다. 동료들은 밖에서 기다린다. 모두에게 쉴 시간을 내주었지만 내 차례를 생각하자 오래된 편지가 떠오른다."
 latria_sexual_frustration_flavor.1205.desc.clergy: "서재에 홀로 앉아 장부도 경전도 덮지 못했다. 책장 사이에는 오래된 편지가 있다. 몇 번이나 손을 뻗었다 거둔다."
 latria_sexual_frustration_flavor.1205.desc.ruler: "시종들은 서재 문밖에서 기다린다. 방해하지 말라고 일러두었다. 인장과 서류는 눈앞에 있지만 오래된 편지를 아직 서랍에 돌려놓지 못했다."
 latria_sexual_frustration_flavor.1205.desc: "서재 문을 닫는다. 오래된 편지와 끝내지 못한 일은 탁자 위에 남아 있다."
 latria_sexual_frustration_flavor.1205.a: "일을 내일로 미루고 편지를 다시 읽는다."
 latria_sexual_frustration_flavor.1205.b: "묵은 갈망을 억누르고 본분을 다한다."

 latria_sexual_frustration_flavor.1206.t: "연회의 소문"
 latria_sexual_frustration_flavor.1206.desc.accepted: "연회에서 누군가 날씨 이야기라도 하듯 연인을 언급한다. 웃어넘기려다 그런 대화에 끼어든 지 얼마나 오래되었는지 깨닫는다."
 latria_sexual_frustration_flavor.1206.desc.strict: "귀족 몇 명이 부적절한 행동으로 총애를 잃은 궁정 신하를 이야기하다 하나가 내 이름을 꺼낸다. 나는 소매를 매만지며 끼어들지 않는다."
 latria_sexual_frustration_flavor.1206.desc: "사람들 너머 음악이 들려오지만 대화에 더 신경이 쓰인다."
 latria_sexual_frustration_flavor.1206.a: "옛이야기를 모두 들려주고 사적으로 나눈 말까지 되풀이한다."
 latria_sexual_frustration_flavor.1206.b: "말을 삼키고 동석자들에게 인사한 뒤 떠난다."

 latria_sexual_frustration_flavor.1207.t: "기도 뒤의 빈자리"
 latria_sexual_frustration_flavor.1207.desc.favors: "예배가 끝나자 사제는 긴 의자에 책을 두고 떠난다. 내 신앙은 욕망을 죄악시하지 않지만 생각을 가라앉힐 수가 없다."
 latria_sexual_frustration_flavor.1207.desc.condemns: "사제가 떠나도 나는 무릎 꿇은 채 남는다. 순결에 관한 가르침은 분명하지만 마음속 갈망은 사라지지 않았다."
 latria_sexual_frustration_flavor.1207.desc: "고요한 사원에는 촛불과 나만 남았다."
 latria_sexual_frustration_flavor.1207.a: "사원을 떠나 그 애정에 생각을 맡긴다."
 latria_sexual_frustration_flavor.1207.b: "욕망을 억누르고 계율을 다시 읽는다."

 latria_sexual_frustration_flavor.1208.t: "숲속의 추격"
 latria_sexual_frustration_flavor.1208.desc.lustful: "사냥감이 나무 사이로 빠져나가고 일행이 뒤쫓는다. 나도 말을 몰아 따라가지만 다른 갈망이 여전히 생각을 붙잡는다."
 latria_sexual_frustration_flavor.1208.desc.chaste: "고삐를 당기며 사냥을 하러 왔을 뿐이라고 되뇐다. 사냥개는 멀어지지만 내 생각은 사라지지 않는다."
 latria_sexual_frustration_flavor.1208.desc: "일행이 나무 사이에 멈춰 추격을 계속하라는 내 말을 기다린다."
 latria_sexual_frustration_flavor.1208.a: "다른 이들을 앞서 보내고 홀로 생각에 잠긴다."
 latria_sexual_frustration_flavor.1208.b: "마음을 다잡고 사냥을 계속 이끈다."

 latria_sexual_frustration_flavor.1209.t: "창가의 잉걸불"
 latria_sexual_frustration_flavor.1209.desc.female: "잠옷 차림으로 창가에 앉는다. 난로에는 잉걸불만 남았다. 낮에 하지 못한 말이 이제 돌아온다."
 latria_sexual_frustration_flavor.1209.desc.male: "잠옷 차림으로 창에 기대어 뜰을 지나는 야경꾼을 본다. 응답받지 못한 애정이 생각을 떠나지 않는다."
 latria_sexual_frustration_flavor.1209.desc: "창밖은 고요하다. 불은 잦아들어도 졸리지 않다."
 latria_sexual_frustration_flavor.1209.a: "생각을 종이에 적는다."
 latria_sexual_frustration_flavor.1209.b: "불을 지피고 갈망을 접은 뒤 눕는다."

 latria_sexual_frustration_flavor.1210.t: "문 두드리는 이 없고"
 latria_sexual_frustration_flavor.1210.desc.emperor: "시종들이 왕관을 치웠다. 잠옷 차림으로 침대 곁에 앉아 있으니 제국의 무거운 짐으로도 차마 말하지 못한 일을 잊을 수 없다."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "동료들은 여관에서 잠들었다. 잠옷 차림으로 보내지 않은 편지 곁에 앉는다. 내일 다시 길을 떠나도 이 걱정은 따라올 것이다."
 latria_sexual_frustration_flavor.1210.desc.clergy: "침대 곁에 성의를 걸고 잠옷 차림으로 홀로 앉는다. 서약은 아직 귓가에 남았지만 생각은 잠잠해지지 않는다."
 latria_sexual_frustration_flavor.1210.desc.ruler: "예복을 치우고 잠옷 차림으로 침대 곁에 남는다. 문밖의 경비병들은 한숨을 듣지 못하고, 지위도 이 사적인 일을 해결해 주지 못한다."
 latria_sexual_frustration_flavor.1210.desc: "밤이 깊어도 나는 이 걱정을 홀로 지키고 있다."
 latria_sexual_frustration_flavor.1210.a: "늦은 시간에도 믿을 만한 지인을 불러 길게 이야기한다."
 latria_sexual_frustration_flavor.1210.b: "갈망을 억누르고 촛불을 끈 뒤 눕는다."

 latria_sexual_frustration_flavor.1202.c: "화제를 바꾸어 일행의 안부를 묻는다."
 latria_sexual_frustration_flavor.1202.d: "모두 차에 초대하고 지칠 때까지 이야기한다."
 latria_sexual_frustration_flavor.1203.c: "사제에게 남아서 가르침을 함께 공부하자고 청한다."
 latria_sexual_frustration_flavor.1204.c: "잠옷을 입고 낮의 생각을 천천히 헤아린다."
 latria_sexual_frustration_flavor.1205.c: "불침번을 정하고 잠시 쉰다."
 latria_sexual_frustration_flavor.1205.d: "내일의 의무를 하나씩 적는다."
 latria_sexual_frustration_flavor.1206.c: "새로운 시로 화제를 돌린다."
 latria_sexual_frustration_flavor.1207.c: "경전 앞에 앉아 이 장을 마저 읽는다."
 latria_sexual_frustration_flavor.1208.c: "말을 쉬게 하고 천천히 발자국을 살핀다."
 latria_sexual_frustration_flavor.1209.c: "불을 지피고 차를 끓여 오래된 책을 읽는다."
 latria_sexual_frustration_flavor.1209.d: "하지 못한 말을 시로 적는다."
 latria_sexual_frustration_flavor.1210.c: "내일을 계획하고 할 일을 하나씩 정리한다."
