l_korean:
 latria_fatal_liaison.1001.t: "한 통의 청"
 latria_fatal_liaison.1001.desc: "촛불은 평소보다 일찍 켰고, 술은 기다리느라 서늘함을 잃었다. 궁정에서 소리 내어 읽을 만한 말은 한 줄도 쓰지 않았다. 보내는 것은 시각과 장소뿐이다.\n\n[target.GetFirstName](은)는 이것을 평범한 청으로 읽을 것이다. 실제로 평범한 청이니까. 온다면 오직 하룻밤을 위해서 올 것이다. 문이 닫힌 뒤의 일은 내 몫이다."
 latria_fatal_liaison.1001.a: "침실로 오라고 청한다."
 latria_fatal_liaison.1001.b: "바깥방에서 술을 권한다."
 latria_fatal_liaison.1001.c: "편지를 넣어 둔다. 다른 밤이 있을 것이다."
 latria_fatal_liaison.1001.d: "편지를 태운다."
 latria_fatal_liaison_wait_tt: "편지는 부치지 않고, 그달이 지나간다."

 latria_fatal_liaison.1101.t: "이 밤을 어떻게 보낼지"
 latria_fatal_liaison.1101.desc: "화로는 일찍 피웠고, 아침이 드는 쪽 창에는 판자를 덧댔다. 술은 하인들이 직접 올리게 하고, 날이 밝을 때까지 다시 문을 두드리지 말라고 일렀다. 이 밤에 필요한 것은 이미 방 안에 다 있다.\n\n남은 것은 시각뿐이다. 촛불이 잔불이 될 때까지 [target.GetFirstName]을 깨어 있게 할지, 가장 힘든 때가 오기 전에 [target.GetHerHim]을 재울지. 쉬지 못한 몸은 쉰 몸보다 덜 견딘다.\n\n지금 정한다. 한 번만 정한다."
 latria_fatal_liaison.1101.a: "마지막 촛불까지 재우지 않는다."
 latria_fatal_liaison.1101.b: "동트기 전에 재운다."
 latria_fatal_liaison.1101.c: "밤이 가는 대로 둔다."

 latria_fatal_liaison.1102.t: "계단에서"
 latria_fatal_liaison.1102.desc: "[target.GetFirstName]을 먼저 올라가게 하고 나는 몇 계단 아래를 따른다. 층계참에 이르기 전에 [target.GetSheHe]는 멈춰 서서 한 손을 벽에 평평하게 짚은 채, 숨이 돌아올 때까지 그대로 있었다. 그러고는 아무 일도 없었다는 듯 웃는다.\n\n봄을 보지 못한 손님들에게서도 그런 멈춤을 본 적이 있다. 말하지는 않는다. 얼마나 걸리는지만 센다."
 latria_fatal_liaison.1102.a: "[target.GetSheHe]가 다시 움직일 때까지 초를 센다."
 latria_fatal_liaison.1102.b: "이 일로 의원을 본 적이 있는지 묻는다."
 latria_fatal_liaison.1102.c: "아무 말 없이 [target.GetHerHim]을 계속 걷게 한다."

 latria_fatal_liaison.1201.t: "아침, 아직 숨이 있다"
 latria_fatal_liaison.1201.desc: "창이 잿빛이 되고서야 어디서 어긋났는지 깨닫는다. [target.GetFirstName](은)는 자고 있고, 이불은 내가 계획하지 않은 규칙으로 오르내린다.\n\n가만히 누워 그 소리를 듣는다. 두 번, 또 한 번. 내가 꾸린 밤은 지나갔고, 둘 다 아직 숨을 쉬고 있다.\n\n이제 할 수 있는 일은 깨어 있는 채로 [target.GetHerHim] 곁에서 발견되어, 잘 잤다고 말하는 것뿐이다."
 latria_fatal_liaison.1201.a: "[target.GetSheHe]가 깨기 전에 일어난다."

 latria_fatal_liaison.1211.t: "더 무거운 아침"
 latria_fatal_liaison.1211.desc: "깨어나니 관절마다 시리고, 한동안 움직이지 않는다. [owner.GetFirstName](은)는 이미 깨어 옆에서 천장을 보고 있고, 내가 눈을 뜬 것을 곧바로 알아채지 못한다.\n\n기억보다 긴 밤이었는지도 모른다. 더는 그 나이가 아닌지도 모른다. 천천히 일어나 옷을 챙긴다.\n\n문 앞에서 한 번 돌아본다. 왜 돌아봤는지는 나도 모르겠다."
 latria_fatal_liaison.1211.a: "문을 닫는다."

 latria_fatal_liaison_bedchamber_modifier: "침상 곁"
 latria_fatal_liaison_antechamber_modifier: "바깥방에서"
 latria_fatal_liaison_demanding_night_modifier: "지나친 밤"
 latria_fatal_liaison_measured_night_modifier: "헤아린 밤"
 latria_fatal_liaison_weakness_modifier: "알려진 약점"
 latria_fatal_liaison_whisper_modifier: "낮은 물음"
