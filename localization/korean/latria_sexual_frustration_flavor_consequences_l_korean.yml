l_korean:
 latria_flavor_distracted: "딴생각에 잠김"
 latria_flavor_distracted_desc: "이 인물은 사적인 생각에 사로잡혀 학업과 일상사에 집중하지 못합니다."
 latria_flavor_composure: "침착한 자제"
 latria_flavor_composure_desc: "이 인물은 말을 아끼고 일상의 골칫거리를 한층 침착하게 대하는 법을 배웠습니다."
 latria_flavor_rested: "충분한 휴식"
 latria_flavor_rested_desc: "이 인물은 뒤숭숭한 생각을 잠시 내려놓고 몸을 쉬게 했습니다."
 latria_flavor_observance: "충실한 신앙생활"
 latria_flavor_observance_desc: "이 인물은 정성스러운 기도와 경전 낭송으로 같은 신앙을 따르는 이들의 존경을 얻었습니다."
 latria_flavor_reliable: "믿음직함"
 latria_flavor_reliable_desc: "이 인물은 사사로운 걱정이 의무를 방해하지 않도록 하며 일을 세심하게 처리합니다."
 latria_flavor_scriptural_insight: "경전의 깨달음"
 latria_flavor_scriptural_insight_desc: "끈기 있는 공부와 성찰로 이 인물은 가르침을 더욱 깊이 이해하게 되었습니다."
 latria_flavor_unburdened: "열린 마음"
 latria_flavor_unburdened_desc: "이 인물의 사적인 고뇌가 널리 알려져 더는 감출 필요가 없어졌습니다."
 latria_flavor_ridiculed: "웃음거리"
 latria_flavor_ridiculed_desc: "이 인물은 자신의 은밀한 갈망을 사람들 앞에서 끝없이 늘어놓아 웃음거리가 되었습니다."
 latria_flavor_missed_hunt: "정신이 팔린 사냥꾼"
 latria_flavor_missed_hunt_desc: "이 인물은 딴생각에 잠겨 사냥 도구를 돌보지 않고 동행들을 기다리게 했습니다."
 latria_flavor_creative_focus: "시로 풀어낸 마음"
 latria_flavor_creative_focus_desc: "말하기 어려운 감정을 시에 담으며 이 인물은 생각을 정리할 수 있었습니다."
 latria_flavor_restored_spirits: "음악의 위안"
 latria_flavor_restored_spirits_desc: "이 인물은 조용히 음악을 들으며 사람들과 이야기하고 싶은 마음을 되찾았습니다."
 latria_flavor_clear_judgment: "맑아진 생각"
 latria_flavor_clear_judgment_desc: "이 인물은 차분한 성찰을 통해 서두르지 않고 일을 헤아릴 수 있게 되었습니다."
