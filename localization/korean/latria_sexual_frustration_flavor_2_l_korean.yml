l_korean:
 latria_sexual_frustration_flavor.1101.t: "침장 아래의 불면"
 latria_sexual_frustration_flavor.1101.desc.female: "침대에서 눈을 뜬다. 잠옷은 발치에 떨어져 있다. 방에는 아무도 없고, 고요함은 응답받지 못한 갈망만 더 또렷하게 한다."
 latria_sexual_frustration_flavor.1101.desc.male: "침대에서 눈을 뜬다. 잠옷은 발치에 떨어져 있다. 창밖 세상은 잠잠하지만 내 생각은 잠에 머물지 못한다."
 latria_sexual_frustration_flavor.1101.desc: "침장이 낮게 드리워졌다. 밤은 길고 생각은 가라앉지 않는다."
 latria_sexual_frustration_flavor.1101.a: "눈을 감고 그리운 이를 생각한다."
 latria_sexual_frustration_flavor.1101.b: "생각을 접고 침장을 친 뒤 다시 잠을 청한다."

 latria_sexual_frustration_flavor.1102.t: "춤 사이의 눈길"
 latria_sexual_frustration_flavor.1102.desc.accepted: "몇 곡이 지나고 주위의 얼굴도 바뀐다. 가까이 몸을 돌려도 아무도 개의치 않지만 나는 잠시 마주친 눈길을 기억한다."
 latria_sexual_frustration_flavor.1102.desc.strict: "춤이 가까워질수록 웃음소리가 수군거림처럼 들린다. 누가 내 마음을 알아챌까 악사들 쪽으로 시선을 돌린다."
 latria_sexual_frustration_flavor.1102.desc: "음악은 빨라지지만 춤도 내 생각을 떨쳐주지 못한다."
 latria_sexual_frustration_flavor.1102.a: "한 곡 더 청하고 조금 더 가까이 다가간다."
 latria_sexual_frustration_flavor.1102.b: "춤 상대에게 인사하고 연회장 가장자리로 물러난다."

 latria_sexual_frustration_flavor.1103.t: "인도자의 문 앞에서"
 latria_sexual_frustration_flavor.1103.desc.favors: "영적 인도자는 욕망을 억누르는 것만이 헌신의 길은 아니라고 한다. 더 묻고 싶지만 문밖의 발소리가 멈췄다."
 latria_sexual_frustration_flavor.1103.desc.condemns: "영적 인도자는 남이 보지 않을 때도 순결이 중요하다고 일깨운다. 나는 더 묻지 않기를 바라며 고개를 숙인다."
 latria_sexual_frustration_flavor.1103.desc: "방이 어둑하다. 영적 인도자에게 어떻게 말을 꺼낼지 헤아린다."
 latria_sexual_frustration_flavor.1103.a: "갈망을 인정하고 더는 숨기지 않는다."
 latria_sexual_frustration_flavor.1103.b: "당장의 의무만 묻고 나머지 말은 삼킨다."

 latria_sexual_frustration_flavor.1104.t: "돌아오지 않는 독수리"
 latria_sexual_frustration_flavor.1104.desc.lustful: "독수리는 들판 위를 맴돌며 장갑으로 돌아오지 않는다. 누구에게도 설명할 필요 없이 욕망을 따르는 자유가 부럽다."
 latria_sexual_frustration_flavor.1104.desc.chaste: "독수리는 계속 맴돈다. 시종들이 화살을 또 쏠 것이냐고 묻는다. 나는 인내가 모든 것을 해결해 줄 듯 기다리라고 한다."
 latria_sexual_frustration_flavor.1104.desc: "독수리는 돌아오지 않고 사냥꾼들은 내 말을 기다린다."
 latria_sexual_frustration_flavor.1104.a: "독수리가 맴도는 동안 생각에 잠긴다."
 latria_sexual_frustration_flavor.1104.b: "마음을 다잡고 독수리를 야영지로 불러들인다."

 latria_sexual_frustration_flavor.1105.t: "촛불과 왕관"
 latria_sexual_frustration_flavor.1105.desc.emperor: "시종이 왕관을 침실 밖으로 가져가고 촛불 옆에는 미처 끝내지 못한 칙령이 남는다. 나는 잠옷을 여미고 서류 사이에서 보내지 않은 편지를 꺼낸다."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "여관 방에서 잠옷을 입는다. 동료들은 잠자리에 들었지만 짐 곁의 보내지 않은 편지 때문에 잠들 수 없다."
 latria_sexual_frustration_flavor.1105.desc.clergy: "성의를 접고 잠옷 차림으로 침대 곁에 앉는다. 경전 밑의 보내지 않은 편지를 또다시 꺼낸다."
 latria_sexual_frustration_flavor.1105.desc.ruler: "시종들이 예복을 치운다. 등불 아래 잠옷 차림으로 앉아 미완의 서류보다 먼저 보내지 않은 편지를 펼친다."
 latria_sexual_frustration_flavor.1105.desc: "촛불이 잦아든다. 보내지 않은 편지는 여전히 손 닿는 곳에 있다."
 latria_sexual_frustration_flavor.1105.a: "편지를 전령에게 건넨다."
 latria_sexual_frustration_flavor.1105.b: "편지를 없애고 생각을 접은 뒤 촛불을 끄고 잠든다."

 latria_sexual_frustration_flavor.1106.t: "촛불 아래의 뒤척임"
 latria_sexual_frustration_flavor.1106.desc.female: "잠옷 차림으로 침대 곁에 앉아 창 위로 흔들리는 촛불을 본다. 밤은 깊었지만 응답받지 못한 갈망은 아직 나를 떠나지 않았다."
 latria_sexual_frustration_flavor.1106.desc.male: "잠옷 차림으로 침대 곁에 앉는다. 야경꾼이 뜰을 두 번 지났는데도 생각은 가라앉지 않는다."
 latria_sexual_frustration_flavor.1106.desc: "촛불은 잦아들어도 침장 아래에는 잠이 오지 않는다."
 latria_sexual_frustration_flavor.1106.a: "그 애정에 생각을 머물게 한다."
 latria_sexual_frustration_flavor.1106.b: "더 생각하지 않고 촛불을 끈 뒤 잠을 청한다."


 latria_sexual_frustration_flavor.1107.t: "답례의 춤"
 latria_sexual_frustration_flavor.1107.desc.accepted: "춤 상대가 한 곡 더 청하자 사람들은 예의로 여긴다. 나는 그 손이 잠시 머물렀을 때 스친 생각을 기억한다."
 latria_sexual_frustration_flavor.1107.desc.strict: "춤 상대가 한 곡 더 청하자 몇몇이 우리를 돌아본다. 대답하기도 전에 누군가 옆 사람에게 몸을 기울여 속삭인다."
 latria_sexual_frustration_flavor.1107.desc: "악사들이 새 곡을 연주하지만 나는 일어나지 않는다."
 latria_sexual_frustration_flavor.1107.a: "춤을 받아들이고 더 가까이 다가간다."
 latria_sexual_frustration_flavor.1107.b: "인사하며 거절하고 즐거운 춤이 되기를 빈다."

 latria_sexual_frustration_flavor.1108.t: "잠들기 전의 기도"
 latria_sexual_frustration_flavor.1108.desc.favors: "잠옷 차림으로 침대 곁에서 기도한다. 내 신앙은 육욕의 쾌락을 허락하지만 마음속 조급함은 잦아들지 않는다."
 latria_sexual_frustration_flavor.1108.desc.condemns: "잠옷 차림으로 침대 곁에 무릎 꿇고 순결 서약을 되뇐다. 한 줄 한 줄 읽을수록 마음속 목소리를 무시하기 어렵다."
 latria_sexual_frustration_flavor.1108.desc: "침대 곁의 촛불이 흔들린다. 기도는 계속된다."
 latria_sexual_frustration_flavor.1108.a: "순결 서약을 내려놓고 내 갈망을 인정한다."
 latria_sexual_frustration_flavor.1108.b: "생각을 억누르고 계속 기도한다."

 latria_sexual_frustration_flavor.1109.t: "끝내지 못한 자문회"
 latria_sexual_frustration_flavor.1109.desc: "자문위원들이 여러 방책을 내놓았지만 아직 어느 것도 고르지 못했다. 생각이 당면한 일에서 자꾸 벗어나고 내 침묵마저 길어진다."
 latria_sexual_frustration_flavor.1109.a: "자문회를 끝내고 홀로 생각에 잠긴다."
 latria_sexual_frustration_flavor.1109.b: "생각을 억누르고 서기관에게 계속하라고 한다."
 latria_sexual_frustration_flavor.1110.t: "자정이 지난 방"
 latria_sexual_frustration_flavor.1110.desc.clergy: "잠옷 차림으로 작은 방에 돌아온다. 밤기도는 끝나고 촛불도 잦아들었지만 보내지 않은 편지는 여전히 탁자에 펼쳐져 있다."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "여관에는 등불 몇 개만 남았다. 잠옷 차림으로 침대 가장자리에 앉아 끝내 보내지 않은 편지를 생각한다."
 latria_sexual_frustration_flavor.1110.desc: "문밖의 소리가 멀어진다. 나는 침대 곁에 남아 기다린다."
 latria_sexual_frustration_flavor.1110.a: "편지를 마저 써서 새벽에 보내게 한다."
 latria_sexual_frustration_flavor.1110.b: "문을 걸어 잠그고 생각을 접은 뒤 잠자리에 든다."

 latria_sexual_frustration_flavor.1101.c: "겉옷을 걸치고 가만히 앉아 호흡을 가다듬는다."
 latria_sexual_frustration_flavor.1102.c: "악사들과 곡조에 관해 이야기한다."
 latria_sexual_frustration_flavor.1103.c: "이 마음과 함께 살아갈 길을 묻는다."
 latria_sexual_frustration_flavor.1103.d: "보내지 않은 편지부터 시작해 아무것도 숨기지 않는다."
 latria_sexual_frustration_flavor.1104.c: "독수리를 차분히 길들이는 동안 기다려 달라고 한다."
 latria_sexual_frustration_flavor.1105.c: "편지를 함에 넣고 내일의 일을 계획한다."
 latria_sexual_frustration_flavor.1107.c: "춤 상대에게 앉아서 다른 이야기를 하자고 한다."
 latria_sexual_frustration_flavor.1107.d: "탁자의 모든 손님을 흥겨운 군무에 초대한다."
 latria_sexual_frustration_flavor.1108.c: "모든 생각과 싸우려 하지 않고 기도를 천천히 마친다."
 latria_sexual_frustration_flavor.1109.c: "잠시 쉬며 남은 의제를 정리한다."
 latria_sexual_frustration_flavor.1109.d: "급한 판결을 정리하고 이 자리에서 마친다."
 latria_sexual_frustration_flavor.1110.c: "겉옷을 걸치고 따뜻한 국물 한 잔을 찾는다."
