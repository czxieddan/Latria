 latria_agent_quack_desc: "#WEAK 이 맥은 급병이라 할 수밖에 없겠군요.#!\n$EFFECT_LIST_BULLET$ [success_chance_max_i] [scheme_potential|E] 제공\n$EFFECT_LIST_BULLET$ [learning_i] [learning|E] 필요\n$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] 및 [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] 등의 [traits|E]으로 #P 이익#!을 얻음\n$EFFECT_LIST_BULLET$ [GetTrait('drunkard').GetName( GetNullCharacter )] 및 [GetTrait('impatient').GetName( GetNullCharacter )] 등의 [traits|E]으로 #N 불이익#!을 받음"

