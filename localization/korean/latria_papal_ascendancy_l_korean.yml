l_korean:
 e_latria_holy_see: "성좌"
 e_latria_holy_see_adj: "가톨릭"
 nick_latria_vicar_of_christ: "그리스도의 대리자"
 nick_latria_vicar_of_christ_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 [CHARACTER.GetFaith.HighGodName](이)가 타락한 세계에 내리는 마지막 구원입니다. 세상이 아직 스스로 구원받을 수 있었다면, [CHARACTER.GetFaith.HighGodName]께서 #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! 같은 인물을 모든 왕관 위에 세우지도 않으셨겠지요."

 latria_papal_ascendancy.0001.t: "모든 왕관 위의 옥좌"
 latria_papal_ascendancy.0001.desc: "모여든 고위 성직자들 앞에서, 나를 끌어내리려던 자들의 부러진 군기 위로 손을 든다. 하느님께서 당신의 대리자를 지켜주신 것은 내가 제후들과 흥정하도록 하기 위함이 아니다. 그분의 명에 따라 성좌는 나뉠 수 없는 권위를 행사하고 모든 봉역에 구원을 전하리라."
 latria_papal_ascendancy.0001.a: "세상이 성좌 앞에 무릎 꿇게 하라"

 latria_papal_ascendancy.0002.t: "대리자의 사명"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName](이)가 성좌에 맞서 일어난 대군을 격파했다. 성직자와 패배한 제후들 앞에서 [latria_papal_victor.GetSheHe](은)는 하느님께서 [latria_papal_victor.GetHerHim]에게 절대적인 권위와 세상의 구원을 맡기셨다고 선포한다."
 latria_papal_ascendancy.0002.a: "새로운 질서가 시작되는군"

 trait_latria_army_of_god: "주님의 거룩한 군대"
 trait_latria_army_of_god_desc: "해당 인물은 성좌의 절대적인 권위에 봉헌된 군대를 지휘합니다."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 성좌의 절대적인 권위에 봉헌된 군대를 지휘합니다."

 latria_papal_redemption_or_ruin: "구원 혹은 파멸"
 latria_papal_redemption_or_ruin_desc: "[recipient.GetShortUINameNoTooltip]에게 성좌에 복종하고 [actor.GetShortUINamePossessiveNoTooltip] [rite|E]로 개종할 것을 요구합니다. 거부하면 전쟁이 일어납니다."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName](이)가 성좌에 복종하고 [actor.GetHerHis] [rite|E]로 개종할 것을 요구합니다."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "하위 [old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "하위 [old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "비밀 공개"
 latria_reveal_papal_secret_decision_desc: "성직자와 제후들 앞에서 내 비밀을 밝히겠다. 모든 영주가 내 입을 통해 직접 듣게 하라. 내 지위를 부정하는 자들은 무기를 들면 될 것이다."
 latria_reveal_papal_secret_decision_tooltip: "불륜을 공개하고 폐위 전쟁에 맞섭니다."
 latria_reveal_papal_secret_decision_confirm: "모두 앞에서 밝히리라"
 latria_can_reveal_papal_secret_trigger: "공개할 수 있는 불륜 비밀이 있음"
 NOT_ANY_OF_MY_SECRETS: "당신의 비밀 없음:"

 latria_papal_redemption_war: "교황의 구원 전쟁"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "교황의 구원"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]에 대한 [ATTACKER.GetPrimaryTitle.GetAdjective] 구원 전쟁"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective] 구원 전쟁"
 latria_papal_redemption_war_victory_desc: "방어 측은 작위 등급이 낮아지고 교황의 봉신이 되며 교황의 [rite|E]로 개종합니다."
 latria_papal_redemption_war_white_peace_desc: "복종 요구가 철회됩니다."
 latria_papal_redemption_war_defeat_desc: "교황의 복종 요구가 좌절됩니다."

 latria_decision_immediate_effect_loc: "#high #bold 비밀을 공개할 경우:#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X $latria_papal_scandal_depose_war$이 시작됨:#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "당신과 같은 [rite|E]를 따르는 독립 [rulers|E] 및 당신을 전적으로 지지하지 않는 [vassals|E]이 폐위 연합군에 합류할 수 있습니다"
 latria_decision_paramour_defense_tt: "불륜 상대가 [ruler|E]라면 방어 측에 합류할 수 있습니다"
 latria_decision_allies_call_tt: "당신의 [allies|E]이 소집에 응해 방어 측에 합류할 수 있습니다"
 latria_decision_forced_defenders_tt: "당신의 꼭두각시 [rulers|E] 및 당신과 같은 [rite|E]를 따르며 [piety_level|E]가 @piety_level_0_icon_christian![GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]인 독립 영주들이 방어 측에 합류할 수 있습니다"
 latria_decision_disgraced_defenders_tt: "당신과 같은 [rite|E]를 따르며 [GetTrait('adulterer').GetName(GetNullCharacter)] 또는 [GetTrait('fornicator').GetName(GetNullCharacter)] [trait|E]을 지니고 병력을 거느린 인물들이 방어 측에 합류할 수 있습니다"
 latria_decision_hook_defenders_tt: "[hooks|E]을 소모하여 당신과 같은 [rite|E]의 인물들을 방어 측에 합류시킬 수 있습니다"

 latria_decision_if_win_effect_loc: "\n#high #bold 당신이 전쟁에서 승리할 경우:#!#!\n당신은 연합군을 격파하고 [head_of_faith|E] 지위를 유지합니다.\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "패배한 공격 측 [rulers|E]는 [title_tier|E]에 따라 [gold|E]와 [prestige|E]을 배상합니다"
 latria_papal_scandal_reparations_first: "패배한 공격 측 [rulers|E]는 [title_tier|E]에 따라 당신에게 [gold|E]와 [prestige|E]을 배상합니다"
 latria_papal_scandal_reparations_third: "패배한 공격 측 [rulers|E]는 [title_tier|E]에 따라 [CHARACTER.GetShortUIName]에게 [gold|E]와 [prestige|E]을 배상합니다"
 latria_papal_scandal_ally_share_tt: "방어 측으로 참전한 [allies|E]은 [gold|E] 및 [prestige|E] 배상 총액의 [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%]를 나눠 받습니다"
 latria_papal_redemption_unlocked_tt: "$latria_papal_redemption_or_ruin$ [interaction|E]이 잠금 해제됩니다"

 latria_decision_if_lose_effect_loc: "\n#high #bold 당신이 전쟁에서 패배할 경우:#!#!\n당신은 [head_of_faith|E] 지위를 잃습니다.\n"
 latria_decision_defeat_imprison_tt: "연합군 지도자가 당신을 자신의 [dungeon|E]에 투옥합니다"
 latria_decision_if_white_peace_effect_loc: "\n#high #bold 전쟁이 무조건 평화로 끝날 경우:#!#!"

 latria_papal_scandal_depose_war: "교황 폐위 전쟁"
 latria_papal_scandal_event_troops: "교황 지원군"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "교황 폐위"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "[DEFENDER.GetShortUINameNotMe] 폐위 전쟁"
 latria_papal_scandal_depose_war_victory_desc_defender: "당신은 [head_of_faith|E] 지위를 잃습니다."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U](은)는 [defender.GetHerHis] [head_of_faith|E] 지위를 잃습니다."
 latria_papal_scandal_depose_war_white_peace_desc: "양측은 평화를 맺고 각자의 [titles|E]를 유지합니다."
 latria_papal_scandal_depose_war_defeat_desc_defender: "당신은 연합군을 격파하고 [head_of_faith|E] 지위를 유지합니다."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U](은)는 연합군을 격파하고 [head_of_faith|E] 지위를 유지합니다."

 latria_papal_ascendancy.0010.t: "성좌를 지켜달라는 요청"
 latria_papal_ascendancy.0010.desc: "당신의 [ally|E] [latria_pope.GetShortUIName](이)가 불륜을 이유로 [latria_pope.GetHerHim](을)를 폐위하려는 연합군에 맞서고 있다. [latria_pope.GetSheHe](은)는 동맹을 내세워 당신에게 연합군을 향해 진군해 달라고 요청한다."
 latria_papal_ascendancy.0010.a: "신성한 동맹을 지켜 진군하겠다"
 latria_papal_ascendancy.0010.b: "그런 추문을 위해 싸울 수는 없다"
 latria_honored_papal_alliance_opinion: "성좌를 수호함"
 latria_refused_papal_alliance_opinion: "교황과의 동맹을 저버림"
 latria_ally_share_received_msg_title: "성좌의 감사"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName](이)가 패배한 영주들의 배상금 중 일부를 당신에게 보냈습니다."
 latria_ally_joined_defense_msg_title: "동맹이 방어에 합류함"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName](이)가 동맹을 지켜 연합군에 맞서는 방어전에 합류했습니다."
 latria_ally_refused_defense_msg_title: "동맹이 소집을 거부함"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName](이)가 성좌를 수호해 달라는 당신의 요청을 거부했습니다."

 latria_papal_scandal_war.0001.t: "교황 폐위의 외침"
 latria_papal_scandal_war.0001.desc: "[latria_scandal_target.GetShortUIName](은)는 [latria_scandal_target.GetHerHis] 불륜이 공개되자 폐위하려고 무기를 든 영주들과 맞서게 되었다. 연합군의 사절들이 내 궁정에 도착해 함께 진군할 것을 청한다."
 latria_papal_scandal_war.0001.a: "무기를 들고 연합군에 합류한다"
 latria_papal_scandal_war.0001.b: "이 전쟁에 관여하지 않는다"

 latria_holy_see_government: "성좌제"
 latria_holy_see_government_adjective: "성좌"
 latria_holy_see_government_realm: "성좌령"
 latria_holy_see_government_desc: "\n#F 성좌제에서는 교회와 세속의 권력이 [GetTitleByKey('e_latria_holy_see').GetNameNoTier]에 모인다. [latria_vicar|E]는 신의 명으로 통치하며, 제후와 성직자는 모두 그 권위에 복종한다.#!"
 latria_holy_see_government_with_icon: "$latria_holy_see_government_icon$ $latria_holy_see_government$"
 latria_divine_succession_law: "신수 계승제"
 latria_divine_succession_law_subname: "신의 선택"
 latria_divine_succession_law_desc: "[GetTitleByKey('e_latria_holy_see').GetNameNoTier]는 신이 선택한 후계자에게 이어진다. [latria_vicar|E]는 그 뜻을 선포하고 성스러운 직분의 계승을 맡긴다."
 latria_divine_succession_law_effects: "\n$latria_divine_succession_law_desc$\n\n#weak 계승 시 [GetTitleByKey('e_latria_holy_see').GetNameNoTier]와 당신의 모든 [titles|E]는 선택된 후계자에게 넘어간다.#!\n\n$latria_divine_succession_law_warning$"
 latria_divine_succession_law_warning: "@alert_icon! [GetTitleByKey('e_latria_holy_see').GetNameNoTier]를 계승할 때 후계자는 이전에 보유하던 모든 영지를 내려놓는다."
 latria_holy_see_ruler_male: "대리자"
 latria_holy_see_ruler_female: "대리자"
 latria_designate_sacred_heir: "신성한 계승의 부름"
 latria_designate_sacred_heir_desc: "[recipient.GetShortUINameNoTooltip]에게 신의 부름을 받아 성좌의 후계자가 되기를 청한다."
 latria_designate_sacred_heir_tt: "[recipient.GetShortUIName](이)가 성좌의 후계자로 지명됨"
 latria_holy_see_vassals_convert_tt: "모든 [vassals|E]이 [GetGovernment('ecclesiastical_government').GetName](으)로 전환함"
 latria_redeemed_realm_convert_tt: "구원받은 통치자와 모든 [vassals|E]이 [GetGovernment('ecclesiastical_government').GetName](으)로 전환함"
 latria_sacred_heir_cycle_tt: "이 지명은 계승 관계를 순환시키므로 현재 후계자를 유지함."
 latria_papal_title_locked_tt: "이 작위는 파괴할 수 없음"
 latria_sacred_invitation_notification: "신의 뜻에 따라 그대를 성좌의 후계자로 부르니, 이 소명을 받아들이겠는가?"
 latria_sacred_invitation_accept: "소명을 받아들인다"
 latria_sacred_invitation_decline: "소명을 사양한다"
 latria_sacred_heir_relinquish_lands_tt: "@warning_icon! [recipient.GetShortUIName](은)는 성좌를 계승할 때 이전에 보유하던 모든 영지를 포기함"
 latria_sacred_invitation_realm_reason: "양측의 [realm|E] 규모 차이: $VALUE|=+0$"
 latria_sacred_invitation_rank_reason: "양측의 [title_tier|E] 차이: $VALUE|=+0$"
 latria_sacred_invitation_independent_reason: "독립 영주: $VALUE|=+0$"
 latria_sacred_invitation_devotion_reason: "양측의 [piety_level|E] 차이: $VALUE|=+0$"
 latria_sacred_invitation_same_faith_reason: "같은 [faith|E]: $VALUE|=+0$"
 latria_sacred_invitation_same_rite_reason: "같은 [rite|E]: $VALUE|=+0$"
 latria_sacred_invitation_other_faith_reason: "다른 [faith|E]: $VALUE|=+0$"
 latria_sacred_invitation_clergy_reason: "가톨릭 성직자: $VALUE|=+0$"
 latria_sacred_invitation_personality_reason: "초대받은 인물의 성격: $VALUE|=+0$"
 latria_sacred_invitation_kinship_reason: "대리자와의 혈연관계: $VALUE|=+0$"
 latria_holy_see_government_icon: "[latria_holy_see_government_i|E]"
 game_concept_latria_holy_see_government: "$latria_holy_see_government$"
 game_concept_latria_holy_see_government_i: "@latria_holy_see_government!"
 game_concept_latria_holy_see_government_desc: "$latria_holy_see_government$는 [head_of_faith|E]가 통치하는 [theocratic|E] [government_form|E]로, 교회와 세속의 권력을 [GetTitleByKey('e_latria_holy_see').GetNameNoTier]에 모은다.\n\n[latria_vicar|E]는 [church_authority|E]으로 [vassals|E]을 다스리며, [treasury|E]로 교회의 재산을 관리한다.\n\n[GetTitleByKey('e_latria_holy_see').GetNameNoTier]는 $latria_divine_succession_law$에 따라 이어지며, [latria_vicar|E]는 신의 뜻을 선포하고 후계자를 정한다."
 game_concept_latria_vicar: "$latria_holy_see_ruler_male$"
 game_concept_latria_vicar_desc: "$game_concept_latria_vicar$는 [GetTitleByKey('e_latria_holy_see').GetNameNoTier]의 [holder|E]로, 신의 이름으로 교회와 세속 제후들을 이끈다."
