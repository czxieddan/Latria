 latria_charming_abduction.1001.t: "베갯머리의 약속"
 latria_charming_abduction.1001.desc: "목욕물은 식어 가지만 침실에는 아직 향기가 남아 있다. 나는 침대 곁에 겉옷을 내려놓고 탁자 위의 봉하지 않은 편지를 바라본다. [target.GetFirstName](이)가 잠들지 못하게 할 한 줄만 있으면 된다.\n\n내 사람들은 옆문과 복도의 굽이마다 익숙하다. [target.GetSheHe](이)가 다정한 밤을 기대하며 [target.GetHerHis] 시종들을 물리친다면 두꺼운 휘장이 많은 것을 감춰줄 것이다. [target.GetSheHe](이)가 내 침대에서 [target.GetHerHim](을)를 기다릴 것이라 상상하는 쾌락이라... 우선 [target.GetSheHe](이)가 문턱을 넘어야 할 일이다."
 latria_charming_abduction.1001.a: "[target.GetHerHim]에게 침대 곁에서 기다리겠다고 전하라."
 latria_charming_abduction.1001.b: "[target.GetHerHim](을)를 바깥방의 술자리에 초대하라. 술은 따뜻하게, 촛불은 낮게."
 latria_charming_abduction.1001.c: "편지를 봉한다. 더 좋은 밤이 오겠지."
 latria_charming_abduction.1001.d: "편지를 불에 던진다. 여기서 끝이다."
 latria_charming_abduction_wait_tt: "계속 준비하며 다음 실행 기회를 기다립니다."

 latria_charming_abduction.1101.t: "남겨진 향기"
 latria_charming_abduction.1101.desc: "[target.GetFirstNamePossessive] 답장에 비단 끈 하나가 딸려 왔다. 조금만 잡아당겨도 풀릴 듯 느슨한 매듭이다. 문장은 여전히 정중하지만 마지막 몇 줄은 빽빽하다. [target.GetSheHe](은)는 서둘러 쓰면서도 깃펜을 놓기 아쉬웠던 모양이다.\n\n나는 손가락에 끈을 감는다. 다음 편지에는 무슨 향기를 담을까? 그 향기는 [target.GetHerHis] 침상까지 어떤 생각을 따라가게 할까?"
 latria_charming_abduction.1101.a: "밤을 언급한 곳에 향수를 한 방울 떨어뜨린다."
 latria_charming_abduction.1101.b: "시간만 적고 서명은 남기지 않는다."
 latria_charming_abduction.1101.c: "답장을 촛대 밑에 놓고 기다리게 한다."

 latria_charming_abduction.1102.t: "또 다른 시선"
 latria_charming_abduction.1102.desc: "[target.GetFirstNamePossessive] 잠자리 습관에 관한 소식이 [target.GetHerHis] 연애편지보다 유용했다. 해가 지고 나서도 시종 하나가 늘 남아 술을 따르고 옷을 정리하며 마지막 촛불이 꺼질 때까지 떠나지 않는다고 한다.\n\n충직한 하인 하나가 공들여 마련한 밀회를 망칠 수도 있다. 그 눈길을 다른 일로 돌려야겠다."
 latria_charming_abduction.1102.a: "은화 한 주머니로 시종에게 하룻밤 유흥을 마련해 준다."
 latria_charming_abduction.1102.b: "혼자 오면 깜짝 선물을 주겠다는 한 줄을 덧붙인다."
 latria_charming_abduction.1102.c: "일단 초대를 거둔다. 그 문은 다음 밤을 기다려도 된다."

 latria_charming_abduction.2001.t: "빗장이 내려갈 때"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName](은)는 침실에 들어서면서도 침대 곁의 촛불에 [target.GetHerHis] 시선을 둔다. 나는 손을 내밀어 한 걸음만 더 다가오면 [target.GetHerHim](이)가 나에게 닿을 수 있다고 믿게 한다.\n\n빗장이 찰칵거린다. [target.GetSheHe|U](이)가 돌아보자 휘장 뒤의 그림자들이 일어선다. 내 사람들이 [target.GetHerHis] 팔을 붙잡고, 소매에서 나온 밧줄은 촛대 하나 건드리지 않는다.\n\n나는 의자 위의 옷을 집어 든다. 오늘 밤 이 베개를 함께 벨 사람은 없다."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName](은)는 내가 따른 술을 받아 들고 몸을 조금 비켜 안쪽 방으로 가는 길을 내준다. [target.GetSheHe|U](은)는 내가 [target.GetHerHis] 손을 잡고 [target.GetHerHim](을)를 더 은밀한 곳으로 이끌기를 기대한다.\n\n나는 대신 잔을 내려놓는다. 옆문이 열리고 내 사람들이 들이닥친다. [target.GetSheHe](이)가 소리를 지르려 할 때쯤에는 빗장이 내려가고 밧줄도 단단히 묶여 있다.\n\n탁자 위의 술은 거의 줄지 않았다."
 latria_charming_abduction.2001.secret: "\n\n복도는 고요하다. 궁정에서 [target.GetHerHis] 부재를 알아차릴 무렵에는 촛농마저 식어 있을 것이다."
 latria_charming_abduction.2001.exposed: "\n\n창밖에서 비명이 들린다. 날이 밝기도 전에 누군가 오늘 밤 이야기의 나머지 절반을 전할 모양이다."
 latria_charming_abduction.2001.a: "[target.GetHerHis] 망토를 가져와라. 떠날 시간이다."

 latria_charming_abduction.2002.t: "끝맺지 못한 밤"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName](이)가 문간에서 멈춘다. 촛불도 침대도, 내가 계산해 둔 침묵조차 [target.GetHerHim](을)를 한 걸음 더 끌어들이지 못한다.\n\n\"밤이 깊었군요.\" [target.GetHerHis|U] 눈길이 내 어깨 너머 미동 없는 휘장으로 향한다.\n\n내민 손에는 밤공기만 닿는다."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName](은)는 술에 손을 대지 않는다. 잠시 [target.GetSheHe](은)는 내 미소를 가늠하듯 탁자 곁에 서 있다가 열린 문 쪽으로 물러난다.\n\n\"불은 켜두라고 하십시오. 제 사람들이 기다립니다.\"\n\n옆문 뒤의 발소리가 유난히 크게 들린다."
 latria_charming_abduction.2002.secret: "\n\n숨은 사람들이 나오기 전에 손을 내린다. 내일이면 누군가 내 구애가 퇴짜 맞은 일을 웃음거리로 삼을지도 모른다. 그 문 뒤에 무엇이 기다렸는지는 아무도 모를 것이다."
 latria_charming_abduction.2002.exposed: "\n\n둥글게 만 밧줄 한 가닥이 드러난다. [target.GetFirstNameNoTooltip](이)가 움찔하며 내 이름을 외치고, [target.GetSheHe](은)는 [target.GetHerHis] 호위병들 쪽으로 뒷걸음질 친다. 이제는 누구도 그저 장난스러운 추파였다고 여기지 않을 것이다."
 latria_charming_abduction.2002.a: "촛불을 꺼라. 더는 초대하지 않겠다."
 latria_charming_abduction.2002.b: "새 편지를 쓰고 다음 기회를 기다린다."
 latria_charming_abduction_retry_tt: "이 모략을 다시 준비합니다. 이번 시도의 접근 방식 변화 요소는 제거하고 이전의 초대 준비는 유지합니다."

 latria_charming_abduction.2101.t: "다정한 함정"
 latria_charming_abduction.2101.bedchamber: "[owner.GetFirstName](을)를 만나러 갔을 때까지만 해도 [owner.GetHerHis] 손에 어떻게 입을 맞출지 생각하고 있었다. 침실의 희미한 불빛은 휘장 뒤를 살피는 일조차 잊게 했다.\n\n두 팔이 등 뒤로 꺾이고서야 [owner.GetSheHe](이)가 왜 내 손이 닿지 않는 곳에 머물렀는지 알았다. 여기서 나를 기다린 것은 다정한 손길이 아니라 밧줄뿐이었다."
 latria_charming_abduction.2101.antechamber: "술 한 모금 마시기도 전에 [owner.GetFirstNamePossessive] 포로가 되었다.\n\n[owner.GetSheHe|U](은)는 미리 정한 신호라도 보내듯 [owner.GetHerHis] 잔을 내려놓았다. 곧 옆문으로 사람들이 쏟아져 들어와 내 팔을 붙잡았다. 나는 설명을 기다리며 줄곧 [owner.GetHerHim](을)를 바라보았다. [owner.GetSheHe|U](은)는 그저 내 망토를 가져오라고 했다."
 latria_charming_abduction.2101.a: "고개를 돌린다. [owner.GetHerHim](을)를 보지 않겠다."

 latria_charming_abduction.2102.t: "촛불 뒤에서"
 latria_charming_abduction.2102.secret: "[owner.GetFirstNamePossessive] 초대는 충분히 다정했지만, 막상 만나자 [owner.GetSheHe](은)는 다른 곳에 정신이 팔린 듯했다. 복도의 발소리, 문 뒤에서 옷깃이 스치는 소리. 호위병 이야기를 꺼내자 [owner.GetHerHis] 미소가 굳었다.\n\n나는 핑계를 대고 자리를 떴다. 내 사람들 틈에 서고서야 손바닥에 땀이 흥건한 것을 알았다. 그저 어색한 밀회였을지도 모른다. 그 문 뒤에 무엇이 있었는지는 영영 모르는 편이 나을지도."
 latria_charming_abduction.2102.exposed: "언뜻 보인 밧줄에 정신이 번쩍 들었다.\n\n[owner.GetFirstNamePossessive] 속삭임, 낮춘 촛불, [owner.GetSheHe](이)가 우리 사이에 둔 거리까지 모두 나를 그 방에 붙잡아 두려던 수작이었다. 나는 복도로 물러나 호위병을 불렀다. 문 뒤의 형체들이 그림자 속으로 숨어드는 모습이 보였다.\n\n나는 하마터면 그 미소 하나에 사람들을 모두 물릴 뻔했다."
 latria_charming_abduction.2102.a: "앞으로는 문밖에 사람을 세워둔다."

