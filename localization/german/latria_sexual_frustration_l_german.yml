 game_concept_latria_sexual_repression: "Unterdrückung"
 game_concept_latria_sexual_repression_desc: "Unterdrückung misst die ungestillte geschlechtliche Begierde eines Charakters. Sie steigt mit der Zeit und sinkt, wenn der Charakter fleischliche Befriedigung findet."
 game_concept_latria_sexual_repression_level: "Unterdrückungsstufe"
 game_concept_latria_sexual_repression_level_desc: "Die Stufen der [latria_sexual_repression|E] steigen bei #V 20#!, #V 50#!, #V 100#!, #V 180#! und #V 300#! Unterdrückung. Jede Stufe verleiht den entsprechenden Charaktermodifikator."

