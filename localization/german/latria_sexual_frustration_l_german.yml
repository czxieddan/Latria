 latria_sexual_frustration_1_desc: "Unerfüllte Begierde beginnt diesen Charakter zu beunruhigen."
 latria_sexual_frustration_2: "Nagende Begierde"
 latria_sexual_frustration_2_desc: "Die Begierde kehrt immer wieder und erschwert es, die Fassung zu bewahren."
 latria_sexual_frustration_3: "Aufgestaute Begierde"
 latria_sexual_frustration_3_desc: "Lange unterdrückte fleischliche Begierde belastet Körper und Geist."
 latria_sexual_frustration_4: "Quälende Begierde"
 latria_sexual_frustration_4_desc: "Die Last der Enthaltsamkeit prägt nun jede wache Stunde."
 latria_sexual_frustration_5: "Unerträgliche Begierde"
 latria_sexual_frustration_5_desc: "Die Begierde ist zu einer unerträglichen Last geworden."

 latria_sexual_frustration_0: "Unbeschwerte Begierde"
