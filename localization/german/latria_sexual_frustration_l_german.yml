 latria_daily_sexual_frustration_gain_no_longer: "Nicht länger unterdrückt"

 latria_act.0401.t: "Eine unruhige Nacht"
 latria_act.0401.desc: "Der Schlaf lässt auf sich warten. Sobald es im Gemach still wird, kehrt die Begierde zurück, die ich beiseitegeschoben habe."
 latria_act.0401.a: "Mich unter der Decke umdrehen"
 latria_act.0402.t: "Keine Ruhe"
 latria_act.0402.desc: "Die geringste Ablenkung weicht derselben unerfüllten Sehnsucht."
 latria_act.0402.a: "Meine Gedanken sammeln"
 latria_act.0403.t: "Versagte Begierde"
 latria_act.0403.desc: "Enthaltsamkeit fühlt sich längst nicht mehr wie Geduld an. Sie bedrängt jeden ruhigen Gedanken."
 latria_act.0403.a: "Ausharren"
 latria_act.0404.t: "Kurz vor dem Zusammenbruch"
 latria_act.0404.desc: "Weder Schlaf noch Gebet noch Arbeit bringen mir Ruhe. Die Anspannung folgt mir überallhin."
 latria_act.0404.a: "Mich zusammenreißen"
 latria_act.0405.t: "Zu viel, um es zu ertragen"
 latria_act.0405.desc: "Unerfüllte Begierde hat jeden anderen Gedanken verdrängt. Wieder ist eine Nacht ohne Schlaf vergangen, und selbst vertraute Aufgaben fallen mir schwer. Ich sehe kein Ende."
 latria_act.0405.a: "Tief durchatmen"
 latria_sexual_frustration_collapse_warning_tt: "Ich halte nicht mehr lange durch …"
 latria_act.0405.b: "Es ertragen"
