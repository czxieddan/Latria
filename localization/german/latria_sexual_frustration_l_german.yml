 latria_act.0401.t: "Eine unruhige Nacht"
 latria_act.0401.desc: "Das Gemach ist still, und ich bin der Einzige, der wacht. Die Begierde, die ich beiseitegeschoben habe, kehrt von selbst zurück, warm an meinem Rücken. Die Kerze brennt nieder; unter den Bettvorhängen steigt die Luft auf.\n\nIch zähle meine Atemzüge, verliere die Zahl und beginne von vorn. Die kleinen Aufgaben des Tages tauchen eine nach der anderen auf; darunter liegt dieselbe unerfüllte Sehnsucht.\n\nJe stiller das Gemach, desto klarer wird sie. Diese Nacht wird mich wach finden, lauschend, bis das Bettgestell im Morgengrauen verstummt."
 latria_act.0401.a: "Mich unter der Decke umdrehen"
 latria_act.0402.t: "Keine Ruhe"
 latria_act.0402.desc: "Beim Morgenlob stocke ich auf halbem Weg; dieselbe Sehnsucht schlüpft zwischen die Worte. Ich halte inne und zähle meine Atemzüge neu; als sie sich glätten, ist sie noch da.\n\nDer Gesang zieht durch das Langhaus. Meine Lippen folgen, doch die Verse bleiben nicht; ringsum halten die Köpfe sich gesenkt. Die Sehnsucht liegt auf meiner Brust, mit jedem Augenblick schwerer.\n\nAls der Weihrauch verglüht, schließe ich das Buch und weiß, dass sie mit der Nacht zurückkehrt."
 latria_act.0402.a: "Meine Gedanken sammeln"
 latria_act.0403.t: "Versagte Begierde"
 latria_act.0403.desc: "Enthaltsamkeit fühlt sich längst nicht mehr wie Geduld an. Sie drängt in meiner Brust empor und schiebt jeden ruhigen Gedanken beiseite.\n\nEine Arbeit nach der anderen geht durch meine Hände, und meine Gedanken kehren an denselben Ort zurück. Die Flamme schwankt; die Hitze steigt wieder auf. Ich lege die Arbeit nieder und warte, bis sie vergeht; sie bleibt jedes Mal länger.\n\nNächte wie diese halte ich nicht mehr viele aus."
 latria_act.0403.a: "Ausharren"
 latria_act.0404.t: "Kurz vor dem Zusammenbruch"
 latria_act.0404.desc: "Der Schlaf bleibt aus; das Gebet hält sie nicht; die Arbeit des Tages verdrängt sie nicht. Nachts ist sie am lautesten, tags wartet sie hinter jeder Pause.\n\nGegen Abend hoffe ich auf ein Klopfen an der Tür, und sei es nur ein Gruß. Die Tür geht auf; es ist stets ein Diener mit Wasser, der die Schüssel abstellt und sich zurückzieht.\n\nIst die Tür geschlossen, ist das Gemach stiller als zuvor."
 latria_act.0404.a: "Mich zusammenreißen"
 latria_act.0405.t: "Zu viel, um es zu ertragen"
 latria_act.0405.desc: "Ich will nicht länger standhalten. Tagsüber glüht die Brust ohne Unterbrechung, und selbst die vertrauteste Verrichtung gehorcht meinen Händen nicht.\n\nNachts bleibt mir das Einschlafen versagt; ich liege wach und höre zu, wie die Kerze niederbrennt. Die Hitze drückt auf meine Brust und weicht nicht.\n\nIch sehe kein Ende."
 latria_act.0405.a: "Tief durchatmen"
 latria_sexual_frustration_collapse_warning_tt: "Ich halte nicht mehr lange durch …"
 latria_act.0405.b: "Es ertragen"
