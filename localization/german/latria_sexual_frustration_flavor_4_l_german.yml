l_german:
 latria_sexual_frustration_flavor.1301.t: "Eine unversandte Einladung"
 latria_sexual_frustration_flavor.1301.desc.female: "Im Nachtgewand sitze ich am Schreibtisch; auf dem Blatt steht nur ein Name. Meine Zofe fragt, ob sie den Brief überbringen soll. Ich falte ihn und antworte nicht."
 latria_sexual_frustration_flavor.1301.desc.male: "Im Nachtgewand sitze ich am Schreibtisch; auf dem Blatt steht nur ein Name. Draußen wartet ein Diener, um den Brief zu überbringen, doch ich bringe es nicht über mich, ihn zu versiegeln."
 latria_sexual_frustration_flavor.1301.desc: "Ein unversiegelter Brief liegt schon seit geraumer Zeit unter der Kerze."
 latria_sexual_frustration_flavor.1301.a: "Den Brief zu Ende schreiben und dem Diener geben."
 latria_sexual_frustration_flavor.1301.b: "Den Brief weglegen, die Sehnsucht unterdrücken und zu Bett gehen."

 latria_sexual_frustration_flavor.1302.t: "Das Urteil des Hofes"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Der Hofdichter scherzt über alte Liebschaften, und selbst die strengsten Adligen verziehen keine Miene. Ich erhebe mit ihnen den Becher, finde darin aber keine Erleichterung."
 latria_sexual_frustration_flavor.1302.desc.strict: "Ein Adliger hat durch eine unbedachte Liebschaft sein Ansehen verloren, und der Hof spricht über seine ganze Familie. Ich höre ihrem Urteil zu und weiß, dass ich auf derselben Waage stehen könnte."
 latria_sexual_frustration_flavor.1302.desc: "Das Gespräch wendet sich Ruf und Begierde zu."
 latria_sexual_frustration_flavor.1302.a: "Von meiner Sehnsucht sprechen und das Gespräch immer wieder darauf zurückbringen."
 latria_sexual_frustration_flavor.1302.b: "Schweigen, meinen Gastgebern danken und mich verabschieden."

 latria_sexual_frustration_flavor.1303.t: "Die Mitternachtsglocke"
 latria_sexual_frustration_flavor.1303.desc.favors: "Nach dem Glockenschlag bleibt der Priester an der Tür stehen. Er sagt, Begierde könne zum Guten gelenkt werden, doch ich weiß nicht, ob ich noch länger warten kann."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Die Glocke läutet wieder und wieder, ebenso hallt der Schwur des Priesters in meinem Herzen wider. Meine Knie schmerzen vom Knien, doch noch immer kommt keine Antwort."
 latria_sexual_frustration_flavor.1303.desc: "Das Mitternachtsgebet hat keine Ruhe gebracht, obwohl die Glocken weiterläuten."
 latria_sexual_frustration_flavor.1303.a: "Die Gebote der Enthaltsamkeit im Tempel zurücklassen."
 latria_sexual_frustration_flavor.1303.b: "Den Gedanken unterdrücken und das Gebet noch einmal sprechen."

 latria_sexual_frustration_flavor.1304.t: "Das Ende der Geduld"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Im Nachtgewand gehe ich in der Kammer auf und ab. Das Schachbrett, das mein Diener brachte, bleibt unberührt; das Warten ist zur eigenen Qual geworden."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Ich binde den Gürtel meines Nachtgewands neu und versuche, jede Bewegung gefasst wirken zu lassen. Je mehr ich darauf achte, desto schwerer lässt sich meine Sehnsucht übergehen."
 latria_sexual_frustration_flavor.1304.desc: "Im Zimmer ist es still. Ich kann nicht länger ruhig sitzen."
 latria_sexual_frustration_flavor.1304.a: "Das Schachbrett beiseitelegen und an die Person denken, nach der ich mich sehne."
 latria_sexual_frustration_flavor.1304.b: "An den Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1305.t: "Eine Kammer nach Einbruch der Nacht"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Der Hof hat sich zurückgezogen, doch ich bleibe im Festgewand in meiner Kammer. Die Bittschriften sind beantwortet; die Gedanken, die mich quälen, sind nicht mit den Edelleuten gegangen."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Meine Gefährten haben sich im Gasthaus zur Ruhe begeben, doch ich bleibe allein in meinem Zimmer. Meine Ausrüstung ist gepackt und der Weg für morgen steht fest, doch meine Gedanken kommen nicht zur Ruhe."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Ich bleibe allein in meinem kleinen Zimmer, noch immer im geistlichen Gewand. Die Kerze am Bett ist erloschen. Mein Gelübde bleibt bestehen, doch Trost stellt sich nicht ein."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Im Festgewand kehre ich in eine leere Kammer zurück. Draußen verneigen sich die Wachen, doch drinnen ist niemand, der diese Last mit mir teilen kann."
 latria_sexual_frustration_flavor.1305.desc: "Die Kammer ist leer, doch ich bin noch nicht bereit, mich hinzulegen."
 latria_sexual_frustration_flavor.1305.a: "Trotz der späten Stunde einen vertrauten Bekannten rufen lassen und lange mit ihm sprechen."
 latria_sexual_frustration_flavor.1305.b: "Die Sehnsucht unterdrücken, das Gewand ablegen und zu Bett gehen."

 latria_sexual_frustration_flavor.1306.t: "Ein Bote um Mitternacht"
 latria_sexual_frustration_flavor.1306.desc.female: "Im Nachtgewand sitze ich am Bett und höre zwei leise Schläge an der Tür. Meine Zofe bringt nur ein leeres Blatt, doch ich weiß, auf wessen Nachricht ich warte."
 latria_sexual_frustration_flavor.1306.desc.male: "Im Nachtgewand öffne ich die Kammertür, doch der Gang ist bereits leer. Der ununterzeichnete Zettel auf der Schwelle raubt mir den Schlaf."
 latria_sexual_frustration_flavor.1306.desc: "Die Schritte hinter der Tür verklingen. Das Blatt auf meinem Schreibtisch bleibt leer."
 latria_sexual_frustration_flavor.1306.a: "Die Worte niederschreiben, mit denen ich so lange gezögert habe."
 latria_sexual_frustration_flavor.1306.b: "Das Blatt weglegen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1307.t: "Schweigen an der Tafel"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Der Dichter trägt eine alte Liebesgeschichte vor, und die Gesellschaft hört begeistert zu. Ich erhebe mit ihnen den Becher und denke an eine Geschichte, die niemand erzählt hat."
 latria_sexual_frustration_flavor.1307.desc.strict: "An der Tafel ist von einem Adligen die Rede, der wegen einer unbedachten Liebschaft in Ungnade fiel, und das Lachen verstummt. Ich wende mich zum Fenster und verberge meinen Gesichtsausdruck."
 latria_sexual_frustration_flavor.1307.desc: "Die Becher gehen weiter herum, doch das Gespräch verweilt bei einem Thema, das besser unberührt bliebe."
 latria_sexual_frustration_flavor.1307.a: "Mir vom Wein die Zunge lösen lassen und eine private Geschichte nach der anderen erzählen."
 latria_sexual_frustration_flavor.1307.b: "Schweigen, mich vor der Gesellschaft verneigen und Abschied nehmen."

 latria_sexual_frustration_flavor.1308.t: "Ein Gebet während der Nachtwache"
 latria_sexual_frustration_flavor.1308.desc.favors: "Die Glocke verkündet die Nachtwache, und ich bete noch immer im Heiligtum. Mein Glaube verurteilt fleischliche Freuden nicht, doch ich weiß nicht, wie ich dieser anhaltenden Sehnsucht begegnen soll."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Im Heiligtum wiederhole ich das Gebet der Keuschheit. Die Glocke verklingt, doch der Gedanke in mir bleibt."
 latria_sexual_frustration_flavor.1308.desc: "Kerzenlicht fällt auf die leeren Bänke. Ich bin noch nicht aufgestanden."
 latria_sexual_frustration_flavor.1308.a: "Das Gebet der Enthaltsamkeit beiseitelegen und meinem Herzen nach draußen folgen."
 latria_sexual_frustration_flavor.1308.b: "Meine Begierde zügeln und die Nachtwache beenden."

 latria_sexual_frustration_flavor.1309.t: "Ein Blick in den Spiegel"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Unbekleidet und allein stehe ich einen Augenblick vor dem Spiegel in meiner Kammer. Mein Ausdruck ist unverändert, doch ich werde Begierde nicht länger eine flüchtige Schwäche nennen."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Unbekleidet am Bett wiederhole ich mein Gelübde. Ich erinnere mich an jedes Wort, doch die Sehnsucht in mir verschwindet nicht."
 latria_sexual_frustration_flavor.1309.desc: "Niemand sonst ist im Zimmer. Das Schweigen im Spiegel lässt mir keinen Ort, an den ich ausweichen könnte."
 latria_sexual_frustration_flavor.1309.a: "Meine Gefühle eingestehen und bei ihnen verweilen."
 latria_sexual_frustration_flavor.1309.b: "Mich ankleiden, an den Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1310.t: "Wach in meinem Gemach"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Nach dem Nachtgebet kehre ich in mein kleines Zimmer zurück. Ich trage noch mein geistliches Gewand, und die Kerze am Bett ist erloschen, doch ich will mich nicht hinlegen."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Meine Gefährten haben sich im Gasthaus zur Ruhe begeben. Allein in meinem Zimmer verstaue ich meine Ausrüstung. Der Weg für morgen ist klar; durch meine Gedanken finde ich keinen."
 latria_sexual_frustration_flavor.1310.desc: "Es ist spät. Die Tür ist geschlossen, doch ich kann nicht schlafen."
 latria_sexual_frustration_flavor.1310.a: "Einem alten Bekannten schreiben und offen von meinen Sorgen sprechen."
 latria_sexual_frustration_flavor.1310.b: "Den Gedanken unterdrücken, die Kerze löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1301.c: "Ein neues Blatt nehmen und die Einladung zu einem Gedicht machen."
 latria_sexual_frustration_flavor.1302.c: "Das Gespräch wieder auf Familien und Ländereien lenken."
 latria_sexual_frustration_flavor.1302.d: "Eine Geschichte von der Reise erzählen, damit sie wieder ihre Becher erheben."
 latria_sexual_frustration_flavor.1303.c: "Bis zum Morgengrauen bleiben und die heilige Schrift Zeile für Zeile studieren."
 latria_sexual_frustration_flavor.1304.c: "Die Figuren aufstellen und über eine Schachaufgabe nachdenken."
 latria_sexual_frustration_flavor.1304.d: "Mit dem ersten Zug beginnen und langsam eine ganze Partie spielen."
 latria_sexual_frustration_flavor.1305.c: "Die Arbeit des Morgens ordnen, bevor ich die Kerze lösche."
 latria_sexual_frustration_flavor.1307.c: "Ein neues Gedicht vortragen und ihre Aufmerksamkeit auf etwas anderes lenken."
 latria_sexual_frustration_flavor.1308.c: "Das Gebetbuch schließen und meine Gedanken schweigend ordnen."
 latria_sexual_frustration_flavor.1308.d: "Bis zum Morgengebet wachen und die Bücher für alle vorbereiten."
 latria_sexual_frustration_flavor.1309.c: "Aufschreiben, was mich quält, und es Zeile für Zeile bedenken."
 latria_sexual_frustration_flavor.1310.c: "Tee aufbrühen und meine Habseligkeiten und Bücher in Ruhe wegräumen."
