l_german:
 latria_sexual_frustration_flavor.1201.t: "Eine Stunde ohne Besuch"
 latria_sexual_frustration_flavor.1201.desc.female: "Im Nachtgewand warte ich am Fenster, bis der Tee kalt geworden ist. Ein Treffen wurde nie versprochen, doch in meinen Gedanken halte ich weiter einen Platz dafür frei."
 latria_sexual_frustration_flavor.1201.desc.male: "Im Nachtgewand warte ich am Fenster. Nur die Nachtwache durchquert den Hof. Niemand kommt, doch ich bin noch nicht bereit, die Kerze zu löschen."
 latria_sexual_frustration_flavor.1201.desc: "Der Docht brennt nieder. Vor dem Fenster regt sich nichts."
 latria_sexual_frustration_flavor.1201.a: "Die Worte aufschreiben, die ich sagen wollte."
 latria_sexual_frustration_flavor.1201.b: "Die Kerze löschen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1202.t: "Geflüster vor dem Badehaus"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Lachen dringt aus dem Badehaus, ungestört davon, wer mit wem gekommen ist. Es sollte ein gewöhnlicher Anblick sein, doch ich denke daran, wie lange ich mich nicht mehr so unbefangen gefühlt habe."
 latria_sexual_frustration_flavor.1202.desc.strict: "Vor dem Badehaus besprechen mehrere Adlige, wer wem aus dem Weg gehen muss. Ich höre meinen Namen, und das Gespräch verstummt."
 latria_sexual_frustration_flavor.1202.desc: "Wasser hallt im Badehaus wider. Die Stimmen draußen lenken mich stärker ab."
 latria_sexual_frustration_flavor.1202.a: "Vom ersehnten Treffen erzählen und die Geschichte immer weiter ausführen."
 latria_sexual_frustration_flavor.1202.b: "Den Gedanken beiseiteschieben, ihnen danken und mich verabschieden."

 latria_sexual_frustration_flavor.1203.t: "Stille nach dem Gebet"
 latria_sexual_frustration_flavor.1203.desc.favors: "Der Priester sagt, Begierde sei an sich nicht sündhaft. Ich möchte ihm glauben, doch die Leere in meinem Herzen bleibt."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Der Priester spricht von der Tugend der Keuschheit, dann schweigt er. Ich bleibe knien, mein Gebet vertraut und meine Gedanken weit fort."
 latria_sexual_frustration_flavor.1203.desc: "Das Gebet ist beendet. Die Tempelglocken klingen mir noch in den Ohren."
 latria_sexual_frustration_flavor.1203.a: "Die Lehre der Enthaltsamkeit vorerst beiseitelegen."
 latria_sexual_frustration_flavor.1203.b: "Den Gedanken unterdrücken und das Gebet erneut beginnen."

 latria_sexual_frustration_flavor.1204.t: "Unruhig nach der Jagd"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Allein und unbekleidet in meinem Gemach höre ich noch den Nachhall der Bogensehne. Mein Körper ist müde, doch meine Gedanken folgen jedem Schatten über das Jagdfeld."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Allein und unbekleidet in meinem Gemach versuche ich, meine Gedanken zu Gebet und Pflicht zurückzuführen. Jedes Mal, wenn ich die Augen schließe, kehrt die Sehnsucht zurück."
 latria_sexual_frustration_flavor.1204.desc: "Das Jagdfeld ist leer, doch die Unruhe in mir will nicht vergehen."
 latria_sexual_frustration_flavor.1204.a: "Mich an jene Gestalt auf dem Jagdfeld erinnern."
 latria_sexual_frustration_flavor.1204.b: "Mich ankleiden, zum Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1205.t: "Das geschlossene Arbeitszimmer"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Ich lasse das Arbeitszimmer räumen; Karten, Siegel und unerledigte Schriftstücke bleiben zurück. Einen alten Brief habe ich aus der Schublade genommen, doch ich bringe es nicht über mich, ihn noch einmal zu lesen."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Die Route und die Wachen sind auf dem Tisch verzeichnet. Meine Gefährten warten draußen. Allen habe ich Zeit zur Ruhe eingeräumt, doch bei meinen eigenen Stunden fällt mir wieder ein alter Brief ein."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Allein im Arbeitszimmer habe ich weder die Rechnungsbücher noch die Schrift geschlossen. Zwischen den Seiten liegt ein alter Brief. Immer wieder greife ich danach und ziehe die Hand zurück."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Meine Diener warten vor der Tür des Arbeitszimmers. Ich verbiete ihnen, mich zu stören. Siegel und Papiere liegen noch vor mir, doch den alten Brief habe ich noch nicht in die Schublade zurückgelegt."
 latria_sexual_frustration_flavor.1205.desc: "Ich schließe die Tür des Arbeitszimmers und lasse den alten Brief und die unerledigte Arbeit auf dem Tisch liegen."
 latria_sexual_frustration_flavor.1205.a: "Die Arbeit bis morgen liegen lassen und den Brief erneut lesen."
 latria_sexual_frustration_flavor.1205.b: "Die alte Sehnsucht unterdrücken und meinen Pflichten nachgehen."

 latria_sexual_frustration_flavor.1206.t: "Gerüchte beim Festmahl"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Jemand beim Festmahl spricht von einer Affäre so beiläufig wie vom Wetter. Ich will darüber lachen, dann merke ich, wie lange ich mich nicht mehr an solchen Gesprächen beteiligt habe."
 latria_sexual_frustration_flavor.1206.desc.strict: "Mehrere Adlige sprechen über einen Höfling, der durch Ungebühr in Ungnade fiel, und einer nennt meinen Namen. Ich glätte meinen Ärmel und schließe mich ihnen nicht an."
 latria_sexual_frustration_flavor.1206.desc: "Musik trägt über die Gesellschaft hinweg. Ihre Gespräche lenken mich stärker ab."
 latria_sexual_frustration_flavor.1206.a: "Meine alte Geschichte vollständig erzählen, selbst die im Verborgenen gesprochenen Worte."
 latria_sexual_frustration_flavor.1206.b: "Meine Zunge hüten, mich vor den Tischgenossen verbeugen und mich verabschieden."

 latria_sexual_frustration_flavor.1207.t: "Ein leerer Platz nach dem Gebet"
 latria_sexual_frustration_flavor.1207.desc.favors: "Nach dem Gottesdienst lässt der Priester sein Buch auf der Bank liegen und geht. Mein Glaube verurteilt die Begierde nicht, doch meine Gedanken finden keine Ruhe."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Der Priester ist fort, doch ich bleibe auf den Knien. Die Lehre der Keuschheit ist klar; die Sehnsucht in mir ist nicht verblasst."
 latria_sexual_frustration_flavor.1207.desc: "Nur die Kerze und ich bleiben im stillen Tempel zurück."
 latria_sexual_frustration_flavor.1207.a: "Den Tempel verlassen und bei dieser Zuneigung verweilen."
 latria_sexual_frustration_flavor.1207.b: "Meine Begierde zügeln und die Gebote erneut lesen."

 latria_sexual_frustration_flavor.1208.t: "Die Hatz durch den Wald"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Das Wild schlüpft zwischen die Bäume, und die anderen setzen ihm nach. Ich reite hinterher, obwohl eine andere Sehnsucht meine Gedanken noch festhält."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Ich zügle mein Pferd und erinnere mich daran, dass ich nur zur Jagd gekommen bin. Die Hunde verschwinden in der Ferne, doch meine Gedanken tun es nicht."
 latria_sexual_frustration_flavor.1208.desc: "Die Gesellschaft hält zwischen den Bäumen an und wartet auf mein Wort, die Hatz fortzusetzen."
 latria_sexual_frustration_flavor.1208.a: "Die anderen vorreiten und meine Gedanken schweifen lassen."
 latria_sexual_frustration_flavor.1208.b: "Meine Gedanken sammeln und die Jagd weiter anführen."

 latria_sexual_frustration_flavor.1209.t: "Glut am Fenster"
 latria_sexual_frustration_flavor.1209.desc.female: "Im Nachtgewand sitze ich am Fenster, während das Herdfeuer zu Glut verglimmt. Die Worte, die ich tagsüber nicht aussprach, kehren nun zu mir zurück."
 latria_sexual_frustration_flavor.1209.desc.male: "Im Nachtgewand lehne ich am Fenster und sehe der Nachtwache beim Überqueren des Hofes zu. Eine unerwiderte Zuneigung verlässt meine Gedanken nicht."
 latria_sexual_frustration_flavor.1209.desc: "Vor dem Fenster ist alles still. Das Feuer schwindet, doch ich bin nicht müde."
 latria_sexual_frustration_flavor.1209.a: "Meine Gedanken zu Papier bringen."
 latria_sexual_frustration_flavor.1209.b: "Das Feuer schüren, die Sehnsucht beiseiteschieben und mich hinlegen."

 latria_sexual_frustration_flavor.1210.t: "Kein Klopfen an der Tür"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Meine Diener haben die Krone weggeräumt. Im Nachtgewand neben dem Bett lassen mich die Lasten des Reiches nicht vergessen, was ich nicht auszusprechen wage."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Meine Gefährten haben sich im Gasthaus zurückgezogen. Im Nachtgewand sitze ich neben einem unversandten Brief. Morgen reiten wir weiter, doch diese Sorge wird mich begleiten."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Ich hänge mein geistliches Gewand neben das Bett und sitze allein im Nachtgewand. Mein Gelübde klingt mir noch in den Ohren, doch meine Gedanken schweigen nicht."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Meine Festkleidung ist weggeräumt. Im Nachtgewand sitze ich neben dem Bett. Die Wachen draußen hören keinen Seufzer, und mein Amt kann diese private Angelegenheit nicht richten."
 latria_sexual_frustration_flavor.1210.desc: "Es ist spät, und ich bleibe mit dieser Sorge allein."
 latria_sexual_frustration_flavor.1210.a: "Trotz der späten Stunde einen vertrauten Bekannten holen und ausgiebig sprechen."
 latria_sexual_frustration_flavor.1210.b: "Die Sehnsucht unterdrücken, die Kerze löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1202.c: "Das Thema wechseln und nach dem Befinden meiner Gefährten fragen."
 latria_sexual_frustration_flavor.1202.d: "Alle zum Tee einladen und reden, bis wir müde sind."
 latria_sexual_frustration_flavor.1203.c: "Den Priester bitten zu bleiben und mit mir die Lehren zu studieren."
 latria_sexual_frustration_flavor.1204.c: "Mein Nachtgewand anziehen und die Gedanken des Tages langsam durchgehen."
 latria_sexual_frustration_flavor.1205.c: "Die Wachen einteilen und mir etwas Ruhe gönnen."
 latria_sexual_frustration_flavor.1205.d: "Die morgigen Pflichten einzeln auflisten."
 latria_sexual_frustration_flavor.1206.c: "Das Gespräch mit einem neuen Gedicht umlenken."
 latria_sexual_frustration_flavor.1207.c: "Mich vor die Schrift setzen und dieses Kapitel zu Ende lesen."
 latria_sexual_frustration_flavor.1208.c: "Die Pferde ausruhen lassen und in Ruhe die Spuren untersuchen."
 latria_sexual_frustration_flavor.1209.c: "Das Feuer schüren, Tee kochen und in einem alten Buch lesen."
 latria_sexual_frustration_flavor.1209.d: "Aus den nie gesprochenen Worten ein Gedicht machen."
 latria_sexual_frustration_flavor.1210.c: "Den morgigen Tag planen und jede Aufgabe ordnen."
