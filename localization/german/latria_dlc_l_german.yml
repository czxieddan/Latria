l_german:
 dlc_latria: "Latria"
 dlc_latria_desc: "Wen Ihr begehren dürft, bestimmt nicht länger die Sitte. Je tiefer Ihr das Verlangen vergrabt, desto heißer brennt es. Eine einsame Lampe, ein nie abgeschickter Brief, und die Nacht wird lang und schlaflos. Ein flüchtiger Rausch mag das Herz besänftigen oder eine Wunde hinterlassen, die Jahre währt. In Latria können Fleisch und Geist Erlösung finden oder dem Untergang entgegengehen."
