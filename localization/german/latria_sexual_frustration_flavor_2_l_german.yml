l_german:
 latria_sexual_frustration_flavor.1101.t: "Wach unter dem Betthimmel"
 latria_sexual_frustration_flavor.1101.desc.female: "Ich erwache im Bett; mein Nachtgewand liegt am Fußende. Niemand sonst ist im Gemach. Die Stille verschärft nur die Sehnsucht, die unerwidert blieb."
 latria_sexual_frustration_flavor.1101.desc.male: "Ich erwache im Bett; mein Nachtgewand liegt am Fußende. Die Welt vor dem Fenster schweigt, doch meine Gedanken finden keinen Schlaf."
 latria_sexual_frustration_flavor.1101.desc: "Der Betthimmel hängt tief. Die Nacht ist lang, und meine Gedanken finden keine Ruhe."
 latria_sexual_frustration_flavor.1101.a: "Die Augen schließen und an die ersehnte Person denken."
 latria_sexual_frustration_flavor.1101.b: "Den Gedanken beiseiteschieben, die Vorhänge zuziehen und weiterschlafen."

 latria_sexual_frustration_flavor.1102.t: "Blicke zwischen den Tänzen"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Mehrere Tänze vergehen, und die Gesichter um mich wechseln. Niemand stört sich an einer engen Drehung, doch ich erinnere mich noch an den kurzen Blickwechsel."
 latria_sexual_frustration_flavor.1102.desc.strict: "Je enger der Tanz, desto mehr klingt das Lachen wie Flüstern. Ich wende meinen Blick den Musikern zu, damit niemand meine Gedanken errät."
 latria_sexual_frustration_flavor.1102.desc: "Die Musik wird schneller, doch der Tanz trägt meine Gedanken nicht davon."
 latria_sexual_frustration_flavor.1102.a: "Um einen weiteren Tanz bitten und etwas näher rücken."
 latria_sexual_frustration_flavor.1102.b: "Meinem Tanzpartner mit einer Verbeugung danken und an den Rand des Saals treten."

 latria_sexual_frustration_flavor.1103.t: "An der Tür des geistlichen Beistands"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mein geistlicher Beistand sagt, der Begierde zu entsagen sei nicht der einzige Weg zur Hingabe. Ich möchte mehr fragen, doch vor der Tür sind Schritte verstummt."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mein geistlicher Beistand erinnert mich daran, dass Keuschheit auch fern der Blicke anderer zählt. Ich senke den Kopf und hoffe, dass keine weiteren Fragen folgen."
 latria_sexual_frustration_flavor.1103.desc: "Das Gemach ist düster. Ich überlege, wie ich mit meinem geistlichen Beistand sprechen soll."
 latria_sexual_frustration_flavor.1103.a: "Meine Sehnsucht eingestehen und sie nicht länger verbergen."
 latria_sexual_frustration_flavor.1103.b: "Nur nach meinen gegenwärtigen Pflichten fragen und den Rest hinunterschlucken."

 latria_sexual_frustration_flavor.1104.t: "Der ausgebliebene Adler"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Der Adler kreist über dem Feld und kehrt nicht auf meinen Handschuh zurück. Ich beneide ihn um die Freiheit, seiner Begierde ohne Erklärung zu folgen."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Der Adler kreist weiter. Meine Diener fragen, ob ich noch einen Pfeil abschießen will. Ich bitte sie zu warten, als könnte Geduld alles richten."
 latria_sexual_frustration_flavor.1104.desc: "Der Adler kehrt nicht zurück, und die Jäger warten auf mein Wort."
 latria_sexual_frustration_flavor.1104.a: "Den Adler kreisen und meine Gedanken schweifen lassen."
 latria_sexual_frustration_flavor.1104.b: "Meine Gedanken sammeln und den Adler zum Lager zurückrufen."

 latria_sexual_frustration_flavor.1105.t: "Kerzen und eine Krone"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Ein Diener trägt die Krone aus meinem Gemach; unerledigte Erlasse bleiben neben den Kerzen liegen. Ich ziehe mein Nachtgewand enger und nehme den unversandten Brief zwischen den Papieren hervor."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Ich ziehe im Gasthaus mein Nachtgewand an. Meine Gefährten haben sich zurückgezogen, doch der unversandte Brief neben meinem Gepäck hält mich wach."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Ich falte mein geistliches Gewand und setze mich im Nachtgewand neben das Bett. Der unversandte Brief liegt unter meiner Schrift; wieder ziehe ich ihn hervor."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Meine Diener räumen die Festkleidung weg. Im Nachtgewand unter der Lampe entfalte ich den unversandten Brief, noch bevor ich mich den unerledigten Papieren zuwende."
 latria_sexual_frustration_flavor.1105.desc: "Die Kerzen brennen nieder. Ein unversandter Brief liegt noch in Reichweite."
 latria_sexual_frustration_flavor.1105.a: "Den Brief einem Boten geben."
 latria_sexual_frustration_flavor.1105.b: "Ihn vernichten, den Gedanken beiseiteschieben und die Kerze zum Schlafen löschen."

 latria_sexual_frustration_flavor.1106.t: "Unruhig im Kerzenschein"
 latria_sexual_frustration_flavor.1106.desc.female: "Im Nachtgewand sitze ich am Bett, während der Kerzenschein über das Fenster wandert. Es ist spät, doch die unerwiderte Sehnsucht hat mich nicht verlassen."
 latria_sexual_frustration_flavor.1106.desc.male: "Im Nachtgewand sitze ich am Bett. Der Nachtwächter hat den Hof zweimal durchquert, und noch immer finden meine Gedanken keine Ruhe."
 latria_sexual_frustration_flavor.1106.desc: "Die Kerze brennt nieder, doch unter dem Betthimmel will der Schlaf nicht kommen."
 latria_sexual_frustration_flavor.1106.a: "Meine Gedanken bei dieser Zuneigung verweilen lassen."
 latria_sexual_frustration_flavor.1106.b: "Nicht länger daran denken; die Kerze löschen und mich schlafen legen."


 latria_sexual_frustration_flavor.1107.t: "Ein erwiderter Tanz"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Mein Tanzpartner bittet um einen weiteren Tanz, und die Gesellschaft hält es für eine Höflichkeit. Ich erinnere mich an den Gedanken, der mir kam, als die Hand auf meiner verweilte."
 latria_sexual_frustration_flavor.1107.desc.strict: "Mein Tanzpartner bittet um einen weiteren Tanz, und mehrere Gesichter wenden sich uns zu. Noch bevor ich antworten kann, beugt sich jemand zum Nachbarn, um zu flüstern."
 latria_sexual_frustration_flavor.1107.desc: "Die Musiker beginnen einen weiteren Tanz, doch ich stehe nicht auf."
 latria_sexual_frustration_flavor.1107.a: "Den Tanz annehmen und näher rücken."
 latria_sexual_frustration_flavor.1107.b: "Mit einer Verbeugung ablehnen und meinem Tanzpartner einen angenehmen Tanz wünschen."

 latria_sexual_frustration_flavor.1108.t: "Gebet vor dem Schlaf"
 latria_sexual_frustration_flavor.1108.desc.favors: "Im Nachtgewand bete ich neben dem Bett. Mein Glaube erlaubt die Freuden des Fleisches, doch mein inneres Drängen lässt nicht nach."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Im Nachtgewand knie ich neben dem Bett und wiederhole mein Keuschheitsgelübde. Mit jeder Zeile wird die innere Stimme schwerer zu überhören."
 latria_sexual_frustration_flavor.1108.desc: "Die Kerze neben dem Bett flackert. Das Gebet geht weiter."
 latria_sexual_frustration_flavor.1108.a: "Das Keuschheitsgelübde beiseitelegen und meine Sehnsucht eingestehen."
 latria_sexual_frustration_flavor.1108.b: "Meine Gedanken zügeln und das Gebet fortsetzen."

 latria_sexual_frustration_flavor.1109.t: "Eine unvollendete Ratssitzung"
 latria_sexual_frustration_flavor.1109.desc: "Meine Ratsmitglieder haben mehrere Wege vorgeschlagen, doch ich habe mich noch für keinen entschieden. Meine Gedanken schweifen von der Sache ab, und selbst mein Schweigen zieht sich hin."
 latria_sexual_frustration_flavor.1109.a: "Die Ratssitzung beenden und mich meinen Gedanken überlassen."
 latria_sexual_frustration_flavor.1109.b: "Den Gedanken unterdrücken und den Schreiber bitten fortzufahren."
 latria_sexual_frustration_flavor.1110.t: "Ein Gemach nach Mitternacht"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Im Nachtgewand kehre ich in mein kleines Gemach zurück. Das Nachtgebet ist beendet, und die Kerze brennt nieder, doch der unversandte Brief liegt noch offen auf dem Tisch."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Im Gasthaus brennen nur noch wenige Lampen. Im Nachtgewand sitze ich am Bettrand und denke noch immer an den Brief, den ich nie versandte."
 latria_sexual_frustration_flavor.1110.desc: "Die Geräusche vor der Tür verklingen. Ich bleibe wartend neben dem Bett."
 latria_sexual_frustration_flavor.1110.a: "Den Brief fertigschreiben und im Morgengrauen absenden lassen."
 latria_sexual_frustration_flavor.1110.b: "Die Tür verriegeln, den Gedanken beiseiteschieben und mich zur Nacht zurückziehen."

 latria_sexual_frustration_flavor.1101.c: "Ein Gewand überwerfen, still sitzen und meinen Atem beruhigen."
 latria_sexual_frustration_flavor.1102.c: "Mit den Musikern über ihre Weisen sprechen."
 latria_sexual_frustration_flavor.1103.c: "Fragen, wie ich mit diesen Gefühlen leben kann."
 latria_sexual_frustration_flavor.1103.d: "Mit dem unversandten Brief beginnen und nichts verbergen."
 latria_sexual_frustration_flavor.1104.c: "Die anderen bitten zu warten und geduldig mit dem Adler arbeiten."
 latria_sexual_frustration_flavor.1105.c: "Den Brief in sein Kästchen legen und die morgige Arbeit planen."
 latria_sexual_frustration_flavor.1107.c: "Meinen Tanzpartner bitten, sich zu setzen und über etwas anderes zu sprechen."
 latria_sexual_frustration_flavor.1107.d: "Den ganzen Tisch zu einem lebhaften Gruppentanz einladen."
 latria_sexual_frustration_flavor.1108.c: "Das Gebet langsam beenden, ohne gegen jeden Gedanken anzukämpfen."
 latria_sexual_frustration_flavor.1109.c: "Eine kurze Pause einlegen und die restlichen Geschäfte ordnen."
 latria_sexual_frustration_flavor.1109.d: "Die dringenden Entscheidungen ordnen und gleich hier treffen."
 latria_sexual_frustration_flavor.1110.c: "Ein Gewand überwerfen und mir einen Becher warme Brühe holen."
