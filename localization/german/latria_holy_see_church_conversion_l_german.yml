 latria_demand_church_government: "Kirchliche Herrschaft verlangen"
 latria_demand_church_government_desc: "Verlange, dass [recipient.GetShortUINameNoTooltip] [recipient.GetHerHis] Land der Herrschaft der Kirche übergibt."
 latria_demand_church_government_tt: "Regierungsform [GetGovernment('ecclesiastical_government').GetName] annehmen"
