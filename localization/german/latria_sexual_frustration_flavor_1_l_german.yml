l_german:
 latria_sexual_frustration_flavor.1001.t: "Eine lange Nacht hinter dem Vorhang"
 latria_sexual_frustration_flavor.1001.desc.female: "Im Nachtgewand sitze ich am Fenster, einen ungeöffneten Brief auf dem Schoß. Wer ihn schrieb, ist längst fort, doch ich verweile bei allem, was unausgesprochen blieb."
 latria_sexual_frustration_flavor.1001.desc.male: "Im Nachtgewand sitze ich am Fenster, einen ungeöffneten Brief auf dem Schoß. Die vertraute Handschrift auf dem Umschlag erinnert mich an eine Sehnsucht, die keine Antwort fand."
 latria_sexual_frustration_flavor.1001.desc: "Es wird spät, und alte Gedanken kehren erneut zurück."
 latria_sexual_frustration_flavor.1001.a: "Den Brief zu Ende lesen und an seinen Verfasser denken."
 latria_sexual_frustration_flavor.1001.b: "Den Brief wegschließen und den Gedanken unterdrücken."
 latria_sexual_frustration_flavor.1001.c: "Ein frisches Blatt nehmen und ein Gedicht daraus machen."

 latria_sexual_frustration_flavor.1002.t: "Würze beim Festmahl"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Gewürze und Gesang erfüllen den Saal, und niemand unter den Gästen scheint sich an einem schweifenden Blick zu stören. Dennoch betrachte ich jedes Gesicht, als könnte noch jemand erscheinen."
 latria_sexual_frustration_flavor.1002.desc.strict: "Die Gewürze beleben das Festmahl, doch jedes Lachen erinnert mich daran, wie streng die Sitte über eine verirrte Begierde wacht. Beinahe vergesse ich den Becher in meiner Hand."
 latria_sexual_frustration_flavor.1002.desc: "Das Festmahl ist laut. Meine Gedanken schweifen trotzdem immer wieder ab."
 latria_sexual_frustration_flavor.1002.a: "Mit ein paar eigenen zärtlichen Worten einstimmen."
 latria_sexual_frustration_flavor.1002.b: "Den Blick senken, dem Gastgeber danken und mich verabschieden."
 latria_sexual_frustration_flavor.1002.c: "Die Musiker vor meinem Abschied um ein weiteres Stück bitten."
 latria_sexual_frustration_flavor.1002.d: "Die Gäste an einem Tisch versammeln und den Abend verplaudern."

 latria_sexual_frustration_flavor.1003.t: "Eine Predigt im Garten"
 latria_sexual_frustration_flavor.1003.desc.favors: "Der Prediger sagt, fleischliche Freuden müssten unserem Glauben nicht zuwiderlaufen. Die Worte sollten mich trösten, doch meine innere Unruhe lässt nicht nach."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Der Prediger spricht von Keuschheit und Enthaltsamkeit. Ich höre jedes Wort, kann meine Gedanken aber nicht bei der Schrift halten."
 latria_sexual_frustration_flavor.1003.desc: "Ich höre die Predigt bis zum Ende. Eine Brise wendet die Seite, und meine Gedanken bleiben unruhig."
 latria_sexual_frustration_flavor.1003.a: "Das Buch schließen und an die ersehnte Person denken."
 latria_sexual_frustration_flavor.1003.b: "Diese Gedanken beiseiteschieben und an der Rezitation teilnehmen."
 latria_sexual_frustration_flavor.1003.c: "Den Prediger bitten, jede Passage zu erklären."

 latria_sexual_frustration_flavor.1004.t: "Ein unruhiger Falke"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Der Falke schlägt auf meinem Handschuh mit den Flügeln und späht zu den Tauben in der Ferne. Ich kenne diesen Eifer gut, doch ich finde keinen Ort, an dem meine eigenen Gedanken zur Ruhe kommen."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Der Falke tritt unruhig auf meinem Handschuh hin und her. Ich konzentriere mich auf die Zügel und den Ruf, doch meine Gedanken lassen sich schwerer zähmen."
 latria_sexual_frustration_flavor.1004.desc: "Die Jäger warten darauf, dass ich den Falken zurückrufe, doch ich kann meine Gedanken nicht bei der Jagd halten."
 latria_sexual_frustration_flavor.1004.a: "Die Gesellschaft warten lassen und meinen Gedanken nachhängen."
 latria_sexual_frustration_flavor.1004.b: "Meine Gedanken sammeln und das Jagdzeug ordnen."
 latria_sexual_frustration_flavor.1004.c: "Langsam die Federn glätten und den Ruf noch einmal versuchen."

 latria_sexual_frustration_flavor.1005.t: "Zwischen den Ratssitzungen"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Die Herren haben sich zerstreut und Karten und Siegel auf dem Tisch zurückgelassen. Ich sitze allein an seinem Kopfende; neben den unerledigten Schriftstücken liegt ein alter Brief."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Meine Gefährten haben sich auf die nächste Furt geeinigt, doch die Karte bedeckt noch den Tisch. Ich ziehe einen alten Brief zur Lampe und verliere die Stelle in der Vorratsliste."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Die Besprechung ist vorüber, Rechnungsbücher und Schriften liegen noch auf dem Tisch. Ich ziehe einen alten Brief zwischen den Seiten hervor, und die ruhelosen Gedanken kehren zurück."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Die Ratssitzung ist vorüber, doch Papiere und Siegel bleiben liegen. Ich glätte meinen Ärmel; der alte Brief neben mir fesselt meine Aufmerksamkeit stärker als jede Bittschrift."
 latria_sexual_frustration_flavor.1005.desc: "Arbeit liegt bereit, doch ein alter Brief zieht immer wieder meine Aufmerksamkeit auf sich."
 latria_sexual_frustration_flavor.1005.a: "Die Arbeit beiseitelegen und den alten Brief erneut lesen."
 latria_sexual_frustration_flavor.1005.b: "Den Brief weglegen und zu meinen Pflichten zurückkehren."
 latria_sexual_frustration_flavor.1005.c: "Die restliche Arbeit einteilen und mir eine kurze Rast gönnen."
 latria_sexual_frustration_flavor.1005.d: "Alle Aufgaben ordnen und sie der Reihe nach erledigen."

 latria_sexual_frustration_flavor.1006.t: "Ein alter Brief im Kerzenschein"
 latria_sexual_frustration_flavor.1006.desc.female: "Im Nachtgewand sitze ich unter der Lampe, die Finger auf den Falten eines alten Briefes. Er enthält kein Versprechen, nur eine Zuneigung, die nicht verblasst ist."
 latria_sexual_frustration_flavor.1006.desc.male: "Im Nachtgewand sitze ich neben dem Bett. Die vertraute Handschrift auf dem alten Brief erinnert mich an eine Zuneigung, die nie erwidert wurde."
 latria_sexual_frustration_flavor.1006.desc: "Die Nacht ist still, doch die Worte des alten Briefes bleiben vor meinen Augen."
 latria_sexual_frustration_flavor.1006.a: "Den Brief zu Ende lesen."
 latria_sexual_frustration_flavor.1006.b: "Den Brief weglegen, die Kerze löschen und mich schlafen legen."

 latria_sexual_frustration_flavor.1007.t: "Bevor das Festmahl endet"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Jemand spricht von einer früheren Affäre, und niemand am Tisch nimmt Anstoß. Ich erhebe mit ihnen den Becher, doch mein Blick kehrt immer wieder zu einem leeren Platz zurück."
 latria_sexual_frustration_flavor.1007.desc.strict: "Eine unbedachte Liebschaft wird als Warnung angeführt, und die Gesellschaft wendet sich Ruf und Sitte zu. Ich glätte meinen Ärmel und schweige."
 latria_sexual_frustration_flavor.1007.desc: "Die Musik spielt weiter, doch meine Gedanken haben den Tisch längst verlassen."
 latria_sexual_frustration_flavor.1007.a: "Sie sollen von meiner eigenen Sehnsucht hören, von Anfang an."
 latria_sexual_frustration_flavor.1007.b: "Die Worte hinunterschlucken, dem Gastgeber danken und mich verabschieden."
 latria_sexual_frustration_flavor.1007.c: "Stattdessen meinen Nachbarn nach seinen Reisen fragen."

 latria_sexual_frustration_flavor.1008.t: "Gebet vor dem Schrein"
 latria_sexual_frustration_flavor.1008.desc.favors: "Die Kerze vor dem Schrein brennt nieder. Mein Glaube verachtet die Freuden des Fleisches nicht, doch ich kann mein inneres Drängen nicht besänftigen."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Ich wiederhole mein Keuschheitsgelübde vor dem Schrein, doch das vertraute Gebet stockt mir mehr als einmal auf den Lippen."
 latria_sexual_frustration_flavor.1008.desc: "Das Gebet ist beendet. Ich bleibe neben der Kerze."
 latria_sexual_frustration_flavor.1008.a: "Das Enthaltsamkeitsgelübde beiseitelegen und meine Sehnsucht eingestehen."
 latria_sexual_frustration_flavor.1008.b: "Meine Gedanken zügeln und weiterbeten."
 latria_sexual_frustration_flavor.1008.c: "Eine Passage lesen und vor dem Gehen darüber nachdenken."
 latria_sexual_frustration_flavor.1008.d: "Die Kerze brennen lassen und bis zum Morgengrauen rezitieren."

 latria_sexual_frustration_flavor.1009.t: "Die ungelesene Bittschrift"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Bittschriften bedecken den langen Tisch, und die Herren warten auf mein Wort. Ich lese eine Zeile zweimal, doch meine Gedanken schweifen ab."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Die Ratssitzung ist noch nicht vorüber, doch ich kann kein Wort der Papiere vor mir aufnehmen. Ich schließe das Rechnungsbuch und versuche, mich wieder der Sache zuzuwenden."
 latria_sexual_frustration_flavor.1009.a: "Den Rat entlassen und mich meinen Gedanken überlassen."
 latria_sexual_frustration_flavor.1009.b: "Meine Gedanken sammeln und jede Bittschrift bearbeiten."
 latria_sexual_frustration_flavor.1009.c: "Die Entscheidungen ordnen und sie dann einzeln verkünden."

 latria_sexual_frustration_flavor.1010.t: "Die Rückkehr des Adlers"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Der Falke kreist über dem Wald. Während ich ihm zusehe, wie er die Rückkehr verweigert, denke ich daran, wie sehr ich es leid bin, jede Begierde beiseitezuschieben."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Der Habicht kreist noch immer in der Ferne. Ich ziehe meinen Handschuh fest und zwinge mich, nur auf den Ruf der Jäger zu achten."
 latria_sexual_frustration_flavor.1010.desc: "Die Jäger warten auf den Aufbruch, während ich weiter den Himmel über den Bäumen betrachte."
 latria_sexual_frustration_flavor.1010.a: "Die Jäger warten lassen, während meine Gedanken dem Adler folgen."
 latria_sexual_frustration_flavor.1010.b: "Zum Aufbruch blasen und das Jagdzeug prüfen."
 latria_sexual_frustration_flavor.1010.c: "Am Waldrand gehen, bevor ich zur Gesellschaft zurückkehre."

 nick_latria_the_unquiet: "der Ruhelose"
 latria_flavor_focus: "Gesammelte Entschlossenheit"
 latria_flavor_focus_desc: "Dieser Charakter hat seine Aufmerksamkeit den Schriften und täglichen Pflichten zugewandt."
 latria_flavor_remorse: "Anhaltende Reue"
 latria_flavor_remorse_desc: "Ein kurzer Trost hat ein unruhiges Gewissen hinterlassen."
 latria_flavor_sullied: "Befleckter Ruf"
 latria_flavor_sullied_desc: "Gerüchte haben dem Ansehen und den Freundschaften dieses Charakters geschadet."
 latria_flavor_broken_sleep: "Schlafmangel"
 latria_flavor_broken_sleep_desc: "Zu wenig Schlaf hat diesen Charakter unaufmerksam und leicht ermüdbar gemacht."
 latria_flavor_vagabond_focus: "Konzentration auf der Reise"
 latria_flavor_vagabond_focus_desc: "Die Arbeit auf der Reise bringt ruhelose Gedanken kurzzeitig zum Schweigen."
 latria_flavor_public_disgrace: "Öffentliche Schande"
 latria_flavor_public_disgrace_desc: "Gerüchte über einen öffentlichen Fehltritt haben dem Ansehen und den Freundschaften dieses Charakters geschadet."
 latria_flavor_hunting_focus: "Aufmerksamkeit für die Jagd"
 latria_flavor_hunting_focus_desc: "Dieser Charakter hat seine Aufmerksamkeit der Fährtensuche, Falknerei und Reitkunst zugewandt."
 latria_flavor_warm_company: "Angenehme Gesellschaft"
 latria_flavor_warm_company_desc: "Ein gutes Gespräch hat diesen Charakter eher bereit gemacht, Gesellschaft zu suchen."
 latria_flavor_neglected_duties: "Vernachlässigte Pflichten"
 latria_flavor_neglected_duties_desc: "Private Sorgen haben diesen Charakter von seinen Pflichten abgehalten."
 latria_flavor_diligent_work: "Geordnete Geschäfte"
 latria_flavor_diligent_work_desc: "Dieser Charakter hat seine ruhelosen Gedanken in sorgfältige Planung und Arbeit gelenkt."
