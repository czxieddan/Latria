l_german:
 latria_sexual_frustration_flavor.1311.t: "Ehe der Haushalt erwacht"
 latria_sexual_frustration_flavor.1311.desc: "Ich erwache vor dem Haushalt, das Nachtgewand über meine Schenkel hochgerutscht, meine Hand schon dazwischen gepresst. Ich nehme sie nicht fort. Der Traum liegt noch auf mir, das Gewicht von jemandem, der nicht in diesem Zimmer war, und mein Leib will beenden, was der Traum begann.\n\nIch halte die Augen geschlossen und lasse es weitergehen, mein Atem verkürzt sich, der Absatz meiner Hand hält den langsamen Rhythmus, den ich inzwischen gelernt habe. Ein Name ist hinter meinen Zähnen. Ich sage ihn nicht, nicht, während die Dielen des Gangs unter dem Schritt eines Dieners knarren.\n\nWenn es bricht, liege ich still mit nassen Fingern und dem Laken feucht unter meiner Hüfte. Der Schritt geht an der Tür vorbei und weiter. Ich ziehe das Nachtgewand hinunter, und der Stoff klebt."
 latria_sexual_frustration_flavor.1311.a: "Es beenden lassen und mich dann für den Tag ankleiden."
 latria_sexual_frustration_flavor.1311.b: "Meine Hand fortnehmen und still liegen bis zur Glocke."
 latria_sexual_frustration_flavor.1311.c: "Aufstehen, mich waschen und eine Weile bei dem Schmerz sitzen."

 latria_sexual_frustration_flavor.1312.t: "Das Pfropf am Birnbaum"
 latria_sexual_frustration_flavor.1312.desc: "Der Garten ist noch nass vom Regen der Nacht, und die Person, der ich die ganze Woche aus dem Weg gegangen bin, zeigt mir das neue Pfropf am Birnbaum. Ihre Finger schließen sich über meine, um sie am Schnitt entlangzuschieben. Keine von uns lässt los, als die Vorführung beendet ist.\n\nIch kann den Puls in ihrem Daumen an meinem Handgelenk fühlen. Hinter der Hecke streiten zwei aus meinem Haushalt über einen Sattel. Wenn ich den Kopf ein wenig drehte und sie den ihren, täten wir etwas, das niemand für Gartenarbeit halten könnte.\n\nSie sagt, das Pfropf werde bis zum Herbst anwurzeln. Ihre Hand liegt noch auf meiner. Ein Zweig tropft auf meinen Ärmel, und ich wische es nicht fort."
 latria_sexual_frustration_flavor.1312.a: "Offen sagen, was ich will, hier unter dem Baum."
 latria_sexual_frustration_flavor.1312.b: "Für die Lehre danken und zurücktreten."
 latria_sexual_frustration_flavor.1312.c: "Bleiben und ihr stattdessen ein wahres Ding sagen."

 latria_sexual_frustration_flavor.1313.t: "Über die Tafel hinweg"
 latria_sexual_frustration_flavor.1313.desc: "Die Becher sind zweimal herumgegangen, und die Halle ist laut genug, dass niemand einem Einzelnen zuhört. Ich sehe seit einer Stunde dieselbe Person über die Tafel an, die Linie dieser Kehle, wenn sie lacht.\n\nIch könnte es sagen. Nicht das Ganze, nur genug, dass sie wüsste, dass ich nicht vom Wetter spreche. Die Person neben mir würde es hören. Auch wer am Ende der Tafel den Haushalt führt und alles weitererzählt, was man ihm sagt.\n\nSie dreht ihren Becher am Stiel und sieht mich über ihn hinweg an. Ich öffne den Mund. Die Musikanten setzen wieder ein, und was immer ich gesagt hätte, geht unter die Trommel."
 latria_sexual_frustration_flavor.1313.a: "Es laut genug sagen, um gehört zu werden."
 latria_sexual_frustration_flavor.1313.b: "Die Zunge hüten und den Wein sein Werk tun lassen."
 latria_sexual_frustration_flavor.1313.c: "Mich der Person neben mir zuwenden und ein Spiel daraus machen."

 latria_sexual_frustration_flavor.1314.t: "Das erste Wort"
 latria_sexual_frustration_flavor.1314.desc: "Ich habe lange genug auf dem kalten Stein gekniet, dass die Platten sich in meine Schienbeine geprägt haben, und die Worte haben aufgehört, Worte zu sein. Mein Sinn geht immer wieder zurück zu einem Mund, an den ich mich in diesem Gebäude nicht erinnern dürfte, an die Art, wie er sich öffnete, an den Laut, der aus ihm kam.\n\nWer mich führt, wartet am Pult mit der Geduld von jemandem, der jede Beichte gehört hat, die es gibt. Ich könnte es sagen. Das Sagen wäre eine Tür, die ich nicht wieder schließen kann, und mein Leib will diese Tür offen, heute Nacht, mit der Lampe noch brennend.\n\nIch komme bis zum ersten Wort. Die Kerze zwischen uns neigt sich in einem Zug, und ich sehe zu, wie das Wachs über das Eisen läuft und dort hart wird."
 latria_sexual_frustration_flavor.1314.a: "Es sagen und mich vom Tempel richten lassen."
 latria_sexual_frustration_flavor.1314.b: "Die Beichte behalten und die Buße nehmen."
 latria_sexual_frustration_flavor.1314.c: "Um ein Buch bitten und lesen, bis das Zittern aufhört."
 latria_sexual_frustration_flavor.1314.d: "Die Nachtwache bis zum Morgen halten."

 latria_sexual_frustration_flavor.1315.t: "Erlengestrüpp"
 latria_sexual_frustration_flavor.1315.desc: "Die Jagd hat sich verstreut, und ich bin einem Eber nachgegangen, der nie da war. Die Person, mit der ich allein sein wollte, findet mich im Erlengestrüpp mit offenen Beinkleidern und der Hand an mir und wendet sich nicht ab.\n\nSie kniet in den nassen Blättern nieder. Ich habe eine Hand in ihrem Haar und die andere an einem Stamm gestützt, und die Hörner klingen irgendwo im Osten, nah genug, dass wir es nicht sollten. Keine von uns hört auf. Sie nimmt mich in den Mund, und ich muss in die Innenseite meiner Wange beißen, um still zu sein.\n\nDanach sind meine Knie verdreckt, und ein Blatt klebt an meinem Schenkel. Sie wischt sich den Mund mit dem Rücken ihres Handgelenks und sagt, der Eber sei nach Norden gegangen."
 latria_sexual_frustration_flavor.1315.a: "Die Jagd ohne mich weitergehen lassen."
 latria_sexual_frustration_flavor.1315.b: "Wieder in den Sattel steigen und meinen Platz verdienen."
 latria_sexual_frustration_flavor.1315.c: "Den Boden lesen und den Spuren folgen."

 latria_sexual_frustration_flavor.1316.t: "Das schiefe Siegel"
 latria_sexual_frustration_flavor.1316.desc: "Der Rat sitzt seit einer Stunde an derselben Bittschrift, und ich habe nichts unterschrieben. Unter dem Tisch liegen meine Hände in meinem Schoß, und ich denke an die letzte Nacht des Feldzugs, an das Zelt, an die Person, die ohne Klopfen hereinkam und nicht ging, bis die Wache wechselte.\n\nWer meine Kanzlei führt, fragt, ob ich zustimme. Ich sage, ich täte es, und habe keine Ahnung, wozu ich zugestimmt habe. Das Siegel ist warm von meinem Ring. Ich drücke es ins Wachs, und das Zeichen kommt schief heraus, die Buchstaben an einem Rand gedoppelt.\n\nSie ziehen mit ihren Papieren ab. Ich bleibe in dem Stuhl mit dem schiefen Siegel vor mir und dem Geruch fremder Kerzen in der Kammer."
 latria_sexual_frustration_flavor.1316.a: "Nach der Person schicken, an die ich denke, Siegel und alles."
 latria_sexual_frustration_flavor.1316.b: "Das Siegel hinlegen und zu den Bittschriften zurückkehren."
 latria_sexual_frustration_flavor.1316.c: "Den Rat zurückrufen und die Arbeit beenden."

 latria_sexual_frustration_flavor.1317.t: "Eine Zeile am Rand"
 latria_sexual_frustration_flavor.1317.desc: "Der Prüfungssaal ist gekehrt und still, und ich bin allein mit den Kommentaren. Die Zeichen wollen nicht stillhalten. Ich habe dieselbe Zeile über Zurückhaltung viermal gelesen, und jedes Mal handelte sie von einem Paar Hände, die ich zu spät losließ, in einem Gang, mit einer Lampe, die kam.\n\nIn meiner eigenen Hand habe ich an den Rand eine Verszeile geschrieben, die überhaupt kein Kommentar ist. Sähe der Mensch, der mich prüft, sie, wüsste er, wofür sie ist, und für wen. Ich könnte die Seite verbrennen. Das Glutbecken ist drei Schritte entfernt, und die Kohlen sind noch rot.\n\nIch schreibe die Zeile noch einmal ab, sorgfältiger, und der Pinsel zittert beim letzten Strich."
 latria_sexual_frustration_flavor.1317.a: "Die Verse abschreiben und lesen lassen."
 latria_sexual_frustration_flavor.1317.b: "Das Buch schließen und auf der Matte schlafen."
 latria_sexual_frustration_flavor.1317.c: "Zu den Kommentaren zurückkehren und von vorn beginnen."
 latria_sexual_frustration_flavor.1317.d: "Die Verse nach der Weise setzen, die die Höflinge singen."

 latria_sexual_frustration_flavor.1318.t: "Zwei Becher im Hof"
 latria_sexual_frustration_flavor.1318.desc: "Das Festmahl hat sich in den Hof geleert, und die Person, die ich am längsten kenne, ist mir mit zwei Bechern gefolgt. Ich habe es niemandem gesagt, keinem geistlichen Menschen, keinem Diener, nicht der Person, um die es geht. Heute Nacht hat der Wein das Nicht-Sagen schwer gemacht, so wie ein voller Becher schwer ist.\n\nIch könnte es in ihre Hände legen und sie einen Teil davon tragen lassen. Sie würde nicht lachen. Sie würde es auch nicht vergessen, und jedes Mal, wenn sie mich über eine Halle hinweg ansieht, wäre dies zwischen uns, ein Ding mit einem Namen.\n\nSie reicht mir einen Becher und wartet, und der Brunnen läuft hinter ihr weiter. Ich trinke ihn aus, und das Eis knackt und setzt sich."
 latria_sexual_frustration_flavor.1318.a: "Es laut sagen und es sie behalten lassen."
 latria_sexual_frustration_flavor.1318.b: "Es für heute Nacht verschwören und es meinen."
 latria_sexual_frustration_flavor.1318.c: "Ihr vorlesen, bis sich der Hof leert."

 latria_sexual_frustration_flavor.1319.t: "Die Gartenmauer"
 latria_sexual_frustration_flavor.1319.desc: "Sie hat den Rücken an der Gartenmauer, die Röcke über die Hüften hochgeschoben, und meine Hand ist zwischen ihren Beinen, wo jeder, der den Pfad geht, es sehen könnte. Sie ist schon feucht. Sie ist es seit dem Gang.\n\nIch bekomme zwei Finger in sie, und sie fängt mein Handgelenk und hält mich dort, härter, die Stirn an meiner Schulter. Ihr Atem geht zerfasert. Auf der anderen Seite der Mauer arbeitet noch jemand im Garten, die Klinge eines Spatens klingt auf Steinen.\n\nSie zittert, und ihre Nägel schließen sich auf meinem Arm. Als sie stehen kann, streicht sie die Röcke hinunter und sagt meinen Namen einmal, leise, wie eine Frage, die sie schon beantwortet hat."
 latria_sexual_frustration_flavor.1319.a: "Bei ihr bleiben, bis sie gehen kann."
 latria_sexual_frustration_flavor.1319.b: "Meine Hand zurücknehmen und ihr einen guten Abend wünschen."
 latria_sexual_frustration_flavor.1319.c: "Den langen Weg um die Mauer allein gehen."

 latria_sexual_frustration_flavor.1320.t: "Ein Verzeichnis"
 latria_sexual_frustration_flavor.1320.desc: "Ich kam in den Tempel, um es loszuwerden, und stattdessen knie ich und verzeichne es: den Geruch eines bestimmten Halses, den Laut, den eine bestimmte Person macht, das genaue Gewicht eines Leibes an meinem in einer Tür, eine Hand flach am Rahmen.\n\nWer mich führt, ist wach und liest. Ich könnte um eine Buße bitten, und sie gäbe mir eine, und ich täte sie, und in der dritten Nacht wäre ich wieder auf diesem Stein mit derselben Liste, länger.\n\nIch bitte stattdessen um ein Buch. Sie gibt mir eines ohne ein Wort, die Stelle mit dem Daumen markierend, und ich halte es offen und lese keine Zeile."
 latria_sexual_frustration_flavor.1320.a: "Alles benennen und den Tempel antworten lassen."
 latria_sexual_frustration_flavor.1320.b: "Um die Buße bitten und meine Liste behalten."
 latria_sexual_frustration_flavor.1320.c: "Zuhören, was sie mir zu sagen bereit ist."

 latria_sexual_frustration_flavor.1321.t: "Drei Wochen auf der Straße"
 latria_sexual_frustration_flavor.1321.desc: "Wir sind drei Wochen auf der Straße, und ich bin seit der letzten Stadt mit niemandem allein gewesen. Mein Pferd ist abgesattelt, das Feuer niedrig, und die anderen schlafen in ihren Mänteln, eine Armlänge von mir entfernt, nah genug, dass ich einen von ihnen mit den Zähnen knirschen höre.\n\nIch liege mit der Hand in meinem Hemd und dem eigenen Knöchel zwischen den Zähnen und lausche, wie die Pferde sich verlagern und die Stiefel der Wache in den Blättern. Es dauert lange, und als es getan ist, bin ich nicht befriedigt, nur müde, und das Verlangen ist unter der Müdigkeit noch da.\n\nDie Wache kommt am Feuer vorbei zurück und sieht mich nicht an. Ich ziehe meinen Mantel hoch und sehe zu, wie die Glut grau wird."
 latria_sexual_frustration_flavor.1321.a: "Nehmen, was die Nacht erlaubt, und schlafen."
 latria_sexual_frustration_flavor.1321.b: "Aufstehen und meine Wache übernehmen."
 latria_sexual_frustration_flavor.1321.c: "Allein üben, bis meine Arme zittern."

 latria_sexual_frustration_flavor.1322.t: "Der Becher der gesandten Person"
 latria_sexual_frustration_flavor.1322.desc: "Die Tafel der Gesandtschaft ist für zwölf gedeckt, und ich sitze neben der gesandten Person, deren Volk eine Sitte der Gastfreundschaft hat, an die ich seit den Vorstellungen denke, durch den Fisch hindurch, durch den zweiten Gang.\n\nSie füllt meinen Becher selbst nach, was wer ihren Haushalt führt, nicht gefällt. Sagte ich hier das Falsche, stünde es mit dem nächsten Schiff in einem Bericht, in meinem Namen, in einer Hand, die nicht meine ist. Sagte ich das Richtige, stünde es auch in einem Bericht und würde in einem Saal vorgelesen, den ich nie betreten werde.\n\nSie stellt eine Frage über unsere Hochzeitssitten. Ich antworte schlecht. Die Kerze ist bis zum Halter heruntergebrannt, und keine von uns hat nach einer neuen gerufen."
 latria_sexual_frustration_flavor.1322.a: "Ihr so antworten, wie ihre Sitte es erlaubt."
 latria_sexual_frustration_flavor.1322.b: "Eine gute Nacht wünschen und gehen."
 latria_sexual_frustration_flavor.1322.c: "Das Gespräch auf den Vertrag lenken und es dort halten."

 latria_sexual_frustration_flavor.1323.t: "Der Chor auf der Empore"
 latria_sexual_frustration_flavor.1323.desc: "Der Chor übt auf der Empore, und ich soll die Harmonie hören und nicht den Mund der Person, die ihn führt, die Art, wie sie die dritte Zeile formt.\n\nIch bin dazu übergegangen, früh zu kommen und spät zu gehen. Das Singen tut der Enge in meiner Brust etwas, das Gebet nicht tut, und ich weiß, wofür es einsteht. Wer mich führt, hat die Stunde bemerkt, die ich halte, und nichts dazu gesagt, was schlimmer ist als ein Verweis, denn es bedeutet, dass sie wartet.\n\nDie letzte Note stirbt oben im Gewölbe. Ich bleibe in der Bank mit den Händen flach auf den Knien, bis jemand mit den Schlüsseln kommt."
 latria_sexual_frustration_flavor.1323.a: "Mit ihnen singen und es den Klang tragen lassen."
 latria_sexual_frustration_flavor.1323.b: "Die Regel halten und vor der letzten Strophe gehen."
 latria_sexual_frustration_flavor.1323.c: "Die Vertonung stattdessen mit meiner Führung studieren."

 latria_sexual_frustration_flavor.1324.t: "Die Morgenglocke"
 latria_sexual_frustration_flavor.1324.desc: "Ich erwache in den Laken verwickelt, das Ganze noch auf mir, das Nachtgewand bis unter die Arme hoch, und meine Hand zwischen meinen Beinen, ehe ich richtig wach bin. Der Traum geht, und ich jage ihm nach, die Hüften hebend, und es kümmert mich nicht, wer im nächsten Zimmer ist oder zu welcher Stunde die Glocke ist.\n\nEs kommt in einem Schwall, der meinen Schenkel beben lässt. Ich liege da mit den Fingern noch in mir, mein Atem laut in der Stille, und das Laken ist unter mir durchnässt, schon kalt, wo die Luft es erreicht.\n\nDie Glocke zum Morgenamt setzt ein. Ich ziehe das nasse Laken frei und lege es in die Schüssel, und das Wasser wird trüb."
 latria_sexual_frustration_flavor.1324.a: "Beenden, waschen und auf die Glocke antworten."
 latria_sexual_frustration_flavor.1324.b: "Das Laken herunterreißen und ohne Waschen gehen."
 latria_sexual_frustration_flavor.1324.c: "Am Brett sitzen, bis meine Hände ruhig sind."

 latria_sexual_frustration_flavor.1325.t: "Die Tür"
 latria_sexual_frustration_flavor.1325.desc: "In der Ecke geht ein Spiel, und ich habe drei Runden verloren, weil ich immer zur Tür sehe. Die Person, auf die ich warte, ist spät, und jeder in dieser Halle weiß, wer ich bin und mit wem ich verheiratet bin und wer von ihnen mir zusieht.\n\nIch könnte auf die Bank steigen und es sagen. Der Raum würde still werden, wie Räume still werden, und bis zum Morgen wäre es in jeder Halle von hier bis zur Küste, mit meinem Namen daran und dem Namen meines Hauses danach, und die beiden Namen würden nicht wieder getrennt.\n\nDie Tür geht auf. Es ist ein Diener mit mehr Wein. Ich halte meinen Becher hin, und meine Hand ist ruhig, was schlimmer ist."
 latria_sexual_frustration_flavor.1325.a: "Aufstehen und es der ganzen Halle sagen."
 latria_sexual_frustration_flavor.1325.b: "Sitzen bleiben und das Spiel weitergehen lassen."
 latria_sexual_frustration_flavor.1325.c: "Die Person suchen, die mir nahesteht, und stattdessen bei ihr sitzen."

 latria_sexual_frustration_flavor.1326.t: "Die Konten"
 latria_sexual_frustration_flavor.1326.desc: "Wer den Haushalt führt, hat die Konten, die Karte und die Liste meiner Pflichten ausgelegt, und ich habe nichts davon gelesen. Ich denke an eine Tür in einer Stadt, durch die ich im Frühling kam, und an die Art, wie jemand meinen Namen in der Dunkelheit dahinter sagte, zweimal, ehe sich der Riegel hob.\n\nEs gibt sehr viel zu tun, und ich bin es, der es tun muss. Ich tauche die Feder ein und schreibe die erste Ziffer, und sie ist falsch, und ich streiche sie so hart durch, dass die Spitze springt und Tinte über die Spalte geht.\n\nIch schneide die Feder zurecht und beginne wieder. Draußen am Fenster übt die Besatzung, und das Rufen hält die Zeit."
 latria_sexual_frustration_flavor.1326.a: "Die Konten liegen lassen und nach jener Stadt schicken."
 latria_sexual_frustration_flavor.1326.b: "Die Feder hinlegen und das Hauptbuch aufnehmen."
 latria_sexual_frustration_flavor.1326.c: "Die Liste durcharbeiten, bis die Kerzen flackern."

 latria_sexual_frustration_flavor.1327.t: "Die Anhöhe"
 latria_sexual_frustration_flavor.1327.desc: "Wir reiten seit dem Morgengrauen, und das Gras ist in jede Richtung leer, kein Baum, keine Person im Sattel, nichts bis an den Rand des Himmels. Mein Leib klagt seit dem zweiten Tag im Sattel, und das Reiten selbst hat nichts getan, ihn zu beruhigen; es hat es nur schlimmer gemacht.\n\nIch halte oben auf der Anhöhe an, bekomme meine Hand in die Beinkleider und beende es mit ein paar harten Strichen, den Wind im Gesicht und niemanden in Sicht, das Pferd die ganze Zeit unter mir verlagernd.\n\nIch knote die Schnur zu und reite zu ihnen hinunter. Meine Verwandten fragen, warum ich lächle, und ich sage, das Pferd sei ein gutes."
 latria_sexual_frustration_flavor.1327.a: "Den Augenblick nehmen, den die Steppe mir gibt."
 latria_sexual_frustration_flavor.1327.b: "Weitreiten und es aus dem Sinn legen."
 latria_sexual_frustration_flavor.1327.c: "Den Falken fliegen lassen, bis meine Arme müde sind."

 latria_sexual_frustration_flavor.1328.t: "Nachtwache"
 latria_sexual_frustration_flavor.1328.desc: "Ich bin seit dem Amt im Tempel und bin noch hier. Die Lampe ist zweimal gefüllt worden, und das Öl riecht nach der billigen Presse. Meine Knie sind vom Schmerz zu einer Art Taubheit übergegangen, und das Verlangen ist nirgends hingegangen; es hat sich eingenistet und es sich bequem gemacht.\n\nDie Nachtwache soll einen Menschen leeren. Sie hat dem Verlangen stattdessen Raum gegeben, so wie eine dunkle Kammer jedem Ding, das darin steht, eine Gestalt gibt. Ich könnte gehen. Die Tür ist nicht verschlossen, und die Stadt ist nicht weit.\n\nIch beginne den Psalm wieder von vorn. Meine Stimme kommt ruhig heraus, und ich hasse sie ein wenig dafür."
 latria_sexual_frustration_flavor.1328.a: "Die Nachtwache brechen und in die Stadt hinausgehen."
 latria_sexual_frustration_flavor.1328.b: "Die Nachtwache halten, bis der Himmel grau wird."
 latria_sexual_frustration_flavor.1328.c: "Das Psalterium bis zum Ende lesen."

 latria_sexual_frustration_flavor.1329.t: "Vier Zeilen"
 latria_sexual_frustration_flavor.1329.desc: "Ich bin im Nachtgewand am Fenster, und auf dem Sims liegt ein Brief, den ich geschrieben und nicht gesandt habe. Vier Zeilen. Die letzte sagt, was ich will, in Worten, die ich bei Tageslicht nicht gebrauchen würde, und die Tinte ist trocken, und das Siegel ist ungebrochen.\n\nIch könnte ihn dem Diener an der Tür geben. Ich könnte ihn auch verbrennen, und ich habe drei andere verbrannt, und die Asche ist noch im Glutbecken. Mein Leib ist am Verbrennen nicht interessiert. Er will die Antwort, die nach dem Geben kommt.\n\nDie Kerze ist auf einen Stumpf heruntergebrannt, und das Wachs ist über den Rand gelaufen. Ich lese die letzte Zeile wieder, und das Papier zittert in meiner Hand."
 latria_sexual_frustration_flavor.1329.a: "Den Brief dem Diener geben."
 latria_sexual_frustration_flavor.1329.b: "Ihn ins Glutbecken legen und zu Bett gehen."
 latria_sexual_frustration_flavor.1329.c: "Am Fenster sitzen, bis der Stumpf ausgeht."

 latria_sexual_frustration_flavor.1330.t: "Die Grenzklausel"
 latria_sexual_frustration_flavor.1330.desc: "Das Arbeitszimmer meiner Lehrperson riecht nach Staub und kalter Tinte, und ich habe kein Wort des Vertrags aufgenommen. Sie erklärt die Klausel über die Grenze, und ich sehe ihre Hände an, die Tinte an der Seite ihres Fingers, die Art, wie sie die Seite niederhält.\n\nSie ist im Alter, in dem man erwachsene Kinder hat, und doppelt so sorgfältig, und es ist nichts dabei, und es muss nichts dabei sein. Das Verlangen fragt nicht um Erlaubnis. Es sitzt in mir, während sie die Seite wendet und die nächste Klausel mit dem Nagel findet.\n\nSie fragt, ob ich verstanden habe. Ich sage ja. Sie sieht mich einen Moment länger an, als die Frage braucht, und geht dann zur Seite zurück."
 latria_sexual_frustration_flavor.1330.a: "Stattdessen ein Gedicht über die Grenze schreiben."
 latria_sexual_frustration_flavor.1330.b: "Sie um eine Beichte bitten."
 latria_sexual_frustration_flavor.1330.c: "Die Klausel ihr Wort für Wort zurücksagen."

 latria_sexual_frustration_flavor.1331.t: "Die langsame Stunde"
 latria_sexual_frustration_flavor.1331.desc: "Das Haus schläft, und ich habe es nicht getan, seit einer Stunde nicht. Mein Nachtgewand ist über meine Hüften hoch, und meine Finger haben die Nässe meiner selbst gefunden, ohne dass ich es entschieden hätte. Ich halte sie dort und lasse den Gedanken kommen, der seit dem Gang kreist, an die Person, die sich hineinbeugte, um meinen Kragen zu richten, und danach nicht zurücktrat.\n\nIch drücke und kreise, so wie mein Leib es mich gelehrt hat, langsam, dann nicht langsam, meine andere Hand flach am Kopfbrett, damit es nicht an die Wand schlägt. Unten ist eine Gesindetür und eine Treppe, die klagt. Ich höre nicht auf. Mein Atem geht zerfasert, und ich drehe das Gesicht ins Kissen, um den Laut zu schlucken.\n\nEs bricht, und ich liege mit den Fingern noch an mir, der Puls geht unter ihnen weiter. Die Treppe klagt noch einmal und setzt sich. Ich ziehe das Nachtgewand hinunter, und der Stoff ist feucht und klebt."
 latria_sexual_frustration_flavor.1331.a: "Es beenden lassen und mich vor der Glocke ankleiden."
 latria_sexual_frustration_flavor.1331.b: "Meine Hand fortnehmen und still liegen."
 latria_sexual_frustration_flavor.1331.c: "Waschen und bei dem Schmerz sitzen, bis er abstumpft."

 latria_sexual_frustration_flavor.1332.t: "Das kalte Schiff"
 latria_sexual_frustration_flavor.1332.desc: "Ich kam in den Tempel, um mich zu leeren, und kniete auf dem kalten Stein, bis sich das Verlangen nur tiefer setzte. Es hat jetzt ein Gesicht, die Person, der ich beim Festmahl die Beichte ablegte, die Art, wie sie zuhörte, den Kopf geneigt, die Art, wie sich ihr Daumen am Becher bewegte. Meine Hand ist unter meinem Gewand, und in der Dunkelheit des Seitenschiffs kann niemand es sehen.\n\nIch halte die Augen auf die Altarlampen und lasse meine Finger arbeiten, langsam, den Kiefer angespannt. Irgendwo hinter dem Schirm öffnet sich eine Tür, und die Kinder, die am Altar dienen, kommen zum Nachtamt herein, ihre Füße auf den Platten. Ich sollte aufhören. Meine Hand hört nicht auf. Ich drücke die Stirn gegen meine gefalteten Hände und atme durch die Zähne.\n\nEs geht vorüber und lässt mich hohl und zitternd zurück. Die Kinder beginnen den Psalm. Ich bleibe knien, bis meine Beine taub werden und die Lampe das Einzige ist, was ich ansehen kann."
 latria_sexual_frustration_flavor.1332.a: "Es im Beichtstuhl benennen und die Buße nehmen."
 latria_sexual_frustration_flavor.1332.b: "Die Nachtwache halten, bis der Himmel grau wird."
 latria_sexual_frustration_flavor.1332.c: "Das Psalterium bis zum Ende lesen."

 latria_sexual_frustration_flavor.1333.t: "Die grüne Mulde"
 latria_sexual_frustration_flavor.1333.desc: "Ich habe die Person, die ich wollte, von der Jagd fort in eine Mulde gezogen, wo das Licht grün durch die Blätter kommt. Meine Beinkleider sind offen, und ihre Hand ist an mir, und meine Hand ist unter ihren Röcken, und keine von uns tut, als ginge es um das Wild. Sie ist schon feucht. Sie ist es, seit ich am Übergang ihr Handgelenk fing.\n\nIch bekomme meine Finger in sie, und sie keucht und bedeckt meinen Mund mit ihrem, hart, die freie Hand in meinem Kragen geballt. Die Hörner klingen durch die Bäume, die Jagd wendet irgendwo nah. Wir hören nicht auf. Sie wiegt sich an meiner Hand, und ihr Atem kommt in kurzen Stößen an meine Wange.\n\nSie zittert und wird still, mein Handgelenk haltend. Die Hörner verklingen im Osten. Sie richtet mit zitternden Händen ihre Röcke, und ein Blatt fällt aus ihrem Haar."
 latria_sexual_frustration_flavor.1333.a: "Die Jagd ohne uns weitergehen lassen."
 latria_sexual_frustration_flavor.1333.b: "Wieder in den Sattel steigen und meinen Platz verdienen."
 latria_sexual_frustration_flavor.1333.c: "Den langen Weg zurück gehen und mich kühlen."

 latria_sexual_frustration_flavor.1334.t: "Der Rand des Vertrags"
 latria_sexual_frustration_flavor.1334.desc: "Das Arbeitszimmer ist kalt, und der Vertrag liegt offen, und ich habe dieselbe Klausel dreimal gelesen. Die gesandte Person, die ihn brachte, ist fort, doch die Erinnerung ist es nicht, die Stunde im Gang, als ich sie an die Wand hatte, meine Hand unter ihrer Tunika, ihr Mund offen an meiner Schulter, beide auf einen Schritt lauschend.\n\nMeine Hand ist unter dem Tisch in meinen Schoß gewandert. Ich zwinge mich, sie fortzunehmen, und drücke sie flach auf die Seite. Die Tinte ist trocken unter meiner Handfläche. Schriebe ich, was ich denke, an den Rand, würde der Schreiber es sauber abschreiben und bis zum Morgen herumreichen.\n\nIch tauche die Feder ein und schreibe die Klausel wieder, richtig, und meine Hand ist beim letzten Wort nicht ruhig. Die Kerze flackert, und ich kürze den Docht."
 latria_sexual_frustration_flavor.1334.a: "Offen sagen, was ich von ihr will."
 latria_sexual_frustration_flavor.1334.b: "Ihr alles Gute wünschen und zurücktreten."
 latria_sexual_frustration_flavor.1334.c: "Das Brett aufstellen und spielen, bis meine Hände still sind."

 latria_sexual_frustration_flavor.1335.t: "Hinter dem Wandbehang"
 latria_sexual_frustration_flavor.1335.desc: "Das Festmahl ist laut, und die Musikanten sind zwischen zwei Weisen, und ich habe die Person, die ich den ganzen Abend beobachtet habe, hinter den Wandbehang gebracht, wohin das Licht nicht reicht. Meine Hand ist unter ihrem Kleid, ihr Rücken an der Wand, und sie beißt sich auf die eigene Lippe, um still zu sein. Meine andere Hand liegt über ihrem Mund, nicht hart, nur genug.\n\nDie Halle ist drei Fuß entfernt auf der anderen Seite des Stoffs. Ein Becher zerbricht, und jemand lacht. Sie bewegt sich an meinen Fingern, und ihre Augen schließen sich, und ich fühle das Zittern durch sie gehen, ihr Atem heiß und schnell an meiner Handfläche.\n\nSie sackt ein wenig, und ich halte sie. Jenseits des Wandbehangs setzen die Musikanten wieder ein. Sie streicht ihr Kleid glatt und schlüpft zuerst hinaus, und ich warte eine Weile, ehe ich folge."
 latria_sexual_frustration_flavor.1335.a: "Zurück hineinschlüpfen und meinen Platz nehmen."
 latria_sexual_frustration_flavor.1335.b: "Meinen Platz hinter dem Stoff noch einen Augenblick behalten."
 latria_sexual_frustration_flavor.1335.c: "Die Person suchen, die mir nahesteht, und stattdessen bei ihr sitzen."
