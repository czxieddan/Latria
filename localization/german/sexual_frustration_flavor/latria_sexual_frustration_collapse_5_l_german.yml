l_german:
 latria_collapse_no_relief_tt: "Die sexuelle Unterdrückung hat nicht nachgelassen."

 latria_sexual_frustration_flavor.1501.t: "Die Lampe brennt noch"
 latria_sexual_frustration_flavor.1501.desc.dead: "Der Dolch gleitet mir aus der Hand, und sein Aufschlag lässt die Schritte vor der Tür verstummen. Die Tür wird aufgestoßen; jemand hockt sich neben mich, ruft meinen Namen und wendet sich um, um Hilfe holen zu lassen. Die Lampe steht noch an ihrem Platz, doch das Gesicht vor mir kann ich nicht erkennen.\n\nIch möchte zu verstehen geben, dass ich hören kann; meine Lippen bewegen sich, doch kein Laut kommt heraus. Von all den Worten, die ich vorhin allein immer wieder durchging, fällt mir kein vollständiger Satz mehr ein. Jemand nimmt meine Hand und fragt, ob ich die Augen öffnen kann; ich kann nur auf die Tür dahinter starren.\n\nWeitere Schritte drängen ins Zimmer. Ich will den Kopf zum Geräusch wenden, doch die Gestalten an der Tür verschwimmen bereits, bis ich schließlich nicht einmal mehr das Lampenlicht erkenne."
 latria_sexual_frustration_flavor.1501.desc.survived: "Als ich erwache, hat man mir frische Nachtkleidung angezogen und meine Wunden sorgfältig verbunden. Die Person an meinem Bett sieht mich die Augen öffnen und ruft sofort jemanden vom Gefolge zurück, der gerade gehen wollte. Man erzählt mir, jemand habe den Lärm bemerkt und die Tür rechtzeitig geöffnet; den Dolch hat man inzwischen fortgenommen.\n\nIch versuche, mich aufzurichten, doch der Schmerz hält mich auf, noch bevor ich mich vom Kissen lösen kann. Die Decke wird um mich gelegt, und man fragt, ob ich Wasser möchte; ich nicke, blicke aber wieder zu dem nicht abgeschickten Brief auf dem Tisch. Die Blätter liegen noch immer aufeinander; auf dem obersten ist eine mehrfach geänderte Anrede zu sehen.\n\nEin Becher wird an meine Lippen geführt, und ich trinke nur einen einzigen Schluck. Die Person, die an meinem Bett wacht, bleibt und wartet, bis ich wieder ruhig liege, ehe sie den Becher behutsam abstellt."
 latria_sexual_frustration_flavor.1501.desc.severe: "Als ich wieder zu Bewusstsein komme, höre ich zuerst gedämpfte Stimmen neben dem Bett. Jemand fragt, ob solche Wunden überhaupt heilen können; nach kurzem Zögern folgt nur die Bitte, frische Tücher zu holen. Ich will mich umdrehen, um zu sehen, wer dort ist, doch schon die kleinste Bewegung schmerzt so sehr, dass ich kein Wort herausbringe.\n\nDer Dolch liegt nicht mehr in meiner Reichweite; selbst den kleinen Tisch neben dem Bett hat man weggerückt. Ich bitte um Hilfe beim Aufsetzen, doch neben mir wird nur das Kissen höhergelegt und mir geraten, vorerst liegen zu bleiben. Das Licht vor dem Fenster hat sich gewandelt, doch ich denke noch immer an die schlaflosen Nächte und den Antwortbrief, der nie kam.\n\nEine Hand greift herüber, um die Decken zu richten. Ich will darum bitten, langsamer vorzugehen, doch noch bevor ich ausgeredet habe, klammere ich mich an das Laken unter mir."
 latria_sexual_frustration_flavor.1501.a.dead: "Alles wird … dunkel …"
 latria_sexual_frustration_flavor.1501.a.survived: "Es tut weh …"
 latria_sexual_frustration_flavor.1501.a.severe: "Fasst mich nicht an … es tut weh …"

 latria_sexual_frustration_flavor.1502.t: "Ein leerer Becher"
 latria_sexual_frustration_flavor.1502.desc.dead: "Der Becher ist leer; zusammengesunken am Bett höre ich, wie die Tür aufgestoßen wird. Jemand ruft meinen Namen, sieht die Dinge auf dem Tisch und wendet sich um, um nach Hilfe zu rufen, ohne auch nur die Tür zu schließen. Auf dem Gang beginnt jemand zu laufen, und der Luftzug durch die offene Tür bewegt den unvollendeten Brief.\n\nIch weiß noch, dass der letzte Satz nur halb geschrieben ist und die Feder neben dem Blatt liegt. Jemand stützt mich an den Schultern, fragt, was ich getrunken habe, und bittet mich, noch ein wenig durchzuhalten. Ich blicke zum Tisch und möchte die ungesagten Worte ergänzen, doch meine Hand erreicht nicht einmal die Papierecke, die vor meinen Augen herabhängt.\n\nNeben mir ruft man weiter nach mir, doch die Stimme klingt immer ferner. Ich kann die Schrift auf dem Brief nicht mehr erkennen und auch keinen Laut zur Antwort geben."
 latria_sexual_frustration_flavor.1502.desc.survived: "Das Gift, das ich getrunken habe, hat mich nicht getötet. Als ich erwache, steht eine Schüssel mit frischem Wasser im Zimmer. Jemand wacht schon lange neben dem Bett, sieht mich die Augen öffnen, steht auf, um die anderen zu rufen, und fragt dann zu mir gewandt, ob ich das Zimmer noch erkenne.\n\nDen Becher hat man vom Tisch geräumt; der unvollendete Brief liegt unter einem Buch. Ich will danach greifen und merke erst dabei, wie schwer es mir fällt, mich auch nur zum Bettrand zu bewegen. Die Person an meinem Bett reicht mir Wasser, wartet, bis ich ausgetrunken habe, und fragt, wem der Brief übergeben werden soll; ich betrachte die halb sichtbare Zeile und schweige.\n\nDraußen vor dem Fenster sind bereits die ersten Menschen unterwegs. Ich denke daran, was ich um diese Stunde sonst zu tun hätte, kann mich aber nur ans Kissen lehnen und zuhören, wie Bedienstete vor der Tür die Wartenden fortschicken."
 latria_sexual_frustration_flavor.1502.desc.severe: "Das Gift hat mir nicht das Leben genommen, doch ich kann noch immer nicht wie früher ohne Hilfe aufstehen. Jemand bringt das Frühstück und legt frische Kleidung ans Bett; als ich danach greife, merke ich, dass ich selbst meine vertraute Schale nicht mehr ruhig halten kann.\n\nJemand vom Gefolge richtet meine Ärmel und reicht mir einen Bissen nach dem anderen. Ich will fragen, wie lange ich schon hier liege, muss aber mitten im Satz innehalten und mich ausruhen. Auf dem Tisch haben sich neue Briefe gesammelt; als man anbietet, sie vorzulesen, bitte ich zunächst darum, nach dem vertrauten Namen zu sehen.\n\nDie Briefe werden einzeln durchgesehen, dann folgt ein leichtes Kopfschütteln. Ich betrachte den Stapel Briefe und hebe die Hand, um die Schale etwas wegzuschieben, muss aber selbst dafür warten, bis sich jemand zu mir hinunterbeugt."
 latria_sexual_frustration_flavor.1502.a.dead: "Ich … kann nicht sprechen …"
 latria_sexual_frustration_flavor.1502.a.survived: "So elend … etwas Wasser …"
 latria_sexual_frustration_flavor.1502.a.severe: "Ich kann nicht einmal die Hand heben …"

 latria_sexual_frustration_flavor.1503.t: "Am Flussufer"
 latria_sexual_frustration_flavor.1503.desc.dead: "Ich kann das Flussufer nicht mehr sehen; ich höre nur noch Rufe aus der Ferne. Eben konnte ich noch meinen Namen heraushören, doch jetzt bleiben nur abgerissene Laute. Ich versuche, in diese Richtung zu schauen, doch das schwankende Licht vor meinen Augen lässt mich die Bäume am Ufer nicht erkennen.\n\nAls ich meine Unterkunft verließ, brannte die Lampe wohl noch, und das Buch lag offen auf dem Tisch. So lange hatte ich bei derselben Seite verweilt und vor dem Hinausgehen doch das Lesebändchen nicht zurechtgelegt. Jemand wird zum Aufräumen kommen und fragen, wo ich geblieben bin; ich denke an das vertraute Gesicht und möchte sagen, dass ich hier bin.\n\nEin weiterer Ruf erreicht mich, doch ich kann nicht antworten. Das Licht vor meinen Augen wird dunkler, und selbst die Erinnerung an das Zimmer mit der brennenden Lampe verschwimmt."
 latria_sexual_frustration_flavor.1503.desc.survived: "Man zieht mich aus dem Fluss; als ich erwache, liege ich zusammengekauert am Ufer, und jemand wickelt mich in einen Umhang. Die Person neben mir sieht mich die Augen öffnen, winkt hastig in die Ferne und hockt sich dann hin, um zu fragen, ob ich alles deutlich höre. Flusswasser tropft noch von meiner Kleidung, und mir ist zu kalt, um zu antworten.\n\nMan sagt mir, dass bereits jemand eine Trage holt, und rät mir, noch nicht aufzustehen. Ich blicke auf den Pfad zurück zu meiner Unterkunft und denke an den Satz, den ich auf meinem einsamen Weg hierher immer wieder erwogen habe. Auf die Frage, wen man benachrichtigen soll, nenne ich einen Namen und wiederhole ihn leise, aus Sorge, man habe ihn nicht gehört.\n\nDer Umhang wird wieder enger um mich gezogen. Jemand verspricht, meine Nachricht weiterzugeben; die Person, die bei mir bleibt, hält mich an der Schulter und wartet mit mir auf Schritte auf dem Pfad."
 latria_sexual_frustration_flavor.1503.desc.severe: "Davon, wie man mich ans Ufer trug, erinnere ich mich nur an eine Stimme, die zur raschen Rückkehr drängte. Als ich das nächste Mal erwache, hat man meine nassen Kleider gewechselt, und mehrere Menschen stehen am Bett. Ich will fragen, wie lange ich bewusstlos war, doch ein Hustenanfall unterbricht mich, noch bevor ich jemanden richtig ansprechen kann.\n\nNeben dem Bett spricht man leise von einer Lungenkrankheit und lässt das Fenster schließen. Das Tuch auf meiner Stirn wurde schon mehrmals gewechselt, doch ich weiß noch immer nicht, ob es Tag oder Nacht ist. In klaren Augenblicken blicke ich noch immer zur Tür und warte auf jemanden Vertrauten; dort steht aber nur jemand vom Gefolge mit Wasser und fragt leise, was ich brauche.\n\nIch schüttle den Kopf und versuche, mich am Kissen gestützt aufzusetzen. Kaum wird mir vom Bettrand aus eine helfende Hand gereicht, unterbricht der Husten erneut die Worte, die ich noch gar nicht ausgesprochen habe."
 latria_sexual_frustration_flavor.1503.a.dead: "So kalt …"
 latria_sexual_frustration_flavor.1503.a.survived: "Ich bin noch … am Leben?"
 latria_sexual_frustration_flavor.1503.a.severe: "Ich … bekomme keine Luft …"

 latria_sexual_frustration_flavor.1504.t: "Unterhalb der Klippe"
 latria_sexual_frustration_flavor.1504.desc.dead: "Ich liege unterhalb der Klippe und höre, wie die Suchenden auf dem Bergpfad rufen. Eine Stimme ruft meinen Namen, eine andere drängt dazu, weiter unten zu suchen, und lose Steine rollen in meiner Nähe vorbei. Ich will eine Hand heben, damit man mich sieht, doch sie bleibt an meiner Seite liegen und bewegt nicht einmal den Saum meiner Kleidung.\n\nDie Silhouette des Berges verdeckt fast den ganzen Himmel, und ich weiß nicht mehr, wie lange es her ist, dass ich meine Unterkunft verließ. Beim Hinausgehen fragte man mich, wann ich zurückkäme; ich nannte beiläufig eine Stunde, doch jetzt fällt mir meine Antwort nicht mehr ein. Die Schritte kommen näher; ich öffne den Mund, doch noch immer kommt kein Laut heraus.\n\nEndlich bleibt jemand in meiner Nähe stehen und beugt sich herab, um mich anzusprechen. Ich erkenne das Gesicht vor mir nicht mehr, nicht einmal das Stück Himmel, das noch über mir zu sehen ist."
 latria_sexual_frustration_flavor.1504.desc.survived: "Ich erwache unterhalb der Klippe; jemand hockt neben mir und ruft nach mir. Als ich reagiere, folgt ein Wink nach hinten, damit die anderen auf dem Bergpfad herunterkommen. Ich will gerade fragen, wo ich bin, als ich die Felswand über mir erkenne und nicht wage, noch einmal hinzusehen.\n\nDie Verletzungen vom Sturz lassen mich nicht aufstehen; selbst nach der kleinsten Bewegung muss ich innehalten und Atem schöpfen. Man bittet mich, auf die Trage zu warten, hebt meine in der Nähe liegende Oberkleidung auf und deckt mich damit zu. Ich betrachte den Verschluss und denke daran, wie ich ihn vor dem Hinausgehen im Spiegel richtete, während mich schon dieselbe unbeantwortete Einladung beschäftigte.\n\nDie Schritte kommen bei mir an, und mehrere Menschen besprechen leise, wie sie mich anheben sollen. Ich will mich umdrehen, um zu helfen, doch noch bevor ich mich bewege, schreie ich auf."
 latria_sexual_frustration_flavor.1504.desc.severe: "Ich erwache unterhalb der Klippe, von den Menschen umringt, die mir helfen wollen, doch niemand spricht zuerst. Ich erkenne jemanden und frage, ob wir nun zurückkehren sollten. Meine Oberkleidung wird über mich gebreitet; dann geht ein Blick zum Bergpfad, gefolgt von einem Ruf, sich mit der Trage zu beeilen.\n\nIch versuche aufzustehen, doch jemand hält mich fest und bittet mich, mich nicht zu bewegen. Ich blicke auf meine Beine; neben mir erklärt man zögernd, dass ich künftig wohl nicht mehr wie früher gehen könne. An dem Schuh neben mir klebt noch Schlamm; als ich ihn betrachte, denke ich an die Nächte, in denen ich auf dem Gang auf einen Antwortbrief wartete.\n\nJemand fragt, ob ich noch etwas brauche. Ich will darum bitten, mir den Schuh zu geben, frage aber stattdessen, ob in meiner Unterkunft Nachrichten eingetroffen sind; einen Augenblick lang antwortet niemand."
 latria_sexual_frustration_flavor.1504.a.dead: "Ich höre nichts mehr …"
 latria_sexual_frustration_flavor.1504.a.survived: "Ich kann mich nicht bewegen … es tut weh …"
 latria_sexual_frustration_flavor.1504.a.severe: "Meine Beine …"

 latria_sexual_frustration_flavor.1505.t: "Die aufgebrochene Tür"
 latria_sexual_frustration_flavor.1505.desc.dead: "Als die Tür zum Schlafgemach aufgebrochen wird, höre ich jemanden aufgeregt meinen Namen rufen. Licht vom Gang fällt ins Zimmer; mehrere Menschen drängen sich in der Tür, bis von vorn der Ruf kommt, Hilfe zu holen. Der Brief liegt noch neben dem Bett; ich möchte darauf aufmerksam machen, kann meinen Blick aber nicht mehr dorthin wenden.\n\nJemand kommt näher, und die Stimme ist so vertraut, dass ich antworten möchte. Ich verstehe die Worte genau, bringe aber selbst nichts heraus; ich sehe nur den Mund vor mir, der sich unablässig bewegt. Von draußen stellt jemand eine Frage, doch die Person, die sich über mich beugt, wendet sich nicht um und wartet weiter auf die kleinste Reaktion.\n\nIch möchte das Gesicht noch einmal erkennen, doch vor meinen Augen wird es immer dunkler. Das Licht in der Tür verschwindet, und dann kann ich auch die Rufe nicht mehr hören."
 latria_sexual_frustration_flavor.1505.desc.survived: "Die Tür zum Schlafgemach wurde aufgebrochen, und Hilfe kam noch rechtzeitig. Vom Bett aus sehe ich den verbogenen Türriegel; jemand vom Gefolge hat einen Stuhl gebracht, um draußen zu wachen. Jemand richtet mein Kissen und fragt, ob ich sprechen kann; ich bringe nur eine heisere Antwort hervor.\n\nDas Seil ist verschwunden, und auch der Brief neben dem Bett liegt nun woanders. Ich will mich umdrehen, um danach zu suchen, doch meine Verletzungen halten mich mitten in der Bewegung auf. Die Person, die mich versorgt, folgt meinem Blick und legt den Brief so hin, dass ich ihn sehen kann; von dem unvollendeten Namen am Ende kann ich den Blick noch immer nicht lösen.\n\nIch hebe die Hand, um darum zu bitten, vorerst keine Fragen zu stellen. Auf mein Zeichen folgt ein Nicken; das Wasser wird nähergestellt, und erst als ich mich etwas erholt habe, wird die Decke über mich gelegt."
 latria_sexual_frustration_flavor.1505.desc.severe: "Jemand am Bett ruft meinen Namen; ich weiß, dass eine Antwort erwartet wird, verstehe aber nicht, was ich sagen soll. Die Einrichtung des Schlafgemachs kommt mir bekannt vor, doch der Stuhl am Fenster scheint nun woanders zu stehen. Ich starre darauf, bis jemand meinen Ärmel zurechtrückt.\n\nJemand wäscht mich, wechselt meine Kleidung und bringt dann Essen. Ich sehe zu, wie sich der Löffel nähert, und denke erst daran, den Mund zu öffnen, als man mich daran erinnert. Jemand erwähnt den Brief, und eine andere Person wirft einen Blick auf die Truhe neben dem Bett. Auch ich blicke dorthin, doch gerade als ich etwas fragen will, habe ich schon vergessen, was es war.\n\nDer Deckel der Truhe ist bereits geschlossen. Die Person an meinem Bett ruft erneut meinen Namen; diesmal wende ich den Kopf und sehe, wie die Hände vor mir innehalten."
 latria_sexual_frustration_flavor.1505.a.dead: "Ich …"
 latria_sexual_frustration_flavor.1505.a.survived: "Lasst mich … Atem holen …"
 latria_sexual_frustration_flavor.1505.a.severe: "Ruft jemand … nach mir?"
