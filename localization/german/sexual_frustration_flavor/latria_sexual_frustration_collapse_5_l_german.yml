l_german:
 latria_collapse_no_relief_tt: "Die sexuelle Unterdrückung hat nicht nachgelassen."

 latria_sexual_frustration_flavor.1501.t: "Die Lampe brennt noch"
 latria_sexual_frustration_flavor.1501.desc.dead: "Ich kann die Schritte draußen nicht mehr unterscheiden. Der Dolch gleitet mir aus der Hand. Jemand öffnet die Tür und ruft immer wieder meinen Namen. Ich versuche zu antworten, doch alles wird dunkel, bis ich die Lampe nicht mehr sehe."
 latria_sexual_frustration_flavor.1501.desc.survived: "Der Dolch hat mein Leben nicht beendet. Jemand hörte den Lärm und eilte herein, um mich zu retten. Ich liege im Nachtgewand im Bett, meine Wunden sind verbunden, und dieselbe unerfüllte Sehnsucht quält mich noch immer."
 latria_sexual_frustration_flavor.1501.desc.severe: "Als ich wieder zu mir komme, ist der Dolch verschwunden. Jemand sitzt am Bett und spricht leise über die Schwere meiner Wunden. Ich kann mich nicht einmal aufsetzen, doch die Qual, die mich hierhergebracht hat, lässt nicht nach."
 latria_sexual_frustration_flavor.1501.a.dead: "Alles wird … dunkel …"
 latria_sexual_frustration_flavor.1501.a.survived: "Es tut weh …"
 latria_sexual_frustration_flavor.1501.a.severe: "Fasst mich nicht an … es tut weh …"

 latria_sexual_frustration_flavor.1502.t: "Ein leerer Becher"
 latria_sexual_frustration_flavor.1502.desc.dead: "Der Becher ist leer. Neben dem Bett höre ich jemanden eintreten und dringend nach Hilfe rufen. Mein Brief ist noch nicht fertig, doch ich kann die Feder nicht mehr halten. Die Stimmen verklingen, bis ich gar nichts mehr höre."
 latria_sexual_frustration_flavor.1502.desc.survived: "Das Gift, das ich trank, hat mich nicht getötet. Nachdem man mich gefunden und behandelt hat, liege ich noch immer in meinem Schlafgemach, zu krank zum Aufstehen. Der Becher wurde fortgebracht, doch die Begierde, die mich dazu trieb, ist geblieben."
 latria_sexual_frustration_flavor.1502.desc.severe: "Das Gift ließ mich am Leben und meinen Körper siech zurück. Ich liege im Bett, während andere mir Wasser bringen und meine Kleider richten. Die bleibende Schwäche hat mir keine Ruhe vor meinen Begierden gebracht."
 latria_sexual_frustration_flavor.1502.a.dead: "Ich … kann nicht sprechen …"
 latria_sexual_frustration_flavor.1502.a.survived: "So elend … etwas Wasser …"
 latria_sexual_frustration_flavor.1502.a.severe: "Ich kann nicht einmal die Hand heben …"

 latria_sexual_frustration_flavor.1503.t: "Am Flussufer"
 latria_sexual_frustration_flavor.1503.desc.dead: "Ich kann das Ufer nicht mehr sehen. In der Ferne scheint jemand zu rufen, doch der Laut wird undeutlich. Ich denke an die Lampe, die ich in meinem Gemach brennen ließ. Auch dieser letzte Gedanke entgleitet mir."
 latria_sexual_frustration_flavor.1503.desc.survived: "Jemand hat mich aus dem Fluss gezogen. Als ich erwache, hüllt man mich in einen Mantel. Ich zittere am Ufer und warte darauf, heimgebracht zu werden. Die Sehnsucht, die mich hierherführte, spüre ich noch immer schmerzlich."
 latria_sexual_frustration_flavor.1503.desc.severe: "Der Fluss hat mein Leben nicht genommen. Als man mich ans Ufer trägt, habe ich Fieber und huste zu heftig, um zu sprechen. Man flüstert von einer Lungenkrankheit. In jedem klaren Augenblick kehrt dieselbe Begierde zurück."
 latria_sexual_frustration_flavor.1503.a.dead: "So kalt …"
 latria_sexual_frustration_flavor.1503.a.survived: "Ich bin noch … am Leben?"
 latria_sexual_frustration_flavor.1503.a.severe: "Ich … bekomme keine Luft …"

 latria_sexual_frustration_flavor.1504.t: "Unterhalb der Klippe"
 latria_sexual_frustration_flavor.1504.desc.dead: "Ich liege unterhalb der Klippe und höre die Suchenden auf dem Bergpfad rufen. Ihre Stimmen kommen näher, doch ich kann nicht antworten. Die Berge verschwimmen vor mir, bis ich den Himmel nicht mehr erkennen kann."
 latria_sexual_frustration_flavor.1504.desc.survived: "Ich erwache unterhalb der Klippe. Jemand hockt neben mir und ruft meinen Namen. Der Sturz hat mich schwer verwundet, doch ich lebe. Während ich auf eine Trage warte, erfüllt dieselbe Begierde erneut meine Gedanken."
 latria_sexual_frustration_flavor.1504.desc.severe: "Ich habe den Sprung überlebt. Diejenigen, die mich fanden, stehen dicht um mich und meiden meinen Blick. Als ich aufzustehen versuche, merke ich, dass ich nicht mehr wie früher gehen kann. Meine Qual bleibt."
 latria_sexual_frustration_flavor.1504.a.dead: "Ich höre nichts mehr …"
 latria_sexual_frustration_flavor.1504.a.survived: "Ich kann mich nicht bewegen … es tut weh …"
 latria_sexual_frustration_flavor.1504.a.severe: "Meine Beine …"

 latria_sexual_frustration_flavor.1505.t: "Die aufgebrochene Tür"
 latria_sexual_frustration_flavor.1505.desc.dead: "Ich höre, wie die Tür zum Schlafgemach aufgebrochen wird, dann ruft jemand erschrocken meinen Namen. Ich versuche zu sagen, dass der Brief neben dem Bett liegt, doch kein Wort kommt heraus. Das Licht im Türrahmen verblasst, und ich höre nichts mehr."
 latria_sexual_frustration_flavor.1505.desc.survived: "Jemand brach die Tür zum Schlafgemach auf und rettete mich rechtzeitig. Nun liege ich im Bett, und meine Verletzungen erschweren jede Bewegung. Das Seil ist fort, doch die Qual, die mich dazu trieb, hat mich nicht verlassen."
 latria_sexual_frustration_flavor.1505.desc.severe: "Ich höre, wie jemand immer wieder meinen Namen ruft, doch ich weiß nicht, wie ich antworten soll. Andere müssen mich waschen und füttern. Ich betrachte die vertraute Einrichtung meines Schlafgemachs und weiß nicht, was ich als Nächstes tun soll. Den Brief neben dem Bett hat man in einer Truhe verstaut."
 latria_sexual_frustration_flavor.1505.a.dead: "Ich …"
 latria_sexual_frustration_flavor.1505.a.survived: "Lasst mich … Atem holen …"
 latria_sexual_frustration_flavor.1505.a.severe: "Ruft jemand … nach mir?"
