l_german:
 latria_sexual_frustration_flavor.1211.t: "Die brennende Lampe"
 latria_sexual_frustration_flavor.1211.desc: "Das Haus ist still genug geworden, dass ich die Lampe hören kann. Ich habe niemanden gerufen. Ich habe dennoch zwei Becher hingestellt, und der zweite steht da mit nichts darin. Das Brot liegt noch unter dem Tuch, wo ich es am Mittag ließ.\n\nWas ich behalte, ist eine Schulter an meiner in einer Tür, ihr Gewicht, die Art, wie keine von uns sich für die Länge eines Atemzugs bewegte. Meine Haut hat das behalten. Es kommt zu dieser Stunde zurück, unter dem Nachtgewand, hinter meinen Knien und tiefer, und meine Hand geht flach auf meinen Bauch, um es zu beruhigen, und beruhigt es nicht.\n\nDer Docht neigt sich. Ich drehe den leeren Becher so, dass sein Henkel zum Stuhl zeigt."
 latria_sexual_frustration_flavor.1211.a: "Die Lampe auslöschen und meine eigene Hand es beenden lassen."
 latria_sexual_frustration_flavor.1211.b: "Den Docht kürzen, den kalten Tee trinken und schlafen."
 latria_sexual_frustration_flavor.1211.c: "Lesen, bis die Wörter aufhören zu kreisen."

 latria_sexual_frustration_flavor.1212.t: "Der Rat wartet"
 latria_sexual_frustration_flavor.1212.desc: "Die Bittschriften werden verlesen, und ich höre keine von ihnen. Wer meinen Haushalt führt, steht am Rand des Tisches, die Hände hinter dem Rücken verschränkt, und ich sehe seit der zweiten Seite die Linie dieser Kehle. Der Regen hat aufgehört, und die Kammer ist zu warm. Das Feuer tickt hinter mir und setzt sich.\n\nDie Person beugt sich hinüber, um eine Kerze zu rücken, und ein Ärmel streift mein Handgelenk. Keine von uns sagt etwas. Die Kammer riecht nach heißem Wachs und nasser Wolle. Ich könnte die Sitzung beenden. Das Wort ist schon in meinem Mund, und ich halte es dort, und sie wartet mit den Augen auf dem Siegel.\n\nDer Schreiber fragt, ob ich entschieden habe. Ich habe nichts entschieden."
 latria_sexual_frustration_flavor.1212.a: "Die Sitzung beenden und sie mit einem erfundenen Auftrag zurückbehalten."
 latria_sexual_frustration_flavor.1212.b: "Über die Bittschriften entscheiden und die Augen auf der Seite halten."
 latria_sexual_frustration_flavor.1212.c: "Die Papiere zum Kartentisch tragen und die Nacht hindurch arbeiten."

 latria_sexual_frustration_flavor.1213.t: "Wozu die Dunkelheit da ist"
 latria_sexual_frustration_flavor.1213.desc: "Die Tür ist verriegelt. Ich bin nicht angekleidet, und das Laken liegt auf dem Boden, wohin ich es gestoßen habe. Die Kammer riecht nach der Kerze und nach meiner eigenen Haut.\n\nMein Leib ist den ganzen Tag laut gewesen, und jetzt ist er lauter. Ich lasse meine Knie offen fallen und meine Hand über meinen Bauch hinuntergehen, tiefer, und ich gebe nicht vor, etwas anderes zu tun. Was kommt, ist ein Mund an meinem Schlüsselbein, festgehaltene und gemochte Handgelenke, und ich folge ihm, bis sich meine Hüften von der Matratze heben und mein Atem in der Dunkelheit auseinanderbricht.\n\nDanach ist die Kammer dieselbe Kammer. Ich liege mit dem Arm über den Augen. Die Kerze ist zu einer Pfütze heruntergebrannt, und ich habe nicht geschlafen."
 latria_sexual_frustration_flavor.1213.a: "Meine Hand beenden lassen und danach schlafen."
 latria_sexual_frustration_flavor.1213.b: "Das Laken vom Boden nehmen und still liegen bis zum Morgengrauen."
 latria_sexual_frustration_flavor.1213.c: "Mich ankleiden, hinuntergehen und die Mauern abschreiten, bis der Himmel grau wird."
 latria_sexual_frustration_flavor.1213.d: "Mich wieder und wieder dem hingeben, bis die Kerze stirbt."

 latria_sexual_frustration_flavor.1214.t: "Die Stunde vor der Laudes"
 latria_sexual_frustration_flavor.1214.desc: "Ich bin allein in der Kirche mit den Lampen, die ich kürzen soll. Kälte kommt durch die Steinplatten herauf, und die Heiligen sehen an mir vorbei zur Tür. Unter dem Gewand ist mein Leib warm und wach und ganz und gar uninteressiert an der Stunde.\n\nIch kenne die Worte dafür. Ich habe sie über andere Leute gesprochen in dem hölzernen Kasten bei der Tür, in der Stimme, die ich für ihre Sünden nehme. Sie über mich selbst zu sprechen tut nichts. Das Verlangen sitzt hinter meinen Rippen wie eine verschluckte Kohle. Ich drücke meine Handfläche flach auf den Altarstein, bis es schmerzt.\n\nDie Glocke wird bald läuten. Meine Hand liegt noch auf dem Stein, und der Stein ist nicht mehr kalt."
 latria_sexual_frustration_flavor.1214.a: "Das Verlangen in meine eigenen Hände nehmen und danach um Verzeihung bitten."
 latria_sexual_frustration_flavor.1214.b: "Das Amt kniend durchstehen und die Stunden es abtragen lassen."
 latria_sexual_frustration_flavor.1214.c: "Das Buch öffnen und die Psalmen lesen, bis die Worte halten."

 latria_sexual_frustration_flavor.1215.t: "Ein Knie unter dem Tisch"
 latria_sexual_frustration_flavor.1215.desc: "Die Halle ist laut. Der Hund von irgendwem ist unter den Bänken, und der Wein ist zweimal herumgegangen. Die Person neben mir hat ihr Knie seit dem Wildbret nicht von meinem fortbewegt, und die Bank ist warm geworden, wo wir uns berühren. Die Binsen riechen nach getretenem Wein.\n\nJedes Mal, wenn der Tisch mit Gelächter bebt, verschiebt sich der Druck und kommt zurück. Ich folge dem Streit über die Grenze nicht mehr. Ich lege meine Hand auf die Bank neben ihre und lasse sie dort. Sie sieht die Hand an, dann die fernste Wand, und ihr Knie bleibt. Mein Knie ist taub geworden, und ich habe es nicht verschoben.\n\nEin Becher fällt um. Wein läuft bis an den Rand und tropft auf die Binsen. Niemand hat sich bewegt."
 latria_sexual_frustration_flavor.1215.a: "Es offen sagen, hier, und die Halle hören lassen."
 latria_sexual_frustration_flavor.1215.b: "Der Tafel danken, aufstehen und draußen Luft nehmen."
 latria_sexual_frustration_flavor.1215.c: "Mich ihr zuwenden und von allem anderen sprechen, bis das Feuer niedrig ist."

 latria_sexual_frustration_flavor.1216.t: "Ärmel im Garten"
 latria_sexual_frustration_flavor.1216.desc: "Die Pfingstrosen sind über ihre Zeit hinaus, und wer den Garten pflegt, hat aufgehört, so zu tun, als arbeitete sie. Wir gehen den langen Weg um den Teich, weil der kurze an der Pforte endet. Der Nachmittag hat die Farbe von schwachem Tee angenommen.\n\nIhr Ärmel findet immer wieder die Rückseite meiner Hand. In meinem eigenen Haus wäre eine Berührung wie diese ein schon gefasster Entschluss, und man hätte nach den Vermittlern geschickt, ehe der Tee kalt ist. Hier ist es nur ein Ärmel, und ich bin es, die ihn lesen muss. Ich gehe langsamer. Sie geht langsamer. Das Wasser hält beide unserer Spiegelbilder, und keine von uns bewegt sich zuerst.\n\nAn der Pforte bleibt sie stehen und sieht einmal zurück. Unter meinem Schuh liegen Blütenblätter."
 latria_sexual_frustration_flavor.1216.a: "Sie offen fragen und es meinem Haus gegenüber verantworten."
 latria_sexual_frustration_flavor.1216.b: "Mich verneigen, die Hände in den Ärmeln behalten und hineingehen."
 latria_sexual_frustration_flavor.1216.c: "Den Teich allein noch einmal umrunden, bis die Lampen entzündet werden."

 latria_sexual_frustration_flavor.1217.t: "Der lange Ritt zurück"
 latria_sexual_frustration_flavor.1217.desc: "Wir sind seit vor dem Licht im Sattel, und für die letzten drei Meilen bin ich mir der Person vor mir bewusst gewesen. Die Art, wie sie sitzt. Die Art, wie sie an der Furt zurücksah. Meine Schenkel sind wund gescheuert und mein Mund ist trocken, und nichts davon ist der Grund, aus dem ich sie weiter ansehe.\n\nDas Wild ist fort, die Treiber sind verstreut, und niemand würde eine Verzögerung anmerken. Meine Hände sind kalt am Zügel, und der Rest von mir ist es gar nicht. Ich gebe dem Pferd die Fersen und schließe die Entfernung auf nichts. Der Wald tickt mit Wasser.\n\nSie wendet sich bei dem Laut und wartet. Der Wald ist voll nasser Blätter, und die Pferde blasen."
 latria_sexual_frustration_flavor.1217.a: "Sie zwischen die Bäume nehmen und zu spät zurückkommen."
 latria_sexual_frustration_flavor.1217.b: "Weiter zur Hütte reiten und den Gedanken in kaltes Wasser legen."
 latria_sexual_frustration_flavor.1217.c: "Absteigen und die Spuren lesen, bis meine Hände aufhören zu zittern."

 latria_sexual_frustration_flavor.1218.t: "Eine Kammer mit geliehenen Büchern"
 latria_sexual_frustration_flavor.1218.desc: "Wer mir erlaubt, in der Vorratskammer zu schlafen, hat mir die Lampe und ein Buch gelassen, das ich nicht gut lesen kann. Regen an den Läden und der Geruch von nassem Stroh. Mein Leib ist seit der letzten Stadt unruhig, und das schmale Bett macht es schlimmer. Die Lampe raucht, wenn der Zug sie findet.\n\nSie kommt herein, um nach dem Docht zu sehen, und steht mit den Fingern am Bord, und ich kann die Tinte an ihr riechen. Ich bitte sie zu bleiben und mir die Seite zu erklären. Sie tut es. Ihre Schulter ruht an meiner, während sie zeigt, und keine von uns bewegt sie fort, und ich höre die Grammatik nicht mehr.\n\nDer Regen lässt nach. Ihr Finger liegt noch auf derselben Zeile."
 latria_sexual_frustration_flavor.1218.a: "Schlecht singen, bis das Verlangen irgendwohin kann."
 latria_sexual_frustration_flavor.1218.b: "Danken, die Lampe auslöschen und mit dem Rücken zur Tür liegen."
 latria_sexual_frustration_flavor.1218.c: "Bitten, weiter zu unterrichten, und meine Hände auf der Seite behalten."
 latria_sexual_frustration_flavor.1218.d: "Die Stelle dreimal abschreiben, bis meine Hand zu müde ist, um zu wollen."

 latria_sexual_frustration_flavor.1219.t: "Die Kammer hinter der Halle"
 latria_sexual_frustration_flavor.1219.desc: "Das Festmahl hat sich in den Hof geleert, und wir beide sind in der kleinen Kammer hinter der Halle gelandet, wo die Reservebänke stehen. Sie hat den Rücken zur Tür und eine Hand flach auf meiner Brust, und sie lacht über mich, wartend.\n\nIch bekomme die Schließe ihres Gürtels auf, dann die Bänder, und sie lacht wieder und hilft mir. Ihr Mund ist an meiner Kehle, und ein Schenkel kommt zwischen meine, und ich bin über das Verstellen hinaus. Wir lassen uns Zeit auf der Bank, ihr Haar löst sich, mein Atem geht zerfasert, bis sie zittert und ich folge.\n\nDanach hält sie noch mein Handgelenk. Die Musik hat in der Halle wieder eingesetzt."
 latria_sexual_frustration_flavor.1219.a: "Ihr die Wahrheit sagen und ihre Hand behalten."
 latria_sexual_frustration_flavor.1219.b: "Meine Kleider richten, danken und in die Halle zurückgehen."
 latria_sexual_frustration_flavor.1219.c: "Bei ihr auf der Bank sitzen, bis die Musik aufhört."

 latria_sexual_frustration_flavor.1220.t: "Die Nachtwache, die ich hielt"
 latria_sexual_frustration_flavor.1220.desc: "Ich sagte den anderen, ich würde die Nachtwache halten, und sie ließen mir die Kirche, eine Kerze und den Geruch des Weihrauchs von letzter Woche. Mitternacht kam und ging. Meine Knie schmerzen, und mein Leib will nicht still sein. Die Steinplatten haben meinen Füßen die Wärme genommen.\n\nJedes Mal, wenn ich die Augen schließe, ist eine Hand an meinem Kreuz, von einem Tanz vor zwei Wintern, und ich muss sie wieder öffnen. Die Kerze wirft meinen Schatten die Wand hinauf. Ich könnte dem in einem Augenblick ein Ende setzen, und niemand würde es je erfahren, und das ist das Schlimme daran.\n\nEs zieht von der Tür. Mein Schatten bewegt sich an der Wand."
 latria_sexual_frustration_flavor.1220.a: "Es hier in meine eigenen Hände nehmen und ehrlich sein mit den Heiligen."
 latria_sexual_frustration_flavor.1220.b: "Auf den Knien bleiben, bis das Fenster grau wird."
 latria_sexual_frustration_flavor.1220.c: "Das Amt laut lesen, bis meine Stimme das Einzige im Raum ist."

 latria_sexual_frustration_flavor.1221.t: "Der Handschuh der gesandten Person"
 latria_sexual_frustration_flavor.1221.desc: "Die gesandte Person ist seit drei Tagen in meiner Halle, und ich habe jeden davon gezählt. Sie zieht den Handschuh aus, um die Seiten des Vertrags zu wenden, Finger um Finger, und ich habe die Klausel über den Fluss zweimal verloren. Das Feuer ist heruntergebrannt, und niemand ist nach Holz geschickt worden.\n\nMeine Räte sehen mir zu, wie ich nicht zuhöre. Es gibt einen Ort in der Stadt, wo niemand nach einem Namen fragt, und der Gedanke daran hat seit dem zweiten Morgen in meiner Brust gesessen, schwer und warm und ganz und gar unwürdig. Ich bin seit einem Jahr nicht an dieser Tür gewesen.\n\nSie hält mir den Handschuh hin, damit ich das Siegel ansehe. Ich nehme ihn. Er ist noch warm."
 latria_sexual_frustration_flavor.1221.a: "Unterschreiben, sie entlassen und heute Nacht in die Stadt hinuntergehen."
 latria_sexual_frustration_flavor.1221.b: "Die Klausel wieder lesen und meine Hände auf dem Tisch behalten."
 latria_sexual_frustration_flavor.1221.c: "Die Bedingungen eine nach der anderen durcharbeiten, bis die Kerzen flackern."
 latria_sexual_frustration_flavor.1221.d: "Herausfinden, welche Tür in der Stadt die stille ist."

 latria_sexual_frustration_flavor.1222.t: "Eine Hand, zu lange gehalten"
 latria_sexual_frustration_flavor.1222.desc: "Der Tanz ist beim langsamen Takt angekommen, und ich bin den ganzen Abend von Hand zu Hand gereicht worden. Die letzte lässt nicht los, als die Musik aufhört. Die Halle ist heiß von Kerzen und vom Geruch fremden Weins. Die Binsen sind flach getreten, und die Kerzen flackern.\n\nIhr Daumen liegt auf meinen Knöcheln. Die Halle sieht zu und tut, als täte sie es nicht, meine Ohren sind heiß, und ich nehme meine Hand nicht zurück. Jemand lacht nahe den Musikanten. Ihr Griff zieht sich einmal zusammen, bedächtig, und mein ganzer Leib antwortet, ehe ich mein Gesicht ordnen kann. Meine Hand ist nicht ruhig in ihrer. Die Musik setzt hinter mir wieder ein.\n\nSie lässt los. Der Abdruck ihrer Finger bleibt auf meiner Hand."
 latria_sexual_frustration_flavor.1222.a: "Sagen, was ich will, dort, wo die ganze Halle es hören kann."
 latria_sexual_frustration_flavor.1222.b: "Für den Tanz danken und in die Menge zurücktreten."
 latria_sexual_frustration_flavor.1222.c: "Sie bitten, mit mir zur Tür zu gehen und über Pferde zu sprechen."

 latria_sexual_frustration_flavor.1223.t: "Die Furt"
 latria_sexual_frustration_flavor.1223.desc: "Wir halten an der Furt, um die Pferde zu tränken, und der Tag ist heiß genug, dass die halbe Gesellschaft hineingeht. Ich stehe auf dem flachen Felsen, das Hemd ausgezogen, und wringe es aus, als ich die Person bemerke, die noch im Sattel ist und zusieht. Das Wasser ist laut über den Steinen. Die Pferde trinken und verlagern die Füße.\n\nSie sieht nicht weg, als ich sie ertappe. Wasser läuft über meine Rippen und von meinem Handgelenk. Es gibt sehr viel, was ich mit dem Nachmittag tun könnte, und den ganzen Wald, um es zu tun, und mein Leib hat schon entschieden, und es macht es schwer, an die Pferde zu denken.\n\nSie steigt ab. Die Zügel sind noch in ihrer Hand."
 latria_sexual_frustration_flavor.1223.a: "Das Hemd fallen lassen und zu ihr gehen, vor jedem, der hinsehen mag."
 latria_sexual_frustration_flavor.1223.b: "Das Hemd wieder anziehen und zur Hütte vorausreiten."
 latria_sexual_frustration_flavor.1223.c: "Den Falken herausnehmen und meine Hände beschäftigen, bis die Gesellschaft bereit ist."

 latria_sexual_frustration_flavor.1224.t: "Zwei im Sattel und das Gras"
 latria_sexual_frustration_flavor.1224.desc: "Das Gras ist hoch genug, um ein Pferd zu verbergen, und der Himmel tut, was er vor Regen tut. Wir sind Seite an Seite geritten, seit die Herde gewendet hat, und ihr Bein liegt seit der letzten Achtelmeile an meinem, und keine von uns hat es berichtigt. Der Wind riecht nach zerdrückten Stängeln. Die Pferde sind bis zum Knie nass.\n\nHier draußen gibt es keine Mauer, hinter der man sich verstecken kann, und keine priesterliche Person innerhalb eines Tagesritts. Das hat das Verlangen nie einfacher gemacht. Es hat es nur größer gemacht, so wie das Land größer ist, und ich habe aufgehört, so zu tun, als wüsste ich nicht, wohin das geht.\n\nSie hält auf der Kuppe an und sieht mich über die Schulter an. Die ersten Tropfen kommen herunter."
 latria_sexual_frustration_flavor.1224.a: "Ihre Hand nehmen und sie hinunter ins lange Gras führen."
 latria_sexual_frustration_flavor.1224.b: "Nicken, mein Pferd wenden und mit ihr zu den Wagen zurückrasen."
 latria_sexual_frustration_flavor.1224.c: "Die Scheibe am fernen Pfosten aufstellen und schießen, bis meine Arme zittern."

 latria_sexual_frustration_flavor.1225.t: "Was ich im Kasten sagte"
 latria_sexual_frustration_flavor.1225.desc: "Ich kniete in dem hölzernen Kasten und sagte es laut, was schlimmer war, als nichts zu sagen. Wer auf der anderen Seite des Gitters saß, keuchte nicht und schalt nicht. Es stellte mir eine Frage über mein eigenes Haus und wartete, und ich hörte meine eigene Stimme die Antwort geben. Die Kirche riecht nach kaltem Stein.\n\nAuf dem Rückweg durch die Kirche ist mein Gesicht noch heiß. Es ist nicht Scham, oder nicht nur das. Nun, da es gesagt ist, kann ich das Ganze wieder fühlen, bei Tageslicht, vor dem Altar, und mein Leib hat überhaupt keine Manieren. Mein Kragen ist zu eng.\n\nDie Person ist noch im Kasten. Der Vorhang bewegt sich, als ich vorbeigehe."
 latria_sexual_frustration_flavor.1225.a: "Zum Kasten zurückgehen und bitten, den Rest zu hören."
 latria_sexual_frustration_flavor.1225.b: "An der Schranke knien und die Buße und die Worte nehmen, die gegeben werden."
 latria_sexual_frustration_flavor.1225.c: "Im Seitenschiff sitzen und zuhören, bis ich ruhig bin."

 latria_sexual_frustration_flavor.1226.t: "Erwachen zur vierten Stunde"
 latria_sexual_frustration_flavor.1226.desc: "Ich komme aus dem Traum, das Herz geht, die Schenkel sind feucht, das Laken zum Fußende gestoßen. Im Traum war es der Stallhof und eine Hand an meinem Hals, und ich weiß, wessen Hand. Die Kammer ist kalt, und das Kissen ist nass, wo mein Mund war.\n\nDie Kammer ist grau. Niemand ist darin. Mein Leib kümmert sich nicht um das Grau oder um die Stunde. Er will den Traum zu Ende und ist sehr klar darüber, wie. Ich lege den Arm über die Augen und liege mit angezogenen Knien. Der Boden ist kalt genug, um zu schmerzen.\n\nDer Vogel in der Traufe setzt ein. Meine Hand bewegt sich schon."
 latria_sexual_frustration_flavor.1226.a: "Es beenden und mich schlafend finden lassen."
 latria_sexual_frustration_flavor.1226.b: "Aufstehen, mich ankleiden und in die Ställe gehen, bis ich schmerze."
 latria_sexual_frustration_flavor.1226.c: "Den Brief auf dem Tisch lesen, bis das Licht richtig kommt."

 latria_sexual_frustration_flavor.1227.t: "Die Wette"
 latria_sexual_frustration_flavor.1227.desc: "Jemand hat ein Pferd darauf gesetzt, dass ich den Namen der Person, die ich will, vor der ganzen Tafel nicht sagen kann. Der Wein ist gut, das Feuer heiß, die Wette dumm, und alle warten. Der Hund hat unter der Bank aufgehört zu knurren, um zuzuhören. Die Wette wurde vor dem Mann des Bischofs abgeschlossen.\n\nIch kann den Namen in meinem Mund fühlen wie einen Stein. Über die Tafel hinweg sieht die Person, um die es geht, auf ihr Brettchen und nicht auf mich, und mein Nacken ist nass. Wenn ich ihn sage, wird er bis Sonntag in jeder Halle sein. Jemand hat mehr Holz aufs Feuer gelegt.\n\nWer den Haushalt führt, füllt meinen Becher wieder. Die Tafel ist still geworden."
 latria_sexual_frustration_flavor.1227.a: "Den Namen sagen und die Halle daraus machen lassen, was sie will."
 latria_sexual_frustration_flavor.1227.b: "Lachen, die Strafe zahlen und nach mehr Wein rufen."
 latria_sexual_frustration_flavor.1227.c: "Das Brett aufstellen und die Person schlagen, die die Wette gemacht hat."
 latria_sexual_frustration_flavor.1227.d: "Ein Gedicht daraus machen, das den Namen enthält und keinen."

 latria_sexual_frustration_flavor.1228.t: "Die Bedingungen"
 latria_sexual_frustration_flavor.1228.desc: "Die Heirat wird unter den Bäumen besprochen, in der Stimme, die man für Eigentum braucht. Die Person, um die es geht, steht mit gefalteten Händen an der Mauer und hört zu, wie ein Schreiber vorliest, was sie wert ist. Eine Biene arbeitet zwischen uns im Lavendel, und niemand wedelt sie fort. Die Stimme des Schreibers wird bei den Zahlen flach.\n\nIch bin gebeten worden, die Frage der Mitgift zu ordnen. Ich habe dieselbe Zeile viermal gelesen. Was ich will, ist nicht schicklich, und es steht nicht auf dem Papier, und es hat den ganzen Nachmittag in einem grünen Mantel an der Mauer gestanden. Der grüne Mantel hat eine zerrissene Manschette.\n\nDer Schreiber wartet mit erhobener Feder. Ein Blatt kommt auf den Tisch nieder."
 latria_sexual_frustration_flavor.1228.a: "Die Bedingungen rasch ordnen und den Schreiber und die Familie fortschicken."
 latria_sexual_frustration_flavor.1228.b: "Jede Zeile zweimal lesen und nichts preisgeben."
 latria_sexual_frustration_flavor.1228.c: "Die Papiere hineinnehmen und mit klarem Kopf entscheiden."
 latria_sexual_frustration_flavor.1228.d: "Die Güterkonten in Ordnung bringen und mich von den Zahlen halten lassen."

 latria_sexual_frustration_flavor.1229.t: "Die schreibende Hand"
 latria_sexual_frustration_flavor.1229.desc: "Das Abschreiben ist langsam, das Skriptorium ist kalt, und ich habe dasselbe Wort dreimal falsch geschrieben. Mein Sinn ist nicht auf der Seite. Er ist auf dem Mund der Person, die am Mittag das Brot brachte. Zwei Pulte weiter atmet jemand durch eine verstopfte Nase. Das Brot war noch warm, als es kam.\n\nIch habe ein Gelübde getan und habe es gehalten, und es zu halten hat mich meines eigenen Leibes auf eine Weise bewusst gemacht, die schwer wegzubeten ist. Meine Hand zittert über dem Pergament. Es gibt eine Art, das zu beenden, die etwa so lange dauert wie ein kurzes Gebet, und ich will sie.\n\nDie Tinte trocknet auf dem falschen Buchstaben."
 latria_sexual_frustration_flavor.1229.a: "Das Gelübde für einen Nachmittag beiseitelegen und ehrlich sein, warum."
 latria_sexual_frustration_flavor.1229.b: "Am Gelübde festhalten und das Verlangen sich selbst verbrennen lassen."
 latria_sexual_frustration_flavor.1229.c: "Die Stelle wieder aufnehmen und abschreiben, bis meine Hand ruhig ist."

 latria_sexual_frustration_flavor.1230.t: "Dämmerung im Garten"
 latria_sexual_frustration_flavor.1230.desc: "Ich bin im Nachtgewand hinausgekommen, weil die Kammer schlimmer war. Der Garten ist blau, und die Motten sind am Lavendel. Jemand im Gesindetrakt spielt schlecht auf einem Saitending, dieselben vier Töne, immer wieder. Das Gras ist durch meine Schuhe nass, und der Saum ist schwer.\n\nIch kann noch fühlen, wo eine Hand heute Abend an der Pforte auf meiner Taille ruhte, leicht, für die Länge einer Höflichkeit. Es ist nicht verblasst. Es ist die ganze Nacht lauter geworden, die Musik hilft nicht, und meine eigene Haut fühlt sich zu klein an. Ich habe mich seit der Pforte nicht bewegt. Die Bank ist kalt durch das Leinen.\n\nIch sitze auf der Steinbank. Die Motten gehen weiter am Lavendel."
 latria_sexual_frustration_flavor.1230.a: "Wieder hineingehen und die Musik das, was ich tue, decken lassen."
 latria_sexual_frustration_flavor.1230.b: "Auf der Bank bleiben, bis die Kälte durch das Nachtgewand kommt."
 latria_sexual_frustration_flavor.1230.c: "Atmen, die vier Töne zählen und den Garten genügen lassen."

 latria_sexual_frustration_flavor.1231.t: "Vor der Glocke erwacht"
 latria_sexual_frustration_flavor.1231.desc: "Ich erwache vor der Glocke, das Laken zum Boden gestoßen, meine Haut feucht entlang meines Kreuzes. Das Nachtgewand hat sich um meine Schenkel gewunden. Ich habe geträumt, und der Traum liegt noch auf mir, eine Wärme, die sich tief unten niedergelassen hat und sich nicht hebt.\n\nEs war dasselbe Gesicht, an das ich die ganze Woche sorgfältig nicht gedacht habe. Im Traum gab es keine Sorgfalt. Eine Hand an meiner Taille, ein Mund, dessen Form ich fühlen konnte, und mein eigener Leib, der antwortete, ehe ich etwas entschieden hatte. Ich bin jetzt wach, und es hat nicht aufgehört.\n\nIch liege mit angezogenen Knien, die Handfläche flach an meinem Bauch, und die Wärme sammelt sich nur darunter. Die Glocke hat nicht geläutet. Mein Atem geht schnell und flach, und ich habe mich nicht bewegt, um ihn zu verlangsamen."
 latria_sexual_frustration_flavor.1231.a: "Die Lampe auslöschen und meine eigene Hand es beenden lassen."
 latria_sexual_frustration_flavor.1231.b: "Das Gewand gerade ziehen, mich umdrehen und still liegen bis zur Glocke."
 latria_sexual_frustration_flavor.1231.c: "Lesen, bis die Wärme ihren Griff lockert."

 latria_sexual_frustration_flavor.1232.t: "Der Ritt abseits"
 latria_sexual_frustration_flavor.1232.desc: "Wir sind seit vor dem Licht im Sattel, und ich habe die Augen auf der Person vor mir gehalten. Die Art, wie sie sitzt. Die Art, wie sie an der Furt zurücksah und langsamer wurde, damit ich neben sie kommen konnte. Meine Schenkel sind wund gescheuert und mein Mund ist trocken, und nichts davon ist der Grund, aus dem ich weiter zusehe.\n\nDas Wild ist fort, und die Treiber haben sich in den nassen Wald verstreut. Niemand würde eine Verzögerung anmerken. Ich gebe dem Pferd die Fersen, bis keine Entfernung mehr bleibt, und mein Knie findet ihres, und das Leder knarrt, und keine von uns lenkt fort.\n\nSie wendet sich bei dem Laut und wartet. Der Wald ist laut von tropfendem Wasser. Meine Hände sind kalt am Zügel, und der Rest von mir ist es gar nicht, und das Pferd steht blasend unter mir."
 latria_sexual_frustration_flavor.1232.a: "Das Letzte der Entfernung schließen und es den Wald behalten lassen."
 latria_sexual_frustration_flavor.1232.b: "Die Zügel anziehen, allein weiterreiten und mich beherrschen."
 latria_sexual_frustration_flavor.1232.c: "Absteigen und den nassen Pfad abgehen, bis mein Kopf klar ist."

 latria_sexual_frustration_flavor.1233.t: "Die Stunde, die die Heiligen halten"
 latria_sexual_frustration_flavor.1233.desc: "Ich bin allein in der Kirche mit den Lampen, die ich kürzen soll. Kälte kommt durch die Steinplatten herauf, doch unter dem Gewand ist mein Leib warm und wach und hat kein Interesse am Amt. Die Heiligen sehen an mir vorbei zur geschlossenen Tür.\n\nIch kenne die Worte, die das kühlen sollen. Ich habe sie über andere Leute gesprochen in der Dunkelheit des Kastens bei der Tür, in der Stimme, die ich für ihre Sünden behalte. Über meine eigenen tun sie nichts. Das Verlangen sitzt hinter meinen Rippen wie eine verschluckte Kohle, und meine Hand ist dazu gekommen, flach auf dem Altarstein zu liegen, ohne dass ich es ihr gesagt hätte.\n\nIch drücke nieder, bis die kalte Kante meine Handfläche schmerzt. Die Glocke wird bald läuten. Meine Hand liegt noch auf dem Stein, und der Stein hat die Wärme von mir genommen und ist nicht mehr kalt."
 latria_sexual_frustration_flavor.1233.a: "Das Verlangen in meine eigenen Hände nehmen und danach um Verzeihung bitten."
 latria_sexual_frustration_flavor.1233.b: "Das Amt kniend durchstehen und die Stunden es abtragen lassen."
 latria_sexual_frustration_flavor.1233.c: "Meine Stirn auf den kalten Stein legen und mich von ihm stützen lassen."

 latria_sexual_frustration_flavor.1234.t: "Die zu lange gehaltene Hand"
 latria_sexual_frustration_flavor.1234.desc: "Der Rat ist gegangen, und das Arbeitszimmer ist still. Während der ganzen letzten Stunde bin ich mir nur eines bewusst gewesen: Als die gesandte Person sich über den Tisch beugte, um mir den Vertrag zu reichen, schloss sich ihre Hand über meiner und blieb dort einen Atemzug über das hinaus, was das Siegel verlangte. Der Raum war voller Menschen. Ich ließ sie bleiben.\n\nIch komme immer wieder auf ihr Gewicht zurück, auf die Wärme einer Handfläche, die keinen Grund hatte zu verweilen. Die Kerze ist heruntergebrannt, während ich dieselbe Klausel dreimal las. Mein Leib hat entschieden, dass das mehr wert ist als der Vertrag, und holt meine Meinung dazu nicht ein.\n\nIhr Ring hat einen Abdruck auf dem Rücken meiner Hand hinterlassen. Ich habe ihn nicht weggerieben. Das Wachs sammelt sich, und die Tür bleibt geschlossen, und ich lese die Klausel ein viertes Mal."
 latria_sexual_frustration_flavor.1234.a: "Wieder nach ihr schicken und offen sagen, was ihre Hand mir getan hat."
 latria_sexual_frustration_flavor.1234.b: "Die Nachtwache allein halten und mich von der Wache kühlen lassen."
 latria_sexual_frustration_flavor.1234.c: "Das Brett aufstellen und gegen mich selbst spielen, bis das Bild verblasst."

 latria_sexual_frustration_flavor.1235.t: "Wenn die Musik wendet"
 latria_sexual_frustration_flavor.1235.desc: "Die Halle ist laut, und der Wein ist zweimal herumgegangen. Als die Musikanten einsetzen, lasse ich mich in den Tanz ziehen, und die Person, mit der ich mich wiederfinde, ist die, die ich den ganzen Abend nicht angesehen habe. Ihre Hand setzt sich an meinen Rücken, und durch den dünnen Stoff kann ich jeden Finger fühlen.\n\nWir wenden uns und wenden uns wieder, und die Kammer verschwimmt zu Kerzenrauch und Farbe. Sie hält mich ein wenig näher, als die Figur verlangt, und ich berichtige sie nicht. Mein Puls ist in meinen Ohren, lauter als die Trommel. Das Verlangen ist aus dem Nichts heraufgekommen und hat vor der ganzen Halle einen Anspruch auf mich erhoben, und ich lächle, als geschähe nichts.\n\nDie Musik verlangsamt sich ihrem Ende zu. Ihre Hand hat sich nicht von meinem Rücken bewegt, und ich bin nicht beiseitegetreten."
 latria_sexual_frustration_flavor.1235.a: "Die Musikanten um einen Tanz mehr bitten und sie näher halten."
 latria_sexual_frustration_flavor.1235.b: "Danken, mich verneigen und mich zurückziehen, ehe die Figur wieder wendet."
 latria_sexual_frustration_flavor.1235.c: "Ihre Gesellschaft behalten und von allem außer diesem sprechen."
