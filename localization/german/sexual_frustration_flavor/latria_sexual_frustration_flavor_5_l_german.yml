l_german:
 latria_sexual_frustration_flavor.1401.t: "Das unbenutzte Siegel"
 latria_sexual_frustration_flavor.1401.desc.female: "Im Nachtgewand sitze ich am Bett und falte einen Brief immer wieder zusammen. Er trägt keine Unterschrift, und auch die Anrede ist durchgestrichen. Die tiefen Faltspuren lassen sich längst nicht mehr verbergen. An der Tischecke steht erwärmtes Siegelwachs bereit. Ein Druck mit dem Siegel, und meine Gedanken dieser Nacht könnten einem anderen Menschen anvertraut werden.\n\nIch öffne den Brief und halte bei der Zeile mit der Einladung inne. Stunde und Ort stehen deutlich da, sogar die Tür, durch die man kommen soll. Tagsüber konnte ich das noch als beiläufige Notizen abtun. Jetzt wartet der Bote draußen auf dem Gang. Mir fällt keine passende Ausrede mehr ein.\n\nVor der Tür raschelt leise ein Gewand. Ich nehme das Siegel auf. Meine andere Hand hält den Brief geschlossen; ich rufe niemanden herein."
 latria_sexual_frustration_flavor.1401.desc.male: "Im Nachtgewand sitze ich am Bettrand und halte das Siegel in der Hand. Der Brief auf dem Tisch reicht bis zur letzten Zeile. Die Tinte ist getrocknet, nur die Stelle für die Unterschrift bleibt leer. Ein Bediensteter hat das Wachs vorbereitet und das Fenster geschlossen. Beim Gehen fragte er nicht, weshalb ich noch nicht ruhte.\n\nIch kenne jeden Satz in diesem Brief und weiß, wie er gelesen werden wird. Setze ich meinen Namen und mein Siegel darunter, kann ich die Einladung nicht mehr als einen flüchtigen Scherz bezeichnen. Die Worte, die ich in Gedanken so oft verändert habe, lassen mir auf dem Papier keinen Platz mehr zum Ausweichen.\n\nSchon lange halte ich das Siegel fest. Ich drehe es richtig herum und sehe zum Licht im Türspalt. Den Boten habe ich noch nicht gerufen."
 latria_sexual_frustration_flavor.1401.desc: "Ich nehme das Siegel auf und lege es wieder hin, ohne den Brief zu versiegeln. Der Verschluss ist ordentlich gefaltet, das Wachs steht bereit. Am Tisch wartet keine andere Aufgabe auf mich. Trotzdem streiche ich noch einmal über die Papierecke, als gäbe es dort eine Falte, die weiteren Aufschub rechtfertigte.\n\nDer Satz ist bereits geschrieben. Wer den Brief am Morgen fortträgt, wird nur nach dem Ziel fragen und mir nicht die Entscheidung abnehmen, ob er überhaupt fortgeschickt werden soll. Ich lese die Anschrift zweimal. Ich stelle mir eine Antwort vor und ebenso die Möglichkeit, dass gar keine kommt.\n\nIm Löffel beginnt das Wachs fest zu werden. Ich rücke ihn näher ans Licht. Meine freie Hand drückt den Brief wieder auf den Tisch."
 latria_sexual_frustration_flavor.1401.a: "Den Brief zu Ende schreiben und mein Siegel daraufsetzen."
 latria_sexual_frustration_flavor.1401.b: "Das Siegel weglegen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1402.t: "Das letzte Festmahl"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Das Festmahl geht zu Ende, doch die Gäste sprechen weiter von Liebschaften, Verlobungen und vergangenen Freuden. Jemand schließt bereits seinen Mantel und dreht sich noch einmal um, um das Ende einer Geschichte nachzutragen. Die Zuhörer lachen und lassen sich nachschenken. Niemand muss hier für solche Gespräche die Stimme senken.\n\nIch war schon aufgestanden, setze mich aber beim Klang eines vertrauten Ortsnamens wieder hin. Auch ich verbinde etwas mit diesem Ort, habe nur nie so leicht darüber sprechen können. Ich versuche, einen Satz beizutragen. Mein Tischnachbar stellt den Becher ab und wartet auf mehr. Plötzlich drängen all die lange zurückgehaltenen Worte zugleich nach draußen.\n\nDie Musiker verstauen ihre Saiteninstrumente. Der Gastgeber schaut zur Saaltür. Ich habe noch nicht nach dem Obergewand auf meiner Stuhllehne gegriffen."
 latria_sexual_frustration_flavor.1402.desc.strict: "Beim Festmahl erzählt jemand von einem Adligen, der durch eine heimliche Liebschaft seine Stellung verloren hat. Der Weinkrug, der eben noch weitergereicht wurde, hält inne. Einer fragt nach seiner Familie, ein anderer meint leise, die geplante Heirat werde wohl ebenfalls ausfallen. Ich sitze am Ende der Tafel und höre zu, wie sie ein Leben Punkt für Punkt beurteilen.\n\nMein Name ist nicht gefallen. Als mein Tischnachbar fragt, weshalb ich so still sei, gelingt mir trotzdem nicht einmal ein gewöhnliches Lächeln. Einige persönliche Dinge wollte ich im Mut des Weines erzählen. Fange ich nun damit an, werde ich die Worte womöglich nicht mehr zurücknehmen können.\n\nEin Bediensteter holt meinen leeren Teller. Ich ziehe die Hand zur Seite, halte den Becher aber weiterhin fest. Der letzte Schluck bleibt darin."
 latria_sexual_frustration_flavor.1402.desc: "Erst als ich sehe, wie die Bediensteten Becher und Teller abräumen, merke ich, dass das Festmahl zu Ende geht. Einige Gäste verabschieden sich an der Tür. Der Gastgeber lässt nach Pferden und Wagen fragen. Mein Becher ist noch mehr als halb voll. Für das, was ich sagen wollte, hat sich keine passende Gelegenheit ergeben.\n\nMein Tischnachbar ordnet den Mantel und fragt, ob ich mit hinauskomme. Ich sage zu und beginne dann doch von einer alten Begebenheit zu erzählen. Ihren Anfang habe ich bereits erzählt. Trotzdem setze ich dort erneut an, als müsste ich diesen einen Satz nur richtig sagen, damit die Nacht anders endete.\n\nDie Hand neben mir hält am Mantelverschluss inne. Ich schiebe meinen Becher weg. Im Saal höre ich den Widerhall nun viel deutlicher als zuvor."
 latria_sexual_frustration_flavor.1402.a: "Die letzten Gäste an der Tafel halten und meine Sorgen immer wieder erzählen."
 latria_sexual_frustration_flavor.1402.b: "Den Gedanken unterdrücken, meinen Gastgebern danken und mich verabschieden."

 latria_sexual_frustration_flavor.1403.t: "Eine Beichte ohne Zeugen"
 latria_sexual_frustration_flavor.1403.desc.favors: "Ich bin allein vor dem Altar geblieben und höre, wie der letzte Diener des Heiligtums die Tür leise zuzieht. Auf dem Lesepult liegt das Buch offen. Ein Band markiert die Seite über die Freuden des Fleisches. Ich habe diese Lehren gelesen und weiß, dass mein Glaube nicht verlangt, mein Verlangen als Sünde zu betrachten.\n\nDoch sobald niemand mehr da ist, weiß ich nicht, wie ich anfangen soll. Die tagsüber zurechtgelegten Fragen wirken allzu sorgfältig. Sie führen genau an dem Menschen vorbei, den ich immerzu sehen möchte. Ich wiederhole einen Satz, halte inne und spreche leise den Namen aus, den ich bisher hinter einer bloßen Anrede versteckt habe.\n\nIm Heiligtum antwortet niemand. Ich nehme die Hand vom Buch und bleibe auf den Knien. Unter der Tür wird der Lichtstreifen langsam dunkler."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Ich knie allein vor dem Altar. Mein Gewand sitzt ordentlich, doch mein Gebet bricht jedes Mal an derselben Stelle ab. Der letzte Diener hat gefragt, ob er mir Licht lassen soll. Ich habe genickt. Nun sind nur eine Lampe und das noch nicht zu Ende gelesene Buch geblieben.\n\nDie Gebote kenne ich auswendig. Auch wie ich meine Verfehlungen bekennen sollte, habe ich längst gelernt. Doch immer, wenn ich der Begierde entsagen soll, denke ich an den Brief, den ich nicht vernichtet habe. Ich habe keineswegs vergessen, wo er liegt. Vor dem Verlassen meines Zimmers habe ich ihn eigens zwischen Seiten verborgen, die sonst niemand aufschlägt.\n\nNiemand drängt mich. Gerade deshalb fällt mir der nächste Satz noch schwerer. Draußen höre ich die Schritte der Wachablösung. Ich senke den Kopf und beginne erneut von vorn."
 latria_sexual_frustration_flavor.1403.desc: "Ich warte, bis die letzten Schritte im Heiligtum verklungen sind, und bleibe trotzdem vor dem Altar. Die Bänke stehen wieder ordentlich. Das Leseband hängt vom Pult herab, und an der Tür steht ein leerer Becher, den ein Diener vergessen hat. Solange andere hier waren, meinte ich, nicht sprechen zu können.\n\nJetzt bin ich allein und versuche, meine Sorge von Anfang an zu erzählen. Mitten darin höre ich, wie ich mich erneut hinter vertrauten Wendungen verberge. Ich halte inne, schaue zur Tür und beginne leise noch einmal. Diesmal lasse ich den Namen nicht aus.\n\nDas Lampenlicht fällt vor meine Knie. Ich stehe nicht sofort auf, sondern höre zu, wie meine letzten Worte im leeren Raum verklingen."
 latria_sexual_frustration_flavor.1403.a: "Keine weiteren Gelübde der Enthaltsamkeit ablegen und meine Entscheidung eingestehen."
 latria_sexual_frustration_flavor.1403.b: "Meine Begierde zügeln und bis zum Morgengebet knien."

 latria_sexual_frustration_flavor.1404.t: "Die Sehnsucht benennen"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Noch unbekleidet stehe ich allein vor dem Bronzespiegel meines Gemachs. Mein Obergewand liegt über der Stuhllehne. Die Bediensteten sind gegangen, und den Riegel habe ich selbst vorgeschoben. Mein Spiegelbild weicht meinem Blick nicht aus. Endlich suche auch ich nicht hastig nach irgendeiner Kleinigkeit, mit der ich mich ablenken könnte.\n\nIn den vergangenen Tagen habe ich meinen Wunsch, diesen Menschen zu sehen, Müdigkeit genannt, dann Unmut und schließlich bloß Schlaflosigkeit nach dem Fest. Mit jeder neuen Erklärung kam eine weitere Zeile zum Brief auf meinem Tisch. Abgeschickt habe ich ihn nie. Ich weiß, worauf ich warte, und habe es satt, morgens die geschriebenen Worte wieder zu streichen.\n\nAuf dem Tisch liegt ein frisches Blatt. Ich schaue hin und frage mich zum ersten Mal ernsthaft, ob ich am Anfang wirklich wieder all diese höflichen Grüße brauche."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Noch unbekleidet sitze ich allein am Bettrand und halte die Hände fest ineinander. Die Kleider liegen neben mir, und auch das Gebetbuch ist noch offen. Ich wollte nur die vertraute Passage zu Ende lesen und dann ruhen. Stattdessen bin ich lange an derselben Zeile hängen geblieben und habe sogar die Rufe der Nachtwache falsch mitgezählt.\n\nWenn ich mein Gelübde halte, liegt es nicht daran, dass ich mich nicht mehr nach Nähe sehne. Kaum fällt mir dieser Name ein, weiß ich, dass ich mich nicht länger als frei von solchen Gedanken bezeichnen kann. Ich schlage die Seite mit meinem Gelübde auf und lese langsamer als sonst. Bei jedem Satz möchte ich wissen, ob ich ihn selbst noch wähle.\n\nDie Seite bleibt zwischen meinen Fingern liegen. Draußen ist alles still. Ich schließe das Buch nicht und dränge mich auch nicht, den angefangenen Satz rasch zu beenden."
 latria_sexual_frustration_flavor.1404.desc: "Es ist sehr spät. Ich sitze in meinem Gemach und gestehe mir endlich ein, dass ich diesen Menschen noch immer sehen möchte. Den Brief auf dem Tisch habe ich mehrfach verändert. Jedes Mal strich ich den wichtigsten Satz und ließ nur Wetter, Reisepläne und belanglose Grüße stehen.\n\nIch breite die Blätter nebeneinander aus und betrachte ihre fast gleichen Anfänge. Sie sind anständig formuliert. Wer sie erhält, wird daraus aber nie erfahren, weshalb ich so lange das Licht brennen lasse. Wenn ich heute noch einen Brief schreibe, genügt eine andere Anrede nicht, um mich der Sache näherzubringen.\n\nIch lege die Feder neben das leere Blatt. Draußen ruft erneut die Nachtwache. Diesmal nehme ich es nicht zum Anlass, mich zum Schlafen anzuhalten."
 latria_sexual_frustration_flavor.1404.a: "Meine Sehnsucht eingestehen und sie heute Nacht nicht länger bekämpfen."
 latria_sexual_frustration_flavor.1404.b: "Mich wieder ankleiden und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1405.t: "Eine Seite in der Chronik"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Der Chronist sitzt über den Tisch gebeugt und wartet darauf, welche Dinge ich festgehalten wissen möchte. Im Festgewand stehe ich hinter ihm. Eben habe ich noch von Belohnungen und Aushebungen gesprochen; die Tinte ist nicht trocken. Beim Ablauf der morgigen Feier halte ich inne und komme stattdessen auf jene langen Nächte zu sprechen, die niemand verzeichnet.\n\nSeine Feder folgt mir nicht sofort. An der Tür verändert ein Bediensteter seine Haltung. Ich weiß, dass alle mich gehört haben. Ich hatte geglaubt, solange ich tagsüber wie gewohnt meine Räte empfinge, könnte diese Qual im Schlafgemach bleiben. Als der Chronist fragt, ob er meine Worte ebenfalls aufzeichnen soll, bringe ich das gewohnte Nein jedoch nicht heraus.\n\nEine neue Seite liegt bereit. Die Federspitze schwebt über der leeren Stelle. Alle warten darauf, dass ich meinen Satz fortsetze."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Der Schreiber sitzt am Tisch und fragt, ob auch dieser Abschnitt unserer Reise in die Chronik soll. Ich nenne Furten, Herbergen und einige Verzögerungen. Er hält alles fest und schaut auf, um den nächsten Ortsnamen zu hören. Neben meiner Hand ragt der unversandte Brief aus dem Reisebündel.\n\nNicht jeder Aufenthalt lag am Regen oder an einer gebrochenen Achse. Einen Umweg habe ich gemacht, um einen bestimmten Menschen wiederzusehen. Den wahren Grund habe ich meinen Gefährten nie genannt. Jetzt steht die Reise sauber geordnet auf dem Blatt. Beim Lesen der Ortsnamen scheint mir ausgerechnet das Ausgelassene das zu sein, was mich unterwegs am beharrlichsten begleitet hat.\n\nDer Schreiber taucht die Feder ein. Ich ziehe den Brief heraus, öffne ihn aber nicht. Zuerst streiche ich seine Ecke neben der Karte glatt."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Ich lege mein geistliches Gewand sorgfältig an und trete vor den Schreiber. Er wollte Spenden und Ausbesserungen festhalten. Als ich ein anderes Thema beginne, nimmt er ein neues Blatt. Neben ihm liegt die Schrift noch bei jener Passage offen, die ich tagsüber anderen erklärt habe.\n\nMein Gelübde ist wahr, und meine Begierde ist es ebenfalls. Ich möchte mich nicht als einen Menschen darstellen, der nie gezögert hat. Zugleich weiß ich, dass die Worte nach dem Aufschreiben nicht mehr nur meiner eigenen Erinnerung gehören. Der Schreiber fragt, ob er den Namen ebenfalls festhalten soll. Er spricht leise, als dürfe man draußen nichts davon verstehen.\n\nIch betrachte die freigelassene Zeile. Die Gebetsperlen liegen noch um mein Handgelenk. Ich bewege sie nicht, um der Frage auszuweichen."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Der Schreiber wartet auf mein Diktat. Ich trage das Festgewand; neben mir liegt noch das Siegel aus der Ratssitzung. Nachdem die Amtsgeschäfte erzählt sind, beginne ich von einer privaten Sache, die ich lange verschwiegen habe. Die Bediensteten an der Tür sind nicht hinausgegangen. Plötzlich ist es ganz still.\n\nZuerst spreche ich von einem alten Brief, dann von mehreren Treffen, die nicht zustande kamen. Der Schreiber arbeitet langsamer als zuvor und sieht bei jeder undeutlichen Stelle auf. Eigentlich wollte ich ihm die Wahl anständiger Formulierungen überlassen. Als ich meine Worte wiederholt höre, möchte ich jedoch nicht, dass daraus eine andere Geschichte wird.\n\nEr reicht mir die beschriebene halbe Seite. Ich nehme sie entgegen. Mein Blick bleibt bei der ersten Anrede stehen, hinter der ich nichts mehr verborgen habe."
 latria_sexual_frustration_flavor.1405.desc: "Ich trete an den Tisch des Schreibers und beschließe, meine lange verborgene Sorge auszusprechen. Er räumt die amtlichen Papiere beiseite, legt ein neues Blatt aus und fragt, wo er beginnen soll. Ich nenne ein Datum und halte gleich wieder inne. Damals hat die Sache nicht wirklich angefangen.\n\nIch beginne erneut: mit einem Brief, einer kurzen Begegnung und mehreren schlaflosen Nächten danach. Die Feder bewegt sich leise über das Papier. Was ich erzähle, kann nun ein anderer von Anfang bis Ende lesen. Der Schreiber urteilt nicht. Wenn ich ungenau werde, wartet er und lässt ein wenig Platz frei.\n\nDas beschriebene Blatt liegt zwischen uns. Ob ein Dritter es sehen soll, darüber erwartet er noch meine Anweisung."
 latria_sexual_frustration_flavor.1405.a: "Die Abschriften verbreiten lassen, damit alle sie lesen können."
 latria_sexual_frustration_flavor.1405.b: "Den Schreiber nur meine Pflichten aufzeichnen lassen und den Rest hinunterschlucken."

 latria_sexual_frustration_flavor.1406.t: "Als die Gäste gehen"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Die letzten Gäste sprechen noch immer von Geliebten und Verlöbnissen. Kaum erwähne ich meine eigene Vergangenheit, ertönt am Tisch ein leises Lachen. Der Gast hält seinen Becher hoch, findet nichts Unhöfliches daran und drängt mich lächelnd, auch den weiteren Verlauf zu erzählen.\n\nDiese Erinnerung begleitet mich schon so lange. Dass sie plötzlich zur heiteren Unterhaltung beim Wein wird, lässt mich verstummen. Die Person neben mir ergänzt eine Vermutung, jemand anderes macht sich über die Worte aus dem Brief lustig. Ich will sie berichtigen, merke aber beim Sprechen, wie meine Worte immer hastiger werden. Selbst Einzelheiten, die ich eben noch verschweigen wollte, liegen mir auf der Zunge.\n\nEin Bediensteter kommt, um den letzten Weinkrug abzuräumen. Ich halte den Rand meines Bechers fest und höre, wie jemand seinen Stuhl näher rückt, um die Fortsetzung zu hören."
 latria_sexual_frustration_flavor.1406.desc.strict: "Als am Tisch die Nachricht eintrifft, ein Adeliger habe wegen einer heimlichen Liebschaft seine Stellung verloren, habe ich meine eigene Erzählung noch nicht beendet. Neben mir stellt jemand plötzlich eine leise Frage. Ein anderer Gast sieht mich an und lacht kurz. Wer eben noch genickt hat, beschäftigt sich jetzt nur mit seiner Serviette.\n\nIch weiß, dass ich aufhören sollte. Doch ich will nicht, dass dieses Schweigen meine Geschichte für mich beendet. Je mehr ich erklären möchte, dass mich mit jenem Skandal nichts verbindet, desto erklärungsbedürftiger werden meine bisherigen Worte. An der Tür verabschieden sich bereits Gäste. Von denen, die bleiben, fordert mich niemand zum Weiterreden auf.\n\nIch setze den Becher etwas zu hart ab. Die Blicke ruhen noch immer auf mir. Ich muss entscheiden, wem mein nächster Satz gelten soll."
 latria_sexual_frustration_flavor.1406.desc: "Die Gäste wollen aufbrechen, doch ich finde kein Ende. Als ich auf einen alten Brief zu sprechen komme, tauschen die Menschen neben mir Blicke aus; am Tisch ertönt ein leises Lachen. Ich halte inne und bemerke erst jetzt, dass die Gäste vor mir ihr Besteck längst abgelegt haben und nur noch mir zuhören.\n\nIch wollte erklären, weshalb jener Satz wichtig war, doch stattdessen erzähle ich ihn ein zweites Mal. Jemand nickt höflich, jemand blickt zur Tür, ein anderer Gast verbirgt ein Lächeln hinter dem Becher. Ich sehe all diese Reaktionen und werde nur noch ungeduldiger, als fehlte bloß ein letzter Satz, damit sie mich verstehen.\n\nDer Gastgeber ist bereits aufgestanden. Die Stühle vor mir sind noch nicht zurückgeschoben, während hinter mir die Abschiedsgrüße beginnen."
 latria_sexual_frustration_flavor.1406.a: "Meine Geschichte weitererzählen und jedem, der mich verspottet, vor der ganzen Tafel antworten."
 latria_sexual_frustration_flavor.1406.b: "Schweigen, mich vor der Gesellschaft verneigen und mich verabschieden."

 latria_sexual_frustration_flavor.1407.t: "Gebet beim Erlöschen der Kerze"
 latria_sexual_frustration_flavor.1407.desc.favors: "Im Nachtgewand sitze ich am Bettrand und schlage im Gebetbuch die Seite über die Freuden des Fleisches auf. Was sich tagsüber wie eine gewöhnliche Lehre liest, gehe ich nun mehrmals durch. Die Tür ist verriegelt, die Menschen draußen sind fort, und in der Lampe bleibt nur ein letzter Rest Öl.\n\nMein Glaube verlangt nicht, dass ich mein Verlangen verleugne. Trotzdem weiß ich nicht, wie ich mit einer Zuneigung umgehen soll, auf die keine Antwort kommt. Ich spreche die Worte leise vor mich hin, die ich sagen möchte. Ohne Grüße und Höflichkeiten sind die übrigen Sätze so kurz, dass ich lange innehalte.\n\nDie Flamme schrumpft. Ich lege das Leseband auf die Seite, schließe das Buch jedoch nicht gleich und suche auch nicht weiter nach einer anderen Antwort."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Ich ziehe das Nachtgewand am Hals zusammen und wiederhole leise mein Keuschheitsgelübde. Der Docht ist kurz geworden; die Schrift im Gebetbuch lässt sich im Dunkeln immer schwerer erkennen. Ich lese trotzdem weiter. Bei einem Fehler beginne ich von vorn, als müsste ich nur jedes Wort richtig sprechen, damit diese Nacht vorübergeht.\n\nDoch auf halbem Weg kehren die Worte zurück, die jener Mensch heute zu mir gesagt hat. Ich habe mein Gelübde nicht vergessen. Ebenso wenig habe ich vergessen, warum mir der Abschied so schwerfiel. Stehen diese beiden Dinge nebeneinander, reichen die sonst so vertrauten Antworten plötzlich nicht mehr aus.\n\nAls die Lampe zu erlöschen droht, schütze ich die Flamme mit der Hand. Der nächste Satz steht vor meinen Augen. Ich betrachte ihn lange und bleibe stumm."
 latria_sexual_frustration_flavor.1407.desc: "Im Zimmer brennt nur noch eine fast erloschene Lampe, doch ich habe die Augen noch immer nicht geschlossen. Das Gebetbuch liegt auf meinen Knien; dieselbe Seite habe ich bereits mehrfach gelesen. Draußen geht ein Nachtwächter vorbei. Hinter der Ecke verstummen seine Schritte, und trotzdem warte ich auf den nächsten.\n\nIch rücke das Buch etwas näher ans Licht und suche die Stelle, an der ich aufgehört habe. Die Zeile enthält kein schwieriges Wort. Ich weiß, weshalb ich sie nie zu Ende lese: An ihrem Ende denke ich jedes Mal an eine Frage, die ich tagsüber hätte klären sollen. Jetzt kann niemand mehr antworten, doch ich überlege noch immer, was mein Gegenüber wohl sagen würde.\n\nDer letzte Rest Öl glänzt am Boden der Schale. Ich lege das Leseband ein, lasse die Hand auf dem Einband liegen und blase die Lampe nicht aus."
 latria_sexual_frustration_flavor.1407.a: "Das Keuschheitsgelübde beiseitelegen und bei dieser Zuneigung verweilen."
 latria_sexual_frustration_flavor.1407.b: "Meine Gedanken zügeln und bis zum Morgengrauen beten."

 latria_sexual_frustration_flavor.1408.t: "Schweigend vor dem Spiegel"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Ohne Kleidung stehe ich allein vor dem Spiegel. Neben dem Bett liegen die tagsüber abgelegten Gewänder, auf dem Tisch eine halb geschriebene Einladung. Früher habe ich vor diesem Spiegel stets mein Aussehen gerichtet und mir zurechtgelegt, was ich bei unserem Wiedersehen sagen würde. Wenn es dann so weit war, sprach ich doch nur über Alltägliches.\n\nDieses Hin und Her hat lange genug gedauert. Ich will ein Verlangen, das mich schon so lange begleitet, nicht weiter als flüchtigen Einfall abtun. Auch will ich nicht bei jedem Treffen darauf warten, dass mein Gegenüber zuerst spricht. Neben dem Spiegel liegt der unvollendete Brief. Am Ende ist noch genügend Platz für einen klaren Satz.\n\nIch wende mich zum Schreibtisch und sehe die getrocknete Tinte an der Federspitze. Draußen drängt mich niemand. Diesmal können auch keine Amtsgeschäfte an meiner Stelle antworten."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Ohne Kleidung sitze ich am Bettrand und halte meine Hände fest ineinander. Neben dem Spiegel liegen die Gewänder ordentlich gefaltet, darauf das Gebetbuch. Das vorgesehene Kapitel habe ich bereits gelesen. Die vertraute Ruhe bleibt jedoch aus, und je stiller das Zimmer wird, desto schwerer lässt sich diese Zuneigung übergehen.\n\nKeuschheit bleibt meine Wahl. Aber ich will nicht länger so tun, als fiele mir das Festhalten daran leicht, als hätte ich nach der Lektüre niemals an etwas anderes gedacht. Ich gehe die Aufgaben des nächsten Tages im Kopf durch. Als ich zu der Stunde komme, in der wir einander begegnen werden, halte ich inne und beginne die Reihenfolge neu zu ordnen.\n\nAuch mein Spiegelbild sitzt noch immer dort. Ich löse die verschränkten Hände und sehe zur Feder auf dem Tisch. Ich möchte dieses Zögern wahrheitsgetreu festhalten."
 latria_sexual_frustration_flavor.1408.desc: "In der Stille betrachte ich mein Spiegelbild. Auf dem Tisch liegt noch immer der unvollendete Brief. Das Lächeln, mit dem ich mich tagsüber verberge, muss ich jetzt nicht länger aufsetzen. Ich setze mich wieder auf den Bettrand und denke unsere kurze Begegnung von Anfang an durch.\n\nKein Wort daraus lässt sich als Versprechen verstehen. Niemand hat mich gebeten, weiter zu warten. Endlich bin ich bereit, einzeln zu unterscheiden, welche Bedeutungen von meinem Gegenüber stammen und welche ich selbst im Nachhinein hinzugefügt habe. Diese Einsicht lässt das Verlangen nicht sogleich verschwinden.\n\nIch schiebe das Papier näher ans Licht. Zumindest die noch ungeschriebene Zeile sollte klar sagen, was ich selbst meine."
 latria_sexual_frustration_flavor.1408.a: "Diese Begierde eingestehen und ihr heute Nacht nicht länger entfliehen."
 latria_sexual_frustration_flavor.1408.b: "Mich ankleiden, an den Schreibtisch setzen und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1409.t: "Ein Verlust der Fassung am Hof"
 latria_sexual_frustration_flavor.1409.desc: "In einer Unterbrechung der Hofversammlung lege ich in einem Nebenraum meine Kleidung ab. Ein kurzer Augenblick allein soll meine Gedanken beruhigen. Mein Obergewand ist noch in den Händen eines Bediensteten, als die Tür zum Ratssaal bereits aufgestoßen wird. Ich hebe den Kopf. Am langen Tisch ist das Gespräch verstummt; mehrere Mitglieder meines Hofes verharren mitten in ihrer Drehung zu mir.\n\nDer Schreiber senkt den Blick und zieht das halb beschriebene Blatt ein Stück zu sich. Die Menschen an der Tür möchten zurückweichen, fürchten aber, dem Bediensteten mit meinen Kleidern im Weg zu stehen. Niemand rührt sich zuerst. Ich sollte sofort etwas sagen, doch meine Stimme klingt gepresst. Die vorbereiteten Anweisungen wollen sich nicht zu Sätzen fügen.\n\nEndlich reicht mir der Bedienstete das Obergewand. Auf dem Tisch liegen weiterhin die unerledigten Angelegenheiten. Alle warten darauf, dass ich entscheide, wie es weitergeht."
 latria_sexual_frustration_flavor.1409.a: "Vor ihnen stehen bleiben und meinen Fehltritt nicht verbergen."
 latria_sexual_frustration_flavor.1409.b: "Die Edelleute fortschicken und mich vor der Fortsetzung der Ratssitzung ankleiden."

 latria_sexual_frustration_flavor.1410.t: "Die Nacht hinter der Tür"
 latria_sexual_frustration_flavor.1410.desc.female: "Im Nachtgewand sitze ich neben der Tür und höre, wie die Schritte draußen allmählich verklingen. Auf dem Gang gibt jemand einen Schlüssel zurück und wünscht leise eine gute Nacht. Ich hätte einen der Vorübergehenden anrufen und bitten können, am Morgen einen Brief für mich mitzunehmen. Doch auch als die Stimmen verstummen, habe ich nichts gesagt.\n\nDie unbeantwortete Zuneigung drängt sich wieder in meine Gedanken. Der Entwurf auf dem Tisch enthält zu viele belanglose Sätze. Nur die Antwort, die ich mir erhoffe, habe ich nicht deutlich benannt. Ich nehme das Blatt auf die Knie und lese von der ersten Zeile an. Endlich streiche ich jene gewöhnliche Grußformel, an die ich selbst nicht glaube.\n\nVor der Tür ist es vollkommen still geworden. Ich führe die Feder über den freien Platz. Noch bevor ich sie aufsetze, weiß ich, dass ich an diesem Brief länger schreiben werde als sonst."
 latria_sexual_frustration_flavor.1410.desc.male: "Im Nachtgewand lehne ich am Kopfende des Bettes. In dem Buch neben meiner Hand habe ich keine Seite umgeblättert. Draußen wird es still, und das Licht fällt weiterhin auf denselben Absatz. Ich denke noch immer an unser Gespräch, das tagsüber viel zu früh endete. Beim Abschied sagte ich, wir würden uns ein andermal weiter unterhalten. Mein Gegenüber antwortete nur mit der gebotenen Höflichkeit.\n\nEin andermal habe ich schon zu oft gesagt. Jedes Mal glaube ich, beim nächsten Treffen alles aussprechen zu können. Sobald ich allein bin, bleibt mir wieder nur zu rätseln, ob die höfliche Antwort etwas anderes bedeutete. Ich schiebe das Lesezeichen eine Seite weiter und merke sofort, dass ich nicht einmal mehr weiß, was auf der vorigen stand.\n\nAm Tisch liegen noch Papier und Feder. Ich schließe das Buch, lasse es aber auf den Knien liegen und betrachte den inzwischen dunklen Spalt unter der Tür."
 latria_sexual_frustration_flavor.1410.desc: "Die lange Nacht ist noch nicht vorüber. Ich sitze hinter der geschlossenen Zimmertür und höre die letzten Schritte in der Ferne verklingen. Der Brief auf dem Tisch ist unvollendet, das Buch neben dem Bett liegt offen. Beide Beschäftigungen, mit denen ich eben noch die Zeit vertreiben wollte, sind auf halbem Weg liegen geblieben.\n\nIch lese mir die bereits geschriebenen Zeilen vor. Die Sätze sind leicht zu verstehen, lassen aber überall einen Ausweg offen. Selbst am Ende bleibt unklar, welche Antwort ich von jenem Menschen eigentlich erhoffe. Schreibe ich so weiter und schicke den Brief morgen fort, werde ich nur einen weiteren Grund zum Warten haben.\n\nIch nehme ein neues Blatt und klemme es unter das Buch. Die Lampe leuchtet noch hell genug, um zu sehen, wo die erste Zeile beginnen soll."
 latria_sexual_frustration_flavor.1410.a: "Das Buch beiseitelegen und einen langen Brief schreiben."
 latria_sexual_frustration_flavor.1410.b: "Die Sehnsucht unterdrücken, die Lampe löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1401.c: "Die Einladung, die ich nicht versenden kann, zu einem Gedicht machen."
 latria_sexual_frustration_flavor.1402.c: "Die Musikanten dafür bezahlen, für die verbleibenden Gäste zu spielen."
 latria_sexual_frustration_flavor.1402.d: "Die Gäste bitten zu bleiben und von ihren früheren Reisen zu erzählen."
 latria_sexual_frustration_flavor.1403.c: "Die heilige Schrift aufschlagen und in jedem Abschnitt nach einer Antwort suchen."
 latria_sexual_frustration_flavor.1404.c: "Mein Keuschheitsgelübde aufgeben und fortan meinen Begierden folgen."
 latria_sexual_frustration_flavor.1404.d: "Mein Nachtgewand anlegen und sitzen bleiben, bis meine Gedanken zur Ruhe kommen."
 latria_sexual_frustration_flavor.1405.c: "Meinen Bericht in einen privaten Brief fassen und in einer Schatulle versiegeln."
 latria_sexual_frustration_flavor.1405.d: "Vor diesen Zeugen ein Keuschheitsgelübde ablegen."
 latria_sexual_frustration_flavor.1406.c: "Den scheidenden Gästen ein neues Gedicht vortragen."
 latria_sexual_frustration_flavor.1407.c: "Das Gebetbuch schließen und meine Gefühle in Ruhe bedenken."
 latria_sexual_frustration_flavor.1408.c: "Die Pflichten des Morgens auflisten und alle Papiere ordnen."
 latria_sexual_frustration_flavor.1409.c: "Mich ankleiden, an den Tisch zurückkehren und jede Angelegenheit des Hofes erledigen."
 latria_sexual_frustration_flavor.1409.d: "Mich ankleiden, einen Scherz machen und die Edelleute bitten, wieder Platz zu nehmen."
 latria_sexual_frustration_flavor.1410.c: "Ein Gewand anlegen, Tee aufbrühen und sitzen bleiben, bis ich schlafen kann."
