l_german:
 latria_sexual_frustration_flavor.1101.t: "Wach unter dem Betthimmel"
 latria_sexual_frustration_flavor.1101.desc.female: "Ich erwache aus leichtem Schlaf. Mein Nachtgewand ist ans Fußende gerutscht; Schulter und Knie liegen unbedeckt außerhalb der Bettvorhänge. Niemand sonst ist hier. Ich habe die Decke selbst durcheinandergetreten, und im Kissen ist nur eine Mulde.\n\nIch ziehe das Nachtgewand zu mir zurück. Der Stoff streift meine Haut, doch die Wärme lässt nicht nach. Draußen hat die Nachtwache schon zweimal gerufen. Ich drehe mich auf die Seite, um weiterzuschlafen. Sobald ich die Augen schließe, sehe ich wieder den Nacken jenes Menschen, der sich heute von mir abwandte. Ein Vorhanghaken klirrt leise, als hätte jemand den Stoff angehoben. Da ist niemand.\n\nIch lege mich auf den Rücken und weiß nicht, wohin mit den Händen. Die Nacht ist noch lang. Meine Müdigkeit ist verflogen."
 latria_sexual_frustration_flavor.1101.desc.male: "Ich erwache aus leichtem Schlaf. Mein Nachtgewand ist ans Fußende gerutscht. Jenseits der Bettvorhänge ist es dunkel, nur in der Ferne ertönt einmal die Wachtrommel. Die Decke liegt zerknüllt da. Ich habe sie beim Herumwälzen selbst so zugerichtet.\n\nIch setze mich auf und lege mich wieder hin. Die innere Unruhe bleibt. Ich zähle meine Atemzüge und denke beim siebten daran, wie nahe mir jemand beim Sprechen gekommen ist. Nichts ist dabei geschehen. Trotzdem erinnere ich mich nur allzu genau an diesen Abstand.\n\nDer Wind hebt einen Zipfel des Bettvorhangs an und lässt ihn wieder fallen. Die andere Seite des Bettes ist noch immer kalt."
 latria_sexual_frustration_flavor.1101.desc: "Die Bettvorhänge sind halb zugezogen. Die lange Nacht ist noch nicht vorüber, und meine Gedanken finden keine Ruhe.\n\nIch ziehe die Decke bis zur Brust und trete sie wieder fort. Neben dem Kissen liegt kein Brief, und neben mir liegt niemand. Nur meine eigene Hand ist da. Die Handfläche ist warm. Ich drücke sie auf die Matte, damit sie etwas abkühlt.\n\nWieder ertönt der Ruf der Nachtwache. Ich bin noch immer wach."
 latria_sexual_frustration_flavor.1101.a: "Die Augen schließen und an die ersehnte Person denken."
 latria_sexual_frustration_flavor.1101.b: "Den Gedanken beiseiteschieben, die Vorhänge zuziehen und weiterschlafen."

 latria_sexual_frustration_flavor.1102.t: "Blicke zwischen den Tänzen"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Drei Tanzweisen sind verklungen, und auch die Gesellschaft an den Tischen hat mehrfach gewechselt. Niemand wirft uns wegen eines etwas zu nahen Tanzschritts einen Blick zu. Die Musiker spielen sogar langsamer, damit man einen Satz in Ruhe zu Ende bringen kann.\n\nMir ist jedoch dieser eine Augenblick geblieben. Die Hand lag etwas länger auf meinem Handgelenk, als es die Höflichkeit verlangte, und auch der Blick wich nicht gleich aus. Als das Stück endete, ließ die Hand mich los. Ein wenig Wärme blieb zurück. Nun sitze ich wieder an meinem Platz. Mein Becher ist voll; ich habe nicht getrunken.\n\nDie nächste Weise hat schon begonnen. Ich betrachte die freie Stelle auf dem Boden und möchte noch immer dorthin zurück."
 latria_sexual_frustration_flavor.1102.desc.strict: "Je näher wir einander beim Tanzen kommen, desto mehr klingt das Lachen um uns wie Getuschel. Ich schaue zu den Musikern, während meine Hand noch immer geführt wird. Ärmel streift Ärmel. Dieses leise Geräusch höre ich deutlicher als die Trommel.\n\nAm Rand der Tafel beugt sich jemand zum Sprechen hinunter. Ich weiß nicht, ob es um mich oder um etwas anderes geht. Sobald die Musik endet, trete ich einen halben Schritt zurück. Ich bin so hastig, dass ich mir beinahe selbst auf den Schuh trete. Mein Gegenüber sieht mich an, fragt aber nicht nach.\n\nAls ich wieder sitze, spüre ich die Wärme noch an meinem Handgelenk. Ich lege die andere Hand darüber, als könnte ich sie so vor Blicken verbergen."
 latria_sexual_frustration_flavor.1102.desc: "Die Musik wird schneller. Meine Gedanken lassen sich von den Tanzschritten nicht vertreiben.\n\nIch vollführe zwei Drehungen, ohne einen Schritt zu verfehlen, und achte doch die ganze Zeit darauf, wie nahe mir der Atem meines Gegenübers kommt. Auf ihrem Höhepunkt hält die Melodie kurz inne. In diesem Augenblick sagt keiner von uns etwas.\n\nDie Musiker setzen die Bögen wieder an. Ich stehe noch an derselben Stelle und weiß nicht, wo ich diesen Tanz enden lassen soll."
 latria_sexual_frustration_flavor.1102.a: "Um einen weiteren Tanz bitten und etwas näher rücken."
 latria_sexual_frustration_flavor.1102.b: "Meinem Tanzpartner mit einer Verbeugung danken und an den Rand des Saals treten."

 latria_sexual_frustration_flavor.1103.t: "An der Tür des geistlichen Beistands"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mein geistlicher Beistand sagt, das Unterdrücken der Begierde sei nicht der einzige Weg zur Frömmigkeit. Die Lampe wirft unsere beiden Schatten an die Wand. Er spricht langsam, als ließe er mir Raum, etwas zu erwidern.\n\nIch möchte fragen, ob auch das zu diesem Weg gehört: nachts allein aufzuwachen und nicht zu wissen, wohin mit den Händen. Die Frage liegt mir schon auf der Zunge, als vor der Tür Schritte verstummen. Wir schweigen beide einen Augenblick. Dann entfernen sich die Schritte wieder.\n\nMein Beistand sieht mich an und wartet auf den Rest des Satzes. Ich schlucke ihn hinunter. Nur ein unvollendeter Anfang bleibt."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mein geistlicher Beistand erinnert mich daran, dass Keuschheit auch dann Gewicht hat, wenn niemand zusieht. Er erhebt die Stimme nicht. Trotzdem scheint der Raum enger geworden zu sein. Ich senke den Kopf und gebe eine leise Antwort, während ich die Finger im Ärmel schließe.\n\nEr fragt, weshalb ich heute Abend gekommen bin. Ich betrachte die Lampe, die Tür und meine Schuhspitzen, nur seine Augen nicht. Die Wahrheit ließe sich in wenigen Worten sagen. Ich fürchte jedoch, dass er danach weiterfragen würde.\n\nVor der Tür hustet jemand. Ich atme erleichtert auf und schäme mich gleich darauf für diese Erleichterung."
 latria_sexual_frustration_flavor.1103.desc: "Die Lampe im Zimmer brennt schwach. Ich überlege, wie ich das Gespräch mit meinem geistlichen Beistand beginnen soll.\n\nNach meinen Pflichten sollte ich fragen. Nach der anderen Sache sollte ich nicht fragen. Vor der Tür habe ich beide Fassungen eingeübt. Nun, da ich drinnen bin, fällt mir von keiner auch nur ein Satz ein. Mein Beistand schenkt mir Wasser ein. Es ist noch warm.\n\nIch halte den Becher in den Händen. Sein Rand berührt meine Lippen, doch die Worte kommen noch immer nicht heraus."
 latria_sexual_frustration_flavor.1103.a: "Meine Sehnsucht eingestehen und sie nicht länger verbergen."
 latria_sexual_frustration_flavor.1103.b: "Nur nach meinen gegenwärtigen Pflichten fragen und den Rest hinunterschlucken."

 latria_sexual_frustration_flavor.1104.t: "Der ausgebliebene Adler"
 latria_sexual_frustration_flavor.1104.desc.lustful: "Der Adler kreist über dem Jagdgrund und will nicht auf den Handschuh zurückkehren. Zweimal hebe ich den Arm. Beide Male neigt er nur einen Flügel und steigt noch höher. Aus dem Wald kommt Wind, der nach Gras und Pferdeschweiß riecht.\n\nBeinahe beneide ich ihn. Er muss sich nicht erklären, nicht umkehren und vor anderen seine Ungeduld nicht als Geduld ausgeben. Ein Bediensteter fragt, ob der Bogen verstaut werden soll. Ich schüttle den Kopf und folge weiter dem schwarzen Punkt. Nach einer Weile sehe ich darin kaum noch einen Adler, sondern jemanden, der ebenfalls nicht zurückkehren will.\n\nMein Arm schmerzt bereits. Ich lasse ihn trotzdem nicht sinken."
 latria_sexual_frustration_flavor.1104.desc.chaste: "Der Adler kreist und kommt nicht herunter. Mehrmals fragen die Bediensteten, ob der Bogen verstaut werden soll. Ich sage nur, sie sollen noch etwas warten, als könnte ein wenig mehr Geduld meine innere Unordnung von selbst vergehen lassen.\n\nDie Jäger sind bereits abgestiegen und reichen im Schatten einen Wasserschlauch herum. Sie drängen mich nicht. Das wiederkehrende Klirren des Pferdegeschirrs scheint es für sie zu tun. Ich schaue in den Himmel und zähle leise vor mich hin. Am Ende ist aus dem Zählen wieder derselbe Name geworden.\n\nDer Adler ruft einmal, landet aber noch immer nicht. Sehr langsam ziehe ich den Handschuh auf die andere Hand."
 latria_sexual_frustration_flavor.1104.desc: "Der Adler kehrt nicht zurück, und die Jäger warten darauf, dass ich etwas sage.\n\nDie Pfeife hat einen Abdruck in meiner Handfläche hinterlassen. Ich hebe sie an die Lippen und lasse sie wieder sinken. Die Kreise am Himmel werden kleiner. Niemand weiß, ob der Vogel im nächsten Augenblick zurückkehren wird.\n\nJemand fragt leise, ob wir nun aufbrechen. Ich antworte, ohne selbst zu wissen, ob ich dem Aufbruch oder weiterem Warten zugestimmt habe."
 latria_sexual_frustration_flavor.1104.a: "Den Adler kreisen und meine Gedanken schweifen lassen."
 latria_sexual_frustration_flavor.1104.b: "Meine Gedanken sammeln und den Adler zum Lager zurückrufen."

 latria_sexual_frustration_flavor.1105.t: "Kerzen und eine Krone"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Ein Bediensteter trägt die Festkrone aus dem Schlafgemach. Neben dem Leuchter liegen noch einige Erlasse, die auf meine Entscheidung warten. Ich lege das Nachtgewand an und setze mich. Eigentlich sollte ich das oberste Schriftstück nehmen. Stattdessen ziehe ich den unversandten Brief aus dem Stapel.\n\nAuf dem Blatt steht nur eine Anrede, danach nichts. Dreimal habe ich es heute versucht, dreimal an derselben Stelle aufgehört. In ihrer Schatulle fängt die Krone einen Lichtschein auf, als warte sie noch darauf, dass ich meinen kaiserlichen Pflichten nachkomme. Ich streiche den Brief glatt. Auch danach weiß ich nicht, wie der nächste Satz lauten soll.\n\nEin Tropfen Wachs fällt mit einem kaum hörbaren Laut in die kupferne Schale."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "In meinem Zimmer im Gasthaus ziehe ich das Nachtgewand an. Meine Gefährten haben sich bereits schlafen gelegt. Nebenan schnarcht noch jemand. Der unversandte Brief liegt neben meinem Reisebündel im Lampenlicht; seine Ecken rollen sich auf.\n\nMorgen müssen wir weiter. Wegzehrung, Pferde und die Überfahrt sind geregelt. Nur dieser Brief hat noch keinen Weg gefunden. Ich falte ihn auf. Seine Sätze scheinen mir noch weniger zum Versenden geeignet als heute Morgen. Eine Zeile ist zu offen geraten. Ich lasse einen Fingerknöchel darauf ruhen.\n\nUnten schließt jemand eine Tür. Ich drücke den Brief wieder auf das Bündel, ohne ihn ganz glatt zu streichen."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Ich falte mein geistliches Gewand und setze mich im Nachtgewand wieder an den Bettrand. Der unversandte Brief liegt unter der Schrift. Eine Ecke ragt hervor, als wollte er von selbst auf sich aufmerksam machen.\n\nIch ziehe ihn heraus. Das Buch fällt mit einem dumpfen Laut zu. Im Brief steht nichts, was meinen Gelübden widerspräche, doch jeder Satz kreist um denselben Menschen. Bei der dritten Zeile weiß ich bereits, dass ich ihn zu dieser Stunde nicht lesen sollte.\n\nDie Kerze flackert auf. Ich lege den Brief nicht zurück."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Die Bediensteten räumen das Festgewand weg. Ich sitze im Nachtgewand unter der Lampe. Die Schriftstücke auf dem Tisch sind noch nicht erledigt, doch zuerst falte ich den unversandten Brief neben mir auseinander.\n\nDraußen wird die Wache abgelöst. Gleichmäßige Schritte ziehen vorbei. Im Zimmer ist nur das Rascheln des Papiers zu hören. Ich schreibe ein Wort auf die freie Stelle des Briefes, betrachte es und schwärze es dann mit Tinte. Der schwarze Fleck fällt stärker auf als zuvor das Wort.\n\nIch lege die Feder hin. Die Schriftstücke liegen noch an derselben Stelle. Nicht eines trägt ein neues Siegel."
 latria_sexual_frustration_flavor.1105.desc: "Die Lampe ist beinahe erloschen. Ein unversandter Brief liegt noch immer neben mir.\n\nIch weiß längst, dass der Mensch, für den er bestimmt ist, ihn heute Nacht nicht mehr lesen wird. Trotzdem schreibe ich die Anrede erneut, noch langsamer als am Tag. Die Tinte trocknet. Auf dem Papier bleibt nur ein blasser Strich.\n\nDer Docht knackt. Ich hebe den Kopf und merke erst jetzt, wie lange ich hier schon sitze."
 latria_sexual_frustration_flavor.1105.a: "Den Brief einem Boten geben."
 latria_sexual_frustration_flavor.1105.b: "Ihn vernichten, den Gedanken beiseiteschieben und die Kerze zum Schlafen löschen."

 latria_sexual_frustration_flavor.1106.t: "Unruhig im Kerzenschein"
 latria_sexual_frustration_flavor.1106.desc.female: "Im Nachtgewand sitze ich am Bettrand. Die Kerze wirft meinen Schatten auf das Fensterpapier. Er bewegt sich leicht mit meinem Atem und wirkt ruhiger als ich selbst. Es ist längst tiefe Nacht. Meine unerwiderte Sehnsucht ist noch da, ohne Laut und ohne nachzulassen.\n\nIch streiche das Haar hinter die Schulter und wieder nach vorn. Als meine Finger die Seite meines Halses berühren, halte ich kurz inne. Niemand sonst ist hier, und trotzdem wird mir bei diesem Zögern das Gesicht warm. Ich denke an einen halb im Scherz gesprochenen Satz von heute. Ich habe darüber gelacht und ihn danach nicht mehr vergessen.\n\nAuf dem Leuchter hat sich eine weitere Schicht Wachs gebildet. Ich sitze noch immer da. Die Bettvorhänge sind noch nicht zugezogen."
 latria_sexual_frustration_flavor.1106.desc.male: "Im Nachtgewand sitze ich am Bettrand. Der Nachtwächter ist schon zweimal am Fenster vorbeigekommen. Beim ersten Mal hoffte ich noch, einschlafen zu können. Als er das zweite Mal vorüberging, hatte ich diese Hoffnung aufgegeben.\n\nIch halte weder einen Brief noch einen Becher Wein. Ich drücke nur meine Handfläche aufs Knie, bis sie warm wird, und drehe sie dann um. Die Stimme, an die ich denke, ist nicht wirklich im Zimmer. Trotzdem kann ich selbst die Pausen dieses einen Satzes nachsprechen. Beim dritten Mal kommt es sogar mir selbst ungehörig vor.\n\nIch blase gegen die Kerze, ohne sie zu löschen. Die Flamme neigt sich und richtet sich wieder auf."
 latria_sexual_frustration_flavor.1106.desc: "Die Kerze brennt herunter. Hinter den Bettvorhängen stellt sich noch immer kein Schlaf ein.\n\nIch lege mich hin und höre mein Herz deutlicher als sonst. Ich drehe mich auf die Seite. Das Klopfen bleibt. Alles im Zimmer steht an seinem Platz: der Becher, die Schuhe, das gefaltete Obergewand. Nichts davon nimmt mir die Unruhe.\n\nIch setze mich wieder auf. Das Licht brennt noch, doch ein großer Teil der Nacht ist bereits vergangen."
 latria_sexual_frustration_flavor.1106.a: "Meine Gedanken bei dieser Zuneigung verweilen lassen."
 latria_sexual_frustration_flavor.1106.b: "Nicht länger daran denken; die Kerze löschen und mich schlafen legen."


 latria_sexual_frustration_flavor.1107.t: "Ein erwiderter Tanz"
 latria_sexual_frustration_flavor.1107.desc.accepted: "Mein Gegenüber bittet mich um einen weiteren Tanz. Die anderen halten es für eine gewöhnliche Höflichkeit. Die Musiker haben die Bögen bereits an die Saiten gelegt und warten auf mein Nicken.\n\nIch denke jedoch an die Hand von vorhin. Sie lag einen Augenblick an meiner Taille, kurz genug, um es mit dem Tanzschritt zu erklären, und zu lange, als dass ich diese Erklärung wirklich glauben könnte. Ich schaue auf und begegne einem Blick, der bei mir bleibt. Ein kleines Lächeln ist zu sehen. Ausgesprochen wird nichts.\n\nBei Tisch stößt jemand mit einem Becher an. Trotz des lauten Klangs höre ich noch immer mein eigenes, unausgesprochenes Ja."
 latria_sexual_frustration_flavor.1107.desc.strict: "Mein Gegenüber bittet mich um einen weiteren Tanz. Sogleich wenden sich mehrere Blicke zu uns. Ich habe noch nicht geantwortet, da beugt sich bereits jemand zum Tischnachbarn und flüstert. Die Worte kann ich nicht hören. Die beiden sehen jedoch unablässig zu uns herüber.\n\nDie angebotene Hand bleibt ausgestreckt, höflich und ohne mich zu drängen. Meine eigene wird im Ärmel warm. Wenn ich zugreife, wird es bei diesem Tanz noch schwerer sein, Unbefangenheit vorzutäuschen. Wenn ich ablehne, wird man sich auch an die Ablehnung erinnern.\n\nEin Musiker räuspert sich. Sein Bogen ruht noch immer auf der Saite."
 latria_sexual_frustration_flavor.1107.desc: "Die Musiker beginnen einen neuen Tanz. Ich bin noch immer nicht aufgestanden.\n\nDie ersten Takte sind bereits vorbei. Die mir angebotene Hand wird weder zurückgezogen noch ungeduldig bewegt. Mein Gegenüber wartet einfach. Ich betrachte die Hand und dann meine eigenen Finger am Tischrand.\n\nHinter mir rückt jemand einen Stuhl. Bei dem Geräusch zucke ich blinzelnd zusammen. Ich bleibe trotzdem sitzen."
 latria_sexual_frustration_flavor.1107.a: "Den Tanz annehmen und näher rücken."
 latria_sexual_frustration_flavor.1107.b: "Mit einer Verbeugung ablehnen und meinem Tanzpartner einen angenehmen Tanz wünschen."

 latria_sexual_frustration_flavor.1108.t: "Gebet vor dem Schlaf"
 latria_sexual_frustration_flavor.1108.desc.favors: "Im Nachtgewand bete ich neben dem Bett. Ich kenne die Lehre gut, nach der unser Glaube die Freuden des Fleisches erlaubt. Im Augenblick hilft sie mir wenig. Sie sagt mir, dass ich darin keine Sünde sehen muss. Sie sagt mir nicht, wohin ich mich mit meinem Verlangen wenden soll.\n\nMeine Knie liegen am Bettrand. Die Gebetsworte verlassen meinen Mund, während ich an einen Blickwechsel des Tages denke, der mir allzu naheging. Der Blick selbst war nichts Besonderes. Trotzdem zerlege ich ihn in einzelne Augenblicke und gehe sie einen nach dem anderen erneut durch.\n\nAn der Stelle, an der ich enden sollte, spreche ich weiter. Die folgenden Sätze stammen von mir selbst und haben keine rechte Ordnung."
 latria_sexual_frustration_flavor.1108.desc.condemns: "Im Nachtgewand knie ich neben dem Bett und wiederhole mein Keuschheitsgelübde. Mit jedem Satz höre ich den Gedanken darunter deutlicher: Auch heute Nacht bin ich allein, die Decke ist kalt, und im Dunkeln bleibt mir nur meine eigene Gesellschaft.\n\nIch lehne die Stirn an das Bettgestell. Das Holz ist kühl, und das tut etwas gut. Sobald ich mich davon löse, kehrt die Unruhe zurück. Ich beginne noch einmal mit dem ersten Satz und spreche sehr leise, als könnte man mich nebenan hören.\n\nIm Nebenzimmer ist niemand. Ich senke die Stimme trotzdem weiter."
 latria_sexual_frustration_flavor.1108.desc: "Die Kerze neben dem Bett flackert leicht. Mein Gebet findet noch immer kein Ende.\n\nDie vertraute Passage habe ich längst gesprochen. Nun sollte Stille folgen. Ich lasse sie nicht zu. Sobald ich schweige, wird die andere Sache wieder ihren Platz einnehmen. Ich füge noch einige Sätze hinzu und weiß schon danach, dass sie kein Gebet sind.\n\nDie Flamme neigt sich zum Bettvorhang. Ich knie noch immer da. Mein Nachtgewand ist vorn zerknittert."
 latria_sexual_frustration_flavor.1108.a: "Das Keuschheitsgelübde beiseitelegen und meine Sehnsucht eingestehen."
 latria_sexual_frustration_flavor.1108.b: "Meine Gedanken zügeln und das Gebet fortsetzen."

 latria_sexual_frustration_flavor.1109.t: "Eine unvollendete Ratssitzung"
 latria_sexual_frustration_flavor.1109.desc: "Meine Räte haben drei Möglichkeiten vorgeschlagen. Ich habe noch immer keine Entscheidung getroffen. Die erste ist die sicherste, die zweite kostet am wenigsten, die dritte entspricht am ehesten dem alten Brauch. Ich habe alle gehört und zu allen genickt. Trotzdem kann ich nicht sagen, welche ich wähle.\n\nDie Feder des Schreibers verharrt in der Luft. Jemand schiebt mir einen Wasserbecher näher. Ich betrachte mein Spiegelbild darin und schweife plötzlich ab, zu einem Menschen, der mit Getreidevorräten nichts zu tun hat. Dieser Mensch ist nicht hier im Zimmer. An die Pausen beim Sprechen erinnere ich mich dennoch genau.\n\nDas Schweigen dauert inzwischen unangenehm lange. Ich räuspere mich, bringe aber noch immer keinen Satz hervor."
 latria_sexual_frustration_flavor.1109.a: "Die Ratssitzung beenden und mich meinen Gedanken überlassen."
 latria_sexual_frustration_flavor.1109.b: "Den Gedanken unterdrücken und den Schreiber bitten fortzufahren."
 latria_sexual_frustration_flavor.1110.t: "Ein Gemach nach Mitternacht"
 latria_sexual_frustration_flavor.1110.desc.clergy: "Im Nachtgewand kehre ich in mein kleines Gemach zurück. Das Nachtgebet ist vorbei, und die meisten Lampen auf dem Gang sind gelöscht. Der unversandte Brief liegt jedoch noch offen auf dem Tisch, über einer Schnur von Gebetsperlen.\n\nIch sollte die Perlen in ihre Schatulle legen und den Brief ebenfalls wegräumen. Meine Hand erreicht das Papier und bleibt darauf liegen. Die Sätze kenne ich längst auswendig. Trotzdem möchte ich noch einmal sehen, wie ich diesen Namen geschrieben habe. An einer Stelle ist die Tinte verlaufen, als hätte ich die Feder nicht ruhig halten können.\n\nIm Gemach ist es still. Ich stehe am Tisch; das Band meines Nachtgewands ist nicht fest gebunden."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Im Gasthaus brennen nur noch wenige Lampen. Ich sitze im Nachtgewand am Bettrand. Mein Reisebündel ist schon verschnürt. Nur der unversandte Brief schaut noch hervor.\n\nNebenan dreht sich jemand im Bett um, und das Holz knarrt. Ich warte, bis das Geräusch verklungen ist, bevor ich den Brief hervorziehe. Am Papierrand haftet Staub von der Straße. Ich puste darüber. Der Staub bleibt, doch die Sätze scheinen mir nun deutlicher. Eine Zeile hätte ich nicht schreiben sollen. Gerade sie steht mitten auf dem Blatt.\n\nIch falte den Brief zusammen. Die Faltkanten passen nicht mehr auf die alten Spuren."
 latria_sexual_frustration_flavor.1110.desc: "Die Geräusche vor der Tür entfernen sich allmählich. Ich warte noch immer am Bett.\n\nNiemand hat versprochen, heute Nacht zu kommen. Trotzdem lasse ich die Lampe brennen und lege mein Obergewand in Reichweite. Bei jedem Schritt auf dem Gang hebe ich den Kopf. Alle Schritte ziehen weiter.\n\nDer Ölstand ist ein Stück gesunken. Die andere Seite des Bettes bleibt leer. Ich habe mich noch nicht hingelegt."
 latria_sexual_frustration_flavor.1110.a: "Den Brief fertigschreiben und im Morgengrauen absenden lassen."
 latria_sexual_frustration_flavor.1110.b: "Die Tür verriegeln, den Gedanken beiseiteschieben und mich zur Nacht zurückziehen."

 latria_sexual_frustration_flavor.1101.c: "Ein Gewand überwerfen, still sitzen und meinen Atem beruhigen."
 latria_sexual_frustration_flavor.1102.c: "Mit den Musikern über ihre Weisen sprechen."
 latria_sexual_frustration_flavor.1103.c: "Fragen, wie ich mit diesen Gefühlen leben kann."
 latria_sexual_frustration_flavor.1103.d: "Mit dem unversandten Brief beginnen und nichts verbergen."
 latria_sexual_frustration_flavor.1104.c: "Die anderen bitten zu warten und geduldig mit dem Adler arbeiten."
 latria_sexual_frustration_flavor.1105.c: "Den Brief in sein Kästchen legen und die morgige Arbeit planen."
 latria_sexual_frustration_flavor.1107.c: "Meinen Tanzpartner bitten, sich zu setzen und über etwas anderes zu sprechen."
 latria_sexual_frustration_flavor.1107.d: "Den ganzen Tisch zu einem lebhaften Gruppentanz einladen."
 latria_sexual_frustration_flavor.1108.c: "Das Gebet langsam beenden, ohne gegen jeden Gedanken anzukämpfen."
 latria_sexual_frustration_flavor.1109.c: "Eine kurze Pause einlegen und die restlichen Geschäfte ordnen."
 latria_sexual_frustration_flavor.1109.d: "Die dringenden Entscheidungen ordnen und gleich hier treffen."
