l_german:
 latria_sexual_frustration_flavor.1111.t: "Die zweite Nachtwache"
 latria_sexual_frustration_flavor.1111.desc: "Ich erwache in der zweiten Wache, das Laken um eine Wade gewunden. Die Lampe ist zu einem Daumen Flammen heruntergebrannt. Meine Hand liegt schon tief auf meinem Bauch, warm von meinem eigenen Leib, und ich nehme sie fort.\n\nEs gab einen Augenblick in der Dämmerung. Jemand beugte sich an mir vorbei nach dem Salz, und ein Unterarm streifte die Rückseite meines Handgelenks, und keine von uns bewegte sich für die Länge eines Atemzugs. Ich bin diesen Atemzug öfter durchgegangen als das ganze Gespräch.\n\nIch drücke meine Handfläche flach auf die Matratze neben meiner Hüfte. Das Leinen dort ist noch kühl. Ich lasse es kühl."
 latria_sexual_frustration_flavor.1111.a: "Meine Hand gehen lassen, wohin sie will."
 latria_sexual_frustration_flavor.1111.b: "Mich umdrehen und auf den Schlaf warten."
 latria_sexual_frustration_flavor.1111.c: "Still liegen und lauschen, wie sich das Haus setzt."

 latria_sexual_frustration_flavor.1112.t: "Der Becher zwischen uns"
 latria_sexual_frustration_flavor.1112.desc: "Der Becher geht von Hand zu Hand die Bank hinunter, und als er mich erreicht, ist der Rand noch feucht von einem anderen Mund. Ich trinke dort, wo das Feuchte ist. Über die Tafel hinweg sieht jemand zu, wie ich es tue, und sieht nicht weg und lächelt auch nicht.\n\nWir sprechen eine Weile über Pferde, den Preis einer braunen Stute, den Hufschmied am Kreuzweg. Unter dem Tisch kommt ein Knie an meines zur Ruhe, ohne Gewicht dahinter, nur Berührung, und ich rede weiter über Pferde.\n\nEin Diener füllt den Becher nach. Das Knie zieht sich zurück, um einen Onkel zu begrüßen. Ich halte den Becher in beiden Händen, und der Wein ist warm geworden, und die Bank neben mir bleibt für den Rest der Mahlzeit leer."
 latria_sexual_frustration_flavor.1112.a: "Offen sagen, was das Knie gesagt hat."
 latria_sexual_frustration_flavor.1112.b: "Der Gesellschaft danken und früh gehen."
 latria_sexual_frustration_flavor.1112.c: "Bleiben und über Pferde reden, bis sich die Halle leert."

 latria_sexual_frustration_flavor.1113.t: "Ein Tanz zu lang"
 latria_sexual_frustration_flavor.1113.desc: "Die Musik wendet sich, und ich werde von einer Hand zur nächsten gereicht. Die dritte hält meine Hand einen Schlag über die Figur hinaus, den Daumen an die Innenseite meines Handgelenks gepresst, wo der Puls ist, und lächelt, als wäre es ein Zufall. Ich verfehle den nächsten Schritt und verdecke es mit einer Wendung.\n\nJemand lacht am fernen Ende der Halle. Ich drehe mich nicht um, um zu sehen, wer. Mein Gesicht ist heiß, und ich weiß, dass es im Kerzenlicht zu sehen ist, und die Kerzen sind das einzige ehrliche Licht im Raum.\n\nDer Satz endet. Ich stehe bei der Säule, die Hand noch halb geschlossen, die Form jenes Daumens in die Haut gedruckt, und die Musikanten beginnen von neuem."
 latria_sexual_frustration_flavor.1113.a: "Auf diese Person trinken, laut, vor der ganzen Halle."
 latria_sexual_frustration_flavor.1113.b: "Mich vor der Gesellschaft verneigen und die Fläche verlassen."
 latria_sexual_frustration_flavor.1113.c: "Die stillste Ecke finden und langsam atmen."

 latria_sexual_frustration_flavor.1114.t: "Der lange Ritt zurück"
 latria_sexual_frustration_flavor.1114.desc: "Regen auf den Blättern, und das Wild ist seit einer Stunde fort. Ich reite hinten, während das Gespräch der Treiber vor mir leiser wird. Meine Schenkel schmerzen vom Sattel auf eine Weise, die mich meinen Leib vor dem Abend nicht vergessen lässt, und die nasse Wolle meines Mantels ist kalt am Kragen.\n\nAm Bach hält jemand mein Halfter fest, und die Hand bleibt am Riemen, nachdem das Pferd zur Ruhe gekommen ist. Wasser läuft von der Spitze eines Zopfes. Keine von uns erwähnt den Regen.\n\nWir reiten weiter. Nasses Leder knarrt bei jedem Schritt, und ich zähle das Knarren, statt zu denken, und verliere die Zahl irgendwo hinter dem dritten Feld."
 latria_sexual_frustration_flavor.1114.a: "Die Jagd laufen lassen, bis das Licht geht."
 latria_sexual_frustration_flavor.1114.b: "Die Augen auf dem Pfad und die Hände am Zügel halten."
 latria_sexual_frustration_flavor.1114.c: "Den Boden lesen, die zerbrochenen Stängel, den Abdruck eines Hufs."
 latria_sexual_frustration_flavor.1114.d: "Den Falken wieder fliegen lassen, und wieder."

 latria_sexual_frustration_flavor.1115.t: "Kniend zur dritten Stunde"
 latria_sexual_frustration_flavor.1115.desc: "Ich knie, bis mir die Knie auf dem Stein schmerzen, und der Schmerz ist das Einzige, was ich in meiner Aufmerksamkeit halten kann. Das Lampenöl ist ranzig geworden. Mein Leib will heute Morgen nicht still sein. Er will, und er will in Richtung auf jemanden, der die Dachbalken flickt und bei der Arbeit pfeift.\n\nIch spreche das Amt. Ich beginne es wieder von vorn, weil mein Sinn in der vierten Zeile abglitt. Jemand hustet hinter mir, und ich drehe mich nicht um.\n\nDer Stein ist kalt durch mein Gewand. Ich bleibe unten, nachdem die anderen aufstehen, und die Kälte erreicht meine Schienbeine, und es ist nicht genug."
 latria_sexual_frustration_flavor.1115.a: "Es im Beichtstuhl benennen und danach Buße tun."
 latria_sexual_frustration_flavor.1115.b: "Die Nachtwache halten bis zur Glocke."
 latria_sexual_frustration_flavor.1115.c: "Den Kommentar aufnehmen und bis zum Ende des Kapitels lesen."

 latria_sexual_frustration_flavor.1116.t: "Was nicht gefragt wurde"
 latria_sexual_frustration_flavor.1116.desc: "Die Person, die mich unterrichtet, geht neben mir durch den Kreuzgang und fragt nichts, was schlimmer ist als fragen. Ich spreche von der Sünde der Trägheit, und sie antwortet von der Ernte, vom Regen, der spät kam, vom Preis des Roggens.\n\nIhre Manschette ist ausgefranst. Ich sehe zu, wie die losen Fäden sich bewegen, während sie gestikuliert, und denke an das Handgelenk im Ärmel und dann wieder an die Trägheit und verliere die Ernte ganz. Sie bleibt stehen, um mich aufschließen zu lassen.\n\nAn der Tür segnet sie mich. Ich halte ihre Hand einen Augenblick über den Segen hinaus. Sie lässt es zu, und dann geht sie die Stufen hinunter, zwei auf einmal nehmend."
 latria_sexual_frustration_flavor.1116.a: "Ihr das Ganze sagen."
 latria_sexual_frustration_flavor.1116.b: "Sie um eine Buße bitten und sie halten."
 latria_sexual_frustration_flavor.1116.c: "Sie über die Ernte zu Ende hören."

 latria_sexual_frustration_flavor.1117.t: "Die Bittschrift nach dem Rat"
 latria_sexual_frustration_flavor.1117.desc: "Der Rat leert sich. Jemand bleibt, um noch eine Bittschrift vorzubringen, und ich höre die Form des Mundes um die Wörter herum statt der Wörter. Das Siegel ist warm von meiner eigenen Hand, und das Wachs hat sich nicht gesetzt.\n\nIch bin seit dem Festmahl mit niemandem allein gewesen. Die Krone ist ein Gewicht im Nacken, und der Nacken will ein anderes Gewicht, eine Hand dort statt Gold.\n\nIch gewähre die Bittschrift. Sie verneigt sich. Ich halte die Augen auf die Karte, bis sich die Tür schließt, und dann auf die Tür, und die Kerze neben der Karte brennt herunter, während ich sitze."
 latria_sexual_frustration_flavor.1117.a: "Nach jemandem schicken, wenn die Kerzen aus sind."
 latria_sexual_frustration_flavor.1117.b: "Bei der Arbeit bleiben, bis die Bittschrift gesiegelt ist."
 latria_sexual_frustration_flavor.1117.c: "Die nächsten drei Bittschriften selbst lesen."

 latria_sexual_frustration_flavor.1118.t: "Pflaumenwein auf der Terrasse"
 latria_sexual_frustration_flavor.1118.desc: "Pflaumenwein, der dritte Becher, und die Ärmel streifen einander immer wieder. Bei meinem Volk spricht man in Verszeilen, jede Zeile ein Schritt näher, und ein Diener steht am Geländer und tut, als hörte er nicht zu.\n\nIch lasse meinen Ärmel am Handgelenk offen fallen. Der andere Ärmel weicht nicht zurück. Irgendwo unter der Terrasse setzt eine Flöte ein und bricht ab und setzt wieder ein, dieselben drei Wendungen.\n\nIch stelle den Becher auf die Balustrade, halb geleert, und der Wein hält das letzte Licht. Keine von uns hat das klare Wort gesagt. Ein Blütenblatt dreht sich auf der Steinplatte um. Der Diener am Geländer hört noch immer nicht zu."
 latria_sexual_frustration_flavor.1118.a: "Mit einer Zeile antworten, die nicht missverstanden werden kann."
 latria_sexual_frustration_flavor.1118.b: "Meinen Ärmel richten und vom Wetter sprechen."
 latria_sexual_frustration_flavor.1118.c: "Die Terrasse allein abschreiten, bis die Lampen entzündet werden."

 latria_sexual_frustration_flavor.1119.t: "Die brennende Lampe"
 latria_sexual_frustration_flavor.1119.desc: "Ich habe die Lampe brennen lassen, und das Laken liegt an meiner Taille. Meine Hand geht über die warme Haut meines Bauches, tiefer, und diesmal halte ich sie nicht auf. Ich bin schon feucht, vom Gedanken an einen Mund an meiner Kehle in der Dämmerung, und meine Finger gleiten leicht.\n\nIch denke an das Gewicht eines Leibes über meinem, an genau dieses Gewicht, und meine Hüften heben sich dem Nichts entgegen. Ich drücke und kreise, und mein Atem geht zerfasert in der stillen Kammer. Der Absatz meiner Hand reibt dort, wo ich es will.\n\nEs kommt in einem langen Zittern, das meinen Schenkel beben lässt. Danach liege ich mit dem Arm über den Augen, die Lampe brennt noch, das Laken unter mir ist feucht."
 latria_sexual_frustration_flavor.1119.a: "Es zu Ende kommen lassen und in der nassen Dunkelheit liegen."
 latria_sexual_frustration_flavor.1119.b: "Meine Hand fortnehmen und die Balken zählen."
 latria_sexual_frustration_flavor.1119.c: "Die Lampe kürzen und im Dunkeln liegen."

 latria_sexual_frustration_flavor.1120.t: "Das Zimmer des Gastes"
 latria_sexual_frustration_flavor.1120.desc: "Ein Klopfen, nachdem die Halle dunkel ist, und als ich öffne, bin ich im Nachtgewand und habe mich für niemanden angekleidet. Ich sehe den Blick, der über meinen Leib geht, und greife nicht nach einem Tuch.\n\nWir tun nicht, als ob. Ein Mund findet meine Kehle, meine Hände sind an einem Gürtel, und als ich auf den Tisch gehoben werde, fällt der Becher um und rollt. Das Tempo ist langsam, und ich bin nicht geduldig. Ich höre meine eigene Stimme, was mich überrascht, und das Lachen an meinem Hals, und das Tempo ändert sich nicht.\n\nDanach tropft der Wein von der Tischkante auf den Boden, ein Tropfen nach dem anderen. Keine von uns bewegt sich, ihn aufzuwischen."
 latria_sexual_frustration_flavor.1120.a: "Die Tür unverriegelt und das Nachtgewand anbehalten."
 latria_sexual_frustration_flavor.1120.b: "Freundlich danken und die Tür schließen."
 latria_sexual_frustration_flavor.1120.c: "Auf der Tischkante sitzen und bis zum Morgengrauen reden."

 latria_sexual_frustration_flavor.1121.t: "Hinter dem bemalten Wandschirm"
 latria_sexual_frustration_flavor.1121.desc: "Das Festmahl ist über die Sitte hinausgegangen. Ein Wandschirm ist über die Ecke der Halle gezogen, und der Lärm dahinter ist nicht der Lärm des Essens. Eine Hand schließt sich um mein Handgelenk, und ich lasse mich ziehen, und die gemalten Reiher auf dem Schirm gehen nah genug vorbei, um sie zu berühren.\n\nEs sind mehr Hände als die eines Menschen. Ich höre auf zu zählen. Die Binsen sind flach getreten, und ein Becher rollt an mein Knie, und niemand hebt ihn auf.\n\nSpäter sitze ich an der Wand, das Haar offen, den Mund geschwollen, den Mantel eines fremden Menschen über den Schultern. Die Musik hat nicht aufgehört."
 latria_sexual_frustration_flavor.1121.a: "Hinter den Schirm gehen und die Halle hören lassen."
 latria_sexual_frustration_flavor.1121.b: "Ablehnen und Becher und Platz behalten."
 latria_sexual_frustration_flavor.1121.c: "Das Brett aufstellen und spielen, bis meine Hände ruhig sind."

 latria_sexual_frustration_flavor.1122.t: "Vier Wörter eines Gedichts"
 latria_sexual_frustration_flavor.1122.desc: "Die Schreibtafel liegt auf meinen Knien, und die Rohrfeder ist trocken geworden. Ich habe vier Wörter eines Gedichts über die Wölbung einer Schulter geschrieben, und keines der vier ist richtig. Das fünfte ist schlimmer.\n\nDie Kammer ist kalt. Mein eigener Atem ist laut darin. Ich schiebe die Tafel beiseite und drücke den Rücken meiner Hand gegen den Mund, und das Verlangen geht nirgendwohin, es ändert nur die Gestalt und setzt sich tiefer.\n\nIch nehme die Feder wieder auf. Die Zeile bleibt unvollendet, und die Tinte trocknet im Spalt des Rohrs, und die Schulter in der Zeile ist noch immer nur eine Schulter."
 latria_sexual_frustration_flavor.1122.a: "Die Schulter schreiben, und den Rest."
 latria_sexual_frustration_flavor.1122.b: "Die Tafel schließen und mit stillen Händen sitzen."
 latria_sexual_frustration_flavor.1122.c: "Etwas Langweiliges lesen, bis die Kammer nur noch eine Kammer ist."
 latria_sexual_frustration_flavor.1122.d: "Die unvollendete Zeile beim Nachtmahl aufsagen."

 latria_sexual_frustration_flavor.1123.t: "Das Gewicht des Falken"
 latria_sexual_frustration_flavor.1123.desc: "Der verhängte Falke sitzt auf meinem Handschuh, und sein Gewicht ist das einzige ehrliche Ding an diesem Morgen. Wir warten im nassen Gras auf den Reiher. Meine Schulter brennt, und das Leder hat sich am Daumen durchgesogen.\n\nEin Arm kommt im Kauern an meinen und bleibt. Der Vogel verlagert die Füße. Ich halte die Augen auf das Schilf. Mein Puls ist in meinen Ohren, lauter als das Moor, und ich bin sicher, dass man ihn hören kann.\n\nDer Reiher kommt nie. Wir gehen zurück, den Falken auf meiner Faust, das Gras meine Stiefel bis zum Knöchel durchnässend, und keine von uns sagt etwas über den Arm."
 latria_sexual_frustration_flavor.1123.a: "Wieder hinausreiten und bis zum Dunkel jagen."
 latria_sexual_frustration_flavor.1123.b: "Still halten und das Moor still werden lassen."
 latria_sexual_frustration_flavor.1123.c: "Den Falken abwerfen und nur den Falken ansehen."

 latria_sexual_frustration_flavor.1124.t: "Der Almosenkasten"
 latria_sexual_frustration_flavor.1124.desc: "Ich zähle Münzen in den Almosenkasten, und das Zählen ist eine Art, nicht zu denken. Meist Kupfer, und zwei Silberpfennige vom Wollhändler. Die Hand eines Spenders ist neben meiner im Kasten, unsere Finger unter den Münzen, und wer uns zusieht, steht auf der dritten Stufe.\n\nIch habe das nicht gebeichtet. Ich wüsste nicht, wie ich es nennen sollte. Mein Gesicht ist gefasst. Ich habe mich in einem Spiegel geübt, gefasst zu sein.\n\nDie Hand zieht sich zurück. Ich schließe den Deckel, und das kleine Messingschloss klickt, und meine eigene Hand ist nicht ruhig am Schlüssel, und die Person auf der Stufe steht noch dort."
 latria_sexual_frustration_flavor.1124.a: "Eine Kerze bezahlen und mein Gesicht sehen lassen."
 latria_sexual_frustration_flavor.1124.b: "Die Nachtwache halten, bis die Kerzen flackern."
 latria_sexual_frustration_flavor.1124.c: "Das Psalterium noch einmal durchlesen."

 latria_sexual_frustration_flavor.1125.t: "Um Mitternacht vereinbarte Bedingungen"
 latria_sexual_frustration_flavor.1125.desc: "Wir sitzen seit dem Mittag am Vertrag. Die Kerzen sind Stümpfe, und das Feuer ist ausgehen gelassen worden. Mein Gegenüber liest die letzte Klausel laut vor, und ich stimme ihr zu, ohne sie zu hören, wegen der Art, wie sich ein Kiefer um eine Sprache bewegt, die nicht meine ist.\n\nDas ist nicht die erste Nacht. Ich kenne die genaue Entfernung, in der ich nutzlos werde, und wir sind seit der zweiten Kerze in ihr.\n\nIch unterschreibe. Sie unterschreibt. Das Wachs ist noch weich, als ich meinen Ring hineindrücke, und meine Hand ist ruhig, und der Schreiber nimmt das Blatt fort, und das ist der ganze Umfang meines Sieges."
 latria_sexual_frustration_flavor.1125.a: "Eine Nachricht schicken, wenn die Kammer leer ist."
 latria_sexual_frustration_flavor.1125.b: "Bei der Klausel bleiben, Wort für Wort."
 latria_sexual_frustration_flavor.1125.c: "Den Vertrag forttragen und jede Zeile lesen."

 latria_sexual_frustration_flavor.1126.t: "Gras, Wind und ein offener Kragen"
 latria_sexual_frustration_flavor.1126.desc: "Die Pferde sind zum Grasen freigelassen, und wir sitzen auf dem Filz, die Sättel noch aufgelegt. Das Volk meiner Begleitung sagt, ein Reiter müsse im Sattel schlafen können. Ich kann nicht einmal still auf dem Boden sitzen.\n\nEs ist die Rede von einem Fluss, den ich nie gesehen habe, einem Fluss mit drei Übergängen. Ein Hemd ist an der Kehle offen. Der Wind bewegt das Gras in langen Strichen, und ich sehe die Kehle statt des Flusses.\n\nEin Pferd schnaubt. Ich sehe zuerst weg, und meine Ohren sind heiß im Wind, und das Gespräch über den Fluss geht ohne mich weiter."
 latria_sexual_frustration_flavor.1126.a: "Es laut sagen, in dieser Sprache, schlecht."
 latria_sexual_frustration_flavor.1126.b: "Die Zunge hüten und die Pferde ansehen."
 latria_sexual_frustration_flavor.1126.c: "Hart reiten, bis der Wind es aus mir genommen hat."

 latria_sexual_frustration_flavor.1127.t: "Die Mulde im Kissen"
 latria_sexual_frustration_flavor.1127.desc.female: "Das Bett ist zu warm, und ich habe die Decke auf den Boden gestrampelt. Mein Nachtgewand ist bis zur Hüfte hochgerutscht. Ich lege meine Hand dorthin, und mein Leib antwortet, ehe ich etwas entschieden habe, eine schnelle Hitze tief unten, beharrlicher als ich.\n\nIch denke an die Art, wie eine bestimmte Person meinen Namen im Gang sagte, die zweite Silbe gehalten, die Tür hinter ihr nicht ganz geschlossen. Meine Finger bewegen sich, und mein Atem fängt sich an dieser gehaltenen Silbe.\n\nIch höre vor dem Ende auf. Ich liege mit stiller Hand, und mein Herz geht, und das Kissen neben mir hat keine Mulde."
 latria_sexual_frustration_flavor.1127.desc.male: "Die Decke liegt auf dem Boden, und mein Nachtgewand ist bis zur Hüfte hochgerutscht. Meine Hand geht hinunter, und ich bin schon hart, aus nichts, aus einem Gang und einem Namen und einer angelehnten Tür.\n\nIch denke an einen Mund, und meine Hüften verschieben sich von selbst. Mein Atem kommt kurz. Ich könnte das in einem Augenblick beenden und tue es nicht, und dieses Nicht ist seine eigene Arbeit.\n\nIch nehme meine Hand fort und liege flach. Die Kammer ist sehr still, und der Schmerz geht nicht, und das Kissen neben mir ist kühl, und ich berühre es nicht."
 latria_sexual_frustration_flavor.1127.desc: "Das Bett ist zu warm, und die Lampe ist aus. Ich habe die Decke fortgestrampelt, und meine Hand verirrt sich, und mein Leib antwortet sofort, beharrlicher als ich, ehe ich entschieden habe, es zu erlauben.\n\nIch denke an einen Gang, an einen zweimal gesprochenen Namen, an einen bis zum Handgelenk zurückgezogenen Ärmel. Der Gang ist dunkel zu dieser Stunde. Mein Atem verkürzt sich, und ich lasse den Gedanken bis an sein Ende laufen und nicht weiter.\n\nIch nehme meine Hand fort und liege still. Das Kissen neben mir hat keine Mulde, und die Decke bleibt bis zum Morgen auf dem Boden."
 latria_sexual_frustration_flavor.1127.a: "Meine Hand bleiben lassen, wo sie ist."
 latria_sexual_frustration_flavor.1127.b: "Die Hände falten und auf der Seite schlafen."
 latria_sexual_frustration_flavor.1127.c: "Aufstehen und am Laden sitzen, bis es hell ist."

 latria_sexual_frustration_flavor.1128.t: "Der Trinkspruch"
 latria_sexual_frustration_flavor.1128.desc: "Ich erhebe mich, um den Trinkspruch zu halten, und die Halle ist ein Verschwimmen von Gesichtern. Ein Gesicht verschwimmt nicht. Ich spreche für die Länge eines Bechers über Treue, und meine Augen gehen immer wieder an dieselbe Stelle über dem dritten Tisch.\n\nJemand hustet an der hohen Tafel. Das Gerede wird in den Küchen sein, ehe die Brettchen abgeräumt sind, und ich merke, dass es mich weniger kümmert, als es sollte, was selbst etwas ist, wofür ich Rede stehen muss.\n\nIch setze mich. Meine Hand nimmt den Stiel des Bechers und hält ihn zu fest, und über die Halle hinweg ist das Gesicht noch immer mir zugewandt."
 latria_sexual_frustration_flavor.1128.a: "Die Person nennen, die ich ansah, und auf sie trinken."
 latria_sexual_frustration_flavor.1128.b: "Nur von Treue sprechen und es meinen."
 latria_sexual_frustration_flavor.1128.c: "Den Becher zum fernen Ende tragen und bei der Person sitzen, die ich am längsten kenne."

 latria_sexual_frustration_flavor.1129.t: "Der Kommentar zum dritten Kapitel"
 latria_sexual_frustration_flavor.1129.desc: "Die Person, die mich unterrichtet, liest den Kommentar laut, und ich folge der Zeile mit dem Finger auf der Seite. Die Stimme tut das Lesen. Mein Finger hat aufgehört, sich zu bewegen, drei Zeilen unter dem, wo die Stimme ist, auf derselben Seite, auf der sie vor einer Stunde war.\n\nEine Seite wird gewendet, und mein Finger ist im Weg. Die lesende Person wartet. Ich bewege ihn nicht. Die Kerze zwischen uns neigt sich und richtet sich auf, und irgendwo im Haus wird eine Tür geschlossen.\n\nDas Lesen geht weiter. Ich habe die Auseinandersetzung im dritten Kapitel ganz verloren, und die Kammer riecht nach Wachs und Tinte, und der Finger ist noch, wo er war."
 latria_sexual_frustration_flavor.1129.a: "Das Abschweifen bekennen und die Buße nehmen."
 latria_sexual_frustration_flavor.1129.b: "Um eine strengere Regel bitten und sie halten."
 latria_sexual_frustration_flavor.1129.c: "Die Zeile von oben an der Seite wieder aufnehmen."

 latria_sexual_frustration_flavor.1130.t: "Was ich der Person erzählte, die mir nahesteht"
 latria_sexual_frustration_flavor.1130.desc: "Ich erzähle der Person, die mir nahesteht, das Ganze, den Gang und das Handgelenk und den Becher, und sie hört zu, das Kinn auf eine Hand gestützt, und sieht nicht ein einziges Mal zur Tür. Der Wein zwischen uns ist unberührt geblieben. Es laut zu sagen ist eine Erleichterung und ändert nichts.\n\nDann schließt sich eine Hand auf meiner Schulter, freundlich, und bleibt dort. Ich sehe die Karte an. Der Feldzug kann eine Jahreszeit warten; der Fluss hat sich nicht bewegt.\n\nSie geht. Ich sitze mit den Feldzugsmarken vor mir, hölzern, nach der Schachtel riechend, und bewege eine und bewege sie dann dorthin zurück, wo sie war."
 latria_sexual_frustration_flavor.1130.a: "Den Rest erzählen und um nichts bitten."
 latria_sexual_frustration_flavor.1130.b: "Nichts weiter sagen und die Marken richten."
 latria_sexual_frustration_flavor.1130.c: "Stattdessen den Feldzug erwägen und es richtig machen."

 latria_sexual_frustration_flavor.1131.t: "Die Wärme, die bleibt"
 latria_sexual_frustration_flavor.1131.desc: "Ein Traum lässt mich warm zurück, und ich erwache mit dem Nachtgewand bis zur Taille hochgerutscht. Meine eigene Hand war die Ursache. Ich liege still und lasse die Kammer zurückkommen, den kalten Boden, die sterbende Lampe, und die Hitze geht nicht mit dem Traum.\n\nEs war das Kind der Person, die den Haushalt führt, oder jemand mit diesem Mund. Sie hatte mein Handgelenk aufs Bett gedrückt und hatte es nicht eilig, und ich erinnere mich an genau ihr Gewicht, an die Art, wie die Matratze uns beide nahm. Wach hat sie mich nie so angesehen.\n\nIch ziehe das Nachtgewand über meine Hüften hinunter. Der Stoff ist feucht, wo ich darauf gelegen habe. Ich drehe das Gesicht zur Wand, und die Wärme bleibt unter der Decke, geduldig, wartend, dass ich ihr nachgebe."
 latria_sexual_frustration_flavor.1131.a: "Meine Hand zurückgehen lassen, wohin sie will."
 latria_sexual_frustration_flavor.1131.b: "Das Nachtgewand gerade ziehen und auf den Morgen warten."
 latria_sexual_frustration_flavor.1131.c: "An die Scherze beim Nachtmahl denken und meinen Atem langsamer werden lassen."

 latria_sexual_frustration_flavor.1132.t: "Die dritte Kerze"
 latria_sexual_frustration_flavor.1132.desc: "Ich knie, bis mir die Knie schmerzen, und der Schmerz reicht nicht, um meinen Kopf zu klären. Der Tempel ist jenseits der dritten Kerze leer. In der Dunkelheit hinter meinen Augen kehrt derselbe Leib immer wieder, und es ist nicht der des Gottes.\n\nDie Hände eines Pilgers, vor Wochen, die am Wegrand eine Decke über meine Schultern legten. Das Streifen von Knöcheln an meiner Kehle. Ich habe dieses Bild hundertmal weggebetet, und es kommt jede Nacht klarer zurück, die Wärme einer fremden Handfläche dort, wo der Kragen sich öffnet.\n\nIch drücke die Stirn gegen meine gefalteten Hände. Der Stein ist kalt. Mein Atem ist es nicht. Ich bleibe knien, während die letzte Kerze kürzer wird, und bitte nicht um Vergebung, nur darum, dass das Zittern in meinen Schenkeln aufhört, ehe ich aufstehe."
 latria_sexual_frustration_flavor.1132.a: "Den Gedanken benennen und ihn durchbrennen lassen."
 latria_sexual_frustration_flavor.1132.b: "Aufstehen und Wache halten, bis der Leib erschöpft ist."
 latria_sexual_frustration_flavor.1132.c: "An der Wärme jener Hände als Trost festhalten."

 latria_sexual_frustration_flavor.1133.t: "Unter dem Felsvorsprung"
 latria_sexual_frustration_flavor.1133.desc: "Wieder Regen, und die Jagd verstreut. Ich suche unter einem Felsvorsprung Schutz mit der Person, die die Meute führt, beide durchnässt, und die Kälte macht jeden Ort, an dem wir uns berühren, zu einem kleinen Feuer. Ihr Arm liegt von der Schulter bis zum Handgelenk an meinem, und ich habe aufgehört, so zu tun, als bemerkte ich es nicht.\n\nSie sagt etwas über den Sturm. Ich antworte über den Sturm. Ihre Hand findet mein Kreuz, um mich auf dem nassen Stein zu halten, und bleibt dort, warm ausgebreitet durch die nasse Wolle, und mein Atem geht flach auf eine Weise, die die Kälte nicht entschuldigen kann.\n\nDer Regen wird nicht dünner. Ihr Daumen bewegt sich einmal gegen mein Rückgrat. Ich halte die Augen auf den grauen Vorhang aus Wasser und trete nicht beiseite, und der Vorsprung ist zu eng für alles außer diesem."
 latria_sexual_frustration_flavor.1133.a: "Noch eine Weile im Regen bleiben."
 latria_sexual_frustration_flavor.1133.b: "Beiseite rücken und den Fall des Wassers ansehen."
 latria_sexual_frustration_flavor.1133.c: "Den Sturm abwarten und dann allein zurückgehen."

 latria_sexual_frustration_flavor.1134.t: "Das Band, das ich nie löste"
 latria_sexual_frustration_flavor.1134.desc: "Der Rat ist getan, und das Arbeitszimmer gehört mir. Ich schenke Wein ein, den ich nicht will, und die Erinnerung kommt dennoch, ungeladen, der Mund der gesandten Person beim Vertragsfest, die Art, wie sie einen Tropfen von ihrem Daumen leckte, während die Schreiber über Grenzen stritten.\n\nIch setze den Becher ab. Meine Hand geht zu den Bändern an meiner Kehle und hält an. In der Erinnerung sind ihre Finger schnell und sicher, und ich widerspreche nicht, ich lehne mich an den Tisch, um nicht von ihm zu gleiten, und die ganze Halle ist ein Verschwimmen von Kerzenrauch hinter ihr.\n\nDie Kerze flackert. Ich binde das Band wieder zu, das ich nie gelöst habe. Der Wein steht unberührt, und die Kammer ist sehr still, und mein Puls ist laut in meinen Ohren wie jemand, der an eine Tür klopft, die ich nicht geöffnet habe."
 latria_sexual_frustration_flavor.1134.a: "Offen eingestehen, an welchen Mund ich denke."
 latria_sexual_frustration_flavor.1134.b: "Die Kerze auslöschen und allein zu Bett gehen."
 latria_sexual_frustration_flavor.1134.c: "Ein Schachspiel aufstellen und mich sammeln."

 latria_sexual_frustration_flavor.1135.t: "Der langsame Takt"
 latria_sexual_frustration_flavor.1135.desc: "Die Musikanten greifen eine langsame Weise auf, und eine Hand schließt sich um meine, ehe ich sie verweigern kann. Wir wenden uns zusammen nahe dem Podest, nah, näher, als die Figur verlangt, und wer mich hält, riecht nach Wein und Holzrauch und nach etwas Wärmerem darunter.\n\nEin Schenkel gleitet auf der Wendung zwischen meine und bleibt einen halben Schlag zu lang. Ich halte mein Gesicht für die Halle gefasst. Unter der Musik kann ich meinen eigenen Atem hören, und ich weiß, dass die andere Person ihn auch hört, denn ihr Mund krümmt sich und öffnet sich nicht.\n\nDer Satz endet. Wir trennen uns nicht sogleich. Ein Daumen fährt die Naht meiner Handfläche nach, langsam, bedächtig, eine Frage ohne Worte darauf. Die Musikanten beginnen von neuem, und ich habe nicht geantwortet, und meine Hand liegt noch in ihrer."
 latria_sexual_frustration_flavor.1135.a: "Der Weise folgen und den nächsten Takt tanzen."
 latria_sexual_frustration_flavor.1135.b: "Meine Hand zurückziehen und in die Menge treten."
 latria_sexual_frustration_flavor.1135.c: "In der Wärme bleiben und die Weise zu Ende hören."
