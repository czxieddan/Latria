l_german:
 latria_sexual_frustration_flavor.1011.t: "Die zweite Nachtwache"
 latria_sexual_frustration_flavor.1011.desc: "Ich erwache in der zweiten Wache, und die Lampe brennt noch, das Öl ist niedrig, ein brauner Ring ist in der Untertasse eingetrocknet. Mein Nachtgewand hat sich an der Taille verdreht. Im Zimmer ist es kalt genug, dass ich den Laden zweimal anschlagen höre, dann Stille.\n\nEs war eine Hand an meinem Handgelenk, vor drei Tagen, in der Tür der Halle, und es wurde nichts gesagt. Ich bin die Länge dieser Berührung öfter durchgegangen als die Abrechnungen. Die Haut dort ist längst gewöhnlich. Ich drücke den Daumen darauf und fühle nur meinen eigenen Puls.\n\nIm Becher neben dem Bett ist Wasser, warm geworden. Ich trinke die Hälfte und setze ihn ab. Der Laden schlägt wieder an. Ich liege mit offenen Augen und zähle die Balken, bis das Grau kommt."
 latria_sexual_frustration_flavor.1011.a: "Aufstehen, den Docht kürzen und den Gedanken gehen lassen, wohin er will."
 latria_sexual_frustration_flavor.1011.b: "Das Wasser trinken, mich zur Wand drehen und es beiseitelegen."
 latria_sexual_frustration_flavor.1011.c: "Ein Buch aus der Truhe nehmen und lesen, bis das Grau kommt."

 latria_sexual_frustration_flavor.1012.t: "Die Birne und das kleine Messer"
 latria_sexual_frustration_flavor.1012.desc: "Ich sitze drei Tische unterhalb des Podests, wo die Kerzen flackern und der Wein dünn eingeschenkt wird. Mir gegenüber, hinter zwei Händlern und einem Schreiber, schält jemand eine Birne mit einem kleinen Messer und isst sie nicht. Die Schale löst sich in einer langen Spirale.\n\nBeim letzten Festmahl saß diese Person neben mir, und ihr Knie lag für die Länge eines Liedes an meinem. Ich kann mich nicht dazu bringen zu glauben, es sei ein Zufall gewesen, und nicht dazu, es sei keiner gewesen.\n\nDie Musikanten wechseln zu einer langsameren Weise. Das Messer hält inne. Die Birne liegt offen auf dem Teller und wird am Schnitt braun. Ein Diener beugt sich mit dem Krug über meine Schulter, und ich halte den Becher hin, ohne den Blick abzuwenden."
 latria_sexual_frustration_flavor.1012.a: "Es laut sagen und die Tafel daraus machen lassen, was sie will."
 latria_sexual_frustration_flavor.1012.b: "Früh hinausgehen und den Rest hinunterschlucken."
 latria_sexual_frustration_flavor.1012.c: "Mich der Person neben mir zuwenden und die Musik es forttragen lassen."

 latria_sexual_frustration_flavor.1013.t: "Was der Traum zurückließ"
 latria_sexual_frustration_flavor.1013.desc: "Ich wache auf, das Laken an der Hüfte, das Fenster fahl, und einen Augenblick lang ist das Zimmer nicht mein Zimmer. Jemand war hier. Ein Gewicht lag auf der Bettkante, und eine Stimme dicht an meinem Ohr sagte meinen Namen, als wäre er eine Frage.\n\nIch erinnere mich nicht an das Gesicht. Ich erinnere mich an die Wärme eines Rückens an meiner Brust, an meine Hand flach auf einem Bauch, der sich hob und senkte, und daran, dass ich es überhaupt nicht eilig hatte.\n\nDas Laken ist feucht, wo ich lag. Ich setze mich auf und stelle die Füße auf die kalten Bretter. Draußen fährt ein Karren zum Markt. Ich greife nach meinen Kleidern und merke, dass ich auf die Tür lausche."
 latria_sexual_frustration_flavor.1013.a: "Den Leib haben lassen, was er will, und die Wärme des Traums behalten."
 latria_sexual_frustration_flavor.1013.b: "Aufstehen und mich ankleiden und die Nacht glatt streichen."
 latria_sexual_frustration_flavor.1013.c: "Mit angezogenen Knien sitzen und warten, bis das Fenster weiß wird."

 latria_sexual_frustration_flavor.1014.t: "Die Lampe der Nachtwache"
 latria_sexual_frustration_flavor.1014.desc: "Ich knie zur dritten Stunde, das Psalterium aufgeschlagen auf derselben Seite, die ich viermal gelesen habe. Die Nachtlampe wirft einen kleinen roten Kreis auf die Steinplatten. Meine Knie schmerzen. Die Kälte kommt durch die Wolle herauf.\n\nIrgendwo draußen im Kreuzgang schließt sich eine Tür. Hinter mir geht die Stimme weiter, geduldig, und ich höre kein Wort davon. Ich denke an einen Mund an meiner Kehle im letzten Sommer und daran, wie ich den Kopf wegdrehte und es dennoch geschehen ließ.\n\nDas Leseband des Psalteriums ist zu Boden geglitten. Ich hebe es nicht auf. Mein Daumen hält die Stelle, und der rote Kreis der Lampe zittert, wenn ich atme. Der Stein unter meinen Knien ist kalt."
 latria_sexual_frustration_flavor.1014.a: "Die Schwäche eingestehen und die Buße morgen auf mich nehmen."
 latria_sexual_frustration_flavor.1014.b: "Noch eine Stunde knien und den Psalm von vorn beginnen."
 latria_sexual_frustration_flavor.1014.c: "Bitten, dass die Person bleibt, die mich unterrichtet, und die Seite zu Ende liest."

 latria_sexual_frustration_flavor.1015.t: "Die Decke am Fußende des Bettes"
 latria_sexual_frustration_flavor.1015.desc: "Das Feuer ist zu Asche heruntergebrannt, und ich bin noch wach, die Decke zum Fußende gestrampelt. Mein Leib ist warm und schwer und seiner selbst bewusst, die Haut an meiner Kehle und entlang der Schenkel eng und gerötet, und ich bin feucht auf eine Weise, die nichts mit dem Wetter zu tun hat.\n\nIch lasse meine Hand tief auf meinem Bauch ruhen und bewege sie nicht. Das Verlangen gilt heute Nacht keinem Gesicht. Es ist nur der Puls zwischen meinen Beinen, beharrlich, der den letzten Schlag des Feuers mitzählt.\n\nIch denke an einen Mund, eine Hand, das Gewicht von jemandem über mir, und meine Hüften verschieben sich von selbst. Die Decke ist ein Haufen auf den Brettern. Ich drehe das Gesicht ins Kissen und atme, bis der Schmerz nachlässt, und er lässt nicht nach."
 latria_sexual_frustration_flavor.1015.desc.lustful: "Die Hitze steigt unter dem Laken auf, und ich höre auf, sie für das Wetter auszugeben. Ich bin feucht, offen feucht, meine eigene Feuchte, und meine Finger kennen den Weg, ohne dass man sie schickt.\n\nIch lasse sie gehen. Es ist kein Gesicht dabei heute Nacht, nur eine Hand, die mich in die Matratze drückte, und ein Knie, das meine öffnete, und ich erinnere mich an genau diese Kraft. Meine Hüften heben sich dem Nichts entgegen. Der Laut, den ich im leeren Zimmer mache, ist keiner, den ich kenne.\n\nDanach liege ich mit offenen Händen, meine Brust hebt und senkt sich, das Letzte bewegt sich noch in meinen Schenkeln. Ein Scheit rutscht im Kamin. Ich ziehe das Laken bis zur Taille, und die Hitze in meinem Gesicht bleibt."
 latria_sexual_frustration_flavor.1015.desc.chaste: "Ich wache schon warm auf, die Schenkel feucht, und ziehe meine Hand zurück und schließe sie um den Saum des Lakens, als könnte das Halten von Stoff die Nacht an ihrem Ort halten.\n\nIch sage das Morgengebet der Reihe nach auf und verliere den Faden in der dritten Zeile. Ich zähle die Balken und verliere die Zahl. Der Leib hört nicht zu. Er behält, was ich bei Tageslicht nicht zugebe, und er fragt weiter danach.\n\nDas Fenster geht von Grau zu Weiß. Die Glocke zum Morgenamt hat noch nicht geläutet. Ich ziehe die Decke bis zum Kinn, schließe die Augen und warte, dass die Hitze aus mir weicht. Sie weicht langsam."
 latria_sexual_frustration_flavor.1015.a: "Die Hand tun lassen, was sie will, und die Hitze nutzen."
 latria_sexual_frustration_flavor.1015.b: "Die Decke zusammenpressen und die Hitze abtragen."
 latria_sexual_frustration_flavor.1015.c: "Aufstehen, trinken und am Fenster sitzen."

 latria_sexual_frustration_flavor.1016.t: "Der lange Ritt zurück"
 latria_sexual_frustration_flavor.1016.desc: "Ich reite am Ende der Reihe, wo die Pferde langsamer geworden sind, das Licht grün und dünn durch die Blätter. Mein Mantel ist schwer von Nässe. Irgendwo voraus arbeiten die Hörner noch den jenseitigen Hang ab.\n\nBei der letzten Jagd ritt ich am Bach neben dieser Person, und wir ließen die anderen weiterziehen. Ihr Ärmel war bis zum Ellbogen durchnässt. Sie lachte über etwas, das ich sagte, und das Lachen blieb mir den ganzen Heimweg, und der Heimweg war zwei Tage.\n\nMeine Stute senkt den Kopf zum Trinken. Das Wasser zerschneidet ihr Spiegelbild. Ich sitze und lasse sie trinken und sehe zu, wie die Teile wieder zusammenkommen, und die Hörner setzen von neuem ein, weiter fort."
 latria_sexual_frustration_flavor.1016.a: "Eine Länge zurückfallen und den Gedanken mit mir heimreiten lassen."
 latria_sexual_frustration_flavor.1016.b: "Die Fersen einsetzen und den Sinn auf den Hang halten."
 latria_sexual_frustration_flavor.1016.c: "Den Hufspuren und den zerbrochenen Zweigen folgen, um sie zu finden."

 latria_sexual_frustration_flavor.1017.t: "Das Siegel und das Rechnungsbuch"
 latria_sexual_frustration_flavor.1017.desc: "Der Rat ist gegangen, und die Kerzen sind auf Stümpfe heruntergebrannt. Ich habe das Rechnungsbuch bei den Wollkonten aufgeschlagen und das Siegel noch in der Hand, das Wachs weich von meinem Griff.\n\nWorauf ich immer wieder zurückkomme, sind nicht die Konten. Es ist die Art, wie eine bestimmte Person während der ganzen Sitzung am Fenster stand, nichts sagte, einen Finger an der Klinke, und wie das Zimmer dadurch kleiner wurde.\n\nIch drücke das Siegel auf die Anordnung und hebe es ab. Das Wachs nimmt das Zeichen sauber auf. Draußen ist der Hof leer, und die Klinke steht still. Ich lese dieselbe Zeile des Rechnungsbuchs zweimal und schließe dann das Buch."
 latria_sexual_frustration_flavor.1017.a: "Morgen nach der Person schicken und es offen sagen."
 latria_sexual_frustration_flavor.1017.b: "Das Siegel dem Schreiber geben und zu Bett gehen."
 latria_sexual_frustration_flavor.1017.c: "Das Rechnungsbuch wieder öffnen und die Seite zu Ende führen."

 latria_sexual_frustration_flavor.1018.t: "Mond über dem Brett"
 latria_sexual_frustration_flavor.1018.desc: "Die Laternen sind entlang des Gangs entzündet, und der Mond steht über der Westmauer, dünn und weiß wie ein Hobelspan. Der Wein ist im Topf warm geworden. Mir gegenüber hält die Person, die studiert, einen weißen Stein zwischen zwei Fingern und setzt ihn nicht.\n\nBeim Frühlingsfest saßen wir nah genug, dass sich unsere Ärmel berührten, und trugen vier Zeilen über eine Lampe vor und sahen mich bei der letzten an. Ich habe die letzte Zeile nicht vergessen.\n\nDer Stein kommt endlich nieder, in der falschen Ecke, und sie lacht und füllt meinen Becher nach. Ich trinke. Das Laternenlicht wandert über das Brett. Keine von uns beiden erwähnt das Gedicht."
 latria_sexual_frustration_flavor.1018.a: "Die Lampe und die vier Zeilen aufnehmen und vier weitere hinzufügen."
 latria_sexual_frustration_flavor.1018.b: "Den Becher zum Dank heben und das Gespräch auf die Ernte lenken."
 latria_sexual_frustration_flavor.1018.c: "Einen Stein setzen und um Unterricht bitten."

 latria_sexual_frustration_flavor.1019.t: "Zum Feuer gesagt"
 latria_sexual_frustration_flavor.1019.desc: "Das Feuer ist niedrig, und die Person, der ich mich anvertraue, hat den anderen Stuhl, die Hände um einen Becher gelegt, wartend, wie sie immer wartet.\n\nAlso sage ich es. Nicht alles, aber die Gestalt davon: die Tür, die Hand an meinem Handgelenk, die Nächte seither. Es laut zu sagen macht es kleiner und schlimmer. Die Person sieht nicht weg und füllt das Schweigen nicht.\n\nDer Becher ist in meinen Händen kalt geworden. Ein Scheit liegt bereit, und ich lege es nicht auf. Wir sitzen in der letzten Wärme, und das Zimmer wird langsam dunkel, und ich halte noch immer den Becher."
 latria_sexual_frustration_flavor.1019.a: "Weiterreden und den Rest sagen."
 latria_sexual_frustration_flavor.1019.b: "Hier aufhören und den Rest behalten."
 latria_sexual_frustration_flavor.1019.c: "Noch eine Weile sitzen und nichts sagen."

 latria_sexual_frustration_flavor.1020.t: "Unter dem Gewölbe gesprochen"
 latria_sexual_frustration_flavor.1020.desc: "Das Gewölbe nimmt meine Stimme und gibt sie doppelt zurück. Ein Dutzend Menschen ist im Schiff, und jeder Einzelne kann hören, wie ich das sage, was ich bei Tageslicht nicht gesagt habe.\n\nIch halte die Augen auf die Steinplatte vor der Schranke. Ein Stück ist herausgebrochen, geformt wie ein Zahn. Als ich fertig bin, verlagert jemand hinter mir das Gewicht, und eine Frau nahe der Tür zieht den Schleier übers Gesicht und lässt ihn nicht wieder sinken.\n\nDas Weihrauchfass schwingt. Der Rauch geht flach am Stein entlang aufwärts. Ich bleibe, wo ich bin, die Hände offen auf den Knien, bis jemand aus der Sakristei meine Schulter berührt."
 latria_sexual_frustration_flavor.1020.a: "Den Kopf heben und zu Ende sagen, was ich ausgelassen habe."
 latria_sexual_frustration_flavor.1020.b: "Den Kopf gesenkt halten und die Bußpsalmen bis zum Ende sprechen."
 latria_sexual_frustration_flavor.1020.c: "Warten, bis sich das Schiff leert, und die Person bitten zu bleiben, die mich unterrichtet."

 latria_sexual_frustration_flavor.1021.t: "Nach dem Regen"
 latria_sexual_frustration_flavor.1021.desc: "Der Regen hielt uns in der oberen Kammer über die zweite Wache hinaus, und niemand von uns beiden schlug vor hinunterzugehen.\n\nIch erinnere mich an die Reihenfolge der Dinge. Ein nasser Mantel auf den Brettern. Ein Mund an meinem Schlüsselbein, dann tiefer, ohne Eile, während meine Finger die Bänder in einem Nacken fanden. Die Lampe war niedrig gedreht, aber nicht aus. Als sie wieder heraufkam, um mich zu küssen, schmeckte ich den Wein auf ihr, meine Schenkel lagen glitschig an ihren, und ich hob die Hüften der Hand entgegen, die sich dort niederließ.\n\nDanach ging der Regen weiter. Mein Haar klebte an meiner Wange. An meiner Schulter ist ein Mal, das ich bei Tageslicht nicht angesehen habe."
 latria_sexual_frustration_flavor.1021.desc.female: "Der Regen hielt uns in der oberen Kammer über die zweite Wache hinaus, und niemand von uns beiden schlug vor hinunterzugehen.\n\nIch erinnere mich an die Reihenfolge der Dinge. Ein nasser Mantel auf den Brettern. Ihr Mund an meinem Schlüsselbein, dann tiefer, ohne Eile, während meine Finger die Bänder in ihrem Nacken arbeiteten. Die Lampe war niedrig gedreht, aber nicht aus. Ihre Handfläche schloss sich über meiner Brust, und ich war schon feucht, und ich hob die Hüften der Hand entgegen, die sich zwischen meine Schenkel legte.\n\nDanach ging der Regen weiter. Mein Haar klebte an meiner Wange. An meiner Schulter ist ein Mal, das ich bei Tageslicht nicht angesehen habe."
 latria_sexual_frustration_flavor.1021.desc.male: "Der Regen hielt uns in der oberen Kammer über die zweite Wache hinaus, und niemand von uns beiden schlug vor hinunterzugehen.\n\nIch erinnere mich an die Reihenfolge der Dinge. Ein nasser Mantel auf den Brettern. Ihr Mund an meiner Brust, dann tiefer, ohne Eile, während meine Hände die Bänder an ihrer Taille fanden. Die Lampe flackerte zweimal und hielt. Sie kam über mich herab, und ich hielt ihre Hüften, hart und schmerzend, und sie gab das Tempo selbst vor. Ihr Haar war an den Spitzen nass.\n\nDanach ging der Regen weiter und lief in der Rinne über dem Fenster. An meiner Schulter ist ein Mal, das ich bei Tageslicht nicht angesehen habe."
 latria_sexual_frustration_flavor.1021.a: "Sie morgen wie immer treffen und nichts verbergen."
 latria_sexual_frustration_flavor.1021.b: "Ihr fortan aus dem Weg gehen und die Nacht beiseitelegen."
 latria_sexual_frustration_flavor.1021.c: "Liegen, dem Regen zuhören und das Mal im Sinn behalten."

 latria_sexual_frustration_flavor.1022.t: "Der Pfad hinter den Kräutern"
 latria_sexual_frustration_flavor.1022.desc: "Ich nehme den Pfad hinter den Kräuterbeeten, weil es der einzige Ort ist, den der Haushalt nach Einbruch der Dunkelheit nicht geht. Der Kies ist kalt durch meine Schuhe. Rosmarin und darunter der saure Geruch der Minze, die über den Sommer hinaus ist.\n\nAm Ende, wo die Mauer umkehrt, steht eine Bank. Wir saßen dort im Frühling, und ich sagte etwas Törichtes und war vergeben, ehe ich zu Ende gesprochen hatte. Der Riegel der Pforte ist noch unten.\n\nDer Mond steht hinter dem Turm. Ich stehe an der Bank, die Hand auf ihrer Lehne, dort, wo die Farbe bis auf das Holz abgewetzt ist. Eine Motte arbeitet an der Laterne bei der Tür. Die Minze bewegt sich ein wenig. Ich setze mich nicht."
 latria_sexual_frustration_flavor.1022.a: "Mich auf die Bank setzen und den Puls vorübergehen lassen."
 latria_sexual_frustration_flavor.1022.b: "Zum Haus zurückkehren und die Tür verriegeln."
 latria_sexual_frustration_flavor.1022.c: "Den Pfad einmal gehen und dann noch einmal."

 latria_sexual_frustration_flavor.1023.t: "Der dritte Becher"
 latria_sexual_frustration_flavor.1023.desc: "Beim dritten Becher ist die Halle laut und warm geworden, und die Hunde sind unter den Bänken. Jemand hat ein Lied mit der falschen Zahl von Strophen begonnen, und niemand verbessert es.\n\nEine Hand ruht auf meinem Ärmel, während eine Geschichte erzählt wird, und bleibt dort während der ganzen Geschichte und ist fort, als die Geschichte endet. Ich lache an der richtigen Stelle. Der Wein ist heute Abend sehr gut.\n\nDie Musikanten greifen etwas Langsames auf. Ich sehe die Tafel hinunter, wo die Brettchen abgeräumt werden. Mein Ärmel ist noch warm, wo die Hand war. Ich drehe den Becher am Rand und lasse ihn von neuem füllen."
 latria_sexual_frustration_flavor.1023.a: "Den Becher heben und die Person über die Tafel hinweg ansehen."
 latria_sexual_frustration_flavor.1023.b: "Den Wein vorschützen und hinauf zu Bett gehen."
 latria_sexual_frustration_flavor.1023.c: "Mit der Person neben mir sprechen und die Weise zu Ende hören."

 latria_sexual_frustration_flavor.1024.t: "Rosenwasser und die Gartenmauer"
 latria_sexual_frustration_flavor.1024.desc: "Das Rosenwasser ist über das Obst gegossen worden, und der ganze Tisch riecht danach. Unter der Mauer geht eine Nachtigall immer weiter, schlecht, und niemand hat das Herz, sie zum Schweigen zu bringen.\n\nZweimal wurde ich nach dem Vertrag gefragt, und beide Male antwortete ich auf die falsche Hälfte. Das zweite Mal lächelte die Person in ihren Becher. Der Safran an ihrem Daumen hat sich auf den Rand gesetzt. Die Lampe zwischen uns hat einen Sprung im Glas.\n\nDie Nachtigall hört auf. In der Stille kann ich das Wasser im Kanal hinter der Mauer hören. Ich nehme den Becher, den ich schon geleert habe, und halte ihn, bis jemand es bemerkt und ihn füllt."
 latria_sexual_frustration_flavor.1024.a: "Ihrem Beispiel folgen und den Vertrag auf morgen verschieben."
 latria_sexual_frustration_flavor.1024.b: "Um Erlaubnis bitten und in den Garten hinausgehen."
 latria_sexual_frustration_flavor.1024.c: "Sie bitten, die fehlende Hälfte des Gedichts zu beenden."

 latria_sexual_frustration_flavor.1025.t: "Der Falke auf der Faust"
 latria_sexual_frustration_flavor.1025.desc: "Der Falke sitzt besser auf meiner Faust als im Frühling, die Haube ab, ihr Gewicht eingekehrt. Die Pferde sind hinten in den Birken angepflockt, und die Treiber sind mit ihrem Lärm vorausgegangen.\n\nWir haben sie einmal zusammen am Rand des Moors fliegen lassen, und ich konnte die Augen nicht von den Händen lassen, die sie abwarfen, von der Art, wie sie sich im letzten Moment öffneten. Ich habe seither zu unschicklichen Stunden an diese Hände gedacht.\n\nDer Falke rückt sich zurecht, und ich halte sie mit zwei Fingern an den Fängen. Der Wind kommt den Hang herauf, kalt und rein. Ich halte die Augen auf die Bäume, in denen die Treiber verschwanden, und mein Sinn ist nicht bei den Bäumen."
 latria_sexual_frustration_flavor.1025.a: "Den Falken einem anderen geben und allein fortgehen."
 latria_sexual_frustration_flavor.1025.b: "Sie von der Faust abwerfen und fliegen lassen."
 latria_sexual_frustration_flavor.1025.c: "Sie wieder fliegen lassen, bis mir der Arm schmerzt."

 latria_sexual_frustration_flavor.1026.t: "Die Seite, die gewendet wurde"
 latria_sexual_frustration_flavor.1026.desc: "Der Unterricht ist getan, und das Buch liegt noch aufgeschlagen zwischen uns, auf der Seite, die ein trockener Finger gewendet hat. Regen an den Läden. Die Kerze ist heruntergebrannt und gebogen.\n\nIch bin der Auseinandersetzung nicht gefolgt. Ich sah den Finger und die Tinte an seiner Seite und die Art, wie der Ärmel bis zum Ellbogen zurückgeschoben war. Die Scham kommt danach, immer, und nützt nichts.\n\nDie Person, die mich unterrichtet, schließt das Buch und fragt, ob ich verstanden habe. Ich sage, ich habe. Der Regen geht an den Läden weiter. Ich halte meine Hand flach auf den Deckel, damit sie nach nichts greift."
 latria_sexual_frustration_flavor.1026.a: "Die Frage morgen der Person tragen, die mich unterrichtet."
 latria_sexual_frustration_flavor.1026.b: "Bitten, es noch einmal zu sagen, und diesmal zuhören."
 latria_sexual_frustration_flavor.1026.c: "Die Seite noch einmal lesen, nur die Buchstaben."

 latria_sexual_frustration_flavor.1027.t: "Was der Tag zurückließ"
 latria_sexual_frustration_flavor.1027.desc: "Der letzte Bittsteller ist gegangen, und die Kammer riecht nach nasser Wolle und nach dem Talg, den man in die Bänke reibt. Mein Siegel ist warm von meiner Hand. Das Geschäft des Tages ist getan, und ich sitze noch hier.\n\nEs gab einen Augenblick am Fenster, zwischen zwei Rednern, als ein Blick fiel, den ich seither bei mir trage wie einen Stein im Schuh. Nichts wurde gesagt. Nichts musste gesagt werden.\n\nDer Schreiber kommt um das Siegel. Ich gebe es ihm, und meine Finger sind ruhig. Er geht. Die Tür schließt sich nicht ganz. Ich sitze und lausche, wie der Riegel einklinkt, und der Regen setzt wieder auf den Bleiplatten ein."
 latria_sexual_frustration_flavor.1027.a: "Morgen das Zimmer wegschicken und ein einziges Ding sagen."
 latria_sexual_frustration_flavor.1027.b: "Das Fenster schließen und die Papiere zu Ende bringen."
 latria_sexual_frustration_flavor.1027.c: "Durcharbeiten, was bleibt, ein Blatt nach dem anderen."

 latria_sexual_frustration_flavor.1028.t: "Das Band in der Schatulle"
 latria_sexual_frustration_flavor.1028.desc: "Auf dem Bord steht eine Schatulle mit einem Band darin, das nicht meins ist, grün, an der Falte dünn geworden. Ich nehme es heraus, lege es zurück und nehme es heraus.\n\nAuf dem Jahrmarkt verlor ich das Band, und jemand fand es im Schlamm und gab es mir mit einer Verbeugung zurück, die ich nicht brauchte. Ihre Hände waren kalt. Ich sagte danke und nichts weiter, und den ganzen Heimweg war ich über dieses Nichts zornig auf mich.\n\nDie Lampe ist niedrig. Das Band liegt quer über meiner Handfläche, und das Grün ist in diesem Licht fast grau. Ich falte es einmal und dann noch einmal, und die Falten treffen nicht aufeinander."
 latria_sexual_frustration_flavor.1028.a: "Das Band um mein Handgelenk binden und schlafen."
 latria_sexual_frustration_flavor.1028.b: "Die Schatulle ganz unten in der Truhe verschließen."
 latria_sexual_frustration_flavor.1028.c: "Papier nehmen und die Nacht aufschreiben."

 latria_sexual_frustration_flavor.1029.t: "Das Feuer zwischen den Wachen"
 latria_sexual_frustration_flavor.1029.desc: "Das Feuer ist auf ein rotes Auge heruntergebrannt, und das Lager schläft, bis auf uns zwei und die Wachen bei den Pferden. Mein Mantel liegt über meinen Knien. Das Schwert liegt dort, wo ich es erreichen kann, aus Gewohnheit.\n\nWir haben elf Nächte ein Feuer geteilt, und ich habe den Klang ihres Atems gelernt. Heute Nacht sind sie auch wach. Keine von uns sagt etwas über die Straße morgen oder über die Herberge in der letzten Stadt, wo es ein Zimmer gab und wir es nahmen.\n\nDer Wind legt die Flammen flach. Ein Scheit rutscht. Ich lege ein weiteres nach, und die Funken steigen auf, und die Funken sind das Einzige, was sich im ganzen Wald bewegt."
 latria_sexual_frustration_flavor.1029.a: "Am Feuer sitzen und auf das Licht warten."
 latria_sexual_frustration_flavor.1029.b: "Das Feuer nähren, die Wache halten und die Person nicht ansehen."
 latria_sexual_frustration_flavor.1029.c: "Die Wache mit ihr tauschen und zum Rand des Waldes gehen."

 latria_sexual_frustration_flavor.1030.t: "Das Glockenseil"
 latria_sexual_frustration_flavor.1030.desc: "Das Glockenseil ist rau in meinen Händen, und die Glocke ist geläutet, und die Kirche ist leer. Die Person, die mich führt, wartet mit den Schlüsseln an der Tür, geduldig wie Stein.\n\nIch denke an den Leib als ein Ding, das zu bewahren ist, und ich kann den Gedanken nicht halten. Er gleitet ab. Unter der Wolle bin ich warm und lebendig, und in mir ist ein Puls, der nichts mit Gebet zu tun hat.\n\nIch lasse das Seil los. Es schwingt ein wenig und steht still. Die Person hebt die Schlüssel. Ich gehe hinter ihr das Schiff hinunter, und mein Schatten geht vor mir über die Platten, lang und dünn, und hinaus durch die Tür."
 latria_sexual_frustration_flavor.1030.a: "Die Nacht dem Leib geben und es morgen ordnen."
 latria_sexual_frustration_flavor.1030.b: "Knieen und das Abendamt zu Ende beten."
 latria_sexual_frustration_flavor.1030.c: "Die Person hinter mir behalten und eine weitere Stelle hören."

 latria_sexual_frustration_flavor.1031.t: "Das Band auf den Brettern"
 latria_sexual_frustration_flavor.1031.desc: "Das Feuer ist zu einer roten Linie heruntergebrannt, und ich habe nicht nach mehr Holz gerufen. Mein Kleid ist an der Kehle gelöst, und das Zimmer ist warm genug, dass ich es so lasse. Vor zwei Tagen, beim Aufbruch der Jagd, blieb eine Hand an meinem Kreuz länger, als das Absteigen verlangte.\n\nIch erinnere mich an das Gewicht dieser Handfläche, an den Atem, der sich an meinem Ohr bewegte, als das Pferd sich verlagerte, an das tiefe Wort, das kein Wort war. Meine eigene Hand geht an die Stelle, die die Handfläche bedeckte. Die Haut dort ist warm vom Feuer, und wenn ich drücke, ist die Wärme nur meine.\n\nDas Band ist vom Bettpfosten auf die Bretter geglitten. Ich sehe zu, wie es im roten Licht liegt. Das Feuer rutscht zusammen. Ich hebe es nicht auf."
 latria_sexual_frustration_flavor.1031.a: "Das Band aufheben und den Gedanken gehen lassen, wohin er will."
 latria_sexual_frustration_flavor.1031.b: "Das Band binden, das Feuer niederlegen und schlafen."
 latria_sexual_frustration_flavor.1031.c: "Das Brett aufstellen und das Endspiel allein spielen."

 latria_sexual_frustration_flavor.1032.t: "Das Gewicht einer Handfläche"
 latria_sexual_frustration_flavor.1032.desc: "Der Stein ist kalt durch meine Knie, und ich habe lange genug gekniet, dass die Kälte Gesellschaft geworden ist. Unter der Wolle ist mein Leib zu warm, und ich kann nicht sagen, ob es die Glutbecken sind oder etwas anderes. Letzte Woche ruhte eine Hand segnend auf meinem Haupt und blieb über die Worte hinaus.\n\nDie Gebete kommen richtig heraus. Die Antworten sind richtig. Was stattdessen aufsteigt, ist das Gewicht dieser Handfläche, das Öl an den Fingern, der Moment, in dem keine von uns sich bewegte und jemand in der Tür hustete. Ich drücke die Stirn gegen meine Knöchel. Der Marmor gibt nichts zurück.\n\nEine Kerze am Seitenaltar neigt sich und steht wieder gerade. Ich bleibe, wo ich bin. Die Kälte kommt durch meine Knie herauf, und ich lasse sie."
 latria_sexual_frustration_flavor.1032.a: "Aufstehen, die Person suchen, die mir den Segen gab, und sagen, was in mir ist."
 latria_sexual_frustration_flavor.1032.b: "Die Nachtwache halten bis zur Glocke."
 latria_sexual_frustration_flavor.1032.c: "Den Kreuzgang abschreiten, bis meine Beine so kalt sind wie meine Knie."

 latria_sexual_frustration_flavor.1033.t: "Der zweite Mantel"
 latria_sexual_frustration_flavor.1033.desc: "Das Feuer ist zwischen uns, und die Hunde sind still geworden. Jemand hat mir einen zweiten Mantel über die Schultern gelegt, ohne zu fragen, und die Wolle riecht nach dem Schweiß eines anderen Menschen und nach Holzrauch. Ihr Knie liegt an meinem. Keine von uns hat es bewegt.\n\nIch könnte drei Gründe aufzustehen nennen: die Wache, die Zeltklappe, die sich nicht schließen lässt, die Kälte, die vor dem Morgengrauen kommt. Stattdessen drehe ich das Gesicht zu den Flammen und lasse meine Schulter dort, wo sie zur Ruhe gekommen ist. Unser Atem geht hinaus und verdünnt sich in der Luft zwischen uns. Unter dem Mantel findet meine Hand die Naht meines eigenen Ärmels und hält sie.\n\nEin Zweig fällt ins Feuer. Sie bewegt sich nicht. Ich bewege mich nicht. Die Funken steigen auf und hinaus."
 latria_sexual_frustration_flavor.1033.a: "Unter dem Mantel bleiben, bis das Feuer Asche ist."
 latria_sexual_frustration_flavor.1033.b: "Für die Wolle danken und in mein Zelt gehen."
 latria_sexual_frustration_flavor.1033.c: "Nach den Hunden fragen, bis die Wache wechselt."

 latria_sexual_frustration_flavor.1034.t: "Die dritte Klausel"
 latria_sexual_frustration_flavor.1034.desc: "Der Vertrag ist zweimal abgeschrieben worden, und die zweite Abschrift ist in der dritten Klausel falsch. Ich habe sie viermal gelesen, und der Fehler steht noch da. Mein Kragen ist offen; das Glutbecken hat das Zimmer heiß gemacht, und niemand ist hier, der es sähe.\n\nWorauf ich immer wieder zurückkomme, ist das Vorzimmer, der Mund der gesandten Person an der Innenseite meines Handgelenks und dann darüber, und wie ich sie gewähren ließ, während die Schritte des Notars hinter der Tür kamen und gingen. Ich sagte nichts, das man aufschreiben könnte. Sie sagte weniger.\n\nDie Kerze hat eine Mondsichel aus dem Wachs gefressen. Ich nehme die Feder auf, setze sie ab und lese die dritte Klausel wieder. Die Wörter haben sich nicht geändert."
 latria_sexual_frustration_flavor.1034.a: "Nach der gesandten Person schicken und offen sagen, was ich denke."
 latria_sexual_frustration_flavor.1034.b: "Die Klausel noch einmal abschreiben und im ersten Licht beichten gehen."
 latria_sexual_frustration_flavor.1034.c: "Im Psalterium lesen, bis die Kerze aus ist."

 latria_sexual_frustration_flavor.1035.t: "Zwei Wendungen"
 latria_sexual_frustration_flavor.1035.desc: "Die Halle ist laut, und der Wein ist mir zu Kopf gestiegen, nicht weit, nur weit genug. Mein Kleid hat sich an der Schulter gelöst, und ich habe mich nicht damit behelligt. Im letzten Tanz legte sich eine Hand an meine Taille und blieb durch zwei Wendungen, und der Raum war zu voll, um beiseitezutreten.\n\nIch kann die vier Punkte jener Finger noch durch die Seide finden. Meine eigene Hand geht an meine Schulter, an den warmen Ort, wo der Stoff geglitten ist. Die Musik ist hinter den Spielern jetzt. Ich halte dennoch die Zeit.\n\nDie Lampe über mir raucht. Jemand am fernsten Tisch lacht über etwas, das ich nicht gehört habe. Meine Schulter ist bloß, und ich lasse sie so."
 latria_sexual_frustration_flavor.1035.a: "Noch eine Weise verlangen und sie tanzen."
 latria_sexual_frustration_flavor.1035.b: "Das Kleid richten und die kalte Luft am Fenster nehmen."
 latria_sexual_frustration_flavor.1035.c: "Mit dem alten Hund am Feuer sitzen, bis sich die Halle leert."
