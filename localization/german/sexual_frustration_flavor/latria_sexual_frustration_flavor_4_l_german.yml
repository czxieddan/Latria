l_german:
 latria_sexual_frustration_flavor.1301.t: "Eine unversandte Einladung"
 latria_sexual_frustration_flavor.1301.desc.female: "Im Nachtgewand sitze ich am Schreibtisch. Auf dem Briefpapier steht nur ein Name. Die Tinte ist noch feucht, als meine Zofe von der Tür aus fragt, ob sie den Brief überbringen soll. Ich falte das Blatt einmal. Ich versiegle es nicht und gebe keine Antwort.\n\nTagsüber wage ich diesen Namen nicht zu schreiben. Nun, da ich es bei Nacht getan habe, scheint mir das Papier heiß in der Hand zu liegen. Auf die Anrede sollte eine Einladung folgen. Ort und Stunde habe ich längst überlegt. Trotzdem bleibt die Feder hinter dem Namen stehen. Meine Zofe fragt noch einmal, diesmal leiser.\n\nIch betrachte den Namen. Er wiegt für mich schwerer als der ganze unvollendete Brief."
 latria_sexual_frustration_flavor.1301.desc.male: "Im Nachtgewand sitze ich am Schreibtisch. Auf dem Briefpapier steht nur ein Name. Vor der Tür wartet ein Bediensteter darauf, meine Nachricht zu überbringen. Sein Schatten bewegt sich im Türspalt und hält dann wieder still.\n\nIch tauche die Feder in die Tinte und halte sie über das Blatt. Was ich schreiben möchte, ist eindeutig: heute Nacht, an der Seitentür, ohne das Wissen eines Dritten. Sobald es auf dem Papier steht, ist es jedoch nicht mehr bloß mein Gedanke. Der Docht knackt. Neben den Namen fällt ein Tintenklecks.\n\nDer Bedienstete räuspert sich leise. Ich habe den Brief noch immer nicht versiegelt."
 latria_sexual_frustration_flavor.1301.desc: "Schon lange liegt ein unversiegelter Brief vor mir im Lampenlicht.\n\nAuf dem Papier steht nur die Anrede. Der freie Platz darunter würde für viele Sätze reichen. Ich habe keinen davon geschrieben. Das Wachs ist bereits weich, und der Siegellöffel liegt neben meiner Hand. Ich greife nicht danach.\n\nDer Ölstand ist ein Stück gesunken. Die Tinte des Namens ist noch feucht."
 latria_sexual_frustration_flavor.1301.a: "Den Brief zu Ende schreiben und dem Diener geben."
 latria_sexual_frustration_flavor.1301.b: "Den Brief weglegen, die Sehnsucht unterdrücken und zu Bett gehen."

 latria_sexual_frustration_flavor.1302.t: "Das Urteil des Hofes"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Der Hofdichter scherzt über eine alte Liebschaft. Nicht einmal die ernstesten Adligen runzeln die Stirn. Was sich hinter Bettvorhängen zugetragen hat, erzählt er wie eine lustige Begebenheit von der Jagd. Die anderen heben ihre Becher, und Licht spielt auf dem schwankenden Wein.\n\nLächelnd hebe ich meinen Becher ebenfalls. Der Wein schmeckt mir bitter. Die Geschichte handelt nicht von mir, doch ich habe das Gefühl, jemand breite auch meine Nächte vor der Gesellschaft aus. Mein Tischnachbar berührt meinen Ärmel und fragt, weshalb ich nichts sage. Erst da merke ich, wie spät mein Lachen kam.\n\nDer Dichter beginnt einen weiteren Vers. Mein Becher verharrt noch immer in der Luft."
 latria_sexual_frustration_flavor.1302.desc.strict: "Ein Adliger hat wegen einer heimlichen Liebschaft sein Ansehen verloren. Nun spricht die ganze Gesellschaft über seine Familie. Die Sätze werden bedächtig ausgesprochen, fast wie ein Urteil. Jemand schüttelt den Kopf, jemand anderes überdenkt die geplanten Heiraten seiner Kinder.\n\nWährend ich diese Urteile höre, denke ich daran, dass auch ich auf derselben Waage stehe. In der anderen Schale liegen ein unversandter Brief und mehrere Nächte ohne rechten Schlaf. Bisher hat niemand das gesehen. Unsichtbar ist es deshalb nicht ohne Gewicht.\n\nJemand fragt nach meiner Meinung. Ich stelle den Becher ab. Sein Boden schlägt hörbar auf den Tisch."
 latria_sexual_frustration_flavor.1302.desc: "Bei Tisch hat sich das Gespräch auf Ansehen und Begierde verlagert.\n\nZuerst waren es nur Scherze. Seit bestimmte Türen und genaue Uhrzeiten genannt werden, kann ich nicht mehr darüber lachen. Ich bleibe auf meinem Platz und merke, wie sich meine Hand unter dem Tischtuch schließt.\n\nDie Musiker spielen weiter, sehr leise, als wollten sie keines dieser Worte übertönen."
 latria_sexual_frustration_flavor.1302.a: "Von meiner Sehnsucht sprechen und das Gespräch immer wieder darauf zurückbringen."
 latria_sexual_frustration_flavor.1302.b: "Schweigen, meinen Gastgebern danken und mich verabschieden."

 latria_sexual_frustration_flavor.1303.t: "Die Mitternachtsglocke"
 latria_sexual_frustration_flavor.1303.desc.favors: "Nach dem Glockenschlag bleibt der Priester an der Tür stehen. Er sagt, Verlangen könne zum Guten gelenkt werden. Seine Stimme ist leise, aber in der Nacht deutlich zu hören. Die Kerzen im Heiligtum werfen seinen Schatten bis vor meine Knie.\n\nIch weiß nicht, ob ich auf dieses Gute noch warten möchte. Das Warten selbst ist längst zu einer weiteren Vorschrift geworden. Meine Hände sind in den Ärmeln warm. Für die Unruhe, die ich empfinde, finde ich in keiner Schrift einen Platz. Der Priester sieht mich an, als ahne er den Rest der Frage, die ich nicht ausspreche.\n\nDer letzte Glockenklang hängt noch unter den Balken. Ich knie da; meine Knie sind schon taub."
 latria_sexual_frustration_flavor.1303.desc.condemns: "Die Glocke hallt immer wieder durch den Raum. Ebenso kehren die Worte des Gelübdes zurück, das der Priester vorträgt. Ich knie so lange, dass meine Knie taub sind. Die Kühle der Steinplatten ist unter mir längst vergangen. Eine Antwort habe ich noch immer nicht.\n\nJedes Wort ist mir bekannt. Bekannt ist nicht dasselbe wie bereitwillig gesprochen. Bei ‚entsagen‘ halte ich einen Augenblick inne, ehe ich das Wort hervorbringe. Der Priester verbessert mich nicht. Ich selbst habe die Pause deutlich genug gehört.\n\nDer letzte Glockenschlag verklingt. Im Heiligtum ist es so still, dass ich das Wachs tropfen höre."
 latria_sexual_frustration_flavor.1303.desc: "Das Mitternachtsgebet hat mir keine Ruhe gebracht. Die Glocke hallt noch nach.\n\nIch habe bis zum letzten Satz mitgesprochen. Danach knie ich am selben Platz, und auch die Sorge in mir ist unverändert geblieben. Der Glockenklang hat nichts daran verschoben.\n\nDer Priester schließt das Buch. Das leise Zusammenfallen der Seiten klingt näher als die Glocke."
 latria_sexual_frustration_flavor.1303.a: "Die Gebote der Enthaltsamkeit im Tempel zurücklassen."
 latria_sexual_frustration_flavor.1303.b: "Den Gedanken unterdrücken und das Gebet noch einmal sprechen."

 latria_sexual_frustration_flavor.1304.t: "Das Ende der Geduld"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Im Nachtgewand gehe ich im Zimmer auf und ab. Auf dem Schachbrett, das ein Bediensteter gebracht hat, ist noch keine Figur bewegt worden. Das Fenster steht einen Spalt offen. Die Nachtluft kommt herein, ohne meine Unruhe zu vertreiben.\n\nIch habe am Bett gestanden, am Tisch und auch an der Tür. Dahinter sind keine Schritte. Das Warten ist selbst zur Qual geworden: Ich weiß, dass niemand kommen wird, und höre doch in jedem Schlag der Wachtrommel ein Klopfen. In der Schatulle stoßen Schachfiguren aneinander. Es war nur mein eigener Ärmel.\n\nIch kehre zum Brett zurück und lege die Hand auf einen Bauern. Ich ziehe ihn nicht vor."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Ich binde den Gürtel meines Nachtgewands noch einmal fest und versuche, jede Bewegung ruhig wirken zu lassen. Den Druck des Bandes spüre ich deutlich. Je sorgfältiger ich mich beherrsche, desto schwerer fällt es mir, meine Sehnsucht zu übergehen.\n\nDas Schachbrett liegt noch auf dem Tisch und verspricht eine Beschäftigung, an die ich mich halten könnte. Ich setze mich, nehme eine Figur auf und stelle sie wieder ab. Meine Gedanken suchen schon wieder einen anderen Weg. Ich lege die Hand unter den Tisch, halte sie dort fest und merke, dass mein Atem unruhig geworden ist.\n\nDas Zimmer ist sehr still. So still, dass ich meinen unausgesprochenen Fluch beinahe hören kann."
 latria_sexual_frustration_flavor.1304.desc: "Im Zimmer ist es still. Ich kann nicht mehr ruhig sitzen.\n\nIch stehe auf und gieße Wasser ein, trinke es aber nicht. Ich kürze den Docht zu weit, sodass die Flamme kleiner wird. Alles habe ich angefangen. Nichts davon hält mich lange genug fest, um wieder auf dem Stuhl Platz zu nehmen.\n\nSchließlich stehe ich mitten im Raum und weiß nicht, wohin mit meinen Händen."
 latria_sexual_frustration_flavor.1304.a: "Das Schachbrett beiseitelegen und an die Person denken, nach der ich mich sehne."
 latria_sexual_frustration_flavor.1304.b: "An den Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1305.t: "Eine Kammer nach Einbruch der Nacht"
 latria_sexual_frustration_flavor.1305.desc.emperor: "Der Hof hat sich aufgelöst. Ich bin noch im Festgewand in meinem Gemach. Die Berichte sind bearbeitet, die Siegelfarbe ist trocken, und die Schritte der Räte sind längst verklungen. Meine Sorge ist nicht mit ihnen fortgegangen.\n\nIch beginne den Verschluss am Kragen zu öffnen und halte auf halbem Weg inne. Das Bett ist hergerichtet, so ordentlich, dass ich mich kaum hineinlegen möchte. Eine Weile stehe ich vor dem Spiegel. Ich sehe mich im Festgewand und erkenne in meinen Augen etwas, das in keinem der Berichte vorkam.\n\nVor der Tür fragen die Bediensteten, ob sie mir die Krone abnehmen sollen. Ich lasse sie noch draußen warten."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Meine Gefährten ruhen bereits im Gasthaus. Ich bin allein in meinem Zimmer geblieben. Das Gepäck ist verstaut, und die morgige Wegstrecke steht auf der Holztafel hinter der Tür. Für meine Gedanken finde ich keinen Platz. Sie brauchen keinen Raum im Bündel und füllen doch das ganze Zimmer.\n\nIch sitze am Bettrand und habe die Stiefel noch an. Unten singt jemand betrunken, bis ein Gefährte das Lied mitten in der Strophe unterbindet. Das Lachen dringt zu mir herauf, als käme es aus einer anderen Nacht, zu der ich keinen Zutritt habe.\n\nIch rolle die Karte zusammen und öffne sie wieder. Die Wege darauf sind dieselben."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Ich bin allein in meinem kleinen Gemach geblieben und trage noch das geistliche Gewand. Die Kerze am Bett ist dunkel geworden. Mein Gelübde ist weiterhin da, Wort für Wort so, wie ich es am Tag gesprochen habe. Trost ist nicht gekommen.\n\nIch nehme die Gebetsperlen vom Handgelenk und lasse eine nach der anderen durch die Finger gleiten. Nach einer Weile denke ich dabei nicht mehr an Gebetsworte. Ich sehe einen Menschen vor mir, der auf dem Gang stand, und erinnere mich daran, wie ich zuerst weggesehen habe. Dadurch ist dieses Bild nicht verschwunden.\n\nDer Kragen meines Gewands scheuert am Hals. Ich ziehe es trotzdem nicht aus."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Im Festgewand kehre ich in mein leeres Gemach zurück. Die Wachen verneigen sich vor der Tür. Ihre Rüstungsteile klirren kurz, dann fällt der Riegel. Hier drinnen ist niemand, mit dem ich meine Sorge teilen könnte.\n\nIch trage noch die Krone. Ich nehme sie ab und lege sie neben das Kissen, als legte ich dort einen zweiten Kopf zur Ruhe. Die Gestalt im Spiegel scheint morgen ohne Weiteres vor den Hof treten zu können. Nur ich weiß, wie diese Nacht vergehen wird.\n\nIch setze mich ans Bett. Einen Handschuh habe ich noch an."
 latria_sexual_frustration_flavor.1305.desc: "Außer mir ist niemand im Zimmer. Trotzdem möchte ich mich nicht ins Bett legen.\n\nDie Lampe brennt, die Schuhe habe ich noch an, und mein Obergewand sitzt ordentlich. Ich halte mich daran fest, als wären es Gründe, noch hinauszugehen und jemanden zu treffen. In Wahrheit wartet niemand auf mich. Ich will nur das fertig hergerichtete Bett nicht ansehen müssen.\n\nDurch den Fensterspalt kommt Wind und lässt die Flamme zur Seite weichen."
 latria_sexual_frustration_flavor.1305.a: "Trotz der späten Stunde einen vertrauten Bekannten rufen lassen und lange mit ihm sprechen."
 latria_sexual_frustration_flavor.1305.b: "Die Sehnsucht unterdrücken, das Gewand ablegen und zu Bett gehen."

 latria_sexual_frustration_flavor.1306.t: "Ein Bote um Mitternacht"
 latria_sexual_frustration_flavor.1306.desc.female: "Im Nachtgewand sitze ich am Bettrand und höre zweimal ein leises Klopfen. Es ist kein verabredetes Zeichen, nur das gewöhnliche Klopfen meiner Zofe, wenn sie etwas bringt. Sie tritt ein, legt leeres Briefpapier ab und geht wieder, ohne zum Bett zu schauen.\n\nDas unbeschriebene Blatt beschäftigt mich stärker als ein vollgeschriebener Brief. Ich weiß, auf wessen Nachricht ich warte, und ebenso gut, dass heute Nacht keine kommen wird. Ich halte das Papier ins Lampenlicht. Eine kleine Faser darin sieht aus wie der Anfang einer noch ungeschriebenen Zeile.\n\nMeine Finger bleiben lange auf dem Blatt liegen, bis sie einen kleinen feuchten Abdruck hinterlassen."
 latria_sexual_frustration_flavor.1306.desc.male: "Im Nachtgewand öffne ich die Tür. Der Gang ist bereits leer. Neben der Schwelle liegt ein Zettel ohne Unterschrift. Vielleicht hat ihn jemand eben abgelegt, vielleicht liegt er dort schon seit dem Tag. Ich hebe ihn auf. Schlaf finde ich dadurch nicht.\n\nAuf dem Zettel steht nicht der Satz, auf den ich gehofft hatte. Es geht um eine Uhrzeit für morgen und um eine noch ausstehende Zahlung. Trotzdem lese ich jede Zeile und drehe danach das Blatt um. Die Rückseite ist leer. Gerade sie scheint darauf zu warten, dass ich etwas schreibe.\n\nDie Lampe auf dem Gang erlischt. Ich stehe noch an der Tür und habe sie nicht ganz geschlossen."
 latria_sexual_frustration_flavor.1306.desc: "Die Schritte vor der Tür entfernen sich. Auf dem Briefpapier vor mir steht noch immer keine Nachricht.\n\nDreimal habe ich die Feder aufgenommen. Beim ersten Mal schrieb ich ein Wort und strich es wieder durch. Beim zweiten blieb nur ein Tintenklecks auf dem Blatt. Beim dritten legte ich die Feder hin und sah zu, wie der Fleck langsam trocknete.\n\nMehr als die Hälfte der Nacht ist vergangen. Das Papier ist noch beinahe leer."
 latria_sexual_frustration_flavor.1306.a: "Die Worte niederschreiben, mit denen ich so lange gezögert habe."
 latria_sexual_frustration_flavor.1306.b: "Das Blatt weglegen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1307.t: "Schweigen an der Tafel"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Der Dichter trägt Verse über eine alte Liebe vor. Die Gesellschaft hört mit Vergnügen zu. Jemand schlägt im Takt auf den Tisch, ein anderer nimmt den nächsten Vers schon vorweg. Die Becher werden in den Händen gedreht. Niemand hält das Thema in irgendeiner Gegenwart für unpassend.\n\nIch hebe meinen Becher mit den anderen, denke aber an eine Vergangenheit, von der hier niemand erzählt. Sie klingt weniger schön als das Gedicht und hat kein solches Publikum. Ich erinnere mich nur an eine geschlossene Tür und daran, wie ich danach allein bis zum Morgen saß. Beim Vers über eine Umarmung schwappt ein Tropfen Wein aus meinem Becher.\n\nNiemand hat den Tropfen bemerkt. Ich selbst schon."
 latria_sexual_frustration_flavor.1307.desc.strict: "Bei Tisch wird von einem Adligen gesprochen, der wegen einer heimlichen Liebschaft die Gunst des Hofes verloren hat. Das Lachen verstummt fast gleichzeitig, als hätte jemand eine schwingende Saite angehalten. Ich wende den Blick zum Fenster, damit man mir nichts ansieht.\n\nDraußen gibt es wenig zu betrachten, nur eine Laterne der Nachtwache. Ich schaue weiter hin. Hinter mir sagt jemand leise, das habe er sich selbst zuzuschreiben. Die Worte müssen nicht mir gelten. Trotzdem treffen sie mich, als ginge es um die Sache, bei der ich bisher nicht ertappt worden bin.\n\nIch halte den Becher fest. Meine Fingerknöchel werden weiß."
 latria_sexual_frustration_flavor.1307.desc: "Die Becher gehen noch herum. Das Gespräch ist ausgerechnet bei dem Thema stehen geblieben, bei dem es nicht verweilen sollte.\n\nEben ging es noch um die Ernte. Im nächsten Augenblick fiel eine Bemerkung über jemandes Bettvorhänge. Seitdem hat niemand die Unterhaltung wieder aufgenommen. Ich sitze in dieser Pause und höre mein Herz deutlicher als die Musik.\n\nJemand hustet, um das Schweigen zu füllen. Es gelingt nicht."
 latria_sexual_frustration_flavor.1307.a: "Mir vom Wein die Zunge lösen lassen und eine private Geschichte nach der anderen erzählen."
 latria_sexual_frustration_flavor.1307.b: "Schweigen, mich vor der Gesellschaft verneigen und Abschied nehmen."

 latria_sexual_frustration_flavor.1308.t: "Ein Gebet während der Nachtwache"
 latria_sexual_frustration_flavor.1308.desc.favors: "Die Glocke zur Nachtwache hat geläutet. Ich bete noch immer im Heiligtum. Unsere Lehre verwirft die Freuden des Fleisches nicht; ich könnte jedem die entsprechende Stelle zeigen. Doch während ich hier knie, weiß ich mit meinem Verlangen noch immer nicht umzugehen.\n\nDie Bänke stehen leer. Das Kerzenlicht wirft meinen Schatten auf eine Lehne. Er hebt und senkt sich mit meinem Atem, als säße dort noch jemand, der diese Nachtwache nicht halten möchte. Ich denke an die Einladung, die mir heute beinahe entglitten wäre, und daran, wie ich den Satz im letzten Augenblick änderte. Meine Sehnsucht änderte sich dadurch nicht.\n\nDer Glockenklang ist fern geworden. Ich knie noch da, mit Schweiß auf der Stirn."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Im Heiligtum wiederhole ich das Gebet der Keuschheit. Beim ersten Mal spreche ich es vollständig. Beim zweiten fehlen bereits Wörter. Beim dritten bleibe ich an demselben Satz hängen und bringe die folgenden Worte nicht mehr hervor.\n\nDer Glockenklang wird leiser. Mein Gedanke weicht nicht mit ihm zurück. Ich drücke die Handflächen auf die Steinplatten, um ihre Kühle zu spüren. Bald sind auch diese Stellen warm. Danach weiß ich noch deutlicher, wogegen ich mich eigentlich stemme.\n\nAuf den leeren Bänken sitzt niemand. Trotzdem spreche ich nur sehr leise."
 latria_sexual_frustration_flavor.1308.desc: "Das Kerzenlicht fällt auf die leeren Bänke. Ich bin noch immer nicht aufgestanden.\n\nHier sollte meine Nachtwache enden. Doch ich fürchte, dass meine Unruhe gleich zurückkehrt, sobald ich die Haltung aufgebe, in der ich sie so lange zurückgehalten habe. Also bleibe ich auf den Knien und schiebe das Aufstehen weiter hinaus.\n\nDer Docht der letzten Kerze knackt. Schwarzer Rauch steigt auf und verliert sich unter den Balken."
 latria_sexual_frustration_flavor.1308.a: "Das Gebet der Enthaltsamkeit beiseitelegen und meinem Herzen nach draußen folgen."
 latria_sexual_frustration_flavor.1308.b: "Meine Begierde zügeln und die Nachtwache beenden."

 latria_sexual_frustration_flavor.1309.t: "Ein Blick in den Spiegel"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Noch unbekleidet stehe ich eine Weile allein vor dem Bronzespiegel meines Gemachs. Ich weiche meinem Spiegelbild nicht aus und greife auch nicht nach dem Gewand. Die Lampe leuchtet von der Seite. Nichts im Raum lenkt meinen Blick ab.\n\nIch habe es satt, meine Begierde eine flüchtige Schwäche zu nennen. Flüchtig ist sie nicht. Sie ist seit dem Abend geblieben, über das Essen hinweg und nachdem alle anderen gegangen waren. Jetzt sind nur noch der Spiegel und ich da. Ich lege kurz eine Hand auf meine Schulter. Im Spiegel sehe ich dieselbe kleine Bewegung und merke, wie unruhig mein Atem geworden ist.\n\nVor der Tür sind keine Schritte zu hören. Ich muss niemandem etwas vorspielen."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Noch unbekleidet sitze ich am Bettrand und spreche leise mein Gelübde. Jedes Wort kenne ich so genau, dass mir jede Auslassung sofort auffällt. Meine Sehnsucht verschwindet dadurch nicht. Hier, ohne Gewand und ohne Gesellschaft, kann ich sie niemand anderem zuschreiben.\n\nIch sehe in den Spiegel und wende den Blick wieder ab. Es hilft nichts. Der Bronzespiegel zeigt mich weiterhin. Ich verschränke die Hände so fest, dass die Knöchel weiß werden, als könnte ich damit an meinem Gelübde festhalten.\n\nWieder stocken die Worte. Diesmal spreche ich nicht gleich weiter."
 latria_sexual_frustration_flavor.1309.desc: "Niemand sonst ist im Zimmer. Das schweigende Spiegelbild lässt mich mir selbst nicht ausweichen.\n\nMeine Kleider liegen auf dem Stuhl. Ich stehe vor dem Spiegel. Dazwischen sind nur wenige Schritte, doch es dauert lange, bis ich mir eingestehe, weshalb ich das Gewand nicht überziehe. Die Lampe brennt ruhig. Mein Blick bleibt es nicht.\n\nIch setze mich an den Bettrand. Die Matte ist kühl, aber nur für kurze Zeit."
 latria_sexual_frustration_flavor.1309.a: "Meine Gefühle eingestehen und bei ihnen verweilen."
 latria_sexual_frustration_flavor.1309.b: "Mich ankleiden, an den Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1310.t: "Wach in meinem Gemach"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Nach dem Nachtgebet kehre ich in mein kleines Gemach zurück. Ich trage noch das geistliche Gewand, die Kerze am Bett ist dunkel geworden, und ich möchte mich noch immer nicht hinlegen. In der Ruhe des Bettes würde die alte Sehnsucht wiederkehren. Ich habe noch nicht entschieden, ob ich ihr Raum geben möchte.\n\nDie Gebetsperlen liegen wie ein stiller Zeuge neben dem Kissen. Ich löse den Gürtel meines Gewands zur Hälfte und binde ihn wieder zu. Der Kragen scheuert weiterhin und hält mich auf eine Weise wach, die mit ausgeruhtem Wachen nichts zu tun hat.\n\nIch bin allein in diesem Gemach. Leichter wird die Sache dadurch nicht."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Meine Gefährten haben sich im Gasthaus schlafen gelegt. Ich verstaue allein in meinem Zimmer das Gepäck. Der morgige Weg ist klar: eine Furt, ein Stück über Land, noch eine Furt. Wohin es mich in Gedanken zieht, weiß ich dagegen nicht. Auf keiner Karte ist dieses Ziel verzeichnet.\n\nIch ziehe die Stiefel aus, lege mich aber nicht hin. Draußen kaut ein Pferd langsam sein Futter. Das Geräusch sollte beim Einschlafen helfen. Ich höre zu und denke daran, wer mich heute an der Furt angesehen hat. Der Blick war so kurz, dass ich ihn beinahe hätte übergehen können. Ich habe ihn mir gemerkt.\n\nDie Öllampe flackert auf. Ich fülle kein Öl nach."
 latria_sexual_frustration_flavor.1310.desc: "Es ist tiefe Nacht. Die Tür ist geschlossen, doch ich finde keinen Schlaf.\n\nAm Bett liegt es nicht, und auch das Kissen ist gut. Ich sitze am Rand und denke erneut an den Menschen, dem ich heute nicht näherkommen konnte. Erst als ich auf meine Hände schaue, merke ich, dass ich das Band meines Nachtgewands gelöst habe. Wann ich das getan habe, weiß ich nicht mehr.\n\nIch betrachte das Band, das neben meinem Bein herabhängt. Noch habe ich mich weder zum Hinlegen noch zum erneuten Zubinden entschieden."
 latria_sexual_frustration_flavor.1310.a: "Einem alten Bekannten schreiben und offen von meinen Sorgen sprechen."
 latria_sexual_frustration_flavor.1310.b: "Den Gedanken unterdrücken, die Kerze löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1301.c: "Ein neues Blatt nehmen und die Einladung zu einem Gedicht machen."
 latria_sexual_frustration_flavor.1302.c: "Das Gespräch wieder auf Familien und Ländereien lenken."
 latria_sexual_frustration_flavor.1302.d: "Eine Geschichte von der Reise erzählen, damit sie wieder ihre Becher erheben."
 latria_sexual_frustration_flavor.1303.c: "Bis zum Morgengrauen bleiben und die heilige Schrift Zeile für Zeile studieren."
 latria_sexual_frustration_flavor.1304.c: "Die Figuren aufstellen und über eine Schachaufgabe nachdenken."
 latria_sexual_frustration_flavor.1304.d: "Mit dem ersten Zug beginnen und langsam eine ganze Partie spielen."
 latria_sexual_frustration_flavor.1305.c: "Die Arbeit des Morgens ordnen, bevor ich die Kerze lösche."
 latria_sexual_frustration_flavor.1307.c: "Ein neues Gedicht vortragen und ihre Aufmerksamkeit auf etwas anderes lenken."
 latria_sexual_frustration_flavor.1308.c: "Das Gebetbuch schließen und meine Gedanken schweigend ordnen."
 latria_sexual_frustration_flavor.1308.d: "Bis zum Morgengebet wachen und die Bücher für alle vorbereiten."
 latria_sexual_frustration_flavor.1309.c: "Aufschreiben, was mich quält, und es Zeile für Zeile bedenken."
 latria_sexual_frustration_flavor.1310.c: "Tee aufbrühen und meine Habseligkeiten und Bücher in Ruhe wegräumen."
