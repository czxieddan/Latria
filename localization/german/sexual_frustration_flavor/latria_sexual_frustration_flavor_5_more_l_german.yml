l_german:
 latria_sexual_frustration_flavor.1411.t: "Niemand an der Tür"
 latria_sexual_frustration_flavor.1411.desc: "Die Lampe ist auf einen Stumpf heruntergebrannt, und ich bin noch wach, das Nachtgewand über meine Hüften hochgeschoben, meine eigene Hand dort, wo ich niemandem gesagt habe, dass sie hingeht. Ich habe aufgehört, das Unruhe zu nennen. Drei Nächte nun habe ich mich an den Rand gebracht und es dort gelassen, auf einen Schritt im Gang lauschend, der nie kommt. Das Laken ist feucht, wo ich zu lange still gelegen habe.\n\nIch denke an die Art, wie sich diese Person beim Festmahl über meinen Stuhl beugte, nah genug, dass ich fühlte, wie die Wärme der Kammer mit ihr ging, als sie sich aufrichtete. Mein Atem kommt kurz. Ich drücke meine Handfläche flach und halte still, und das Verlangen lässt nicht nach, es sammelt sich nur tiefer und schwerer.\n\nIrgendwo unten schließt sich eine Tür. Meine Hand bewegt sich wieder, und diesmal halte ich sie nicht auf."
 latria_sexual_frustration_flavor.1411.a: "Beenden, was meine Hand begonnen hat, und das Verlangen eingestehen."
 latria_sexual_frustration_flavor.1411.b: "Meine Hand fortnehmen und still liegen, bis die Lampe stirbt."
 latria_sexual_frustration_flavor.1411.c: "Ein Gewand anlegen und bei der Stille sitzen, bis sie sich lockert."

 latria_sexual_frustration_flavor.1412.t: "Mehr, als ich wollte"
 latria_sexual_frustration_flavor.1412.desc: "Die Halle ist laut vom letzten Wein, und ich habe schon zu viel gesagt. Die Person neben mir fragte, wo ich eine solche Geschichte gelernt habe, und ich sagte es ihr, und dann sagte ich ihr den Rest, den Teil, den ich bei Tageslicht nie laut gesagt habe.\n\nJemand lacht und ruft nach mehr. Ich höre meine eigene Stimme weitergehen, schneller, das Detail hinzufügend, das ich immer auslasse, die Stunde, die Tür, die Art, wie ich wartete. Der Wein hat mein Gesicht heiß gemacht. Irgendwo hinter mir wird ein Becher abgesetzt. Ich kann mich nicht dazu bringen, an der Stelle aufzuhören, an der ein sorgfältiger Mensch aufhören würde.\n\nDer Stuhl der Person neben mir scharrt zurück. Die Musik hat geendet, und noch niemand ist heimgegangen, und die Halle riecht nach Talg und verschüttetem Wein, und ich halte noch den Becher, den ich hatte absetzen wollen."
 latria_sexual_frustration_flavor.1412.a: "Den Rest sagen und die ganze Tafel hören lassen."
 latria_sexual_frustration_flavor.1412.b: "Mich vor der Gesellschaft verneigen, den Rest hinter den Zähnen behalten und gehen."
 latria_sexual_frustration_flavor.1412.c: "Das Gespräch auf alte Freundschaften lenken und den Wein den Rest tun lassen."

 latria_sexual_frustration_flavor.1413.t: "Dieselben drei Zeilen"
 latria_sexual_frustration_flavor.1413.desc: "Ich knie am Altar, das Nachtgewand unter den Knien, der Stein kalt durch den Stoff. Die Platten haben meinen Schienbeinen die Wärme genommen. Die dienende Person ist gegangen. Ich habe das ganze Amt aufgesagt, und mein Mund kehrt immer wieder zu denselben drei Zeilen zurück, denjenigen über das Fleisch, als wären die Wörter eine Tür, an der ich immer vorbeigehe.\n\nBei Tageslicht kann ich das eine Prüfung nennen und damit fertig sein. Hier, mit den flackernden Kerzen und niemandem, der sieht, kann ich nur ermessen, wie viel von mir den Tempel verlassen und ein bestimmtes Haus erreichen will, ehe die Wache wechselt. Das Verlangen hat ein Gewicht. Meine Knie schmerzen davon, es zu tragen.\n\nDie Kerze, die mir am nächsten ist, neigt sich und richtet sich wieder auf. Ich lege meine Hand auf den kalten Stein und stehe nicht auf."
 latria_sexual_frustration_flavor.1413.a: "Das Amt unvollendet lassen und dorthin gehen, wohin ich will."
 latria_sexual_frustration_flavor.1413.b: "Die Nachtwache halten und an den Worten festhalten bis zum Morgengrauen."
 latria_sexual_frustration_flavor.1413.c: "Die Stelle langsam lesen und den Sinn zu mir zurückkommen lassen."

 latria_sexual_frustration_flavor.1414.t: "Der Ritt hilft nicht"
 latria_sexual_frustration_flavor.1414.desc: "Wir sind seit vor dem Licht im Sattel, und das Wild ist noch vor uns. Meine Hände sind ruhig am Zügel. Das ist das Schlimme. Alles andere in mir ist nicht ruhig, seit Tagen nicht, und der Ritt hat es nur losgeschüttelt.\n\nIch sehe immer wieder diese Person bei der letzten Jagd, lachend, das Haar nass vom Bach, und ich kann das Bild nicht weglegen. Die Hunde öffnen. Ich lasse dem Pferd den Kopf, und der Boden geht schnell vorbei, und für ein paar Längen denke ich an gar nichts.\n\nDann schließt sich der Wald, und das Tempo fällt, und das Ganze kommt zurück. Ich sitze im Sattel mit brennenden Schenkeln, dem Riemen des Horns zu einem Mal an meiner Hüfte verschliffen, und hebe es nicht."
 latria_sexual_frustration_flavor.1414.a: "Aus der Reihe brechen und reiten, bis der Gedanke aus mir ist."
 latria_sexual_frustration_flavor.1414.b: "Die Reihe halten, das Horn nehmen und die Ordnung der Jagd wahren."
 latria_sexual_frustration_flavor.1414.c: "Den Boden lesen, auf den die Person zeigt, die die Jagd führt, und den Spuren folgen."

 latria_sexual_frustration_flavor.1415.t: "Die verriegelte Tür"
 latria_sexual_frustration_flavor.1415.desc: "Die Lampe ist niedrig, die Tür verriegelt, und die Person, die ich ein Jahr gewollt habe, ist hier, in meiner Kammer, entkleidet, mit flach auf meiner Brust liegender Hand. Ihre Hand ist warm durch den Stoff.\n\nIch ziehe sie aufs Bett hinunter, und ihr Gewicht ist wirklich, die Hitze der Haut, der kleine Laut an meinem Ohr. Die Bettseile knarren unter uns. Ich habe es mir so oft vorgestellt, dass mich die Tatsache davon beinahe auflöst, ehe etwas geschehen ist. Meine Hüften heben sich. Ihr Mund findet meine Kehle, und ich höre auf, meinen eigenen Atem zu zählen.\n\nDanach brennt die Lampe noch, ein langer Faden Wachs, der am Halter heruntergelaufen ist. Ihr Haar liegt über meinem Arm ausgebreitet, und keine von uns hat ein Wort über den Morgen gesagt."
 latria_sexual_frustration_flavor.1415.a: "Sie hierbehalten und das Haus reden lassen, wenn es muss."
 latria_sexual_frustration_flavor.1415.b: "Sie in ihre eigene Kammer zurückschicken und mich allein hinlegen."
 latria_sexual_frustration_flavor.1415.c: "Nach einem Buch greifen und lesen, bis meine Hände still sind."

 latria_sexual_frustration_flavor.1416.t: "Das Handgelenk gegenüber"
 latria_sexual_frustration_flavor.1416.desc: "Der Rat hat sich in die Länge gezogen, und ich habe nichts unterschrieben. Mein Siegel liegt kalt neben der Tinte. Das Feuer ist ausgehen gelassen worden, und niemand hat nach Holz gerufen. Wer mir vorliest, liest die nächste Zeile, und ich höre die Form der Wörter ohne den Sinn, denn die Person über die Tafel hat den Ärmel zurückgeschoben, und ich sehe ihr Handgelenk an.\n\nWer mein Vertrauen hat, fängt meinen Blick auf. Ich zwinge mich, die Klausel noch einmal vorlesen zu lassen. Sie wird noch einmal vorgelesen. Ich verstehe nichts davon. Unter dem Tisch hat mein Knie begonnen, sich zu bewegen, und ich drücke es mit meiner Hand still.\n\nAls die Lords aufstehen, bleibe ich sitzen, bis sich die Kammer geleert hat. Wer mein Vertrauen hat, wartet mit den Papieren an der Tür, ohne etwas zu sagen, und ich bin dankbar und kann sie nicht ansehen."
 latria_sexual_frustration_flavor.1416.a: "Den Rat entlassen und mir den Nachmittag nehmen."
 latria_sexual_frustration_flavor.1416.b: "Meinen Platz behalten, die Papiere nehmen und es der Person beichten, die mein Vertrauen hat."
 latria_sexual_frustration_flavor.1416.c: "Den Schreiber zurückrufen und jede Klausel ordnen, ehe ich aufstehe."

 latria_sexual_frustration_flavor.1417.t: "Dieselbe Frage zweimal"
 latria_sexual_frustration_flavor.1417.desc: "Der Tempel ist leer, und wer mich führt, ist noch da und ordnet die Schriftrollen, und ich bin nicht gegangen, weil ich mich nicht dazu bringen kann zu gehen. Ich stellte eine Frage über den Ritus und stellte dann noch eine, und beide waren dieselbe Frage in verschiedenen Kleidern.\n\nDie Person antwortet geduldig. Die Rollen riechen nach Staub und Zedernöl. Ich sehe zu, wie die Hände sich unter ihnen bewegen, und denke an die Stunde der Nacht und daran, wie weit der Weg zu einer bestimmten Tür ist und ob jemand wach wäre. Die Lampe zwischen uns ist das Einzige, was mich auf meinem Platz hält.\n\nSie legt mir eine Rolle hin und wartet. Meine Knie sind auf der kalten Stufe steif geworden. Ich lege meine Hand auf die Rolle und lese das erste Wort und nicht das zweite."
 latria_sexual_frustration_flavor.1417.a: "Danken, hinausgehen und zu jener Tür gehen."
 latria_sexual_frustration_flavor.1417.b: "Bitten, den Ritus noch einmal durchzugehen, langsam."
 latria_sexual_frustration_flavor.1417.c: "Die Rolle aufrollen und zuhören, was gesagt wird."

 latria_sexual_frustration_flavor.1418.t: "Ein Name im Garten"
 latria_sexual_frustration_flavor.1418.desc: "Der Garten ist voll von Menschen, und ich habe gerade genug getrunken, um ehrlich zu sein. Mein Becher ist zweimal gefüllt worden, ohne dass ich bat. Ich sagte das Ding laut. Nicht das Ganze, aber den Teil mit einem Namen darin, und der Name war nicht der eines fremden Menschen.\n\nDas Lachen ging um die Gruppe, und jemand wiederholte es, und jemand anderes sah mich mit neuem Interesse an. Der Kies zeigt, wo sich der Kreis verschoben hat. Ich hätte es als Wein durchgehen lassen sollen. Stattdessen habe ich mehr gesagt, und der Kreis ist still geworden, so wie ein Kreis still wird, wenn er beschlossen hat, sich zu erinnern.\n\nEin Diener geht mit einem Tablett den Pfad entlang. Ich nehme einen Becher, den ich nicht will, und halte ihn an meinen Mund, um die Stille nicht zu füllen."
 latria_sexual_frustration_flavor.1418.a: "Den Namen noch einmal sagen, deutlich, vor ihnen allen."
 latria_sexual_frustration_flavor.1418.b: "Eine Verbeugung machen, mich verabschieden und den Garten verlassen."
 latria_sexual_frustration_flavor.1418.c: "Die nächste Person beiseiteziehen und von etwas anderem sprechen."

 latria_sexual_frustration_flavor.1419.t: "Seit dem Gang"
 latria_sexual_frustration_flavor.1419.desc: "Ich habe die Tür verriegelt und die Decken zurückgeschlagen, und ich will nicht länger so tun, als wäre ich zu müde. Mein Leib ist so seit dem Nachmittag, seit einer Hand an meinem Arm im Gang, und er hat sich nicht beruhigt.\n\nIch lege meine Finger an mich, und mein Atem geht aus mir heraus auf eine Weise, die ich nicht gehört haben wollte. Ich denke an den Gang, an das Leinen jenes Ärmels, an den genauen Druck der Finger. Mein Rücken wölbt sich vom Bett. Ich muss meine andere Hand über meinen Mund legen.\n\nEs dauert lange und lässt mich zitternd zurück. Die Lampe brennt noch. Ich liege mit dem Arm über den Augen, die Laken bis zur Taille verdreht, noch nach der Hitze des Tages riechend, und das Verlangen ist nicht fort, nur leiser."
 latria_sexual_frustration_flavor.1419.a: "Es seinen Lauf nehmen lassen und aufhören, so zu tun, als wäre ich müde."
 latria_sexual_frustration_flavor.1419.b: "Die Hände ballen, langsam atmen und warten, bis das Zittern vorübergeht."
 latria_sexual_frustration_flavor.1419.c: "Eine Seite im Lampenlicht lesen, bis mein Leib still wird."

 latria_sexual_frustration_flavor.1420.t: "Zwei Tage im Sattel"
 latria_sexual_frustration_flavor.1420.desc: "Zwei Tage im Sattel, und die Steppe geht endlos weiter. Der Sattel hat unter meinem Knie eine wunde Stelle gescheuert. Mein Pferd kennt das Tempo besser als ich. Ich habe seit dem Aufbruch aus dem Lager nicht richtig geschlafen, und es ist nicht der Boden, auf dem ich liege, der mich wach hält.\n\nIch denke an diese Person, die am Feuer ihr Haar flocht, an die Art, wie sie das Ende des Fadens zwischen die Zähne nahm. Der Wind ist kalt und meine Hände sind rissig, und immer noch kommt der Gedanke zurück und setzt sich tief in mir nieder, beharrlich wie ein zweiter Herzschlag.\n\nWir kommen über eine Anhöhe, und das Gras geht zum Fluss hinunter, eine fahle Linie ohne Laut darin. Ich könnte allein zurückreiten. Das Pferd verlagert sich unter mir, wartend, und ich sitze da mit losen Zügeln und reite nicht zurück."
 latria_sexual_frustration_flavor.1420.a: "Zum Lager zurückreiten und nehmen, was die Nacht bietet."
 latria_sexual_frustration_flavor.1420.b: "Mit den anderen weiterreiten und das Tempo halten."
 latria_sexual_frustration_flavor.1420.c: "Den Falken lösen und seinem Flug zum Wasser folgen."

 latria_sexual_frustration_flavor.1421.t: "Jenseits der Sorgfalt"
 latria_sexual_frustration_flavor.1421.desc: "Das Festmahl ist über den Punkt hinausgegangen, an dem noch jemand sorgfältig ist. Ich habe diese Person den ganzen Abend angesehen, kein einziges Mal weggesehen, und ich habe es eben gesagt, in den Raum hinein, mit einer Stimme, die trug.\n\nEin Becher fällt um. Die Musikanten haben nicht wieder eingesetzt. Jemand lacht, jemand ruft nach ihr, und ich stehe mit den Worten, die noch kommen. Ich habe die Stunde genannt, die ich will, und den Ort, und die Kammer hat es gehört. Es gibt keine Fassung von morgen, in der das nur ein Scherz ist.\n\nDie Person neben mir zieht an meinem Ärmel. Ich setze mich, weil meine Beine unsicher geworden sind, Wachs ist über die Tafel bis zu meinem Ärmel gelaufen, und der Becher wird mir wieder in die Hand gestellt, und ich sehe noch immer über die Tafel."
 latria_sexual_frustration_flavor.1421.a: "Die Stunde und den Ort noch einmal sagen, damit niemand sich verhört."
 latria_sexual_frustration_flavor.1421.b: "Sitzen, trinken und den Lärm über das sinken lassen, was ich sagte."
 latria_sexual_frustration_flavor.1421.c: "Mich der Person neben mir zuwenden und nach ihrem eigenen Haus fragen."
 latria_sexual_frustration_flavor.1421.d: "Das Ganze in ein Gedicht für die Tafel bringen."

 latria_sexual_frustration_flavor.1422.t: "Drei Nächte Nachtwache"
 latria_sexual_frustration_flavor.1422.desc: "Ich habe drei Nächte hintereinander die Nachtwache gehalten, und das Fasten hat mich leicht im Kopf gemacht. Die Kälte ist in die kleinen Knochen meiner Füße eingedrungen. Die Worte des Amts sind in meinem Mund und die Person in meinem Sinn, und die beiden haben sich so verwickelt, dass sie nicht mehr zu trennen sind.\n\nIch weiß, was das Gelübde verlangt. Ich habe es willig gesprochen und habe es bis heute Nacht nie unwillig gesprochen. Meine Hände sind kalt, und mein Magen hat vergessen, was Brot ist. Der Stein unter meinen Knien hat eine glatte Stelle ausgewaschen, und ich füge mich hinein, als hätte ich hier jahrelang gekniet, was in der Hinsicht, auf die es ankommt, zutrifft.\n\nIrgendwo in der Dunkelheit hustet jemand, und jemand anderes verlagert sich hinter der Säule auf einer Bank. Ich neige den Kopf tiefer, und das Gebet geht ohne meine Stimme weiter."
 latria_sexual_frustration_flavor.1422.a: "Das Fasten brechen, die Nachtwache verlassen und eingestehen, was ich will."
 latria_sexual_frustration_flavor.1422.b: "Das Fasten halten und das Gelübde durch den Rest der Nacht tragen."
 latria_sexual_frustration_flavor.1422.c: "Mich der Stelle über die Seele zuwenden und sie durchlesen."

 latria_sexual_frustration_flavor.1423.t: "Die falsche Ziffer"
 latria_sexual_frustration_flavor.1423.desc: "Die Konten gehen nicht auf, und ich habe dieselbe Spalte viermal gelesen. Die Kerze ist neu, und das Wachs ist nicht gelaufen. Über die Kammer hinweg diktiert jemand einem Schreiber, und die Stimme ist eine, die ich in einer Menge erkennen würde, und mein Sinn hat die Spalte ganz verlassen.\n\nIch lege meinen Finger auf die Seite, um meine Stelle zu halten. Sie hält nicht. Die Feder des Schreibers bewegt sich weiter. Ich kann meinen eigenen Puls in der Kehle fühlen, was lächerlich ist, und die Kammer ist kalt, und mir ist nicht kalt.\n\nAls das Diktat aufhört, sehe ich zu schnell auf. Der Schreiber wartet. Ich bitte um die Ziffer noch einmal und schreibe die falsche auf, und die Tinte trocknet darauf, und ich berichtige sie nicht, bis sich die Kammer geleert hat."
 latria_sexual_frustration_flavor.1423.a: "Die Konten beiseitelegen und dorthin gehen, wohin die Stimme geht."
 latria_sexual_frustration_flavor.1423.b: "Bei der Spalte bleiben, bis jede Ziffer richtig ist."
 latria_sexual_frustration_flavor.1423.c: "Nach dem Hauptbuch schicken und jeden Eintrag von Anfang an prüfen."

 latria_sexual_frustration_flavor.1424.t: "Der unberührte Wein"
 latria_sexual_frustration_flavor.1424.desc: "Die Tür ist verriegelt, der Wein unberührt, und die Person, die ich gewollt habe, ist hier mit offenem Gewand und den Händen an meinem Gesicht. Ihre Hände sind zuerst kalt und dann nicht.\n\nIch ziehe sie an mich, und das Ganze ist wärmer und unbeholfener als alles, was ich mir vorgestellt habe. Ihr Knie findet das Bett, und der Rahmen stößt einmal gegen die Wand. Meine Hand geht an ihr Kreuz und tiefer, und der Laut, den sie macht, ist nicht leise, und es kümmert mich nicht, wer ihn hört. Ich zittere davon, wie lange ich gewartet habe.\n\nSpäter ist die Lampe heruntergebrannt und der Wein im Becher warm geworden. Ihr Kopf liegt auf meiner Schulter, mein Arm ist darunter eingeschlafen, und ich lausche ihrem Atem."
 latria_sexual_frustration_flavor.1424.a: "Ihr offen sagen, was mich das Jahr des Wartens gekostet hat."
 latria_sexual_frustration_flavor.1424.b: "Zurücktreten, das Gewand gerade ziehen und meine Hände bei mir behalten."
 latria_sexual_frustration_flavor.1424.c: "Still liegen und bei der niedrigen Lampe lesen, bis der Schlaf kommt."

 latria_sexual_frustration_flavor.1425.t: "Fleißige Hände"
 latria_sexual_frustration_flavor.1425.desc: "Ich bin drei Tage im Wald, und die Jagd ist gut gewesen, und nichts davon hat das Ding in mir berührt. Ich bin fleißig. Ich stehe vor den anderen auf, ich sehe das Zeug trocknen, ich nehme die Linie, die mir die Person setzt, die die Meute führt. Meine Hände tun, was man ihnen sagt.\n\nDer Rest von mir ist woanders. Ich erinnere mich an einen bestimmten Nachmittag, an eine Tür, an eine Person, die meinen Namen auf eine Weise sagte, die ich nicht vergessen kann, und die Erinnerung kommt, während ich in den Steigbügeln stehe, und wieder, während ich das Wild ausnehme, mit dem Geruch des Fells an meinen Händen.\n\nDas Feuer ist niedrig, und die Glut tickt, während sie kühlt. Meine Arme schmerzen vom Tag, und ich liege auf dem Rücken mit offenen Augen und lausche, wie die Pferde sich verlagern."
 latria_sexual_frustration_flavor.1425.a: "Die Linie verlassen und den Grauschimmel ins Dunkel hinausnehmen."
 latria_sexual_frustration_flavor.1425.b: "Atmen, den Sattelgurt anziehen und die Arbeit des Tages beenden."
 latria_sexual_frustration_flavor.1425.c: "Das Zeug trocknen sehen und die Zählung führen, ehe ich schlafe."

 latria_sexual_frustration_flavor.1426.t: "Anderthalb Seiten"
 latria_sexual_frustration_flavor.1426.desc: "Das Arbeitszimmer ist still, und wer mich führt, hat den Text ausgelegt, und ich habe anderthalb Seiten gelesen, ohne ein Wort aufzunehmen. Mein Daumen hat einen Abdruck am Rand hinterlassen. Die Lampe ist gut. Die Nacht ist lang. Nirgends werde ich erwartet.\n\nIch denke immer wieder an die Stunde, in der der Haushalt schläft und der Gang leer ist. Die Person wendet eine Seite und fragt, ob ich der Auseinandersetzung folge. Ich sage, ich täte es. Ich folge ihr nicht mehr seit der ersten Zeile über die Natur der Seele, was schade ist, denn das ist die Zeile, die ich am meisten brauche.\n\nSie wartet, die Feder in der Hand, und der Stuhl hat eine Fuge, die klagt, wenn ich mich bewege. Ich sehe die Seite an, und meine eigene Hand liegt flach auf dem Holz, sehr still, als gehörte sie jemandem, der ruhiger ist."
 latria_sexual_frustration_flavor.1426.a: "Das Buch schließen und hinausgehen, während der Gang leer ist."
 latria_sexual_frustration_flavor.1426.b: "Meinen Platz behalten und die Seite von oben wieder lesen."
 latria_sexual_frustration_flavor.1426.c: "Bitten, die Auseinandersetzung noch einmal durchzugehen."

 latria_sexual_frustration_flavor.1427.t: "Freigebig mit dem Wein"
 latria_sexual_frustration_flavor.1427.desc: "Ich bin freigebig mit dem Wein gewesen, und die Gesellschaft ist es mir gegenüber gewesen, und irgendwo darin habe ich der Tafel gesagt, was ich will. Nicht offen. Offen genug. Es ist eine Person hier, deren Namen ich sagte und deren Gesicht ich beim Sagen nicht ansah.\n\nJemand hat aufgehört zu lachen, und ein Hund zerrt unter der Bank an etwas. Mein Becher ist leer, und ein Diener füllt ihn, und ich lasse sie. Die Kammer hat die Stille von Menschen, die entscheiden, was sie mit einem Ding tun, das man ihnen in die Hand gegeben hat.\n\nDer Platz meiner Schwester ist heute Abend leer, und ihr Becher steht noch, wo der Diener ihn hinstellte, was eine Gnade ist, die ich nicht verdiene. Ich lege beide Hände auf die Tafel, und das Holz ist kühl, und die Musik setzt auf der fernen Seite der Halle wieder ein."
 latria_sexual_frustration_flavor.1427.a: "Es noch einmal sagen, mit dem Namen, und die Familie es hören lassen."
 latria_sexual_frustration_flavor.1427.b: "Der Gesellschaft danken, meinen Mantel nehmen und gehen."
 latria_sexual_frustration_flavor.1427.c: "Die Becher ringsum füllen und das Gespräch auf die Ernte lenken."
 latria_sexual_frustration_flavor.1427.d: "Mit der Person, die am lautesten ist, Scherze tauschen, bis die Kammer weiterzieht."

 latria_sexual_frustration_flavor.1428.t: "Die Ikonen sehen zu"
 latria_sexual_frustration_flavor.1428.desc: "Der Tempel ist kalt, und die Ikonen sehen alle zu, und ich habe mich seit einer Stunde nicht bewegt. Meine Knie sind taub geworden. Das Begehren nicht. Es sitzt in mir wie eine Kohle, die sich nicht zudecken lässt. Der Kerzenrauch geht gerade aufwärts, ohne Zug.\n\nIch habe um Erlösung gebetet und um Kraft gebetet, und ich bin ehrlich genug, hier, zu wissen, welche der beiden ich erhört haben will. Das Gesicht dieser Person kommt zwischen mich und das Gold. Ich schiebe es nicht fort. Die Lampe riecht nach Öl, und der Marmor ist kalt, und mein Leib ist an beidem nicht interessiert.\n\nDie Schritte der priesterlichen Person gehen hinter mir vorbei. Ich halte den Kopf gesenkt und die Hände zusammen, meine Knie hinterlassen zwei feuchte Abdrücke auf dem Stein, und mein Sinn ist bei einer Tür auf der anderen Seite der Stadt."
 latria_sexual_frustration_flavor.1428.a: "Aufstehen, die Stadt durchqueren und die Ikonen ihre Wache halten lassen."
 latria_sexual_frustration_flavor.1428.b: "Das Gelübde halten und auf dem Marmor bleiben, bis das Amt endet."
 latria_sexual_frustration_flavor.1428.c: "Das Buch bei den Psalmen öffnen und lesen, bis die Worte halten."

 latria_sexual_frustration_flavor.1429.t: "Die Mauer im Mittsommer"
 latria_sexual_frustration_flavor.1429.desc: "Der Garten gehört zu dieser Stunde niemandem, und ich bin darin, weil das Bett schlimmer war. Die Nacht ist warm. Der Kiespfad hat die Hitze des Tages behalten. Irgendwo läuft ein Brunnen, die einzige Stimme im Garten, und der Geruch der Kräuter ist stark genug, um ihn zu schmecken.\n\nIch habe zwei Nächte nicht geschlafen. Ich gehe den Pfad, und der Kies ist laut, und jede Wendung bringt mich zu derselben Mauer zurück, an die ich mich mit dieser Person im Mittsommer lehnte, ohne etwas zu sagen, beide wissend.\n\nMeine Hand liegt auf dem Stein. Er ist noch warm. Eine Motte kehrt immer wieder zur Lampe hinter mir zurück. Ich stehe da, die Stirn nahe an der Mauer, und mein Atem geht schlecht, und der Brunnen läuft weiter."
 latria_sexual_frustration_flavor.1429.a: "Durch das Tor hinausgehen und es der Nacht sagen."
 latria_sexual_frustration_flavor.1429.b: "Das Gelübde halten, meine Hand von der Mauer nehmen und hineingehen."
 latria_sexual_frustration_flavor.1429.c: "Den Pfad gehen, bis der Himmel grau wird und meine Beine müde sind."

 latria_sexual_frustration_flavor.1430.t: "Die Saiten sind kalt"
 latria_sexual_frustration_flavor.1430.desc: "Ich habe das Instrument herausgenommen, weil das Haus schläft und ich nicht länger liegen konnte. Die Saiten sind kalt, und das Plektrum ist auf einer Seite dünn gespielt. Ich spiele das, was ich immer spiele, und es ist nicht genug, ist seit einer Woche nicht genug.\n\nMeine Finger kennen das Muster, und der Rest von mir ist ganz woanders, in einer Kammer mit noch geschlossenen Läden, an einem Nachmittag, zu dem ich immer wieder zurückkehre. Die Töne gehen in die Dunkelheit hinaus, und niemand hört sie.\n\nIch höre auf, die Hand flach über die Saiten gelegt, um den Klang zu töten. Die Stille danach ist schlimmer. Ich sitze mit dem Instrument über den Knien, die Saiten in der Kälte schlaff geworden, den Kopf gegen die Stuhllehne zurückgelegt und das Fenster am Rand grau werdend."
 latria_sexual_frustration_flavor.1430.a: "Es durchspielen, schlecht, bis das ganze Haus es hört."
 latria_sexual_frustration_flavor.1430.b: "Das Instrument hinlegen und den Rest der Nacht absitzen."
 latria_sexual_frustration_flavor.1430.c: "Das Brett aufstellen und beide Seiten spielen, bis das Licht kommt."

 latria_sexual_frustration_flavor.1431.t: "Die Naht im Dunkeln"
 latria_sexual_frustration_flavor.1431.desc: "Die Kerze flackerte vor einer Stunde, und ich habe die Decke nicht hochgezogen. Mein Nachtgewand ist um meine Taille gerafft. Meine Finger haben die Naht davon gefunden und sind dann darunter gegangen, langsam, so wie ich es mir beigebracht habe, wenn die Gänge still sind. Ich halte die Augen geschlossen und hole die Person zurück, die mir letzte Woche den Wein einschenkte, die Art, wie ihr Ärmel mein Handgelenk streifte und einen Atemzug zu lang blieb.\n\nMein Atem fängt sich und hält. Ich bewege meine Hand, und das Verlangen zieht sich enger, tiefer, ein Knoten, der an beiden Enden gezogen wird. Ich denke an ihren Mund nahe an meinem Ohr, an die Worte, die sie nicht beendete. Das Leinen ist warm und feucht unter meiner Handfläche.\n\nEin Brett knarrt im Gang. Meine Hand wird still, dann beginnt sie wieder, und ich lasse sie, und die Dunkelheit behält mein Geheimnis noch einen Augenblick länger."
 latria_sexual_frustration_flavor.1431.a: "Es im Dunkeln beenden und den Hunger bekennen."
 latria_sexual_frustration_flavor.1431.b: "Meine Hand zurückziehen und starr liegen, bis der Docht ertrinkt."
 latria_sexual_frustration_flavor.1431.c: "Die Decke um mich wickeln und warten, bis der Schmerz nachlässt."

 latria_sexual_frustration_flavor.1432.t: "Unvollendete Vesper"
 latria_sexual_frustration_flavor.1432.desc: "Die Kapelle hat sich geleert, und ich knie im Nachtgewand auf dem kalten Stein, meine Gebete dünn und wandernd. Die Person, die mir zuletzt die Beichte abnahm, legte ihre Hand auf meinen geneigten Kopf und ließ sie dort, und ich habe das Gewicht davon seither nicht ablegen können. Meine Handflächen pressen meine Schenkel durch den dünnen Stoff, und das Pressen ist kein Gebet.\n\nIch verlagere mich auf den Knien. Der Stein ist ein Schock durch das Leinen. Ich denke an jene Hand, an ihre Wärme, an die Art, wie ich mich einen Bruchteil hineinlehnte, ehe ich mich fing. Mein Atem geht zerfasert in der gewölbten Stille, und ich presse härter, suche und finde die Erlösung nicht, um die ich zu bitten kam.\n\nDas Glockenseil hängt still über mir. Ich hebe das Gesicht zum dunklen Altar und behalte meine Hände, wo sie sind."
 latria_sexual_frustration_flavor.1432.a: "Dem Leib geben, was das Gebet ihm verweigerte."
 latria_sexual_frustration_flavor.1432.b: "Die Hände falten und die Nachtwache bis zum Morgengrauen halten."
 latria_sexual_frustration_flavor.1432.c: "Das Buch öffnen und lesen, bis die Worte mich kühlen."

 latria_sexual_frustration_flavor.1433.t: "Das Farnbett"
 latria_sexual_frustration_flavor.1433.desc: "Die Jagd hat sich in der Dämmerung verstreut, und ich bin allein im grünen Dunkel, mein Pferd grast in der Nähe. Ich gleite an einem bemoosten Stamm hinunter, und meine Reitkleider sind feucht von Schweiß. Die Erinnerung, die mich jagt, ist die Person, die mich um die Taille fasste, um mich über den Bach zu heben, ihre Brust hart an meinem Rücken, ihr Atem an meinem Hals. Meine Hand ist in meinen Gürtel geschlüpft.\n\nIch drücke, und die Rinde beißt in meine Schulter. Ich denke an ihre Arme, an die Art, wie sie nicht sogleich losließ. Mein Atem raucht in der kalten Luft. Das Verlangen windet sich mit jedem langsamen Strich enger, und der Wald hält seine Stille um mich, die Blätter tropfen irgendwo außer Sicht.\n\nEin Zweig bricht. Meine Hand erstarrt. Das Pferd hebt den Kopf, und ich bleibe an dem Baum, mein Puls laut in meinen Ohren."
 latria_sexual_frustration_flavor.1433.a: "Hier am Baum die Schärfe nehmen."
 latria_sexual_frustration_flavor.1433.b: "Meine Hand zurückziehen und langsam atmen, bis es vorübergeht."
 latria_sexual_frustration_flavor.1433.c: "Aufstehen und das Pferd zwischen den Bäumen zurückführen."

 latria_sexual_frustration_flavor.1434.t: "Die ungesandte Nachricht"
 latria_sexual_frustration_flavor.1434.desc: "Das Feuer im Arbeitszimmer ist niedrig, und der Brief liegt halb geschrieben unter meiner Hand, der, den ich nicht senden werde. Ich lese die letzte Zeile, die ich hingesetzt habe, eine ehrliche Zeile, zu ehrlich, und meine andere Hand hat sich zu den Bändern meiner Beinkleider geschlichen. Ich denke an die gesandte Person, die zu nah über eben diesem Pult stand und mein Gesicht las statt der Karte und lächelte.\n\nIch arbeite die Bänder los. Mein Atem verkürzt sich. Ich hole die Neigung ihres Kopfes zurück, die Einladung darin, die ich zu sorgfältig war zu beantworten, und meine Hand bewegt sich mit einem eigenen Willen, die Feder trocken in der anderen. Das Feuer tickt. Das Verlangen sammelt sich und lässt sich nicht zu etwas hinunterreden, das ich weglegen könnte.\n\nDie Kerze neigt sich in einem Zug. Ich schließe die Augen und lasse den Gedanken beenden, was die gesandte Person begann."
 latria_sexual_frustration_flavor.1434.a: "Die Wahrheit hinsetzen und den Schmerz lindern, den sie entzündet hat."
 latria_sexual_frustration_flavor.1434.b: "Die Bänder binden und mich mit einem kühlen Wort zurückziehen."
 latria_sexual_frustration_flavor.1434.c: "Die Karte aufnehmen und die Sache kalt erwägen."

 latria_sexual_frustration_flavor.1435.t: "Nach dem letzten Becher"
 latria_sexual_frustration_flavor.1435.desc: "Das Festmahl ist auf ein paar flackernde Kerzen ausgedünnt, und die Person mir gegenüber ist nicht gegangen. Unter dem Tisch ist mein Knie an ihres zur Ruhe gekommen, und keine von uns hat es bewegt. Der Wein summt in mir. Ich denke an die Art, wie sie über meinen Scherz lachte und sich hineinbeugte, nah genug, dass ich meinen Mund die kleine Strecke zu ihrem hätte drehen können.\n\nMeine freie Hand packt die Bank. Ich will diese Lücke schließen, mehr als ich seit einem Alter irgendetwas gewollt habe, und das Verlangen ist ein heller Draht, straff gezogen von meiner Kehle bis zu meinem Bauch. Sie sieht mich über den Rand des Bechers an. Der letzte Diener ist gegangen. Die Halle riecht nach verbrauchtem Talg und nach uns beiden atmend.\n\nIhr Knie drückt einmal zurück. Meine Hand verlässt die Bank und findet den Rand ihres Ärmels, und keine von uns spricht."
 latria_sexual_frustration_flavor.1435.a: "Die Musik das, was ich als Nächstes tue, decken lassen."
 latria_sexual_frustration_flavor.1435.b: "Den Kopf neigen und das Verlangen in ein Gebet schulen."
 latria_sexual_frustration_flavor.1435.c: "Ein Spiel vorschlagen und mich vom Brett kühlen lassen."
