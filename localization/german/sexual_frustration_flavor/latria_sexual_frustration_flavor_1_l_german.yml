l_german:
 latria_sexual_frustration_flavor.1001.t: "Eine lange Nacht hinter dem Vorhang"
 latria_sexual_frustration_flavor.1001.desc.female: "Im Nachtgewand sitze ich am Fenster, einen ungeöffneten Brief auf dem Schoß. Durch einen Spalt im Vorhang fällt Mondlicht auf die Fingerspuren an der Faltkante. Wer ihn schrieb, ist längst fort. Ich habe den Brief vom Boden der Schatulle hervorgeholt, zurückgelegt und wieder hervorgeholt.\n\nIch denke an unsere letzte Begegnung. Ein Satz blieb unvollendet, als sollte noch etwas folgen, doch die Hand zog sich bereits zurück. Ich nickte damals nur. Nicht einmal eine Bitte zu bleiben brachte ich heraus. Nun, in der tiefen Nacht, ist mir dieser halbe Satz deutlicher gegenwärtig als der ganze Brief.\n\nDer Wind bewegt den Vorhang, und das Papier raschelt leise. Ich lege die Fingerspitzen auf das Siegelwachs. Ich öffne den Brief nicht, lege ihn aber auch nicht in die Schatulle zurück."
 latria_sexual_frustration_flavor.1001.desc.male: "Im Nachtgewand sitze ich am Fenster, einen ungeöffneten Brief auf dem Schoß. Durch einen Spalt im Vorhang fällt Mondlicht auf die vertraute Handschrift des Umschlags. Wer ihn schrieb, ist schon lange fort; der Brief lag all die Zeit unter meinen Rechnungsbüchern.\n\nIch erinnere mich an den letzten Blick vor dem Abschied. Es war, als würde noch eine Antwort von mir erwartet. Ich hatte damals anderes zu tun und sagte nur, wir könnten ein andermal sprechen. Als dieses Andermal kam, war niemand mehr da. Der Blick dagegen ist mir geblieben.\n\nDraußen ertönt der Ruf der Nachtwache. Ich drehe den Brief um und wieder zurück. Das Siegel ist noch immer unversehrt."
 latria_sexual_frustration_flavor.1001.desc: "In der späten Nacht kehren die Gedanken an das zurück, was zwischen uns offenblieb.\n\nIch nehme den Brief auf, betrachte seinen Verschluss und lege ihn wieder auf meinen Schoß. Niemand sonst ist im Zimmer; selbst das Knacken des Lampendochts höre ich deutlich. Ich versuche, an die Aufgaben des morgigen Tages zu denken, doch meine Gedanken kommen immer wieder am selben Punkt an.\n\nDer Vorhang bewegt sich leicht. Den Brief habe ich noch. Den Menschen, der ihn schrieb, nicht."
 latria_sexual_frustration_flavor.1001.a: "Den Brief zu Ende lesen und an seinen Verfasser denken."
 latria_sexual_frustration_flavor.1001.b: "Den Brief wegschließen und den Gedanken unterdrücken."
 latria_sexual_frustration_flavor.1001.c: "Ein frisches Blatt nehmen und ein Gedicht daraus machen."

 latria_sexual_frustration_flavor.1002.t: "Würze beim Festmahl"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Der Duft der Gewürze überdeckt den Wein. Die Musiker spielen bereits ihr drittes Stück, und noch immer sitzen manche Gäste dicht beieinander im Gespräch. Niemand nimmt hier an solcher Nähe Anstoß. Man lacht und reicht die Becher weiter.\n\nIch hingegen achte auf jeden Blick. Jemand hebt mir den Becher entgegen, und ich erwidere den Gruß, suche dabei aber weiter nach dem Gesicht, das fehlt. Über den Scherz meines Tischnachbarn lache ich einen Augenblick zu spät.\n\nAls mir eingeschenkt wird, habe ich den Becher in meiner Hand beinahe vergessen. Der warme Gewürzduft steigt zu mir auf. Die Leere, die ich empfinde, bleibt."
 latria_sexual_frustration_flavor.1002.desc.strict: "Die Gewürze beleben das Festmahl. Doch sobald Gelächter aufkommt, denke ich daran, wie streng die Sitte über jeden Fehltritt wacht. Mein Tischnachbar wendet sich mir zum Sprechen zu, und unwillkürlich halte ich meinen Becher gerader, als könnte ich dadurch einen untadeligeren Eindruck machen.\n\nJemand beginnt von einer alten Begebenheit zu erzählen und bricht mitten im Satz ab. Gleich darauf geht es bei Tisch um Lehen und Ernten. Ich nicke mit den anderen, höre in Gedanken aber noch immer den unvollendeten Satz.\n\nAls mir eingeschenkt wird, habe ich meinen Becher beinahe vergessen. Erst als der Wein bis an den Rand reicht, stelle ich ihn wieder ab."
 latria_sexual_frustration_flavor.1002.desc: "Beim Festmahl geht es laut zu, doch meine Gedanken schweifen immer wieder zu derselben Sache ab.\n\nMusik, Becher und Gespräche sind rings um mich, und trotzdem höre ich keinen einzigen Satz bis zum Ende. Mein Tischnachbar fragt, ob ich noch Wein möchte. Ich gebe einen Laut von mir, ohne selbst zu wissen, was ich damit beantworte.\n\nErst als ein anderes Stück beginnt, merke ich, dass ich die ganze Zeit zur Saaltür gestarrt habe. Zweimal ist sie aufgegangen. Beide Male kam jemand herein, den ich nicht erwartet hatte."
 latria_sexual_frustration_flavor.1002.a: "Mit ein paar eigenen zärtlichen Worten einstimmen."
 latria_sexual_frustration_flavor.1002.b: "Den Blick senken, dem Gastgeber danken und mich verabschieden."
 latria_sexual_frustration_flavor.1002.c: "Die Musiker vor meinem Abschied um ein weiteres Stück bitten."
 latria_sexual_frustration_flavor.1002.d: "Die Gäste an einem Tisch versammeln und den Abend verplaudern."

 latria_sexual_frustration_flavor.1003.t: "Eine Predigt im Garten"
 latria_sexual_frustration_flavor.1003.desc.favors: "Der Prediger sitzt auf einer Steinbank im Garten und erklärt, dass die Freuden des Fleisches unserem Glauben nicht widersprechen. Der Wind hebt eine Ecke der Buchseite an. Er hält sie mit einem Finger nieder und spricht ruhig weiter.\n\nDiese Worte sollten mich beruhigen. Während ich zuhöre, denke ich jedoch an etwas anderes: an einen Scherz vor einem Abschied und an einen Blick, den ich damals nicht erwidert habe. Die Worte der Schrift gehen an mir vorüber. Jener eine Satz bleibt.\n\nDer Prediger fragt, ob ich ihn verstanden habe. Ich nicke, doch im Buch habe ich die Stelle längst verloren."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Der Prediger spricht von Enthaltsamkeit und Keuschheit. Ich kann jedes Wort verstehen. Im Garten ist es so still, dass selbst das Rascheln der Blätter seine Pausen auszufüllen scheint. Ich lege die Hände ordentlich auf die Knie, doch meine Gedanken sind nicht beim Buch.\n\nIch erinnere mich an die Stunden der vergangenen Nacht, in denen ich keinen rechten Schlaf fand. Niemand kam, niemand sagte etwas. Nur mein Verlangen kehrte von allein zurück. Ich richte den Blick fest auf die Schrift, bringe die einzelnen Wörter aber zu keinem Satz zusammen.\n\nDer Prediger blättert um. Ich senke ebenfalls den Kopf und weiß noch immer nicht, an welcher Stelle er gerade gelesen hat."
 latria_sexual_frustration_flavor.1003.desc: "Ich habe die Predigt im Garten bis zum Ende gehört. Der Wind streicht über die Buchseiten, doch meine Gedanken kommen nicht zur Ruhe.\n\nDer Prediger ist bereits aufgestanden, um andere zu begrüßen. Ich bleibe sitzen und halte die Seite mit einem Finger fest, während ich zum Ende des Steinwegs blicke. Dort steht niemand. Trotzdem schaue ich noch eine Weile hin.\n\nAls ich wieder auf das Buch achte, hat der Wind schon mehrere Seiten weitergeblättert."
 latria_sexual_frustration_flavor.1003.a: "Das Buch schließen und an die ersehnte Person denken."
 latria_sexual_frustration_flavor.1003.b: "Diese Gedanken beiseiteschieben und an der Rezitation teilnehmen."
 latria_sexual_frustration_flavor.1003.c: "Den Prediger bitten, jede Passage zu erklären."

 latria_sexual_frustration_flavor.1004.t: "Ein unruhiger Falke"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Der Falke schlägt auf meinem Handschuh mit den Flügeln und verfolgt die Tauben in der Ferne mit den Augen. Das Geschüh hält ihn zurück und macht ihn unruhig. Jeder Flügelschlag lässt mich einen Luftzug spüren. Ich halte ihn fest, doch er blickt weiter auf die freie Fläche.\n\nIch kenne diese Ungeduld. Die Jäger warten am Waldrand auf mein Wort, und auch die Pferde treten ungeduldig auf der Stelle. Ich denke an etwas anderes, so sehr, dass ich sogar die Pfeife in meiner Hand vergesse. Der Gedanke nimmt keine klare Gestalt an. Er lässt nur nicht von mir ab.\n\nDer Falke schlägt erneut mit den Flügeln. Erst jetzt merke ich, wie sehr ich meine Hand im Handschuh verkrampft habe."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Der Falke tritt unruhig auf meinem Handschuh hin und her. Ich zwinge mich, auf das Geräusch der Zügel und die Pfiffe zu achten und meinen Blick am Waldrand zu halten. Die Jäger haben sich bereits verteilt und warten nur noch auf mein Zeichen.\n\nMeine Gedanken lassen sich schwerer bändigen als der Vogel. Ich zähle Atemzüge, Hufschläge und Blätter an den Bäumen, bis ich doch wieder bei demselben Menschen angelangt bin. Dieser Mensch ist nicht hier auf der Jagd. Ich weiß es und denke trotzdem weiter an ihn.\n\nDer Falke legt den Kopf schief und sieht mich an, als warte er auf einen verständlichen Befehl. Im Augenblick fällt mir keiner ein."
 latria_sexual_frustration_flavor.1004.desc: "Die Jäger warten darauf, dass ich den Falken zurückrufe. Ich kann mich jedoch nicht bei der Sache halten.\n\nSobald der Wind im Wald nachlässt, nehme ich die Flügelschläge auf meinem Handschuh umso deutlicher wahr. Ich hebe die Hand und lasse sie wieder sinken. Ich setze zum Pfiff an, bringe ihn aber nicht hervor.\n\nIn der Ferne ruft jemand meinen Namen. Ich antworte, während mein Blick noch immer auf der freien Fläche ruht."
 latria_sexual_frustration_flavor.1004.a: "Die Gesellschaft warten lassen und meinen Gedanken nachhängen."
 latria_sexual_frustration_flavor.1004.b: "Meine Gedanken sammeln und das Jagdzeug ordnen."
 latria_sexual_frustration_flavor.1004.c: "Langsam die Federn glätten und den Ruf noch einmal versuchen."

 latria_sexual_frustration_flavor.1005.t: "Zwischen den Ratssitzungen"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Die Fürsten sind gegangen, doch die Bediensteten räumen noch Karten und Siegel auf. Am Ende der langen Tafel sitze ich allein. Neben den unerledigten Schriftstücken liegt ein alter Brief. Der Geruch der Siegelfarbe hängt noch in der Luft.\n\nEben haben sie über Grenzen und Abgaben gestritten. Ich habe genickt und einige Einwände erhoben; es muss gewirkt haben, als hätte ich alles aufmerksam verfolgt. Tatsächlich habe ich eine Zeit lang nur auf die Ecke des Briefes gestarrt, die unter den Papieren hervorragte.\n\nEin Bediensteter fragt, ob der Tisch ganz abgeräumt werden soll. Ich lege die Hand auf den Stapel und antworte nicht gleich."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Meine Gefährten haben sich auf die nächste Furt geeinigt, aber die Karte liegt noch auf dem Tisch. Ich schiebe einen alten Brief ins Lampenlicht und merke, dass ich der Aufstellung unserer Wegstrecken wieder nicht folgen kann.\n\nDraußen wird das Pferdegeschirr verstaut; die Metallschnallen schlagen aneinander. Den Abschnitt, den ich bestätigen soll, habe ich dreimal gelesen. Im Gedächtnis bleibt mir nur ein alter Ortsname aus dem Brief. Dieser Ort liegt nicht auf unserem morgigen Weg.\n\nEin Gefährte wartet an der Tür. Ich decke den Brief zu, nehme die Finger aber nicht davon."
 latria_sexual_frustration_flavor.1005.desc.clergy: "Die Besprechung ist beendet, doch Rechnungsbücher und Schriften liegen noch offen auf dem Tisch. Ich ziehe einen alten Brief zwischen den Seiten hervor, und die Gedanken, die mir keine Ruhe lassen, sind wieder da.\n\nTagsüber habe ich Spenden, Ausbesserungen und Festtage geordnet. Sobald ich allein sitze, treten all diese Zahlen zurück. Das Buch hat Spuren im Briefpapier hinterlassen, seine Ränder sind ausgefranst. Trotzdem erkenne ich diese eine Zeile auf den ersten Blick.\n\nAuf dem Gang kommt jemand vorbei. Ich schiebe den Brief wieder zwischen die Seiten, genau an seine bisherige Stelle."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Die Ratssitzung ist beendet. Schriftstücke und Siegelwachs liegen noch auf dem Tisch. Ich streiche meinen Ärmel glatt, doch der alte Brief neben mir beschäftigt mich mehr als die Berichte.\n\nDie Zusammenfassung des Schreibers ist klar und verständlich. Ich nehme sie zur Hand, habe aber noch nicht einmal den ersten Namen gelesen, als mein Blick zum Brief abgleitet. Dieser Brief gehört nicht auf diesen Tisch. Ich habe ihn heute Morgen selbst zwischen die Papiere geschoben.\n\nVor der Tür wartet man auf meine nächste Anweisung. Ich lasse ausrichten, dass man sich noch gedulden soll."
 latria_sexual_frustration_flavor.1005.desc: "Es gibt reichlich Arbeit auf meinem Tisch. Ein alter Brief hält mich jedoch davon ab, mich endlich darauf zu konzentrieren.\n\nIch ordne die Schriftstücke nach ihrer Wichtigkeit, bringe den Stapel wieder durcheinander und beginne von vorn. Der Brief bleibt jedes Mal oben liegen. Der Ölstand in der Lampe ist gesunken, ohne dass ich auch nur ein Wort vermerkt hätte.\n\nVor der Tür räuspert sich jemand leise. Erst jetzt nehme ich meine Hand vom Brief."
 latria_sexual_frustration_flavor.1005.a: "Die Arbeit beiseitelegen und den alten Brief erneut lesen."
 latria_sexual_frustration_flavor.1005.b: "Den Brief weglegen und zu meinen Pflichten zurückkehren."
 latria_sexual_frustration_flavor.1005.c: "Die restliche Arbeit einteilen und mir eine kurze Rast gönnen."
 latria_sexual_frustration_flavor.1005.d: "Alle Aufgaben ordnen und sie der Reihe nach erledigen."

 latria_sexual_frustration_flavor.1006.t: "Ein alter Brief im Kerzenschein"
 latria_sexual_frustration_flavor.1006.desc.female: "Im Nachtgewand sitze ich unter der Lampe, die Fingerspitzen auf der Faltkante eines alten Briefes. Er enthält kein Versprechen, nur ein paar gewöhnliche Grüße. Darunter ist viel Platz freigeblieben, als wäre das Schreiben dort plötzlich abgebrochen worden.\n\nIch betrachte diese leere Stelle lange. Als der Brief damals kam, habe ich mir wenig dabei gedacht. Heute Nacht wiegt das Ungeschriebene für mich schwerer als die Worte darüber. Der Docht knackt, und der Schatten springt über das Papier.\n\nDas Band meines Nachtgewands hat sich gelöst. Ich binde es nicht wieder fest. Der Brief liegt noch offen vor mir, und die Nacht ist noch lang."
 latria_sexual_frustration_flavor.1006.desc.male: "Im Nachtgewand sitze ich am Bettrand. Die Handschrift des alten Briefes erinnert mich an eine Zuneigung, die nie eine Antwort fand. Das Papier ist weich geworden und droht an den Falten einzureißen. Trotzdem streiche ich es glatt.\n\nIm Brief stehen das Wetter auf der Reise und eine kleine Begebenheit. Ich erinnere mich jedoch daran, wie ich am Tag seiner Ankunft auf dem Gang stand. Ich wollte noch hinterherlaufen, wurde aber von jemandem aufgehalten. Später legte ich den Brief in eine Schatulle. Wer ihn geschrieben hatte, kam nie zurück.\n\nDer Docht ist ein Stück heruntergebrannt. Ich drehe das Blatt anders ins Licht. Die Worte bleiben dieselben."
 latria_sexual_frustration_flavor.1006.desc: "Die Nacht ist still, doch die Worte des alten Briefes stehen mir noch immer vor Augen.\n\nIch wollte nur kurz hineinsehen und dann schlafen. Sobald die Lampe brannte, ließen mich diese wenigen Zeilen nicht mehr los. Nach der Hälfte beginne ich erneut von vorn, als könnte dazwischen etwas stehen, das ich damals nicht verstanden habe.\n\nDas Bett ist längst hergerichtet. Ich sitze noch immer da und habe am Rand des Briefes neue Griffspuren hinterlassen."
 latria_sexual_frustration_flavor.1006.a: "Den Brief zu Ende lesen."
 latria_sexual_frustration_flavor.1006.b: "Den Brief weglegen, die Kerze löschen und mich schlafen legen."

 latria_sexual_frustration_flavor.1007.t: "Bevor das Festmahl endet"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Im Gespräch erzählt jemand von einer früheren Liebschaft. Niemand am Tisch findet das ungehörig. Man stößt an, lacht und redet weiter, als wäre vom Wetter oder einer anderen alltäglichen Sache die Rede gewesen.\n\nIch hebe meinen Becher mit den anderen, doch mein Blick fällt mehrmals auf einen unbesetzten Platz. Das Geschirr ist dort schon abgeräumt. Nur ein glatt gedrücktes Stück Tischtuch ist geblieben. Ich weiß, auf wen ich warte, und ebenso gut weiß ich, dass dieser Mensch heute Abend nicht kommen wird.\n\nMein Tischnachbar fragt, wonach ich schaue. Ich schüttle den Kopf und vergesse, von meinem Wein zu trinken."
 latria_sexual_frustration_flavor.1007.desc.strict: "Bei Tisch wird eine heimliche Liebschaft als warnendes Beispiel angeführt. Sogleich spricht man über Ansehen und Anstand. Wer erzählt, senkt die Stimme, doch die Sitznachbarn hören alles mit, und auch das Lachen fällt vorsichtig aus.\n\nIch blicke hinunter, ordne meinen Ärmel und sage nichts dazu. Es geht nicht um mich. Trotzdem fühlt es sich an, als seien die Worte an mich gerichtet. Unter dem Tisch drehe ich den Fuß meines Bechers zwischen den Fingern, einmal und noch einmal.\n\nBald spricht man über etwas anderes. Mein Ärmel ist längst glatt gestrichen. Meine Gedanken sind nicht weitergekommen."
 latria_sexual_frustration_flavor.1007.desc: "Die Musik spielt noch, doch in Gedanken habe ich die Tafel längst verlassen.\n\nDie Gäste reichen die letzte Runde Wein herum. Ich sehe sie reden, höre aber nur den Satz, für den ich selbst keinen Platz finde. Jemand trinkt mir zu. Ich hebe den Becher, und der Wein darin gerät ins Schwanken.\n\nDas Musikstück nähert sich seinem Ende. Ich bleibe sitzen, als hätte ich noch nicht entschieden, ob ich überhaupt an diesem Festmahl teilnehme."
 latria_sexual_frustration_flavor.1007.a: "Sie sollen von meiner eigenen Sehnsucht hören, von Anfang an."
 latria_sexual_frustration_flavor.1007.b: "Die Worte hinunterschlucken, dem Gastgeber danken und mich verabschieden."
 latria_sexual_frustration_flavor.1007.c: "Stattdessen meinen Nachbarn nach seinen Reisen fragen."

 latria_sexual_frustration_flavor.1008.t: "Gebet vor dem Schrein"
 latria_sexual_frustration_flavor.1008.desc.favors: "Die Kerze vor dem Schrein ist beinahe heruntergebrannt. Ich denke daran, dass unser Glaube die Freuden des Fleisches nicht verachtet. Diesen Satz habe ich oft gehört. Erst jetzt scheint er etwas zu sein, mit dem ich selbst etwas anfangen muss.\n\nAuf dem bronzenen Leuchter hat sich bereits eine Schicht Wachs gesammelt. Ich bin mitten im Gebet. Meine Lippen sprechen die vertrauten Worte, doch ich denke an eine Hand und an das Rascheln von Stoff, wenn mir dieser Mensch nahekommt. Das Bild im Schrein steht reglos. Die Flamme flackert.\n\nIch versuche, meine Gedanken zurückzuholen. Auf halbem Wege lasse ich wieder davon ab."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Vor dem Schrein spreche ich leise mein Keuschheitsgelübde. Mehrmals bleiben mir die vertrauten Worte auf den Lippen liegen. Der erste Satz gelingt noch vollständig. Im zweiten fehlen bereits Wörter, und in den Lücken findet ein Gedanke Platz.\n\nEr drängt sich nicht laut auf. Er erinnert mich nur daran, dass ich heute Nacht wieder an ein leeres Bett zurückkehren werde und niemand meine Hand halten wird. Ich streiche mir das Haar aus der Stirn und beginne erneut beim ersten Satz.\n\nDer Docht knackt. Auch meine Stimme setzt aus."
 latria_sexual_frustration_flavor.1008.desc: "Mein Gebet ist beendet. Ich bleibe neben der Kerze.\n\nIch habe alles gesprochen, was zu sprechen war. Meine Knie sind etwas taub, aber ich stehe nicht auf. Die Flamme wird kleiner und richtet sich mühsam noch einmal auf, als warte auch sie auf einen Abschluss, der nicht kommen will.\n\nIch sehe in das schwache Licht und weiß, dass ich meine Sorge nicht abgelegt habe. Für die Worte des Gebets ist sie nur kurz zur Seite getreten."
 latria_sexual_frustration_flavor.1008.a: "Das Enthaltsamkeitsgelübde beiseitelegen und meine Sehnsucht eingestehen."
 latria_sexual_frustration_flavor.1008.b: "Meine Gedanken zügeln und weiterbeten."
 latria_sexual_frustration_flavor.1008.c: "Eine Passage lesen und vor dem Gehen darüber nachdenken."
 latria_sexual_frustration_flavor.1008.d: "Die Kerze brennen lassen und bis zum Morgengrauen rezitieren."

 latria_sexual_frustration_flavor.1009.t: "Die ungelesene Bittschrift"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Die Berichte liegen auf der langen Tafel, und die Fürsten warten auf mein Wort. Ich habe dieselbe Zeile zweimal gelesen, kann mir aber die zweite Zahl noch immer nicht merken. Ich drehe die Feder zwischen den Fingern. Ein Tintenklecks fällt auf den unbeschriebenen Rand.\n\nIn den Blicken der anderen ist aus Ehrerbietung inzwischen Unsicherheit geworden. Jemand räuspert sich, jemand anderes schenkt Wasser ein. Niemand wagt es, zuerst zu sprechen. Ich weiß, dass ich entscheiden muss. Stattdessen fällt mir die halbe Zeile ein, die ich letzte Nacht nicht zu Ende geschrieben habe.\n\nDer Schreiber schiebt den nächsten Bericht näher zu mir. Meine Hand liegt noch immer auf dem ersten."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Die Ratssitzung dauert noch an, doch ich nehme von den Schriftstücken vor mir kein Wort auf. Ich schließe die Akten und öffne sie wieder. Am Rand stehen noch immer nur die Anmerkungen von gestern.\n\nMeine Räte sprechen über Getreidepreise und Wasserläufe. Ich höre einzelne Wörter, schweife ab und lande schließlich bei einem bestimmten Namen. Dieser Name steht nicht in dem Schriftstück. Trotzdem suche ich auf dem Papier danach.\n\nJemand fragt, ob ich die Sitzung unterbrechen möchte. Ich hebe den Kopf und merke erst jetzt, dass es im Raum schon eine Weile still ist."
 latria_sexual_frustration_flavor.1009.a: "Den Rat entlassen und mich meinen Gedanken überlassen."
 latria_sexual_frustration_flavor.1009.b: "Meine Gedanken sammeln und jede Bittschrift bearbeiten."
 latria_sexual_frustration_flavor.1009.c: "Die Entscheidungen ordnen und sie dann einzeln verkünden."

 latria_sexual_frustration_flavor.1010.t: "Die Rückkehr des Adlers"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Der Falke kreist über dem Wald. Sein Schatten streift immer wieder meinen Handschuh, doch er lässt sich nicht darauf nieder. Ich hebe den Arm. Er zieht nur einen weiteren Kreis, noch höher als zuvor.\n\nWährend ich auf seine Rückkehr warte, wird mir plötzlich bewusst, wie leid ich es bin, jede Regung von Zuneigung zu unterdrücken. Die Jäger unterhalten sich leise bei den Pferden. Sie glauben, ich warte auf einen anderen Wind. Tatsächlich warte ich darauf, meiner Unruhe einen anderen Namen geben zu können. Es gelingt mir nicht.\n\nDer Falke stößt einen kurzen, schrillen Ruf aus, als wollte er keinen Befehl mehr hören."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Der Falke kreist noch immer in der Ferne. Ich umklammere meinen Handschuh und zwinge mich, nur auf die Rufe der Jäger, den Waldrand und die Windrichtung zu achten. Der Lederriemen wird in meiner Hand feucht.\n\nIch habe mich schon oft so beherrscht. Heute fällt es mir besonders schwer. Mit jedem weiteren Augenblick kommt mir ein Satz in den Sinn, den ich mir nicht erlauben sollte. Ich sage ihn mir vor und unterbreche mich selbst. Ein Pferd zertritt einen dürren Ast, und ich erschrecke über das kleine Geräusch.\n\nDer Falke ist noch nicht zurück. Mein Arm schmerzt bereits."
 latria_sexual_frustration_flavor.1010.desc: "Die Jäger warten auf den Aufbruch. Ich schaue noch immer in den Himmel über den Bäumen.\n\nDas Horn hängt neben dem Sattel. Ich berühre es, nehme es aber nicht auf. Der dunkle Punkt am Himmel zieht einen Kreis und dann noch einen. Niemand drängt mich. Trotzdem warten alle.\n\nSchließlich senke ich den Kopf und merke, dass ich nicht einmal sagen könnte, in welche Richtung der Falke geflogen ist."
 latria_sexual_frustration_flavor.1010.a: "Die Jäger warten lassen, während meine Gedanken dem Adler folgen."
 latria_sexual_frustration_flavor.1010.b: "Zum Aufbruch blasen und das Jagdzeug prüfen."
 latria_sexual_frustration_flavor.1010.c: "Am Waldrand gehen, bevor ich zur Gesellschaft zurückkehre."

 nick_latria_the_unquiet: "der Ruhelose"
