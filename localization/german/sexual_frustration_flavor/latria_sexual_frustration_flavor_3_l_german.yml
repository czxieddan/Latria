l_german:
 latria_sexual_frustration_flavor.1201.t: "Eine Stunde ohne Besuch"
 latria_sexual_frustration_flavor.1201.desc.female: "Im Nachtgewand warte ich schon lange am Fenster. Der Tee auf dem Tisch ist erst lauwarm geworden und hat dann eine dünne Haut angesetzt. Wir haben nie ein Treffen verabredet. Trotzdem habe ich das Licht brennen lassen, einen zweiten Becher bereitgestellt und den Stuhl am Fenster geradegerückt.\n\nNur die Nachtwache ist einmal durch den Hof gegangen. Ihr Laternenschein strich über die Mauer und verschwand. Ich drehe meinen Becher; der Tee ist längst ungenießbar. Mir fällt wieder das ‚Wenn ich Zeit habe‘ vom letzten Abschied ein. Diese Worte lassen Platz für jede beliebige Nacht, aber ebenso dafür, dass gar keine gemeint war.\n\nDer Docht ist kürzer geworden. Ich sitze noch immer da. Das Nachtgewand ist mir von einer Schulter gerutscht. Ich ziehe es nicht hoch."
 latria_sexual_frustration_flavor.1201.desc.male: "Im Nachtgewand warte ich schon lange am Fenster. Im Hof sind nur die Schritte der Nachtwache zu hören, die sich entfernen und wieder näherkommen. Niemand wird kommen. Trotzdem lasse ich das Licht brennen, als könnte ich damit eine Einladung vollenden, die ich nie ausgesprochen habe.\n\nDer Tee ist kalt. Ich nehme einen Schluck, verziehe wegen der Bitterkeit das Gesicht und trinke dennoch aus. Auf dem Becherboden liegen ein paar Blätter. Ich starre sie an, als könnten sie mir verraten, wo jener Mensch diese Nacht verbringt. Draußen drückt der Wind einen Ast herunter und lässt ihn wieder los.\n\nIch lege die Hand auf den Fensterrahmen. Das Holz ist kühl. Die Kälte zieht durch meine Handfläche, doch meine innere Unruhe bleibt."
 latria_sexual_frustration_flavor.1201.desc: "Der Docht ist heruntergebrannt. Vor dem Fenster hat sich noch immer nichts geregt.\n\nIch ziehe den Docht einmal höher. Die Flamme wird größer und sinkt bald wieder zusammen. Auf dem Tisch liegen Papier und Feder neben einem Becher ungenießbaren Tees. Ich habe alles einmal zur Hand genommen. Nichts davon hat dieser Nacht eine andere Wendung gegeben.\n\nAm Ende sitze ich nur da und höre meinen eigenen Atem in der Stille."
 latria_sexual_frustration_flavor.1201.a: "Die Worte aufschreiben, die ich sagen wollte."
 latria_sexual_frustration_flavor.1201.b: "Die Kerze löschen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1202.t: "Geflüster vor dem Badehaus"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Vor dem Badehaus unterbricht niemand das Lachen und Plaudern, gleichgültig, wer mit wem gekommen ist. Durch den Türspalt quillt Dampf, der nach Seifenkraut und heißen Steinen riecht. Jemand geht mit nassem Haar und locker gebundenem Gürtel an mir vorbei. Niemand schaut ein zweites Mal hin.\n\nAll das sollte mir gewöhnlich erscheinen. Doch ich bleibe vor der Schwelle stehen und denke daran, wie lange ich niemandem mehr so unbefangen nahegekommen bin. Drinnen wird lachend ein Name gerufen, mit einer Stimme, die noch feucht vom Wasser klingt. Meine Finger bleiben am Türrahmen liegen.\n\nDer Wind weht mir Dampf ins Gesicht. Ich gehe weder hinein noch fort."
 latria_sexual_frustration_flavor.1202.desc.strict: "Vor dem Badehaus besprechen einige Adlige, wer wem aus dem Weg gehen sollte. Ich höre meinen Namen. Sofort verstummt das Gespräch. Drinnen plätschert weiterhin Wasser. Draußen ist es so still, dass ich das Rascheln der Gewänder hören kann.\n\nJemand nickt mir zu, ein wenig zu hastig. Ein anderer ordnet einen Ärmel, der schon ordentlich saß. Ich weiß, über welche Art von Angelegenheit sie gesprochen haben. Meine Ohren werden heiß, und der Dampf aus dem Badehaus ist nicht der Grund.\n\nIch bleibe eine Weile stehen. Das regelmäßige Plätschern hinter der Tür scheint die Dauer dieses Schweigens abzuzählen."
 latria_sexual_frustration_flavor.1202.desc: "Im Badehaus ist unablässig Wasser zu hören. Die Stimmen vor der Tür lenken mich jedoch stärker ab.\n\nEigentlich wollte ich mir nur das Gesicht waschen. An der Tür höre ich ein leises Gespräch, das mitten im Satz von Lachen unterbrochen wird. Es ist kein lautes Lachen, doch ich bleibe stehen. Ich weiß nicht, was daran so lustig ist. Ich weiß nur, dass ich hier nicht stehen und lauschen sollte.\n\nTrotzdem höre ich den Satz bis zum Ende. Danach ist mein Gesicht wärmer als das Tuch in meiner Hand."
 latria_sexual_frustration_flavor.1202.a: "Vom ersehnten Treffen erzählen und die Geschichte immer weiter ausführen."
 latria_sexual_frustration_flavor.1202.b: "Den Gedanken beiseiteschieben, ihnen danken und mich verabschieden."

 latria_sexual_frustration_flavor.1203.t: "Stille nach dem Gebet"
 latria_sexual_frustration_flavor.1203.desc.favors: "Der Priester sagt, menschliches Verlangen sei nicht von sich aus sündhaft. Der Glockenklang hallt noch unter den Balken nach. Er hat das Buch bereits geschlossen und lässt mir nach seinen Worten Zeit.\n\nIch möchte ihm glauben. Doch die Leere in mir ist dadurch nicht kleiner geworden. Ich bleibe knien und betrachte meine Hände. Tagsüber haben sie Brot an andere verteilt. Heute Nacht möchten sie nur einen Menschen festhalten, der nicht hier ist. Mein Glaube erlaubt mir diese Nähe. Dadurch habe ich noch niemanden bei mir.\n\nDer Priester wartet auf eine Frage. Ich bringe keine heraus und streiche mir nur das Haar aus der Stirn."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Der Priester spricht von der Tugend der Enthaltsamkeit und schweigt dann. Dieses Schweigen wiegt schwerer als seine Ermahnung. Ich knie noch am selben Platz. Das Kissen unter meinen Knien ist warm geworden, das Gebet ist mir vertraut, doch meine Gedanken sind längst auf irgendeinem Weg außerhalb des Heiligtums.\n\nIch weiß, dass ich antworten sollte. Zunächst entweicht mir nur ein Atemzug, aus dem schließlich ein sehr leises Ja wird. Der Priester sieht mich an und fragt nicht weiter. Unter diesem Blick erscheint mir meine Zustimmung noch weniger glaubhaft.\n\nDie Glocke ist verstummt. Nur gelegentlich knackt noch ein Docht."
 latria_sexual_frustration_flavor.1203.desc: "Das Gebet ist beendet. Im Heiligtum hallt noch der Glockenklang nach.\n\nDie anderen sind bereits aufgestanden. Ich knie weiter, als hätte ich einen Satz ausgelassen. Dabei fehlt keiner. Nach dem letzten Wort ist die Unruhe noch immer da. Sie geht weder mit dem Gebet zu Ende noch mit den anderen zur Tür hinaus.\n\nIch drücke die Handflächen auf die Steinplatten. Die Kälte reicht bis zu meinen Handgelenken und nicht weiter."
 latria_sexual_frustration_flavor.1203.a: "Die Lehre der Enthaltsamkeit vorerst beiseitelegen."
 latria_sexual_frustration_flavor.1203.b: "Den Gedanken unterdrücken und das Gebet erneut beginnen."

 latria_sexual_frustration_flavor.1204.t: "Unruhig nach der Jagd"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Allein und noch unbekleidet stehe ich in meinem Gemach. Das Surren der Bogensehne klingt mir noch in den Ohren. Meine Jagdkleidung liegt auf dem Stuhl, und der Schlamm an den Stiefeln ist nicht trocken. Beine und Schultern sind müde. Meine Gedanken beschäftigen sich mit etwas anderem.\n\nHeute ist im Wald jemand zu Pferd an mir vorbeigeritten. Mehr war es nicht; nicht einmal unsere Ärmel haben sich berührt. Trotzdem gehe ich diesen Augenblick immer wieder durch: die Hand am Zügel, das kleine Lächeln beim Umdrehen und den Blick, der sich danach von mir löste. Jetzt ist weder das Pferd noch dieser Mensch im Zimmer. Im Bronzespiegel sehe ich nur mich selbst.\n\nIch setze mich an den Bettrand. Erst als ich die Matte spüre, fällt mir ein, dass ich noch nichts übergezogen habe."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Allein und noch unbekleidet bin ich in meinem Gemach und versuche, meine Gedanken wieder auf Gebet und Pflichten zu richten. Die Jagdkleidung liegt zusammengefaltet beiseite. Nicht einmal das Gesicht habe ich mir gewaschen. Sobald ich die Augen schließe, kehrt die Sehnsucht zurück, deutlicher als jede Wildspur im Wald.\n\nIch gehe mein Gelübde in Gedanken durch. Auf halbem Weg sehe ich wieder, wie sich jener Mensch zwischen den Bäumen nach mir umdreht, und verliere den Faden. Ich öffne die Augen und betrachte meine Hände. Sie zittern noch. Ob von der Anstrengung der Jagd oder von etwas anderem, weiß ich nicht.\n\nVor der Tür fragt ein Bediensteter, ob ich warmes Wasser wünsche. Ich antworte. Meine Stimme klingt rauer, als ich erwartet habe."
 latria_sexual_frustration_flavor.1204.desc: "Der Jagdgrund ist leer geworden. Meine Unruhe lässt noch immer nicht nach.\n\nZurück im Gemach lege ich den Bogen und die Handschuhe ab. Nur den kurzen Blick von heute kann ich nicht ablegen. Im Raum riecht es nach Schlamm und Schweiß. Ich stehe eine Weile da, ehe ich merke, dass ich unablässig auf die Tür schaue, als würde noch jemand hinter mir hereinkommen.\n\nNiemand kommt herein. Ich habe die Tür selbst geschlossen."
 latria_sexual_frustration_flavor.1204.a: "Mich an jene Gestalt auf dem Jagdfeld erinnern."
 latria_sexual_frustration_flavor.1204.b: "Mich ankleiden, zum Schreibtisch zurückkehren und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1205.t: "Das geschlossene Arbeitszimmer"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Ich lasse alle aus dem Arbeitszimmer gehen. Karten, Siegel und unerledigte Schriftstücke bleiben zurück. Sobald die Tür geschlossen ist, höre ich nur noch meinen eigenen Atem. Ich hole einen alten Brief aus der Schublade. Seine Ränder sind schon ausgefranst.\n\nIn diesem Brief geht es nicht um das Reich. Es geht um ein Treffen, das nie zustande kam, und um Worte, bei denen ich damals glaubte, wir hätten noch alle Zeit der Welt. Seitdem ist viel Zeit vergangen. Der Brief ist geblieben. Ich lege das Siegel darauf und nehme es wieder weg. Das Siegel ist kalt. Das Papier scheint mir noch warm zu sein.\n\nVor der Tür fragt jemand leise, ob das Essen gebracht werden soll. Ich antworte nicht."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "Wegstrecken und Wachdienste stehen auf dem Papier. Meine Gefährten warten vor der Tür. Für alle habe ich Ruhezeiten eingeteilt. Als ich an meine eigenen Stunden komme, hält die Feder inne. Aus der Schublade ragt eine Ecke des alten Briefes hervor, als ließe er sich von der Wegplanung nicht verdecken.\n\nIch ziehe ihn heraus. Schon bei der Anrede weiß ich, dass ich ihn jetzt nicht lesen sollte. Es klopft, und jemand fragt, ob wir zur nächsten Station aufbrechen. Ich sage Ja. Mein Blick bleibt auf der zweiten Zeile des Briefes.\n\nIn dieser Zeile steht nur ein Ortsname. Der Ort liegt nicht auf unserem Weg."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Ich sitze allein im Arbeitszimmer. Die Rechnungsbücher sind noch offen, und auch die Schrift habe ich nicht weggeräumt. Zwischen ihren Seiten liegt ein alter Brief. Schon mehrmals habe ich danach gegriffen und die Hand wieder zurückgezogen.\n\nDer Brief ist nicht heute gekommen. Er liegt schon so lange im Buch, dass ich bei jedem Aufschlagen dieser Seite kurz innehalte. Heute ziehe ich ihn endlich heraus. Auf dem Papier steht kein ungehöriges Wort. Trotzdem wird mein Atem beim Lesen unruhig.\n\nAuf dem Gang kommt jemand vorbei. Gebetsperlen klacken leise aneinander. Ich drücke den Brief zurück ins Buch und spüre unter meiner Hand noch immer seine Kante."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Die Bediensteten warten vor dem Arbeitszimmer. Ich habe ihnen verboten, mich zu stören. Siegel und Schriftstücke liegen vor mir. Den alten Brief habe ich noch immer nicht in die Schublade zurückgelegt.\n\nIch sollte den Bericht über die Brücke bearbeiten. Die Federspitze verharrt über dem Papier, bis ein Tropfen Tinte fällt. Beim Betrachten des Flecks denke ich plötzlich an einen Satz im Brief, der mit Brücken nichts zu tun hat. Er besteht nur aus wenigen Worten. Trotzdem weiß ich genau, in welcher Zeile er steht.\n\nDraußen verlagert jemand sein Gewicht. Ich schiebe den Bericht fort und strecke die Hand zur Schublade aus."
 latria_sexual_frustration_flavor.1205.desc: "Ich schließe die Tür des Arbeitszimmers. Der alte Brief und die unerledigten Geschäfte liegen noch auf dem Tisch.\n\nDer Riegel fällt mit einem leisen Laut. Danach gibt es für mich nur noch die Blätter vor mir. Ich lege die Arbeit nach links und den Brief nach rechts. Nachdem ich beides eine Weile betrachtet habe, schiebe ich den Brief in die Mitte.\n\nDer Docht knackt. Ich kümmere mich nicht darum, ihn zu kürzen."
 latria_sexual_frustration_flavor.1205.a: "Die Arbeit bis morgen liegen lassen und den Brief erneut lesen."
 latria_sexual_frustration_flavor.1205.b: "Die alte Sehnsucht unterdrücken und meinen Pflichten nachgehen."

 latria_sexual_frustration_flavor.1206.t: "Gerüchte beim Festmahl"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Beim Festmahl spricht jemand von einer Liebschaft, so unbefangen wie vom Wetter. Nach einer Runde Wein haben die Namen in der Geschichte bereits zweimal gewechselt, und die anderen lachen noch immer. Niemand senkt die Stimme.\n\nIch will einfach mitlachen. Doch mitten darin fällt mir auf, wie lange ich solche Gespräche schon nicht mehr geführt habe. Ich schaue erst zu meinen Nachbarn, bevor ich weiß, wohin mit meinem Becher. Neben mir fragt jemand, ob ich auch etwas zu erzählen hätte. Meine Finger halten am Becherrand inne.\n\nÜber die Stimmen hinweg höre ich Musik. Welches Stück gespielt wird, kann ich nicht sagen."
 latria_sexual_frustration_flavor.1206.desc.strict: "Einige Adlige sprechen über jemanden vom Hof, der wegen eines ungehörigen Auftritts in Ungnade gefallen ist. Dann fällt mein Name. Das Gespräch bricht nicht ganz ab, sondern wird nur zum Flüstern. Ich sehe auf meinen Ärmel, streiche ihn glatt und beteilige mich nicht.\n\nWas sie erzählen, muss nicht wahr sein. Darauf kommt es kaum noch an. Ich selbst trage eine Sache mit mir herum, die ich nicht vor dieser Tafel ausbreiten kann, und ihre Blicke scheinen sie bereits zu kennen. Ich trinke meinen Wein aus. Seine Wärme spüre ich im Gesicht statt im Hals.\n\nJemand hebt den Becher, um das Gespräch abzulenken. Als die Becher aneinanderstoßen, zuckt meine Hand dennoch."
 latria_sexual_frustration_flavor.1206.desc: "Die Musik dringt über die versammelten Gäste zu mir. Die Gespräche bei Tisch lenken mich stärker ab.\n\nIch bleibe sitzen und höre, wie sich die Unterhaltung ringsum immer weiterdreht und schließlich jedes Mal bei Bettvorhängen und privaten Briefen ankommt. Jemand lacht, jemand hustet, jemand sieht aus dem Augenwinkel zu mir. Ich weiß nicht, ob dieser Blick zufällig war.\n\nIch drehe meinen leeren Becher einmal herum. Sein Boden schabt leise über den Tisch."
 latria_sexual_frustration_flavor.1206.a: "Meine alte Geschichte vollständig erzählen, selbst die im Verborgenen gesprochenen Worte."
 latria_sexual_frustration_flavor.1206.b: "Meine Zunge hüten, mich vor den Tischgenossen verbeugen und mich verabschieden."

 latria_sexual_frustration_flavor.1207.t: "Ein leerer Platz nach dem Gebet"
 latria_sexual_frustration_flavor.1207.desc.favors: "Nach dem gemeinsamen Gebet hat der Priester das Buch auf seinem Sitz liegen lassen und ist gegangen. Im Kissen ist noch die Mulde zu sehen. Mein Glaube betrachtet Verlangen nicht als Sünde. Der Satz steht auf der Seite, die ich eben gelesen habe, deutlich in Tinte geschrieben.\n\nTrotzdem weiß ich nicht, wie ich zur Ruhe kommen soll. Die Erlaubnis hilft mir wenig, wenn ich nachts allein dasitze und nur meine eigenen Hände vor mir sehe. Ich bleibe eine Weile neben dem leeren Sitz stehen. Weder setze ich mich hin noch schließe ich das Buch.\n\nDer Wind drückt die Tür des Heiligtums bis auf einen Spalt zu. Durch ihn fällt Licht genau auf diese Zeile."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Der Priester ist gegangen. Ich knie noch am selben Platz. Die Lehren über Keuschheit sind eindeutig; jede einzelne könnte ich aufsagen. Meine Sehnsucht ist jedoch nicht mit ihm fortgegangen. Während ich hier knie, ist sie mir noch immer deutlich gegenwärtig.\n\nIch betrachte den leeren Sitz und beneide plötzlich das Holz darum, an nichts denken zu müssen. Mir gelingt das nicht. Ich lehne die Stirn dagegen und spüre doch nur meine eigene Wärme.\n\nDie Kerze ist ein Stück kürzer geworden. Ich knie noch immer da."
 latria_sexual_frustration_flavor.1207.desc: "Im stillen Heiligtum sind nur die brennende Kerze und ich zurückgeblieben.\n\nDie Schritte der anderen sind längst verklungen. Ich könnte jetzt gehen, die Tür hinter mir schließen und mich anderen Dingen zuwenden. Ich tue es nicht. Ich gehe zwei Schritte zwischen den leeren Sitzen und kehre auf mein altes Kissen zurück.\n\nDie Flamme brennt ruhig. Ich höre meinen eigenen Puls in den Ohren."
 latria_sexual_frustration_flavor.1207.a: "Den Tempel verlassen und bei dieser Zuneigung verweilen."
 latria_sexual_frustration_flavor.1207.b: "Meine Begierde zügeln und die Gebote erneut lesen."

 latria_sexual_frustration_flavor.1208.t: "Die Hatz durch den Wald"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Das Wild verschwindet zwischen den Bäumen, und die anderen setzen ihm nach. Ich treibe mein Pferd hinterher. Zweige schlagen gegen meinen Ärmel, und ich rieche den Schweiß des Pferdes. Erst nach einem Stück merke ich, dass meine Aufmerksamkeit gar nicht dem Wild gilt.\n\nVor mir reitet jemand aus unserer Gesellschaft. Mehr verbindet uns nicht. Doch mein Blick folgt jeder Bewegung im Sattel so beharrlich, dass ich die Weggabelung verpasse. Das Bellen der Hunde entfernt sich nach links. Mein Pferd läuft weiter geradeaus.\n\nIch ziehe die Zügel an. Der Mensch vor mir dreht sich nicht um. Mein Atem geht bereits so heftig, als wäre die Jagd nicht der einzige Grund dafür."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Ich zügle mein Pferd und erinnere mich daran, dass ich nur zur Jagd gekommen bin. Das Bellen der Hunde wird leiser. Die Hufspuren sind im feuchten Schlamm deutlich zu sehen. Trotzdem muss ich zweimal hinsehen, bis ich erkenne, wohin sie abbiegen.\n\nMeine Gedanken folgen den Spuren nicht. Sie bleiben bei den Händen, die mir vorhin den Sattelgurt festgezogen haben. Diese Hände waren ruhig und sicher. Nach getaner Arbeit ließen sie los, ohne dass ein Wort fiel. Ich habe aus dieser kleinen Hilfe längst etwas anderes gemacht.\n\nMein Pferd schnaubt. Erst jetzt merke ich, wie lange ich schon auf der Stelle geblieben bin."
 latria_sexual_frustration_flavor.1208.desc: "Die Jagdgesellschaft hält zwischen den Bäumen an und wartet auf meine Entscheidung, ob wir die Spur weiterverfolgen.\n\nAlle Gesichter sind mir zugewandt. Vom Pferdegeschirr tropft noch Wasser, jemand wischt sich über die Stirn. Ich betrachte die Abdrücke im Boden. Die Fährte ist eindeutig. Meine Antwort ist es nicht. In Gedanken bin ich noch halb am anderen Ende des Waldes, bei einem Menschen, der mit dem Wild nichts zu tun hat.\n\nWind streicht durch die Bäume. Ich halte die Zügel und antworte nicht gleich."
 latria_sexual_frustration_flavor.1208.a: "Die anderen vorreiten und meine Gedanken schweifen lassen."
 latria_sexual_frustration_flavor.1208.b: "Meine Gedanken sammeln und die Jagd weiter anführen."

 latria_sexual_frustration_flavor.1209.t: "Glut am Fenster"
 latria_sexual_frustration_flavor.1209.desc.female: "Im Nachtgewand sitze ich am Fenster. Im Herd ist nur noch ein schmaler Rest Glut übrig. Die Worte, die ich am Tag nicht ausgesprochen habe, liegen mir wieder auf der Zunge und bleiben doch dort. Der Satz ist kurz. Lange dauert nur, wie ich ihn schon zurückhalte.\n\nManchmal leuchtet die Glut auf und beleuchtet meine Hände auf den Knien. Unbewusst halte ich den Saum des Nachtgewands so fest, dass er Falten wirft. Ich denke an den Luftzug, den ein Ärmel heute beim Vorübergehen verursachte. Es war nur ein Luftzug. Trotzdem weiß ich noch, aus welcher Richtung er kam.\n\nDraußen ruft die Nachtwache die Stunde aus. Ich gebe keinen Laut von mir und möchte auch nicht schlafen."
 latria_sexual_frustration_flavor.1209.desc.male: "Im Nachtgewand lehne ich am Fensterrahmen und schaue den Lichtern der Nachtwache im Hof nach. Eine Laterne nach der anderen zieht vorbei und teilt die Nacht in kleine Abschnitte. Die unerwiderte Zuneigung lässt sich nicht auf diese Weise zerteilen. Sie bleibt mir unvermindert.\n\nIch lehne die Stirn an das Fenstergitter. Das Holz riecht nach alter Farbe. Ich denke daran, wie jener Mensch beim Sprechen wegsah, als könnten die Worte etwas anderes bedeuten, sobald sich unsere Blicke träfen. Auch ich wandte damals den Blick ab. Danach sagte keiner von uns noch etwas.\n\nIm Herd knackt ein Stück Kohle und sinkt ein wenig zusammen."
 latria_sexual_frustration_flavor.1209.desc: "Vor dem Fenster ist alles still. Das Feuer wird schwächer, doch ich bin überhaupt nicht müde.\n\nIch lege ein kleines Stück Holz nach. Das Feuer flammt nicht auf, sondern gibt nur etwas Rauch von sich. Der Geruch bleibt an meinem Nachtgewand haften. Ich setze mich wieder ans Fenster und spreche in Gedanken den Satz, der tagsüber unausgesprochen blieb. Als ich fertig bin, ist noch immer niemand da, der ihn gehört hätte.\n\nDie Nacht liegt dunkel über dem Hof. Ich schaue hinaus, ohne dass jemand meinen Blick erwidert."
 latria_sexual_frustration_flavor.1209.a: "Meine Gedanken zu Papier bringen."
 latria_sexual_frustration_flavor.1209.b: "Das Feuer schüren, die Sehnsucht beiseiteschieben und mich hinlegen."

 latria_sexual_frustration_flavor.1210.t: "Kein Klopfen an der Tür"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Die Bediensteten haben meine Festkrone weggeräumt. Im Nachtgewand sitze ich allein am Bettrand. Die Grenzen des Reiches, die Steuerlisten und die morgigen Audienzen haben meine private Sorge nicht verdrängt. Sie beschäftigt mich beim Blick auf die andere Hälfte des Bettes, obwohl dort niemand liegt.\n\nIch betrachte die leere Seite. Das Kissen ist glatt, ebenso der Rand der Decke. Schon diese Unberührtheit scheint mir einen Vorwurf zu machen. Ich lege eine Hand dorthin. Der Stoff ist kalt. Auch nachdem die Kälte vergangen ist, ziehe ich die Hand nicht zurück.\n\nAuf dem Gang wird eine Lampe gelöscht. Niemand kommt, um an diese Tür zu klopfen."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Meine Gefährten haben sich im Gasthaus schlafen gelegt. Ich sitze im Nachtgewand bei einem unversandten Brief. Morgen brechen wir wieder auf; die Pferde sind bereits gefüttert. Meine Sorge kann ich hier nicht zurücklassen. Sie wird im Reisebündel mitkommen, bis zur nächsten Furt.\n\nIch drehe den Brief im Lampenlicht. Schon die Anrede ist mit zu viel Nachdruck geschrieben, als ließe sich dieses Blatt beiläufig von unterwegs versenden. Unten begleicht jemand eine Rechnung. Eine Weile klirren Kupfermünzen. Als das Geräusch aufhört, ist das Zimmer noch stiller.\n\nIch schiebe den Brief zwischen meine Kleider. Auch verborgen weiß ich noch genau, zwischen welchen Schichten er liegt."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Ich hänge mein geistliches Gewand neben das Bett und sitze im Nachtgewand allein im kleinen Gemach. Mein Gelübde klingt mir noch in den Ohren. Ich habe es eben selbst gesprochen. Meine Gedanken sind dadurch nicht ruhiger geworden. Schon lange halten meine Finger dieselbe Gebetsperle fest.\n\nIch möchte diese Nacht dem widmen, was meine Hingabe verdient. Doch sobald es still in mir wird, sehe ich ein Gesicht, das in meinem Gebet keinen Platz haben sollte. Ich umschließe die Perlen fester. Sie drücken mir in die Handfläche. Auch als es schmerzt, bleibt das Gesicht.\n\nDie Tür des Gemachs ist nicht ganz verriegelt. Durch den Spalt kommt Wind, und die Flamme neigt sich."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Das Festgewand ist weggeräumt. Ich sitze im Nachtgewand am Bett. Die Wachen draußen hören meinen Seufzer nicht, und meine Stellung hat diese private Sorge nicht für mich geregelt. Ich versuche, die morgige Audienz in Gedanken durchzugehen. Beim dritten Namen komme ich nicht weiter.\n\nDieser dritte Mensch hat mit der Audienz nichts zu tun. Trotzdem bleibe ich bei ihm stehen. Die Lampe am Bett wirft meinen Schatten an die Wand. Er sitzt aufrechter als ich.\n\nIch stelle den Docht niedriger. Der Schatten wird kleiner. Ich bleibe sitzen."
 latria_sexual_frustration_flavor.1210.desc: "Es ist spät geworden. Ich bin mit dieser Sorge noch immer allein.\n\nDie Tür ist geschlossen, die Lampe brennt, und in diesem Bett werde nur ich schlafen. Daran hat sich nichts geändert. Ich täusche mir inzwischen nur nicht mehr vor, gleich einschlafen zu können. Ich lege mein Obergewand über die Stuhllehne und nehme es wieder auf, als könnte mich jeden Augenblick jemand nach draußen rufen.\n\nNiemand ruft. Ich lege das Gewand wieder über die Lehne."
 latria_sexual_frustration_flavor.1210.a: "Trotz der späten Stunde einen vertrauten Bekannten holen und ausgiebig sprechen."
 latria_sexual_frustration_flavor.1210.b: "Die Sehnsucht unterdrücken, die Kerze löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1202.c: "Das Thema wechseln und nach dem Befinden meiner Gefährten fragen."
 latria_sexual_frustration_flavor.1202.d: "Alle zum Tee einladen und reden, bis wir müde sind."
 latria_sexual_frustration_flavor.1203.c: "Den Priester bitten zu bleiben und mit mir die Lehren zu studieren."
 latria_sexual_frustration_flavor.1204.c: "Mein Nachtgewand anziehen und die Gedanken des Tages langsam durchgehen."
 latria_sexual_frustration_flavor.1205.c: "Die Wachen einteilen und mir etwas Ruhe gönnen."
 latria_sexual_frustration_flavor.1205.d: "Die morgigen Pflichten einzeln auflisten."
 latria_sexual_frustration_flavor.1206.c: "Das Gespräch mit einem neuen Gedicht umlenken."
 latria_sexual_frustration_flavor.1207.c: "Mich vor die Schrift setzen und dieses Kapitel zu Ende lesen."
 latria_sexual_frustration_flavor.1208.c: "Die Pferde ausruhen lassen und in Ruhe die Spuren untersuchen."
 latria_sexual_frustration_flavor.1209.c: "Das Feuer schüren, Tee kochen und in einem alten Buch lesen."
 latria_sexual_frustration_flavor.1209.d: "Aus den nie gesprochenen Worten ein Gedicht machen."
 latria_sexual_frustration_flavor.1210.c: "Den morgigen Tag planen und jede Aufgabe ordnen."
