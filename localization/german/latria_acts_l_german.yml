 latria_wedding_night.t: "Die Hochzeitsnacht"
 latria_wedding_night.desc: "Die Gäste, die das Paar bis ins Gemach begleitet haben, haben sich endlich zerstreut. Das Lachen bleibt im Gang, doch die Tür ist geschlossen und lässt die Höflichkeiten, Segenswünsche und den scheinbar endlosen Wein des Tages draußen.\n\nDas Lampenlicht wärmt die Vorhänge. Das Bett ist frisch bereitet, die Kleider frisch gewechselt, und selbst die Art, wie sie einander ansehen, ist noch ein wenig fremd. [latria_actor.GetShortUIName] und [latria_partner.GetShortUIName] sitzen eine Weile einander gegenüber. Keiner ist schnell damit, zuerst zu sprechen. Sie hören nur, wie die Menschen jenseits der Tür sich allmählich entfernen.\n\nNach dieser Nacht werden sie nicht mehr nur das neuvermählte Paar sein, von dem ihre Gäste sprachen."

