 latria_act.0301.t: "Die Grenzen des Körpers"
 latria_act.0301.desc.illness: "Nach dieser Nacht brennt Eure Stirn, und Eure Glieder versagen Euch den Dienst."
 latria_act.0301.desc.stress: "Auch nachdem Ihr innehaltet, finden Eure Gedanken keine Ruhe."
 latria_act.0301.desc.health: "Ihr stützt Euch am Bett ab. Euer Körper ist an seine Grenzen gelangt."
