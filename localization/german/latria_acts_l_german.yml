 latria_solo_relief_interaction: "Einsame Zärtlichkeiten"
 latria_solo_relief_interaction_desc: "Die Freuden des Fleisches, allein."
 latria_solo_relief_send: "Beginnen"
 latria_solo_relief_night_tt: "Ihr hofft, die Nacht allein zu verbringen."
 latria_act.0201.t: "Das innere Gemach"
 latria_act.0201.desc: "Ich warte, bis das Vorzimmer leer ist und auch die letzte vorübergehende Lampe verschwunden ist, bevor ich selbst den Riegel vorschiebe. Nachdem die Stimmen verschwunden sind, knackt nur noch bisweilen der Docht.\n\nMeine Kleider liegen über dem Stuhl. Ich drehe die Lampe herunter, bis nur die Kerze neben dem Bett bleibt, und liege dann lange in Decken, in denen sich keine zweite Person befindet. Die Nacht ist nicht kurz. Manche Begierden kommen klar und gehen langsam, wie Wasser, das über denselben Stein läuft, zurückweicht und leise wiederkehrt.\n\nAls mein Atem sich endlich beruhigt, steht das Tageslicht am Fenster. Ich höre auf meinen Herzschlag und dann auf das leere Gemach, ehe mir einfällt, das Bett glattzuziehen und der Nacht das Aussehen zu geben, es sei nichts geschehen."
 latria_act.0201.a: "Mich ankleiden und den Riegel öffnen."

 latria_act.0301.t: "Die Grenzen des Körpers"
 latria_act.0301.desc.illness: "Die Nacht ist noch nicht ganz vorüber, doch das Unwohlsein kommt dem Morgen zuvor.\n\nIch will mich aufrichten. Stattdessen steigt Hitze in meine Stirn. Meine Glieder fühlen sich an, als hätte man sie gegen fremde ausgetauscht: Ich versuche es zweimal, und sie versagen mir noch immer. Die Decken sind schwer und heiß, und selbst mein Atem trägt eine trockene Süße. Ich will die Person draußen rufen, doch der Laut erreicht nur meine Lippen.\n\nAm Fenster sammelt sich langsam Licht. Ich sehe, wie es den Rahmen überschreitet, hoffe, das Fieber werde schnell weichen, und ahne, dass es nicht so gehorsam sein wird."
 latria_act.0301.desc.stress: "Mein Körper hat angehalten, und ich habe die Hände aus den Decken gezogen, doch meine Gedanken haben nicht angehalten.\n\nIch liege wach und gehe die Nacht mehrere Male durch. Wo mein Atem ungeordnet wurde, welcher Satz niemals hätte gesprochen werden dürfen und wo ich mich zu weit trieb: alles bleibt klar. Jenseits der Bettvorhänge ist es still, und die Stille macht die Gedanken nur lauter. Selbst der ferne Ruf des Wächters scheint sie zu zählen.\n\nIch wende mich und wende mich zurück. Nahe dem Morgen ist das Kissen schon mehrmals gewendet worden, und ich bin noch immer wach."
 latria_act.0301.desc.health: "Ich will aufstehen, um einen Becher Wasser zu holen. Kaum berührt mein Fuß den Boden, wird der Raum dunkel.\n\nIch fasse den Bettrand und lege die Stirn gegen meine eigene Hand. Mein Herz schlägt schnell und hohl, als wäre ich weit gelaufen, obwohl ich mich nur vom Kissen erhoben habe. Der Becher ist nur wenige Schritte entfernt, und alles im Gemach liegt noch an seinem Platz. Mein Körper scheint an sein Ende gekommen zu sein.\n\nEs dauert eine Weile, bis die Dunkelheit zurückweicht. Ich hole das Wasser schließlich nicht. Ich lege mich nur wieder hin."
 latria_act.0301.a: "Mich hinlegen und an nichts denken."
 latria_act.0311.t: "Anhaltende Entkräftung"
 latria_act.0311.desc.illness: "Dies ist nicht in einer einzigen Nacht über mich gekommen.\n\nJene übermäßigen Nächte lagen verstreut, und ich glaubte immer, ein Schlaf und eine warme Mahlzeit könnten sie zurückzahlen. Heute Morgen breitet sich die Hitze von meiner Brust bis in die Finger aus, und ich verstehe, dass sie sich längst verbunden hatten. Wasser lindert die Trockenheit nicht. Decken wärmen mich nicht. Selbst der Wind am Fenster scheint durch meine Knochen zu gehen.\n\nIch liege und höre Menschen draußen vorbeigehen und muss sogar die Kraft zum Rufen sparen. Die Krankheit ist nicht eingedrungen. Sie hat nach und nach Wohnung in mir genommen."
 latria_act.0311.desc.stress: "Die Müdigkeit sitzt nicht in den Gliedern. Sie liegt auf meinem Schlaf und lässt mich nicht hinein.\n\nIch schließe die Augen, und Gesichter des Tages, Atemzüge der Nacht und Augenblicke, die zu bereuen ich keine Zeit hatte, drängen gemeinsam heran. Mein Körper ist zu erschöpft, eine Hand zu heben, doch mein Geist bleibt hell genug, um mich zu ermüden. Ich zähle meine Atemzüge und die Wachen jenseits des Fensters. Nichts kann jene Bilder verdunkeln.\n\nDer Hahn hat gekräht, und der Tag ist da. Ich wechsle nur von einer Seite des Kissens auf die andere und bleibe wach."
 latria_act.0311.desc.infertile: "Zuerst blieb ein Zeichen aus. Ich nahm es nicht zu Herzen, doch dann gab es viele solche Tage.\n\nIch zählte die Tage, die hätten kommen sollen, und wollte nicht von ihnen sprechen, aus Furcht, das Sprechen mache sie wahr. Heute legt der Arzt endlich das vor mich, worum ich immer herumgegangen bin: Mein Körper kann kein Kind mehr empfangen. Seine Stimme ist nicht laut, doch nichts sonst im Gemach kann sie überdecken.\n\nNachdem er gegangen ist, lege ich eine Hand auf den Leib. Es vergeht lange, bis ich die Worte wirklich niederlassen lasse."
 latria_act.0311.desc.health: "Früher hätte ich diese Schwäche einen zu späten Schlaf nennen und mit einem Becher heißen Weins und einem halben Tag Ruhe hinter mich bringen können.\n\nJetzt muss ich selbst beim Aufsetzen am Bettrand verweilen. Ein Gürtel fühlt sich schwerer an als früher, und ein Becher ebenso. Der Weg vom Fenster zur Tür scheint länger, als er ist. Erst als ich meine Farbe im Spiegel sehe, glaube ich, dass diese Schuld nicht durch eine Nacht oder zwei der Ruhe beglichen werden kann. Die Person im Glas sieht mich an, als hätte sie es früher gewusst als ich.\n\nIch lege mich wieder hin. Diesmal entscheidet mein Körper vor mir."
 latria_act.0311.a: "Die Geschäfte des Tages beiseitelegen und das Bett hüten."
 latria_act_exhausted_health: "Erschöpft"
 latria_act_exhausted_health_desc: "Der Körper hat sich noch nicht erholt."
