 latria_act.0101.t: "Hinter der Tür"
 latria_act.0101.desc: "Die Tür schließt sich, und die Schritte auf dem Gang verhallen. [latria_partner.GetShortUIName] und ich bleiben bis zum Tagesanbruch zusammen.\n\nErst das Klopfen eines Dieners erinnert mich an die Geschäfte des Tages."
 latria_act.0101.desc.adultery: "Ich warte, bis der Gang leer ist, bevor ich [latria_partner.GetShortUIName] hereinlasse.\n\nBevor wir uns trennen, einigen wir uns: Niemand sonst soll von dieser Nacht erfahren."
 latria_act.0101.desc.dead: "Ich rufe [latria_partner.GetShortUINamePossessive] Namen, dann noch einmal. Keine Antwort, kein Atemzug.\n\nIch reiße die Tür auf und rufe, jemand solle einen Arzt holen."
 latria_act.0101.desc.adultery_dead: "Ich dachte, das Schlimmste wäre, entdeckt zu werden. Dann brach [latria_partner.GetShortUIName] zusammen und erwachte nicht mehr.\n\nDraußen nähern sich Schritte. Wie soll ich das erklären?"
 latria_act.0101.desc.actor_dissatisfied: "Ich stehe auf, als es noch dunkel ist. [latria_partner.GetShortUIName] scheint etwas sagen zu wollen, doch ich habe genug von dieser enttäuschenden Begegnung."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] geht weit eiliger, als die Ankunft es vermuten ließ. [latria_partner.GetSheHe|U] meidet meinen Blick und sagt kein Wort zum Abschied."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] und ich finden einen stillen Ort und begnügen uns mit Küssen und Zärtlichkeiten. Niemand von uns achtet auf die Stunde."
 latria_act.0101.a: "Gehen"
 latria_act.0102.desc: "Ich bitte [latria_actor.GetShortUIName] nicht zu gehen. Sobald sich die Tür schließt, gehört die Nacht uns.\n\nBei Tagesanbruch warten die Diener schon seit geraumer Zeit draußen."
 latria_act.0102.desc.adultery: "Bevor [latria_actor.GetShortUIName] geht, lausche ich an der Tür.\n\nDer Gang ist leer. Zumindest heute Nacht bleibt unser Geheimnis gewahrt."
 latria_act.0102.desc.partner_dissatisfied: "Ich hatte mich darauf gefreut, mit [latria_actor.GetShortUIName] allein zu sein. Jetzt möchte ich nur noch gehen. Diese Nacht war die Vorfreude kaum wert."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] steht ungeduldig auf. Ich versuche zu sprechen, doch [latria_actor.GetSheHe] gibt nur ein paar knappe Antworten und geht zur Tür."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] sitzt neben mir. Eine Weile legen wir unsere Pflichten beiseite und verlangen nichts voneinander als Küsse und Zärtlichkeiten.\n\nAls wir uns trennen, ist es noch dunkel."

