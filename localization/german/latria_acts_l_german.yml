 latria_act.0101.t: "Hinter der Tür"
 latria_act.0101.desc: "Als die Tür sich schließt, wird im Gang noch leise gesprochen. Die Schritte entfernen sich, und der Lichtstreifen im Spalt wird mit ihnen schmaler. Erst dann wende ich mich um und sehe [latria_partner.GetShortUIName] bereits an der Bettkante sitzen, die Kleider noch über dem Arm, als wären sie nach dem Eintreten vergessen worden.\n\nDie Lampe ist heruntergedreht. Keiner von uns nimmt auf, was über dem Stuhl liegt, doch die Decken werden bald warm. Die Nacht vergeht langsam genug, dass ich jedes leise Knacken des Dochts höre. Als ich wieder zum Fenster sehe, ist es Tag, und die äußere Hälfte des Bettes ist kalt geworden.\n\nEin Diener klopft zweimal und hält inne, als wäre er unsicher, ob man uns schon stören darf. Erst da fällt mir ein, wie viel der Tag bereits von mir erwartet."
 latria_act.0101.desc.adultery: "Ich horche lange an der Tür. Die Stimmen im Gang verebben, und selbst der Diener geht mit einer leeren Lampe fort, bevor ich einen Spalt öffne und [latria_partner.GetShortUIName] seitlich hereinlasse. Der Riegel gibt nur einen kleinen Laut. Heute Nacht scheint er lange anzuhalten.\n\nWir sprechen leise. Mehr als einmal gehen draußen Schritte vorbei, und wir verharren beide, selbst den Atem beiseitelegend, bis sie sich entfernen. Das Lampenlicht fällt auf die Vorhänge und auf unsere Augen, sobald sie zum Spalt wandern.\n\nBeim Abschied sieht [latria_partner.GetSheHe] mich von der Schwelle aus noch einmal an. Es muss nicht wiederholt werden. Niemand sonst sollte von dieser Nacht hören."
 latria_act.0101.desc.dead: "Zuerst glaube ich, [latria_partner.GetShortUIName] sei nur in einen tiefen Schlaf gesunken. Ich spreche den Namen dicht am Ohr und stelle dann die Lampe neben das Gesicht. Die Flamme zuckt und zeigt mir noch immer Augen, die nicht antworten.\n\nIch lege die Hand auf die Brust. Die Stille unter meiner Handfläche erschreckt mich. Die Decken behalten die Wärme von eben, das Kissen seine Mulde, doch der Atem ist fort. Ich halte die Hand, während sie kälter wird, als könnte ich sie noch zurückrufen.\n\nZuletzt reiße ich die Tür auf und rufe nach einem Arzt. Meine Stimme trifft auf den Gang und kehrt zurück, ohne noch wie meine zu klingen."
 latria_act.0101.desc.adultery_dead: "Ich dachte, das Schlimmste in dieser Nacht wäre, dass jemand die Tür öffnet und zwei Menschen sieht, die nicht zusammen hätten gesehen werden sollen.\n\nStattdessen sinkt [latria_partner.GetShortUIName] zuerst zusammen. Ich rufe, rüttle und halte die Lampe an das Gesicht. Die Augen öffnen sich nicht. An den Lippen regt sich kein Atem. Die eben noch warme Hand kühlt nach und nach in meiner.\n\nDraußen erklingen Schritte. Ich sehe das zerwühlte Bett, die noch nicht wieder angelegten Kleider und jemanden, der nie wieder erwachen wird. Wenn jene Tür aufgeht, habe ich nicht einmal einen Satz bereit."
 latria_act.0101.desc.actor_dissatisfied: "Die Nacht ist noch tief, als ich mich aufrichte und den Ärmel wieder über den Arm ziehe.\n\n[latria_partner.GetShortUIName] wendet sich unter den Decken, als wäre noch etwas zu sagen, und berührt leicht mein Handgelenk. Ich spüre nur, wie lang und leer die Stunden waren. Selbst der Wunsch, die Hand auszustrecken, ist fort. Ein Funke knackt in der Lampe, doch der Raum wird nicht wärmer.\n\nIch nehme meine Kleider vom Stuhl, ohne mich umzusehen. Manche Begegnungen lassen einen den Gang draußen umso mehr ersehnen, je länger sie währen."
 latria_act.0101.desc.partner_dissatisfied: "Beim Eintreten blieb [latria_partner.GetShortUIName] in der Tür stehen, sah erst die Lampe und dann mich an, als falle es schwer, die Nacht sogleich beginnen zu lassen.\n\nDas Gehen geht viel schneller. Der Gürtel ist noch nicht gebunden, da ist [latria_partner.GetSheHe] bereits aus dem Bett und weicht meinem Blick wie meinen Händen aus. Ich spreche den Namen aus. Es kommt eine kurze Antwort, aber kein Abschied. Als die Tür sich schließt, beugt der Luftzug die Flamme.\n\nDer Raum hält die Gegenwart noch fest. Die Bettkante ist bereits kalt, als hätte niemand dort gesessen."
 latria_act.0101.desc.manual: "Wir gehen nicht bis zum Bett.\n\n[latria_partner.GetShortUIName] setzt sich neben mich und beginnt von den unerledigten Geschäften des Tages zu sprechen, hält dann aber mitten im Satz inne. Die Küsse bleiben leicht, und die Zärtlichkeiten bleiben an einem Ärmel oder im Haar. Der Ruf eines Wächters zieht am Fenster vorüber. Keiner von uns zählt ihn.\n\nZuletzt ist das Lampenöl verbraucht. Wir sitzen noch eine Weile im Dunkeln und hören, wie unser Atem gleichmäßig wird, ehe jeder einen Ärmel glattstreicht. Für diese Nacht genügt das."
 latria_act.0101.a: "Die Tür öffnen und in den Tag zurückkehren."
 latria_act.0102.desc: "Ich könnte [latria_actor.GetShortUIName] daran erinnern, wie spät es geworden ist und dass morgen Menschen warten werden. Die Worte erreichen meine Lippen und gehen nicht weiter.\n\nSobald die Tür geschlossen ist, ziehen sich Schritte und Stimmen zurück. Das Lampenlicht wärmt die Vorhänge, und keiner von uns hat es eilig aufzustehen. Ich höre, wie der Atem aus der Unruhe in Ruhe übergeht, und vergesse selbst die Stunde. Als ich wieder zum Fenster blicke, ist es Tag. Die Diener draußen warten vermutlich schon eine ganze Weile.\n\nErst dann lasse ich die Hand los. Manche Nächte sollte man nicht zu ihrem Ende drängen."
 latria_act.0102.desc.adultery: "Als [latria_actor.GetShortUIName] gehen will, trete ich an die Tür und lege das Ohr an das Holz.\n\nDer Gang ist eine Zeit lang leer. Dann trägt jemand eine Lampe vorbei. Ihr Licht wandert langsam über den Spalt und langsam wieder fort. Wir sprechen nicht und lassen nicht einmal die Kleider ein Geräusch machen. Erst als die Stille zurückkehrt, werden die Kleider geordnet.\n\nIch öffne die Tür nur so weit, dass man seitlich hindurchkann. Zumindest heute Nacht gehört das Geheimnis noch uns beiden."
 latria_act.0102.desc.partner_dissatisfied: "Bevor die Tür sich schloss, stellte ich mir noch vor, wie die Nacht werden könnte. Ich hatte die Lampe sogar im Voraus wärmer gestellt.\n\nAls wir wirklich allein sind, kühlt diese Erwartung ab. Hände, Atem und jede Nähe, die mich hätte halten sollen, scheinen mich durch etwas hindurch zu erreichen. Ich antworte, doch meine Augen wandern zur Tür und meine Gedanken in den Gang dahinter.\n\nAm Ende setze ich mich zuerst auf und ziehe den Ärmel glatt. Diese Nacht war die Zeit des Wartens nicht wert."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] steht auf, ohne mich die Lampe wieder anzünden zu lassen. Nur ein wenig bleiches Licht bleibt neben dem Fenster.\n\nIch liege noch und suche nach einem Satz, der die Nacht nicht so scharf abbrechen ließe. Es gibt nur ein abgewandtes Gesicht, zwei achtlose Sätze und Finger, die bereits einen Gürtel binden, ohne die Kleider anzunehmen, die ich hinhalte. Meine Worte sind noch nicht zu Ende, da geht es schon zur Tür.\n\nMit ihr kommt kalte Luft herein. Manche Enttäuschungen brauchen keine Erklärung."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] zieht mich nicht zum Bett, sondern setzt sich neben mich und schiebt das Kissen zwischen uns beiseite.\n\nDie unerledigten Geschäfte des Tages scheinen plötzlich warten zu können. Wir tauschen Küsse und ein paar Sätze, die nicht zu Ende gesprochen werden müssen. Hände verweilen an einem Ärmel oder im Haar und gehen nicht tiefer. Hinter dem Fenster ist es noch dunkel, und der Ruf des Wächters ist noch fern.\n\nBeim Abschied wird die Falte geglättet, die ich selbst in meinen Kleidern verursacht habe. Die Nacht ist kurz, doch sie lässt nicht das Gefühl zurück, es fehle etwas."

 latria_scheme.0010.t: "Die Vereinigung"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "Mein [spouse|E]"
 latria_scheme.0010.t.concubine: "Meine [concubine|E]"
 latria_scheme.0010.t.soulmate: "Mein [soulmate|E]"
 latria_scheme.0010.t.lover: "Meine [lover|E]"
 latria_scheme.0010.t.adultery: "Ein Seitensprung"
 latria_scheme.0010.desc: "Die Kerzen brennen noch, doch [target.GetShortUIName] antwortet mir nicht mehr.\n\nIch spreche den Namen und lege dann das Ohr an die Lippen. Da ist nichts. Die Haut unter meinen Fingern ist kälter als noch vor einem Augenblick, obwohl unsere Wärme in den Decken bleibt. Die Hand gleitet aus meiner und kehrt nicht zurück.\n\nIch wollte Becher, Kleider und jede Spur dieser Nacht vor Tagesanbruch beseitigen. Nun liegt neben mir nur noch jemand, der sich nie wieder rühren wird. Das Fenster wird bleich, und ich weiß nicht, was ich zuerst verbergen soll."
 latria_scheme.0010.a: "Die Decke über [target.GetHerHim] ziehen und dann die Tür öffnen."
 latria_scheme.0020.t: "Eine Nacht des Wartens"
 latria_scheme.0020.desc: "Das Öl in der Lampe ist gesunken, und noch immer höre ich [target.GetFirstName] nicht an der Tür.\n\nIch wärme den Wein zweimal und falte die Kleider auf dem Stuhl erneut. Bisweilen geht jemand über den Gang. Nähern sich die Schritte, halte ich den Atem an. Entfernen sie sich, bin ich wieder allein. Jedes Mal glaube ich, es sei die erwartete Person.\n\nZuletzt flackert die Kerze, und Wachs fällt in die Schale. Erst da gestehe ich mir ein, dass die Nacht vorüber ist. Wein, Worte und die vorbereitete Ausrede werden nicht gebraucht."
 latria_scheme.0020.a: "Das Licht löschen. Warten hat keinen Sinn."
 latria_scheme.0030.t: "Eine zu späte Nachricht"
 latria_scheme.0030.desc: "Ich wäge noch ab, welche Seitentür abgeschiedener wäre und welche Einladung den geringsten Verdacht wecken würde, als die Nachricht auf meinen Tisch gelegt wird.\n\n[target.GetFirstName] ist bereits aus der Welt gegangen. Auf dem Papier stehen wenige Worte. Ich lese sie lange. Die ungesandten Briefe, die Gänge, die ich auswendig kenne, die Ausrede für diese eine Nacht: alles ist mit einem Mal nutzlos.\n\nIch gieße den noch warmen Wein fort. Manche Vorkehrungen können auf eine bessere Nacht warten. Keine holt einen Tod ein, der bereits eingetreten ist."
 latria_scheme.0030.a: "Den Brief verbrennen, den ich nie sandte."
 latria_scheme.0040.t: "Ein gerissener Faden"
 latria_scheme.0040.desc: "Ich schicke jemanden aus, um [target.GetFirstName] zu finden, und warte vom Nachmittag bis zum Anzünden der Lampen. Zurück kommt nur eine unklare Antwort: Eine Begegnung ist nicht mehr möglich.\n\nVielleicht wird eine Tür schärfer bewacht. Vielleicht ist ein Augenpaar misstrauisch geworden. Oder vielleicht will [target.GetSheHe] sich einfach nicht mehr dem Licht nähern, das noch immer für [target.GetHerHim] brennt. Ich frage zweimal. Der Bote weiß nichts weiter.\n\nDer Grund ist gleichgültig geworden. Der Faden ist zwischen meinen Fingern gerissen. Ich zerknülle den Zettel mit der aufgeschriebenen Stunde, bis der Schweiß die Zeichen verwischt."
 latria_scheme.0040.a: "Hier endet es."

