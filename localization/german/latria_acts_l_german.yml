 latria_act.0311.t: "Anhaltende Entkräftung"
 latria_act.0311.desc.illness: "Die lange Ausschweifung hat Euch schließlich gebrochen, und Krankheit breitet sich in Euch aus."
 latria_act.0311.desc.stress: "Die angesammelte Erschöpfung lässt Euch nicht schlafen."
 latria_act.0311.desc.infertile: "Euer Körper kann keinen Nachwuchs mehr hervorbringen."
 latria_act.0311.desc.health: "Selbst das Aufstehen fällt schwer. Euer Körper ist an seine Grenzen gelangt."
