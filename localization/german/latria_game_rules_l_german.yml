 setting_latria_repression_flavor_interval_240: "#high 240 Tage#!"
 setting_latria_repression_flavor_interval_240_desc: "Zwischen den Ereignissen eines Charakters liegen mindestens #V 240 Tage#!. Zahlenwerte der Optionen und Modifikatordauern betragen #V 4/3#! des Grundwerts bei 180 Tagen."
 setting_latria_repression_flavor_interval_360: "#high 360 Tage#!"
