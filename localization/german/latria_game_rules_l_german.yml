 setting_latria_repression_flavor_interval_120_desc: "Zwischen den Ereignissen eines Charakters liegen mindestens #V 120 Tage#!. Zahlenwerte der Optionen und Modifikatordauern betragen #V 2/3#! des Grundwerts bei 180 Tagen."
