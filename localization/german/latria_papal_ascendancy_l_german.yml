l_german:
 h_latria_holy_see: "Heiliger Stuhl"
 h_latria_holy_see_adj: "Katholisch"
 nick_latria_vicar_of_christ: "der Stellvertreter Christi"

 latria_papal_ascendancy.0001.t: "Der Thron über allen Kronen"
 latria_papal_ascendancy.0001.desc: "Vor den versammelten Prälaten erhebe ich meine Hand über den zerbrochenen Bannern jener, die mich stürzen wollten. Gott hat Seinen Stellvertreter nicht bewahrt, damit ich mit Fürsten feilsche. Auf Seinen Befehl soll der Heilige Stuhl ungeteilte Gewalt ausüben und jedem Reich die Erlösung bringen."
 latria_papal_ascendancy.0001.a: "Die Welt soll vor dem Heiligen Stuhl knien"

 latria_papal_ascendancy.0002.t: "Der Auftrag des Stellvertreters"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] hat das gegen den Heiligen Stuhl aufgebotene Heer zerschlagen. Vor der Geistlichkeit und den besiegten Fürsten verkündet [latria_papal_victor.GetSheHe], Gott habe [latria_papal_victor.GetHerHim] mit der uneingeschränkten Gewalt und der Erlösung der Welt betraut."
 latria_papal_ascendancy.0002.a: "Eine neue Ordnung beginnt"

 trait_latria_army_of_god: "Heer Gottes"
 trait_latria_army_of_god_desc: "Dieser Charakter befehligt ein Heer, das der uneingeschränkten Gewalt des Heiligen Stuhls geweiht ist."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] befehligt ein Heer, das der uneingeschränkten Gewalt des Heiligen Stuhls geweiht ist."

 latria_papal_redemption_or_ruin: "Erlösung oder Untergang"
 latria_papal_redemption_or_ruin_desc: "Verlangt, dass sich [recipient.GetShortUINameNoTooltip] dem Heiligen Stuhl unterwirft und [actor.GetShortUINamePossessiveNoTooltip] [rite|E] annimmt. Eine Weigerung führt zum Krieg."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] verlangt Eure Unterwerfung unter den Heiligen Stuhl und die Annahme von [actor.Custom('DE_PRO_POS_S_3P')]em [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "Klein-[old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "Klein-[old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "Das Geheimnis enthüllen"
 latria_reveal_papal_secret_decision_desc: "Ich werde mein Geheimnis vor der Geistlichkeit und den Fürsten aussprechen. Jeder Herrscher soll es aus meinem eigenen Mund hören. Wer mein Amt bestreitet, möge zu den Waffen greifen."
 latria_reveal_papal_secret_decision_tooltip: "Enthüllt Euren Seitensprung öffentlich und stellt Euch dem Absetzungskrieg."
 latria_reveal_papal_secret_decision_confirm: "Es vor aller Welt enthüllen"
 latria_can_reveal_papal_secret_trigger: "Ihr habt einen geheimen Seitensprung, den Ihr enthüllen könnt"
 NOT_ANY_OF_MY_SECRETS: "Keines Eurer Geheimnisse:"

 latria_papal_redemption_war: "Päpstlicher Erlösungskrieg"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Päpstliche Erlösung"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "[ATTACKER.GetPrimaryTitle.GetAdjective]er Erlösungskrieg gegen [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective]er Erlösungskrieg"
 latria_papal_redemption_war_victory_desc: "Der Verteidiger wird im Rang herabgesetzt und ein Vasall des Papstes; er nimmt dessen [rite|E] an."
 latria_papal_redemption_war_white_peace_desc: "Die Forderung nach Unterwerfung wird zurückgezogen."
 latria_papal_redemption_war_defeat_desc: "Die Forderung des Papstes nach Unterwerfung wird zurückgeschlagen."

 latria_decision_immediate_effect_loc: "#high #bold Wenn Ihr das Geheimnis enthüllt:#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X Dies beginnt den $latria_papal_scandal_depose_war$:#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "Unabhängige [rulers|E] Eures [rite|E] und [vassals|E], die Euch nicht vollständig unterstützen, können sich dem Bündnis zu Eurer Absetzung anschließen."
 latria_decision_paramour_defense_tt: "Falls Euer heimlicher Geliebter ein [ruler|E] ist, kann er sich den Verteidigern anschließen."
 latria_decision_allies_call_tt: "Eure [allies|E] können Eurem Ruf folgen und sich den Verteidigern anschließen."
 latria_decision_forced_defenders_tt: "Eure Marionetten unter den [rulers|E] sowie unabhängige Herrscher Eures [rite|E] mit der [piety_level|E] $piety_level_0$ können sich den Verteidigern anschließen."
 latria_decision_disgraced_defenders_tt: "Charaktere Eures [rite|E] mit dem [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] und eigenen Truppen können sich den Verteidigern anschließen."
 latria_decision_hook_defenders_tt: "Eure [hooks|E] können eingesetzt werden, um Charaktere Eures [rite|E] für die Verteidigung zu gewinnen."

 latria_decision_if_win_effect_loc: "\n#high #bold Wenn Ihr den Krieg gewinnt:#!#!\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "Besiegte [rulers|E] aufseiten der Angreifer zahlen Reparationen in [gold|E] und [prestige|E] entsprechend ihrem [title_tier|E]."
 latria_papal_scandal_reparations_first: "Besiegte [rulers|E] aufseiten der Angreifer zahlen Euch [gold|E] und [prestige|E] entsprechend ihrem [title_tier|E]."
 latria_papal_scandal_reparations_third: "Besiegte [rulers|E] aufseiten der Angreifer zahlen [CHARACTER.GetShortUIName] [gold|E] und [prestige|E] entsprechend ihrem [title_tier|E]."
 latria_papal_scandal_ally_share_tt: "Beteiligte [allies|E] aufseiten der Verteidiger teilen [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%] der gesamten Reparationen in [gold|E] und [prestige|E] untereinander auf."
 latria_papal_redemption_unlocked_tt: "Schaltet die [interaction|E] $latria_papal_redemption_or_ruin$ frei."

 latria_decision_if_lose_effect_loc: "\n#high #bold Wenn Ihr den Krieg verliert:#!#!"
 latria_decision_defeat_imprison_tt: "Der Anführer des Bündnisses wird Euch in seinem [dungeon|E] einsperren."
 latria_decision_if_white_peace_effect_loc: "\n#high #bold Wenn der Krieg mit einem Weißen Frieden endet:#!#!"

 latria_papal_scandal_depose_war: "Krieg zur Absetzung des Papstes"
 latria_papal_scandal_event_troops: "Päpstliche Verstärkungen"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "Den Papst absetzen"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "Krieg zur Absetzung von [DEFENDER.GetShortUINameNotMe]"
 latria_papal_scandal_depose_war_victory_desc_defender: "Ihr verliert Euer Amt als [head_of_faith|E]."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U] verliert [defender.Custom('DE_PRO_POS_S_3P')] Amt als [head_of_faith|E]."
 latria_papal_scandal_depose_war_white_peace_desc: "Beide Seiten schließen Frieden und behalten ihre [titles|E]."
 latria_papal_scandal_depose_war_defeat_desc_defender: "Ihr besiegt das Bündnis und bleibt [head_of_faith|E]."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U] besiegt das Bündnis und bleibt [head_of_faith|E]."

 latria_papal_ascendancy.0010.t: "Aufruf zur Verteidigung des Heiligen Stuhls"
 latria_papal_ascendancy.0010.desc: "Euer [ally|E], [latria_pope.GetShortUIName], steht einem Bündnis gegenüber, das [latria_pope.GetHerHim] wegen eines Seitensprungs absetzen will. Unter Berufung auf Euer Bündnis bittet [latria_pope.GetSheHe] Euch, gegen die Gegner ins Feld zu ziehen."
 latria_papal_ascendancy.0010.a: "Das heilige Bündnis ehren und ins Feld ziehen"
 latria_papal_ascendancy.0010.b: "Für einen solchen Skandal können wir nicht kämpfen"
 latria_honored_papal_alliance_opinion: "Verteidigte den Heiligen Stuhl"
 latria_refused_papal_alliance_opinion: "Entehrte das Bündnis mit dem Papst"
 latria_ally_share_received_msg_title: "Der Dank des Heiligen Stuhls"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName] hat Euch einen Anteil an den Reparationen der besiegten Herrscher geschickt."
 latria_ally_joined_defense_msg_title: "Verbündeter schließt sich der Verteidigung an"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName] hat Euer Bündnis geehrt und sich Eurer Verteidigung gegen das feindliche Bündnis angeschlossen."
 latria_ally_refused_defense_msg_title: "Verbündeter lehnt den Ruf ab"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName] hat Euren Ruf zur Verteidigung des Heiligen Stuhls abgelehnt."

 latria_papal_scandal_war.0001.t: "Ein Aufruf zur Absetzung des Papstes"
 latria_papal_scandal_war.0001.desc: "Herrscher haben zu den Waffen gegriffen, um [latria_scandal_target.GetShortUIName] abzusetzen, nachdem [latria_scandal_target.Custom('DE_PRO_POS_S_3P')] Seitensprung bekannt wurde. Ihre Gesandten kommen an meinen Hof und bitten mich, mit ihrem Bündnis ins Feld zu ziehen."
 latria_papal_scandal_war.0001.a: "Mit dem Bündnis zu den Waffen greifen"
 latria_papal_scandal_war.0001.b: "Mich aus diesem Krieg heraushalten"
