l_german:
 latria_sexual_frustration_flavor.1401.t: "Das unbenutzte Siegel"
 latria_sexual_frustration_flavor.1401.desc.female: "Im Nachtgewand falte ich am Bett einen Brief wieder und wieder. Er trägt keinen Namen, nur das Siegel fehlt noch, das ich bisher nicht aufzudrücken wagte."
 latria_sexual_frustration_flavor.1401.desc.male: "Im Nachtgewand sitze ich am Bettrand, das Siegel in der Hand. Wenn ich diese Worte schreibe, kann ich nicht länger so tun, als hätte ich sie nie gedacht."
 latria_sexual_frustration_flavor.1401.desc: "Ich hebe das Siegel und lege es wieder ab, ohne es je auf das Blatt zu drücken."
 latria_sexual_frustration_flavor.1401.a: "Den Brief zu Ende schreiben und mein Siegel daraufsetzen."
 latria_sexual_frustration_flavor.1401.b: "Das Siegel weglegen, die Sehnsucht unterdrücken und mich hinlegen."

 latria_sexual_frustration_flavor.1402.t: "Das letzte Festmahl"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Bevor das Fest endet, sprechen die Gäste noch immer offen von Affären, Verlobungen und vergangenen Freuden. Ich kann ihre Worte nicht länger als bloßes Geschwätz abtun."
 latria_sexual_frustration_flavor.1402.desc.strict: "Jemand nennt einen Adligen, der wegen einer unbedachten Liebschaft in Ungnade fiel, und an der Tafel wird es still. Ich weiß, dass man dasselbe Urteil über mich fällen könnte."
 latria_sexual_frustration_flavor.1402.desc: "Die Tische sind unordentlich und die Gäste gehen, doch der Gedanke in mir wird immer lauter."
 latria_sexual_frustration_flavor.1402.a: "Die letzten Gäste an der Tafel halten und meine Sorgen immer wieder erzählen."
 latria_sexual_frustration_flavor.1402.b: "Den Gedanken unterdrücken, meinen Gastgebern danken und mich verabschieden."

 latria_sexual_frustration_flavor.1403.t: "Eine Beichte ohne Zeugen"
 latria_sexual_frustration_flavor.1403.desc.favors: "Der Altar steht verlassen da. Ich erinnere mich, dass mein Glaube fleischliche Freuden erlaubt, doch ich weiß noch immer nicht, wie ich diesen Drang besänftigen soll."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Ich knie allein vor dem Altar, meine Kleidung ist geordnet, doch das Gebet stockt jedes Mal bei denselben Worten. Habe ich mein Gelübde dennoch gebrochen, wenn niemand mich hört?"
 latria_sexual_frustration_flavor.1403.desc: "Das Heiligtum ist leer. Ich habe es noch nicht verlassen."
 latria_sexual_frustration_flavor.1403.a: "Keine weiteren Gelübde der Enthaltsamkeit ablegen und meine Entscheidung eingestehen."
 latria_sexual_frustration_flavor.1403.b: "Meine Begierde zügeln und bis zum Morgengebet knien."

 latria_sexual_frustration_flavor.1404.t: "Die Sehnsucht benennen"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Unbekleidet und allein stehe ich vor dem Spiegel meiner Kammer und weiche meinem Spiegelbild nicht aus. Ich bin es leid, Begierde eine flüchtige Schwäche zu nennen."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Unbekleidet und allein am Bett falte ich die Hände. Wenn ich mein Gelübde halte, dann nicht, weil diese Sehnsucht verschwunden ist."
 latria_sexual_frustration_flavor.1404.desc: "Die Nacht ist weit fortgeschritten. Endlich verberge ich meine Begierde nicht länger vor mir selbst."
 latria_sexual_frustration_flavor.1404.a: "Meine Sehnsucht eingestehen und sie heute Nacht nicht länger bekämpfen."
 latria_sexual_frustration_flavor.1404.b: "Mich wieder ankleiden und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1405.t: "Eine Seite in der Chronik"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Der Chronist wartet darauf, dass ich entscheide, was der Erinnerung wert ist. Im Festgewand stehe ich hinter ihm und verstehe, dass Schweigen diese Qual nicht verschwinden lässt."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Der Schreiber sitzt am Tisch und fragt, ob dieser Teil der Reise in die Chronik gehört. Ich blicke auf den unversandten Brief und weiß, dass diese Worte mich begleiten werden."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Ich lege mein geistliches Gewand an und trete vor den Schreiber. Das Gelübde und die Begierde sind beide wahr; ich werde niemand anderen entscheiden lassen, was davon in Erinnerung bleiben soll."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Der Schreiber wartet darauf, meine Worte festzuhalten. Im Festgewand spreche ich vor meinen Dienern über das, was ich in mir verborgen hielt."
 latria_sexual_frustration_flavor.1405.desc: "Ich beschließe, diese Angelegenheit nicht länger für mich zu behalten."
 latria_sexual_frustration_flavor.1405.a: "Die Abschriften verbreiten lassen, damit alle sie lesen können."
 latria_sexual_frustration_flavor.1405.b: "Den Schreiber nur meine Pflichten aufzeichnen lassen und den Rest hinunterschlucken."

 latria_sexual_frustration_flavor.1406.t: "Als die Gäste gehen"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Die letzten Gäste sprechen noch von Affären und Verlobungen. Kaum beginne ich eine alte Geschichte aus meinem eigenen Leben, kichert jemand an der Tafel."
 latria_sexual_frustration_flavor.1406.desc.strict: "Die Nachricht von einem Adligen, der wegen einer unbedachten Liebschaft in Ungnade fiel, erreicht die Tafel. Bevor ich verstumme, beginnen meine Nachbarn zu flüstern, und jemand lacht."
 latria_sexual_frustration_flavor.1406.desc: "Die Gäste gehen, doch ich habe noch nicht aufgehört zu reden. Meine Nachbarn tauschen einen Blick, und jemand an der Tafel kichert."
 latria_sexual_frustration_flavor.1406.a: "Meine Geschichte weitererzählen und jedem, der mich verspottet, vor der ganzen Tafel antworten."
 latria_sexual_frustration_flavor.1406.b: "Schweigen, mich vor der Gesellschaft verneigen und mich verabschieden."

 latria_sexual_frustration_flavor.1407.t: "Gebet beim Erlöschen der Kerze"
 latria_sexual_frustration_flavor.1407.desc.favors: "Im Nachtgewand am Bett erinnere ich mich, dass mein Glaube die Freuden des Fleisches nicht verwehrt. Allein weiß ich noch immer nicht, wie ich zur Ruhe kommen soll."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Ich ziehe mein Nachtgewand eng um mich und wiederhole mein Keuschheitsgelübde. Die Kerze brennt nieder, doch die Sehnsucht in mir lässt nicht nach."
 latria_sexual_frustration_flavor.1407.desc: "Nur eine verlöschende Kerze bleibt in der Kammer, und ich bin noch immer wach."
 latria_sexual_frustration_flavor.1407.a: "Das Keuschheitsgelübde beiseitelegen und bei dieser Zuneigung verweilen."
 latria_sexual_frustration_flavor.1407.b: "Meine Gedanken zügeln und bis zum Morgengrauen beten."

 latria_sexual_frustration_flavor.1408.t: "Schweigend vor dem Spiegel"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Unbekleidet und allein stehe ich vor dem Spiegel und kann diese Sehnsucht nicht länger einen flüchtigen Gedanken nennen. Ich will es auch nicht länger vorgeben."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Unbekleidet am Bett falte ich die Hände. Keuschheit bleibt meine Wahl, doch nie zuvor fiel mir diese Wahl so schwer."
 latria_sexual_frustration_flavor.1408.desc: "In der Stille betrachte ich mein Spiegelbild und weiche dem, was in meinem Herzen liegt, nicht länger aus."
 latria_sexual_frustration_flavor.1408.a: "Diese Begierde eingestehen und ihr heute Nacht nicht länger entfliehen."
 latria_sexual_frustration_flavor.1408.b: "Mich ankleiden, an den Schreibtisch setzen und den Gedanken unterdrücken."

 latria_sexual_frustration_flavor.1409.t: "Ein Verlust der Fassung am Hof"
 latria_sexual_frustration_flavor.1409.desc: "Während einer Ratspause entkleide ich mich in der Nebenkammer. Bevor ich mein Gewand anlegen kann, öffnet sich die Tür zum Ratssaal. Die Edelleute verstummen, und der Schreiber senkt den Blick; meine Stimme stockt, während der Diener mit dem Gewand bereitsteht."
 latria_sexual_frustration_flavor.1409.a: "Vor ihnen stehen bleiben und meinen Fehltritt nicht verbergen."
 latria_sexual_frustration_flavor.1409.b: "Die Edelleute fortschicken und mich vor der Fortsetzung der Ratssitzung ankleiden."

 latria_sexual_frustration_flavor.1410.t: "Die Nacht hinter der Tür"
 latria_sexual_frustration_flavor.1410.desc.female: "Im Nachtgewand sitze ich neben der Tür und höre draußen Schritte verklingen. In der späten Stunde kehrt die unerwiderte Zuneigung zu mir zurück."
 latria_sexual_frustration_flavor.1410.desc.male: "Im Nachtgewand lehne ich am Bett, mein Buch noch ungeöffnet. Der Gang ist still, doch der Schlaf will nicht kommen."
 latria_sexual_frustration_flavor.1410.desc: "Die Nacht ist lang. Hinter der Tür regt sich nichts, und meine Gedanken kommen nicht zur Ruhe."
 latria_sexual_frustration_flavor.1410.a: "Das Buch beiseitelegen und einen langen Brief schreiben."
 latria_sexual_frustration_flavor.1410.b: "Die Sehnsucht unterdrücken, die Lampe löschen und mich hinlegen."

 latria_sexual_frustration_flavor.1401.c: "Die Einladung, die ich nicht versenden kann, zu einem Gedicht machen."
 latria_sexual_frustration_flavor.1402.c: "Die Musikanten dafür bezahlen, für die verbleibenden Gäste zu spielen."
 latria_sexual_frustration_flavor.1402.d: "Die Gäste bitten zu bleiben und von ihren früheren Reisen zu erzählen."
 latria_sexual_frustration_flavor.1403.c: "Die heilige Schrift aufschlagen und in jedem Abschnitt nach einer Antwort suchen."
 latria_sexual_frustration_flavor.1404.c: "Mein Keuschheitsgelübde aufgeben und fortan meinen Begierden folgen."
 latria_sexual_frustration_flavor.1404.d: "Mein Nachtgewand anlegen und sitzen bleiben, bis meine Gedanken zur Ruhe kommen."
 latria_sexual_frustration_flavor.1405.c: "Meinen Bericht in einen privaten Brief fassen und in einer Schatulle versiegeln."
 latria_sexual_frustration_flavor.1405.d: "Vor diesen Zeugen ein Keuschheitsgelübde ablegen."
 latria_sexual_frustration_flavor.1406.c: "Den scheidenden Gästen ein neues Gedicht vortragen."
 latria_sexual_frustration_flavor.1407.c: "Das Gebetbuch schließen und meine Gefühle in Ruhe bedenken."
 latria_sexual_frustration_flavor.1408.c: "Die Pflichten des Morgens auflisten und alle Papiere ordnen."
 latria_sexual_frustration_flavor.1409.c: "Mich ankleiden, an den Tisch zurückkehren und jede Angelegenheit des Hofes erledigen."
 latria_sexual_frustration_flavor.1409.d: "Mich ankleiden, einen Scherz machen und die Edelleute bitten, wieder Platz zu nehmen."
 latria_sexual_frustration_flavor.1410.c: "Ein Gewand anlegen, Tee aufbrühen und sitzen bleiben, bis ich schlafen kann."
