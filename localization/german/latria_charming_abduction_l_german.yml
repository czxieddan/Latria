 latria_charming_abduction_invalidated_title: "Die Kerzen erlöschen"
 latria_charming_abduction_i_imprisoned_message: "[target.GetShortUIName|U] ist bereits in meinem Gewahrsam. Die Einladung muss nicht mehr verschickt werden."
 latria_charming_abduction_no_longer_possible: "Dieses Treffen lässt sich nicht mehr arrangieren. Die Einladung muss ins Feuer."
