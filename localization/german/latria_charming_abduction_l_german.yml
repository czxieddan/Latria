 latria_charming_abduction.1001.t: "Ein Versprechen am Kopfkissen"
 latria_charming_abduction.1001.desc: "Das Badewasser kühlt ab, doch sein Duft hängt noch im Schlafgemach. Ich lege mein Gewand neben das Bett und wende mich dem unversiegelten Brief auf dem Tisch zu. Es fehlt nur eine Zeile, die [target.GetFirstName] wach halten wird.\n\nMeine Leute kennen die Seitentür und jede Biegung des Gangs. Wenn [target.GetSheHe] für das Versprechen einer zärtlichen Nacht [target.Custom('DE_PRO_POS_S_3P')] Gefolge fortschickt, werden die schweren Vorhänge vieles verbergen. Was die Freuden betrifft, die [target.GetSheHe] in meinem Bett für [target.GetHerHim] erhofft ... zuerst muss [target.GetSheHe] die Schwelle überschreiten."
 latria_charming_abduction.1001.a: "An [target.GetHerHim] schreiben, dass ich am Bett warten werde."
 latria_charming_abduction.1001.b: "[target.GetHerHim] auf Wein ins Vorzimmer einladen. Warmer Wein, gedämpftes Kerzenlicht."
 latria_charming_abduction.1001.c: "Den Brief versiegeln. Es wird eine bessere Nacht geben."
 latria_charming_abduction.1001.d: "Den Brief ins Feuer werfen. Hier endet es."
 latria_charming_abduction_wait_tt: "Setzt die Vorbereitungen fort und wartet auf eine weitere Gelegenheit zur Ausführung."

 latria_charming_abduction.1101.t: "Ein Hauch von Duft"
 latria_charming_abduction.1101.desc: "Ein Seidenband trifft mit [target.GetFirstNamePossessive] Antwort ein, so lose geknotet, als könnte der leiseste Zug es lösen. Die Worte bleiben schicklich, doch die letzten Zeilen drängen sich: [target.GetSheHe] wollte eilig zum Ende kommen und doch die Feder nicht ablegen.\n\nIch wickle das Band um einen Finger. Welchen Duft soll mein nächster Brief tragen? Und welche Gedanken könnten ihm in [target.Custom('DE_PRO_POS_S_3P')] Bett folgen?"
 latria_charming_abduction.1101.a: "Einen Tropfen Duftöl auf die Zeile über die Nacht geben."
 latria_charming_abduction.1101.b: "Die Stunde nennen. Den Brief nicht unterzeichnen."
 latria_charming_abduction.1101.c: "Die Antwort unter den Kerzenleuchter legen. Sie soll warten."

 latria_charming_abduction.1102.t: "Ein weiteres Paar Augen"
 latria_charming_abduction.1102.desc: "Nachrichten über [target.GetFirstNamePossessive] abendliche Gewohnheiten erweisen sich als nützlicher als [target.Custom('DE_PRO_POS_S_3P')]e Liebesbriefe. Ein Bediensteter bleibt stets nach Einbruch der Dunkelheit, schenkt Wein ein und räumt Kleider fort. Er geht erst, wenn die letzte Kerze erloschen ist.\n\nEin treuer Diener könnte ein sorgsam geplantes Stelldichein verderben. Ich muss diesen wachsamen Augen eine andere Beschäftigung geben."
 latria_charming_abduction.1102.a: "Ein Beutel Silber sollte dem Diener einen vergnüglichen Abend verschaffen."
 latria_charming_abduction.1102.b: "Eine Zeile hinzufügen: Kommt allein, und ich habe eine Überraschung für Euch."
 latria_charming_abduction.1102.c: "Die Einladung vorerst zurücknehmen. Diese Tür kann noch eine Nacht warten."

 latria_charming_abduction.2001.t: "Wenn der Riegel fällt"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] betritt das Schlafgemach, [target.Custom('DE_PRO_POS_S_3P')]e Augen noch auf die Kerzen neben dem Bett gerichtet. Ich biete eine Hand dar und lasse [target.GetHerHim] glauben, ein weiterer Schritt würde genügen, um mich zu erreichen.\n\nDer Riegel klickt. [target.GetSheHe|U] wendet sich um, und die Schatten hinter den Vorhängen erheben sich. Meine Leute packen [target.Custom('DE_PRO_POS_S_3P')]e Arme; die Schnur gleitet aus einem Ärmel, ohne auch nur einen Kerzenleuchter anzustoßen.\n\nIch greife nach den Kleidern auf dem Stuhl. Heute Nacht wird niemand dieses Kopfkissen mit mir teilen."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] nimmt den eingeschenkten Wein an und dreht sich etwas, sodass der Weg zum inneren Gemach frei wird. [target.GetSheHe|U] erwartet, dass ich [target.Custom('DE_PRO_POS_S_3P')]e Hand nehme und [target.GetHerHim] an einen abgeschiedeneren Ort führe.\n\nStattdessen stelle ich meinen Becher ab. Die Seitentür öffnet sich, und meine Leute stürmen herein. Bevor [target.GetSheHe] nach Hilfe rufen kann, ist der Riegel vorgeschoben, und die Fesseln sitzen fest.\n\nDer Wein auf dem Tisch ist kaum angerührt."
 latria_charming_abduction.2001.secret: "\n\nAuf dem Gang regt sich nichts. Bis der Hof [target.Custom('DE_PRO_POS_S_3P')]e Abwesenheit bemerkt, wird selbst das Kerzenwachs erkaltet sein."
 latria_charming_abduction.2001.exposed: "\n\nVor dem Fenster ertönt ein Schrei. Offenbar wird jemand noch vor Tagesanbruch die andere Hälfte der Geschichte dieses Abends erzählen."
 latria_charming_abduction.2001.a: "[target.Custom('DE_PRO_POS_S_3P')]en Mantel holen. Es ist Zeit aufzubrechen."

 latria_charming_abduction.2002.t: "Ein unvollendeter Abend"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] bleibt im Türrahmen stehen. Weder die Kerzen noch das Bett noch mein sorgsam bemessenes Schweigen locken [target.GetHerHim] einen Schritt näher.\n\n\"Es wird spät.\" [target.Custom('DE_PRO_POS_S_3P')|U]e Augen wandern über meine Schulter zu den reglosen Vorhängen.\n\nMeine ausgestreckte Hand berührt nur die Nachtluft."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] lässt den Wein unberührt. Einen Augenblick steht [target.GetSheHe] neben dem Tisch, als gelte es, mein Lächeln abzuwägen, dann folgt der Rückzug zur offenen Tür.\n\n\"Lasst das Licht brennen. Meine Leute warten.\"\n\nDie Schritte hinter der Seitentür klingen furchtbar laut."
 latria_charming_abduction.2002.secret: "\n\nIch senke die Hand, bevor die verborgenen Männer hervortreten können. Morgen mag jemand über meine unerwünschten Avancen lachen. Niemand wird wissen, was hinter jener Tür wartete."
 latria_charming_abduction.2002.exposed: "\n\nEine Seilschlinge kommt zum Vorschein. [target.GetFirstNameNoTooltip] schreckt zurück und ruft meinen Namen, während [target.GetSheHe] zu [target.Custom('DE_PRO_POS_S_3P')]en Wachen zurückweicht. Niemand wird dies mehr für einen harmlosen Flirt halten."
 latria_charming_abduction.2002.a: "Die Kerzen löschen. Es wird keine Einladungen mehr geben."
 latria_charming_abduction.2002.b: "Einen neuen Brief schreiben und auf eine weitere Gelegenheit warten."
 latria_charming_abduction_retry_tt: "Bereitet dieses Komplott erneut vor. Der Modifikator für die Vorgehensweise dieses Versuchs wird entfernt, frühere Vorbereitungen der Einladung bleiben erhalten."

 latria_charming_abduction.2101.t: "Eine zärtliche Falle"
 latria_charming_abduction.2101.bedchamber: "Als ich zu [owner.GetFirstName] kam, überlegte ich noch, wie ich am besten [owner.Custom('DE_PRO_POS_S_3P')]e Hand küssen sollte. Das Schlafgemach war schwach beleuchtet, gerade hell genug, um den Blick hinter die Vorhänge zu vergessen.\n\nErst als mir die Arme hinter den Rücken gerissen wurden, begriff ich, warum [owner.GetSheHe] außer Reichweite geblieben war. Hier wartete keine Zärtlichkeit auf mich, nur ein Stück Seil."
 latria_charming_abduction.2101.antechamber: "Ich wurde [owner.GetFirstNamePossessive] Gefangener, bevor ich einen Schluck Wein trinken konnte.\n\n[owner.GetSheHe|U] stellte [owner.Custom('DE_PRO_POS_S_3P')]en Becher ab, als wäre dies ein vereinbartes Zeichen. Einen Augenblick später strömten Leute durch die Seitentür und packten meine Arme. Ich sah [owner.GetHerHim] weiter an und wartete auf eine Erklärung. [owner.GetSheHe|U] befahl ihnen lediglich, meinen Mantel zu holen."
 latria_charming_abduction.2101.a: "Mich abwenden. Ich werde [owner.GetHerHim] nicht ansehen."

 latria_charming_abduction.2102.t: "Hinter dem Kerzenschein"
 latria_charming_abduction.2102.secret: "[owner.GetFirstNamePossessive] Einladung war zärtlich genug, doch beim Treffen schien [owner.GetSheHe] abgelenkt. Schritte auf dem Gang; raschelnder Stoff hinter einer Tür. Als ich meine Wachen erwähnte, erstarrte [owner.Custom('DE_PRO_POS_S_3P')] Lächeln.\n\nIch ging unter einem Vorwand. Erst als ich wieder unter meinen eigenen Leuten stand, bemerkte ich den Schweiß auf meinen Handflächen. Vielleicht war es nur ein unbeholfenes Stelldichein. Vielleicht wäre es mir lieber, nie zu erfahren, was hinter jener Tür lag."
 latria_charming_abduction.2102.exposed: "Der Anblick des Seils brachte mich schlagartig zur Besinnung.\n\n[owner.GetFirstNamePossessive] Flüstern, die heruntergebrannten Kerzen, der Abstand, den [owner.GetSheHe] zwischen uns hielt: All das sollte mich in diesem Gemach halten. Ich wich auf den Gang zurück und rief meine Wachen, während sich die Gestalten hinter der Tür wieder in die Schatten zurückzogen.\n\nFür dieses Lächeln hätte ich beinahe alle fortgeschickt."
 latria_charming_abduction.2102.a: "Von nun an wartet immer jemand vor der Tür."

