l_french:
 latria_sexual_frustration_flavor.1001.t: "Une longue nuit derrière le rideau"
 latria_sexual_frustration_flavor.1001.desc.female: "En chemise de nuit, je m’assieds près de la fenêtre, une lettre encore close sur les genoux. La personne qui l’a écrite est partie depuis longtemps, mais je m’attarde sur tout ce qui est resté tu."
 latria_sexual_frustration_flavor.1001.desc.male: "En chemise de nuit, je m’assieds près de la fenêtre, une lettre encore close sur les genoux. L’écriture familière sur l’enveloppe ravive un désir resté sans réponse."
 latria_sexual_frustration_flavor.1001.desc: "Il se fait tard, et les vieilles pensées reviennent encore."
 latria_sexual_frustration_flavor.1001.a: "La lire jusqu’au bout et penser à la personne qui l’a écrite."
 latria_sexual_frustration_flavor.1001.b: "Enfermer la lettre et étouffer cette pensée."
 latria_sexual_frustration_flavor.1001.c: "Prendre une feuille vierge et en faire un poème."

 latria_sexual_frustration_flavor.1002.t: "Les épices du festin"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Les épices et les chants emplissent la salle, et aucun convive ne semble s’offusquer d’un regard égaré. Pourtant, je scrute chaque visage, comme si quelqu’un pouvait encore apparaître."
 latria_sexual_frustration_flavor.1002.desc.strict: "Les épices animent le festin, mais chaque rire me rappelle combien la coutume surveille le désir qui s’égare. J’en oublie presque la coupe dans ma main."
 latria_sexual_frustration_flavor.1002.desc: "Le festin est bruyant. Mes pensées n’en continuent pas moins de s’égarer."
 latria_sexual_frustration_flavor.1002.a: "Me joindre à la conversation avec quelques mots tendres."
 latria_sexual_frustration_flavor.1002.b: "Baisser les yeux, remercier l’hôte et prendre congé."
 latria_sexual_frustration_flavor.1002.c: "Demander encore un air aux musiciens avant de partir."
 latria_sexual_frustration_flavor.1002.d: "Rassembler les convives à une même table et parler toute la soirée."

 latria_sexual_frustration_flavor.1003.t: "Un sermon au jardin"
 latria_sexual_frustration_flavor.1003.desc.favors: "Le prédicateur dit que les plaisirs charnels ne heurtent pas nécessairement notre foi. Ces mots devraient me réconforter, mais mon agitation ne s’apaise pas."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Le prédicateur parle de chasteté et de retenue. J’entends chaque mot, mais ne parviens pas à garder mon esprit sur les Écritures."
 latria_sexual_frustration_flavor.1003.desc: "J’écoute le sermon jusqu’au bout. Une brise tourne la page, et mes pensées restent troublées."
 latria_sexual_frustration_flavor.1003.a: "Fermer le livre et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1003.b: "Écarter ces pensées et me joindre à la récitation."
 latria_sexual_frustration_flavor.1003.c: "Demander au prédicateur d’expliquer chaque passage."

 latria_sexual_frustration_flavor.1004.t: "Un faucon agité"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Le faucon bat des ailes sur mon gant, les yeux fixés sur les pigeons au loin. Je connais bien cette impatience, mais ne trouve aucun repos pour mes propres pensées."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Le faucon s’agite sur mon gant. Je me concentre sur les rênes et le rappel, mais mes pensées se révèlent plus difficiles à dompter."
 latria_sexual_frustration_flavor.1004.desc: "Les chasseurs attendent que je rappelle le faucon, mais je ne parviens pas à me concentrer sur la chasse."
 latria_sexual_frustration_flavor.1004.a: "Laisser la compagnie attendre pendant que je suis mes pensées."
 latria_sexual_frustration_flavor.1004.b: "Rassembler mes pensées et ranger le matériel de chasse."
 latria_sexual_frustration_flavor.1004.c: "Lisser lentement les plumes, puis tenter un nouveau rappel."

 latria_sexual_frustration_flavor.1005.t: "Entre deux conseils"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Les seigneurs se sont dispersés, laissant cartes et sceaux sur la table. Je reste à sa tête, sans compagnie, une vieille lettre près des documents inachevés."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Mes compagnons ont choisi le prochain gué, mais la carte couvre encore la table. Je rapproche une vieille lettre de la lampe et perds le fil de la liste des provisions."
 latria_sexual_frustration_flavor.1005.desc.clergy: "La réunion est terminée ; comptes et Écritures restent sur la table. Je tire une vieille lettre d’entre les pages, et mes pensées agitées reviennent."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Le conseil est terminé, mais les documents et les sceaux demeurent. Je lisse ma manche ; la vieille lettre à mes côtés retient mon attention plus sûrement qu’aucune requête."
 latria_sexual_frustration_flavor.1005.desc: "Le travail m’attend, mais une vieille lettre attire sans cesse mon attention."
 latria_sexual_frustration_flavor.1005.a: "Écarter le travail et relire la vieille lettre."
 latria_sexual_frustration_flavor.1005.b: "Ranger la lettre et reprendre mes devoirs."
 latria_sexual_frustration_flavor.1005.c: "Organiser le travail restant et m’accorder un bref repos."
 latria_sexual_frustration_flavor.1005.d: "Trier les tâches et les accomplir une à une."

 latria_sexual_frustration_flavor.1006.t: "Une vieille lettre à la lueur des bougies"
 latria_sexual_frustration_flavor.1006.desc.female: "En chemise de nuit, je m’assieds sous la lampe, les doigts sur les plis d’une vieille lettre. Elle ne contient aucune promesse, seulement une affection qui n’a pas pâli."
 latria_sexual_frustration_flavor.1006.desc.male: "En chemise de nuit, je m’assieds près du lit. L’écriture familière sur la vieille lettre me rappelle une affection qui n’a jamais été partagée."
 latria_sexual_frustration_flavor.1006.desc: "La nuit est calme, mais les mots de la vieille lettre restent devant mes yeux."
 latria_sexual_frustration_flavor.1006.a: "Lire la lettre jusqu’au bout."
 latria_sexual_frustration_flavor.1006.b: "Ranger la lettre, souffler la bougie et chercher le sommeil."

 latria_sexual_frustration_flavor.1007.t: "Avant la fin du festin"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Quelqu’un évoque un ancien amant, et personne à table ne s’en offense. Je lève ma coupe avec les autres, mais mon regard revient toujours vers une place vide."
 latria_sexual_frustration_flavor.1007.desc.strict: "Une romance indiscrète sert de mise en garde, et la conversation se tourne vers la réputation et les coutumes. Je lisse ma manche sans rien dire."
 latria_sexual_frustration_flavor.1007.desc: "La musique continue, même si mes pensées ont quitté la table depuis longtemps."
 latria_sexual_frustration_flavor.1007.a: "Leur raconter mon propre désir, depuis le début."
 latria_sexual_frustration_flavor.1007.b: "Ravaler mes mots, remercier l’hôte et prendre congé."
 latria_sexual_frustration_flavor.1007.c: "Interroger plutôt la personne à mes côtés sur ses voyages."

 latria_sexual_frustration_flavor.1008.t: "Prière devant le sanctuaire"
 latria_sexual_frustration_flavor.1008.desc.favors: "La bougie devant le sanctuaire se consume. Ma foi ne méprise pas les plaisirs de la chair, mais je ne parviens pas à calmer l’urgence qui m’habite."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Je répète mon vœu de chasteté devant le sanctuaire, mais la prière familière se brise plusieurs fois sur mes lèvres."
 latria_sexual_frustration_flavor.1008.desc: "La prière est achevée. Je reste près de la bougie."
 latria_sexual_frustration_flavor.1008.a: "Écarter le vœu d’abstinence et reconnaître mon désir."
 latria_sexual_frustration_flavor.1008.b: "Contenir mes pensées et poursuivre la prière."
 latria_sexual_frustration_flavor.1008.c: "Lire un passage et le méditer avant de partir."
 latria_sexual_frustration_flavor.1008.d: "Garder la bougie allumée et réciter jusqu’à l’aube."

 latria_sexual_frustration_flavor.1009.t: "La requête non lue"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Les requêtes couvrent la longue table, et les seigneurs attendent ma parole. Je lis deux fois la même ligne, mais mon esprit s’égare ailleurs."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Le conseil n’est pas encore terminé, mais je ne retiens pas un mot des documents devant moi. Je ferme le registre et tente de revenir à l’affaire qui nous occupe."
 latria_sexual_frustration_flavor.1009.a: "Congédier le conseil et rester avec mes pensées."
 latria_sexual_frustration_flavor.1009.b: "Rassembler mes pensées et examiner chaque requête."
 latria_sexual_frustration_flavor.1009.c: "Mettre les décisions en ordre, puis les prononcer une à une."

 latria_sexual_frustration_flavor.1010.t: "Le retour de l’aigle"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Le faucon tourne au-dessus du bois. En le voyant refuser de revenir, je me rappelle combien j’en ai assez de réprimer chaque désir."
 latria_sexual_frustration_flavor.1010.desc.chaste: "L’épervier tourne encore au loin. Je serre mon gant et me force à n’écouter que l’appel des chasseurs."
 latria_sexual_frustration_flavor.1010.desc: "Les chasseurs attendent de lever le camp, tandis que je continue à regarder le ciel au-dessus des arbres."
 latria_sexual_frustration_flavor.1010.a: "Faire attendre les chasseurs tandis que mes pensées suivent l’aigle."
 latria_sexual_frustration_flavor.1010.b: "Sonner le retour et inspecter le matériel de chasse."
 latria_sexual_frustration_flavor.1010.c: "Marcher le long du bois avant de rejoindre la compagnie."

 nick_latria_the_unquiet: "l’Inquiet"
 latria_flavor_focus: "Résolution affermie"
 latria_flavor_focus_desc: "Ce personnage a tourné son attention vers les Écritures et ses devoirs quotidiens."
 latria_flavor_remorse: "Remords persistants"
 latria_flavor_remorse_desc: "Un bref réconfort a laissé une conscience troublée."
 latria_flavor_sullied: "Réputation ternie"
 latria_flavor_sullied_desc: "Des rumeurs ont nui au rang et aux amitiés de ce personnage."
 latria_flavor_broken_sleep: "Manque de sommeil"
 latria_flavor_broken_sleep_desc: "Le manque de sommeil rend ce personnage distrait et vite fatigué."
 latria_flavor_vagabond_focus: "Concentration du voyageur"
 latria_flavor_vagabond_focus_desc: "Les travaux du voyage apaisent brièvement les pensées agitées."
 latria_flavor_public_disgrace: "Déshonneur public"
 latria_flavor_public_disgrace_desc: "Les rumeurs d’un écart public ont nui au rang et aux amitiés de ce personnage."
 latria_flavor_hunting_focus: "Attention portée à la chasse"
 latria_flavor_hunting_focus_desc: "Ce personnage se concentre sur le pistage, la fauconnerie et l’équitation."
 latria_flavor_warm_company: "Agréable compagnie"
 latria_flavor_warm_company_desc: "Une bonne conversation a donné à ce personnage le goût de la compagnie."
 latria_flavor_neglected_duties: "Devoirs négligés"
 latria_flavor_neglected_duties_desc: "Des soucis privés ont détourné ce personnage de ses devoirs."
 latria_flavor_diligent_work: "Devoirs remis en ordre"
 latria_flavor_diligent_work_desc: "Ce personnage a consacré ses pensées agitées à une planification et un travail minutieux."
