l_french:
 latria_sexual_frustration_flavor.1001.t: "Une longue nuit derrière le rideau"
 latria_sexual_frustration_flavor.1001.desc.female: "En chemise de nuit, je m’assieds près de la fenêtre, une lettre encore close sur les genoux. La lune passe entre les rideaux et éclaire les traces laissées par mes doigts sur les plis. La personne qui l’a écrite est partie depuis longtemps. Je tire pourtant cette lettre du fond du coffret, l’y remets, puis la reprends.\n\nJe repense à notre dernière rencontre. Une phrase était restée en suspens, comme si une autre devait suivre, mais déjà une manche se dérobait. Je n’avais fait qu’acquiescer, sans trouver un mot pour retenir cette personne. À cette heure de la nuit, cette phrase inachevée me revient plus distinctement que toute la lettre.\n\nLe vent remue le rideau et fait frémir le papier. Je pose les doigts sur le sceau de cire, sans le briser ni ranger la lettre."
 latria_sexual_frustration_flavor.1001.desc.male: "En chemise de nuit, je m’assieds près de la fenêtre, une lettre encore close sur les genoux. La lune passe entre les rideaux et éclaire cette écriture familière sur le pli. La personne qui l’a tracée est partie depuis longtemps ; je garde pourtant sa lettre sous mes livres de comptes.\n\nJe repense au regard qui m’avait été adressé au moment du départ, comme dans l’attente d’une réponse. J’avais encore des affaires en cours et j’avais simplement remis notre conversation à un autre jour. Ce jour est venu trop tard. Ce regard, lui, ne m’a pas quitté.\n\nDehors, la garde annonce une nouvelle heure. Je retourne la lettre, puis la retourne encore. Le sceau demeure intact."
 latria_sexual_frustration_flavor.1001.desc: "À mesure que la nuit avance, mes préoccupations laissées en suspens me reviennent.\n\nJe prends la lettre, examine le sceau, puis la repose sur mes genoux. Il n’y a personne dans la pièce ; même le crépitement de la mèche s’entend nettement. J’essaie de penser aux affaires du lendemain, mais mes pensées reviennent toujours au même point.\n\nLe rideau remue. La lettre est encore là ; la personne qui l’a écrite ne l’est plus."
 latria_sexual_frustration_flavor.1001.a: "La lire jusqu’au bout et penser à la personne qui l’a écrite."
 latria_sexual_frustration_flavor.1001.b: "Enfermer la lettre et étouffer cette pensée."
 latria_sexual_frustration_flavor.1001.c: "Prendre une feuille vierge et en faire un poème."

 latria_sexual_frustration_flavor.1002.t: "Les épices du festin"
 latria_sexual_frustration_flavor.1002.desc.accepted: "Les épices du festin couvrent l’odeur du vin. Les musiciens en sont à leur troisième air, et certains convives se tiennent toujours tout près pour parler. Ici, personne ne juge cette familiarité inconvenante : les rires passent, les coupes continuent de circuler.\n\nPour ma part, j’examine chaque regard. Quelqu’un lève sa coupe vers moi ; je réponds au salut, tout en cherchant encore ce visage absent. À côté de moi, on fait une plaisanterie. Mon rire vient avec un instant de retard.\n\nQuand un serviteur me ressert, j’ai presque oublié la coupe que je tiens. La vapeur chargée d’épices me parvient, sans combler ce qui me manque."
 latria_sexual_frustration_flavor.1002.desc.strict: "Les épices réchauffent le festin. Chaque éclat de rire me rappelle pourtant combien les usages surveillent le moindre écart. La personne à mes côtés se penche pour me parler ; aussitôt, je redresse ma coupe, comme si ce geste pouvait garantir ma bonne tenue.\n\nQuelqu’un évoque une vieille histoire, puis s’interrompt au milieu d’une phrase. La conversation passe aussitôt aux domaines et aux récoltes. J’acquiesce avec les autres, mais je prête encore l’oreille aux mots qui n’ont pas été prononcés.\n\nQuand un serviteur me ressert, j’ai presque oublié la coupe que je tiens. Il faut que le vin atteigne le bord pour que je la repose."
 latria_sexual_frustration_flavor.1002.desc: "Le festin est bruyant, mais la même préoccupation détourne sans cesse mon attention.\n\nLa musique, les coupes et les conversations m’entourent ; je ne parviens pourtant à saisir aucune phrase entière. On me demande si je veux encore du vin. Je réponds sans même savoir ce que j’accepte.\n\nAu changement d’air, je m’aperçois que je fixe la porte de la salle depuis un bon moment. Elle s’est ouverte deux fois. Aucune des personnes entrées n’était celle que j’espérais voir."
 latria_sexual_frustration_flavor.1002.a: "Me joindre à la conversation avec quelques mots tendres."
 latria_sexual_frustration_flavor.1002.b: "Baisser les yeux, remercier l’hôte et prendre congé."
 latria_sexual_frustration_flavor.1002.c: "Demander encore un air aux musiciens avant de partir."
 latria_sexual_frustration_flavor.1002.d: "Rassembler les convives à une même table et parler toute la soirée."

 latria_sexual_frustration_flavor.1003.t: "Un sermon au jardin"
 latria_sexual_frustration_flavor.1003.desc.favors: "Sur un banc de pierre du jardin, le prédicateur explique que les plaisirs de la chair ne contreviennent pas à notre foi. Le vent soulève le coin d’une page ; il le retient d’un doigt et poursuit tranquillement.\n\nCes paroles devraient me réconforter. Pourtant, pendant qu’il parle, je repense à une plaisanterie entendue avant un départ, puis à ce regard auquel je n’avais pas su répondre. Les paroles sacrées passent sans me retenir ; cette autre phrase demeure.\n\nLe prédicateur me demande si j’ai compris. J’acquiesce, mais j’ai déjà perdu la page où nous en étions."
 latria_sexual_frustration_flavor.1003.desc.condemns: "Le prédicateur parle de retenue et de chasteté. J’entends distinctement chaque phrase. Le jardin est si calme que le bruissement des feuilles semble marquer ses pauses. Je garde les mains sur les genoux et une posture irréprochable, mais mon esprit est loin du livre.\n\nJe repense à ces heures de la nuit passée où je ne trouvais pas vraiment le sommeil. Personne n’était venu, personne n’avait rien dit ; le désir était simplement revenu de lui-même. Je fixe le texte sacré sans parvenir à assembler les mots.\n\nLe prédicateur tourne une page. Je baisse les yeux à mon tour, sans savoir où il en est dans sa lecture."
 latria_sexual_frustration_flavor.1003.desc: "J’écoute le sermon jusqu’au bout dans le jardin. Le vent passe sur les pages, sans apaiser mes pensées.\n\nLe prédicateur s’est déjà levé pour accueillir d’autres personnes. Je reste sur le banc, un doigt sur la page, les yeux tournés vers le bout de l’allée de pierre. Il n’y a personne à cet endroit ; je le contemple tout de même un moment.\n\nQuand je reviens à ma lecture, le vent a déjà tourné plusieurs pages."
 latria_sexual_frustration_flavor.1003.a: "Fermer le livre et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1003.b: "Écarter ces pensées et me joindre à la récitation."
 latria_sexual_frustration_flavor.1003.c: "Demander au prédicateur d’expliquer chaque passage."

 latria_sexual_frustration_flavor.1004.t: "Un faucon agité"
 latria_sexual_frustration_flavor.1004.desc.lustful: "Le faucon bat des ailes sur mon poing, le regard fixé sur les pigeons au loin. Les lanières qui retiennent ses pattes l’agitent ; chaque battement déplace l’air. Je le retiens, mais il continue de guetter la clairière.\n\nJe connais bien cette impatience. Les chasseurs attendent mes ordres à la lisière, et les chevaux eux-mêmes commencent à piétiner. Pour ma part, je pense à tout autre chose, au point d’oublier le sifflet dans ma main. Ces pensées restent confuses, mais elles ne me laissent aucun répit.\n\nLe faucon se débat encore. Je m’aperçois seulement alors que je crispe trop la main dans mon gant."
 latria_sexual_frustration_flavor.1004.desc.chaste: "Le faucon change nerveusement d’appui sur mon poing. Je m’efforce de suivre le bruit des rênes et les sifflements, de garder les yeux sur la lisière. Les chasseurs se sont déjà dispersés ; ils n’attendent plus que mon signal.\n\nMes pensées sont pourtant plus difficiles à contenir que cet oiseau. Je compte mes respirations, les pas des chevaux, les feuilles des arbres. À force de compter, je reviens encore à la même personne. Je sais bien qu’elle ne se trouve pas sur ces terres de chasse. J’y pense tout de même.\n\nLe faucon incline la tête vers moi, comme dans l’attente d’un ordre qu’il puisse comprendre. Pour l’instant, je ne sais lequel lui donner."
 latria_sexual_frustration_flavor.1004.desc: "Les chasseurs attendent que je rappelle le faucon, mais je n’arrive toujours pas à me concentrer.\n\nDès que le vent tombe dans les bois, je perçois plus nettement les battements d’ailes sur mon poing. Je lève la main, puis l’abaisse. Je m’apprête à lancer l’appel, mais aucun son ne sort.\n\nQuelqu’un crie mon nom au loin. Je réponds, tout en gardant les yeux sur la clairière."
 latria_sexual_frustration_flavor.1004.a: "Laisser la compagnie attendre pendant que je suis mes pensées."
 latria_sexual_frustration_flavor.1004.b: "Rassembler mes pensées et ranger le matériel de chasse."
 latria_sexual_frustration_flavor.1004.c: "Lisser lentement les plumes, puis tenter un nouveau rappel."

 latria_sexual_frustration_flavor.1005.t: "Entre deux conseils"
 latria_sexual_frustration_flavor.1005.desc.emperor: "Les seigneurs ont quitté leurs sièges ; les serviteurs rangent encore les cartes et les sceaux. Je reste sans compagnie au bout de la longue table, une vieille lettre auprès des documents inachevés. L’odeur de l’encre à sceller persiste.\n\nTout à l’heure, ils se disputaient au sujet des frontières et des impôts. J’ai approuvé certaines propositions, opposé quelques objections, donnant l’impression d’avoir tout suivi. En vérité, pendant un moment, je n’ai regardé que le coin de cette lettre qui dépassait des documents.\n\nUn serviteur me demande s’il doit débarrasser la table. Je pose la main sur la pile de papiers sans répondre tout de suite."
 latria_sexual_frustration_flavor.1005.desc.adventurer: "Mes compagnons ont choisi le prochain gué, mais la carte couvre encore la table. Je rapproche une vieille lettre de la lampe et constate que je n’arrive, une fois de plus, à rien retenir de l’itinéraire.\n\nDehors, on range les harnais dans un cliquetis de boucles. J’ai parcouru trois fois la portion du trajet qu’il me revient de confirmer. Je ne retiens pourtant qu’un ancien nom de lieu inscrit dans la lettre. Nous n’y passerons pas demain.\n\nUn compagnon m’attend sur le seuil. Je recouvre la lettre, sans en retirer les doigts."
 latria_sexual_frustration_flavor.1005.desc.clergy: "La réunion est terminée ; les livres de comptes et les textes sacrés restent ouverts sur la table. Je tire une vieille lettre d’entre les pages, et mes pensées reprennent leur agitation familière.\n\nPendant la journée, j’ai mis en ordre les dons, les réparations et les fêtes à venir. Maintenant que je n’ai plus de compagnie, tous ces chiffres s’effacent. Le livre a laissé sa marque sur le papier de la lettre, dont les coins s’effilochent. Je reconnais pourtant cette ligne au premier regard.\n\nDes pas résonnent dans la galerie. Je glisse de nouveau la lettre dans le livre, à la même page."
 latria_sexual_frustration_flavor.1005.desc.ruler: "Le conseil s’est dispersé ; documents et cire à sceller encombrent encore la table. Je lisse ma manche, mais la vieille lettre près de moi retient davantage mon attention que les rapports.\n\nLe résumé laissé par le secrétaire est parfaitement clair. Je le prends, sans même finir de lire le premier nom avant que mes yeux ne reviennent à la lettre. Elle n’a rien à faire sur cette table. C’est pourtant moi qui l’y ai glissée ce matin.\n\nDerrière la porte, on attend mes prochains ordres. Je fais dire de patienter encore."
 latria_sexual_frustration_flavor.1005.desc: "Les affaires ne manquent pas, mais une vieille lettre m’empêche de m’y consacrer.\n\nJ’empile les documents par ordre d’importance, les mélange, puis les range une nouvelle fois. La lettre reste toujours au-dessus. Le niveau d’huile baisse dans la lampe ; je n’ai encore annoté aucune page.\n\nQuelqu’un toussote derrière la porte. Je retire enfin ma main de la lettre."
 latria_sexual_frustration_flavor.1005.a: "Écarter le travail et relire la vieille lettre."
 latria_sexual_frustration_flavor.1005.b: "Ranger la lettre et reprendre mes devoirs."
 latria_sexual_frustration_flavor.1005.c: "Organiser le travail restant et m’accorder un bref repos."
 latria_sexual_frustration_flavor.1005.d: "Trier les tâches et les accomplir une à une."

 latria_sexual_frustration_flavor.1006.t: "Une vieille lettre à la lueur des bougies"
 latria_sexual_frustration_flavor.1006.desc.female: "En chemise de nuit, je m’assieds sous la lampe, les doigts sur le pli d’une vieille lettre. Elle ne contient aucune promesse, seulement quelques salutations ordinaires. Une grande partie de la fin est restée vierge, comme si la plume s’était soudain arrêtée.\n\nJe contemple longtemps cet espace blanc. À la réception de la lettre, je n’y avais rien vu de particulier. Ce soir, il me pèse davantage que les mots écrits. La mèche crépite et fait danser une ombre sur le papier.\n\nLe lien de ma chemise s’est desserré ; je ne le renoue pas. La lettre reste ouverte, et la nuit est encore longue."
 latria_sexual_frustration_flavor.1006.desc.male: "En chemise de nuit, je m’assieds au bord du lit. L’écriture de la vieille lettre me rappelle une affection restée sans réponse. Le papier s’est assoupli, presque fendu le long des plis ; je l’étale encore avec soin.\n\nLa lettre parle du temps qu’il faisait sur la route et d’un incident sans importance. Je me rappelle surtout le jour de son arrivée : je me tenais dans la galerie, j’avais voulu courir au-dehors, mais quelqu’un m’avait retenu. Plus tard, j’avais rangé la lettre dans un coffret. La personne dont je l’attendais n’est jamais revenue.\n\nLa mèche a raccourci. Je tourne le papier pour mieux l’éclairer ; les mots sont toujours les mêmes."
 latria_sexual_frustration_flavor.1006.desc: "La nuit est paisible, mais les mots de la vieille lettre restent longtemps devant mes yeux.\n\nJe voulais seulement y jeter un regard avant de dormir. Une fois la lampe allumée, ces quelques lignes retiennent toute mon attention. À mi-chemin, je recommence depuis le début, comme si j’allais y découvrir un sens qui m’avait échappé autrefois.\n\nLe lit est prêt. Je ne me lève toujours pas, et mes doigts ont laissé une nouvelle marque sur le bord du papier."
 latria_sexual_frustration_flavor.1006.a: "Lire la lettre jusqu’au bout."
 latria_sexual_frustration_flavor.1006.b: "Ranger la lettre, souffler la bougie et chercher le sommeil."

 latria_sexual_frustration_flavor.1007.t: "Avant la fin du festin"
 latria_sexual_frustration_flavor.1007.desc.accepted: "Au milieu des plaisanteries, quelqu’un évoque un amour ancien. Personne ne s’en offense. Les coupes s’entrechoquent et les rires suivent, comme s’il s’agissait d’une conversation sur le temps.\n\nJe lève ma coupe avec les autres, mais mes yeux reviennent plusieurs fois à une place vide. On en a déjà retiré la vaisselle ; il ne reste qu’un pan de nappe bien lisse. Je sais qui j’attends. Je sais aussi que cette personne ne viendra pas ce soir.\n\nÀ côté de moi, on me demande ce que je regarde. Je secoue la tête et oublie de boire."
 latria_sexual_frustration_flavor.1007.desc.strict: "À table, on raconte une liaison secrète en guise d’avertissement, puis chacun se met à parler de réputation et de convenances. La personne qui raconte baisse la voix. Ses voisins l’entendent tout de même et ne rient qu’avec précaution.\n\nJe baisse les yeux pour arranger ma manche, sans prendre part à la conversation. Cette histoire ne me concerne pas, mais je la reçois comme un reproche personnel. À l’abri des regards, mes doigts font tourner le pied de ma coupe, encore et encore.\n\nLe sujet change bientôt. Ma manche est parfaitement lisse ; mes pensées, elles, n’ont pas quitté cette histoire."
 latria_sexual_frustration_flavor.1007.desc: "La musique continue, mais mon esprit a quitté la table depuis longtemps.\n\nLes convives se passent les dernières coupes de vin. Je regarde leurs lèvres bouger ; je n’entends que cette phrase à laquelle je ne trouve aucune place dans la conversation. Quelqu’un me porte un toast. Je lève ma coupe et le vin y oscille.\n\nL’air touche à sa fin. Je reste à ma place, comme si je n’avais pas encore décidé de prendre part à ce festin."
 latria_sexual_frustration_flavor.1007.a: "Leur raconter mon propre désir, depuis le début."
 latria_sexual_frustration_flavor.1007.b: "Ravaler mes mots, remercier l’hôte et prendre congé."
 latria_sexual_frustration_flavor.1007.c: "Interroger plutôt la personne à mes côtés sur ses voyages."

 latria_sexual_frustration_flavor.1008.t: "Prière devant le sanctuaire"
 latria_sexual_frustration_flavor.1008.desc.favors: "La bougie du sanctuaire achève de se consumer. Je me rappelle que ma foi ne méprise pas les plaisirs de la chair. J’ai souvent entendu cette parole ; pour la première fois, il me semble devoir décider moi-même de ce que j’en ferai.\n\nLa cire a déjà formé une couche sur le support de cuivre. À mi-chemin de la prière, je continue de prononcer les mêmes mots, mais je pense à une main, au froissement d’un vêtement lorsque la personne qui le porte s’approche de moi. La figure du sanctuaire reste immobile. La flamme vacille.\n\nJe tente de ramener mes pensées à la prière. Avant même d’y parvenir, je relâche mon effort."
 latria_sexual_frustration_flavor.1008.desc.condemns: "Je récite à voix basse mon vœu de chasteté devant le sanctuaire, mais la prière familière s’interrompt plusieurs fois sur mes lèvres. La première phrase reste entière ; dès la deuxième, j’oublie des mots. Une pensée trouve juste assez de place dans ces silences pour s’insinuer.\n\nElle ne s’impose pas avec éclat. Elle me rappelle simplement qu’à mon retour, ce soir, le lit sera encore vide et que ma main ne trouvera personne. J’écarte les cheveux de mon front et reprends la première phrase.\n\nLa mèche crépite. Ma voix s’interrompt à nouveau."
 latria_sexual_frustration_flavor.1008.desc: "La prière est achevée, mais je reste près de la bougie.\n\nJ’ai récité tout ce que je devais réciter. Mes genoux s’engourdissent un peu ; je ne me relève pas. La flamme s’abaisse, puis se redresse avec peine, comme si elle attendait elle aussi une fin qui ne vient pas.\n\nJe regarde cette petite lumière. Ce qui m’occupe n’a pas disparu ; mes préoccupations ont seulement cédé un moment la place aux mots de la prière."
 latria_sexual_frustration_flavor.1008.a: "Écarter le vœu d’abstinence et reconnaître mon désir."
 latria_sexual_frustration_flavor.1008.b: "Contenir mes pensées et poursuivre la prière."
 latria_sexual_frustration_flavor.1008.c: "Lire un passage et le méditer avant de partir."
 latria_sexual_frustration_flavor.1008.d: "Garder la bougie allumée et réciter jusqu’à l’aube."

 latria_sexual_frustration_flavor.1009.t: "La requête non lue"
 latria_sexual_frustration_flavor.1009.desc.emperor: "Les requêtes couvrent la longue table, et les seigneurs attendent ma parole. J’ai lu deux fois la même ligne sans retenir le deuxième chiffre. La plume tourne entre mes doigts et laisse une goutte d’encre dans la marge.\n\nLeurs regards respectueux ont fait place à l’hésitation. L’un toussote, un autre va se verser de l’eau ; personne n’ose parler le premier. Je sais que je dois trancher, mais je revois cette demi-ligne laissée inachevée la nuit dernière.\n\nLe secrétaire rapproche le rapport suivant. Ma main repose encore sur le premier."
 latria_sexual_frustration_flavor.1009.desc.ruler: "Le conseil n’est pas terminé, mais je ne parviens à lire aucun des documents posés devant moi. Je referme le dossier, puis le rouvre. Les annotations dans la marge datent toujours de la veille.\n\nMes conseillers parlent du prix du grain et du cours de la rivière. Je saisis quelques mots, puis mes pensées s’égarent jusqu’à un nom. Ce nom ne figure pas dans le document. Je continue pourtant de le chercher sur la page.\n\nQuelqu’un me demande si je souhaite suspendre la séance. Je relève la tête et m’aperçois que le silence règne depuis un moment."
 latria_sexual_frustration_flavor.1009.a: "Congédier le conseil et rester avec mes pensées."
 latria_sexual_frustration_flavor.1009.b: "Rassembler mes pensées et examiner chaque requête."
 latria_sexual_frustration_flavor.1009.c: "Mettre les décisions en ordre, puis les prononcer une à une."

 latria_sexual_frustration_flavor.1010.t: "Le retour de l’aigle"
 latria_sexual_frustration_flavor.1010.desc.lustful: "Le faucon décrit des cercles au-dessus des bois. Son ombre passe et repasse sur mon gant, sans qu’il se pose. Je lève le bras ; il se contente de tourner un peu plus haut.\n\nEn le regardant refuser de revenir, je sens combien je me lasse de réprimer chaque élan. Les chasseurs parlent à voix basse près des chevaux, persuadés que j’attends un changement de vent. J’attends en réalité de pouvoir donner un autre nom à mon agitation. Aucun ne convient.\n\nLe faucon pousse un cri bref et perçant, comme s’il ne voulait plus entendre le moindre ordre."
 latria_sexual_frustration_flavor.1010.desc.chaste: "Le faucon tourne encore au loin. Je serre mon gant et m’oblige à n’écouter que les appels des chasseurs, à ne regarder que la lisière et la direction du vent. La lanière devient moite dans ma main.\n\nJ’ai souvent fait preuve d’une telle retenue. Aujourd’hui, l’effort me coûte davantage. Chaque instant d’attente fait surgir une phrase que je ne devrais pas me permettre. Je me la murmure, puis m’interromps. Un cheval brise une branche morte sous son sabot ; le bruit me fait sursauter.\n\nLe faucon n’est toujours pas revenu. Ma main commence à me faire mal."
 latria_sexual_frustration_flavor.1010.desc: "Les chasseurs attendent de repartir, tandis que je contemple encore le ciel au-dessus des arbres.\n\nLe cor est accroché près de la selle. Je le touche sans le prendre. Le point noir décrit un cercle dans le ciel, puis un autre. Personne ne me presse, mais tout le monde attend.\n\nJe baisse enfin les yeux. Je n’ai même pas remarqué dans quelle direction le faucon s’est éloigné."
 latria_sexual_frustration_flavor.1010.a: "Faire attendre les chasseurs tandis que mes pensées suivent l’aigle."
 latria_sexual_frustration_flavor.1010.b: "Sonner le retour et inspecter le matériel de chasse."
 latria_sexual_frustration_flavor.1010.c: "Marcher le long du bois avant de rejoindre la compagnie."

 nick_latria_the_unquiet: "l’Inquiet"
 nick_latria_the_unquiet_desc: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] fait consigner [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] désirs charnels dans la chronique, dont les copies circulent encore partout."
 latria_flavor_focus: "Résolution affermie"
 latria_flavor_focus_desc: "Ce personnage a tourné son attention vers les Écritures et ses devoirs quotidiens."
 latria_flavor_remorse: "Remords persistants"
 latria_flavor_remorse_desc: "Un bref réconfort a laissé une conscience troublée."
 latria_flavor_sullied: "Réputation ternie"
 latria_flavor_sullied_desc: "Des rumeurs ont nui au rang et aux amitiés de ce personnage."
 latria_flavor_broken_sleep: "Manque de sommeil"
 latria_flavor_broken_sleep_desc: "Le manque de sommeil rend ce personnage distrait et vite fatigué."
 latria_flavor_vagabond_focus: "Concentration du voyageur"
 latria_flavor_vagabond_focus_desc: "Les travaux du voyage apaisent brièvement les pensées agitées."
 latria_flavor_public_disgrace: "Déshonneur public"
 latria_flavor_public_disgrace_desc: "Les rumeurs d’un écart public ont nui au rang et aux amitiés de ce personnage."
 latria_flavor_hunting_focus: "Attention portée à la chasse"
 latria_flavor_hunting_focus_desc: "Ce personnage se concentre sur le pistage, la fauconnerie et l’équitation."
 latria_flavor_warm_company: "Agréable compagnie"
