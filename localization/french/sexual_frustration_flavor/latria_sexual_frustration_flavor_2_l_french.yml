l_french:
 latria_sexual_frustration_flavor.1101.t: "En éveil sous le baldaquin"
 latria_sexual_frustration_flavor.1101.desc.female: "Je m’éveille dans le lit, ma chemise de nuit tombée à son pied. Personne d’autre n’est dans la chambre ; le calme ne fait qu’aviver ce désir resté sans réponse."
 latria_sexual_frustration_flavor.1101.desc.male: "Je m’éveille dans le lit, ma chemise de nuit tombée à son pied. Le monde au-delà de la fenêtre est silencieux, mais le sommeil ne retient plus mes pensées."
 latria_sexual_frustration_flavor.1101.desc: "Le baldaquin pend bas. La nuit est longue, et mes pensées refusent de s’apaiser."
 latria_sexual_frustration_flavor.1101.a: "Fermer les yeux et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1101.b: "Écarter cette pensée, tirer les rideaux et me rendormir."

 latria_sexual_frustration_flavor.1102.t: "Regards entre deux danses"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Plusieurs danses passent, et les visages autour de moi changent. Personne ne s’offusque d’un tour trop rapproché, mais je garde le souvenir de ce bref échange de regards."
 latria_sexual_frustration_flavor.1102.desc.strict: "Plus la danse nous rapproche, plus les rires ressemblent à des murmures. Je tourne les yeux vers les musiciens, de peur qu’on devine mes pensées."
 latria_sexual_frustration_flavor.1102.desc: "La musique accélère, mais la danse n’emporte pas mes pensées."
 latria_sexual_frustration_flavor.1102.a: "Demander une autre danse et me rapprocher un peu."
 latria_sexual_frustration_flavor.1102.b: "Remercier ma compagnie d’une révérence et me retirer au bord de la salle."

 latria_sexual_frustration_flavor.1103.t: "À la porte du guide"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mon guide spirituel dit que nier le désir n’est pas le seul chemin de la dévotion. Je voudrais en demander davantage, mais des pas se sont arrêtés devant la porte."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mon guide spirituel me rappelle que la chasteté compte aussi loin des regards. Je baisse la tête, espérant qu’il n’y aura pas d’autres questions."
 latria_sexual_frustration_flavor.1103.desc: "La pièce est sombre. Je pèse mes mots avant de parler à mon guide spirituel."
 latria_sexual_frustration_flavor.1103.a: "Reconnaître mon désir et cesser de le cacher."
 latria_sexual_frustration_flavor.1103.b: "Ne demander conseil que sur mes devoirs présents et taire le reste."

 latria_sexual_frustration_flavor.1104.t: "L’aigle ne revient pas"
 latria_sexual_frustration_flavor.1104.desc.lustful: "L’aigle tourne au-dessus du champ et refuse de revenir sur mon gant. J’envie sa liberté de suivre son désir sans avoir à s’expliquer."
 latria_sexual_frustration_flavor.1104.desc.chaste: "L’aigle continue de tourner. Mes domestiques me demandent si je compte décocher une autre flèche. Je leur dis d’attendre, comme si la patience pouvait tout régler."
 latria_sexual_frustration_flavor.1104.desc: "L’aigle ne revient pas, et les chasseurs attendent mon ordre."
 latria_sexual_frustration_flavor.1104.a: "Laisser l’aigle tourner tandis que mes pensées vagabondent."
 latria_sexual_frustration_flavor.1104.b: "Rassembler mes pensées et rappeler l’aigle au camp."

 latria_sexual_frustration_flavor.1105.t: "Des bougies et une couronne"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Un domestique emporte la couronne hors de ma chambre, laissant des décrets inachevés près des bougies. Je resserre ma chemise de nuit et tire la lettre non envoyée d’entre les documents."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Je passe ma chemise de nuit dans la chambre de l’auberge. Mes compagnons se sont couchés, mais la lettre non envoyée près de mon paquetage me tient en éveil."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Je plie mes vêtements liturgiques et m’assieds près du lit en chemise de nuit. La lettre non envoyée est sous mes Écritures ; une fois de plus, je la sors."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Mes domestiques rangent mes habits de cérémonie. En chemise de nuit sous la lampe, je déplie la lettre non envoyée avant de m’occuper des documents inachevés."
 latria_sexual_frustration_flavor.1105.desc: "Les bougies se consument. Une lettre non envoyée reste à portée de main."
 latria_sexual_frustration_flavor.1105.a: "Confier la lettre à un messager."
 latria_sexual_frustration_flavor.1105.b: "La détruire, écarter cette pensée et souffler la bougie pour dormir."

 latria_sexual_frustration_flavor.1106.t: "Agitation à la lueur des bougies"
 latria_sexual_frustration_flavor.1106.desc.female: "En chemise de nuit, je m’assieds près du lit tandis que la lueur de la bougie danse sur la fenêtre. Il est tard, mais le désir resté sans réponse ne m’a pas quitté."
 latria_sexual_frustration_flavor.1106.desc.male: "En vêtements de nuit, je m’assieds près du lit. La garde de nuit a traversé deux fois la cour, et mes pensées ne s’apaisent toujours pas."
 latria_sexual_frustration_flavor.1106.desc: "La bougie se consume, mais le sommeil ne vient pas sous le baldaquin."
 latria_sexual_frustration_flavor.1106.a: "Laisser mes pensées s’attarder sur cette affection."
 latria_sexual_frustration_flavor.1106.b: "Ne plus y songer ; souffler la bougie et chercher le sommeil."


 latria_sexual_frustration_flavor.1107.t: "Une danse en retour"
 latria_sexual_frustration_flavor.1107.desc.accepted: "On m’invite à une autre danse, et la compagnie n’y voit que de la courtoisie. Je me souviens de la pensée qui m’a traversé lorsque cette main s’est attardée."
 latria_sexual_frustration_flavor.1107.desc.strict: "On m’invite à une autre danse, et plusieurs visages se tournent vers nous. Avant que je puisse répondre, quelqu’un se penche pour murmurer à l’oreille d’un voisin."
 latria_sexual_frustration_flavor.1107.desc: "Les musiciens commencent une autre danse, mais je ne me lève pas."
 latria_sexual_frustration_flavor.1107.a: "Accepter la danse et me rapprocher."
 latria_sexual_frustration_flavor.1107.b: "Décliner d’une révérence et souhaiter une agréable danse."

 latria_sexual_frustration_flavor.1108.t: "Prière avant le sommeil"
 latria_sexual_frustration_flavor.1108.desc.favors: "En chemise de nuit, je prie près du lit. Ma foi permet les plaisirs de la chair, mais cette urgence en moi ne s’apaise pas."
 latria_sexual_frustration_flavor.1108.desc.condemns: "En chemise de nuit, je m’agenouille près du lit et répète mon vœu de chasteté. À chaque ligne, la voix intérieure devient plus difficile à ignorer."
 latria_sexual_frustration_flavor.1108.desc: "La bougie près du lit vacille. La prière se poursuit."
 latria_sexual_frustration_flavor.1108.a: "Écarter le vœu de chasteté et reconnaître mon désir."
 latria_sexual_frustration_flavor.1108.b: "Contenir mes pensées et poursuivre la prière."

 latria_sexual_frustration_flavor.1109.t: "Un conseil inachevé"
 latria_sexual_frustration_flavor.1109.desc: "Mes conseillers ont proposé plusieurs solutions, mais je n’ai pas encore choisi. Mes pensées s’écartent de l’affaire qui nous occupe, et même mon silence s’éternise."
 latria_sexual_frustration_flavor.1109.a: "Mettre fin au conseil et rester avec mes pensées."
 latria_sexual_frustration_flavor.1109.b: "Réprimer cette pensée et demander au greffier de poursuivre."
 latria_sexual_frustration_flavor.1110.t: "Une chambre après minuit"
 latria_sexual_frustration_flavor.1110.desc.clergy: "En chemise de nuit, je regagne ma petite chambre. La prière nocturne est terminée et la bougie se consume, mais la lettre non envoyée reste ouverte sur la table."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Seules quelques lampes brûlent encore à l’auberge. En chemise de nuit au bord du lit, je pense toujours à la lettre que je n’ai jamais envoyée."
 latria_sexual_frustration_flavor.1110.desc: "Les bruits derrière la porte s’éloignent. Je reste près du lit, à attendre."
 latria_sexual_frustration_flavor.1110.a: "Achever la lettre et la faire envoyer à l’aube."
 latria_sexual_frustration_flavor.1110.b: "Barrer la porte, écarter cette pensée et me coucher."

 latria_sexual_frustration_flavor.1101.c: "Passer une robe, m’asseoir et laisser ma respiration s’apaiser."
 latria_sexual_frustration_flavor.1102.c: "Parler de leurs airs avec les musiciens."
 latria_sexual_frustration_flavor.1103.c: "Demander comment vivre avec ces sentiments."
 latria_sexual_frustration_flavor.1103.d: "Commencer par la lettre non envoyée et ne rien cacher."
 latria_sexual_frustration_flavor.1104.c: "Demander aux autres d’attendre pendant que je rappelle patiemment l’aigle."
 latria_sexual_frustration_flavor.1105.c: "Ranger la lettre dans son coffret et préparer le travail du lendemain."
 latria_sexual_frustration_flavor.1107.c: "Proposer de nous asseoir pour parler d’autre chose."
 latria_sexual_frustration_flavor.1107.d: "Inviter toute la table à une danse collective animée."
 latria_sexual_frustration_flavor.1108.c: "Achever lentement la prière, sans combattre chaque pensée."
 latria_sexual_frustration_flavor.1109.c: "Faire une courte pause et organiser les affaires restantes."
 latria_sexual_frustration_flavor.1109.d: "Mettre les décisions urgentes en ordre et les régler ici."
 latria_sexual_frustration_flavor.1110.c: "Passer une robe et chercher une tasse de bouillon chaud."
