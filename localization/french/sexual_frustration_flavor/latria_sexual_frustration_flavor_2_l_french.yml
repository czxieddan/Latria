l_french:
 latria_sexual_frustration_flavor.1101.t: "En éveil sous le baldaquin"
 latria_sexual_frustration_flavor.1101.desc.female: "Je sors d’un sommeil léger. Ma chemise de nuit a glissé au pied du lit, et mes épaules comme mes genoux dépassent des rideaux. Il n’y a personne d’autre sous le baldaquin. J’ai moi-même repoussé et froissé la couverture ; un seul creux marque l’oreiller.\n\nJe ramène ma chemise sur moi. Le passage de l’étoffe n’apaise pas mon trouble. Dehors, la garde a déjà annoncé deux fois l’heure. Je veux me tourner pour me rendormir, mais je revois, les yeux fermés, cette personne qui m’a tourné le dos dans la journée. Un crochet tinte, comme si quelqu’un soulevait un coin du rideau. Personne ne vient.\n\nJe m’allonge sur le dos, sans savoir où poser les mains. La nuit est encore longue, mais le sommeil m’a quittée."
 latria_sexual_frustration_flavor.1101.desc.male: "Je sors d’un sommeil léger. Ma chemise de nuit a glissé au pied du lit. Tout est noir au-delà des rideaux ; seul un coup de tambour annonce l’heure au loin. À force de me retourner, j’ai roulé la couverture en boule.\n\nJe me redresse, puis me recouche. Mon agitation ne s’est pas dissipée. Je compte mes respirations ; à la septième, je repense à la proximité d’une personne venue me parler. Il ne s’était rien passé entre nous. Je me souviens pourtant trop bien de cette distance.\n\nLe vent soulève un coin du rideau, qui retombe aussitôt. L’autre côté du lit est toujours froid."
 latria_sexual_frustration_flavor.1101.desc: "Les rideaux du lit sont à demi tirés. La nuit est loin de finir, et mes pensées restent confuses.\n\nJe remonte la couverture, puis la repousse du pied. Près de l’oreiller, il n’y a ni lettre ni présence, seulement ma propre main. Ma paume est chaude ; je la pose sur la natte pour la rafraîchir.\n\nLa garde annonce encore une heure. Je ne dors toujours pas."
 latria_sexual_frustration_flavor.1101.a: "Fermer les yeux et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1101.b: "Écarter cette pensée, tirer les rideaux et me rendormir."

 latria_sexual_frustration_flavor.1102.t: "Regards entre deux danses"
 latria_sexual_frustration_flavor.1102.desc.accepted: "Trois airs se sont succédé, et les personnes autour de moi ont changé plusieurs fois. Personne ne s’offusque de quelques pas qui rapprochent les danseurs. Les musiciens ralentissent même la mesure pour laisser les conversations se poursuivre.\n\nJe garde pourtant le souvenir d’un instant précis. Une main est restée sur mon poignet un peu plus longtemps que ne l’exigeait la danse, et le regard qui accompagnait ce geste ne s’est pas aussitôt détourné. À la fin du morceau, la main s’est retirée, mais j’en sentais encore la chaleur. De retour à ma place, j’ai trouvé ma coupe pleine. Je n’y ai pas touché.\n\nL’air suivant a commencé. Je regarde l’espace libre sur le plancher, avec l’envie d’y retourner."
 latria_sexual_frustration_flavor.1102.desc.strict: "Plus la danse nous rapproche, plus les rires autour de nous ressemblent à des chuchotements. Je tourne les yeux vers les musiciens, tandis que l’autre main continue de guider la mienne. Le froissement de nos manches me parvient plus distinctement que le tambour.\n\nAu bord de la salle, des convives se penchent pour échanger quelques mots. Je ne sais s’ils parlent de moi ou d’autre chose. Dès que la musique s’arrête, je recule d’un demi-pas, si vite que je manque de trébucher. La personne devant moi me regarde sans poser de question.\n\nDe retour à ma place, je sens encore cette chaleur au poignet. Je le couvre de l’autre main, comme pour le soustraire aux regards."
 latria_sexual_frustration_flavor.1102.desc: "La musique s’accélère, mais la danse n’emporte pas mes préoccupations.\n\nJ’effectue deux tours sans me tromper de pas. Je ne cesse pourtant de mesurer la distance entre nous au son de la respiration qui se rapproche, puis s’éloigne. Au plus fort de l’air, la musique s’interrompt un instant. Aucun de nous ne parle.\n\nLes cordes reprennent. Je reste sur place, sans savoir comment achever cette danse."
 latria_sexual_frustration_flavor.1102.a: "Demander une autre danse et me rapprocher un peu."
 latria_sexual_frustration_flavor.1102.b: "Remercier ma compagnie d’une révérence et me retirer au bord de la salle."

 latria_sexual_frustration_flavor.1103.t: "À la porte du guide"
 latria_sexual_frustration_flavor.1103.desc.favors: "Mon guide spirituel m’explique que réprimer le désir n’est pas le seul chemin de la dévotion. La lampe projette nos deux ombres sur le mur. Il parle lentement, comme pour me laisser le temps de répondre.\n\nJe voudrais lui demander si l’on suit encore ce chemin lorsque l’on s’éveille sans compagnie, la nuit, sans savoir que faire de ses mains. Au moment de parler, j’entends des pas s’arrêter devant la porte. Nous nous taisons tous deux un instant. Les pas reprennent.\n\nMon guide me regarde, attendant la suite. Je ravale ma question et n’en laisse entendre qu’un début sans conclusion."
 latria_sexual_frustration_flavor.1103.desc.condemns: "Mon guide spirituel me rappelle que la chasteté ne compte pas seulement devant témoins. Il n’a pas haussé la voix ; la pièce me paraît pourtant soudain plus étroite. Je baisse la tête et acquiesce, les doigts crispés dans mes manches.\n\nIl me demande ce qui m’amène ce soir. Je regarde la lampe, la porte, le bout de mes chaussures ; je cherche partout sauf dans ses yeux. La vérité tiendrait en quelques mots. Je crains pourtant qu’une fois ces mots prononcés, il ne poursuive ses questions.\n\nQuelqu’un tousse derrière la porte. Je pousse un soupir de soulagement, aussitôt suivi de honte."
 latria_sexual_frustration_flavor.1103.desc: "La pièce est faiblement éclairée. Je cherche comment m’adresser à mon guide spirituel.\n\nJe devrais lui parler de mes devoirs ; c’est autre chose que je voudrais lui demander. Avant d’entrer, j’avais répété les deux conversations possibles. À présent, je n’en retrouve plus une seule phrase. Mon guide me sert de l’eau encore chaude.\n\nJe tiens le gobelet entre mes mains, son bord contre mes lèvres. Les mots ne viennent toujours pas."
 latria_sexual_frustration_flavor.1103.a: "Reconnaître mon désir et cesser de le cacher."
 latria_sexual_frustration_flavor.1103.b: "Ne demander conseil que sur mes devoirs présents et taire le reste."

 latria_sexual_frustration_flavor.1104.t: "L’aigle ne revient pas"
 latria_sexual_frustration_flavor.1104.desc.lustful: "L’aigle tourne au-dessus des terres de chasse sans revenir sur mon gant. J’ai levé le bras deux fois ; chaque fois, il a incliné les ailes pour monter plus haut. Le vent sort des bois, chargé d’herbe et de sueur de cheval.\n\nJ’en viens presque à l’envier. Il peut poursuivre sa route sans se justifier ni se retourner, sans faire passer son impatience pour de la patience devant tout le monde. Un serviteur me demande s’il faut ranger l’arc. Je secoue la tête, les yeux toujours sur le point noir. À force de le suivre, je n’y vois plus vraiment un aigle, mais une autre présence qui refuse de revenir.\n\nMon bras me fait mal. Je ne l’abaisse toujours pas."
 latria_sexual_frustration_flavor.1104.desc.chaste: "L’aigle continue de tourner sans descendre. Les serviteurs m’ont demandé plusieurs fois s’ils doivent ranger l’arc. Je réponds seulement d’attendre encore, comme si mon trouble pouvait s’apaiser de lui-même avec un peu de temps.\n\nLes chasseurs ont mis pied à terre et se passent une outre à l’ombre des arbres. Ils ne me pressent pas, mais le tintement des harnais semble le faire pour eux. Je fixe le ciel en comptant à voix basse. Bientôt, c’est encore le même nom que je prononce.\n\nL’aigle crie, sans se poser. Je passe très lentement mon gant à l’autre main."
 latria_sexual_frustration_flavor.1104.desc: "L’aigle tarde à revenir, et tous les chasseurs attendent mon ordre.\n\nLe sifflet a laissé une marque dans ma paume. Je le porte à mes lèvres, puis l’abaisse. Là-haut, les cercles se resserrent ; personne ne sait si l’oiseau va se décider à descendre.\n\nQuelqu’un demande à voix basse si nous repartons. Je réponds sans savoir moi-même si je viens d’ordonner le départ ou de prolonger l’attente."
 latria_sexual_frustration_flavor.1104.a: "Laisser l’aigle tourner tandis que mes pensées vagabondent."
 latria_sexual_frustration_flavor.1104.b: "Rassembler mes pensées et rappeler l’aigle au camp."

 latria_sexual_frustration_flavor.1105.t: "Des bougies et une couronne"
 latria_sexual_frustration_flavor.1105.desc.emperor: "Un serviteur emporte la couronne de cérémonie hors de ma chambre. Près du chandelier restent plusieurs décrets à approuver. Je rajuste ma chemise de nuit et prends place devant eux. Je devrais commencer par le premier ; ma main tire pourtant des papiers la lettre que je n’ai pas envoyée.\n\nElle ne contient qu’une formule d’adresse. J’ai essayé trois fois de la poursuivre aujourd’hui, m’arrêtant chaque fois au même endroit. La couronne, dans son coffret, retenait encore une lueur, comme pour me rappeler mes devoirs envers l’empire. Je lisse le papier. Une fois les plis effacés, je ne sais toujours pas quelle phrase écrire.\n\nUne goutte de cire tombe dans le plateau de cuivre avec un bruit presque imperceptible."
 latria_sexual_frustration_flavor.1105.desc.adventurer: "Dans la chambre de l’auberge, je rajuste ma chemise de nuit. Mes compagnons se sont couchés ; j’entends encore quelqu’un ronfler dans la pièce voisine. Près de mon paquetage, la lampe éclaire la lettre que je n’ai pas envoyée. Ses coins se recourbent.\n\nNous devons repartir demain. Les provisions, les chevaux et le passage au gué sont réglés ; seule cette lettre reste sans destination certaine. Je la déplie. Ses phrases me paraissent encore moins propres à être envoyées que ce matin. L’une d’elles est trop franche. Je laisse un doigt posé sur cette ligne.\n\nAu rez-de-chaussée, quelqu’un ferme une porte. Je repose la lettre sur mon paquetage, sans vraiment l’y retenir."
 latria_sexual_frustration_flavor.1105.desc.clergy: "Je plie mes vêtements rituels et retourne au bord du lit en chemise de nuit. La lettre que je n’ai pas envoyée se trouve sous le livre sacré. Un coin en dépasse, comme si elle cherchait à attirer mon attention.\n\nJe la tire de dessous le livre, qui se referme avec un bruit sourd. Aucun mot ne contredit mes vœux, mais chaque phrase revient à la même personne. Dès la troisième ligne, je sais que je ne devrais pas lire cela à cette heure.\n\nLa flamme de la bougie vacille. Je ne remets pas la lettre à sa place."
 latria_sexual_frustration_flavor.1105.desc.ruler: "Les serviteurs rangent mes habits de cérémonie. En chemise de nuit, je m’assieds sous la lampe. Je n’ai pas encore fini d’examiner les documents sur la table, mais je déplie d’abord la lettre qui attend toujours son envoi.\n\nDehors, les pas réguliers de la relève passent devant la chambre. À l’intérieur, seul le papier se fait entendre. J’ajoute un mot dans l’espace blanc, l’examine, puis le recouvre d’encre. La tache attire davantage le regard que le mot.\n\nJe pose ma plume. Les documents n’ont pas bougé ; aucun ne porte encore mon sceau."
 latria_sexual_frustration_flavor.1105.desc: "La lumière faiblit. Une lettre que je n’ai pas envoyée reste à portée de main.\n\nJe sais bien que la personne à qui je la destine ne pourra pas la lire ce soir. Malgré cela, j’écris encore une fois la formule d’adresse, plus lentement que dans la journée. L’encre sèche et ne laisse qu’une trace pâle sur le papier.\n\nLa mèche crépite. Je relève la tête et m’aperçois que je suis là depuis longtemps."
 latria_sexual_frustration_flavor.1105.a: "Confier la lettre à un messager."
 latria_sexual_frustration_flavor.1105.b: "La détruire, écarter cette pensée et souffler la bougie pour dormir."

 latria_sexual_frustration_flavor.1106.t: "Agitation à la lueur des bougies"
 latria_sexual_frustration_flavor.1106.desc.female: "En chemise de nuit, je m’assieds au bord du lit. La bougie projette mon ombre sur le papier de la fenêtre. Elle remue doucement au rythme de ma respiration et paraît plus calme que moi. La nuit est avancée ; ce désir sans réponse demeure, silencieux et obstiné.\n\nJe rejette mes cheveux derrière mon épaule, puis les ramène. Mes doigts touchent mon cou et je suspends le geste. Il n’y a personne, mais cette hésitation suffit à me faire rougir. Je repense à une phrase entendue aujourd’hui, à moitié sérieuse, à moitié plaisante. J’en avais ri, sans parvenir ensuite à l’oublier.\n\nUne nouvelle couche de cire s’est accumulée. Je n’ai toujours pas quitté le bord du lit, ni tiré les rideaux."
 latria_sexual_frustration_flavor.1106.desc.male: "En chemise de nuit, je m’assieds au bord du lit. La garde est déjà passée deux fois sous la fenêtre. Lors du premier passage, j’espérais encore trouver le sommeil. Au second, j’ai renoncé.\n\nJe n’ai ni lettre ni vin entre les mains. Je pose simplement mes paumes sur mes genoux, puis les retourne lorsqu’elles se réchauffent. La voix qui m’occupe n’est pas réellement dans la pièce. Je pourrais pourtant en reproduire chaque pause dans cette phrase. À la troisième répétition, je finis par trouver ma propre conduite déraisonnable.\n\nJe souffle sur la bougie sans l’éteindre. La flamme s’incline, puis se redresse."
 latria_sexual_frustration_flavor.1106.desc: "La bougie se consume, mais le sommeil ne vient pas sous le baldaquin.\n\nJe m’allonge et entends mon cœur battre plus fort que d’ordinaire. Je me tourne ; le bruit reste. Tout est à sa place dans la chambre : le gobelet, les chaussures, le vêtement soigneusement plié. Rien ne parvient à dissiper cette agitation.\n\nJe me redresse encore. La lumière brûle toujours, mais une grande partie de la nuit s’est écoulée."
 latria_sexual_frustration_flavor.1106.a: "Laisser mes pensées s’attarder sur cette affection."
 latria_sexual_frustration_flavor.1106.b: "Ne plus y songer ; souffler la bougie et chercher le sommeil."


 latria_sexual_frustration_flavor.1107.t: "Une danse en retour"
 latria_sexual_frustration_flavor.1107.desc.accepted: "On m’invite à une nouvelle danse. Les autres convives n’y voient qu’une courtoisie ordinaire. Les musiciens ont déjà posé l’archet sur les cordes et attendent mon assentiment.\n\nJe me souviens pourtant de cette main, tout à l’heure. Elle s’est attardée à ma taille assez brièvement pour que le pas de danse puisse l’expliquer, assez longtemps pour que je n’arrive pas à m’en convaincre. Je regarde le visage devant moi. Un regard me répond, accompagné d’un léger sourire, sans rien préciser.\n\nDes coupes s’entrechoquent à table. Malgré ce bruit, j’entends encore le oui que je n’ai pas prononcé."
 latria_sexual_frustration_flavor.1107.desc.strict: "On m’invite à une nouvelle danse, et plusieurs regards se tournent aussitôt vers nous. Je n’ai pas encore répondu que quelqu’un se penche pour chuchoter à l’oreille d’un voisin. Je n’entends pas leurs mots, mais tous deux continuent de nous regarder.\n\nLa main reste tendue devant moi, avec politesse, sans insistance. La mienne s’échauffe dans ma manche. Si je l’avance, il me sera plus difficile encore de prétendre que cette danse n’a rien de particulier. Si je refuse, on se souviendra aussi de mon refus.\n\nUn musicien toussote. Son archet attend toujours sur les cordes."
 latria_sexual_frustration_flavor.1107.desc: "Les musiciens commencent une nouvelle danse, mais je tarde à me lever.\n\nLes premières mesures sont déjà passées. Devant moi, la main reste tendue. La personne qui m’invite attend simplement, sans me presser. Je regarde cette main, puis mes propres doigts posés sur le bord de la table.\n\nDerrière moi, quelqu’un déplace une chaise. Le bruit me fait cligner des yeux ; je reste pourtant à ma place."
 latria_sexual_frustration_flavor.1107.a: "Accepter la danse et me rapprocher."
 latria_sexual_frustration_flavor.1107.b: "Décliner d’une révérence et souhaiter une agréable danse."

 latria_sexual_frustration_flavor.1108.t: "Prière avant le sommeil"
 latria_sexual_frustration_flavor.1108.desc.favors: "En chemise de nuit, je prie près du lit. Je connais bien les paroles qui permettent les plaisirs de la chair dans ma foi. Elles ne m’aident guère ce soir. Elles m’assurent que je n’ai pas à considérer le désir comme une faute, sans me dire que faire de cette agitation.\n\nLes genoux contre le lit, je prononce la prière tout en revoyant un regard échangé de trop près dans la journée. Ce regard n’avait rien entraîné. Je le décompose pourtant en une multitude d’instants que je reprends l’un après l’autre.\n\nÀ l’endroit où je devrais m’arrêter, je poursuis. Les phrases suivantes sont de moi et se succèdent sans ordre."
 latria_sexual_frustration_flavor.1108.desc.condemns: "En chemise de nuit, à genoux près du lit, je répète mon vœu de chasteté. À chaque phrase, une autre pensée se fait plus distincte : je n’aurai encore aucune compagnie cette nuit, les draps resteront froids, et mes mains ne trouveront que moi dans l’obscurité.\n\nJ’appuie le front contre le bois du lit. Sa fraîcheur me soulage un peu. Dès que je m’en écarte, mon agitation revient. Je reprends la première phrase à voix très basse, comme si je craignais que l’on m’entende dans la pièce voisine.\n\nIl n’y a personne à côté. Je continue pourtant de parler à voix basse."
 latria_sexual_frustration_flavor.1108.desc: "La bougie vacille près du lit, et ma prière n’en finit pas.\n\nJ’ai récité le passage que je connais. Le silence devrait suivre, mais je refuse de le laisser s’installer. Dès qu’il viendra, une autre préoccupation prendra sa place. J’ajoute quelques phrases dont je sais, sitôt prononcées, qu’elles n’appartiennent plus à une prière.\n\nLa flamme penche vers les rideaux. Je reste à genoux, le devant de ma chemise tout froissé."
 latria_sexual_frustration_flavor.1108.a: "Écarter le vœu de chasteté et reconnaître mon désir."
 latria_sexual_frustration_flavor.1108.b: "Contenir mes pensées et poursuivre la prière."

 latria_sexual_frustration_flavor.1109.t: "Un conseil inachevé"
 latria_sexual_frustration_flavor.1109.desc: "Mes conseillers ont présenté trois solutions, mais je n’ai toujours pas rendu ma décision. La première est la plus sûre, la deuxième la moins coûteuse, la troisième la plus conforme aux usages. Je les ai toutes entendues et accueillies d’un signe de tête, sans pouvoir en choisir aucune.\n\nLa plume du secrétaire reste suspendue. Quelqu’un rapproche de moi une coupe d’eau. J’y regarde mon reflet, puis mes pensées s’égarent vers une personne qui n’a rien à voir avec nos réserves de grain. Elle n’est pas dans cette pièce. Je retrouve pourtant chaque pause de sa voix.\n\nLe silence devient embarrassant. Je m’éclaircis la gorge, sans parvenir à former une phrase."
 latria_sexual_frustration_flavor.1109.a: "Mettre fin au conseil et rester avec mes pensées."
 latria_sexual_frustration_flavor.1109.b: "Réprimer cette pensée et demander au greffier de poursuivre."
 latria_sexual_frustration_flavor.1110.t: "Une chambre après minuit"
 latria_sexual_frustration_flavor.1110.desc.clergy: "En chemise de nuit, je regagne ma petite chambre. La prière nocturne est terminée, et la plupart des lampes de la galerie sont éteintes. La lettre que je n’ai pas envoyée reste ouverte sur la table, posée sur un collier de prière.\n\nJe devrais ranger les perles dans leur coffret, puis mettre la lettre de côté. Ma main s’arrête dès qu’elle touche le papier. Je connais déjà toutes les phrases par cœur ; je veux pourtant revoir la façon dont j’ai tracé ce nom. L’encre a bavé à un endroit, comme si ma main avait tremblé en l’écrivant.\n\nLe silence emplit la petite pièce. Je reste debout près de la table, le lien de ma chemise mal noué."
 latria_sexual_frustration_flavor.1110.desc.adventurer: "Il ne reste que quelques lampes allumées dans l’auberge. En chemise de nuit, je m’assieds au bord du lit. Mon paquetage est ficelé ; seule la lettre que je n’ai pas envoyée en dépasse encore.\n\nDans la pièce voisine, quelqu’un se retourne et fait grincer le lit. J’attends que le bruit cesse pour tirer la lettre. La poussière de la route en a sali les bords. Je souffle dessus sans la faire partir ; les phrases, elles, me semblent plus nettes. Celle que je n’aurais pas dû écrire se trouve précisément au milieu.\n\nJe replie la lettre, mais les plis ne coïncident plus avec leurs anciennes marques."
 latria_sexual_frustration_flavor.1110.desc: "Les bruits s’éloignent derrière la porte. Je reste près du lit, à attendre.\n\nPersonne ne m’a donné rendez-vous ce soir. J’ai tout de même laissé la lampe allumée et un vêtement à portée de main. Chaque passage de pas me fait relever la tête. Tous finissent par s’éloigner.\n\nLe niveau d’huile a baissé. L’autre côté du lit reste vide, et je ne me suis toujours pas couché."
 latria_sexual_frustration_flavor.1110.a: "Achever la lettre et la faire envoyer à l’aube."
 latria_sexual_frustration_flavor.1110.b: "Barrer la porte, écarter cette pensée et me coucher."

 latria_sexual_frustration_flavor.1101.c: "Passer une robe, m’asseoir et laisser ma respiration s’apaiser."
 latria_sexual_frustration_flavor.1102.c: "Parler de leurs airs avec les musiciens."
 latria_sexual_frustration_flavor.1103.c: "Demander comment vivre avec ces sentiments."
 latria_sexual_frustration_flavor.1103.d: "Commencer par la lettre non envoyée et ne rien cacher."
 latria_sexual_frustration_flavor.1104.c: "Demander aux autres d’attendre pendant que je rappelle patiemment l’aigle."
 latria_sexual_frustration_flavor.1105.c: "Ranger la lettre dans son coffret et préparer le travail du lendemain."
 latria_sexual_frustration_flavor.1107.c: "Proposer de nous asseoir pour parler d’autre chose."
 latria_sexual_frustration_flavor.1107.d: "Inviter toute la table à une danse collective animée."
 latria_sexual_frustration_flavor.1108.c: "Achever lentement la prière, sans combattre chaque pensée."
 latria_sexual_frustration_flavor.1109.c: "Faire une courte pause et organiser les affaires restantes."
 latria_sexual_frustration_flavor.1109.d: "Mettre les décisions urgentes en ordre et les régler ici."
 latria_sexual_frustration_flavor.1110.c: "Passer une robe et chercher une tasse de bouillon chaud."
