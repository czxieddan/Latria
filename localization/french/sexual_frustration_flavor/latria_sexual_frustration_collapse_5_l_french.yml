l_french:
 latria_collapse_no_relief_tt: "Le refoulement sexuel ne s’est pas apaisé."

 latria_sexual_frustration_flavor.1501.t: "La lampe brûle encore"
 latria_sexual_frustration_flavor.1501.desc.dead: "Je ne distingue plus les pas dehors. Le poignard glisse de ma main. Quelqu’un ouvre la porte et répète mon nom. J’essaie de répondre, mais tout s’assombrit jusqu’à ce que je ne voie plus la lampe."
 latria_sexual_frustration_flavor.1501.desc.survived: "Le poignard n’a pas mis fin à ma vie. Quelqu’un a entendu le bruit et s’est précipité pour me sauver. Je reste au lit en vêtements de nuit, mes plaies pansées, toujours en proie au même désir inassouvi."
 latria_sexual_frustration_flavor.1501.desc.severe: "Lorsque je reprends connaissance, le poignard a disparu. Quelqu’un veille près du lit et parle à voix basse de la gravité de mes blessures. Je ne peux même pas m’asseoir, mais le tourment qui m’a conduit ici ne s’est pas apaisé."
 latria_sexual_frustration_flavor.1501.a.dead: "Tout… s’assombrit…"
 latria_sexual_frustration_flavor.1501.a.survived: "J’ai mal…"
 latria_sexual_frustration_flavor.1501.a.severe: "Ne me touchez pas… j’ai mal…"

 latria_sexual_frustration_flavor.1502.t: "Une coupe vide"
 latria_sexual_frustration_flavor.1502.desc.dead: "La coupe est vide. Près du lit, j’entends quelqu’un entrer et appeler à l’aide. Ma lettre est encore inachevée, mais je ne peux plus tenir la plume. Les voix s’éloignent jusqu’à ce que je n’entende plus rien."
 latria_sexual_frustration_flavor.1502.desc.survived: "Le poison que j’ai bu ne m’a pas tué. Après les secours et les soins, je reste dans ma chambre, trop malade pour me lever. La coupe a été emportée, mais les désirs qui m’y ont poussé demeurent."
 latria_sexual_frustration_flavor.1502.desc.severe: "Le poison m’a laissé la vie et un corps infirme. Je reste au lit tandis qu’on m’apporte de l’eau et arrange mes vêtements. Cette faiblesse durable ne m’a offert aucun répit face à mes désirs."
 latria_sexual_frustration_flavor.1502.a.dead: "Je… ne peux plus parler…"
 latria_sexual_frustration_flavor.1502.a.survived: "Si mal… de l’eau…"
 latria_sexual_frustration_flavor.1502.a.severe: "Je ne peux même pas lever la main…"

 latria_sexual_frustration_flavor.1503.t: "Sur la berge"
 latria_sexual_frustration_flavor.1503.desc.dead: "Je ne vois plus la rive. Quelqu’un semble crier au loin, mais le son devient indistinct. Je me rappelle la lampe laissée allumée dans ma chambre. Même cette dernière pensée s’évanouit."
 latria_sexual_frustration_flavor.1503.desc.survived: "Quelqu’un m’a tiré de la rivière. À mon réveil, on m’enveloppe d’un manteau. Je tremble sur la berge, attendant qu’on me ramène, toujours douloureusement conscient du désir qui m’a conduit ici."
 latria_sexual_frustration_flavor.1503.desc.severe: "La rivière ne m’a pas pris la vie. Lorsqu’on me porte sur la berge, la fièvre et une toux violente m’empêchent de parler. On murmure quelque chose sur une maladie des poumons. À chaque éclaircie, les mêmes désirs reviennent."
 latria_sexual_frustration_flavor.1503.a.dead: "Si froid…"
 latria_sexual_frustration_flavor.1503.a.survived: "Je suis encore… en vie ?"
 latria_sexual_frustration_flavor.1503.a.severe: "Je… manque d’air…"

 latria_sexual_frustration_flavor.1504.t: "Au pied de la falaise"
 latria_sexual_frustration_flavor.1504.desc.dead: "Au pied de la falaise, j’entends les appels de ceux qui me cherchent sur le sentier de montagne. Leurs voix approchent, mais je ne peux répondre. Les montagnes se brouillent devant moi jusqu’à ce que je ne distingue plus le ciel."
 latria_sexual_frustration_flavor.1504.desc.survived: "Je m’éveille au pied de la falaise ; quelqu’un s’accroupit près de moi en m’appelant. La chute m’a laissé de graves blessures, mais la vie sauve. En attendant une civière, les mêmes désirs envahissent à nouveau mes pensées."
 latria_sexual_frustration_flavor.1504.desc.severe: "J’ai survécu au saut. Ceux qui m’ont trouvé se rassemblent près de moi, évitant mon regard. Lorsque j’essaie de me lever, je découvre que je ne peux plus marcher comme autrefois. Mon tourment demeure."
 latria_sexual_frustration_flavor.1504.a.dead: "Je n’entends plus rien…"
 latria_sexual_frustration_flavor.1504.a.survived: "Je ne peux plus bouger… j’ai mal…"
 latria_sexual_frustration_flavor.1504.a.severe: "Mes jambes…"

 latria_sexual_frustration_flavor.1505.t: "La porte forcée"
 latria_sexual_frustration_flavor.1505.desc.dead: "J’entends la porte de la chambre céder, puis quelqu’un crier mon nom avec effroi. J’essaie de leur dire que la lettre est près du lit, mais aucun mot ne vient. La lumière de l’entrée faiblit, et je n’entends plus rien."
 latria_sexual_frustration_flavor.1505.desc.survived: "Quelqu’un a forcé la porte de la chambre et m’a sauvé à temps. Je reste maintenant au lit, mes blessures rendant chaque mouvement difficile. La corde a disparu, mais le tourment qui m’y a poussé ne m’a pas quitté."
 latria_sexual_frustration_flavor.1505.desc.severe: "J’entends quelqu’un répéter mon nom, mais ne sais comment répondre. On doit me laver et me nourrir. Je regarde les meubles familiers de ma chambre sans savoir ce que je devrais faire ensuite. La lettre près du lit a été rangée dans un coffre."
 latria_sexual_frustration_flavor.1505.a.dead: "Je…"
 latria_sexual_frustration_flavor.1505.a.survived: "Laissez-moi… reprendre mon souffle…"
 latria_sexual_frustration_flavor.1505.a.severe: "Quelqu’un… m’appelle ?"
