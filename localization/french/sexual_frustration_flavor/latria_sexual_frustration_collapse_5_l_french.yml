l_french:
 latria_collapse_no_relief_tt: "Le refoulement sexuel ne s’est pas apaisé."

 latria_sexual_frustration_flavor.1501.t: "La lampe brûle encore"
 latria_sexual_frustration_flavor.1501.desc.dead: "Le poignard glisse de ma main, et le bruit de sa chute arrête les pas derrière la porte. La porte s’ouvre ; quelqu’un s’accroupit près de moi, m’appelle par mon nom, puis se retourne pour réclamer du secours. La lampe est toujours à sa place, mais je ne distingue pas le visage devant moi.\n\nJe voudrais faire savoir que j’entends ; mes lèvres remuent, mais aucun son ne sort. De toutes les phrases que je ressassais avant qu’on entre, aucune ne me revient entière. On me prend la main et on me demande si je peux ouvrir les yeux ; je ne peux que fixer la porte derrière cette silhouette.\n\nD’autres pas se précipitent dans la chambre. J’essaie de tourner la tête vers le bruit, mais les silhouettes près de la porte se brouillent déjà, puis même la lueur de la lampe devient indiscernable."
 latria_sexual_frustration_flavor.1501.desc.survived: "À mon réveil, mes vêtements de nuit ont été changés et mes blessures soigneusement pansées. À mon chevet, on me voit ouvrir les yeux et l’on rappelle aussitôt la personne à mon service qui allait sortir. On me dit que le bruit a attiré l’attention et que la porte s’est ouverte à temps ; le poignard a depuis été emporté.\n\nJ’essaie de me redresser, mais la douleur m’arrête avant même que je quitte l’oreiller. On borde ma couverture et on me demande si je veux boire ; j’acquiesce, mais mon regard revient à la lettre restée sur la table, jamais envoyée. Les feuillets sont toujours empilés là, celui du dessus laissant voir une formule d’adresse maintes fois retouchée.\n\nOn porte une coupe à mes lèvres ; je n’en bois qu’une gorgée. La personne qui veille sur moi reste près du lit et attend que je reprenne ma place avant de poser doucement la coupe."
 latria_sexual_frustration_flavor.1501.desc.severe: "En reprenant connaissance, j’entends d’abord des voix basses près du lit. On demande si de telles blessures peuvent guérir ; après un instant d’hésitation, la réponse est de réclamer encore du linge propre. J’essaie de me tourner pour voir qui est là, mais le moindre mouvement me coupe la parole tant il fait mal.\n\nLe poignard n’est plus à portée de main ; même la petite table près du lit a été éloignée. Je demande de l’aide pour me redresser, mais on se contente de rehausser l’oreiller en me conseillant de rester au lit pour le moment. La lumière derrière la fenêtre a changé, mais je repense toujours aux nuits sans sommeil et à cette réponse qui n’est jamais venue.\n\nUne main s’avance pour arranger les couvertures. Je voudrais demander un geste plus lent, mais avant d’avoir fini, mes doigts se crispent sur le drap sous moi."
 latria_sexual_frustration_flavor.1501.a.dead: "Tout… s’assombrit…"
 latria_sexual_frustration_flavor.1501.a.survived: "J’ai mal…"
 latria_sexual_frustration_flavor.1501.a.severe: "Ne me touchez pas… j’ai mal…"

 latria_sexual_frustration_flavor.1502.t: "Une coupe vide"
 latria_sexual_frustration_flavor.1502.desc.dead: "La coupe est vide ; le corps affaissé au bord du lit, j’entends la porte s’ouvrir. On m’appelle par mon nom, puis, à la vue de ce qui est sur la table, on se retourne pour crier au secours sans même refermer la porte. Des pas se mettent à courir dans le couloir, et le courant d’air qui entre dans la chambre agite la lettre inachevée.\n\nJe me souviens encore de la dernière phrase laissée à moitié écrite, la plume posée près du feuillet. On me soutient par les épaules, on me demande ce que j’ai bu et on me dit de tenir encore un peu. Je regarde vers la table pour achever ce que je n’ai pas su dire, mais ma main n’atteint même pas le coin du feuillet qui pend devant mes yeux.\n\nOn continue de m’appeler, mais la voix semble s’éloigner peu à peu. Je ne distingue plus les mots de la lettre et ne peux plus laisser entendre la moindre réponse."
 latria_sexual_frustration_flavor.1502.desc.survived: "Le poison que j’ai bu n’a pas eu raison de moi. À mon réveil, une bassine d’eau claire a été apportée dans la chambre. Quelqu’un veille depuis longtemps au chevet ; à la vue de mes yeux ouverts, on se lève pour appeler du monde, puis on se retourne pour me demander si je reconnais encore la chambre.\n\nLa coupe a été retirée de la table, et la lettre inachevée est retenue sous un livre. Je veux tendre la main pour la prendre, mais même me rapprocher du bord du lit me coûte un effort. On m’apporte de l’eau, on attend que j’aie fini de boire, puis on me demande à qui remettre la lettre ; je regarde la demi-ligne qui dépasse sans répondre.\n\nDehors, on commence déjà à aller et venir. Je pense à ce que je ferais d’ordinaire à cette heure, mais je ne peux que rester contre l’oreiller et écouter la domesticité éconduire les personnes venues me voir."
 latria_sexual_frustration_flavor.1502.desc.severe: "Le poison ne m’a pas pris la vie, mais je ne parviens toujours pas à me lever sans aide comme autrefois. On apporte le repas du matin et des vêtements propres près du lit ; en tendant la main, je découvre que je n’arrive même plus à tenir fermement mon bol habituel.\n\nOn ajuste mes poignets de manche et on me donne à manger, bouchée après bouchée. Je voudrais demander depuis combien de temps je suis au lit, mais je dois m’interrompre au milieu de ma phrase pour me reposer. Quelques nouvelles lettres se sont accumulées sur la table ; lorsqu’on propose de me les lire, je demande d’abord qu’on y cherche ce nom familier.\n\nLes lettres sont examinées une à une, puis vient un léger signe de tête négatif. Je regarde la pile de lettres et lève la main pour repousser un peu le bol, mais je dois encore attendre qu’on se penche vers moi."
 latria_sexual_frustration_flavor.1502.a.dead: "Je… ne peux plus parler…"
 latria_sexual_frustration_flavor.1502.a.survived: "Si mal… de l’eau…"
 latria_sexual_frustration_flavor.1502.a.severe: "Je ne peux même pas lever la main…"

 latria_sexual_frustration_flavor.1503.t: "Sur la berge"
 latria_sexual_frustration_flavor.1503.desc.dead: "Je ne vois plus la berge ; je n’entends que des appels au loin. Il y a un instant, je distinguais encore mon nom ; à présent, il ne reste que des sons entrecoupés. J’essaie de regarder dans cette direction, mais la lumière vacillante devant mes yeux m’empêche de reconnaître les arbres de la rive.\n\nQuand j’ai quitté mon logis, la lampe devait encore brûler et le livre était resté ouvert sur la table. J’avais passé tant de temps sur la même page, sans pourtant remettre le ruban en place avant de sortir. On viendra ranger la chambre et demander où je suis ; ce visage familier me revient, et je voudrais lui dire que je suis ici.\n\nUn nouvel appel me parvient, mais je ne peux pas répondre. La lumière devant mes yeux s’assombrit, et même le souvenir de cette chambre à la lampe allumée devient confus."
 latria_sexual_frustration_flavor.1503.desc.survived: "On me tire de la rivière ; à mon réveil, je suis sur la berge, le corps replié, et l’on m’enveloppe dans un manteau. À la vue de mes yeux ouverts, la personne à mes côtés fait aussitôt signe au loin, puis s’accroupit pour me demander si j’entends bien. L’eau de la rivière goutte encore de mes vêtements, et le froid m’empêche de répondre.\n\nOn me dit qu’on est allé chercher une civière et on me conseille de ne pas essayer de me lever tout de suite. Je regarde le sentier qui ramène à mon logis et repense à cette phrase que je retournais sans cesse dans ma tête en venant ici sans compagnie. On me demande qui prévenir ; je donne un nom, puis le répète à voix basse, de peur qu’il n’ait pas été entendu.\n\nOn resserre le manteau autour de moi. On promet de porter mon message ; la personne qui reste près de moi me soutient par l’épaule et attend avec moi des pas sur le sentier."
 latria_sexual_frustration_flavor.1503.desc.severe: "Quand on me porte sur la berge, je ne garde en mémoire qu’une voix pressant tout le monde de rentrer. À mon réveil suivant, mes vêtements mouillés ont été changés et plusieurs personnes entourent le lit. Je veux demander combien de temps a duré ma perte de connaissance, mais une quinte de toux m’empêche même d’achever les premiers mots pour appeler quelqu’un.\n\nPrès du lit, on parle à voix basse d’une maladie des poumons et on demande qu’on ferme la fenêtre. On a changé plusieurs fois le linge sur mon front, mais je ne sais toujours pas s’il fait jour ou nuit. Dans mes moments de lucidité, je regarde encore la porte, dans l’attente d’une présence familière ; ce n’est que la personne de service venue apporter de l’eau, qui me demande doucement ce qu’il me faut.\n\nJe secoue la tête et essaie de trouver mon appui contre l’oreiller. À peine une main se tend-elle pour m’aider que la toux interrompt encore les mots que je n’ai pas eu le temps de prononcer."
 latria_sexual_frustration_flavor.1503.a.dead: "Si froid…"
 latria_sexual_frustration_flavor.1503.a.survived: "Je suis encore… en vie ?"
 latria_sexual_frustration_flavor.1503.a.severe: "Je… manque d’air…"

 latria_sexual_frustration_flavor.1504.t: "Au pied de la falaise"
 latria_sexual_frustration_flavor.1504.desc.dead: "Au pied de la falaise, j’entends les appels des personnes qui me cherchent sur le sentier de montagne. Une voix appelle mon nom, une autre presse le groupe de chercher plus bas, et des cailloux roulent tout près. Je veux lever la main pour attirer les regards, mais elle reste à mon côté sans même faire bouger le bord de mon vêtement.\n\nLa masse de la montagne cache presque tout le ciel, et je ne sais plus depuis combien de temps j’ai quitté mon logis. À mon départ, on m’a demandé quand je rentrerais ; j’ai donné une heure sans y penser, mais je ne me souviens plus de ma réponse. Les pas se rapprochent ; j’ouvre la bouche, mais aucun son ne sort.\n\nEnfin, quelqu’un s’arrête tout près et se penche pour m’appeler. Je ne distingue pas ce visage, ni même le morceau de ciel qui reste au-dessus de moi."
 latria_sexual_frustration_flavor.1504.desc.survived: "Je reprends connaissance au pied de la falaise ; quelqu’un s’accroupit à mes côtés et m’appelle. À ma réponse, cette personne se retourne et fait signe au reste du groupe de descendre par le sentier. Je vais demander où je suis quand je reconnais la paroi au-dessus de moi ; je n’ose plus la regarder.\n\nLes blessures de la chute m’empêchent de me relever ; au moindre mouvement, je dois m’arrêter pour reprendre mon souffle. On me dit d’attendre la civière, puis on ramasse mon vêtement de dessus tombé à côté pour m’en couvrir. Je regarde l’attache et me souviens de l’avoir ajustée devant le miroir avant de sortir, en pensant déjà à cette invitation restée sans réponse.\n\nLes pas arrivent tout près, et plusieurs personnes discutent à voix basse de la façon de me soulever. Je veux me tourner pour faciliter le geste, mais je pousse un cri avant même d’avoir bougé."
 latria_sexual_frustration_flavor.1504.desc.severe: "Je reprends connaissance au pied de la falaise ; les personnes venues à mon secours se tiennent autour de moi, mais personne ne parle. Je reconnais un visage et demande s’il est temps de rentrer. On rabat mon vêtement de dessus sur moi, puis on regarde vers le sentier en pressant les personnes qui apportent la civière.\n\nJ’essaie de me relever, mais on me retient aussitôt en me demandant de ne pas bouger. Je baisse les yeux vers mes jambes ; à côté de moi, une voix hésitante me dit que je ne pourrai peut-être plus marcher comme avant. La chaussure tombée à côté porte encore de la boue ; je la regarde et repense aux nuits passées dans le couloir à attendre une réponse.\n\nOn me demande s’il me manque quelque chose. Je veux demander qu’on ramasse ma chaussure, mais je demande plutôt si des nouvelles sont arrivées au logis ; pendant un instant, personne ne répond."
 latria_sexual_frustration_flavor.1504.a.dead: "Je n’entends plus rien…"
 latria_sexual_frustration_flavor.1504.a.survived: "Je ne peux plus bouger… j’ai mal…"
 latria_sexual_frustration_flavor.1504.a.severe: "Mes jambes…"

 latria_sexual_frustration_flavor.1505.t: "La porte forcée"
 latria_sexual_frustration_flavor.1505.desc.dead: "Au moment où la porte de la chambre cède, j’entends une voix appeler mon nom avec urgence. La lumière du couloir entre dans la chambre ; plusieurs personnes se pressent à la porte, avant qu’une voix au premier rang leur ordonne d’aller chercher du secours. La lettre est toujours près du lit ; je voudrais la signaler, mais je n’arrive plus à tourner les yeux vers elle.\n\nQuelqu’un s’approche ; cette voix m’est si familière que je voudrais répondre. Je comprends bien ces paroles, mais je ne parviens pas à parler ; je ne vois que cette bouche qui remue sans cesse. Une question vient de derrière la porte, mais la personne penchée près de moi ne se retourne pas et attend toujours le moindre signe.\n\nJ’essaie de distinguer encore ce visage, mais tout s’assombrit devant mes yeux. La lumière de la porte disparaît, puis les appels cessent eux aussi de me parvenir."
 latria_sexual_frustration_flavor.1505.desc.survived: "La porte de la chambre a été forcée, et les secours sont arrivés à temps. Depuis mon lit, je vois le verrou tordu ; on a apporté une chaise pour veiller de l’autre côté de la porte. On arrange mon oreiller et on me demande si je peux parler ; je ne laisse échapper qu’une réponse rauque.\n\nLa corde a disparu, et la lettre qui était près du lit a elle aussi changé de place. J’essaie de me tourner pour la chercher, mais mes blessures m’arrêtent au milieu du mouvement. La personne qui s’occupe de moi suit mon regard et place la lettre bien en vue ; le nom inachevé à la fin retient toujours mes yeux.\n\nJe lève la main pour demander qu’on attende avant de poser des questions. On acquiesce, on rapproche l’eau et on attend que je me remette un peu avant de rabattre la couverture sur moi."
 latria_sexual_frustration_flavor.1505.desc.severe: "Quelqu’un appelle mon nom près du lit ; je sais qu’on attend une réponse, mais je ne comprends pas ce que je dois dire. Tout le mobilier de la chambre me semble familier, mais la chaise près de la fenêtre paraît avoir changé de place. Je la fixe jusqu’à ce qu’on remette doucement ma manche en place.\n\nOn me lave, on change mes vêtements, puis on apporte à manger. Je regarde la cuillère approcher et ne pense à ouvrir la bouche que lorsqu’on me le rappelle. Quelqu’un mentionne la lettre, et une autre personne jette un regard au coffret près du lit. Je regarde à mon tour, mais au moment de poser une question, j’oublie ce que je voulais demander.\n\nLe couvercle du coffret est déjà fermé. La personne à mon chevet appelle encore mon nom ; cette fois, je tourne la tête et vois ses mains s’immobiliser."
 latria_sexual_frustration_flavor.1505.a.dead: "Je…"
 latria_sexual_frustration_flavor.1505.a.survived: "Laissez-moi… reprendre mon souffle…"
 latria_sexual_frustration_flavor.1505.a.severe: "Quelqu’un… m’appelle ?"
