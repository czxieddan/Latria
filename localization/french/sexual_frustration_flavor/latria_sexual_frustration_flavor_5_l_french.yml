 latria_sexual_frustration_flavor.1401.t: "Un sceau réservé"
 latria_sexual_frustration_flavor.1401.desc.female: "En chemise de nuit, je plie et replie une lettre près du lit. Elle n’est pas signée, la formule d’adresse est rayée, mais les plis sont désormais trop marqués pour être dissimulés. Au coin de la table, la cire est chaude. Il ne manque que mon sceau pour confier à quelqu’un d’autre ce qui m’occupe cette nuit.\n\nJe déplie la lettre et m’arrête à la ligne du rendez-vous. L’heure, le lieu, jusqu’à la porte à emprunter, tout est précisé. Le jour, je pouvais encore prétendre qu’il s’agissait de notes sans importance. Maintenant que le messager attend dans le couloir, je ne trouve plus de prétexte convenable.\n\nUn vêtement bruisse derrière la porte. Je prends le sceau, l’autre main toujours posée sur la lettre pour la tenir fermée, sans appeler personne."
 latria_sexual_frustration_flavor.1401.desc.male: "En chemise de nuit, je m’assieds au bord du lit, le sceau en main. Sur la table, la lettre est écrite jusqu’à la dernière ligne. L’encre a séché ; seule la signature manque. Un serviteur a préparé la cire et fermé la fenêtre, puis s’est retiré sans demander pourquoi je ne dormais pas encore.\n\nJe connais chaque phrase de cette lettre et la manière dont on la lira. Si j’ajoute mon nom et mon sceau, je ne pourrai plus présenter cette invitation comme une plaisanterie passagère. Tant de fois remaniés dans mes pensées, ces mots ne me laissent plus aucune échappatoire sur le papier.\n\nJe serre le sceau depuis longtemps. Je le tourne dans le bon sens et regarde la lumière entre les battants, sans encore appeler le messager."
 latria_sexual_frustration_flavor.1401.desc: "Je prends le sceau et le repose, sans me résoudre à sceller la lettre. Le rabat est bien plié, la cire prête ; aucune autre tâche ne m’attend à cette table. Je lisse pourtant encore un coin du papier, comme si un pli méritait de me retenir.\n\nLa phrase est déjà écrite. Au matin, la personne chargée du courrier demandera seulement où porter la lettre, sans décider à ma place s’il faut l’envoyer. Je relis l’adresse deux fois, songeant à la réponse qui pourrait venir, puis à la possibilité qu’il n’en vienne aucune.\n\nLa cire commence à figer dans la cuillère. Je la rapproche de la flamme, tandis que ma main libre retient de nouveau la lettre sur la table."
 latria_sexual_frustration_flavor.1401.a: "Achever la lettre et y apposer mon sceau."
 latria_sexual_frustration_flavor.1401.b: "Ranger le sceau, réprimer le désir et m’allonger."

 latria_sexual_frustration_flavor.1402.t: "Le dernier festin"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Le banquet touche à sa fin, mais on parle encore d’amants, de fiançailles et de plaisirs anciens. Quelqu’un attache son manteau puis se retourne pour achever son histoire ; les autres rient et réclament encore du vin. Ici, nul n’a besoin de baisser la voix pour ces choses.\n\nJe me levais déjà lorsqu’un nom de lieu familier me fait reprendre place. J’y ai aussi mes souvenirs, sans jamais les avoir racontés avec tant de légèreté. Je tente quelques mots ; à côté de moi, on pose un gobelet et l’on attend la suite. Tout ce que je gardais en moi se presse soudain sur mes lèvres.\n\nLes musiciens rangent leurs cordes. Notre hôte regarde la porte, mais mon manteau reste au dossier de la chaise."
 latria_sexual_frustration_flavor.1402.desc.strict: "Au banquet, quelqu’un évoque un noble déchu pour une liaison secrète. La cruche qui passait de main en main s’immobilise. L’un demande de quelle famille il vient ; un autre murmure que le mariage prévu sera sans doute annulé. Au bout de la table, j’écoute ces gens régler sa vie point par point.\n\nMon nom n’a pas été prononcé. Pourtant, quand on me demande pourquoi je garde le silence, je ne trouve même pas mon sourire habituel. Les confidences que le vin devait m’aider à faire risqueraient, une fois commencées, de ne plus pouvoir être reprises.\n\nUn serviteur vient chercher mon assiette vide. Je dégage le passage, mais garde mon gobelet en main, sans finir la dernière gorgée."
 latria_sexual_frustration_flavor.1402.desc: "En voyant les serviteurs enlever les plats, je comprends seulement que le banquet s’achève. Des invités se disent adieu près de la porte, notre hôte s’enquiert des montures, et mon gobelet est encore presque plein. Les mots que je voulais dire n’ont jamais trouvé leur place.\n\nÀ côté de moi, on arrange un manteau et l’on me demande si nous sortons ensemble. J’acquiesce, puis j’évoque un ancien souvenir. J’en ai déjà raconté le début, mais je recommence, comme si une phrase assez juste pouvait empêcher la soirée de finir ainsi.\n\nLa main de mon voisin s’arrête sur l’attache de son manteau. Je repousse mon gobelet ; l’écho de la salle me paraît soudain bien plus net."
 latria_sexual_frustration_flavor.1402.a: "Retenir les derniers convives à table et répéter sans cesse mes tourments."
 latria_sexual_frustration_flavor.1402.b: "Réprimer cette pensée, remercier mes hôtes et prendre congé."

 latria_sexual_frustration_flavor.1403.t: "Une confession sans témoins"
 latria_sexual_frustration_flavor.1403.desc.favors: "Je reste à l’autel et entends le dernier servant refermer doucement la porte. Le livre sacré est encore ouvert sur son pupitre, un ruban marquant la page consacrée aux plaisirs de la chair. Je connais ces enseignements ; ma foi ne me demande pas de tenir ce désir pour un péché.\n\nPourtant, dès qu’il n’y a plus personne, je ne sais par où commencer. Les questions préparées dans la journée sont trop soigneuses : elles contournent précisément la personne que je voudrais voir. Je répète une phrase, m’interromps, puis prononce tout bas le nom jusque-là caché derrière une formule d’adresse.\n\nNulle réponse dans le sanctuaire. Je retire ma main du livre et reste à genoux, les yeux sur la lumière qui faiblit sous la porte."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Je m’agenouille à l’autel sans autre compagnie, la tenue impeccable, mais ma prière se brise toujours au même endroit. Le dernier servant m’a demandé s’il fallait laisser une lampe ; j’ai acquiescé. Il ne reste donc qu’une flamme et un livre sacré dont la lecture demeure inachevée.\n\nJe connais les préceptes, et depuis longtemps les mots de la confession. Mais chaque fois qu’il faut renoncer au désir, je pense à la lettre que je n’ai pas détruite. Je sais très bien où elle se trouve : avant de sortir, je l’ai cachée entre des pages que personne n’irait feuilleter.\n\nPersonne ne me presse, et la phrase suivante n’en vient que plus difficilement. Des pas annoncent la relève dehors. Je baisse la tête et reprends au début."
 latria_sexual_frustration_flavor.1403.desc: "J’attends que les derniers pas se dissipent sans quitter l’autel. Les bancs ont été remis en ordre, un ruban pend du livre sacré, et une coupe oubliée par un servant reste près de la porte. Tout à l’heure, en présence des autres, les mots me semblaient impossibles à prononcer.\n\nMaintenant que les lieux sont déserts, j’essaie de raconter depuis le début ce qui me pèse. À mi-chemin, je m’entends de nouveau me cacher derrière des phrases familières. Je m’arrête, regarde la porte, puis recommence à voix basse. Cette fois, je n’omets pas ce nom.\n\nLa lumière tombe devant mes genoux. Je ne me relève pas aussitôt et laisse cette phrase s’éteindre lentement dans la salle vide."
 latria_sexual_frustration_flavor.1403.a: "Ne plus prêter de vœux d’abstinence et reconnaître mon choix."
 latria_sexual_frustration_flavor.1403.b: "Contenir mon désir et rester à genoux jusqu’à la prière du matin."

 latria_sexual_frustration_flavor.1404.t: "Nommer le désir"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Sans vêtements, je me tiens devant le miroir de bronze de ma chambre. Ma robe repose sur une chaise, les serviteurs sont partis, et j’ai moi-même tiré le verrou. Le reflet ne détourne pas les yeux. Enfin, je ne cherche plus à toute hâte une menue occupation pour distraire mes pensées.\n\nCes derniers temps, j’ai appelé fatigue, ennui ou insomnie après un festin mon envie de revoir cette personne. Chaque nouveau prétexte ajoutait une ligne à la lettre sur mon bureau, toujours sans l’envoyer. Je sais ce que j’attends et me lasse d’effacer chaque matin les mots déjà écrits.\n\nUne feuille neuve repose sur la table. Je la regarde et me demande sérieusement, pour la première fois, si toutes ces salutations sont encore nécessaires."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Sans vêtements, je m’assieds au bord du lit, les mains serrées. Mes habits sont tout près, le livre de prières encore sorti. Je voulais lire un passage familier avant de dormir, mais je reste longtemps sur la même ligne, au point de perdre une fois le compte des appels de la veille.\n\nSi je garde mon serment, ce n’est pas faute de désirer la proximité d’un être. Son nom à peine revenu, je sais que je ne peux plus me tirer d’affaire en prétendant n’avoir aucune pensée trouble. Je retrouve la page de mes vœux et lis plus lentement que d’habitude, cherchant dans chaque phrase mon propre choix.\n\nLa page s’immobilise entre mes doigts. Dehors, tout est silencieux. Je ne ferme pas le livre et ne me presse pas d’achever les mots qui restent."
 latria_sexual_frustration_flavor.1404.desc: "La nuit est avancée. Dans ma chambre, j’admets enfin que je souhaite encore revoir cette personne. J’ai remanié plusieurs fois la lettre sur la table, supprimant chaque fois la phrase essentielle pour ne laisser que le temps, les voyages et d’insignifiantes salutations.\n\nJ’étale les feuilles une à une et regarde leurs débuts presque identiques. Elles sont convenables, mais leur destinataire ne saura jamais pourquoi je tarde tant à éteindre la lampe. En écrire une autre ce soir en changeant seulement la formule d’adresse ne ferait rien avancer.\n\nJe pose la plume près d’une feuille vide. Un nouvel appel de la veille retentit dehors ; cette fois, je ne m’en sers pas pour m’envoyer dormir."
 latria_sexual_frustration_flavor.1404.a: "Reconnaître mon désir et cesser de le combattre cette nuit."
 latria_sexual_frustration_flavor.1404.b: "Me rhabiller et réprimer cette pensée."

 latria_sexual_frustration_flavor.1405.t: "Une page de la chronique"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Le chroniqueur se penche sur la table, attendant que je décide ce qui mérite de rester. Je me tiens derrière lui en habit de cérémonie. L’encre des récompenses et des levées que je viens de dicter n’est pas encore sèche. Au programme du lendemain, je m’interromps et évoque plutôt ces longues nuits dont nul ne tient le compte.\n\nSa plume ne suit pas aussitôt. Près de la porte, un serviteur change d’appui ; je sais que tous ont entendu. Je croyais pouvoir garder ces tourments dans ma chambre tant que je recevais la cour comme à l’ordinaire. Mais quand le chroniqueur demande s’il doit les consigner, je ne peux plus répondre machinalement que non.\n\nUne nouvelle page est prête. La plume demeure suspendue au-dessus du blanc, et tous attendent la suite de ma phrase."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Le copiste, assis à la table, demande si cette étape du voyage doit aussi entrer dans la chronique. Je lui indique les passages, les gîtes et les retards ; il note chaque chose, puis lève les yeux pour attendre le lieu suivant. La lettre jamais envoyée dépasse de mon bagage, près de ma main.\n\nCertains arrêts ne tenaient ni à la pluie ni à un essieu brisé. J’ai fait un détour pour revoir quelqu’un, sans jamais avouer pourquoi à mes compagnons. Maintenant que le trajet est soigneusement consigné, les noms de lieux me font sentir que l’omission est justement ce qui m’a le plus poursuivi sur cette route.\n\nLe copiste trempe sa plume. Je sors la lettre sans l’ouvrir et en lisse d’abord le coin près de la carte."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Je rajuste mes vêtements liturgiques et me présente au secrétaire. Il comptait noter des dons et des réparations ; quand je change de sujet, il prend une autre feuille. Le livre sacré reste ouvert près de lui, au passage que j’ai expliqué à d’autres dans la journée.\n\nLe serment et le désir sont tous deux réels. Je refuse de me décrire comme un être n’ayant jamais hésité, tout en sachant qu’une fois écrits, ces mots ne seront plus réservés à mes seuls souvenirs. Le secrétaire demande s’il faut garder le nom de cette personne, très doucement, comme pour éviter que l’on comprenne dehors.\n\nJe regarde la ligne laissée vide. Les grains de prière entourent encore mon poignet ; je ne les égrène pas pour esquiver la question."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Le secrétaire attend ma dictée. En tenue de cérémonie, le sceau du conseil encore à côté de moi, j’achève les affaires publiques puis évoque une histoire privée longtemps enfouie. Les serviteurs près de la porte ne se retirent pas. La pièce devient soudain silencieuse.\n\nJe commence par une vieille lettre, puis plusieurs rendez-vous manqués. Le secrétaire écrit plus lentement et relève les yeux à chaque ambiguïté. Je voulais qu’il trouve des expressions convenables à ma place ; pourtant, en entendant répéter mes mots, je ne veux plus qu’ils deviennent une autre histoire.\n\nIl me tend la demi-page recopiée. Je la prends, les yeux arrêtés sur la première désignation qui ne cache rien."
 latria_sexual_frustration_flavor.1405.desc: "Je viens à la table du secrétaire avec la décision d’expliquer ce que je tais depuis si longtemps. Il écarte les documents officiels, étale une nouvelle feuille et demande par où commencer. Je donne une date, puis m’arrête : ce n’est pas là que tout a réellement commencé.\n\nJe reprends avec une lettre, une brève rencontre, puis plusieurs nuits sans sommeil. La plume glisse doucement, mais ces paroles pourront désormais être lues par quelqu’un d’autre, du début à la fin. Le secrétaire ne juge pas ; aux passages obscurs, il attend simplement, laissant un peu de blanc.\n\nLa feuille achevée repose entre nous. Il attend encore mes instructions pour savoir si une troisième personne pourra la voir."
 latria_sexual_frustration_flavor.1405.a: "Laisser circuler les copies pour que tous puissent les lire."
 latria_sexual_frustration_flavor.1405.b: "Faire noter au scribe mes seuls devoirs et taire le reste."

 latria_sexual_frustration_flavor.1406.t: "Au départ des convives"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Les derniers convives parlent encore d’amants et de fiançailles. Je viens d’évoquer mon passé qu’un petit rire s’élève au bord de la table. Gobelet levé, son auteur ne voit là aucune impolitesse et me presse, en souriant, de raconter la suite.\n\nCette histoire m’habite depuis si longtemps que la voir soudain traitée en divertissement de beuverie me coupe la parole. À côté de moi, quelqu’un ajoute une supposition ; un autre plaisante sur les mots de la lettre. Je veux corriger, mais mes explications se précipitent, jusqu’aux détails que je ne comptais pas révéler.\n\nUn serviteur vient prendre la dernière cruche. Je retiens le bord de mon gobelet et entends rapprocher une chaise dans l’attente de la suite."
 latria_sexual_frustration_flavor.1406.desc.strict: "La nouvelle d’un noble déchu pour une liaison secrète arrive à table alors que je n’ai pas fini de parler. Quelqu’un près de moi pose soudain une question à voix basse ; un autre me regarde puis rit brièvement. La personne qui hochait la tête ne s’occupe plus que de sa serviette.\n\nJe sais devoir m’arrêter, mais refuse de laisser ce silence finir mon récit à ma place. Plus je veux expliquer que ce scandale ne me concerne pas, plus mes paroles précédentes semblent exiger des explications. Des invités prennent déjà congé à la porte. Aucun de ceux qui restent ne me demande de poursuivre.\n\nJe repose mon gobelet un peu trop fort. Les regards sont toujours là ; il me faut décider à qui adresser la prochaine phrase."
 latria_sexual_frustration_flavor.1406.desc: "Les invités vont partir, mais je n’en finis pas. À l’évocation d’une ancienne lettre, mes voisins échangent un regard et un rire discret monte de la table. Je m’interromps, découvrant seulement que plusieurs personnes ont depuis longtemps posé leurs couverts pour m’écouter.\n\nJe voulais expliquer l’importance d’une phrase ; je ne fais que la raconter une seconde fois. L’un acquiesce poliment, un autre regarde la porte, un troisième cache son sourire derrière sa coupe. Je vois tout cela et m’impatiente davantage, comme s’il ne manquait qu’une phrase pour me faire comprendre.\n\nNotre hôte s’est levé. Les chaises devant moi n’ont pas bougé, et les salutations du départ me parviennent de derrière."
 latria_sexual_frustration_flavor.1406.a: "Poursuivre mon histoire et répondre devant toute la table à quiconque se moque."
 latria_sexual_frustration_flavor.1406.b: "Retenir ma langue, saluer la compagnie et prendre congé."

 latria_sexual_frustration_flavor.1407.t: "Prière après l’extinction des feux"
 latria_sexual_frustration_flavor.1407.desc.favors: "En chemise de nuit, au bord du lit, j’ouvre mon livre de prières à la page des plaisirs de la chair. Ces enseignements si ordinaires en plein jour, je les relis maintenant plusieurs fois. La porte est verrouillée, les autres sont partis, et la lampe n’a presque plus d’huile.\n\nMa foi ne me demande pas de nier mon désir, mais je ne sais toujours pas comment affronter cette affection sans réponse. J’essaie de me dire les mots que je voudrais prononcer. Une fois les salutations retirées, les phrases restantes sont si courtes que je m’arrête longtemps.\n\nLa flamme baisse. Je marque la page du ruban, sans fermer aussitôt le livre ni chercher ailleurs une autre réponse."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Je rapproche les pans de ma chemise de nuit et répète tout bas mon vœu de chasteté. La mèche a raccourci ; dans l’ombre, les mots du livre deviennent difficiles à distinguer. Je continue pourtant, reprenant au début à chaque erreur, comme si une lecture exacte suffisait à traverser cette nuit.\n\nMais à mi-chemin reviennent les paroles entendues de cette personne dans la journée. Je n’ai pas oublié mon serment, pas plus que la raison pour laquelle j’avais tant de mal à prendre congé. Réunis, ces deux faits rendent soudain insuffisantes mes réponses habituelles.\n\nLa lampe va s’éteindre ; j’en protège la flamme d’une main. La phrase suivante est sous mes yeux. Je la regarde longtemps sans la prononcer."
 latria_sexual_frustration_flavor.1407.desc: "Il ne reste dans la chambre qu’une lampe presque éteinte, et mes yeux ne se ferment toujours pas. Le livre de prières repose sur mes genoux, ouvert à une page déjà lue plusieurs fois. Un veilleur passe dehors. Ses pas disparaissent au tournant ; j’attends encore le suivant.\n\nJe rapproche un peu le livre de la flamme pour retrouver ma ligne. Aucun mot n’y est difficile. Je sais pourquoi je m’interromps : chaque fin me ramène à une question qu’il aurait fallu éclaircir dans la journée. Personne ne peut répondre maintenant, mais je continue d’imaginer la réponse à sa place.\n\nLe fond d’huile brille dans la lampe. Je place le ruban et garde la main sur la couverture, sans souffler la flamme."
 latria_sexual_frustration_flavor.1407.a: "Écarter le vœu de chasteté et m’attarder sur cette affection."
 latria_sexual_frustration_flavor.1407.b: "Contenir mes pensées et réciter jusqu’à l’aube."

 latria_sexual_frustration_flavor.1408.t: "Silence devant le miroir"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Sans vêtements, je me tiens devant le miroir. Les habits quittés dans la journée sont près du lit, une invitation à moitié écrite sur la table. Devant cette glace, je soignais toujours ma tenue en préparant mes paroles pour notre rencontre ; une fois ensemble, je ne parlais pourtant que de banalités.\n\nCes allers-retours ont assez duré. Je ne veux plus présenter un désir ancien comme une pensée fortuite, ni attendre à chaque rencontre que l’autre parle d’abord. Près du miroir, la lettre inachevée offre encore assez de place pour une phrase claire.\n\nJe me tourne vers le bureau, regardant l’encre séchée sur la plume. Personne ne me presse dehors. Cette fois, aucune affaire publique ne peut répondre à ma place."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Sans vêtements, je m’assieds au bord du lit, les mains crispées. Près du miroir, mes habits sont soigneusement pliés, le livre de prières posé dessus. J’ai lu le chapitre prescrit sans retrouver le calme habituel. Plus la pièce se tait, plus cette affection s’impose.\n\nLa chasteté reste mon choix. Mais je ne veux plus prétendre qu’il est facile de m’y tenir, comme si lire un livre sacré effaçait toute autre pensée. Je range mentalement les tâches du lendemain. À l’heure où je dois revoir cette personne, je m’arrête et recommence à les ordonner.\n\nLe reflet reste assis lui aussi. Je desserre les mains et regarde la plume sur la table, voulant consigner fidèlement cette hésitation."
 latria_sexual_frustration_flavor.1408.desc: "Dans le silence, je regarde mon reflet ; la lettre inachevée est encore étalée sur la table. Je n’ai plus à prendre ce sourire qui me dissimule le jour. Je retourne au bord du lit et repense à notre brève rencontre depuis le début.\n\nAucune phrase n’était une promesse, personne ne m’a demandé d’attendre. Parmi les sens ajoutés ensuite, lesquels venaient de l’autre, lesquels de moi ? J’accepte enfin de les distinguer un à un. Le comprendre ne fait pas aussitôt disparaître le désir.\n\nJe rapproche le papier de la lampe. La ligne encore à écrire devrait au moins exprimer clairement ce que j’ai à dire."
 latria_sexual_frustration_flavor.1408.a: "Reconnaître ce désir et cesser de le fuir cette nuit."
 latria_sexual_frustration_flavor.1408.b: "M’habiller, m’asseoir au bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1409.t: "Un écart de tenue à la cour"
 latria_sexual_frustration_flavor.1409.desc: "Pendant une pause de l’audience, je retire mes vêtements dans une pièce voisine, espérant calmer mes pensées par un instant de solitude. Ma robe est encore dans les mains d’un serviteur lorsque la porte de la salle du conseil s’ouvre. Je lève les yeux. Autour de la longue table, les conversations se sont arrêtées ; plusieurs conseillers restent figés dans leur mouvement vers moi.\n\nLe secrétaire baisse les yeux et ramène sa feuille à moitié écrite. Près de la porte, on voudrait reculer sans gêner le serviteur qui porte mes habits ; personne ne bouge. Je devrais parler aussitôt, mais ma voix se serre et les ordres préparés ne forment plus de phrases.\n\nEnfin, le serviteur approche ma robe. Les affaires non résolues sont toujours sur la table, et tous attendent ma décision sur la suite."
 latria_sexual_frustration_flavor.1409.a: "Me tenir devant eux sans chercher à cacher mon écart."
 latria_sexual_frustration_flavor.1409.b: "Congédier les seigneurs et m’habiller avant de reprendre le conseil."

 latria_sexual_frustration_flavor.1410.t: "La nuit derrière la porte"
 latria_sexual_frustration_flavor.1410.desc.female: "En chemise de nuit, près de la porte, j’écoute les pas s’éloigner. Dans le couloir, quelqu’un rend une clef puis souhaite doucement bonne nuit. J’aurais pu retenir l’une de ces personnes pour lui demander de porter une lettre au matin. Les voix se sont tues sans que je parle.\n\nCette affection sans réponse revient à moi. Le brouillon sur la table regorge de propos inutiles et tait seulement la réponse que j’espère. Je pose la feuille sur mes genoux, reprends à la première ligne et raye enfin cette salutation banale à laquelle je ne crois pas moi-même.\n\nDehors, tout est silencieux. Je déplace la plume vers le blanc. Avant même de la poser, je sais que cette lettre me retiendra plus longtemps que les autres."
 latria_sexual_frustration_flavor.1410.desc.male: "En chemise de nuit, adossé à la tête du lit, je n’ai tourné aucune page du livre à portée de main. Le silence gagne le couloir, la lampe éclaire le même passage, et je pense toujours à notre conversation trop vite achevée. Au départ, j’ai promis de reprendre un autre jour. On ne m’a répondu que par politesse.\n\nJ’ai trop souvent invoqué cet autre jour. Chaque fois, je crois pouvoir parler clairement à la prochaine rencontre ; seul ensuite, je ne peux que chercher un sens caché à cette réponse courtoise. J’avance le signet d’une page, puis découvre que je ne me rappelle même pas la précédente.\n\nIl reste du papier et une plume sur la table. Je ferme le livre, le laisse sur mes genoux et regarde l’espace désormais sombre sous la porte."
 latria_sexual_frustration_flavor.1410.desc: "La longue nuit n’est pas finie. Derrière ma porte fermée, j’écoute s’éloigner les derniers pas. La lettre sur la table n’est pas achevée, le livre près du lit reste ouvert : mes deux occupations pour passer le temps se sont arrêtées à mi-chemin.\n\nJe me lis les quelques lignes écrites. Les phrases sont simples, mais ménagent partout une échappatoire. Même au bout, on ne sait quelle réponse j’espère de cette personne. Si je continue ainsi, l’envoi de demain ne fera qu’ajouter une nouvelle attente.\n\nJe prends une feuille neuve et la glisse sous le livre. La lampe éclaire encore assez pour que je voie où commencer la première ligne."
 latria_sexual_frustration_flavor.1410.a: "Écarter le livre et écrire une longue lettre."
 latria_sexual_frustration_flavor.1410.b: "Réprimer le désir, éteindre la lampe et m’allonger."

 latria_sexual_frustration_flavor.1401.c: "Faire un poème de l’invitation que je ne peux envoyer."
 latria_sexual_frustration_flavor.1402.c: "Payer les musiciens pour jouer aux convives restants."
 latria_sexual_frustration_flavor.1402.d: "Faire rester les convives pour parler de leurs anciens voyages."
 latria_sexual_frustration_flavor.1403.c: "Ouvrir les Écritures et chercher une réponse dans chaque passage."
 latria_sexual_frustration_flavor.1404.c: "Abandonner mon vœu de chasteté et suivre désormais mes désirs."
 latria_sexual_frustration_flavor.1404.d: "Passer ma chemise de nuit et attendre que mes pensées s’apaisent."
 latria_sexual_frustration_flavor.1405.c: "Faire de mon récit une lettre privée et la sceller dans un coffret."
 latria_sexual_frustration_flavor.1405.d: "Prêter un vœu de chasteté devant ces témoins."
 latria_sexual_frustration_flavor.1406.c: "Réciter un nouveau poème aux convives qui partent."
 latria_sexual_frustration_flavor.1407.c: "Fermer le livre de prières et examiner lentement mes sentiments."
 latria_sexual_frustration_flavor.1408.c: "Énumérer les devoirs du matin et ranger tous les documents."
 latria_sexual_frustration_flavor.1409.c: "M’habiller, regagner la table et régler chaque affaire de la cour."
 latria_sexual_frustration_flavor.1409.d: "M’habiller, faire une plaisanterie et inviter les seigneurs à se rasseoir."
 latria_sexual_frustration_flavor.1410.c: "Passer une robe, préparer du thé et attendre de pouvoir dormir."
