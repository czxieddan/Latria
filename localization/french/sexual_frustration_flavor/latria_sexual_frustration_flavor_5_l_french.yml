l_french:
 latria_sexual_frustration_flavor.1401.t: "Un sceau réservé"
 latria_sexual_frustration_flavor.1401.desc.female: "En chemise de nuit, je plie sans cesse une lettre près du lit. Elle ne porte aucun nom, seulement un sceau que je n’ai pas encore osé apposer."
 latria_sexual_frustration_flavor.1401.desc.male: "En chemise de nuit, je m’assieds au bord du lit, un sceau en main. Si j’écris ces mots, je ne pourrai plus prétendre ne les avoir jamais pensés."
 latria_sexual_frustration_flavor.1401.desc: "Je lève le sceau et le repose, sans jamais le presser sur la page."
 latria_sexual_frustration_flavor.1401.a: "Achever la lettre et y apposer mon sceau."
 latria_sexual_frustration_flavor.1401.b: "Ranger le sceau, réprimer le désir et m’allonger."

 latria_sexual_frustration_flavor.1402.t: "Le dernier festin"
 latria_sexual_frustration_flavor.1402.desc.accepted: "Avant la fin du festin, les convives parlent encore ouvertement d’amants, de fiançailles et de plaisirs anciens. Je ne peux plus prendre leurs propos pour de simples bavardages."
 latria_sexual_frustration_flavor.1402.desc.strict: "Quelqu’un nomme un noble tombé en disgrâce pour une romance indiscrète, et la table se tait. Je sais que le même jugement pourrait me viser."
 latria_sexual_frustration_flavor.1402.desc: "Les tables sont en désordre et les convives partent, mais la pensée en moi se fait plus pressante."
 latria_sexual_frustration_flavor.1402.a: "Retenir les derniers convives à table et répéter sans cesse mes tourments."
 latria_sexual_frustration_flavor.1402.b: "Réprimer cette pensée, remercier mes hôtes et prendre congé."

 latria_sexual_frustration_flavor.1403.t: "Une confession sans témoins"
 latria_sexual_frustration_flavor.1403.desc.favors: "L’autel est désert. Je me rappelle que ma foi permet les plaisirs charnels, mais ne sais toujours pas comment apaiser cette urgence."
 latria_sexual_frustration_flavor.1403.desc.condemns: "Je m’agenouille sans compagnie devant l’autel, mes vêtements en ordre, mais la prière se brise chaque fois aux mêmes mots. Si personne ne m’entend, ai-je tout de même rompu mon vœu ?"
 latria_sexual_frustration_flavor.1403.desc: "Le sanctuaire est vide. Je ne l’ai pas encore quitté."
 latria_sexual_frustration_flavor.1403.a: "Ne plus prêter de vœux d’abstinence et reconnaître mon choix."
 latria_sexual_frustration_flavor.1403.b: "Contenir mon désir et rester à genoux jusqu’à la prière du matin."

 latria_sexual_frustration_flavor.1404.t: "Nommer le désir"
 latria_sexual_frustration_flavor.1404.desc.lustful: "Sans vêtements, dans la solitude de ma chambre, je ne détourne pas les yeux de mon reflet. J’en ai assez de qualifier le désir de faiblesse passagère."
 latria_sexual_frustration_flavor.1404.desc.chaste: "Sans vêtements, dans la solitude près du lit, je serre les mains. Si je garde mon vœu, ce ne sera pas parce que ce désir a disparu."
 latria_sexual_frustration_flavor.1404.desc: "La nuit est avancée. Enfin, je cesse de me cacher mon propre désir."
 latria_sexual_frustration_flavor.1404.a: "Reconnaître mon désir et cesser de le combattre cette nuit."
 latria_sexual_frustration_flavor.1404.b: "Me rhabiller et réprimer cette pensée."

 latria_sexual_frustration_flavor.1405.t: "Une page de la chronique"
 latria_sexual_frustration_flavor.1405.desc.emperor: "Le chroniqueur attend que je décide de ce qui mérite d’être gardé en mémoire. En habits de cérémonie derrière lui, je comprends que le silence ne fera pas disparaître ce tourment."
 latria_sexual_frustration_flavor.1405.desc.adventurer: "Le scribe est assis à la table et demande si cette partie du voyage doit entrer dans la chronique. Je regarde la lettre non envoyée et sais que ces mots voyageront avec moi."
 latria_sexual_frustration_flavor.1405.desc.clergy: "Je revêts mes habits liturgiques et me tiens devant le scribe. Le vœu et le désir sont tous deux vrais ; je ne laisserai personne décider lequel mérite d’être gardé en mémoire."
 latria_sexual_frustration_flavor.1405.desc.ruler: "Le greffier attend pour noter mes paroles. En habits de cérémonie, devant mes domestiques, je parle de ce que j’ai gardé enfoui."
 latria_sexual_frustration_flavor.1405.desc: "Je décide de ne plus garder cette affaire pour moi."
 latria_sexual_frustration_flavor.1405.a: "Laisser circuler les copies pour que tous puissent les lire."
 latria_sexual_frustration_flavor.1405.b: "Faire noter au scribe mes seuls devoirs et taire le reste."

 latria_sexual_frustration_flavor.1406.t: "Au départ des convives"
 latria_sexual_frustration_flavor.1406.desc.accepted: "Les derniers convives parlent encore d’amants et de fiançailles. J’ai à peine commencé une de mes vieilles histoires que quelqu’un à table ricane."
 latria_sexual_frustration_flavor.1406.desc.strict: "La nouvelle d’un noble tombé en disgrâce pour une romance indiscrète parvient à table. Avant que je retienne ma langue, mes voisins commencent à murmurer, et quelqu’un rit."
 latria_sexual_frustration_flavor.1406.desc: "Les convives partent, mais je parle toujours. Mes voisins échangent un regard, et quelqu’un à table ricane."
 latria_sexual_frustration_flavor.1406.a: "Poursuivre mon histoire et répondre devant toute la table à quiconque se moque."
 latria_sexual_frustration_flavor.1406.b: "Retenir ma langue, saluer la compagnie et prendre congé."

 latria_sexual_frustration_flavor.1407.t: "Prière après l’extinction des feux"
 latria_sexual_frustration_flavor.1407.desc.favors: "En chemise de nuit près du lit, je me rappelle que ma foi ne refuse pas les plaisirs de la chair. Dans la solitude, je ne sais toujours pas comment m’apaiser."
 latria_sexual_frustration_flavor.1407.desc.condemns: "Je resserre ma chemise de nuit et répète mon vœu de chasteté. La bougie se consume, mais le désir en moi ne s’éteint pas."
 latria_sexual_frustration_flavor.1407.desc: "Il ne reste dans la chambre qu’une bougie mourante, et je veille encore."
 latria_sexual_frustration_flavor.1407.a: "Écarter le vœu de chasteté et m’attarder sur cette affection."
 latria_sexual_frustration_flavor.1407.b: "Contenir mes pensées et réciter jusqu’à l’aube."

 latria_sexual_frustration_flavor.1408.t: "Silence devant le miroir"
 latria_sexual_frustration_flavor.1408.desc.lustful: "Sans vêtements, dans la solitude devant le miroir, je ne peux plus qualifier ce désir de pensée passagère. Je ne souhaite pas non plus le prétendre."
 latria_sexual_frustration_flavor.1408.desc.chaste: "Sans vêtements au bord du lit, je serre les mains. La chasteté reste mon choix, mais jamais ce choix n’a paru si difficile."
 latria_sexual_frustration_flavor.1408.desc: "Dans le calme, je regarde mon reflet et cesse d’éviter ce que j’ai sur le cœur."
 latria_sexual_frustration_flavor.1408.a: "Reconnaître ce désir et cesser de le fuir cette nuit."
 latria_sexual_frustration_flavor.1408.b: "M’habiller, m’asseoir au bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1409.t: "Un écart de tenue à la cour"
 latria_sexual_frustration_flavor.1409.desc: "Pendant une pause du conseil, je me déshabille dans la chambre voisine. Avant que je puisse passer ma robe, la porte de la salle du conseil s’ouvre. Les seigneurs se taisent et le greffier baisse les yeux ; ma voix se brise tandis que le domestique attend avec la robe."
 latria_sexual_frustration_flavor.1409.a: "Me tenir devant eux sans chercher à cacher mon écart."
 latria_sexual_frustration_flavor.1409.b: "Congédier les seigneurs et m’habiller avant de reprendre le conseil."

 latria_sexual_frustration_flavor.1410.t: "La nuit derrière la porte"
 latria_sexual_frustration_flavor.1410.desc.female: "En chemise de nuit, je m’assieds près de la porte et entends les pas s’éloigner dehors. À cette heure tardive, l’affection restée sans réponse me revient."
 latria_sexual_frustration_flavor.1410.desc.male: "En chemise de nuit, je m’appuie contre le lit, mon livre encore fermé. Le couloir est calme, mais le sommeil ne vient pas."
 latria_sexual_frustration_flavor.1410.desc: "La nuit est longue. Rien ne bouge derrière la porte, et mes pensées ne s’apaisent pas."
 latria_sexual_frustration_flavor.1410.a: "Écarter le livre et écrire une longue lettre."
 latria_sexual_frustration_flavor.1410.b: "Réprimer le désir, éteindre la lampe et m’allonger."

 latria_sexual_frustration_flavor.1401.c: "Faire un poème de l’invitation que je ne peux envoyer."
 latria_sexual_frustration_flavor.1402.c: "Payer les musiciens pour jouer aux convives restants."
 latria_sexual_frustration_flavor.1402.d: "Faire rester les convives pour parler de leurs anciens voyages."
 latria_sexual_frustration_flavor.1403.c: "Ouvrir les Écritures et chercher une réponse dans chaque passage."
 latria_sexual_frustration_flavor.1404.c: "Abandonner mon vœu de chasteté et suivre désormais mes désirs."
 latria_sexual_frustration_flavor.1404.d: "Passer ma chemise de nuit et attendre que mes pensées s’apaisent."
 latria_sexual_frustration_flavor.1405.c: "Faire de mon récit une lettre privée et la sceller dans un coffret."
 latria_sexual_frustration_flavor.1405.d: "Prêter un vœu de chasteté devant ces témoins."
 latria_sexual_frustration_flavor.1406.c: "Réciter un nouveau poème aux convives qui partent."
 latria_sexual_frustration_flavor.1407.c: "Fermer le livre de prières et examiner lentement mes sentiments."
 latria_sexual_frustration_flavor.1408.c: "Énumérer les devoirs du matin et ranger tous les documents."
 latria_sexual_frustration_flavor.1409.c: "M’habiller, regagner la table et régler chaque affaire de la cour."
 latria_sexual_frustration_flavor.1409.d: "M’habiller, faire une plaisanterie et inviter les seigneurs à se rasseoir."
 latria_sexual_frustration_flavor.1410.c: "Passer une robe, préparer du thé et attendre de pouvoir dormir."
