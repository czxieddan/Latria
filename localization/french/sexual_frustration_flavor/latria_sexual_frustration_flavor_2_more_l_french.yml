l_french:
 latria_sexual_frustration_flavor.1111.t: "La deuxième veille"
 latria_sexual_frustration_flavor.1111.desc: "Je m'éveille à la deuxième veille, le drap tordu autour d'un mollet. La lampe s'est consumée jusqu'à une flamme de la taille d'un pouce. Ma main est déjà bas sur mon ventre, réchauffée par mon propre corps, et je la retire.\n\nIl y eut un instant au crépuscule. Quelqu'un s'est penché par-dessus moi pour le sel, et un avant-bras a effleuré le dos de mon poignet, et ni l'un ni l'autre n'a bougé le temps d'un souffle. J'ai repassé ce souffle plus de fois que toute la conversation.\n\nJe presse ma paume à plat sur le matelas près de ma hanche. Le lin, là, est encore frais. Je le laisse frais."
 latria_sexual_frustration_flavor.1111.a: "Laisser ma main aller où elle veut."
 latria_sexual_frustration_flavor.1111.b: "Me retourner et attendre le sommeil."
 latria_sexual_frustration_flavor.1111.c: "Rester sans bouger et écouter la maison se poser."

 latria_sexual_frustration_flavor.1112.t: "La coupe entre nous"
 latria_sexual_frustration_flavor.1112.desc: "La coupe passe de main en main le long du banc, et quand elle m'arrive le bord est encore humide d'une autre bouche. Je bois là où est l'humide. À travers la table, quelqu'un me regarde le faire, sans détourner les yeux, et sans sourire non plus.\n\nNous parlons chevaux un moment, le prix d'une jument baie, le maréchal-ferrant au carrefour. Sous la table, un genou vient reposer contre le mien, sans poids derrière, seulement le contact, et je continue de parler chevaux.\n\nUn serviteur remplit la coupe. Le genou se retire pour saluer un oncle. Je tiens la coupe à deux mains et le vin a tiédi, et le banc près de moi reste vide le reste du repas."
 latria_sexual_frustration_flavor.1112.a: "Dire clairement ce que disait le genou."
 latria_sexual_frustration_flavor.1112.b: "Remercier la compagnie et partir tôt."
 latria_sexual_frustration_flavor.1112.c: "Rester et parler chevaux jusqu'à ce que la salle se vide."

 latria_sexual_frustration_flavor.1113.t: "Une danse de trop"
 latria_sexual_frustration_flavor.1113.desc: "La musique tourne et l'on me passe d'un partenaire à l'autre. Le troisième retient ma main un temps de plus que ne le demande la figure, le pouce pressé à l'intérieur de mon poignet, là où est le pouls, et sourit comme si c'était un accident. Je manque le pas suivant et le couvre d'un tour.\n\nQuelqu'un rit au bout de la salle. Je ne me retourne pas pour voir qui. Mon visage est brûlant et je sais que cela se voit à la lueur des chandelles, et les chandelles sont la seule lumière honnête de la pièce.\n\nLa danse s'achève. Je me tiens près du pilier, la main encore à demi close, la forme de ce pouce imprimée sur la peau, et les musiciens recommencent."
 latria_sexual_frustration_flavor.1113.a: "Boire à ce partenaire, bruyamment, devant toute la salle."
 latria_sexual_frustration_flavor.1113.b: "Saluer la compagnie et quitter la piste."
 latria_sexual_frustration_flavor.1113.c: "Trouver le coin le plus calme et respirer lentement."

 latria_sexual_frustration_flavor.1114.t: "Le long trajet de retour"
 latria_sexual_frustration_flavor.1114.desc: "La pluie sur les feuilles, et le cerf parti il y a une heure. Je chevauche à l'arrière, le bavardage des rabatteurs s'effaçant devant moi. Mes cuisses me font mal de la selle d'une façon qui ne me laissera pas oublier mon corps avant le soir, et la laine mouillée de mon manteau est froide au col.\n\nAu ruisseau, un cavalier retient ma bride, et la main reste sur la courroie après que le cheval s'est calmé. L'eau ruisselle au bout d'une tresse. Ni l'un ni l'autre ne parle de la pluie.\n\nNous chevauchons plus loin. Le cuir mouillé craque à chaque pas, et je compte les craquements au lieu de penser, et je perds le compte quelque part après le troisième champ."
 latria_sexual_frustration_flavor.1114.a: "Laisser la chasse courir jusqu'à ce que le jour baisse."
 latria_sexual_frustration_flavor.1114.b: "Garder les yeux sur la piste et les mains sur les rênes."
 latria_sexual_frustration_flavor.1114.c: "Lire le sol, les tiges brisées, l'empreinte d'un sabot."
 latria_sexual_frustration_flavor.1114.d: "Faire voler le faucon encore, et encore."

 latria_sexual_frustration_flavor.1115.t: "À genoux à la troisième heure"
 latria_sexual_frustration_flavor.1115.desc: "Je m'agenouille jusqu'à ce que mes genoux me fassent mal sur la pierre, et cette douleur est la seule chose que je puisse retenir dans mon attention. L'huile de la lampe a ranci. Mon corps ne veut pas se taire ce matin. Il veut, et il veut du côté de quelqu'un qui répare les poutres du toit et siffle en travaillant.\n\nJe dis l'office. Je le reprends du début parce que mon esprit a glissé à la quatrième ligne. Quelqu'un tousse derrière moi et je ne me retourne pas.\n\nLa pierre est froide à travers ma robe. Je reste à genoux après que les autres se sont levés, et le froid gagne mes mollets, et ce n'est pas assez."
 latria_sexual_frustration_flavor.1115.a: "Le nommer au confessionnal et faire pénitence ensuite."
 latria_sexual_frustration_flavor.1115.b: "Garder la veille jusqu'à la cloche."
 latria_sexual_frustration_flavor.1115.c: "Prendre le commentaire et lire jusqu'à la fin du chapitre."

 latria_sexual_frustration_flavor.1116.t: "Ce que l'aumônier n'a pas demandé"
 latria_sexual_frustration_flavor.1116.desc: "Mon aumônier longe le cloître à mes côtés et ne demande rien, ce qui est pire que de demander. Je parle du péché de paresse ; la réponse vient sur les moissons, la pluie venue en retard, le prix du seigle.\n\nSa manchette est effrangée. Je regarde les fils libres bouger tandis que la main gesticule et je pense au poignet dans la manche, puis de nouveau à la paresse, et je perds tout à fait les moissons. L'aumônier s'arrête de marcher pour me laisser le rattraper.\n\nÀ la porte, on me bénit. Je retiens cette main un instant au-delà de la bénédiction. On me laisse faire, puis on descend les marches deux à deux."
 latria_sexual_frustration_flavor.1116.a: "Tout lui dire."
 latria_sexual_frustration_flavor.1116.b: "Demander une pénitence et l'accomplir."
 latria_sexual_frustration_flavor.1116.c: "Écouter jusqu'au bout ce qu'on dit des moissons."

 latria_sexual_frustration_flavor.1117.t: "La pétition après le conseil"
 latria_sexual_frustration_flavor.1117.desc: "Le conseil se vide. Mon chancelier reste pour presser une pétition de plus, et j'entends la forme de sa bouche autour des mots plutôt que les mots. Le sceau est tiède de ma propre main et la cire n'a pas pris.\n\nDepuis le festin, je n'ai pas eu le moindre instant en tête à tête avec quiconque. La couronne est un poids sur la nuque, et la nuque veut un autre poids, une main là plutôt que l'or.\n\nJ'accorde la pétition. On s'incline. Je garde les yeux sur la carte jusqu'à ce que la porte se ferme, puis sur la porte, et la chandelle près de la carte se consume tandis que je reste là sans bouger."
 latria_sexual_frustration_flavor.1117.a: "Faire mander quelqu'un une fois les chandelles éteintes."
 latria_sexual_frustration_flavor.1117.b: "Tenir au travail jusqu'à ce que la pétition soit scellée."
 latria_sexual_frustration_flavor.1117.c: "Lire moi-même les trois pétitions suivantes."

 latria_sexual_frustration_flavor.1118.t: "Le vin de prune sur la terrasse"
 latria_sexual_frustration_flavor.1118.desc: "Du vin de prune, la troisième coupe, et les manches ne cessent de s'effleurer. Chez les miens, on parle en vers, chaque vers un pas de plus, et un serviteur se tient à la balustrade en feignant de ne pas écouter.\n\nJe laisse ma manche s'ouvrir au poignet. L'autre manche ne recule pas. Quelque part sous la terrasse, une flûte commence, s'arrête et recommence, les trois mêmes phrases.\n\nJe pose la coupe sur la balustrade, à demi finie, et le vin retient la fin du jour. Ni l'un ni l'autre n'a dit la chose claire. Un pétale se retourne sur la dalle. Le serviteur à la balustrade n'écoute toujours pas."
 latria_sexual_frustration_flavor.1118.a: "Répondre d'un vers qu'on ne peut méprendre."
 latria_sexual_frustration_flavor.1118.b: "Rajuster ma manche et parler du temps."
 latria_sexual_frustration_flavor.1118.c: "Parcourir la terrasse à l'écart jusqu'à ce qu'on allume les lampes."

 latria_sexual_frustration_flavor.1119.t: "La lampe laissée allumée"
 latria_sexual_frustration_flavor.1119.desc: "J'ai laissé la lampe allumée et le drap est descendu à ma taille. Ma main passe sur la peau chaude de mon ventre, plus bas, et cette fois je ne l'arrête pas. La moiteur est déjà là, venue de la pensée d'une bouche sur ma gorge au crépuscule, et mes doigts glissent aisément.\n\nJe pense au poids d'un corps sur le mien, son poids exact, et mes hanches se soulèvent pour ne rencontrer rien. Je presse et je tourne et mon souffle se fait rauque dans la chambre silencieuse. Le talon de ma main frotte là où je le veux.\n\nCela vient en un long frisson qui laisse ma cuisse tremblante. Après, je reste le bras en travers des yeux, la lampe encore allumée, le drap humide sous moi."
 latria_sexual_frustration_flavor.1119.a: "Le laisser s'achever et rester dans le noir humide."
 latria_sexual_frustration_flavor.1119.b: "Retirer ma main et compter les poutres."
 latria_sexual_frustration_flavor.1119.c: "Moucher la lampe et rester dans le noir."

 latria_sexual_frustration_flavor.1120.t: "La chambre du visiteur"
 latria_sexual_frustration_flavor.1120.desc: "On frappe après que la salle est plongée dans le noir, et quand j'ouvre la porte je suis en chemise de nuit et n'ai pas pris la peine de m'habiller pour quiconque. Je vois le regard qui parcourt mon corps et je ne tends pas la main vers un châle.\n\nNous ne feignons pas. Une bouche trouve ma gorge, mes mains sont à une ceinture, et quand on me soulève sur la table la coupe se renverse et roule. Le rythme est lent et je ne suis pas patient. J'entends ma propre voix, ce qui me surprend, et le rire contre mon cou, et le rythme ne change pas.\n\nAprès, le vin goutte du bord de la table au sol, une goutte à la fois. Ni l'un ni l'autre ne bouge pour l'essuyer."
 latria_sexual_frustration_flavor.1120.a: "Laisser la porte sans barre et garder la chemise de nuit."
 latria_sexual_frustration_flavor.1120.b: "Remercier avec bonté et fermer la porte."
 latria_sexual_frustration_flavor.1120.c: "M'asseoir au bord de la table et parler jusqu'à l'aube."

 latria_sexual_frustration_flavor.1121.t: "Derrière le paravent peint"
 latria_sexual_frustration_flavor.1121.desc: "Le festin a dépassé toute décence. On a tiré un paravent en travers du coin de la salle et le bruit qui vient de derrière n'est pas un bruit de repas. Une main se referme sur mon poignet et je me laisse entraîner, et les hérons peints sur le paravent passent assez près pour qu'on les touche.\n\nIl y a plus de mains que n'en a une seule personne. Je cesse de compter. Les joncs sont foulés à plat et une coupe roule contre mon genou et personne ne la ramasse.\n\nPlus tard, je me tiens contre le mur, les cheveux défaits et la bouche gonflée, un manteau d'inconnu sur les épaules. La musique ne s'est pas arrêtée."
 latria_sexual_frustration_flavor.1121.a: "Passer derrière le paravent et laisser la salle entendre."
 latria_sexual_frustration_flavor.1121.b: "Refuser et garder ma coupe et ma place."
 latria_sexual_frustration_flavor.1121.c: "Dresser le plateau et jouer jusqu'à ce que mes mains soient assurées."

 latria_sexual_frustration_flavor.1122.t: "Quatre mots d'un poème"
 latria_sexual_frustration_flavor.1122.desc: "La tablette est sur mes genoux et le calame a séché. J'ai écrit quatre mots d'un poème sur la courbe d'une épaule et aucun des quatre n'est juste. Le cinquième est pire.\n\nLa pièce est froide. Mon propre souffle y est bruyant. J'écarte la tablette et presse le dos de ma main contre ma bouche, et le désir ne va nulle part, il change seulement de forme et se pose plus bas.\n\nJe reprends le calame. Le vers reste inachevé et l'encre sèche dans la fente du roseau, et l'épaule du vers n'est encore qu'une épaule."
 latria_sexual_frustration_flavor.1122.a: "Écrire l'épaule, et le reste."
 latria_sexual_frustration_flavor.1122.b: "Fermer la tablette et rester les mains immobiles."
 latria_sexual_frustration_flavor.1122.c: "Lire quelque chose d'ennuyeux jusqu'à ce que la pièce ne soit qu'une pièce."
 latria_sexual_frustration_flavor.1122.d: "Réciter le vers inachevé au souper."

 latria_sexual_frustration_flavor.1123.t: "Le poids du faucon"
 latria_sexual_frustration_flavor.1123.desc: "Le faucon chaperonné se tient sur mon gant et son poids est la seule chose honnête de ce matin. Nous attendons dans l'herbe mouillée le héron. Mon épaule brûle et le cuir s'est gorgé d'eau au pouce.\n\nUn bras vient contre le mien tandis que nous nous accroupissons, et y reste. L'oiseau déplace ses pattes. Je garde les yeux sur les roseaux. Mon pouls est à mes oreilles, plus fort que le marais, et j'ai la certitude qu'on peut l'entendre.\n\nLe héron ne vient jamais. Nous rentrons, le faucon porté sur mon poing et l'herbe trempant mes bottes à la cheville, et ni l'un ni l'autre ne dit rien du bras."
 latria_sexual_frustration_flavor.1123.a: "Repartir chevaucher et chasser jusqu'à la nuit."
 latria_sexual_frustration_flavor.1123.b: "Rester immobile et laisser le marais se taire."
 latria_sexual_frustration_flavor.1123.c: "Lancer le faucon et ne regarder que le faucon."

 latria_sexual_frustration_flavor.1124.t: "Le tronc des aumônes"
 latria_sexual_frustration_flavor.1124.desc: "Je compte des pièces dans le tronc des aumônes et ce compte est une façon de ne pas penser. Du cuivre, surtout, et deux deniers d'argent du marchand de laine. Une main de donateur est dans le tronc près de la mienne, nos doigts parmi les pièces, et le prêtre nous observe tous deux depuis la troisième marche.\n\nJe n'ai pas confessé cela. Je ne sais quel nom je lui donnerais. Mon visage est composé. J'ai appris à composer mon visage devant un miroir.\n\nLa main se retire. Je ferme le couvercle et le petit verrou de laiton cliquette, et ma propre main n'est pas assurée sur la clé, et le prêtre est toujours sur la marche."
 latria_sexual_frustration_flavor.1124.a: "Payer une chandelle et laisser le prêtre voir mon visage."
 latria_sexual_frustration_flavor.1124.b: "Garder la veille jusqu'à ce que les chandelles coulent."
 latria_sexual_frustration_flavor.1124.c: "Relire le psautier en entier une fois de plus."

 latria_sexual_frustration_flavor.1125.t: "Conditions accordées à minuit"
 latria_sexual_frustration_flavor.1125.desc: "Nous sommes sur le traité depuis midi. Les chandelles ne sont plus que des bouts et on a laissé le feu s'éteindre. Mon vis-à-vis lit la dernière clause à voix haute et j'y consens sans l'entendre, à cause de la façon dont une mâchoire bouge autour d'une langue qui n'est pas la mienne.\n\nCe n'est pas la première nuit. Je connais la distance exacte à laquelle je deviens inutile, et nous sommes en deçà depuis la deuxième chandelle.\n\nJe signe. On signe. La cire est encore molle quand j'y presse mon anneau, et ma main est assurée, et le clerc emporte la page, et c'est là toute ma victoire."
 latria_sexual_frustration_flavor.1125.a: "Envoyer un mot quand la chambre sera vide."
 latria_sexual_frustration_flavor.1125.b: "M'en tenir à la clause, mot à mot."
 latria_sexual_frustration_flavor.1125.c: "Emporter le traité et lire chaque ligne."

 latria_sexual_frustration_flavor.1126.t: "L'herbe, le vent et un col ouvert"
 latria_sexual_frustration_flavor.1126.desc: "On a lâché les chevaux pour paître et nous sommes assis sur le feutre, les selles encore dessus. Le peuple de mon compagnon dit qu'un cavalier devrait pouvoir dormir en selle. Je n'arrive même pas à rester assis sans bouger sur le sol.\n\nOn parle d'un fleuve que je n'ai jamais vu, un fleuve à trois gués. Une chemise est ouverte à la gorge. Le vent couche l'herbe en longues brassées et je regarde la gorge au lieu du fleuve.\n\nUn cheval s'ébroue. Je détourne les yeux d'abord, et mes oreilles sont brûlantes dans le vent, et la conversation sur le fleuve continue sans moi."
 latria_sexual_frustration_flavor.1126.a: "Le dire tout haut, dans cette langue, mal."
 latria_sexual_frustration_flavor.1126.b: "Tenir ma langue et regarder les chevaux."
 latria_sexual_frustration_flavor.1126.c: "Chevaucher dur jusqu'à ce que le vent me l'ait ôté."

 latria_sexual_frustration_flavor.1127.t: "Le creux dans l'oreiller"
 latria_sexual_frustration_flavor.1127.desc.female: "Le lit est trop chaud et j'ai rejeté la couverture au sol. Ma chemise de nuit est retroussée à la hanche. J'y mets la main et mon corps répond avant que j'aie rien décidé, une chaleur vive en bas, plus insistante que moi.\n\nJe pense à la façon dont une certaine personne a dit mon nom dans le couloir, la deuxième syllabe tenue, la porte pas tout à fait refermée dans son dos. Mes doigts bougent et mon souffle se prend à cette syllabe tenue.\n\nJe m'arrête avant la fin. Je reste la main immobile et le cœur battant, et l'oreiller près de moi ne garde aucun creux."
 latria_sexual_frustration_flavor.1127.desc.male: "La couverture est au sol et ma chemise de nuit est retroussée à la hanche. Ma main descend et je suis déjà dur, de rien, d'un couloir et d'un nom et d'une porte laissée entrebâillée.\n\nJe pense à une bouche et mes hanches bougent d'elles-mêmes. Mon souffle se fait court. Je pourrais en finir en un instant et je ne le fais pas, et ce refus est une sorte de travail à lui seul.\n\nJe retire ma main et reste à plat. La chambre est très silencieuse et la douleur ne part pas, et l'oreiller près de moi est frais et je n'y touche pas."
 latria_sexual_frustration_flavor.1127.desc: "Le lit est trop chaud et la lampe est éteinte. J'ai rejeté la couverture et ma main s'égare, et mon corps répond aussitôt, plus insistant que moi, avant que j'aie décidé de le permettre.\n\nJe pense à un couloir, un nom prononcé deux fois, une manche retroussée au poignet. Le couloir est sombre à cette heure. Mon souffle se raccourcit et je laisse la pensée courir jusqu'à sa fin et pas au-delà.\n\nJe retire ma main et reste sans bouger. L'oreiller près de moi ne garde aucun creux, et la couverture reste au sol jusqu'au matin."
 latria_sexual_frustration_flavor.1127.a: "Laisser ma main où elle est."
 latria_sexual_frustration_flavor.1127.b: "Croiser les mains et dormir sur le côté."
 latria_sexual_frustration_flavor.1127.c: "Se lever et rester près du volet jusqu'à ce qu'il fasse jour."

 latria_sexual_frustration_flavor.1128.t: "Le toast"
 latria_sexual_frustration_flavor.1128.desc: "Je me lève pour porter le toast et la salle n'est qu'un flou de visages. Un visage n'est pas flou. Je parle de loyauté le temps d'une coupe et mes yeux reviennent sans cesse au même endroit, au-dessus de la troisième table.\n\nQuelqu'un tousse à la haute table. Les ragots seront aux cuisines avant qu'on débarrasse les assiettes, et je me découvre à m'en soucier moins que je ne devrais, ce qui est en soi une chose à répondre.\n\nJe me rassois. Ma main prend le pied de la coupe et le serre trop fort, et à travers la salle le visage est encore tourné vers moi."
 latria_sexual_frustration_flavor.1128.a: "Nommer la personne que je regardais et boire à sa santé."
 latria_sexual_frustration_flavor.1128.b: "Ne parler que de loyauté, et le penser."
 latria_sexual_frustration_flavor.1128.c: "Porter la coupe au bout de la table et m'asseoir avec un vieil ami."

 latria_sexual_frustration_flavor.1129.t: "Le commentaire du troisième chapitre"
 latria_sexual_frustration_flavor.1129.desc: "Mon aumônier lit le commentaire à voix haute et je suis la ligne du doigt sur la page. La voix fait la lecture. Mon doigt s'est arrêté de bouger, trois lignes sous la voix, sur la même page qu'il y a une heure.\n\nUne page se tourne et mon doigt est en travers. Le lecteur attend. Je ne le bouge pas. La chandelle entre nous penche et se redresse, et quelque part dans la maison une porte se ferme.\n\nLa lecture continue. J'ai tout à fait perdu l'argument du troisième chapitre, et la pièce sent la cire et l'encre, et le doigt est encore là où il était."
 latria_sexual_frustration_flavor.1129.a: "Confesser la distraction et faire pénitence."
 latria_sexual_frustration_flavor.1129.b: "Demander une règle plus stricte et la garder."
 latria_sexual_frustration_flavor.1129.c: "Suivre la ligne de nouveau depuis le haut de la page."

 latria_sexual_frustration_flavor.1130.t: "Ce que j'ai dit à mon ami"
 latria_sexual_frustration_flavor.1130.desc: "Je dis à mon ami le tout, le couloir et le poignet et la coupe, et mon ami écoute, un menton sur une main, sans une fois regarder la porte. Le vin entre nous est resté intact. Le dire tout haut est un soulagement et ne change rien.\n\nPuis une main se referme sur mon épaule, amicale, et y reste. Je regarde la carte. La campagne peut attendre une saison ; le fleuve n'a pas bougé.\n\nMon ami s'en va. Je reste avec les pions de la campagne devant moi, de bois, sentant la boîte, et j'en déplace un, puis le remets là où il était."
 latria_sexual_frustration_flavor.1130.a: "Dire le reste et ne rien demander."
 latria_sexual_frustration_flavor.1130.b: "Ne rien dire de plus et redresser les pions."
 latria_sexual_frustration_flavor.1130.c: "Peser plutôt la campagne, et la bien mener."

 latria_sexual_frustration_flavor.1131.t: "La chaleur qui demeure"
 latria_sexual_frustration_flavor.1131.desc: "Un rêve me laisse dans la chaleur et je m'éveille, la chemise de nuit retroussée à ma taille. Ma propre main en a été la cause. Je reste sans bouger et laisse la chambre revenir, le sol froid, la lampe mourante, et la chaleur ne part pas avec le rêve.\n\nC'était l'enfant de l'intendant, ou quelqu'un avec cette bouche-là. Cette personne me tenait le poignet plaqué au lit et n'était pas pressée, et je me rappelle le poids exact de ce corps, la façon dont le matelas nous a pris tous deux. Jamais, dans la veille, un tel regard n'est venu de cette personne.\n\nJe tire la chemise de nuit sur mes hanches. Le tissu est humide là où j'ai dormi. Je tourne le visage vers le mur et la chaleur reste sous la couverture, patiente, attendant que je lui cède."
 latria_sexual_frustration_flavor.1131.a: "Laisser ma main revenir où elle veut."
 latria_sexual_frustration_flavor.1131.b: "Rajuster la chemise de nuit et attendre l'aube."
 latria_sexual_frustration_flavor.1131.c: "Penser aux plaisanteries du souper et laisser mon souffle ralentir."

 latria_sexual_frustration_flavor.1132.t: "La troisième chandelle"
 latria_sexual_frustration_flavor.1132.desc: "Je m'agenouille jusqu'à ce que mes genoux me fassent mal et cette douleur ne suffit pas à m'éclaircir la tête. Le temple est vide passé la troisième chandelle. Dans le noir derrière mes yeux, le même corps ne cesse de revenir, et ce n'est pas celui du dieu.\n\nLes mains d'un pèlerin, il y a des semaines, pliant une couverture sur mes épaules au bord du chemin. Le frôlement de jointures à ma gorge. J'ai chassé cette image par la prière cent fois et elle revient chaque nuit plus nette, la chaleur de la paume d'un inconnu là où le col s'ouvre.\n\nJe presse mon front contre mes mains jointes. La pierre est froide. Mon souffle ne l'est pas. Je reste à genoux tandis que la dernière chandelle raccourcit, et je ne demande pas pardon, seulement que le tremblement de mes cuisses s'arrête avant que je me lève."
 latria_sexual_frustration_flavor.1132.a: "Nommer la pensée et la laisser brûler jusqu'au bout."
 latria_sexual_frustration_flavor.1132.b: "Se lever et garder la veille jusqu'à ce que le corps soit épuisé."
 latria_sexual_frustration_flavor.1132.c: "Me tenir à la chaleur de ces mains comme à un réconfort."

 latria_sexual_frustration_flavor.1133.t: "Sous la corniche"
 latria_sexual_frustration_flavor.1133.desc: "La pluie encore, et la chasse éparpillée. Je m'abrite sous une corniche de rocher avec le maître des chiens, trempés tous deux jusqu'aux os, et le froid fait de chaque endroit où nous nous touchons un petit feu. Son bras est contre le mien de l'épaule au poignet et j'ai cessé de feindre de ne pas le remarquer.\n\nCette personne dit quelque chose de l'orage. Je réponds sur l'orage. Sa main trouve le creux de mes reins pour m'affermir sur la pierre mouillée et y reste, répandue, chaude à travers la laine trempée, et mon souffle se fait court d'une façon que le froid ne peut excuser.\n\nLa pluie ne faiblit pas. Son pouce bouge une fois contre ma colonne. Je garde les yeux sur le rideau gris de l'eau et ne m'écarte pas, et la corniche est trop étroite pour autre chose que ceci."
 latria_sexual_frustration_flavor.1133.a: "Rester sous la pluie un peu plus longtemps."
 latria_sexual_frustration_flavor.1133.b: "M'écarter et regarder tomber l'eau."
 latria_sexual_frustration_flavor.1133.c: "Attendre la fin de l'orage, puis rentrer à l'écart."

 latria_sexual_frustration_flavor.1134.t: "Le laçage que je n'ai jamais dénoué"
 latria_sexual_frustration_flavor.1134.desc: "Le conseil est fini et l'étude est à moi. Je verse un vin que je ne veux pas et le souvenir vient quand même, sans y être invité, la bouche de l'envoyé au festin du traité, la façon dont cette personne a léché une goutte sur son pouce pendant que les scribes discutaient des frontières.\n\nJe pose la coupe. Ma main va aux laçages de ma gorge et s'arrête. Dans le souvenir, les doigts sont vifs et sûrs et je ne m'y oppose pas, je m'appuie à la table pour ne pas glisser, et toute la salle n'est qu'un flou de fumée de chandelle derrière.\n\nJe relace le laçage que je n'ai jamais dénoué. Le vin reste intact et la pièce est très silencieuse, et mon pouls est bruyant à mes oreilles comme quelqu'un qui frappe à une porte que je n'ai pas ouverte."
 latria_sexual_frustration_flavor.1134.a: "Reconnaître clairement de quelle bouche je pense."
 latria_sexual_frustration_flavor.1134.b: "Moucher la chandelle et aller au lit à l'écart."
 latria_sexual_frustration_flavor.1134.c: "Dresser une partie d'échecs et me ressaisir."

 latria_sexual_frustration_flavor.1135.t: "La mesure lente"
 latria_sexual_frustration_flavor.1135.desc: "Les musiciens prennent un air lent et une main se referme sur la mienne avant que je puisse la refuser. Nous tournons ensemble près de l'estrade, serrés, plus serrés que ne le demande la figure, et la personne qui me tient sent le vin, le feu de bois et quelque chose de plus chaud dessous.\n\nUne cuisse glisse entre les miennes à la volte et y reste un demi-temps de trop. Je garde le visage composé pour la salle. Sous la musique, j'entends ma propre respiration, et je sais que l'autre l'entend aussi, car sa bouche s'incurve et ne s'ouvre pas.\n\nLa danse s'achève. Nous ne nous séparons pas aussitôt. Un pouce suit la couture de ma paume, lent, délibéré, une question sans un mot dessus. Les musiciens recommencent et je n'ai pas répondu, et ma main est encore dans la sienne."
 latria_sexual_frustration_flavor.1135.a: "Suivre l'air et danser la mesure suivante."
 latria_sexual_frustration_flavor.1135.b: "Retirer ma main et m'écarter dans la foule."
 latria_sexual_frustration_flavor.1135.c: "Rester dans la chaleur et écouter l'air jusqu'au bout."

 latria_sexual_frustration_flavor.1136.t: "Le pavillon au crépuscule"
 latria_sexual_frustration_flavor.1136.desc: "Le pavillon sent l'oud et l'écorce d'orange, et les serviteurs ont laissé le sorbet suer dans sa coupe d'argent. Une qasida court à demi dite entre nous, chaque vers un échelon, et ni l'un ni l'autre ne gravit le dernier.\n\nLe crépuscule fait de l'eau de la fontaine la couleur du thé. La personne que je veux lève la coupe et ne boit pas, seulement me regarde par-dessus le bord, et ces yeux sont toute la fin du poème.\n\nJe prends la coupe de sa main, bois là où a été sa bouche, et la repose. Le joueur d'oud attend. Personne n'a dit le dernier vers."
 latria_sexual_frustration_flavor.1136.a: "Appeler l'oud et laisser la chanson le dire."
 latria_sexual_frustration_flavor.1136.b: "Remercier la compagnie et prendre congé."
 latria_sexual_frustration_flavor.1136.c: "Rester, et laisser le silence être bonne compagnie."

 latria_sexual_frustration_flavor.1137.t: "Derrière le paravent sculpté"
 latria_sexual_frustration_flavor.1137.desc: "Le murmure de la fontaine emplit la cour, et un muwashshah court de ma bouche sur les sourcils de l'aimé, la façon dont ils s'arquent, dont ils retombent. L'aimé est assez près pour corriger mon mètre.\n\nDerrière le paravent sculpté, la lumière vient en petites étoiles. Une épaule est contre la mienne, chaude à travers deux couches de soie, et le poème a tout à fait abandonné son sujet.\n\nJe laisse le dernier vers inachevé. Le paravent nous garde de la cour et ne nous montre à personne, et l'eau continue de tomber."
 latria_sexual_frustration_flavor.1137.a: "Achever le vers dans un murmure pour une seule personne."
 latria_sexual_frustration_flavor.1137.b: "Me redresser et parler de la réparation de la fontaine."
 latria_sexual_frustration_flavor.1137.c: "Parcourir l'arcade à l'écart jusqu'à ce qu'on allume les lampes."

 latria_sexual_frustration_flavor.1138.t: "La fête des branches vertes"
 latria_sexual_frustration_flavor.1138.desc: "Ma foi appelle le corps un don, et une fois l'an nous suspendons le temple de branches vertes et le pensons. La fête est ce soir. Je me rappelle celle de l'an dernier, une main dans la mienne sous les rameaux, l'encens, la bénédiction dite sur nous comme un dais.\n\nLa personne que je veux se tient à travers le temple, une branche verte au poing, et le prêtre allume déjà la première lampe. Mon sang n'est pas calme, et ma foi ne lui demande pas de l'être.\n\nJe me tiens au souvenir des branches de l'an dernier jusqu'à ce que mes mains soient assurées, et l'odeur verte est partout."
 latria_sexual_frustration_flavor.1138.a: "M'avancer et laisser la bénédiction tomber sur nous deux."
 latria_sexual_frustration_flavor.1138.b: "Garder la veille de la nuit jusqu'à ce que les branches se fanent."
 latria_sexual_frustration_flavor.1138.c: "Lire le rite de l'union jusqu'au bout."

 latria_sexual_frustration_flavor.1139.t: "Une journée à l'hippodrome"
 latria_sexual_frustration_flavor.1139.desc: "La poussière plane sur l'hippodrome et les factions rugissent pour leurs couleurs. Des icônes passent devant ma loge, portées sur des perches, et l'encens perce l'odeur des chevaux et du sable chaud.\n\nUn aurige prend le tour bas, lève les yeux vers les gradins et me trouve. Le regard tient un temps de plus que la course et promet plus que la course ne le pourrait jamais. Ma main se serre sur la rambarde.\n\nLa poussière retombe. Les factions s'éraillent. Je regarde encore la piste où le char est allé, et l'encens s'est consumé en cendre."
 latria_sexual_frustration_flavor.1139.a: "Dire tout haut de qui je tiens le regard."
 latria_sexual_frustration_flavor.1139.b: "Me renverser et laisser la course n'être qu'une course."
 latria_sexual_frustration_flavor.1139.c: "Laisser la chaude rumeur de la foule suffire."

 latria_sexual_frustration_flavor.1140.t: "L'enseignement du père du désert"
 latria_sexual_frustration_flavor.1140.desc: "Le père du désert enseigne que le corps est l'ennemi, et je porte une haire sous ma robe pour prouver que je l'ai entendu. Le poil me pique au col à chaque souffle. Sa voix est sèche comme le wadi et deux fois plus patiente.\n\nIl appelle la prière un feu qui refroidit le sang. Le mien ne refroidit pas. Derrière mes yeux clos, ce n'est pas l'ennemi que je vois mais la personne que je veux, et la haire me scie la gorge.\n\nJe baisse la tête et reprends la prière du début, et les mots n'éteindront pas ce qui brûle."
 latria_sexual_frustration_flavor.1140.a: "Me lever et laisser l'ancienne loi nommer ce que je ressens."
 latria_sexual_frustration_flavor.1140.b: "M'agenouiller et laisser la haire faire son œuvre."
 latria_sexual_frustration_flavor.1140.c: "Suivre l'enseignement du père ligne à ligne."
