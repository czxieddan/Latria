 latria_sexual_frustration_flavor.1311.t: "Avant que la maisonnée s'éveille"
 latria_sexual_frustration_flavor.1311.desc: "Je m'éveille avant la maisonnée, la chemise de nuit retroussée au-delà de mes cuisses et la main déjà pressée entre elles. Je ne la retire pas. Le rêve est encore sur moi, le poids de quelqu'un qui n'était pas dans cette chambre, et mon corps veut achever ce que le rêve a commencé.\n\nJe garde les yeux clos et le laisse continuer, mon souffle se raccourcissant, le talon de ma main tenant le rythme lent que j'ai appris à présent. Il y a un nom derrière mes dents. Je ne le dis pas, pas avec les planches du couloir qui craquent sous le pas d'un serviteur.\n\nQuand cela se brise, je reste sans bouger, les doigts humides et le drap mouillé sous ma hanche. Le pas dépasse la porte et s'éloigne. Je tire la chemise de nuit vers le bas et le tissu colle."
 latria_sexual_frustration_flavor.1311.a: "Le laisser s'achever, puis m'habiller pour le jour."
 latria_sexual_frustration_flavor.1311.b: "Retirer ma main et rester sans bouger jusqu'à la cloche."
 latria_sexual_frustration_flavor.1311.c: "Se lever, se laver et rester un moment avec la douleur."

 latria_sexual_frustration_flavor.1312.t: "La greffe sur le poirier"
 latria_sexual_frustration_flavor.1312.desc: "Le jardin est encore mouillé de la pluie de la nuit, et la personne que j'évite depuis toute la semaine me montre la nouvelle greffe sur le poirier. Ses doigts se referment sur les miens pour les faire glisser le long de l'entaille. Ni l'un ni l'autre ne lâche, une fois la démonstration finie.\n\nJe sens le pouls dans ce pouce contre mon poignet. Derrière la haie, deux de ma maisonnée se disputent au sujet d'une selle. Si je tournais un peu la tête, et cette personne la sienne, nous ferions quelque chose que personne ne pourrait prendre pour de l'horticulture.\n\nLa greffe prendra d'ici l'automne, dit-on. La main est encore sur la mienne. Une branche goutte sur ma manche et je ne l'essuie pas."
 latria_sexual_frustration_flavor.1312.a: "Dire clairement ce que je veux, ici sous l'arbre."
 latria_sexual_frustration_flavor.1312.b: "Remercier pour la leçon et reculer d'un pas."
 latria_sexual_frustration_flavor.1312.c: "Rester et lui dire plutôt une chose vraie."

 latria_sexual_frustration_flavor.1313.t: "À travers la table"
 latria_sexual_frustration_flavor.1313.desc: "Les coupes ont fait deux fois le tour et la salle est assez bruyante pour que personne n'écoute quiconque. Voilà une heure que je regarde le même invité à travers la table, la ligne de sa gorge quand on rit.\n\nJe pourrais le dire. Pas le tout, seulement assez pour qu'on sache que je ne parle pas du temps. Mon voisin l'entendrait. L'intendant au bout de la table aussi, qui répète à la maisonnée tout ce qu'on lui dit.\n\nL'invité tourne sa coupe par le pied et me regarde par-dessus. J'ouvre la bouche. Les musiciens reprennent et ce que j'aurais pu dire passe sous le tambour."
 latria_sexual_frustration_flavor.1313.a: "Le dire assez fort pour être entendu."
 latria_sexual_frustration_flavor.1313.b: "Tenir ma langue et laisser le vin faire son œuvre."
 latria_sexual_frustration_flavor.1313.c: "Me tourner vers mon voisin et en faire un jeu."

 latria_sexual_frustration_flavor.1314.t: "Le premier mot"
 latria_sexual_frustration_flavor.1314.desc: "J'ai passé assez de temps à genoux sur la pierre froide pour que les dalles se soient imprimées dans mes mollets, et les mots ont cessé d'être des mots. Mon esprit revient sans cesse à une bouche que je n'ai pas à me rappeler dans ce bâtiment, à la façon dont elle s'est ouverte, au son qui en est sorti.\n\nMon guide attend au lutrin avec la patience de qui a entendu toutes les confessions qu'il y a. Je pourrais le dire. Le dire serait une porte que je ne pourrais plus refermer, et mon corps veut cette porte laissée ouverte, cette nuit, la lampe encore allumée.\n\nJ'en arrive au premier mot. La chandelle entre nous penche dans un courant d'air et je regarde la cire couler sur le fer et durcir là."
 latria_sexual_frustration_flavor.1314.a: "Le dire et laisser le temple me juger."
 latria_sexual_frustration_flavor.1314.b: "Garder la confession et faire la pénitence."
 latria_sexual_frustration_flavor.1314.c: "Demander un livre et lire jusqu'à ce que le tremblement cesse."
 latria_sexual_frustration_flavor.1314.d: "Garder la veille jusqu'au matin."

 latria_sexual_frustration_flavor.1315.t: "Les fourrés d'aulnes"
 latria_sexual_frustration_flavor.1315.desc: "La chasse s'est éparpillée et j'ai couru après un sanglier qui n'y était pas. La personne avec qui je voulais être seul me trouve dans les fourrés d'aulnes, mes chausses ouvertes et la main sur moi, et ne se détourne pas.\n\nOn s'agenouille dans les feuilles mouillées. J'ai une main dans ses cheveux et l'autre appuyée à un tronc, et les cors sonnent quelque part à l'est, assez près pour que nous ne devrions pas. Ni l'un ni l'autre ne s'arrête. On me prend dans sa bouche et je dois mordre l'intérieur de ma joue pour me taire.\n\nAprès, mes genoux sont crottés et il y a une feuille collée à ma cuisse. On s'essuie la bouche du revers du poignet et on dit que le sanglier est parti vers le nord."
 latria_sexual_frustration_flavor.1315.a: "Laisser la chasse continuer sans moi."
 latria_sexual_frustration_flavor.1315.b: "Remonter en selle et mériter ma place."
 latria_sexual_frustration_flavor.1315.c: "Lire le sol et suivre les traces."

 latria_sexual_frustration_flavor.1316.t: "Le sceau de travers"
 latria_sexual_frustration_flavor.1316.desc: "Le conseil est sur la même pétition depuis une heure et je n'ai rien signé. Sous la table, mes mains sont dans mon giron, et je pense à la dernière nuit de la campagne, à la tente, à la personne qui est entrée sans frapper et n'est repartie qu'à la relève.\n\nMon chancelier demande si j'y consens. Je dis que oui, et n'ai aucune idée de ce à quoi j'ai consenti. Le sceau est tiède de mon anneau. Je le presse dans la cire et la marque sort de travers, les lettres doublées sur un bord.\n\nOn sort en file avec ses papiers. Je reste dans le fauteuil, le sceau de travers devant moi et la pièce sentant encore la chandelle des autres."
 latria_sexual_frustration_flavor.1316.a: "Faire mander la personne à qui je pense, sceau et tout."
 latria_sexual_frustration_flavor.1316.b: "Poser le sceau et revenir aux pétitions."
 latria_sexual_frustration_flavor.1316.c: "Rappeler le conseil et finir le travail."

 latria_sexual_frustration_flavor.1317.t: "Une ligne dans la marge"
 latria_sexual_frustration_flavor.1317.desc: "La salle d'examen est balayée et silencieuse et il n'y a que moi avec les commentaires. Les caractères ne veulent pas tenir en place. J'ai lu quatre fois la même ligne sur la retenue, et chaque fois il s'est agi d'une paire de mains que j'ai lâchées trop tard, dans un couloir, une lampe approchant.\n\nDe ma propre main, dans la marge, j'ai écrit une ligne de vers qui n'est pas du tout un commentaire. Si mon examinateur la voyait, on saurait à quoi elle sert, et pour qui. Je pourrais brûler la page. Le brasero est à trois pas et les braises sont encore rouges.\n\nJe recopie la ligne, plus soigneusement, et le pinceau tremble au dernier trait."
 latria_sexual_frustration_flavor.1317.a: "Recopier le vers et le laisser lire."
 latria_sexual_frustration_flavor.1317.b: "Fermer le livre et dormir sur la natte."
 latria_sexual_frustration_flavor.1317.c: "Revenir aux commentaires et recommencer."
 latria_sexual_frustration_flavor.1317.d: "Mettre le vers sur l'air que chantent les courtisans."

 latria_sexual_frustration_flavor.1318.t: "Deux coupes dans la cour"
 latria_sexual_frustration_flavor.1318.desc: "Le festin s'est vidé dans la cour et mon plus vieil ami m'a suivi dehors avec deux coupes. Je n'ai rien dit à personne, ni prêtre, ni serviteur, ni la personne concernée. Ce soir, le vin a rendu le non-dit lourd, comme une coupe pleine est lourde.\n\nJe pourrais le mettre dans ses mains et le laisser en porter une part. On ne rirait pas. On n'oublierait pas non plus, et chaque fois qu'on me regarderait à travers une salle, il y aurait ceci entre nous, une chose avec un nom.\n\nOn me tend une coupe et on attend, et la fontaine continue de couler derrière. Je la bois et la glace craque et se pose."
 latria_sexual_frustration_flavor.1318.a: "Le dire tout haut et le laisser garder."
 latria_sexual_frustration_flavor.1318.b: "En faire le serment et le penser pour ce soir."
 latria_sexual_frustration_flavor.1318.c: "Lire pour cette personne jusqu'à ce que la cour se vide."

 latria_sexual_frustration_flavor.1319.t: "Le mur du jardin"
 latria_sexual_frustration_flavor.1319.desc: "On a le dos au mur du jardin, les jupes retroussées au-dessus des hanches, et ma main est entre ses cuisses, là où quiconque suit le sentier pourrait voir. L'humide est déjà là, et ce depuis le couloir.\n\nJe glisse deux doigts et l'on me saisit le poignet et l'on m'y tient, plus fort, le front contre mon épaule. Le souffle se fait rauque. De l'autre côté du mur, un jardinier travaille encore, la lame d'une bêche sonnant sur les pierres.\n\nOn frissonne et les ongles se referment sur mon bras. Quand on peut tenir debout, on lisse ses jupes et l'on dit mon nom une fois, tout bas, comme une question à laquelle on a déjà répondu."
 latria_sexual_frustration_flavor.1319.a: "Rester avec cette personne jusqu'à ce qu'on puisse marcher."
 latria_sexual_frustration_flavor.1319.b: "Reprendre ma main et souhaiter le bonsoir."
 latria_sexual_frustration_flavor.1319.c: "Faire à l'écart le long tour du mur."

 latria_sexual_frustration_flavor.1320.t: "Un catalogue"
 latria_sexual_frustration_flavor.1320.desc: "Au temple, je venais m'en défaire, et voilà qu'à genoux je le catalogue : l'odeur d'un certain cou, le son que fait une certaine personne, le poids exact d'un corps contre le mien dans une embrasure, une main à plat sur le chambranle.\n\nMon guide est éveillé et lit. Je pourrais demander une pénitence et on m'en donnerait une, et je l'accomplirais, et à la troisième nuit je serais de retour sur cette pierre avec la même liste, plus longue.\n\nJe demande plutôt un livre. On m'en donne un sans un mot, marquant sa page du pouce, et je le tiens ouvert et ne lis pas une ligne."
 latria_sexual_frustration_flavor.1320.a: "Tout nommer et laisser le temple répondre."
 latria_sexual_frustration_flavor.1320.b: "Demander la pénitence et garder ma liste."
 latria_sexual_frustration_flavor.1320.c: "Écouter ce qu'on veut bien me dire."

 latria_sexual_frustration_flavor.1321.t: "Trois semaines sur la route"
 latria_sexual_frustration_flavor.1321.desc: "Nous voilà trois semaines sur la route et je n'ai pas eu un instant seul avec quiconque depuis la dernière ville. Mon cheval est dessellé, le feu est bas, et les autres dorment dans leurs manteaux à portée de bras de moi, assez près pour que j'en entende un grincer des dents.\n\nJ'ai la main dans ma chemise et les dents dans ma propre jointure, et j'écoute les chevaux bouger et les bottes de la sentinelle dans les feuilles. Cela prend longtemps, et quand c'est fini je ne suis pas satisfait, seulement las, et le désir est encore là sous la lassitude.\n\nLa sentinelle repasse près du feu et ne me regarde pas. Je tire mon manteau et regarde les braises devenir grises."
 latria_sexual_frustration_flavor.1321.a: "Prendre ce que la nuit permet et dormir."
 latria_sexual_frustration_flavor.1321.b: "Se lever et prendre mon tour de garde."
 latria_sexual_frustration_flavor.1321.c: "M'exercer seul jusqu'à ce que mes bras tremblent."

 latria_sexual_frustration_flavor.1322.t: "La coupe de l'envoyé"
 latria_sexual_frustration_flavor.1322.desc: "La table de l'ambassade est dressée pour douze et j'ai pris place auprès de leur envoyé, dont le peuple a une coutume d'hospitalité à laquelle je pense depuis les présentations, à travers le poisson, à travers le deuxième service.\n\nL'envoyé remplit ma coupe de ses propres mains, ce qui ne plaît pas à son intendant. Si je disais ce qu'il ne faut pas ici, ce serait dans une dépêche au prochain navire, en mon nom, d'une main qui n'est pas la mienne. Si je disais ce qu'il faut, ce serait aussi dans une dépêche, et lu à voix haute dans une pièce où je n'entrerai jamais.\n\nOn me pose une question sur nos coutumes de mariage. J'y réponds mal. La chandelle s'est consumée jusqu'au godet et ni l'un ni l'autre n'en a réclamé une autre."
 latria_sexual_frustration_flavor.1322.a: "Répondre comme leur coutume le permet."
 latria_sexual_frustration_flavor.1322.b: "Souhaiter la bonne nuit et partir."
 latria_sexual_frustration_flavor.1322.c: "Porter la conversation sur le traité et l'y tenir."

 latria_sexual_frustration_flavor.1323.t: "Le chœur dans la tribune"
 latria_sexual_frustration_flavor.1323.desc: "Le chœur répète dans la tribune et je suis censé entendre l'harmonie et non la bouche du prêtre qui le mène, la façon dont on façonne la troisième ligne.\n\nJ'ai pris l'habitude d'arriver tôt et de partir tard. Le chant fait à ce qui me serre la poitrine ce que la prière ne fait pas, et je sais ce qu'il remplace. Mon guide a remarqué l'heure que je garde et n'en a rien dit, ce qui est pire qu'un reproche, car cela veut dire qu'on attend.\n\nLa dernière note meurt là-haut dans la voûte. Je reste dans le banc, les mains à plat sur mes genoux, jusqu'à ce que le sacristain vienne avec ses clés."
 latria_sexual_frustration_flavor.1323.a: "Chanter avec eux et laisser le son l'emporter."
 latria_sexual_frustration_flavor.1323.b: "Garder la règle et partir avant le dernier verset."
 latria_sexual_frustration_flavor.1323.c: "Étudier plutôt la mise en musique avec mon guide."

 latria_sexual_frustration_flavor.1324.t: "La cloche du matin"
 latria_sexual_frustration_flavor.1324.desc: "Je m'éveille empêtré dans les draps avec le tout encore sur moi, ma chemise de nuit remontée sous mes bras, et ma main entre mes jambes avant même que la conscience me revienne. Le rêve s'en va et je le poursuis, les hanches se soulevant, et peu m'importe qui est dans la pièce voisine ou quelle heure la cloche sonne.\n\nCela vient en un élan qui laisse ma cuisse tremblante. Je reste là, les doigts encore en moi et le souffle bruyant dans le silence, et le drap est trempé sous moi, déjà froid là où l'air l'atteint.\n\nLa cloche de l'office du matin commence. Je tire le drap mouillé et le mets dans la cuvette, et l'eau se trouble."
 latria_sexual_frustration_flavor.1324.a: "Achever, me laver et répondre à la cloche."
 latria_sexual_frustration_flavor.1324.b: "Arracher le drap et partir sans me laver."
 latria_sexual_frustration_flavor.1324.c: "M'asseoir à la tablette jusqu'à ce que mes mains soient assurées."

 latria_sexual_frustration_flavor.1325.t: "La porte"
 latria_sexual_frustration_flavor.1325.desc: "On joue dans le coin et j'ai perdu trois manches parce que je ne cesse de regarder la porte. La personne que j'attends est en retard, et chacun dans cette salle sait qui je suis, et qui est mon conjoint, et lequel m'observe.\n\nJe pourrais me lever sur le banc et le dire. La pièce se ferait silencieuse comme le font les pièces, et au matin ce serait dans chaque salle d'ici à la côte, mon nom attaché et le nom de ma famille après, et les deux noms ne seraient plus séparés.\n\nLa porte s'ouvre. C'est un serviteur avec du vin. Je tends ma coupe et ma main est assurée, ce qui est pire."
 latria_sexual_frustration_flavor.1325.a: "Me lever et le dire à toute la salle."
 latria_sexual_frustration_flavor.1325.b: "Rester sur mon banc et laisser la partie continuer."
 latria_sexual_frustration_flavor.1325.c: "Trouver mon ami et m'asseoir plutôt avec lui."

 latria_sexual_frustration_flavor.1326.t: "Les comptes"
 latria_sexual_frustration_flavor.1326.desc: "L'intendant a étalé les comptes, la carte et la liste de mes obligations, et je n'en ai lu aucun. Je pense à une porte dans une ville que j'ai traversée au printemps, et à la façon dont quelqu'un a dit mon nom dans le noir derrière, deux fois, avant que le loquet se lève.\n\nIl y a beaucoup à faire et c'est moi qui dois le faire. Je trempe la plume et écris le premier chiffre et il est faux, et je le biffe si fort que la pointe se fend et que l'encre va en travers de la colonne.\n\nJe taille la plume et recommence. Dehors, la garnison s'exerce et les cris marquent la cadence."
 latria_sexual_frustration_flavor.1326.a: "Laisser les comptes et faire mander cette ville."
 latria_sexual_frustration_flavor.1326.b: "Poser la plume et prendre le registre."
 latria_sexual_frustration_flavor.1326.c: "Écouler la liste jusqu'à ce que les chandelles coulent."

 latria_sexual_frustration_flavor.1327.t: "La hauteur"
 latria_sexual_frustration_flavor.1327.desc: "Nous chevauchons depuis l'aube et l'herbe est vide dans toutes les directions, pas un arbre, pas un cavalier, rien jusqu'au bord du ciel. Mon corps se plaint depuis le deuxième jour en selle, et la chevauchée elle-même n'a rien fait pour le calmer ; elle n'a fait qu'empirer.\n\nJe m'arrête au sommet de la hauteur, mets la main dans mes chausses et en finis en quelques gestes durs, le vent au visage et personne en vue, le cheval bougeant sous moi tout du long.\n\nJe noue le cordon et descends vers eux. Mon cousin demande pourquoi je souris et je lui dis que le cheval est bon."
 latria_sexual_frustration_flavor.1327.a: "Prendre l'instant que la steppe me donne."
 latria_sexual_frustration_flavor.1327.b: "Chevaucher et me le sortir de l'esprit."
 latria_sexual_frustration_flavor.1327.c: "Faire voler le faucon jusqu'à ce que mes bras soient las."

 latria_sexual_frustration_flavor.1328.t: "Vigile"
 latria_sexual_frustration_flavor.1328.desc: "Je suis au temple depuis l'office et j'y suis encore. La lampe a été remplie deux fois et l'huile sent la presse bon marché. Mes genoux sont passés de la douleur à une sorte d'engourdissement et le désir n'est parti nulle part ; il s'est installé et s'est mis à l'aise.\n\nLa vigile est censée vider une personne. Elle a donné de la place au désir à la place, comme une chambre noire donne une forme à ce qui s'y tient. Je pourrais partir. La porte n'est pas verrouillée et la ville n'est pas loin.\n\nJe reprends le psaume depuis le début. Ma voix sort assurée et je la déteste un peu."
 latria_sexual_frustration_flavor.1328.a: "Rompre la vigile et sortir dans la ville."
 latria_sexual_frustration_flavor.1328.b: "Garder la vigile jusqu'à ce que le ciel grise."
 latria_sexual_frustration_flavor.1328.c: "Lire le psautier jusqu'au bout."

 latria_sexual_frustration_flavor.1329.t: "Quatre lignes"
 latria_sexual_frustration_flavor.1329.desc: "Je suis en chemise de nuit à la fenêtre et il y a sur le rebord une lettre que j'ai écrite et non envoyée. Quatre lignes. La dernière dit ce que je veux en des mots que je n'emploierais pas au grand jour, et l'encre est sèche, et le sceau est intact.\n\nJe pourrais la donner au serviteur à la porte. Je pourrais aussi la brûler, et j'en ai brûlé trois autres, et la cendre est encore dans le brasero. Mon corps ne s'intéresse pas au brûlement. Il veut la réponse qui vient après qu'on l'a donnée.\n\nLa chandelle est réduite à un bout et la cire a coulé par-dessus le bord. Je relis la dernière ligne et le papier tremble dans ma main."
 latria_sexual_frustration_flavor.1329.a: "Donner la lettre au serviteur."
 latria_sexual_frustration_flavor.1329.b: "La mettre au brasero et aller au lit."
 latria_sexual_frustration_flavor.1329.c: "Rester près de la fenêtre jusqu'à ce que le bout s'éteigne."

 latria_sexual_frustration_flavor.1330.t: "La clause de la frontière"
 latria_sexual_frustration_flavor.1330.desc: "L'étude de mon précepteur sent la poussière et l'encre froide et je n'ai pas retenu un mot du traité. On explique la clause sur la frontière et je regarde les mains, l'encre sur le côté du doigt, la façon dont on tient la page à plat.\n\nOn est assez vieux pour être mon parent et deux fois plus prudent, et il n'y a rien là-dedans et il n'est pas besoin qu'il y ait quelque chose. Le désir ne demande pas la permission. Il se tient en moi tandis qu'on tourne la page et qu'on trouve la clause suivante de l'ongle.\n\nOn demande si j'ai compris. Je dis oui. On me regarde un instant de plus que ne le demande la question, puis on revient à la page."
 latria_sexual_frustration_flavor.1330.a: "Écrire plutôt un vers sur la frontière."
 latria_sexual_frustration_flavor.1330.b: "Demander d'entendre une confession."
 latria_sexual_frustration_flavor.1330.c: "Redire la clause mot pour mot."

 latria_sexual_frustration_flavor.1331.t: "L'heure lente"
 latria_sexual_frustration_flavor.1331.desc: "La maison dort et moi non, pas depuis une heure à présent. Ma chemise de nuit est remontée au-delà de mes hanches et mes doigts ont trouvé l'humide de moi-même sans que je l'aie décidé. Je les y laisse et laisse venir la pensée qui tourne depuis le couloir, la personne qui s'est penchée pour rajuster mon col et ne s'est pas reculée après.\n\nJe presse et je tourne comme mon corps me l'a appris, lentement, puis non, mon autre main à plat sur la tête du lit pour l'empêcher de cogner le mur. Il y a une porte de service en bas et un escalier qui se plaint. Je ne m'arrête pas. Mon souffle se fait rauque et je tourne le visage dans l'oreiller pour avaler le son.\n\nCela se brise et je reste les doigts encore contre moi, le pouls continuant dessous. L'escalier se plaint encore une fois et se pose. Je tire la chemise de nuit vers le bas et le tissu est humide et colle."
 latria_sexual_frustration_flavor.1331.a: "Le laisser s'achever, puis m'habiller avant la cloche."
 latria_sexual_frustration_flavor.1331.b: "Retirer ma main et rester sans bouger."
 latria_sexual_frustration_flavor.1331.c: "Me laver et rester avec la douleur jusqu'à ce qu'elle s'émousse."

 latria_sexual_frustration_flavor.1332.t: "La nef froide"
 latria_sexual_frustration_flavor.1332.desc: "J'étais au temple pour me vider, et j'ai prié à genoux sur la pierre froide jusqu'à ce que le désir ne fasse que s'enfoncer plus avant. Il a un visage à présent, la personne à qui j'ai fait ma confession au festin, la façon dont on écoutait, la tête penchée, la façon dont le pouce bougeait sur la coupe. Ma main est sous ma robe et personne ne peut la voir dans le noir du bas-côté.\n\nJe garde les yeux sur la lampe de l'autel et laisse mes doigts travailler, lentement, la mâchoire serrée. Une porte s'ouvre quelque part derrière le paravent et des acolytes entrent pour l'office de nuit, leurs pieds sur les dalles. Je devrais m'arrêter. Ma main ne s'arrête pas. Je presse mon front contre mes mains jointes et respire entre mes dents.\n\nCela passe et me laisse creux et tremblant. Les acolytes commencent le psaume. Je reste à genoux jusqu'à ce que mes jambes s'engourdissent et que la lampe soit la seule chose que je puisse regarder."
 latria_sexual_frustration_flavor.1332.a: "Le nommer au confessionnal et faire la pénitence."
 latria_sexual_frustration_flavor.1332.b: "Garder la veille jusqu'à ce que le ciel grise."
 latria_sexual_frustration_flavor.1332.c: "Lire le psautier jusqu'au bout."

 latria_sexual_frustration_flavor.1333.t: "Le creux vert"
 latria_sexual_frustration_flavor.1333.desc: "J'ai entraîné la personne que je voulais à l'écart de la chasse, dans un creux où la lumière vient verte à travers les feuilles. Mes chausses sont ouvertes et une main est sur moi, et ma main est sous les jupes, et ni l'un ni l'autre ne feint qu'il s'agit du cerf. L'humide est déjà là. Cela dure depuis que j'ai saisi le poignet au gué.\n\nJe glisse mes doigts et on suffoque et on couvre ma bouche de la sienne, fort, la main libre serrée en poing dans mon col. Les cors sonnent au loin à travers les arbres, la chasse tournant quelque part près. Nous ne nous arrêtons pas. On se balance contre ma main et le souffle vient en courtes bouffées contre ma joue.\n\nOn frissonne et on s'immobilise, me serrant le poignet. Les cors s'effacent à l'est. On rajuste ses jupes de ses mains tremblantes et une feuille tombe de ses cheveux."
 latria_sexual_frustration_flavor.1333.a: "Laisser la chasse continuer sans nous."
 latria_sexual_frustration_flavor.1333.b: "Remonter en selle et mériter ma place."
 latria_sexual_frustration_flavor.1333.c: "Rentrer par le long chemin et me refroidir."

 latria_sexual_frustration_flavor.1334.t: "La marge du traité"
 latria_sexual_frustration_flavor.1334.desc: "L'étude est froide et le traité est ouvert et j'ai relu trois fois la même clause. L'envoyé qui l'a apporté est parti mais le souvenir ne l'est pas, l'heure dans le couloir où j'avais cette personne contre le mur, ma main remontée sous sa tunique et sa bouche ouverte sur mon épaule, tous deux guettant un pas.\n\nMa main a dérivé vers mon giron sous la table. Je me force à la retirer et à la presser à plat sur la page. L'encre est sèche sous ma paume. Si j'écrivais ce que je pense dans la marge, le clerc le recopierait au propre et le ferait circuler d'ici le matin.\n\nJe trempe la plume et récris la clause, correctement, et ma main n'est pas assurée au dernier mot. La chandelle coule et je mousse la mèche."
 latria_sexual_frustration_flavor.1334.a: "Dire clairement ce que j'attends de cette personne."
 latria_sexual_frustration_flavor.1334.b: "Souhaiter le bien et reculer."
 latria_sexual_frustration_flavor.1334.c: "Dresser le plateau et jouer jusqu'à ce que mes mains soient immobiles."

 latria_sexual_frustration_flavor.1335.t: "Derrière la tapisserie"
 latria_sexual_frustration_flavor.1335.desc: "Le festin est bruyant et les musiciens sont entre deux airs et j'ai mis la personne que j'ai regardée toute la nuit derrière la tapisserie, là où la lumière ne va pas. Ma main est remontée sous la robe et le dos est au mur et on se mord la lèvre pour se taire. Mon autre main est sur la bouche, pas fort, juste assez.\n\nLa salle est à trois pieds de l'autre côté du tissu. Une coupe se brise et quelqu'un rit. On bouge contre mes doigts et les yeux se ferment et je sens le frisson traverser, le souffle chaud et vif contre ma paume.\n\nOn fléchit un peu et je retiens. Au-delà de la tapisserie, les musiciens reprennent. On lisse sa robe et l'on se glisse dehors d'abord, et j'attends un moment avant de suivre."
 latria_sexual_frustration_flavor.1335.a: "Me glisser de nouveau à l'intérieur et reprendre ma place."
 latria_sexual_frustration_flavor.1335.b: "Garder ma place derrière le tissu un moment de plus."
 latria_sexual_frustration_flavor.1335.c: "Trouver mon ami et m'asseoir plutôt avec lui."

 latria_sexual_frustration_flavor.1336.t: "Le toit emprunté"
 latria_sexual_frustration_flavor.1336.desc: "J'ai monté une jarre de vin et un melon tranché sur un toit emprunté, car cette nuit la Tisserande et le Bouvier traversent le fleuve d'étoiles et se rencontrent, et toute la maisonnée est en bas, le visage levé. La personne que j'ai voulue tout l'été est assise tout près, son genou contre le mien, tous deux feignant de regarder le ciel.\n\nIls ne se rencontrent qu'une nuit dans l'année, ces deux-là, et retournent chacun à sa rive. Je tourne l'écorce du melon dans ma main et me dis que je prendrais l'unique nuit. Le vin a tiédi. L'épaule ne s'écarte pas de la mienne, et je n'écarte pas la mienne.\n\nEn bas, quelqu'un crie que les étoiles ont bougé. La personne près de moi lève sa coupe au ciel, et je lève la mienne, et ni l'un ni l'autre ne dit la chose assise entre nous sur les tuiles chaudes."
 latria_sexual_frustration_flavor.1336.a: "Le dire clairement, ici sous les étoiles."
 latria_sexual_frustration_flavor.1336.b: "Le garder en moi et passer le melon."
 latria_sexual_frustration_flavor.1336.c: "Descendre et marcher jusqu'à ce que la douleur s'émousse."

 latria_sexual_frustration_flavor.1337.t: "Le rubai de l'échanson"
 latria_sexual_frustration_flavor.1337.desc: "Je suis dans une taverne à vin à l'écart du bazar où un rubai fait le tour de la salle, quatre vers par coupe, et l'échanson vient remplir la mienne. On verse sans répandre une goutte et on ne détourne pas les yeux, et la salle est assez bruyante pour que personne ne le remarque que moi.\n\nLes vieux poètes buvaient ainsi et jamais ne mettaient la main là où chantait la bouche. Le désir va dans le vers et en ressort net, et l'échanson se tient là, la fiasque penchée, attendant que j'aie fini d'être regardé.\n\nLe rubai s'achève. On remplit la dernière coupe, pose la fiasque et passe à la table suivante, et je tiens le vin sans boire et laisse le dernier vers s'achever dans ma tête."
 latria_sexual_frustration_flavor.1337.a: "Répondre au vers par un des miens."
 latria_sexual_frustration_flavor.1337.b: "Remercier et me tourner vers la compagnie."
 latria_sexual_frustration_flavor.1337.c: "Dresser le plateau et jouer jusqu'à ce que mes mains soient immobiles."

 latria_sexual_frustration_flavor.1338.t: "La source sacrée"
 latria_sexual_frustration_flavor.1338.desc: "Le rite a laissé la source fumante et le temple vide, hormis le prêtre qui en prend soin. Je dois me baigner dans l'eau avant que la bénédiction du dieu soit dite sur moi, et la bénédiction, ce soir, se pose sur le corps et ce qu'il veut, non contre lui.\n\nLes mains du prêtre sont assurées sur mes épaules tandis qu'on verse l'eau sur ma tête, et la vapeur monte entre nous, et ni l'un ni l'autre ne recule quand le rite est fini. Le dieu a dit que le désir n'est pas péché. L'eau ruisselle le long de mon dos et je me tiens dedans un instant de plus qu'il ne faut.\n\nLe prêtre tend la main vers le lin et attend. La lampe siffle. Je laisse partir la fin de l'eau et prends le tissu de ses mains."
 latria_sexual_frustration_flavor.1338.a: "Laisser la bénédiction vouloir dire ce qu'elle dit."
 latria_sexual_frustration_flavor.1338.b: "Me sécher et garder la veille de la nuit."
 latria_sexual_frustration_flavor.1338.c: "Lire le texte du rite jusqu'à ce que la chaleur passe."

 latria_sexual_frustration_flavor.1339.t: "Le symposium tardif"
 latria_sexual_frustration_flavor.1339.desc: "Les guirlandes se fanent et la flûte a repris, et le vin est mêlé d'eau comme le fait un hôte avisé, pour que la nuit s'étire au lieu de finir. Je suis sur la couche avec la personne que j'ai regardée depuis le premier service, assez près pour que la lueur de la lampe soit dans nos deux coupes.\n\nOn se penche plus près pour m'entendre par-dessus la flûte, la main à plat sur le coussin entre nous, sans toucher, et l'heure est assez tardive pour que les autres aient cessé d'écouter. Le vin est surtout de l'eau et je ne suis pas ivre, ce qui est pire, car je sais exactement ce que je ferais.\n\nLa flûte s'arrête entre deux airs. La personne près de moi ne bouge pas la main, et la lampe brûle bas, et quelqu'un réclame d'autres guirlandes."
 latria_sexual_frustration_flavor.1339.a: "Chanter le vers suivant avec la flûte."
 latria_sexual_frustration_flavor.1339.b: "Prendre congé et cuver mon vin."
 latria_sexual_frustration_flavor.1339.c: "Me tourner vers la compagnie et faire durer la nuit."

 latria_sexual_frustration_flavor.1340.t: "La haire"
 latria_sexual_frustration_flavor.1340.desc: "Sous les riches vêtements sacerdotaux, j'ai la haire, la laine rêche contre ma peau, et l'abbé a redit son avertissement : la chair est l'ennemie et le vœu est le mur. Je dois la porter le temps de l'office et la laisser m'enseigner.\n\nLa laine mord quand je m'agenouille et mord pire quand je me lève, et la sueur l'a fait coller, et mon corps se tend contre le vœu comme toujours quand on me fait tenir immobile avec lui. Je prie les mots. Les mots ne touchent pas le désir.\n\nL'abbé me regarde depuis la balustrade de l'autel. Je garde les mains jointes et les yeux baissés et achève l'office, la laine me sciant et le vœu tenant, à peine."
 latria_sexual_frustration_flavor.1340.a: "M'éclipser et soulager la tension à l'écart."
 latria_sexual_frustration_flavor.1340.b: "M'agenouiller plus longtemps et laisser la laine faire son œuvre."
 latria_sexual_frustration_flavor.1340.c: "Demander le texte et lire sous l'œil de l'abbé."
