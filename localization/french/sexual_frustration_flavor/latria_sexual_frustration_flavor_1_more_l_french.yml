l_french:
 latria_sexual_frustration_flavor.1011.t: "La deuxième veille"
 latria_sexual_frustration_flavor.1011.desc: "Je m'éveille pendant la deuxième veille et la lampe brûle encore, l'huile basse, un anneau brun séché dans la soucoupe. Ma chemise de nuit s'est tordue à la taille. Il fait assez froid pour que j'entende le volet cogner deux fois, puis s'arrêter.\n\nC'était une main à mon poignet, il y a trois jours, dans l'embrasure de la salle, et rien n'a été dit. J'ai repassé la longueur de ce contact plus de fois que je n'ai repassé les comptes. La peau, là, est redevenue ordinaire. J'y presse le pouce et ne sens que mon propre pouls.\n\nIl y a de l'eau dans la coupe près du lit, tiédie. J'en bois la moitié et la repose. Le volet cogne encore. Je reste les yeux ouverts et compte les poutres jusqu'à ce que le gris vienne."
 latria_sexual_frustration_flavor.1011.a: "Me lever, moucher la lampe et laisser la pensée aller où elle veut."
 latria_sexual_frustration_flavor.1011.b: "Boire l'eau, me tourner vers le mur et y renoncer."
 latria_sexual_frustration_flavor.1011.c: "Prendre un livre au coffre et lire jusqu'à ce que le gris vienne."

 latria_sexual_frustration_flavor.1012.t: "La poire et le petit couteau"
 latria_sexual_frustration_flavor.1012.desc: "Je me tiens trois tables plus bas que l'estrade, là où les chandelles coulent et où l'on verse le vin clairet. En face de moi, au-delà de deux marchands et d'un clerc, quelqu'un pèle une poire avec un petit couteau sans la manger. La peau se détache en une seule longue spirale.\n\nAu dernier festin, cette personne s'était mise près de moi et son genou était resté contre le mien le temps d'une chanson. Je n'arrive pas à me convaincre que c'était un accident, ni à me convaincre que ce n'en était pas un.\n\nLes musiciens passent à un air plus lent. Le couteau s'arrête. La poire reste ouverte sur l'assiette, brunissant à l'entaille. Un serviteur se penche au-dessus de mon épaule avec le pichet et je tends la coupe sans détourner le regard."
 latria_sexual_frustration_flavor.1012.a: "Le dire tout haut et laisser la table en faire ce qu'elle veut."
 latria_sexual_frustration_flavor.1012.b: "Me retirer tôt et ravaler le reste."
 latria_sexual_frustration_flavor.1012.c: "Me tourner vers mon voisin et laisser la musique l'emporter."

 latria_sexual_frustration_flavor.1013.t: "Ce que le rêve a laissé"
 latria_sexual_frustration_flavor.1013.desc: "Je m'éveille, le drap à la hanche et la fenêtre pâle, et l'espace d'un instant la chambre n'est pas la mienne. Quelqu'un était là. Il y avait un poids au bord du lit et une voix tout près de mon oreille qui disait mon nom comme si c'était une question.\n\nJe ne me rappelle pas le visage. Je me rappelle la chaleur d'un dos contre ma poitrine, ma main à plat sur un ventre qui se soulevait et retombait, et que rien ne me pressait.\n\nLe drap est humide là où j'ai dormi. Je me redresse et pose les pieds sur les planches froides. Dehors, une charrette passe vers le marché. Je tends la main vers mes vêtements et me surprends à guetter la porte."
 latria_sexual_frustration_flavor.1013.a: "Laisser le corps l'avoir et garder la chaleur du rêve."
 latria_sexual_frustration_flavor.1013.b: "Se lever et s'habiller, et lisser la nuit à plat."
 latria_sexual_frustration_flavor.1013.c: "M'asseoir les genoux remontés et attendre que la fenêtre blanchisse."

 latria_sexual_frustration_flavor.1014.t: "La lampe de veille"
 latria_sexual_frustration_flavor.1014.desc: "Je m'agenouille à la troisième heure, le psautier ouvert à la même page que j'ai lue quatre fois. La lampe de veille jette un petit cercle rouge sur les dalles. Mes genoux me font mal. Le froid monte à travers la laine.\n\nQuelque part dans le cloître une porte se ferme. La voix de l'aumônier continue derrière moi, patiente, et je n'en entends rien. Je pense à une bouche sur ma gorge l'été dernier, et à la façon dont j'ai détourné la tête en la laissant pourtant faire.\n\nLe ruban du psautier a glissé au sol. Je ne le ramasse pas. Mon pouce tient la page, et le cercle rouge de la lampe tremble quand je respire. La pierre sous mes genoux est froide."
 latria_sexual_frustration_flavor.1014.a: "Reconnaître la faiblesse et faire pénitence demain."
 latria_sexual_frustration_flavor.1014.b: "M'agenouiller encore une heure et reprendre le psaume."
 latria_sexual_frustration_flavor.1014.c: "Demander à l'aumônier de rester et de finir la page."

 latria_sexual_frustration_flavor.1015.t: "La courtepointe au pied du lit"
 latria_sexual_frustration_flavor.1015.desc: "Le feu s'est consumé en cendre et je ne dors pas encore, la courtepointe rejetée au pied du lit. Mon corps est chaud et lourd et conscient de lui-même, la peau de ma gorge et le long de mes cuisses tendue et rougie, et une moiteur que le temps n'explique pas.\n\nJe laisse ma main reposer bas sur mon ventre et ne la bouge pas. Le désir, ce soir, n'est pas pour un visage. Ce n'est que le pouls entre mes jambes, insistant, qui bat au rythme du dernier craquement du feu.\n\nJe pense à une bouche, une main, le poids de quelqu'un au-dessus de moi, et mes hanches bougent d'elles-mêmes. La courtepointe est un tas sur les planches. Je tourne le visage dans l'oreiller et respire jusqu'à ce que la douleur s'apaise, et elle ne s'apaise pas."
 latria_sexual_frustration_flavor.1015.desc.lustful: "La chaleur monte sous le drap et je cesse de prétendre que c'est le temps. La moiteur est là, franche, mienne, et mes doigts connaissent le chemin sans qu'on le leur montre.\n\nJe les laisse aller. Il n'y a pas de visage, ce soir, seulement une main qui me plaquait au matelas et un genou qui ouvrait les miens, et je me rappelle la force exacte de cela. Mes hanches se soulèvent pour ne rencontrer rien. Le son que je fais dans la chambre vide n'est pas un son que je connais.\n\nAprès, je reste les mains ouvertes, la poitrine qui monte et descend, la fin de la chose bougeant encore dans mes cuisses. Une bûche s'affaisse dans l'âtre. Je tire le drap à ma taille et la chaleur de mon visage demeure."
 latria_sexual_frustration_flavor.1015.desc.chaste: "Je m'éveille avec la chaleur déjà là, les cuisses humides, et je retire ma main et la referme sur l'ourlet du drap comme si tenir du tissu pouvait retenir la nuit en place.\n\nJe dis la prière du matin dans l'ordre et perds le fil à la troisième ligne. Je compte les poutres et perds le compte. Le corps n'écoute pas. Il garde ce que je refuse d'admettre au grand jour, et il ne cesse de demander.\n\nLa fenêtre passe du gris au blanc. La cloche de l'office du matin n'a pas encore sonné. Je tire la courtepointe à mon menton, ferme les yeux et attends que la chaleur me quitte. Elle s'en va lentement."
 latria_sexual_frustration_flavor.1015.a: "Laisser la main faire à sa guise et user de la chaleur."
 latria_sexual_frustration_flavor.1015.b: "Serrer la courtepointe et user la chaleur jusqu'à l'épuiser."
 latria_sexual_frustration_flavor.1015.c: "Se lever, boire et s'asseoir près de la fenêtre."

 latria_sexual_frustration_flavor.1016.t: "Le long trajet de retour"
 latria_sexual_frustration_flavor.1016.desc: "Je chevauche à l'arrière de la file, là où les chevaux ont ralenti, la lumière se faisant verte et mince à travers les feuilles. Mon manteau est lourd d'humidité. Quelque part devant, les cors travaillent encore le versant lointain.\n\nÀ la dernière chasse, j'ai chevauché à côté de cette personne au ruisseau et nous avions laissé les autres aller devant. Sa manche était trempée jusqu'au coude. Cette personne a ri de ce que j'avais dit, et ce rire m'est resté tout le long du retour, et le retour faisait deux jours.\n\nMon cheval baisse la tête pour boire. L'eau brise son reflet en morceaux. Je reste là et la laisse boire et regarde les morceaux se rejoindre, et les cors reprennent, plus loin."
 latria_sexual_frustration_flavor.1016.a: "Ralentir d'une longueur et laisser la pensée rentrer avec moi."
 latria_sexual_frustration_flavor.1016.b: "Planter les talons et garder l'esprit sur le versant."
 latria_sexual_frustration_flavor.1016.c: "Suivre les empreintes et les brindilles brisées pour retrouver cette personne."

 latria_sexual_frustration_flavor.1017.t: "Le sceau et le registre"
 latria_sexual_frustration_flavor.1017.desc: "Le conseil est parti et les chandelles sont réduites à des bouts. J'ai le registre ouvert aux comptes de la laine et le sceau encore à la main, la cire ramollie par ma prise.\n\nCe à quoi je reviens sans cesse n'est pas les comptes. C'est la façon dont une certaine personne se tenait à la fenêtre toute la séance durant, sans rien dire, un doigt sur le loquet, et comme la pièce en parut plus étroite.\n\nJ'abaisse le sceau sur l'ordre et le relève. La cire prend la marque nettement. Dehors, la cour est vide et le loquet immobile. Je lis deux fois la même ligne du registre, puis je ferme le livre."
 latria_sexual_frustration_flavor.1017.a: "Faire mander cette personne demain et le dire clairement."
 latria_sexual_frustration_flavor.1017.b: "Donner le sceau au clerc et aller au lit."
 latria_sexual_frustration_flavor.1017.c: "Rouvrir le registre et finir la page."

 latria_sexual_frustration_flavor.1018.t: "La lune sur le plateau"
 latria_sexual_frustration_flavor.1018.desc: "Les lanternes sont allumées le long de l'allée et la lune est montée au-dessus du mur ouest, mince et blanche comme une pelure. Le vin a tiédi dans le pot. En face de moi, de l'autre côté du plateau, le lettré tient une pierre blanche entre deux doigts et ne la pose pas.\n\nAu printemps, cette personne se tenait assez près pour que nos manches se touchent, récitait quatre vers sur une lampe, et sur le dernier son regard fut pour moi. Je n'ai pas oublié le dernier vers.\n\nLa pierre descend enfin, dans le mauvais coin, et cette personne rit et remplit ma coupe. Je bois. La lumière des lanternes bouge sur le plateau. Ni l'un ni l'autre ne mentionne le poème."
 latria_sexual_frustration_flavor.1018.a: "Reprendre la lampe et les quatre vers, et en ajouter quatre."
 latria_sexual_frustration_flavor.1018.b: "Lever la coupe en remerciement et porter la conversation sur les moissons."
 latria_sexual_frustration_flavor.1018.c: "Poser une pierre et demander une leçon."

 latria_sexual_frustration_flavor.1019.t: "Dit au feu"
 latria_sexual_frustration_flavor.1019.desc: "Le feu est bas et mon confident occupe l'autre chaise, les mains refermées sur une coupe, attendant comme toujours.\n\nAlors je le dis. Pas tout, mais la forme : l'embrasure, la main à mon poignet, les nuits depuis. Le dire tout haut le rend plus petit et pire. Mon confident ne détourne pas le regard et ne comble pas le silence.\n\nLa coupe a refroidi dans mes mains. Il y a une bûche à remettre et je ne la remets pas. Nous restons dans la fin de la chaleur et la pièce s'assombrit lentement, et je tiens encore la coupe."
 latria_sexual_frustration_flavor.1019.a: "Continuer et dire le reste."
 latria_sexual_frustration_flavor.1019.b: "S'arrêter là et garder le reste."
 latria_sexual_frustration_flavor.1019.c: "Rester là un peu plus longtemps sans rien dire."

 latria_sexual_frustration_flavor.1020.t: "Dit sous la voûte"
 latria_sexual_frustration_flavor.1020.desc: "La voûte prend ma voix et me la rend dédoublée. Une douzaine de personnes sont dans la nef et chacune peut m'entendre dire ce que je n'ai pas dit au grand jour.\n\nJe garde les yeux sur la dalle devant la balustrade. Il y a un éclat en forme de dent. Quand je finis, quelqu'un déplace son poids derrière moi, et une femme près de la porte tire son voile en travers sans l'abaisser.\n\nL'encensoir oscille. La fumée monte à plat le long de la pierre. Je reste où je suis, les mains ouvertes sur mes genoux, jusqu'à ce que le sacristain me touche l'épaule."
 latria_sexual_frustration_flavor.1020.a: "Relever la tête et achever ce que j'ai omis."
 latria_sexual_frustration_flavor.1020.b: "Garder la tête baissée et dire les psaumes de pénitence jusqu'au bout."
 latria_sexual_frustration_flavor.1020.c: "Attendre que la nef se vide et demander à l'aumônier de rester."

 latria_sexual_frustration_flavor.1021.t: "Après la pluie"
 latria_sexual_frustration_flavor.1021.desc: "La pluie nous a retenus dans la chambre haute au-delà de la deuxième veille, et ni l'un ni l'autre n'a proposé de descendre.\n\nJe me rappelle l'ordre des choses. Un manteau trempé sur les planches. Une bouche à ma clavicule, puis plus bas, sans hâte, tandis que mes doigts trouvaient les liens à la nuque. La lampe était baissée mais non éteinte. Quand la bouche est revenue m'embrasser, j'ai senti le vin sur ses lèvres, mes cuisses glissaient contre les siennes, et j'ai soulevé les hanches à la rencontre de la main qui s'y posait.\n\nAprès, la pluie a continué. Mes cheveux collaient à ma joue. Il y a une marque sur mon épaule que je n'ai pas regardée au grand jour."
 latria_sexual_frustration_flavor.1021.desc.female: "La pluie nous a retenus dans la chambre haute au-delà de la deuxième veille, et ni l'un ni l'autre n'a proposé de descendre.\n\nJe me rappelle l'ordre des choses. Un manteau trempé sur les planches. Une bouche à ma clavicule, puis plus bas, sans hâte, tandis que mes doigts dénouaient les liens à la nuque. La lampe était baissée mais non éteinte. Une paume se referma sur mon sein et j'étais déjà mouillée, et j'ai soulevé les hanches à la rencontre de la main qui se posait entre mes cuisses.\n\nAprès, la pluie a continué. Mes cheveux collaient à ma joue. Il y a une marque sur mon épaule que je n'ai pas regardée au grand jour."
 latria_sexual_frustration_flavor.1021.desc.male: "La pluie nous a retenus dans la chambre haute au-delà de la deuxième veille, et ni l'un ni l'autre n'a proposé de descendre.\n\nJe me rappelle l'ordre des choses. Un manteau trempé sur les planches. Une bouche à ma poitrine, puis plus bas, sans hâte, tandis que mes mains trouvaient les liens à la taille. La lampe a grésillé deux fois et tenu bon. Un corps est descendu sur moi et j'ai tenu ses hanches, dures et douloureuses, et c'est cette personne qui donna le rythme. Le bout de ses cheveux était trempé.\n\nAprès, la pluie a continué, ruisselant dans la gouttière au-dessus de la fenêtre. Il y a une marque sur mon épaule que je n'ai pas regardée au grand jour."
 latria_sexual_frustration_flavor.1021.a: "Retrouver cette personne demain comme d'habitude et ne rien cacher."
 latria_sexual_frustration_flavor.1021.b: "Éviter cette personne désormais et ranger la nuit."
 latria_sexual_frustration_flavor.1021.c: "Ne pas bouger et écouter la pluie, en gardant la marque à l'esprit."

 latria_sexual_frustration_flavor.1022.t: "Le sentier derrière les simples"
 latria_sexual_frustration_flavor.1022.desc: "Je prends le sentier derrière les carrés de simples parce que c'est le seul endroit où la maisonnée ne passe pas après la tombée du jour. Le gravier est froid à travers mes mules. Le romarin, et dessous l'odeur aigre de la menthe montée en graine.\n\nIl y a un banc au bout, là où le mur tourne. Nous nous y étions assis au printemps et j'ai dit une sottise et on me pardonna avant que j'aie fini. Le loquet de la grille est toujours baissé.\n\nLa lune est derrière la tour. Je me tiens au banc, la main sur son dossier, là où la peinture s'est usée jusqu'au bois. Un papillon de nuit s'acharne à la lanterne près de la porte. La menthe bouge un peu. Je ne m'assieds pas."
 latria_sexual_frustration_flavor.1022.a: "M'asseoir sur le banc et laisser passer le pouls."
 latria_sexual_frustration_flavor.1022.b: "Revenir vers la maison et verrouiller la porte."
 latria_sexual_frustration_flavor.1022.c: "Parcourir le sentier une fois, puis encore."

 latria_sexual_frustration_flavor.1023.t: "La troisième coupe"
 latria_sexual_frustration_flavor.1023.desc: "À la troisième coupe, la salle est devenue bruyante et chaude et les chiens sont sous les bancs. Quelqu'un a entamé une chanson au mauvais nombre de couplets et personne ne le corrige.\n\nUne main se pose sur ma manche pendant qu'on raconte une histoire, y reste le temps de toute l'histoire, et disparaît quand l'histoire s'achève. Je ris au bon moment. Le vin est très bon ce soir.\n\nLes musiciens prennent un air lent. Je regarde le long de la table où l'on débarrasse les tranches de pain. Ma manche est encore chaude là où était la main. Je tourne la coupe par le bord et laisse le serviteur la remplir encore."
 latria_sexual_frustration_flavor.1023.a: "Lever la coupe et regarder cette personne à travers la table."
 latria_sexual_frustration_flavor.1023.b: "Prétexter le vin et monter se coucher."
 latria_sexual_frustration_flavor.1023.c: "Parler à mon voisin et écouter l'air jusqu'au bout."

 latria_sexual_frustration_flavor.1024.t: "L'eau de rose et le mur du jardin"
 latria_sexual_frustration_flavor.1024.desc: "On a versé l'eau de rose sur les fruits et toute la table en embaume. Sous le mur, un rossignol va et vient, mal, et personne n'a le cœur de le faire taire.\n\nCette personne m'a posé deux fois une question sur le traité, et les deux fois j'ai répondu la mauvaise moitié. La seconde fois, un sourire s'est caché dans sa coupe. Le safran sur son pouce s'en est allé sur le bord. La lampe entre nous a une fêlure dans le verre.\n\nLe rossignol s'arrête. Dans le silence, j'entends l'eau dans le canal derrière le mur. Je reprends la coupe que j'ai déjà vidée et la tiens jusqu'à ce que quelqu'un le remarque et la remplisse."
 latria_sexual_frustration_flavor.1024.a: "Suivre leur exemple et reporter le traité à demain."
 latria_sexual_frustration_flavor.1024.b: "Demander congé et sortir au jardin."
 latria_sexual_frustration_flavor.1024.c: "Demander à cette personne d'achever l'autre moitié du poème."

 latria_sexual_frustration_flavor.1025.t: "Le faucon au poing"
 latria_sexual_frustration_flavor.1025.desc: "Le faucon se tient mieux sur mon poing qu'au printemps, chaperon ôté, son poids posé. Les chevaux sont attachés plus loin dans les bouleaux et les rabatteurs sont partis devant avec leur vacarme.\n\nNous l'avons lancée ensemble une fois, au bord de la lande, et je ne pouvais détacher les yeux des mains qui la lançaient, de la façon dont elles s'ouvraient au dernier instant. J'ai pensé à ces mains à des heures mal choisies depuis.\n\nLe faucon bouge et je l'apaise de deux doigts sur les jets. Le vent monte le versant, froid et net. Je garde les yeux sur les arbres où les rabatteurs sont entrés et mon esprit n'est pas sur les arbres."
 latria_sexual_frustration_flavor.1025.a: "Confier le faucon à un autre et m'éloigner à l'écart."
 latria_sexual_frustration_flavor.1025.b: "La lancer du poing et la laisser voler."
 latria_sexual_frustration_flavor.1025.c: "La faire voler encore, jusqu'à ce que mon bras me fasse mal."

 latria_sexual_frustration_flavor.1026.t: "La page tournée"
 latria_sexual_frustration_flavor.1026.desc: "La leçon est finie et le livre est encore ouvert entre nous, à la page que l'aumônier a tournée d'un doigt sec. La pluie aux volets. La chandelle s'est consumée et a plié.\n\nJe n'ai pas suivi l'argument. J'ai regardé le doigt, et l'encre le long de son flanc, et la façon dont la manche était retroussée jusqu'au coude. La honte vient après, toujours, et ne sert à rien.\n\nL'aumônier ferme le livre et demande si j'ai compris. Je dis que oui. La pluie continue aux volets. Je garde la main à plat sur la couverture pour qu'elle ne cherche rien."
 latria_sexual_frustration_flavor.1026.a: "Porter la question à l'aumônier demain."
 latria_sexual_frustration_flavor.1026.b: "Demander à l'aumônier de le redire, et cette fois écouter."
 latria_sexual_frustration_flavor.1026.c: "Relire la page une fois, seulement les lettres."

 latria_sexual_frustration_flavor.1027.t: "Ce que le jour a laissé"
 latria_sexual_frustration_flavor.1027.desc: "Le dernier pétitionnaire est parti et la chambre sent la laine mouillée et le suif qu'on frotte sur les bancs. Mon sceau est tiède de ma main. Les affaires du jour sont faites et je me tiens encore ici.\n\nIl y eut un instant à la fenêtre, entre deux intervenants, où un regard fut donné que je porte depuis comme un caillou dans ma chaussure. Rien ne fut dit. Rien n'avait besoin de l'être.\n\nLe clerc vient chercher le sceau. Je le lui donne et mes doigts sont assurés. Il s'en va. La porte ne se ferme pas tout à fait. Je reste là à écouter le loquet se poser, et la pluie recommence sur les plombs."
 latria_sexual_frustration_flavor.1027.a: "Faire sortir la salle demain et dire une chose."
 latria_sexual_frustration_flavor.1027.b: "Fermer la fenêtre et finir les papiers."
 latria_sexual_frustration_flavor.1027.c: "Écouler ce qui reste, une feuille à la fois."

 latria_sexual_frustration_flavor.1028.t: "Le ruban dans la boîte"
 latria_sexual_frustration_flavor.1028.desc: "Il y a une boîte sur l'étagère, avec dedans un ruban qui n'est pas à moi, vert, usé jusqu'à la corde au pli. Je le sors, le remets, le ressors.\n\nÀ la foire, j'ai perdu le ruban et quelqu'un l'a retrouvé dans la boue et me l'a rendu avec une révérence dont je n'avais pas besoin. Ses mains étaient froides. J'ai dit merci et rien d'autre, et tout le long du retour je m'en suis voulu de ce rien d'autre.\n\nLa lampe est basse. Le ruban repose en travers de ma paume et le vert est presque gris dans cette lumière. Je le plie une fois, puis encore, et les plis ne s'alignent pas."
 latria_sexual_frustration_flavor.1028.a: "Nouer le ruban à mon poignet et dormir."
 latria_sexual_frustration_flavor.1028.b: "Enfermer la boîte au fond du coffre."
 latria_sexual_frustration_flavor.1028.c: "Prendre du papier et coucher la nuit par écrit."

 latria_sexual_frustration_flavor.1029.t: "Le feu entre les veilles"
 latria_sexual_frustration_flavor.1029.desc: "Le feu n'est plus qu'un œil rouge et le camp dort, hormis nous deux et les sentinelles. Mon manteau est sur mes genoux. L'épée est là où je peux l'atteindre, par habitude.\n\nVoilà onze nuits que nous partageons un feu et j'ai appris le son de sa respiration. Cette nuit, cette personne veille aussi. Ni l'un ni l'autre ne dit rien de la route de demain, ni de l'auberge de la dernière ville où il n'y avait qu'une chambre et où nous l'avons prise.\n\nLe vent couche les flammes. Une bûche s'affaisse. J'en remets une et les étincelles montent, et les étincelles sont la seule chose qui bouge dans tout le bois."
 latria_sexual_frustration_flavor.1029.a: "Rester près du feu et attendre le jour."
 latria_sexual_frustration_flavor.1029.b: "Nourrir le feu et monter la garde, sans regarder cette personne."
 latria_sexual_frustration_flavor.1029.c: "Changer de veille avec cette personne et marcher jusqu'à la lisière du bois."

 latria_sexual_frustration_flavor.1030.t: "La corde de la cloche"
 latria_sexual_frustration_flavor.1030.desc: "La corde de la cloche est rêche dans mes mains, la cloche a sonné et l'église est vide. Le guide attend près de la porte avec les clés, patient comme la pierre.\n\nJe pense au corps comme à une chose à garder, et je n'arrive pas à fixer la pensée. Elle glisse. Sous la laine, la chaleur et la vie m'habitent, et il y a en moi un pouls qui n'a rien à voir avec la prière.\n\nJe lâche la corde. Elle oscille un peu et s'immobilise. Le guide lève les clés. Je descends la nef derrière cette personne et mon ombre me précède sur les dalles, longue et mince, et sort par la porte."
 latria_sexual_frustration_flavor.1030.a: "Donner la nuit au corps et régler cela demain."
 latria_sexual_frustration_flavor.1030.b: "M'agenouiller et achever l'office du soir."
 latria_sexual_frustration_flavor.1030.c: "Retenir le guide et entendre un passage de plus."

 latria_sexual_frustration_flavor.1031.t: "Le ruban sur les planches"
 latria_sexual_frustration_flavor.1031.desc: "Le feu s'est consumé jusqu'à une ligne rouge et je n'ai pas demandé de bois. Ma robe est desserrée à la gorge et il fait assez chaud pour que je la laisse ainsi. Il y a deux jours, à la halte de la chasse, une main s'est attardée au creux de mes reins plus longtemps que ne le demandait la descente de cheval.\n\nJe me rappelle le poids de cette paume, le souffle qui bougeait à mon oreille quand le cheval a bougé, le mot bas qui n'était pas tout à fait un mot. Ma propre main va à l'endroit que la paume couvrait. La peau en est chaude du feu, et quand je la presse la chaleur n'est que la mienne.\n\nLe ruban a glissé du montant du lit aux planches. Je le regarde reposer dans la lumière rouge. Le feu s'affaisse. Je ne le ramasse pas."
 latria_sexual_frustration_flavor.1031.a: "Ramasser le ruban et laisser la pensée aller où elle veut."
 latria_sexual_frustration_flavor.1031.b: "Nouer le ruban, couvrir le feu et dormir."
 latria_sexual_frustration_flavor.1031.c: "Dresser le plateau et jouer seul la fin de partie."

 latria_sexual_frustration_flavor.1032.t: "Le poids d'une paume"
 latria_sexual_frustration_flavor.1032.desc: "La pierre est froide à travers mes genoux et j'ai assez prié pour que le froid soit devenu une compagnie. Sous la laine mon corps est trop chaud, et je ne saurais dire si c'est les braseros ou autre chose. La semaine dernière, une main s'est posée sur ma tête en bénédiction et est restée au-delà des mots.\n\nLes prières sortent correctement. Les répons sont justes. Ce qui monte à la place, c'est le poids de cette paume, l'huile sur les doigts, l'instant où ni l'un ni l'autre n'a bougé et où le sacristain a toussé dans l'embrasure. Je presse mon front contre mes jointures. Le marbre ne rend rien.\n\nUne chandelle à l'autel latéral plie, puis se redresse. Je reste où je suis. Le froid monte à travers mes genoux et je le laisse."
 latria_sexual_frustration_flavor.1032.a: "Me lever, trouver le prêtre et dire ce qui m'habite."
 latria_sexual_frustration_flavor.1032.b: "Garder la veille jusqu'à la cloche."
 latria_sexual_frustration_flavor.1032.c: "Faire le tour du cloître jusqu'à ce que mes jambes soient aussi froides que mes genoux."

 latria_sexual_frustration_flavor.1033.t: "Le second manteau"
 latria_sexual_frustration_flavor.1033.desc: "Le feu est entre nous et les chiens se sont tus. Quelqu'un a jeté un second manteau sur mes épaules sans demander, et la laine sent la sueur d'un autre et le feu de bois. Son genou est contre le mien. Ni l'un ni l'autre ne l'a bougé.\n\nJe peux nommer trois raisons de me lever : la veille, le pan de tente qui ne se ferme pas, le froid qui vient avant l'aube. Au lieu de quoi je tourne le visage vers les flammes et laisse mon épaule là où elle s'est posée. Notre souffle sort et s'amincit dans l'air entre nous. Sous le manteau, ma main trouve la couture de ma propre manche et la tient.\n\nUne branche tombe dans le feu. Cette personne ne bouge pas. Je ne bouge pas. Les étincelles montent et s'éparpillent."
 latria_sexual_frustration_flavor.1033.a: "Rester sous le manteau jusqu'à ce que le feu soit cendre."
 latria_sexual_frustration_flavor.1033.b: "Remercier pour la laine et regagner ma tente."
 latria_sexual_frustration_flavor.1033.c: "Interroger cette personne sur les chiens jusqu'à la relève."

 latria_sexual_frustration_flavor.1034.t: "La troisième clause"
 latria_sexual_frustration_flavor.1034.desc: "Le traité a été copié deux fois et la seconde copie est fausse à la troisième clause. Je l'ai relue quatre fois et l'erreur y est toujours. Mon col est ouvert ; le brasero a chauffé la pièce et il n'y a personne ici pour le voir.\n\nCe à quoi je reviens, c'est l'antichambre, la bouche de l'envoyé à l'intérieur de mon poignet puis au-dessus, et la façon dont je l'ai laissé continuer tandis que les pas du notaire allaient et venaient derrière la porte. Je n'ai rien dit qui pût s'écrire. L'envoyé en a dit moins.\n\nLa chandelle a mangé un croissant dans la cire. Je prends la plume, la repose, et relis la troisième clause. Les mots n'ont pas changé."
 latria_sexual_frustration_flavor.1034.a: "Faire mander l'envoyé et dire clairement ce que je pense."
 latria_sexual_frustration_flavor.1034.b: "Recopier la clause et aller à confesse au point du jour."
 latria_sexual_frustration_flavor.1034.c: "Lire le psautier jusqu'à ce que la chandelle s'éteigne."

 latria_sexual_frustration_flavor.1035.t: "Deux tours"
 latria_sexual_frustration_flavor.1035.desc: "La salle est bruyante et le vin m'est monté à la tête, pas loin, seulement assez. Ma robe s'est défaite à l'épaule et je ne m'en suis pas soucié. À la dernière danse, une main s'est posée à ma taille et y est restée le temps de deux tours, et la salle était trop pleine pour s'écarter.\n\nJe retrouve encore les quatre points de ces doigts à travers la soie. Ma propre main va à mon épaule, à l'endroit chaud où le tissu a glissé. La musique est à présent derrière les musiciens. Je garde le rythme tout de même.\n\nLa lampe au-dessus de moi fume. Quelqu'un à la table du fond rit de quelque chose que je n'ai pas entendu. Mon épaule est nue et je la laisse ainsi."
 latria_sexual_frustration_flavor.1035.a: "Réclamer un air de plus et le danser."
 latria_sexual_frustration_flavor.1035.b: "Rajuster ma robe et prendre l'air froid à la fenêtre."
 latria_sexual_frustration_flavor.1035.c: "M'asseoir au feu avec le vieux chien jusqu'à ce que la salle se vide."
