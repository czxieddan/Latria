l_french:
 latria_sexual_frustration_flavor.1201.t: "Une heure sans visite"
 latria_sexual_frustration_flavor.1201.desc.female: "En chemise de nuit, j’attends depuis longtemps près de la fenêtre. Sur la table, le thé a tiédi, puis refroidi jusqu’à se couvrir d’une fine pellicule. Aucun rendez-vous n’avait été convenu. J’ai pourtant gardé la lampe allumée, préparé une tasse vide et redressé la chaise près de la fenêtre.\n\nUne seule ronde a traversé la cour. La lumière d’une lanterne a glissé sur le mur avant de disparaître. Je fais tourner ma tasse ; le thé n’est plus bon à boire. Je repense au « si j’ai le temps » prononcé lors du dernier départ. Ces quelques mots peuvent promettre n’importe quelle nuit, ou n’en promettre aucune.\n\nLa mèche a raccourci. Je reste à ma place, sans remonter ma chemise qui a glissé d’un côté."
 latria_sexual_frustration_flavor.1201.desc.male: "En chemise de nuit, j’attends depuis longtemps près de la fenêtre. Dans la cour, les pas de la garde s’éloignent, puis se rapprochent. Personne ne viendra. Je laisse pourtant la lampe allumée, comme si elle pouvait achever une invitation que je n’ai pas formulée.\n\nLe thé est froid. Une première gorgée me fait grimacer tant il est amer ; je le bois tout de même jusqu’au bout. Je regarde les feuilles restées au fond, comme si elles pouvaient me dire où se trouve cette personne ce soir. Dehors, le vent courbe les branches, puis les relâche.\n\nJe pose la main sur le cadre de la fenêtre. Le bois est froid. Cette fraîcheur gagne ma paume sans calmer ce qui m’agite."
 latria_sexual_frustration_flavor.1201.desc: "La mèche a raccourci, et rien ne bouge derrière la fenêtre.\n\nJe la remonte une fois. La flamme grandit, puis baisse presque aussitôt. Sur la table, il y a du papier, une plume et une tasse de thé que je ne peux plus boire. J’ai touché à chacun de ces objets ; aucun n’a donné un autre cours à cette nuit.\n\nJe finis par rester simplement à ma place, à écouter ma respiration dans le silence."
 latria_sexual_frustration_flavor.1201.a: "Écrire les mots que je voulais prononcer."
 latria_sexual_frustration_flavor.1201.b: "Souffler la bougie, étouffer le désir et m’allonger."

 latria_sexual_frustration_flavor.1202.t: "Murmures devant les bains"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Devant les bains, les conversations et les rires se poursuivent sans que personne se soucie de qui accompagne qui. La vapeur passe sous la porte avec une odeur de savon végétal et de pierre chaude. Quelqu’un me croise, les cheveux encore mouillés et le vêtement noué sans soin. Personne n’y prête attention.\n\nCette scène ordinaire ne devrait pas m’arrêter. Je reste pourtant devant le seuil, me rappelant soudain depuis combien de temps je n’ai pas approché quelqu’un avec autant d’aisance. À l’intérieur, une voix rieuse appelle un nom, encore voilée comme au sortir de l’eau. Mes doigts s’immobilisent sur le chambranle.\n\nLe vent pousse la vapeur vers mon visage. Je n’entre pas et ne m’en vais pas davantage."
 latria_sexual_frustration_flavor.1202.desc.strict: "Devant les bains, plusieurs nobles discutent de qui devrait éviter qui. J’entends mon nom ; la conversation s’interrompt aussitôt. L’eau continue de résonner derrière la porte. Dehors, le silence laisse entendre le froissement des vêtements.\n\nQuelqu’un me salue d’un signe de tête trop rapide. Une autre personne arrange une manche déjà parfaitement en place. Je sais de quel genre d’affaire on parlait. Mes oreilles s’échauffent, sans que la vapeur des bains y soit pour rien.\n\nJe reste un moment sans bouger. Derrière la porte, les bruits d’eau se succèdent et semblent mesurer la durée de ce silence."
 latria_sexual_frustration_flavor.1202.desc: "L’eau résonne sans cesse dans les bains, mais les conversations près de la porte me distraient davantage.\n\nJe venais simplement me laver le visage. En arrivant au seuil, j’entends des paroles à voix basse, interrompues par un rire. Il n’est pas bien fort, mais suffit à arrêter mes pas. Je ne sais pas ce qui fait rire ces personnes ; je sais seulement que je ne devrais pas rester là à les écouter.\n\nJ’écoute tout de même la fin de la phrase. Mon visage est alors plus chaud que le linge que je tiens."
 latria_sexual_frustration_flavor.1202.a: "Leur raconter la rencontre que j’espère, sans en finir."
 latria_sexual_frustration_flavor.1202.b: "Écarter cette pensée, les remercier et prendre congé."

 latria_sexual_frustration_flavor.1203.t: "Le silence après la prière"
 latria_sexual_frustration_flavor.1203.desc.favors: "Le prêtre dit que le désir humain n’est pas une faute par nature. Le son de la cloche résonne encore sous les poutres. Il a déjà refermé le livre sacré et me laisse le temps de parler.\n\nJe voudrais le croire, mais ce qui me manque ne me manque pas moins. Je reste à genoux, les yeux sur mes mains. Dans la journée, elles ont distribué du pain ; la nuit, elles voudraient seulement retenir une personne absente. Ma foi le permet. Cette permission ne met pourtant personne à ma portée.\n\nLe prêtre attend une question. Je ne parviens pas à la formuler et me contente d’écarter les cheveux de mon front."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Le prêtre parle des vertus de l’abstinence, puis se tait. Son silence pèse davantage que ses enseignements. Je reste à genoux sur le coussin qui s’est réchauffé sous moi. Les mots de la prière me sont familiers, mais mes pensées suivent une route loin du temple.\n\nJe sais que je devrais répondre. Je ne trouve qu’un souffle, d’où sort un oui presque inaudible. Le prêtre me regarde sans poursuivre ses questions. Ce regard rend mon assentiment moins convaincant encore à mes propres yeux.\n\nLa cloche s’est tue. Il ne reste dans le temple que le crépitement occasionnel d’une mèche."
 latria_sexual_frustration_flavor.1203.desc: "La prière est terminée. Le son de la cloche résonne encore dans le temple.\n\nLes autres se sont relevés. Je reste à genoux, comme si j’avais oublié une phrase. Il n’en manque pourtant aucune ; mon agitation a simplement survécu à la récitation. Elle ne s’en va ni avec les mots ni avec les fidèles.\n\nJe pose les paumes sur les dalles. La pierre est froide, mais sa fraîcheur s’arrête à mes poignets."
 latria_sexual_frustration_flavor.1203.a: "Écarter pour l’instant l’enseignement de l’abstinence."
 latria_sexual_frustration_flavor.1203.b: "Réprimer cette pensée et recommencer la prière."

 latria_sexual_frustration_flavor.1204.t: "Agitation au retour de la chasse"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Sans compagnie dans ma chambre, je n’ai pas encore remis de vêtements. J’entends toujours l’écho de la corde de l’arc. Ma tenue de chasse est jetée sur une chaise, et la boue de mes bottes n’a pas séché. La fatigue pèse sur mes jambes et mes épaules, mais mon esprit est ailleurs.\n\nDans les bois, aujourd’hui, une personne m’a croisé à cheval. Nos manches ne se sont même pas touchées. Je revois pourtant ce passage sans cesse : la main sur les rênes, le léger sourire en se retournant, puis le regard qui ne cherchait plus le mien. À présent, il n’y a ni cheval ni présence auprès de moi, seulement mon reflet dans le miroir de bronze.\n\nJe m’assieds au bord du lit. Le contact de la natte me rappelle que je dois encore enfiler ma chemise."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Sans compagnie dans ma chambre, je n’ai pas encore remis de vêtements. J’essaie de ramener mes pensées à la prière et à mes devoirs. Ma tenue de chasse est pliée de côté ; je n’ai même pas pris le temps de me laver le visage. Chaque fois que je ferme les yeux, le désir revient, plus net que les traces suivies dans les bois.\n\nJe récite intérieurement mes vœux. À mi-chemin, je revois cette personne qui s’est retournée dans la forêt et les mots s’interrompent. J’ouvre les yeux sur mes mains. Elles tremblent encore, sans que je sache si la fatigue de la chasse suffit à l’expliquer.\n\nUn serviteur demande derrière la porte si je souhaite de l’eau chaude. Je réponds d’une voix plus rauque que prévu."
 latria_sexual_frustration_flavor.1204.desc: "Les terres de chasse sont désertes, mais mon agitation ne s’apaise toujours pas.\n\nDe retour dans ma chambre, je dépose l’arc, puis les gants. Je n’arrive pas à me défaire aussi facilement de ce regard aperçu dans la journée. La pièce sent la boue et la sueur. Après un moment debout, je remarque que je fixe la porte, comme dans l’attente de quelqu’un qui m’aurait suivi.\n\nPersonne n’entre. J’ai moi-même fermé la porte."
 latria_sexual_frustration_flavor.1204.a: "Me rappeler cette silhouette aperçue à la chasse."
 latria_sexual_frustration_flavor.1204.b: "M’habiller, regagner mon bureau et étouffer cette pensée."

 latria_sexual_frustration_flavor.1205.t: "Le cabinet fermé"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Je fais sortir tout le monde du cabinet, gardant cartes, sceaux et documents inachevés. Une fois la porte fermée, je n’entends plus que ma respiration. Je tire du tiroir une vieille lettre dont les coins s’effilochent.\n\nElle ne parle pas des affaires de l’empire. Elle évoque une rencontre qui n’a jamais eu lieu et des paroles auxquelles je croyais avoir tout le temps de répondre. Bien des jours ont passé ; la lettre est toujours là. Je pose le sceau dessus, puis le retire. Le sceau est froid, tandis que le papier me semble encore chaud.\n\nDerrière la porte, on me demande doucement s’il faut servir le repas. Je ne réponds pas."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "L’itinéraire et les tours de garde sont sur le papier. Mes compagnons attendent derrière la porte. J’ai prévu les heures de repos de chacun ; ma plume s’arrête lorsque vient mon tour. Un coin de la vieille lettre dépasse du tiroir, comme si notre route ne pouvait suffire à la cacher.\n\nJe la sors. Dès les premiers mots, je sais que ce n’est pas le moment de la lire. Quelqu’un frappe et demande si nous comptons toujours rejoindre la prochaine étape. Je réponds oui, sans quitter la deuxième ligne des yeux.\n\nCette ligne ne contient qu’un nom de lieu. Nous ne passerons pas par là."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Je n’ai aucune compagnie dans le cabinet. Le livre de comptes reste ouvert, et les textes sacrés ne sont pas rangés. Une vieille lettre repose entre leurs pages. Plusieurs fois déjà, j’ai tendu la main avant de la retirer.\n\nCette lettre n’est pas arrivée aujourd’hui. Elle est là depuis si longtemps que je m’arrête chaque fois à cette page. Cette fois, je la sors enfin. Rien dans ses mots ne dépasse les convenances ; ma respiration se trouble pourtant à la lecture.\n\nDes pas passent dans la galerie, accompagnés du léger choc de perles de prière. Je remets la lettre dans le livre et appuie dessus. J’en sens encore le bord."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Les serviteurs attendent devant le cabinet ; je leur ai interdit de me déranger. Le sceau et les documents sont devant moi, mais la vieille lettre n’a toujours pas retrouvé sa place dans le tiroir.\n\nJe devrais examiner la requête concernant les ponts. Ma plume reste suspendue, puis laisse tomber une goutte d’encre. En regardant la tache, je repense à une phrase de la lettre qui ne parle nullement de ponts. Quelques mots à peine ; je sais pourtant exactement sur quelle ligne ils se trouvent.\n\nDerrière la porte, quelqu’un change d’appui. Je repousse la requête et tends la main vers le tiroir."
 latria_sexual_frustration_flavor.1205.desc: "Je ferme la porte du cabinet. La vieille lettre et les affaires inachevées restent sur la table.\n\nLe verrou retombe avec un bruit léger. Ensuite, je n’entends plus que le papier. Je mets les documents à gauche, la lettre à droite. Après les avoir regardés un moment, je ramène la lettre au milieu.\n\nLa mèche crépite. Je ne prends pas la peine de la moucher."
 latria_sexual_frustration_flavor.1205.a: "Remettre le travail au lendemain et relire la lettre."
 latria_sexual_frustration_flavor.1205.b: "Réprimer cet ancien désir et m’occuper de mes devoirs."

 latria_sexual_frustration_flavor.1206.t: "Rumeurs au festin"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Au festin, quelqu’un évoque un amant aussi librement que le temps qu’il fait. Les coupes ont circulé, deux noms ont changé dans l’histoire, et les rires continuent. Personne ne baisse la voix.\n\nJe voulais simplement en rire. Au milieu de mon sourire, je remarque depuis combien de temps je n’ai pas pris part à de tels échanges. Il me faut même regarder les autres avant de savoir où poser ma coupe. À côté de moi, on me demande si j’ai aussi quelque chose à raconter. Mes doigts s’arrêtent sur le bord.\n\nLa musique me parvient à travers la foule. Je l’entends sans reconnaître l’air."
 latria_sexual_frustration_flavor.1206.desc.strict: "Plusieurs nobles parlent d’une connaissance tombée en disgrâce pour avoir manqué aux convenances. Quelqu’un prononce ensuite mon nom. La conversation ne s’interrompt pas tout à fait ; les voix deviennent des murmures. Je baisse les yeux pour arranger ma manche, sans intervenir.\n\nL’histoire qu’ils racontent n’est peut-être pas vraie. Sa véracité compte peu désormais. J’ai moi-même une préoccupation qui ne peut être exposée à table, et leurs regards semblent déjà la connaître. Je vide ma coupe. Le vin me chauffe surtout le visage.\n\nQuelqu’un lève sa coupe pour détourner la conversation. Au choc des gobelets, ma main tremble encore."
 latria_sexual_frustration_flavor.1206.desc: "La musique me parvient à travers la foule, mais les conversations à table me distraient davantage.\n\nJe reste à ma place. Autour de moi, les sujets vont et viennent pour finir par revenir aux chambres et aux lettres privées. Une personne rit, une autre tousse, une autre me regarde du coin de l’œil. Je ne sais si ce regard est fortuit.\n\nJe fais tourner ma coupe vide. Son pied produit un léger bruit contre la table."
 latria_sexual_frustration_flavor.1206.a: "Raconter toute mon ancienne histoire, jusqu’aux mots échangés en privé."
 latria_sexual_frustration_flavor.1206.b: "Retenir ma langue, saluer la tablée et prendre congé."

 latria_sexual_frustration_flavor.1207.t: "Une place vide après la prière"
 latria_sexual_frustration_flavor.1207.desc.favors: "La cérémonie achevée, le prêtre a laissé le livre sacré sur son siège et s’en est allé. Le coussin garde encore le creux de sa présence. Notre foi ne considère pas le désir comme une faute : je viens de lire ces mots sur la page ouverte, à l’encre parfaitement nette.\n\nJe ne sais pourtant toujours pas comment retrouver le calme. Avoir le droit de désirer ne change rien aux nuits passées sans autre compagnie que ses propres mains. Je reste un moment près du siège vide, sans m’asseoir ni refermer le livre.\n\nLe vent rapproche la porte, n’y laissant qu’une fente. La lumière qui la traverse tombe précisément sur cette ligne."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Le prêtre s’est retiré ; je reste à genoux. Les enseignements sur la chasteté sont sans équivoque. Je peux en réciter chaque précepte. Le désir, lui, n’est pas parti avec le prêtre ; je continue de le sentir dans mon immobilité, les mains posées devant moi.\n\nJe regarde le siège vide et me surprends à envier ce bois qui n’a besoin de penser à rien. Je n’en suis pas capable. J’y appuie le front et retrouve seulement ma propre chaleur.\n\nLa bougie a encore raccourci. Je reste à genoux."
 latria_sexual_frustration_flavor.1207.desc: "Il ne reste dans le temple que la bougie allumée et moi.\n\nLes pas des autres se sont éloignés. Je pourrais partir maintenant, refermer la porte et laisser cette page derrière moi. Je ne le fais pas. J’avance de deux pas entre les sièges vides, puis retourne à mon coussin.\n\nLa flamme est tranquille. J’entends pourtant mon pouls résonner dans mes oreilles."
 latria_sexual_frustration_flavor.1207.a: "Quitter le temple et m’attarder sur cette affection."
 latria_sexual_frustration_flavor.1207.b: "Contenir mon désir et relire les préceptes."

 latria_sexual_frustration_flavor.1208.t: "La poursuite dans le bois"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Le gibier traverse les bois et tout le monde se lance à sa poursuite. Je pousse aussi mon cheval. Les branches fouettent mes manches, l’odeur de la sueur des montures me parvient. Après une certaine distance, je m’aperçois que ce n’est pas l’animal que je poursuis.\n\nJe vois devant moi le dos d’une personne de notre compagnie. Une simple compagnie de chasse, rien de plus. Pourtant, je suis chacun de ses mouvements au point de manquer une bifurcation. Les aboiements partent à gauche ; mon cheval continue tout droit.\n\nJe tire sur les rênes. La personne ne se retourne pas. Ma respiration est déjà trop agitée pour que la chasse seule l’explique."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Je retiens mon cheval en me rappelant que je suis ici pour chasser. Les aboiements s’éloignent. Les empreintes de sabots sont nettes dans la boue, mais je dois les examiner deux fois pour comprendre où elles tournent.\n\nMes pensées refusent de suivre les traces. Elles reviennent aux mains qui ont resserré ma sangle tout à l’heure. Elles avaient accompli leur tâche avec assurance, puis s’étaient retirées sans un mot. C’est moi qui ai voulu donner un autre sens à ce geste.\n\nMon cheval s’ébroue. Je remarque enfin depuis combien de temps je reste sur place."
 latria_sexual_frustration_flavor.1208.desc: "La compagnie s’arrête parmi les arbres et attend que je décide de poursuivre ou non.\n\nTous les visages sont tournés vers moi. L’eau goutte encore des harnais ; quelqu’un s’essuie le front. Je regarde les empreintes au sol. Leur direction est claire, ma réponse beaucoup moins. Une partie de mes pensées reste à l’autre bout du bois, auprès d’une personne sans rapport avec le gibier.\n\nLe vent passe entre les arbres. Je tiens les rênes, sans prendre immédiatement la parole."
 latria_sexual_frustration_flavor.1208.a: "Laisser les autres partir devant tandis que mes pensées s’égarent."
 latria_sexual_frustration_flavor.1208.b: "Rassembler mes pensées et mener la chasse plus loin."

 latria_sexual_frustration_flavor.1209.t: "Des braises près de la fenêtre"
 latria_sexual_frustration_flavor.1209.desc.female: "En chemise de nuit, je m’assieds près de la fenêtre. Il ne reste qu’une mince lueur de braise dans le foyer. Les mots que je n’ai pas prononcés aujourd’hui me reviennent aux lèvres, puis reculent encore. La phrase est courte ; seule a été longue mon attente avant de la dire.\n\nUne braise s’avive par instants et éclaire mes mains sur mes genoux. Sans m’en apercevoir, j’agrippe le bord de ma chemise au point de le froisser. Je me rappelle le déplacement d’air d’une manche lorsque cette personne est passée près de moi. Ce n’était qu’un souffle ; je me souviens encore de sa direction.\n\nDehors, la garde annonce l’heure. Je ne réponds pas et ne souhaite pas dormir."
 latria_sexual_frustration_flavor.1209.desc.male: "En chemise de nuit, je m’appuie à la fenêtre et regarde les lanternes de la garde traverser la cour. Elles passent une à une, découpant la nuit en courts moments. Mon affection sans réponse ne se laisse pas diviser ainsi ; elle demeure entière.\n\nJe pose le front contre le croisillon. Le bois sent le vieux vernis. Je repense à cette personne qui regardait ailleurs en me parlant, comme si nos regards risquaient de changer le sens de ses mots. J’avais moi aussi détourné les yeux. Ensuite, aucun de nous n’avait poursuivi.\n\nDans le foyer, un morceau de charbon craque et s’affaisse."
 latria_sexual_frustration_flavor.1209.desc: "Tout est calme derrière la fenêtre. Le foyer s’assombrit, mais je n’ai pas sommeil.\n\nJ’ajoute un petit morceau de bois. Le feu ne reprend pas ; il laisse seulement monter un peu de fumée, dont l’odeur reste dans ma chemise. Je retourne près de la fenêtre et répète intérieurement la phrase que je n’ai pas adressée à son destinataire aujourd’hui. Une fois encore, personne ne l’entend.\n\nLa nuit recouvre la cour. Je la regarde sans rien trouver qui me réponde."
 latria_sexual_frustration_flavor.1209.a: "Coucher mes pensées sur le papier."
 latria_sexual_frustration_flavor.1209.b: "Raviver le feu, écarter ce désir et m’allonger."

 latria_sexual_frustration_flavor.1210.t: "Personne ne frappe à la porte"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Les serviteurs ont rangé la couronne de cérémonie. En chemise de nuit, je reste sans compagnie au bord du lit. Les frontières de l’empire, les registres d’impôts et les audiences du lendemain n’ont pas chassé cette affaire privée. J’y pense en regardant l’autre bout du lit, bien qu’il n’y ait personne.\n\nJ’examine cette moitié vide. L’oreiller est lisse, le coin de la couverture aussi. Cet ordre même me semble un reproche. J’y pose la main. Le tissu est froid, et je laisse ma main en place malgré cette fraîcheur.\n\nUne lampe s’éteint dans la galerie. Personne ne vient frapper à ma porte."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Mes compagnons se sont couchés à l’auberge. En chemise de nuit, je reste auprès d’une lettre que je n’ai pas envoyée. Demain, nous reprendrons la route ; les chevaux ont déjà été nourris. Je ne peux pourtant laisser ici ce qui m’occupe. Cela suivra mon paquetage jusqu’au prochain gué.\n\nJe tourne la lettre sous la lampe. La formule d’adresse est trop appuyée pour un simple courrier expédié en chemin. Au rez-de-chaussée, quelqu’un règle sa note dans un tintement de pièces de cuivre. Quand le bruit cesse, la chambre paraît plus silencieuse encore.\n\nJe glisse la lettre entre mes vêtements. Même cachée, je sais exactement où elle se trouve."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Je suspends mes vêtements rituels près du lit et m’assieds dans la petite chambre, sans compagnie, en chemise de nuit. Mes vœux résonnent encore à mes oreilles ; je viens de les réciter moi-même. Ils n’ont pas apaisé mes pensées. Mes doigts restent depuis longtemps sur la même perle de prière.\n\nJe voudrais consacrer cette nuit à ce qui mérite ma dévotion. Mais dès que le calme se fait, un visage apparaît, qui ne devrait pas figurer dans mes prières. Je serre les perles jusqu’à ce qu’elles me blessent la paume. Le visage demeure.\n\nLa porte de la chambre est mal fermée. Un courant d’air passe dans la fente et incline la flamme."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Mes habits de cérémonie sont rangés. En chemise de nuit, je reste au bord du lit. Les gardes n’ont pas entendu mon soupir derrière la porte ; mon rang n’a rien réglé de cette préoccupation privée. J’essaie de revoir l’ordre des audiences du lendemain, mais je m’arrête à la troisième personne.\n\nCette personne n’a rien à voir avec les audiences. Je n’arrive pourtant pas à aller plus loin. La lampe près du lit projette mon ombre sur le mur ; elle semble se tenir plus droite que moi.\n\nJe baisse la mèche. L’ombre se tasse, mais je ne quitte pas ma place."
 latria_sexual_frustration_flavor.1210.desc: "La nuit est avancée. Je reste sans compagnie avec cette préoccupation.\n\nLa porte est fermée, la lampe allumée, le lit n’a de place que pour moi. Rien de tout cela n’a changé. En revanche, je ne prétends plus pouvoir m’endormir aussitôt. Je pose mon vêtement sur le dossier de la chaise, puis le reprends, comme si quelqu’un allait m’appeler au-dehors.\n\nPersonne n’appelle. Je repose le vêtement sur la chaise."
 latria_sexual_frustration_flavor.1210.a: "Faire venir une connaissance de confiance malgré l’heure et parler longuement."
 latria_sexual_frustration_flavor.1210.b: "Réprimer le désir, souffler la bougie et m’allonger."

 latria_sexual_frustration_flavor.1202.c: "Changer de sujet et prendre des nouvelles de mes compagnons."
 latria_sexual_frustration_flavor.1202.d: "Les inviter tous à prendre le thé et parler jusqu’à la fatigue."
 latria_sexual_frustration_flavor.1203.c: "Demander au prêtre de rester pour étudier les enseignements avec moi."
 latria_sexual_frustration_flavor.1204.c: "Passer ma chemise de nuit et démêler lentement les pensées du jour."
 latria_sexual_frustration_flavor.1205.c: "Organiser les tours de garde et m’accorder un peu de repos."
 latria_sexual_frustration_flavor.1205.d: "Énumérer les devoirs du lendemain, un à un."
 latria_sexual_frustration_flavor.1206.c: "Détourner la conversation avec un nouveau poème."
 latria_sexual_frustration_flavor.1207.c: "M’asseoir devant les Écritures et achever ce chapitre."
 latria_sexual_frustration_flavor.1208.c: "Reposer les chevaux et étudier les traces à loisir."
 latria_sexual_frustration_flavor.1209.c: "Raviver le feu, préparer du thé et lire un vieux livre."
 latria_sexual_frustration_flavor.1209.d: "Faire un poème des mots que je n’ai jamais prononcés."
 latria_sexual_frustration_flavor.1210.c: "Préparer le lendemain et mettre chaque tâche en ordre."
