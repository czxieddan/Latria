l_french:
 latria_sexual_frustration_flavor.1201.t: "Une heure sans visite"
 latria_sexual_frustration_flavor.1201.desc.female: "En chemise de nuit, j’attends près de la fenêtre jusqu’à ce que le thé ait refroidi. Aucune rencontre n’a jamais été promise, mais je lui garde toujours une place dans mes pensées."
 latria_sexual_frustration_flavor.1201.desc.male: "En chemise de nuit, j’attends près de la fenêtre. Seule la garde de nuit traverse la cour. Personne ne viendra, mais je ne me résous pas à souffler la bougie."
 latria_sexual_frustration_flavor.1201.desc: "La mèche se consume. Rien ne bouge au-delà de la fenêtre."
 latria_sexual_frustration_flavor.1201.a: "Écrire les mots que je voulais prononcer."
 latria_sexual_frustration_flavor.1201.b: "Souffler la bougie, étouffer le désir et m’allonger."

 latria_sexual_frustration_flavor.1202.t: "Murmures devant les bains"
 latria_sexual_frustration_flavor.1202.desc.accepted: "Des rires s’échappent des bains, sans que personne s’inquiète de qui accompagne qui. Ce devrait être une scène ordinaire, mais je me souviens du temps écoulé depuis ma dernière insouciance."
 latria_sexual_frustration_flavor.1202.desc.strict: "Devant les bains, plusieurs nobles discutent de qui doit éviter qui. J’entends mon nom, et la conversation s’arrête."
 latria_sexual_frustration_flavor.1202.desc: "L’eau résonne dans les bains. Les voix dehors me distraient davantage."
 latria_sexual_frustration_flavor.1202.a: "Leur raconter la rencontre que j’espère, sans en finir."
 latria_sexual_frustration_flavor.1202.b: "Écarter cette pensée, les remercier et prendre congé."

 latria_sexual_frustration_flavor.1203.t: "Le silence après la prière"
 latria_sexual_frustration_flavor.1203.desc.favors: "Le prêtre dit que le désir n’est pas un péché en soi. Je voudrais le croire, mais le vide dans mon cœur demeure."
 latria_sexual_frustration_flavor.1203.desc.condemns: "Le prêtre parle de la vertu de chasteté, puis se tait. Je reste à genoux, la prière familière aux lèvres et l’esprit loin d’ici."
 latria_sexual_frustration_flavor.1203.desc: "La prière est terminée. Les cloches du temple résonnent encore à mes oreilles."
 latria_sexual_frustration_flavor.1203.a: "Écarter pour l’instant l’enseignement de l’abstinence."
 latria_sexual_frustration_flavor.1203.b: "Réprimer cette pensée et recommencer la prière."

 latria_sexual_frustration_flavor.1204.t: "Agitation au retour de la chasse"
 latria_sexual_frustration_flavor.1204.desc.lustful: "Dans la solitude de ma chambre, sans vêtements, j’entends encore l’écho de la corde de l’arc. Mon corps est fatigué, mais mes pensées suivent chaque ombre sur le terrain de chasse."
 latria_sexual_frustration_flavor.1204.desc.chaste: "Dans la solitude de ma chambre, sans vêtements, je tente de ramener mes pensées vers la prière et mes devoirs. Chaque fois que je ferme les yeux, le désir revient."
 latria_sexual_frustration_flavor.1204.desc: "Le terrain de chasse est désert, mais mon agitation ne s’apaise pas."
 latria_sexual_frustration_flavor.1204.a: "Me rappeler cette silhouette aperçue à la chasse."
 latria_sexual_frustration_flavor.1204.b: "M’habiller, regagner mon bureau et étouffer cette pensée."

 latria_sexual_frustration_flavor.1205.t: "Le cabinet fermé"
 latria_sexual_frustration_flavor.1205.desc.emperor: "Je fais vider le cabinet, n’y laissant que cartes, sceaux et documents inachevés. J’ai tiré une vieille lettre du tiroir, mais ne peux me résoudre à la relire."
 latria_sexual_frustration_flavor.1205.desc.adventurer: "L’itinéraire et les tours de garde sont inscrits sur la table. Mes compagnons attendent dehors ; j’ai prévu du repos pour tous, mais une vieille lettre me revient en tête lorsque je songe à mes propres heures."
 latria_sexual_frustration_flavor.1205.desc.clergy: "Dans la solitude du cabinet, je n’ai refermé ni les comptes ni les Écritures. Une vieille lettre repose entre les pages. Sans cesse, je tends la main et la retire."
 latria_sexual_frustration_flavor.1205.desc.ruler: "Mes domestiques attendent derrière la porte du cabinet. Je leur interdis de me déranger. Les sceaux et les documents restent devant moi, mais je n’ai pas encore remis la vieille lettre dans son tiroir."
 latria_sexual_frustration_flavor.1205.desc: "Je ferme la porte du cabinet, laissant sur la table la vieille lettre et le travail inachevé."
 latria_sexual_frustration_flavor.1205.a: "Remettre le travail au lendemain et relire la lettre."
 latria_sexual_frustration_flavor.1205.b: "Réprimer cet ancien désir et m’occuper de mes devoirs."

 latria_sexual_frustration_flavor.1206.t: "Rumeurs au festin"
 latria_sexual_frustration_flavor.1206.desc.accepted: "Quelqu’un au festin parle d’un amant aussi simplement que du temps qu’il fait. Je veux en rire, puis remarque combien il y a longtemps que je n’ai pris part à de tels propos."
 latria_sexual_frustration_flavor.1206.desc.strict: "Plusieurs nobles évoquent un courtisan tombé en disgrâce pour inconvenance, et l’un d’eux prononce mon nom. Je lisse ma manche sans me joindre à eux."
 latria_sexual_frustration_flavor.1206.desc: "La musique parvient à travers la foule. Leur conversation me distrait davantage."
 latria_sexual_frustration_flavor.1206.a: "Raconter toute mon ancienne histoire, jusqu’aux mots échangés en privé."
 latria_sexual_frustration_flavor.1206.b: "Retenir ma langue, saluer la tablée et prendre congé."

 latria_sexual_frustration_flavor.1207.t: "Une place vide après la prière"
 latria_sexual_frustration_flavor.1207.desc.favors: "Après l’office, le prêtre laisse son livre sur le banc et s’en va. Ma foi ne condamne pas le désir, mais je ne parviens pas à apaiser mes pensées."
 latria_sexual_frustration_flavor.1207.desc.condemns: "Le prêtre est parti, mais je reste à genoux. L’enseignement sur la chasteté est clair ; le désir qui m’habite ne s’est pas éteint."
 latria_sexual_frustration_flavor.1207.desc: "Il ne reste que la bougie et moi dans le temple silencieux."
 latria_sexual_frustration_flavor.1207.a: "Quitter le temple et m’attarder sur cette affection."
 latria_sexual_frustration_flavor.1207.b: "Contenir mon désir et relire les préceptes."

 latria_sexual_frustration_flavor.1208.t: "La poursuite dans le bois"
 latria_sexual_frustration_flavor.1208.desc.lustful: "Le gibier se glisse entre les arbres, et les autres se lancent à sa poursuite. Je les suis à cheval, mais un autre désir retient toujours mes pensées."
 latria_sexual_frustration_flavor.1208.desc.chaste: "Je retiens mon cheval et me rappelle que je ne suis venu que pour chasser. Les aboiements s’éloignent, mais mes pensées demeurent."
 latria_sexual_frustration_flavor.1208.desc: "Le groupe s’arrête parmi les arbres, attendant mon ordre de poursuivre."
 latria_sexual_frustration_flavor.1208.a: "Laisser les autres partir devant tandis que mes pensées s’égarent."
 latria_sexual_frustration_flavor.1208.b: "Rassembler mes pensées et mener la chasse plus loin."

 latria_sexual_frustration_flavor.1209.t: "Des braises près de la fenêtre"
 latria_sexual_frustration_flavor.1209.desc.female: "En chemise de nuit, je m’assieds près de la fenêtre tandis que le foyer se réduit à des braises. Les mots tus pendant le jour me reviennent maintenant."
 latria_sexual_frustration_flavor.1209.desc.male: "En chemise de nuit, je m’appuie contre la fenêtre et regarde la garde traverser la cour. Une affection sans réponse refuse de quitter mes pensées."
 latria_sexual_frustration_flavor.1209.desc: "Tout est calme au-delà de la fenêtre. Le feu baisse, mais je n’ai pas sommeil."
 latria_sexual_frustration_flavor.1209.a: "Coucher mes pensées sur le papier."
 latria_sexual_frustration_flavor.1209.b: "Raviver le feu, écarter ce désir et m’allonger."

 latria_sexual_frustration_flavor.1210.t: "Personne ne frappe à la porte"
 latria_sexual_frustration_flavor.1210.desc.emperor: "Mes domestiques ont rangé la couronne. Je reste en chemise de nuit près du lit ; les fardeaux de l’empire ne me font pas oublier ce que je ne parviens pas à dire."
 latria_sexual_frustration_flavor.1210.desc.adventurer: "Mes compagnons se sont couchés à l’auberge. En chemise de nuit, je reste près d’une lettre non envoyée ; demain nous repartirons, mais ce souci voyagera avec moi."
 latria_sexual_frustration_flavor.1210.desc.clergy: "Je suspends mes vêtements liturgiques près du lit et m’assieds en chemise de nuit, sans compagnie. Mon vœu résonne encore à mes oreilles, mais mes pensées ne s’apaisent pas."
 latria_sexual_frustration_flavor.1210.desc.ruler: "Mes habits de cérémonie sont rangés. En chemise de nuit près du lit, je ne laisse aucun soupir parvenir aux gardes, et ma charge ne règle pas cette affaire privée."
 latria_sexual_frustration_flavor.1210.desc: "Il est tard, et je reste sans compagnie avec ce souci."
 latria_sexual_frustration_flavor.1210.a: "Faire venir une connaissance de confiance malgré l’heure et parler longuement."
 latria_sexual_frustration_flavor.1210.b: "Réprimer le désir, souffler la bougie et m’allonger."

 latria_sexual_frustration_flavor.1202.c: "Changer de sujet et prendre des nouvelles de mes compagnons."
 latria_sexual_frustration_flavor.1202.d: "Les inviter tous à prendre le thé et parler jusqu’à la fatigue."
 latria_sexual_frustration_flavor.1203.c: "Demander au prêtre de rester pour étudier les enseignements avec moi."
 latria_sexual_frustration_flavor.1204.c: "Passer ma chemise de nuit et démêler lentement les pensées du jour."
 latria_sexual_frustration_flavor.1205.c: "Organiser les tours de garde et m’accorder un peu de repos."
 latria_sexual_frustration_flavor.1205.d: "Énumérer les devoirs du lendemain, un à un."
 latria_sexual_frustration_flavor.1206.c: "Détourner la conversation avec un nouveau poème."
 latria_sexual_frustration_flavor.1207.c: "M’asseoir devant les Écritures et achever ce chapitre."
 latria_sexual_frustration_flavor.1208.c: "Reposer les chevaux et étudier les traces à loisir."
 latria_sexual_frustration_flavor.1209.c: "Raviver le feu, préparer du thé et lire un vieux livre."
 latria_sexual_frustration_flavor.1209.d: "Faire un poème des mots que je n’ai jamais prononcés."
 latria_sexual_frustration_flavor.1210.c: "Préparer le lendemain et mettre chaque tâche en ordre."
