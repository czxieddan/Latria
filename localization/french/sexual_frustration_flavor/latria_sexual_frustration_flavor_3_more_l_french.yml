 latria_sexual_frustration_flavor.1211.t: "La lampe laissée allumée"
 latria_sexual_frustration_flavor.1211.desc: "La maison est devenue assez silencieuse pour que j'entende la lampe. Je n'ai appelé personne. J'ai tout de même sorti deux coupes, et la seconde est là, vide. Le pain est encore sous le linge où je l'ai laissé à midi.\n\nCe que je garde, c'est une épaule contre la mienne dans une embrasure, son poids, la façon dont ni l'un ni l'autre n'a bougé le temps d'un souffle. Ma peau a gardé cela. Cela revient à cette heure, sous la chemise de nuit, derrière mes genoux et plus bas, et ma main se pose à plat sur mon ventre pour l'apaiser et ne l'apaise pas.\n\nLa mèche penche. Je tourne la coupe vide pour que son anse fasse face à la chaise."
 latria_sexual_frustration_flavor.1211.a: "Éteindre la lampe et laisser ma propre main l'achever."
 latria_sexual_frustration_flavor.1211.b: "Moucher la mèche, boire le thé froid et dormir."
 latria_sexual_frustration_flavor.1211.c: "Lire jusqu'à ce que les mots cessent de tourner."

 latria_sexual_frustration_flavor.1212.t: "Le conseil attend"
 latria_sexual_frustration_flavor.1212.desc: "On lit les pétitions à voix haute et je n'en entends aucune. Mon intendant se tient au bord de la table, les mains jointes derrière le dos, et je regarde la ligne de sa gorge depuis la deuxième page. La pluie s'est arrêtée et il fait trop chaud dans la pièce. Le feu crépite derrière moi et se pose.\n\nL'intendant se penche pour déplacer une chandelle et une manche effleure mon poignet. Ni l'un ni l'autre ne dit rien. La pièce sent la cire chaude et la laine mouillée. Je pourrais lever la séance. Le mot est déjà dans ma bouche et je l'y tiens, et l'intendant attend, les yeux sur le sceau.\n\nLe clerc demande si j'ai décidé. Je n'ai rien décidé."
 latria_sexual_frustration_flavor.1212.a: "Lever la séance et retenir l'intendant sous un prétexte inventé."
 latria_sexual_frustration_flavor.1212.b: "Trancher sur les pétitions et garder les yeux sur la page."
 latria_sexual_frustration_flavor.1212.c: "Porter les papiers à la table des cartes et travailler toute la nuit."

 latria_sexual_frustration_flavor.1213.t: "À quoi sert le noir"
 latria_sexual_frustration_flavor.1213.desc: "La porte est barrée. Je n'ai pas pris la peine de m'habiller, et le drap est au sol où je l'ai rejeté. La pièce sent la chandelle et ma propre peau.\n\nMon corps a été bruyant tout le jour et il l'est plus encore. Je laisse mes genoux s'ouvrir et ma main descendre sur mon ventre, plus bas, et je ne prétends pas faire autre chose. Ce qui vient, c'est une bouche à ma clavicule, des poignets tenus et aimés, et je la suis jusqu'à ce que mes hanches se soulèvent du matelas et que mon souffle se brise dans le noir.\n\nAprès, la pièce est la même pièce. Je reste le bras sur les yeux. La chandelle s'est consumée en flaque et je n'ai pas dormi."
 latria_sexual_frustration_flavor.1213.a: "Laisser ma main achever et dormir ensuite."
 latria_sexual_frustration_flavor.1213.b: "Ramasser le drap et rester sans bouger jusqu'à l'aube."
 latria_sexual_frustration_flavor.1213.c: "M'habiller, descendre et arpenter les remparts jusqu'à ce que le ciel grise."
 latria_sexual_frustration_flavor.1213.d: "M'y donner encore, et encore, jusqu'à ce que la chandelle meure."

 latria_sexual_frustration_flavor.1214.t: "L'heure avant les laudes"
 latria_sexual_frustration_flavor.1214.desc: "Il n'y a que moi dans l'église, avec les lampes que je dois moucher. Le froid monte à travers les dalles et les saints regardent par-delà moi vers la porte. Sous la soutane, mon corps est chaud et éveillé et tout à fait indifférent à l'heure.\n\nJe connais les mots pour cela. Je les ai dits sur d'autres dans la boîte de bois près de la porte, de la voix que je prends pour leurs péchés. Les dire sur moi-même ne fait rien. Le désir se tient derrière mes côtes comme une braise avalée. Je presse ma paume à plat sur la pierre de l'autel jusqu'à ce que cela fasse mal.\n\nLa cloche va sonner bientôt. Ma main est encore sur la pierre, et la pierre n'est plus froide."
 latria_sexual_frustration_flavor.1214.a: "Prendre le désir entre mes propres mains et demander pardon ensuite."
 latria_sexual_frustration_flavor.1214.b: "Rester à genoux le temps de l'office et laisser les heures l'user."
 latria_sexual_frustration_flavor.1214.c: "Ouvrir le livre et lire les psaumes jusqu'à ce que les mots tiennent."

 latria_sexual_frustration_flavor.1215.t: "Un genou sous la table"
 latria_sexual_frustration_flavor.1215.desc: "La salle est bruyante. Le chien de quelqu'un est sous les bancs et le vin a fait deux fois le tour. Mon voisin n'a pas écarté son genou du mien depuis le gibier, et le banc est devenu chaud là où nous nous touchons. Les joncs sentent le vin foulé.\n\nChaque fois que la table tremble de rires, la pression se déplace et revient. J'ai cessé de suivre la dispute sur la frontière. Je pose ma main sur le banc près de la sienne et l'y laisse. On regarde la main, puis le mur du fond, et le genou reste. Mon genou s'est engourdi et je ne l'ai pas bougé.\n\nUne coupe se renverse. Le vin court au bord et goutte sur les joncs. Personne n'a bougé."
 latria_sexual_frustration_flavor.1215.a: "Le dire clairement, ici, et laisser la salle entendre."
 latria_sexual_frustration_flavor.1215.b: "Remercier la table, me lever et prendre l'air dehors."
 latria_sexual_frustration_flavor.1215.c: "Me tourner vers cette personne et parler d'autre chose jusqu'à ce que le feu soit bas."

 latria_sexual_frustration_flavor.1216.t: "Des manches au jardin"
 latria_sexual_frustration_flavor.1216.desc: "Les pivoines ont dépassé leur mieux et le jardinier a cessé de feindre de travailler. Nous prenons le long chemin autour de l'étang, car le court finit à la grille. L'après-midi a pris la couleur du thé faible.\n\nSa manche ne cesse de trouver le dos de ma main. Chez moi, un contact pareil serait une décision déjà prise, et l'on aurait mandé les entremetteurs avant que le thé refroidisse. Ici, ce n'est qu'une manche, et c'est à moi de la lire. Je ralentis. On ralentit. L'eau tient nos deux reflets et ni l'un ni l'autre ne bouge le premier.\n\nÀ la grille, on s'arrête et l'on se retourne une fois. Il y a des pétales sous mon soulier."
 latria_sexual_frustration_flavor.1216.a: "Le demander clairement et en répondre devant ma maison."
 latria_sexual_frustration_flavor.1216.b: "Saluer, garder les mains dans mes manches et rentrer."
 latria_sexual_frustration_flavor.1216.c: "Refaire le tour de l'étang à l'écart jusqu'à ce qu'on allume les lampes."

 latria_sexual_frustration_flavor.1217.t: "Le long trajet de retour"
 latria_sexual_frustration_flavor.1217.desc: "Nous sommes en selle depuis avant le jour, et depuis trois milles j'ai conscience du cavalier devant moi. De sa façon de se tenir. De sa façon de se retourner au gué. Mes cuisses sont écorchées et ma bouche est sèche et rien de tout cela n'est la raison pour laquelle je continue de le regarder.\n\nLes cerfs sont partis, les rabatteurs éparpillés, et personne ne remarquerait un retard. Mes mains sont froides sur les rênes et le reste de moi n'est pas froid du tout. Je talonne le cheval et réduis la distance à rien. Le bois crépite d'eau.\n\nLe cavalier se retourne au bruit et attend. Le bois est plein de feuilles mouillées et les chevaux soufflent."
 latria_sexual_frustration_flavor.1217.a: "L'emmener sous les arbres et rentrer en retard."
 latria_sexual_frustration_flavor.1217.b: "Chevaucher jusqu'au pavillon et plonger la pensée dans l'eau froide."
 latria_sexual_frustration_flavor.1217.c: "Descendre de selle et lire les traces jusqu'à ce que mes mains cessent de trembler."

 latria_sexual_frustration_flavor.1218.t: "Une chambre aux livres empruntés"
 latria_sexual_frustration_flavor.1218.desc: "Le lettré qui me laisse dormir dans sa resserre m'a laissé la lampe et un livre que je lis mal. La pluie aux volets, et l'odeur du chaume mouillé. Mon corps est agité depuis la dernière ville, et le lit étroit empire les choses. La lampe fume quand le courant d'air la trouve.\n\nLe lettré entre pour voir la mèche et se tient, les doigts sur l'étagère, et je sens l'encre sur cette main. Je lui demande de rester et d'expliquer la page. Le lettré le fait. Son épaule repose contre la mienne tandis qu'on m'indique le passage, et ni l'un ni l'autre ne la bouge, et j'ai cessé d'entendre la grammaire.\n\nLa pluie faiblit. Le doigt est encore sur la même ligne."
 latria_sexual_frustration_flavor.1218.a: "Chanter, mal, jusqu'à ce que le désir ait où aller."
 latria_sexual_frustration_flavor.1218.b: "Remercier, éteindre la lampe et me coucher le dos à la porte."
 latria_sexual_frustration_flavor.1218.c: "Demander de poursuivre la leçon et garder les mains sur la page."
 latria_sexual_frustration_flavor.1218.d: "Copier le passage trois fois jusqu'à ce que ma main soit trop lasse pour vouloir."

 latria_sexual_frustration_flavor.1219.t: "La salle derrière la grand-salle"
 latria_sexual_frustration_flavor.1219.desc: "Le festin s'est vidé dans la cour, et nous deux avons fini dans la petite pièce derrière la salle où l'on range les bancs de rechange. Cette personne a le dos à la porte et une main à plat sur ma poitrine, et l'on rit de moi, dans l'attente.\n\nJ'obtiens l'agrafe de la ceinture, puis les laçages, et l'on rit encore et l'on m'aide. Une bouche est à ma gorge et une cuisse vient entre les miennes, et je suis au-delà de toute feinte. Nous prenons notre temps sur le banc, les cheveux se dénouant, mon souffle devenu rauque, jusqu'à ce qu'un frisson prenne l'autre et que je suive.\n\nAprès, on me tient encore le poignet. La musique a repris dans la salle."
 latria_sexual_frustration_flavor.1219.a: "Dire la vérité et garder sa main dans la mienne."
 latria_sexual_frustration_flavor.1219.b: "Rajuster mes vêtements, remercier et regagner la salle."
 latria_sexual_frustration_flavor.1219.c: "Rester sur le banc avec cette personne jusqu'à ce que la musique s'arrête."

 latria_sexual_frustration_flavor.1220.t: "La veille que j'ai tenue"
 latria_sexual_frustration_flavor.1220.desc: "J'ai dit aux autres que je garderais la veille, et ils m'ont laissé l'église, une chandelle et l'odeur de l'encens de la semaine passée. Minuit est venu et reparti. Mes genoux me font mal et mon corps ne veut pas se taire. Les dalles ont pris la chaleur de mes pieds.\n\nChaque fois que je ferme les yeux, il y a une main au creux de mes reins, venue d'une danse d'il y a deux hivers, et je dois les rouvrir. La chandelle jette mon ombre sur le mur. Je pourrais en finir en un instant et personne ne le saurait jamais, et c'est là tout le mal.\n\nIl y a un courant d'air de la porte. Mon ombre bouge sur le mur."
 latria_sexual_frustration_flavor.1220.a: "Le prendre ici entre mes propres mains et être franc avec les saints."
 latria_sexual_frustration_flavor.1220.b: "Rester à genoux jusqu'à ce que la fenêtre grise."
 latria_sexual_frustration_flavor.1220.c: "Lire l'office à voix haute jusqu'à ce que ma voix soit la seule chose dans la pièce."

 latria_sexual_frustration_flavor.1221.t: "Le gant de l'envoyé"
 latria_sexual_frustration_flavor.1221.desc: "L'envoyé est depuis trois jours dans ma salle et j'en ai compté chacun. L'envoyé ôte son gant pour tourner les pages du traité, doigt après doigt, et j'ai perdu deux fois la clause sur le fleuve. Le feu s'est consumé et personne n'a été envoyé chercher du bois.\n\nMes conseillers me regardent ne pas écouter. Il y a dans la ville un endroit où personne ne demande de nom, et la pensée de cet endroit me pèse sur la poitrine depuis le deuxième matin, lourde et chaude et tout à fait indigne. Voilà un an que je n'ai pas passé cette porte-là.\n\nL'envoyé tend le gant pour que je regarde le sceau. Je le prends. Il est encore chaud."
 latria_sexual_frustration_flavor.1221.a: "Signer, congédier l'envoyé et descendre en ville ce soir."
 latria_sexual_frustration_flavor.1221.b: "Relire la clause et garder les mains sur la table."
 latria_sexual_frustration_flavor.1221.c: "Écouler les clauses une à une jusqu'à ce que les chandelles coulent."
 latria_sexual_frustration_flavor.1221.d: "Découvrir quelle porte en ville est la discrète."

 latria_sexual_frustration_flavor.1222.t: "Une main tenue trop longtemps"
 latria_sexual_frustration_flavor.1222.desc: "La danse en est venue à la mesure lente et l'on m'a passé de main en main toute la soirée. Le dernier ne lâche pas quand la musique s'arrête. La salle est chaude de chandelles et de l'odeur du vin des autres. Les joncs sont foulés à plat et les chandelles coulent.\n\nUn pouce est sur mes jointures. La salle regarde en feignant de ne pas le faire, mes oreilles sont brûlantes, et je ne reprends pas ma main. Quelqu'un rit près des musiciens. L'étreinte se resserre une fois, délibérée, et tout mon corps répond avant que je puisse composer mon visage. Ma main n'est pas assurée dans la sienne. La musique reprend derrière moi.\n\nOn lâche. L'empreinte des doigts reste sur ma main."
 latria_sexual_frustration_flavor.1222.a: "Dire ce que je veux là où toute la salle peut l'entendre."
 latria_sexual_frustration_flavor.1222.b: "Remercier pour la danse et reculer dans la foule."
 latria_sexual_frustration_flavor.1222.c: "Demander de m'accompagner à la porte et parler chevaux."

 latria_sexual_frustration_flavor.1223.t: "Le gué"
 latria_sexual_frustration_flavor.1223.desc: "Nous nous arrêtons au gué pour faire boire les chevaux, et il fait assez chaud pour que la moitié de la troupe entre dans l'eau. Je me tiens sur la roche plate, ma chemise ôtée, à la tordre, quand je remarque la personne restée en selle, qui regarde. L'eau est bruyante sur les pierres. Les chevaux boivent et déplacent leurs pieds.\n\nCette personne ne détourne pas les yeux quand je la surprends. L'eau ruisselle le long de mes côtes et de mon poignet. Il y a beaucoup à faire d'un après-midi et tout un bois pour le faire, et mon corps a déjà décidé, et il rend difficile de penser aux chevaux.\n\nOn met pied à terre. Les rênes sont encore dans la main."
 latria_sexual_frustration_flavor.1223.a: "Lâcher la chemise et aller vers cette personne devant qui veut regarder."
 latria_sexual_frustration_flavor.1223.b: "Remettre la chemise et chevaucher en avant jusqu'au pavillon."
 latria_sexual_frustration_flavor.1223.c: "Sortir le faucon et occuper mes mains jusqu'à ce que la troupe soit prête."

 latria_sexual_frustration_flavor.1224.t: "Deux cavaliers et l'herbe"
 latria_sexual_frustration_flavor.1224.desc: "L'herbe est assez haute pour cacher un cheval, et le ciel fait ce qu'il fait avant la pluie. Nous chevauchons côte à côte depuis que le troupeau a tourné, et une jambe est contre la mienne depuis le dernier furlong, et ni l'un ni l'autre ne l'a corrigé. Le vent sent les tiges écrasées. Les chevaux sont mouillés au genou.\n\nIci, il n'y a pas de mur derrière quoi se cacher et pas de prêtre à une journée de cheval. Cela n'a jamais rendu le désir plus simple. Cela l'a seulement rendu plus vaste, comme la terre est plus vaste, et j'ai cessé de feindre de ne pas savoir où cela va.\n\nOn s'arrête à la crête et l'on me regarde par-dessus l'épaule. Les premières gouttes tombent."
 latria_sexual_frustration_flavor.1224.a: "Prendre cette main et la mener dans les hautes herbes."
 latria_sexual_frustration_flavor.1224.b: "Faire un signe, tourner mon cheval et faire la course jusqu'aux chariots."
 latria_sexual_frustration_flavor.1224.c: "Placer la cible au poteau du fond et tirer jusqu'à ce que mes bras tremblent."

 latria_sexual_frustration_flavor.1225.t: "Ce que j'ai dit dans la boîte"
 latria_sexual_frustration_flavor.1225.desc: "J'étais à genoux dans la boîte de bois et je l'ai dit tout haut, ce qui était pire que de ne rien dire. Le prêtre de l'autre côté du treillis n'a ni suffoqué ni grondé. On m'a posé une question sur ma propre maison et on a attendu, et j'ai entendu ma propre voix donner la réponse. L'église sent la pierre froide.\n\nEn retraversant l'église, j'ai encore le visage brûlant. Ce n'est pas la honte, ou pas seulement. L'avoir dit, je peux en sentir le tout de nouveau, au grand jour, devant l'autel, et mon corps n'a aucune manière. Mon col est trop serré.\n\nOn est encore dans la boîte. Le rideau bouge quand je passe."
 latria_sexual_frustration_flavor.1225.a: "Retourner à la boîte et demander d'entendre le reste."
 latria_sexual_frustration_flavor.1225.b: "M'agenouiller à la balustrade et recevoir la pénitence et les paroles qu'on me donne."
 latria_sexual_frustration_flavor.1225.c: "M'asseoir dans le bas-côté et écouter l'enseignement jusqu'à ce que je sois calme."

 latria_sexual_frustration_flavor.1226.t: "L'éveil à la quatrième heure"
 latria_sexual_frustration_flavor.1226.desc: "Je sors du rêve, le cœur battant et les cuisses humides et le drap rejeté au pied du lit. Dans le rêve, c'était la cour des écuries et une main sur ma nuque, et je sais à qui est cette main. La pièce est froide et l'oreiller est mouillé là où était ma bouche.\n\nLa pièce est grise. Il n'y a personne dedans. Mon corps n'a cure du gris ni de l'heure. Il veut le rêve achevé et il est très clair sur la manière. Je mets mon bras en travers des yeux et reste là, les genoux remontés. Le sol est assez froid pour faire mal.\n\nL'oiseau sous l'avant-toit commence. Ma main bouge déjà."
 latria_sexual_frustration_flavor.1226.a: "L'achever et laisser la maisonnée me trouver dans le sommeil."
 latria_sexual_frustration_flavor.1226.b: "Se lever, s'habiller et aller aux écuries travailler jusqu'à en avoir mal."
 latria_sexual_frustration_flavor.1226.c: "Lire la lettre sur la table jusqu'à ce que le jour vienne vraiment."

 latria_sexual_frustration_flavor.1227.t: "Le pari"
 latria_sexual_frustration_flavor.1227.desc: "Quelqu'un a parié un cheval que je ne saurais dire le nom de la personne que je veux devant toute la table. Le vin est bon, le feu est chaud, le pari est stupide, et tout le monde attend. Le chien s'est arrêté sous le banc pour écouter. Le pari a été fait devant l'homme de l'évêque.\n\nJe sens le nom dans ma bouche comme une pierre. À travers la table, la personne en question regarde la tranche de pain et non moi, et le creux de ma nuque est humide. Si je le dis, il sera dans chaque salle d'ici dimanche. Quelqu'un a remis du bois au feu.\n\nL'intendant remplit encore ma coupe. La table est devenue silencieuse."
 latria_sexual_frustration_flavor.1227.a: "Dire le nom et laisser la salle en faire ce qu'elle veut."
 latria_sexual_frustration_flavor.1227.b: "Rire, payer l'enjeu et réclamer du vin."
 latria_sexual_frustration_flavor.1227.c: "Dresser le plateau et battre l'homme qui a fait le pari."
 latria_sexual_frustration_flavor.1227.d: "En faire un vers qui ait le nom dedans et pas de nom du tout."

 latria_sexual_frustration_flavor.1228.t: "Les conditions"
 latria_sexual_frustration_flavor.1228.desc: "On discute le mariage sous les arbres, de la voix qu'on prend pour le bétail. La personne concernée se tient près du mur, les mains jointes, à écouter un clerc énoncer le prix qu'on lui assigne. Une abeille travaille la lavande entre nous et personne ne la chasse. La voix du clerc s'aplatit sur les chiffres.\n\nOn m'a demandé de trancher la question de la dot. J'ai lu quatre fois la même ligne. Ce que je veux n'est pas décent et n'est pas sur le papier, et cela se tient près du mur tout l'après-midi dans un manteau vert. Le manteau vert a une manchette déchirée.\n\nLe clerc attend, la plume levée. Une feuille tombe sur la table."
 latria_sexual_frustration_flavor.1228.a: "Trancher vite les conditions et renvoyer le clerc et la famille."
 latria_sexual_frustration_flavor.1228.b: "Relire chaque ligne deux fois et ne rien laisser paraître."
 latria_sexual_frustration_flavor.1228.c: "Porter les papiers à l'intérieur et décider la tête claire."
 latria_sexual_frustration_flavor.1228.d: "Mettre en ordre les comptes du domaine et laisser les chiffres me tenir."

 latria_sexual_frustration_flavor.1229.t: "La main du scribe"
 latria_sexual_frustration_flavor.1229.desc: "La copie est lente, le scriptorium est froid, et j'ai écrit trois fois le même mot de travers. Mon esprit n'est pas sur la page. Il est sur la bouche de la personne qui a apporté le pain à midi. Quelqu'un, deux tables plus loin, respire par un nez bouché. Le pain était encore chaud quand il est venu.\n\nJ'ai prononcé un vœu et je l'ai tenu, et le tenir m'a rendu conscient de mon propre corps d'une façon qu'il est difficile de traverser par la prière. Ma main tremble sur le vélin. Il y a une façon d'en finir qui dure à peu près le temps d'une courte prière, et je la veux.\n\nL'encre sèche sur la mauvaise lettre."
 latria_sexual_frustration_flavor.1229.a: "Mettre le vœu de côté un après-midi et être honnête sur pourquoi."
 latria_sexual_frustration_flavor.1229.b: "Tenir au vœu et laisser le désir se consumer de lui-même."
 latria_sexual_frustration_flavor.1229.c: "Reprendre le passage et copier jusqu'à ce que ma main soit assurée."

 latria_sexual_frustration_flavor.1230.t: "Le crépuscule au jardin"
 latria_sexual_frustration_flavor.1230.desc: "Me voici dehors en chemise de nuit, car la chambre était pire. Le jardin est bleu et les phalènes sont à la lavande. Quelqu'un, dans l'aile des serviteurs, joue mal d'un instrument à cordes, les quatre mêmes notes, encore et encore. L'herbe mouille mes mules et l'ourlet est lourd.\n\nJe sens encore où une main s'est posée sur ma taille à la grille ce soir, légère, le temps d'une révérence. Cela ne s'est pas effacé. Cela n'a fait que grandir toute la nuit, la musique n'aide pas, et ma propre peau me semble trop étroite. Je n'ai pas bougé depuis la grille. Le banc est froid à travers le lin.\n\nJe m'assieds sur le banc de pierre. Les phalènes continuent à la lavande."
 latria_sexual_frustration_flavor.1230.a: "Rentrer et laisser la musique couvrir ce que je fais."
 latria_sexual_frustration_flavor.1230.b: "Rester sur le banc jusqu'à ce que le froid traverse la chemise de nuit."
 latria_sexual_frustration_flavor.1230.c: "Respirer, compter les quatre notes et laisser le jardin suffire."

 latria_sexual_frustration_flavor.1231.t: "L'éveil avant la cloche"
 latria_sexual_frustration_flavor.1231.desc: "Je m'éveille avant la cloche, le drap rejeté au sol et la peau humide au creux de mes reins. La chemise de nuit s'est tordue autour de mes cuisses. Je rêvais, et le rêve est encore sur moi, une chaleur qui s'est posée bas et ne veut pas se lever.\n\nC'était le même visage que je me suis gardé de penser toute la semaine. Dans le rêve, il n'y avait aucune prudence. Une main à ma taille, une bouche dont je pouvais sentir la forme, et mon propre corps répondant avant que j'aie rien décidé. À présent je ne dors plus et cela n'a pas cessé.\n\nJe reste les genoux remontés et la paume à plat contre mon ventre, et la chaleur ne fait que se rassembler dessous. La cloche n'a pas sonné. Mon souffle se fait vif et court et je n'ai pas bougé pour le ralentir."
 latria_sexual_frustration_flavor.1231.a: "Éteindre la lampe et laisser ma propre main l'achever."
 latria_sexual_frustration_flavor.1231.b: "Rajuster la robe, me retourner et rester sans bouger jusqu'à la cloche."
 latria_sexual_frustration_flavor.1231.c: "Lire jusqu'à ce que la chaleur desserre son emprise."

 latria_sexual_frustration_flavor.1232.t: "La chevauchée à l'écart"
 latria_sexual_frustration_flavor.1232.desc: "Nous sommes en selle depuis avant le jour et j'ai gardé les yeux sur le cavalier devant. Sa façon de se tenir. Sa façon de se retourner au gué et de ralentir pour que je puisse venir à côté. Mes cuisses sont écorchées à vif et ma bouche est sèche et rien de tout cela n'est la raison pour laquelle je continue de regarder.\n\nLes cerfs sont partis et les rabatteurs se sont éparpillés dans le bois mouillé. Personne ne remarquerait un retard. Je talonne le cheval jusqu'à ce qu'il ne reste plus de distance et mon genou trouve le sien, et le cuir craque, et ni l'un ni l'autre ne tire sur les rênes.\n\nLe cavalier se retourne au bruit et attend. Le bois est bruyant d'eau qui goutte. Mes mains sont froides sur les rênes et le reste de moi n'est pas froid du tout, et le cheval se tient soufflant sous moi."
 latria_sexual_frustration_flavor.1232.a: "Rapprocher la fin de la distance et laisser le bois la garder."
 latria_sexual_frustration_flavor.1232.b: "Resserrer les rênes, chevaucher seul et me maîtriser."
 latria_sexual_frustration_flavor.1232.c: "Descendre de selle et marcher la piste mouillée jusqu'à ce que ma tête s'éclaircisse."

 latria_sexual_frustration_flavor.1233.t: "L'heure que les saints gardent"
 latria_sexual_frustration_flavor.1233.desc: "Il n'y a que moi dans l'église, avec les lampes que je dois moucher. Le froid monte à travers les dalles, mais sous la soutane mon corps est chaud et éveillé et n'a aucun intérêt pour l'office. Les saints regardent par-delà moi la porte close.\n\nJe connais les mots censés refroidir cela. Je les ai dits sur d'autres dans le noir de la boîte près de la porte, de la voix que je garde pour leurs péchés. Sur les miens, ils ne font rien. Le désir se tient derrière mes côtes comme une braise avalée, et ma main est venue se poser à plat sur la pierre de l'autel sans que je le lui aie dit.\n\nJe presse jusqu'à ce que le bord froid me fasse mal à la paume. La cloche va sonner bientôt. Ma main est encore sur la pierre, et la pierre a pris ma chaleur et n'est plus froide."
 latria_sexual_frustration_flavor.1233.a: "Prendre le désir entre mes propres mains et demander pardon ensuite."
 latria_sexual_frustration_flavor.1233.b: "Rester à genoux le temps de l'office et laisser les heures l'user."
 latria_sexual_frustration_flavor.1233.c: "Poser mon front sur la pierre froide et la laisser m'affermir."

 latria_sexual_frustration_flavor.1234.t: "La main tenue trop longtemps"
 latria_sexual_frustration_flavor.1234.desc: "Le conseil est parti et l'étude est silencieuse. Toute la dernière heure, je n'ai eu conscience que d'une chose : quand mon envoyé s'est penché en travers de la table pour me passer le traité, sa main s'est refermée sur la mienne et y est restée un souffle de plus que ne l'exigeait le sceau. La pièce était pleine de monde. Je l'ai laissée là.\n\nJe reviens sans cesse au poids de cette main, à la chaleur d'une paume qui n'avait aucune raison de s'attarder. La chandelle s'est consumée tandis que je relisais trois fois la même clause. Mon corps a décidé que cela valait plus que le traité, et il ne me demande pas mon avis sur la question.\n\nSon anneau a laissé une marque au dos de ma main. Je ne l'ai pas effacée. La cire s'amasse et la porte reste close et je relis la clause une quatrième fois."
 latria_sexual_frustration_flavor.1234.a: "Faire mander l'envoyé de nouveau et dire clairement ce que cette main m'a fait."
 latria_sexual_frustration_flavor.1234.b: "Garder la veille de nuit à l'écart et laisser la vigile me refroidir."
 latria_sexual_frustration_flavor.1234.c: "Dresser le plateau et jouer contre moi-même jusqu'à ce que l'image s'efface."

 latria_sexual_frustration_flavor.1235.t: "Quand la musique tourne"
 latria_sexual_frustration_flavor.1235.desc: "La salle est bruyante et le vin a fait deux fois le tour. Quand les musiciens attaquent, je me laisse entraîner dans la danse, et le partenaire que je trouve est celui que j'ai passé toute la soirée à ne pas regarder. Une main se pose à mon dos, et à travers le tissu mince je sens chaque doigt.\n\nNous tournons, et tournons encore, et la pièce se brouille en fumée de chandelle et en couleurs. On me tient un peu plus près que ne le demande la figure, et je ne corrige pas. Mon pouls est à mes oreilles, plus fort que le tambour. Le désir est monté de nulle part et m'a réclamé devant toute la salle, et je souris comme si de rien n'était.\n\nLa musique ralentit vers sa fin. La main n'a pas bougé de mon dos, et je n'ai pas reculé."
 latria_sexual_frustration_flavor.1235.a: "Demander aux musiciens une danse de plus et tenir l'autre de plus près."
 latria_sexual_frustration_flavor.1235.b: "Remercier, saluer et me retirer avant que la figure tourne encore."
 latria_sexual_frustration_flavor.1235.c: "Garder sa compagnie et parler de tout sauf de ceci."

 latria_sexual_frustration_flavor.1236.t: "Le long feu"
 latria_sexual_frustration_flavor.1236.desc: "Le feu s'est consumé jusqu'à un long lit rouge et la salle est devenue bruyante comme quand personne ne part. Un scalde déroule un vers sur le grand-père de quelqu'un. Fourrure, hydromel, le banc chaud là où les corps s'entassent le long.\n\nLa personne que je veux est assise près de moi, le bras le long du dossier du banc, sans me toucher, et j'ai conscience de ce bras depuis trois vers. Dehors la porte, le fjord est noir et la glace descend de l'eau. Mon genou est contre le sien et ni l'un ni l'autre ne l'a bougé.\n\nLe scalde s'arrête pour souffler. Le bras derrière moi se déplace et ne descend pas."
 latria_sexual_frustration_flavor.1236.a: "Demander un vers et chanter moi-même la réponse."
 latria_sexual_frustration_flavor.1236.b: "Remercier le banc, me lever et sortir dans le noir."
 latria_sexual_frustration_flavor.1236.c: "Me tourner vers cette personne et parler jusqu'à ce que le feu soit braise."

 latria_sexual_frustration_flavor.1237.t: "La crue"
 latria_sexual_frustration_flavor.1237.desc: "La crue a passé par-dessus les champs et l'air est assez épais pour qu'on le boive. Je suis au jardin en lin, le khôl aux yeux, une guirlande de lotus qui s'amollit déjà à la chaleur. Le temple d'Isis garde sa pierre fraîche à quelques pas, et j'ai longé ce mur deux fois.\n\nUne main se tend dans le noir chaud, paume en l'air, sans hâte. Les grillons sont assez bruyants pour que personne dans la maison n'entende une réponse. Mon corps en a déjà donné une, bas et insistante, et elle n'attend pas mes manières.\n\nJe n'ai pas pris la main. Le lotus goutte sur mon poignet."
 latria_sexual_frustration_flavor.1237.a: "Prendre la main et en répondre devant ma maison."
 latria_sexual_frustration_flavor.1237.b: "Croiser les mains dans mes manches et rentrer à l'écart."
 latria_sexual_frustration_flavor.1237.c: "Parcourir le sentier inondé jusqu'à ce qu'on allume les lampes."

 latria_sexual_frustration_flavor.1238.t: "Le rite des branches vertes"
 latria_sexual_frustration_flavor.1238.desc: "Le rite est fini et le temple sent encore les branches coupées. L'eau de source a été bénie à la porte et j'ai été compté saint avec le reste, corps compris, ce qui est la part à laquelle je reviens. Des choses vertes pendent à chaque pilier.\n\nLa danse a dépassé les lampes et je l'ai dansée. Le goût m'en reste à la bouche : un poignet dans le mien, un tour, le tambour. Mon corps a décidé que la bénédiction était une permission et plaide la cause.\n\nLes piliers gouttent. Quelqu'un rit encore sous le porche."
 latria_sexual_frustration_flavor.1238.a: "Tenir le rite à sa parole et laisser mes propres mains répondre."
 latria_sexual_frustration_flavor.1238.b: "M'agenouiller et garder la veille jusqu'à ce que les tambours s'arrêtent."
 latria_sexual_frustration_flavor.1238.c: "Lire le texte même du rite jusqu'à ce que les mots tiennent."

 latria_sexual_frustration_flavor.1239.t: "L'aube sur la steppe"
 latria_sexual_frustration_flavor.1239.desc: "Nous chevauchons avant le soleil, du koumis dans une outre et le ciel du bleu qu'il n'a qu'ici, sans bord nulle part. Un faucon se tient à mon poignet et l'herbe est bruyante d'insectes. Rien n'a été dit depuis les chariots.\n\nUn cavalier a retenu sa monture près de moi à la crête et n'a pas continué. Sa jambe est contre la mienne, les deux chevaux soufflant, et la terre ouverte est devant nous, sans mur et sans prêtre à une journée. Cela n'a jamais rendu le désir plus petit.\n\nLe faucon déplace ses pattes. Le cavalier attend."
 latria_sexual_frustration_flavor.1239.a: "Tourner avec cette personne et laisser l'herbe le garder."
 latria_sexual_frustration_flavor.1239.b: "Faire un signe, chevaucher et mettre le travail du jour entre nous."
 latria_sexual_frustration_flavor.1239.c: "Tenir la selle et respirer jusqu'à ce que mes mains soient assurées."

 latria_sexual_frustration_flavor.1240.t: "Le fouet et l'eau"
 latria_sexual_frustration_flavor.1240.desc: "Le fouet est sur le banc où je l'ai posé et l'eau froide est dans la cuvette. Ma foi est claire que le corps est une chose à briser à l'obéissance. Je n'ai jamais trouvé que le brisement prenait.\n\nJ'ai usé des deux. L'eau saisit, les épaules piquent, et après le désir est encore là derrière mes côtes, tout à fait guère impressionné. C'est la part que personne ne dit tout haut : on ne le chassera pas au fouet.\n\nLa cuvette goutte sur les dalles. Mes mains sont assurées sur le banc."
 latria_sexual_frustration_flavor.1240.a: "Écarter le fouet et prendre le désir entre mes propres mains."
 latria_sexual_frustration_flavor.1240.b: "Reprendre le fouet et être obéissant."
 latria_sexual_frustration_flavor.1240.c: "Lire avec mon maître jusqu'à ce que les mots soient plus forts."
