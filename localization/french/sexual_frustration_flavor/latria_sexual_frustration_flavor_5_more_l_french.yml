 latria_sexual_frustration_flavor.1411.t: "Personne à la porte"
 latria_sexual_frustration_flavor.1411.desc: "La lampe s'est consumée jusqu'à un bout et je ne dors pas encore, ma chemise de nuit remontée au-delà de mes hanches, ma propre main là où je n'ai dit à personne qu'elle va. J'ai cessé d'appeler cela de l'agitation. Trois nuits à présent que je m'amène au bord et l'y laisse, guettant un pas dans le passage qui ne vient jamais. Le drap est humide là où je n'ai pas bougé trop longtemps.\n\nJe pense à la façon dont cette personne s'est penchée sur mon siège au festin, assez près pour que je sente la chaleur de la pièce s'en aller quand on s'est redressé. Mon souffle se fait court. Je presse ma paume à plat et reste sans bouger, et le désir ne s'apaise pas, il ne fait que se rassembler plus bas et plus lourd.\n\nQuelque part en dessous, une porte se ferme. Ma main bouge de nouveau, et cette fois je ne l'arrête pas."
 latria_sexual_frustration_flavor.1411.a: "Achever ce que ma main a commencé et avouer le désir."
 latria_sexual_frustration_flavor.1411.b: "Retirer ma main et rester sans bouger jusqu'à ce que la lampe meure."
 latria_sexual_frustration_flavor.1411.c: "Mettre une robe et rester avec le silence jusqu'à ce qu'il se desserre."

 latria_sexual_frustration_flavor.1412.t: "Plus que je ne voulais"
 latria_sexual_frustration_flavor.1412.desc: "La salle est bruyante de la fin du vin et j'en ai déjà trop dit. Mon voisin a demandé où j'ai appris une telle histoire et je le lui ai dit, puis je lui ai dit le reste, la part que je n'ai jamais dite tout haut au grand jour.\n\nQuelqu'un rit et en réclame. J'entends ma propre voix continuer, plus vite, ajoutant le détail que je laisse toujours de côté, l'heure, la porte, la façon dont j'ai attendu. Le vin m'a rendu le visage chaud. Une coupe se pose quelque part derrière moi. Je n'arrive pas à m'arrêter à l'endroit où une personne prudente s'arrêterait.\n\nLa chaise de mon voisin recule en raclant. La musique s'est tue et personne n'est encore rentré, et la salle sent le suif et le vin répandu, et je tiens encore la coupe que je voulais reposer."
 latria_sexual_frustration_flavor.1412.a: "Dire le reste et laisser toute la table entendre."
 latria_sexual_frustration_flavor.1412.b: "Saluer la compagnie, garder le reste derrière mes dents et partir."
 latria_sexual_frustration_flavor.1412.c: "Porter la conversation sur de vieux amis et laisser le vin faire le reste."

 latria_sexual_frustration_flavor.1413.t: "Les trois mêmes lignes"
 latria_sexual_frustration_flavor.1413.desc: "Je m'agenouille à l'autel, ma chemise de nuit sous mes genoux et la pierre froide à travers le tissu. Les dalles ont pris la chaleur de mes mollets. L'employé est parti. J'ai récité tout l'office et ma bouche ne cesse de revenir aux trois mêmes lignes, celles sur la chair, comme si les mots étaient une porte devant laquelle je passe sans cesse.\n\nLe jour, je peux nommer cela une épreuve et en finir. Ici, les chandelles coulant et personne pour voir, je ne peux que mesurer combien de moi veut quitter le temple et atteindre une certaine maison avant la relève. Le désir a un poids. Mes genoux me font mal de le porter.\n\nLa chandelle la plus proche plie, puis se redresse. Je mets la main sur la pierre froide et ne me lève pas."
 latria_sexual_frustration_flavor.1413.a: "Laisser l'office inachevé et aller où je veux aller."
 latria_sexual_frustration_flavor.1413.b: "Garder la veille et tenir aux mots jusqu'à l'aube."
 latria_sexual_frustration_flavor.1413.c: "Lire le passage lentement et laisser le sens me revenir."

 latria_sexual_frustration_flavor.1414.t: "La chevauchée n'aide pas"
 latria_sexual_frustration_flavor.1414.desc: "Nous sommes en selle depuis avant le jour et les cerfs sont encore devant nous. Mes mains sont assurées sur les rênes. C'est là le mal. Tout le reste en moi ne l'est pas, ne l'est pas depuis des jours, et la chevauchée n'a fait que le secouer.\n\nJe revois sans cesse cette personne à la dernière chasse, riant, les cheveux mouillés du ruisseau, et je n'arrive pas à chasser l'image. Les chiens s'ouvrent. Je laisse la bride au cheval et le sol file vite, et l'espace de quelques longueurs je ne pense à rien du tout.\n\nPuis le bois se referme et l'allure tombe et tout revient. Je me tiens en selle, les cuisses brûlantes, la courroie du cor usée en une marque sur ma hanche, et je ne le lève pas."
 latria_sexual_frustration_flavor.1414.a: "Rompre la ligne et chevaucher jusqu'à ce que la pensée me sorte."
 latria_sexual_frustration_flavor.1414.b: "Tenir la ligne, prendre le cor et garder l'ordre de la chasse."
 latria_sexual_frustration_flavor.1414.c: "Lire le sol que le veneur indique et suivre les traces."

 latria_sexual_frustration_flavor.1415.t: "La porte barrée"
 latria_sexual_frustration_flavor.1415.desc: "La lampe est basse et la porte est barrée et la personne que je veux depuis un an est là, dans ma chambre, dévêtue, la main à plat sur ma poitrine. Cette main est chaude à travers le tissu.\n\nJe l'attire sur le lit et son poids est réel, la chaleur de la peau, le petit son à mon oreille. Les cordes du lit craquent sous nous. Je l'ai si souvent imaginé que le fait manque de me défaire avant que rien n'ait eu lieu. Mes hanches se soulèvent. Une bouche trouve ma gorge et je cesse de compter mon propre souffle.\n\nAprès, la lampe brûle encore, un long fil de cire coulé le long du chandelier. Des cheveux sont répandus sur mon bras et ni l'un ni l'autre n'a dit un mot du matin."
 latria_sexual_frustration_flavor.1415.a: "Garder cette personne ici et laisser la maisonnée parler s'il le faut."
 latria_sexual_frustration_flavor.1415.b: "Renvoyer cette personne dans sa chambre et me coucher à l'écart."
 latria_sexual_frustration_flavor.1415.c: "Tendre la main vers un livre et lire jusqu'à ce que mes mains soient calmes."

 latria_sexual_frustration_flavor.1416.t: "Le poignet à travers la table"
 latria_sexual_frustration_flavor.1416.desc: "Le conseil s'est prolongé et je n'ai rien signé. Mon sceau est posé, froid, près de l'encre. On a laissé le feu s'éteindre et personne n'a appelé pour du bois. Mon clerc lit la ligne suivante et j'entends la forme des mots sans le sens, car la personne à travers la table a la manche retroussée et je regarde son poignet.\n\nMon confident croise mon regard. Je me force à demander qu'on relise la clause. On la relit. Je n'en comprends rien. Sous la table, mon genou s'est mis à bouger et je le presse à l'arrêt de ma main.\n\nQuand les seigneurs se lèvent, je reste sur mon siège jusqu'à ce que la pièce se soit vidée. Mon confident attend près de la porte avec les papiers, sans rien dire, et je suis reconnaissant et ne peux pas le regarder."
 latria_sexual_frustration_flavor.1416.a: "Congédier le conseil et prendre l'après-midi pour moi."
 latria_sexual_frustration_flavor.1416.b: "Garder mon siège, prendre les papiers et l'avouer à mon confident."
 latria_sexual_frustration_flavor.1416.c: "Rappeler le clerc et régler chaque clause avant de me lever."

 latria_sexual_frustration_flavor.1417.t: "La même question deux fois"
 latria_sexual_frustration_flavor.1417.desc: "Le temple est vide et mon guide est encore là, à trier les rouleaux, et je ne parviens pas à partir. J'ai posé une question sur le rite, puis une autre, et toutes deux étaient la même question sous des habits différents.\n\nMon guide répond patiemment. Les rouleaux sent la poussière et l'huile de cèdre. Je regarde les mains bouger parmi eux et je pense à l'heure de la nuit, et à la distance du chemin jusqu'à une certaine porte, et à savoir si quelqu'un serait éveillé. La lampe entre nous est la seule chose qui me tienne sur mon siège.\n\nMon guide pose un rouleau devant moi et attend. Mes genoux se sont raidis sur la marche froide. Je mets la main sur le rouleau et lis le premier mot et non le second."
 latria_sexual_frustration_flavor.1417.a: "Remercier mon guide, sortir et aller à cette porte."
 latria_sexual_frustration_flavor.1417.b: "Demander qu'on reprenne le rite une fois de plus, lentement."
 latria_sexual_frustration_flavor.1417.c: "Dérouler le rouleau et écouter ce que dit mon guide."

 latria_sexual_frustration_flavor.1418.t: "Un nom au jardin"
 latria_sexual_frustration_flavor.1418.desc: "Le jardin est plein de monde et j'ai bu juste assez pour être honnête. Ma coupe a été remplie deux fois sans que je le demande. J'ai dit la chose tout haut. Pas le tout, mais la part où il y a un nom, et le nom n'était pas celui d'un inconnu.\n\nLe rire a fait le tour du groupe et quelqu'un l'a répété et un autre m'a regardé avec un intérêt neuf. Le gravier montre où le cercle s'est déplacé. J'aurais dû laisser passer cela pour du vin. Au lieu de quoi j'en ai dit plus, et le cercle est devenu silencieux comme le devient un cercle qui a décidé de se souvenir.\n\nUn serviteur longe l'allée avec un plateau. Je prends une coupe que je ne veux pas et la tiens contre ma bouche pour ne pas combler le silence."
 latria_sexual_frustration_flavor.1418.a: "Redire le nom, clairement, devant eux tous."
 latria_sexual_frustration_flavor.1418.b: "Faire une révérence, prendre congé et quitter le jardin."
 latria_sexual_frustration_flavor.1418.c: "Tirer l'invité le plus proche à l'écart et parler d'autre chose."

 latria_sexual_frustration_flavor.1419.t: "Depuis le couloir"
 latria_sexual_frustration_flavor.1419.desc: "J'ai barré la porte et rabattu les couvertures et je ne vais plus prétendre que la fatigue m'empêche. Mon corps est ainsi depuis l'après-midi, depuis une main sur mon bras dans le couloir, et il ne s'est pas calmé.\n\nJe porte les doigts à moi et mon souffle sort d'une façon que je ne voudrais pas qu'on entende. Je pense au couloir, au lin de cette manche, à la pression exacte des doigts. Mon dos s'arque hors du lit. Je dois mettre mon autre main sur ma bouche.\n\nCela dure longtemps et s'achève dans un tremblement. La lampe est encore allumée. Je reste le bras en travers des yeux et les draps tordus à ma taille, sentant encore la chaleur du jour, et le désir n'est pas parti, seulement plus calme."
 latria_sexual_frustration_flavor.1419.a: "Le laisser suivre son cours et cesser de feindre la fatigue."
 latria_sexual_frustration_flavor.1419.b: "Serrer les mains, respirer lentement et attendre que le tremblement passe."
 latria_sexual_frustration_flavor.1419.c: "Lire une page à la lampe jusqu'à ce que mon corps se calme."

 latria_sexual_frustration_flavor.1420.t: "Deux jours en selle"
 latria_sexual_frustration_flavor.1420.desc: "Deux jours en selle et la steppe continue sans fin. La selle a usé une plaie sous mon genou. Mon cheval connaît l'allure mieux que moi. Je n'ai pas vraiment dormi depuis que nous avons quitté le camp, et ce n'est pas le sol où je dors qui me tient éveillé.\n\nJe pense à cette personne qui nattait ses cheveux près du feu, à la façon dont on mordait le bout du fil. Le vent est froid et mes mains sont crevassées et la pensée revient quand même et se pose bas en moi, insistante, comme un second battement de cœur.\n\nNous franchissons une hauteur et l'herbe descend vers le fleuve, une ligne pâle et sans bruit. Je pourrais rentrer seul. Le cheval bouge sous moi, attendant, et je reste là, les rênes molles, et ne me retourne pas."
 latria_sexual_frustration_flavor.1420.a: "Rentrer au camp et prendre ce que la nuit offre."
 latria_sexual_frustration_flavor.1420.b: "Chevaucher avec les autres et tenir l'allure."
 latria_sexual_frustration_flavor.1420.c: "Lâcher le faucon et suivre son vol vers l'eau."

 latria_sexual_frustration_flavor.1421.t: "Au-delà de la prudence"
 latria_sexual_frustration_flavor.1421.desc: "Le festin a continué au-delà du point où quiconque est prudent. J'ai regardé cette personne toute la soirée, sans détourner une fois les yeux, et je viens de le dire, à la salle, d'une voix qui portait.\n\nUne coupe se renverse. Les musiciens n'ont pas repris. Quelqu'un rit, quelqu'un les appelle, et je suis debout, les mots venant encore. J'ai nommé l'heure que je veux et le lieu, et la salle l'a entendu. Il n'est pas de version de demain où ce ne serait qu'une plaisanterie.\n\nMon voisin me tire par la manche. Je m'assieds parce que mes jambes sont devenues incertaines, la cire a coulé en travers de la table jusqu'à ma manche, et la coupe est remise dans ma main, et je regarde encore à travers la table."
 latria_sexual_frustration_flavor.1421.a: "Redire l'heure et le lieu pour que personne ne se méprenne."
 latria_sexual_frustration_flavor.1421.b: "M'asseoir, boire et laisser le bruit se refermer sur ce que j'ai dit."
 latria_sexual_frustration_flavor.1421.c: "Me tourner vers mon voisin et demander des nouvelles de sa maisonnée."
 latria_sexual_frustration_flavor.1421.d: "Mettre le tout dans un poème pour la table."

 latria_sexual_frustration_flavor.1422.t: "Trois nuits de vigile"
 latria_sexual_frustration_flavor.1422.desc: "J'ai tenu la vigile trois nuits de suite et le jeûne m'a rendu la tête légère. Le froid s'est mis dans les petits os de mes pieds. Les mots de l'office sont dans ma bouche et la personne est dans mon esprit, et les deux se sont emmêlés au-delà de tout démêlage.\n\nJe sais ce que le vœu demande. Je l'ai dit de bon gré et je ne l'ai jamais dit à contrecœur jusqu'à cette nuit. Mes mains sont froides et mon estomac a oublié ce qu'est le pain. La pierre sous mes genoux a usé une place lisse et je m'y ajuste comme si j'avais prié ici des années, ce qui, du seul point de vue qui compte, est le cas.\n\nUn frère tousse quelque part dans le noir, et quelqu'un bouge sur un banc derrière le pilier. Je baisse la tête plus bas et la prière continue sans ma voix."
 latria_sexual_frustration_flavor.1422.a: "Rompre le jeûne, quitter la vigile et avouer ce que je veux."
 latria_sexual_frustration_flavor.1422.b: "Garder le jeûne et tenir le vœu le reste de la nuit."
 latria_sexual_frustration_flavor.1422.c: "Passer au passage sur l'âme et le lire en entier."

 latria_sexual_frustration_flavor.1423.t: "Le chiffre faux"
 latria_sexual_frustration_flavor.1423.desc: "Les comptes ne s'équilibrent pas et j'ai lu quatre fois la même colonne. La chandelle est neuve et la cire n'a pas coulé. À travers la chambre, quelqu'un dicte à un clerc, et la voix est de celles que je reconnaîtrais dans une foule, et mon esprit a tout à fait quitté la colonne.\n\nJe mets le doigt sur la page pour tenir ma place. Elle ne tient pas. La plume du clerc continue de bouger. Je sens mon propre pouls dans ma gorge, ce qui est absurde, et la pièce est froide, et je n'ai pas froid.\n\nQuand la dictée s'arrête, je lève les yeux trop vite. Le clerc attend. Je redemande le chiffre et j'écris le mauvais, et l'encre y sèche, et je ne le corrige pas avant que la chambre se soit vidée."
 latria_sexual_frustration_flavor.1423.a: "Laisser les comptes et aller où va la voix."
 latria_sexual_frustration_flavor.1423.b: "Tenir à la colonne jusqu'à ce que chaque chiffre soit juste."
 latria_sexual_frustration_flavor.1423.c: "Faire mander le registre et vérifier chaque entrée depuis la première."

 latria_sexual_frustration_flavor.1424.t: "Le vin intact"
 latria_sexual_frustration_flavor.1424.desc: "La porte est verrouillée et le vin est intact et la personne que je veux est là, la robe ouverte et les mains sur mon visage. Ces mains sont froides d'abord, puis ne le sont plus.\n\nJe l'attire contre moi et le tout est plus chaud et plus maladroit que tout ce que j'ai imaginé. Un genou trouve le lit et le cadre cogne une fois contre le mur. Ma main va au creux des reins et plus bas, et le son qu'on fait n'est pas discret, et peu m'importe qui l'entend. Je tremble de tout le temps où j'ai attendu.\n\nPlus tard, la lampe s'est consumée et le vin a tiédi dans la coupe. Une tête est sur mon épaule, mon bras est engourdi dessous, et j'écoute respirer."
 latria_sexual_frustration_flavor.1424.a: "Dire clairement ce que l'année d'attente m'a coûté."
 latria_sexual_frustration_flavor.1424.b: "Me reculer, rajuster la robe et garder mes mains pour moi."
 latria_sexual_frustration_flavor.1424.c: "Rester sans bouger et lire à la lampe basse jusqu'à ce que le sommeil vienne."

 latria_sexual_frustration_flavor.1425.t: "Des mains diligentes"
 latria_sexual_frustration_flavor.1425.desc: "Voilà trois jours que je suis dans la forêt et la chasse a été bonne et rien de tout cela n'a touché la chose en moi. Je suis diligent. Je me lève avant les autres, je veille à ce que le harnais sèche, je prends la ligne que le veneur m'assigne. Mes mains font ce qu'on leur dit.\n\nLe reste de moi est ailleurs. Je me rappelle un certain après-midi, une embrasure, une personne disant mon nom d'une façon que je n'ai pas pu oublier, et le souvenir vient tandis que je me tiens dans les étriers et encore tandis que je dépèce le gibier, avec l'odeur de la peau sur mes mains.\n\nLe feu est bas et les braises crépitent en refroidissant. Mes bras me font mal de la journée et je reste sur le dos, les yeux ouverts, à écouter les chevaux bouger."
 latria_sexual_frustration_flavor.1425.a: "Quitter la ligne et emmener le rouan dans le noir."
 latria_sexual_frustration_flavor.1425.b: "Respirer, resserrer la sangle et finir le travail du jour."
 latria_sexual_frustration_flavor.1425.c: "Veiller à ce que le harnais sèche et le compte tenu avant de dormir."

 latria_sexual_frustration_flavor.1426.t: "Une page et demie"
 latria_sexual_frustration_flavor.1426.desc: "L'étude est silencieuse et mon guide a étalé le texte et j'ai lu une page et demie sans retenir un mot. Mon pouce a laissé une marque dans la marge. La lampe est bonne. La nuit est longue. Nulle part on ne m'attend.\n\nJe ne cesse de penser à l'heure où la maisonnée dort et où le couloir est vide. Mon guide tourne une page et demande si je suis l'argument. Je dis que oui. Je ne le suis plus depuis la première ligne sur la nature de l'âme, ce qui est dommage, car c'est la ligne dont j'ai le plus besoin.\n\nMon guide attend, la plume à la main, et la chaise a une jointure qui se plaint quand je bouge. Je regarde la page et ma propre main est à plat sur le bois, très immobile, comme si elle appartenait à quelqu'un de plus calme."
 latria_sexual_frustration_flavor.1426.a: "Fermer le livre et sortir tant que le couloir est vide."
 latria_sexual_frustration_flavor.1426.b: "Garder mon siège et relire la page depuis le haut."
 latria_sexual_frustration_flavor.1426.c: "Demander à mon guide de reprendre l'argument une fois de plus."

 latria_sexual_frustration_flavor.1427.t: "Large avec le vin"
 latria_sexual_frustration_flavor.1427.desc: "J'ai été large avec le vin et la compagnie l'a été en retour, et quelque part là-dedans j'ai dit à la table ce que je veux. Pas clairement. Assez clairement. Il y a ici une personne dont j'ai dit le nom et dont je n'ai pas regardé le visage en le disant.\n\nQuelqu'un a cessé de rire, et un chien s'acharne sur quelque chose sous le banc. Ma coupe est vide et un serviteur la remplit et je le laisse faire. La pièce a l'immobilité de gens qui décident quoi faire d'une chose qu'on leur a remise.\n\nLa place de ma sœur est vide ce soir et sa coupe est encore là où le serviteur l'a posée, ce qui est une miséricorde que je ne mérite pas. Je mets les deux mains sur la table et le bois est frais et la musique reprend à l'autre bout de la salle."
 latria_sexual_frustration_flavor.1427.a: "Le redire, avec le nom, et laisser la famille entendre."
 latria_sexual_frustration_flavor.1427.b: "Remercier la compagnie, prendre mon manteau et partir."
 latria_sexual_frustration_flavor.1427.c: "Remplir les coupes à la ronde et porter la conversation sur les moissons."
 latria_sexual_frustration_flavor.1427.d: "Renvoyer les plaisanteries à l'invité le plus bruyant jusqu'à ce que la salle passe à autre chose."

 latria_sexual_frustration_flavor.1428.t: "Les icônes regardent"
 latria_sexual_frustration_flavor.1428.desc: "Le temple est froid et les icônes regardent toutes et je n'ai pas bougé depuis une heure. Mes genoux se sont engourdis. Le désir, non. Il se tient en moi comme une braise qu'on ne couvre pas. La fumée de la chandelle monte droit, sans courant d'air.\n\nJ'ai prié pour la délivrance et j'ai prié pour la force et je suis assez honnête, ici, pour savoir laquelle je veux voir exaucée. Le visage de cette personne monte entre moi et l'or. Je ne le repousse pas. La lampe sent l'huile et le marbre est froid et mon corps ne s'intéresse ni à l'un ni à l'autre.\n\nLes pas du prêtre passent derrière moi. Je garde la tête baissée et les mains jointes, mes genoux laissant deux empreintes humides sur la pierre, et mon esprit sur une embrasure à travers la ville."
 latria_sexual_frustration_flavor.1428.a: "Me lever, traverser la ville et laisser les icônes monter leur garde."
 latria_sexual_frustration_flavor.1428.b: "Tenir le vœu et rester sur le marbre jusqu'à la fin de l'office."
 latria_sexual_frustration_flavor.1428.c: "Ouvrir le livre aux psaumes et lire jusqu'à ce que les mots tiennent."

 latria_sexual_frustration_flavor.1429.t: "Le mur à la Saint-Jean"
 latria_sexual_frustration_flavor.1429.desc: "Le jardin, à cette heure, n'appartient à personne et j'y suis parce que le lit était pire. La nuit est chaude. L'allée de gravier a gardé la chaleur du jour. Quelque part une fontaine coule, la seule voix du jardin, et l'odeur des herbes est assez forte pour qu'on la goûte.\n\nJe n'ai pas dormi depuis deux nuits. Je parcours l'allée et le gravier est bruyant et chaque détour me ramène au même mur, celui contre lequel je me tenais avec cette personne à la Saint-Jean, sans rien dire, tous deux sachant.\n\nMa main est sur la pierre. Elle est encore chaude. Un papillon de nuit ne cesse de revenir à la lampe derrière moi. Je me tiens là, le front près du mur et le souffle qui va mal, et la fontaine continue."
 latria_sexual_frustration_flavor.1429.a: "Sortir par la grille et le dire à la nuit."
 latria_sexual_frustration_flavor.1429.b: "Tenir le vœu, ôter ma main du mur et rentrer."
 latria_sexual_frustration_flavor.1429.c: "Parcourir l'allée jusqu'à ce que le ciel grise et que mes jambes soient lasses."

 latria_sexual_frustration_flavor.1430.t: "Les cordes sont froides"
 latria_sexual_frustration_flavor.1430.desc: "J'ai sorti l'instrument parce que la maison dort et que je ne pouvais plus rester là sans dormir. Les cordes sont froides et le plectre est usé mince d'un côté. Je joue la chose que je joue toujours et ce n'est pas assez, ce n'est pas assez depuis une semaine.\n\nMes doigts connaissent le motif et le reste de moi est tout à fait ailleurs, dans une chambre aux volets encore clos, un après-midi où je ne cesse de revenir. Les notes s'en vont dans le noir et personne ne les entend.\n\nJe m'arrête, la main à plat sur les cordes pour tuer le son. Le silence d'après est pire. Je reste l'instrument en travers des genoux, les cordes devenues molles dans le froid, la tête renversée contre la chaise et la fenêtre qui grise sur le bord."
 latria_sexual_frustration_flavor.1430.a: "La jouer en entier, mal, jusqu'à ce que toute la maison entende."
 latria_sexual_frustration_flavor.1430.b: "Poser l'instrument et passer le reste de la nuit."
 latria_sexual_frustration_flavor.1430.c: "Dresser le plateau et jouer les deux camps jusqu'à ce que le jour vienne."

 latria_sexual_frustration_flavor.1431.t: "La couture dans le noir"
 latria_sexual_frustration_flavor.1431.desc: "La chandelle a coulé il y a une heure et je n'ai pas remonté la couverture. Ma chemise de nuit est retroussée autour de ma taille. Mes doigts ont trouvé la couture, puis sont passés dessous, lentement, comme je me le suis appris quand les couloirs sont silencieux. Je garde les yeux clos et fais revenir l'intendant qui m'a versé le vin la semaine dernière, la façon dont sa manche a effleuré mon poignet et y est restée un souffle de trop.\n\nMon souffle se prend et se retient. Je bouge la main et le désir se serre plus fort, plus bas, un nœud tiré aux deux bouts. Je pense à sa bouche près de mon oreille, aux mots qu'on n'a pas finis. Le lin est chaud et humide sous ma paume.\n\nUne planche craque dans le passage. Ma main s'immobilise, puis repart, et je la laisse, et le noir garde mon secret un instant de plus."
 latria_sexual_frustration_flavor.1431.a: "L'achever dans le noir et reconnaître la faim."
 latria_sexual_frustration_flavor.1431.b: "Retirer ma main et rester raide jusqu'à ce que la mèche se noie."
 latria_sexual_frustration_flavor.1431.c: "M'enrouler dans la couverture et attendre que la douleur se relâche."

 latria_sexual_frustration_flavor.1432.t: "Vêpres inachevées"
 latria_sexual_frustration_flavor.1432.desc: "La chapelle s'est vidée et je m'agenouille en chemise de nuit sur la pierre froide, mes prières devenues minces et vagabondes. Le prêtre qui m'a entendu la dernière fois a posé sa main sur ma tête inclinée et l'y a laissée, et je n'ai pas pu reposer ce poids depuis. Mes paumes pressent mes cuisses à travers le tissu mince et cette pression n'est pas la prière.\n\nJe bouge sur mes genoux. La pierre est un choc à travers le lin. Je pense à cette main, à sa chaleur, à la façon dont je m'y suis appuyé d'un rien avant de me reprendre. Mon souffle se fait rauque dans le silence voûté et je presse plus fort, cherchant et ne trouvant pas la délivrance que je venais implorer.\n\nLa corde de la cloche pend, immobile, au-dessus de moi. Je lève le visage vers l'autel sombre et garde mes mains où elles sont."
 latria_sexual_frustration_flavor.1432.a: "Laisser le corps avoir ce que la prière lui a refusé."
 latria_sexual_frustration_flavor.1432.b: "Joindre les mains et tenir la vigile jusqu'à l'aube."
 latria_sexual_frustration_flavor.1432.c: "Ouvrir le livre et lire jusqu'à ce que les mots me refroidissent."

 latria_sexual_frustration_flavor.1433.t: "La couche de fougères"
 latria_sexual_frustration_flavor.1433.desc: "La chasse s'est éparpillée au crépuscule et il n'y a que moi dans le noir vert, mon cheval broutant tout près. Je glisse contre un tronc moussu et mes habits de chasse sont humides de sueur. Le souvenir qui me traque est celui du veneur qui m'a saisi à la taille pour me passer au-dessus du ruisseau, sa poitrine dure contre mon dos, son souffle à ma nuque. Ma main s'est glissée dans ma ceinture.\n\nJe presse et l'écorce mord mon épaule. Je pense à ces bras, à la façon dont on ne m'a pas lâché aussitôt. Mon souffle fume dans l'air froid. Le désir se noue plus serré à chaque caresse lente et la forêt tient son silence autour de moi, les feuilles gouttant quelque part hors de vue.\n\nUne brindille casse. Ma main se fige. Le cheval lève la tête, et je reste contre l'arbre, le pouls bruyant à mes oreilles."
 latria_sexual_frustration_flavor.1433.a: "Soulager la tension ici contre l'arbre."
 latria_sexual_frustration_flavor.1433.b: "Retirer ma main et respirer lentement jusqu'à ce que cela passe."
 latria_sexual_frustration_flavor.1433.c: "Se lever et ramener le cheval à travers les arbres."

 latria_sexual_frustration_flavor.1434.t: "Le mot non envoyé"
 latria_sexual_frustration_flavor.1434.desc: "Le feu de l'étude est bas et la lettre est à demi écrite sous ma main, celle que je n'enverrai pas. Je relis la dernière ligne que j'ai posée, une ligne honnête, trop honnête, et mon autre main s'est glissée aux laçages de mes chausses. Je pense à l'envoyé qui s'est tenu trop près de ce même bureau et a lu mon visage au lieu de la carte, et a souri.\n\nJe dénoue les laçages. Mon souffle se raccourcit. Je fais revenir l'inclinaison de cette tête, l'invitation que j'ai été trop prudent pour relever, et ma main bouge d'une volonté propre, la plume sèche dans l'autre. Le feu crépite. Le désir s'amasse et ne se laissera pas ramener à la raison en une chose que je puisse ranger.\n\nLa chandelle penche dans un courant d'air. Je ferme les yeux et laisse la pensée achever ce que l'envoyé a commencé."
 latria_sexual_frustration_flavor.1434.a: "Poser la vérité et apaiser la douleur qu'elle a allumée."
 latria_sexual_frustration_flavor.1434.b: "Nouer les laçages et me retirer sur un mot froid."
 latria_sexual_frustration_flavor.1434.c: "Prendre la carte et peser froidement l'affaire."

 latria_sexual_frustration_flavor.1435.t: "Après la dernière coupe"
 latria_sexual_frustration_flavor.1435.desc: "Le festin s'est éclairci jusqu'à quelques chandelles qui coulent et l'invité en face de moi n'est pas parti. Sous la table, mon genou est venu reposer contre le sien et ni l'un ni l'autre ne l'a bougé. Le vin bourdonne en moi. Je pense à la façon dont on a ri de ma plaisanterie et s'est penché, assez près pour que j'aie pu tourner ma bouche la petite distance jusqu'à la sienne.\n\nMa main libre serre le banc. Je veux combler cet écart plus que je n'ai rien voulu depuis un âge, et le désir est un fil vif tendu de ma gorge à mon ventre. On me regarde par-dessus le bord de la coupe. Le dernier serviteur est parti. La salle sent le suif épuisé et nous deux qui respirons.\n\nUn genou presse en retour, une fois. Ma main quitte le banc et trouve le bord de la manche, et ni l'un ni l'autre ne parle."
 latria_sexual_frustration_flavor.1435.a: "Laisser la musique couvrir ce que je fais ensuite."
 latria_sexual_frustration_flavor.1435.b: "Baisser la tête et plier le désir en une prière."
 latria_sexual_frustration_flavor.1435.c: "Proposer une partie et laisser le plateau refroidir mon sang."

 latria_sexual_frustration_flavor.1436.t: "Une nuit mongole"
 latria_sexual_frustration_flavor.1436.desc: "La yourte est chaude du feu de bouse et le vent tracasse le feutre au-dessus. Je suis revenu de la grande chasse, le sang encore monté en moi, et maintenant je gis sous les fourrures, mes vêtements ôtés et mon corps à peine gouverné. Je pense à celui qui a chevauché près de moi tout le jour, la tresse balançant à son dos, à la façon dont on a ri de la mise à mort.\n\nLe feu peint les murs de rouge. Ma main a trouvé son chemin vers le bas sur mon ventre et je ne la rappelle pas. La fumée est douce, les fourrures sont lourdes, et le désir a une chaleur que les petites flammes ne peuvent toucher. Je fais revenir la tenue de ses épaules en selle, l'éclair de ses dents.\n\nLe vent tombe le temps d'un souffle. Ma main bouge et je laisse la nuit prendre ce que le jour a allumé."
 latria_sexual_frustration_flavor.1436.a: "Donner à la chasse sa seconde fin, ici sous les fourrures."
 latria_sexual_frustration_flavor.1436.b: "Rapprocher les fourrures et maîtriser le corps par la seule volonté."
 latria_sexual_frustration_flavor.1436.c: "Sortir dans le froid et marcher jusqu'à ce que le sang refroidisse."

 latria_sexual_frustration_flavor.1437.t: "Le toit au clair de lune"
 latria_sexual_frustration_flavor.1437.desc: "Le toit est chaud sous mon dos et le jasmin déborde du parapet, lourd de parfum. En bas, le chant d'une concubine se file à travers le noir, et la nuit est si chaude que ma chemise de nuit est plus ornement que couverture. J'ai fait une qasida de mon désir et l'ai mise sur la forme de la bouche de cette personne.\n\nMa main repose à ma hanche et la retenue que j'ai tenue toute la soirée est usée jusqu'à un seul fil. La lune est très claire. Le chant tourne et tourne. Je fais revenir la façon dont on m'a regardé par-dessus le vin, l'invitation que je n'ai pas encore relevée, et mon souffle ne veut pas ralentir.\n\nLa dernière note s'éteint. Ma main défait le nœud de ma robe, et la nuit est assez chaude pour le permettre."
 latria_sexual_frustration_flavor.1437.a: "Répondre à la qasida de mes mains et laisser le toit le garder."
 latria_sexual_frustration_flavor.1437.b: "Rattacher la robe et tenir au bord que j'ai tenu."
 latria_sexual_frustration_flavor.1437.c: "Prendre un recueil de vers et laisser les mots d'un autre refroidir les miens."

 latria_sexual_frustration_flavor.1438.t: "Le rite de l'union"
 latria_sexual_frustration_flavor.1438.desc: "Le rite le plus saint de ma foi commande l'union du corps, et je suis venu à l'autel pour l'observer. Les chandelles se dressent haut. Ma chemise de nuit est mince contre le froid de la pierre, et les mots du rite m'ont défait point par point, jusqu'à ce que le désir ne soit plus une faute mais un sacrement posé sur le drap de l'autel.\n\nJe m'agenouille et mes mains ne sont pas assurées. Le rite nomme ce désir saint, et mon corps répond à ce nom d'une chaleur qui ne se laissera pas prier de partir. Je fais revenir les mains qui rencontreront les miennes ici, le vœu qui fait de cette chair un temple.\n\nLa cloche du rite va sonner. Je me lève pour l'accueillir, et je suis déjà défait."
 latria_sexual_frustration_flavor.1438.a: "Observer le rite et laisser l'union se faire sacrement."
 latria_sexual_frustration_flavor.1438.b: "Tenir la veille à l'écart et lier le désir à l'autel."
 latria_sexual_frustration_flavor.1438.c: "Lire le rite lentement et laisser son sens me rendre entier."

 latria_sexual_frustration_flavor.1439.t: "Le jardin andalou"
 latria_sexual_frustration_flavor.1439.desc: "Minuit au jardin et la fontaine tient son petit son. J'ai lu le tawq al-hamama, la poésie de l'amour du pigeon, et les vers m'ont laissé creux de désir. Par-delà le mur est le voisin qui m'est interdit, et cette nuit le mur semble une chose mince et sotte.\n\nLes orangers gardent la fin de la chaleur du jour. Ma main est venue se poser à ma gorge et le désir est tout près du bord, à un souffle de déborder. Je fais revenir le visage du voisin dans la lueur de la lampe, le jeu de regard et de refus que nous avons joué par-dessus l'eau.\n\nLa fontaine faiblit, puis reprend. Ma main tremble et ne retombe pas, et la nuit retient son souffle avec moi."
 latria_sexual_frustration_flavor.1439.a: "Laisser le désir déborder et répondre au jeu du voisin."
 latria_sexual_frustration_flavor.1439.b: "Me retirer sur un mot courtois et laisser le mur intact."
 latria_sexual_frustration_flavor.1439.c: "M'asseoir avec un ami près de la fontaine et laisser la conversation refroidir le vers."

 latria_sexual_frustration_flavor.1440.t: "Le jeûne du saint"
 latria_sexual_frustration_flavor.1440.desc: "Je garde le jeûne du saint et le corps est devenu une prison où je fais les cent pas. Le vœu que j'ai juré est usé mince comme un vieux tissu, et sur la pierre froide du sol du temple je sens le bord même de le rompre. Mon pouls court plus vite que les prières.\n\nMa chemise de nuit est mince et la pierre tire la chaleur de mes genoux. Je presse mes mains à plat sur les dalles et la course dans mon sang ne se laissera pas calmer par le froid. Je fais revenir le contact que je me suis refusé, la chaleur dont j'ai juré de jeûner, et mon souffle vient court.\n\nLa chandelle près de ma tête brûle droit. Je tiens au bord, et le jeûne et le pouls se font la guerre dans le noir."
 latria_sexual_frustration_flavor.1440.a: "Rompre le silence et confesser combien le vœu s'est usé mince."
 latria_sexual_frustration_flavor.1440.b: "Presser la pierre froide et garder le jeûne la nuit durant."
 latria_sexual_frustration_flavor.1440.c: "Ouvrir les dévotions et laisser une voix plus sage me ramener."
