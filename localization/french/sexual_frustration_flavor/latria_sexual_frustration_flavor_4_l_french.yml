l_french:
 latria_sexual_frustration_flavor.1301.t: "Une invitation non envoyée"
 latria_sexual_frustration_flavor.1301.desc.female: "En chemise de nuit, je m’assieds au bureau devant une page où ne figure qu’un nom. Ma servante demande s’il faut la porter. Je plie la lettre sans répondre."
 latria_sexual_frustration_flavor.1301.desc.male: "En chemise de nuit, je m’assieds au bureau devant une page où ne figure qu’un nom. Un serviteur attend dehors pour la porter, mais je ne peux me résoudre à sceller la lettre."
 latria_sexual_frustration_flavor.1301.desc: "Une lettre non scellée attend sous la bougie depuis un moment."
 latria_sexual_frustration_flavor.1301.a: "Achever la lettre et la confier au domestique."
 latria_sexual_frustration_flavor.1301.b: "Ranger la lettre, réprimer le désir et me coucher."

 latria_sexual_frustration_flavor.1302.t: "Le jugement d’une cour"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Le poète de cour plaisante sur d’anciennes affections, et même les nobles les plus austères ne froncent pas les sourcils. Je lève ma coupe avec eux, sans y trouver d’apaisement."
 latria_sexual_frustration_flavor.1302.desc.strict: "Un noble a perdu la face à cause d’une romance indiscrète, et la cour parle de toute sa famille. J’écoute leurs jugements, sachant que la même balance pourrait me peser."
 latria_sexual_frustration_flavor.1302.desc: "La conversation se tourne vers la réputation et le désir."
 latria_sexual_frustration_flavor.1302.a: "Parler de mon désir et y ramener sans cesse la conversation."
 latria_sexual_frustration_flavor.1302.b: "Retenir ma langue, remercier mes hôtes et prendre congé."

 latria_sexual_frustration_flavor.1303.t: "La cloche de minuit"
 latria_sexual_frustration_flavor.1303.desc.favors: "Après la cloche, le prêtre reste près de la porte. Il dit que le désir peut être tourné vers le bien, mais je ne sais pas si je peux encore attendre."
 latria_sexual_frustration_flavor.1303.desc.condemns: "La cloche sonne sans cesse, tout comme le vœu du prêtre dans mon cœur. Mes genoux me font mal à force de rester à terre, et aucune réponse ne vient."
 latria_sexual_frustration_flavor.1303.desc: "La prière de minuit n’a apporté aucun calme, même si les cloches continuent de sonner."
 latria_sexual_frustration_flavor.1303.a: "Laisser les préceptes d’abstinence au temple."
 latria_sexual_frustration_flavor.1303.b: "Réprimer cette pensée et réciter encore la prière."

 latria_sexual_frustration_flavor.1304.t: "Le bout de la patience"
 latria_sexual_frustration_flavor.1304.desc.lustful: "Je parcours la chambre en chemise de nuit. L’échiquier apporté par mon domestique reste intact ; l’attente est devenue un tourment en soi."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Je renoue la ceinture de ma chemise de nuit, tâchant de donner à chaque mouvement une apparence de calme. Plus je m’applique, plus il est difficile d’ignorer mon désir."
 latria_sexual_frustration_flavor.1304.desc: "La pièce est calme. Je ne peux plus rester en place."
 latria_sexual_frustration_flavor.1304.a: "Écarter l’échiquier et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1304.b: "Regagner le bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1305.t: "Une chambre après la tombée du jour"
 latria_sexual_frustration_flavor.1305.desc.emperor: "La cour s’est retirée, mais je reste dans ma chambre en habits de cérémonie. Les requêtes ont reçu leur réponse ; les pensées qui me troublent ne sont pas parties avec les seigneurs."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Mes compagnons se sont couchés à l’auberge, mais je reste sans compagnie dans ma chambre. Mon paquetage est prêt et l’itinéraire du lendemain fixé, pourtant mes pensées ne s’apaisent pas."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Je reste dans ma petite chambre, encore en vêtements liturgiques. La bougie près du lit s’est éteinte. Mon vœu demeure, mais le réconfort ne vient pas."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Je regagne une chambre vide en habits de cérémonie. Les gardes s’inclinent dehors, mais personne à l’intérieur ne peut partager ce fardeau."
 latria_sexual_frustration_flavor.1305.desc: "La chambre est vide, mais je ne me résous pas à m’allonger."
 latria_sexual_frustration_flavor.1305.a: "Faire venir une connaissance de confiance malgré l’heure et parler longuement."
 latria_sexual_frustration_flavor.1305.b: "Réprimer le désir, retirer mes habits et me coucher."

 latria_sexual_frustration_flavor.1306.t: "Un messager à minuit"
 latria_sexual_frustration_flavor.1306.desc.female: "En chemise de nuit, je reste près du lit et entends deux coups discrets. Ma servante n’apporte qu’une feuille vierge, mais je sais de qui j’attends un message."
 latria_sexual_frustration_flavor.1306.desc.male: "J’ouvre la porte de la chambre en chemise de nuit, mais le couloir est déjà désert. Le billet sans signature sur le seuil m’empêche de dormir."
 latria_sexual_frustration_flavor.1306.desc: "Les pas s’éloignent derrière la porte. La page sur mon bureau reste vierge."
 latria_sexual_frustration_flavor.1306.a: "Écrire les mots que j’ai tant retardés."
 latria_sexual_frustration_flavor.1306.b: "Ranger la page, étouffer le désir et m’allonger."

 latria_sexual_frustration_flavor.1307.t: "Le silence à table"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Le poète récite une ancienne romance, et la compagnie écoute avec plaisir. Je lève ma coupe avec les autres, pensant à une histoire que personne n’a racontée."
 latria_sexual_frustration_flavor.1307.desc.strict: "La tablée évoque un noble tombé en disgrâce pour une romance indiscrète, et les rires s’éteignent. Je me tourne vers la fenêtre pour cacher mon expression."
 latria_sexual_frustration_flavor.1307.desc: "Les coupes continuent de circuler, mais la conversation s’attarde sur un sujet qu’il vaudrait mieux éviter."
 latria_sexual_frustration_flavor.1307.a: "Laisser le vin me délier la langue et raconter mes histoires intimes l’une après l’autre."
 latria_sexual_frustration_flavor.1307.b: "Retenir ma langue, saluer la compagnie et prendre congé."

 latria_sexual_frustration_flavor.1308.t: "Une prière pendant la veille"
 latria_sexual_frustration_flavor.1308.desc.favors: "La cloche marque la veille nocturne, et je reste au sanctuaire à prier. Ma foi ne condamne pas les plaisirs charnels, mais je ne sais comment affronter ce désir persistant."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Je répète la prière de chasteté dans le sanctuaire. La cloche s’éloigne, mais la pensée en moi demeure."
 latria_sexual_frustration_flavor.1308.desc: "La lueur des bougies tombe sur les bancs vides. Je ne me suis pas levé."
 latria_sexual_frustration_flavor.1308.a: "Écarter la prière d’abstinence et suivre mon cœur au-dehors."
 latria_sexual_frustration_flavor.1308.b: "Contenir mon désir et achever la veille."

 latria_sexual_frustration_flavor.1309.t: "Un regard dans le miroir"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Sans vêtements, dans la solitude de ma chambre, je reste un instant devant le miroir. Mon expression n’a pas changé, mais je ne qualifierai plus le désir de faiblesse passagère."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Sans vêtements au bord du lit, je répète mon vœu. Je me souviens de chaque mot, mais le désir qui m’habite ne disparaît pas."
 latria_sexual_frustration_flavor.1309.desc: "Personne d’autre n’est dans la pièce. Le silence du miroir ne me laisse aucun endroit où détourner les yeux."
 latria_sexual_frustration_flavor.1309.a: "Reconnaître ce que je ressens et m’y attarder."
 latria_sexual_frustration_flavor.1309.b: "M’habiller, regagner mon bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1310.t: "En éveil dans mes quartiers"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Après la prière nocturne, je regagne ma petite chambre. Je porte encore mes vêtements liturgiques et la bougie près du lit est éteinte, mais je refuse de m’allonger."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Mes compagnons se sont couchés à l’auberge. Dans ma chambre, je range mon paquetage. La route du lendemain est claire ; celle qui traverse mes pensées ne l’est pas."
 latria_sexual_frustration_flavor.1310.desc: "Il est tard. La porte est fermée, mais je ne peux dormir."
 latria_sexual_frustration_flavor.1310.a: "Écrire à une vieille connaissance et parler franchement de mes tourments."
 latria_sexual_frustration_flavor.1310.b: "Réprimer cette pensée, souffler la bougie et m’allonger."

 latria_sexual_frustration_flavor.1301.c: "Prendre une feuille vierge et faire un poème de l’invitation."
 latria_sexual_frustration_flavor.1302.c: "Ramener la conversation aux familles et aux domaines."
 latria_sexual_frustration_flavor.1302.d: "Raconter une histoire de voyage et leur faire lever leurs coupes à nouveau."
 latria_sexual_frustration_flavor.1303.c: "Rester jusqu’à l’aube et étudier les Écritures ligne par ligne."
 latria_sexual_frustration_flavor.1304.c: "Disposer les pièces et étudier un problème d’échecs."
 latria_sexual_frustration_flavor.1304.d: "Commencer au premier coup et jouer lentement toute une partie."
 latria_sexual_frustration_flavor.1305.c: "Organiser le travail du matin avant de souffler la bougie."
 latria_sexual_frustration_flavor.1307.c: "Réciter un nouveau poème et attirer leur attention ailleurs."
 latria_sexual_frustration_flavor.1308.c: "Fermer le livre de prières et examiner mes pensées en silence."
 latria_sexual_frustration_flavor.1308.d: "Veiller jusqu’à la prière du matin et préparer les livres pour tous."
 latria_sexual_frustration_flavor.1309.c: "Écrire ce qui me trouble et l’examiner ligne par ligne."
 latria_sexual_frustration_flavor.1310.c: "Préparer du thé et ranger tranquillement mes affaires et mes livres."
