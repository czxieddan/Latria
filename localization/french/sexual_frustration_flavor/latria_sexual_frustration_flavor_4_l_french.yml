l_french:
 latria_sexual_frustration_flavor.1301.t: "Une invitation non envoyée"
 latria_sexual_frustration_flavor.1301.desc.female: "En chemise de nuit, je m’assieds au bureau. Un seul nom figure sur le papier. L’encre n’a pas encore séché que ma servante demande, depuis la porte, s’il faut porter la lettre. Je plie la feuille, sans la sceller ni répondre.\n\nCe nom, je n’ose pas l’écrire en plein jour. Maintenant qu’il est sur la page, le papier semble me brûler les doigts. Une invitation devrait suivre. J’en ai choisi le lieu et l’heure ; la plume s’arrête pourtant après la formule d’adresse. Ma servante répète sa question, plus doucement.\n\nJe regarde ce nom. Il me pèse davantage que toute la lettre encore à écrire."
 latria_sexual_frustration_flavor.1301.desc.male: "En chemise de nuit, je m’assieds au bureau. Un seul nom figure sur le papier. Derrière la porte, un serviteur attend de porter mon message. Son ombre bouge dans l’entrebâillement, puis s’immobilise.\n\nJe charge ma plume d’encre et la suspends au-dessus de la feuille. La phrase que je veux écrire ne laisse aucun doute : ce soir, à la porte latérale, sans en parler à personne. Une fois sur le papier, elle ne sera pourtant plus une simple pensée. La mèche crépite ; une goutte d’encre tombe près du nom.\n\nLe serviteur toussote. Je n’ai toujours pas scellé la lettre."
 latria_sexual_frustration_flavor.1301.desc: "La lettre attend depuis longtemps sous la lampe, toujours sans sceau.\n\nJe n’ai écrit que la formule d’adresse. L’espace blanc pourrait accueillir bien des phrases ; je n’en ai ajouté aucune. La cire a déjà ramolli à la chaleur. La cuillère pour la verser est à portée de main, mais je ne la prends pas.\n\nLe niveau d’huile a baissé. L’encre du nom n’a toujours pas séché."
 latria_sexual_frustration_flavor.1301.a: "Achever la lettre et la confier au domestique."
 latria_sexual_frustration_flavor.1301.b: "Ranger la lettre, réprimer le désir et me coucher."

 latria_sexual_frustration_flavor.1302.t: "Le jugement d’une cour"
 latria_sexual_frustration_flavor.1302.desc.accepted: "Le poète de cour plaisante sur un amour ancien. Même les nobles les plus sévères ne froncent pas les sourcils. Il raconte une histoire de chambre avec le ton d’une anecdote de chasse. Les convives lèvent leurs coupes, et la lumière se déplace sur le vin.\n\nJe souris et lève la mienne, mais le vin me paraît amer. L’histoire ne parle pas de moi ; j’ai pourtant l’impression que quelqu’un expose aussi mes propres nuits. À côté de moi, on touche ma manche pour me demander pourquoi je ne participe pas. Je remarque alors que mon sourire est venu trop tard.\n\nLe poète entame un nouveau vers. Ma coupe est encore levée."
 latria_sexual_frustration_flavor.1302.desc.strict: "Un noble a perdu la face à cause d’une liaison secrète, et chacun parle désormais de sa famille. Les mots viennent lentement, avec le poids d’un jugement. Certains secouent la tête ; d’autres réexaminent déjà les mariages envisagés pour leurs enfants.\n\nEn les écoutant, je songe qu’ils pourraient me juger de la même façon. J’ai pour ma part une lettre jamais envoyée et plusieurs nuits de mauvais sommeil. Personne n’en a connaissance. Cela n’empêche pas ces faits de peser dans ma propre conscience.\n\nQuelqu’un me demande mon avis. Je repose ma coupe avec un bruit sec."
 latria_sexual_frustration_flavor.1302.desc: "À table, la conversation en vient à la réputation et au désir.\n\nCe n’était d’abord qu’une plaisanterie. Lorsqu’on commence à préciser une porte et une heure, elle ne me paraît plus drôle. Je reste à ma place et sens ma main se crisper sous la nappe.\n\nLes musiciens poursuivent très doucement, comme s’ils craignaient de couvrir les paroles des convives."
 latria_sexual_frustration_flavor.1302.a: "Parler de mon désir et y ramener sans cesse la conversation."
 latria_sexual_frustration_flavor.1302.b: "Retenir ma langue, remercier mes hôtes et prendre congé."

 latria_sexual_frustration_flavor.1303.t: "La cloche de minuit"
 latria_sexual_frustration_flavor.1303.desc.favors: "La cloche s’est tue, mais le prêtre reste près de la porte. Il explique que le désir peut servir le bien. Sa voix n’est pas forte ; dans la nuit, j’en entends distinctement chaque mot. Les bougies du temple allongent son ombre jusqu’à mes genoux.\n\nJe ne sais plus si je souhaite attendre ce bien promis. L’attente est devenue une discipline supplémentaire. Mes mains s’échauffent dans mes manches, et aucun passage sacré ne semble donner de place à mon agitation. Le prêtre me regarde, comme s’il savait que je retiens encore une question.\n\nL’écho de la cloche demeure sous les poutres. Je reste à genoux, les jambes engourdies."
 latria_sexual_frustration_flavor.1303.desc.condemns: "La cloche résonne encore et encore. Les vœux récités par le prêtre reviennent avec la même insistance dans mes pensées. À force de rester à genoux, je ne sens presque plus mes jambes ; la fraîcheur de la pierre a depuis longtemps cédé à ma chaleur. Aucune réponse ne vient.\n\nJe connais chaque parole du serment. La connaître ne suffit pas à y consentir. Au mot « renoncer », ma langue hésite avant de poursuivre. Le prêtre ne me reprend pas. Ce bref arrêt suffit pourtant pour que je l’entende moi-même.\n\nLe dernier coup de cloche s’éteint. Le temple devient si silencieux que j’entends tomber la cire."
 latria_sexual_frustration_flavor.1303.desc: "La prière de minuit ne m’a pas apporté le calme. La cloche continue pourtant de résonner.\n\nJ’ai suivi la récitation jusqu’à la dernière phrase. Après elle, je reste à genoux au même endroit, avec la même préoccupation. Les coups de cloche n’y ont rien changé.\n\nLe prêtre referme le livre. Le bruit des pages me parvient de plus près que celui de la cloche."
 latria_sexual_frustration_flavor.1303.a: "Laisser les préceptes d’abstinence au temple."
 latria_sexual_frustration_flavor.1303.b: "Réprimer cette pensée et réciter encore la prière."

 latria_sexual_frustration_flavor.1304.t: "Le bout de la patience"
 latria_sexual_frustration_flavor.1304.desc.lustful: "En chemise de nuit, je parcours la chambre. Aucune pièce n’a bougé sur l’échiquier apporté par un serviteur. La fenêtre entrouverte laisse entrer l’air nocturne, sans dissiper mon agitation.\n\nJe me suis arrêté près du lit, près de la table, puis près de la porte. Aucun pas ne se fait entendre de l’autre côté. L’attente est devenue un tourment : je sais que personne ne viendra, mais chaque coup du tambour de garde me semble annoncer une visite. Des pièces s’entrechoquent dans leur coffret. C’est ma propre manche qui les a heurtées.\n\nJe retourne à l’échiquier et pose la main sur un pion, sans l’avancer."
 latria_sexual_frustration_flavor.1304.desc.chaste: "Je resserre le lien de ma chemise de nuit, tâchant de donner à chacun de mes gestes une apparence de calme. Je sens nettement la pression du tissu. Plus je prends de précautions, plus il devient difficile de prétendre que mon désir n’existe pas.\n\nL’échiquier est toujours sur la table ; il offre une occupation à laquelle je pourrais me tenir. Je m’assieds, prends une pièce, puis la repose. Ma main cherche encore une autre occupation. Je la retiens sous la table, mais ma respiration perd sa régularité.\n\nLa pièce est calme. J’y entends presque le juron que je n’ai pas prononcé."
 latria_sexual_frustration_flavor.1304.desc: "La pièce est calme, mais je ne peux plus rester en place.\n\nJe me lève pour verser de l’eau sans la boire. Je vais moucher la lampe et coupe la mèche trop court ; la flamme baisse. J’entreprends chaque tâche sans m’y tenir. Aucune ne me ramène durablement à ma chaise.\n\nJe finis debout au milieu de la chambre, sans savoir que faire de mes mains."
 latria_sexual_frustration_flavor.1304.a: "Écarter l’échiquier et penser à la personne que je désire."
 latria_sexual_frustration_flavor.1304.b: "Regagner le bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1305.t: "Une chambre après la tombée du jour"
 latria_sexual_frustration_flavor.1305.desc.emperor: "La cour s’est retirée. Je reste dans ma chambre en habits de cérémonie. Les requêtes sont examinées, l’encre des sceaux a séché, les pas des conseillers se sont éloignés. Mes préoccupations privées ne les ont pas suivis.\n\nJe commence à défaire l’attache de mon col, puis m’interromps. Le lit est prêt, trop bien arrangé pour que je puisse m’y imaginer. Je m’arrête devant le miroir. Sous les habits de cérémonie, je retrouve mon propre visage et ce regard dont aucun rapport ne garde la trace.\n\nUn serviteur demande s’il faut venir retirer ma couronne. Je lui ordonne d’attendre dehors."
 latria_sexual_frustration_flavor.1305.desc.adventurer: "Mes compagnons se reposent à l’auberge. Je reste sans compagnie dans ma chambre. Mon paquetage est prêt, et l’itinéraire du lendemain est inscrit sur la planche derrière la porte. Mes pensées ne trouvent aucune place ; elles n’en prennent pas dans les bagages, mais semblent remplir toute la pièce.\n\nJe m’assieds au bord du lit sans retirer mes bottes. Au rez-de-chaussée, quelqu’un chante sous l’effet du vin, jusqu’à ce qu’un compagnon fasse taire la chanson. Des rires montent, comme depuis une autre soirée à laquelle je ne peux prendre part.\n\nJe roule la carte, puis la déplie. Les routes n’ont pas changé."
 latria_sexual_frustration_flavor.1305.desc.clergy: "Je reste sans compagnie dans ma petite chambre, toujours en vêtements rituels. La bougie près du lit faiblit. Mes vœux demeurent, mot pour mot, tels que je les ai prononcés dans la journée. Le réconfort n’est pas venu.\n\nJe retire de mon poignet les perles de prière et les laisse passer une à une entre mes doigts. Bientôt, aucune parole sacrée ne les accompagne. Je repense à une personne dans la galerie, puis à mon regard que j’avais détourné le premier. Ce geste ne l’a pas fait disparaître de mes pensées.\n\nLe col de mon vêtement frotte contre mon cou. Je ne le retire pas."
 latria_sexual_frustration_flavor.1305.desc.ruler: "Je regagne ma chambre vide en habits de cérémonie. Les gardes me saluent derrière la porte dans un bref bruit d’armure. Le verrou retombe ensuite. À l’intérieur, personne ne peut partager ce qui me pèse.\n\nJe porte encore ma couronne. Je l’enlève et la pose près de l’oreiller, où elle prend presque la place d’une autre tête. Dans le miroir, mon apparence laisse croire que je pourrai tenir audience demain. Je sais pourtant ce qui m’attend cette nuit.\n\nJe m’assieds au bord du lit, avec un gant encore à la main."
 latria_sexual_frustration_flavor.1305.desc: "Il n’y a personne d’autre dans la chambre, mais je tarde à me coucher.\n\nLa lampe brûle encore, je porte toujours mes chaussures et mes vêtements sont en ordre. Je m’en sers pour croire que je peux encore sortir et voir quelqu’un. En réalité, personne ne m’attend. Je ne veux simplement pas me trouver face à ce lit préparé.\n\nLe vent passe par la fente de la fenêtre et fait pencher la flamme."
 latria_sexual_frustration_flavor.1305.a: "Faire venir une connaissance de confiance malgré l’heure et parler longuement."
 latria_sexual_frustration_flavor.1305.b: "Réprimer le désir, retirer mes habits et me coucher."

 latria_sexual_frustration_flavor.1306.t: "Un messager à minuit"
 latria_sexual_frustration_flavor.1306.desc.female: "En chemise de nuit, je m’assieds au bord du lit et entends deux coups légers à la porte. Aucun signal convenu : c’est la manière habituelle de ma servante lorsqu’elle apporte quelque chose. Elle entre, dépose une feuille vierge et se retire sans regarder le lit.\n\nCette page blanche me trouble davantage qu’une lettre remplie. Je sais de qui j’attends des nouvelles. Je sais aussi qu’elles ne viendront pas ce soir. Je porte la feuille sous la lampe ; sa lumière révèle les fibres du papier, presque comme une ligne encore à écrire.\n\nMes doigts restent longtemps posés sur la page, assez pour y laisser une petite trace humide."
 latria_sexual_frustration_flavor.1306.desc.male: "J’ouvre la porte en chemise de nuit, mais la galerie est déjà vide. Près du seuil se trouve un billet sans signature. Quelqu’un l’a peut-être déposé en passant ; il a peut-être simplement été oublié dans la journée. Je le ramasse, toujours sans trouver le sommeil.\n\nLe billet ne contient pas la phrase que j’attends. Il indique une heure pour demain et une somme à payer. Je lis tout de même chaque ligne, puis retourne la feuille. Le verso est vide. Cette face vierge me semble attendre ma plume davantage que l’autre.\n\nLa lumière de la galerie s’éteint. Je reste près de la porte, que je n’ai pas tout à fait refermée."
 latria_sexual_frustration_flavor.1306.desc: "Les pas s’éloignent derrière la porte. Sur la table, ma lettre attend encore ses premières vraies lignes.\n\nJ’ai pris la plume trois fois. La première, j’ai écrit un mot avant de le rayer. La deuxième, je n’ai laissé qu’une goutte d’encre. La troisième, j’ai reposé la plume pour regarder cette tache sécher lentement.\n\nPlus de la moitié de la nuit a passé. La feuille est toujours presque blanche."
 latria_sexual_frustration_flavor.1306.a: "Écrire les mots que j’ai tant retardés."
 latria_sexual_frustration_flavor.1306.b: "Ranger la page, étouffer le désir et m’allonger."

 latria_sexual_frustration_flavor.1307.t: "Le silence à table"
 latria_sexual_frustration_flavor.1307.desc.accepted: "Le poète récite un amour ancien, et les convives l’écoutent avec plaisir. Certains battent la mesure sur la table ; d’autres complètent les vers avant lui. Les coupes tournent entre les mains. Personne ne juge nécessaire d’éviter ce sujet devant qui que ce soit.\n\nJe lève ma coupe avec les autres, tout en repensant à une histoire dont personne ne parle. Elle n’a ni la beauté du poème ni son auditoire enthousiaste. Elle ne garde qu’une porte fermée, puis les heures que j’avais passées sans compagnie jusqu’au matin. Au vers qui décrit une étreinte, une goutte de vin déborde de ma coupe.\n\nPersonne ne l’a vue tomber. Moi, je l’ai vue."
 latria_sexual_frustration_flavor.1307.desc.strict: "À table, on évoque un noble tombé en disgrâce à cause d’une liaison secrète. Les rires cessent presque ensemble, comme une corde que l’on aurait étouffée. Je tourne les yeux vers la fenêtre pour cacher mon expression.\n\nIl n’y a rien à regarder dehors, hormis une lanterne de la garde. Je la fixe tout de même. Derrière moi, quelqu’un murmure que ce noble n’a que ce qu’il mérite. La phrase ne m’est peut-être pas destinée. Je la reçois pourtant comme si elle concernait l’affaire dont personne n’a encore connaissance.\n\nJe tiens ma coupe fermement, jusqu’à en blanchir les jointures."
 latria_sexual_frustration_flavor.1307.desc: "Les coupes continuent de circuler, mais la conversation s’attarde sur le sujet qu’il faudrait quitter.\n\nUn instant plus tôt, on parlait encore des récoltes. Puis quelqu’un a évoqué ce qui se passe dans une chambre. Depuis, personne n’a trouvé comment revenir au sujet précédent. Je reste dans ce silence, à entendre mon cœur plus distinctement que la musique.\n\nQuelqu’un tousse pour rompre la gêne. Elle demeure."
 latria_sexual_frustration_flavor.1307.a: "Laisser le vin me délier la langue et raconter mes histoires intimes l’une après l’autre."
 latria_sexual_frustration_flavor.1307.b: "Retenir ma langue, saluer la compagnie et prendre congé."

 latria_sexual_frustration_flavor.1308.t: "Une prière pendant la veille"
 latria_sexual_frustration_flavor.1308.desc.favors: "La cloche de la veille a sonné. Je reste en prière dans le sanctuaire. Ma doctrine ne rejette pas les plaisirs de la chair ; je pourrais montrer le passage à quiconque me le demanderait. Cela ne me dit pourtant pas comment apaiser l’agitation que je ressens à genoux ici.\n\nLes bancs sont vides. La bougie projette mon ombre sur un dossier ; elle suit ma respiration et semble aussi peu disposée que moi à veiller. Je repense à l’invitation que j’ai failli formuler dans la journée, puis aux mots par lesquels je l’ai remplacée. Mon désir, lui, n’a pas changé avec la phrase.\n\nL’écho de la cloche s’éloigne. Je reste à genoux, le front humide."
 latria_sexual_frustration_flavor.1308.desc.condemns: "Dans le sanctuaire, je répète les prières de chasteté. La première récitation est entière. À la deuxième, j’omets des mots. À la troisième, je m’arrête sur la même phrase, incapable de poursuivre.\n\nL’écho de la cloche s’éloigne sans emporter la pensée qui m’occupe. Je pose les paumes sur les dalles pour en chercher la fraîcheur. La pierre se réchauffe vite sous mes mains. Une fois cette fraîcheur disparue, je sens plus distinctement encore ce contre quoi je m’obstine.\n\nLes bancs sont vides. Je continue pourtant de parler à voix très basse."
 latria_sexual_frustration_flavor.1308.desc: "La lumière des bougies éclaire les bancs vides. Je n’ai toujours pas quitté ma place.\n\nLa veille devrait s’achever ici. Je crains pourtant qu’en me relevant, je ne retrouve toute l’agitation que cette immobilité tient à distance. Je reste donc à genoux, moins pour prier que pour retarder le moment de partir.\n\nLa dernière bougie crépite. Une fumée noire monte et se disperse sous les poutres."
 latria_sexual_frustration_flavor.1308.a: "Écarter la prière d’abstinence et suivre mon cœur au-dehors."
 latria_sexual_frustration_flavor.1308.b: "Contenir mon désir et achever la veille."

 latria_sexual_frustration_flavor.1309.t: "Un regard dans le miroir"
 latria_sexual_frustration_flavor.1309.desc.lustful: "Sans vêtements et sans compagnie, je reste un moment devant le miroir de bronze de ma chambre. Je ne détourne pas les yeux et ne prends pas de quoi me couvrir. La lampe m’éclaire de côté, sans me laisser le refuge de l’ombre.\n\nJe me lasse de nommer ce désir une faiblesse passagère. Il ne passe pas. Il m’accompagne depuis le soir, pendant le repas, puis après le départ des autres. À présent, il ne reste que ce miroir et moi. Je pose une main sur mon épaule ; mon reflet reproduit le geste. Ce simple mouvement suffit à troubler ma respiration.\n\nAucun pas ne résonne derrière la porte. Je n’ai personne devant qui feindre."
 latria_sexual_frustration_flavor.1309.desc.chaste: "Sans vêtements, je m’assieds au bord du lit et récite mes vœux à voix basse. J’en connais chaque mot assez bien pour entendre aussitôt le moindre oubli. Mon désir ne disparaît pourtant pas. Il demeure en moi, impossible à attribuer à quelqu’un d’autre ou à un autre lieu.\n\nJe regarde le miroir, puis détourne les yeux. Cela ne sert à rien ; le bronze continue de me renvoyer mon image. Je serre mes mains l’une contre l’autre jusqu’à en blanchir les jointures, comme si je pouvais ainsi tenir parole.\n\nLes mots s’interrompent encore. Cette fois, je ne reprends pas immédiatement."
 latria_sexual_frustration_flavor.1309.desc: "Il n’y a personne d’autre dans la pièce. Le silence du miroir m’empêche pourtant de me dérober à moi-même.\n\nMes vêtements sont sur la chaise ; je suis devant le miroir. Quelques pas seulement nous séparent. Il me faut malgré tout longtemps pour admettre pourquoi je ne les enfile pas. La flamme reste stable. Mon regard, lui, ne cesse de se détourner.\n\nJe m’assieds au bord du lit. La natte est fraîche, pour quelques instants seulement."
 latria_sexual_frustration_flavor.1309.a: "Reconnaître ce que je ressens et m’y attarder."
 latria_sexual_frustration_flavor.1309.b: "M’habiller, regagner mon bureau et réprimer cette pensée."

 latria_sexual_frustration_flavor.1310.t: "En éveil dans mes quartiers"
 latria_sexual_frustration_flavor.1310.desc.clergy: "Après la prière nocturne, je retourne dans ma petite chambre. Je porte encore mes vêtements rituels. La bougie près du lit faiblit, mais je refuse toujours de m’allonger. Une fois au lit, je retrouverai les mêmes pensées, sans avoir encore décidé de la place que je veux leur laisser.\n\nLes perles de prière reposent près de l’oreiller, comme un témoin. Je défais à moitié le lien de mon vêtement, puis le renoue. Le col continue de me frotter le cou et entretient cet éveil auquel je m’accroche.\n\nIl n’y a personne d’autre dans la chambre. Cela ne rend pas la décision plus simple."
 latria_sexual_frustration_flavor.1310.desc.adventurer: "Mes compagnons se sont couchés à l’auberge. Je range mon paquetage sans compagnie dans ma chambre. L’itinéraire de demain est clair : un gué, une route sèche, puis un autre gué. Je ne sais en revanche où vont mes pensées. Leur destination ne figure sur aucune carte.\n\nJ’enlève mes bottes sans m’allonger. Dehors, un cheval mâche lentement son fourrage. Ce bruit devrait m’aider à dormir. Il me rappelle pourtant le regard reçu aujourd’hui au gué, si bref que j’aurais presque pu le tenir pour rien. Je ne l’ai pas fait.\n\nLa lampe vacille. Je n’ajoute pas d’huile."
 latria_sexual_frustration_flavor.1310.desc: "La nuit est avancée, la porte fermée, et je ne trouve toujours pas le sommeil.\n\nLe lit est bon, l’oreiller aussi. Je reste pourtant au bord, à repenser à la personne dont je n’ai pas pu m’approcher dans la journée. Lorsque je remarque la chaleur de mes paumes, je découvre aussi que le lien de ma chemise est défait. Je ne me souviens plus de l’avoir dénoué.\n\nJe regarde ce lien qui pend près de ma jambe, sans parvenir à décider de la suite."
 latria_sexual_frustration_flavor.1310.a: "Écrire à une vieille connaissance et parler franchement de mes tourments."
 latria_sexual_frustration_flavor.1310.b: "Réprimer cette pensée, souffler la bougie et m’allonger."

 latria_sexual_frustration_flavor.1301.c: "Prendre une feuille vierge et faire un poème de l’invitation."
 latria_sexual_frustration_flavor.1302.c: "Ramener la conversation aux familles et aux domaines."
 latria_sexual_frustration_flavor.1302.d: "Raconter une histoire de voyage et leur faire lever leurs coupes à nouveau."
 latria_sexual_frustration_flavor.1303.c: "Rester jusqu’à l’aube et étudier les Écritures ligne par ligne."
 latria_sexual_frustration_flavor.1304.c: "Disposer les pièces et étudier un problème d’échecs."
 latria_sexual_frustration_flavor.1304.d: "Commencer au premier coup et jouer lentement toute une partie."
 latria_sexual_frustration_flavor.1305.c: "Organiser le travail du matin avant de souffler la bougie."
 latria_sexual_frustration_flavor.1307.c: "Réciter un nouveau poème et attirer leur attention ailleurs."
 latria_sexual_frustration_flavor.1308.c: "Fermer le livre de prières et examiner mes pensées en silence."
 latria_sexual_frustration_flavor.1308.d: "Veiller jusqu’à la prière du matin et préparer les livres pour tous."
 latria_sexual_frustration_flavor.1309.c: "Écrire ce qui me trouble et l’examiner ligne par ligne."
 latria_sexual_frustration_flavor.1310.c: "Préparer du thé et ranger tranquillement mes affaires et mes livres."
