l_french:
 h_latria_holy_see: "Saint-Siège"
 h_latria_holy_see_adj: "catholique"
 nick_latria_vicar_of_christ: "le Vicaire du Christ"

 latria_papal_ascendancy.0001.t: "Le trône au-dessus de toutes les couronnes"
 latria_papal_ascendancy.0001.desc: "Devant les prélats assemblés, je lève la main au-dessus des bannières brisées de ceux qui venaient me renverser. Dieu n’a pas préservé Son vicaire pour que je marchande avec les princes. Selon Sa volonté, le Saint-Siège exercera une autorité indivisible et portera le salut à tous les royaumes."
 latria_papal_ascendancy.0001.a: "Que le monde s’agenouille devant le Saint-Siège"

 latria_papal_ascendancy.0002.t: "Le mandat du Vicaire"
 latria_papal_ascendancy.0002.desc: "[latria_papal_victor.GetShortUIName] a brisé l’armée levée contre le Saint-Siège. Devant le clergé et les princes vaincus, [latria_papal_victor.GetSheHe] proclame que Dieu lui a confié l’autorité absolue et le salut du monde."
 latria_papal_ascendancy.0002.a: "Un nouvel ordre commence"

 trait_latria_army_of_god: "Armée de Dieu"
 trait_latria_army_of_god_desc: "Ce personnage commande une armée consacrée à l’autorité absolue du Saint-Siège."
 trait_latria_army_of_god_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] commande une armée consacrée à l’autorité absolue du Saint-Siège."

 latria_papal_redemption_or_ruin: "Rédemption ou ruine"
 latria_papal_redemption_or_ruin_desc: "Exiger que [recipient.GetShortUINameNoTooltip] se soumette au Saint-Siège et adopte le [rite|E] de [actor.GetShortUINamePossessiveNoTooltip]. Un refus entraînera la guerre."
 LATRIA_PAPAL_REDEMPTION_OR_RUIN_NOTIFICATION: "[actor.GetShortUIName] exige votre soumission au Saint-Siège et votre conversion à son [rite|E]."
 LATRIA_PAPAL_REDUCED_TITLE_NAME: "Petite [old_title.GetBaseNameNoTierNoTooltip]"
 LATRIA_PAPAL_REDUCED_TITLE_NAME_ADJ: "petite [old_title.GetAdjectiveNoTooltip]"

 latria_reveal_papal_secret_decision: "Révéler le secret"
 latria_reveal_papal_secret_decision_desc: "Je dévoilerai mon secret devant le clergé et les princes. Que chaque souverain l’entende de ma bouche, et que ceux qui contestent ma charge prennent les armes."
 latria_reveal_papal_secret_decision_tooltip: "Révéler publiquement votre liaison adultère et affronter la guerre de déposition."
 latria_reveal_papal_secret_decision_confirm: "Le révéler devant tous"
 latria_can_reveal_papal_secret_trigger: "Vous avez un secret de liaison adultère qui peut être révélé"
 NOT_ANY_OF_MY_SECRETS: "Aucun de vos secrets :"

 latria_papal_redemption_war: "Guerre de rédemption papale"
 LATRIA_PAPAL_REDEMPTION_CB_NAME: "Rédemption papale"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME: "Guerre de rédemption [ATTACKER.GetPrimaryTitle.GetAdjective] contre [DEFENDER.GetPrimaryTitle.GetBaseNameNoTier]"
 LATRIA_PAPAL_REDEMPTION_WAR_NAME_BASE: "Guerre de rédemption [ATTACKER.GetPrimaryTitle.GetAdjective]"
 latria_papal_redemption_war_victory_desc: "Le défenseur perd un rang, devient vassal du pape et se convertit au [rite|E] du pape."
 latria_papal_redemption_war_white_peace_desc: "La demande de soumission est retirée."
 latria_papal_redemption_war_defeat_desc: "La demande de soumission du pape est repoussée."

 latria_decision_immediate_effect_loc: "#high #bold Lorsque vous révélez le secret :#!#!\n[GetScriptedGui('latria_papal_secret_immediate_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_warning_effect_loc: "\n@warning_icon!#X Cela déclenchera la $latria_papal_scandal_depose_war$ :#!\n[GetScriptedGui('latria_papal_secret_war_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_decision_war_attackers_tt: "Les [rulers|E] indépendants de votre [rite|E] et les [vassals|E] qui ne vous soutiennent pas pleinement peuvent rejoindre la coalition visant à vous déposer."
 latria_decision_paramour_defense_tt: "Si la personne avec qui vous entretenez cette liaison est un [ruler|E], elle peut rejoindre les défenseurs."
 latria_decision_allies_call_tt: "Vos [allies|E] peuvent répondre à votre appel et rejoindre les défenseurs."
 latria_decision_forced_defenders_tt: "Vos [rulers|E] fantoches et les souverains indépendants de votre [rite|E] dont le [piety_level|E] est $piety_level_0$ peuvent rejoindre les défenseurs."
 latria_decision_disgraced_defenders_tt: "Les personnages de votre [rite|E] possédant le [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] ou [GetTrait('fornicator').GetName(GetNullCharacter)] et commandant des troupes peuvent rejoindre les défenseurs."
 latria_decision_hook_defenders_tt: "Vos [hooks|E] peuvent être dépensés pour rallier des personnages de votre [rite|E] à la défense."

 latria_decision_if_win_effect_loc: "\n#high #bold Si vous gagnez la guerre :#!#!\n[GetScriptedGui('latria_papal_secret_victory_preview').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 latria_papal_scandal_reparations_global: "Les [rulers|E] attaquants vaincus versent des réparations en [gold|E] et en [prestige|E] selon leur [title_tier|E]."
 latria_papal_scandal_reparations_first: "Les [rulers|E] attaquants vaincus vous versent de l’[gold|E] et du [prestige|E] selon leur [title_tier|E]."
 latria_papal_scandal_reparations_third: "Les [rulers|E] attaquants vaincus versent de l’[gold|E] et du [prestige|E] à [CHARACTER.GetShortUIName] selon leur [title_tier|E]."
 latria_papal_scandal_ally_share_tt: "Les [allies|E] participant à la défense se partagent [SCOPE.ScriptValue('latria_papal_scandal_ally_share_fraction')|0%] du total des réparations en [gold|E] et en [prestige|E]."
 latria_papal_redemption_unlocked_tt: "Débloque l’[interaction|E] $latria_papal_redemption_or_ruin$."

 latria_decision_if_lose_effect_loc: "\n#high #bold Si vous perdez la guerre :#!#!"
 latria_decision_defeat_imprison_tt: "Le chef de la coalition vous emprisonnera dans son [dungeon|E]."
 latria_decision_if_white_peace_effect_loc: "\n#high #bold Si la guerre se termine par une paix blanche :#!#!"

 latria_papal_scandal_depose_war: "Guerre de déposition du pape"
 latria_papal_scandal_event_troops: "Renforts pontificaux"
 LATRIA_PAPAL_SCANDAL_DEPOSE_CB_NAME: "Déposer le pape"
 LATRIA_PAPAL_SCANDAL_DEPOSE_WAR_NAME: "Guerre pour déposer [DEFENDER.GetShortUINameNotMe]"
 latria_papal_scandal_depose_war_victory_desc_defender: "Vous perdez votre fonction de [head_of_faith|E]."
 latria_papal_scandal_depose_war_victory_desc: "[defender.GetShortUINameNotMe|U] perd sa fonction de [head_of_faith|E]."
 latria_papal_scandal_depose_war_white_peace_desc: "Les deux camps font la paix et conservent leurs [titles|E]."
 latria_papal_scandal_depose_war_defeat_desc_defender: "Vous battez la coalition et restez [head_of_faith|E]."
 latria_papal_scandal_depose_war_defeat_desc: "[defender.GetShortUINameNotMe|U] bat la coalition et reste [head_of_faith|E]."

 latria_papal_ascendancy.0010.t: "Appel à défendre le Saint-Siège"
 latria_papal_ascendancy.0010.desc: "Votre [ally|E], [latria_pope.GetShortUIName], affronte une coalition qui cherche à [latria_pope.GetHerHim] déposer à cause d’une liaison adultère. Au nom de votre alliance, [latria_pope.GetSheHe] vous demande de marcher contre la coalition."
 latria_papal_ascendancy.0010.a: "Honorer l’alliance sacrée et marcher"
 latria_papal_ascendancy.0010.b: "Nous ne pouvons combattre pour un tel scandale"
 latria_honored_papal_alliance_opinion: "A défendu le Saint-Siège"
 latria_refused_papal_alliance_opinion: "A trahi l’alliance papale"
 latria_ally_share_received_msg_title: "La gratitude du Saint-Siège"
 latria_ally_share_received_msg_desc: "[latria_papal_victor.GetShortUIName] vous a envoyé une part des réparations des souverains vaincus."
 latria_ally_joined_defense_msg_title: "Un allié rejoint la défense"
 latria_ally_joined_defense_msg_desc: "[ROOT.Char.GetShortUIName] a honoré votre alliance et rejoint votre défense contre la coalition."
 latria_ally_refused_defense_msg_title: "Un allié refuse l’appel"
 latria_ally_refused_defense_msg_desc: "[ROOT.Char.GetShortUIName] a refusé votre appel à défendre le Saint-Siège."

 latria_papal_scandal_war.0001.t: "Un appel à déposer le pape"
 latria_papal_scandal_war.0001.desc: "Des souverains ont pris les armes pour déposer [latria_scandal_target.GetShortUIName] après la révélation de sa liaison adultère. Leurs émissaires arrivent à ma cour pour me demander de marcher avec la coalition."
 latria_papal_scandal_war.0001.a: "Prendre les armes avec la coalition"
 latria_papal_scandal_war.0001.b: "Rester à l’écart de cette guerre"
