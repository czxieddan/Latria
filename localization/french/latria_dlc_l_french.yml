l_french:
 dlc_latria: "Latria"
 dlc_latria_desc: "La coutume ne dicte plus qui vous pouvez désirer. Plus la passion est contenue, plus elle brûle. Une lampe solitaire, une lettre jamais envoyée, et c’est une longue nuit sans sommeil. Un plaisir fugace apaise parfois le cœur, et parfois laisse une blessure que les années n’effacent pas. Dans Latria, la chair et l’esprit peuvent trouver le salut ou la destruction."
