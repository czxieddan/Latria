 latria_act.0401.t: "Une nuit agitée"
 latria_act.0401.desc: "Le silence emplit la chambre, et je suis seul éveillé. Le désir que j’avais écarté revient de lui-même, chaud contre mon dos. La bougie baisse; l’air s’épaissit sous les rideaux du lit.\n\nJe compte mes souffles, perds le compte et le reprends. Les petites tâches du jour remontent une à une; dessous demeure le même désir sans remède.\n\nPlus la chambre se tait, plus il se fait clair. Cette nuit encore me trouvera éveillé, à écouter le bois du lit jusqu’à l’aube."
 latria_act.0401.a: "Me retourner sous les couvertures"
 latria_act.0402.t: "Sans répit"
 latria_act.0402.desc: "À mi-chemin de l’oraison du matin, le même désir se glisse entre les mots. Je m’arrête et recompte mes souffles; quand ils s’apaisent, il est encore là.\n\nLe chant traverse la nef. Mes lèvres suivent, mais les versets ne tiennent pas; de part et d’autre, les têtes restent baissées. Le désir pèse sur ma poitrine, un peu plus lourd à chaque instant.\n\nQuand l’encens s’éteint, je referme le livre, sachant qu’il reviendra avec la nuit."
 latria_act.0402.a: "Reprendre mes esprits"
 latria_act.0403.t: "Désir réprimé"
 latria_act.0403.desc: "La retenue n’a plus rien de la patience. Elle monte dans ma poitrine et écarte chaque pensée paisible.\n\nL’ouvrage passe l’un après l’autre entre mes mains, et mes pensées reviennent au même endroit. La flamme vacille; la chaleur remonte. Je pose l’ouvrage et attends qu’elle passe; elle s’attarde chaque fois un peu plus.\n\nDes nuits comme celle-ci, je n’en endurerai guère d’autres."
 latria_act.0403.a: "Endurer"
 latria_act.0404.t: "Au bord de la rupture"
 latria_act.0404.desc: "Le sommeil ne vient pas; l’oraison ne le tient pas; le travail du jour ne le chasse pas. La nuit, il fait le plus de vacarme; le jour, il guette chaque pause.\n\nVers le soir, j’espère un coup à la porte, ne fût-ce qu’un mot de salutation. La porte s’ouvre; ce n’est qu’un serviteur avec de l’eau, qui pose le bol et se retire.\n\nUne fois la porte refermée, la chambre est plus silencieuse qu’avant."
 latria_act.0404.a: "Tenir bon"
 latria_act.0405.t: "Un poids trop lourd"
 latria_act.0405.desc: "Je ne veux plus tenir. Le jour, la chaleur s’attarde dans ma poitrine et l’ouvrage le plus familier n’écoute plus mes mains.\n\nLa nuit, le sommeil me fuit; je reste les yeux ouverts à écouter la bougie se consumer. La chaleur pèse sur ma poitrine et ne s’en va pas.\n\nJe n’en vois pas la fin."
 latria_act.0405.a: "Inspirer profondément"
 latria_sexual_frustration_collapse_warning_tt: "Je ne tiendrai plus très longtemps…"
 latria_act.0405.b: "Supporter cela"
