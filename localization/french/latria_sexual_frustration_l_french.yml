 latria_daily_sexual_frustration_gain_chaste: "[GetTrait('chaste').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_temperate: "[GetTrait('temperate').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_gluttonous: "[GetTrait('gluttonous').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_impatient: "[GetTrait('impatient').GetName( GetPlayer )]"
 latria_daily_sexual_frustration_gain_too_early: "Trop tôt"
 latria_daily_sexual_frustration_gain_no_longer: "Désir désormais libre"

 latria_act.0401.t: "Une nuit agitée"
 latria_act.0401.desc: "Le sommeil tarde à venir. Le désir que j’avais écarté revient dès que le silence règne dans la chambre."
 latria_act.0401.a: "Me retourner sous les couvertures"
 latria_act.0402.t: "Sans répit"
 latria_act.0402.desc: "La moindre distraction cède la place au même désir inassouvi."
 latria_act.0402.a: "Reprendre mes esprits"
 latria_act.0403.t: "Désir réprimé"
 latria_act.0403.desc: "La retenue n’a plus rien de la patience. Elle pèse sur chacune de mes pensées paisibles."
 latria_act.0403.a: "Endurer"
 latria_act.0404.t: "Au bord de la rupture"
 latria_act.0404.desc: "Ni le sommeil, ni la prière, ni le travail ne m’apaisent. Ce tourment me suit partout."
 latria_act.0404.a: "Tenir bon"
 latria_act.0405.t: "Un poids trop lourd"
 latria_act.0405.desc: "Le désir inassouvi a englouti toutes mes autres pensées. Une autre nuit s’est écoulée sans sommeil, et même les tâches familières me coûtent. Je n’en vois pas la fin."
 latria_act.0405.a: "Inspirer profondément"
 latria_sexual_frustration_collapse_warning_tt: "Je ne tiendrai plus très longtemps…"
 latria_act.0405.b: "Supporter cela"
