 game_concept_latria_sexual_repression_level_desc: "Lorsque [latria_sexual_repression|E] atteint [latria_sexual_repression_threshold|E], le [latria_sexual_repression_level|E] augmente. Chaque niveau applique le modificateur de personnage correspondant."
