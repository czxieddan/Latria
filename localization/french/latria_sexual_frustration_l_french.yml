 game_concept_latria_sexual_repression: "Refoulement"
 game_concept_latria_sexual_repression_desc: "Le refoulement mesure le désir sexuel inassouvi d’un personnage. Il augmente avec le temps et diminue lorsque le personnage trouve un apaisement charnel."
 game_concept_latria_sexual_repression_level: "Niveau de refoulement"
 game_concept_latria_sexual_repression_level_desc: "Les niveaux de [latria_sexual_repression|E] augmentent à #V 20#!, #V 50#!, #V 100#!, #V 180#! et #V 300#! de refoulement. Chaque niveau applique le modificateur de personnage correspondant."

 latria_daily_sexual_frustration_gain_base: "Gain de base"
 latria_daily_sexual_frustration_gain_prime_age: "Force de l’âge"
 latria_daily_sexual_frustration_gain_senior_age: "Vieillesse"
