 latria_solo_relief_interaction: "Caresse solitaire"
 latria_solo_relief_interaction_desc: "Les plaisirs de la chair, en solitaire."
 latria_solo_relief_send: "Commencer"
 latria_solo_relief_night_tt: "Vous espérez passer la nuit en solitaire."
 latria_act.0201.t: "La chambre intérieure"
 latria_act.0201.desc: "J’attends que la pièce voisine se vide, et que la dernière lampe qui passe soit partie, avant de tirer moi-même le verrou. Après la disparition des voix, seule la mèche crépite de temps à autre.\n\nMes vêtements reposent sur la chaise. Je baisse la lampe jusqu’à ne laisser que la bougie près du lit, puis je reste longtemps dans des draps où il n’y a personne d’autre. La nuit n’est pas courte. Certains désirs arrivent clairement et repartent lentement, comme l’eau qui passe sur la même pierre, se retire, puis revient doucement.\n\nLorsque ma respiration se calme enfin, le jour est à la fenêtre. J’écoute mon cœur, puis la chambre vide, avant de me rappeler qu’il faut lisser le lit et donner à cette nuit l’apparence de n’avoir jamais eu lieu."
 latria_act.0201.a: "Me rhabiller et ouvrir le verrou."

 latria_act.0301.t: "Les limites du corps"
 latria_act.0301.desc.illness: "La nuit n’est pas tout à fait passée, mais le malaise arrive avant le matin.\n\nJe veux me redresser. La chaleur monte pourtant à mon front. Mes membres semblent avoir été échangés contre ceux d’un autre : j’essaie deux fois, et ils me refusent encore. Les draps sont lourds et chauds, et même mon souffle a une douceur sèche. Je veux appeler la personne dehors, mais le son n’atteint que mes lèvres.\n\nLa lumière se rassemble lentement à la fenêtre. Je la regarde franchir le cadre, en espérant que la fièvre parte vite et en doutant qu’elle soit si docile."
 latria_act.0301.desc.stress: "Mon corps s’est arrêté, et j’ai retiré mes mains des draps, mais mes pensées ne se sont pas arrêtées.\n\nJe reste éveillé et reviens plusieurs fois sur la nuit. Où mon souffle s’est troublé, quelle phrase n’aurait jamais dû être dite, où je me suis poussé trop loin : tout demeure clair. Au-delà des rideaux du lit, la pièce est silencieuse, et ce silence ne rend les pensées que plus bruyantes. Même l’appel lointain du veilleur semble les compter.\n\nJe me tourne, puis je me retourne. Près de l’aube, l’oreiller a déjà changé plusieurs fois de sens, et je ne dors toujours pas."
 latria_act.0301.desc.health: "Je veux me lever pour prendre une coupe d’eau. Dès que mon pied touche le sol, la pièce s’assombrit.\n\nJe m’agrippe au bord du lit et pose le front contre ma propre main. Mon cœur bat vite et à vide, comme si j’avais couru longtemps, alors que je me suis seulement relevé de l’oreiller. La coupe n’est qu’à quelques pas, et tout dans la pièce est resté à sa place. Mon corps semble avoir atteint son terme.\n\nIl me faut un moment avant que l’obscurité se retire. Je ne vais finalement pas chercher l’eau. Je me recouche seulement."
 latria_act.0301.a: "M’étendre et ne plus penser à rien."
 latria_act.0311.t: "Un long épuisement"
 latria_act.0311.desc.illness: "Cela n’est pas tombé sur moi en une seule nuit.\n\nCes nuits excessives étaient dispersées, et je croyais toujours qu’un sommeil et un repas chaud suffiraient à les payer. Ce matin, la chaleur se répand de ma poitrine jusqu’à mes doigts, et je comprends qu’elles s’étaient rejointes depuis longtemps. L’eau n’apaise pas la sécheresse. Les couvertures ne me réchauffent pas. Même le vent à la fenêtre semble traverser mes os.\n\nJe reste étendu à écouter les gens passer dehors, et je dois même ménager la force nécessaire pour appeler quelqu’un. La maladie n’a pas fait irruption. Elle a peu à peu pris demeure en moi."
 latria_act.0311.desc.stress: "La fatigue n’est pas dans mes membres. Elle pèse sur mon sommeil et ne me laisse pas y entrer.\n\nJe ferme les yeux, et les visages du jour, les souffles de la nuit et les instants que je n’ai pas eu le temps de regretter se pressent ensemble. Mon corps est trop épuisé pour lever une main, mais mon esprit reste allumé, assez vivement pour me lasser. Je compte mes souffles et les veilles au-delà de la fenêtre. Rien ne peut assombrir ces images.\n\nLe coq a chanté et le jour est venu. Je ne fais que passer d’un côté de l’oreiller à l’autre, toujours éveillé."
 latria_act.0311.desc.infertile: "D’abord, ce fut un signe qui n’arrivait pas. Je n’y prêtai pas attention, puis il y eut beaucoup de jours semblables.\n\nJ’ai compté les jours qui auraient dû venir et je n’ai pas voulu en parler, de peur que les dire les rende vrais. Aujourd’hui, le médecin place enfin devant moi ce que je contournais sans cesse : mon corps ne peut plus concevoir d’enfant. Sa voix n’est pas forte, mais rien d’autre dans la pièce ne peut la couvrir.\n\nAprès son départ, je pose une main sur mon ventre. Longtemps passe avant que je laisse vraiment ces mots se poser."
 latria_act.0311.desc.health: "Autrefois, j’aurais pu appeler cette faiblesse la conséquence d’un coucher trop tardif et la faire passer avec une coupe de vin chaud et une demi-journée de calme.\n\nÀ présent, même pour m’asseoir, je dois m’arrêter au bord du lit. Une ceinture semble plus lourde qu’avant, et une coupe aussi. La distance de la fenêtre à la porte paraît plus longue qu’elle ne l’est. Ce n’est qu’en voyant mon visage dans le miroir que je crois cette dette impossible à payer par une nuit ou deux de repos. La personne dans le verre me regarde comme si elle l’avait su avant moi.\n\nJe me recouche. Cette fois, mon corps décide avant moi."
 latria_act.0311.a: "Laisser là les affaires du jour et garder le lit."
 latria_act_exhausted_health: "Épuisement"
 latria_act_exhausted_health_desc: "Le corps n’a pas encore récupéré."
