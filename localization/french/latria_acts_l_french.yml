 latria_act.0311.desc.illness: "Une longue débauche a fini par vous briser, et la maladie se répand en vous."
 latria_act.0311.desc.stress: "La fatigue accumulée vous empêche de dormir."
 latria_act.0311.desc.infertile: "Votre corps ne peut plus engendrer d’enfant."
