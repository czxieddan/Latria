 latria_wedding_night.t: "La nuit de noces"
 latria_wedding_night.desc: "Les invités qui ont accompagné les nouveaux époux jusqu’à leur chambre se sont enfin dispersés. Les rires demeurent dans le couloir, mais la porte est close et laisse dehors les politesses, les bénédictions et le vin du jour, qui semblait ne jamais finir.\n\nLa lampe réchauffe les rideaux. Le lit est fraîchement fait, les vêtements viennent d’être changés, et même la façon dont ils se regardent reste un peu étrangère. [latria_actor.GetShortUIName] et [latria_partner.GetShortUIName] restent un moment face à face. Aucun ne se hâte de parler le premier. Ils écoutent seulement les gens au-delà de la porte s’éloigner peu à peu.\n\nAprès cette nuit, ils ne seront plus seulement les nouveaux mariés dont parlaient leurs invités."

 latria_serene_mind: "Fraîcheur et sérénité"
 latria_serene_mind_desc: "Une rencontre intime profondément satisfaisante revigore le corps et l’esprit."
