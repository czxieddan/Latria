 death_latria_intercourse_strain: "a succombé aux plaisirs charnels"
 death_latria_manual_strain: "a succombé à une caresse charnelle"

 latria_act.0101.t: "Derrière la porte"
 latria_act.0101.desc: "Quand la porte se referme, on parle encore à voix basse dans le couloir. Les pas s’éloignent, et la ligne de lumière dans l’entrebâillement se rétrécit avec eux. Alors seulement je me retourne et vois [latria_partner.GetShortUIName], qui a déjà pris place au bord du lit, ses vêtements encore sur le bras, comme oubliés après son entrée.\n\nLa lampe a été baissée. Nous ne songeons pas à reprendre ce qui repose sur la chaise, mais les draps deviennent bientôt tièdes. La nuit passe assez lentement pour que j’entende chaque petit crépitement de la mèche. Lorsque je regarde de nouveau la fenêtre, le jour est là et la moitié extérieure du lit a refroidi.\n\nUn serviteur frappe deux fois et s’arrête, comme s’il n’était pas sûr que l’on puisse déjà nous déranger. Alors seulement, je me rappelle tout ce que la journée attend déjà de moi."
 latria_act.0101.desc.adultery: "J’écoute longtemps à la porte. Les voix du couloir s’éteignent, et même le serviteur s’éloigne avec une lampe vide, avant que j’entrouvre et laisse [latria_partner.GetShortUIName] se glisser de côté. Le verrou ne fait qu’un petit bruit. Cette nuit, il semble durer longtemps.\n\nNous parlons bas. Plus d’une fois, des pas passent dehors et nous nous figeons, retenant jusqu’à notre souffle, jusqu’à ce qu’ils s’éloignent. La lampe éclaire les rideaux et nos yeux chaque fois qu’ils se tournent vers l’entrebâillement.\n\nAu moment de partir, [latria_partner.GetSheHe] se retourne vers moi depuis le seuil. Inutile de le répéter. Personne d’autre ne doit entendre parler de cette nuit."
 latria_act.0101.desc.dead: "Je crois d’abord que [latria_partner.GetShortUIName] dort seulement d’un sommeil profond. Je prononce son nom tout près de l’oreille, puis je place la lampe près de son visage. La flamme bondit et montre encore des yeux qui ne répondent pas.\n\nJe pose la main sur sa poitrine. Le silence sous ma paume m’effraie. Les draps gardent la chaleur d’un instant plus tôt, l’oreiller conserve son creux, mais le souffle a disparu. Je garde sa main dans la mienne tandis qu’elle refroidit, comme si je pouvais encore lui rendre la vie.\n\nEnfin j’ouvre brusquement la porte et j’appelle un médecin. Ma voix heurte le couloir et revient, sans plus me ressembler."
 latria_act.0101.desc.adultery_dead: "Je croyais que le pire, cette nuit, serait que quelqu’un ouvre la porte sur deux personnes qui n’auraient pas dû être vues ensemble.\n\n[latria_partner.GetShortUIName] s’effondre pourtant avant que cela n’arrive. J’appelle, je secoue, je tiens la lampe devant son visage. Les yeux ne s’ouvrent pas. Aucun souffle ne bouge aux lèvres. La main encore tiède il y a un instant refroidit peu à peu dans la mienne.\n\nDes pas résonnent dehors. Je regarde le lit défait, les vêtements qui n’ont pas été remis, et quelqu’un qui ne se réveillera plus. Quand cette porte s’ouvrira, je n’aurai même pas une phrase prête à dire."
 latria_act.0101.desc.actor_dissatisfied: "La nuit est encore profonde lorsque je me redresse et ramène ma manche sur mon bras.\n\n[latria_partner.GetShortUIName] se tourne sous les couvertures, comme s’il restait quelque chose à dire, et touche légèrement mon poignet. Je ne sens que la longueur et le vide de ces heures. Je n’ai même plus envie de [Select_CString(latria_partner.IsFemale, 'la', 'le')] toucher. Une étincelle crépite dans la lampe, sans réchauffer la pièce.\n\nJe prends mes vêtements sur la chaise sans me retourner. Certaines rencontres donnent d’autant plus envie du couloir qu’on les laisse durer."
 latria_act.0101.desc.partner_dissatisfied: "En arrivant, [latria_partner.GetShortUIName] avait marqué un arrêt sur le seuil, regardant d’abord la lampe, puis moi, comme à regret de laisser la nuit commencer tout de suite.\n\nLe départ est bien plus rapide. La ceinture n’est pas encore nouée que [latria_partner.GetSheHe] quitte déjà le lit, évitant mon regard et mes mains. Je prononce son nom. [latria_partner.GetSheHe|U] répond une fois, sans laisser d’adieu. Quand la porte se referme, le courant d’air incline la flamme.\n\nLa pièce garde encore sa présence. Le bord du lit a déjà refroidi, comme si personne n’y avait pris place."
 latria_act.0101.desc.manual: "Nous n’allons pas jusqu’au lit.\n\n[latria_partner.GetShortUIName] s’assied près de moi et commence à parler des affaires inachevées du jour, puis s’interrompt au milieu d’une phrase. Les baisers restent légers, et les caresses demeurent sur une manche ou dans les cheveux. L’appel d’un veilleur passe sous la fenêtre. Nous n’y prêtons pas attention.\n\nEnfin l’huile de la lampe s’épuise. Nous restons encore un peu dans l’obscurité, écoutant nos souffles devenir réguliers, avant de rajuster nos manches. Pour cette nuit, cela suffit."
 latria_act.0101.a: "Ouvrir la porte et revenir au jour."
 latria_act.0102.desc: "Je pourrais rappeler à [latria_actor.GetShortUIName] combien il est tard, et que des gens attendront demain. Les mots arrivent à mes lèvres et n’en sortent pas.\n\nUne fois la porte close, les pas et les voix s’éloignent. La lampe réchauffe les rideaux, et nous ne nous pressons pas de nous lever. J’écoute le souffle de [latria_actor.GetShortUIName] passer du désordre au calme, et j’oublie moi aussi l’heure. Lorsque je regarde de nouveau vers la fenêtre, le jour est là. Les serviteurs dehors attendent sans doute depuis longtemps.\n\nAlors seulement, je lâche sa main. Certaines nuits ne devraient pas être précipitées vers leur fin."
 latria_act.0102.desc.adultery: "Lorsque [latria_actor.GetShortUIName] se prépare à partir, je vais jusqu’à la porte et pose l’oreille contre le bois.\n\nLe couloir reste vide un moment. Puis quelqu’un passe avec une lampe. Sa lumière traverse lentement la fente, puis s’éloigne lentement. Nous ne disons rien et ne laissons pas même nos vêtements faire de bruit. Quand le silence revient, [latria_actor.GetSheHe] rajuste ses vêtements.\n\nJ’ouvre juste assez pour [Select_CString(latria_actor.IsFemale, 'qu’elle', 'qu’il')] puisse passer de côté. Cette nuit du moins, le secret n’appartient encore qu’à nous deux."
 latria_act.0102.desc.partner_dissatisfied: "Avant que la porte ne se ferme, j’imaginais encore ce que pourrait être cette nuit. J’avais même rendu la lampe plus chaude à l’avance.\n\nUne fois qu’il n’y a vraiment plus que nous, cette attente se refroidit. Les mains de [latria_actor.GetShortUIName], son souffle et chaque proximité qui aurait dû me retenir semblent m’atteindre à travers quelque chose. Je réponds, mais mes yeux reviennent vers la porte et mes pensées vers le couloir.\n\nFinalement, je me redresse avant [latria_actor.GetShortUIName] et rajuste ma manche. Cette nuit ne valait pas le temps que j’avais passé à l’attendre."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] se lève sans me laisser rallumer la lampe. Il ne reste qu’un peu de lumière pâle près de la fenêtre.\n\nJe suis encore au lit, cherchant une phrase qui empêcherait la nuit de se briser si net. [latria_actor.GetSheHe|U] détourne le visage, prononce deux phrases distraites et noue déjà une ceinture, sans prendre les vêtements que je tends. Mes mots ne sont pas achevés lorsque [latria_actor.GetSheHe] se dirige vers la porte.\n\nL’air froid entre par la porte qui s’ouvre. Certaines déceptions n’ont pas besoin d’explication."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] ne m’entraîne pas vers le lit, mais s’assied près de moi et écarte le coussin placé entre nous.\n\nLes affaires inachevées du jour semblent soudain pouvoir attendre. Nous échangeons des baisers et quelques phrases qu’il n’est pas nécessaire de terminer. Les mains s’attardent sur une manche ou dans les cheveux, sans aller plus loin. Au-delà de la fenêtre, il fait encore nuit, et l’appel du veilleur est encore loin.\n\nAu moment de nous quitter, [latria_actor.GetSheHe] lisse le pli que j’ai moi-même dérangé dans mes vêtements. La nuit est courte, mais elle ne laisse pas le sentiment qu’il y manque quelque chose."

 latria_scheme.0010.t: "L’acte charnel"
 latria_scheme.0010.t_line: "[ROOT.Custom('LatriaSchemeBondTitle')]"
 latria_scheme.0010.t.spouse: "Mon [spouse|E]"
 latria_scheme.0010.t.concubine: "Mon [concubine|E]"
 latria_scheme.0010.t.soulmate: "Mon [soulmate|E]"
 latria_scheme.0010.t.lover: "Mon [lover|E]"
 latria_scheme.0010.t.adultery: "Une liaison adultère"
 latria_scheme.0010.desc: "Les bougies brûlent encore, mais [target.GetShortUIName] ne me répond plus.\n\nJe prononce son nom, puis j’approche l’oreille de ses lèvres. Il n’y a rien. La peau sous mes doigts est plus froide qu’il y a un instant, alors que notre chaleur demeure dans les draps. Sa main glisse hors de la mienne et n’y revient pas.\n\nJe comptais faire disparaître les coupes, les vêtements et toute trace de cette nuit avant le jour. À présent, il ne reste près de moi que quelqu’un qui ne bougera plus. La fenêtre pâlit, et je ne sais pas ce que je dois dissimuler en premier."
 latria_scheme.0010.a: "Ramener la couverture sur [Select_CString(target.IsFemale, 'elle', 'lui')], puis ouvrir la porte."
 latria_scheme.0020.t: "Une nuit d’attente"
 latria_scheme.0020.desc: "La lampe a baissé, et je n’entends toujours pas [target.GetFirstName] derrière la porte.\n\nJe réchauffe le vin deux fois et replie encore les vêtements sur la chaise. Par moments, quelqu’un traverse le couloir. Quand les pas approchent, je retiens mon souffle. Quand ils s’éloignent, il ne reste que moi. Chaque fois, je crois que c’est [Select_CString(target.IsFemale, 'elle', 'lui')].\n\nEnfin la bougie vacille et la cire tombe dans le plateau. Alors seulement, j’admets que la nuit est finie. Le vin, les mots et l’excuse que j’avais préparés ne serviront pas."
 latria_scheme.0020.a: "Éteindre la lumière. Inutile d’attendre."
 latria_scheme.0030.t: "Une nouvelle trop tardive"
 latria_scheme.0030.desc: "Je pèse encore quelle porte latérale serait la plus discrète, et quelle invitation éveillerait le moins de soupçons, lorsque la nouvelle est posée sur ma table.\n\n[target.GetFirstName] a déjà quitté ce monde. Le papier contient peu de mots. Je les lis longtemps. Les lettres jamais envoyées, les couloirs appris par cœur, l’excuse préparée pour cette seule nuit : tout cela devient soudain inutile.\n\nJe verse le vin encore chaud. Certains arrangements peuvent attendre une meilleure nuit. Aucun ne peut rattraper une mort déjà survenue."
 latria_scheme.0030.a: "Brûler la lettre que je n’ai pas envoyée."
 latria_scheme.0040.t: "Un fil rompu"
 latria_scheme.0040.desc: "J’envoie quelqu’un chercher [target.GetFirstName] et j’attends de l’après-midi jusqu’à l’allumage des lampes. On ne me rapporte qu’une réponse vague : [target.GetSheHe] est désormais hors d’atteinte.\n\nPeut-être une porte est-elle surveillée de plus près. Peut-être un regard est-il devenu méfiant. Ou peut-être [Select_CString(target.IsFemale, 'refuse-t-elle', 'refuse-t-il')] simplement de s’approcher de la lumière que j’ai laissée brûler pour [Select_CString(target.IsFemale, 'elle', 'lui')]. Je demande deux fois. Le messager n’en sait pas davantage.\n\nLa raison n’importe plus. Le fil s’est rompu entre mes doigts. Je froisse le papier où j’avais noté l’heure, jusqu’à ce que la sueur en efface les traits."
 latria_scheme.0040.a: "Cela s’arrête ici."

