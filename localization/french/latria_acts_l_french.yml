 latria_act.0101.t: "Derrière la porte"
 latria_act.0101.desc: "La porte se ferme et les pas s’éloignent dans le couloir. [latria_partner.GetShortUIName] et moi restons ensemble jusqu’au jour.\n\nSeul le domestique frappant à la porte me rappelle les affaires du jour."
 latria_act.0101.desc.adultery: "J’attends que le couloir soit désert avant de laisser entrer [latria_partner.GetShortUIName].\n\nAvant de nous quitter, nous convenons d’une chose : personne ne doit entendre parler de cette nuit."
 latria_act.0101.desc.dead: "J’appelle [latria_partner.GetShortUINamePossessive] par son nom, puis encore une fois. Aucune réponse, pas le moindre souffle.\n\nJ’ouvre la porte à la volée et crie qu’on aille chercher un médecin."
 latria_act.0101.desc.adultery_dead: "Je croyais que le pire serait de nous faire surprendre, jusqu’à ce que [latria_partner.GetShortUIName] s’effondre sans se réveiller.\n\nDes pas approchent dehors. Comment vais-je expliquer cela ?"
 latria_act.0101.desc.actor_dissatisfied: "Je me lève alors qu’il fait encore nuit. [latria_partner.GetShortUIName] semble sur le point de parler, mais j’en ai assez de cette rencontre décevante."
 latria_act.0101.desc.partner_dissatisfied: "[latria_partner.GetShortUIName] repart bien plus vite qu’à son arrivée. [latria_partner.GetSheHe|U] évite mon regard et s’en va sans un mot d’adieu."
 latria_act.0101.desc.manual: "[latria_partner.GetShortUIName] et moi trouvons un endroit tranquille, où baisers et caresses nous suffisent. Nous oublions tous deux l’heure."
 latria_act.0101.a: "Partir"
 latria_act.0102.desc: "Je ne demande pas à [latria_actor.GetShortUIName] de partir. Une fois la porte fermée, la nuit est à nous.\n\nAu matin, les domestiques attendent dehors depuis un bon moment."
 latria_act.0102.desc.adultery: "Avant le départ de [latria_actor.GetShortUIName], j’écoute à la porte.\n\nLe couloir est désert. Pour cette nuit du moins, notre secret nous appartient encore."
 latria_act.0102.desc.partner_dissatisfied: "J’attendais avec impatience de me retrouver en tête à tête avec [latria_actor.GetShortUIName]. Maintenant, je ne souhaite que partir. Cette nuit ne valait guère toute cette attente."
 latria_act.0102.desc.actor_dissatisfied: "[latria_actor.GetShortUIName] se lève, visiblement à bout de patience. J’essaie de parler, mais [latria_actor.GetSheHe] ne répond que par quelques mots secs avant de se diriger vers la porte."
 latria_act.0102.desc.manual: "[latria_actor.GetShortUIName] s’assied à mes côtés, et nous mettons un temps nos devoirs de côté, ne nous demandant rien de plus que des baisers et des caresses.\n\nIl fait encore nuit lorsque nous nous quittons."

