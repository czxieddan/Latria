 LATRIA_CHARMING_ABDUCTION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] tombera dans votre piège et deviendra votre [prisoner|E]."
 LATRIA_CHARMING_ABDUCTION_DISCOVERY_DESC: "[TARGET_CHARACTER.GetShortUIName|U] découvrira ce qui se cache derrière vos tendres promesses."
 latria_charming_abduction_invalidated_title: "Les bougies s’éteignent"
 latria_charming_abduction_i_imprisoned_message: "[target.GetShortUIName|U] est déjà sous ma garde. Il n’est plus nécessaire d’envoyer cette invitation."
 latria_charming_abduction_no_longer_possible: "Cette rencontre ne peut plus être organisée. L’invitation doit être jetée au feu."
