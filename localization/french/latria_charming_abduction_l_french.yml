 latria_charming_abduction.1001.t: "Une promesse sur l’oreiller"
 latria_charming_abduction.1001.desc: "L’eau du bain refroidit, mais son parfum flotte encore dans la chambre. Je pose ma robe près du lit et me tourne vers la lettre ouverte sur la table. Il n’y manque qu’une phrase pour tenir [target.GetFirstName] en éveil.\n\nMes gens connaissent la porte latérale et chaque détour du couloir. Si [target.GetSheHe] renvoie ses domestiques pour la promesse d’une tendre nuit, les lourds rideaux cacheront bien des choses. Quant aux plaisirs que [target.GetSheHe] imagine réservés à [target.Custom('FR_LuiElle')] dans mon lit... d’abord, [target.GetSheHe] doit franchir le seuil."
 latria_charming_abduction.1001.a: "Lui dire que j’attendrai près du lit."
 latria_charming_abduction.1001.b: "[target.GetHerHim|U] convier à boire dans l’antichambre. Vin chaud, lumière tamisée."
 latria_charming_abduction.1001.c: "Sceller la lettre. Une nuit plus propice viendra."
 latria_charming_abduction.1001.d: "Jeter la lettre au feu. Cela s’arrête ici."
 latria_charming_abduction_wait_tt: "Poursuivre les préparatifs et attendre une autre occasion d’agir."

 latria_charming_abduction.1101.t: "Une trace de parfum"
 latria_charming_abduction.1101.desc: "Un ruban de soie accompagne la réponse de [target.GetFirstNamePossessive], noué si lâchement qu’une légère traction suffirait à le défaire. Les mots restent bienséants, mais les dernières lignes se pressent : [target.GetSheHe] avait hâte de finir, tout en rechignant à poser la plume.\n\nJ’enroule le ruban autour d’un doigt. Quel parfum devrait porter ma prochaine lettre ? Et quelles pensées l’accompagneront dans son lit ?"
 latria_charming_abduction.1101.a: "Déposer une goutte de parfum là où je parle de la nuit."
 latria_charming_abduction.1101.b: "Fixer l’heure. Ne pas signer la lettre."
 latria_charming_abduction.1101.c: "Glisser la réponse sous le chandelier. La laisser attendre."

 latria_charming_abduction.1102.t: "Une autre paire d’yeux"
 latria_charming_abduction.1102.desc: "Les habitudes de coucher de [target.GetFirstNamePossessive] s’avèrent plus utiles que ses lettres d’amour. Un domestique reste toujours après le crépuscule, versant le vin et rangeant les vêtements, refusant de partir avant l’extinction de la dernière bougie.\n\nUn seul serviteur fidèle pourrait ruiner un rendez-vous soigneusement préparé. Je dois trouver de quoi occuper ces yeux vigilants."
 latria_charming_abduction.1102.a: "Une bourse d’argent devrait offrir une soirée de distraction au domestique."
 latria_charming_abduction.1102.b: "Ajouter une ligne : venez sans escorte, une surprise vous attend."
 latria_charming_abduction.1102.c: "Retirer l’invitation pour l’instant. Cette porte peut attendre une autre nuit."

 latria_charming_abduction.2001.t: "Quand tombe le verrou"
 latria_charming_abduction.2001.bedchamber: "[target.GetFirstName] entre dans la chambre, son regard encore fixé sur les bougies près du lit. Je tends la main, lui laissant croire qu’un pas de plus suffira pour m’atteindre.\n\nLe verrou claque. [target.GetSheHe|U] se retourne, et les ombres derrière les rideaux se lèvent. Mes gens saisissent ses bras ; une corde glisse d’une manche sans même heurter un chandelier.\n\nJe prends les vêtements sur la chaise. Personne ne partagera cet oreiller cette nuit."
 latria_charming_abduction.2001.antechamber: "[target.GetFirstName] accepte le vin que j’ai versé et se tourne légèrement pour dégager le passage vers la chambre intérieure. [target.GetSheHe|U] s’attend à ce que je prenne sa main pour [target.GetHerHim] mener dans un lieu plus retiré.\n\nAu lieu de cela, je pose ma coupe. La porte latérale s’ouvre et mes gens se précipitent. Lorsque [target.GetSheHe] songe à appeler, le verrou est tiré et les liens serrés.\n\nLe vin sur la table est à peine entamé."
 latria_charming_abduction.2001.secret: "\n\nRien ne bouge dans le couloir. Lorsque la cour remarquera son absence, même la cire des bougies sera froide."
 latria_charming_abduction.2001.exposed: "\n\nUn cri retentit au-delà de la fenêtre. Il semble que l’autre moitié du récit de cette soirée circulera avant l’aube."
 latria_charming_abduction.2001.a: "Apporter son manteau. Il est temps de partir."

 latria_charming_abduction.2002.t: "Une soirée inachevée"
 latria_charming_abduction.2002.bedchamber: "[target.GetFirstName] s’arrête sur le seuil. Les bougies, le lit, même mon silence soigneusement mesuré ne parviennent pas à [target.GetHerHim] faire avancer d’un pas.\n\n\"Il se fait tard.\" Son regard glisse par-dessus mon épaule vers les rideaux immobiles.\n\nMa main tendue ne rencontre que l’air nocturne."
 latria_charming_abduction.2002.antechamber: "[target.GetFirstName] ne touche pas au vin. Un instant, [target.GetSheHe] reste près de la table, comme pour jauger mon sourire, puis recule vers la porte ouverte.\n\n\"Qu’on laisse les lumières allumées. Mes gens m’attendent.\"\n\nLes pas derrière la porte latérale paraissent terriblement bruyants."
 latria_charming_abduction.2002.secret: "\n\nJe baisse la main avant que les hommes cachés ne surgissent. Demain, on rira peut-être de mes avances mal reçues. Personne ne saura ce qui attendait derrière cette porte."
 latria_charming_abduction.2002.exposed: "\n\nUne boucle de corde apparaît. [target.GetFirstNameNoTooltip] recule en criant mon nom tandis que [target.GetSheHe] rejoint ses gardes. Personne n’y verra plus un innocent badinage."
 latria_charming_abduction.2002.a: "Éteindre les bougies. Il n’y aura plus d’invitations."
 latria_charming_abduction.2002.b: "Écrire une nouvelle lettre et attendre une autre occasion."
 latria_charming_abduction_retry_tt: "Préparer à nouveau ce complot, en retirant le modificateur d’approche de cette tentative tout en conservant les préparatifs d’invitation antérieurs."

 latria_charming_abduction.2101.t: "Un tendre piège"
 latria_charming_abduction.2101.bedchamber: "En venant rencontrer [owner.GetFirstName], je me demandais encore comment embrasser sa main. La chambre était faiblement éclairée, juste assez pour faire oublier de regarder derrière les rideaux.\n\nCe n’est que lorsque mes bras furent tordus derrière mon dos que je compris pourquoi [owner.GetSheHe] restait hors de ma portée. Aucune tendresse ne m’attendait ici, seulement une corde."
 latria_charming_abduction.2101.antechamber: "Je suis tombé en captivité chez [owner.GetFirstNamePossessive] avant même de boire une gorgée de vin.\n\n[owner.GetSheHe|U] posa sa coupe comme pour donner un signal convenu. Un instant plus tard, des gens surgirent par la porte latérale et me saisirent les bras. Je gardais les yeux sur [owner.Custom('FR_LuiElle')], attendant une explication. [owner.GetSheHe|U] leur demanda seulement d’aller chercher mon manteau."
 latria_charming_abduction.2101.a: "Détourner les yeux. Je ne [owner.GetHerHim] regarderai pas."

 latria_charming_abduction.2102.t: "Derrière la lueur des bougies"
 latria_charming_abduction.2102.secret: "L’invitation de [owner.GetFirstNamePossessive] était assez tendre, mais [owner.GetSheHe] semblait avoir l’esprit ailleurs lors de notre rencontre. Des pas dans le couloir ; le froissement d’un tissu derrière une porte. Quand je mentionnai mes gardes, son sourire se figea.\n\nJe trouvai une excuse et partis. C’est seulement au milieu de mes gens que je remarquai mes paumes moites. Peut-être n’était-ce qu’un rendez-vous maladroit. Peut-être vaudrait-il mieux ne jamais savoir ce qui se cachait derrière cette porte."
 latria_charming_abduction.2102.exposed: "La vue de cette corde me ramena brutalement à la raison.\n\nLes murmures de [owner.GetFirstNamePossessive], les bougies tamisées, la distance que [owner.GetSheHe] maintenait entre nous : tout visait à me retenir dans cette pièce. Je reculai dans le couloir et appelai mes gardes, regardant les silhouettes derrière la porte se replier dans l’ombre.\n\nJ’avais failli renvoyer tout le monde pour ce sourire."
 latria_charming_abduction.2102.a: "Désormais, quelqu’un attendra devant la porte."

